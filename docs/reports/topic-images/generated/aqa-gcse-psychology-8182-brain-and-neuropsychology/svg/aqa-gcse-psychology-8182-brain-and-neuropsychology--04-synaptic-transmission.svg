<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 728" width="900" height="728" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="728" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Synaptic transmission, step by step</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Schematic, not to scale</text>
<g transform="translate(0,-40)"><path d="M30,214 L250,214 C340,214 380,264 380,324 C380,384 340,434 250,434 L30,434" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><line x1="50" y1="384" x2="160" y2="384" stroke="#b5602e" stroke-width="6" marker-end="url(#ahR)"/><text x="50" y="354" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">electrical impulse</text><circle cx="270" cy="264" r="24" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="262" cy="258" r="3.5" fill="#8a6d0d"/><circle cx="277" cy="256" r="3.5" fill="#8a6d0d"/><circle cx="270" cy="272" r="3.5" fill="#8a6d0d"/><circle cx="261" cy="273" r="3.5" fill="#8a6d0d"/><circle cx="279" cy="270" r="3.5" fill="#8a6d0d"/><circle cx="320" cy="329" r="24" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="312" cy="323" r="3.5" fill="#8a6d0d"/><circle cx="327" cy="321" r="3.5" fill="#8a6d0d"/><circle cx="320" cy="337" r="3.5" fill="#8a6d0d"/><circle cx="311" cy="338" r="3.5" fill="#8a6d0d"/><circle cx="329" cy="335" r="3.5" fill="#8a6d0d"/><circle cx="255" cy="389" r="24" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="247" cy="383" r="3.5" fill="#8a6d0d"/><circle cx="262" cy="381" r="3.5" fill="#8a6d0d"/><circle cx="255" cy="397" r="3.5" fill="#8a6d0d"/><circle cx="246" cy="398" r="3.5" fill="#8a6d0d"/><circle cx="264" cy="395" r="3.5" fill="#8a6d0d"/><circle cx="205" cy="299" r="24" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="197" cy="293" r="3.5" fill="#8a6d0d"/><circle cx="212" cy="291" r="3.5" fill="#8a6d0d"/><circle cx="205" cy="307" r="3.5" fill="#8a6d0d"/><circle cx="196" cy="308" r="3.5" fill="#8a6d0d"/><circle cx="214" cy="305" r="3.5" fill="#8a6d0d"/><circle cx="410" cy="284" r="4.5" fill="#8a6d0d"/><circle cx="425" cy="314" r="4.5" fill="#8a6d0d"/><circle cx="405" cy="339" r="4.5" fill="#8a6d0d"/><circle cx="430" cy="364" r="4.5" fill="#8a6d0d"/><circle cx="415" cy="389" r="4.5" fill="#8a6d0d"/><circle cx="440" cy="299" r="4.5" fill="#8a6d0d"/><path d="M480,194 L480,454 L870,454 L870,194 Z" fill="#f2e7b8" fill-opacity="0.5" stroke="none"/><path d="M480,194 L480,454" stroke="#1e2a44" stroke-width="3"/><path d="M480,250 l-14,0 l0,6 l8,0 l0,16 l-8,0 l0,6 l14,0 Z" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><path d="M480,310 l-14,0 l0,6 l8,0 l0,16 l-8,0 l0,6 l14,0 Z" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><path d="M480,370 l-14,0 l0,6 l8,0 l0,16 l-8,0 l0,6 l14,0 Z" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="458" y="184" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">synapse</text><text x="150" y="464" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">presynaptic neuron (axon terminal)</text><text x="680" y="484" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">postsynaptic neuron</text><line x1="494" y1="310" x2="560" y2="284" stroke="#1e2a44" stroke-width="1.5"/><text x="566" y="288" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">receptors</text><line x1="185" y1="286" x2="140" y2="254" stroke="#1e2a44" stroke-width="1.5"/><text x="60" y="250" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">vesicles</text><circle cx="190" cy="382" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="190" y="388.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><circle cx="425" cy="242" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="425" y="248.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><circle cx="440" cy="424" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="440" y="430.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="590" y="350" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">4</tspan> Excitation makes the next</text><text x="590" y="371" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">neuron <tspan font-weight="700">more</tspan> likely to fire;</text><text x="590" y="392" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">inhibition makes it <tspan font-weight="700">less</tspan> likely.</text></g><line x1="60" y1="492" x2="60" y2="676" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="472" width="766" height="43" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="498.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">An electrical impulse travels down the axon to the axon terminal</text><circle cx="60" cy="493.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="502.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="523" width="766" height="43" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="549.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Neurotransmitters are released from vesicles into the synapse</text><circle cx="60" cy="544.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="553.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="574" width="766" height="43" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="600.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">They cross the gap and bind to receptors on the postsynaptic neuron</text><circle cx="60" cy="595.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="604.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="625" width="766" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="651.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Excitation or inhibition</text><text x="116" y="679.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Whether the next neuron fires depends on the overall balance of signals it receives.</text><circle cx="60" cy="660.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="669.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text>
</svg>