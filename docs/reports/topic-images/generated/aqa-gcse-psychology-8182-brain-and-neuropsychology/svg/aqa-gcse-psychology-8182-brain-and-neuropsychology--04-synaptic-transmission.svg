<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 768" width="900" height="768" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="768" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Synaptic transmission, step by step</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Schematic, not to scale</text>
<path d="M30,214 L250,214 C340,214 380,264 380,324 C380,384 340,434 250,434 L30,434" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><line x1="50" y1="324" x2="170" y2="324" stroke="#b5602e" stroke-width="6" marker-end="url(#ahR)"/><text x="50" y="304" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">electrical impulse</text><circle cx="250" cy="274" r="24" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="242" cy="268" r="3.5" fill="#8a6d0d"/><circle cx="257" cy="266" r="3.5" fill="#8a6d0d"/><circle cx="250" cy="282" r="3.5" fill="#8a6d0d"/><circle cx="241" cy="283" r="3.5" fill="#8a6d0d"/><circle cx="259" cy="280" r="3.5" fill="#8a6d0d"/><circle cx="300" cy="324" r="24" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="292" cy="318" r="3.5" fill="#8a6d0d"/><circle cx="307" cy="316" r="3.5" fill="#8a6d0d"/><circle cx="300" cy="332" r="3.5" fill="#8a6d0d"/><circle cx="291" cy="333" r="3.5" fill="#8a6d0d"/><circle cx="309" cy="330" r="3.5" fill="#8a6d0d"/><circle cx="250" cy="374" r="24" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="242" cy="368" r="3.5" fill="#8a6d0d"/><circle cx="257" cy="366" r="3.5" fill="#8a6d0d"/><circle cx="250" cy="382" r="3.5" fill="#8a6d0d"/><circle cx="241" cy="383" r="3.5" fill="#8a6d0d"/><circle cx="259" cy="380" r="3.5" fill="#8a6d0d"/><circle cx="200" cy="299" r="24" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="192" cy="293" r="3.5" fill="#8a6d0d"/><circle cx="207" cy="291" r="3.5" fill="#8a6d0d"/><circle cx="200" cy="307" r="3.5" fill="#8a6d0d"/><circle cx="191" cy="308" r="3.5" fill="#8a6d0d"/><circle cx="209" cy="305" r="3.5" fill="#8a6d0d"/><circle cx="410" cy="284" r="4.5" fill="#8a6d0d"/><circle cx="425" cy="314" r="4.5" fill="#8a6d0d"/><circle cx="405" cy="339" r="4.5" fill="#8a6d0d"/><circle cx="430" cy="364" r="4.5" fill="#8a6d0d"/><circle cx="415" cy="389" r="4.5" fill="#8a6d0d"/><circle cx="440" cy="299" r="4.5" fill="#8a6d0d"/><path d="M480,194 L480,454 L870,454 L870,194 Z" fill="#ffffff" stroke="none"/><path d="M480,194 L480,454" stroke="#1e2a44" stroke-width="3"/><path d="M480,250 l-14,0 l0,6 l8,0 l0,16 l-8,0 l0,6 l14,0 Z" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><path d="M480,310 l-14,0 l0,6 l8,0 l0,16 l-8,0 l0,6 l14,0 Z" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><path d="M480,370 l-14,0 l0,6 l8,0 l0,16 l-8,0 l0,6 l14,0 Z" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="458" y="184" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">synapse</text><text x="150" y="464" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">presynaptic neuron (axon terminal)</text><text x="680" y="484" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">postsynaptic neuron</text><line x1="494" y1="310" x2="560" y2="284" stroke="#1e2a44" stroke-width="1.5"/><text x="566" y="288" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">receptors</text><line x1="226" y1="274" x2="160" y2="244" stroke="#1e2a44" stroke-width="1.5"/><text x="70" y="240" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">vesicles</text><circle cx="110" cy="354" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="110" y="360.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><circle cx="300" cy="269" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="300" y="275.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><circle cx="440" cy="424" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="440" y="430.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="590" y="350" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">4</tspan> Excitation makes the next</text><text x="590" y="371" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">neuron <tspan font-weight="700">more</tspan> likely to fire;</text><text x="590" y="392" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">inhibition makes it <tspan font-weight="700">less</tspan> likely.</text><line x1="60" y1="532" x2="60" y2="716" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="512" width="766" height="43" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="538.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">An electrical impulse travels down the axon to the axon terminal</text><circle cx="60" cy="533.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="542.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="563" width="766" height="43" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="589.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Neurotransmitters are released from vesicles into the synapse</text><circle cx="60" cy="584.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="593.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="614" width="766" height="43" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="640.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">They cross the gap and bind to receptors on the postsynaptic neuron</text><circle cx="60" cy="635.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="644.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="665" width="766" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="691.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Excitation or inhibition</text><text x="116" y="719.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Whether the next neuron fires depends on the overall balance of signals it receives.</text><circle cx="60" cy="700.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="709.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text>
</svg>