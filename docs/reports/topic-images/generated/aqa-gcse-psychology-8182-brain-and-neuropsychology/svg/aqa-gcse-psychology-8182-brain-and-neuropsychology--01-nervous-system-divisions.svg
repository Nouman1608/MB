<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Divisions of the nervous system</text>

<path d="M450,148 L450,179 L220,179 L220,210" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M450,148 L450,179 L670,179 L670,210" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M670,320 L670,355 L555,355 L555,390" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M670,320 L670,355 L790,355 L790,390" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M790,529 L790,549.5 L690,549.5 L690,570" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M790,529 L790,549.5 L470,549.5 L470,570" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="300" y="100" width="300" height="48" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="128.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Nervous system</text><rect x="50" y="210" width="340" height="110" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="220" y="245.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Central nervous system</text><text x="220" y="274.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Brain and spinal cord: processes</text><text x="220" y="295.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">information and makes decisions</text><rect x="500" y="210" width="340" height="110" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="670" y="245.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Peripheral nervous system</text><text x="670" y="274.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">All other nerves: carries messages</text><text x="670" y="295.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">between the CNS and the body</text><rect x="435" y="390" width="240" height="118" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="555" y="418.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Somatic</text><text x="555" y="447.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Senses and voluntary</text><text x="555" y="468.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">movement (skeletal</text><text x="555" y="489.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">muscles)</text><rect x="710" y="390" width="160" height="139" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="790" y="418.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Autonomic</text><text x="790" y="447.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Involuntary:</text><text x="790" y="468.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">heart rate,</text><text x="790" y="489.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">breathing,</text><text x="790" y="510.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">digestion</text><rect x="590" y="570" width="200" height="86" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="690" y="603.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Sympathetic</text><text x="690" y="632.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Fight or flight</text><rect x="365" y="570" width="210" height="86" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="470" y="603.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Parasympathetic</text><text x="470" y="632.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Rest and digest</text>
</svg>