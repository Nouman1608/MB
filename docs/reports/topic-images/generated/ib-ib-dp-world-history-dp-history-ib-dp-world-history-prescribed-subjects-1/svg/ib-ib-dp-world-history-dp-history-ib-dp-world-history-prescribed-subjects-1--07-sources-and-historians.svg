<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 664" width="900" height="664" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="664" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who wrote it, for whom, and when?</text>

<rect x="30" y="96" width="270.6666666666667" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="45" y="123" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MONGOL, 13TH CENTURY</text><text x="45" y="149.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The Secret History</text><text x="45" y="177" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">An insider's view of Temüjin's</text><text x="45" y="197" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">early life</text><rect x="314.6666666666667" y="96" width="270.6666666666667" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="329.6666666666667" y="123" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SERVED THE MONGOLS</text><text x="329.6666666666667" y="149.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Juvaini; Rashid al-Din</text><text x="329.6666666666667" y="177" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Detail, but written within the</text><text x="329.6666666666667" y="197" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">empire's patronage</text><rect x="599.3333333333334" y="96" width="270.6666666666667" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="614.3333333333334" y="123" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ARAB CONTEMPORARY</text><text x="614.3333333333334" y="149.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ibn al-Athir</text><text x="614.3333333333334" y="177" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Describes the invasions as a</text><text x="614.3333333333334" y="197" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">catastrophe</text><rect x="30" y="230" width="270.6666666666667" height="120" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="45" y="267" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CHRISTIAN NARRATIVES</text><text x="45" y="293.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Itinerarium; Ambroise</text><text x="45" y="321" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Praise Richard's prowess</text><rect x="314.6666666666667" y="230" width="270.6666666666667" height="120" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="329.6666666666667" y="257" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SALADIN'S ADVISER</text><text x="329.6666666666667" y="283.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Baha al-Din ibn Shaddad</text><text x="329.6666666666667" y="311" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">The Muslim view; often</text><text x="329.6666666666667" y="331" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">respectful of Richard</text><rect x="599.3333333333334" y="230" width="270.6666666666667" height="120" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="614.3333333333334" y="257" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ASK OF EVERY SOURCE</text><text x="614.3333333333334" y="283.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Whom did he serve?</text><text x="614.3333333333334" y="311" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">How long after the events did he</text><text x="614.3333333333334" y="331" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">write?</text><text x="30" y="386" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">HISTORIANS ON RICHARD'S KINGSHIP</text><text x="40" y="414" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Neglectful absentee</text><text x="860" y="414" font-size="17" font-weight="700" fill="#b5602e" text-anchor="end">Capable Angevin ruler</text><defs><linearGradient id="sg398" x1="0" x2="1"><stop offset="0" stop-color="#b5d3cf"/><stop offset="1" stop-color="#f2e7b8"/></linearGradient></defs><rect x="60" y="443" width="780" height="26" rx="13" fill="url(#sg398)" stroke="#1e2a44" stroke-width="2.5"/><path d="M122.4,469 L122.4,492 L210,506 L210,526" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="122.4" cy="456" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><path d="M777.6,469 L777.6,492 L690,506 L690,526" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="777.6" cy="456" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="526" width="360" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="210" y="554.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">William Stubbs</text><text x="210" y="582.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Nineteenth century: an absentee who</text><text x="210" y="603.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">neglected England</text><rect x="510" y="526" width="360" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="690" y="554.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">John Gillingham</text><text x="690" y="582.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">A capable ruler of the Angevin lands as a</text><text x="690" y="603.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">whole</text>
</svg>