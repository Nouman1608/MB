<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 733" width="900" height="733" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="733" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The main campaigns, 1205-1227</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Bars drawn to a time scale</text>
<rect x="30" y="124" width="840" height="444" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="230" y1="170" x2="230" y2="558" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="5 6"/><text x="230" y="158" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">1200</text><line x1="430" y1="170" x2="430" y2="558" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="5 6"/><text x="430" y="158" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">1210</text><line x1="630" y1="170" x2="630" y2="558" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="5 6"/><text x="630" y="158" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">1220</text><line x1="830" y1="170" x2="830" y2="558" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="5 6"/><text x="830" y="158" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">1230</text><text x="50" y="212" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Western Xia</text><rect x="330" y="192" width="100" height="28" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><rect x="326" y="230" width="255.008" height="24" fill="#ffffff"/><text x="330" y="248" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">raids from 1205; submits by 1210</text><text x="50" y="308" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Jin China</text><rect x="450" y="288" width="80" height="28" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><rect x="446" y="326" width="294.096" height="24" fill="#ffffff"/><text x="450" y="344" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">invasion from 1211; Zhongdu falls 1215</text><text x="50" y="404" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Khwarazm</text><rect x="610" y="384" width="40" height="28" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><rect x="462.992" y="422" width="391.008" height="24" fill="#ffffff"/><text x="466.992" y="440" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Bukhara, Samarkand, Urgench, Merv, Nishapur fall</text><text x="50" y="500" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Western Xia</text><rect x="750" y="480" width="20" height="28" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="545.024" y="518" width="308.976" height="24" fill="#ffffff"/><text x="549.024" y="536" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">final campaign; Genghis Khan dies 1227</text><circle cx="590" cy="398" r="8" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="576" y="404" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">1218 Otrar</text><rect x="30" y="590" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="624.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Adaptability</text><text x="50" y="654.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A cavalry army could not take walled cities, so captured Chinese and Muslim engineers built siege</text><text x="50" y="676.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">engines.</text>
</svg>