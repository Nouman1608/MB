<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 748" width="900" height="748" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="748" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Question 4 plan: Genghis Khan's success</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">"Examine the reasons for Genghis Khan's military success."</text>
<rect x="30" y="124" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Thesis</text><text x="450" y="188.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Organisation and adaptability were decisive, but opponents' divisions gave them their opportunity.</text><rect x="130" y="235" width="740" height="78" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="145" y="264.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Organisation</text><text x="145" y="293.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Units broke tribal loyalties; merit produced commanders like Subotai</text><circle cx="62" cy="274" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="282.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="682.035" y="247" width="172.965" height="29" rx="14.5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="768.5174999999999" y="266.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">source + knowledge</text><rect x="130" y="325" width="740" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="145" y="354.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Adaptability</text><text x="145" y="383.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Engineers recruited to take walled cities; Zhongdu fell in 1215</text><circle cx="62" cy="364" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="372.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="682.035" y="337" width="172.965" height="29" rx="14.5" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="768.5174999999999" y="356.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">source + knowledge</text><rect x="130" y="415" width="740" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="145" y="444.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Terror and intelligence</text><text x="145" y="473.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Resisting towns such as Nishapur destroyed, so others surrendered</text><circle cx="62" cy="454" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="462.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="682.035" y="427" width="172.965" height="29" rx="14.5" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="768.5174999999999" y="446.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">source + knowledge</text><rect x="130" y="505" width="740" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="145" y="534.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Opponents' weaknesses</text><text x="145" y="563.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The Jin were fighting the Song; the Shah divided his forces among garrisons</text><circle cx="62" cy="544" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="552.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="682.035" y="517" width="172.965" height="29" rx="14.5" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="768.5174999999999" y="536.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">source + knowledge</text><rect x="30" y="605" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="639.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement</text><text x="50" y="669.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Opponents' weakness explains the timing and scale of victories; only Mongol organisation explains</text><text x="50" y="691.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">why they were sustained.</text>
</svg>