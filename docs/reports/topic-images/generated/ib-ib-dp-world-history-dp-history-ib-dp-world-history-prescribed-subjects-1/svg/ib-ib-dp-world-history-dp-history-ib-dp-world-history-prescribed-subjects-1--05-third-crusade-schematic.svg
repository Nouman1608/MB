<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 648" width="900" height="648" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="648" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Richard's Third Crusade, 1190-1192</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Schematic sequence, not to scale and not a map</text>
<rect x="30" y="124" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M90,314 L680,314" fill="none" stroke="#1e2a44" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="90" cy="314" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="90" y="354" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Messina</text><text x="90" y="376" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Sicily, seized</text><circle cx="235" cy="314" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="235" y="354" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Cyprus</text><text x="235" y="376" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">conquered</text><text x="235" y="290" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">1191</text><circle cx="380" cy="314" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="380" y="354" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Acre</text><text x="380" y="376" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">siege; falls July</text><text x="380" y="290" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">Jun-Jul 1191</text><circle cx="530" cy="314" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="530" y="354" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Arsuf</text><text x="530" y="376" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Saladin defeated</text><text x="530" y="290" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">Sep 1191</text><circle cx="680" cy="314" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="680" y="354" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Jaffa</text><text x="680" y="376" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">relieved</text><text x="680" y="290" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">1192</text><rect x="708" y="178" width="124" height="52" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="770" y="211" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Jerusalem</text><path d="M560,274 Q640,214 700,204" fill="none" stroke="#8a6d0d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 6"/><path d="M600,284 Q690,244 710,228" fill="none" stroke="#8a6d0d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 6"/><text x="770" y="256" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="middle">approached twice,</text><text x="770" y="274" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="middle">turned back</text><text x="60" y="164" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Left in 1190</text><text x="60" y="428" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Arsuf: tight formation along the coast, fleet alongside</text><rect x="30" y="476" width="270.6666666666667" height="140" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="45" y="503" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1192</text><text x="45" y="529.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Treaty of Jaffa</text><text x="45" y="557" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Three-year truce; Christian</text><text x="45" y="577" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">coastal strip; pilgrim access to</text><text x="45" y="597" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Jerusalem</text><rect x="314.6666666666667" y="476" width="270.6666666666667" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="329.6666666666667" y="513" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DEC 1192 - 1194</text><text x="329.6666666666667" y="539.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Captured near Vienna</text><text x="329.6666666666667" y="567" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Held by Henry VI; ransom of</text><text x="329.6666666666667" y="587" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">150,000 marks</text><rect x="599.3333333333334" y="476" width="270.6666666666667" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="614.3333333333334" y="513" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1194-1199</text><text x="614.3333333333334" y="539.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Wars against Philip II</text><text x="614.3333333333334" y="567" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Château Gaillard built; dies at</text><text x="614.3333333333334" y="587" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Châlus, April 1199</text>
</svg>