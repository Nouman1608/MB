<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 757" width="900" height="757" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="757" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From Temüjin to Genghis Khan</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Alliances made, then broken</text>
<line x1="150" y1="134" x2="150" y2="585" stroke="#1e2a44" stroke-width="4"/><rect x="184" y="124" width="686" height="69" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="197" y="151.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Temüjin born</text><text x="197" y="175.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The exact year is uncertain</text><line x1="150" y1="158.5" x2="184" y2="158.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="150" cy="158.5" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="130" y="164.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">c.1160s</text><rect x="184" y="203" width="686" height="69" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="197" y="230.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Father Yesügei poisoned by Tatars</text><text x="197" y="254.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The family is abandoned by its followers</text><line x1="150" y1="237.5" x2="184" y2="237.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="150" cy="237.5" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="130" y="243.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">youth</text><rect x="184" y="282" width="686" height="69" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="197" y="309.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Toghrul (Ong Khan) of the Kereit; Jamukha, his sworn brother (anda)</text><text x="197" y="333.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">He later breaks with both</text><line x1="150" y1="316.5" x2="184" y2="316.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="150" cy="316.5" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="130" y="322.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">alliances</text><rect x="184" y="361" width="686" height="45" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="197" y="388.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Defeats the Tatars</text><line x1="150" y1="383.5" x2="184" y2="383.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="150" cy="383.5" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="130" y="389.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1202</text><rect x="184" y="416" width="686" height="45" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="197" y="443.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Defeats the Kereit</text><line x1="150" y1="438.5" x2="184" y2="438.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="150" cy="438.5" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="130" y="444.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1203</text><rect x="184" y="471" width="686" height="45" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="197" y="498.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Defeats the Naiman</text><line x1="150" y1="493.5" x2="184" y2="493.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="150" cy="493.5" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="130" y="499.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1204</text><rect x="184" y="526" width="686" height="69" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="197" y="553.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Kurultai on the Onon river</text><text x="197" y="577.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Proclaimed Genghis Khan</text><line x1="150" y1="560.5" x2="184" y2="560.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="150" cy="560.5" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="130" y="566.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1206</text><rect x="30" y="617" width="412" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="651.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Loyalty above birth</text><text x="50" y="679.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Followers such as Jebe and Subotai promoted</text><text x="50" y="700.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">from outside the old aristocracy</text><rect x="458" y="617" width="412" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="478" y="651.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Tribes broken up</text><text x="478" y="679.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Defeated peoples redistributed into new units,</text><text x="478" y="700.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">weakening kin loyalties</text>
</svg>