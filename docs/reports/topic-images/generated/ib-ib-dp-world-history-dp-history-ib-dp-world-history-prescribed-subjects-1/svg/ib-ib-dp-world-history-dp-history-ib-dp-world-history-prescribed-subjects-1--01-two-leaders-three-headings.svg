<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 652" width="900" height="652" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="652" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two leaders, three headings</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Paper 1 questions are drawn from leadership, campaigns and impact</text>
<clipPath id="tc124"><rect x="30" y="124" width="840" height="363" rx="14"/></clipPath><g clip-path="url(#tc124)"><rect x="30" y="124" width="168" height="49" fill="#b5d3cf"/><rect x="198" y="124" width="336" height="49" fill="#b5d3cf"/><text x="212" y="152.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Genghis Khan (c.1200-1227)</text><rect x="534" y="124" width="336" height="49" fill="#f2e7b8"/><text x="548" y="152.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Richard I (1173-1199)</text><rect x="30" y="173" width="168" height="68" fill="#dce9e7"/><text x="44" y="199.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Starting point</text><rect x="198" y="173" width="336" height="68" fill="#ffffff"/><text x="212" y="199.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Built an empire from a confederation of</text><text x="212" y="220.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">steppe peoples</text><rect x="534" y="173" width="336" height="68" fill="#ffffff"/><text x="548" y="199.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Inherited the Angevin lands, from</text><text x="548" y="220.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">England to the Pyrenees</text><line x1="30" y1="241" x2="870" y2="241" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="241" width="168" height="89" fill="#dce9e7"/><text x="44" y="267.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Leadership</text><rect x="198" y="241" width="336" height="89" fill="#f8faf9"/><text x="212" y="267.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Alliances, then breaks with allies; loyalty</text><text x="212" y="288.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rewarded above birth; defeated tribes</text><text x="212" y="309.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">broken up</text><rect x="534" y="241" width="336" height="89" fill="#f8faf9"/><text x="548" y="267.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Duke of Aquitaine; revolt of 1173-74;</text><text x="548" y="288.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reputation from Taillebourg (1179);</text><text x="548" y="309.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">crowned 1189</text><line x1="30" y1="330" x2="870" y2="330" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="330" width="168" height="68" fill="#dce9e7"/><text x="44" y="356.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Campaigns</text><rect x="198" y="330" width="336" height="68" fill="#ffffff"/><text x="212" y="356.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Western Xia, Jin China, the</text><text x="212" y="377.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Khwarazmian Empire</text><rect x="534" y="330" width="336" height="68" fill="#ffffff"/><text x="548" y="356.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The Third Crusade; wars against Philip II</text><text x="548" y="377.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">in France</text><line x1="30" y1="398" x2="870" y2="398" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="398" width="168" height="89" fill="#dce9e7"/><text x="44" y="424.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Impact</text><rect x="198" y="398" width="336" height="89" fill="#f8faf9"/><text x="212" y="424.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Largest land empire yet; safer travel and</text><text x="212" y="445.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">couriers; destruction and terror</text><rect x="534" y="398" width="336" height="89" fill="#f8faf9"/><text x="548" y="424.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Coastal kingdom secured, Jerusalem</text><text x="548" y="445.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">not recovered; heavy taxation in</text><text x="548" y="466.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">England</text></g><line x1="198" y1="124" x2="198" y2="487" stroke="#c9d6d4" stroke-width="1.5"/><line x1="534" y1="124" x2="534" y2="487" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="124" width="840" height="363" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="509" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="543.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Use the contrast</text><text x="450" y="573.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">How far did each commander's success depend on personal qualities, and how far on the society</text><text x="450" y="595.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">and resources behind him?</text>
</svg>