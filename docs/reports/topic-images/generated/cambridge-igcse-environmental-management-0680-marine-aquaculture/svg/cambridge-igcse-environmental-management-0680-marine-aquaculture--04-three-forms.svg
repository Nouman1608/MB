<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three forms of marine aquaculture</text>

<rect x="30" y="240" width="840" height="230" fill="#b5d3cf"/><path d="M30,470 L870,470 L870,510 L30,510 Z" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5"/><path d="M30,180 L300,180 L330,240 L330,470 L30,470 Z" fill="#d8e3c6" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><rect x="55" y="198" width="100" height="40" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><rect x="175" y="198" width="100" height="40" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><path d="M95,222 q8,-10 16,0 q-4,6 -16,0 M215,222 q8,-10 16,0 q-4,6 -16,0" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><rect x="385" y="232" width="90" height="14" rx="6" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><path d="M388,246 L388,370 Q430,390 472,370 L472,246" fill="#ffffff" fill-opacity="0.25" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="6 4"/><path d="M404,300 Q420,290 434,300 Q420,310 404,300 Z M432,300 L444,292 L444,308 Z" fill="#2b5a9a" stroke="#1e2a44" stroke-width="1.6" stroke-linejoin="round"/><path d="M458,340 Q442,330 428,340 Q442,350 458,340 Z M430,340 L418,332 L418,348 Z" fill="#2b5a9a" stroke="#1e2a44" stroke-width="1.6" stroke-linejoin="round"/><rect x="495" y="232" width="90" height="14" rx="6" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><path d="M498,246 L498,370 Q540,390 582,370 L582,246" fill="#ffffff" fill-opacity="0.25" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="6 4"/><path d="M514,300 Q530,290 544,300 Q530,310 514,300 Z M542,300 L554,292 L554,308 Z" fill="#2b5a9a" stroke="#1e2a44" stroke-width="1.6" stroke-linejoin="round"/><path d="M568,340 Q552,330 538,340 Q552,350 568,340 Z M540,340 L528,332 L528,348 Z" fill="#2b5a9a" stroke="#1e2a44" stroke-width="1.6" stroke-linejoin="round"/><line x1="660" y1="238" x2="850" y2="238" stroke="#1e2a44" stroke-width="3"/><circle cx="660" cy="234" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="850" cy="234" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><path d="M680,240 q-10,30 0,60 q10,30 0,60" fill="none" stroke="#6f9a52" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><path d="M710,240 q-10,30 0,60 q10,30 0,60" fill="none" stroke="#6f9a52" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><path d="M740,240 q-10,30 0,60 q10,30 0,60" fill="none" stroke="#6f9a52" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><path d="M770,240 q-10,30 0,60 q10,30 0,60" fill="none" stroke="#6f9a52" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><path d="M800,240 q-10,30 0,60 q10,30 0,60" fill="none" stroke="#6f9a52" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><path d="M830,240 q-10,30 0,60 q10,30 0,60" fill="none" stroke="#6f9a52" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><line x1="755" y1="365" x2="755" y2="470" stroke="#1e2a44" stroke-width="2" stroke-dasharray="6 5"/><path d="M330,240 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="165" y="140" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Crustaceans</text><text x="165" y="164" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">e.g. shrimps or prawns in coastal ponds</text><text x="485" y="140" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Fish</text><text x="485" y="164" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">floating net cages</text><text x="485" y="184" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">in sheltered bays</text><text x="755" y="140" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Seaweeds</text><text x="755" y="164" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">grown on ropes or</text><text x="755" y="184" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">lines in the sea</text><text x="860" y="498" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="end" font-style="italic">schematic, not to scale</text><rect x="30" y="530" width="840" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="568" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Marine aquaculture = farming marine species in CAPTIVITY</text><text x="60" y="596" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">limited to fish, crustaceans and seaweeds. In captivity they are:</text><rect x="60" y="614" width="120" height="44" rx="22" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="120" y="641.58" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="middle">contained</text><rect x="194" y="614" width="160" height="44" rx="22" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="274" y="641.58" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="middle">fed if necessary</text><rect x="368" y="614" width="215" height="44" rx="22" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="475.5" y="641.58" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="middle">protected from predators</text><rect x="597" y="614" width="230" height="44" rx="22" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="712" y="641.58" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="middle">harvested at market size</text>
</svg>