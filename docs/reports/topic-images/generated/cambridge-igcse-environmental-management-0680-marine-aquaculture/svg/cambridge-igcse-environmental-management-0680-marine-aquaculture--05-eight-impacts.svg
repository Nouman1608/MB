<rect width="900" height="920" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Eight impacts of marine aquaculture</text>

<text x="450" y="128" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Two benefits</text><rect x="40" y="144" width="400" height="46" rx="23" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="240" y="172.94" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">+ less exploitation of wild fisheries</text><rect x="460" y="144" width="400" height="46" rx="23" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="660" y="172.94" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">+ more food for people, year-round</text><rect x="30" y="270" width="840" height="220" fill="#b5d3cf"/><rect x="30" y="490" width="840" height="34" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><path d="M30,270 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="450" y="225" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">Six concerns</text><rect x="290" y="261" width="220" height="16" rx="7" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><path d="M295,277 L295,410 Q400,435 505,410 L505,277" fill="#ffffff" fill-opacity="0.3" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="6 4"/><path d="M322.4,320 Q340,309 355.4,320 Q340,331 322.4,320 Z M353.2,320 L366.4,311.2 L366.4,328.8 Z" fill="#2b5a9a" stroke="#1e2a44" stroke-width="1.6" stroke-linejoin="round"/><path d="M407.6,345 Q390,334 374.6,345 Q390,356 407.6,345 Z M376.8,345 L363.6,336.2 L363.6,353.8 Z" fill="#2b5a9a" stroke="#1e2a44" stroke-width="1.6" stroke-linejoin="round"/><path d="M432.4,315 Q450,304 465.4,315 Q450,326 432.4,315 Z M463.2,315 L476.4,306.2 L476.4,323.8 Z" fill="#2b5a9a" stroke="#1e2a44" stroke-width="1.6" stroke-linejoin="round"/><path d="M377.6,380 Q360,369 344.6,380 Q360,391 377.6,380 Z M346.8,380 L333.6,371.2 L333.6,388.8 Z" fill="#2b5a9a" stroke="#1e2a44" stroke-width="1.6" stroke-linejoin="round"/><path d="M412.4,385 Q430,374 445.4,385 Q430,396 412.4,385 Z M443.2,385 L456.4,376.2 L456.4,393.8 Z" fill="#2b5a9a" stroke="#1e2a44" stroke-width="1.6" stroke-linejoin="round"/><path d="M417.6,300 Q400,289 384.6,300 Q400,311 417.6,300 Z M386.8,300 L373.6,291.2 L373.6,308.8 Z" fill="#2b5a9a" stroke="#1e2a44" stroke-width="1.6" stroke-linejoin="round"/><circle cx="372" cy="332" r="2.5" fill="#b5602e" stroke="#b5602e" stroke-width="1"/><circle cx="381" cy="340" r="2.5" fill="#b5602e" stroke="#b5602e" stroke-width="1"/><circle cx="390" cy="332" r="2.5" fill="#b5602e" stroke="#b5602e" stroke-width="1"/><circle cx="399" cy="340" r="2.5" fill="#b5602e" stroke="#b5602e" stroke-width="1"/><circle cx="408" cy="332" r="2.5" fill="#b5602e" stroke="#b5602e" stroke-width="1"/><circle cx="417" cy="340" r="2.5" fill="#b5602e" stroke="#b5602e" stroke-width="1"/><path d="M505,340 l12,8 l-8,10 l10,8" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M547.4,362 Q565,351 580.4,362 Q565,373 547.4,362 Z M578.2,362 L591.4,353.2 L591.4,370.8 Z" fill="#2b5a9a" stroke="#1e2a44" stroke-width="1.6" stroke-linejoin="round"/><path d="M602.4,388 Q620,377 635.4,388 Q620,399 602.4,388 Z M633.2,388 L646.4,379.2 L646.4,396.8 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="1.6" stroke-linejoin="round"/><circle cx="330" cy="445" r="3.5" fill="#8a6d0d" stroke="#8a6d0d" stroke-width="1"/><circle cx="348" cy="457" r="3.5" fill="#8a6d0d" stroke="#8a6d0d" stroke-width="1"/><circle cx="366" cy="469" r="3.5" fill="#8a6d0d" stroke="#8a6d0d" stroke-width="1"/><circle cx="384" cy="445" r="3.5" fill="#8a6d0d" stroke="#8a6d0d" stroke-width="1"/><circle cx="402" cy="457" r="3.5" fill="#8a6d0d" stroke="#8a6d0d" stroke-width="1"/><circle cx="420" cy="469" r="3.5" fill="#8a6d0d" stroke="#8a6d0d" stroke-width="1"/><circle cx="438" cy="445" r="3.5" fill="#8a6d0d" stroke="#8a6d0d" stroke-width="1"/><circle cx="456" cy="457" r="3.5" fill="#8a6d0d" stroke="#8a6d0d" stroke-width="1"/><circle cx="474" cy="469" r="3.5" fill="#8a6d0d" stroke="#8a6d0d" stroke-width="1"/><ellipse cx="400" cy="492" rx="120" ry="10" fill="#8a6d0d" opacity="0.6"/><path d="M640,264 L800,264 L780,288 L660,288 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><rect x="700" y="236" width="50" height="28" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><rect x="752" y="242" width="10" height="22" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.8"/><line x1="277" y1="328" x2="368" y2="332" stroke="#1e2a44" stroke-width="2" stroke-dasharray="4 4"/><path d="M660,264 L662,244 L688,244 L690,264 Z" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><text x="675" y="236" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">feed</text><circle cx="540" cy="325" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="540" y="331.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><circle cx="260" cy="328" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="260" y="334.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><circle cx="240" cy="430" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="240" y="436.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><circle cx="520" cy="480" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="520" y="486.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><circle cx="765" cy="215" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="765" y="221.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><circle cx="600" cy="230" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="600" y="236.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><path d="M217.6,445 Q200,434 184.6,445 Q200,456 217.6,445 Z M186.8,445 L173.6,436.2 L173.6,453.8 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="1.6" stroke-linejoin="round"/><path d="M232.4,470 Q250,459 265.4,470 Q250,481 232.4,470 Z M263.2,470 L276.4,461.2 L276.4,478.8 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="1.6" stroke-linejoin="round"/><circle cx="50" cy="567" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="50" y="572.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="76" y="573" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Risk of escape</text><text x="76" y="597" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">escaped fish compete with wild fish and may</text><text x="76" y="616" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">breed with them</text><circle cx="480" cy="567" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="480" y="572.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="506" y="573" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Risk of disease</text><text x="506" y="597" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">close packing spreads disease and parasites,</text><text x="506" y="616" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">which can pass to wild fish</text><circle cx="50" cy="659" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="50" y="664.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="76" y="665" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Local food webs</text><text x="76" y="689" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">waste feed attracts some species; cages and</text><text x="76" y="708" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">chemicals change the habitat</text><circle cx="480" cy="659" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="480" y="664.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="506" y="665" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Nutrient enrichment</text><text x="506" y="689" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">uneaten feed and faeces: algal blooms and low</text><text x="506" y="708" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">oxygen below cages</text><circle cx="50" cy="751" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="50" y="756.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="76" y="757" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Energy usage</text><text x="76" y="781" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">pumps, aeration, boats, feed making,</text><text x="76" y="800" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">refrigerated transport</text><circle cx="480" cy="751" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="480" y="756.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="506" y="757" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Food for farmed fish</text><text x="506" y="781" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">pellets made partly from wild-caught fish</text><rect x="30" y="830" width="840" height="70" rx="14" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="860" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Contrast: seaweeds need no feed and take up nutrients as they grow,</text><text x="450" y="884" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">so seaweed farms avoid several of these concerns.</text>
</svg>