<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 615" width="900" height="615" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="615" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: setting a quota</text>

<rect x="30" y="130" width="240" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="150" y="182" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">180,000 t</text><text x="150" y="216" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="middle">estimated stock</text><rect x="330" y="130" width="240" height="120" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><text x="450" y="182" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">27,000 t</text><text x="450" y="216" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="middle">total quota</text><rect x="630" y="130" width="240" height="120" rx="14" fill="#d4b02e" stroke="#8a6d0d" stroke-width="3"/><text x="750" y="182" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">300 t</text><text x="750" y="216" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="middle">quota per boat</text><line x1="274" y1="190" x2="326" y2="190" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="574" y1="190" x2="626" y2="190" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="300" y="280" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">× 15 ÷ 100</text><text x="600" y="280" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">÷ 90 boats</text><text x="30" y="335" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The quota is 15% of the stock</text><rect x="30" y="350" width="840" height="46" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="350" width="126" height="46" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="93" y="380" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">15%</text><text x="500" y="380" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle">85% left to breed and grow</text><text x="870" y="425" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">invented figures</text><rect x="30" y="440" width="840" height="150" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="60" y="478" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Why the quota could still fail</text><text x="60" y="512" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="76" y="512" font-size="17.5" font-weight="400" fill="#1e2a44" text-anchor="start">boats may land more than their quota illegally</text><text x="60" y="543" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="76" y="543" font-size="17.5" font-weight="400" fill="#1e2a44" text-anchor="start">undersized or over-quota fish may be discarded at sea and die</text><text x="60" y="574" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="76" y="574" font-size="17.5" font-weight="400" fill="#1e2a44" text-anchor="start">the stock estimate itself may be wrong</text>
</svg>