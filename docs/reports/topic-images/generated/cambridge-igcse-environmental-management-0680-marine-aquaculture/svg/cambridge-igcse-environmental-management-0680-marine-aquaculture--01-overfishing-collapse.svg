<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 645" width="900" height="645" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="645" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How overfishing leads to collapse</text>

<rect x="30" y="110" width="300" height="470" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="180" y="148" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="middle">Causes</text><rect x="50" y="170" width="260" height="82" rx="10" fill="#ffffff" stroke="#8a6d0d" stroke-width="2"/><text x="180" y="206" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">rising demand from a</text><text x="180" y="228" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">growing population</text><rect x="50" y="268" width="260" height="82" rx="10" fill="#ffffff" stroke="#8a6d0d" stroke-width="2"/><text x="180" y="304" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">larger, more powerful</text><text x="180" y="326" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">boats</text><rect x="50" y="366" width="260" height="82" rx="10" fill="#ffffff" stroke="#8a6d0d" stroke-width="2"/><text x="180" y="413" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">sonar to locate shoals</text><rect x="50" y="464" width="260" height="82" rx="10" fill="#ffffff" stroke="#8a6d0d" stroke-width="2"/><text x="180" y="511" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">huge nets</text><line x1="334" y1="345" x2="372" y2="345" stroke="#1e2a44" stroke-width="6" marker-end="url(#ah)"/><rect x="380" y="110" width="490" height="76" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="625" y="142" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Fish caught faster than the population</text><text x="625" y="165" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">replaces itself</text><line x1="625" y1="189" x2="625" y2="202" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="380" y="206" width="490" height="76" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="625" y="251" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Too many breeding adults removed</text><line x1="625" y1="285" x2="625" y2="298" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="380" y="302" width="490" height="76" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="625" y="347" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Fewer young produced</text><line x1="625" y1="381" x2="625" y2="394" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="380" y="398" width="490" height="76" rx="12" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="625" y="443" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Catches fall year after year</text><line x1="625" y1="477" x2="625" y2="490" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="380" y="494" width="490" height="76" rx="12" fill="#b5602e" stroke="#b5602e" stroke-width="2.5"/><text x="625" y="539" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Stock can collapse</text><text x="450" y="620" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="middle">Overharvesting is the same idea for other marine species, such as shellfish or seaweeds.</text>
</svg>