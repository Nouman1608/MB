<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 672" width="900" height="672" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="672" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Nine ways to manage the harvest</text>

<rect x="30" y="110" width="150" height="108" rx="12" fill="#2e6b62"/><text x="105" y="162" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Gear</text><text x="105" y="186" font-size="15.5" font-weight="400" fill="#ffffff" text-anchor="middle">how caught</text><rect x="194" y="110" width="217.33333333333334" height="108" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="208" y="140" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Limits on boat and</text><text x="208" y="161" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">net size</text><text x="208" y="184" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">less caught each trip</text><rect x="423.33333333333337" y="110" width="217.33333333333334" height="108" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="437.33333333333337" y="140" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Larger mesh size</text><text x="437.33333333333337" y="163" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">young fish swim through</text><text x="437.33333333333337" y="182" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">and breed</text><rect x="652.6666666666667" y="110" width="217.33333333333334" height="108" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="666.6666666666667" y="140" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Pole and line</text><text x="666.6666666666667" y="163" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">one at a time: little</text><text x="666.6666666666667" y="182" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">bycatch</text><rect x="30" y="230" width="150" height="86" rx="12" fill="#8a6d0d"/><text x="105" y="271" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Amount</text><text x="105" y="295" font-size="15.5" font-weight="400" fill="#ffffff" text-anchor="middle">how much</text><rect x="194" y="230" width="676" height="86" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="208" y="260" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Quotas</text><text x="208" y="283" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">maximum mass of a species per year, shared between countries or boats</text><rect x="30" y="328" width="150" height="86" rx="12" fill="#2e6b62"/><text x="105" y="369" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Time</text><text x="105" y="393" font-size="15.5" font-weight="400" fill="#ffffff" text-anchor="middle">when</text><rect x="194" y="328" width="332" height="86" rx="12" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="208" y="358" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Closed seasons</text><text x="208" y="381" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">no fishing, usually in the breeding</text><text x="208" y="400" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">season</text><rect x="538" y="328" width="332" height="86" rx="12" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="552" y="358" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Limited fishing days</text><text x="552" y="381" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">cuts total fishing effort</text><rect x="30" y="426" width="150" height="86" rx="12" fill="#8a6d0d"/><text x="105" y="467" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Place</text><text x="105" y="491" font-size="15.5" font-weight="400" fill="#ffffff" text-anchor="middle">where</text><rect x="194" y="426" width="676" height="86" rx="12" fill="#fbf6e2" stroke="#8a6d0d" stroke-width="2.5"/><text x="208" y="456" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Protected areas</text><text x="208" y="479" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">fishing banned or restricted; populations recover and spill over</text><rect x="30" y="524" width="150" height="86" rx="12" fill="#b5602e"/><text x="105" y="565" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Rules</text><text x="105" y="589" font-size="15.5" font-weight="400" fill="#ffffff" text-anchor="middle">laws, agreements</text><rect x="194" y="524" width="332" height="86" rx="12" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="208" y="554" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Conservation laws</text><text x="208" y="577" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">protect species, ban damaging</text><text x="208" y="596" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">methods; fines</text><rect x="538" y="524" width="332" height="86" rx="12" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="552" y="554" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">International agreements</text><text x="552" y="577" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">shared limits, then implementation</text><text x="552" y="596" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">and monitoring</text><text x="450" y="644" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Closed seasons are about time; protected areas are about place.</text>
</svg>