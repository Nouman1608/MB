<rect x="30" y="110" width="840" height="400" rx="14" fill="#dce9e7"/><path d="M30,130 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M120,170 L780,170 L650,470 L250,470 Z" fill="#ffffff" fill-opacity="0.35" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><line x1="202.5" y1="170" x2="300" y2="470" stroke="#4a5568" stroke-width="1.5"/><line x1="285" y1="170" x2="350" y2="470" stroke="#4a5568" stroke-width="1.5"/><line x1="367.5" y1="170" x2="400" y2="470" stroke="#4a5568" stroke-width="1.5"/><line x1="450" y1="170" x2="450" y2="470" stroke="#4a5568" stroke-width="1.5"/><line x1="532.5" y1="170" x2="500" y2="470" stroke="#4a5568" stroke-width="1.5"/><line x1="615" y1="170" x2="550" y2="470" stroke="#4a5568" stroke-width="1.5"/><line x1="697.5" y1="170" x2="600" y2="470" stroke="#4a5568" stroke-width="1.5"/><line x1="146" y1="230" x2="754" y2="230" stroke="#4a5568" stroke-width="1.5"/><line x1="172" y1="290" x2="728" y2="290" stroke="#4a5568" stroke-width="1.5"/><line x1="198" y1="350" x2="702" y2="350" stroke="#4a5568" stroke-width="1.5"/><line x1="224" y1="410" x2="676" y2="410" stroke="#4a5568" stroke-width="1.5"/><path d="M224.4,230 Q250,214 272.4,230 Q250,246 224.4,230 Z M269.2,230 L288.4,217.2 L288.4,242.8 Z" fill="#2b5a9a" stroke="#1e2a44" stroke-width="1.6" stroke-linejoin="round"/><path d="M304.4,260 Q330,244 352.4,260 Q330,276 304.4,260 Z M349.2,260 L368.4,247.2 L368.4,272.8 Z" fill="#2b5a9a" stroke="#1e2a44" stroke-width="1.6" stroke-linejoin="round"/><path d="M394.4,225 Q420,209 442.4,225 Q420,241 394.4,225 Z M439.2,225 L458.4,212.2 L458.4,237.8 Z" fill="#2b5a9a" stroke="#1e2a44" stroke-width="1.6" stroke-linejoin="round"/><path d="M274.4,320 Q300,304 322.4,320 Q300,336 274.4,320 Z M319.2,320 L338.4,307.2 L338.4,332.8 Z" fill="#2b5a9a" stroke="#1e2a44" stroke-width="1.6" stroke-linejoin="round"/><path d="M364.4,330 Q390,314 412.4,330 Q390,346 364.4,330 Z M409.2,330 L428.4,317.2 L428.4,342.8 Z" fill="#2b5a9a" stroke="#1e2a44" stroke-width="1.6" stroke-linejoin="round"/><path d="M444.4,290 Q470,274 492.4,290 Q470,306 444.4,290 Z M489.2,290 L508.4,277.2 L508.4,302.8 Z" fill="#2b5a9a" stroke="#1e2a44" stroke-width="1.6" stroke-linejoin="round"/><rect x="278.4" y="372.9" width="163.2" height="24.3" rx="5" fill="#ffffff" opacity="0.92"/><text x="360" y="390" font-size="18" font-weight="700" fill="#2b5a9a" text-anchor="middle">target species</text><path d="M565.6,230 Q580,221 592.6,230 Q580,239 565.6,230 Z M590.8,230 L601.6,222.8 L601.6,237.2 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="1.6" stroke-linejoin="round"/><path d="M605.6,255 Q620,246 632.6,255 Q620,264 605.6,255 Z M630.8,255 L641.6,247.8 L641.6,262.2 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="1.6" stroke-linejoin="round"/><ellipse cx="610" cy="330" rx="34" ry="24" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><circle cx="650" cy="322" r="10" fill="#6f9a52" stroke="#1e2a44" stroke-width="2.5"/><path d="M520,400 Q555,375 600,392 L620,382 L612,400 Q560,418 520,400 Z" fill="#4a5568" stroke="#1e2a44" stroke-width="2"/><rect x="571.2" y="427.9" width="87.6" height="24.3" rx="5" fill="#ffffff" opacity="0.92"/><text x="615" y="445" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">bycatch</text><text x="860" y="160" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">schematic</text><rect x="30" y="530" width="410" height="160" rx="14" fill="#eef5f4" stroke="#2b5a9a" stroke-width="2.5"/><text x="48" y="565" font-size="20" font-weight="700" fill="#2b5a9a" text-anchor="start">Target species</text><text x="48" y="591.35" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The ones fishers intend to catch. The</text><text x="48" y="613.7900000000001" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">largest, oldest fish go first, so average</text><text x="48" y="636.23" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">size falls and more fish are caught</text><text x="48" y="658.6700000000001" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">before they have bred.</text><rect x="460" y="530" width="410" height="160" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="478" y="565" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Bycatch</text><text x="478" y="591.35" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Caught unintentionally: non-target fish,</text><text x="478" y="613.7900000000001" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">juveniles, turtles, dolphins, sharks and</text><text x="478" y="636.23" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">seabirds. Much is thrown back dead or</text><text x="478" y="658.6700000000001" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">dying, so unfished species decline.</text>
</svg>