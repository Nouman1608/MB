<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 755" width="900" height="755" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="755" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Overfishing ripples through food chains</text>

<rect x="30" y="110" width="410" height="530" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">A prey fish is overfished</text><text x="235" y="174" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">arrows point from food to feeder</text><rect x="60" y="196" width="350" height="106" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="3"/><text x="80" y="230" font-size="18.5" font-weight="700" fill="#1e2a44" text-anchor="start">Predators</text><text x="80" y="256" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">seabirds, seals, larger fish</text><text x="80" y="284" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">↓ less food, numbers fall</text><line x1="235" y1="340" x2="235" y2="308" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="60" y="342" width="350" height="106" rx="12" fill="#f2e7b8" stroke="#b5602e" stroke-width="3"/><text x="80" y="376" font-size="18.5" font-weight="700" fill="#1e2a44" text-anchor="start">Prey fish</text><text x="80" y="408" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">↓ overfished</text><text x="235" y="520" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">fewer prey means</text><text x="235" y="542" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">fewer predators</text><rect x="460" y="110" width="410" height="530" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">A predator is overfished</text><text x="665" y="174" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">arrows point from food to feeder</text><rect x="490" y="196" width="350" height="106" rx="12" fill="#f2e7b8" stroke="#b5602e" stroke-width="3"/><text x="510" y="230" font-size="18.5" font-weight="700" fill="#1e2a44" text-anchor="start">Predator fish</text><text x="510" y="262" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">↓ overfished</text><line x1="665" y1="340" x2="665" y2="308" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="490" y="342" width="350" height="106" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="3"/><text x="510" y="376" font-size="18.5" font-weight="700" fill="#1e2a44" text-anchor="start">Its prey</text><text x="510" y="408" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">↑ can increase</text><line x1="665" y1="486" x2="665" y2="454" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="490" y="488" width="350" height="106" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="3"/><text x="510" y="522" font-size="18.5" font-weight="700" fill="#1e2a44" text-anchor="start">The prey’s own food</text><text x="510" y="554" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">↓ may be overgrazed</text><rect x="30" y="660" width="840" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="702" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Species are linked in food webs, so effects spread beyond the fished species.</text>
</svg>