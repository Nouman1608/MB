<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 652" width="900" height="652" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="652" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">South Africa: a case of survival</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Democracy survived; inequality remained</text>
<line x1="140" y1="132" x2="140" y2="501" stroke="#1e2a44" stroke-width="4"/><rect x="180" y="124" width="690" height="69" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="193" y="151.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Mandela released</text><text x="193" y="175.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Negotiations follow, as apartheid collapses</text><circle cx="140" cy="158.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="164.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Feb 1990</text><rect x="180" y="203" width="690" height="69" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="193" y="230.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">First universal elections (27 April)</text><text x="193" y="254.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Government of National Unity; Reconstruction and Development Programme</text><circle cx="140" cy="237.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="243.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1994</text><rect x="180" y="282" width="690" height="69" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="193" y="309.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Truth and Reconciliation Commission</text><text x="193" y="333.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Chaired by Desmond Tutu: testimony and conditional amnesty</text><circle cx="140" cy="316.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="322.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1995</text><rect x="180" y="361" width="690" height="69" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="193" y="388.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Constitution with a Bill of Rights; GEAR</text><text x="193" y="412.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Growth and redistribution sought</text><circle cx="140" cy="395.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="401.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1996</text><rect x="180" y="440" width="690" height="69" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="193" y="467.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Peaceful transfer of power to Mbeki</text><text x="193" y="491.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Democracy survived</text><circle cx="140" cy="474.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="480.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1999</text><rect x="30" y="531" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="565.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The limit</text><text x="50" y="595.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Economic inequality and unemployment remained severe.</text>
</svg>