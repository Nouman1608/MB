<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 645" width="900" height="645" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="645" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Define democracy before you measure it</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Five working criteria</text>
<circle cx="56" cy="150" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="56" y="157.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="96" y="124" width="774" height="52" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="157" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Free, regular elections with a wide franchise</text><circle cx="56" cy="212" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="56" y="219.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="96" y="186" width="774" height="52" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="219" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">A constitution that limits government and protects rights</text><circle cx="56" cy="274" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="56" y="281.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="96" y="248" width="774" height="52" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="281" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">An independent judiciary and a free press</text><circle cx="56" cy="336" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="56" y="343.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="96" y="310" width="774" height="52" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="343" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Peaceful transfer of power between parties</text><circle cx="56" cy="398" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="56" y="405.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="96" y="372" width="774" height="52" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="405" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Protection of minorities as well as majority rule</text><text x="30" y="460" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">A STATE CAN MEET SOME CRITERIA AND NOT OTHERS</text><rect x="30" y="484" width="410" height="129" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="514" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INDIA AFTER 1950</text><text x="48" y="540.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Mass elections</text><text x="48" y="569.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">But civil liberties were suspended during the</text><text x="48" y="590.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Emergency (1975-77).</text><rect x="460" y="484" width="410" height="129" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="478" y="514" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WEIMAR GERMANY</text><text x="478" y="540.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A highly democratic constitution</text><text x="478" y="569.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">But the army, judiciary and civil service were</text><text x="478" y="590.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">often hostile to the republic.</text>
</svg>