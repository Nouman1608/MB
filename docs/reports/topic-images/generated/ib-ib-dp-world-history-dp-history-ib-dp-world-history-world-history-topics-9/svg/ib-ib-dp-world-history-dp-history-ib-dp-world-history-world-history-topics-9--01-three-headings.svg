<rect width="900" height="402" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Democratic states: three headings</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Built, tested and sometimes lost, 1848-2000</text>
<rect x="30" y="124" width="257.3333333333333" height="246" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="45" y="151" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1</text><text x="45" y="177.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Emergence</text><text x="45" y="206.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="60.2" y="206.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Conditions: war, defeat,</text><text x="60.2" y="227.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">economic change, social</text><text x="60.2" y="248.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">movements, end of empire</text><text x="60.2" y="269.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">or dictatorship</text><text x="45" y="295.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="60.2" y="295.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Institutions: constitutions,</text><text x="60.2" y="316.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">electoral systems,</text><text x="60.2" y="337.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">franchise, parties</text><line x1="293.3333333333333" y1="247" x2="315.3333333333333" y2="247" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="321.3333333333333" y="124" width="257.3333333333333" height="246" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="336.3333333333333" y="151" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">2</text><text x="336.3333333333333" y="177.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Development and</text><text x="336.3333333333333" y="201.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">challenges</text><text x="336.3333333333333" y="230.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="351.5333333333333" y="230.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Extremist movements</text><text x="336.3333333333333" y="256.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="351.5333333333333" y="256.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Economic crisis</text><text x="336.3333333333333" y="282.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="351.5333333333333" y="282.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Divided societies; weak</text><text x="351.5333333333333" y="303.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">institutions</text><text x="336.3333333333333" y="329.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="351.5333333333333" y="329.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">How governments</text><text x="351.5333333333333" y="350.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">responded</text><line x1="584.6666666666666" y1="247" x2="606.6666666666666" y2="247" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="612.6666666666666" y="124" width="257.3333333333333" height="246" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="627.6666666666666" y="151" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">3</text><text x="627.6666666666666" y="177.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Aims and results of</text><text x="627.6666666666666" y="201.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">policies</text><text x="627.6666666666666" y="230.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="642.8666666666667" y="230.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Economic, social, cultural</text><text x="642.8666666666667" y="251.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">policies</text><text x="627.6666666666666" y="277.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="642.8666666666667" y="277.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Effect on women and</text><text x="642.8666666666667" y="298.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">minorities</text><text x="627.6666666666666" y="324.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="642.8666666666667" y="324.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Did they strengthen</text><text x="642.8666666666667" y="345.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">democracy?</text>
</svg>