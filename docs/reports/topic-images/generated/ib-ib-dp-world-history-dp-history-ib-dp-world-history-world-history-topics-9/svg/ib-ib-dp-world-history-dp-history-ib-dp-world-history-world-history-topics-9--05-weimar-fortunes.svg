" y="482.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Hyperinflation and the</text><text x="59.2" y="503.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Munich Putsch (1923)</text><rect x="314.6666666666667" y="352" width="270.6666666666667" height="258" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="328.6666666666667" y="378" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">UNDER STRESEMANN</text><text x="328.6666666666667" y="404.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Recovery</text><text x="328.6666666666667" y="432.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="343.8666666666667" y="432.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Rentenmark (1923)</text><text x="328.6666666666667" y="457.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="343.8666666666667" y="457.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Dawes Plan (1924)</text><text x="328.6666666666667" y="482.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="343.8666666666667" y="482.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Locarno (1925)</text><rect x="599.3333333333334" y="352" width="270.6666666666667" height="258" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="613.3333333333334" y="378" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1930-1933</text><text x="613.3333333333334" y="404.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Collapse</text><text x="613.3333333333334" y="432.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="628.5333333333334" y="432.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Müller's coalition breaks</text><text x="628.5333333333334" y="453.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(March 1930)</text><text x="613.3333333333334" y="478.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="628.5333333333334" y="478.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Brüning rules by decree</text><text x="628.5333333333334" y="499.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(Article 48)</text><text x="613.3333333333334" y="524.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="628.5333333333334" y="524.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Nazis largest party (July</text><text x="628.5333333333334" y="545.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">1932)</text><text x="613.3333333333334" y="570.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="628.5333333333334" y="570.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Hitler appointed chancellor</text><text x="628.5333333333334" y="591.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(30 January 1933)</text><rect x="30" y="632" width="375" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="662.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Structure</text><text x="46" y="691.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Proportional representation, Article 48,</text><text x="46" y="712.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">hostile elites</text><rect x="495" y="632" width="375" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="511" y="662.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Circumstance</text><text x="511" y="691.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">