<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 655" width="900" height="655" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="655" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Anatomy of an evaluative paragraph</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Weimar's response to the economic crisis of 1923</text>
<line x1="60" y1="144" x2="60" y2="603" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EVALUATIVE CLAIM</text><text x="122" y="180.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">"... remarkably successful in the short term."</text><circle cx="60" cy="163.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="172.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="215" width="766" height="107" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="245" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PRECISE EVIDENCE</text><text x="122" y="271.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Passive resistance ended; Rentenmark; Dawes Plan (1924)</text><text x="122" y="299.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Reduced annual reparations and brought American loans.</text><circle cx="60" cy="268.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="277.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="334" width="766" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="364" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">HOW THE POLICY WORKED</text><text x="122" y="390.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Prices stabilized; industrial output recovered</text><circle cx="60" cy="373.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="382.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="425" width="766" height="107" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="455" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LIMITATION LINKED TO THE QUESTION</text><text x="122" y="481.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Dependence on short-term American credit</text><text x="122" y="509.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Exposed when loans were recalled after 1929: the solution to one crisis prepared the next.</text><circle cx="60" cy="478.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="487.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="544" width="766" height="79" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122" y="574" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">JUDGEMENT</text><text x="122" y="600.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Effective crisis management, not a cure for the underlying weakness</text><circle cx="60" cy="583.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="592.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text>
</svg>