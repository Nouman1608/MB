<rect width="900" height="517" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three recurring challenges</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Plan essays around them</text>
<rect x="30" y="124" width="270.6666666666667" height="250" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">POLITICAL</text><text x="46" y="178.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Attacks and instability</text><text x="46" y="207.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="207.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Spartacist rising (1919)</text><text x="46" y="233.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="233.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Kapp Putsch (1920)</text><text x="46" y="259.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="259.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Munich Putsch (1923)</text><text x="46" y="285.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="285.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Fragmented parliaments,</text><text x="61.2" y="306.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">unstable coalitions</text><text x="46" y="332.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="332.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Secessionist or communal</text><text x="61.2" y="353.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">conflict</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="250" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="330.6666666666667" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ECONOMIC</text><text x="330.6666666666667" y="178.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Crisis and poverty</text><text x="330.6666666666667" y="207.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="345.8666666666667" y="207.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Weimar hyperinflation (1923)</text><text x="330.6666666666667" y="233.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="345.8666666666667" y="233.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The Depression after 1929</text><text x="330.6666666666667" y="259.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="345.8666666666667" y="259.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Poverty and inequality in</text><text x="345.8666666666667" y="280.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">India and South Africa</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="615.3333333333334" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SOCIAL</text><text x="615.3333333333334" y="178.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Divided societies</text><text x="615.3333333333334" y="207.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="630.5333333333334" y="207.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Divisions of class, religion,</text><text x="630.5333333333334" y="228.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">caste or race</text><text x="615.3333333333334" y="254.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="630.5333333333334" y="254.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The legacy of discrimination</text><rect x="30" y="396" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="430.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Show how they interact</text><text x="50" y="460.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">For example, how economic crisis widened political divisions.</text>
