<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Policies: legal change and social change</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Separate what the law said from how society changed</text>
<clipPath id="tc124"><rect x="30" y="124" width="840" height="358" rx="14"/></clipPath><g clip-path="url(#tc124)"><rect x="30" y="124" width="176.8421052631579" height="49" fill="#b5d3cf"/><rect x="206.8421052631579" y="124" width="331.57894736842104" height="49" fill="#b5d3cf"/><text x="220.8421052631579" y="152.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Legal change</text><rect x="538.421052631579" y="124" width="331.57894736842104" height="49" fill="#f2e7b8"/><text x="552.421052631579" y="152.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Social change</text><rect x="30" y="173" width="176.8421052631579" height="152" fill="#dce9e7"/><text x="44" y="199.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">India</text><rect x="206.8421052631579" y="173" width="331.57894736842104" height="152" fill="#ffffff"/><text x="220.8421052631579" y="199.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Constitution outlawed untouchability;</text><text x="220.8421052631579" y="220.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">seats and posts reserved for Scheduled</text><text x="220.8421052631579" y="241.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Castes and Tribes. Hindu Code Bills</text><text x="220.8421052631579" y="262.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(mid-1950s) reformed family law,</text><text x="220.8421052631579" y="283.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">including women's rights in marriage</text><text x="220.8421052631579" y="304.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and inheritance</text><rect x="538.421052631579" y="173" width="331.57894736842104" height="152" fill="#ffffff"/><text x="552.421052631579" y="199.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ask how far practice followed the law</text><line x1="30" y1="325" x2="870" y2="325" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="325" width="176.8421052631579" height="68" fill="#dce9e7"/><text x="44" y="351.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Weimar Germany</text><rect x="206.8421052631579" y="325" width="331.57894736842104" height="68" fill="#ffffff"/><text x="220.8421052631579" y="351.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Women voted from 1919 and sat in the</text><text x="220.8421052631579" y="372.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Reichstag</text><rect x="538.421052631579" y="325" width="331.57894736842104" height="68" fill="#ffffff"/><text x="552.421052631579" y="351.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Social attitudes changed slowly</text><line x1="30" y1="393" x2="870" y2="393" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="393" width="176.8421052631579" height="89" fill="#dce9e7"/><text x="44" y="419.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">South Africa</text><rect x="206.8421052631579" y="393" width="331.57894736842104" height="89" fill="#ffffff"/><text x="220.8421052631579" y="419.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Reconstruction and Development</text><text x="220.8421052631579" y="440.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Programme (1994), then GEAR (1996),</text><text x="220.8421052631579" y="461.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sought growth and redistribution</text><rect x="538.421052631579" y="393" width="331.57894736842104" height="89" fill="#ffffff"/><text x="552.421052631579" y="419.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Economic inequality and unemployment</text><text x="552.421052631579" y="440.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">remained severe</text></g><line x1="206.8421052631579" y1="124" x2="206.8421052631579" y2="482" stroke="#c9d6d4" stroke-width="1.5"/><line x1="538.421052631579" y1="124" x2="538.421052631579" y2="482" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="124" width="840" height="358" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
