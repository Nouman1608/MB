<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="670" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Discharge by agreement</text>

<text x="450" y="132" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">The agreement to end the contract is itself a contract: it needs consideration</text><rect x="30" y="152" width="411" height="330" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="190" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Bilateral discharge</text><text x="235" y="216" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">both sides still have obligations</text><circle cx="110" cy="290" r="28" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="110" y="296" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><circle cx="360" cy="290" r="28" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="360" y="296" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><line x1="146" y1="276" x2="324" y2="276" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><line x1="324" y1="306" x2="146" y2="306" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><text x="235" y="262" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="middle">gives up rights</text><text x="235" y="330" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="middle">gives up rights</text><text x="54" y="370" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mutual release is consideration on both sides.</text><rect x="60" y="420" width="351" height="46" rx="23" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="449" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">mutual release</text><rect x="459" y="152" width="411" height="330" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="664" y="190" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="middle">Unilateral discharge</text><text x="664" y="216" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">one party has already performed</text><circle cx="539" cy="290" r="28" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="539" y="296" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><text x="539" y="340" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">performed</text><circle cx="789" cy="290" r="28" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="789" y="296" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><line x1="753" y1="290" x2="575" y2="290" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/><text x="664" y="276" font-size="15" font-weight="400" fill="#8a6d0d" text-anchor="middle">something new, or a deed</text><text x="483" y="370" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">B must give fresh consideration, or the release</text><text x="483" y="391" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">is made by deed.</text><rect x="489" y="420" width="351" height="46" rx="23" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="664" y="449" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">accord and satisfaction</text><rect x="30" y="506" width="411" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="539" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TERMS IN THE CONTRACT</text><text x="50" y="566.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Built-in endings</text><text x="50" y="594.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a notice period in an employment contract, or a</text><text x="50" y="615.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">condition on which it ends</text><rect x="459" y="506" width="411" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="539" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NOVATION</text><text x="479" y="566.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A new contract replaces the old</text><text x="479" y="594.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">often with a new party</text>
</svg>