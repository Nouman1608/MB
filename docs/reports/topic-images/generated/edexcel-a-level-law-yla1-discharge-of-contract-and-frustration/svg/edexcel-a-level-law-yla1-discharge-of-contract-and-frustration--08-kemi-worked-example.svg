<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 749" width="900" height="749" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="749" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: Kemi and the band</text>

<rect x="30" y="110" width="840" height="102" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="143.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Kemi books a band and pays a £1,000 deposit, with £2,000 due on the night. A week before, the</text><text x="50" y="165.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">lead singer is injured; Kemi booked the band for her singing. The band has spent £300 on</text><text x="50" y="187.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">rehearsals.</text><circle cx="54" cy="266" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="54" y="272.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="90" y="236" width="780" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="110" y="270.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Frustrated?</text><text x="110" y="298.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Personal contract; incapacity of the key performer makes performance radically different</text><text x="110" y="319.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(<tspan font-style="italic">Robinson v Davison</tspan>; <tspan font-style="italic">Condor v Baron Knights</tspan>). Not self-induced. Probably frustrated.</text><circle cx="54" cy="388" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="54" y="394.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="90" y="358" width="780" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="110" y="392.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Effect</text><text x="110" y="420.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Both discharged from future obligations.</text><circle cx="54" cy="489" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="54" y="495.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="90" y="495" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">1943 Act, s 1(2)</text><rect x="90" y="515" width="250" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="215" y="561" font-size="30" font-weight="700" fill="#2e6b62" text-anchor="middle">£1,000</text><text x="215" y="593" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">deposit paid</text><text x="215" y="617" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">recoverable by Kemi</text><rect x="355" y="515" width="250" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="480" y="561" font-size="30" font-weight="700" fill="#2e6b62" text-anchor="middle">£2,000</text><text x="480" y="593" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">due on the night</text><text x="480" y="617" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">ceases to be payable</text><rect x="620" y="515" width="250" height="120" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="745" y="561" font-size="30" font-weight="700" fill="#8a6d0d" text-anchor="middle">up to £300</text><text x="745" y="593" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">band’s expenses</text><text x="745" y="617" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">court may allow if just</text><rect x="30" y="655" width="840" height="64" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="693" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Compare <tspan font-style="italic">Gamerco</tspan>, where no deduction for expenses was allowed.</text>
</svg>