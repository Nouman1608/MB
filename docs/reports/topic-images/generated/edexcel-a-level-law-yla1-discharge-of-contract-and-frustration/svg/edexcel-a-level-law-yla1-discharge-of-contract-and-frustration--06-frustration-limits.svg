<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 868" width="900" height="868" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="868" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Frustration: what counts and what does not</text>

<text x="450" y="132" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">All three needed</text><rect x="30" y="146" width="268" height="64" rx="12" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><circle cx="60" cy="178" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="183.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="86" y="172" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">After the contract is</text><text x="86" y="193" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">made</text><rect x="316" y="146" width="268" height="64" rx="12" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><circle cx="346" cy="178" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="346" y="183.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="372" y="172" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">No one’s fault</text><rect x="602" y="146" width="268" height="64" rx="12" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><circle cx="632" cy="178" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="632" y="183.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="658" y="172" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Impossible, illegal or</text><text x="658" y="193" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">radically different</text><text x="450" y="240" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle"><tspan font-style="italic">Davis Contractors v Fareham UDC</tspan> [1956]: "a thing radically different from that which was undertaken"</text><rect x="30" y="262" width="411" height="44" rx="12" fill="#2e6b62" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="291" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">FRUSTRATED</text><rect x="459" y="262" width="411" height="44" rx="12" fill="#b5602e" stroke="#b5602e" stroke-width="2.5"/><text x="483" y="291" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">NOT FRUSTRATED</text><rect x="30" y="318" width="411" height="72" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="345.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Destruction</text><text x="44" y="372" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Taylor v Caldwell</tspan> (1863): music hall burned down</text><rect x="30" y="400" width="411" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="427.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Death or incapacity</text><text x="44" y="454" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Robinson v Davison</tspan> (1871); <tspan font-style="italic">Condor v Baron Knights</tspan></text><text x="44" y="474" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">[1966]</text><rect x="30" y="502" width="411" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="529.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Supervening illegality</text><text x="44" y="556" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Fibrosa</tspan> [1943]: delivery to Poland illegal on outbreak</text><text x="44" y="576" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">of war</text><rect x="30" y="604" width="411" height="72" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="631.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Government intervention, delay</text><text x="44" y="658" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Metropolitan Water Board v Dick Kerr</tspan> [1918]</text><rect x="30" y="686" width="411" height="72" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="713.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Purpose defeated</text><text x="44" y="740" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Krell v Henry</tspan> [1903]: coronation procession cancelled</text><rect x="459" y="318" width="411" height="92" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="473" y="345.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Purpose only partly defeated</text><text x="473" y="372" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Herne Bay Steam Boat v Hutton</tspan> [1903]: the cruise</text><text x="473" y="392" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">was still possible</text><rect x="459" y="420" width="411" height="92" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="473" y="447.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">More difficult or expensive</text><text x="473" y="474" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Davis Contractors</tspan>; <tspan font-style="italic">Tsakiroglou v Noblee Thorl</tspan> [1962]:</text><text x="473" y="494" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Suez closed, longer route</text><rect x="459" y="522" width="411" height="92" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="473" y="549.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Self-induced</text><text x="473" y="576" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Maritime National Fish v Ocean Trawlers</tspan> [1935]; <tspan font-style="italic">The</tspan></text><text x="473" y="596" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Super Servant Two</tspan> [1990]</text><rect x="459" y="624" width="411" height="72" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="473" y="651.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Foreseen, or covered by a term</text><text x="473" y="678" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">a <tspan font-style="italic">force majeure</tspan> clause that covers the event</text><rect x="30" y="774" width="840" height="64" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="812" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">An event before the contract is made is common mistake, not frustration.</text>
</svg>