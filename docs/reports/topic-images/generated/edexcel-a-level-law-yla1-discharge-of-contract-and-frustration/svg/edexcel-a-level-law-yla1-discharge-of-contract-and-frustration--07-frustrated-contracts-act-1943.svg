<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 642" width="900" height="642" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="642" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">After frustration: the 1943 Act</text>

<rect x="30" y="110" width="840" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="143" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">BEFORE THE ACT: COMMON LAW</text><text x="50" y="170.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Loss lay where it fell at the moment of frustration</text><text x="50" y="198.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Fibrosa</tspan> (1943): an advance payment could be recovered only on a total failure of consideration.</text><text x="50" y="219.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Parliament passed the Act the same year.</text><text x="450" y="266" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">LAW REFORM (FRUSTRATED CONTRACTS) ACT 1943</text><rect x="30" y="282" width="268" height="178" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="315" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">s 1(2)</text><text x="50" y="341.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Money paid before the</text><text x="50" y="365.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">event</text><text x="50" y="393.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">is recoverable</text><rect x="316" y="282" width="268" height="178" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="336" y="315" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">s 1(2)</text><text x="336" y="341.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Money payable before</text><text x="336" y="365.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">the event</text><text x="336" y="393.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">ceases to be payable</text><rect x="602" y="282" width="268" height="178" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="622" y="315" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">s 1(3)</text><text x="622" y="341.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A valuable benefit (not</text><text x="622" y="365.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">money)</text><text x="622" y="393.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the court may order a just</text><text x="622" y="414.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">sum: <tspan font-style="italic">BP Exploration v Hunt</tspan></text><text x="622" y="435.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">(No 2)</tspan> [1979]</text><rect x="30" y="478" width="840" height="134" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="511" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">s 1(2) EXPENSES: AT THE COURT’S DISCRETION</text><text x="50" y="538.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The payee may keep or recover expenses, up to the amount paid or payable, if just</text><text x="50" y="566.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Gamerco v ICM/Fair Warning</tspan> [1995]: stadium declared unsafe; the advance was repaid in full and nothing</text><text x="50" y="587.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">was allowed for the band’s expenses, because the promoters had lost much more.</text>
</svg>