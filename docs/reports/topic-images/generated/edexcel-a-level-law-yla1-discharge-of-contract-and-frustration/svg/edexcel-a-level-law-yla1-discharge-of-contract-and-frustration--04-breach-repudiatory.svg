<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 669" width="900" height="669" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="669" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Which breaches end a contract?</text>

<rect x="160" y="110" width="580" height="70" rx="14" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="140" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Breach</text><text x="450" y="164" font-size="15" font-weight="400" fill="#b5d3cf" text-anchor="middle">fails to perform, performs defectively, or will not perform</text><line x1="330" y1="182" x2="220" y2="226" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="570" y1="182" x2="680" y2="226" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="232" width="380" height="210" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="265" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EVERY BREACH</text><text x="50" y="292.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Right to damages</text><text x="50" y="320.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">e.g. breach of a warranty: <tspan font-style="italic">Bettini v Gye</tspan></text><text x="50" y="341.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">[1876]; a non-serious breach of an</text><text x="50" y="362.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">innominate term</text><rect x="450" y="232" width="420" height="211" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="470" y="265" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">REPUDIATORY BREACH</text><text x="470" y="292.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Damages and the OPTION to treat the</text><text x="470" y="317.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">contract as ended</text><text x="470" y="345.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="485.2" y="345.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">breach of a condition: <tspan font-style="italic">Poussard v Spiers</tspan> [1876]</text><text x="470" y="371.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="485.2" y="371.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">innominate term, deprives of substantially the</text><text x="485.2" y="392.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">whole benefit</text><text x="470" y="418.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="485.2" y="418.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">renunciation: making clear one will not perform</text><rect x="30" y="469" width="840" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="507" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Hong Kong Fir Shipping v Kawasaki Kisen Kaisha</tspan> [1962]: judge the consequences</text><rect x="80" y="559" width="740" height="28" rx="14" fill="url(#gradBr)"/><defs><linearGradient id="gradBr" x1="0" x2="1"><stop offset="0" stop-color="#dce9e7"/><stop offset="1" stop-color="#f2e7b8"/></linearGradient></defs><text x="80" y="617" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">minor consequences: damages only</text><text x="820" y="617" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="end">deprived of substantially the whole benefit</text><circle cx="230" cy="573" r="11" fill="#1e2a44"/><text x="230" y="551" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">unseaworthy for some weeks of a two-year charter</text>
</svg>