<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750" width="900" height="750" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="750" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Performance: the rule and its exceptions</text>

<rect x="30" y="110" width="840" height="134" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="143" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">THE STRICT RULE</text><text x="50" y="170.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Performance must be complete and exact</text><text x="50" y="198.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Cutter v Powell</tspan> (1795): a sailor died during the voyage; his widow recovered nothing for the weeks he</text><text x="50" y="219.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">had worked.</text><text x="450" y="270" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">EXCEPTIONS</text><rect x="30" y="286" width="411" height="134" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="319" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SUBSTANTIAL PERFORMANCE</text><text x="50" y="346.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Price less cost of defects</text><text x="50" y="374.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Hoenig v Isaacs</tspan> [1952]: decorating with minor</text><text x="50" y="395.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">defects</text><rect x="459" y="286" width="411" height="134" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="479" y="319" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">BUT NOT IF DEFECTS ARE SERIOUS</text><text x="479" y="346.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Nothing payable</text><text x="479" y="374.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Bolton v Mahadeva</tspan> [1972]: heating gave out</text><text x="479" y="395.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">fumes and heated poorly</text><rect x="30" y="436" width="411" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="469" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DIVISIBLE CONTRACTS</text><text x="50" y="496.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Pay for each completed part</text><text x="50" y="524.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">priced by stage, delivery or week</text><rect x="459" y="436" width="411" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="469" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ACCEPTED PART PERFORMANCE</text><text x="479" y="496.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A reasonable sum, if freely accepted</text><text x="479" y="524.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">contrast <tspan font-style="italic">Sumpter v Hedges</tspan> [1898]: no real</text><text x="479" y="545.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">choice</text><rect x="30" y="586" width="411" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="619" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PREVENTION</text><text x="50" y="646.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A reasonable sum for work done</text><text x="50" y="674.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Planché v Colburn</tspan> (1831): series cancelled by</text><text x="50" y="695.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the publisher</text><rect x="459" y="586" width="411" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="619" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TENDER OF PERFORMANCE</text><text x="479" y="646.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A refused offer to perform discharges</text><text x="479" y="674.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Startup v Macdonald</tspan> (1843): oil late on Saturday</text><text x="479" y="695.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">evening, but in time</text>
</svg>