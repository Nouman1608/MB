<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 556" width="900" height="556" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="556" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How a contract is discharged</text>

<rect x="330" y="110" width="240" height="60" rx="30" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="147" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">Contract</text><text x="450" y="200" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">obligations come to an end: discharged</text><path d="M450,210 C450,230 127.5,226 127.5,246" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="30" y="252" width="195" height="210" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="127.5" y="290" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">Performance</text><text x="46" y="322" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">both sides do what</text><text x="46" y="343" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">they promised</text><path d="M450,210 C450,230 342.5,226 342.5,246" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="245" y="252" width="195" height="210" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="342.5" y="290" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">Agreement</text><text x="261" y="322" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the parties agree to</text><text x="261" y="343" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">end it</text><path d="M450,210 C450,230 557.5,226 557.5,246" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="460" y="252" width="195" height="210" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="557.5" y="290" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle">Breach</text><text x="476" y="322" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">one side fails to</text><text x="476" y="343" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">perform, performs</text><text x="476" y="364" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">defectively or will not</text><text x="476" y="385" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">perform</text><path d="M450,210 C450,230 772.5,226 772.5,246" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="675" y="252" width="195" height="210" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="772.5" y="290" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="middle">Frustration</text><text x="691" y="322" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a later event, no</text><text x="691" y="343" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">one’s fault, makes</text><text x="691" y="364" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">performance</text><text x="691" y="385" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">impossible, illegal or</text><text x="691" y="406" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">radically different</text><path d="M30,486 L30,496 L440,496 L440,486" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="235" y="524" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">the normal, peaceful ending</text><path d="M460,486 L460,496 L870,496 L870,486" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="665" y="524" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">where disputes arise: Paper 2 focus</text>
</svg>