<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 781" width="900" height="781" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="781" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Anticipatory breach: sue now or wait?</text>

<rect x="80" y="110" width="740" height="72" rx="14" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="141" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Anticipatory breach</text><text x="450" y="166" font-size="15" font-weight="400" fill="#b5d3cf" text-anchor="middle">a party announces, before performance is due, that they will not perform</text><line x1="320" y1="184" x2="235" y2="230" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="580" y1="184" x2="665" y2="230" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="236" width="411" height="190" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="269" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">OPTION 1</text><text x="50" y="296.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Sue immediately</text><text x="50" y="324.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Hochster v De La Tour</tspan> (1853): a courier</text><text x="50" y="345.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">dismissed before his job began could sue at</text><text x="50" y="366.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">once.</text><rect x="459" y="236" width="411" height="190" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="269" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">OPTION 2</text><text x="479" y="296.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Wait for the date of performance</text><text x="479" y="324.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Keeps the contract alive, but bears the risk of</text><text x="479" y="345.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">later events.</text><line x1="664" y1="428" x2="664" y2="442" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="459" y="446" width="411" height="134" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="479" y="479" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">THE RISK</text><text x="479" y="506.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Avery v Bowden</tspan> (1855)</text><text x="479" y="534.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the claimant waited, war broke out, the contract</text><text x="479" y="555.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">was frustrated and the right to sue was lost</text><rect x="459" y="596" width="411" height="155" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="629" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">OR PERFORM AND CLAIM THE PRICE</text><text x="479" y="656.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">White and Carter v McGregor</tspan> [1962]</text><text x="479" y="684.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">advertisements displayed for three years despite</text><text x="479" y="705.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">cancellation, provided there is a legitimate</text><text x="479" y="726.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">interest</text><rect x="30" y="446" width="411" height="305" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="481.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The innocent party does not have to</text><text x="50" y="506.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">accept the breach at once.</text><text x="50" y="534.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Saying they must is a common mistake: the</text><text x="50" y="555.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">choice is theirs.</text>
</svg>