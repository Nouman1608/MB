<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="640" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From stopping war to building peace</text>

<text x="450" y="136" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">An Agenda for Peace (Boutros Boutros-Ghali, 1992)</text><rect x="30" y="150" width="187.5" height="150" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="123.75" y="197.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Preventive</text><text x="123.75" y="221.35999999999999" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">diplomacy</text><text x="123.75" y="247.16" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">stop disputes turning</text><text x="123.75" y="266.96" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">into war</text><line x1="220.5" y1="225" x2="242.5" y2="225" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="247.5" y="150" width="187.5" height="150" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="341.25" y="209.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Peacemaking</text><text x="341.25" y="235.4" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">bring the sides to</text><text x="341.25" y="255.20000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">agreement</text><line x1="438" y1="225" x2="460" y2="225" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="465" y="150" width="187.5" height="150" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="558.75" y="209.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Peacekeeping</text><text x="558.75" y="235.4" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">keep the agreed</text><text x="558.75" y="255.20000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">ceasefire</text><line x1="655.5" y1="225" x2="677.5" y2="225" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="682.5" y="150" width="187.5" height="150" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="776.25" y="187.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Post-conflict</text><text x="776.25" y="211.35999999999999" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">peacebuilding</text><text x="776.25" y="237.16" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">strengthen</text><text x="776.25" y="256.96" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">institutions so war</text><text x="776.25" y="276.76" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">does not return</text><rect x="30" y="330" width="410" height="120" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="235" y="384.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Negative peace</text><text x="235" y="412.07" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">no fighting: what peacekeeping mainly secures</text><rect x="460" y="330" width="410" height="120" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="665" y="374.45" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Positive peace</text><text x="665" y="401.57" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">causes such as injustice and poverty</text><text x="665" y="422.69" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">addressed: the aim of peacebuilding</text><line x1="444" y1="390" x2="456" y2="390" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="450" y="480" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Johan Galtung’s distinction</text><rect x="30" y="500" width="840" height="110" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="538.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Peacebuilding tools</text><text x="48" y="565.67" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">DDR (disarmament, demobilisation, reintegration); rebuilt courts and police; elections; transitional</text><text x="48" y="586.79" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">justice, e.g. Rwanda’s gacaca courts (closed 2012)</text>
</svg>