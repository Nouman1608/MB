<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 625" width="900" height="625" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="625" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">When a consequence becomes a cause</text>

<rect x="40" y="120" width="600" height="57" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="340" y="157" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">First World War ends</text><line x1="340" y1="181" x2="340" y2="215" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="40" y="221" width="600" height="106" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="340" y="258" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Treaty of Versailles, 28 June 1919</text><text x="340" y="285.12" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">German army limited to 100,000 men; Article 231 blamed Germany for the</text><text x="340" y="306.24" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">war</text><line x1="340" y1="331" x2="340" y2="365" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="40" y="371" width="600" height="85" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="340" y="408" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Resentment of the treaty</text><text x="340" y="435.12" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">helped the Nazis win support</text><line x1="340" y1="460" x2="340" y2="494" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="40" y="500" width="600" height="85" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="340" y="537" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Germany invades Poland, 1 September 1939</text><text x="340" y="564.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">the Second World War in Europe begins</text><text x="670" y="270" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">consequence</text><text x="670" y="292" font-size="16" font-weight="400" fill="#8a6d0d" text-anchor="start">of one war…</text><text x="670" y="560" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">…cause of</text><text x="670" y="582" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">the next</text>
</svg>