<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="600" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Long-term, short-term and trigger</text>

<text x="450" y="136" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Organising the causes of the First World War</text><rect x="30" y="150" width="300" height="270" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="187.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Long-term</text><text x="48" y="214.41" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">builds up over years</text><text x="48" y="234.87" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start"></text><text x="48" y="255.32999999999998" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">• Triple Alliance (1882) and</text><text x="48" y="275.79" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Triple Entente (complete by 1907)</text><text x="48" y="296.25" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">• rivalry for colonies</text><text x="48" y="316.71000000000004" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">• arms build-up</text><text x="48" y="337.17" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">• Balkan nationalism</text><rect x="350" y="150" width="250" height="270" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="368" y="187.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Short-term</text><text x="368" y="214.41" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">months before war</text><text x="368" y="234.87" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start"></text><text x="368" y="255.32999999999998" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">• July 1914 ultimatum to</text><text x="368" y="275.79" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Serbia</text><text x="368" y="296.25" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">• Austria-Hungary declares</text><text x="368" y="316.71000000000004" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">war, 28 July 1914</text><text x="368" y="337.17" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">• Russian and German</text><text x="368" y="357.63" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">mobilisation</text><rect x="620" y="150" width="250" height="270" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="638" y="187.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Trigger</text><text x="638" y="214.41" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">starts the fighting</text><text x="638" y="234.87" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start"></text><text x="638" y="255.32999999999998" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">• Franz Ferdinand</text><text x="638" y="275.79" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">assassinated in Sarajevo,</text><text x="638" y="296.25" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">28 June 1914</text><text x="638" y="316.71000000000004" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start"></text><text x="638" y="337.17" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">not the same as the most</text><text x="638" y="357.63" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">important cause</text><line x1="331" y1="285" x2="349" y2="285" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="601" y1="285" x2="619" y2="285" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="440" width="840" height="130" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="450" y="488.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Link them: how a local crisis became a European war</text><text x="450" y="515.67" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Germany backed Austria-Hungary, Russia backed Serbia, and Britain entered on 4 August 1914 after</text><text x="450" y="536.79" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Germany invaded Belgium. The alliances connect the causes.</text>
</svg>