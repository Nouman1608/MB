<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="690" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How the UN can respond to conflict</text>

<rect x="30" y="120" width="840" height="100" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="450" y="164.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Security Council: 15 members</text><text x="450" y="191.17000000000002" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">5 permanent members with a veto (China, France, Russia, UK, US) + 10 elected for two years</text><line x1="450" y1="224" x2="450" y2="258" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="262" width="260" height="210" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="160" y="300.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Chapter VI</text><text x="160" y="328.02" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">peaceful settlement of</text><text x="160" y="349.14" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">disputes: negotiation,</text><text x="160" y="370.26" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">mediation, arbitration</text><rect x="320" y="262" width="260" height="210" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="450" y="300.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Peacekeeping</text><text x="450" y="328.02" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">not in the Charter; grew up</text><text x="450" y="349.14" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">between Chapters VI and VII;</text><text x="450" y="370.26" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">needs consent</text><rect x="610" y="262" width="260" height="210" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="740" y="300.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Chapter VII</text><text x="740" y="328.02" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">action against threats to</text><text x="740" y="349.14" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">peace: sanctions (Art. 41),</text><text x="740" y="370.26" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">military force (Art. 42)</text><line x1="60" y1="500" x2="840" y2="500" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="60" y="528" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">persuade</text><text x="840" y="528" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">enforce</text><rect x="610" y="548" width="260" height="110" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.2"/><text x="740" y="587.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Peace enforcement</text><text x="740" y="613.4" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Korea, June 1950; Kuwait,</text><text x="740" y="633.1999999999999" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">November 1990</text><rect x="30" y="548" width="560" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="48" y="587.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The veto</text><text x="48" y="613.4" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">the UN cannot act against a permanent member or its close allies;</text><text x="48" y="633.1999999999999" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">often blocked action in the Cold War</text>
</svg>