<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 733" width="900" height="733" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="733" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The three principles of UN peacekeeping</text>

<rect x="30" y="110" width="840" height="95.48" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="84" cy="157.74" r="28" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="84" y="167.82000000000002" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="136" y="150.7" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Consent</text><text x="136" y="177.73999999999998" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">of the main parties to the conflict</text><rect x="30" y="217.48000000000002" width="840" height="95.48" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="84" cy="265.22" r="28" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="84" y="275.3" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="136" y="258.18" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Impartiality</text><text x="136" y="285.22" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the mission does not take sides</text><rect x="30" y="324.96000000000004" width="840" height="95.48" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="84" cy="372.70000000000005" r="28" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="84" y="382.78000000000003" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="136" y="365.66" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Non-use of force</text><text x="136" y="392.70000000000005" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">except in self-defence and defence of the mandate</text><text x="30" y="444.44000000000005" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Where the principles reached their limits</text><rect x="30" y="460.44000000000005" width="410" height="150" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="48" y="496.49000000000007" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Rwanda, 1994</text><text x="48" y="523.61" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">small mission (UNAMIR) present as genocide</text><text x="48" y="544.73" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">began in April; Council cut its size that</text><text x="48" y="565.85" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">month</text><rect x="460" y="460.44000000000005" width="410" height="150" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="478" y="496.49000000000007" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Srebrenica, July 1995</text><text x="478" y="523.61" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">over 8,000 Bosniak men and boys killed in a UN</text><text x="478" y="544.73" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“safe area” with lightly armed peacekeepers</text><text x="478" y="565.85" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">present</text><rect x="30" y="630.44" width="840" height="72.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="660.6400000000001" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Impartiality and minimal force fail when one side sets out to kill civilians. Many later missions</text><text x="450" y="681.7600000000001" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">are multidimensional.</text>
</svg>