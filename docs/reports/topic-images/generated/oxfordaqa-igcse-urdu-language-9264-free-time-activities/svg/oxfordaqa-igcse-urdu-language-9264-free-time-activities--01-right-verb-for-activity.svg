b62" text-anchor="end">‏دیکھنا‏</text><text x="480" y="312" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">for</text><text x="480" y="336" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">watching</text><text x="850" y="392" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏میں ہر رات ایک ڈراما دیکھتا ہوں‏</text><rect x="30" y="430" width="410" height="144" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="420" y="492" font-family="Noto Nastaliq Urdu" font-size="30" font-weight="400" fill="#2e6b62" text-anchor="end">‏کرنا‏</text><text x="50" y="472" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">for</text><text x="50" y="496" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">many activities</text><text x="420" y="552" font-family="Noto Nastaliq Urdu" font-size="22" font-weight="400" fill="#1e2a44" text-anchor="end">‏ورزش کرنا‏</text><text x="290" y="552" font-family="Noto Nastaliq Urdu" font-size="22" font-weight="400" fill="#1e2a44" text-anchor="end">‏تیراکی کرنا‏</text><text x="160" y="552" font-family="Noto Nastaliq Urdu" font-size="22" font-weight="400" fill="#1e2a44" text-anchor="end">‏سیر کرنا‏</text><rect x="460" y="430" width="410" height="144" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="850" y="492" font-family="Noto Nastaliq Urdu" font-size="30" font-weight="400" fill="#2e6b62" text-anchor="end">‏منانا‏</text><text x="480" y="472" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">for</text><text x="480" y="496" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">celebrating</text><text x="850" y="552" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏ہم عید مناتے ہیں‏</text><rect x="30" y="600" width="840" height="64" rx="12" fill="#f6ece4" stroke="#b5602e" stroke-width="2.5"/><circle cx="66" cy="632" r=