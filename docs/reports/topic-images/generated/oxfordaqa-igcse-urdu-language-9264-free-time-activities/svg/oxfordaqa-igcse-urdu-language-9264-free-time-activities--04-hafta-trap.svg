<rect width="900" height="620" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One word, two meanings</text>

<rect x="330" y="120" width="240" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><text x="450" y="190" font-family="Noto Nastaliq Urdu" font-size="40" font-weight="400" fill="#1e2a44" text-anchor="middle">‏ہفتہ‏</text><path d="M380,230 Q300,262 250,292" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><path d="M520,230 Q600,262 650,292" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="100" y="300" width="300" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="250" y="343" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">week</text><rect x="500" y="300" width="300" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="650" y="343" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Saturday</text><rect x="30" y="400" width="410" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="466" font-family="Noto Nastaliq Urdu" font-size="30" font-weight="400" fill="#1e2a44" text-anchor="middle">‏پچھلے ہفتے‏</text><text x="235" y="512" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">normally means "last week"</text><rect x="460" y="400" width="410" height="150" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="665" y="466" font-family="Noto Nastaliq Urdu" font-size="30" font-weight="400" fill="#1e2a44" text-anchor="middle">‏پچھلے ہفتے کے دن‏</text><text x="665" y="512" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">makes "last Saturday" explicit</text><text x="450" y="590" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">If the English says "last Saturday", add the extra words</text>
</svg>