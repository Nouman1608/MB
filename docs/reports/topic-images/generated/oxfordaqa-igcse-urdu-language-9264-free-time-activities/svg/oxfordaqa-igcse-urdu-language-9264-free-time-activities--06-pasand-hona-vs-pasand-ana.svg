<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="700" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Liking in general, liking one thing</text>

<rect x="30" y="110" width="410" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="416" y="162" font-family="Noto Nastaliq Urdu" font-size="30" font-weight="400" fill="#2e6b62" text-anchor="end">‏پسند ہونا‏</text><text x="54" y="156" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">general liking</text><text x="416" y="238" font-family="Noto Nastaliq Urdu" font-size="25" font-weight="400" fill="#1e2a44" text-anchor="end">‏مجھے مزاحیہ فلمیں پسند ہیں‏</text><text x="416" y="286" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">I like comic films.</text><rect x="460" y="110" width="410" height="200" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="846" y="162" font-family="Noto Nastaliq Urdu" font-size="30" font-weight="400" fill="#8a6d0d" text-anchor="end">‏پسند آنا‏</text><text x="484" y="148" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">one particular</text><text x="484" y="170" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">film, in the past</text><text x="846" y="238" font-family="Noto Nastaliq Urdu" font-size="25" font-weight="400" fill="#1e2a44" text-anchor="end">‏مجھے وہ فلم بہت پسند آئی‏</text><text x="846" y="286" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">I really liked that film.</text><text x="54" y="352" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Review frames that go beyond "it was good"</text><rect x="30" y="372" width="840" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="846" y="418" font-family="Noto Nastaliq Urdu" font-size="25" font-weight="400" fill="#1e2a44" text-anchor="end">‏اداکاری بہت عمدہ تھی، خاص طور پر ہیرو کی ماں کا کردار۔‏</text><text x="846" y="450" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">The acting was excellent, especially the role of the hero’s mother.</text><rect x="30" y="476" width="840" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="846" y="522" font-family="Noto Nastaliq Urdu" font-size="25" font-weight="400" fill="#1e2a44" text-anchor="end">‏مجھے آخری منظر سب سے زیادہ پسند آیا۔‏</text><text x="846" y="554" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">I liked the final scene most.</text><rect x="30" y="580" width="840" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="846" y="626" font-family="Noto Nastaliq Urdu" font-size="25" font-weight="400" fill="#1e2a44" text-anchor="end">‏ڈرامے کی ہر قسط پچھلی سے زیادہ دلچسپ تھی۔‏</text><text x="846" y="658" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Each episode of the drama was more interesting than the last.</text>
</svg>