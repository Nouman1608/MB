<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="600" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Past tense and the ergative marker</text>

<rect x="30" y="110" width="410" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Going: no</text><text x="188" y="152" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#b5602e" text-anchor="middle">‏نے‏</text><text x="54" y="176" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the verb is intransitive</text><text x="416" y="156" font-family="Noto Nastaliq Urdu" font-size="30" font-weight="400" fill="#2e6b62" text-anchor="end">‏جانا‏</text><circle cx="60" cy="240" r="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M53,240 l5,6 l10,-12" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="416" y="250" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="end">‏میں سنیما گیا‏</text><text x="416" y="284" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">I went to the cinema.</text><circle cx="60" cy="340" r="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M53,340 l5,6 l10,-12" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="416" y="350" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="end">‏ہم میچ دیکھنے گئے‏</text><text x="416" y="384" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">We went to watch a match.</text><circle cx="60" cy="440" r="15" fill="#f6ece4" stroke="#b5602e" stroke-width="2.5"/><path d="M54,434 l12,12 m0,-12 l-12,12" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="416" y="450" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#b5602e" text-anchor="end">‏میں نے سنیما گیا‏</text><text x="416" y="484" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">never with this verb</text><rect x="460" y="110" width="410" height="420" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="484" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Transitive past: add</text><text x="732" y="152" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#8a6d0d" text-anchor="middle">‏نے‏</text><text x="484" y="176" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the verb agrees with the object</text><circle cx="490" cy="240" r="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M483,240 l5,6 l10,-12" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="846" y="250" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="end">‏ہم نے میچ جیتا‏</text><text x="846" y="284" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">We won the match.</text><circle cx="490" cy="340" r="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M483,340 l5,6 l10,-12" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="846" y="350" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="end">‏میں نے ایک فلم دیکھی‏</text><text x="846" y="384" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">I watched a film (film is feminine).</text><text x="450" y="570" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Check every past-tense verb: does it need the ergative marker?</text>
</svg>