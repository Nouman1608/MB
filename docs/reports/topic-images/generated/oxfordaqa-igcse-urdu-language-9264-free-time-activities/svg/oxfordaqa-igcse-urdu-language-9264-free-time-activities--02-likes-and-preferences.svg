<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 870" width="900" height="870" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="870" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Saying what you like</text>

<rect x="30" y="110" width="840" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="148" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Thing liked</text><text x="330" y="148" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">singular noun, so</text><text x="500" y="150" font-family="Noto Nastaliq Urdu" font-size="22" font-weight="400" fill="#2e6b62" text-anchor="middle">‏ہے‏</text><text x="846" y="198" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏مجھے کرکٹ پسند ہے‏</text><text x="846" y="234" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">I like cricket.</text><rect x="30" y="260" width="840" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="298" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Plural thing liked</text><text x="330" y="298" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">plural noun, so</text><text x="480" y="300" font-family="Noto Nastaliq Urdu" font-size="22" font-weight="400" fill="#2e6b62" text-anchor="middle">‏ہیں‏</text><text x="846" y="348" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏مجھے مزاحیہ فلمیں پسند ہیں‏</text><text x="846" y="384" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">I like comic films.</text><rect x="30" y="410" width="840" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="448" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Activity: infinitive</text><text x="846" y="498" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏مجھے گانے سننا پسند ہے‏</text><text x="846" y="534" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">I like listening to songs.</text><rect x="30" y="560" width="840" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="598" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Keen on (oblique)</text><text x="380" y="600" font-family="Noto Nastaliq Urdu" font-size="22" font-weight="400" fill="#2e6b62" text-anchor="middle">‏پڑھنے کا شوق‏</text><text x="846" y="648" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏مجھے کتابیں پڑھنے کا شوق ہے‏</text><text x="846" y="684" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">I am keen on reading books.</text><rect x="30" y="710" width="840" height="140" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="748" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Preference</text><text x="330" y="750" font-family="Noto Nastaliq Urdu" font-size="22" font-weight="400" fill="#2e6b62" text-anchor="middle">‏سے زیادہ‏</text><text x="846" y="798" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏مجھے سنیما میں فلم دیکھنا گھر پر دیکھنے سے زیادہ پسند ہے‏</text><text x="846" y="834" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">I prefer watching a film at the cinema to watching at home.</text>
</svg>