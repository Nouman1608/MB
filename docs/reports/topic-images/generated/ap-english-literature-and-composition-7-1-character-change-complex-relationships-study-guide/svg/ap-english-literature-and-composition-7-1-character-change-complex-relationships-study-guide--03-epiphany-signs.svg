<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 744" width="900" height="744" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="744" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How to spot an epiphany</text>

<circle cx="450" cy="330" r="98" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><text x="450" y="308" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">EPIPHANY</text><text x="450" y="336" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">seeing things</text><text x="450" y="362" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">in a new light</text><rect x="30" y="110" width="280" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SIGN</text><text x="50" y="169.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Perception changes</text><text x="50" y="193.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">suddenly</text><text x="50" y="221.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">"she saw", "it came to her"</text><line x1="314" y1="175" x2="350" y2="272" stroke="#4a5568" stroke-width="3" marker-end="url(#ah)"/><rect x="590" y="110" width="280" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="610" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SIGN</text><text x="610" y="169.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Earlier details gain new</text><text x="610" y="193.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">meaning</text><line x1="586" y1="175" x2="550" y2="272" stroke="#4a5568" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="420" width="280" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="453" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SIGN</text><text x="50" y="479.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The narrator's tone or</text><text x="50" y="503.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">rhythm shifts</text><line x1="314" y1="485" x2="350" y2="388" stroke="#4a5568" stroke-width="3" marker-end="url(#ah)"/><rect x="590" y="420" width="280" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="610" y="453" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SIGN</text><text x="610" y="479.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The next action follows</text><text x="610" y="503.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">from the new view</text><line x1="586" y1="485" x2="550" y2="388" stroke="#4a5568" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="580" width="268" height="134" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="613" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TIED TO</text><text x="50" y="640.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">the central conflict</text><text x="50" y="668.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">often directly</text><rect x="316" y="580" width="268" height="134" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="336" y="613" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MAY AFFECT</text><text x="336" y="640.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">the plot</text><text x="336" y="668.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the character acts on it</text><rect x="602" y="580" width="268" height="134" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="622" y="613" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CAN BE</text><text x="622" y="640.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">ironic</text><text x="622" y="668.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">too late, or leads somewhere</text><text x="622" y="689.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">unexpected</text>
</svg>