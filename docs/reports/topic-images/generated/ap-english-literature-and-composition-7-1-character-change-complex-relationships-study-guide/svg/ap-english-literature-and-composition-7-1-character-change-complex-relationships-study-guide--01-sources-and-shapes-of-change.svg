<rect width="900" height="597" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Where change comes from, and its shape</text>

<rect x="30" y="110" width="400" height="137" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="143" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">SOURCE</text><text x="50" y="171" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A conflict of values</text><text x="50" y="200.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">duty against desire, loyalty against honesty,</text><text x="50" y="222.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">safety against freedom</text><rect x="470" y="110" width="400" height="137" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="490" y="143" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">SOURCE</text><text x="490" y="171" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A change of circumstances</text><text x="490" y="200.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">a loss, a move, a new responsibility</text><line x1="230" y1="253" x2="400" y2="299" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="670" y1="253" x2="500" y2="299" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="311" width="264" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="345" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Gradual</text><text x="50" y="369" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">over the course of the narrative</text><line x1="50" y1="519" x2="278" y2="519" stroke="#4a5568" stroke-width="2"/><path d="M54,515 C134,505 204,435 278,405" fill="none" stroke="#1e2a44" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="318" y="311" width="264" height="230" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="338" y="345" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Sudden</text><text x="338" y="369" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">an epiphany: a moment of</text><text x="338" y="389" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">realisation</text><line x1="338" y1="519" x2="566" y2="519" stroke="#4a5568" stroke-width="2"/><path d="M342,515 L462,511 L466,411 L566,405" fill="none" stroke="#2e6b62" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="464" cy="461" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="606" y="311" width="264" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="626" y="345" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Unchanged</text><text x="626" y="369" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">shows what pressure could not</text><text x="626" y="389" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">move</text><line x1="626" y1="519" x2="854" y2="519" stroke="#4a5568" stroke-width="2"/><path d="M630,485 L854,485" fill="none" stroke="#1e2a44" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><text x="450" y="571" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">time in the story →</text>
</svg>