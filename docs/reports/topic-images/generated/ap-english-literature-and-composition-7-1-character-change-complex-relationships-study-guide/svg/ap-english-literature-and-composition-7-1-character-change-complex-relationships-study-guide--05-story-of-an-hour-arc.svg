<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 681" width="900" height="681" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="681" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Story of an Hour: an epiphany</text>

<rect x="30" y="110" width="840" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="110" y1="470" x2="850" y2="470" stroke="#4a5568" stroke-width="2"/><line x1="110" y1="140" x2="110" y2="470" stroke="#4a5568" stroke-width="2"/><text x="98" y="156" font-size="16" font-weight="600" fill="#4a5568" text-anchor="end">joy</text><text x="98" y="464" font-size="16" font-weight="600" fill="#4a5568" text-anchor="end">grief</text><path d="M150,420 C220,430 260,410 300,400 S390,360 420,330 L470,190 C540,180 600,172 640,170 L700,172 L730,440" fill="none" stroke="#2e6b62" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="150" cy="420" r="9" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><circle cx="420" cy="330" r="9" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><circle cx="470" cy="190" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="640" cy="170" r="9" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><circle cx="730" cy="440" r="9" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="166" y="450" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start" font-style="italic">Weeps "with sudden, wild abandonment"</text><text x="436" y="360" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start" font-style="italic">"something coming to her"</text><text x="460" y="170" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="end" font-style="italic">"free, free, free!"</text><text x="640" y="150" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">"like a goddess of Victory"</text><text x="720" y="424" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="end" font-style="italic">husband walks in; she dies</text><text x="755" y="400" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start" font-style="italic">"of the joy</text><text x="755" y="420" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start" font-style="italic">that kills"</text><text x="150" y="496" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">BEFORE</text><text x="300" y="496" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">PRESSURE</text><text x="445" y="496" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">TURN</text><text x="640" y="496" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">AFTER</text><text x="760" y="496" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">IRONY</text><rect x="30" y="540" width="840" height="111" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="573" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FUNCTION</text><text x="50" y="604.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The epiphany grows from the conflict between marriage and selfhood; the ironic ending shows</text><text x="50" y="626.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">how little room the world allows for the new self she discovers.</text>
</svg>