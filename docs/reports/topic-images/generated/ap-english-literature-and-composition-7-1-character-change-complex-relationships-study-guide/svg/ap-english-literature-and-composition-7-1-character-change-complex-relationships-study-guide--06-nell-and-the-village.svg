<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 629" width="900" height="629" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="629" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: Nell and the village</text>

<rect x="30" y="110" width="375" height="213" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THE GROUP</text><text x="50" y="171" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Acts as one character</text><text x="50" y="200.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="200.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Women at the pump go quiet, then</text><text x="66.15" y="222.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">begin again "a little louder"</text><text x="50" y="249.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="249.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">"like a tide that had been held behind a</text><text x="66.15" y="271.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">hand"</text><text x="50" y="298.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="298.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Men find "business with their hats"</text><rect x="495" y="110" width="375" height="213" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="515" y="143" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">NELL</text><text x="515" y="171" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Resists, at a price</text><text x="515" y="200.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="531.15" y="200.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">"did not look at them"</text><text x="515" y="227.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="531.15" y="227.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">walks "as though the lane were hers"</text><text x="515" y="254.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="531.15" y="254.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">her graciousness "cost her something"</text><line x1="413" y1="194.5" x2="487" y2="194.5" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><text x="450" y="182.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">exclude</text><line x1="487" y1="238.5" x2="413" y2="238.5" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/><text x="450" y="264.5" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">defy</text><rect x="30" y="347" width="840" height="113" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="380" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THE SEXTON</text><text x="50" y="406.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Holds the door: the only gesture towards inclusion</text><text x="50" y="435.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Her thanks are "not returned"</text><rect x="30" y="484" width="840" height="115" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="517" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FUNCTION</text><text x="50" y="549.4" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Exclusion is something the community performs and the individual endures: defiance</text><text x="50" y="573.4" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">maintained at a price.</text>
</svg>