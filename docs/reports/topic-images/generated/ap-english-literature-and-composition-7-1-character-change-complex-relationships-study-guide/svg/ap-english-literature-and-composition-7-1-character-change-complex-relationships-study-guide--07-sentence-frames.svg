<rect width="900" height="795" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Sentence frames for writing about change</text>

<rect x="30" y="110" width="840" height="142" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="144" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CHANGE</text><text x="54" y="184" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">At the start,</text><rect x="159.78400000000002" y="162" width="97.792" height="32" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="170.78400000000002" y="184" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">character</text><text x="263.576" y="184" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">...;</text><text x="54" y="228" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">by the end, ...,</text><text x="182.39200000000002" y="228" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">because</text><rect x="261.932" y="206" width="212.65599999999998" height="32" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="272.932" y="228" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">conflict or circumstance</text><rect x="30" y="268" width="840" height="186" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="302" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EPIPHANY</text><text x="54" y="342" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">The moment when</text><rect x="219.724" y="320" width="171.44" height="32" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="230.724" y="342" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">detail of realisation</text><text x="397.164" y="342" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">marks an epiphany:</text><text x="54" y="386" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">it ties directly to</text><rect x="196.612" y="364" width="140.19199999999998" height="32" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="207.612" y="386" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">central conflict</text><text x="342.804" y="386" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">and leads</text><rect x="54" y="408" width="97.792" height="32" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="65" y="430" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">character</text><text x="157.792" y="430" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">to</text><rect x="181.478" y="408" width="70.672" height="32" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="192.478" y="430" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">action</text><text x="258.15" y="430" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">.</text><rect x="30" y="470" width="840" height="186" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="504" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GROUP</text><text x="54" y="544" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">The</text><rect x="93.75999999999999" y="522" width="68.47999999999999" height="32" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="104.75999999999999" y="544" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">group</text><text x="168.23999999999998" y="544" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">acts as a single character,</text><rect x="397.9" y="522" width="57.728" height="32" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="408.9" y="544" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">verb</text><text x="461.628" y="544" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">,</text><text x="54" y="588" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">and so reveals a collective attitude of</text><rect x="378.538" y="566" width="82.784" height="32" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="389.538" y="588" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">attitude</text><text x="54" y="632" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">towards</text><rect x="129.81400000000002" y="610" width="98.336" height="32" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="140.81400000000002" y="632" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">individual</text><text x="234.15000000000003" y="632" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">.</text><text x="450" y="672" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><rect x="30" y="676" width="411" height="89" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="235.5" y="712" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Evidence</text><text x="235.5" y="740.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">a quoted word or detail in each sentence</text><rect x="459" y="676" width="411" height="89" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="664.5" y="712" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Function</text><text x="664.5" y="740.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">what the change, or its absence, means</text>
</svg>