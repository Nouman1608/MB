ke-width="2.5"/><text x="230" y="271" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">GROUP</text><text x="230" y="425" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">can act as one character</text><circle cx="620" cy="243" r="26" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><path d="M584,311 Q620,255 656,311 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="620" y="345" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">INDIVIDUAL</text><line x1="370" y1="225" x2="570" y2="225" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="470" y="211" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">includes or excludes</text><line x1="570" y1="285" x2="370" y2="285" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><text x="470" y="311" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle">responds</text><rect x="30" y="470" width="268" height="157" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="503" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ASK 1</text><text x="50" y="529.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">What does the group do?</text><text x="50" y="557.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">speaks, falls silent, watches,</text><text x="50" y="578.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">excludes</text><rect x="316" y="470" width="268" height="157" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="336" y="503" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ASK 2</text><text x="336" y="529.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">How does the character</text><text x="336" y="553.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">respond?</text><text x="336" y="581.8" font-size="16" font-weight="400" 