<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Tracking change: before to after</text>

<circle cx="107" cy="124" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="107" y="130.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="30" y="150" width="154" height="181" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="179.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Before</text><text x="44" y="207.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">What do they</text><text x="44" y="228.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">believe, want or</text><text x="44" y="249.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">see at the start?</text><text x="107" y="365" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">evidence</text><rect x="30" y="375" width="154" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="42" y="399" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">early thoughts,</text><text x="42" y="419" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">speech, habits</text><line x1="185" y1="240.5" x2="200" y2="240.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><circle cx="278" cy="124" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="278" y="130.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="201" y="150" width="154" height="181" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="215" y="179.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Pressure</text><text x="215" y="207.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">What conflict of</text><text x="215" y="228.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">values or</text><text x="215" y="249.8" font-size="16" font-weight="400" fill="#4a556