>perception or</text><text x="384" y="439" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">tone</text><line x1="527" y1="240.5" x2="542" y2="240.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><circle cx="620" cy="124" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="620" y="130.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="543" y="150" width="154" height="181" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="557" y="179.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">After</text><text x="557" y="207.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">What do they</text><text x="557" y="228.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">now believe,</text><text x="557" y="249.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">want or see? Or</text><text x="557" y="270.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">what refuses to</text><text x="557" y="291.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">change?</text><text x="620" y="365" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">evidence</text><rect x="543" y="375" width="154" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="555" y="399" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">later thoughts,</text><text x="555" y="419" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">speech, action</text><line x1="698" y1="240.5" x2="713" y2="240.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><circle cx="791" cy="124" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="791" y="130.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="714" y="150" width="154" height="181" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="728" y="179.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Function</text><text x="728" y="207.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">What does the</text><text x="728" y="228.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">change, or its</text><text x="728" y="249.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">absence, mean</text><text x="728" y="270.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">for the story?</text><text x="791" y="365" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">evidence</text><rect x="714" y="375" width="154" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="726" y="399" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">link to the central</text><text x="726" y="419" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">conflict and the</text><text x="726" y="439" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">ending</text>
</svg>