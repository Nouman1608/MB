oke-linecap="round" /><rect x="659.3543399209535" y="150" width="164.368" height="64" fill="#f4f6f6"/><text x="741.5383399209535" y="165" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">4 Jan 1933</text><text x="741.5383399209535" y="185" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Papen meets Hitler</text><text x="741.5383399209535" y="205" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">at Schröder's house</text><path d="M295.2964426875791,266 L295.2964426875791,282 L295.2964426875791,316" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="214.1444426875791" y="318" width="162.304" height="64" fill="#f4f6f6"/><text x="295.2964426875791" y="333" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">August 1932</text><text x="295.2964426875791" y="353" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Hindenburg refuses</text><text x="295.2964426875791" y="373" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Hitler</text><path d="M646.7588932805523,266 L646.7588932805523,282 L646.7588932805523,316" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="565.6228932805524" y="318" width="162.272" height="64" fill="#f4f6f6"/><text x="646.7588932805523" y="333" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">December 1932</text><text x="646.7588932805523" y="353" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Schleicher courts</text><text x="646.7588932805523" y="373" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Strasser and unions</text><path d="M798.458498023589,266 L798.458498023589,282 L802.1748932805524,316" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="735.8948932805524" y="318" width="132.56" height="44" fill="#f4f6f6"/>