<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 940" width="900" height="940" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="940" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From Chancellor to Führer, 1933-34</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Drawn to scale: eighteen months to total power</text>
<line x1="110" y1="168" x2="870" y2="168" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="174" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Jan 1933</text><line x1="110" y1="275.5" x2="870" y2="275.5" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="281.5" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Apr</text><line x1="110" y1="383" x2="870" y2="383" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="389" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Jul</text><line x1="110" y1="490.5" x2="870" y2="490.5" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="496.5" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Oct</text><line x1="110" y1="598" x2="870" y2="598" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="604" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Jan 1934</text><line x1="110" y1="705.5" x2="870" y2="705.5" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="711.5" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Apr</text><line x1="110" y1="813" x2="870" y2="813" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="819" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Jul</text><line x1="110" y1="884.6666666666993" x2="870" y2="884.6666666666993" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="890.6666666666993" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Sep</text><line x1="470" y1="168" x2="470" y2="884.6666666666993" stroke="#1e2a44" stroke-width="4" stroke-linecap="round"/><text x="430" y="138" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">DESTROYING OPPOSITION</text><text x="510" y="138" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TAKING POWER</text><path d="M470,202.07103825135437 L486,202.07103825135437 L504,202.07103825135434" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="187.47103825135434" width="216.464" height="46" fill="#f4f6f6"/><text x="510" y="206.27103825135435" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">30 January 1933</text><text x="510" y="227.27103825135435" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Hitler appointed Chancellor</text><path d="M470,234.37978142076236 L454,234.37978142076236 L436,234.37978142076236" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="143.11199999999997" y="219.77978142076236" width="291.88800000000003" height="67" fill="#f4f6f6"/><text x="430" y="238.57978142076237" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">27-28 February</text><text x="430" y="259.5797814207624" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Reichstag Fire; decree suspends civil</text><text x="430" y="280.5797814207624" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">liberties; communists arrested</text><path d="M470,244.36612021855626 L486,244.36612021855626 L504,254.07103825135434" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="239.47103825135434" width="339.08799999999997" height="67" fill="#f4f6f6"/><text x="510" y="258.27103825135435" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">March</text><text x="510" y="279.27103825135435" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Election: Nazis 43.9 per cent, still short of a</text><text x="510" y="300.27103825135435" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">majority</text><path d="M470,265.5136612022061 L486,265.5136612022061 L504,327.07103825135437" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="312.47103825135434" width="315.44" height="67" fill="#f4f6f6"/><text x="510" y="331.27103825135435" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">23 March</text><text x="510" y="352.27103825135435" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Enabling Act, 444 to 94: KPD barred, SA</text><text x="510" y="373.27103825135435" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">outside, Centre Party votes yes</text><path d="M470,312.508196721265 L454,312.508196721265 L436,312.508196721265" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="248.104" y="297.90819672126497" width="186.896" height="46" fill="#f4f6f6"/><text x="430" y="316.708196721265" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">2 May</text><text x="430" y="337.708196721265" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Trade unions abolished</text><path d="M470,398.2732240437308 L454,398.2732240437308 L436,398.2732240437308" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="139.64" y="383.6732240437308" width="295.36" height="46" fill="#f4f6f6"/><text x="430" y="402.4732240437308" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">14 July</text><text x="430" y="423.4732240437308" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Other parties banned: one-party state</text><path d="M470,811.2377049180536 L454,811.2377049180536 L436,811.2377049180536" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="181.22399999999996" y="796.6377049180536" width="253.77600000000004" height="67" fill="#f4f6f6"/><text x="430" y="815.4377049180536" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">30 June 1934</text><text x="430" y="836.4377049180536" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Night of the Long Knives: Röhm,</text><text x="430" y="857.4377049180536" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Schleicher, Strasser killed</text><path d="M470,850.008196721265 L486,850.008196721265 L504,850.008196721265" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="835.408196721265" width="335.84" height="67" fill="#f4f6f6"/><text x="510" y="854.2081967212649" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">2 August 1934</text><text x="510" y="875.2081967212649" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Hindenburg dies; Hitler merges the offices;</text><text x="510" y="896.2081967212649" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">army oath</text><circle cx="470" cy="202.07103825135437" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="234.37978142076236" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="244.36612021855626" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="265.5136612022061" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="312.508196721265" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="398.2732240437308" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="811.2377049180536" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="850.008196721265" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/>
</svg>