<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 715" width="900" height="715" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="715" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How the terror state worked</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A small police force that relied on ordinary Germans</text>
<rect x="225" y="124" width="450" height="113" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">HIMMLER</text><text x="450" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">The SS</text><text x="450" y="212.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Absorbed the political police</text><line x1="380" y1="239" x2="230" y2="273" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="520" y1="239" x2="670" y2="273" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="100" y="295" width="320" height="88" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="260" y="329.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Gestapo</text><text x="260" y="358.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Monitored opponents</text><rect x="480" y="295" width="320" height="88" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="640" y="329.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">SD</text><text x="640" y="358.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Heydrich's intelligence service</text><line x1="450" y1="435" x2="450" y2="405" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><text x="462" y="427" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">information flows up</text><rect x="160" y="439" width="580" height="88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="473.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Denunciations by ordinary Germans</text><text x="450" y="502.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Block wardens reported on households</text><rect x="30" y="547" width="270.6666666666667" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="583" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COURTS</text><text x="44" y="608.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Nazified</text><text x="44" y="635" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">People's Court (1934) for political</text><text x="44" y="655" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">cases</text><rect x="314.6666666666667" y="547" width="270.6666666666667" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="328.6666666666667" y="573" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CAMPS</text><text x="328.6666666666667" y="598.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">From March 1933</text><text x="328.6666666666667" y="625" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Dachau: communists, socialists,</text><text x="328.6666666666667" y="645" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">later "asocials", Jehovah's</text><text x="328.6666666666667" y="665" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Witnesses, homosexual men</text><rect x="599.3333333333334" y="547" width="270.6666666666667" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="613.3333333333334" y="583" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PROPAGANDA</text><text x="613.3333333333334" y="608.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Goebbels' ministry</text><text x="613.3333333333334" y="635" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Best when it reinforced existing</text><text x="613.3333333333334" y="655" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">beliefs</text>
</svg>