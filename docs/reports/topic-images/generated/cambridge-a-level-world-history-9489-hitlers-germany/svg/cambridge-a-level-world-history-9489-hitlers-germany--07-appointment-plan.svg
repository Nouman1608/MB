<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="610" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why was Hitler appointed in January 1933?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Separate preconditions from the trigger</text>
<rect x="30" y="124" width="410" height="187" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PRECONDITIONS</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Why he could be considered</text><text x="50" y="211.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The Depression</text><text x="50" y="236.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="236.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Brüning's decree government</text><text x="50" y="261.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="261.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">37 per cent in July 1932</text><text x="50" y="286.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="286.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">SA, propaganda, elite funding</text><rect x="460" y="124" width="410" height="187" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="156" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">TRIGGER</text><text x="480" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Why Hindenburg chose him then</text><text x="480" y="211.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.2" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Schleicher's failure</text><text x="480" y="236.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.2" y="236.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Papen's intrigue</text><text x="480" y="261.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.2" y="261.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Hindenburg accepts Hitler in a cabinet of</text><text x="495.2" y="282.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">conservatives</text><rect x="30" y="333" width="840" height="112" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="365" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">KEY EVIDENCE</text><text x="50" y="391.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The Nazi vote was falling in November 1932</text><text x="50" y="420.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Strong evidence that the trigger was decisive</text><rect x="30" y="467" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="501.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement</text><text x="50" y="531.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Without mass support Hitler would not have been an option; without the elite intrigue he might not</text><text x="50" y="553.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">have been appointed.</text>
</svg>