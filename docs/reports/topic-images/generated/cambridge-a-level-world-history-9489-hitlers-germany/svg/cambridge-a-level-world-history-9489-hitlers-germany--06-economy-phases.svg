<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 765" width="900" height="765" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="765" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Recovery, then rearmament</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Two phases with different aims</text>
<rect x="30" y="124" width="397" height="233" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="179.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1933-36: RECOVERY</text><text x="50" y="207.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Schacht</text><text x="50" y="236.3" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="236.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Deficit financing; Mefo bills hide rearmament</text><text x="50" y="262.3" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="262.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Law for the Reduction of Unemployment</text><text x="65.2" y="283.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(June 1933): autobahns</text><text x="50" y="309.3" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="309.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Reich Labour Service compulsory (1935)</text><line x1="433" y1="240.5" x2="467" y2="240.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="124" width="397" height="233" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="493" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1936-39: REARMAMENT</text><text x="493" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Göring</text><text x="493" y="212.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="508.2" y="212.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Built on Schacht's New Plan (1934): imports</text><text x="508.2" y="233.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">controlled by bilateral deals</text><text x="493" y="259.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="508.2" y="259.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Four Year Plan (1936): ready for war in four</text><text x="508.2" y="280.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">years</text><text x="493" y="306.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="508.2" y="306.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Synthetic fuel and rubber; state steelworks</text><text x="493" y="332.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="508.2" y="332.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Schacht resigns over the pace (1937)</text><rect x="30" y="379" width="840" height="113" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="411" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">GUNS OR BUTTER</text><text x="450" y="438.6" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle">Scarce foreign currency</text><text x="450" y="467.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Food imports competed with raw materials for rearmament</text><polygon points="450,554 416,624 484,624" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><line x1="210" y1="588" x2="690" y2="520" stroke="#1e2a44" stroke-width="7" stroke-linecap="round"/><circle cx="450" cy="554" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="210" y1="588" x2="210" y2="628" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="628" width="360" height="105" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="46" y="658.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">What workers lost</text><text x="46" y="687.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="687.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Wages frozen; hours rose</text><text x="46" y="712.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="712.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Independent unions replaced by the DAF</text><line x1="690" y1="520" x2="690" y2="560" stroke="#1e2a44" stroke-width="3"/><rect x="510" y="560" width="360" height="126" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="526" y="590.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">What workers got</text><text x="526" y="619.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="541.2" y="619.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Unemployment under half a million by</text><text x="541.2" y="640.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">1938</text><text x="526" y="665.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="541.2" y="665.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Strength through Joy; Beauty of Labour</text>
</svg>