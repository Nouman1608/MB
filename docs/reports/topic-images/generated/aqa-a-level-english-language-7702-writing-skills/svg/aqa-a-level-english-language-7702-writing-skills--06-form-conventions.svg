<rect width="900" height="640" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Conventions of the named form</text>

<rect x="40" y="115" width="260" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="52" y="127" width="236" height="46" rx="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="170" y="157" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Opinion article</text><circle cx="68" cy="201" r="5" fill="#2e6b62"/><text x="82" y="207" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">headline; possibly a</text><text x="82" y="227" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">standfirst</text><circle cx="68" cy="253" r="5" fill="#2e6b62"/><text x="82" y="259" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">clear line of argument</text><circle cx="68" cy="285" r="5" fill="#2e6b62"/><text x="82" y="291" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">anecdote or hook</text><circle cx="68" cy="317" r="5" fill="#2e6b62"/><text x="82" y="323" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">memorable close</text><rect x="320" y="115" width="260" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="332" y="127" width="236" height="46" rx="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="450" y="157" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Blog post</text><circle cx="348" cy="201" r="5" fill="#2e6b62"/><text x="362" y="207" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">personal voice</text><circle cx="348" cy="233" r="5" fill="#2e6b62"/><text x="362" y="239" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">direct address</text><circle cx="348" cy="265" r="5" fill="#2e6b62"/><text x="362" y="271" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">shorter paragraphs</text><circle cx="348" cy="297" r="5" fill="#2e6b62"/><text x="362" y="303" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">informal but controlled</text><rect x="600" y="115" width="260" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="612" y="127" width="236" height="46" rx="9" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="730" y="157" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Speech or talk</text><circle cx="628" cy="201" r="5" fill="#2e6b62"/><text x="642" y="207" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">greeting to the named</text><text x="642" y="227" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">audience</text><circle cx="628" cy="253" r="5" fill="#2e6b62"/><text x="642" y="259" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">inclusive pronouns</text><circle cx="628" cy="285" r="5" fill="#2e6b62"/><text x="642" y="291" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">triples, repetition</text><circle cx="628" cy="317" r="5" fill="#2e6b62"/><text x="642" y="323" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">signposting; call to</text><text x="642" y="343" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">action</text><rect x="180" y="385" width="260" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="192" y="397" width="236" height="46" rx="9" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><text x="310" y="427" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Letter</text><circle cx="208" cy="471" r="5" fill="#2e6b62"/><text x="222" y="477" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">salutation and sign-off</text><circle cx="208" cy="503" r="5" fill="#2e6b62"/><text x="222" y="509" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">clear reason for writing</text><circle cx="208" cy="535" r="5" fill="#2e6b62"/><text x="222" y="541" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">courteous register</text><rect x="460" y="385" width="260" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="472" y="397" width="236" height="46" rx="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="590" y="427" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Leaflet or guide</text><circle cx="488" cy="471" r="5" fill="#2e6b62"/><text x="502" y="477" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">headings, short sections</text><circle cx="488" cy="503" r="5" fill="#2e6b62"/><text x="502" y="509" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">imperatives</text><circle cx="488" cy="535" r="5" fill="#2e6b62"/><text x="502" y="541" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">practical advice</text><text x="450" y="615" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">A standfirst is a short summary line under the headline.</text>
</svg>