<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="660" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Explaining concepts to non-specialists</text>

<rect x="40" y="115" width="400" height="190" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="76" cy="153" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="76" y="159.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="106" y="160" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Example first, label second</text><text x="64" y="205" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"When you say 'gonna' instead of</text><text x="64" y="228" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">'going to', you're doing what</text><text x="64" y="251" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">linguists call elision."</text><rect x="460" y="115" width="400" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="496" cy="153" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="496" y="159.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="526" y="160" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Analogy</text><text x="484" y="205" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"Dialects are like local recipes for</text><text x="484" y="228" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">the same dish: different ingredients,</text><text x="484" y="251" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">all of them real food."</text><rect x="40" y="325" width="400" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="363" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="76" y="369.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="106" y="370" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Everyday scenario</text><text x="64" y="415" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a job interview, a family argument, a</text><text x="64" y="438" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">classroom</text><rect x="460" y="325" width="400" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="496" cy="363" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="496" y="369.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="526" y="370" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Brief definition in passing</text><text x="484" y="415" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"prescriptivists, people who believe</text><text x="484" y="438" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">there's one correct way to speak"</text><rect x="40" y="545" width="820" height="90" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="450" y="580" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Real ideas (prestige, accommodation, change as natural, accent versus dialect),</text><text x="450" y="608" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">so the reader feels informed rather than lectured.</text>
</svg>