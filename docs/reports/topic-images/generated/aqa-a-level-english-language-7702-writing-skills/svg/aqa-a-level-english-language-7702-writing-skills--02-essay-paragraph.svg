<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 631" width="900" height="631" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="631" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">An academic essay paragraph</text>

<rect x="40" y="118" width="170" height="74" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="70" cy="155" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="70" y="160.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="96" y="161" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Claim</text><rect x="222" y="118" width="638" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="240" y="149" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Technology accelerates the spread of new forms more than it</text><text x="240" y="173" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">creates them.</text><line x1="125" y1="192" x2="125" y2="208" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="40" y="210" width="170" height="98" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><circle cx="70" cy="259" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="70" y="264.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="96" y="265" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Evidence</text><rect x="222" y="210" width="638" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="240" y="241" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">The conversion of "text" from noun to verb follows a process</text><text x="240" y="265" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">English has used for centuries, as in "to email" or earlier</text><text x="240" y="289" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"to telephone".</text><line x1="125" y1="308" x2="125" y2="324" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="40" y="326" width="170" height="70" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="70" cy="361" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="70" y="366.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="96" y="367" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Explanation</text><rect x="222" y="326" width="638" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="240" y="367" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">The process is old; only the speed of diffusion is new.</text><line x1="125" y1="396" x2="125" y2="412" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="40" y="414" width="170" height="74" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="70" cy="451" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="70" y="456.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="96" y="457" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluation</text><rect x="222" y="414" width="638" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="240" y="445" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">This suggests the question overstates technology's role as a</text><text x="240" y="469" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">cause, though it is central to how quickly change spreads.</text><rect x="40" y="510" width="820" height="96" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="64" y="544" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Essay frame</text><text x="64" y="574" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Introduction defines terms and states a line of argument; each paragraph makes one</text><text x="64" y="596" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">evaluative claim; the conclusion answers the question with a qualified judgement.</text>
</svg>