<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="620" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Writing analytically about texts</text>

<rect x="40" y="115" width="400" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="240" y="152" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle">Leads to summary</text><rect x="130" y="185" width="220" height="60" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="240" y="222" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">"The writer says"</text><text x="240" y="290" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">terminology dropped in</text><text x="240" y="312" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">with no purpose</text><rect x="460" y="115" width="400" height="230" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="660" y="152" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">Leads to analysis</text><rect x="485" y="178" width="110" height="46" rx="9" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="540" y="207" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">represents</text><rect x="605" y="178" width="110" height="46" rx="9" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="660" y="207" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">constructs</text><rect x="725" y="178" width="110" height="46" rx="9" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="780" y="207" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">positions</text><rect x="485" y="240" width="110" height="46" rx="9" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="540" y="269" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">frames</text><rect x="605" y="240" width="110" height="46" rx="9" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="660" y="269" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">presupposes</text><text x="660" y="325" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">what a text does, how, and why</text><rect x="40" y="365" width="820" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="64" y="400" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Embed short quotations in your own syntax</text><text x="64" y="436" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Text A's verb</text><rect x="190" y="413" width="92" height="34" rx="8" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="236" y="436" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">"mangle"</text><text x="292" y="436" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">represents English as a fragile object</text><text x="64" y="468" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">not a long quotation followed by "this shows".</text><rect x="40" y="505" width="820" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="64" y="540" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Comparative connectives</text><text x="64" y="572" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"Whereas"  ·  "Similarly"  ·  "By contrast"  ·  "Both texts... but"  ·  "Where Text A..., Text B..."</text>
</svg>