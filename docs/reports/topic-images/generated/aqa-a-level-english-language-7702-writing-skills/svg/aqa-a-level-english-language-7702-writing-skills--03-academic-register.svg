<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Academic register in practice</text>

<text x="370" y="130" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">Avoid</text><text x="690" y="130" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">Use</text><text x="40" y="183" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Hedging</text><rect x="260" y="145" width="220" height="60" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="370" y="181" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">certainty</text><line x1="484" y1="175" x2="516" y2="175" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="520" y="145" width="340" height="60" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="690" y="181" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">"suggests", "may", "tends to"</text><text x="40" y="257" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Precise terminology</text><rect x="260" y="219" width="220" height="60" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="370" y="255" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">"bad grammar"</text><line x1="484" y1="249" x2="516" y2="249" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="520" y="219" width="340" height="60" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="690" y="255" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">"levelled past tense of BE"</text><text x="40" y="331" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Attribution</text><rect x="260" y="293" width="220" height="60" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="370" y="329" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">"experts say"</text><line x1="484" y1="323" x2="516" y2="323" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="520" y="293" width="340" height="60" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="690" y="319" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">"Milroy's Belfast research</text><text x="690" y="339" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">indicates..."</text><text x="40" y="405" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Signposting</text><rect x="260" y="367" width="220" height="60" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="370" y="403" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">unlinked points</text><line x1="484" y1="397" x2="516" y2="397" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="520" y="367" width="340" height="60" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="690" y="403" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">"However", "By contrast"</text><text x="40" y="479" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Impersonal or reasoned</text><rect x="260" y="441" width="220" height="60" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="370" y="477" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">chatty first person</text><line x1="484" y1="471" x2="516" y2="471" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="520" y="441" width="340" height="60" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="690" y="467" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">"It could be argued that", "I</text><text x="690" y="487" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">would argue"</text><text x="40" y="553" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Counter-argument</text><rect x="260" 