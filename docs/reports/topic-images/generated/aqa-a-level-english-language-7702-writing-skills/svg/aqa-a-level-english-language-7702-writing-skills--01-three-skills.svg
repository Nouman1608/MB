" font-weight="700" fill="#4a5568" text-anchor="start">Where</text><text x="342" y="282" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Section B analysis of</text><text x="342" y="303" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">two texts</text><text x="342" y="345" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Specification</text><text x="342" y="369" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Writing analytically</text><text x="342" y="390" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">about texts as parts of</text><text x="342" y="411" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">discourses</text><line x1="342" y1="430" x2="558" y2="430" stroke="#c9d6d4" stroke-width="2"/><text x="342" y="455" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Register</text><text x="342" y="479" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">formal, precise,</text><text x="342" y="499" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">comparative</text><rect x="600" y="115" width="260" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="612" y="127" width="236" height="96" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="730" y="162" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Directed writing</text><text x="730" y="200" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">30 marks</text><text x="622" y="258" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Where</text><text x="622" y="282" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Section B directed</text><text x="622" y="303" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">writing</text><text x="622" y="345" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Specification</text><text x="622" y="369" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Writing for a</text><text x="622" y="390" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">non-specialist audience</text><text x="622" y="411" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">in a variety of forms</text><line x1="622" y1="430" x2="838" y2="430" stroke="#c9d6d4" stroke-width="2"/><text x="622" y="455" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Register</text><text x="622" y="479" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">set by the form and</text><text x="622" y="499" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">audience</text><rect x="40" y="535" width="820" height="64" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="450" y="574" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">The common thread is control: choose the register the task demands and sustain it.</text>
