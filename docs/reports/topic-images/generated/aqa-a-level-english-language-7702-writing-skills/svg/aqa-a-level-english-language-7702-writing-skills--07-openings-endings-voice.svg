<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Openings, endings and a steady voice</text>

<rect x="40" y="115" width="400" height="290" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="240" y="152" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Openings</text><rect x="70" y="172" width="340" height="44" rx="9" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="240" y="200" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">an anecdote</text><rect x="70" y="227" width="340" height="44" rx="9" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="240" y="255" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">a provocative question</text><rect x="70" y="282" width="340" height="44" rx="9" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="240" y="310" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">a striking quotation</text><rect x="70" y="337" width="340" height="44" rx="9" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="240" y="365" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">a familiar scenario</text><rect x="460" y="115" width="400" height="290" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="660" y="152" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="middle">Endings</text><rect x="490" y="172" width="340" height="44" rx="9" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="660" y="200" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">return to the opening image</text><rect x="490" y="227" width="340" height="44" rx="9" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="660" y="255" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">a call to action</text><rect x="490" y="282" width="340" height="44" rx="9" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="660" y="310" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">a reframed question</text><rect x="490" y="337" width="340" height="44" rx="9" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="660" y="365" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">a short punchy statement</text><path d="M410,194 C450,194 450,194 490,194" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#ahO)"/><text x="450" y="445" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Sustaining the voice: three slips to watch for</text><rect x="40" y="465" width="820" height="52" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="64" y="498" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗</text><text x="94" y="498" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">essay phrasing ("This essay will argue") in an article</text><rect x="40" y="527" width="820" height="52" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="64" y="560" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗</text><text x="94" y="560" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">unexplained terms creeping back in when you discuss research</text><rect x="40" y="589" width="820" height="52" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="64" y="622" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗</text><text x="94" y="622" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">a closing paragraph that becomes a summary, not an ending</text><text x="450" y="680" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Read it as the named audience would: same writer, same reader, every paragraph.</text>
</svg>