<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 585" width="900" height="585" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="585" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One idea, three ways</text>

<rect x="130" y="112" width="640" height="64" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">One idea</text><text x="450" y="162" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">Regional accents are judged unfairly; the judgement is social, not linguistic.</text><line x1="450" y1="176" x2="170" y2="206" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="40" y="212" width="260" height="318" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="52" y="224" width="236" height="46" rx="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="170" y="254" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Academic essay</text><text x="62" y="302" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"Negative evaluations of</text><text x="62" y="324" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">regional accents appear</text><text x="62" y="346" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">to reflect attitudes</text><text x="62" y="368" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">towards speakers rather</text><text x="62" y="390" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">than any linguistic</text><text x="62" y="412" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">deficiency."</text><line x1="62" y1="430" x2="278" y2="430" stroke="#c9d6d4" stroke-width="2"/><text x="62" y="458" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">• hedged ("appear to")</text><text x="62" y="484" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">• impersonal</text><text x="62" y="510" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">• research cited</text><line x1="450" y1="176" x2="450" y2="206" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="320" y="212" width="260" height="318" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="332" y="224" width="236" height="46" rx="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="450" y="254" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Analytical writing</text><text x="342" y="302" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"Text B challenges the</text><text x="342" y="324" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">deficit discourse by</text><text x="342" y="346" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">relocating the problem</text><text x="342" y="368" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">from speaker to</text><text x="342" y="390" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">listener."</text><line x1="342" y1="430" x2="558" y2="430" stroke="#c9d6d4" stroke-width="2"/><text x="342" y="458" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">• analytical verbs</text><text x="342" y="484" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">• names features</text><text x="342" y="510" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">• compares texts</text><line x1="450" y1="176" x2="730" y2="206" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="600" y="212" width="260" height="318" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="612" y="224" width="236" height="46" rx="9" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="730" y="254" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Directed writing</text><text x="622" y="302" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"Picture two candidates</text><text x="622" y="324" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">with the same grades. One</text><text x="622" y="346" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">says 'bath' like a</text><text x="622" y="368" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">newsreader; the other</text><text x="622" y="390" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">says it like her nan."</text><line x1="622" y1="430" x2="838" y2="430" stroke="#c9d6d4" stroke-width="2"/><text x="622" y="458" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">• direct address</text><text x="622" y="484" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">• everyday scenario</text><text x="622" y="510" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">• short sentences</text><text x="450" y="562" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Same idea; register, sentence structure, address and evidence change with the task.</text>
</svg>