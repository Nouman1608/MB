<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="640" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Speaking sits outside the IGCSE grade</text>

<rect x="30" y="120" width="250" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="155" y="157" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Paper 1</text><text x="155" y="186.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Reading and Writing</text><rect x="30" y="250" width="250" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="155" y="287" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Paper 2</text><text x="155" y="316.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Listening</text><path d="M285,170 C340,170 340,235 395,235" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M285,300 C340,300 340,235 395,235" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><line x1="395" y1="235" x2="430" y2="235" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="440" y="175" width="430" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="655" y="212.85" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Overall IGCSE grade</text><text x="655" y="243.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Urdu as a Second Language (0539)</text><line x1="30" y1="390" x2="870" y2="390" stroke="#c9d6d4" stroke-width="3" stroke-dasharray="10 8"/><text x="450" y="382" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Speaking does not add marks to the grade above</text><rect x="30" y="420" width="250" height="120" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="155" y="457" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Component 5</text><text x="155" y="486.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Speaking</text><text x="155" y="509.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">(optional)</text><line x1="290" y1="480" x2="430" y2="480" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="440" y="420" width="430" height="120" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="655" y="457.85" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Separate endorsement</text><text x="655" y="488.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Its own grade from 1 (high) to 5 (low)</text><text x="450" y="590" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">The centre decides whether to offer Speaking. The overall IGCSE grade is unaffected</text><text x="450" y="612" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">either way.</text>
</svg>