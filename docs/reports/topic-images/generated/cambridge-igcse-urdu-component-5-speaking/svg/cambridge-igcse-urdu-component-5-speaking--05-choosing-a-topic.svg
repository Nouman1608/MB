<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="900" height="630" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="630" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Choosing a Part 1 topic</text>

<circle cx="365" cy="265" r="140" fill="#f2e7b8" fill-opacity="0.85" stroke="#1e2a44" stroke-width="3"/><circle cx="535" cy="265" r="140" fill="#b5d3cf" fill-opacity="0.7" stroke="#1e2a44" stroke-width="3"/><text x="300" y="255" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">A personal</text><text x="300" y="280" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">interest</text><text x="595" y="245" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Urdu-speaking</text><text x="595" y="270" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">society or</text><text x="595" y="295" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">culture</text><text x="450" y="257" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">strong</text><text x="450" y="280" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">topic</text><rect x="30" y="430" width="410" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="467" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Examples from the guide</text><text x="50" y="496.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">• a favourite regional cuisine</text><text x="50" y="521.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">• a family tradition</text><text x="50" y="546.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">• a well-known festival</text><text x="50" y="571.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">• a piece of Urdu literature or poetry</text><rect x="460" y="430" width="410" height="170" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="480" y="467" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Check before you commit</text><text x="480" y="496.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Enough depth for a 2-3 min outline and</text><text x="480" y="519.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">3-4 min of follow-up discussion?</text><text x="480" y="552.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Not too broad, not too narrow, not only</text><text x="480" y="575.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">loosely linked to Urdu culture?</text>
</svg>