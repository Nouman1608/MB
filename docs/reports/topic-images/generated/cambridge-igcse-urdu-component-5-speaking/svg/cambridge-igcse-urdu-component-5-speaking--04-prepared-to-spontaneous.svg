<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="540" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From prepared to spontaneous</text>

<line x1="70" y1="150" x2="830" y2="150" stroke="#2e6b62" stroke-width="6" marker-end="url(#ahT)"/><text x="70" y="130" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">most prepared</text><text x="830" y="130" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="end">most spontaneous</text><circle cx="164" cy="150" r="13" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><line x1="164" y1="166" x2="164" y2="196" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="200" width="268" height="310" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="200" width="268" height="58" rx="14" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5"/><text x="164" y="237" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Part 1: Presentation</text><text x="164" y="292" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">You know the topic</text><text x="50" y="365" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">How to prepare</text><text x="50" y="392" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="68" y="392" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Prepare a topic with real</text><text x="68" y="413" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">depth</text><text x="50" y="444" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="68" y="444" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Rehearse the 2-3 minute</text><text x="68" y="465" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">outline</text><circle cx="450" cy="150" r="13" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><line x1="450" y1="166" x2="450" y2="196" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="316" y="200" width="268" height="310" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="316" y="200" width="268" height="58" rx="14" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="237" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Part 2: Discussion</text><text x="450" y="292" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">You know the topic, not</text><text x="450" y="315" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">the questions</text><text x="336" y="365" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">How to prepare</text><text x="336" y="392" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="354" y="392" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Answer "why" and "what do</text><text x="354" y="413" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">you think" questions out</text><text x="354" y="434" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">loud</text><text x="336" y="465" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="354" y="465" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Defend your content</text><text x="354" y="486" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">without a script</text><circle cx="736" cy="150" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><line x1="736" y1="166" x2="736" y2="196" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="602" y="200" width="268" height="310" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="602" y="200" width="268" height="58" rx="14" fill="#b5d3cf" stroke="#c9d6d4" stroke-width="2.5"/><text x="736" y="237" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Part 3: Conversation</text><text x="736" y="292" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">You know neither</text><text x="622" y="365" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">How to prepare</text><text x="622" y="392" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="640" y="392" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Broad, regular spoken</text><text x="640" y="413" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">practice on everyday</text><text x="640" y="434" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">subjects</text><text x="622" y="465" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="640" y="465" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">No memorised script will</text><text x="640" y="486" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">fit</text>
</svg>