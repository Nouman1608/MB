<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 596" width="900" height="596" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="596" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A routine for the general conversation</text>

<rect x="30" y="110" width="840" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="165" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="173.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="122" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Find the topic areas</text><text x="122" y="176" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Identify the syllabus general topic areas for Part 3, and confirm the current list</text><text x="122" y="199" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">with a teacher.</text><rect x="30" y="232" width="840" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="282" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="290.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="122" y="270" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Build a bank, not a script</text><text x="122" y="298" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">For each area, prepare useful vocabulary and 2-3 opinion phrases in Urdu.</text><rect x="30" y="344" width="840" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="394" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="402.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="122" y="382" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Practise without warning</text><text x="122" y="410" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Have a teacher or fluent speaker ask questions on a topic you did not choose.</text><rect x="30" y="456" width="840" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="511" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="519.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="122" y="494" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Aim for natural replies</text><text x="122" y="522" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Practise spontaneous answers, not word-perfect recitation: Part 3 rewards</text><text x="122" y="545" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">unscripted conversation.</text>
</svg>