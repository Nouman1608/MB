<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 587" width="900" height="587" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="587" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Component 5 Speaking at a glance</text>

<rect x="30" y="110" width="260" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="160" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">60 marks</text><text x="160" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">marked by the centre,</text><text x="160" y="205" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">moderated by Cambridge</text><rect x="320" y="110" width="260" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">about 10-12 min</text><text x="450" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">whole test, in person,</text><text x="450" y="205" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">entirely in Urdu</text><rect x="610" y="110" width="260" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="740" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">Grade 1 to 5</text><text x="740" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">1 (high) to 5 (low), as a</text><text x="740" y="205" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">separate endorsement</text><text x="450" y="290" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">How the test is run and checked</text><rect x="30" y="315" width="192" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="126" y="346.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Teacher/examiner</text><text x="126" y="374.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">conducts the test</text><text x="126" y="396.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">at your own centre</text><line x1="224" y1="376" x2="244" y2="376" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="246" y="315" width="192" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="342" y="346.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Centre marks it</text><text x="342" y="374.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">out of 60 marks</text><text x="342" y="396.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">(internal marking)</text><line x1="440" y1="376" x2="460" y2="376" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="462" y="315" width="192" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="558" y="346.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Recorded sample</text><text x="558" y="374.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">of performances</text><text x="558" y="396.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">sent to Cambridge</text><line x1="656" y1="376" x2="676" y2="376" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="678" y="315" width="192" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="774" y="346.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Cambridge</text><text x="774" y="374.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">moderates the</text><text x="774" y="396.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">marking externally</text><rect x="30" y="467" width="840" height="92" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="504" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">No written question paper</text><text x="54" y="534" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Speaking tests take place before the main written examination series.</text>
</svg>