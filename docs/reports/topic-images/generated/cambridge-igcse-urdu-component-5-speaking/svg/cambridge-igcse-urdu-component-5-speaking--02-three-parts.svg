<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 677" width="900" height="677" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="677" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The three parts of the Speaking test</text>

<rect x="60" y="115" width="212.72727272727272" height="92" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="166.36363636363637" y="150" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Part 1: 2-3 min</text><text x="166.36363636363637" y="180" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Presentation</text><rect x="272.72727272727275" y="115" width="283.6363636363636" height="92" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="414.54545454545456" y="150" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Part 2: 3-4 min</text><text x="414.54545454545456" y="180" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Discussion</text><rect x="556.3636363636364" y="115" width="283.6363636363636" height="92" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="698.1818181818182" y="150" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Part 3: 3-4 min</text><text x="698.1818181818182" y="180" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">General Conversation</text><text x="60" y="240" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">0 min</text><text x="840" y="240" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">up to 11 min</text><rect x="30" y="270" width="268" height="262" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="304" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">2-3 min</text><text x="50" y="332.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Part 1: Presentation</text><text x="50" y="360.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Prepared outline on a topic</text><text x="50" y="382.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">you chose in advance</text><text x="50" y="414.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Optional card of prompt</text><text x="50" y="436.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">headings and 3-4 materials</text><text x="50" y="458.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(maps, statistics, photos)</text><rect x="316" y="270" width="268" height="262" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="336" y="304" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">3-4 min</text><text x="336" y="332.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Part 2: Discussion</text><text x="336" y="360.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Examiner discusses your</text><text x="336" y="382.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">presentation with you</text><text x="336" y="414.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Explain and justify</text><text x="336" y="436.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">opinions; natural,</text><text x="336" y="458.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">unscripted answers</text><rect x="602" y="270" width="268" height="262" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="622" y="304" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">3-4 min</text><text x="622" y="332.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Part 3: General</text><text x="622" y="357.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Conversation</text><text x="622" y="385.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Two or three general</text><text x="622" y="407.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">topics, not known in</text><text x="622" y="429.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">advance</text><text x="622" y="461.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Drawn from the syllabus</text><text x="622" y="483.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">general topic areas</text><text x="622" y="515.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Worth 20 marks</text><rect x="30" y="557" width="840" height="92" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="594" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Timing check</text><text x="54" y="624" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The parts add up to 8-11 minutes; the syllabus gives about 10-12 minutes for the whole test.</text>
</svg>