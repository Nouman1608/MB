<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How power is spread: polarity</text>

<rect x="30" y="110" width="270" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165" y="148" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Bipolar</text><text x="165" y="174" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">two powers lead rival blocs</text><text x="165" y="555" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">Cold War</text><circle cx="220.4" cy="287.1" r="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.5"/><circle cx="177.9" cy="326.6" r="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.5"/><circle cx="122.5" cy="309.4" r="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.5"/><circle cx="109.6" cy="252.9" r="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.5"/><circle cx="152.1" cy="213.4" r="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.5"/><circle cx="207.5" cy="230.6" r="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.5"/><circle cx="165" cy="270" r="30" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="165" y="362" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">United States</text><circle cx="220.4" cy="452.1" r="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.5"/><circle cx="177.9" cy="491.6" r="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.5"/><circle cx="122.5" cy="474.4" r="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.5"/><circle cx="109.6" cy="417.9" r="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.5"/><circle cx="152.1" cy="378.4" r="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.5"/><circle cx="207.5" cy="395.6" r="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="1.5"/><circle cx="165" cy="435" r="30" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><text x="165" y="527" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Soviet Union</text><rect x="315" y="110" width="270" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><tex