<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 545" width="900" height="545" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="545" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Using indicators: two fictional states</text>

<rect x="30" y="110" width="840" height="51.760000000000005" rx="12" fill="#2e6b62"/><text x="42" y="138.2" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Fictional state</text><text x="212" y="138.2" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">GDP ($bn)</text><text x="342" y="138.2" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Population (m)</text><text x="492" y="138.2" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">GDP per capita</text><text x="652" y="138.2" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Defence % of GDP</text><rect x="30" y="157.76" width="840" height="43.760000000000005" fill="#ffffff"/><text x="42" y="185.06" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Arvenia</text><text x="212" y="185.06" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">3,000</text><text x="342" y="185.06" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">120</text><text x="492" y="185.06" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">$25,000</text><text x="652" y="185.06" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">90 ÷ 3,000 = 3.0%</text><rect x="30" y="201.51999999999998" width="840" height="43.760000000000005" fill="#f7f9f9"/><text x="42" y="228.82" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Kestria</text><text x="212" y="228.82" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">1,200</text><text x="342" y="228.82" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">20</text><text x="492" y="228.82" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">$60,000</text><text x="652" y="228.82" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">24 ÷ 1,200 = 2.0%</text><line x1="30" y1="201.51999999999998" x2="870" y2="201.51999999999998" stroke="#c9d6d4" stroke-width="1.5"/><line x1="200" y1="157.76" x2="200" y2="245.27999999999997" stroke="#c9d6d4" stroke-width="1.5"/><line x1="330" y1="157.76" x2="330" y2="245.27999999999997" stroke="#c9d6d4" stroke-width="1.5"/><line x1="480" y1="157.76" x2="480" y2="245.27999999999997" stroke="#c9d6d4" stroke-width="1.5"/><line x1="640" y1="157.76" x2="640" y2="245.27999999999997" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="110" width="840" height="135.27999999999997" rx="12" fill="none" stroke="#1e2a44" stroke-width="2.2"/><rect x="30" y="269.28" width="410" height="150" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="48" y="327.83" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Arvenia: more hard power</text><text x="48" y="354.95" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">larger economy; spends more on defence in</text><text x="48" y="376.07" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">total and as a share of GDP</text><rect x="460" y="269.28" width="410" height="150" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="327.83" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Kestria: richer people</text><text x="478" y="354.95" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">higher GDP per capita, but a smaller total</text><text x="478" y="376.07" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">economy</text><rect x="30" y="439.28" width="840" height="74.88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="470.42999999999995" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Total size matters most for global reach, but a judgement also needs political and cultural</text><text x="450" y="492.86999999999995" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">evidence.</text>
</svg>