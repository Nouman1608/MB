<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="690" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Evaluating a source on empire</text>

<rect x="30" y="115" width="840" height="110" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="450" y="152.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Source X (written for Marlbridge, fictional)</text><text x="450" y="180.99" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Colonial governor’s annual report: “The new railway has brought order and trade… the people</text><text x="450" y="203.43" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">are grateful.”</text><line x1="450" y1="229" x2="450" y2="266" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="150" y="270" width="600" height="110" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="450" y="319.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Origin and purpose</text><text x="450" y="346.17" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">written by the official in charge, for superiors who judge his success</text><line x1="330" y1="384" x2="230" y2="432" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="570" y1="384" x2="670" y2="432" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="436" width="410" height="150" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="484.05" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">✓ Value</text><text x="48" y="511.17" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the government’s official view of the railway,</text><text x="48" y="532.29" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and what the governor wanted superiors to</text><text x="48" y="553.41" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">believe</text><rect x="460" y="436" width="410" height="150" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="478" y="494.55" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Limitation</text><text x="478" y="521.67" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a reason to show success; no local voices, so</text><text x="478" y="542.79" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">weak evidence that people were “grateful”</text><rect x="30" y="606" width="840" height="53.760000000000005" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="638.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Value and limitation both come from the same fact about origin.</text>
</svg>