<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 708" width="900" height="708" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="708" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What makes a superpower?</text>

<line x1="450" y1="300" x2="165" y2="190" stroke="#1e2a44" stroke-width="2.5"/><line x1="450" y1="300" x2="735" y2="190" stroke="#1e2a44" stroke-width="2.5"/><line x1="450" y1="300" x2="165" y2="530" stroke="#1e2a44" stroke-width="2.5"/><line x1="450" y1="300" x2="735" y2="530" stroke="#1e2a44" stroke-width="2.5"/><line x1="450" y1="300" x2="450" y2="535" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="120" width="270" height="140" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="165" y="174.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Economic</text><text x="165" y="200.4" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">large GDP, major trader, widely</text><text x="165" y="220.20000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">used currency, global companies</text><rect x="600" y="120" width="270" height="140" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="735" y="164.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Military</text><text x="735" y="190.4" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">big defence budget, nuclear</text><text x="735" y="210.20000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">weapons, forces sent far from</text><text x="735" y="230" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">home</text><rect x="30" y="460" width="270" height="140" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="165" y="504.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Political</text><text x="165" y="530.4" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">permanent UN Security Council</text><text x="165" y="550.1999999999999" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">seat, alliance leader, sway over</text><text x="165" y="570" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">others</text><rect x="600" y="460" width="270" height="140" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="735" y="504.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Cultural</text><text x="735" y="530.4" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">films, music, language,</text><text x="735" y="550.1999999999999" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">universities and brands used</text><text x="735" y="570" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">worldwide</text><rect x="315" y="470" width="270" height="130" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="450" y="519.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Demographic and resources</text><text x="450" y="545.4" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">large population and land area;</text><text x="450" y="565.1999999999999" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">energy and minerals</text><circle cx="450" cy="300" r="110" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="281.57" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Superpower</text><text x="450" y="306.65" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">global reach</text><text x="450" y="331.73" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">across fields</text><rect x="30" y="625" width="840" height="52.44" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="656.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">No single measure decides it: a superpower scores highly on most indicators at once.</text>
</svg>