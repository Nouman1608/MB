<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 793" width="900" height="793" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="793" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why empires rise and decline</text>

<rect x="30" y="110" width="410" height="560" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="150" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="middle">▲ Why empires rise</text><rect x="50" y="172" width="370" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="62" y="208.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Economic</text><text x="62" y="234.4" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">wealth pays for armies and officials</text><rect x="50" y="268" width="370" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="62" y="304.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Military and technological</text><text x="62" y="330.40000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">better weapons, ships, organisation</text><rect x="50" y="364" width="370" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="62" y="400.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Political</text><text x="62" y="426.40000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">roads, laws, tax collection</text><rect x="50" y="460" width="370" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="62" y="496.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ideological</text><text x="62" y="522.4" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">religion, “civilising mission”, prestige</text><rect x="50" y="556" width="370" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="62" y="592.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Opportunity</text><text x="62" y="618.4" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">weak or divided rivals</text><rect x="460" y="110" width="410" height="560" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="665" y="150" font-size="22" font-weight="700" fill="#b5602e" text-anchor="middle">▼ Why empires decline</text><rect x="480" y="172" width="370" height="97" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="492" y="205.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Imperial overstretch</text><text x="492" y="230.9" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">commitments abroad cost more than the economy</text><text x="492" y="250.70000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">can support (Paul Kennedy, 1987)</text><rect x="480" y="281" width="370" height="97" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="492" y="314.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Internal</text><text x="492" y="339.90000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">stagnation, corruption, divided leadership,</text><text x="492" y="359.70000000000005" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">costly reform</text><rect x="480" y="390" width="370" height="77" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="492" y="423.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">External</text><text x="492" y="448.90000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">defeat in war, rival powers</text><rect x="480" y="479" width="370" height="97" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="492" y="512.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">From the governed</text><text x="492" y="537.9" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">nationalist and independence movements, e.g.</text><text x="492" y="557.6999999999999" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">decolonisation after 1945</text><rect x="30" y="690" width="840" height="72.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="720.2" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Show how causes interact and rank them: the Soviet Union mixed war, stagnation, reform and</text><text x="450" y="741.32" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">nationalism before 1991.</text>
</svg>