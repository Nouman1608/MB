<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="520" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two kinds of power</text>

<rect x="30" y="120" width="410" height="260" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="48" y="160.8" font-size="24" font-weight="700" fill="#b5602e" text-anchor="start">Hard power</text><text x="48" y="190.56" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">influence through force or payment</text><text x="48" y="214.32" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="48" y="238.08" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">• armed forces</text><text x="48" y="261.84000000000003" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">• sanctions</text><text x="48" y="285.6" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">• trade deals</text><text x="48" y="309.36" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">• aid</text><rect x="460" y="120" width="410" height="260" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="160.8" font-size="24" font-weight="700" fill="#2e6b62" text-anchor="start">Soft power</text><text x="478" y="190.56" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">influence through attraction</text><text x="478" y="214.32" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="478" y="238.08" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">• culture</text><text x="478" y="261.84000000000003" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">• values</text><text x="478" y="285.6" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">• education</text><text x="478" y="309.36" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">• media</text><text x="665" y="360" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">term linked to Joseph Nye (around 1990)</text><rect x="30" y="400" width="840" height="90" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="450" y="439.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Power</text><text x="450" y="466.17" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">the ability of a state to get the outcomes it wants, including by influencing others</text>
</svg>