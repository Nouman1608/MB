<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="660" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Working together: how much sovereignty?</text>

<rect x="30" y="110" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="70" y="250" width="760" height="22" rx="11" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="70" y="235" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Intergovernmental</text><text x="830" y="235" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="end">Supranational</text><text x="70" y="160" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">states keep full sovereignty;</text><text x="70" y="182" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">decisions need every member</text><text x="830" y="160" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">states pool some sovereignty;</text><text x="830" y="182" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">rules above national level bind</text><rect x="90" y="290" width="380" height="120" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="280" y="320" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Most organisations</text><rect x="105" y="338" width="80" height="52" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="145" y="371.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">UN</text><rect x="195" y="338" width="80" height="52" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="235" y="371.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">NATO</text><rect x="285" y="338" width="80" height="52" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="325" y="371.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">ASEAN</text><rect x="375" y="338" width="80" height="52" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="415" y="371.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">AU</text><rect x="640" y="300" width="180" height="100" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="730" y="336.3" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">EU</text><text x="730" y="362.1" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">strong supranational</text><text x="730" y="381.90000000000003" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">features</text><line x1="280" y1="292" x2="280" y2="276" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="730" y1="298" x2="730" y2="276" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="460" width="410" height="170" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="496.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Why states join</text><text x="48" y="523.17" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">• security (collective defence)</text><text x="48" y="544.29" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">• economic gain (larger markets)</text><text x="48" y="565.41" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">• influence (a stronger voice)</text><text x="48" y="586.53" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">• shared values</text><rect x="460" y="460" width="410" height="170" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="478" y="496.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The cost: less freedom of action</text><text x="478" y="523.17" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">• follow shared rules</text><text x="478" y="544.29" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">• pay contributions</text><text x="478" y="565.41" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">• may be drawn into others’ disputes</text>
</svg>