<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Where the marks are</text>

<rect x="60" y="120" width="78" height="96" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="99" y="160" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Ex. 1</text><text x="99" y="190" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">5</text><rect x="138" y="120" width="156" height="96" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="216" y="160" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Ex. 2</text><text x="216" y="190" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">10</text><rect x="294" y="120" width="312" height="96" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="160" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Ex. 3 Extended writing</text><text x="450" y="190" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">20</text><rect x="606" y="120" width="234" height="96" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="723" y="160" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Ex. 4 Translation</text><text x="723" y="190" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">15</text><path d="M294,236 L294,248 L840,248 L840,236" fill="none" stroke="#8a6d0d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="567" y="274" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">35 of 50 marks</text><rect x="30" y="300" width="840" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="345" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="353.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="122" y="338" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Secure the grammar first</text><text x="122" y="366" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Build a checklist from the syllabus's named points and test yourself on each one.</text><rect x="30" y="402" width="840" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="447" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="455.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="122" y="440" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Then prioritise timed practice</text><text x="122" y="468" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Extended writing and translation together carry 35 of the 50 marks.</text>
