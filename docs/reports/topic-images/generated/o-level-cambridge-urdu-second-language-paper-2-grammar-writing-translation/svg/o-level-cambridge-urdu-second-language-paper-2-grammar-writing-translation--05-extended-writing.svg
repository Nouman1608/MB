<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Exercise 3: extended writing</text>

<rect x="30" y="110" width="268" height="116" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="164" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">20 marks</text><text x="164" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">the highest-value exercise</text><rect x="316" y="110" width="268" height="116" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">about 200 words</text><text x="450" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">continuous prose</text><rect x="602" y="110" width="268" height="116" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="736" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">Short prompts</text><text x="736" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">as the stimulus</text><text x="450" y="274" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Purpose, format and audience are specified</text><rect x="30" y="292" width="220" height="56" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="140" y="326" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">a letter</text><rect x="268" y="292" width="220" height="56" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="378" y="326" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">a diary entry</text><rect x="506" y="292" width="364" height="56" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="688" y="326" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">a description for a particular reader</text><text x="450" y="396" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Prepare vocabulary and structures for every common purpose</text><rect x="30" y="414" width="195" height="56" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="127" y="448" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">narrative</text><rect x="245" y="414" width="195" height="56" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="342" y="448" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">descriptive</text><rect x="460" y="414" width="195" height="56" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="557" y="448" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">persuasive</text><rect x="675" y="414" width="195" height="56" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="772" y="448" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">informational</text><rect x="30" y="494" width="840" height="70" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="54" y="537" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">Ignoring the purpose, format or audience caps the mark, however accurate the Urdu.</text>
