<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="680" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">3248 Paper 2 at a glance</text>

<rect x="30" y="110" width="268" height="116" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="164" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">1 h 30 min</text><text x="164" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">written paper</text><rect x="316" y="110" width="268" height="116" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">50 marks</text><text x="450" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">50% of 3248</text><rect x="602" y="110" width="268" height="116" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="736" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">All four</text><text x="736" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">exercises: no choice</text><rect x="30" y="250" width="840" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="292" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="299.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="108" y="286" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Sentence transformation</text><text x="108" y="312" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">five sentences, rewrite each to a prompt</text><rect x="450" y="274" width="40" height="36" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="500" y="298" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">5 marks</text><text x="850" y="298" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="end">Urdu → Urdu</text><rect x="30" y="346" width="840" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="388" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="395.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="108" y="382" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Multiple-choice cloze</text><text x="108" y="408" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">grammar in context in a short gapped text</text><rect x="450" y="370" width="80" height="36" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="540" y="394" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">10 marks</text><text x="850" y="394" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="end">Urdu → Urdu</text><rect x="30" y="442" width="840" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="484" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="491.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="108" y="478" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Extended writing</text><text x="108" y="504" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">about 200 words from short prompts</text><rect x="450" y="466" width="160" height="36" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="620" y="490" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">20 marks</text><text x="850" y="490" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="end">Urdu → Urdu</text><rect x="30" y="538" width="840" height="84" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><circle cx="70" cy="580" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="587.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="108" y="574" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Translation</text><text x="108" y="600" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">about 150 words from English into Urdu</text><rect x="450" y="562" width="120" height="36" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="580" y="586" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">15 marks</text><text x="850" y="586" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="end">English → Urdu</text><text x="450" y="652" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Direction shows the language of the question → the language of your answer.</text>
</svg>