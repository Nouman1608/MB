<text x="450" y="122" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Grammar points the syllabus names for the cloze</text><rect x="30" y="142" width="156" height="58" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="108" y="177" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">verb conjugation</text><rect x="201" y="142" width="156" height="58" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="279" y="167" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">subject/verb</text><text x="279" y="186" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">agreement</text><rect x="372" y="142" width="156" height="58" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="450" y="177" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">comparatives</text><rect x="543" y="142" width="156" height="58" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="621" y="177" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">superlatives</text><rect x="714" y="142" width="156" height="58" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="792" y="177" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">parts of speech</text><rect x="30" y="212" width="156" height="58" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="108" y="247" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">nouns</text><rect x="201" y="212" width="156" height="58" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="279" y="247" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">prepositions</text><rect x="372" y="212" width="156" height="58" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="450" y="247" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">postpositions</text><rect x="543" y="212" width="156" height="58" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="621" y="247" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">articles</text><rect x="714" y="212" width="156" height="58" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="792" y="237" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">vocabulary for</text><text x="792" y="256" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">the context</text><rect x="30" y="300" width="840" height="170" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="336" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Two tests for every option</text><rect x="54" y="356" width="370" height="94" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="239" y="394" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Does it fit grammatically?</text><text x="239" y="422" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">agreement, form, postposition</text><text x="450" y="410" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><rect x="476" y="356" width="370" height="94" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="661" y="394" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Does it make sense here?</text><text x="661" y="422" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">read the full sentence around the gap</text>
