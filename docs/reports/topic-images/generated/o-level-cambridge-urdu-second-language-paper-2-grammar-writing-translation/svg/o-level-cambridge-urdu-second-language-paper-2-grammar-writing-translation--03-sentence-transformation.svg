<rect width="900" height="386" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Exercise 1: change the form, keep the meaning</text>

<rect x="30" y="110" width="260" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="147" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Original sentence</text><text x="50" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">one of five short</text><text x="50" y="197.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">sentences</text><line x1="292" y1="170" x2="318" y2="170" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="320" y="110" width="260" height="120" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="340" y="147" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Apply the prompt</text><text x="340" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">e.g. change the tense, the</text><text x="340" y="197.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">voice or the sentence type</text><line x1="582" y1="170" x2="608" y2="170" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="610" y="110" width="260" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="630" y="147" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">New sentence</text><text x="630" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">new form, exactly the same</text><text x="630" y="197.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">meaning</text><text x="450" y="280" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Each sentence is worth a full mark: check</text><rect x="30" y="300" width="195" height="58" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="127" y="336" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">verb endings</text><rect x="245" y="300" width="195" height="58" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="342" y="336" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">postpositions</text><rect x="460" y="300" width="195" height="58" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="557" y="336" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">word order</text><rect x="675" y="300" width="195" height="58" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="772" y="336" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">meaning unchanged</text>
</svg>