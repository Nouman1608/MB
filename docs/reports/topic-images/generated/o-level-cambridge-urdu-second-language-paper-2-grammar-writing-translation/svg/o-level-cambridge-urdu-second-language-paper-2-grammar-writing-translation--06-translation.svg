<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 468" width="900" height="468" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="468" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Exercise 4: translation into Urdu</text>

<rect x="30" y="110" width="300" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="180" y="147" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">English passage</text><text x="180" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">about 150 words; the question</text><text x="180" y="197.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">is in English</text><line x1="336" y1="185" x2="564" y2="185" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><text x="450" y="172" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">translate</text><rect x="570" y="110" width="300" height="150" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="720" y="147" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Urdu</text><text x="720" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">15 marks for a short passage,</text><text x="720" y="197.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">so precision matters</text><rect x="30" y="290" width="410" height="150" rx="12" fill="#fbf1ea" stroke="#b5602e" stroke-width="2"/><text x="62" y="334" font-size="26" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><text x="90" y="330" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Word-for-word</text><text x="54" y="372" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">produces unnatural Urdu and is marked down</text><rect x="460" y="290" width="410" height="150" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="492" y="334" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="520" y="330" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Accurate and natural</text><text x="484" y="372" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">keeps the original meaning and reads</text><text x="484" y="393" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">naturally in Urdu</text>
</svg>