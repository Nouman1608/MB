<text x="169" y="320" font-size="30" fill="#1f2f4f" font-weight="700" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">10B: 20%</text><text x="645" y="320" font-size="30" fill="#fff" font-weight="700" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">11B: 80%</text>
<text x="550" y="415" font-size="33" fill="#1f2f4f"  text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">(10 × 20 + 11 × 80) ÷ 100</text><text x="550" y="470" font-size="36" fill="#2b6e66" font-weight="700" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">= 1080 ÷ 100 = 10.8</text>
<text x="806" y="538" font-size="30" fill="#2b6e66" font-weight="700" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">A<tspan dy="9" font-size="21">r</tspan><tspan dy="-9">&#160;= 10.8</tspan></text>
