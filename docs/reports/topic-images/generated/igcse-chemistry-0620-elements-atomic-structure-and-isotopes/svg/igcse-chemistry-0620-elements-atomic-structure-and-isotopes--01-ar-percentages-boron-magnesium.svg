<text x="75" y="832" font-size="36" fill="#2b6e66" font-weight="700" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif">Magnesium</text>
<rect x="73" y="855" width="753" height="80" fill="#74aba4"/><rect x="826" y="855" width="95" height="80" fill="#d4af2a"/><rect x="921" y="855" width="107" height="80" fill="#6b7a99"/><rect x="73" y="855" width="955" height="80" fill="none" stroke="#1f2f4f" stroke-width="4"/><line x1="826" y1="855" x2="826" y2="935" stroke="#1f2f4f" stroke-width="3"/><line x1="921" y1="855" x2="921" y2="935" stroke="#1f2f4f" stroke-width="3"/>
<text x="450" y="907" font-size="30" fill="#1f2f4f" font-weight="700" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">24Mg: 79%</text><line x1="875" y1="935" x2="875" y2="958" stroke="#1f2f4f" stroke-width="4"/><text x="873" y="993" font-size="28" fill="#5a6785"  text-anchor="end" font-family="Liberation Sans, Arial, Helvetica, sans-serif">25Mg: 10%</text><line x1="974" y1="935" x2="974" y2="1010" stroke="#1f2f4f" stroke-width="4"/><text x="1026" y="1038" font-size="28" fill="#5a6785"  text-anchor="end" font-family="Liberation Sans, Arial, Helvetica, sans-serif">26Mg: 11%</text>
<text x="550" y="1060" font-size="33" fill="#1f2f4f"  text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">(24 × 79 + 25 × 10 + 26 × 11) ÷ 100</text><text x="550" y="1114" font-size="33" fill="#1f2f4f"  text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">= (1896 + 250 + 286) ÷ 100</text><text x="550" y="1170" font-size="36" fill="#2b6e66" font-weight="700" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">= 2432 ÷ 100 = 24.3 (1 d.p.)</text>
<text x="259" y="1248" font-size="30" fill="#2b6e66" font-weight="700" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif">A<tspan dy="9" font-size="21">r</tspan><tspan dy="-9">&#160;= 24.3</tspan></text>
