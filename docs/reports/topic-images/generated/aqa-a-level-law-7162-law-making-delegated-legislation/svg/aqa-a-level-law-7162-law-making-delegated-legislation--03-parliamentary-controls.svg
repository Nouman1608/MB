<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 658" width="900" height="658" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="658" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Parliamentary controls</text>

<rect x="30" y="100" width="840" height="132" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AT SOURCE</text><text x="50" y="158.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The enabling Act sets the scope, who may use the power and the procedure</text><text x="50" y="186.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The most basic limit, but it can be drafted very widely. The Lords Delegated Powers and Regulatory</text><text x="50" y="207.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Reform Committee checks Bills before they become Acts.</text><rect x="30" y="254" width="270.6666666666667" height="174" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="286" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NEGATIVE RESOLUTION</text><text x="50" y="312.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Law unless annulled</text><text x="50" y="340.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Either House can annul within</text><text x="50" y="361.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a set period (usually 40 days).</text><text x="50" y="382.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Covers most; few debated,</text><text x="50" y="403.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">annulment rare</text><rect x="314.6666666666667" y="254" width="270.6666666666667" height="174" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="334.6666666666667" y="286" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AFFIRMATIVE RESOLUTION</text><text x="334.6666666666667" y="312.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Must be approved</text><text x="334.6666666666667" y="340.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Forces a vote, usually both</text><text x="334.6666666666667" y="361.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Houses; Parliament cannot</text><text x="334.6666666666667" y="382.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">amend, only accept or reject</text><rect x="599.3333333333334" y="254" width="270.6666666666667" height="174" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="619.3333333333334" y="286" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SUPER-AFFIRMATIVE</text><text x="619.3333333333334" y="312.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Extra scrutiny</text><text x="619.3333333333334" y="340.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Longer period, for some</text><text x="619.3333333333334" y="361.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">powers to amend Acts; rarely</text><text x="619.3333333333334" y="382.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">used</text><rect x="30" y="450" width="270.6666666666667" height="176" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="482" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">JOINT COMMITTEE ON SIs</text><text x="50" y="508.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Technical scrutiny</text><text x="50" y="536.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Unusual use of power,</text><text x="50" y="557.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">defective drafting; legality not</text><text x="50" y="578.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">merits; cannot change an SI</text><rect x="314.6666666666667" y="450" width="270.6666666666667" height="176" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334.6666666666667" y="482" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LORDS COMMITTEE</text><text x="334.6666666666667" y="508.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Secondary Legislation</text><text x="334.6666666666667" y="531.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Scrutiny</text><text x="334.6666666666667" y="559.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Policy merits: reports on</text><text x="334.6666666666667" y="580.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">instruments of interest;</text><text x="334.6666666666667" y="601.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">recommendations not binding</text><rect x="599.3333333333334" y="450" width="270.6666666666667" height="176" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="619.3333333333334" y="482" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">QUESTIONS AND DEBATES</text><text x="619.3333333333334" y="508.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Publicity</text><text x="619.3333333333334" y="536.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">MPs question ministers;</text><text x="619.3333333333334" y="557.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">limited time</text>
</svg>