<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 476" width="900" height="476" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="476" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three types of delegated legislation</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Each made under powers in an enabling Act</text>
<rect x="30" y="124" width="270.6666666666667" height="320" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ORDERS IN COUNCIL</text><text x="50" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">King and Privy Council</text><text x="50" y="210.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="210.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">On ministers’ advice</text><text x="50" y="237.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="237.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Transfer responsibilities</text><text x="65.2" y="258.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">between departments</text><text x="50" y="285.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="285.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Bring some Acts into force</text><text x="50" y="312.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="312.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Emergencies: Civil</text><text x="65.2" y="333.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Contingencies Act 2004</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="320" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="334.6666666666667" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STATUTORY INSTRUMENTS</text><text x="334.6666666666667" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ministers and</text><text x="334.6666666666667" y="205.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">departments</text><text x="334.6666666666667" y="233.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="349.8666666666667" y="233.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">By far the most common</text><text x="334.6666666666667" y="260.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="349.8666666666667" y="260.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Minimum wage rates</text><text x="349.8666666666667" y="281.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(National Minimum Wage</text><text x="349.8666666666667" y="302.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Act 1998)</text><text x="334.6666666666667" y="329.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="349.8666666666667" y="329.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Coronavirus Regulations</text><text x="349.8666666666667" y="350.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">2020 under the Public</text><text x="349.8666666666667" y="371.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Health (Control of Disease)</text><text x="349.8666666666667" y="392.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Act 1984</text><text x="334.6666666666667" y="419.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="349.8666666666667" y="419.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Commencement orders</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="320" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="619.3333333333334" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BYLAWS</text><text x="619.3333333333334" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Local authorities and</text><text x="619.3333333333334" y="205.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">public bodies</text><text x="619.3333333333334" y="233.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="634.5333333333334" y="233.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">For their own area or places</text><text x="619.3333333333334" y="260.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="634.5333333333334" y="260.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Dog fouling, parks; conduct</text><text x="634.5333333333334" y="281.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">on railways and stations</text><text x="619.3333333333334" y="308.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="634.5333333333334" y="308.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Usually need approval from</text><text x="634.5333333333334" y="329.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the relevant department</text>
</svg>