<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 493" width="900" height="493" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="493" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Judicial controls: ultra vires and unreasonableness</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Judicial review in the High Court: void if “beyond the powers”</text>
<rect x="30" y="124" width="272" height="206" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PROCEDURAL ULTRA VIRES</text><text x="46" y="177.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Required procedure not</text><text x="46" y="198.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">followed</text><text x="46" y="225.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Aylesbury</tspan> <tspan font-style="italic">Mushrooms</tspan> (1972):</text><text x="46" y="246.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Mushroom Growers’</text><text x="46" y="267.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Association not consulted, so</text><text x="46" y="288.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the order did not apply to its</text><text x="46" y="309.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">members</text><rect x="314" y="124" width="272" height="206" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="330" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SUBSTANTIVE ULTRA VIRES</text><text x="330" y="177.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Beyond the powers given</text><text x="330" y="204.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Cure</tspan> <tspan font-style="italic">&amp;</tspan> <tspan font-style="italic">Deeley</tspan> (1962): power to</text><text x="330" y="225.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">decide tax due. <tspan font-style="italic">R</tspan> <tspan font-style="italic">(Public</tspan> <tspan font-style="italic">Law</tspan></text><text x="330" y="246.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Project)</tspan> (2016): legal aid</text><text x="330" y="267.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">residence test outside the 2012</text><text x="330" y="288.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Act</text><rect x="598" y="124" width="272" height="206" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="614" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">UNREASONABLENESS</text><text x="614" y="177.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">No reasonable body could</text><text x="614" y="198.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">make it (Wednesbury)</text><text x="614" y="225.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Strickland</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Hayes</tspan> <tspan font-style="italic">BC</tspan> (1896):</text><text x="614" y="246.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">obscene songs in public <tspan font-weight="700" fill="#1e2a44">or</tspan></text><text x="614" y="267.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">private</tspan>, too wide. But <tspan font-style="italic">Kruse</tspan> <tspan font-style="italic">v</tspan></text><text x="614" y="288.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Johnson</tspan> (1898): bylaw upheld</text><rect x="30" y="352" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="386.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Limits of judicial control</text><text x="50" y="415.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Retrospective: acts only after a challenge; depends on someone bringing a case; cannot be used against</text><text x="50" y="436.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the enabling Act itself.</text>
</svg>