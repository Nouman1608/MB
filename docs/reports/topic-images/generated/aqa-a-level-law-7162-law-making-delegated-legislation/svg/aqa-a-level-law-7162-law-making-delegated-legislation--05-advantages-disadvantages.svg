<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 386" width="900" height="386" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="386" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Weighing delegated legislation</text>

<rect x="30" y="100" width="412" height="254" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ADVANTAGES</text><text x="50" y="163.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="163.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Saves parliamentary time</text><text x="50" y="192.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="192.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Expertise and local knowledge</text><text x="50" y="221.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="221.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Quick: essential in emergencies</text><text x="50" y="250.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="250.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Flexible and easy to update</text><text x="50" y="279.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="279.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Consultation can improve quality</text><text x="50" y="308.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="308.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Controls exist in Parliament and the courts</text><rect x="458" y="100" width="412" height="254" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="478" y="132" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">DISADVANTAGES</text><text x="478" y="163.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="493.2" y="163.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Undemocratic:</tspan> unelected makers</text><text x="478" y="192.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="493.2" y="192.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Volume:</tspan> few receive any debate</text><text x="478" y="221.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="493.2" y="221.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Little</tspan> <tspan font-weight="700" fill="#1e2a44">publicity:</tspan> rules people never heard of</text><text x="478" y="250.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="493.2" y="250.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Sub-delegation:</tspan> further from Parliament</text><text x="478" y="279.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="493.2" y="279.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Henry</tspan> <tspan font-weight="700" fill="#1e2a44">VIII</tspan> <tspan font-weight="700" fill="#1e2a44">powers:</tspan> ministers amend Acts</text><text x="478" y="308.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="493.2" y="308.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Weak</tspan> <tspan font-weight="700" fill="#1e2a44">controls:</tspan> rare debate; no amendment;</text><text x="493.2" y="329.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">review needs a challenge</text>
</svg>