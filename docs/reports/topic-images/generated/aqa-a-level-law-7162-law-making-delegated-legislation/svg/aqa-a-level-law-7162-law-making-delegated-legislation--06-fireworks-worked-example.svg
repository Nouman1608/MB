<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 687" width="900" height="687" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="687" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: the fireworks regulations</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A fictional enabling Act</text>
<rect x="30" y="124" width="395" height="129" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THE POWER (COMMUNITY SAFETY ACT 2026)</text><text x="50" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">“To restrict the sale of fireworks to</text><text x="50" y="205.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">persons under 18, after consulting</text><text x="50" y="228.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">retailers’ organisations”</text><line x1="431" y1="188.5" x2="469" y2="188.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="475" y="124" width="395" height="129" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="495" y="167.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WHAT THE HOME SECRETARY DID</text><text x="495" y="193.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Banned all sales to anyone, without</text><text x="495" y="216.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">consulting anyone</text><line x1="60" y1="295" x2="60" y2="635" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="275" width="766" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="308.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Procedural ultra vires</text><text x="122" y="338.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Duty to consult retailers’ organisations ignored: <tspan font-style="italic">Aylesbury</tspan> <tspan font-style="italic">Mushrooms</tspan>.</text><circle cx="60" cy="318" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="326.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="373" width="766" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="406.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Substantive ultra vires</text><text x="122" y="436.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Power limited to sales to under-18s; a ban on all sales goes beyond it: <tspan font-style="italic">Cure</tspan> <tspan font-style="italic">&amp;</tspan> <tspan font-style="italic">Deeley</tspan>.</text><circle cx="60" cy="416" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="424.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="471" width="766" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="504.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Unreasonableness</text><text x="122" y="534.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Possibly also argued, but ultra vires is the clearer ground.</text><circle cx="60" cy="514" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="522.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="569" width="766" height="86" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122" y="602.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Conclusion</text><text x="122" y="632.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A retailer could seek judicial review; the regulations are likely void.</text><circle cx="60" cy="612" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="620.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text>
</svg>