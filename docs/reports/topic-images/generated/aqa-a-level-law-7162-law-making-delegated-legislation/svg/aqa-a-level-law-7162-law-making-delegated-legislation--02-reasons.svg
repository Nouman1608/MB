<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why does Parliament delegate?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Reasons explain why; advantages are the benefits of the result</text>
<line x1="320" y1="174" x2="411" y2="246.45" stroke="#1e2a44" stroke-width="2.5"/><line x1="320" y1="288" x2="411" y2="280.65" stroke="#1e2a44" stroke-width="2.5"/><line x1="320" y1="391.5" x2="411" y2="311.7" stroke="#1e2a44" stroke-width="2.5"/><line x1="580" y1="174" x2="489" y2="246.45" stroke="#1e2a44" stroke-width="2.5"/><line x1="580" y1="288" x2="489" y2="280.65" stroke="#1e2a44" stroke-width="2.5"/><line x1="580" y1="391.5" x2="489" y2="311.7" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="277.5" r="78" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="272.3" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Reasons to</text><text x="450" y="296.7" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">delegate</text><rect x="30" y="124" width="290" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">1 Lack of parliamentary time</text><text x="46" y="182.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Parliament sets the framework;</text><text x="46" y="203.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">others fill in detail</text><rect x="30" y="238" width="290" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="268.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">2 Technical expertise</text><text x="46" y="296.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Civil servants and experts:</text><text x="46" y="317.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">machinery, medicines</text><rect x="30" y="352" width="290" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="382.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">3 Local knowledge</text><text x="46" y="410.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Local authorities know their area</text><rect x="580" y="124" width="290" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="596" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">4 Speed and emergencies</text><text x="596" y="182.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">An SI in days: most coronavirus</text><text x="596" y="203.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">restrictions</text><rect x="580" y="238" width="290" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="596" y="268.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">5 Flexibility</text><text x="596" y="296.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Rules that change often, such as</text><text x="596" y="317.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">minimum wage rates</text><rect x="580" y="352" width="290" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="596" y="382.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">6 Consultation</text><text x="596" y="410.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Many enabling Acts require it</text>
