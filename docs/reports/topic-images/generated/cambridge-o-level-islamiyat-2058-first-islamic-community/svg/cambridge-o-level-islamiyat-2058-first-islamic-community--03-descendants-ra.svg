<rect width="900" height="789" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Children and grandchildren of the Prophet (pbuh)</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Names only; all his sons died in childhood</text>
<path d="M450,172 L450,193 L260,193 L260,214" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M450,172 L450,193 L740,193 L740,214" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M260,262 L260,288 L80,288 L80,314" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M260,262 L260,288 L200,288 L200,314" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M260,262 L260,288 L320,288 L320,314" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M260,262 L260,288 L440,288 L440,314" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M260,262 L260,288 L560,288 L560,314" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M260,262 L260,288 L680,288 L680,314" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M740,262 L740,288 L800,288 L800,314" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M680,484 L680,499 L570,499 L570,514" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M680,484 L680,499 L690,499 L690,514" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M680,484 L680,499 L815,499 L815,514" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="300" y="124" width="300" height="48" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="152.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">The Prophet (pbuh)</text><rect x="110" y="214" width="300" height="48" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="260" y="242.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">With Khadija (RA)</text><rect x="640" y="214" width="200" height="48" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="740" y="242.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">With Maria</text><rect x="24" y="314" width="112" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="80" y="389.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Qasim</text><text x="80" y="418.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">son</text><rect x="144" y="314" width="112" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="200" y="389.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Abdullah</text><text x="200" y="418.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">son</text><rect x="264" y="314" width="112" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="320" y="367.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Zaynab</text><text x="320" y="391.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">(RA)</text><text x="320" y="420.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">m. Abu</text><text x="320" y="441.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">al-As</text><rect x="384" y="314" width="112" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="440" y="367.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Ruqayya</text><text x="440" y="391.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">(RA)</text><text x="440" y="420.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">m. Uthman</text><text x="440" y="441.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">(RA)</text><rect x="504" y="314" width="112" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="560" y="355.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Umm</text><text x="560" y="379.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Kulthum</text><text x="560" y="403.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">(RA)</text><text x="560" y="432.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">m. Uthman</text><text x="560" y="453.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">(RA)</text><rect x="624" y="314" width="112" height="170" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="680" y="377.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Fatima</text><text x="680" y="401.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">(RA)</text><text x="680" y="430.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">m. Ali (RA)</text><rect x="744" y="314" width="112" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="800" y="347.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Ibrahim</text><text x="800" y="376.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">son</text><rect x="515" y="514" width="110" height="110" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="570" y="561.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Hasan</text><text x="570" y="585.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">(RA)</text><rect x="635" y="514" width="110" height="110" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="690" y="561.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Husayn</text><text x="690" y="585.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">(RA)</text><rect x="750" y="514" width="130" height="110" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="815" y="549.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Zaynab</text><text x="815" y="573.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">bint Ali</text><text x="815" y="597.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">(RA)</text><rect x="30" y="514" width="470" height="99" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="546.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Uthman</tspan> <tspan font-weight="700" fill="#1e2a44">(RA)</tspan> married Ruqayya and later Umm Kulthum,</text><text x="50" y="567.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">so he was called <tspan font-weight="700" fill="#1e2a44">Dhu</tspan> <tspan font-weight="700" fill="#1e2a44">al-Nurayn</tspan>, "possessor of two</text><text x="50" y="588.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">lights".</text><rect x="30" y="646" width="840" height="111" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="680.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">At the Mubahala (Sura 3.61)</text><text x="50" y="710.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">He came out with Ali (RA), Fatima (RA), Hasan (RA) and Husayn (RA): the family Shi'a Muslims call</text><text x="50" y="732.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the <tspan font-weight="700" fill="#1e2a44">Ahl</tspan> <tspan font-weight="700" fill="#1e2a44">al-Bayt</tspan>.</text>
</svg>