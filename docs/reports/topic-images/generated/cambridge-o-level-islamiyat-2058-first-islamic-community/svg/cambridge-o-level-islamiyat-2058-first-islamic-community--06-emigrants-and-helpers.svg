<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 549" width="900" height="549" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="549" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Emigrants and the Helpers</text>

<rect x="30" y="100" width="360" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="210" y="140" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">MUHAJIRUN</text><text x="210" y="168.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">The Emigrants</text><text x="210" y="197.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Left homes and property in Makka</text><rect x="510" y="100" width="360" height="135" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="690" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">ANSAR</text><text x="690" y="160.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">The Helpers</text><text x="690" y="189.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Of the Aws and Khazraj in Madinah;</text><text x="690" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">received the Emigrants</text><path d="M396,165 L504,165" fill="none" stroke="#1e2a44" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)" marker-start="url(#ah)"/><rect x="30" y="252" width="507.0769230769231" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="284" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SURA 59.9</text><text x="50" y="310.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The Ansar praised</text><text x="50" y="338.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">They gave the Emigrants "preference over themselves, even</text><text x="50" y="359.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">though poverty was their own lot".</text><rect x="553.0769230769231" y="252" width="316.9230769230769" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="573.0769230769231" y="284" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SURA 9.100</text><text x="573.0769230769231" y="310.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Both groups</text><text x="573.0769230769231" y="338.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Promised God's pleasure.</text><rect x="30" y="406" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="440.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Best-known example</text><text x="50" y="470.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Sa'd</tspan> <tspan font-weight="700" fill="#1e2a44">ibn</tspan> <tspan font-weight="700" fill="#1e2a44">al-Rabi'</tspan> offered <tspan font-weight="700" fill="#1e2a44">Abd</tspan> <tspan font-weight="700" fill="#1e2a44">al-Rahman</tspan> <tspan font-weight="700" fill="#1e2a44">ibn</tspan> <tspan font-weight="700" fill="#1e2a44">Awf</tspan> half his wealth. Abd al-Rahman thanked him and</text><text x="50" y="492.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">asked only to be shown the market.</text>
</svg>