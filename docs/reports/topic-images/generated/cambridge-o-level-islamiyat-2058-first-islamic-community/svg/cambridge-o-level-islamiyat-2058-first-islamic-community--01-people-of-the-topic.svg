<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 551" width="900" height="551" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="551" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The First Islamic Community: three groups of people</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Paper 1, optional topic: one or two 14-mark questions</text>
<rect x="30" y="124" width="270.6666666666667" height="180" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="165.33333333333334" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">1</text><text x="165.33333333333334" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">The wives</text><text x="165.33333333333334" y="212.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">The Mothers of the Believers</text><text x="165.33333333333334" y="233.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">(Sura 33.6)</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="180" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">2</text><text x="450" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">The descendants</text><text x="450" y="212.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Children, grandchildren and</text><text x="450" y="233.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">the line of Imams recognised</text><text x="450" y="254.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">among Shi'a Muslims</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="180" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="734.6666666666667" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">3</text><text x="734.6666666666667" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">The leading</text><text x="734.6666666666667" y="208.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Companions</text><text x="734.6666666666667" y="237.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Ten Blessed Companions,</text><text x="734.6666666666667" y="258.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Scribes, major characters,</text><text x="734.6666666666667" y="279.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Emigrants and Helpers</text><rect x="30" y="326" width="520" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="358" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ALSO IN THIS TOPIC</text><text x="50" y="384.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The four Rightly Guided Caliphs during his lifetime</text><text x="50" y="412.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Abu Bakr, Umar, Uthman and Ali before 632</text><rect x="580" y="326" width="290" height="111" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="600" y="358" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">NOT IN THIS TOPIC</text><text x="600" y="384.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Their rule after 632</text><text x="600" y="412.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">belongs to Paper 2</text><line x1="556" y1="381.5" x2="574" y2="381.5" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><rect x="30" y="459" width="840" height="60" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="493.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">For every person: <tspan font-weight="700" fill="#1e2a44">the</tspan> <tspan font-weight="700" fill="#1e2a44">facts</tspan> <tspan font-weight="700" fill="#1e2a44">of</tspan> <tspan font-weight="700" fill="#1e2a44">their</tspan> <tspan font-weight="700" fill="#1e2a44">life</tspan> and <tspan font-weight="700" fill="#1e2a44">why</tspan> <tspan font-weight="700" fill="#1e2a44">their</tspan> <tspan font-weight="700" fill="#1e2a44">actions</tspan> <tspan font-weight="700" fill="#1e2a44">matter</tspan>.</text>
</svg>