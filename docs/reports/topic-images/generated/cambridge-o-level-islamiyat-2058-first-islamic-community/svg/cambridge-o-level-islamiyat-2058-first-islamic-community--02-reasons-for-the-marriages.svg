<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 624" width="900" height="624" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="624" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why so many marriages?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Examiners reward explanation, not just names</text>
<rect x="30" y="124" width="250" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="170.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Support for widows</text><rect x="310" y="124" width="560" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330" y="158.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Most of the wives after Khadija were widows who needed support</text><text x="330" y="181.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">e.g.</tspan> <tspan font-style="italic">Sawda,</tspan> <tspan font-style="italic">Zaynab</tspan> <tspan font-style="italic">bint</tspan> <tspan font-style="italic">Khuzayma,</tspan> <tspan font-style="italic">Umm</tspan> <tspan font-style="italic">Salama</tspan></text><line x1="284" y1="166" x2="304" y2="166" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="220" width="250" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="255.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Bonds with</text><text x="50" y="278.03999999999996" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Companions</text><rect x="310" y="220" width="560" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330" y="254.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Strengthened ties with close Companions</text><text x="330" y="277.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Aisha</tspan> <tspan font-style="italic">(daughter</tspan> <tspan font-style="italic">of</tspan> <tspan font-style="italic">Abu</tspan> <tspan font-style="italic">Bakr),</tspan> <tspan font-style="italic">Hafsa</tspan> <tspan font-style="italic">(daughter</tspan> <tspan font-style="italic">of</tspan> <tspan font-style="italic">Umar)</tspan></text><line x1="284" y1="262" x2="304" y2="262" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="316" width="250" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="362.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Bonds with tribes</text><rect x="310" y="316" width="560" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330" y="350.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Built links with tribes</text><text x="330" y="373.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Juwayriyya</tspan> <tspan font-style="italic">(Banu</tspan> <tspan font-style="italic">Mustaliq),</tspan> <tspan font-style="italic">Umm</tspan> <tspan font-style="italic">Habiba</tspan> <tspan font-style="italic">(daughter</tspan> <tspan font-style="italic">of</tspan> <tspan font-style="italic">Abu</tspan> <tspan font-style="italic">Sufyan)</tspan></text><line x1="284" y1="358" x2="304" y2="358" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="412" width="250" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="458.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Changing a custom</text><rect x="310" y="412" width="560" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330" y="446.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Showed an adopted son's former wife could be married</text><text x="330" y="469.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Zaynab</tspan> <tspan font-style="italic">bint</tspan> <tspan font-style="italic">Jahsh</tspan> <tspan font-style="italic">(Sura</tspan> <tspan font-style="italic">33.37)</tspan></text><line x1="284" y1="454" x2="304" y2="454" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="508" width="250" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="554.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Teaching</text><rect x="310" y="508" width="560" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330" y="542.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">His wives taught Muslims about his private life and practice</text><text x="330" y="565.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">e.g.</tspan> <tspan font-style="italic">Aisha,</tspan> <tspan font-style="italic">a</tspan> <tspan font-style="italic">narrator</tspan> <tspan font-style="italic">of</tspan> <tspan font-style="italic">Hadith</tspan> <tspan font-style="italic">and</tspan> <tspan font-style="italic">teacher</tspan> <tspan font-style="italic">of</tspan> <tspan font-style="italic">law</tspan></text><line x1="284" y1="550" x2="304" y2="550" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/>
</svg>