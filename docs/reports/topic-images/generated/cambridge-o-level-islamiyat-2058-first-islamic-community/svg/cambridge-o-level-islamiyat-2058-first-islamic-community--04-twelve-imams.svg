<rect width="900" height="717" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The twelve Imams of Twelver Shi'a Muslims</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A direct line from the Prophet's (pbuh) family</text>
<rect x="90" y="124" width="350" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="110" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Ali</text><circle cx="56" cy="151" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="56" y="158.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="90" y="190" width="350" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="110" y="224.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Hasan</text><circle cx="56" cy="217" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="56" y="224.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="90" y="256" width="350" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="110" y="290.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Husayn</text><circle cx="56" cy="283" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="56" y="290.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="90" y="322" width="350" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="110" y="356.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Ali Zayn al-Abidin</text><circle cx="56" cy="349" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="56" y="356.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="90" y="388" width="350" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="110" y="422.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Muhammad al-Baqir</text><circle cx="56" cy="415" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="56" y="422.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="90" y="454" width="350" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="110" y="488.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Ja'far al-Sadiq</text><circle cx="56" cy="481" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="56" y="488.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><rect x="520" y="124" width="350" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="540" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Musa al-Kazim</text><circle cx="486" cy="151" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="486" y="158.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">7</text><rect x="520" y="190" width="350" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="540" y="224.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Ali al-Rida</text><circle cx="486" cy="217" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="486" y="224.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">8</text><rect x="520" y="256" width="350" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="540" y="290.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Muhammad al-Jawad</text><circle cx="486" cy="283" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="486" y="290.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">9</text><rect x="520" y="322" width="350" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="540" y="356.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Ali al-Hadi</text><circle cx="486" cy="349" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="486" y="356.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">10</text><rect x="520" y="388" width="350" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="540" y="422.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Hasan al-Askari</text><circle cx="486" cy="415" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="486" y="422.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">11</text><rect x="520" y="454" width="350" height="60" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="540" y="488.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Muhammad al-Mahdi</text><circle cx="486" cy="481" r="21" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="486" y="488.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">12</text><rect x="30" y="530" width="270.6666666666667" height="155" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="562" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BELIEF</text><text x="50" y="588.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Rightful, divinely guided</text><text x="50" y="611.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">leaders</text><text x="50" y="639.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Recognised after the Prophet</text><text x="50" y="660.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(pbuh)</text><rect x="314.6666666666667" y="530" width="270.6666666666667" height="155" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="334.6666666666667" y="562" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">THE TWELFTH</text><text x="334.6666666666667" y="588.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Muhammad al-Mahdi</text><text x="334.6666666666667" y="616.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Believed to be in hiding and to</text><text x="334.6666666666667" y="637.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">return</text><rect x="599.3333333333334" y="530" width="270.6666666666667" height="155" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="619.3333333333334" y="562" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MUHARRAM</text><text x="619.3333333333334" y="588.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Husayn at Karbala</text><text x="619.3333333333334" y="616.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">His martyrdom is remembered</text><text x="619.3333333333334" y="637.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">especially in this month</text>
</svg>