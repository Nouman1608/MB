<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 599" width="900" height="599" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="599" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The four caliphs before 632</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Their lives with the Prophet (pbuh), not their rule</text>
<rect x="30" y="124" width="412" height="203" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ABU BAKR · al-Siddiq</text><text x="50" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">First free adult man to accept Islam</text><text x="50" y="210.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Brought Uthman, Talha, al-Zubayr and others</text><text x="65.2" y="231.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">to Islam; freed Bilal</text><text x="50" y="256.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="256.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Companion in the cave of Thawr: "the second</text><text x="65.2" y="277.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">of two" (Sura 9.40)</text><text x="50" y="302.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="302.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Led the prayers in the final illness</text><rect x="458" y="124" width="412" height="203" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">UMAR · al-Faruq</text><text x="478" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Once a fierce opponent</text><text x="478" y="210.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="493.2" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Accepted Islam after hearing Sura Ta-Ha at his</text><text x="493.2" y="231.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">sister Fatima's house</text><text x="478" y="256.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="493.2" y="256.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Let Muslims pray openly at the Ka'ba</text><text x="478" y="281.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="493.2" y="281.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">His daughter Hafsa married the Prophet</text><rect x="30" y="343" width="412" height="224" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="375" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">UTHMAN · Dhu al-Nurayn</text><text x="50" y="401.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Early convert through Abu Bakr</text><text x="50" y="429.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="429.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Migrated to Abyssinia; married two of the</text><text x="65.2" y="450.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Prophet's daughters</text><text x="50" y="475.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="475.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Bought the well of Ruma; paid for much of the</text><text x="65.2" y="496.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">army sent to Tabuk</text><text x="50" y="521.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="521.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">His rumoured death led to the Pledge of</text><text x="65.2" y="542.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Ridwan (Sura 48.18)</text><rect x="458" y="343" width="412" height="224" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="478" y="375" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ALI · cousin</text><text x="478" y="401.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">First young person to accept Islam</text><text x="478" y="429.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="493.2" y="429.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Slept in the Prophet's bed on the night of the</text><text x="493.2" y="450.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Hijra; returned the trusts</text><text x="478" y="475.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="493.2" y="475.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Married Fatima; fought at Badr; carried the</text><text x="493.2" y="496.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">banner at Khaybar</text><text x="478" y="521.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="493.2" y="521.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Left in charge of Madinah during Tabuk</text>
</svg>