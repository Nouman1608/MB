<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 674" width="900" height="674" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="674" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Answer plan: the life of Khadija</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Write about her life and importance to the Prophet (pbuh) [10]</text>
<line x1="60" y1="144" x2="60" y2="542" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="43" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="150.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A respected widow and trader of Makka</text><circle cx="60" cy="145.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="154.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="175" width="766" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="201.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Employed him to trade for her in Syria</text><text x="116" y="229.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Her servant Maysara reported his honesty</text><circle cx="60" cy="210.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="219.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="254" width="766" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="280.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">She proposed marriage; he was twenty-five</text><text x="116" y="308.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Mother of all his children except Ibrahim</text><circle cx="60" cy="289.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="298.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="333" width="766" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="359.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Comfort after Hira</text><text x="116" y="387.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Assured him God would never disgrace him; took him to Waraqa ibn Nawfal</text><circle cx="60" cy="368.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="377.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="412" width="766" height="71" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="116" y="438.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">First to believe</text><text x="116" y="466.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Spent her wealth on the cause; endured the boycott in Shi'b Abi Talib</text><circle cx="60" cy="447.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="456.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="104" y="491" width="766" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="517.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Died in 619, the Year of Sorrow</text><text x="116" y="545.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">He never forgot her and honoured her friends after her death</text><circle cx="60" cy="526.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="535.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><rect x="30" y="584" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="617.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Facts in order, named people, and her significance woven through.</text>
</svg>