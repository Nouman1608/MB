<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 697" width="900" height="697" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="697" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Major characters of the ministry</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Choose the people the question asks about</text>
<text x="255" y="150" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">SUPPORTERS</text><rect x="30" y="174" width="450" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="202.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Abu Talib</text><text x="44" y="225.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">protector; never accepted Islam</text><rect x="30" y="254" width="450" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="282.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Hamza</text><text x="44" y="305.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">"Lion of God"; martyred at Uhud</text><rect x="30" y="334" width="450" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="362.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Bilal</text><text x="44" y="385.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">first mu'adhdhin</text><rect x="30" y="414" width="450" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="442.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Mus'ab ibn Umayr</text><text x="44" y="465.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">first teacher sent to Yathrib; martyred at Uhud</text><rect x="30" y="494" width="450" height="91" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="522.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Zayd ibn Haritha</text><text x="44" y="545.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">freed and adopted; the only Companion named in the</text><text x="44" y="566.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Qur'an (Sura 33.37)</text><rect x="30" y="595" width="450" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="623.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Salman al-Farsi</text><text x="44" y="646.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">suggested the trench</text><text x="685" y="150" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">OPPONENTS</text><rect x="500" y="174" width="370" height="47" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="514" y="202.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Abu Lahab</text><rect x="500" y="231" width="370" height="70" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="514" y="259.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Abu Jahl</text><text x="514" y="282.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">killed at Badr</text><rect x="500" y="311" width="370" height="91" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="514" y="339.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Abu Sufyan</text><text x="514" y="362.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">led the Quraysh; accepted Islam at the</text><text x="514" y="383.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">conquest of Makka</text><rect x="500" y="412" width="370" height="91" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="514" y="440.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Khalid ibn al-Walid</text><text x="514" y="463.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">led the cavalry at Uhud; accepted Islam after</text><text x="514" y="484.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Hudaybiyya; "Sword of God"</text>
</svg>