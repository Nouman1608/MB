<rect width="900" height="523" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Explaining differential achievement</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">keep the three social variables analytically separate</text>
<rect x="30" y="120" width="269.3333333333333" height="262" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,170 L31.25,134.25 Q31.25,121.25 44.25,121.25 L285.0833333333333,121.25 Q298.0833333333333,121.25 298.0833333333333,134.25 L298.0833333333333,170 Z" fill="#b5d3cf"/><line x1="31.25" y1="170" x2="298.0833333333333" y2="170" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="151" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Social class</text><circle cx="51" cy="197.92" r="4.5" fill="#2e6b62"/><text x="64" y="203.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Material:</tspan> the cost of</text><text x="64" y="224.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">educational resources</text><circle cx="51" cy="247.92" r="4.5" fill="#2e6b62"/><text x="64" y="253.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Cultural:</tspan> Bourdieu’s</text><text x="64" y="274.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cultural capital;</text><text x="64" y="295.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">restricted and elaborated</text><text x="64" y="316.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">speech codes</text><rect x="315.3333333333333" y="120" width="269.3333333333333" height="262" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,170 L316.5833333333333,134.25 Q316.5833333333333,121.25 329.5833333333333,121.25 L570.4166666666666,121.25 Q583.4166666666666,121.25 583.4166666666666,134.25 L583.4166666666666,170 Z" fill="#f2e7b8"/><line x1="316.5833333333333" y1="170" x2="583.4166666666666" y2="170" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="151" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Gender</text><circle cx="336.3333333333333" cy="197.92" r="4.5" fill="#2e6b62"/><text x="349.3333333333333" y="203.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Boys’ current</text><text x="349.3333333333333" y="224.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">underachievement relative</text><text x="349.3333333333333" y="245.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to girls, including</text><text x="349.3333333333333" y="266.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">critiques of laddish</text><text x="349.3333333333333" y="287.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">subcultures</text><circle cx="336.3333333333333" cy="310.92" r="4.5" fill="#2e6b62"/><text x="349.3333333333333" y="316.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Girls’ historical</text><text x="349.3333333333333" y="337.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">underachievement and later</text><text x="349.3333333333333" y="358.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">improvement</text><rect x="600.6666666666666" y="120" width="269.3333333333333" height="262" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,170 L601.9166666666666,134.25 Q601.9166666666666,121.25 614.9166666666666,121.25 L855.75,121.25 Q868.75,121.25 868.75,134.25 L868.75,170 Z" fill="#dce9e7"/><line x1="601.9166666666666" y1="170" x2="868.75" y2="170" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="151" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Ethnicity</text><circle cx="621.6666666666666" cy="197.92" r="4.5" fill="#2e6b62"/><text x="634.6666666666666" y="203.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Material:</tspan> material</text><text x="634.6666666666666" y="224.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">deprivation</text><circle cx="621.6666666666666" cy="247.92" r="4.5" fill="#2e6b62"/><text x="634.6666666666666" y="253.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">In-school processes:</tspan></text><text x="634.6666666666666" y="274.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">teacher labelling; setting</text><text x="634.6666666666666" y="295.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and streaming</text><rect x="30" y="398" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="434" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Weigh, do not merge</text><text x="56" y="463" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Within each variable, set one type of explanation against another. Questions may still ask</text><text x="56" y="485" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">you to compare across variables or discuss how they interact.</text>
</svg>