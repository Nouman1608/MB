<rect width="900" height="406" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Labelling in education</text>

<rect x="30" y="120" width="174" height="148" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="117" y="152.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Label attached</text><text x="117" y="182.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">by teachers or the</text><text x="117" y="203.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">system, e.g.</text><text x="117" y="224.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">"able" or</text><text x="117" y="245.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">"disruptive"</text><line x1="208" y1="194" x2="248" y2="194" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="252" y="120" width="174" height="148" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="339" y="162.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Expectation</text><text x="339" y="192.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">the label sets</text><text x="339" y="213.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">what is expected</text><text x="339" y="234.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">of the student</text><line x1="430" y1="194" x2="470" y2="194" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="474" y="120" width="174" height="148" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="561" y="162.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Behaviour</text><text x="561" y="192.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">the student’s</text><text x="561" y="213.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">behaviour is</text><text x="561" y="234.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">influenced</text><line x1="652" y1="194" x2="692" y2="194" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="696" y="120" width="174" height="148" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="783" y="173.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Outcome</text><text x="783" y="203.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">achievement shaped</text><text x="783" y="224.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">by the label</text><path d="M765,288 C765,348 135,348 135,294" fill="none" stroke="#8a6d0d" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 7" marker-end="url(#ahO)"/><text x="450" y="366" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">sometimes a self-fulfilling prophecy</text>
</svg>