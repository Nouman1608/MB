<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 636" width="900" height="636" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="636" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Claim, claim, contrast</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">comparing two views of role allocation</text>
<rect x="30" y="120" width="840" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="190" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="197.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="104" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Claim 1: functionalist</text><text x="104" y="189.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Education fairly allocates individuals to jobs suited to their talents and abilities,</text><text x="104" y="211.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">through meritocratic qualifications and assessment, benefiting both the individual</text><text x="104" y="233.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and society.</text><line x1="450" y1="264" x2="450" y2="300" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="306" width="840" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="376" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="383.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="104" y="345.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Claim 2: Marxist</text><text x="104" y="375.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Education appears meritocratic but reproduces class inequality: working-class</text><text x="104" y="397.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">students are disadvantaged through cultural capital, resources and school processes,</text><text x="104" y="419.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">so allocation reflects class background, not ability.</text><line x1="450" y1="450" x2="450" y2="486" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="492" width="840" height="118" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="67" cy="551" r="21" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="67" y="558.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="104" y="531.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Contrast</text><text x="104" y="561.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Functionalism presents allocation as broadly fair and beneficial to all; Marxism</text><text x="104" y="583.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">presents the same process as reproducing inequality behind an appearance of fairness.</text>
</svg>