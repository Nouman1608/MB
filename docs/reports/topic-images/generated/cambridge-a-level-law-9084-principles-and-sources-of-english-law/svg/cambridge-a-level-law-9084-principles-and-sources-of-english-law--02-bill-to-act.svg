<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 916" width="900" height="916" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="916" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From green paper to Act of Parliament</text>

<rect x="150" y="100" width="275" height="75" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="287.5" y="128" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">GREEN PAPER</text><text x="287.5" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Consults on options</text><line x1="431" y1="137.5" x2="469" y2="137.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="475" y="100" width="275" height="75" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="612.5" y="128" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">WHITE PAPER</text><text x="612.5" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Sets out firm proposals</text><path d="M612,177 L612,215 L230,215" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><line x1="230" y1="215" x2="230" y2="233" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="80" y="237" width="300" height="280" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="269" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">First House</text><rect x="104" y="289" width="252" height="36" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="230" y="313" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">First Reading</text><rect x="104" y="333" width="252" height="36" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="230" y="357" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Second Reading</text><rect x="104" y="377" width="252" height="36" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="230" y="401" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Committee Stage</text><rect x="104" y="421" width="252" height="36" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="230" y="445" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Report Stage</text><rect x="104" y="465" width="252" height="36" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="230" y="489" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Third Reading</text><rect x="520" y="237" width="300" height="280" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="670" y="269" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Second House</text><rect x="544" y="289" width="252" height="36" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="670" y="313" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">First Reading</text><rect x="544" y="333" width="252" height="36" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="670" y="357" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Second Reading</text><rect x="544" y="377" width="252" height="36" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="670" y="401" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Committee Stage</text><rect x="544" y="421" width="252" height="36" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="670" y="445" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Report Stage</text><rect x="544" y="465" width="252" height="36" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="670" y="489" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Third Reading</text><line x1="384" y1="377" x2="516" y2="377" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><path d="M670,517 L670,537 L450,537" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><line x1="450" y1="537" x2="450" y2="553" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="300" y="557" width="300" height="89" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="592.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Royal Assent</text><text x="450" y="621.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">the Bill becomes an Act</text><rect x="30" y="668" width="413" height="216" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="696" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PARLIAMENT ACTS 1911 AND 1949</text><text x="46" y="722.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The elected Commons prevails</text><text x="46" y="750.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="61.2" y="750.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Most Bills: passed without Lords’ consent after</text><text x="61.2" y="771.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a delay of about a year</text><text x="46" y="796.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="61.2" y="796.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Money Bills: after one month</text><text x="46" y="821.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="61.2" y="821.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Used for the War Crimes Act 1991 and Hunting</text><text x="61.2" y="842.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Act 2004; 1949 Act upheld in <tspan font-style="italic">R</tspan> <tspan font-style="italic">(Jackson)</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">A-G</tspan></text><text x="61.2" y="863.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(2005)</text><rect x="457" y="668" width="413" height="216" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="473" y="696" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PARLIAMENTARY SUPREMACY</text><text x="473" y="722.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">No court can invalidate an Act</text><text x="473" y="750.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="488.2" y="750.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Can make or repeal any law; cannot bind</text><text x="488.2" y="771.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">successors</text><text x="473" y="796.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="488.2" y="796.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Pickin</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">British</tspan> <tspan font-style="italic">Railways</tspan> <tspan font-style="italic">Board</tspan> (1974): no</text><text x="488.2" y="817.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">inquiry into how an Act was passed</text><text x="473" y="842.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="488.2" y="842.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A s4 HRA 1998 declaration leaves the Act in</text><text x="488.2" y="863.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">force</text>
</svg>