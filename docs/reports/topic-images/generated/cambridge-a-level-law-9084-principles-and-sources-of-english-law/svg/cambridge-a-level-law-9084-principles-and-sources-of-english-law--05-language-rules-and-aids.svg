<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 603" width="900" height="603" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="603" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Rules of language and aids to interpretation</text>

<rect x="30" y="100" width="270.6666666666667" height="189" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="128" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EJUSDEM GENERIS</text><text x="46" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">General words follow a list</text><text x="46" y="182.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Powell</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Kempton</tspan> <tspan font-style="italic">Park</tspan> (1899):</text><text x="46" y="203.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“house, office, room or other</text><text x="46" y="224.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">place” meant indoor places</text><rect x="314.6666666666667" y="100" width="270.6666666666667" height="189" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330.6666666666667" y="128" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXPRESSIO UNIUS</text><text x="330.6666666666667" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Naming some excludes</text><text x="330.6666666666667" y="177.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">others</text><text x="330.6666666666667" y="205.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Tempest</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Kilner</tspan> (1846):</text><text x="330.6666666666667" y="226.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“goods, wares and</text><text x="330.6666666666667" y="247.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">merchandise” excluded stocks</text><text x="330.6666666666667" y="268.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and shares</text><rect x="599.3333333333334" y="100" width="270.6666666666667" height="189" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="615.3333333333334" y="128" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NOSCITUR A SOCIIS</text><text x="615.3333333333334" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A word is known by its</text><text x="615.3333333333334" y="177.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">companions</text><text x="615.3333333333334" y="205.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">IRC</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Frere</tspan> (1965): “interest”</text><text x="615.3333333333334" y="226.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">took meaning from “annual</text><text x="615.3333333333334" y="247.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">interest”</text><rect x="30" y="311" width="413" height="122" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="339" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INTRINSIC AIDS: INSIDE THE ACT</text><text x="46" y="370.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Preamble, titles, headings, schedules, marginal</text><text x="46" y="391.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">notes, interpretation sections</text><rect x="457" y="311" width="413" height="122" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="473" y="339" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXTRINSIC AIDS: OUTSIDE THE ACT</text><text x="473" y="370.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Earlier Acts on the topic, earlier case law,</text><text x="473" y="391.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">historical setting, dictionaries of the time, law</text><text x="473" y="412.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reform reports, international treaties, Hansard</text><rect x="30" y="455" width="840" height="116" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="489.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Pepper v Hart (1993): Hansard only where</text><text x="50" y="519.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="519.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the words are ambiguous, <tspan font-weight="700" fill="#1e2a44">and</tspan></text><text x="50" y="546.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="546.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">a ministerial statement clearly resolves the point.</text>
</svg>