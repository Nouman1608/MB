<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="620" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The rule of law</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Dicey’s three ideas, and where to apply them</text>
<rect x="30" y="124" width="270.6666666666667" height="121" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="165.33333333333334" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">IDEA 1</text><text x="165.33333333333334" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">No punishment except for</text><text x="165.33333333333334" y="201.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">a breach of law proved in</text><text x="165.33333333333334" y="224.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">the ordinary courts</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="121" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="175" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">IDEA 2</text><text x="450" y="201.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Equality before the law</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="121" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="734.6666666666667" y="163.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">IDEA 3</text><text x="734.6666666666667" y="189.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Rights secured by the</text><text x="734.6666666666667" y="212.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">ordinary law</text><rect x="30" y="267" width="840" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="300.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-style="italic">Entick</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Carrington</tspan> (1765): state officers who searched a house without lawful authority were liable</text><text x="450" y="322.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">in trespass.</text><text x="450" y="381" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">APPLY THE PRINCIPLE TO…</text><rect x="30" y="403" width="270.6666666666667" height="185" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="431" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LAW MAKING</text><text x="46" y="462.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Laws made openly, clear and</text><text x="46" y="483.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">prospective; retrospective</text><text x="46" y="504.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">criminal laws offend it</text><rect x="314.6666666666667" y="403" width="270.6666666666667" height="185" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="330.6666666666667" y="431" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THE LEGAL SYSTEM</text><text x="330.6666666666667" y="462.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Access to independent courts,</text><text x="330.6666666666667" y="483.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">legal advice and fair trial</text><text x="330.6666666666667" y="504.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">procedures</text><rect x="599.3333333333334" y="403" width="270.6666666666667" height="185" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="615.3333333333334" y="431" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SUBSTANTIVE LAW</text><text x="615.3333333333334" y="462.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Treat like cases alike: <tspan font-style="italic">A</tspan> <tspan font-style="italic">v</tspan></text><text x="615.3333333333334" y="483.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Home</tspan> <tspan font-style="italic">Secretary</tspan> (2004),</text><text x="615.3333333333334" y="504.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">indefinite detention without</text><text x="615.3333333333334" y="525.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">trial of foreign terrorist</text><text x="615.3333333333334" y="546.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">suspects incompatible with</text><text x="615.3333333333334" y="567.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Convention rights</text>
</svg>