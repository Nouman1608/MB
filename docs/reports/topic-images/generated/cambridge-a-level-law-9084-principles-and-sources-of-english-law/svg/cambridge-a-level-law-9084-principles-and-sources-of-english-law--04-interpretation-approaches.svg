<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 722" width="900" height="722" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="722" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four approaches to statutory interpretation</text>

<rect x="30" y="100" width="840" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="128" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LITERAL RULE</text><text x="46" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ordinary meaning of the words</text><text x="46" y="182.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Whiteley</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Chappell</tspan> (1868): impersonating a dead voter was not impersonating “a person entitled to vote”</text><rect x="30" y="215" width="840" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="243" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GOLDEN RULE</text><text x="46" y="269.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Modify the words to avoid an absurd result</text><text x="46" y="297.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Adler</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">George</tspan> (1964): “in the vicinity of” read to include inside a prohibited place</text><rect x="30" y="330" width="840" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="358" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MISCHIEF RULE</text><text x="46" y="384.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">What did the Act target?</text><text x="46" y="412.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Smith</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Hughes</tspan> (1960): soliciting from balconies was “in a street”; the Act targeted soliciting seen by</text><text x="46" y="433.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">passers-by</text><rect x="30" y="466" width="840" height="124" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="494" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PURPOSIVE APPROACH</text><text x="46" y="520.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Give effect to the Act’s purpose</text><text x="46" y="548.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">(Quintavalle)</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Secretary</tspan> <tspan font-style="italic">of</tspan> <tspan font-style="italic">State</tspan> <tspan font-style="italic">for</tspan> <tspan font-style="italic">Health</tspan> (2003): embryos from cell nuclear replacement fell within</text><text x="46" y="569.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the Act’s purpose</text><rect x="30" y="612" width="840" height="78" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="644.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Encouraged by EU membership (<tspan font-style="italic">Pickstone</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Freemans</tspan>, 1988) and by s3 Human Rights Act 1998: read</text><text x="50" y="665.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">compatibly “so far as it is possible” (<tspan font-style="italic">Ghaidan</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Godin-Mendoza</tspan>, 2004).</text>
</svg>