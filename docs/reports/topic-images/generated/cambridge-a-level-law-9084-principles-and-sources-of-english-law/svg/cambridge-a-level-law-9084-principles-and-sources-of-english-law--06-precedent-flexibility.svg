<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="600" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Judicial precedent: when courts can escape</text>

<rect x="30" y="100" width="413" height="201" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SUPREME COURT</text><text x="48" y="156.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Practice Statement 1966</text><text x="48" y="184.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Herrington</tspan> (1972) overruled <tspan font-style="italic">Addie</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Dumbreck</tspan></text><text x="48" y="205.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1929) on child trespassers</text><text x="48" y="232.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Shivpuri</tspan> (1986) overruled <tspan font-style="italic">Anderton</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Ryan</tspan></text><text x="48" y="253.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1985) within a year</text><rect x="457" y="100" width="413" height="201" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="475" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COURT OF APPEAL (CIVIL)</text><text x="475" y="156.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Bound by itself, except (Young v Bristol</text><text x="475" y="179.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Aeroplane, 1944):</text><text x="475" y="207.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="490.2" y="207.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">two of its decisions conflict</text><text x="475" y="232.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="490.2" y="232.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">its decision conflicts with a later House of</text><text x="490.2" y="253.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lords or Supreme Court decision</text><text x="475" y="278.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="490.2" y="278.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">it was made <tspan font-style="italic">per</tspan> <tspan font-style="italic">incuriam</tspan></text><rect x="30" y="323" width="270.6666666666667" height="143" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="351" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ORIGINAL</text><text x="46" y="382.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A new point: <tspan font-style="italic">Donoghue</tspan> <tspan font-style="italic">v</tspan></text><text x="46" y="403.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Stevenson</tspan> (1932)</text><rect x="314.6666666666667" y="323" width="270.6666666666667" height="143" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330.6666666666667" y="351" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PERSUASIVE</text><text x="330.6666666666667" y="382.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Obiter dicta, lower courts, Privy</text><text x="330.6666666666667" y="403.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Council, foreign courts. <tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan></text><text x="330.6666666666667" y="424.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">James</tspan> <tspan font-style="italic">and</tspan> <tspan font-style="italic">Karimi</tspan> (2006)</text><text x="330.6666666666667" y="445.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">followed <tspan font-style="italic">Holley</tspan> (PC)</text><rect x="599.3333333333334" y="323" width="270.6666666666667" height="143" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="615.3333333333334" y="351" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AVOIDANCE</text><text x="615.3333333333334" y="382.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Distinguishing (<tspan font-style="italic">Balfour</tspan> v</text><text x="615.3333333333334" y="403.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Merritt</tspan>: separated spouses),</text><text x="615.3333333333334" y="424.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">overruling, reversing</text><rect x="30" y="488" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="521.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700" fill="#1e2a44">Common</tspan> <tspan font-weight="700" fill="#1e2a44">mistake:</tspan> the <tspan font-style="italic">Young</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Bristol</tspan> <tspan font-style="italic">Aeroplane</tspan> exceptions apply to the Court of Appeal, not the</text><text x="450" y="543.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Supreme Court.</text>
</svg>