<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 514" width="900" height="514" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="514" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Feature, constraint, consequence</text>

<text x="450" y="128" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Question: how has the topography of northern Pakistan influenced transport?</text><rect x="30" y="150" width="260" height="236" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" /><circle cx="160" cy="190" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="160" y="197.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="160" y="244" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Named feature</text><text x="52" y="284" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Karakoram and Himalaya</text><line x1="293" y1="268" x2="316" y2="268" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="320" y="150" width="260" height="236" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><circle cx="450" cy="190" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="450" y="197.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="450" y="244" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Physical constraint</text><text x="342" y="284" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Steep, high-altitude</text><text x="342" y="308" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">terrain makes road and</text><text x="342" y="332" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">rail difficult and</text><text x="342" y="356" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">expensive</text><line x1="583" y1="268" x2="606" y2="268" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="610" y="150" width="260" height="236" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" /><circle cx="740" cy="190" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="740" y="197.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="740" y="244" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Human consequence</text><text x="632" y="284" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Routes concentrated</text><text x="632" y="308" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">along valleys and</text><text x="632" y="332" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">passes, not a dense,</text><text x="632" y="356" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">evenly spread network</text><rect x="30" y="410" width="840" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="444" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Avoid a vague answer about “harsh climate”: name the climate zone,</text><text x="450" y="470" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">the season and the precise human effect.</text>
</svg>