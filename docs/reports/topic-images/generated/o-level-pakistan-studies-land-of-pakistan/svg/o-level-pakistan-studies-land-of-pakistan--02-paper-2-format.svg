<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How Paper 2 is examined</text>

<rect x="30" y="110" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="152" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">Paper 2</text><text x="60" y="202" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="start">1 h 30 min</text><text x="60" y="230" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">time</text><text x="330" y="202" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="start">75 marks</text><text x="330" y="230" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">50% of the qualification</text><text x="600" y="202" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="start">3 from 5</text><text x="600" y="230" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">questions answered</text><text x="450" y="296" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Each question: 25 marks in four parts, built around maps, graphs, photographs and other resources</text><rect x="60" y="316" width="180" height="90" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" /><text x="150" y="356" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">(a)</text><text x="150" y="388" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">resource-based</text><line x1="242" y1="361" x2="258" y2="361" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="260" y="316" width="180" height="90" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" /><text x="350" y="356" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">(b)</text><text x="350" y="388" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">resource-based</text><line x1="442" y1="361" x2="458" y2="361" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="460" y="316" width="180" height="90" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" /><text x="550" y="356" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">(c)</text><text x="550" y="388" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">resource-based</text><line x1="642" y1="361" x2="658" y2="361" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="660" y="316" width="180" height="90" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" /><text x="750" y="356" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">(d)</text><text x="750" y="388" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">tests analysis</text><rect x="30" y="430" width="840" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="468" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">For Section 1</text><text x="60" y="498" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Map recall is tested visually as often as in writing: practise locating every named</text><text x="60" y="522" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">landform, river, desert and city on a blank outline map.</text>
