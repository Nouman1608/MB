<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="700" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Climate: from pattern to people</text>

<rect x="30" y="110" width="840" height="150" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="60" y="150" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="start">The monsoon</text><text x="60" y="182" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Seasonal reversal of wind direction and pressure systems</text><text x="60" y="212" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">brings the bulk of annual rainfall to much of the country:</text><text x="60" y="240" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">the most consequential climatic feature for agriculture and water supply.</text><rect x="30" y="280" width="200" height="50" rx="10" fill="#efdfa8" stroke="#1e2a44" stroke-width="2" /><text x="130" y="312" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Arid</text><rect x="243" y="280" width="200" height="50" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="343" y="312" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Semi-arid</text><rect x="456" y="280" width="200" height="50" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2" /><text x="556" y="312" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Humid</text><rect x="669" y="280" width="200" height="50" rx="10" fill="#dfe7f2" stroke="#1e2a44" stroke-width="2" /><text x="769" y="312" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Highland</text><text x="450" y="358" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Climate zones, each with distinct seasons</text><rect x="30" y="380" width="410" height="170" rx="14" fill="#ffffff" stroke="#2b5a9a" stroke-width="2.5"/><text x="54" y="418" font-size="21" font-weight="700" fill="#2b5a9a" text-anchor="start">Highland north</text><circle cx="60" cy="450.06" r="5" fill="#2b5a9a"/><text x="76" y="456" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Low temperatures</text><circle cx="60" cy="483.46" r="5" fill="#2b5a9a"/><text x="76" y="489.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Ice and snow shape the lives of</text><text x="76" y="512.8" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">mountain communities</text><rect x="460" y="380" width="410" height="170" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="484" y="418" font-size="21" font-weight="700" fill="#b5602e" text-anchor="start">Lowlands</text><circle cx="490" cy="450.06" r="5" fill="#b5602e"/><text x="506" y="456" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Drought and water shortage</text><circle cx="490" cy="483.46" r="5" fill="#b5602e"/><text x="506" y="489.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Flooding from heavy rain storms</text><line x1="235" y1="554" x2="400" y2="594" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="665" y1="554" x2="500" y2="594" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="220" y="600" width="460" height="80" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="3" /><text x="450" y="634" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Effect on people</text><text x="450" y="662" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">farming · industry · water supply · daily life</text>
</svg>