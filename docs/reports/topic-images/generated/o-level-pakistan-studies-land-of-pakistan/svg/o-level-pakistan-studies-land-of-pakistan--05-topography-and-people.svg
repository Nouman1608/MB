<rect width="900" height="540" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How relief shapes land use and transport</text>

<rect x="30" y="110" width="410" height="410" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="235" y="148" font-size="22" font-weight="700" fill="#b5602e" text-anchor="middle">Steep mountain terrain</text><path d="M50,330 L120,200 L170,260 L240,170 L300,250 L330,215 L420,330 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><path d="M150,330 Q175,290 205,300 Q235,310 260,330 Z" fill="#a9c48f" stroke="#1e2a44" stroke-width="2"/><rect x="180" y="312" width="14" height="12" fill="#ffffff" stroke="#1e2a44" stroke-width="1.5"/><rect x="205" y="312" width="14" height="12" fill="#ffffff" stroke="#1e2a44" stroke-width="1.5"/><rect x="228" y="312" width="14" height="12" fill="#ffffff" stroke="#1e2a44" stroke-width="1.5"/><path d="M60,330 Q120,306 160,322 Q210,340 260,318 Q300,304 410,330" fill="none" stroke="#b5602e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 6"/><text x="235" y="362" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">route winds along the valley floor</text><circle cx="60" cy="394.06" r="5" fill="#b5602e"/><text x="76" y="400" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Road and rail are difficult and</text><text x="76" y="423.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">expensive to build</text><circle cx="60" cy="450.86" r="5" fill="#b5602e"/><text x="76" y="456.8" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Settlement concentrated in valleys</text><circle cx="60" cy="484.26000000000005" r="5" fill="#b5602e"/><text x="76" y="490.20000000000005" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Routes follow valleys and passes</text><rect x="460" y="110" width="410" height="410" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="665" y="148" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="middle">Flatter river plains</text><rect x="480" y="300" width="370" height="40" fill="#a9c48f" stroke="#1e2a44" stroke-width="2.5"/><line x1="495" y1="300" x2="515" y2="340" stroke="#6f9a52" stroke-width="2"/><line x1="555" y1="300" x2="575" y2="340" stroke="#6f9a52" stroke-width="2"/><line x1="615" y1="300" x2="635" y2="340" stroke="#6f9a52" stroke-width="2"/><line x1="675" y1="300" x2="695" y2="340" stroke="#6f9a52" stroke-width="2"/><line x1="735" y1="300" x2="755" y2="340" stroke="#6f9a52" stroke-width="2"/><line x1="795" y1="300" x2="815" y2="340" stroke="#6f9a52" stroke-width="2"/><rect x="500" y="270" width="26" height="22" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><path d="M497,270 L513,258 L529,270 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="1.5"/><rect x="590" y="270" width="26" height="22" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><path d="M587,270 L603,258 L619,270 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="1.5"/><rect x="680" y="270" width="26" height="22" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><path d="M677,270 L693,258 L709,270 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="1.5"/><rect x="770" y="270" width="26" height="22" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><path d="M767,270 L783,258 L799,270 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="1.5"/><path d="M480,296 L850,296" fill="none" stroke="#b5602e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="665" y="230" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">straight routes and evenly spread</text><text x="665" y="250" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">settlement on flat land</text><text x="665" y="366" font-size="16" font-weight="600" fill="#3d5f2a" text-anchor="middle">farmland on the plain</text><circle cx="490" cy="394.06" r="5" fill="#2e6b62"/><text x="506" y="400" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Denser transport networks</text><circle cx="490" cy="427.46" r="5" fill="#2e6b62"/><text x="506" y="433.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Supports agriculture</text>
</svg>