<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Mountains, plateaux, deserts and rivers</text>

<rect x="30" y="110" width="270" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M65,220 L115,140 L145,180 L185,125 L265,220 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><path d="M171,144 L185,125 L199,144 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><line x1="55" y1="220" x2="275" y2="220" stroke="#1e2a44" stroke-width="2.5"/><text x="165" y="262" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Mountain ranges</text><text x="165" y="286" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">north and west</text><rect x="60" y="304" width="210" height="30" rx="15" fill="#dce9e7" stroke="none" stroke-width="0" /><text x="165" y="325" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Hindu Kush</text><rect x="60" y="340" width="210" height="30" rx="15" fill="#dce9e7" stroke="none" stroke-width="0" /><text x="165" y="361" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Karakoram</text><rect x="60" y="376" width="210" height="30" rx="15" fill="#dce9e7" stroke="none" stroke-width="0" /><text x="165" y="397" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Himalaya</text><rect x="60" y="412" width="210" height="30" rx="15" fill="#dce9e7" stroke="none" stroke-width="0" /><text x="165" y="433" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Sulaiman Range</text><rect x="60" y="448" width="210" height="30" rx="15" fill="#dce9e7" stroke="none" stroke-width="0" /><text x="165" y="469" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Safed Koh</text><rect x="315" y="110" width="270" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M350,220 L380,160 L520,160 L550,220 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><line x1="340" y1="220" x2="560" y2="220" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="262" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Plateaux</text><rect x="345" y="304" width="210" height="30" rx="15" fill="#f2e7b8" stroke="none" stroke-width="0" /><text x="450" y="325" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Balochistan Plateau</text><rect x="345" y="340" width="210" height="30" rx="15" fill="#f2e7b8" stroke="none" stroke-width="0" /><text x="450" y="361" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Potwar Plateau</text><rect x="345" y="376" width="210" height="30" rx="15" fill="#f2e7b8" stroke="none" stroke-width="0" /><text x="450" y="397" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Salt Range</text><rect x="600" y="110" width="270" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M635,220 Q675,170 715,220 Q755,186 795,220 Q815,200 835,220 Z" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><line x1="625" y1="220" x2="845" y2="220" stroke="#1e2a44" stroke-width="2.5"/><text x="735" y="262" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Deserts</text><text x="735" y="286" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">with the river plains of the south</text><rect x="630" y="304" width="210" height="30" rx="15" fill="#efdfa8" stroke="none" stroke-width="0" /><text x="735" y="325" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Thar</text><rect x="630" y="340" width="210" height="30" rx="15" fill="#efdfa8" stroke="none" stroke-width="0" /><text x="735" y="361" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Thal</text><rect x="630" y="376" width="210" height="30" rx="15" fill="#efdfa8" stroke="none" stroke-width="0" /><text x="735" y="397" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Kharan</text><rect x="30" y="520" width="840" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="558" font-size="22" font-weight="700" fill="#2b5a9a" text-anchor="start">Rivers</text><rect x="80" y="584" width="126" height="40" rx="10" fill="#dfe7f2" stroke="#2b5a9a" stroke-width="2" /><text x="143" y="610" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Jhelum</text><line x1="143" y1="626" x2="215" y2="670" stroke="#2b5a9a" stroke-width="3" marker-end="url(#ah)"/><rect x="230" y="584" width="126" height="40" rx="10" fill="#dfe7f2" stroke="#2b5a9a" stroke-width="2" /><text x="293" y="610" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Chenab</text><line x1="293" y1="626" x2="265" y2="670" stroke="#2b5a9a" stroke-width="3" marker-end="url(#ah)"/><rect x="380" y="584" width="126" height="40" rx="10" fill="#dfe7f2" stroke="#2b5a9a" stroke-width="2" /><text x="443" y="610" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Ravi</text><line x1="443" y1="626" x2="315" y2="670" stroke="#2b5a9a" stroke-width="3" marker-end="url(#ah)"/><rect x="530" y="584" width="126" height="40" rx="10" fill="#dfe7f2" stroke="#2b5a9a" stroke-width="2" /><text x="593" y="610" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Sutlej</text><line x1="593" y1="626" x2="365" y2="670" stroke="#2b5a9a" stroke-width="3" marker-end="url(#ah)"/><rect x="180" y="676" width="240" height="50" rx="12" fill="#2b5a9a" stroke="#1e2a44" stroke-width="2.5" /><text x="300" y="708" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Indus</text><text x="250" y="652" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="560" y="680" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">tributaries feed the Indus,</text><text x="560" y="700" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">which feeds the southern plains</text><text x="700" y="600" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Also named:</text><text x="700" y="622" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Kabul, Hab, Dasht</text>
