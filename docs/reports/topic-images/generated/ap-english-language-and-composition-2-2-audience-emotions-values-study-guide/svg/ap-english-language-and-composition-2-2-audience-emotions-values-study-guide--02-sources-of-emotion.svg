<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 631" width="900" height="631" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="631" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Where emotion comes from</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Writers build feeling from language and content</text>
<rect x="30" y="122" width="220" height="48" rx="24" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="140" y="152" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">Connotation</text><rect x="270" y="122" width="600" height="48" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="282" y="151.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“squatting” vs “occupying” vs “sheltering in”</text><rect x="30" y="180" width="220" height="62.24000000000001" rx="24" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="140" y="217.12" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">Imagery</text><rect x="270" y="180" width="600" height="62.24000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="282" y="205.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“The swing still turns in the wind, but no child has touched it since</text><text x="282" y="226.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">March.”</text><rect x="30" y="252.24" width="220" height="48" rx="24" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="140" y="282.24" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">Narrative and anecdote</text><rect x="270" y="252.24" width="600" height="48" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="282" y="281.28000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Mrs Okafor has queued at the clinic door at five each morning...”</text><rect x="30" y="310.24" width="220" height="48" rx="24" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="140" y="340.24" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">Shared experience</text><rect x="270" y="310.24" width="600" height="48" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="282" y="339.28000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“...the smell of the school library on a wet Monday.”</text><rect x="30" y="368.24" width="220" height="62.24000000000001" rx="24" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="140" y="405.36" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">Values language</text><rect x="270" y="368.24" width="600" height="62.24000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="282" y="393.84000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“It is simply not fair that the children who most need the bus are the ones</text><text x="282" y="414.96000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">who lose it.”</text><rect x="30" y="440.48" width="220" height="62.24000000000001" rx="24" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="140" y="477.6" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">Rhythm and repetition</text><rect x="270" y="440.48" width="600" height="62.24000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="282" y="466.08000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“We have waited. We have written. We have signed. We will not wait</text><text x="282" y="487.20000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">again.”</text><rect x="30" y="512.72" width="220" height="48" rx="24" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="140" y="542.72" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">Direct address</text><rect x="270" y="512.72" width="600" height="48" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="282" y="541.7600000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“You know this road.”</text><text x="450" y="588.72" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">An emotion rarely comes from one device alone; several often work together.</text>
</svg>