<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="550" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">When emotion persuades</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Four tests for an emotional appeal</text>
<text x="400" y="130" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">Persuades</text><text x="715" y="130" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">Backfires</text><text x="30" y="190" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Relevant?</text><rect x="230" y="146" width="340" height="74" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="244" y="177.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">✓ arises from something that bears on</text><text x="244" y="198.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">the claim</text><rect x="590" y="146" width="280" height="74" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="604" y="177.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">✗ a tearful story about an</text><text x="604" y="198.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">unrelated topic</text><text x="30" y="276" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Proportionate?</text><rect x="230" y="232" width="340" height="74" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="244" y="274.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">✓ the feeling fits the situation</text><rect x="590" y="232" width="280" height="74" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="604" y="263.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">✗ extreme language about a</text><text x="604" y="284.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">minor matter</text><text x="30" y="362" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Supported?</text><rect x="230" y="318" width="340" height="74" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="244" y="360.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">✓ a moving story plus a verifiable fact</text><rect x="590" y="318" width="280" height="74" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="604" y="349.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">✗ feeling with no evidence</text><text x="604" y="370.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">behind it</text><text x="30" y="448" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Respectful?</text><rect x="230" y="404" width="340" height="74" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="244" y="435.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">✓ treats the audience as capable of</text><text x="244" y="456.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">judgement</text><rect x="590" y="404" width="280" height="74" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="604" y="435.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">✗ playing on fear without</text><text x="604" y="456.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">evidence; mocking opponents</text><text x="450" y="508" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">On the exam: explain what an appeal does and whether it suits the audience and purpose.</text>
</svg>