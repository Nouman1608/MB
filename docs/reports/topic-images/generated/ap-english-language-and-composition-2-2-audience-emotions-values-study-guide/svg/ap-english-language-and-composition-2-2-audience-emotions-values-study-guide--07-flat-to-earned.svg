<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 575" width="900" height="575" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="575" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Emotion earned by detail</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Worked example 2: the playing field</text>
<text x="30" y="138" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start" xml:space="preserve">Flat draft: accurate but inert</text><rect x="30" y="152" width="840" height="79.52000000000001" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="48" y="185.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“The playing field is being sold to developers. This will reduce green space. People will</text><text x="48" y="209.06" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">have fewer places to exercise.”</text><line x1="450" y1="237.51999999999998" x2="450" y2="263.52" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="30" y="279.52" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Revision</text><rect x="30" y="293.52" width="840" height="127.04000000000002" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5" /><text x="48" y="326.82" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">The <tspan font-weight="700" fill="#2e6b62">Marsh</tspan> <tspan font-weight="700" fill="#2e6b62">Lane</tspan> <tspan font-weight="700" fill="#2e6b62">field</tspan>, where <tspan font-weight="700" fill="#2e6b62">Saturday</tspan> <tspan font-weight="700" fill="#2e6b62">football</tspan> has been played for <tspan font-weight="700">sixty</tspan> <tspan font-weight="700">years</tspan>, <tspan font-weight="700">is</tspan> <tspan font-weight="700">being</tspan></text><text x="48" y="350.58" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">sold</tspan> <tspan font-weight="700">to</tspan> <tspan font-weight="700">developers</tspan>. If it goes, the nearest open space for the <tspan font-weight="700">300</tspan> <tspan font-weight="700">children</tspan> at <tspan font-weight="700" fill="#2e6b62">Marsh</tspan> <tspan font-weight="700" fill="#2e6b62">Lane</tspan></text><text x="48" y="374.34" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#2e6b62">Primary</tspan> will be <tspan font-weight="700" fill="#2e6b62">a</tspan> <tspan font-weight="700" fill="#2e6b62">car-park-sized</tspan> <tspan font-weight="700" fill="#2e6b62">lawn</tspan> <tspan font-weight="700" fill="#2e6b62">two</tspan> <tspan font-weight="700" fill="#2e6b62">miles</tspan> <tspan font-weight="700" fill="#2e6b62">away</tspan>. <tspan font-weight="700" fill="#8a6d0d">A</tspan> <tspan font-weight="700" fill="#8a6d0d">community</tspan> <tspan font-weight="700" fill="#8a6d0d">that</tspan> <tspan font-weight="700" fill="#8a6d0d">cares</tspan> <tspan font-weight="700" fill="#8a6d0d">for</tspan> <tspan font-weight="700" fill="#8a6d0d">its</tspan></text><text x="48" y="398.1" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#8a6d0d">children</tspan> does not trade their playing field for a row of houses.</text><rect x="30" y="440.56" width="269.3333333333333" height="62.24000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="42" y="466.16" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Facts</tspan> <tspan font-weight="700">kept:</tspan> the sale, sixty</text><text x="42" y="487.28000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">years, 300 children</text><rect x="315.3333333333333" y="440.56" width="269.3333333333333" height="62.24000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="327.3333333333333" y="466.16" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#2e6b62">Added:</tspan> a concrete place and a</text><text x="327.3333333333333" y="487.28000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">human group</text><rect x="600.6666666666666" y="440.56" width="269.3333333333333" height="62.24000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="612.6666666666666" y="466.16" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#8a6d0d">Added:</tspan> a shared value</text><text x="450" y="532.8" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">No adjectives such as “terrible” or “shocking”: the detail carries the feeling.</text>
</svg>