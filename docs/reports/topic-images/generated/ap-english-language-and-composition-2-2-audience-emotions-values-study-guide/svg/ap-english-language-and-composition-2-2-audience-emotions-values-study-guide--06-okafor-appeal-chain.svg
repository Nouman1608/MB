<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" width="900" height="590" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="590" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From device to effect</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Worked example 1: Mrs Okafor’s walk to the clinic</text>
<text x="165" y="130" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle" xml:space="preserve">DEVICES</text><text x="450" y="130" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle" xml:space="preserve">FEELING</text><text x="720" y="130" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle" xml:space="preserve">VALUE</text><rect x="30" y="148" width="270" height="86.03999999999999" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="42" y="173.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Narrative detail</text><text x="42" y="199.19" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">one named, elderly person; her</text><text x="42" y="218.99" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">routine</text><rect x="30" y="246.04" width="270" height="86.03999999999999" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="42" y="271.64" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Imagery</text><text x="42" y="297.22999999999996" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“a wall that was never meant for</text><text x="42" y="317.03" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">resting”</text><rect x="30" y="344.08" width="270" height="86.04000000000002" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="42" y="369.68" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Contrast of voices</text><text x="42" y="395.27" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“The council calls this a saving.</text><text x="42" y="415.07" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">She calls it Tuesday.”</text><line x1="304" y1="191.01999999999998" x2="364" y2="289.06" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="304" y1="289.06" x2="364" y2="289.06" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="304" y1="387.1" x2="364" y2="289.06" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="370" y="229.06" width="160" height="120" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="450" y="269.42" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Sympathy</text><text x="450" y="298.27" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">and</text><text x="450" y="320.71" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">indignation</text><line x1="534" y1="289.06" x2="594" y2="289.06" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="600" y="219.06" width="270" height="140" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="735" y="267.44" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">Fairness in public</text><text x="735" y="293.84" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">services</text><text x="735" y="322.69" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">care for the elderly</text><rect x="30" y="452.12" width="840" height="107.27999999999997" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="3" /><text x="48" y="486.12" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Effect on the argument</text><text x="48" y="514.97" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">An abstract budget decision becomes personal: the bus cut is a human cost, not a line in a</text><text x="48" y="537.4100000000001" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">report.</text>
</svg>