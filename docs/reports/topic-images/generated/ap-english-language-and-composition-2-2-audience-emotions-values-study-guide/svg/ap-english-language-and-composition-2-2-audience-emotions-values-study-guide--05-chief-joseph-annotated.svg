<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 517" width="900" height="517" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="517" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Restraint and feeling</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Chief Joseph, Bear Paw, 5 October 1877 (as recorded and translated)</text>
<rect x="30" y="128" width="250" height="38" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="155" y="154" font-size="20" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Hear me, my chiefs!</text><text x="155" y="187.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">direct address and imperative:</text><text x="155" y="205.8" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">authority, attention</text><rect x="294" y="128" width="363.79339999999996" height="38" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="475.8967" y="154" font-size="20" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">I am tired; my heart is sick and sad.</text><text x="475.8967" y="187.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">plain statements of feeling: credible, moving</text><rect x="30" y="242.6" width="332.4196" height="38" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="196.2098" y="268.6" font-size="20" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">From where the sun now stands</text><text x="196.2098" y="302.1" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">imagery: a natural, timeless frame</text><rect x="376.4196" y="242.6" width="282.135" height="38" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="517.4871" y="268.6" font-size="20" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">I will fight no more forever.</text><text x="517.4871" y="302.1" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">finality: dignity, not triumph or</text><text x="517.4871" y="320.40000000000003" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">defeat alone</text><rect x="30" y="361.2" width="408" height="125.75999999999999" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="48" y="395.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Audience</text><text x="48" y="423.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">His own people, the army officers, and soon a</text><text x="48" y="444.32" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">wider American public.</text><rect x="462" y="361.2" width="408" height="125.75999999999999" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="480" y="395.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Effect</text><text x="480" y="423.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">The feeling is restrained and authority never</text><text x="480" y="444.32" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">slips: often more powerful than extravagant</text><text x="480" y="465.44" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">language.</text>
</svg>