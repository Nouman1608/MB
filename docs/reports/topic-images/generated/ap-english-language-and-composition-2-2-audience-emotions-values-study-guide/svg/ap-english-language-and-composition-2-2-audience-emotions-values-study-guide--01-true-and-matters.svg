<rect width="900" height="597" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">True, and it matters to me</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">What evidence does and what emotion and values do</text>
<circle cx="340" cy="292" r="160" fill="#dce9e7" stroke="#2e6b62" stroke-width="3" opacity="0.95"/><circle cx="560" cy="292" r="160" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3" opacity="0.85"/><path d="M450,176 A160,160 0 0 1 450,408 A160,160 0 0 1 450,176 Z" fill="#d4b02e" opacity="0.55"/><text x="270" y="252" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">Evidence</text><text x="270" y="286" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">tells the audience</text><text x="270" y="308.44" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">the claim is <tspan font-weight="700">true</tspan></text><text x="630" y="228" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="middle" xml:space="preserve">Emotion and</text><text x="630" y="255.72" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="middle" xml:space="preserve">values</text><text x="630" y="296" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">tell the audience it</text><text x="630" y="318.44" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">matters</tspan> <tspan font-weight="700">to</tspan> <tspan font-weight="700">them</tspan></text><text x="450" y="282" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">Strong</tspan></text><text x="450" y="304.44" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">arguments</tspan></text><text x="450" y="326.88" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">connect</tspan></text><text x="450" y="349.32" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">the</tspan> <tspan font-weight="700">two</tspan></text><rect x="30" y="482" width="400" height="84.84" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5" /><text x="230" y="516" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Only evidence</text><text x="230" y="544.85" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Can be correct and still be ignored.</text><rect x="470" y="482" width="400" height="84.84" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5" /><text x="670" y="516" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Only emotion</text><text x="670" y="544.85" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Can move people and still be unsound.</text>
</svg>