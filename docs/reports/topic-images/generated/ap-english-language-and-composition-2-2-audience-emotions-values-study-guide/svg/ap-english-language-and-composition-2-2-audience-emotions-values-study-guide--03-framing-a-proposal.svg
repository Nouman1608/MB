<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 555" width="900" height="555" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="555" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One proposal, two frames</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The frame shows which audience the writer has in mind</text>
<rect x="300" y="122" width="300" height="84" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="3" /><text x="450" y="156" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Proposal</text><text x="450" y="184.85" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">charge for parking</text><path d="M380,208 C340,242 260,232 230,266" fill="none" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><path d="M520,208 C560,242 640,232 670,266" fill="none" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><rect x="30" y="272" width="400" height="100" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="230" y="313.58000000000004" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">Framed as fairness</text><text x="230" y="342.43" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Those who use the road should pay for it.</text><rect x="470" y="272" width="400" height="100" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="670" y="313.58000000000004" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="middle" xml:space="preserve">Framed as thrift</text><text x="670" y="342.43" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">the same plan, put to another audience</text><text x="450" y="402" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Three ways to relate to values</text><rect x="30" y="420" width="268" height="104.64000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="48" y="454" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">1 Name it</text><text x="48" y="482" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“This is a question of</text><text x="48" y="503.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">fairness.”</text><rect x="316" y="420" width="268" height="104.64000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="334" y="454" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">2 Frame it</text><text x="334" y="482" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Put the proposal in terms of a</text><text x="334" y="503.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">value the audience holds.</text><rect x="602" y="420" width="268" height="104.64000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="620" y="454" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">3 Link feeling to value</text><text x="620" y="482" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">A pensioner left in the cold:</text><text x="620" y="503.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">pity plus care for the elderly.</text>
</svg>