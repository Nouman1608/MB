<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 891" width="900" height="891" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="891" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The seven bases of identity</text>

<rect x="198" y="104" width="332" height="44" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="364" y="130.74" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Key idea</text><rect x="538" y="104" width="332" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="704" y="130.74" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Useful sociology</text><rect x="30" y="156" width="160" height="90" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="195.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Age and</text><text x="42" y="217.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">generation</text><rect x="198" y="156" width="332" height="90" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="212" y="185.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Age stages defined differently across</text><text x="212" y="205.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">societies; a cohort shares formative</text><text x="212" y="225.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">events</text><rect x="538" y="156" width="332" height="90" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="552" y="185.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Mannheim (1928): shared youth</text><text x="552" y="205.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">experiences create generational</text><text x="552" y="225.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">consciousness</text><rect x="30" y="254" width="160" height="74" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="285.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Sex and</text><text x="42" y="307.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">gender</text><rect x="198" y="254" width="332" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="212" y="283.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Sex: biological differences. Gender:</text><text x="212" y="303.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">constructed masculinity and femininity</text><rect x="538" y="254" width="332" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="552" y="283.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Oakley (1972): sex/gender distinction;</text><text x="552" y="303.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Butler (1990): gender is performative</text><rect x="30" y="336" width="160" height="90" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="375.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Race and</text><text x="42" y="397.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">ethnicity</text><rect x="198" y="336" width="332" height="90" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="212" y="365.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">"Race" a constructed category often</text><text x="212" y="385.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">based on appearance; ethnicity: shared</text><text x="212" y="405.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">culture and history</text><rect x="538" y="336" width="332" height="90" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="552" y="365.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Fanon (1952): colonial racism and the</text><text x="552" y="385.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">internalised coloniser’s gaze</text><rect x="30" y="434" width="160" height="90" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="484.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Social class</text><rect x="198" y="434" width="332" height="90" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="212" y="463.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Economic position shaping lifestyle,</text><text x="212" y="483.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">taste and outlook</text><rect x="538" y="434" width="332" height="90" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="552" y="463.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Marx: class "in itself" and "for</text><text x="552" y="483.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">itself"; Savage et al. (2013):</text><text x="552" y="503.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">economic, cultural and social capital</text><rect x="30" y="532" width="160" height="70" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="572.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Religion</text><rect x="198" y="532" width="332" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="212" y="561.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Beliefs, practices and community</text><text x="212" y="581.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">membership</text><rect x="538" y="532" width="332" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="552" y="561.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Can be a primary identity, especially</text><text x="552" y="581.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">for minorities and diasporas</text><rect x="30" y="610" width="160" height="74" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="641.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Ability /</text><text x="42" y="663.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">disability</text><rect x="198" y="610" width="332" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="212" y="639.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Impairment is physical; disability may</text><text x="212" y="659.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">be created by social barriers</text><rect x="538" y="610" width="332" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="552" y="639.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Oliver: social model of disability;</text><text x="552" y="659.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Goffman (1963): "spoiled" identities</text><rect x="30" y="692" width="160" height="70" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="732.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Nationality</text><rect x="198" y="692" width="332" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="212" y="721.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Belonging to a nation-state with</text><text x="212" y="741.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">shared symbols and stories</text><rect x="538" y="692" width="332" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="552" y="721.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Anderson (1983): imagined communities;</text><text x="552" y="741.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Billig (1995): banal nationalism</text><rect x="30" y="778" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="814" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Exam habit</text><text x="56" y="843" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Say how each identity is constructed (through which agencies) and how it can change.</text>
</svg>