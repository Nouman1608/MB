<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 653" width="900" height="653" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="653" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Hybrid identities and diasporas</text>

<circle cx="360" cy="260" r="150" fill="#b5d3cf" fill-opacity="0.75" stroke="#1e2a44" stroke-width="3"/><circle cx="540" cy="260" r="150" fill="#f2e7b8" fill-opacity="0.85" stroke="#1e2a44" stroke-width="3"/><text x="280" y="250" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Heritage</text><text x="280" y="274" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">culture</text><text x="620" y="250" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Culture of</text><text x="620" y="274" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">settlement</text><text x="450" y="250" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Hybrid</text><text x="450" y="272" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">identity</text><text x="450" y="440" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">Second and third generations switch languages and norms at home, school and online, creating</text><text x="450" y="461" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">new forms in music, fashion and food.</text><rect x="30" y="480" width="412" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,530 L31.25,494.25 Q31.25,481.25 44.25,481.25 L427.75,481.25 Q440.75,481.25 440.75,494.25 L440.75,530 Z" fill="#dce9e7"/><line x1="31.25" y1="530" x2="440.75" y2="530" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="510.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Hall</text><text x="44" y="561.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Diaspora identity is "becoming" as well as</text><text x="44" y="582.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"being": continually reworked, not fixed by</text><text x="44" y="603.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">origin.</text><rect x="458" y="480" width="412" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,530 L459.25,494.25 Q459.25,481.25 472.25,481.25 L855.75,481.25 Q868.75,481.25 868.75,494.25 L868.75,530 Z" fill="#dce9e7"/><line x1="459.25" y1="530" x2="868.75" y2="530" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="510.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Robin Cohen (1997)</text><text x="472" y="561.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Global Diasporas: victim, labour, trade or</text><text x="472" y="582.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">imperial diasporas. Not Stanley Cohen.</text>
</svg>