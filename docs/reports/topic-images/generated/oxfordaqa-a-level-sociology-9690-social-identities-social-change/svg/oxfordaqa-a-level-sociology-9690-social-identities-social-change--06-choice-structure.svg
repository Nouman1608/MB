<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 631" width="900" height="631" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="631" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Is identity now a matter of choice?</text>

<rect x="30" y="104" width="404" height="290" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L419.75,105.25 Q432.75,105.25 432.75,118.25 L432.75,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="432.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Choice</text><circle cx="53" cy="184.79" r="4.5" fill="#2e6b62"/><text x="66" y="190.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Bauman:</tspan> people define themselves</text><text x="66" y="212.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">through what they buy</text><circle cx="53" cy="236.79" r="4.5" fill="#2e6b62"/><text x="66" y="242.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Giddens:</tspan> the reflexive project of the</text><text x="66" y="264.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">self, continually revised</text><circle cx="53" cy="288.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="294.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Globalisation spreads global youth</text><text x="66" y="316.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">cultures and glocal blends</text><circle cx="53" cy="340.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="346.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Postmodernists:</tspan> identity increasingly</text><text x="66" y="368.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">chosen</text><rect x="466" y="104" width="404" height="290" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,154 L467.25,118.25 Q467.25,105.25 480.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#f2e7b8"/><line x1="467.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Constraint</text><circle cx="489" cy="184.79" r="4.5" fill="#8a6d0d"/><text x="502" y="190.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Class, gender, ethnicity and disability</text><text x="502" y="212.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">still limit available identities and</text><text x="502" y="234.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">how they are judged</text><circle cx="489" cy="258.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="264.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Consumption-based identity depends on</text><text x="502" y="286.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">money: poorer groups have fewer choices</text><circle cx="489" cy="310.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="316.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Defensive reassertion of local,</text><text x="502" y="338.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">national or religious identities</text><circle cx="450" cy="249" r="24" fill="#1e2a44"/><text x="450" y="256" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">vs</text><rect x="30" y="412" width="840" height="193" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="448" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">20-mark plan: is class still important?</text><circle cx="61" cy="471.39" r="4.5" fill="#8a6d0d"/><text x="74" y="477" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">For decline:</tspan> loss of manual industry and unions; consumption (Bauman); online and</text><text x="74" y="499" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">global identities; reflexive self</text><circle cx="61" cy="523.39" r="4.5" fill="#8a6d0d"/><text x="74" y="529" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Against:</tspan> Savage et al. on capitals; class shapes education, health and life chances;</text><text x="74" y="551" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">consumption is class-based</text><circle cx="61" cy="575.39" r="4.5" fill="#8a6d0d"/><text x="74" y="581" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Conclude:</tspan> class may be less consciously claimed but still powerful</text>
</svg>