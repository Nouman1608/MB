<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 485" width="900" height="485" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="485" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Changing gender identities</text>

<rect x="30" y="104" width="269.3333333333333" height="240" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,174 L31.25,118.25 Q31.25,105.25 44.25,105.25 L285.0833333333333,105.25 Q298.0833333333333,105.25 298.0833333333333,118.25 L298.0833333333333,174 Z" fill="#b5d3cf"/><line x1="31.25" y1="174" x2="298.0833333333333" y2="174" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="144.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Hegemonic masculinity</text><text x="46" y="207.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Connell</text><text x="46" y="236.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The dominant, culturally</text><text x="46" y="257.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">honoured form (strength,</text><text x="46" y="278.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">heterosexuality, emotional</text><text x="46" y="299.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">control), alongside</text><text x="46" y="320.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">subordinate masculinities.</text><rect x="315.3333333333333" y="104" width="269.3333333333333" height="240" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,174 L316.5833333333333,118.25 Q316.5833333333333,105.25 329.5833333333333,105.25 L570.4166666666666,105.25 Q583.4166666666666,105.25 583.4166666666666,118.25 L583.4166666666666,174 Z" fill="#f2e7b8"/><line x1="316.5833333333333" y1="174" x2="583.4166666666666" y2="174" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="144.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Crisis of masculinity</text><text x="331.3333333333333" y="207.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Mac an Ghaill</text><text x="331.3333333333333" y="236.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Young working-class men lose</text><text x="331.3333333333333" y="257.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the manual jobs that</text><text x="331.3333333333333" y="278.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">underpinned breadwinner</text><text x="331.3333333333333" y="299.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">identities.</text><rect x="600.6666666666666" y="104" width="269.3333333333333" height="240" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,174 L601.9166666666666,118.25 Q601.9166666666666,105.25 614.9166666666666,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,174 Z" fill="#dce9e7"/><line x1="601.9166666666666" y1="174" x2="868.75" y2="174" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="132.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Diversifying</text><text x="735.3333333333333" y="156.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">femininities</text><text x="616.6666666666666" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Wider with women’s education</text><text x="616.6666666666666" y="228.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and work; expectations about</text><text x="616.6666666666666" y="249.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">appearance and care persist;</text><text x="616.6666666666666" y="270.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">social media can intensify</text><text x="616.6666666666666" y="291.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">pressure over bodies.</text><rect x="30" y="360" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="396" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Why roles widened</text><text x="56" y="425" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Changes in work, education and law have widened the range of acceptable gender</text><text x="56" y="447" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">identities.</text>
</svg>