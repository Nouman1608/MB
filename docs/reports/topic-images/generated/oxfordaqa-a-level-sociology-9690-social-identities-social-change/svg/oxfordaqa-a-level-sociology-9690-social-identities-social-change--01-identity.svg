<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 454" width="900" height="454" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="454" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What identity means</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">a sense of who we are and how others see us</text>
<rect x="30" y="110" width="412" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,160 L31.25,124.25 Q31.25,111.25 44.25,111.25 L427.75,111.25 Q440.75,111.25 440.75,124.25 L440.75,160 Z" fill="#f2e7b8"/><line x1="31.25" y1="160" x2="440.75" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="140.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Individual identity</text><text x="44" y="192.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">What makes a person distinctive:</text><text x="44" y="214.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">personality, biography, appearance</text><rect x="458" y="110" width="412" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,160 L459.25,124.25 Q459.25,111.25 472.25,111.25 L855.75,111.25 Q868.75,111.25 868.75,124.25 L868.75,160 Z" fill="#b5d3cf"/><line x1="459.25" y1="160" x2="868.75" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="140.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Collective identity</text><text x="472" y="192.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Belonging to a group: a nation, faith,</text><text x="472" y="214.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">class or generation</text><text x="30" y="264" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Three features to use in answers</text><rect x="30" y="280" width="269.3333333333333" height="148" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="164.66666666666666" y="312.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Socially constructed</text><text x="164.66666666666666" y="342.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">through socialisation and</text><text x="164.66666666666666" y="363.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">interaction; Mead: the self</text><text x="164.66666666666666" y="384.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">develops by taking the role</text><text x="164.66666666666666" y="405.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">of others</text><rect x="315.3333333333333" y="280" width="269.3333333333333" height="148" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="333.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Relational</text><text x="450" y="363.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">"us" requires a "them"; links</text><text x="450" y="384.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">to othering</text><rect x="600.6666666666666" y="280" width="269.3333333333333" height="148" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="735.3333333333333" y="333.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Multiple and changing</text><text x="735.3333333333333" y="363.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">several at once; importance</text><text x="735.3333333333333" y="384.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">shifts with context and time</text>
</svg>