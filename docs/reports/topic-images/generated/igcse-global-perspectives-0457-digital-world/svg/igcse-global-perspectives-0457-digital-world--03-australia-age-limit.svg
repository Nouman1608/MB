<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A national action to evaluate: Australia’s age limit</text>

<line x1="120" y1="144" x2="780" y2="144" stroke="#1e2a44" stroke-width="4"/><circle cx="200" cy="144" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="200" y="122" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2024</text><text x="200" y="182" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Act passed</text><circle cx="700" cy="144" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="700" y="122" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">December 2025</text><text x="700" y="182" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Takes effect</text><text x="450" y="220" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Certain platforms must stop under-16s holding accounts</text><line x1="215" y1="296" x2="685" y2="296" stroke="#1e2a44" stroke-width="7" stroke-linecap="round"/><path d="M450,296 L420,388 L480,388 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><circle cx="450" cy="296" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="215" y1="296" x2="160" y2="351" stroke="#1e2a44" stroke-width="2.5"/><line x1="215" y1="296" x2="270" y2="351" stroke="#1e2a44" stroke-width="2.5"/><path d="M140,351 L290,351 Q275,378 215,378 Q155,378 140,351 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><line x1="685" y1="296" x2="630" y2="351" stroke="#1e2a44" stroke-width="2.5"/><line x1="685" y1="296" x2="740" y2="351" stroke="#1e2a44" stroke-width="2.5"/><path d="M610,351 L760,351 Q745,378 685,378 Q625,378 610,351 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="215" y="400" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">supporters</text><text x="685" y="400" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">critics</text><rect x="30" y="424" width="405" height="139" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="460" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Supporters argue</text><text x="50" y="489.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="489.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">It protects young people</text><rect x="465" y="424" width="405" height="139" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="485" y="460" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Critics question</text><text x="485" y="489.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="489.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">How ages can be checked</text><text x="485" y="516.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="516.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Whether young people will move to less</text><text x="501.15" y="538.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">regulated sites</text><rect x="30" y="581" width="840" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="617" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Limitation of the evidence</text><text x="50" y="646.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The law is recent, so evidence of its effects is still limited.</text>
