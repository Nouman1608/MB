<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Phones in schools: four perspectives</text>

<line x1="310" y1="154" x2="371.8" y2="198.85" stroke="#1e2a44" stroke-width="2.5"/><line x1="310" y1="280" x2="371.8" y2="242.95" stroke="#1e2a44" stroke-width="2.5"/><line x1="590" y1="166" x2="528.2" y2="203.05" stroke="#1e2a44" stroke-width="2.5"/><line x1="590" y1="280" x2="528.2" y2="242.95" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="223" r="92" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="216.875" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Phones in</text><text x="450" y="243.125" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">schools</text><g transform="translate(0,0)"><rect x="30" y="104" width="280" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="133" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TEACHER</text><text x="46" y="158.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Phones distract</text><text x="46" y="182.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">students</text><rect x="30" y="218" width="280" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="247" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PARENT</text><text x="46" y="272.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Wants their child</text><text x="46" y="296.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">reachable on the way</text><text x="46" y="320.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">home</text></g><g transform="translate(0,12)"><rect x="590" y="104" width="280" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="606" y="133" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STUDENT</text><text x="606" y="158.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Phones help with</text><text x="606" y="182.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">research</text><rect x="590" y="218" width="280" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="606" y="247" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EDUCATION MINISTRY</text><text x="606" y="272.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Focuses on results</text><text x="606" y="296.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">across all schools</text></g><text x="450" y="380" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Why perspectives differ in the digital world</text><rect x="30" y="406" width="201" height="94" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="130.5" y="434.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Values</text><text x="130.5" y="462" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">safety, freedom of</text><text x="130.5" y="482" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">expression, privacy</text><rect x="243" y="406" width="201" height="94" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="343.5" y="434.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Experience</text><text x="343.5" y="462" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">what technology did</text><text x="343.5" y="482" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">for or to you</text><rect x="456" y="406" width="201" height="94" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="556.5" y="434.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Vested interest</text><text x="556.5" y="462" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">who gains from an</text><text x="556.5" y="482" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">outcome</text><rect x="669" y="406" width="201" height="94" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="769.5" y="434.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Position</text><text x="769.5" y="462" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">a whole country or one</text><text x="769.5" y="482" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">shop</text>
