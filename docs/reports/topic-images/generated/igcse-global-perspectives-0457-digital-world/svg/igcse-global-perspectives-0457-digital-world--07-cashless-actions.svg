<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 636" width="900" height="636" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="636" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Pairing a long-term and a short-term action</text>

<rect x="30" y="104" width="408" height="210" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ACTION 1: LONG TERM</text><text x="50" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Free digital skills classes at</text><text x="50" y="188.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">the library</text><text x="50" y="216.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="216.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Tackles a cause: many older residents do</text><text x="65.2" y="237.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">not use online banking.</text><text x="50" y="263.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="263.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Builds lasting skills.</text><text x="50" y="289.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="289.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Leaves out residents without a smartphone.</text><rect x="462" y="104" width="408" height="210" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="482" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">ACTION 2: SHORT TERM</text><text x="482" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Require shops to accept cash</text><text x="482" y="191.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="497.2" y="191.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Helps those residents at once.</text><text x="482" y="217.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="497.2" y="217.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Adds costs for shop owners.</text><line x1="235" y1="324" x2="400" y2="366" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="665" y1="324" x2="500" y2="366" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="150" y="390" width="600" height="108" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="424.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Judgement: classes are the better long-term action,</text><text x="450" y="448.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">but work best alongside a short-term guarantee that</text><text x="450" y="472.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">cash is still accepted</text><rect x="42" y="516" width="153.6" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="118.8" y="541.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Effectiveness</text><rect x="207.6" y="516" width="135.2" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="275.2" y="541.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Feasibility</text><rect x="354.79999999999995" y="516" width="245.6" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="477.59999999999997" y="541.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Who benefits, who loses</text><rect x="612.4" y="516" width="245.6" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="735.1999999999999" y="541.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Unintended consequences</text><rect x="368.6" y="566" width="162.79999999999998" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="591.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Sustainability</text>
</svg>