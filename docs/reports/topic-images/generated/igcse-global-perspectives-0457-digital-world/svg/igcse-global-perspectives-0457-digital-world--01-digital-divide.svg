<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 628" width="900" height="628" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="628" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The digital divide</text>

<rect x="30" y="130" width="570.3703703703704" height="90" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><rect x="600.3703703703704" y="130" width="269.62962962962956" height="90" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="315.1851851851852" y="172" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">about 5.5 billion</text><text x="315.1851851851852" y="200" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">online</text><text x="735.1851851851852" y="172" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">about 2.6 billion</text><text x="735.1851851851852" y="200" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">still offline</text><text x="450" y="252" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">International Telecommunication Union (UN agency), 2024 estimate</text><rect x="30" y="280" width="408" height="135" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="313" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRENGTH</text><text x="50" y="339.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">An international body</text><text x="50" y="368.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Collects data from many countries.</text><rect x="462" y="280" width="408" height="135" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="482" y="313" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="482" y="339.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">An estimate</text><text x="482" y="368.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A global figure hides big differences</text><text x="482" y="390.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">within each country.</text><text x="450" y="448" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">The same divide at three levels</text><rect x="30" y="466" width="268" height="132" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="511" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GLOBAL</text><text x="50" y="536.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Unequal access between</text><text x="50" y="560.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">countries</text><rect x="316" y="466" width="268" height="132" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="336" y="499" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NATIONAL</text><text x="336" y="524.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Rural areas with</text><text x="336" y="548.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">weaker connections</text><text x="336" y="572.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">than cities</text><rect x="602" y="466" width="268" height="132" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="622" y="511" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">LOCAL</text><text x="622" y="536.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Students without a</text><text x="622" y="560.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">device or data at home</text>
</svg>