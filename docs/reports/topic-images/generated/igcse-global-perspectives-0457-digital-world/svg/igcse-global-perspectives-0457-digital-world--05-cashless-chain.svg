<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 695" width="900" height="695" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="695" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Cashless payments: following the chain</text>

<rect x="130" y="110" width="640" height="77" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="146" y="139" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">CAUSE</text><text x="146" y="165.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Banks close branches as more customers bank online</text><line x1="450" y1="191" x2="450" y2="233" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="470" y="197" width="42.4" height="30" rx="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="482" y="218" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">so</text><rect x="130" y="237" width="640" height="102" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="146" y="266" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONSEQUENCE</text><text x="146" y="292.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">An older person who does not bank online must travel</text><text x="146" y="317.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">further to pay in cash</text><line x1="450" y1="343" x2="450" y2="385" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="470" y="349" width="125.19999999999999" height="30" rx="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="482" y="370" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">as a result</text><rect x="130" y="389" width="640" height="77" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="146" y="418" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FURTHER CONSEQUENCE</text><text x="146" y="444.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">They depend more on relatives, or stop shopping locally</text><line x1="450" y1="470" x2="450" y2="512" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="470" y="476" width="162" height="30" rx="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="482" y="497" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">this means that</text><rect x="130" y="516" width="640" height="77" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="146" y="545" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">KNOCK-ON FOR THE COMMUNITY</text><text x="146" y="571.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The local shop may lose customers</text><rect x="30" y="611" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="644.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Each linking word is a small piece of reasoning an examiner can credit.</text>
</svg>