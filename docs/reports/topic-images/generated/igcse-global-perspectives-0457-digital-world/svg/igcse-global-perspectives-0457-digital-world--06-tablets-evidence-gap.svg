<rect width="900" height="680" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">When the evidence does not match the claim</text>

<rect x="30" y="120" width="330" height="150" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="160.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EVIDENCE OFFERED</text><text x="50" y="186.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Most parents agreed</text><text x="50" y="211.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">digital skills matter for</text><text x="50" y="236.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">jobs</text><rect x="540" y="120" width="330" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="560" y="170" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">CLAIM</text><text x="560" y="197.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">“Tablets improve</text><text x="560" y="225.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">learning”</text><path d="M360,195 L410,195" stroke="#1e2a44" stroke-width="5"/><path d="M490,195 L540,195" stroke="#1e2a44" stroke-width="5"/><path d="M410,195 l8,30 M490,195 l-8,30" fill="none" stroke="#b5602e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="450" y="180" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle">gap</text><text x="450" y="250" font-size="15" font-weight="600" fill="#b5602e" text-anchor="middle">in the reasoning</text><rect x="30" y="295" width="840" height="113" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="328" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">SOURCE X</text><text x="50" y="354.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Written by a company that makes tablets</text><text x="50" y="383.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A vested interest: the company gains if schools buy tablets, which weakens its credibility.</text><rect x="30" y="420" width="840" height="85" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="453" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">A BETTER TEST</text><text x="50" y="479.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Independent research comparing students with and without tablets</text><text x="450" y="545" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Five questions for any source</text><rect x="124.80000000000001" y="560" width="153.6" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="201.60000000000002" y="585.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Who wrote it?</text><rect x="290.4" y="560" width="70.8" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="325.79999999999995" y="585.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Why?</text><rect x="373.2" y="560" width="80" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="413.2" y="585.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">When?</text><rect x="465.2" y="560" width="310" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="620.2" y="585.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">How was the evidence gathered?</text><rect x="313.4" y="610" width="273.2" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="635.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Does other evidence agree?</text>
</svg>