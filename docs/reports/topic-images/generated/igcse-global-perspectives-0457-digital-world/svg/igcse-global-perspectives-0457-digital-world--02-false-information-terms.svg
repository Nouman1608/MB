<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 573" width="900" height="573" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="573" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">False information: is it on purpose?</text>

<rect x="30" y="104" width="408" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">MISINFORMATION</text><text x="50" y="164" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">False, shared without intent to</text><text x="50" y="190" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">mislead</text><rect x="462" y="104" width="408" height="112" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="482" y="150" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">DISINFORMATION</text><text x="482" y="177" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">False, shared on purpose</text><text x="450" y="254" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Where it shows up</text><rect x="30" y="280" width="268" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="325" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GLOBAL</text><text x="50" y="350.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Fake images and videos</text><text x="50" y="374.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">shared worldwide</text><rect x="316" y="280" width="268" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="336" y="313" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NATIONAL</text><text x="336" y="338.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Effects on elections</text><text x="336" y="362.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">or public health</text><text x="336" y="386.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">messages</text><rect x="602" y="280" width="268" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="622" y="325" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LOCAL</text><text x="622" y="350.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Rumours in a community</text><text x="622" y="374.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">group chat</text><rect x="30" y="430" width="840" height="113" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="463" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ALGORITHM</text><text x="50" y="489.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A set of rules a computer follows</text><text x="50" y="518.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">On platforms, it decides what each user sees.</text>
</svg>