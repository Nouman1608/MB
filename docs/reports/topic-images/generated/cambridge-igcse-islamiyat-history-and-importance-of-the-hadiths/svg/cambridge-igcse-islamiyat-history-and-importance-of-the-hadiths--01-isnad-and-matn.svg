<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 634" width="900" height="634" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="634" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The two parts of a Hadith</text>

<rect x="30" y="110" width="840" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="148" font-size="24" font-weight="700" fill="#2e6b62" text-anchor="start">Isnad</text><text x="150" y="148" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">the chain of people who passed it on</text><rect x="56" y="176" width="150" height="64" rx="32" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="131" y="216" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><text x="131" y="272" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">told me that</text><line x1="232" y1="208" x2="212" y2="208" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="236" y="176" width="150" height="64" rx="32" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="311" y="216" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><text x="311" y="272" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">said that</text><line x1="412" y1="208" x2="392" y2="208" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="416" y="176" width="150" height="64" rx="32" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="491" y="216" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">C</text><text x="491" y="272" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">heard</text><line x1="592" y1="208" x2="572" y2="208" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="596" y="176" width="248" height="64" rx="32" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="720" y="216" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">the Prophet (pbuh)</text><text x="720" y="272" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">say...</text><text x="450" y="330" font-size="18" font-weight="600" fill="#2e6b62" text-anchor="middle">Every link must be reliable, with no gap back to the Prophet (pbuh).</text><line x1="450" y1="362" x2="450" y2="400" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="406" width="840" height="110" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="3"/><text x="56" y="446" font-size="24" font-weight="700" fill="#8a6d0d" text-anchor="start">Matn</text><text x="140" y="446" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">the text itself</text><text x="56" y="486" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">What the Prophet (pbuh) said, did or approved.</text><rect x="30" y="540" width="840" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="583" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Sunnah:</text><text x="140" y="583" font-size="19" font-weight="400" fill="#4a5568" text-anchor="start">the Prophet's way of life, known mainly through Hadiths.</text>
</svg>