<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 693" width="900" height="693" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="692.8399999999999" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How the Hadiths were collected</text>

<line x1="80" y1="142" x2="80" y2="567.52" stroke="#1e2a44" stroke-width="4"/><rect x="150" y="112" width="720" height="127.32" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="166" y="144.4" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">In the Prophet's lifetime</text><text x="166" y="173.94" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Companions memorised his words and observed his practice. Writing was at first</text><text x="166" y="196.38" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">discouraged, but some, such as Abdullah ibn Amr ibn al-As, kept notes with his</text><text x="166" y="218.82" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">permission.</text><rect x="150" y="261.32" width="720" height="127.32" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="166" y="293.71999999999997" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Companions and successors</text><text x="166" y="323.26" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Hadiths taught in Madina, Kufa, Basra, Damascus and other centres; the tabi'un</text><text x="166" y="345.7" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">travelled widely. Early notebooks (sahifas), such as that of Hammam ibn</text><text x="166" y="368.14" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Munabbih.</text><rect x="150" y="410.64" width="720" height="104.88" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="166" y="443.03999999999996" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Official encouragement (717–720)</text><text x="166" y="472.58" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Umayyad caliph Umar ibn Abd al-Aziz ordered scholars to collect Hadiths in</text><text x="166" y="495.02" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">writing before they were lost. Ibn Shihab al-Zuhri was linked with this work.</text><rect x="150" y="537.52" width="720" height="127.32" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="166" y="569.92" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Second and third Islamic centuries</text><text x="166" y="599.46" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Musannaf collections (by subject) and musnad collections (by narrating</text><text x="166" y="621.9000000000001" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">companion); then the six Sunni collections, such as al-Bukhari (d. 870) and</text><text x="166" y="644.34" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Muslim (d. 875).</text><circle cx="80" cy="142" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="80" y="149.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><line x1="104" y1="142" x2="148" y2="142" stroke="#1e2a44" stroke-width="3"/><circle cx="80" cy="291.32" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="80" y="299.24" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><line x1="104" y1="291.32" x2="148" y2="291.32" stroke="#1e2a44" stroke-width="3"/><circle cx="80" cy="440.64" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="80" y="448.56" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><line x1="104" y1="440.64" x2="148" y2="440.64" stroke="#1e2a44" stroke-width="3"/><circle cx="80" cy="567.52" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="80" y="575.4399999999999" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><line x1="104" y1="567.52" x2="148" y2="567.52" stroke="#1e2a44" stroke-width="3"/>
</svg>