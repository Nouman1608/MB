start">mainly law</text><rect x="30" y="438" width="300" height="156" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="466" font-size="15" font-weight="600" fill="#4a5568" text-anchor="start">Compiler</text><text x="48" y="494" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">al-Shaykh al-Tusi</text><line x1="334" y1="474" x2="400" y2="474" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="406" y="438" width="464" height="72" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="428" y="470" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">Tahdhib al-ahkam</text><text x="428" y="496" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">mainly law</text><line x1="334" y1="558" x2="400" y2="558" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="406" y="522" width="464" height="72" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="428" y="554" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">al-Istibsar</text><text x="428" y="580" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">mainly law</text>
