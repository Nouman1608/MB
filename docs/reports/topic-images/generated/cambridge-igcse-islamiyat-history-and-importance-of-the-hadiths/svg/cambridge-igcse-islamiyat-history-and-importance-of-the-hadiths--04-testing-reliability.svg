<rect width="900" height="644" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Testing whether a Hadith is reliable</text>

<rect x="30" y="110" width="410" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="110" width="410" height="74" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="142" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Isnad criticism</text><text x="235" y="170" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">the chain (ilm al-rijal)</text><circle cx="60" cy="208" r="11" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M54,208 l5,5 l8,-10" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="82" y="214" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Narrators of good character and</text><text x="82" y="236" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">religious practice</text><circle cx="60" cy="270" r="11" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M54,270 l5,5 l8,-10" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="82" y="276" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Sound memory</text><circle cx="60" cy="310" r="11" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M54,310 l5,5 l8,-10" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="82" y="316" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Could have met the person they report</text><text x="82" y="338" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">from</text><circle cx="60" cy="372" r="11" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M54,372 l5,5 l8,-10" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="82" y="378" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">No gap in the chain back to the Prophet</text><text x="82" y="400" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">(pbuh)</text><rect x="460" y="110" width="410" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="110" width="410" height="74" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="665" y="142" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Matn criticism</text><text x="665" y="170" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">the text</text><circle cx="490" cy="208" r="11" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><path d="M484,208 l5,5 l8,-10" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="512" y="214" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Does not contradict the Qur'an</text><circle cx="490" cy="248" r="11" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><path d="M484,248 l5,5 l8,-10" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="512" y="254" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Does not contradict well-established</text><text x="512" y="276" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Hadiths or reason</text><circle cx="490" cy="310" r="11" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><path d="M484,310 l5,5 l8,-10" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="512" y="316" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Fits the Prophet's known character and</text><text x="512" y="338" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">language</text><path d="M235,442 L235,470 L450,470 L450,530" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M665,442 L665,470 L450,470" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round"/><text x="466" y="506" font-size="18" font-weight="700" fill="#4a5568" text-anchor="start" font-style="italic">graded</text><rect x="30" y="538" width="198" height="82" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="129" y="572" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Sahih</text><text x="129" y="600" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">sound</text><rect x="244" y="538" width="198" height="82" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="343" y="572" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Hasan</text><text x="343" y="600" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">good</text><rect x="458" y="538" width="198" height="82" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="557" y="572" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Da'if</text><text x="557" y="600" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">weak</text><rect x="672" y="538" width="198" height="82" rx="14" fill="#f3dccd" stroke="#b5602e" stroke-width="2.5"/><text x="771" y="572" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Fabricated</text><text x="771" y="600" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">rejected</text>
</svg>