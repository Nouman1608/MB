<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 607" width="900" height="607" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="606.54" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Hadiths among the sources of law</text>

<rect x="30" y="112" width="840" height="84" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="3.5"/><circle cx="70" cy="154" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="70" y="161.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="110" y="146" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">The Qur'an</text><text x="110" y="174" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The first source of law.</text><rect x="64" y="218" width="806" height="106.18" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="104" cy="271.09000000000003" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="104" y="279.01000000000005" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="144" y="252" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Hadiths and the Sunnah</text><text x="144" y="280" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Explain the Qur'an (how to pray), add detail to its rulings (amounts of zakat) and</text><text x="144" y="302" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">guide where it is silent.</text><rect x="98" y="346.18" width="772" height="106.18" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="138" cy="399.27" r="22" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="138" y="407.19" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="178" y="380.18" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Ijma'  (consensus)</text><text x="178" y="408.18" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Used when the community's scholars agree on a ruling, often based on Qur'an and</text><text x="178" y="430.18" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Hadith.</text><rect x="132" y="474.36" width="738" height="106.18" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="172" cy="527.45" r="22" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="172" y="535.37" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="212" y="508.36" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Qiyas  (analogy)</text><text x="212" y="536.36" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Extends an existing ruling to a new case with the same cause: the ban on</text><text x="212" y="558.36" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">wine applied to other intoxicants.</text>
</svg>