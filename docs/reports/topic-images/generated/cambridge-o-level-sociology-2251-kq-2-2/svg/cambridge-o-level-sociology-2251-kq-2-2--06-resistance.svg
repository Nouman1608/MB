<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 665" width="900" height="665" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="665" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Resisting control</text>

<rect x="30" y="104" width="411" height="130" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="139.2" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Deviant behaviour</text><text x="50" y="167.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Breaks a norm and attracts negative</text><text x="50" y="188.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sanctions.</text><rect x="459" y="104" width="411" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="479" y="139.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Non-conformist behaviour</text><text x="479" y="167.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rejects mainstream expectations without</text><text x="479" y="188.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">necessarily breaking the law, e.g. unusual</text><text x="479" y="209.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">dress.</text><rect x="30" y="252" width="411" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="287.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Protest groups</text><text x="50" y="315.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">School climate strikes begun by Greta</text><text x="50" y="336.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Thunberg (Sweden, 2018); civil rights and</text><text x="50" y="357.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">workers’ movements</text><rect x="459" y="252" width="411" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="287.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Youth subcultures</text><text x="479" y="315.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Hebdige (1979): punk style as a symbolic</text><text x="479" y="336.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">challenge to mainstream society</text><rect x="30" y="396" width="411" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="431.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Online subcultures</text><text x="50" y="459.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Gaming, music, fandoms or political views;</text><text x="50" y="480.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">link people across countries</text><rect x="459" y="396" width="411" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="431.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Religious subcultures</text><text x="479" y="459.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Beliefs and practices different from the</text><text x="479" y="480.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">majority; strict internal control</text><rect x="30" y="523" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="559" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Why people join</text><text x="50" y="588.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Belonging and identity · shared grievances and a wish for change · status unavailable</text><text x="50" y="610.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">elsewhere (Cohen’s status frustration, 1955) · excitement and rebellion · friends</text>
</svg>