<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The panopticon and digital surveillance</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Foucault, Discipline and Punish (1975)</text>
<rect x="30" y="110" width="400" height="430" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M338.0,320.0 L400.0,320.0 A170,170 0 0 1 383.2,393.8 L327.3,366.9 A108,108 0 0 0 338.0,320.0 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><path d="M327.3,366.9 L383.2,393.8 A170,170 0 0 1 336.0,452.9 L297.3,404.4 A108,108 0 0 0 327.3,366.9 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><path d="M297.3,404.4 L336.0,452.9 A170,170 0 0 1 267.8,485.7 L254.0,425.3 A108,108 0 0 0 297.3,404.4 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><path d="M254.0,425.3 L267.8,485.7 A170,170 0 0 1 192.2,485.7 L206.0,425.3 A108,108 0 0 0 254.0,425.3 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><path d="M206.0,425.3 L192.2,485.7 A170,170 0 0 1 124.0,452.9 L162.7,404.4 A108,108 0 0 0 206.0,425.3 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><path d="M162.7,404.4 L124.0,452.9 A170,170 0 0 1 76.8,393.8 L132.7,366.9 A108,108 0 0 0 162.7,404.4 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><path d="M132.7,366.9 L76.8,393.8 A170,170 0 0 1 60.0,320.0 L122.0,320.0 A108,108 0 0 0 132.7,366.9 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><path d="M122.0,320.0 L60.0,320.0 A170,170 0 0 1 76.8,246.2 L132.7,273.1 A108,108 0 0 0 122.0,320.0 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><path d="M132.7,273.1 L76.8,246.2 A170,170 0 0 1 124.0,187.1 L162.7,235.6 A108,108 0 0 0 132.7,273.1 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><path d="M162.7,235.6 L124.0,187.1 A170,170 0 0 1 192.2,154.3 L206.0,214.7 A108,108 0 0 0 162.7,235.6 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><path d="M206.0,214.7 L192.2,154.3 A170,170 0 0 1 267.8,154.3 L254.0,214.7 A108,108 0 0 0 206.0,214.7 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><path d="M254.0,214.7 L267.8,154.3 A170,170 0 0 1 336.0,187.1 L297.3,235.6 A108,108 0 0 0 254.0,214.7 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><path d="M297.3,235.6 L336.0,187.1 A170,170 0 0 1 383.2,246.2 L327.3,273.1 A108,108 0 0 0 297.3,235.6 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><path d="M327.3,273.1 L383.2,246.2 A170,170 0 0 1 400.0,320.0 L338.0,320.0 A108,108 0 0 0 327.3,273.1 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><circle cx="230" cy="320" r="108" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><line x1="262.4814406302706" y1="330.04768702648556" x2="329.35499486906303" y2="350.7341014927793" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray="6 5"/><line x1="209.99096201331824" y1="347.4888777298661" x2="168.79588380544402" y2="404.0836259972374" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray="6 5"/><line x1="210.45598581786885" y1="292.17857822381006" x2="170.21830956054" y2="234.89918044930133" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray="6 5"/><circle cx="230" cy="320" r="32" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="230" y="326" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">tower</text><text x="230" y="520" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">cells in a ring around a central tower</text><rect x="450" y="110" width="420" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="466" y="141.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Never sure when watched</text><text x="466" y="169.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Prisoners could not tell when a guard was</text><text x="466" y="190.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">looking.</text><line x1="660" y1="216" x2="660" y2="242" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="450" y="247" width="420" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="466" y="278.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">So they self-police</text><text x="466" y="306.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">They behaved as though always observed.</text><line x1="660" y1="332" x2="660" y2="358" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="450" y="363" width="420" height="101" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="466" y="394.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Digital surveillance today</text><text x="466" y="422.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">CCTV, facial recognition, number-plate cameras,</text><text x="466" y="443.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">phone location data, online monitoring.</text><rect x="30" y="556" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="589.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Critics point to privacy, possible misuse by governments, and some groups being watched</text><text x="50" y="611.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">more closely than others.</text>
</svg>