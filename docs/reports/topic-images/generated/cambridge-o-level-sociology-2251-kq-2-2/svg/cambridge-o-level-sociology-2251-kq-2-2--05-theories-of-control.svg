<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 626" width="900" height="626" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="626" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Whose interests does social control serve?</text>

<rect x="30" y="110" width="268" height="293" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONSENSUS</text><text x="50" y="170" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Functionalism</text><text x="50" y="198.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="198.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Control protects shared</text><text x="65.2" y="219.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">values that benefit</text><text x="65.2" y="240.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">everyone</text><text x="50" y="267.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="267.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Durkheim: punishing a</text><text x="65.2" y="288.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">wrongdoer reminds</text><text x="65.2" y="309.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">everyone of the rules and</text><text x="65.2" y="330.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">unites them</text><text x="50" y="357.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="357.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Maintains order and</text><text x="65.2" y="378.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cohesion</text><rect x="316" y="110" width="268" height="293" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="336" y="143" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">CONFLICT</text><text x="336" y="170" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Marxism</text><text x="336" y="198.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="351.2" y="198.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Control serves the ruling</text><text x="351.2" y="219.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">class</text><text x="336" y="246.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="351.2" y="246.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Laws protect private</text><text x="351.2" y="267.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">property and capitalism</text><text x="336" y="294.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="351.2" y="294.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ideological control is</text><text x="351.2" y="315.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cheaper: people police</text><text x="351.2" y="336.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">themselves</text><rect x="602" y="110" width="268" height="293" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="622" y="143" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">CONFLICT</text><text x="622" y="170" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Feminism</text><text x="622" y="198.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="637.2" y="198.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Control maintains</text><text x="637.2" y="219.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">patriarchy</text><text x="622" y="246.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="637.2" y="246.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Heidensohn (1985): women</text><text x="637.2" y="267.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">controlled more tightly</text><text x="637.2" y="288.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">at home, in public and at</text><text x="637.2" y="309.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">work</text><text x="622" y="336.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="637.2" y="336.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Helps explain why women</text><text x="637.2" y="357.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">commit fewer crimes</text><text x="450" y="447" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Althusser: two kinds of state apparatus</text><rect x="30" y="463" width="408" height="133" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="496" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">REPRESSIVE</text><text x="50" y="522.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Police, courts, army</text><text x="50" y="550.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Control by force</text><rect x="462" y="463" width="408" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="482" y="496" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">IDEOLOGICAL</text><text x="482" y="522.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Education, media, religion</text><text x="482" y="550.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Control by persuading people that inequality</text><text x="482" y="571.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">is fair</text>
</svg>