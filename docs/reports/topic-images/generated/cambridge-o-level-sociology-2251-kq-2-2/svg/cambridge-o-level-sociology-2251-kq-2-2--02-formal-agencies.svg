<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 608" width="900" height="608" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="608" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Formal agencies: methods and effectiveness</text>

<rect x="30" y="104" width="150" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Agency</text><rect x="180" y="104" width="240" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="192" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Main methods</text><rect x="420" y="104" width="220" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="432" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Effective when…</text><rect x="640" y="104" width="230" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="652" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Less effective when…</text><rect x="30" y="150" width="150" height="62" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="174.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Government</text><rect x="180" y="150" width="240" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="192" y="174.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Law-making; regulation;</text><text x="192" y="194.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">funding</text><rect x="420" y="150" width="220" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="432" y="174.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Laws reflect shared</text><text x="432" y="194.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">values</text><rect x="640" y="150" width="230" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="652" y="174.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Laws lack support or are</text><text x="652" y="194.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">poorly enforced</text><rect x="30" y="212" width="150" height="82" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="236.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Police</text><rect x="180" y="212" width="240" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="192" y="236.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Arrest; patrol; digital</text><text x="192" y="256.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">surveillance; stop and</text><text x="192" y="276.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">search</text><rect x="420" y="212" width="220" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="432" y="236.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Trusted, so the public</text><text x="432" y="256.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">report crime</text><rect x="640" y="212" width="230" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="652" y="236.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Crime unreported;</text><text x="652" y="256.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">corruption; low resources</text><rect x="30" y="294" width="150" height="62" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="318.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Courts</text><rect x="180" y="294" width="240" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="192" y="318.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Sentencing; fines; orders</text><rect x="420" y="294" width="220" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="432" y="318.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Penalties seen as fair</text><text x="432" y="338.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">and consistent</text><rect x="640" y="294" width="230" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="652" y="318.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Long delays; unequal</text><text x="652" y="338.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">access to legal help</text><rect x="30" y="356" width="150" height="62" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="380.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Penal system</text><rect x="180" y="356" width="240" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="192" y="380.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Imprisonment; probation;</text><text x="192" y="400.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">rehabilitation</text><rect x="420" y="356" width="220" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="432" y="380.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Offenders reform and do</text><text x="432" y="400.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">not reoffend</text><rect x="640" y="356" width="230" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="652" y="380.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Prisons spread criminal</text><text x="652" y="400.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">skills and labels</text><rect x="30" y="418" width="150" height="62" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="442.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Armed forces</text><rect x="180" y="418" width="240" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="192" y="442.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Coercion in emergencies,</text><text x="192" y="462.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">unrest or conflict</text><rect x="420" y="418" width="220" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="432" y="442.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Order must be restored</text><text x="432" y="462.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">quickly</text><rect x="640" y="418" width="230" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="652" y="442.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Force without legitimacy</text><text x="652" y="462.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">produces resistance</text><rect x="30" y="498" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="531.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Coercion (force or its threat) is the last resort. Societies that rely on it heavily are</text><text x="50" y="553.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">often less stable, because people conform out of fear rather than agreement.</text>
</svg>