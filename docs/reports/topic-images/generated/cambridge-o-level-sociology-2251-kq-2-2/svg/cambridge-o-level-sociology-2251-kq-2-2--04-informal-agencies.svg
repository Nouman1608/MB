<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 565" width="900" height="565" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="565" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Informal agencies: rewards and sanctions</text>

<rect x="30" y="104" width="180" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Agency</text><rect x="210" y="104" width="330" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="222" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Positive sanctions</text><rect x="540" y="104" width="330" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="552" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Negative sanctions</text><rect x="30" y="150" width="180" height="43" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="175.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Family</text><rect x="210" y="150" width="330" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="222" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Treats, freedom</text><rect x="540" y="150" width="330" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="552" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Grounding, disapproval</text><rect x="30" y="193" width="180" height="43" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="218.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Education</text><rect x="210" y="193" width="330" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="222" y="218.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Merits, prizes, teachers’ approval</text><rect x="540" y="193" width="330" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="552" y="218.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Detention, exclusion</text><rect x="30" y="236" width="180" height="43" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="261.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Peer group</text><rect x="210" y="236" width="330" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="222" y="261.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Acceptance</text><rect x="540" y="236" width="330" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="552" y="261.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Ostracism (being excluded)</text><rect x="30" y="279" width="180" height="43" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="304.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Media</text><rect x="210" y="279" width="330" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="222" y="304.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Social media likes, shares, followers</text><rect x="540" y="279" width="330" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="552" y="304.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Public shaming, hostile comments</text><rect x="30" y="322" width="180" height="43" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="347.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Religion</text><rect x="210" y="322" width="330" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="222" y="347.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Promised reward after death; respect</text><rect x="540" y="322" width="330" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="552" y="347.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Promised punishment; exclusion</text><rect x="30" y="365" width="180" height="43" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="390.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Workplace</text><rect x="210" y="365" width="330" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="222" y="390.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Pay rises, promotion</text><rect x="540" y="365" width="330" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="552" y="390.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Warnings, dismissal from a job</text><rect x="30" y="426" width="411" height="109" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="461.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Usually more effective</text><text x="50" y="489.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Constant, and comes from people whose opinion</text><text x="50" y="510.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">matters.</text><rect x="459" y="426" width="411" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="461.2" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Weaker when…</text><text x="479" y="489.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">People live in large, anonymous cities, or do</text><text x="479" y="510.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">not care about the group’s approval.</text>
</svg>