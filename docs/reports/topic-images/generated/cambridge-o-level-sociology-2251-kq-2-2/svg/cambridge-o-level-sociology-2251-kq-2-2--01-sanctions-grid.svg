<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 664" width="900" height="664" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="664" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four kinds of sanction</text>

<text x="400" y="134" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Positive sanction</text><text x="400" y="156" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">rewards conformity</text><text x="710" y="134" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">Negative sanction</text><text x="710" y="156" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">punishes deviance</text><rect x="30" y="174" width="205" height="150" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="44" y="221" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Formal</text><text x="44" y="249" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">official agencies of</text><text x="44" y="269" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">the state; written</text><text x="44" y="289" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">rules</text><rect x="30" y="334" width="205" height="150" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="44" y="391" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Informal</text><text x="44" y="419" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">people around us;</text><text x="44" y="439" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">unwritten norms</text><rect x="250" y="174" width="300" height="150" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="400" y="254" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">A bravery award</text><rect x="560" y="174" width="300" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="710" y="254" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">A court sentence</text><rect x="250" y="334" width="300" height="150" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="400" y="414" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">A parent’s praise</text><rect x="560" y="334" width="300" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="710" y="414" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Being ignored by friends</text><rect x="30" y="500" width="840" height="134" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="536" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Inside us</text><text x="50" y="565.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Strongest of all is internalised control: through socialisation we accept norms as right</text><text x="50" y="587.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and feel guilt or shame before anyone reacts. External sanctions deal with cases where this</text><text x="50" y="609.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">fails.</text>
</svg>