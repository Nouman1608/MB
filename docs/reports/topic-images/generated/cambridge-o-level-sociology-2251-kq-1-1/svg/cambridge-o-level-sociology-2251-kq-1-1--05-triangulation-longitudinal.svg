<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 652" width="900" height="652" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="652" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two ways of combining methods and evidence</text>

<rect x="30" y="110" width="410" height="512" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="110" width="410" height="512" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="152" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">Triangulation</text><text x="235" y="182" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Two or more methods on one question</text><rect x="50" y="220" width="118" height="64" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="109" y="246" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Observing</text><text x="109" y="266" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">lessons</text><rect x="178" y="220" width="118" height="64" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="237" y="256" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Interviews</text><rect x="306" y="220" width="118" height="64" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="365" y="246" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Group</text><text x="365" y="266" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">discussions</text><rect x="110" y="360" width="250" height="64" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="235" y="385.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Willis, Learning to</text><text x="235" y="406.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Labour (1977)</text><line x1="109" y1="290" x2="178.3" y2="353" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="235" y1="290" x2="235" y2="353" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="361" y1="290" x2="291.7" y2="353" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="50" y="462" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Twelve working-class boys in an English</text><text x="50" y="483" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">school.</text><text x="50" y="512" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start">Strength: where one method is weak another</text><text x="50" y="533" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start">can confirm or challenge it. Willis could</text><text x="50" y="554" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start">check what the boys said against what they</text><text x="50" y="575" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start">did.</text><text x="665" y="152" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">Longitudinal study</text><text x="665" y="182" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">The same people, at intervals, over a long</text><text x="665" y="203" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">period</text><circle cx="514" cy="228" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2" /><circle cx="514" cy="248" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2" /><circle cx="514" cy="268" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2" /><circle cx="514" cy="288" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2" /><circle cx="514" cy="308" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2" /><circle cx="514" cy="328" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2" /><circle cx="514" cy="348" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2" /><text x="514" y="378" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Wave 1</text><line x1="530" y1="288" x2="592" y2="288" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><circle cx="609" cy="228" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2" /><circle cx="609" cy="248" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2" /><circle cx="609" cy="268" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2" /><circle cx="609" cy="288" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2" /><circle cx="609" cy="308" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2" /><circle cx="609" cy="328" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2" /><circle cx="609" cy="348" r="7" fill="none" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="3 3"/><text x="609" y="378" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Wave 2</text><line x1="625" y1="288" x2="687" y2="288" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><circle cx="704" cy="228" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2" /><circle cx="704" cy="248" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2" /><circle cx="704" cy="268" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2" /><circle cx="704" cy="288" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2" /><circle cx="704" cy="308" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2" /><circle cx="704" cy="328" r="7" fill="none" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="3 3"/><circle cx="704" cy="348" r="7" fill="none" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="3 3"/><text x="704" y="378" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Wave 3</text><line x1="720" y1="288" x2="782" y2="288" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><circle cx="799" cy="228" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2" /><circle cx="799" cy="248" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2" /><circle cx="799" cy="268" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2" /><circle cx="799" cy="288" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2" /><circle cx="799" cy="308" r="7" fill="none" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="3 3"/><circle cx="799" cy="328" r="7" fill="none" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="3 3"/><circle cx="799" cy="348" r="7" fill="none" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="3 3"/><text x="799" y="378" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Wave 4</text><text x="665" y="406" font-size="15" font-weight="600" fill="#b5602e" text-anchor="middle">empty circles: attrition</text><text x="480" y="442" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Example: the British Millennium Cohort</text><text x="480" y="463" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Study, children born in the UK in 2000 and</text><text x="480" y="484" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">2001.</text><text x="480" y="512" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start">Strength: shows change and the order events</text><text x="480" y="533" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start">happen in.</text><text x="480" y="558" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">Problems: cost, a long wait for findings,</text><text x="480" y="579" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">and attrition makes the sample less</text><text x="480" y="600" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">representative.</text>
</svg>