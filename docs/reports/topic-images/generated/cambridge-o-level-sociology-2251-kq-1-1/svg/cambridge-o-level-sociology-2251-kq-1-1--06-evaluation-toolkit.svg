<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 706" width="900" height="706" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="706" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Seven questions for judging research</text>

<rect x="30" y="104" width="270" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Concept</text><rect x="300" y="104" width="570" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="312" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">The question it asks</text><rect x="30" y="150" width="270" height="66" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="176.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Bias</text><rect x="300" y="150" width="570" height="66" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="312" y="176.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Have the researcher’s views shaped the questions, the sample</text><text x="312" y="198.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">or the interpretation?</text><rect x="30" y="216" width="270" height="66" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="242.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Interviewer effect</text><rect x="300" y="216" width="570" height="66" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="312" y="242.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Does the interviewer’s age, gender, ethnicity or status change</text><text x="312" y="264.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the answers?</text><rect x="30" y="282" width="270" height="66" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="308.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Hawthorne / observer</text><text x="42" y="330.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">effect</text><rect x="300" y="282" width="570" height="66" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="312" y="308.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Does awareness of being watched change what people do?</text><rect x="30" y="348" width="270" height="66" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="374.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Validity</text><rect x="300" y="348" width="570" height="66" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="312" y="374.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Does the data give a true picture of what it claims to</text><text x="312" y="396.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">measure?</text><rect x="30" y="414" width="270" height="44" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="440.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Reliability</text><rect x="300" y="414" width="570" height="44" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="312" y="440.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Would the method give the same results if repeated?</text><rect x="30" y="458" width="270" height="44" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="484.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Representativeness</text><rect x="300" y="458" width="570" height="44" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="312" y="484.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Is the sample typical of the population being studied?</text><rect x="30" y="502" width="270" height="44" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="528.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Generalisability</text><rect x="300" y="502" width="570" height="44" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="312" y="528.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Can the findings be applied beyond the sample?</text><rect x="30" y="564" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="600" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Where the name comes from</text><text x="50" y="629.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Hawthorne works, near Chicago (1920s to early 1930s): productivity rose almost whatever</text><text x="50" y="651.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">conditions Mayo’s team changed, put down to the attention the workers were getting.</text>
</svg>