<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 502" width="900" height="502" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="502" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Planning an evaluation: can research be objective?</text>

<rect x="30" y="104" width="160" height="72" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="110" y="147" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Introduce</text><rect x="204" y="104" width="666" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="220" y="133.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Define objectivity: the researcher’s values do not affect the research.</text><text x="220" y="155.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Note that this is a positivist view.</text><rect x="30" y="188" width="160" height="94" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="110" y="242" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">For</text><rect x="204" y="188" width="666" height="94" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="220" y="217.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Standardised questionnaires and structured interviews reduce the</text><text x="220" y="239.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">researcher’s influence; quantitative data can be checked; published</text><text x="220" y="261.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">methods allow replication.</text><rect x="30" y="294" width="160" height="94" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="110" y="348" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Against</text><rect x="204" y="294" width="666" height="94" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="220" y="323.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Topics and questions reflect values; closed questions impose the</text><text x="220" y="345.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">researcher’s categories; interviewer effects remain; official statistics</text><text x="220" y="367.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">depend on decisions (Atkinson).</text><rect x="30" y="400" width="160" height="72" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="110" y="443" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Judge</text><rect x="204" y="400" width="666" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="220" y="429.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Complete objectivity is unlikely, but bias can be reduced by</text><text x="220" y="451.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">triangulating and being open about methods and values.</text>
</svg>