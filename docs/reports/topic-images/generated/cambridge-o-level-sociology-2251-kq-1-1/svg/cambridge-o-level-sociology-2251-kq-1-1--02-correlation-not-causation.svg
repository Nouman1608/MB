<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 584" width="900" height="584" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="584" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why a correlation does not prove causation</text>

<rect x="30" y="110" width="268" height="346" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="316" y="110" width="268" height="346" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="602" y="110" width="268" height="346" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="62" cy="148" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="154.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="90" y="155" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A third variable</text><rect x="74" y="186" width="180" height="56" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="164" y="218.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Population size</text><rect x="44" y="306" width="112" height="62" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="100" y="330.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">More</text><text x="100" y="351.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">police</text><rect x="172" y="306" width="112" height="62" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="228" y="330.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">More</text><text x="228" y="351.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">crime</text><line x1="140" y1="244" x2="106" y2="300" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="188" y1="244" x2="222" y2="300" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="164" y="395" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Both may be caused by</text><text x="164" y="416" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">something else</text><circle cx="348" cy="148" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="348" y="154.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="376" y="155" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Reversed direction</text><rect x="360" y="186" width="180" height="56" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="218.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Reads more</text><rect x="360" y="306" width="180" height="62" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="330.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Does well at</text><text x="450" y="351.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">school</text><line x1="421" y1="246" x2="421" y2="298" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="479" y1="298" x2="479" y2="246" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><text x="400" y="278" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">?</text><text x="504" y="278" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">or?</text><text x="450" y="395" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Which one causes which?</text><circle cx="634" cy="148" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="634" y="154.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="662" y="155" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Coincidence</text><line x1="652" y1="350" x2="822" y2="350" stroke="#1e2a44" stroke-width="2.5"/><line x1="652" y1="350" x2="652" y2="200" stroke="#1e2a44" stroke-width="2.5"/><circle cx="662" cy="314" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="684.5" cy="301" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="707" cy="307.5" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="729.5" cy="275" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="752" cy="281.5" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="774.5" cy="249" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="797" cy="242.5" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="736" y="395" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">With enough data, some</text><text x="736" y="416" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">things move together by</text><text x="736" y="437" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">chance</text><rect x="30" y="476" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="509.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Positivists respond by controlling other variables, for example comparing only people of</text><text x="50" y="531.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the same age and class, and by repeating the research.</text>
</svg>