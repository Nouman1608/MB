<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" width="900" height="760" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="760" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The positivist route: the scientific method</text>

<rect x="30" y="104" width="840" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">STARTING CLAIM</text><text x="50" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Society is a real structure of social facts outside any one person, so it</text><text x="50" y="188.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">can be measured like nature.</text><line x1="62" y1="252" x2="62" y2="710" stroke="#c9d6d4" stroke-width="4"/><rect x="108" y="232" width="762" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="268" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Form a hypothesis</text><text x="128" y="297.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Observe a pattern and predict a relationship between two variables.</text><circle cx="62" cy="277" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="285.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="108" y="334" width="762" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="370" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Collect quantitative data</text><text x="128" y="399.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Use a large sample and standardised methods.</text><circle cx="62" cy="379" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="387.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="108" y="436" width="762" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="472" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Identify patterns and trends</text><text x="128" y="501.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Differences between groups, or changes over time.</text><circle cx="62" cy="481" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="489.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="108" y="538" width="762" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="574" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Test the link</text><text x="128" y="603.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Are the variables linked, and does one cause the other?</text><circle cx="62" cy="583" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="591.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="108" y="640" width="762" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="676" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Accept, reject or refine</text><text x="128" y="705.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Publish the method so others can repeat it.</text><circle cx="62" cy="685" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="693.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text>
</svg>