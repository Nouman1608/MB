<rect width="900" height="576" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two approaches to studying society</text>

<text x="195" y="126" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Positivism</text><text x="705" y="126" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="middle">Interpretivism</text><rect x="30" y="144" width="330" height="68" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="195" y="182.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Shaped by external social facts</text><rect x="540" y="144" width="330" height="68" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="705" y="171.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Conscious actors who interpret and</text><text x="705" y="193.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">choose</text><rect x="378" y="159" width="144" height="38" rx="19" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="184" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">People are</text><line x1="360" y1="178" x2="378" y2="178" stroke="#1e2a44" stroke-width="2.5"/><line x1="522" y1="178" x2="540" y2="178" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="224" width="330" height="68" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="195" y="262.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Macro: society as a structure</text><rect x="540" y="224" width="330" height="68" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="705" y="251.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Micro: society built from</text><text x="705" y="273.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">interactions</text><rect x="378" y="239" width="144" height="38" rx="19" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="264" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">View</text><line x1="360" y1="258" x2="378" y2="258" stroke="#1e2a44" stroke-width="2.5"/><line x1="522" y1="258" x2="540" y2="258" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="304" width="330" height="68" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="195" y="331.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Patterns, trends, correlation and</text><text x="195" y="353.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">causation</text><rect x="540" y="304" width="330" height="68" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="705" y="331.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Meanings and motivations</text><text x="705" y="353.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">(verstehen)</text><rect x="378" y="319" width="144" height="38" rx="19" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="344" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Aim</text><line x1="360" y1="338" x2="378" y2="338" stroke="#1e2a44" stroke-width="2.5"/><line x1="522" y1="338" x2="540" y2="338" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="384" width="330" height="46" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="195" y="411.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Quantitative, standardised</text><rect x="540" y="384" width="330" height="46" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="705" y="411.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Qualitative, in-depth</text><rect x="378" y="388" width="144" height="38" rx="19" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="413" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Data</text><line x1="360" y1="407" x2="378" y2="407" stroke="#1e2a44" stroke-width="2.5"/><line x1="522" y1="407" x2="540" y2="407" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="442" width="330" height="46" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="195" y="469.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Objectivity and reliability</text><rect x="540" y="442" width="330" height="46" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="705" y="469.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Validity; accepts subjectivity</text><rect x="378" y="446" width="144" height="38" rx="19" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="471" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Values</text><line x1="360" y1="465" x2="378" y2="465" stroke="#1e2a44" stroke-width="2.5"/><line x1="522" y1="465" x2="540" y2="465" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="500" width="330" height="46" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="195" y="527.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Émile Durkheim</text><rect x="540" y="500" width="330" height="46" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="705" y="527.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Max Weber</text><rect x="378" y="504" width="144" height="38" rx="19" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="529" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Thinker</text><line x1="360" y1="523" x2="378" y2="523" stroke="#1e2a44" stroke-width="2.5"/><line x1="522" y1="523" x2="540" y2="523" stroke="#1e2a44" stroke-width="2.5"/>
</svg>