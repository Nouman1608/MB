<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 533" width="900" height="533" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="533" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two readings of suicide statistics</text>

<text x="235" y="126" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Durkheim, Suicide (1897)</text><rect x="30" y="144" width="410" height="79" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="174.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Official statistics</text><text x="46" y="202.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Suicide rates from several European countries</text><line x1="235" y1="228" x2="235" y2="258" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="263" width="410" height="100" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="293.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Pattern found</text><text x="46" y="321.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Rates stable within societies; Protestant</text><text x="46" y="342.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">areas higher than Catholic ones</text><line x1="235" y1="368" x2="235" y2="398" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="403" width="410" height="100" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="433.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Explained by a social fact</text><text x="46" y="461.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Level of social integration: people bound</text><text x="46" y="482.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">into a community were protected</text><text x="665" y="126" font-size="21" font-weight="700" fill="#b5602e" text-anchor="middle">Atkinson, Discovering Suicide (1978)</text><rect x="460" y="144" width="410" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="476" y="174.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A death occurs</text><text x="476" y="202.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">It is not yet a "suicide" in any statistic</text><line x1="665" y1="228" x2="665" y2="258" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="460" y="263" width="410" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="476" y="293.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A coroner interprets clues</text><text x="476" y="321.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A note, the method of death, the person’s</text><text x="476" y="342.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">recent history</text><line x1="665" y1="368" x2="665" y2="398" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="460" y="403" width="410" height="100" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="476" y="433.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The statistic records a decision</text><text x="476" y="461.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">So it is not a neutral measure of a social</text><text x="476" y="482.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">fact</text>
</svg>