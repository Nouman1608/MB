<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 576" width="900" height="576" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="576" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The limit is a ceiling</text>

<rect x="30" y="110" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="80" y="200" width="600" height="48" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><rect x="680" y="200" width="140" height="48" fill="#f6e3d6" stroke="#1e2a44" stroke-width="2.5"/><line x1="680" y1="176" x2="680" y2="272" stroke="#b5602e" stroke-width="5"/><text x="680" y="166" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">150 words: a ceiling</text><text x="80" y="290" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">0</text><path d="M150,330 L150,256" fill="none" stroke="#8a6d0d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahO)"/><text x="150" y="360" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">well under:</text><text x="150" y="384" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">probably missed points</text><path d="M560,330 L620,256" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><text x="560" y="360" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">approaching 150:</text><text x="560" y="384" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">all points, no detail</text><path d="M760,330 L760,256" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahR)"/><text x="760" y="360" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">over:</text><text x="760" y="384" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">words spent on detail;</text><text x="760" y="405" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">later points not credited</text><rect x="30" y="460" width="840" height="92" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="494" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">While writing:</text><text x="190" y="494" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">count roughly by lines, using your average words per line.</text><text x="52" y="528" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">At the end:</text><text x="190" y="528" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">check exactly.</text>
</svg>