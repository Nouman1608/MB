<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 646" width="900" height="646" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="646" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Write it in your own words</text>

<rect x="30" y="110" width="840" height="118" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="142" r="19" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="148.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="102" y="150" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Generalise</text><rect x="56" y="170" width="400" height="48" rx="10" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="256" y="200" font-size="16" font-weight="400" fill="#b5602e" text-anchor="middle" font-style="italic">buses, trains and trams</text><line x1="462" y1="196" x2="500" y2="196" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="508" y="174" width="340" height="44" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="678" y="202" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle" font-style="italic">public transport</text><rect x="30" y="242" width="840" height="118" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="274" r="19" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="280.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="102" y="282" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Compress</text><rect x="56" y="302" width="400" height="48" rx="10" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="256" y="322" font-size="15" font-weight="400" fill="#b5602e" text-anchor="middle" font-style="italic">people who live in the area and the</text><text x="256" y="341" font-size="15" font-weight="400" fill="#b5602e" text-anchor="middle" font-style="italic">businesses that operate there</text><line x1="462" y1="328" x2="500" y2="328" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="508" y="306" width="340" height="44" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="678" y="334" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle" font-style="italic">local residents and businesses</text><rect x="30" y="374" width="840" height="118" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="406" r="19" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="412.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="102" y="414" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Re-structure</text><rect x="56" y="434" width="400" height="48" rx="10" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="256" y="464" font-size="16" font-weight="400" fill="#b5602e" text-anchor="middle">a list of separate sentences</text><line x1="462" y1="460" x2="500" y2="460" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="508" y="438" width="340" height="44" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="678" y="466" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">one sentence with a shared subject</text><rect x="30" y="518" width="410" height="104" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="552" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Allowed to keep</text><text x="52" y="582" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">technical terms and words with no simple</text><text x="52" y="603" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">equivalent</text><rect x="460" y="518" width="410" height="104" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="482" y="552" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Not continuous writing</text><text x="482" y="586" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">bullet points, headings, numbered lists</text>
</svg>