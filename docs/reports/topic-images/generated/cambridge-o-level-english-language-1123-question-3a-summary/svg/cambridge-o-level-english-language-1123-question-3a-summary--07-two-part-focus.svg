<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">When the focus has two parts</text>

<rect x="30" y="110" width="840" height="64" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="149" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" font-style="italic">“the problems faced by volunteers and how they overcame them”</text><path d="M300,176 L200,214" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><path d="M600,176 L700,214" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="30" y="220" width="410" height="190" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="256" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Group 1: the problems</text><rect x="70" y="276" width="330" height="30" rx="6" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><rect x="70" y="316" width="330" height="30" rx="6" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><rect x="70" y="356" width="330" height="30" rx="6" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><rect x="460" y="220" width="410" height="190" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="665" y="256" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Group 2: how they overcame them</text><rect x="500" y="276" width="330" height="30" rx="6" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><rect x="500" y="316" width="330" height="30" rx="6" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><rect x="500" y="356" width="330" height="30" rx="6" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="446" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Points for both aspects, in separate sentences</text><rect x="30" y="470" width="840" height="100" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="52" y="504" font-size="18" font-weight="700" fill="#b5602e" text-anchor="star