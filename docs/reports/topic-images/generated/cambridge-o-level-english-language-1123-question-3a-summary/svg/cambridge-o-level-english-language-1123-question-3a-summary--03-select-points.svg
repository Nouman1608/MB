<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 662" width="900" height="662" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="662" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Select the points</text>

<rect x="30" y="110" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Strip the detail: keep the point it illustrates</text><rect x="55" y="166" width="470" height="76" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="72" y="196" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">“Last year Maria, a nurse from Lisbon, saved enough</text><text x="72" y="217" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">on fuel to pay for a holiday”</text><line x1="530" y1="204" x2="568" y2="204" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="574" y="176" width="272" height="56" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="710" y="210" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">cycling saves money</text><text x="450" y="304" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">From Text B to your notes</text><path d="M120,326 L780,326 L620,520 L280,520 Z" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="450" y="360" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">every sentence or phrase that answers the focus</text><path d="M300,398 L110,398" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahR)"/><text x="100" y="404" font-size="16" font-weight="600" fill="#b5602e" text-anchor="end">examples</text><path d="M340,434 L120,434" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahR)"/><text x="110" y="440" font-size="16" font-weight="600" fill="#b5602e" text-anchor="end">statistics</text><path d="M380,470 L130,470" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahR)"/><text x="120" y="476" font-size="16" font-weight="600" fill="#b5602e" text-anchor="end">anecdotes</text><text x="470" y="420" font-size="16" font-weight="400" fill="#8a6d0d" text-anchor="middle">strip the detail</text><text x="470" y="456" font-size="16" font-weight="400" fill="#8a6d0d" text-anchor="middle">merge repeats: count</text><text x="470" y="478" font-size="16" font-weight="400" fill="#8a6d0d" text-anchor="middle">each idea once</text><line x1="450" y1="522" x2="450" y2="556" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="118" y="562" width="64" height="40" rx="6" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><line x1="128" y1="582" x2="172" y2="582" stroke="#2e6b62" stroke-width="3"/><rect x="192" y="562" width="64" height="40" rx="6" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><line x1="202" y1="582" x2="246" y2="582" stroke="#2e6b62" stroke-width="3"/><rect x="266" y="562" width="64" height="40" rx="6" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><line x1="276" y1="582" x2="320" y2="582" stroke="#2e6b62" stroke-width="3"/><rect x="340" y="562" width="64" height="40" rx="6" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><line x1="350" y1="582" x2="394" y2="582" stroke="#2e6b62" stroke-width="3"/><rect x="414" y="562" width="64" height="40" rx="6" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><line x1="424" y1="582" x2="468" y2="582" stroke="#2e6b62" stroke-width="3"/><rect x="488" y="562" width="64" height="40" rx="6" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><line x1="498" y1="582" x2="542" y2="582" stroke="#2e6b62" stroke-width="3"/><rect x="562" y="562" width="64" height="40" rx="6" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><line x1="572" y1="582" x2="616" y2="582" stroke="#2e6b62" stroke-width="3"/><rect x="636" y="562" width="64" height="40" rx="6" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><line x1="646" y1="582" x2="690" y2="582" stroke="#2e6b62" stroke-width="3"/><rect x="710" y="562" width="64" height="40" rx="6" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><line x1="720" y1="582" x2="764" y2="582" stroke="#2e6b62" stroke-width="3"/><text x="450" y="636" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">eight to ten short notes is typical</text>
</svg>