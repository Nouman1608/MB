<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="680" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five steps to a summary</text>

<rect x="100" y="110" width="770" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="56" cy="158" r="26" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="56" y="167.36" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="124" y="152" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Find the focus</text><text x="124" y="182" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Underline it; decide what does not count.</text><rect x="740" y="138" width="108" height="40" rx="20" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="794" y="163.76" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle">reading</text><line x1="56" y1="186" x2="56" y2="242" stroke="#1e2a44" stroke-width="3"/><rect x="100" y="222" width="770" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="56" cy="270" r="26" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="56" y="279.36" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="124" y="264" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Select the points</text><text x="124" y="294" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Strip the detail, merge repeats, list notes.</text><rect x="740" y="250" width="108" height="40" rx="20" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="794" y="275.76" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle">reading</text><line x1="56" y1="298" x2="56" y2="354" stroke="#1e2a44" stroke-width="3"/><rect x="100" y="334" width="770" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="56" cy="382" r="26" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="56" y="391.36" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="124" y="376" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Group and order</text><text x="124" y="406" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Two or three groups; each note in one.</text><rect x="740" y="362" width="108" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="794" y="387.76" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">writing</text><line x1="56" y1="410" x2="56" y2="466" stroke="#1e2a44" stroke-width="3"/><rect x="100" y="446" width="770" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="56" cy="494" r="26" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="56" y="503.36" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="124" y="488" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Write in your own words</text><text x="124" y="518" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Continuous prose: no bullets or headings.</text><rect x="740" y="474" width="108" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="794" y="499.76" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">writing</text><line x1="56" y1="522" x2="56" y2="578" stroke="#1e2a44" stroke-width="3"/><rect x="100" y="558" width="770" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="56" cy="606" r="26" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="56" y="615.36" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="124" y="600" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Check the limit</text><text x="124" y="630" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">No more than 150 words.</text><rect x="740" y="586" width="108" height="40" rx="20" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="794" y="611.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">both</text>
</svg>