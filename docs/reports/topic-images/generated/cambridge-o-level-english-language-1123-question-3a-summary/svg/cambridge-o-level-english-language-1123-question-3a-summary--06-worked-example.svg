<rect width="900" height="788" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: school gardens</text>

<rect x="30" y="110" width="840" height="60" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="147" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Task: summarise the benefits of school gardens</text><text x="160" y="206" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">Grouped notes</text><text x="690" y="206" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">One sentence per group</text><rect x="30" y="222" width="500" height="128" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="254" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Pupils’ well-being</text><text x="50" y="284" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• calmer after break</text><text x="50" y="307" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• better concentration</text><text x="50" y="330" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• fewer arguments</text><line x1="534" y1="286" x2="564" y2="286" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="570" y="244" width="300" height="84" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><circle cx="596" cy="286" r="16" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="596" y="291.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="620" y="280" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">improve pupils’ behaviour</text><text x="620" y="300" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">and focus …</text><rect x="30" y="364" width="500" height="128" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="396" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Learning</text><text x="50" y="426" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• used in maths, science, writing</text><text x="50" y="449" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• practical success for those who struggle</text><line x1="534" y1="428" x2="564" y2="428" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="570" y="386" width="300" height="84" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="596" cy="428" r="16" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="596" y="433.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="620" y="422" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">also become places of</text><text x="620" y="442" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">learning …</text><rect x="30" y="506" width="500" height="128" rx="12" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="538" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Community and environment</text><text x="50" y="568" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• cooler streets</text><text x="50" y="591" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• habitat for wildlife</text><text x="50" y="614" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• meeting place for families</text><line x1="534" y1="570" x2="564" y2="570" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="570" y="528" width="300" height="84" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><circle cx="596" cy="570" r="16" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="596" y="575.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="620" y="564" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">value extends to the</text><text x="620" y="584" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">wider area too …</text><rect x="30" y="652" width="410" height="112" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="52" y="684" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Excluded</text><text x="52" y="712" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">parents’ worries; holiday care (drawbacks)</text><text x="52" y="736" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the head teacher’s identity (detail)</text><rect x="460" y="652" width="410" height="112" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="482" y="684" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Result: 8 points, 74 words</text><text x="482" y="712" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">three groups, three sentences, joined</text><text x="482" y="736" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">by signposts: “also”, “too”</text>
</svg>