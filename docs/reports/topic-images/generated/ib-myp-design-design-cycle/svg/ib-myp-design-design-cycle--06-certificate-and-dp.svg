<rect width="900" height="560" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why the design folder matters beyond the grade</text>

<text x="450" y="130" font-size="18" font-weight="600" fill="#4a5568" text-anchor="middle">The certificate needs satisfactory achievement in at least one of:</text><rect x="30" y="150" width="270" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165" y="200" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Physical and</text><text x="165" y="226" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">health education</text><rect x="315" y="150" width="270" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="212" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Arts</text><rect x="600" y="150" width="270" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="735" y="212" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Design</text><line x1="735" y1="264" x2="735" y2="300" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/><rect x="30" y="306" width="840" height="104" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="55" y="344" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">A well-documented design ePortfolio</text><text x="55" y="374" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">can decide whether this certificate requirement is met, beyond the subject grade.</text><rect x="30" y="430" width="840" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="468" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Looking ahead: DP Design Technology</text><text x="55" y="498" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">MYP eAssessment tasks align with its skills; the same cyclical process underpins its coursework.</text>
</svg>