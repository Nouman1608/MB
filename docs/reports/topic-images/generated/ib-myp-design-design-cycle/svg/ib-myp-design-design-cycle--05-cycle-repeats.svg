="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Project 2</text><text x="450" y="400" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">criteria reassessed</text><line x1="562" y1="260" x2="620" y2="260" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><circle cx="735" cy="260" r="85" fill="#ffffff" stroke="#b5d3cf" stroke-width="10"/><circle cx="735" cy="175" r="19" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="735" y="181.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><circle cx="820" cy="260" r="19" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="820" y="266.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><circle cx="735" cy="345" r="19" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="735" y="351.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">C</text><circle cx="650" cy="260" r="19" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="650" y="266.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">D</text><text x="735" y="267" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Project 3</text><text x="735" y="400" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">criteria reassessed</text><text x="450" y="140" font-size="18" font-weight="600" fill="#4a5568" text-anchor="middle">new problem each time, same four-stage process</text><rect x="30" y="430" width="410" height="140" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="52" y="466" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ One-off introduction</text><text x="52" y="496" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">later projects become simply</text><text x="52" y="518" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“making things”; weak documentation</text><text x="52" y="540" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">habits persist</text><rect x="460" y="430" width="410" height="140" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="482" y="466" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">✓ A working habit</text><text x="482" y="496" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">check the cycle on every project;</text><text x="482" y="518" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">correct weak documentation habits</text><text x="482" y="540" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">early, before projects get harder</text>
