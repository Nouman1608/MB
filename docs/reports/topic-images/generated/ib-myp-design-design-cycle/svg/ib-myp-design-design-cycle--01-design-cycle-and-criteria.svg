<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 840" width="900" height="840" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="840" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The design cycle: four stages, four criteria</text>

<circle cx="450" cy="470" r="215" fill="none" stroke="#b5d3cf" stroke-width="16"/><path d="M470,255 L440,271 L440,239 Z" fill="#2e6b62"/><path d="M665,490 L649,460 L681,460 Z" fill="#2e6b62"/><path d="M430,685 L460,669 L460,701 Z" fill="#2e6b62"/><path d="M235,450 L251,480 L219,480 Z" fill="#2e6b62"/><rect x="30" y="110" width="370" height="210" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="72" cy="154" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="72" y="162.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><text x="110" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Problem stage</text><text x="110" y="172" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Criterion A: Inquiring and analysing</text><text x="54" y="218" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">identify a problem needing a</text><text x="54" y="243" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">solution, analyse the need,</text><text x="54" y="268" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">inquire into its nature</text><rect x="500" y="110" width="370" height="210" rx="14" fill="#fbf6e0" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="542" cy="154" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="542" y="162.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><text x="580" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Specification stage</text><text x="580" y="172" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Criterion B: Developing ideas</text><text x="524" y="218" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">write a detailed specification,</text><text x="524" y="243" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">present the proposed solution</text><rect x="500" y="600" width="370" height="210" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="542" cy="644" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="542" y="652.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">C</text><text x="580" y="638" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Build stage</text><text x="580" y="662" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Criterion C: Creating the solution</text><text x="524" y="708" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">plan the creation, follow the</text><text x="524" y="733" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">plan to build a testable</text><text x="524" y="758" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">prototype</text><rect x="30" y="600" width="370" height="210" rx="14" fill="#fbf6e0" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="72" cy="644" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="72" y="652.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">D</text><text x="110" y="638" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Test stage</text><text x="110" y="662" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Criterion D: Evaluating</text><text x="54" y="708" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">design and carry out tests,</text><text x="54" y="733" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">evaluate success and impact</text><text x="54" y="758" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">objectively</text><rect x="345" y="408" width="210" height="124" rx="62" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="456" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">the design</text><text x="450" y="482" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">cycle</text><text x="450" y="508" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">every project</text>
</svg>