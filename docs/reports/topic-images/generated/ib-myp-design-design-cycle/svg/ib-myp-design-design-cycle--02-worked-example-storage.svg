<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750" width="900" height="750" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="750" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: one project through the cycle</text>

<rect x="150" y="110" width="600" height="66" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="140" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">Design situation</text><text x="450" y="164" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">a storage solution for a small space, for a client</text><line x1="450" y1="178" x2="450" y2="196" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="200" width="840" height="118" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="80" cy="259" r="26" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="80" y="268.36" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><text x="130" y="266" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Inquire</text><text x="300" y="238" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">identify the client’s actual need</text><text x="300" y="263" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">research existing solutions</text><text x="300" y="288" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">analyse what a genuine solution requires</text><line x1="450" y1="310" x2="450" y2="328" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="332" width="840" height="118" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="80" cy="391" r="26" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="80" y="400.36" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><text x="130" y="398" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Develop</text><text x="300" y="370" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">write a detailed specification: size,</text><text x="300" y="395" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">materials, budget, constraints</text><text x="300" y="420" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">present a proposed solution against it</text><line x1="450" y1="442" x2="450" y2="460" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="464" width="840" height="118" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="80" cy="523" r="26" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="80" y="532.36" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">C</text><text x="130" y="530" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Create</text><text x="300" y="502" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">plan the build sequence</text><text x="300" y="527" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">follow the plan to produce a prototype</text><text x="300" y="552" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">sufficient for testing</text><line x1="450" y1="574" x2="450" y2="592" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="596" width="840" height="118" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="80" cy="655" r="26" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="80" y="664.36" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">D</text><text x="130" y="662" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluate</text><text x="300" y="634" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">objective tests against the original</text><text x="300" y="659" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">specification; honest limitations;</text><text x="300" y="684" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">impact on the client</text>
</svg>