<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Honest evaluation is rewarded</text>

<rect x="30" y="110" width="410" height="250" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="52" y="146" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Showcase only</text><text x="55" y="186" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“The solution is already</text><text x="55" y="213" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">perfect.”</text><text x="55" y="270" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">only what worked;</text><text x="55" y="292" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">weaknesses left out</text><rect x="460" y="110" width="410" height="250" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="482" y="146" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">✓ Honest and objective</text><rect x="490" y="172" width="350" height="46" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><text x="665" y="200.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">objective tests</text><line x1="665" y1="219" x2="665" y2="230" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="490" y="232" width="350" height="46" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="665" y="260.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">real limitations named</text><line x1="665" y1="279" x2="665" y2="290" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="490" y="292" width="350" height="46" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><text x="665" y="320.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">how it could be improved</text><rect x="30" y="380" width="840" height="76" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="426" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Stage D rewards transparency about weaknesses; it does not penalise it.</text>
</svg>