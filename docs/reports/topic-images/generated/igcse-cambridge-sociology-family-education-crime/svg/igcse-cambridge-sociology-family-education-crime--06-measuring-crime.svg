<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 632" width="900" height="632" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="632" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why recorded crime is not the true level</text>

<path d="M30,110 L570,110 L530,202 L70,202 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><text x="300" y="163" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">True level of offending</text><path d="M85,218 L515,218 L475,310 L125,310 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><text x="300" y="271" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Reported to police</text><rect x="610" y="178" width="260" height="68" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="624" y="205.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Under-reporting: victims</text><text x="624" y="227.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">do not report</text><line x1="604" y1="210" x2="544" y2="210" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><path d="M140,326 L460,326 L420,418 L180,418 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><text x="300" y="379" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Recorded by police</text><rect x="610" y="286" width="260" height="68" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="624" y="313.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Under-recording: not every</text><text x="624" y="335.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">report is recorded</text><line x1="604" y1="318" x2="489" y2="318" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><rect x="610" y="366" width="260" height="68" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="624" y="393.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Definitions also change</text><text x="624" y="415.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">over time</text><text x="450" y="474" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Three ways to measure crime (6.1.6), each with strengths and limitations</text><rect x="30" y="492" width="269.3333333333333" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="537.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MEASURE 1</text><text x="50" y="563.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Official statistics</text><rect x="315.3333333333333" y="492" width="269.3333333333333" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="335.3333333333333" y="537.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MEASURE 2</text><text x="335.3333333333333" y="563.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Self-report studies</text><rect x="600.6666666666666" y="492" width="269.3333333333333" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="620.6666666666666" y="525" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MEASURE 3</text><text x="620.6666666666666" y="551.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Victim surveys</text><text x="620.6666666666666" y="576.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">(local and national)</text>
</svg>