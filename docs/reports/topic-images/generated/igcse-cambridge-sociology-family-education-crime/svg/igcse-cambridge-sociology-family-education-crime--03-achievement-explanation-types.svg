<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 474" width="900" height="474" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="474" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Sorting explanations of achievement (5.3)</text>

<rect x="30" y="104" width="269.3333333333333" height="187" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">MATERIAL</text><text x="50" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">What a family can</text><text x="50" y="188.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">afford</text><text x="50" y="217.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="217.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">e.g. access to digital</text><text x="66.15" y="239.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">technology</text><rect x="315.3333333333333" y="104" width="269.3333333333333" height="187" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="335.3333333333333" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CULTURAL</text><text x="335.3333333333333" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">What a child brings</text><text x="335.3333333333333" y="188.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">from home</text><text x="335.3333333333333" y="217.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="351.4833333333333" y="217.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">e.g. cultural capital</text><text x="335.3333333333333" y="244.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="351.4833333333333" y="244.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">e.g. linguistic factors</text><rect x="600.6666666666666" y="104" width="269.3333333333333" height="187" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="620.6666666666666" y="137" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">IN-SCHOOL</text><text x="620.6666666666666" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">What happens inside</text><text x="620.6666666666666" y="188.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">school</text><text x="620.6666666666666" y="217.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="636.8166666666666" y="217.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">e.g. labelling</text><text x="620.6666666666666" y="244.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="636.8166666666666" y="244.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">e.g. pro- and</text><text x="636.8166666666666" y="266.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">anti-school subcultures</text><rect x="30" y="309" width="840" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="342" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">THE HIDDEN CURRICULUM</text><text x="50" y="368.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Apply it to a concrete example</text><text x="50" y="397.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">e.g. school uniform policies teach conformity. Norms, values, punctuality and conformity</text><text x="50" y="419.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">are taught without being named as lessons.</text>
</svg>