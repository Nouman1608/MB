<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Paper 2: three fixed questions, answer two</text>

<rect x="30" y="110" width="270" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="70" cy="154" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="70" y="162.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="108" y="160" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Family</text><text x="54" y="222" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">40 marks · parts (a)–(f)</text><rect x="315" y="110" width="270" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="355" cy="154" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="355" y="162.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="393" y="160" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Education</text><text x="339" y="222" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">40 marks · parts (a)–(f)</text><rect x="600" y="110" width="270" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="640" cy="154" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="640" y="162.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="678" y="137" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Crime, deviance</text><text x="678" y="160" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">and social</text><text x="678" y="183" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">control</text><text x="624" y="222" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">40 marks · parts (a)–(f)</text><text x="450" y="296" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Answer any 2 of the 3, e.g. Family and Education</text><rect x="30" y="320" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="353.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Cambridge expects centres to teach two of the three topics. Decide your two early; a</text><text x="50" y="375.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">working knowledge of the third is only a safety net.</text>
</svg>