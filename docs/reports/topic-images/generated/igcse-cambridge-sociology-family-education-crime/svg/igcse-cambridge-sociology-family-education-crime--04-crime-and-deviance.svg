<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 612" width="900" height="612" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="612" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Crime and deviance overlap</text>

<rect x="30" y="110" width="840" height="340" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="360" cy="280" r="140" fill="#f2e7b8" fill-opacity="0.85" stroke="#8a6d0d" stroke-width="3"/><circle cx="540" cy="280" r="140" fill="#b5d3cf" fill-opacity="0.55" stroke="#2e6b62" stroke-width="3"/><text x="290" y="260" font-size="22" font-weight="700" fill="#8a6d0d" text-anchor="middle">Deviance</text><text x="290" y="290" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">breaks</text><text x="290" y="312" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">social norms</text><text x="610" y="260" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="middle">Crime</text><text x="610" y="290" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">breaks</text><text x="610" y="312" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">the law</text><text x="450" y="274" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">both</text><text x="170" y="422" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Some deviance is not criminal</text><path d="M200,406 Q230,370 260,350" fill="none" stroke="#4a5568" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="30" y="470" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="506" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Relativity</text><text x="50" y="535.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Both are relative: what counts as crime or deviance varies across societies, cultures and</text><text x="50" y="557.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">time periods.</text>
</svg>