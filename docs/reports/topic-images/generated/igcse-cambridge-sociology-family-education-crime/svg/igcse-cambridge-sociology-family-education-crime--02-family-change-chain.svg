<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 634" width="900" height="634" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="634" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Linking causes to effects in family change</text>

<rect x="30" y="130" width="260" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="160" y="170" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Falling birth rates</text><rect x="30" y="220" width="260" height="88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="160" y="256" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Rising life</text><text x="160" y="282" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">expectancy</text><rect x="345" y="165" width="200" height="112" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="445" y="198" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">4.3.1</text><text x="445" y="225" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Ageing</text><text x="445" y="251" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">population</text><line x1="296" y1="165" x2="338" y2="195" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="296" y1="255" x2="338" y2="225" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="610" y="120" width="260" height="62" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="622" y="144.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Beanpole families: more</text><text x="622" y="165.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">generations alive at once</text><line x1="551" y1="210" x2="604" y2="148" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="610" y="186" width="260" height="62" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="622" y="210.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The pivot or “sandwich</text><text x="622" y="231.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">generation”</text><line x1="551" y1="210" x2="604" y2="214" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="610" y="252" width="260" height="62" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="622" y="276.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Changing roles of</text><text x="622" y="297.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">grandparents</text><line x1="551" y1="210" x2="604" y2="280" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="340" width="840" height="113" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="373" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">WATCH OUT</text><text x="50" y="399.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Boomerang children are not an effect of an ageing population</text><text x="50" y="428.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">They belong to the changing roles of children (4.3.5).</text><rect x="30" y="471" width="410" height="133" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="504" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">NEW RIGHT</text><text x="50" y="530.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Diversity = dysfunction</text><text x="50" y="558.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Favours the traditional nuclear family</text><rect x="460" y="471" width="410" height="133" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="480" y="504" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">POSTMODERNISTS</text><text x="480" y="530.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Diversity = choice</text><text x="480" y="558.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Treat diversity positively, as individual</text><text x="480" y="579.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">choice</text>
</svg>