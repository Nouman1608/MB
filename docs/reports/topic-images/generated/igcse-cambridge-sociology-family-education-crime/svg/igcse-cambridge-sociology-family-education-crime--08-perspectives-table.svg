<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 498" width="900" height="498" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="498" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Your three-column table: one mechanism per cell</text>

<rect x="30" y="104" width="150" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start"></text><rect x="180" y="104" width="230" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="192" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Functionalist</text><rect x="410" y="104" width="230" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="422" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Marxist</text><rect x="640" y="104" width="230" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="652" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Feminist</text><rect x="30" y="150" width="150" height="110" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="176.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Family</text><rect x="180" y="150" width="230" height="110" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="192" y="176.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">“Warm bath” theory:</text><text x="192" y="198.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">emotional stabilisation</text><rect x="410" y="150" width="230" height="110" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="422" y="176.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Family as a unit of</text><text x="422" y="198.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">consumption</text><rect x="640" y="150" width="230" height="110" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="652" y="176.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Joint vs segregated</text><text x="652" y="198.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">conjugal roles;</text><text x="652" y="220.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">domestic division of</text><text x="652" y="242.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">labour</text><rect x="30" y="260" width="150" height="110" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="286.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Education</text><rect x="180" y="260" width="230" height="110" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="192" y="286.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Meritocracy and role</text><text x="192" y="308.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">allocation</text><rect x="410" y="260" width="230" height="110" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="422" y="286.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Reproduces class</text><text x="422" y="308.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">inequality via cultural</text><text x="422" y="330.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">capital; myth of</text><text x="422" y="352.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">meritocracy</text><rect x="640" y="260" width="230" height="110" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="652" y="286.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Patriarchal curriculum;</text><text x="652" y="308.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">gendered subject choice</text><rect x="30" y="388" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="421.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Name the mechanism, not a generic claim such as “Marxists think education benefits the</text><text x="50" y="443.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">rich”.</text>
</svg>