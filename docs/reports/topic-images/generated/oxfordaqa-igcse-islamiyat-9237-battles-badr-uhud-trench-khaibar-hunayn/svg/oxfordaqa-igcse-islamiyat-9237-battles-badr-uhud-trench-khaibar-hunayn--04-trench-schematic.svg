<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 706" width="900" height="706" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="706" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Trench (Ahzab), 627 CE</text>

<rect x="30" y="110" width="500" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="130" y="366" width="300" height="180" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="280" y="464" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Madinah</text><path d="M110,310 L450,310" stroke="#8a6d0d" stroke-width="14" stroke-linecap="round"/><text x="280" y="346" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">the trench, across the open northern side</text><rect x="110" y="150" width="340" height="90" rx="12" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><text x="280" y="190" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Confederates (al-Ahzab)</text><text x="280" y="214" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">about 10,000</text><line x1="150" y1="244" x2="150" y2="292" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><line x1="410" y1="244" x2="410" y2="292" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><text x="280" y="274" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">cavalry cannot cross</text><text x="495" y="160" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">N</text><line x1="495" y1="210" x2="495" y2="172" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="550" y="110" width="320" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="564" y="137.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Salman al-Farsi’s idea</text><text x="564" y="164" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">A Persian method unknown in Arabia</text><rect x="550" y="194" width="320" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="564" y="221.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Leadership by example</text><text x="564" y="248" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">The Prophet (pbuh) dug alongside the</text><text x="564" y="268" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">companions in hunger and cold</text><rect x="550" y="298" width="320" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="564" y="325.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Siege of several weeks</text><text x="564" y="352" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Banu Qurayza broke their agreement;</text><text x="564" y="372" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">distrust grew among the allies</text><rect x="550" y="402" width="320" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="564" y="429.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">A fierce, cold wind (33:9)</text><text x="564" y="456" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Tore down their tents; the</text><text x="564" y="476" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">confederates withdrew</text><rect x="30" y="596" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="629.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The last great Makkan attack. It shows the value of consultation and of good ideas whatever</text><text x="50" y="651.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">their source.</text>
</svg>