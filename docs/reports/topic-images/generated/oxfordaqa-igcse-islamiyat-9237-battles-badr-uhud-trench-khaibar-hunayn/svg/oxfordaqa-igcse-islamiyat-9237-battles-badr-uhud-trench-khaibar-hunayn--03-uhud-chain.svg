<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 768" width="900" height="768" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="768" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Uhud, 625 CE: how early success was lost</text>

<line x1="62" y1="124" x2="62" y2="606" stroke="#c9d6d4" stroke-width="4"/><rect x="108" y="104" width="762" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="139.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Consultation</text><text x="128" y="167.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The Prophet (pbuh) accepted the majority view and went out to Mount Uhud.</text><circle cx="62" cy="148" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="156.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="108" y="202" width="762" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="237.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Withdrawal</text><text x="128" y="265.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Abdullah ibn Ubayy left with about a third of the army, leaving about 700.</text><circle cx="62" cy="246" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="254.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="108" y="300" width="762" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="335.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A clear order</text><text x="128" y="363.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">About fifty archers under Abdullah ibn Jubayr (RA): do not leave the hill, whatever</text><text x="128" y="384.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">happens.</text><circle cx="62" cy="354.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="363.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="108" y="419" width="762" height="88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="128" y="454.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Early success, then disobedience</text><text x="128" y="482.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Most archers left their post to collect spoils.</text><circle cx="62" cy="463" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="471.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="108" y="517" width="762" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="552.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Attack from behind</text><text x="128" y="580.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Khalid ibn al-Walid led the cavalry round the hill; Hamza (RA) and about seventy</text><text x="128" y="601.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Muslims were martyred.</text><circle cx="62" cy="571.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="580.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="100.07500000000005" y="644" width="121.975" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="161.06250000000006" y="671.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Obedience</text><rect x="234.05000000000004" y="644" width="258.82499999999993" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="363.4625" y="671.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Greed breaks discipline</text><rect x="504.875" y="644" width="200.17499999999998" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="604.9625" y="671.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Hypocrisy exposed</text><rect x="717.05" y="644" width="82.875" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="758.4875" y="671.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Shura</text><rect x="345.025" y="696" width="209.95" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="723.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Patience in defeat</text>
</svg>