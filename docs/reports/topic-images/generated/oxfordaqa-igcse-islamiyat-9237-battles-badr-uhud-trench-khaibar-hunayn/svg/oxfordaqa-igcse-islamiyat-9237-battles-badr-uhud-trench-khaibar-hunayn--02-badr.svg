<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 563" width="900" height="563" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="563" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Badr, 624 CE</text>

<rect x="30" y="104" width="253.33333333333334" height="240" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CAUSE</text><text x="50" y="162.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A caravan and an</text><text x="50" y="186.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">army</text><text x="50" y="214.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Muslims went to intercept</text><text x="50" y="235.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Abu Sufyan’s caravan; it</text><text x="50" y="256.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">escaped and a Makkan army</text><text x="50" y="277.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">marched out under Abu</text><text x="50" y="298.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Jahl.</text><line x1="289.33333333333337" y1="224" x2="317.33333333333337" y2="224" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="104" width="253.33333333333334" height="240" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="343.33333333333337" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EVENTS</text><text x="343.33333333333337" y="162.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">At the wells of</text><text x="343.33333333333337" y="186.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Badr, in Ramadhan</text><text x="343.33333333333337" y="214.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The Ansar promised to</text><text x="343.33333333333337" y="235.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">follow the Prophet (pbuh)</text><text x="343.33333333333337" y="256.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">anywhere; he spent the</text><text x="343.33333333333337" y="277.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">night in prayer; single</text><text x="343.33333333333337" y="298.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">combat, then a decisive</text><text x="343.33333333333337" y="319.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">victory.</text><line x1="582.6666666666667" y1="224" x2="610.6666666666667" y2="224" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="104" width="253.33333333333334" height="240" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="636.6666666666667" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PRISONERS</text><text x="636.6666666666667" y="162.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Treated well</text><text x="636.6666666666667" y="190.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Some ransomed; literate</text><text x="636.6666666666667" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">captives could earn</text><text x="636.6666666666667" y="232.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">freedom by teaching</text><text x="636.6666666666667" y="253.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Muslim children to read.</text><rect x="30" y="362" width="840" height="171" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="398" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Importance</text><text x="50" y="427.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="427.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The Qur’an calls it the “day of criterion” (8:41), separating truth from falsehood</text><text x="50" y="454.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="454.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Victory comes from Allah, not numbers (3:123); angels sent as reinforcement (8:9)</text><text x="50" y="481.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="481.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Established the Muslims as a power in Arabia and raised morale</text><text x="50" y="508.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="508.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Treatment of prisoners showed justice and the value of education</text>
</svg>