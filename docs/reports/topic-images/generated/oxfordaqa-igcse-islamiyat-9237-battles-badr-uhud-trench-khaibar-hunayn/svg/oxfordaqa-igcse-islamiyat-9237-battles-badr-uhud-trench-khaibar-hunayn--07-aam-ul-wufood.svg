<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 595" width="900" height="595" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="595" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Aam ul Wufood: the Year of Delegations</text>

<line x1="310" y1="179.5" x2="360.75" y2="238" stroke="#1e2a44" stroke-width="2.5"/><line x1="310" y1="269.5" x2="360.75" y2="269.5" stroke="#1e2a44" stroke-width="2.5"/><line x1="310" y1="359.5" x2="360.75" y2="301" stroke="#1e2a44" stroke-width="2.5"/><line x1="590" y1="166" x2="539.25" y2="233.275" stroke="#1e2a44" stroke-width="2.5"/><line x1="590" y1="292" x2="539.25" y2="277.375" stroke="#1e2a44" stroke-width="2.5"/><line x1="590" y1="395.5" x2="539.25" y2="313.6" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="269.5" r="105" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="255.25" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Delegations come</text><text x="450" y="276.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">to Madinah,</text><text x="450" y="297.75" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">630–631 CE</text><g transform="translate(0,25.5)"><rect x="30" y="104" width="280" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="134.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Thaqif of Ta’if</text><text x="46" y="162.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Who had once stoned the</text><text x="46" y="183.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Prophet (pbuh)</text><rect x="30" y="218" width="280" height="52" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="248.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Banu Tamim</text><rect x="30" y="284" width="280" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="314.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Christians of Najran</text><text x="46" y="342.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Discussed beliefs; kept their</text><text x="46" y="363.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">religion under an agreement</text></g><g transform="translate(0,0)"><rect x="590" y="104" width="280" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="606" y="134.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Received with</text><text x="606" y="158.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">hospitality</text><text x="606" y="186.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">In the mosque, and taught</text><text x="606" y="207.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Islam</text><rect x="590" y="242" width="280" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="606" y="272.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Teachers sent back</text><text x="606" y="300.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Companions as teachers and</text><text x="606" y="321.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">governors</text><rect x="590" y="356" width="280" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="606" y="386.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Mu’adh ibn Jabal (RA)</text><text x="606" y="414.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Sent to Yemen</text></g><rect x="30" y="453" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="489" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Significance</text><text x="50" y="518.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Most of Arabia accepted Islam peacefully, fulfilling Surah an-Nasr (110): “you see the</text><text x="50" y="540.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">people entering into the religion of Allah in multitudes”.</text>
</svg>