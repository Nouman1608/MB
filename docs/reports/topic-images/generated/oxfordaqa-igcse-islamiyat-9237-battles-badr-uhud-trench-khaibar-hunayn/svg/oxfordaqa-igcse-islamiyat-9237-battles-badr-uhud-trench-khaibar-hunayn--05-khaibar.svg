<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 465" width="900" height="465" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="465" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Khaibar, 628 CE</text>

<rect x="30" y="104" width="253.33333333333334" height="219" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CAUSE</text><text x="50" y="162.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A threat from the</text><text x="50" y="186.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">north</text><text x="50" y="214.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A fortified oasis where</text><text x="50" y="235.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">leaders of the expelled</text><text x="50" y="256.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Banu Nadir settled; it</text><text x="50" y="277.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">had supported the</text><text x="50" y="298.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">confederates.</text><line x1="289.33333333333337" y1="213.5" x2="317.33333333333337" y2="213.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="104" width="253.33333333333334" height="219" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="343.33333333333337" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EVENTS</text><text x="343.33333333333337" y="162.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Forts besieged one</text><text x="343.33333333333337" y="186.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">by one</text><text x="343.33333333333337" y="214.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Soon after Hudaibiyah.</text><text x="343.33333333333337" y="235.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The flag was given to</text><text x="343.33333333333337" y="256.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Hazrat Ali (RA), who</text><text x="343.33333333333337" y="277.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">captured the fort that</text><text x="343.33333333333337" y="298.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">held out (Bukhari).</text><line x1="582.6666666666667" y1="213.5" x2="610.6666666666667" y2="213.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="104" width="253.33333333333334" height="219" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="636.6666666666667" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TERMS</text><text x="636.6666666666667" y="162.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">They stayed and</text><text x="636.6666666666667" y="186.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">farmed</text><text x="636.6666666666667" y="214.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The people of Khaibar</text><text x="636.6666666666667" y="235.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">kept the land, giving</text><text x="636.6666666666667" y="256.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">half the produce to the</text><text x="636.6666666666667" y="277.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Muslims.</text><rect x="194.95000000000002" y="341" width="278.375" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="334.13750000000005" y="368.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Threat to Madinah removed</text><rect x="485.32500000000005" y="341" width="219.72499999999997" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="595.1875" y="368.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Mercy after victory</text><rect x="281.4875" y="393" width="337.025" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="420.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Economy of Madinah strengthened</text>
</svg>