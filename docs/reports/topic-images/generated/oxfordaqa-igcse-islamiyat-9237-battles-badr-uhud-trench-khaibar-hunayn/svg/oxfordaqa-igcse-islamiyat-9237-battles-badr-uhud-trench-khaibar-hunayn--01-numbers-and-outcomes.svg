<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 662" width="900" height="662" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="662" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Army sizes and outcomes</text>

<text x="30" y="136" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Badr, 624</text><rect x="300" y="116" width="14.084999999999999" height="26" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="324.085" y="135" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">Muslims about 313</text><rect x="300" y="150" width="45" height="26" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><text x="355" y="169" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">Makkans about 1,000</text><text x="30" y="160" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Victory</text><text x="30" y="238" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Uhud, 625</text><rect x="300" y="218" width="31.5" height="26" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="341.5" y="237" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">Muslims about 700</text><rect x="300" y="252" width="135" height="26" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><text x="445" y="271" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">Quraysh about 3,000</text><text x="30" y="262" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">Heavy losses after the</text><text x="30" y="282" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">archers left</text><text x="30" y="340" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Trench, 627</text><rect x="300" y="320" width="450" height="26" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><text x="310" y="339" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">Confederates about 10,000</text><text x="30" y="364" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Siege failed; confederates</text><text x="30" y="384" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">withdrew</text><text x="30" y="430" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Hunayn, 630</text><rect x="300" y="410" width="540" height="26" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="310" y="429" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">Muslims about 12,000, the largest yet</text><text x="30" y="454" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">Ambushed and many fled, then</text><text x="30" y="474" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">victory</text><line x1="300" y1="106" x2="300" y2="464" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="498" width="840" height="134" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="534" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Reliance on Allah, not numbers</text><text x="50" y="563.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Badr: “Allah had given you victory at Badr while you were weak” (3:123). Hunayn: “When your</text><text x="50" y="585.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">great number pleased you, but it did not avail you at all” (9:25). Figures are the</text><text x="50" y="607.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">traditional, approximate ones given in the sources.</text>
</svg>