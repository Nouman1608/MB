<!-- place after: ## Ethos: the appeal to credibility and character -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/ap-english-language-2-3-appeals-modes-persuasion-study-guide--02-where-ethos-is-built.webp" width="900" height="498" alt="Ethos can be built before the argument (a title or reputation), within the text (an account of experience) and through the style (precision and courtesy). Six things build trust: knowledge, fairness, shared values, good will, reliable sources and careful language. Exaggeration and errors damage it." loading="lazy">
  <figcaption>Ethos is the audience’s trust, built before, within and through the writing.</figcaption>
</figure>

<!-- place after: ## Common appeal confusions -->
<figure class="topic-figure">
