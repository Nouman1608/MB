<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 388" width="900" height="388" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="388" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why peaceful protest was effective</text>

<line x1="330" y1="171" x2="406" y2="210.9" stroke="#1e2a44" stroke-width="2.5"/><line x1="330" y1="295.5" x2="406" y2="248.25" stroke="#1e2a44" stroke-width="2.5"/><line x1="570" y1="160.5" x2="494" y2="207.75" stroke="#1e2a44" stroke-width="2.5"/><line x1="570" y1="295.5" x2="494" y2="248.25" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="228" r="88" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="222.54" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Peaceful</text><text x="450" y="248.16" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">protest</text><rect x="30" y="110.5" width="300" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="140.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The moral argument</text><text x="46" y="169.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Non-violent protesters met by</text><text x="46" y="190.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">violence made segregation look</text><text x="46" y="211.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">brutal to America and the world.</text><rect x="30" y="245.5" width="300" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="275.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Television</text><text x="46" y="304.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Reached a national audience</text><text x="46" y="325.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(Birmingham, Selma).</text><rect x="570" y="100" width="300" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="586" y="130.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Pressure on presidents</text><text x="586" y="158.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">And on Congress, while the USA</text><text x="586" y="179.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">claimed to defend freedom in the</text><text x="586" y="200.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Cold War.</text><rect x="570" y="235" width="300" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="586" y="265.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The Black churches</text><text x="586" y="293.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The movement drew on their</text><text x="586" y="314.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">organisation; the SCLC worked</text><text x="586" y="335.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">through them.</text>
</svg>