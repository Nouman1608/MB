<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 691" width="900" height="691" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="691" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From court ruling to federal troops</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Brown v Board (1954) and Little Rock (1957)</text>
<line x1="60" y1="144" x2="60" y2="528" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="157.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">NAACP takes segregation to court</text><text x="122" y="187.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Its lawyer Thurgood Marshall argues the case.</text><circle cx="60" cy="167" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="175.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="222" width="766" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122" y="255.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Brown v Board of Education of Topeka, 1954</text><text x="122" y="285.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The Supreme Court rules that segregated schools are unconstitutional (a court ruling, not</text><text x="122" y="307.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">a law).</text><circle cx="60" cy="276" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="284.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="342" width="766" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="375.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Many Southern states resist</text><text x="122" y="405.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">In 1957 the governor of Arkansas uses the National Guard to stop the Little Rock Nine</text><text x="122" y="427.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">entering Central High School.</text><circle cx="60" cy="396" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="404.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="462" width="766" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="495.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Eisenhower sends federal troops</text><text x="122" y="525.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The nine students are protected.</text><circle cx="60" cy="505" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="513.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="30" y="570" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="604.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Lesson of Little Rock</text><text x="450" y="634.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Court rulings needed federal enforcement to work.</text>
</svg>