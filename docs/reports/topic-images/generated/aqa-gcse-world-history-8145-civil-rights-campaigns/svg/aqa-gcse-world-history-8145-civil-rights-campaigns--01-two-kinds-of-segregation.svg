<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 595" width="900" height="595" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="595" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two kinds of segregation</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Laws in the South; discrimination in the North</text>
<rect x="30" y="124" width="411" height="306" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">THE SOUTH</text><text x="50" y="184.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">By law (Jim Crow)</text><text x="50" y="214.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="214.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Separate schools, transport, restaurants,</text><text x="66.15" y="236.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">parks, hospitals and cemeteries</text><text x="50" y="263.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="263.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Plessy</tspan> <tspan font-weight="700" fill="#1e2a44">v</tspan> <tspan font-weight="700" fill="#1e2a44">Ferguson</tspan> <tspan font-weight="700" fill="#1e2a44">(1896):</tspan> separate was</text><text x="66.15" y="285.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">lawful if "equal"; Black facilities were</text><text x="66.15" y="307.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">almost always worse</text><text x="50" y="334.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="334.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Voting blocked by literacy tests, poll taxes</text><text x="66.15" y="356.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">and intimidation</text><text x="50" y="383.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="383.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Enforced by violence: the Ku Klux Klan</text><text x="66.15" y="405.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">used beatings, bombings and lynching</text><rect x="459" y="124" width="411" height="306" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="479" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THE NORTH</text><text x="479" y="184.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">In practice (de facto)</text><text x="479" y="214.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.15" y="214.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">No Jim Crow laws</text><text x="479" y="241.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.15" y="241.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Discrimination in <tspan font-weight="700" fill="#1e2a44">housing</tspan> and <tspan font-weight="700" fill="#1e2a44">jobs</tspan></text><text x="479" y="268.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.15" y="268.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Many Black Americans kept in poor city</text><text x="495.15" y="290.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">districts, often called ghettos</text><text x="479" y="317.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.15" y="317.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Became important in the 1960s, when</text><text x="495.15" y="339.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">campaigns moved north</text><rect x="30" y="452" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="486.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">1955: Emmett Till</text><text x="50" y="516.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The murder in Mississippi of a fourteen-year-old boy from Chicago, and the acquittal of the men</text><text x="50" y="538.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">accused, shocked many Americans.</text>
</svg>