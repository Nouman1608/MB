<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Integration or separation?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">King, Malcolm X and Black Power compared</text>
<clipPath id="tc124"><rect x="30" y="124" width="840" height="384" rx="14"/></clipPath><g clip-path="url(#tc124)"><rect x="30" y="124" width="148.23529411764707" height="49" fill="#b5d3cf"/><rect x="178.23529411764707" y="124" width="230.58823529411765" height="49" fill="#b5d3cf"/><text x="192.23529411764707" y="152.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Martin Luther King</text><rect x="408.82352941176475" y="124" width="230.58823529411765" height="49" fill="#f2e7b8"/><text x="422.82352941176475" y="152.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Malcolm X</text><rect x="639.4117647058824" y="124" width="230.58823529411765" height="49" fill="#efdfa8"/><text x="653.4117647058824" y="152.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Black Power</text><rect x="30" y="173" width="148.23529411764707" height="89" fill="#dce9e7"/><text x="44" y="199.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Organisation</text><rect x="178.23529411764707" y="173" width="230.58823529411765" height="89" fill="#ffffff"/><text x="192.23529411764707" y="199.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">SCLC (1957), through the</text><text x="192.23529411764707" y="220.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">churches</text><rect x="408.82352941176475" y="173" width="230.58823529411765" height="89" fill="#ffffff"/><text x="422.82352941176475" y="199.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Nation of Islam (left it in</text><text x="422.82352941176475" y="220.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1964)</text><rect x="639.4117647058824" y="173" width="230.58823529411765" height="89" fill="#ffffff"/><text x="653.4117647058824" y="199.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Stokely Carmichael of</text><text x="653.4117647058824" y="220.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">SNCC (1966); Black</text><text x="653.4117647058824" y="241.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Panther Party (1966)</text><line x1="30" y1="262" x2="870" y2="262" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="262" width="148.23529411764707" height="89" fill="#dce9e7"/><text x="44" y="288.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Aim</text><rect x="178.23529411764707" y="262" width="230.58823529411765" height="89" fill="#f8faf9"/><text x="192.23529411764707" y="288.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Integration and equal</text><text x="192.23529411764707" y="309.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rights</text><rect x="408.82352941176475" y="262" width="230.58823529411765" height="89" fill="#f8faf9"/><text x="422.82352941176475" y="288.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Black separation rather</text><text x="422.82352941176475" y="309.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">than integration</text><rect x="639.4117647058824" y="262" width="230.58823529411765" height="89" fill="#f8faf9"/><text x="653.4117647058824" y="288.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Black pride, self-reliance</text><text x="653.4117647058824" y="309.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and control of Black</text><text x="653.4117647058824" y="330.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">communities</text><line x1="30" y1="351" x2="870" y2="351" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="351" width="148.23529411764707" height="89" fill="#dce9e7"/><text x="44" y="377.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Method</text><rect x="178.23529411764707" y="351" width="230.58823529411765" height="89" fill="#ffffff"/><text x="192.23529411764707" y="377.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Non-violent direct action</text><rect x="408.82352941176475" y="351" width="230.58823529411765" height="89" fill="#ffffff"/><text x="422.82352941176475" y="377.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Self-defence "by any</text><text x="422.82352941176475" y="398.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">means necessary"</text><rect x="639.4117647058824" y="351" width="230.58823529411765" height="89" fill="#ffffff"/><text x="653.4117647058824" y="377.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Armed patrols to monitor</text><text x="653.4117647058824" y="398.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the police; community</text><text x="653.4117647058824" y="419.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">programmes</text><line x1="30" y1="440" x2="870" y2="440" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="440" width="148.23529411764707" height="68" fill="#dce9e7"/><text x="44" y="466.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Ended / key</text><text x="44" y="487.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">moment</text><rect x="178.23529411764707" y="440" width="230.58823529411765" height="68" fill="#f8faf9"/><text x="192.23529411764707" y="466.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Assassinated in Memphis,</text><text x="192.23529411764707" y="487.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">4 April 1968</text><rect x="408.82352941176475" y="440" width="230.58823529411765" height="68" fill="#f8faf9"/><text x="422.82352941176475" y="466.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Assassinated, February</text><text x="422.82352941176475" y="487.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1965</text><rect x="639.4117647058824" y="440" width="230.58823529411765" height="68" fill="#f8faf9"/><text x="653.4117647058824" y="466.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1968 Olympics: Smith and</text><text x="653.4117647058824" y="487.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Carlos raise gloved fists</text></g><line x1="178.23529411764707" y1="124" x2="178.23529411764707" y2="508" stroke="#c9d6d4" stroke-width="1.5"/><line x1="408.82352941176475" y1="124" x2="408.82352941176475" y2="508" stroke="#c9d6d4" stroke-width="1.5"/><line x1="639.4117647058824" y1="124" x2="639.4117647058824" y2="508" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="124" width="840" height="384" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="530" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="564.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Do not merge them</text><text x="50" y="594.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Malcolm X died in 1965, before the slogan "Black Power" spread in 1966.</text>
