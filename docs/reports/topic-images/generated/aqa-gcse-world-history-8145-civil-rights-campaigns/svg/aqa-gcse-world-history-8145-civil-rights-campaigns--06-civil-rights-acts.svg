<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 667" width="900" height="667" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="667" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What the Acts changed</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">1964, 1965 and 1968</text>
<rect x="30" y="124" width="268" height="316" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1964</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Civil Rights Act</text><text x="50" y="211.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Proposed by Kennedy,</text><text x="65.2" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">passed under Johnson</text><text x="50" y="258.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="258.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Banned segregation in</text><text x="65.2" y="279.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">public places</text><text x="50" y="305.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="305.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Outlawed job discrimination</text><text x="65.2" y="326.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(race, colour, religion, sex,</text><text x="65.2" y="347.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">national origin)</text><text x="50" y="373.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="373.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Created the EEOC; funds</text><text x="65.2" y="394.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">could be withheld from</text><text x="65.2" y="415.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">segregated schools</text><rect x="316" y="124" width="268" height="316" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="336" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1965</text><text x="336" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Voting Rights Act</text><text x="336" y="211.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="351.2" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Helped through by the</text><text x="351.2" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">televised violence at Selma</text><text x="336" y="258.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="351.2" y="258.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Voting rights were not part</text><text x="351.2" y="279.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">of the 1964 Act</text><rect x="602" y="124" width="268" height="316" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="622" y="156" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">1968</text><text x="622" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Civil Rights Act (Fair</text><text x="622" y="206.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Housing Act)</text><text x="622" y="235.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="637.2" y="235.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Passed in April, days after</text><text x="637.2" y="256.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">King's death</text><text x="622" y="282.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="637.2" y="282.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Banned discrimination in</text><text x="637.2" y="303.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">selling and renting housing</text><text x="622" y="329.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="637.2" y="329.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Targeted de facto</text><text x="637.2" y="350.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">segregation in the North</text><text x="30" y="476" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">HOW MUCH DID THEY CHANGE?</text><rect x="30" y="500" width="411" height="135" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="534.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Legal equality: largely won by 1968</text><text x="50" y="563.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="563.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Legal segregation in the South ended</text><text x="50" y="589.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="589.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Black voter registration rose after 1965</text><rect x="459" y="500" width="411" height="135" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="479" y="534.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Social and economic equality: not won</text><text x="479" y="563.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="494.2" y="563.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Poverty, unequal schooling and housing</text><text x="494.2" y="584.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">discrimination continued</text><text x="479" y="610.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="494.2" y="610.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">1968 Act weakly enforced at first</text>
</svg>