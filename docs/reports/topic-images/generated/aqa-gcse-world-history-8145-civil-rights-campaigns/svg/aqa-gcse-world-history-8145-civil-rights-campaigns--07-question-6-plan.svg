<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 547" width="900" height="547" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="547" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Planning the 12-mark question</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Why was the Civil Rights Act of 1964 passed?</text>
<rect x="30" y="124" width="411" height="212" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">REASON 1</text><text x="50" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">King's peaceful protests</text><text x="50" y="213.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="213.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Birmingham's televised violence (1963)</text><text x="66.15" y="235.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">forced the issue</text><text x="50" y="262.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="262.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Kennedy proposed his bill weeks later</text><text x="50" y="289.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="289.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">March on Washington showed mass</text><text x="66.15" y="311.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">support</text><rect x="459" y="124" width="411" height="212" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">REASON 2</text><text x="479" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Presidents Kennedy and Johnson</text><text x="479" y="213.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.15" y="213.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Kennedy sent the bill to Congress</text><text x="479" y="240.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.15" y="240.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">After his assassination, Johnson used</text><text x="495.15" y="262.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">political skill and the national mood</text><text x="479" y="289.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.15" y="289.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Pushed it through against Southern</text><text x="495.15" y="311.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">opposition</text><line x1="240" y1="350" x2="380" y2="390" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="660" y1="350" x2="520" y2="390" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="404" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="438.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement: which was the necessary condition?</text><text x="50" y="468.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">For example: King's campaigns created the pressure that made a bill unavoidable, while Johnson's</text><text x="50" y="490.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">leadership turned that pressure into law. Decide which mattered more and explain why.</text>
</svg>