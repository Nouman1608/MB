<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 783" width="900" height="783" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="783" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Peaceful protest, 1955-65</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The main campaigns in order</text>
<line x1="140" y1="132" x2="140" y2="743" stroke="#1e2a44" stroke-width="4"/><rect x="180" y="124" width="690" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="193" y="151.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Montgomery Bus Boycott</text><text x="193" y="175.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Rosa Parks arrested (1 Dec 1955); boycott for over a year led by King; 1956 Supreme</text><text x="193" y="196.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Court rules bus segregation unconstitutional.</text><circle cx="140" cy="169" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="175" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1955-56</text><rect x="180" y="224" width="690" height="69" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="193" y="251.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">SCLC founded</text><text x="193" y="275.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">King helps found it to co-ordinate non-violent protest through the churches.</text><circle cx="140" cy="258.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="264.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1957</text><rect x="180" y="303" width="690" height="69" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="193" y="330.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Greensboro sit-in</text><text x="193" y="354.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Four Black students at a whites-only lunch counter; sit-ins spread and SNCC is formed.</text><circle cx="140" cy="337.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="343.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Feb 1960</text><rect x="180" y="382" width="690" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="193" y="409.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Freedom Rides</text><text x="193" y="433.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Black and white riders test a ruling against segregated bus terminals; in Alabama a bus</text><text x="193" y="454.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">is firebombed.</text><circle cx="140" cy="427" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="433" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1961</text><rect x="180" y="482" width="690" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="193" y="509.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Birmingham campaign</text><text x="193" y="533.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Bull Connor uses dogs and fire hoses on demonstrators, including children; Kennedy</text><text x="193" y="554.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">proposes a civil rights bill.</text><circle cx="140" cy="527" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="533" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1963</text><rect x="180" y="582" width="690" height="69" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="193" y="609.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">March on Washington</text><text x="193" y="633.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Around a quarter of a million people; "I have a dream" speech; pressure for the bill.</text><circle cx="140" cy="616.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="622.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Aug 1963</text><rect x="180" y="661" width="690" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="193" y="688.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Selma</text><text x="193" y="712.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Voting-rights marchers attacked on the Edmund Pettus Bridge; helps pass the Voting</text><text x="193" y="733.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Rights Act that year.</text><circle cx="140" cy="706" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="712" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Mar 1965</text>
</svg>