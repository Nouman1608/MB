<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 762" width="900" height="762" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="762" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Japan: expansion and responses</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Each step met a weak or delayed response until 1941</text>
<text x="210" y="140" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">JAPANESE ACTION</text><text x="690" y="140" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">RESPONSE</text><line x1="450" y1="154" x2="450" y2="730" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="154" width="360" height="90" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="43" y="180.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Manchuria occupied</text><text x="43" y="207" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Staged explosion near Mukden, September</text><text x="43" y="227" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">1931</text><line x1="390" y1="199" x2="396" y2="199" stroke="#1e2a44" stroke-width="2"/><rect x="510" y="154" width="360" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="523" y="190.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Lytton Commission (1932)</text><text x="523" y="217" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Not self-defence; Manchuria to stay Chinese</text><line x1="504" y1="199" x2="510" y2="199" stroke="#1e2a44" stroke-width="2"/><rect x="396" y="182" width="108" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="205" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1931</text><rect x="30" y="256" width="360" height="70" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="43" y="295.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Manchukuo declared (1932)</text><line x1="390" y1="291" x2="396" y2="291" stroke="#1e2a44" stroke-width="2"/><rect x="510" y="256" width="360" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="523" y="282.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">League adopts report, Feb 1933</text><text x="523" y="309" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Japan leaves the League; no sanctions</text><line x1="504" y1="291" x2="510" y2="291" stroke="#1e2a44" stroke-width="2"/><rect x="396" y="274" width="108" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="297" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1932-33</text><rect x="30" y="338" width="360" height="70" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="43" y="364.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Jehol taken; pressure on north China</text><text x="43" y="391" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Tanggu Truce (1933)</text><line x1="390" y1="373" x2="396" y2="373" stroke="#1e2a44" stroke-width="2"/><rect x="510" y="338" width="360" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="523" y="364.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Xi'an Incident, Dec 1936</text><text x="523" y="391" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Second United Front in China</text><line x1="504" y1="373" x2="510" y2="373" stroke="#1e2a44" stroke-width="2"/><rect x="396" y="356" width="108" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="379" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1933-36</text><rect x="30" y="420" width="360" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="43" y="446.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Full-scale war with China</text><text x="43" y="473" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Marco Polo Bridge (July); Nanjing (December)</text><line x1="390" y1="455" x2="396" y2="455" stroke="#1e2a44" stroke-width="2"/><rect x="396" y="438" width="108" height="34" rx="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="461" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1937</text><rect x="30" y="502" width="360" height="90" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="43" y="541.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Tripartite Pact; northern Indochina</text><text x="43" y="562.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">(1940)</text><line x1="390" y1="547" x2="396" y2="547" stroke="#1e2a44" stroke-width="2"/><rect x="510" y="502" width="360" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="523" y="528.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">US economic pressure</text><text x="523" y="555" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Commercial treaty ended; scrap iron and steel</text><text x="523" y="575" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">restricted</text><line x1="504" y1="547" x2="510" y2="547" stroke="#1e2a44" stroke-width="2"/><rect x="396" y="530" width="108" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="553" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1939-40</text><rect x="30" y="604" width="360" height="50" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="43" y="633.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Southern Indochina occupied</text><line x1="390" y1="629" x2="396" y2="629" stroke="#1e2a44" stroke-width="2"/><rect x="510" y="604" width="360" height="50" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="523" y="633.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Assets frozen; oil exports stopped</text><line x1="504" y1="629" x2="510" y2="629" stroke="#1e2a44" stroke-width="2"/><rect x="396" y="612" width="108" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="635" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Jul 1941</text><rect x="30" y="666" width="360" height="64" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="43" y="692.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Pearl Harbor; British and Dutch</text><text x="43" y="713.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">territories attacked</text><line x1="390" y1="698" x2="396" y2="698" stroke="#1e2a44" stroke-width="2"/><rect x="396" y="681" width="108" height="34" rx="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="704" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Dec 1941</text>
</svg>