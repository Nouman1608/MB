<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 844" width="900" height="844" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="844" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Germany and Italy: expansion and responses</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">From weak responses to war, 1935-1940</text>
<text x="210" y="140" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">AGGRESSION</text><text x="690" y="140" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">RESPONSE</text><line x1="450" y1="154" x2="450" y2="812" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="154" width="360" height="90" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="43" y="203.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">German conscription announced</text><line x1="390" y1="199" x2="396" y2="199" stroke="#1e2a44" stroke-width="2"/><rect x="510" y="154" width="360" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="523" y="180.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Stresa Front (April)</text><text x="523" y="207" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Undermined by the Anglo-German Naval</text><text x="523" y="227" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Agreement</text><line x1="504" y1="199" x2="510" y2="199" stroke="#1e2a44" stroke-width="2"/><rect x="396" y="182" width="108" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="205" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1935</text><rect x="30" y="256" width="360" height="70" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="43" y="295.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Italy invades Abyssinia</text><line x1="390" y1="291" x2="396" y2="291" stroke="#1e2a44" stroke-width="2"/><rect x="510" y="256" width="360" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="523" y="282.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">League sanctions</text><text x="523" y="309" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Excluded oil; Suez Canal stayed open</text><line x1="504" y1="291" x2="510" y2="291" stroke="#1e2a44" stroke-width="2"/><rect x="396" y="274" width="108" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="297" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Oct 1935</text><rect x="510" y="338" width="360" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="523" y="364.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Hoare-Laval plan</text><text x="523" y="391" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Would have given Italy much of Abyssinia;</text><text x="523" y="411" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">collapsed when leaked</text><line x1="504" y1="383" x2="510" y2="383" stroke="#1e2a44" stroke-width="2"/><rect x="396" y="366" width="108" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="389" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Dec 1935</text><rect x="30" y="440" width="360" height="64" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="43" y="466.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Rhineland remilitarised; Rome-Berlin</text><text x="43" y="487.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Axis</text><line x1="390" y1="472" x2="396" y2="472" stroke="#1e2a44" stroke-width="2"/><rect x="396" y="455" width="108" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="478" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1936</text><rect x="30" y="516" width="360" height="70" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="43" y="555.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Anschluss with Austria (March)</text><line x1="390" y1="551" x2="396" y2="551" stroke="#1e2a44" stroke-width="2"/><rect x="510" y="516" width="360" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="523" y="542.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Munich Agreement (September)</text><text x="523" y="569" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Appeasement culminates</text><line x1="504" y1="551" x2="510" y2="551" stroke="#1e2a44" stroke-width="2"/><rect x="396" y="534" width="108" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="557" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1938</text><rect x="30" y="598" width="360" height="50" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="43" y="627.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Bohemia and Moravia occupied</text><line x1="390" y1="623" x2="396" y2="623" stroke="#1e2a44" stroke-width="2"/><rect x="510" y="598" width="360" height="50" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="523" y="627.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Britain guarantees Poland</text><line x1="504" y1="623" x2="510" y2="623" stroke="#1e2a44" stroke-width="2"/><rect x="396" y="606" width="108" height="34" rx="17" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="629" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Mar 1939</text><rect x="30" y="660" width="360" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="43" y="686.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Invasion of Poland</text><text x="43" y="713" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">After the Nazi-Soviet Pact (August)</text><line x1="390" y1="695" x2="396" y2="695" stroke="#1e2a44" stroke-width="2"/><rect x="510" y="660" width="360" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="523" y="699.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Britain and France declare war</text><line x1="504" y1="695" x2="510" y2="695" stroke="#1e2a44" stroke-width="2"/><rect x="396" y="678" width="108" height="34" rx="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="701" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Sep 1939</text><rect x="30" y="742" width="360" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="43" y="768.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Fall of France; Italy declares war (June)</text><text x="43" y="795" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">War across the Mediterranean and Africa</text><line x1="390" y1="777" x2="396" y2="777" stroke="#1e2a44" stroke-width="2"/><rect x="396" y="760" width="108" height="34" rx="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="783" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1940</text>
</svg>