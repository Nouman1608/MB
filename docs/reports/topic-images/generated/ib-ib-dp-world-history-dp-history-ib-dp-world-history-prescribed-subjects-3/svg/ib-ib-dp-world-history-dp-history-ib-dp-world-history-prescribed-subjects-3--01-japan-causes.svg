<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 493" width="900" height="493" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="493" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why Japan expanded, 1931-1941</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Three causes to weigh against each other</text>
<rect x="30" y="124" width="269.3333333333333" height="187" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">IDEOLOGY</text><text x="46" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Nationalism and militarism</text><text x="46" y="206.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Japan's destiny in Asia;</text><text x="46" y="227.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">officers' violence intimidated</text><text x="46" y="248.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">governments: Inukai killed</text><text x="46" y="269.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(May 1932); the February 26</text><text x="46" y="290.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Incident (1936)</text><rect x="315.3333333333333" y="124" width="269.3333333333333" height="187" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="331.3333333333333" y="162.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ECONOMICS</text><text x="331.3333333333333" y="188.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Depression pressures</text><text x="331.3333333333333" y="217.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Silk trade devastated;</text><text x="331.3333333333333" y="238.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Manchuria offered raw</text><text x="331.3333333333333" y="259.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">materials, land, markets and</text><text x="331.3333333333333" y="280.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">resources for total war</text><rect x="600.6666666666666" y="124" width="269.3333333333333" height="187" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="616.6666666666666" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">OPPORTUNITY</text><text x="616.6666666666666" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Instability in China</text><text x="616.6666666666666" y="206.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Chiang's Nationalists fought</text><text x="616.6666666666666" y="227.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Communists and warlords;</text><text x="616.6666666666666" y="248.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Chinese nationalism</text><text x="616.6666666666666" y="269.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">threatened Japan's rights in</text><text x="616.6666666666666" y="290.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Manchuria</text><rect x="150" y="375" width="600" height="86" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="407" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">SEPTEMBER 1931</text><text x="450" y="435.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Expansion begins in Manchuria</text><line x1="164.66666666666666" y1="317" x2="300" y2="369" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="317" x2="450" y2="369" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="735.3333333333333" y1="317" x2="600" y2="369" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/>
</svg>