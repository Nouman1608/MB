<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 511" width="900" height="511" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="511" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Question 1(b): the message of a cartoon</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">An imagined 1935 cartoon, captioned "Nobody will stop me"</text>
<rect x="30" y="124" width="370" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="157" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DETAIL</text><text x="46" y="182.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">A large, well-armed figure strides</text><text x="46" y="203.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">towards a map of Abyssinia</text><rect x="470" y="124" width="400" height="104" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="486" y="155" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">POINT 1 (1 MARK)</text><text x="486" y="181.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Mussolini was confident and determined</text><text x="486" y="204.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">to invade</text><line x1="406" y1="176" x2="464" y2="176" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="244" width="370" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="277" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DETAIL</text><text x="46" y="302.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">A small figure labelled "League of</text><text x="46" y="323.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Nations" lies asleep</text><rect x="470" y="244" width="400" height="104" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="486" y="275" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">POINT 2 (1 MARK)</text><text x="486" y="301.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The League was too weak or unwilling to</text><text x="486" y="324.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">stop him</text><line x1="406" y1="296" x2="464" y2="296" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="370" width="412" height="109" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="404.82" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Earns little</text><text x="50" y="433.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">"There is a man and a sleeping figure": details</text><text x="50" y="454.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">without meaning</text><rect x="458" y="370" width="412" height="109" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="478" y="404.82" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Not needed</text><text x="478" y="433.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Own knowledge such as sanctions or</text><text x="478" y="454.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Hoare-Laval</text>
</svg>