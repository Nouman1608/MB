<rect width="900" height="500" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why Germany and Italy expanded</text>

<clipPath id="tc100"><rect x="30" y="100" width="840" height="208" rx="14"/></clipPath><g clip-path="url(#tc100)"><rect x="30" y="100" width="168" height="51" fill="#b5d3cf"/><rect x="198" y="100" width="336" height="51" fill="#b5d3cf"/><text x="212" y="129.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Germany</text><rect x="534" y="100" width="336" height="51" fill="#f2e7b8"/><text x="548" y="129.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Italy</text><rect x="30" y="151" width="168" height="89" fill="#dce9e7"/><text x="44" y="177.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Ideology</text><rect x="198" y="151" width="336" height="89" fill="#ffffff"/><text x="212" y="177.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Nazism: reverse Versailles, unite</text><text x="212" y="198.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">German-speakers, Lebensraum in the</text><text x="212" y="219.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">east</text><rect x="534" y="151" width="336" height="89" fill="#ffffff"/><text x="548" y="177.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fascism celebrated war; a new Roman</text><text x="548" y="198.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">empire in the Mediterranean and Africa</text><line x1="30" y1="240" x2="870" y2="240" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="240" width="168" height="68" fill="#dce9e7"/><text x="44" y="266.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Economics</text><rect x="198" y="240" width="336" height="68" fill="#f8faf9"/><text x="212" y="266.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rearmament strained the economy and</text><text x="212" y="287.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">encouraged a search for resources</text><rect x="534" y="240" width="336" height="68" fill="#f8faf9"/><text x="548" y="266.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Colonial gains hoped to distract from</text><text x="548" y="287.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">economic weakness</text></g><line x1="198" y1="100" x2="198" y2="308" stroke="#c9d6d4" stroke-width="1.5"/><line x1="534" y1="100" x2="534" y2="308" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="100" width="840" height="208" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="330" width="840" height="138" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="362" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THE INTERNATIONAL SYSTEM: OPENINGS FOR BOTH</text><text x="50" y="393.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="393.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Collective security weakened after Manchuria</text><text x="50" y="418.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="418.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Britain and France feared war, rearmed slowly and disagreed with each other</text><text x="50" y="443.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="443.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The USSR was distrusted; the US stayed outside European commitments</text>
</svg>