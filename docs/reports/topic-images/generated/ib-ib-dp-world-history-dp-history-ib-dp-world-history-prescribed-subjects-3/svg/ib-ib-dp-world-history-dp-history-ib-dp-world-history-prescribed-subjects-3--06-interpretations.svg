<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 781" width="900" height="781" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="781" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two debates to know</text>

<text x="30" y="110" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">HITLER'S AIMS</text><text x="40" y="142" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Opportunist</text><text x="860" y="142" font-size="17" font-weight="700" fill="#b5602e" text-anchor="end">Long-held plan</text><defs><linearGradient id="sg126" x1="0" x2="1"><stop offset="0" stop-color="#b5d3cf"/><stop offset="1" stop-color="#f2e7b8"/></linearGradient></defs><rect x="60" y="171" width="780" height="26" rx="13" fill="url(#sg126)" stroke="#1e2a44" stroke-width="2.5"/><path d="M106.8,197 L106.8,220 L210,234 L210,254" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="106.8" cy="184" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><path d="M793.1999999999999,197 L793.1999999999999,220 L690,234 L690,254" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="793.1999999999999" cy="184" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="254" width="360" height="96" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="210" y="282.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">A. J. P. Taylor (1961)</text><text x="210" y="310.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Exploited the mistakes of others rather than</text><text x="210" y="331.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">following a plan</text><rect x="510" y="254" width="360" height="96" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="690" y="282.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Hugh Trevor-Roper</text><text x="690" y="310.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Pursued long-held aims set out in Mein</text><text x="690" y="331.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Kampf</text><text x="30" y="392" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">APPEASEMENT</text><text x="40" y="424" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Blame the leaders</text><text x="860" y="424" font-size="17" font-weight="700" fill="#b5602e" text-anchor="end">Policy under constraints</text><defs><linearGradient id="sg408" x1="0" x2="1"><stop offset="0" stop-color="#b5d3cf"/><stop offset="1" stop-color="#f2e7b8"/></linearGradient></defs><rect x="60" y="453" width="780" height="26" rx="13" fill="url(#sg408)" stroke="#1e2a44" stroke-width="2.5"/><path d="M106.8,479 L106.8,502 L210,516 L210,536" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="106.8" cy="466" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><path d="M793.1999999999999,479 L793.1999999999999,502 L690,516 L690,536" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="793.1999999999999" cy="466" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="536" width="360" height="96" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="210" y="564.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Guilty Men (1940)</text><text x="210" y="592.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">A polemic blaming Chamberlain and his</text><text x="210" y="613.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">colleagues</text><rect x="510" y="536" width="360" height="96" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="690" y="564.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Later historians</text><text x="690" y="592.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Military, economic and public-opinion</text><text x="690" y="613.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">constraints on British policy</text><rect x="30" y="660" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="694.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">For Japan, ask the same question</text><text x="450" y="724.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">How far was expansion planned in Tokyo, or forced by army commanders in the field?</text>
</svg>