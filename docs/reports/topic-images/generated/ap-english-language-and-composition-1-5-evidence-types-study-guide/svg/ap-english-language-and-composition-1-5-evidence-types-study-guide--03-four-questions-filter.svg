<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 621" width="900" height="621" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="621" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What makes evidence useful</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Four questions to ask of every piece</text>
<rect x="30" y="122" width="840" height="75.52000000000001" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="450" y="152" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">1. Relevant?</text><text x="450" y="180" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Does it bear on the claim? <tspan font-style="italic">e.g.</tspan> <tspan font-style="italic">ferry</tspan> <tspan font-style="italic">prices</tspan> <tspan font-style="italic">do</tspan> <tspan font-style="italic">not</tspan> <tspan font-style="italic">support</tspan> <tspan font-style="italic">a</tspan> <tspan font-style="italic">claim</tspan> <tspan font-style="italic">about</tspan> <tspan font-style="italic">reliability</tspan></text><line x1="450" y1="199.52" x2="450" y2="221.52" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="70" y="225.52" width="760" height="75.52000000000001" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5" /><text x="450" y="255.52" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">2. Accurate and credible?</text><text x="450" y="283.52000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Is the source competent and unbiased?</text><line x1="450" y1="303.04" x2="450" y2="325.04" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="110" y="329.04" width="680" height="75.51999999999998" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="450" y="359.04" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">3. Representative?</text><text x="450" y="387.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Typical, or a rare case chosen for effect?</text><line x1="450" y1="406.56" x2="450" y2="428.56" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="150" y="432.56" width="600" height="75.51999999999998" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5" /><text x="450" y="462.56" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">4. Appropriate for the audience?</text><text x="450" y="490.56" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Statistics for sceptical officials; an anecdote for a general readership.</text><line x1="450" y1="510.08" x2="450" y2="532.0799999999999" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="330" y="536.0799999999999" width="240" height="54" rx="27" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3" /><text x="450" y="570.0799999999999" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Useful evidence</text>
</svg>