<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Ten types of evidence</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">What each does well (+) and where it is weak (−), with the ferry examples</text>
<rect x="30" y="122" width="412" height="111.16000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="30" y="122" width="10" height="111.16000000000001" rx="5" fill="#d4b02e"/><text x="44" y="150.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Fact</text><text x="44" y="176.51" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#2e6b62">+</tspan> Hard to dispute</text><text x="44" y="196.31" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">−</tspan> May be too general</text><text x="44" y="216.10999999999999" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">“late</tspan> <tspan font-style="italic">on</tspan> <tspan font-style="italic">41</tspan> <tspan font-style="italic">of</tspan> <tspan font-style="italic">the</tspan> <tspan font-style="italic">last</tspan> <tspan font-style="italic">60</tspan> <tspan font-style="italic">days”</tspan></text><rect x="458" y="122" width="412" height="111.16000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="458" y="122" width="10" height="111.16000000000001" rx="5" fill="#d4b02e"/><text x="472" y="150.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Statistic</text><text x="472" y="176.51" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#2e6b62">+</tspan> Shows scale and pattern</text><text x="472" y="196.31" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">−</tspan> Misleads if source or sample unclear</text><text x="472" y="216.10999999999999" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">“rose</tspan> <tspan font-style="italic">from</tspan> <tspan font-style="italic">12%</tspan> <tspan font-style="italic">to</tspan> <tspan font-style="italic">68%”</tspan></text><rect x="30" y="245.16000000000003" width="412" height="111.16000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="30" y="245.16000000000003" width="10" height="111.16000000000001" rx="5" fill="#b5d3cf"/><text x="44" y="273.56" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Example / detail</text><text x="44" y="299.67" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#2e6b62">+</tspan> Concrete and memorable</text><text x="44" y="319.47" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">−</tspan> One case may not be typical</text><text x="44" y="339.27000000000004" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">the</tspan> <tspan font-style="italic">nurse</tspan> <tspan font-style="italic">who</tspan> <tspan font-style="italic">missed</tspan> <tspan font-style="italic">her</tspan> <tspan font-style="italic">shift</tspan></text><rect x="458" y="245.16000000000003" width="412" height="111.16000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="458" y="245.16000000000003" width="10" height="111.16000000000001" rx="5" fill="#b5d3cf"/><text x="472" y="273.56" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Anecdote</text><text x="472" y="299.67" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#2e6b62">+</tspan> Human and engaging</text><text x="472" y="319.47" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">−</tspan> May seem unrepresentative</text><text x="472" y="339.27000000000004" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">neighbour</tspan> <tspan font-style="italic">waiting</tspan> <tspan font-style="italic">in</tspan> <tspan font-style="italic">the</tspan> <tspan font-style="italic">rain</tspan></text><rect x="30" y="368.32000000000005" width="412" height="111.16000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="30" y="368.32000000000005" width="10" height="111.16000000000001" rx="5" fill="#b5d3cf"/><text x="44" y="396.72" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Personal experience</text><text x="44" y="422.83000000000004" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#2e6b62">+</tspan> First-hand credibility</text><text x="44" y="442.63000000000005" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">−</tspan> One person’s view</text><text x="44" y="462.43000000000006" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">“commuted...</tspan> <tspan font-style="italic">for</tspan> <tspan font-style="italic">nine</tspan> <tspan font-style="italic">years”</tspan></text><rect x="458" y="368.32000000000005" width="412" height="111.16000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="458" y="368.32000000000005" width="10" height="111.16000000000001" rx="5" fill="#b5d3cf"/><text x="472" y="396.72" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Testimony</text><text x="472" y="422.83000000000004" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#2e6b62">+</tspan> Account from someone affected</text><text x="472" y="442.63000000000005" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">−</tspan> May reflect bias or memory</text><text x="472" y="462.43000000000006" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">crew</tspan> <tspan font-style="italic">member</tspan> <tspan font-style="italic">at</tspan> <tspan font-style="italic">the</tspan> <tspan font-style="italic">inquiry</tspan></text><rect x="30" y="491.4800000000001" width="412" height="111.16000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="30" y="491.4800000000001" width="10" height="111.16000000000001" rx="5" fill="#9c8f6e"/><text x="44" y="519.8800000000001" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Expert opinion</text><text x="44" y="545.9900000000001" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#2e6b62">+</tspan> Authority on a technical point</text><text x="44" y="565.7900000000001" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">−</tspan> Only as good as credentials</text><text x="44" y="585.5900000000001" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">the</tspan> <tspan font-style="italic">port’s</tspan> <tspan font-style="italic">chief</tspan> <tspan font-style="italic">engineer</tspan></text><rect x="458" y="491.4800000000001" width="412" height="111.16000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="458" y="491.4800000000001" width="10" height="111.16000000000001" rx="5" fill="#9c8f6e"/><text x="472" y="519.8800000000001" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Experiment / study</text><text x="472" y="545.9900000000001" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#2e6b62">+</tspan> Controlled and systematic</text><text x="472" y="565.7900000000001" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">−</tspan> May not transfer</text><text x="472" y="585.5900000000001" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">faster-ferry</tspan> <tspan font-style="italic">trial:</tspan> <tspan font-style="italic">delays</tspan> <tspan font-style="italic">9%</tspan></text><rect x="30" y="614.6400000000001" width="412" height="111.16000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="30" y="614.6400000000001" width="10" height="111.16000000000001" rx="5" fill="#9c8f6e"/><text x="44" y="643.0400000000001" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Analogy</text><text x="44" y="669.1500000000001" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#2e6b62">+</tspan> Makes the unfamiliar clear</text><text x="44" y="688.95" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">−</tspan> Never exact</text><text x="44" y="708.7500000000001" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">bicycle</tspan> <tspan font-style="italic">with</tspan> <tspan font-style="italic">a</tspan> <tspan font-style="italic">flat</tspan> <tspan font-style="italic">tyre</tspan></text><rect x="458" y="614.6400000000001" width="412" height="111.16000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="458" y="614.6400000000001" width="10" height="111.16000000000001" rx="5" fill="#9c8f6e"/><text x="472" y="643.0400000000001" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Illustration</text><text x="472" y="669.1500000000001" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#2e6b62">+</tspan> Helps readers see</text><text x="472" y="688.95" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">−</tspan> Feeling more than proof</text><text x="472" y="708.7500000000001" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">photo</tspan> <tspan font-style="italic">of</tspan> <tspan font-style="italic">the</tspan> <tspan font-style="italic">queue</tspan> <tspan font-style="italic">at</tspan> <tspan font-style="italic">dawn</tspan></text>
