<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 586" width="900" height="586" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="586" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Does it measure what the claim says?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Claim: “A four-day school week would not reduce learning.”</text>
<circle cx="750" cy="312" r="110" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="750" cy="312" r="72" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="750" cy="312" r="46" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="750" y="318" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">learning</text><text x="750" y="192" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle" xml:space="preserve">what the claim names</text><rect x="30" y="122" width="540" height="115.12" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3" /><text x="44" y="150.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">(ii) Study</text><text x="44" y="177.35999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Eight schools moved to four longer days; average test scores</text><text x="44" y="198.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">unchanged after two years.</text><text x="44" y="219.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#2e6b62">Measures</tspan> <tspan font-weight="700" fill="#2e6b62">learning,</tspan> <tspan font-weight="700" fill="#2e6b62">over</tspan> <tspan font-weight="700" fill="#2e6b62">time,</tspan> <tspan font-weight="700" fill="#2e6b62">in</tspan> <tspan font-weight="700" fill="#2e6b62">several</tspan> <tspan font-weight="700" fill="#2e6b62">schools.</tspan></text><line x1="572" y1="179.56" x2="710" y2="308" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><rect x="30" y="249.12" width="540" height="94" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="44" y="277.52" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">(i) Popularity</text><text x="44" y="304.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Many people like long weekends.”</text><text x="44" y="325.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">Says</tspan> <tspan font-weight="700" fill="#b5602e">nothing</tspan> <tspan font-weight="700" fill="#b5602e">about</tspan> <tspan font-weight="700" fill="#b5602e">learning.</tspan></text><path d="M572,296.12 Q620,296.12 638,402" fill="none" stroke="#b5602e" stroke-width="2.5" marker-end="url(#ahR)" stroke-dasharray="7 6"/><rect x="30" y="355.12" width="540" height="94" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="44" y="383.52" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">(iii) Testimony</text><text x="44" y="410.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“My cousin... says it is good.”</text><text x="44" y="431.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">One</tspan> <tspan font-weight="700" fill="#b5602e">person;</tspan> <tspan font-weight="700" fill="#b5602e">a</tspan> <tspan font-weight="700" fill="#b5602e">feeling,</tspan> <tspan font-weight="700" fill="#b5602e">not</tspan> <tspan font-weight="700" fill="#b5602e">a</tspan> <tspan font-weight="700" fill="#b5602e">result.</tspan></text><path d="M572,402.12 Q620,402.12 644,432" fill="none" stroke="#b5602e" stroke-width="2.5" marker-end="url(#ahR)" stroke-dasharray="7 6"/><rect x="30" y="461.12" width="540" height="94" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="44" y="489.52" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">(iv) Fact</text><text x="44" y="516.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Used in some rural areas.”</text><text x="44" y="537.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">Being</tspan> <tspan font-weight="700" fill="#b5602e">common</tspan> <tspan font-weight="700" fill="#b5602e">is</tspan> <tspan font-weight="700" fill="#b5602e">not</tspan> <tspan font-weight="700" fill="#b5602e">the</tspan> <tspan font-weight="700" fill="#b5602e">same</tspan> <tspan font-weight="700" fill="#b5602e">as</tspan> <tspan font-weight="700" fill="#b5602e">working.</tspan></text><path d="M572,508.12 Q620,508.12 650,462" fill="none" stroke="#b5602e" stroke-width="2.5" marker-end="url(#ahR)" stroke-dasharray="7 6"/>
</svg>