<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What stands behind a claim</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The court analogy</text>
<rect x="200" y="122" width="500" height="92" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3" /><text x="450" y="158.92000000000002" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Claim</text><text x="450" y="188.62000000000003" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">The defendant took the money.</text><rect x="40" y="372" width="130" height="60" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="105" y="409" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">CCTV footage</text><rect x="190" y="372" width="130" height="60" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="255" y="409" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Bank record</text><rect x="340" y="372" width="130" height="60" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="405" y="409" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Witness</text><text x="250" y="468" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">EVIDENCE</text><text x="250" y="492" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">the raw material: facts, examples, stories, expert</text><text x="250" y="513.12" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">statements</text><rect x="540" y="352" width="330" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="558" y="386" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">REASONING</text><text x="558" y="414" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">The lawyer’s explanation of why the</text><text x="558" y="435.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">footage and the record, together,</text><text x="558" y="456.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">make the claim true.</text><path d="M250,366 C250,292 380,282 400,222" fill="none" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><path d="M705,348 C705,292 540,282 500,222" fill="none" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="450" y="297" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle" xml:space="preserve">a writer needs both</text>
</svg>