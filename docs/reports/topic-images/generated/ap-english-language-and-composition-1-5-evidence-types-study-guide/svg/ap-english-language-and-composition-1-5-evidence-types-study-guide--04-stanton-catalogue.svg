<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 638" width="900" height="638" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="638" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Evidence by accumulation</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Declaration of Sentiments, Seneca Falls, 1848</text>
<rect x="30" y="122" width="520" height="78" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="44" y="155.01" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“He has never permitted her to exercise her inalienable</text><text x="44" y="177.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">right to the elective franchise.”</text><rect x="52" y="210" width="520" height="78" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="66" y="243.01" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“He has compelled her to submit to laws, in the formation</text><text x="66" y="265.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">of which she had no voice.”</text><rect x="74" y="298" width="520" height="48" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" stroke-dasharray="6 5"/><text x="88" y="327.42" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“He has ...”</text><rect x="96" y="356" width="520" height="48" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" stroke-dasharray="6 5"/><text x="110" y="385.42" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“He has ...”</text><rect x="118" y="414" width="520" height="48" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" stroke-dasharray="6 5"/><text x="132" y="443.42" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“He has ...”</text><path d="M640,126 q16,0 16,16 L656,442 q0,16 -16,16" fill="none" stroke="#1e2a44" stroke-width="3"/><rect x="680" y="182" width="190" height="150" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3" /><text x="775" y="238.68" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Claim</text><text x="775" y="266.68" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">women have been</text><text x="775" y="287.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">denied rights</text><line x1="658" y1="292" x2="676" y2="292" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="482" width="410" height="125.75999999999999" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="48" y="516" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Kind of evidence</text><text x="48" y="544" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Particular facts and examples about law and</text><text x="48" y="565.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">custom, not statistics or testimony.</text><rect x="460" y="482" width="410" height="125.75999999999999" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="478" y="516" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Why it works</text><text x="478" y="544" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Power from sheer number; the “He has...”</text><text x="478" y="565.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">pattern imitates the Declaration of</text><text x="478" y="586.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Independence so readers recognise the charge.</text>
</svg>