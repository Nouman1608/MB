<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 636" width="900" height="636" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="636" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Naming the evidence in a paragraph</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Worked example 1 (invented data)</text>
<rect x="30" y="122" width="540" height="87.35999999999999" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3" /><text x="44" y="170.90999999999997" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">The island’s ferry is failing the people who depend on it.</text><rect x="610" y="122" width="260" height="87.35999999999999" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="622" y="148.4" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start" xml:space="preserve">Claim</text><text x="622" y="174.51" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">the only sentence that takes a</text><text x="622" y="194.31" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">stance</text><line x1="572" y1="165.68" x2="606" y2="165.68" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="219.35999999999999" width="540" height="87.36000000000004" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="44" y="257.05" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Late sailings rose from 12 percent to 68 percent in a single</text><text x="44" y="279.49" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">year.</text><rect x="610" y="219.35999999999999" width="260" height="87.36000000000004" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="622" y="245.76" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Statistic</text><text x="622" y="271.87" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">a number summarising many</text><text x="622" y="291.67" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">sailings</text><line x1="572" y1="263.04" x2="606" y2="263.04" stroke="#2e6b62" stroke-width="3"/><rect x="30" y="316.72" width="540" height="91.32" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="44" y="345.17" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">On 3 March a hospital nurse missed her shift because the</text><text x="44" y="367.61" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">7.10 sailing left at 7.45, and the ward was left a nurse short</text><text x="44" y="390.05" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">for the morning.</text><rect x="610" y="316.72" width="260" height="91.32" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="622" y="345.1" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Example</text><text x="622" y="371.21000000000004" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">one specific case makes the</text><text x="622" y="391.01000000000005" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">effect concrete</text><line x1="572" y1="362.38" x2="606" y2="362.38" stroke="#2e6b62" stroke-width="3"/><rect x="30" y="418.04" width="540" height="68.88" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="44" y="446.49" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">The port’s chief engineer has called the main engine “beyond</text><text x="44" y="468.93" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">economic repair.”</text><rect x="610" y="418.04" width="260" height="68.88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="622" y="445.1" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Expert opinion</text><text x="622" y="471.21000000000004" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">authority on a technical point</text><line x1="572" y1="452.48" x2="606" y2="452.48" stroke="#2e6b62" stroke-width="3"/><rect x="30" y="496.92" width="540" height="68.88000000000005" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="44" y="525.37" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Running the island on this ferry is like commuting on a bicycle</text><text x="44" y="547.8100000000001" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">with a flat tyre.</text><rect x="610" y="496.92" width="260" height="68.88000000000005" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="622" y="523.98" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Analogy</text><text x="622" y="550.09" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">unfamiliar compared to familiar</text><line x1="572" y1="531.36" x2="606" y2="531.36" stroke="#2e6b62" stroke-width="3"/><text x="450" y="593.8000000000001" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">Each piece of evidence is checkable or illustrative; none is a statement of position.</text>
</svg>