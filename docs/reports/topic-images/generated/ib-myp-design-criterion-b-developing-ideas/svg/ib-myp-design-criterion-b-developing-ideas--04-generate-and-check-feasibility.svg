<text x="60" y="135" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Generate</text><rect x="30" y="152" width="400" height="74" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="50" y="184" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Annotated sketching</text><text x="50" y="208" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">notes link features to spec points</text><line x1="432" y1="189" x2="478" y2="251" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="238" width="400" height="74" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="50" y="270" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Mind map</text><text x="50" y="294" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">branch into fixings, materials, forms</text><line x1="432" y1="275" x2="478" y2="277" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="324" width="400" height="74" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="50" y="356" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Morphological chart</text><text x="50" y="380" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">functions down the side, options across</text><line x1="432" y1="361" x2="478" y2="303" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="410" width="400" height="74" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="50" y="442" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">SCAMPER</text><text x="50" y="466" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">change part of an existing product</text><line x1="432" y1="447" x2="478" y2="329" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="495" y="135" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Feasible? Check all five</text><path d="M490,152 L860,152 L800,480 L550,480 Z" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="575" y="166" width="210" height="46" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="680" y="194.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">✓ skills</text><rect x="575" y="226" width="210" height="46" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="680" y="254.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">✓ tools</text><rect x="575" y="286" width="210" height="46" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="680" y="314.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">✓ materials</text><rect x="575" y="346" width="210" height="46" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="680" y="374.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">✓ time</text><rect x="575" y="406" width="210" height="46" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="680" y="434.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">✓ budget</text><line x1="675" y1="484" x2="675" y2="520" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="30" y="528" width="840" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="566" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Say so in the annotation:</text><text x="55" y="600" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Needs sheet-metal folding – school has a folding bar, so feasible.”</text>
