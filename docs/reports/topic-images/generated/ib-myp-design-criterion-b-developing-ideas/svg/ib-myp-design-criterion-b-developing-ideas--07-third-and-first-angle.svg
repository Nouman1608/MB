<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="660" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Orthographic layouts: third and first angle</text>

<rect x="30" y="110" width="410" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="150" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Third angle</text><rect x="60" y="180" width="230" height="100" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="175" y="236" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Plan</text><rect x="60" y="300" width="230" height="70" rx="4" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="175" y="341" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Front view</text><rect x="310" y="300" width="100" height="70" rx="4" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="360" y="341" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">End</text><text x="60" y="410" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">plan sits ABOVE the front view</text><text x="60" y="432" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">right-hand end view sits</text><text x="60" y="454" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to the RIGHT</text><rect x="460" y="110" width="410" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="150" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">First angle</text><rect x="490" y="180" width="230" height="70" rx="4" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="605" y="221" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Front view</text><rect x="740" y="180" width="100" height="70" rx="4" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="790" y="221" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">End</text><rect x="490" y="270" width="230" height="100" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="605" y="326" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Plan</text><text x="490" y="410" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">plan sits BELOW the front view</text><text x="490" y="432" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">view from the LEFT sits</text><text x="490" y="454" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to the right</text><text x="235" y="488" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="middle" font-style="italic">used in the planter example</text><rect x="30" y="530" width="840" height="104" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="566" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">On every planning drawing:</text><text x="55" y="596" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">projection symbol, scale, key dimensions, and “All dimensions in mm”</text><text x="55" y="620" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">written once in the title block</text>
</svg>