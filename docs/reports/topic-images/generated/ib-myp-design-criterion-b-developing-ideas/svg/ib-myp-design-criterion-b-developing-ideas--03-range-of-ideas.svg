<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What counts as a range of ideas</text>

<rect x="30" y="110" width="840" height="150" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="52" y="146" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Not a range: one idea, three colours</text><path d="M120,180 L280,180 L265,240 L135,240 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><path d="M370,180 L530,180 L515,240 L385,240 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><path d="M620,180 L780,180 L765,240 L635,240 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="280" width="840" height="396" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="318" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">✓ A genuine range: different material, fixing and structure</text><rect x="55" y="340" width="250" height="316" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><circle cx="91" cy="378" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="91" y="385.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><text x="125" y="385" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Metal trough</text><text x="75" y="430" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">material</text><text x="75" y="454" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">aluminium sheet,</text><text x="75" y="476" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">folded</text><text x="75" y="512" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">fixing</text><text x="75" y="536" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">two hooks bent</text><text x="75" y="558" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">over the rail</text><text x="75" y="594" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">structure</text><text x="75" y="618" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">single trough</text><rect x="327" y="340" width="250" height="316" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><circle cx="363" cy="378" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="363" y="385.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><text x="397" y="385" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Clamp-on shelf</text><text x="347" y="430" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">material</text><text x="347" y="454" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">exterior</text><text x="347" y="476" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">plywood</text><text x="347" y="512" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">fixing</text><text x="347" y="536" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">two screw clamps</text><text x="347" y="558" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">grip the rail</text><text x="347" y="594" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">structure</text><text x="347" y="618" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">slotted shelf</text><rect x="599" y="340" width="250" height="316" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><circle cx="635" cy="378" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="635" y="385.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">C</text><text x="669" y="385" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Felt pockets</text><text x="619" y="430" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">material</text><text x="619" y="454" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">recycled</text><text x="619" y="476" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">PET felt</text><text x="619" y="512" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">fixing</text><text x="619" y="536" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">strap looped</text><text x="619" y="558" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">round the rail</text><text x="619" y="594" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">structure</text><text x="619" y="618" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">three stitched</text><text x="619" y="640" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">pockets</text>
</svg>