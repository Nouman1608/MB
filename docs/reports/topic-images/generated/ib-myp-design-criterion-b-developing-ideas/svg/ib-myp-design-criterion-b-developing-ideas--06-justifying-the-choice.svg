<rect width="900" height="665" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five moves in a strong justification</text>

<rect x="30" y="110" width="840" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="78" cy="154" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="78" y="162.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="122" y="147" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Choose, with the score</text><text x="122" y="176" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">B: 54 of 65, ahead of A (50) and C (43)</text><line x1="78" y1="180" x2="78" y2="210" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="212" width="840" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="78" cy="256" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="78" y="264.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="122" y="249" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Name the spec points</text><text x="122" y="278" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">clamps grip any rail 40–60 mm (spec 2)</text><line x1="78" y1="282" x2="78" y2="312" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="314" width="840" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="78" cy="358" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="78" y="366.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="122" y="351" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Compare with rejected ideas</text><text x="122" y="380" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A’s hooks suit one rail width; C’s felt sagged under 2 kg (spec 4)</text><line x1="78" y1="384" x2="78" y2="414" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="416" width="840" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="78" cy="460" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="78" y="468.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="122" y="453" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Include client feedback</text><text x="122" y="482" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Ms Adeyemi preferred B and asked for a darker stain</text><line x1="78" y1="486" x2="78" y2="516" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="518" width="840" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="78" cy="562" r="24" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="78" y="570.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="122" y="555" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Admit the weakness, plan development</text><text x="122" y="584" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">weather resistance (3) → exterior varnish, stainless screws</text><text x="450" y="638" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle">Then show development: e.g. test a clamp in card, move pot holes to spread the load.</text>
</svg>