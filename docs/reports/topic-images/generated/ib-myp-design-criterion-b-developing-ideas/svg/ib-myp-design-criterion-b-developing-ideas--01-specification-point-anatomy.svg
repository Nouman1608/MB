<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="610" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Anatomy of a specification point</text>

<text x="450" y="130" font-size="19" font-weight="600" fill="#4a5568" text-anchor="middle">Specification point 4 for the balcony planter</text><rect x="30" y="150" width="200" height="106" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="130" y="182" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Requirement</text><text x="130" y="210" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">what it must</text><text x="130" y="230" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">do or be</text><rect x="30" y="268" width="200" height="108" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="130" y="328" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Holds a load</text><rect x="243" y="150" width="200" height="106" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="343" y="182" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Measurable target</text><text x="343" y="210" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">number + unit, range</text><text x="343" y="230" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">or yes/no condition</text><rect x="243" y="268" width="200" height="108" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="343" y="316.5" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">6 kg, deflection 5</text><text x="343" y="339.5" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">mm or less</text><rect x="456" y="150" width="200" height="106" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="556" y="182" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Reason</text><text x="556" y="210" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">finding from your</text><text x="556" y="230" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Criterion A research</text><rect x="456" y="268" width="200" height="108" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="556" y="305" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">three pots of wet</text><text x="556" y="328" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">soil, plus a</text><text x="556" y="351" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">safety margin</text><rect x="669" y="150" width="200" height="106" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="769" y="182" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">How it will be tested</text><text x="769" y="210" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">the extra fourth</text><text x="769" y="230" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">column</text><rect x="669" y="268" width="200" height="108" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="769" y="316.5" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">load test with</text><text x="769" y="339.5" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">weights</text><path d="M736,380 L736,425" fill="none" stroke="#8a6d0d" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahO)"/><rect x="560" y="430" width="310" height="92" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="715" y="468" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">feeds Criterion D</text><text x="715" y="496" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">tests come straight from here</text><rect x="30" y="430" width="510" height="92" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="52" y="466" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ “It must be strong.”</text><text x="52" y="496" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">no target, so nothing can be tested</text><text x="450" y="560" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Check every category: function, user and ergonomics, size, materials, weight or load,</text><text x="450" y="584" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">safety, aesthetics, cost, sustainability and environment, time to make.</text>
</svg>