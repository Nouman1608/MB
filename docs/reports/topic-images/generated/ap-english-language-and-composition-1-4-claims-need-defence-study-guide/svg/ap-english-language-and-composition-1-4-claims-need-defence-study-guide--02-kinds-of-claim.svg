<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 585" width="900" height="585" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="585" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five kinds of claim</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The kind tells you what must be defended</text>
<rect x="30" y="122" width="250" height="92.68" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="44" y="151.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Fact or existence</text><text x="44" y="177.83" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">is,</tspan> <tspan font-style="italic">was</tspan> <tspan font-style="italic">or</tspan> <tspan font-style="italic">will</tspan> <tspan font-style="italic">be</tspan> <tspan font-style="italic">true</tspan></text><text x="44" y="197.63000000000002" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">(disputed)</tspan></text><rect x="300" y="122" width="570" height="92.68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="314" y="173.57" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Noise from the bypass has made the village measurably louder.”</text><rect x="30" y="226.68" width="250" height="72.88" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="44" y="255.88" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Definition</text><text x="44" y="282.51" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">what</tspan> <tspan font-style="italic">something</tspan> <tspan font-style="italic">counts</tspan> <tspan font-style="italic">as</tspan></text><rect x="300" y="226.68" width="570" height="72.88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="314" y="268.35" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“A library is public infrastructure, not an optional service.”</text><rect x="30" y="311.56" width="250" height="72.88" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="44" y="340.76" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Cause</text><text x="44" y="367.39" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">one</tspan> <tspan font-style="italic">thing</tspan> <tspan font-style="italic">produces</tspan> <tspan font-style="italic">another</tspan></text><rect x="300" y="311.56" width="330" height="72.88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="314" y="342.01" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Later start times improve test</text><text x="314" y="364.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">scores.”</text><rect x="650" y="311.56" width="220" height="72.88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="662" y="342.95" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Defence:</tspan> needs a causal</text><text x="662" y="362.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">link, not only a correlation</text><rect x="30" y="396.44" width="250" height="72.88" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="44" y="425.64" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Value</text><text x="44" y="452.27" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">worth</tspan> <tspan font-style="italic">or</tspan> <tspan font-style="italic">rightness</tspan></text><rect x="300" y="396.44" width="570" height="72.88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="314" y="438.10999999999996" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“It is wrong to charge children to use a public library.”</text><rect x="30" y="481.32" width="250" height="72.87999999999994" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="44" y="510.52" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Policy</text><text x="44" y="537.15" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">what</tspan> <tspan font-style="italic">should</tspan> <tspan font-style="italic">be</tspan> <tspan font-style="italic">done</tspan></text><rect x="300" y="481.32" width="330" height="72.87999999999994" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="314" y="511.7699999999999" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“The council should restore the</text><text x="314" y="534.2099999999999" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">library’s hours.”</text><rect x="650" y="481.32" width="220" height="72.87999999999994" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="662" y="512.71" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Defence:</tspan> needs a problem</text><text x="662" y="532.51" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">and a workable remedy</text>
</svg>