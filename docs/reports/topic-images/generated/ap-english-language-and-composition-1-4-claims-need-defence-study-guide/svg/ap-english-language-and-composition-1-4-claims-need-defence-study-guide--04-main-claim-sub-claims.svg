<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Main claim and sub-claims</text>

<rect x="200" y="96" width="500" height="92" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3" /><text x="450" y="133.57999999999998" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Main claim</text><text x="450" y="162.42999999999998" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">the overarching position of the whole text</text><path d="M450,190 C450,226 165,216 165,246" fill="none" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="252" width="270" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="165" y="286.24" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Sub-claim 1</text><text x="165" y="314.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">usually one per paragraph</text><path d="M450,190 C450,226 450,216 450,246" fill="none" stroke="#1e2a44" stroke-width="3"/><rect x="315" y="252" width="270" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="450" y="286.24" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Sub-claim 2</text><text x="450" y="314.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">usually one per paragraph</text><path d="M450,190 C450,226 735,216 735,246" fill="none" stroke="#1e2a44" stroke-width="3"/><rect x="600" y="252" width="270" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="735" y="286.24" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Sub-claim 3</text><text x="735" y="314.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">usually one per paragraph</text><text x="450" y="376" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">How the main claim can appear</text><rect x="30" y="394" width="264" height="125.75999999999999" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="162" y="428" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Explicit</text><text x="162" y="456" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Said in a sentence you can</text><text x="162" y="477.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">quote.</text><rect x="318" y="394" width="264" height="125.75999999999999" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" stroke-dasharray="7 5"/><text x="450" y="428" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Implicit</text><text x="450" y="456" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Deduced from evidence,</text><text x="450" y="477.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">tone and choices: summarise</text><text x="450" y="498.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">what the text argues.</text><rect x="606" y="394" width="264" height="125.75999999999999" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="738" y="428" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Built toward</text><text x="738" y="456" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Appears at the end: read the</text><text x="738" y="477.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">whole text before naming it.</text><rect x="30" y="539.76" width="840" height="54.440000000000055" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="450" y="572.21" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">Practise:</tspan> state the main claim in one sentence, then list the sub-claims.</text>
</svg>