<rect x="30" y="122" width="420" height="64" rx="32" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="240" y="161" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Does it assert anything?</text><line x1="454" y1="154" x2="520" y2="154" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="487" y="144" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">no</text><rect x="526" y="114" width="344" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="538" y="141.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Topic</text><text x="538" y="168.68" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Homework.” <tspan font-style="italic">names</tspan> <tspan font-style="italic">a</tspan> <tspan font-style="italic">subject;</tspan> <tspan font-style="italic">asserts</tspan></text><text x="538" y="189.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">nothing</tspan></text><line x1="240" y1="188" x2="240" y2="234" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="254" y="214" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">yes</text><rect x="30" y="236" width="420" height="64" rx="32" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="240" y="275" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Is it only a personal taste?</text><line x1="454" y1="268" x2="520" y2="268" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="487" y="258" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">yes</text><rect x="526" y="228" width="344" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="538" y="255.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Preference</text><text x="538" y="282.68" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“I prefer to do my homework in the</text><text x="538" y="303.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">morning.” <tspan font-style="italic">nobody</tspan> <tspan font-style="italic">can</tspan> <tspan font-style="italic">prove</tspan> <tspan font-style="italic">it</tspan> <tspan font-style="italic">wrong</tspan></text><line x1="240" y1="302" x2="240" y2="348" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="254" y="328" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">no</text><rect x="30" y="350" width="420" height="64" rx="32" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="240" y="389" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Could a reasonable person disagree?</text><line x1="454" y1="382" x2="520" y2="382" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="487" y="372" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">no</text><rect x="526" y="342" width="344" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="538" y="369.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Fact</text><text x="538" y="396.68" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“The school day currently ends at 3.30</text><text x="538" y="417.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">p.m.” <tspan font-style="italic">can</tspan> <tspan font-style="italic">be</tspan> <tspan font-style="italic">checked;</tspan> <tspan font-style="italic">not</tspan> <tspan font-style="italic">in</tspan> <tspan font-style="italic">dispute</tspan></text><line x1="240" y1="416" x2="240" y2="458" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="254" y="444" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">yes</text><rect x="30" y="464" width="840" height="107.27999999999997" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3" /><text x="48" y="498" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Claim: needs a defence</text><text x="48" y="526.85" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Homework in primary schools does more harm than good.” A teacher or parent could dispute it,</text><text x="48" y="549.2900000000001" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">so it needs evidence about learning and wellbeing.</text>
