<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 759" width="900" height="759" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="759" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Turning an obvious statement into a claim</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Worked example 2</text>
<rect x="30" y="122" width="210" height="64" rx="32" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" /><text x="135" y="161" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">Draft</text><text x="270" y="150" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic" xml:space="preserve">“Technology is changing how we learn.”</text><text x="270" y="175" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" xml:space="preserve">True but obvious: nothing to defend.</text><line x1="135" y1="188" x2="135" y2="214" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="218" width="210" height="64" rx="32" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="135" y="257" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">+ a specific technology</text><text x="270" y="246" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic" xml:space="preserve">“Tablets...”</text><text x="270" y="271" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" xml:space="preserve">adds specificity</text><line x1="135" y1="284" x2="135" y2="310" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="314" width="210" height="64" rx="32" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="135" y="353" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">+ a specific setting</text><text x="270" y="342" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic" xml:space="preserve">“...in school classrooms...”</text><text x="270" y="367" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" xml:space="preserve">narrower, supportable scope</text><line x1="135" y1="380" x2="135" y2="406" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="410" width="210" height="64" rx="32" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="135" y="449" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">+ a two-sided assertion</text><text x="270" y="438" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic" xml:space="preserve">“...improve... but weaken...”</text><text x="270" y="463" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" xml:space="preserve">a position a reader can dispute, with a built-in line of reasoning</text><rect x="30" y="510" width="840" height="112.55999999999995" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3" /><text x="48" y="544" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Result</text><text x="48" y="574.55" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Tablets in school classrooms improve pupils’ access to information but weaken their</text><text x="48" y="599.63" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">ability to read at length.”</text><rect x="30" y="638.56" width="408" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="234" y="671.8599999999999" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Ask <tspan font-weight="700">“Why?”</tspan></text><rect x="462" y="638.56" width="408" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="666" y="671.8599999999999" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Ask <tspan font-weight="700">“How</tspan> <tspan font-weight="700">do</tspan> <tspan font-weight="700">you</tspan> <tspan font-weight="700">know?”</tspan></text><text x="450" y="670.56" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">+</text><text x="450" y="716.56" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">If evidence answers both, the claim is defensible.</text>
</svg>