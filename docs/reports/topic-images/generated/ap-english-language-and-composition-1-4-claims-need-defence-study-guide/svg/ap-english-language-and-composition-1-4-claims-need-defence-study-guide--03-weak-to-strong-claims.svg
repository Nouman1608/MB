<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 592" width="900" height="592" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="592" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From weak to strong claims</text>

<rect x="30" y="96" width="199.5" height="75.52000000000001" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="129.75" y="126" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">Arguable</text><text x="129.75" y="154" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">others could disagree</text><rect x="243.5" y="96" width="199.5" height="75.52000000000001" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="343.25" y="126" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">Specific</text><text x="343.25" y="154" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">what, and for whom</text><rect x="457" y="96" width="199.5" height="75.52000000000001" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="556.75" y="126" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">Supportable</text><text x="556.75" y="154" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">evidence, not feeling</text><rect x="670.5" y="96" width="199.5" height="75.52000000000001" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="770.25" y="126" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">Significant</text><text x="770.25" y="154" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">the audience cares</text><rect x="30" y="201.52" width="300" height="87.35999999999999" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="44" y="239.68" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Social media is a big part of life</text><text x="44" y="260.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">today.”</text><rect x="420" y="201.52" width="450" height="87.35999999999999" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="434" y="229.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Social media has made teenagers better informed</text><text x="434" y="250.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">about world events but worse at sustaining attention</text><text x="434" y="271.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">on any single one.”</text><line x1="336" y1="245.2" x2="412" y2="245.2" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="30" y="308.88" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start" xml:space="preserve">Obvious; no one disagrees.</text><rect x="30" y="328.88" width="300" height="66.24000000000001" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="44" y="367.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“School lunches are important.”</text><rect x="420" y="328.88" width="450" height="66.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="434" y="356.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Free school lunches for every pupil would do more</text><text x="434" y="377.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">for attainment than reducing class sizes by two.”</text><line x1="336" y1="362" x2="412" y2="362" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="30" y="415.12" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start" xml:space="preserve">Vague and uncontroversial.</text><rect x="30" y="435.12" width="300" height="66.24000000000001" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="44" y="462.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Everyone has their own opinion</text><text x="44" y="483.84000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">about uniforms.”</text><rect x="420" y="435.12" width="450" height="66.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="434" y="462.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“School uniforms should be optional because they</text><text x="434" y="483.84000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">cost families more than they save in distraction.”</text><line x1="336" y1="468.24" x2="412" y2="468.24" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="30" y="521.36" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start" xml:space="preserve">About opinions, not a position.</text><text x="450" y="549.36" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">The stronger versions take a side, name specifics and invite the reader to ask “Why?”</text>
</svg>