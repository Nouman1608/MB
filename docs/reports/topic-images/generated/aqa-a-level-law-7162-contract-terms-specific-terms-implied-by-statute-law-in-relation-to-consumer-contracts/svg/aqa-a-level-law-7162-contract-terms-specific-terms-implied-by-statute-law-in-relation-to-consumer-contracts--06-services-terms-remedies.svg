<rect width="900" height="502" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Services: two terms and two remedies</text>

<rect x="30" y="100" width="412" height="154" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SECTION 49</text><text x="50" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Reasonable care and skill</text><text x="50" y="187.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Of a reasonably competent member of the trade:</text><text x="50" y="208.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">about <tspan font-weight="700" fill="#1e2a44">how</tspan> the work is done, not a guaranteed</text><text x="50" y="229.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">result</text><rect x="458" y="100" width="412" height="154" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SECTION 52</text><text x="478" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Performance within a reasonable time</text><text x="478" y="187.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Where no time is fixed; a question of fact.</text><text x="478" y="208.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Charnock</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Liverpool</tspan> <tspan font-style="italic">Corporation</tspan> (1968): eight</text><text x="478" y="229.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">weeks where five was reasonable</text><rect x="30" y="316" width="405" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="348" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SECTION 55</text><text x="50" y="374.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Repeat performance</text><text x="50" y="403.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">To make it conform: reasonable time, no</text><text x="50" y="424.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">significant inconvenience, at the trader’s cost.</text><text x="50" y="445.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Not if impossible</text><rect x="465" y="316" width="405" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="485" y="348" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SECTION 56</text><text x="485" y="374.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Price reduction</text><text x="485" y="403.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">If repeat performance is impossible or not done</text><text x="485" y="424.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">properly; up to the full price</text><line x1="438" y1="391" x2="462" y2="391" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="232" y1="278" x2="232" y2="310" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="244" y="300" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">breach of s49</text><line x1="668" y1="278" x2="668" y2="310" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><text x="680" y="300" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">lateness (s52): straight to s56</text>
</svg>