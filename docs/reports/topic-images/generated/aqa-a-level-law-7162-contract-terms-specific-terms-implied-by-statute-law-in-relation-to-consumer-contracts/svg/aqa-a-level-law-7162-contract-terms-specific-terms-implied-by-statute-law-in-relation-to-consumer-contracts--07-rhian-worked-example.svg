<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 567" width="900" height="567" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="567" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: Rhian’s laptop and bathroom</text>

<rect x="30" y="100" width="840" height="133" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FACTS</text><text x="50" y="164.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Rhian buys a £900 laptop, telling the assistant it is for video editing. After 40 days it overheats</text><text x="50" y="186.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">when editing; a repair fails a week later. A builder paid £2,000 tiles her bathroom unevenly and</text><text x="50" y="208.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">takes four months.</text><rect x="30" y="255" width="413" height="280" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="287" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THE LAPTOP (GOODS)</text><text x="50" y="318.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="318.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Consumer</tspan> <tspan font-weight="700" fill="#1e2a44">contract:</tspan> individual, personal use;</text><text x="65.2" y="339.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">retailer is a trader (s2)</text><text x="50" y="368.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="368.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">s9</tspan> arguably not satisfactory; <tspan font-weight="700" fill="#1e2a44">s10</tspan> purpose</text><text x="65.2" y="389.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">made known and relied on</text><text x="50" y="418.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="418.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">40</tspan> <tspan font-weight="700" fill="#1e2a44">days:</tspan> past the 30-day right, but fault within</text><text x="65.2" y="439.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">six months is presumed present (s19(14))</text><text x="50" y="468.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="468.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Remedy:</tspan> one repair failed, so s24: price</text><text x="65.2" y="489.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reduction or final rejection, no deduction for</text><text x="65.2" y="510.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">use</text><rect x="457" y="255" width="413" height="280" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="287" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THE BATHROOM (SERVICES)</text><text x="477" y="318.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="492.2" y="318.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">s49</tspan> uneven tiling: no reasonable care and skill</text><text x="477" y="347.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="492.2" y="347.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">s52</tspan> four months may be unreasonable if no</text><text x="492.2" y="368.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">time was fixed</text><text x="477" y="397.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="492.2" y="397.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">s55</tspan> re-lay the tiles at the builder’s cost; if not,</text><text x="492.2" y="418.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">s56</tspan> price reduction</text><text x="477" y="447.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="492.2" y="447.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Delay:</tspan> remedied by s56, not repeat work</text>
</svg>