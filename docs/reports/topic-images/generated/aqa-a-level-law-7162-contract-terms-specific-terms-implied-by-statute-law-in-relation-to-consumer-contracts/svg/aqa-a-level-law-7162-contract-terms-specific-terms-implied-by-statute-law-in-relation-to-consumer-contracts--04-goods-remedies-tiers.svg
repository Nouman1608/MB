<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 646" width="900" height="646" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="646" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Goods remedies: a tiered scheme</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Section 19 also keeps other remedies, such as damages</text>
<rect x="30" y="124" width="840" height="113" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TIER 1: s20 (with s22)</text><text x="50" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Short-term right to reject</text><text x="50" y="212.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Normally within 30 days; full refund, no deduction for use</text><line x1="90" y1="241" x2="170" y2="275" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="150" y="281" width="720" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="170" y="313" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TIER 2: s23</text><text x="170" y="340.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Repair or replacement</text><text x="170" y="369.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Consumer chooses; trader acts within a reasonable time, without significant</text><text x="170" y="390.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">inconvenience, at its cost; not if impossible or disproportionate</text><line x1="210" y1="419" x2="290" y2="453" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="270" y="459" width="600" height="155" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="290" y="491" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TIER 3: s24</text><text x="290" y="518.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Price reduction or final right to reject</text><text x="290" y="547.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Only after one failed repair or replacement, if both are impossible or</text><text x="290" y="568.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">disproportionate, or if not done in a reasonable time without significant</text><text x="290" y="589.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">inconvenience</text>
</svg>