<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 597" width="900" height="597" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="597" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three terms implied into every goods contract</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Automatic: need not be mentioned, cannot be excluded against a consumer</text>
<rect x="30" y="124" width="270.6666666666667" height="341" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SECTION 9</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Satisfactory quality</text><text x="50" y="211.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">What a <tspan font-weight="700" fill="#1e2a44">reasonable</tspan> <tspan font-weight="700" fill="#1e2a44">person</tspan></text><text x="65.2" y="232.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">would consider satisfactory:</text><text x="65.2" y="253.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">description, price, all</text><text x="65.2" y="274.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">circumstances</text><text x="50" y="303.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="303.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Rogers</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Parish</tspan> (1987): a</text><text x="65.2" y="324.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">new Range Rover with</text><text x="65.2" y="345.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">repairable engine, gearbox</text><text x="65.2" y="366.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and bodywork defects</text><text x="65.2" y="387.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">failed</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="341" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334.6666666666667" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SECTION 10</text><text x="334.6666666666667" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Fit for a particular</text><text x="334.6666666666667" y="206.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">purpose</text><text x="334.6666666666667" y="235.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="349.8666666666667" y="235.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Purpose made known,</text><text x="349.8666666666667" y="256.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">expressly or by implication;</text><text x="349.8666666666667" y="277.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">consumer relies on the</text><text x="349.8666666666667" y="298.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">trader</text><text x="334.6666666666667" y="327.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="349.8666666666667" y="327.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Priest</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Last</tspan> (1903): one</text><text x="349.8666666666667" y="348.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">normal purpose, made</text><text x="349.8666666666667" y="369.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">known by buying</text><text x="334.6666666666667" y="398.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="349.8666666666667" y="398.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Griffiths</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Peter</tspan> <tspan font-style="italic">Conway</tspan></text><text x="349.8666666666667" y="419.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1939): sensitive skin not</text><text x="349.8666666666667" y="440.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">disclosed; failed</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="341" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="619.3333333333334" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SECTION 11</text><text x="619.3333333333334" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Matches the description</text><text x="619.3333333333334" y="211.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="634.5333333333334" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Packaging, labels, listings,</text><text x="634.5333333333334" y="232.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">what the trader says</text><text x="619.3333333333334" y="261.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="634.5333333333334" y="261.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Beale</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Taylor</tspan> (1967): “1961</text><text x="634.5333333333334" y="282.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Triumph Herald” was two</text><text x="634.5333333333334" y="303.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cars welded together;</text><text x="634.5333333333334" y="324.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">recovered though he had</text><text x="634.5333333333334" y="345.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">seen it</text><rect x="30" y="487" width="840" height="78" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="519.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-style="italic">Grant</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Australian</tspan> <tspan font-style="italic">Knitting</tspan> <tspan font-style="italic">Mills</tspan> (1936): underwear with excess sulphite harmed a buyer with normal skin:</text><text x="450" y="540.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700" fill="#1e2a44">neither</tspan> of satisfactory quality <tspan font-weight="700" fill="#1e2a44">nor</tspan> fit for purpose.</text>
</svg>