<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 513" width="900" height="513" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="513" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three time rules that score marks</text>

<line x1="60" y1="130" x2="60" y2="238" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray=""/><text x="60" y="122" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">delivery</text><line x1="290" y1="130" x2="290" y2="238" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="6 5"/><text x="290" y="122" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">30 days</text><line x1="760" y1="130" x2="760" y2="238" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="6 5"/><text x="760" y="122" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">6 months</text><rect x="60" y="140" width="230" height="34" rx="6" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="175" y="163" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">short-term right to reject</text><rect x="60" y="184" width="700" height="34" rx="6" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="410" y="207" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">a fault that appears is presumed present on delivery (s19(14), (15))</text><line x1="60" y1="228" x2="840" y2="228" stroke="#1e2a44" stroke-width="4"/><text x="840" y="260" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">not to scale</text><rect x="30" y="286" width="270.6666666666667" height="195" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="318" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WAITING TIME</text><text x="50" y="344.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The 30-day clock stops</text><text x="50" y="372.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">while a repair or replacement</text><text x="50" y="393.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">asked for within the 30 days</text><text x="50" y="414.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">is awaited; if fewer than</text><text x="50" y="435.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">seven days are left, it extends</text><text x="50" y="456.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">to seven</text><rect x="314.6666666666667" y="286" width="270.6666666666667" height="195" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334.6666666666667" y="318" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SIX-MONTH PRESUMPTION</text><text x="334.6666666666667" y="344.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Fault within six months</text><text x="334.6666666666667" y="372.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">presumed to have existed on</text><text x="334.6666666666667" y="393.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">delivery unless the trader</text><text x="334.6666666666667" y="414.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">proves otherwise</text><rect x="599.3333333333334" y="286" width="270.6666666666667" height="195" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="619.3333333333334" y="318" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DEDUCTION FOR USE</text><text x="619.3333333333334" y="344.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Final right to reject</text><text x="619.3333333333334" y="372.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">refund may be reduced for</text><text x="619.3333333333334" y="393.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">use, but not within six months</text><text x="619.3333333333334" y="414.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">of delivery (except motor</text><text x="619.3333333333334" y="435.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">vehicles)</text>
</svg>