<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 446" width="900" height="446" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="446" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Step 0: is this a consumer contract?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The implied terms apply only between a trader and a consumer</text>
<rect x="30" y="124" width="395" height="157" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="157" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TRADER: s2(2)</text><text x="50" y="183.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Acting for purposes relating to their</text><text x="50" y="206.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">trade, business, craft or profession</text><text x="50" y="234.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Personally or through someone acting in their</text><text x="50" y="255.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">name</text><rect x="475" y="124" width="395" height="157" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="495" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONSUMER: s2(3)</text><text x="495" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">An individual acting wholly or mainly</text><text x="495" y="205.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">outside their trade, business, craft or</text><text x="495" y="228.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">profession</text><text x="495" y="256.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A company can never be a consumer</text><circle cx="450" cy="202.5" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="208.98" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><rect x="30" y="303" width="201" height="111" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="329" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COVERED</text><text x="44" y="354.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Self-employed</text><text x="44" y="375.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">plumber buys a</text><text x="44" y="396.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">kettle for home use</text><rect x="243" y="303" width="201" height="111" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="257" y="329" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">NOT COVERED</text><text x="257" y="354.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">The same plumber</text><text x="257" y="375.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">buys a pipe cutter</text><text x="257" y="396.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">for work</text><rect x="456" y="303" width="201" height="111" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="470" y="339.5" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">NOT COVERED</text><text x="470" y="364.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">A contract between</text><text x="470" y="385.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">two businesses</text><rect x="669" y="303" width="201" height="111" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="683" y="329" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">NOT COVERED</text><text x="683" y="354.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">A private sale</text><text x="683" y="375.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">between two</text><text x="683" y="396.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">individuals</text>
</svg>