<rect width="900" height="535" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Section 9: what counts, and what is excluded</text>

<text x="450" y="114" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">ASPECTS OF QUALITY: s9(3)</text><rect x="80.90650000000005" y="140" width="201.497" height="31" rx="15.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="181.65500000000006" y="161.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">fit for usual purposes</text><rect x="292.40350000000007" y="140" width="208.739" height="31" rx="15.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="396.7730000000001" y="161.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">appearance and finish</text><rect x="511.14250000000004" y="140" width="221.2" height="31" rx="15.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="621.7425000000001" y="161.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">free from minor defects</text><rect x="742.3425" y="140" width="76.751" height="31" rx="15.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="780.718" y="161.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">safety</text><rect x="398.45799999999997" y="181" width="103.084" height="31" rx="15.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="450" y="202.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">durability</text><rect x="30" y="234" width="840" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="266.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Objective and flexible: a cheap second-hand car need not match a new one. Public statements such as</text><text x="450" y="287.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">advertising or labelling can be relevant (s9(5) to (7)).</text><text x="450" y="348" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">NOT COVERED: s9(4)</text><rect x="30" y="374" width="270.6666666666667" height="129" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="408.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Drawn to attention</text><text x="50" y="436.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A defect specifically pointed</text><text x="50" y="457.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">out before the contract</text><rect x="314.6666666666667" y="374" width="270.6666666666667" height="129" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="334.6666666666667" y="408.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Examined first</text><text x="334.6666666666667" y="436.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A defect the consumer’s</text><text x="334.6666666666667" y="457.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">examination ought to have</text><text x="334.6666666666667" y="478.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">revealed</text><rect x="599.3333333333334" y="374" width="270.6666666666667" height="129" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="619.3333333333334" y="408.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sale by sample</text><text x="619.3333333333334" y="436.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A defect a reasonable</text><text x="619.3333333333334" y="457.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">examination of the sample</text><text x="619.3333333333334" y="478.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">would have revealed</text>
</svg>