<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" width="900" height="510" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="510" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Defences to trespass to land</text>

<rect x="30" y="110" width="411" height="177" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DEFENCE</text><text x="50" y="170.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Licence</text><text x="50" y="198" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">permission to enter, express or implied, e.g. walking</text><text x="50" y="218" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">up a path to knock on a door</text><text x="50" y="243" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">lost if exceeded (<tspan font-style="italic">The Calgarth</tspan>) or revoked (<tspan font-style="italic">Robson</tspan></text><text x="50" y="263" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">v Hallett</tspan>)</text><rect x="459" y="110" width="411" height="177" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DEFENCE</text><text x="479" y="170.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Lawful authority</text><text x="479" y="198" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">a legal power to enter, e.g. police powers under</text><text x="479" y="218" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">PACE 1984</text><text x="479" y="243" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">without it even officials trespass: <tspan font-style="italic">Entick v</tspan></text><text x="479" y="263" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Carrington</tspan> (1765)</text><rect x="30" y="303" width="411" height="177" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="336" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DEFENCE</text><text x="50" y="363.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Statutory access</text><text x="50" y="391" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">statutes giving rights to enter</text><text x="50" y="416" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Access to Neighbouring Land Act 1992, for</text><text x="50" y="436" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">necessary repairs</text><rect x="459" y="303" width="411" height="177" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="336" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DEFENCE</text><text x="479" y="363.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Necessity</text><text x="479" y="391" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">entry to prevent a serious, imminent danger</text><text x="479" y="416" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Rigby v Chief Constable of Northamptonshire</tspan></text><text x="479" y="436" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">[1985]: canister fired to flush out a gunman; not</text><text x="479" y="456" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">trespass, but liable in negligence for the fire</text>
</svg>