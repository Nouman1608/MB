<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 744" width="900" height="744" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="744" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: Femi, Gita and the builder</text>

<rect x="30" y="110" width="840" height="102" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="143.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Femi leaves scaffolding resting against his neighbour Gita’s wall; his crane swings over her garden</text><text x="50" y="165.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">each day. When she complains, his builder walks into her garden to inspect the wall and refuses to</text><text x="50" y="187.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">leave when told to.</text><rect x="30" y="232" width="128" height="78" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="94" y="277" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Scaffolding</text><rect x="170" y="232" width="520" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="190" y="264.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">object placed against her wall: entry; left there: continuing</text><text x="190" y="285.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">trespass, a fresh claim daily</text><rect x="702" y="232" width="168" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="786" y="267" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-style="italic">Westripp</tspan>; <tspan font-style="italic">Holmes v</tspan></text><text x="786" y="287" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-style="italic">Wilson</tspan></text><rect x="30" y="320" width="128" height="60" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="94" y="356" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Crane</text><rect x="170" y="320" width="520" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="190" y="354.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">airspace at a height needed for ordinary use</text><rect x="702" y="320" width="168" height="60" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="786" y="356" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-style="italic">Anchor Brewhouse</tspan></text><rect x="30" y="390" width="128" height="78" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="94" y="435" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Builder</text><rect x="170" y="390" width="520" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="190" y="422.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">any implied permission ended when told to leave; after a</text><text x="190" y="443.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reasonable time to go, trespass</text><rect x="702" y="390" width="168" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="786" y="435" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-style="italic">Robson v Hallett</tspan></text><rect x="30" y="478" width="128" height="60" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="94" y="514" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Damage?</text><rect x="170" y="478" width="700" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="190" y="512.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">none needed: actionable per se</text><rect x="30" y="548" width="128" height="78" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="94" y="593" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Remedies</text><rect x="170" y="548" width="700" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="190" y="580.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">injunction to remove scaffolding and stop the crane; damages, at least nominal;</text><text x="190" y="601.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reasonable force to remove the builder after a request</text><rect x="30" y="636" width="128" height="78" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="94" y="681" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Defence?</text><rect x="170" y="636" width="700" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="190" y="668.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Femi could apply under the Access to Neighbouring Land Act 1992 if access is</text><text x="190" y="689.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">genuinely needed</text>
</svg>