<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 525" width="900" height="525" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="525" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Remedies for trespass to land</text>

<rect x="30" y="110" width="411" height="221" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DAMAGES</text><text x="50" y="169.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Nominal or compensatory</text><text x="50" y="197" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="64.25" y="197" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">nominal where there is no loss: actionable per se</text><text x="50" y="222" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="64.25" y="222" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">otherwise harm to the land or the value of the use</text><text x="64.25" y="242" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">made of it</text><text x="50" y="267" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="64.25" y="267" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Bocardo</tspan>: a modest sum, no harm caused</text><rect x="459" y="110" width="411" height="221" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="143" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">INJUNCTION</text><text x="479" y="169.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Prohibitory or mandatory</text><text x="479" y="197" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="493.25" y="197" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">prohibitory: stops future trespass (<tspan font-style="italic">Anchor</tspan></text><text x="493.25" y="217" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Brewhouse</tspan>)</text><text x="479" y="242" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="493.25" y="242" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">mandatory: remove what was left (<tspan font-style="italic">Kelsen</tspan>: the</text><text x="493.25" y="262" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">sign came down)</text><text x="479" y="287" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="493.25" y="287" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">damages in lieu if an injunction would be</text><text x="493.25" y="307" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">oppressive: <tspan font-style="italic">Jaggard v Sawyer</tspan> [1995]</text><rect x="30" y="347" width="268" height="148" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="380" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SELF-HELP</text><text x="50" y="404.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Ask, then reasonable force</text><text x="50" y="431" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">no more than necessary: <tspan font-style="italic">Collins</tspan></text><text x="50" y="451" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">v Renison</tspan> (1754), throwing a</text><text x="50" y="471" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">man off a ladder was excessive</text><rect x="316" y="347" width="268" height="148" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="336" y="380" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RE-ENTRY</text><text x="336" y="404.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Peaceful re-entry or a</text><text x="336" y="425.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">possession order</text><text x="336" y="452" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">for a person dispossessed</text><rect x="602" y="347" width="268" height="148" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="622" y="380" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">CRIMINAL LAW</text><text x="622" y="404.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Some forms are crimes</text><text x="622" y="431" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">aggravated trespass (CJPOA</text><text x="622" y="451" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">1994); squatting in a residential</text><text x="622" y="471" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">building (LASPO 2012)</text>
</svg>