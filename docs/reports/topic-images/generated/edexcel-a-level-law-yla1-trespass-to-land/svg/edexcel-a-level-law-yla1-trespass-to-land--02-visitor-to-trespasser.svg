<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 598" width="900" height="598" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="598" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">When a visitor becomes a trespasser</text>

<rect x="30" y="110" width="411" height="151" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="143" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">EXCEEDING PERMISSION</text><text x="50" y="169.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">The Calgarth</tspan> [1927]</text><text x="50" y="197" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">"When you invite a person into your house to use</text><text x="50" y="217" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">the staircase, you do not invite him to slide down</text><text x="50" y="237" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">the banisters."</text><rect x="459" y="110" width="411" height="151" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="143" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">REMAINING AFTER PERMISSION ENDS</text><text x="479" y="169.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Robson v Hallett</tspan> [1967]</text><text x="479" y="197" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">once told to leave, a reasonable time to go; staying</text><text x="479" y="217" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">longer is trespass</text><rect x="30" y="285" width="840" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="80" y="331" width="296" height="28" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><rect x="376" y="331" width="185" height="28" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><rect x="561" y="331" width="259" height="28" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="228" y="321" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">licence: lawful visitor</text><text x="468.5" y="321" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">reasonable time to leave</text><text x="690.5" y="321" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">trespasser</text><path d="M376,365 l0,14" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="376" y="395" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">told to leave</text><text x="450" y="425" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">THE HIGHWAY: PASS, REPASS AND OTHER REASONABLE PURPOSES</text><rect x="30" y="439" width="268" height="129" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="472" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">TRESPASS</text><text x="50" y="496.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Harrison v Duke of Rutland</tspan></text><text x="50" y="517.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">[1893]</text><text x="50" y="544" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">disrupting grouse shooting</text><rect x="316" y="439" width="268" height="129" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="336" y="472" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">TRESPASS</text><text x="336" y="496.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Hickman v Maisey</tspan> [1900]</text><text x="336" y="523" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">watching racehorse trials from</text><text x="336" y="543" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">the road</text><rect x="602" y="439" width="268" height="129" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="622" y="472" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">REASONABLE USE</text><text x="622" y="496.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">DPP v Jones</tspan> [1999]</text><text x="622" y="523" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">peaceful, non-obstructive</text><text x="622" y="543" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">assembly</text>
</svg>