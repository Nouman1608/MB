<rect width="900" height="539" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Continuing trespass</text>

<rect x="30" y="110" width="840" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="144.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A trespass that persists gives a fresh cause of action every day</text><text x="50" y="172.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Holmes v Wilson</tspan> (1839): buttresses supporting a road built on the claimant’s land; paying damages once</text><text x="50" y="193.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">did not stop a later action while they remained.</text><line x1="80" y1="300" x2="820" y2="300" stroke="#1e2a44" stroke-width="3"/><rect x="80" y="250" width="740" height="24" rx="6" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><text x="80" y="240" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">object or structure left on the land</text><line x1="120" y1="292" x2="120" y2="308" stroke="#1e2a44" stroke-width="2.5"/><circle cx="120" cy="336" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="341.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">£</text><text x="120" y="374" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">day 1</text><line x1="230" y1="292" x2="230" y2="308" stroke="#1e2a44" stroke-width="2.5"/><circle cx="230" cy="336" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="230" y="341.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">£</text><text x="230" y="374" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">day 2</text><line x1="340" y1="292" x2="340" y2="308" stroke="#1e2a44" stroke-width="2.5"/><circle cx="340" cy="336" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="340" y="341.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">£</text><text x="340" y="374" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">day 3</text><line x1="450" y1="292" x2="450" y2="308" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="336" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="341.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">£</text><text x="450" y="374" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">day 4</text><line x1="560" y1="292" x2="560" y2="308" stroke="#1e2a44" stroke-width="2.5"/><circle cx="560" cy="336" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="560" y="341.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">£</text><text x="560" y="374" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">day 5</text><line x1="670" y1="292" x2="670" y2="308" stroke="#1e2a44" stroke-width="2.5"/><circle cx="670" cy="336" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="670" y="341.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">£</text><text x="670" y="374" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">day 6</text><line x1="780" y1="292" x2="780" y2="308" stroke="#1e2a44" stroke-width="2.5"/><circle cx="780" cy="336" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="780" y="341.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">£</text><text x="780" y="374" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">day 7</text><text x="450" y="402" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">a new claim each day</text><rect x="30" y="424" width="411" height="85" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="457" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TIME LIMITS</text><text x="50" y="483.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Each day starts a new claim</text><rect x="459" y="424" width="411" height="85" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="457" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">REMEDIES</text><text x="479" y="483.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">An injunction to remove the object</text>
</svg>