<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 612" width="900" height="612" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="612" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Intentional and direct interference</text>

<rect x="90" y="112" width="420" height="56" rx="28" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="300" y="146" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Did D intend to enter the land?</text><line x1="510" y1="140" x2="600" y2="140" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><text x="555" y="128" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">no</text><rect x="606" y="112" width="264" height="124" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="626" y="144.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Involuntary entry: not</text><text x="626" y="165.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">trespass</text><text x="626" y="192" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Smith v Stone</tspan> (1647): carried</text><text x="626" y="212" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">on by others; they were liable</text><line x1="300" y1="170" x2="300" y2="236" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><text x="320" y="208" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">yes</text><rect x="30" y="240" width="540" height="123" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="272.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Intention to enter is enough: a mistake is no defence</text><text x="50" y="299" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Basely v Clarkson</tspan> (1681): mowed grass beyond his boundary,</text><text x="50" y="319" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">believing it his own. Also animals under control: <tspan font-style="italic">League Against Cruel</tspan></text><text x="50" y="339" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Sports v Scott</tspan> [1986].</text><line x1="300" y1="367" x2="300" y2="396" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="90" y="398" width="420" height="56" rx="28" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="300" y="432" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Was the interference direct?</text><line x1="300" y1="456" x2="300" y2="512" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><text x="320" y="490" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">yes: a physical act</text><rect x="120" y="518" width="360" height="64" rx="14" fill="#2e6b62" stroke="#2e6b62" stroke-width="2.5"/><text x="300" y="548" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Trespass</text><text x="300" y="570" font-size="15" font-weight="400" fill="#b5d3cf" text-anchor="middle">actionable per se: no damage needed</text><line x1="510" y1="426" x2="600" y2="426" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/><text x="555" y="414" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">no</text><rect x="606" y="380" width="264" height="123" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="626" y="412.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Nuisance, not trespass</text><text x="626" y="439" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">tree roots, smells, noise,</text><text x="626" y="459" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">seeping water; nuisance</text><text x="626" y="479" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">requires proof of damage</text>
</svg>