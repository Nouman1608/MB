<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 715" width="900" height="715" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="715" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Which form suits which situation?</text>

<text x="195" y="128" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">Situation</text><text x="655" y="128" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">Suitable form and reason</text><rect x="30" y="145" width="330" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="187" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A plumber starting alone with</text><text x="50" y="209" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">little capital</text><line x1="370" y1="194" x2="428" y2="194" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="440" y="145" width="430" height="98" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="460" y="179" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Sole trader</text><text x="460" y="207" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cheap, quick, full control; low liability risk</text><text x="460" y="228" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">for a small service business</text><rect x="30" y="257" width="330" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="312" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Two architects combining skills</text><line x1="370" y1="306" x2="428" y2="306" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="440" y="257" width="430" height="98" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="460" y="291" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Partnership</text><text x="460" y="319" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Shared capital and expertise; an agreement</text><text x="460" y="340" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sets out profit shares</text><rect x="30" y="369" width="330" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="411" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Fifty fishermen wanting a shared</text><text x="50" y="433" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">cold store and better prices</text><line x1="370" y1="418" x2="428" y2="418" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="440" y="369" width="430" height="98" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="460" y="403" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Cooperative</text><text x="460" y="431" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Members share costs and gain bargaining power,</text><text x="460" y="452" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">one vote each</text><rect x="30" y="481" width="330" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="523" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A family bakery opening a third</text><text x="50" y="545" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">shop and borrowing heavily</text><line x1="370" y1="530" x2="428" y2="530" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="440" y="481" width="430" height="98" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="460" y="515" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Private limited company</text><text x="460" y="543" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Limited liability protects family homes;</text><text x="460" y="564" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">family keeps the shares</text><rect x="30" y="593" width="330" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="635" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">An airline needing very large</text><text x="50" y="657" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">sums for new aircraft</text><line x1="370" y1="642" x2="428" y2="642" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="440" y="593" width="430" height="98" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="460" y="627" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Public limited company</text><text x="460" y="655" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Can raise large amounts by selling shares to</text><text x="460" y="676" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the public</text>
</svg>