<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 725" width="900" height="725" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="725" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The five private sector forms</text>

<rect x="30" y="110" width="840" height="94" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="164" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Sole trader</text><text x="262" y="146" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">One owner</text><text x="262" y="173" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Capital from the owner’s savings and</text><text x="262" y="194" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">borrowing</text><rect x="645" y="127" width="205" height="60" rx="12" fill="#f3d9c8" stroke="#b5602e" stroke-width="2.5"/><text x="747.5" y="162.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Unlimited liability</text><rect x="30" y="216" width="840" height="94" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="270" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Partnership</text><text x="262" y="252" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Two or more partners</text><text x="262" y="279" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Agreement sets out each partner’s share</text><rect x="645" y="233" width="205" height="60" rx="12" fill="#f3d9c8" stroke="#b5602e" stroke-width="2.5"/><text x="747.5" y="258.1" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Unlimited liability</text><text x="747.5" y="279.1" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">(ordinary partnership)</text><rect x="30" y="322" width="840" height="94" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="376" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Cooperative</text><text x="262" y="358" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Members (customers, workers, producers)</text><text x="262" y="385" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Profits shared among members or</text><text x="262" y="406" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reinvested</text><rect x="645" y="339" width="205" height="60" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="747.5" y="374.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">One member, one vote</text><rect x="30" y="428" width="840" height="94" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="468" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Private limited</text><text x="52" y="494" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">company</text><text x="262" y="464" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Shareholders, usually family or friends</text><text x="262" y="491" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Shares cannot be offered to the public</text><rect x="645" y="445" width="205" height="60" rx="12" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="747.5" y="480.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Limited liability</text><rect x="30" y="534" width="840" height="94" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="574" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Public limited</text><text x="52" y="600" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">company</text><text x="262" y="570" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Shareholders from the public</text><text x="262" y="597" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Shares sold to the public, usually on a</text><text x="262" y="618" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">stock exchange</text><rect x="645" y="551" width="205" height="60" rx="12" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="747.5" y="586.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Limited liability</text><text x="450" y="668" font-size="17" font-weight="600" fill="#b5602e" text-anchor="middle">Unlimited: personal possessions can be used to pay business debts.</text><text x="450" y="698" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle">Limited: shareholders can lose only what they invested.</text>
</svg>