<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="690" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How a franchise works</text>

<rect x="30" y="120" width="240" height="90" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="150" y="159.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Franchisor</text><text x="150" y="181.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">owns the brand and model</text><rect x="630" y="120" width="240" height="90" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="750" y="159.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Franchisee</text><text x="750" y="181.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">owns and runs the outlet</text><line x1="282" y1="150" x2="618" y2="150" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="450" y="116" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">brand, products or recipes,</text><text x="450" y="135" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">training and national advertising</text><line x1="618" y1="186" x2="282" y2="186" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><text x="450" y="218" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="middle">initial fee + royalty (share of revenue)</text><text x="450" y="262" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">The franchisee must follow the franchisor’s rules on layout, prices and suppliers.</text><text x="357.5" y="322" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Advantages</text><text x="702.5" y="322" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">Disadvantages</text><rect x="30" y="338" width="150" height="150" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="105" y="419.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Franchisee</text><rect x="190" y="338" width="335" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="220" cy="370.4" r="12" fill="#2e6b62"/><path d="M214.6,370.64 L218.8,374.96 L226,366.2" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="240" y="376" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lower risk with a known brand</text><circle cx="220" cy="401.4" r="12" fill="#2e6b62"/><path d="M214.6,401.64 L218.8,405.96 L226,397.2" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="240" y="407" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Training and support</text><circle cx="220" cy="432.4" r="12" fill="#2e6b62"/><path d="M214.6,432.64 L218.8,436.96 L226,428.2" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="240" y="438" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">National advertising</text><rect x="535" y="338" width="335" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="565" cy="370.4" r="12" fill="#b5602e"/><path d="M560.44,365.84 L569.56,374.96 M569.56,365.84 L560.44,374.96" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="585" y="376" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Initial fee and royalties</text><circle cx="565" cy="401.4" r="12" fill="#b5602e"/><path d="M560.44,396.84 L569.56,405.96 M569.56,396.84 L560.44,405.96" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="585" y="407" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Little freedom over products or</text><text x="585" y="428" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">prices</text><circle cx="565" cy="453.4" r="12" fill="#b5602e"/><path d="M560.44,448.84 L569.56,457.96 M569.56,448.84 L560.44,457.96" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="585" y="459" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Agreement may not be renewed</text><rect x="30" y="503" width="150" height="150" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="105" y="584.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Franchisor</text><rect x="190" y="503" width="335" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="220" cy="535.4" r="12" fill="#2e6b62"/><path d="M214.6,535.64 L218.8,539.9599999999999 L226,531.1999999999999" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="240" y="541" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rapid growth using franchisees’</text><text x="240" y="562" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">capital</text><circle cx="220" cy="587.4" r="12" fill="#2e6b62"/><path d="M214.6,587.64 L218.8,591.9599999999999 L226,583.1999999999999" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="240" y="593" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Income from fees and royalties</text><rect x="535" y="503" width="335" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="565" cy="535.4" r="12" fill="#b5602e"/><path d="M560.44,530.84 L569.56,539.9599999999999 M569.56,530.84 L560.44,539.9599999999999" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="585" y="541" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Less direct control</text><circle cx="565" cy="566.4" r="12" fill="#b5602e"/><path d="M560.44,561.84 L569.56,570.9599999999999 M569.56,561.84 L560.44,570.9599999999999" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="585" y="572" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">One poor franchisee can damage</text><text x="585" y="593" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the brand</text><circle cx="565" cy="618.4" r="12" fill="#b5602e"/><path d="M560.44,613.84 L569.56,622.9599999999999 M569.56,613.84 L560.44,622.9599999999999" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="585" y="624" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Shares profit</text>
</svg>