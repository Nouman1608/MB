<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="660" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why governments run public corporations</text>

<rect x="310" y="280" width="280" height="180" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="450" y="322" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Public corporation</text><text x="450" y="354" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Owned by the government</text><text x="450" y="380" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Run by a board the</text><text x="450" y="406" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">government appoints</text><text x="450" y="432" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Reports to a minister</text><rect x="30" y="110" width="260" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Essential services</text><text x="48" y="175" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Water, electricity or post</text><text x="48" y="196" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">for everyone at an</text><text x="48" y="217" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">affordable price</text><rect x="30" y="295" width="260" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="331" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Avoid waste</text><text x="48" y="360" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Activities wasteful to</text><text x="48" y="381" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">duplicate, such as a</text><text x="48" y="402" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">national rail network</text><rect x="30" y="480" width="260" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="516" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Loss-making areas</text><text x="48" y="545" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Services where private</text><text x="48" y="566" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">firms would make a loss,</text><text x="48" y="587" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">e.g. remote rural areas</text><rect x="610" y="110" width="260" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="628" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Strategic or security</text><text x="628" y="171" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">reasons</text><text x="628" y="200" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Such as control of energy</text><text x="628" y="221" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">supply</text><rect x="610" y="295" width="260" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="628" y="331" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Protect jobs</text><text x="628" y="360" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">In an important industry</text><text x="628" y="381" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">that might otherwise close</text><rect x="610" y="480" width="260" height="150" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="628" y="530" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Aim: serve the public</text><text x="628" y="555" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">rather than maximise</text><text x="628" y="580" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">profit</text><line x1="290" y1="220" x2="335" y2="273" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="290" y1="370" x2="302" y2="370" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="290" y1="520" x2="335" y2="467" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="610" y1="220" x2="565" y2="273" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="610" y1="370" x2="598" y2="370" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/>
</svg>