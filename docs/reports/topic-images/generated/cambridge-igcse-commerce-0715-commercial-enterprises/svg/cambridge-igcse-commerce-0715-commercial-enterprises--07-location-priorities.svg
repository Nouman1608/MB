<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="560" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Same factors, different priorities</text>

<rect x="30" y="110" width="270" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165" y="155" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Cement works</text><text x="165" y="212" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Puts first:</text><rect x="60" y="230" width="210" height="42" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="165" y="256.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Raw materials</text><rect x="60" y="284" width="210" height="42" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="165" y="310.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Transport</text><line x1="54" y1="402" x2="276" y2="402" stroke="#c9d6d4" stroke-width="2"/><text x="165" y="434" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">Limestone is heavy and</text><text x="165" y="455" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">costly to move.</text><rect x="315" y="110" width="270" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="155" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Hair salon</text><text x="450" y="212" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Puts first:</text><rect x="345" y="230" width="210" height="42" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="256.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Markets</text><rect x="345" y="284" width="210" height="42" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="310.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Competition</text><line x1="339" y1="402" x2="561" y2="402" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="434" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">Customers visit in person.</text><rect x="600" y="110" width="270" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="735" y="143" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Online clothing</text><text x="735" y="171" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">retailer</text><text x="735" y="212" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Puts first:</text><rect x="630" y="230" width="210" height="42" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="735" y="256.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Warehousing</text><rect x="630" y="284" width="210" height="42" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="735" y="310.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Logistics</text><rect x="630" y="338" width="210" height="42" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="735" y="364.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Wi-fi</text><line x1="624" y1="402" x2="846" y2="402" stroke="#c9d6d4" stroke-width="2"/><text x="735" y="434" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">It delivers, so nearness to</text><text x="735" y="455" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">customers matters less.</text><text x="450" y="530" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Physical businesses weigh nine factors; ecommerce businesses weigh four.</text>
</svg>