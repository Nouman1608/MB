<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="720" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How a multinational company works</text>

<rect x="30" y="110" width="380" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Why MNCs exist</text><circle cx="62" cy="180.05" r="5" fill="#2e6b62"/><text x="86" y="186" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Reach new markets abroad</text><circle cx="62" cy="214.05" r="5" fill="#2e6b62"/><text x="86" y="220" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Lower costs: cheaper labour, land</text><text x="86" y="242" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">or energy</text><circle cx="62" cy="270.05" r="5" fill="#2e6b62"/><text x="86" y="276" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Be close to raw materials</text><circle cx="62" cy="304.05" r="5" fill="#2e6b62"/><text x="86" y="310" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Avoid trade barriers such as</text><text x="86" y="332" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">tariffs</text><circle cx="62" cy="360.05" r="5" fill="#2e6b62"/><text x="86" y="366" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Spread risk across economies</text><rect x="545" y="115" width="230" height="56" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="660" y="138.1" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Headquarters</text><text x="660" y="159.1" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">in the home country</text><rect x="435" y="225" width="420" height="130" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" stroke-dasharray="9 7"/><text x="645" y="340" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">Operations in other (host) countries</text><rect x="455" y="258" width="115" height="46" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="512.5" y="286.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Factory</text><line x1="660" y1="171" x2="512" y2="254" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="585" y="258" width="115" height="46" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="642.5" y="286.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Outlet</text><line x1="660" y1="171" x2="642" y2="254" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="715" y="258" width="115" height="46" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="772.5" y="286.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Factory</text><line x1="660" y1="171" x2="772" y2="254" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><path d="M832,281 C888,272 885,150 782,143" fill="none" stroke="#b5602e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ahR)" stroke-dasharray="8 6"/><line x1="600" y1="385" x2="650" y2="385" stroke="#b5602e" stroke-width="3" stroke-dasharray="8 6"/><text x="662" y="391" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">profits may be sent home</text><rect x="30" y="425" width="410" height="265" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="462" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Positive for the host country</text><circle cx="66" cy="494.05" r="12" fill="#2e6b62"/><path d="M60.6,494.29 L64.8,498.61 L72,489.85" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="86" y="500" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Creates jobs and trains workers</text><circle cx="66" cy="530.05" r="12" fill="#2e6b62"/><path d="M60.6,530.29 L64.8,534.6099999999999 L72,525.8499999999999" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="86" y="536" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Brings investment and new technology</text><circle cx="66" cy="566.05" r="12" fill="#2e6b62"/><path d="M60.6,566.29 L64.8,570.6099999999999 L72,561.8499999999999" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="86" y="572" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Raises export earnings and tax</text><text x="86" y="594" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">revenue</text><circle cx="66" cy="624.05" r="12" fill="#2e6b62"/><path d="M60.6,624.29 L64.8,628.6099999999999 L72,619.8499999999999" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="86" y="630" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Improves roads and power supply</text><rect x="460" y="425" width="410" height="265" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="484" y="462" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Negative for the host country</text><circle cx="496" cy="494.05" r="12" fill="#b5602e"/><path d="M491.44,489.49 L500.56,498.61 M500.56,489.49 L491.44,498.61" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="516" y="500" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Profits may be sent to the home</text><text x="516" y="522" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">country</text><circle cx="496" cy="552.05" r="12" fill="#b5602e"/><path d="M491.44,547.49 L500.56,556.6099999999999 M500.56,547.49 L491.44,556.6099999999999" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="516" y="558" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Local firms may be forced out</text><circle cx="496" cy="588.05" r="12" fill="#b5602e"/><path d="M491.44,583.49 L500.56,592.6099999999999 M500.56,583.49 L491.44,592.6099999999999" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="516" y="594" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">May pay low wages or use resources</text><text x="516" y="616" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">unsustainably</text><circle cx="496" cy="646.05" r="12" fill="#b5602e"/><path d="M491.44,641.49 L500.56,650.6099999999999 M500.56,641.49 L491.44,650.6099999999999" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="516" y="652" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Can influence government; may leave</text><text x="516" y="674" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">suddenly</text>
</svg>