<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 730" width="900" height="730" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="730" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Private sector or public sector?</text>

<rect x="30" y="110" width="410" height="440" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="150" font-size="25" font-weight="700" fill="#1e2a44" text-anchor="start">Private sector</text><text x="54" y="182" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Owned by individuals, partners, members</text><text x="54" y="204" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">or shareholders</text><text x="54" y="240" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Aim: usually to make a profit</text><rect x="54" y="268" width="362" height="40" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="235" y="293.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Sole trader</text><rect x="54" y="320" width="362" height="40" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="235" y="345.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Partnership</text><rect x="54" y="372" width="362" height="40" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="235" y="397.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Cooperative</text><rect x="54" y="424" width="362" height="40" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="235" y="449.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Private limited company</text><rect x="54" y="476" width="362" height="40" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="235" y="501.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Public limited company</text><rect x="460" y="110" width="410" height="440" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="484" y="150" font-size="25" font-weight="700" fill="#1e2a44" text-anchor="start">Public sector</text><text x="484" y="182" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Owned by the government (central or</text><text x="484" y="204" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">local)</text><text x="484" y="240" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">Aim: usually to provide a service</text><rect x="484" y="268" width="362" height="40" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="665" y="293.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Public corporation</text><text x="484" y="352" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Funded by the government and, where</text><text x="484" y="374" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">charged, revenue from users</text><text x="484" y="420" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">e.g. a state-owned railway, water</text><text x="484" y="442" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">supplier or postal service</text><rect x="30" y="575" width="840" height="125" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="610" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Do not mix up the names</text><text x="54" y="644" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Public limited company: private sector, owned by shareholders</text><text x="54" y="676" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Public corporation: public sector, owned by the government</text>
</svg>