<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 637" width="900" height="637" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="637" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four types of interview</text>

<line x1="70" y1="218" x2="830" y2="218" stroke="#1e2a44" stroke-width="4" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="60" y="260" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Comparison, reliability</text><text x="840" y="260" font-size="18" font-weight="700" fill="#b5602e" text-anchor="end">Depth, meaning</text><circle cx="114" cy="218" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="114" y1="207" x2="114" y2="194" stroke="#1e2a44" stroke-width="2.5"/><g transform="translate(0,106)"><rect x="30" y="0" width="250" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="155" y="25.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Structured</text><text x="155" y="52" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Same questions, same order,</text><text x="155" y="72" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">often closed</text></g><circle cx="450" cy="218" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="450" y1="229" x2="450" y2="288" stroke="#1e2a44" stroke-width="2.5"/><g transform="translate(0,288)"><rect x="325" y="0" width="250" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="25.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Semi-structured</text><text x="450" y="52" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Set questions with freedom to</text><text x="450" y="72" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">probe</text></g><circle cx="786" cy="218" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="786" y1="207" x2="786" y2="194" stroke="#1e2a44" stroke-width="2.5"/><g transform="translate(0,106)"><rect x="620" y="0" width="250" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="745" y="25.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Unstructured</text><text x="745" y="52" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">A guided conversation;</text><text x="745" y="72" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">topics, not fixed questions</text></g><rect x="30" y="394" width="840" height="115" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="430" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Group interview</text><text x="50" y="458.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="458.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Several people discuss while the researcher moderates: shows shared views and how opinions form</text><text x="50" y="484.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="484.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">But louder members may dominate and peer pressure can shape answers</text><rect x="30" y="527" width="840" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="560.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Oakley, The Sociology of Housework (1974): interviews with 40 London housewives showed</text><text x="50" y="582.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">housework experienced as work, which official statistics did not capture.</text>
</svg>