<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 606" width="900" height="606" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="606" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Which sampling technique?</text>

<rect x="30" y="110" width="400" height="96" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="230" y="149.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">A complete list exists</text><text x="230" y="177.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">researcher avoids choosing people</text><rect x="470" y="110" width="195" height="96" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="567.5" y="138.1" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">No list; group</text><text x="567.5" y="160.1" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">hidden</text><text x="567.5" y="187.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">or stigmatised</text><rect x="675" y="110" width="195" height="96" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="772.5" y="138.1" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Results needed</text><text x="772.5" y="160.1" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">fast</text><text x="772.5" y="187.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">e.g. a street survey</text><line x1="230" y1="210" x2="230" y2="234" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="240" width="400" height="66" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="230" y="277.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Must important subgroups all appear?</text><line x1="150" y1="310" x2="128" y2="372" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="310" y1="310" x2="332" y2="372" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="130" y="342" font-size="16" font-weight="700" fill="#4a5568" text-anchor="end">no</text><text x="330" y="342" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">yes</text><rect x="30" y="378" width="195" height="200" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="127.5" y="405.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Random or</text><text x="127.5" y="430.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">systematic</text><text x="127.5" y="458.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Everyone has an</text><text x="127.5" y="479.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">equal or known</text><text x="127.5" y="500.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">chance</text><rect x="235" y="378" width="195" height="200" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="332.5" y="405.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Stratified</text><text x="332.5" y="433.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Matches the</text><text x="332.5" y="454.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">population’s</text><text x="332.5" y="475.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">proportions</text><line x1="567" y1="210" x2="567" y2="372" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="772" y1="210" x2="772" y2="372" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="470" y="378" width="195" height="200" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="567.5" y="405.2" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">Snowball</text><text x="567.5" y="433.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Trusted contacts</text><text x="567.5" y="454.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">introduce others</text><text x="567.5" y="485.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">− Sample is a</text><text x="567.5" y="506.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">network, not a</text><text x="567.5" y="527.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">cross-section</text><rect x="675" y="378" width="195" height="200" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="772.5" y="405.2" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">Quota</text><text x="772.5" y="433.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Interviewer fills</text><text x="772.5" y="454.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">set numbers of each</text><text x="772.5" y="475.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">type</text><text x="772.5" y="506.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">− Easy-to-find</text><text x="772.5" y="527.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">people</text><text x="772.5" y="548.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">over-represented</text>
</svg>