<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 778" width="900" height="778" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="778" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four types of question</text>

<rect x="30" y="110" width="410" height="260" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="148" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Open</text><text x="52" y="180" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“What does a good friend mean to you?”</text><rect x="52" y="220" width="366" height="62" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><path d="M66,242 l220,0 M66,264 l150,0" fill="none" stroke="#c9d6d4" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="52" y="316" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">+ Own words; high validity</text><text x="52" y="344" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">− Hard to code and compare</text><rect x="460" y="110" width="410" height="260" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="482" y="148" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Closed</text><text x="482" y="180" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Do you have a part-time job?”</text><rect x="482" y="230" width="51.875" height="32" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="507.9375" y="252" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Yes</text><rect x="541.875" y="230" width="43.25" height="32" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="563.5" y="252" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">No</text><text x="482" y="316" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">+ Quick; easy to count</text><text x="482" y="344" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">− Forces a choice; no explanation</text><rect x="30" y="390" width="410" height="260" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="428" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Multiple choice</text><text x="52" y="460" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“How do you travel to school?”</text><rect x="52" y="510" width="60.5" height="32" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="82.25" y="532" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Walk</text><rect x="120.5" y="510" width="51.875" height="32" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="146.4375" y="532" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Bus</text><rect x="180.375" y="510" width="51.875" height="32" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="206.3125" y="532" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Car</text><rect x="240.25" y="510" width="69.125" height="32" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="274.8125" y="532" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Other</text><text x="52" y="596" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">+ Easy to analyse</text><text x="52" y="624" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">− Options may not fit everyone</text><rect x="460" y="390" width="410" height="260" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="482" y="428" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Scaled</text><text x="482" y="460" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“School uniform improves behaviour”</text><rect x="482" y="510" width="43.25" height="32" rx="16" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="503.625" y="532" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">SA</text><rect x="533.25" y="510" width="34.625" height="32" rx="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="550.5625" y="532" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">A</text><rect x="575.875" y="510" width="34.625" height="32" rx="16" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="593.1875" y="532" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">N</text><rect x="618.5" y="510" width="34.625" height="32" rx="16" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="635.8125" y="532" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">D</text><rect x="661.125" y="510" width="43.25" height="32" rx="16" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="682.75" y="532" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">SD</text><text x="482" y="480" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">strongly agree … strongly disagree</text><text x="482" y="596" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">+ Measures strength of opinion</text><text x="482" y="624" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">− People read the points differently</text><rect x="30" y="670" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="703.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Avoid leading wording, double questions (“Do you enjoy science and maths?”), jargon and</text><text x="50" y="725.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">vague terms such as “often”.</text>
</svg>