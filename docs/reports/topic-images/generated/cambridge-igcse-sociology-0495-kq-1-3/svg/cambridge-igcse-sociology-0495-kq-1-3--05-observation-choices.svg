<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" width="900" height="570" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="570" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two choices in every observation</text>

<text x="392.5" y="134" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Overt</text><text x="392.5" y="158" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">people know</text><text x="717.5" y="134" font-size="21" font-weight="700" fill="#b5602e" text-anchor="middle">Covert</text><text x="717.5" y="158" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">people do not know</text><rect x="30" y="176" width="190" height="220" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="125" y="278" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Participant</text><text x="125" y="306" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">researcher joins in</text><rect x="240" y="176" width="305" height="220" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="260" y="211.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Willis (1977)</text><text x="260" y="239.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Learning to Labour: twelve</text><text x="260" y="260.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">working-class boys; observation</text><text x="260" y="281.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">plus interviews</text><text x="260" y="307.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">+ No deception</text><text x="260" y="333.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">− Risk of the Hawthorne effect</text><rect x="565" y="176" width="305" height="220" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="585" y="211.2" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Patrick (1973)</text><text x="585" y="239.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A Glasgow Gang Observed: joined</text><text x="585" y="260.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a teenage gang without its</text><text x="585" y="281.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">members knowing</text><text x="585" y="307.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">+ Reveals hidden behaviour</text><text x="585" y="333.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">− Deception, danger, hard to</text><text x="585" y="354.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">record data</text><rect x="30" y="412" width="190" height="130" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="125" y="459" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Non-participant</text><text x="125" y="487" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">watches from</text><text x="125" y="507" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">outside</text><rect x="240" y="412" width="630" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="260" y="446.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">e.g. recording classroom interaction on a schedule</text><text x="260" y="474.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">+ Systematic, reliable recording</text><text x="260" y="500.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">− Cannot reveal what behaviour means to people</text>
</svg>