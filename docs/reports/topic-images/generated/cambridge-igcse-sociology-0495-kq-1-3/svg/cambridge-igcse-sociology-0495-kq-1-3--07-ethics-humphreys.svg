<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 616" width="900" height="616" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="616" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five ethical issues, one famous case</text>

<rect x="30" y="110" width="420" height="94" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="44" y="138.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Informed consent</text><text x="44" y="166" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">understand and agree freely; parents too for</text><text x="44" y="186" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">children</text><line x1="560" y1="310" x2="458" y2="157" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><rect x="30" y="214" width="420" height="86" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="44" y="242.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Privacy / confidentiality</text><text x="44" y="270" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">names and identifying details protected</text><line x1="560" y1="310" x2="458" y2="257" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><rect x="30" y="310" width="420" height="86" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="44" y="338.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Deception</text><text x="44" y="366" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">misleading people; built into covert methods</text><line x1="560" y1="310" x2="458" y2="353" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><rect x="30" y="406" width="420" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="434.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Prevention of harm</text><text x="44" y="462" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">physical, emotional or social</text><rect x="30" y="502" width="420" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="530.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Legality</text><text x="44" y="558" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">do not break the law or encourage others to</text><rect x="560" y="190" width="310" height="231" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="580" y="223" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">ETHICS CASE</text><text x="580" y="249.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Humphreys, Tearoom Trade</text><text x="580" y="274.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">(1970)</text><text x="580" y="302.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="595.2" y="302.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Observed men in public toilets</text><text x="595.2" y="323.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">without their knowledge</text><text x="580" y="349.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="595.2" y="349.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Noted car number plates</text><text x="580" y="375.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="595.2" y="375.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Later visited homes in</text><text x="595.2" y="396.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">disguise to interview them</text>
</svg>