<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 840" width="900" height="840" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="840" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A Question 1(e) plan: every choice gets a reason</text>

<rect x="30" y="104" width="840" height="86" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">TOPIC</text><text x="450" y="164" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">How students use their free time at weekends</text><text x="154.66666666666669" y="228" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Part of the plan</text><text x="450.00000000000006" y="228" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Choice</text><text x="745.3333333333334" y="228" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Reason</text><rect x="30" y="244" width="249.33333333333334" height="112" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="272.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Primary method</text><line x1="285.33333333333337" y1="300" x2="319.33333333333337" y2="300" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="244" width="249.33333333333334" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="341.33333333333337" y="272.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Questionnaire, mainly</text><text x="341.33333333333337" y="293.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">closed and</text><text x="341.33333333333337" y="314.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">multiple-choice, plus some</text><text x="341.33333333333337" y="335.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">open questions</text><line x1="580.6666666666667" y1="300" x2="614.6666666666667" y2="300" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="244" width="249.33333333333334" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="636.6666666666667" y="272.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Quantitative patterns to</text><text x="636.6666666666667" y="293.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">compare; reasons in</text><text x="636.6666666666667" y="314.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">students’ own words</text><rect x="30" y="370" width="249.33333333333334" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="398.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Follow-up</text><line x1="285.33333333333337" y1="405" x2="319.33333333333337" y2="405" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="370" width="249.33333333333334" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="341.33333333333337" y="398.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Semi-structured interviews</text><text x="341.33333333333337" y="419.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">with a few students</text><line x1="580.6666666666667" y1="405" x2="614.6666666666667" y2="405" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="370" width="249.33333333333334" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="636.6666666666667" y="398.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Explore meanings in depth</text><text x="636.6666666666667" y="419.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(triangulation)</text><rect x="30" y="454" width="249.33333333333334" height="112" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="482.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sampling</text><line x1="285.33333333333337" y1="510" x2="319.33333333333337" y2="510" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="454" width="249.33333333333334" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="341.33333333333337" y="482.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">School registers;</text><text x="341.33333333333337" y="503.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">stratified random by</text><text x="341.33333333333337" y="524.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">gender and year; pilot</text><text x="341.33333333333337" y="545.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">with ten students</text><line x1="580.6666666666667" y1="510" x2="614.6666666666667" y2="510" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="454" width="249.33333333333334" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="636.6666666666667" y="482.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Each group in proportion;</text><text x="636.6666666666667" y="503.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">check questions are clear</text><rect x="30" y="580" width="249.33333333333334" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="608.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Secondary evidence</text><line x1="285.33333333333337" y1="615" x2="319.33333333333337" y2="615" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="580" width="249.33333333333334" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="341.33333333333337" y="608.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Published surveys of young</text><text x="341.33333333333337" y="629.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">people’s leisure</text><line x1="580.6666666666667" y1="615" x2="614.6666666666667" y2="615" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="580" width="249.33333333333334" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="636.6666666666667" y="608.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cheap; national patterns</text><text x="636.6666666666667" y="629.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to compare</text><rect x="30" y="664" width="249.33333333333334" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="692.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ethics</text><line x1="285.33333333333337" y1="699" x2="319.33333333333337" y2="699" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="664" width="249.33333333333334" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="341.33333333333337" y="692.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Consent from students and</text><text x="341.33333333333337" y="713.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">parents; anonymous answers</text><line x1="580.6666666666667" y1="699" x2="614.6666666666667" y2="699" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="664" width="249.33333333333334" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="636.6666666666667" y="692.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Informed consent and</text><text x="636.6666666666667" y="713.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">privacy</text><rect x="30" y="752" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="785.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Do not evaluate your own plan in part (e): justify each choice instead.</text>
</svg>