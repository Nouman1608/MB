<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 886" width="900" height="886" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="886" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Research design: each stage limits the next</text>

<line x1="62" y1="124" x2="62" y2="760" stroke="#c9d6d4" stroke-width="4"/><rect x="108" y="104" width="762" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="139.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Selection of topic</text><text x="128" y="167.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Shaped by the researcher’s values, social problems and funders</text><circle cx="62" cy="148" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="156.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="108" y="202" width="762" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="237.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Aims</text><text x="128" y="265.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">What the study wants to find out; often open in interpretivist studies</text><circle cx="62" cy="246" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="254.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="108" y="300" width="762" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="335.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Hypothesis</text><text x="128" y="363.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A testable prediction; suits positivist, quantitative research</text><circle cx="62" cy="344" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="352.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="108" y="398" width="762" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="433.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Target population</text><text x="128" y="461.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The whole group the findings should apply to, e.g. all secondary students in one city</text><circle cx="62" cy="442" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="450.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="108" y="496" width="762" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="531.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Methods</text><text x="128" y="559.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Chosen to match the aims and perspective</text><circle cx="62" cy="540" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="548.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="108" y="594" width="762" height="88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="128" y="629.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Operationalisation</text><text x="128" y="657.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Turning ideas into measures: “concentration” = minutes on task before checking a phone</text><circle cx="62" cy="638" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="646.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><rect x="108" y="692" width="762" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="727.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Pilot study</text><text x="128" y="755.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A small trial: finds confusing questions, tests timing and response rate</text><circle cx="62" cy="736" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="744.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">7</text><rect x="30" y="798" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="831.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Poor operationalisation lowers validity: the indicator may not capture the concept.</text>
</svg>