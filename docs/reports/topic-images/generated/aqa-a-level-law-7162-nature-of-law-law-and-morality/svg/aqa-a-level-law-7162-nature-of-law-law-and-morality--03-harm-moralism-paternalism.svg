<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 517" width="900" height="517" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="517" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three reasons the law might restrict conduct</text>

<rect x="30" y="100" width="270.6666666666667" height="189" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="128" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">HARM PRINCIPLE</text><text x="46" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">To prevent harm to others</text><text x="46" y="182.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Mill</tspan>, <tspan font-style="italic">On</tspan> <tspan font-style="italic">Liberty</tspan> (1859): the only</text><text x="46" y="203.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rightful purpose of power over</text><text x="46" y="224.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">someone against their will</text><rect x="314.6666666666667" y="100" width="270.6666666666667" height="189" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="330.6666666666667" y="128" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LEGAL MORALISM</text><text x="330.6666666666667" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">To enforce morality for its</text><text x="330.6666666666667" y="177.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">own sake</text><text x="330.6666666666667" y="205.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Devlin</tspan> (1959): shared morality</text><text x="330.6666666666667" y="226.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">holds society together. Test:</text><text x="330.6666666666667" y="247.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“intolerance, indignation and</text><text x="330.6666666666667" y="268.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">disgust”</text><rect x="599.3333333333334" y="100" width="270.6666666666667" height="189" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="615.3333333333334" y="128" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">LEGAL PATERNALISM</text><text x="615.3333333333334" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">To protect people from</text><text x="615.3333333333334" y="177.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">themselves</text><text x="615.3333333333334" y="205.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Hart</tspan> accepted some</text><text x="615.3333333333334" y="226.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">paternalism while rejecting</text><text x="615.3333333333334" y="247.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">moralism</text><rect x="250" y="307" width="400" height="72" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="333" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">CLASSIFY A LAW</text><text x="450" y="359.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Misuse of Drugs Act 1971</text><line x1="330" y1="379" x2="175" y2="401" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="379" x2="450" y2="401" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="570" y1="379" x2="725" y2="401" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="419" width="270.6666666666667" height="66" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="165.33333333333334" y="445.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Defended as <tspan font-weight="700" fill="#1e2a44">harm</tspan> <tspan font-weight="700" fill="#1e2a44">prevention</tspan>:</text><text x="165.33333333333334" y="466.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">crime linked to supply</text><rect x="314.6666666666667" y="419" width="270.6666666666667" height="66" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="456.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Criticised as <tspan font-weight="700" fill="#1e2a44">moralism</tspan></text><rect x="599.3333333333334" y="419" width="270.6666666666667" height="66" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="734.6666666666667" y="445.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Defended as <tspan font-weight="700" fill="#1e2a44">paternalism</tspan>:</text><text x="734.6666666666667" y="466.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">protecting users</text>
</svg>