<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 492" width="900" height="492" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="492" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">An evaluation paragraph in three moves</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Discuss the extent to which the law should enforce moral values</text>
<line x1="60" y1="144" x2="60" y2="440" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="120" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CASE LINKED TO THEORY</text><text x="120" y="178.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Brown</tspan> (1993) supports Devlin</text><text x="120" y="207.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Shared morality protected where no unwilling victim exists</text><circle cx="60" cy="176" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="184.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="240" width="766" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="120" y="268" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COUNTER-CASE AND EVALUATION</text><text x="120" y="294.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Wilson</tspan> (1996) suggests inconsistency</text><text x="120" y="323.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">May reflect disapproval of particular relationships rather than harm</text><circle cx="60" cy="292" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="300.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="356" width="766" height="104" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="120" y="384" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LINK TO PLURALISM AND JUDGEMENT</text><text x="120" y="410.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Hard to justify in a pluralist society</text><text x="120" y="439.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Supports Hart: intervene only to prevent harm to others</text><circle cx="60" cy="408" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="416.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text>
</svg>