<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 551" width="900" height="551" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="551" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Must law be moral to be law?</text>

<rect x="30" y="100" width="270.6666666666667" height="168" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="128" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">NATURAL LAW</text><text x="46" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Morality is part of the test</text><text x="46" y="182.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Aquinas</tspan>: a human law in</text><text x="46" y="203.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">conflict with natural law is not</text><text x="46" y="224.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">true law but a corruption of law</text><rect x="314.6666666666667" y="100" width="270.6666666666667" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330.6666666666667" y="128" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MIDDLE PATH</text><text x="330.6666666666667" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Law has an “inner</text><text x="330.6666666666667" y="177.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">morality”</text><text x="330.6666666666667" y="205.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Fuller</tspan>, <tspan font-style="italic">The</tspan> <tspan font-style="italic">Morality</tspan> <tspan font-style="italic">of</tspan> <tspan font-style="italic">Law</tspan></text><text x="330.6666666666667" y="226.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1964)</text><rect x="599.3333333333334" y="100" width="270.6666666666667" height="168" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="615.3333333333334" y="128" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LEGAL POSITIVISM</text><text x="615.3333333333334" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Valid if made by the</text><text x="615.3333333333334" y="177.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">recognised process</text><text x="615.3333333333334" y="205.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Austin,</tspan> <tspan font-weight="700" fill="#1e2a44">Hart</tspan>: whether a rule is</text><text x="615.3333333333334" y="226.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">law is separate from whether it</text><text x="615.3333333333334" y="247.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">is good</text><text x="450" y="310" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Fuller’s eight requirements: a system failing them all is not a legal system</text><rect x="96.79199999999997" y="326" width="83.29599999999999" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="138.43999999999997" y="346.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">general</text><rect x="190.08799999999997" y="326" width="72.208" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="226.19199999999995" y="346.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">public</text><rect x="272.29599999999994" y="326" width="117.712" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="331.15199999999993" y="346.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">prospective</text><rect x="400.0079999999999" y="326" width="63.088" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="431.5519999999999" y="346.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">clear</text><rect x="473.0959999999999" y="326" width="167.712" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="556.9519999999999" y="346.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">non-contradictory</text><rect x="650.8079999999999" y="326" width="152.4" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="727.0079999999999" y="346.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">possible to obey</text><rect x="265.568" y="366" width="163.28" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="347.20799999999997" y="386.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">reasonably stable</text><rect x="438.84799999999996" y="366" width="195.584" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="536.64" y="386.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">applied as announced</text><rect x="30" y="418" width="412" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="446" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FULLER ON NAZI-ERA INFORMER CASES</text><text x="46" y="477.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Such laws lacked the qualities of law</text><rect x="458" y="418" width="412" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="446" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">HART ON THE SAME CASES</text><text x="474" y="477.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">More honest to call them law, but morally wicked</text><text x="474" y="498.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">laws that should not be obeyed</text>
</svg>