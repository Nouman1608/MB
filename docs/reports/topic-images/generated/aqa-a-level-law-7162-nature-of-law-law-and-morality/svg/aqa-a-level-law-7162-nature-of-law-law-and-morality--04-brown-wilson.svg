<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="660" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Courts enforcing morality: Brown and Wilson</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Both involved consensual injury in private</text>
<rect x="30" y="124" width="410" height="151" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="154" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">R v BROWN (1993), HOUSE OF LORDS</text><text x="48" y="181.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Convictions upheld</text><text x="48" y="210.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sadomasochistic injuries between a group of</text><text x="48" y="231.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">men. Supports <tspan font-weight="700" fill="#1e2a44">Devlin</tspan>: shared morality protected</text><text x="48" y="252.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">with no unwilling victim.</text><rect x="460" y="124" width="410" height="151" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">R v WILSON (1996), COURT OF APPEAL</text><text x="478" y="181.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Conviction quashed</text><text x="478" y="210.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Husband branded his initials on his wife at her</text><text x="478" y="231.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">request. Likened to tattooing; law should not</text><text x="478" y="252.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">intrude on a married couple’s private life.</text><rect x="30" y="293" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="327.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Critics</text><text x="50" y="357.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The difference may reflect <tspan font-weight="700" fill="#1e2a44">moral</tspan> <tspan font-weight="700" fill="#1e2a44">judgement</tspan> <tspan font-weight="700" fill="#1e2a44">about</tspan> <tspan font-weight="700" fill="#1e2a44">the</tspan> <tspan font-weight="700" fill="#1e2a44">type</tspan> <tspan font-weight="700" fill="#1e2a44">of</tspan> <tspan font-weight="700" fill="#1e2a44">relationship</tspan> rather than a</text><text x="50" y="379.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">principled legal distinction.</text><rect x="30" y="422" width="413" height="97" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="45" y="449" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">KNULLER v DPP (1972)</text><text x="45" y="480" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Conspiracy to corrupt public morals upheld (following</text><text x="45" y="500" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Shaw</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">DPP</tspan>, 1962)</text><rect x="457" y="422" width="413" height="97" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="472" y="449" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">R v GIBSON (1990)</text><text x="472" y="480" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Outraging public decency: protects shared standards,</text><text x="472" y="500" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">not victims</text><rect x="30" y="531" width="413" height="97" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="45" y="558" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RE A (CONJOINED TWINS) (2000)</text><text x="45" y="589" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Judges resolved a moral dilemma where the law gave</text><text x="45" y="609" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">no clear answer</text><rect x="457" y="531" width="413" height="97" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="472" y="558" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NICKLINSON (2014)</text><text x="472" y="589" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Supreme Court: the assisted suicide question is</text><text x="472" y="609" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">primarily for Parliament</text>
</svg>