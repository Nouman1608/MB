<rect width="900" height="472" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How Parliament enforces, or stops enforcing, morality</text>

<rect x="30" y="100" width="206" height="60" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="133" y="136" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Decriminalise</text><rect x="250" y="100" width="620" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="266" y="134.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Sexual Offences Act 1967, after the Wolfenden Report</text><rect x="30" y="170" width="206" height="60" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="133" y="196" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Permit under</text><text x="133" y="218" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">conditions</text><rect x="250" y="170" width="620" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="266" y="204.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Abortion Act 1967: certified medical grounds</text><rect x="30" y="240" width="206" height="60" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="133" y="266" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Remove the crime,</text><text x="133" y="288" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">keep restrictions</text><rect x="250" y="240" width="620" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="266" y="274.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Suicide Act 1961: assisting suicide still an offence</text><rect x="30" y="310" width="206" height="60" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="133" y="336" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Prohibit, with</text><text x="133" y="358" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">discretion</text><rect x="250" y="310" width="620" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="266" y="344.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Prosecution under s2 Suicide Act needs the DPP’s consent</text><rect x="30" y="380" width="206" height="60" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="133" y="406" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Change legal</text><text x="133" y="428" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">recognition</text><rect x="250" y="380" width="620" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="266" y="414.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Marriage (Same Sex Couples) Act 2013</text>
</svg>