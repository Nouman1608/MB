<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 699" width="900" height="699" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="699" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Where law and morality overlap</text>

<circle cx="330" cy="336" r="190" fill="#b5d3cf" fill-opacity="0.55" stroke="#2e6b62" stroke-width="3"/><circle cx="570" cy="336" r="190" fill="#f2e7b8" fill-opacity="0.75" stroke="#8a6d0d" stroke-width="3"/><path d="M450,189 A190,190 0 0 1 450,483 A190,190 0 0 1 450,189 Z" fill="#d4b02e" fill-opacity="0.55"/><text x="250" y="126" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="middle">LAW</text><text x="650" y="126" font-size="22" font-weight="700" fill="#8a6d0d" text-anchor="middle">MORALITY</text><text x="450" y="286" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">BOTH</text><text x="450" y="322" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">Murder</text><text x="450" y="352" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">Rape</text><text x="450" y="382" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">Theft</text><text x="240" y="296" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Law only:</text><text x="240" y="326" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">morally neutral</text><text x="240" y="358" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Which side of</text><text x="240" y="380" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">the road</text><text x="240" y="410" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Registering</text><text x="240" y="432" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">a company</text><text x="660" y="296" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Morality only:</text><text x="660" y="326" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">wrong, not unlawful</text><text x="660" y="358" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Lying to a friend</text><text x="660" y="386" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Breaking a promise</text><text x="660" y="408" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">(not a contract)</text><text x="660" y="436" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Not rescuing</text><text x="660" y="458" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">a stranger</text><rect x="30" y="556" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="590.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Pluralist society</text><text x="50" y="620.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">On abortion, assisted dying or drug use there is no shared answer, so any law <tspan font-weight="700" fill="#1e2a44">enforces</tspan> <tspan font-weight="700" fill="#1e2a44">one</tspan></text><text x="50" y="642.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">group’s</tspan> <tspan font-weight="700" fill="#1e2a44">view</tspan> <tspan font-weight="700" fill="#1e2a44">against</tspan> <tspan font-weight="700" fill="#1e2a44">another’s</tspan>.</text>
</svg>