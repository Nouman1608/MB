<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 512" width="900" height="512" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="512" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Six jobs evidence can do</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Ask what the evidence is doing, not only what it is</text>
<rect x="30" y="122" width="269.3333333333333" height="144.2" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="30" y="122" width="10" height="144.2" rx="5" fill="#d4b02e"/><text x="46" y="154.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Illustrate</text><text x="46" y="183.32" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#2e6b62">make</tspan> <tspan font-weight="700" fill="#2e6b62">a</tspan> <tspan font-weight="700" fill="#2e6b62">general</tspan> <tspan font-weight="700" fill="#2e6b62">point</tspan> <tspan font-weight="700" fill="#2e6b62">visible</tspan></text><text x="46" y="204.44" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“By nine each morning the</text><text x="46" y="225.56" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">bus shelter is full of people</text><text x="46" y="246.68" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">who have missed the 8.40.”</text><rect x="315.3333333333333" y="122" width="269.3333333333333" height="144.2" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="315.3333333333333" y="122" width="10" height="144.2" rx="5" fill="#d4b02e"/><text x="331.3333333333333" y="154.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Clarify</text><text x="331.3333333333333" y="183.32" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#2e6b62">make</tspan> <tspan font-weight="700" fill="#2e6b62">a</tspan> <tspan font-weight="700" fill="#2e6b62">complex</tspan> <tspan font-weight="700" fill="#2e6b62">idea</tspan> <tspan font-weight="700" fill="#2e6b62">easier</tspan></text><text x="331.3333333333333" y="204.44" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Compound interest is like a</text><text x="331.3333333333333" y="225.56" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">snowball rolling downhill.”</text><rect x="600.6666666666666" y="122" width="269.3333333333333" height="144.2" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="600.6666666666666" y="122" width="10" height="144.2" rx="5" fill="#d4b02e"/><text x="616.6666666666666" y="154.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Set a mood</text><text x="616.6666666666666" y="183.32" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#2e6b62">create</tspan> <tspan font-weight="700" fill="#2e6b62">an</tspan> <tspan font-weight="700" fill="#2e6b62">atmosphere</tspan></text><text x="616.6666666666666" y="204.44" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“On a grey Sunday the high</text><text x="616.6666666666666" y="225.56" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">street has the hush of a</text><text x="616.6666666666666" y="246.68" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">waiting room.”</text><rect x="30" y="282.2" width="269.3333333333333" height="165.32" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="30" y="282.2" width="10" height="165.32" rx="5" fill="#b5d3cf"/><text x="46" y="315" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Exemplify</text><text x="46" y="343.52000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#2e6b62">a</tspan> <tspan font-weight="700" fill="#2e6b62">representative</tspan> <tspan font-weight="700" fill="#2e6b62">instance</tspan></text><text x="46" y="364.64000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Take the Corner Café, which</text><text x="46" y="385.76000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">closed last month after thirty</text><text x="46" y="406.88000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">years.”</text><rect x="315.3333333333333" y="282.2" width="269.3333333333333" height="165.32" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="315.3333333333333" y="282.2" width="10" height="165.32" rx="5" fill="#b5d3cf"/><text x="331.3333333333333" y="315" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Associate</text><text x="331.3333333333333" y="343.52000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#2e6b62">link</tspan> <tspan font-weight="700" fill="#2e6b62">to</tspan> <tspan font-weight="700" fill="#2e6b62">what</tspan> <tspan font-weight="700" fill="#2e6b62">the</tspan> <tspan font-weight="700" fill="#2e6b62">audience</tspan></text><text x="331.3333333333333" y="364.64000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#2e6b62">respects,</tspan> <tspan font-weight="700" fill="#2e6b62">loves</tspan> <tspan font-weight="700" fill="#2e6b62">or</tspan> <tspan font-weight="700" fill="#2e6b62">fears</tspan></text><text x="331.3333333333333" y="385.76000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">the library’s closure set</text><text x="331.3333333333333" y="406.88000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">beside closing a school or a</text><text x="331.3333333333333" y="428.00000000000006" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">church</text><rect x="600.6666666666666" y="282.2" width="269.3333333333333" height="165.32" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="600.6666666666666" y="282.2" width="10" height="165.32" rx="5" fill="#b5d3cf"/><text x="616.6666666666666" y="315" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Amplify</text><text x="616.6666666666666" y="343.52000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#2e6b62">increase</tspan> <tspan font-weight="700" fill="#2e6b62">force</tspan> <tspan font-weight="700" fill="#2e6b62">or</tspan> <tspan font-weight="700" fill="#2e6b62">scale</tspan></text><text x="616.6666666666666" y="364.64000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Not one shop but twelve; not</text><text x="616.6666666666666" y="385.76000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">a month but six years.”</text><text x="450" y="471.52" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">One piece can do several jobs: say which matters most <tspan font-weight="700">in</tspan> <tspan font-weight="700">context</tspan>.</text>
</svg>