<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 628" width="900" height="628" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="628" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Which evidence leads?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Worked example 1: keeping the minibus (invented figures)</text>
<rect x="30" y="122" width="840" height="54.44" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="450" y="154.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">Audience:</tspan> <tspan font-weight="700">governors</tspan>, who value careful spending and need a defensible decision.</text><text x="30" y="204" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Main proof</text><rect x="30" y="214" width="410" height="115.12" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3" /><text x="44" y="242.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">(iii) Taxi comparison</text><text x="44" y="269.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">about £21,000 a year: the minibus is cheaper</text><text x="44" y="290.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#2e6b62">strengthens</tspan> <tspan font-weight="700" fill="#2e6b62">validity</tspan></text><rect x="460" y="214" width="410" height="115.12" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3" /><text x="474" y="242.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">(ii) Usage table</text><text x="474" y="269.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">62 of 480 pupils; £9,800 a year, about £158</text><text x="474" y="290.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">each</text><text x="474" y="311.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#2e6b62">exemplifies</tspan> <tspan font-weight="700" fill="#2e6b62">and</tspan> <tspan font-weight="700" fill="#2e6b62">quantifies</tspan></text><text x="30" y="359.12" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Support, placed after the figures</text><rect x="30" y="369.12" width="560" height="94" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="44" y="397.52" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">(i) A parent’s story</text><text x="44" y="424.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">a child who could not otherwise get to school</text><text x="44" y="445.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#2e6b62">illustration:</tspan> <tspan font-weight="700" fill="#2e6b62">adds</tspan> <tspan font-weight="700" fill="#2e6b62">a</tspan> <tspan font-weight="700" fill="#2e6b62">human</tspan> <tspan font-weight="700" fill="#2e6b62">case</tspan></text><text x="30" y="493.12" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start" xml:space="preserve">Contributes little here</text><rect x="30" y="503.12" width="560" height="94" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="44" y="531.52" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">(iv) Photograph</text><text x="44" y="558.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">pupils laughing on the minibus</text><text x="44" y="579.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#2e6b62">sets</tspan> <tspan font-weight="700" fill="#2e6b62">a</tspan> <tspan font-weight="700" fill="#2e6b62">mood;</tspan> <tspan font-weight="700" fill="#2e6b62">says</tspan> <tspan font-weight="700" fill="#2e6b62">nothing</tspan> <tspan font-weight="700" fill="#2e6b62">about</tspan> <tspan font-weight="700" fill="#2e6b62">need</tspan> <tspan font-weight="700" fill="#2e6b62">or</tspan> <tspan font-weight="700" fill="#2e6b62">cost</tspan></text>
</svg>