<text x="160" y="104" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle" xml:space="preserve">AUDIENCE · PURPOSE</text><text x="640" y="104" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle" xml:space="preserve">STRATEGIC CHOICE · WHY</text><rect x="30" y="120" width="300" height="78" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="44" y="150.96" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Sceptical budget committee</text><text x="44" y="177.92" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">fund</tspan> <tspan font-style="italic">a</tspan> <tspan font-style="italic">repair</tspan></text><line x1="336" y1="159" x2="404" y2="159" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="410" y="120" width="460" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="424" y="150.96" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">A costed comparison with the price of delay</text><text x="424" y="177.92" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#2e6b62">validity,</tspan> <tspan font-weight="700" fill="#2e6b62">credibility</tspan></text><rect x="30" y="210" width="300" height="78" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="44" y="240.96" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Neighbours at a meeting</text><text x="44" y="267.92" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">sign</tspan> <tspan font-style="italic">a</tspan> <tspan font-style="italic">petition</tspan></text><line x1="336" y1="249" x2="404" y2="249" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="410" y="210" width="460" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="424" y="240.96" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">A named local resident’s story</text><text x="424" y="267.92" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#2e6b62">emotions</tspan> <tspan font-weight="700" fill="#2e6b62">and</tspan> <tspan font-weight="700" fill="#2e6b62">values</tspan></text><rect x="30" y="300" width="300" height="78" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="44" y="330.96" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Specialist readers</text><text x="44" y="357.92" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">a</tspan> <tspan font-style="italic">method</tspan> <tspan font-style="italic">is</tspan> <tspan font-style="italic">flawed</tspan></text><line x1="336" y1="339" x2="404" y2="339" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="410" y="300" width="460" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="424" y="330.96" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">A controlled study and a named authority</text><text x="424" y="357.92" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#2e6b62">credibility</tspan></text><rect x="30" y="390" width="300" height="78" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="44" y="420.96" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Young readers</text><text x="44" y="447.92" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">explain</tspan> <tspan font-style="italic">a</tspan> <tspan font-style="italic">complex</tspan> <tspan font-style="italic">idea</tspan></text><line x1="336" y1="429" x2="404" y2="429" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="410" y="390" width="460" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="424" y="420.96" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">A vivid analogy</text><text x="424" y="447.92" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#2e6b62">clarifies</tspan> <tspan font-weight="700" fill="#2e6b62">without</tspan> <tspan font-weight="700" fill="#2e6b62">jargon</tspan></text><text x="450" y="496" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Weigh four things</text><rect x="30" y="512" width="171.23387000000002" height="35" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="115.61693500000001" y="535.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">the claim (validity)</text><rect x="215.23387000000002" y="512" width="284.61112" height="35" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="357.53943000000004" y="535.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">the audience (emotions, values)</text><rect x="513.84499" y="512" width="100.73861000000001" height="35" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="564.2142950000001" y="535.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">credibility</text><rect x="628.5836" y="512" width="119.52684" height="35" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="688.34702" y="535.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">the purpose</text>
