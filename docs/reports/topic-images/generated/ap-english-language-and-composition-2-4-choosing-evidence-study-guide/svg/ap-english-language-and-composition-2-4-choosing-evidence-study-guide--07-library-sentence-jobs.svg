<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 614" width="900" height="614" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="614" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One sentence, four jobs</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Worked example 2: the reading room</text>
<rect x="130" y="242" width="640" height="131.04000000000002" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3" /><text x="450" y="277.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“Last winter, between two and four on weekday afternoons, the</text><text x="450" y="301.06" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">reading room held <tspan font-weight="700">eleven</tspan> <tspan font-weight="700">pensioners,</tspan> <tspan font-weight="700">six</tspan> <tspan font-weight="700">job-seekers</tspan> <tspan font-weight="700">and</tspan> <tspan font-weight="700">a</tspan></text><text x="450" y="324.82" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">student</tspan> revising for her driving theory test, all <tspan font-weight="700">within</tspan> <tspan font-weight="700">sight</tspan> <tspan font-weight="700">of</tspan> <tspan font-weight="700">the</tspan></text><text x="450" y="348.58000000000004" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">radiator</tspan>.”</text><rect x="30" y="122" width="400" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="44" y="152" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Exemplifies</text><text x="44" y="180" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">a specific, representative case of who the</text><text x="44" y="201.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">library serves</text><line x1="230" y1="216" x2="290" y2="236" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="470" y="122" width="400" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="484" y="152" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Illustrates, sets a mood</text><text x="484" y="180" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“within sight of the radiator” makes cold and</text><text x="484" y="201.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">warmth physical</text><line x1="670" y1="216" x2="610" y2="236" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="30" y="413.04" width="400" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="44" y="443.04" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Emotions and values</text><text x="44" y="471.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">seventeen people, “not alone and not cold”:</text><text x="44" y="492.16" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">care and community</text><line x1="230" y1="411.04" x2="290" y2="379.04" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="470" y="413.04" width="400" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="484" y="443.04" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Supports the scope</text><text x="484" y="471.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">the mix of people backs “every part of the</text><text x="484" y="492.16" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">town”</text><line x1="670" y1="411.04" x2="610" y2="379.04" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="30" y="527.04" width="840" height="76.88" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray="7 5"/><text x="450" y="559.49" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Weak: “it gives an example.” Strong: name several jobs and link each to the claim and the</text><text x="450" y="581.9300000000001" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">audience.</text>
</svg>