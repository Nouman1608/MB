<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 589" width="900" height="589" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="589" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Analogy first, claim second</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Lincoln, Springfield, 16 June 1858</text>
<rect x="30" y="122" width="400" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="48" y="164.72" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start" xml:space="preserve">Evidence by analogy</text><text x="48" y="195.27" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“A house divided against itself cannot</text><text x="48" y="220.35000000000002" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">stand.”</text><rect x="470" y="122" width="400" height="130" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="3" /><text x="488" y="156" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Explicit claim</text><text x="488" y="185.70000000000002" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“I believe this government cannot</text><text x="488" y="209.46" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">endure, permanently half slave and half</text><text x="488" y="233.22000000000003" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">free.”</text><line x1="434" y1="187" x2="464" y2="187" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="650" y="282" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">the familiar image prepares the audience to</text><text x="650" y="303.12" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">accept it</text><rect x="60" y="272" width="370" height="87.36000000000001" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5" /><text x="72" y="298.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Clarify</text><text x="72" y="324.51" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">An abstract political problem becomes a simple</text><text x="72" y="344.31" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">picture of a house people want to live in.</text><line x1="44" y1="252" x2="44" y2="315.68" stroke="#8a6d0d" stroke-width="3"/><line x1="44" y1="315.68" x2="58" y2="315.68" stroke="#8a6d0d" stroke-width="3"/><rect x="60" y="371.36" width="370" height="87.36000000000001" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5" /><text x="72" y="397.76" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Associate</text><text x="72" y="423.87" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">From the Gospels (Mark 3:25, Matthew 12:25):</text><text x="72" y="443.67" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">the authority of a text the audience knew well.</text><line x1="44" y1="359.36" x2="44" y2="415.04" stroke="#8a6d0d" stroke-width="3"/><line x1="44" y1="415.04" x2="58" y2="415.04" stroke="#8a6d0d" stroke-width="3"/><rect x="60" y="470.72" width="370" height="87.36000000000001" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5" /><text x="72" y="497.12" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Amplify</text><text x="72" y="523.23" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Cannot stand” suggests total collapse and</text><text x="72" y="543.03" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">raises the stakes.</text><line x1="44" y1="458.72" x2="44" y2="514.4000000000001" stroke="#8a6d0d" stroke-width="3"/><line x1="44" y1="514.4000000000001" x2="58" y2="514.4000000000001" stroke="#8a6d0d" stroke-width="3"/>
</svg>