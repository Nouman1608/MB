<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 476" width="900" height="476" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="476" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Strategic selection or cherry-picking?</text>

<text x="185" y="106" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">All the evidence</text><rect x="20" y="118" width="330" height="210" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><circle cx="85" cy="166" r="13" fill="#2e6b62" stroke="#2e6b62" stroke-width="2.5"/><circle cx="135" cy="196" r="13" fill="#b5602e" stroke="#b5602e" stroke-width="2.5"/><circle cx="185" cy="156" r="13" fill="#2e6b62" stroke="#2e6b62" stroke-width="2.5"/><circle cx="235" cy="206" r="13" fill="#2e6b62" stroke="#2e6b62" stroke-width="2.5"/><circle cx="285" cy="171" r="13" fill="#b5602e" stroke="#b5602e" stroke-width="2.5"/><circle cx="115" cy="246" r="13" fill="#2e6b62" stroke="#2e6b62" stroke-width="2.5"/><circle cx="175" cy="236" r="13" fill="#b5602e" stroke="#b5602e" stroke-width="2.5"/><circle cx="255" cy="256" r="13" fill="#2e6b62" stroke="#2e6b62" stroke-width="2.5"/><circle cx="315" cy="226" r="13" fill="#2e6b62" stroke="#2e6b62" stroke-width="2.5"/><circle cx="65" cy="216" r="13" fill="#2e6b62" stroke="#2e6b62" stroke-width="2.5"/><circle cx="215" cy="286" r="13" fill="#b5602e" stroke="#b5602e" stroke-width="2.5"/><circle cx="145" cy="296" r="13" fill="#2e6b62" stroke="#2e6b62" stroke-width="2.5"/><circle cx="295" cy="296" r="13" fill="#2e6b62" stroke="#2e6b62" stroke-width="2.5"/><circle cx="40" cy="354" r="10" fill="#2e6b62"/><text x="58" y="360" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">supports the claim</text><circle cx="220" cy="354" r="10" fill="#b5602e"/><text x="238" y="360" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">cuts the other way</text><rect x="400" y="102" width="470" height="110" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" /><text x="418" y="138.68" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start" xml:space="preserve">Cherry-picking</text><text x="418" y="166.67999999999998" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Shows only what suits and hides the rest. It can</text><text x="418" y="187.79999999999998" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">mislead.</text><rect x="400" y="228" width="470" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="418" y="264.12" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Fair selection</text><text x="418" y="292.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Acknowledges evidence that cuts the other way and</text><text x="418" y="313.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">explains why it does not change the conclusion. That</text><text x="418" y="334.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">builds credibility.</text><line x1="354" y1="186" x2="394" y2="156" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><line x1="354" y1="266" x2="394" y2="292" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="30" y="392" width="840" height="54.44" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="450" y="424.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">On the exam: is the selection <tspan font-weight="700">representative</tspan>, and what effect might an <tspan font-weight="700">omission</tspan> have?</text>
</svg>