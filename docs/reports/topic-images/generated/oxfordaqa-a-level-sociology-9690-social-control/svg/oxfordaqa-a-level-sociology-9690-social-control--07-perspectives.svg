<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 626" width="900" height="626" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="626" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Perspectives on social control</text>

<rect x="208" y="104" width="327" height="44" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="371.5" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Argument</text><rect x="543" y="104" width="327" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="706.5" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Sociologists</text><rect x="30" y="156" width="170" height="114" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="207.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Functionalist</text><text x="42" y="229.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">(consensus)</text><rect x="208" y="156" width="327" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="222" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Control maintains shared values and</text><text x="222" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">order; punishment strengthens</text><text x="222" y="228.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">solidarity; social bonds prevent</text><text x="222" y="249.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">deviance</text><rect x="543" y="156" width="327" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="557" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Durkheim; Hirschi (1969):</text><text x="557" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">attachment, commitment,</text><text x="557" y="228.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">involvement, belief</text><rect x="30" y="278" width="170" height="114" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="329.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Marxist</text><text x="42" y="351.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">(conflict)</text><rect x="208" y="278" width="327" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="222" y="308.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Control protects capitalism; law</text><text x="222" y="329.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">enforced selectively against the</text><text x="222" y="350.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">working class; ideology secures</text><text x="222" y="371.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">consent</text><rect x="543" y="278" width="327" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="557" y="308.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Althusser; Gramsci</text><rect x="30" y="400" width="170" height="93" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="440.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Feminist</text><text x="42" y="462.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">(conflict)</text><rect x="208" y="400" width="327" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="222" y="430.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Women face distinctive, often</text><text x="222" y="451.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">informal, control at home, in</text><text x="222" y="472.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">public and at work</text><rect x="543" y="400" width="327" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="557" y="430.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Heidensohn, Women and Crime (1985)</text><rect x="30" y="501" width="170" height="93" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="552.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Interactionist</text><rect x="208" y="501" width="327" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="222" y="531.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Control creates deviance through</text><text x="222" y="552.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">labelling; agents use discretion</text><text x="222" y="573.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and stereotypes</text><rect x="543" y="501" width="327" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="557" y="531.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Becker (1963); Goffman; Cohen</text>
</svg>