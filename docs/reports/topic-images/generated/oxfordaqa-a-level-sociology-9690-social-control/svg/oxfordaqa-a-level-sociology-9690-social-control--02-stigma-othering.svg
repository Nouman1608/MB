<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 609" width="900" height="609" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="609" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Stigma and othering</text>

<text x="30" y="114" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Goffman, Stigma (1963): three types</text><rect x="30" y="130" width="269.3333333333333" height="109" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="164.66666666666666" y="184.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Physical differences</text><rect x="315.3333333333333" y="130" width="269.3333333333333" height="109" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="162.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Perceived flaws of</text><text x="450" y="186.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">character</text><text x="450" y="216.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">e.g. a criminal record</text><rect x="600.6666666666666" y="130" width="269.3333333333333" height="109" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="735.3333333333333" y="174.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">“Tribal” stigma</text><text x="735.3333333333333" y="204.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">race, nation or religion</text><rect x="30" y="253" width="412" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,303 L31.25,267.25 Q31.25,254.25 44.25,254.25 L427.75,254.25 Q440.75,254.25 440.75,267.25 L440.75,303 Z" fill="#b5d3cf"/><line x1="31.25" y1="303" x2="440.75" y2="303" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="283.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Discredited</text><text x="44" y="334.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">stigma is visible</text><rect x="458" y="253" width="412" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,303 L459.25,267.25 Q459.25,254.25 472.25,254.25 L855.75,254.25 Q868.75,254.25 868.75,267.25 L868.75,303 Z" fill="#dce9e7"/><line x1="459.25" y1="303" x2="868.75" y2="303" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="283.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Discreditable</text><text x="472" y="334.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">can hide it, so must manage information about</text><text x="472" y="355.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">themselves</text><text x="450" y="407" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Stigma: an attribute that is "deeply discrediting"; fear of it deters deviance</text><text x="30" y="437" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Othering</text><rect x="30" y="453" width="395" height="130" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="227.5" y="485.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Define a group as different and</text><text x="227.5" y="509.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">inferior</text><text x="227.5" y="539.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Said (1978): "the East"; Cohen (1972): Mods</text><text x="227.5" y="560.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">and Rockers as folk devils</text><line x1="429" y1="518" x2="471" y2="518" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="475" y="453" width="395" height="130" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="672.5" y="507.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Harsher treatment legitimised</text><text x="672.5" y="537.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">by police, courts and the public</text>
</svg>