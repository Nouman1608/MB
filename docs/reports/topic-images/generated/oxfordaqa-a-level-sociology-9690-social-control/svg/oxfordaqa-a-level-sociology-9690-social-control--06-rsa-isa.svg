<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 687" width="900" height="687" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="687" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Control by force and control by ideas</text>

<rect x="30" y="110" width="412" height="224" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,160 L31.25,124.25 Q31.25,111.25 44.25,111.25 L427.75,111.25 Q440.75,111.25 440.75,124.25 L440.75,160 Z" fill="#f2e7b8"/><line x1="31.25" y1="160" x2="440.75" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="140.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Repressive state apparatuses</text><text x="44" y="192.15" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">control through force or its threat</text><circle cx="49" cy="214.54" r="4.5" fill="#2e6b62"/><text x="62" y="220.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Police</text><circle cx="49" cy="244.54" r="4.5" fill="#2e6b62"/><text x="62" y="250.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Courts</text><circle cx="49" cy="274.53999999999996" r="4.5" fill="#2e6b62"/><text x="62" y="280.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Prisons</text><circle cx="49" cy="304.53999999999996" r="4.5" fill="#2e6b62"/><text x="62" y="310.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Army</text><rect x="458" y="110" width="412" height="224" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,160 L459.25,124.25 Q459.25,111.25 472.25,111.25 L855.75,111.25 Q868.75,111.25 868.75,124.25 L868.75,160 Z" fill="#b5d3cf"/><line x1="459.25" y1="160" x2="868.75" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="140.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Ideological state apparatuses</text><text x="472" y="192.15" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">control through ideas</text><circle cx="477" cy="214.54" r="4.5" fill="#2e6b62"/><text x="490" y="220.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Education</text><circle cx="477" cy="244.54" r="4.5" fill="#2e6b62"/><text x="490" y="250.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Family</text><circle cx="477" cy="274.53999999999996" r="4.5" fill="#2e6b62"/><text x="490" y="280.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Religion</text><circle cx="477" cy="304.53999999999996" r="4.5" fill="#2e6b62"/><text x="490" y="310.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Media</text><text x="450" y="360" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Althusser (1970)</text><text x="30" y="388" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Interpellation: ideology "hails" individuals</text><rect x="30" y="404" width="256" height="106" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="158" y="446.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">“Hey, you there!”</text><text x="158" y="476.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">a police officer calls out</text><line x1="290" y1="457" x2="318" y2="457" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="322" y="404" width="256" height="106" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="436.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">The person turns round</text><text x="450" y="466.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">recognises the call is for</text><text x="450" y="487.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">them</text><line x1="582" y1="457" x2="610" y2="457" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="614" y="404" width="256" height="106" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="742" y="436.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Accepts the identity</text><text x="742" y="466.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">"good student", "loyal</text><text x="742" y="487.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">employee"</text><rect x="30" y="528" width="840" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="564" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Gramsci: hegemony</text><text x="56" y="593" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Rule through consent: the ruling class’s worldview becomes "common sense" via churches,</text><text x="56" y="615" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">schools and media, with force in reserve. Hegemony must be won, so counter-hegemonic</text><text x="56" y="637" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">ideas leave more room for resistance than Althusser allows.</text>
</svg>