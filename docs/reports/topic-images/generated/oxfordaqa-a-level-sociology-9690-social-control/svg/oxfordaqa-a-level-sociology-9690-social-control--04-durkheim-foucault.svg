<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How punishment has changed</text>

<text x="30" y="104" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><rect x="30" y="110" width="390" height="108" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="225" y="153.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Repressive law</text><text x="225" y="183.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">simpler societies: punishes</text><line x1="424" y1="164" x2="476" y2="164" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="480" y="110" width="390" height="108" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="675" y="142.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Restitutive law</text><text x="675" y="172.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">complex societies: restores things to how</text><text x="675" y="194.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">they were</text><text x="450" y="244" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Durkheim: punishment reaffirms the collective conscience</text><rect x="30" y="272" width="390" height="86" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="225" y="304.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Sovereign power</text><text x="225" y="334.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">public bodily punishment</text><line x1="424" y1="315" x2="476" y2="315" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="480" y="272" width="390" height="86" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="675" y="304.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Disciplinary power</text><text x="675" y="334.3" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">surveillance and self-discipline</text><text x="450" y="384" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Foucault, Discipline and Punish (1975)</text><rect x="30" y="406" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="300" cy="566" r="135" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><line x1="395" y1="566" x2="435" y2="566" stroke="#1e2a44" stroke-width="2"/><line x1="382.2724133595217" y1="613.5" x2="416.9134295108992" y2="633.5" stroke="#1e2a44" stroke-width="2"/><line x1="347.5" y1="648.2724133595217" x2="367.5" y2="682.9134295108992" stroke="#1e2a44" stroke-width="2"/><line x1="300" y1="661" x2="300" y2="701" stroke="#1e2a44" stroke-width="2"/><line x1="252.50000000000003" y1="648.2724133595217" x2="232.50000000000003" y2="682.9134295108993" stroke="#1e2a44" stroke-width="2"/><line x1="217.7275866404783" y1="613.5" x2="183.08657048910078" y2="633.5" stroke="#1e2a44" stroke-width="2"/><line x1="205" y1="566" x2="165" y2="566" stroke="#1e2a44" stroke-width="2"/><line x1="217.7275866404783" y1="518.5" x2="183.08657048910078" y2="498.50000000000006" stroke="#1e2a44" stroke-width="2"/><line x1="252.49999999999994" y1="483.72758664047836" x2="232.49999999999994" y2="449.08657048910084" stroke="#1e2a44" stroke-width="2"/><line x1="300" y1="471" x2="300" y2="431" stroke="#1e2a44" stroke-width="2"/><line x1="347.5" y1="483.7275866404783" x2="367.5" y2="449.0865704891008" stroke="#1e2a44" stroke-width="2"/><line x1="382.27241335952164" y1="518.5" x2="416.91342951089916" y2="498.49999999999994" stroke="#1e2a44" stroke-width="2"/><circle cx="300" cy="566" r="95" fill="none" stroke="#1e2a44" stroke-width="2"/><circle cx="300" cy="566" r="38" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="300" y="572" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">tower</text><text x="124" y="454" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="end">cells</text><line x1="130" y1="450" x2="212" y2="480" stroke="#1e2a44" stroke-width="2"/><text x="470" y="476" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Bentham’s panopticon: inmates could</text><text x="470" y="500" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">be watched at any time without</text><text x="470" y="524" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">knowing when</text><text x="470" y="576" font-size="17" font-weight="400" fill="#2e6b62" text-anchor="start">So they learn to police themselves:</text><text x="470" y="598" font-size="17" font-weight="400" fill="#2e6b62" text-anchor="start">control works through self-discipline</text>
