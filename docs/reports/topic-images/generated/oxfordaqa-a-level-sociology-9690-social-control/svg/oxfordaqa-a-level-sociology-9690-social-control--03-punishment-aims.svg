<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 642" width="900" height="642" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="642" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Six aims of punishment</text>

<rect x="208" y="104" width="327" height="44" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="371.5" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Meaning</text><rect x="543" y="104" width="327" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="706.5" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Typical forms</text><rect x="30" y="156" width="170" height="72" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="197.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Retribution</text><rect x="208" y="156" width="327" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="222" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Punishment in proportion to the</text><text x="222" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">harm done</text><rect x="543" y="156" width="327" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="557" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Prison terms matched to seriousness</text><rect x="30" y="236" width="170" height="72" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="277.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Deterrence</text><rect x="208" y="236" width="327" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="222" y="266.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Discourage the offender</text><text x="222" y="287.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(individual) and others (general)</text><rect x="543" y="236" width="327" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="557" y="266.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Visible, certain punishment</text><rect x="30" y="316" width="170" height="72" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="357.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Incapacitation</text><rect x="208" y="316" width="327" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="222" y="346.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Remove the ability to offend</text><rect x="543" y="316" width="327" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="557" y="346.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Imprisonment, driving bans; in some</text><text x="557" y="367.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">states the death penalty</text><rect x="30" y="396" width="170" height="72" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="437.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Rehabilitation</text><rect x="208" y="396" width="327" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="222" y="426.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Change the offender so they do not</text><text x="222" y="447.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reoffend</text><rect x="543" y="396" width="327" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="557" y="426.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Education, therapy, drug treatment</text><rect x="30" y="476" width="170" height="74" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="507.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Reparation /</text><text x="42" y="529.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">restorative</text><rect x="208" y="476" width="327" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="222" y="506.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Repair harm, often by meeting</text><text x="222" y="527.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">victims</text><rect x="543" y="476" width="327" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="557" y="506.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Community payback, victim-offender</text><text x="557" y="527.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">conferences</text><rect x="30" y="558" width="170" height="52" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="589.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Denunciation</text><rect x="208" y="558" width="327" height="52" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="222" y="588.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Express society’s disapproval</text><rect x="543" y="558" width="327" height="52" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="557" y="588.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Public sentencing, criminal record</text>
</svg>