<rect width="900" height="616" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Formal and informal sanctions</text>

<rect x="200" y="110" width="330" height="56" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="365" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Positive (reward)</text><rect x="540" y="110" width="330" height="56" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="705" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Negative (punishment)</text><rect x="30" y="176" width="160" height="130" rx="12" fill="#dce9e7" stroke="#8a6d0d" stroke-width="2"/><text x="110" y="226" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Formal</text><text x="110" y="254" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">official</text><text x="110" y="274" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">authority,</text><text x="110" y="294" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">written rules</text><rect x="200" y="176" width="330" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="223" cy="214.39" r="4.5" fill="#2e6b62"/><text x="236" y="220" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Award, promotion, certificate</text><circle cx="223" cy="244.39" r="4.5" fill="#2e6b62"/><text x="236" y="250" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Reduced sentence for good</text><text x="236" y="272" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">behaviour</text><rect x="540" y="176" width="330" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="563" cy="214.39" r="4.5" fill="#8a6d0d"/><text x="576" y="220" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Fine, imprisonment</text><circle cx="563" cy="244.39" r="4.5" fill="#8a6d0d"/><text x="576" y="250" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">School suspension, dismissal</text><rect x="30" y="316" width="160" height="130" rx="12" fill="#dce9e7" stroke="#8a6d0d" stroke-width="2"/><text x="110" y="366" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Informal</text><text x="110" y="394" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">everyday</text><text x="110" y="414" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">relationships,</text><text x="110" y="434" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">unwritten norms</text><rect x="200" y="316" width="330" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="223" cy="354.39" r="4.5" fill="#2e6b62"/><text x="236" y="360" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Praise, smiles</text><circle cx="223" cy="384.39" r="4.5" fill="#2e6b62"/><text x="236" y="390" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Likes on a post, acceptance by</text><text x="236" y="412" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">friends</text><rect x="540" y="316" width="330" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="563" cy="354.39" r="4.5" fill="#8a6d0d"/><text x="576" y="360" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Gossip, ridicule</text><circle cx="563" cy="384.39" r="4.5" fill="#8a6d0d"/><text x="576" y="390" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Ignoring someone, ostracism</text><rect x="30" y="464" width="412" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,514 L31.25,478.25 Q31.25,465.25 44.25,465.25 L427.75,465.25 Q440.75,465.25 440.75,478.25 L440.75,514 Z" fill="#dce9e7"/><line x1="31.25" y1="514" x2="440.75" y2="514" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="494.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Informal agencies</text><text x="44" y="545.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Families, schools, peers, media, religion,</text><text x="44" y="566.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">workplace</text><rect x="458" y="464" width="412" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,514 L459.25,478.25 Q459.25,465.25 472.25,465.25 L855.75,465.25 Q868.75,465.25 868.75,478.25 L868.75,514 Z" fill="#f2e7b8"/><line x1="459.25" y1="514" x2="868.75" y2="514" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="494.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Formal agencies</text><text x="472" y="545.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Government and laws; police and enforcement</text><text x="472" y="566.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">agencies; criminal justice system</text>
</svg>