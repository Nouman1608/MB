<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 676" width="900" height="676" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="676" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Crime prevention: policing and surveillance</text>

<rect x="30" y="104" width="412" height="199" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L427.75,105.25 Q440.75,105.25 440.75,118.25 L440.75,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="440.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Community policing</text><text x="46" y="187.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Officers build relationships and trust in</text><text x="46" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">local areas.</text><rect x="458" y="104" width="412" height="199" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,154 L459.25,118.25 Q459.25,105.25 472.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#f2e7b8"/><line x1="459.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Zero-tolerance policing</text><text x="474" y="187.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">broken windows (Wilson and Kelling, 1982)</text><text x="474" y="216.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Visible disorder invites serious crime, so</text><text x="474" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">enforce minor offences; New York in the</text><text x="474" y="258.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1990s. Criticised for targeting poor and</text><text x="474" y="279.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">minority communities.</text><rect x="30" y="319" width="412" height="178" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,369 L31.25,333.25 Q31.25,320.25 44.25,320.25 L427.75,320.25 Q440.75,320.25 440.75,333.25 L440.75,369 Z" fill="#b5d3cf"/><line x1="31.25" y1="369" x2="440.75" y2="369" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="350" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Intelligence-led and predictive</text><text x="46" y="402.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Data used to target likely offenders, places</text><text x="46" y="423.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and times.</text><rect x="458" y="319" width="412" height="178" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,369 L459.25,333.25 Q459.25,320.25 472.25,320.25 L855.75,320.25 Q868.75,320.25 868.75,333.25 L868.75,369 Z" fill="#f2e7b8"/><line x1="459.25" y1="369" x2="868.75" y2="369" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="350" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Situational crime prevention</text><text x="474" y="402.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Clarke</text><text x="474" y="431.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Target hardening, surveillance and design</text><text x="474" y="452.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reduce opportunities. Critics: crime may be</text><text x="474" y="473.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">displaced.</text><rect x="30" y="513" width="840" height="149" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="549" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Surveillance</text><circle cx="61" cy="572.39" r="4.5" fill="#8a6d0d"/><text x="74" y="578" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">CCTV, facial recognition, monitoring online activity</text><circle cx="61" cy="602.39" r="4.5" fill="#8a6d0d"/><text x="74" y="608" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Mathiesen:</tspan> the synopticon, many watching the few (smartphone filming of police)</text><circle cx="61" cy="632.39" r="4.5" fill="#8a6d0d"/><text x="74" y="638" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Zuboff:</tspan> surveillance capitalism; corporate data can be shared with states</text>
</svg>