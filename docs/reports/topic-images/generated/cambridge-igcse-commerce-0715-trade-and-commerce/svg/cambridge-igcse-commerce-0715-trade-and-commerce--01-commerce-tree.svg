<rect width="900" height="655" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Commerce = trade + aids to trade</text>

<rect x="330" y="110" width="240" height="60" rx="14" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="147.7" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Commerce</text><path d="M450,170 L450,192 M220,192 L680,192 M220,192 L220,212 M680,192 L680,212" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><rect x="100" y="212" width="240" height="54" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="220" y="246" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Trade</text><text x="220" y="290" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">buying and selling</text><rect x="560" y="212" width="240" height="54" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="680" y="246" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Aids to trade</text><text x="680" y="290" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">services that make trade possible</text><path d="M220,300 L220,318 M110,318 L335,318 M110,318 L110,336 M335,318 L335,336" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="30" y="336" width="160" height="48" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="110" y="365.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Home trade</text><rect x="240" y="336" width="190" height="48" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="335" y="365.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">International trade</text><line x1="44" y1="384" x2="44" y2="420" stroke="#1e2a44" stroke-width="2"/><line x1="44" y1="420" x2="60" y2="420" stroke="#1e2a44" stroke-width="2"/><rect x="60" y="398" width="120" height="44" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="120" y="425.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Retail</text><line x1="44" y1="384" x2="44" y2="476" stroke="#1e2a44" stroke-width="2"/><line x1="44" y1="476" x2="60" y2="476" stroke="#1e2a44" stroke-width="2"/><rect x="60" y="454" width="120" height="44" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="120" y="481.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Wholesale</text><line x1="269" y1="384" x2="269" y2="420" stroke="#1e2a44" stroke-width="2"/><line x1="269" y1="420" x2="285" y2="420" stroke="#1e2a44" stroke-width="2"/><rect x="285" y="398" width="120" height="44" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="345" y="425.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Exports</text><line x1="269" y1="384" x2="269" y2="476" stroke="#1e2a44" stroke-width="2"/><line x1="269" y1="476" x2="285" y2="476" stroke="#1e2a44" stroke-width="2"/><rect x="285" y="454" width="120" height="44" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="345" y="481.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Imports</text><rect x="520" y="336" width="168" height="48" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="604" y="365.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Communications</text><rect x="700" y="336" width="168" height="48" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="784" y="365.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Transport</text><rect x="520" y="396" width="168" height="48" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="604" y="425.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Warehousing</text><rect x="700" y="396" width="168" height="48" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="784" y="425.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Advertising</text><rect x="520" y="456" width="168" height="48" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="604" y="485.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Banking</text><rect x="700" y="456" width="168" height="48" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="784" y="485.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Insurance</text><line x1="680" y1="300" x2="680" y2="332" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="540" width="840" height="90" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="576" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">“Commerce is buying and selling” defines trade, not commerce.</text><text x="450" y="606" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">A definition of commerce needs both halves: trade and the aids to trade.</text>
</svg>