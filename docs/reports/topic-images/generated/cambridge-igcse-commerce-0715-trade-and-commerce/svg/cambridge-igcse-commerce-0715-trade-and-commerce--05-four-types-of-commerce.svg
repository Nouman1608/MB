<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 605" width="900" height="605" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="605" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four types of commerce</text>

<rect x="30" y="110" width="250" height="330" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><rect x="70" y="330" width="170" height="70" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="155" y="360.1" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">shop, market</text><text x="155" y="381.1" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">or salon</text><text x="155" y="148" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="middle">Traditional</text><text x="155" y="178" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">at a physical location</text><text x="155" y="228" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">e.g. vegetables at a</text><text x="155" y="248" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">street market; a haircut</text><text x="155" y="268" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">at a salon</text><rect x="300" y="110" width="570" height="330" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="585" y="148" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Ecommerce</text><text x="585" y="178" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">via the internet or websites</text><text x="585" y="212" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">e.g. ordering a printer from a retailer’s website on a laptop</text><rect x="320" y="250" width="260" height="170" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="284" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Mcommerce</text><text x="450" y="310" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">via a mobile device</text><text x="450" y="350" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">e.g. buying a bus ticket in</text><text x="450" y="370" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">an app</text><rect x="590" y="250" width="260" height="170" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="720" y="284" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Scommerce</text><text x="720" y="310" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">via social media channels</text><text x="720" y="350" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">e.g. a handmade bag from a</text><text x="720" y="370" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">seller’s social media shop</text><rect x="30" y="460" width="840" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="494" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Judge by the channel</text><text x="54" y="524" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mcommerce and scommerce are both forms of ecommerce. A purchase through a social media shop</text><text x="54" y="545" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">is scommerce even when it is made on a phone.</text>
</svg>