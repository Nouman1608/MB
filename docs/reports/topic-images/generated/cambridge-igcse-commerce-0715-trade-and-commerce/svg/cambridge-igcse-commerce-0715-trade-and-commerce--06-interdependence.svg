<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 725" width="900" height="725" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="725" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Production, trade and commerce need each other</text>

<rect x="30" y="110" width="840" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="50" y="126" width="170" height="46" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="135" y="155.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Production</text><line x1="226" y1="149" x2="300" y2="149" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="263" y="140" font-size="14" font-weight="400" fill="#4a5568" text-anchor="middle">needs</text><rect x="306" y="126" width="230" height="46" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="421" y="155.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Trade</text><text x="52" y="198" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Producers make goods to sell; without buyers there is no reason to make more than a household</text><text x="52" y="219" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">needs</text><rect x="30" y="240" width="840" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="50" y="256" width="170" height="46" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="135" y="285.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Trade</text><line x1="226" y1="279" x2="300" y2="279" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="263" y="270" font-size="14" font-weight="400" fill="#4a5568" text-anchor="middle">needs</text><rect x="306" y="256" width="230" height="46" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="421" y="285.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Production</text><text x="52" y="328" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">There is nothing to buy or sell unless something has been produced</text><rect x="30" y="370" width="840" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="50" y="386" width="170" height="46" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="135" y="415.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Trade</text><line x1="226" y1="409" x2="300" y2="409" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="263" y="400" font-size="14" font-weight="400" fill="#4a5568" text-anchor="middle">needs</text><rect x="306" y="386" width="230" height="46" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="421" y="415.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Commerce</text><text x="52" y="458" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Buyers and sellers are far apart, unknown and exposed to risk: trade needs transport,</text><text x="52" y="479" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">banking, insurance and the rest</text><rect x="30" y="500" width="840" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="50" y="516" width="170" height="46" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="135" y="545.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Commerce</text><line x1="226" y1="539" x2="300" y2="539" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="263" y="530" font-size="14" font-weight="400" fill="#4a5568" text-anchor="middle">needs</text><rect x="306" y="516" width="230" height="46" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="421" y="545.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Production and trade</text><text x="52" y="588" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Banks, insurers, carriers and advertisers earn their income from goods produced and traded</text><rect x="30" y="640" width="840" height="60" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="677" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">A strong answer shows the dependence running in more than one direction.</text>
</svg>