<text x="48" y="130" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Transaction (for Country X)</text><text x="500" y="130" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Trade</text><text x="712" y="130" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Commerce</text><rect x="30" y="145" width="450" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="183" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Supermarket sells bread to a shopper at the</text><text x="48" y="205" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">till</text><rect x="492" y="159" width="200" height="64" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="592" y="196.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Home trade, retail</text><rect x="704" y="159" width="166" height="64" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="787" y="196.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Traditional</text><rect x="30" y="249" width="450" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="287" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Furniture maker sells 200 chairs to a hotel</text><text x="48" y="309" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">chain abroad through its website</text><rect x="492" y="263" width="200" height="64" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="592" y="300.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">International, export</text><rect x="704" y="263" width="166" height="64" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="787" y="300.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Ecommerce</text><rect x="30" y="353" width="450" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="391" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Shop owner buys 50 cartons of juice from a</text><text x="48" y="413" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">local wholesaler’s app</text><rect x="492" y="367" width="200" height="64" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="592" y="404.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Home trade, wholesale</text><rect x="704" y="367" width="166" height="64" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="787" y="404.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Mcommerce</text><rect x="30" y="457" width="450" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="495" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Shopper buys a dress from an overseas</text><text x="48" y="517" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">designer’s social media shop</text><rect x="492" y="471" width="200" height="64" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="592" y="508.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">International, import</text><rect x="704" y="471" width="166" height="64" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="787" y="508.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Scommerce</text>
