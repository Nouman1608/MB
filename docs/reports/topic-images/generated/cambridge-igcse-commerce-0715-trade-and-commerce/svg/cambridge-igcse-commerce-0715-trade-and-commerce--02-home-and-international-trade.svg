<rect width="900" height="630" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Home trade and international trade</text>

<rect x="30" y="110" width="500" height="270" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" stroke-dasharray="10 7"/><text x="50" y="140" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Country A</text><rect x="50" y="180" width="130" height="56" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="213.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Producer</text><rect x="215" y="180" width="130" height="56" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="280" y="213.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Wholesaler</text><rect x="380" y="180" width="130" height="56" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="445" y="213.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Retailer</text><line x1="184" y1="208" x2="210" y2="208" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="349" y1="208" x2="375" y2="208" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="263" y="262" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">Wholesale trade:</text><text x="263" y="282" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">large quantities, to</text><text x="263" y="300" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">retailers and businesses</text><rect x="380" y="310" width="130" height="50" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="445" y="340.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Consumer</text><line x1="445" y1="240" x2="445" y2="304" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="370" y="338" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="end">Retail trade:</text><text x="370" y="357" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="end">small quantities</text><rect x="620" y="110" width="250" height="270" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray="10 7"/><text x="640" y="140" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">Country B</text><rect x="660" y="200" width="170" height="56" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="745" y="233.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Buyer abroad</text><rect x="660" y="300" width="170" height="56" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="745" y="333.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Seller abroad</text><rect x="30" y="405" width="840" height="200" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="440" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">International trade, seen from Country A</text><rect x="54" y="465" width="190" height="50" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="149" y="496.3" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Export</text><text x="264" y="486" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">goods or services sold to a buyer abroad</text><text x="264" y="508" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">money flows INTO Country A</text><rect x="54" y="535" width="190" height="50" rx="14" fill="#f3d9c8" stroke="#b5602e" stroke-width="2.5"/><text x="149" y="566.3" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">Import</text><text x="264" y="556" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">goods or services bought from abroad</text><text x="264" y="578" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">money flows OUT of Country A</text><line x1="516" y1="228" x2="652" y2="228" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="584" y="218" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">export</text><line x1="652" y1="328" x2="520" y2="328" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><text x="584" y="318" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">import</text>
