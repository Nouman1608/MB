<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 635" width="900" height="635" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="635" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Each aid to trade removes a barrier</text>

<rect x="30" y="280" width="130" height="90" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="95" y="331.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Producer</text><rect x="740" y="280" width="130" height="90" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="805" y="331.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Consumer</text><text x="450" y="128" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">Barrier</text><text x="450" y="148" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">removed by the aid to trade</text><rect x="180" y="162" width="540" height="66" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="200" y="190" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">Lack of information</text><text x="200" y="214" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">e.g. quotation emailed to an overseas buyer</text><rect x="530" y="172" width="175" height="46" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="617.5" y="200.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Communications</text><rect x="180" y="238" width="540" height="66" rx="10" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="200" y="266" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">Distance</text><text x="200" y="290" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">e.g. container ship carries furniture</text><rect x="530" y="248" width="175" height="46" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="617.5" y="276.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Transport</text><rect x="180" y="314" width="540" height="66" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="200" y="342" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">Time</text><text x="200" y="366" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">e.g. winter coats held until the cold season</text><rect x="530" y="324" width="175" height="46" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="617.5" y="352.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Warehousing</text><rect x="180" y="390" width="540" height="66" rx="10" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="200" y="418" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">Lack of knowledge</text><text x="200" y="442" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">e.g. social media campaign for a new drink</text><rect x="530" y="400" width="175" height="46" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="617.5" y="428.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Advertising</text><rect x="180" y="466" width="540" height="66" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="200" y="494" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">Payment and finance</text><text x="200" y="518" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">e.g. bank transfer pays a supplier</text><rect x="530" y="476" width="175" height="46" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="617.5" y="504.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Banking</text><rect x="180" y="542" width="540" height="66" rx="10" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="200" y="570" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">Risk</text><text x="200" y="594" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">e.g. cargo insurance covers goods at sea</text><rect x="530" y="552" width="175" height="46" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="617.5" y="580.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Insurance</text><line x1="164" y1="325" x2="176" y2="325" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="724" y1="325" x2="736" y2="325" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/>
</svg>