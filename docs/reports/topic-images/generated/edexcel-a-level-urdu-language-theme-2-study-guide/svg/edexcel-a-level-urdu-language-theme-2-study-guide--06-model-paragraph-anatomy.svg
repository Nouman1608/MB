<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 766" width="900" height="766" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="766" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What the model paragraph does</text>

<text x="450" y="128" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Task: a short opinion on the importance of folk traditions</text><rect x="30" y="148" width="840" height="124" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="64" cy="182" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="188.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="96" y="188" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">General statement</text><text x="846" y="188" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">plural subject, feminine plural verb</text><text x="846" y="240" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏لوک گیت اور کہانیاں نسل در نسل زبانی طور پر منتقل ہوتی رہی ہیں۔‏</text><rect x="30" y="286" width="840" height="124" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="64" cy="320" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="326.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="96" y="326" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Example</text><text x="846" y="326" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">passive, agreeing with the feminine plural</text><text x="846" y="378" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏ہیر رانجھا جیسی داستانیں آج بھی ڈراموں اور گانوں میں پیش کی جاتی ہیں۔‏</text><rect x="30" y="424" width="840" height="174" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="64" cy="458" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="64" y="464.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="96" y="464" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Opinion with a condition</text><text x="846" y="464" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">if ... then</text><text x="846" y="516" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏میری رائے میں اگر نوجوان ان روایات سے کٹ گئے‏</text><text x="846" y="566" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏تو ہماری ثقافتی شناخت کمزور ہو جائے گی۔‏</text><rect x="30" y="612" width="840" height="124" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="64" cy="646" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="652.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="96" y="652" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Recommendation</text><text x="846" y="704" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏اس لیے اسکولوں اور میڈیا کو چاہیے کہ وہ ان روایات کو زندہ رکھیں۔‏</text>
</svg>