<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Folklore and tradition</text>

<line x1="450" y1="330" x2="170" y2="170" stroke="#1e2a44" stroke-width="2.5"/><line x1="450" y1="330" x2="730" y2="170" stroke="#1e2a44" stroke-width="2.5"/><line x1="450" y1="330" x2="160" y2="460" stroke="#1e2a44" stroke-width="2.5"/><line x1="450" y1="330" x2="740" y2="460" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="330" r="96" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><text x="450" y="328" font-family="Noto Nastaliq Urdu" font-size="32" font-weight="400" fill="#1e2a44" text-anchor="middle">‏وراثت‏</text><text x="450" y="370" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">heritage</text><rect x="30" y="100" width="280" height="150" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="170" y="130" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Oral tradition</text><text x="170" y="178" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#2e6b62" text-anchor="middle">‏زبانی روایت‏</text><text x="170" y="212" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">stories, songs, sayings</text><rect x="590" y="100" width="280" height="150" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="730" y="130" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Folk tales and poetry</text><text x="730" y="178" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#2e6b62" text-anchor="middle">‏لوک کہانی‏</text><text x="730" y="212" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Heer and Ranjha; Sohni and</text><text x="730" y="231" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Mahiwal</text><rect x="20" y="390" width="280" height="150" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="160" y="420" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Festivals and customs</text><text x="160" y="468" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#2e6b62" text-anchor="middle">‏میلہ‏</text><text x="160" y="502" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Eid, melas, mehndi</text><rect x="600" y="390" width="280" height="150" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="740" y="420" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Performance</text><text x="740" y="468" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#2e6b62" text-anchor="middle">‏مشاعرہ‏</text><text x="740" y="502" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">qawwali, folk music, poetry</text><text x="740" y="521" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">gathering</text><rect x="30" y="566" width="840" height="76" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="54" y="600" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Preservation and change</text><text x="54" y="626" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">how traditions are recorded, taught, adapted and sometimes lost</text>
</svg>