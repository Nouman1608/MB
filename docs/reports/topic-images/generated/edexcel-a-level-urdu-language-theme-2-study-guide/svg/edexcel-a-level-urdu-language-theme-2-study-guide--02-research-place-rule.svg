<rect width="900" height="536" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Where your research may be based</text>

<rect x="30" y="110" width="410" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Themes 1, 3 and 4</text><text x="52" y="190" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Research must concern</text><text x="52" y="220" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Pakistan</text><rect x="460" y="110" width="410" height="190" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="482" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Theme 2</text><text x="482" y="190" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Pakistan</text><text x="482" y="220" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">or</text><text x="482" y="250" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">one area of India where Urdu</text><text x="482" y="280" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">is an official language</text><rect x="30" y="320" width="840" height="90" rx="12" fill="#f6ece4" stroke="#b5602e" stroke-width="2.5"/><circle cx="66" cy="365" r="15" fill="#f6ece4" stroke="#b5602e" stroke-width="2.5"/><path d="M60,359 l12,12 m0,-12 l-12,12" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="96" y="360" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Only one country or area: never research on the media</text><text x="96" y="386" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">based on several countries</text><rect x="30" y="430" width="840" height="80" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="54" y="478" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Check which place you chose before you start collecting material</text>
</svg>