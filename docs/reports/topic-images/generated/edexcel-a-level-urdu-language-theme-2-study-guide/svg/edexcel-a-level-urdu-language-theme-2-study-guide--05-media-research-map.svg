<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 746" width="900" height="746" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="746" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Researching the media</text>

<rect x="30" y="110" width="840" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="148" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Print and broadcast</text><text x="52" y="174" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">newspapers, magazines, radio, TV; growth</text><text x="52" y="193" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">of private channels</text><rect x="732" y="118" width="120" height="80" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="792" y="156" font-family="Noto Nastaliq Urdu" font-size="22" font-weight="400" fill="#1e2a44" text-anchor="middle">‏اخبار‏</text><text x="792" y="186" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">newspaper</text><rect x="606" y="118" width="120" height="80" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="666" y="156" font-family="Noto Nastaliq Urdu" font-size="22" font-weight="400" fill="#1e2a44" text-anchor="middle">‏رسالہ‏</text><text x="666" y="186" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">magazine</text><rect x="480" y="118" width="120" height="80" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="540" y="156" font-family="Noto Nastaliq Urdu" font-size="22" font-weight="400" fill="#1e2a44" text-anchor="middle">‏نشریات‏</text><text x="540" y="186" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">broadcasts</text><rect x="30" y="218" width="840" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="256" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Online and social media</text><text x="52" y="282" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">how people get news and entertainment</text><rect x="682" y="226" width="170" height="80" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="767" y="264" font-family="Noto Nastaliq Urdu" font-size="22" font-weight="400" fill="#1e2a44" text-anchor="middle">‏سوشل میڈیا‏</text><text x="767" y="294" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">social media</text><rect x="556" y="226" width="120" height="80" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="616" y="264" font-family="Noto Nastaliq Urdu" font-size="22" font-weight="400" fill="#1e2a44" text-anchor="middle">‏خبر‏</text><text x="616" y="294" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">news item</text><rect x="30" y="326" width="840" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="364" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Influence</text><text x="52" y="390" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">on opinion, language and behaviour</text><rect x="732" y="334" width="120" height="80" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="792" y="372" font-family="Noto Nastaliq Urdu" font-size="22" font-weight="400" fill="#1e2a44" text-anchor="middle">‏اثر‏</text><text x="792" y="402" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">influence</text><rect x="606" y="334" width="120" height="80" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="666" y="372" font-family="Noto Nastaliq Urdu" font-size="22" font-weight="400" fill="#1e2a44" text-anchor="middle">‏اشتہار‏</text><text x="666" y="402" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">advertisement</text><rect x="30" y="434" width="840" height="96" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="472" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Freedom and responsibility</text><text x="52" y="498" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">regulation, censorship, accuracy,</text><text x="52" y="517" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">rumours</text><rect x="682" y="442" width="170" height="80" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="767" y="480" font-family="Noto Nastaliq Urdu" font-size="22" font-weight="400" fill="#1e2a44" text-anchor="middle">‏آزادیٔ اظہار‏</text><text x="767" y="510" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">freedom of expression</text><rect x="30" y="542" width="840" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="580" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Urdu in the media</text><text x="52" y="606" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">register changes between news, drama and</text><text x="52" y="625" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">advertising</text><rect x="30" y="652" width="840" height="70" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="54" y="684" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Compare at least two viewpoints on each point</text><text x="54" y="708" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">benefits and risks, from named, checked sources</text>
</svg>