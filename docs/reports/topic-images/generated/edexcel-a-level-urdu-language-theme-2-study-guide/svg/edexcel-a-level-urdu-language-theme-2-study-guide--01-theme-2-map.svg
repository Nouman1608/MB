<rect width="900" height="550" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Theme 2 at a glance</text>

<rect x="150" y="104" width="600" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><text x="450" y="152" font-family="Noto Nastaliq Urdu" font-size="28" font-weight="400" fill="#1e2a44" text-anchor="middle">‏اردو بولنے والی دُنیا میں تمدن اور فنونِ لطیفہ‏</text><text x="450" y="200" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Theme 2: Art and culture in the Urdu-speaking world</text><path d="M450,214 V232 H163 V250" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="30" y="256" width="266" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="290" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">2.1</text><text x="276" y="312" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏لوک رسوم و روایت‏</text><text x="50" y="362" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Folklore and tradition</text><text x="50" y="410" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">oral tradition, folk tales,</text><text x="50" y="432" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">festivals, performance,</text><text x="50" y="454" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">preservation and change</text><path d="M450,214 V232 H450 V250" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="317" y="256" width="266" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="337" y="290" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">2.2</text><text x="563" y="312" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏مقبول کلچر‏</text><text x="337" y="362" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Popular culture</text><text x="337" y="410" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">drama, film, music, sport,</text><text x="337" y="432" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">fashion, food, youth culture,</text><text x="337" y="454" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">local and global influences</text><path d="M450,214 V232 H737 V250" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="604" y="256" width="266" height="230" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="624" y="290" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">2.3</text><text x="850" y="312" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏میڈیا‏</text><text x="624" y="362" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The media</text><text x="624" y="410" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the research subject:</text><text x="624" y="432" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Pakistan, or one area of India</text><text x="624" y="454" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">where Urdu is official</text><text x="450" y="522" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Not only literature: customs, popular entertainment and media too</text>
</svg>