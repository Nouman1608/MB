<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="660" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Inside the CPU</text>

<rect x="30" y="110" width="540" height="450" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="144" font-size="24" font-weight="700" fill="#2e6b62" text-anchor="start">CPU</text><rect x="52" y="160" width="240" height="92" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="70" y="190" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Control unit (CU)</text><text x="70" y="214" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">decodes instructions; sends</text><text x="70" y="233" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">control signals</text><rect x="310" y="160" width="240" height="92" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="328" y="190" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">ALU</text><text x="328" y="214" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">arithmetic (+, −) and logic</text><text x="328" y="233" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(comparisons, AND, OR, NOT)</text><rect x="52" y="268" width="498" height="276" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="70" y="296" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">Registers: very small, very fast storage</text><rect x="70" y="312" width="80" height="44" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="110" y="340" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">PC</text><text x="164" y="340" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">address of the next instruction</text><rect x="70" y="368" width="80" height="44" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="110" y="396" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">MAR</text><text x="164" y="396" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">address being read from or written to</text><rect x="70" y="424" width="80" height="44" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="110" y="452" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">MDR</text><text x="164" y="452" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">data or instruction just read, or to be written</text><rect x="70" y="480" width="80" height="44" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="110" y="508" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">ACC</text><text x="164" y="508" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">accumulator: holds results from the ALU</text><rect x="700" y="160" width="170" height="384" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="785" y="190" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Memory</text><text x="785" y="212" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">(RAM)</text><rect x="720" y="232" width="130" height="34" rx="4" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2"/><rect x="720" y="274" width="130" height="34" rx="4" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2"/><rect x="720" y="316" width="130" height="34" rx="4" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><rect x="720" y="358" width="130" height="34" rx="4" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2"/><rect x="720" y="400" width="130" height="34" rx="4" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2"/><rect x="720" y="442" width="130" height="34" rx="4" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2"/><rect x="720" y="484" width="130" height="34" rx="4" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2"/><line x1="292" y1="206" x2="310" y2="206" stroke="#1e2a44" stroke-width="2"/><line x1="574" y1="206" x2="694" y2="206" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="634" y="196" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">control bus</text><text x="634" y="228" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">read, write</text><line x1="574" y1="391" x2="694" y2="391" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="634" y="381" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">address bus</text><text x="634" y="413" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle"></text><line x1="574" y1="447" x2="694" y2="447" stroke="#1e2a44" stroke-width="3.5" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="634" y="437" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">data bus</text><text x="634" y="469" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle"></text><text x="634" y="469" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">both ways</text><rect x="30" y="580" width="840" height="56" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="615" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Buses connect the CPU to memory: addresses out, data both ways, control signals.</text>
</svg>