<rect width="900" height="788" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Calculating file sizes</text>

<rect x="30" y="110" width="840" height="280" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="146" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Image</text><text x="52" y="176" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1920 × 1080 pixels, colour depth 24 bits</text><rect x="52" y="200" width="110" height="56" rx="8" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="107" y="235" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">bits</text><text x="182" y="235" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">1920 × 1080 × 24</text><rect x="580" y="200" width="268" height="56" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="714" y="235" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">49,766,400 bits</text><line x1="530" y1="228" x2="572" y2="228" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="52" y="272" width="110" height="56" rx="8" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="107" y="307" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">bytes</text><text x="182" y="307" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">49,766,400 ÷ 8</text><rect x="580" y="272" width="268" height="56" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="714" y="307" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">6,220,800 bytes</text><line x1="530" y1="300" x2="572" y2="300" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="714" y="366" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">about 6.2 MB</text><rect x="30" y="410" width="840" height="280" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="446" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Sound</text><text x="52" y="476" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">60 s, stereo (2 channels), 44,100 samples per second, bit depth 16</text><rect x="52" y="500" width="110" height="56" rx="8" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="107" y="535" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">bits</text><text x="182" y="535" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">44,100 × 16 × 2 × 60</text><rect x="580" y="500" width="268" height="56" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="714" y="535" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">84,672,000 bits</text><line x1="530" y1="528" x2="572" y2="528" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="52" y="572" width="110" height="56" rx="8" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="107" y="607" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">bytes</text><text x="182" y="607" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">84,672,000 ÷ 8</text><rect x="580" y="572" width="268" height="56" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="714" y="607" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">10,584,000 bytes</text><line x1="530" y1="600" x2="572" y2="600" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="714" y="666" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">about 10.6 MB</text><rect x="30" y="708" width="840" height="56" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="743" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">Common slip: forgetting to divide by 8 to turn bits into bytes.</text>
</svg>