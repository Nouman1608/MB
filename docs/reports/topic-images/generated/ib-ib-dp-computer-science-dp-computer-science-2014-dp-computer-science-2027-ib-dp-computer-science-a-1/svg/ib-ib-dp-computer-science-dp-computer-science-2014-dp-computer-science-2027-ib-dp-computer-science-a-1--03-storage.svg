<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 714" width="900" height="714" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="714" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Primary and secondary storage</text>

<rect x="30" y="150" width="110" height="190" rx="12" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="85" y="252" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">CPU</text><rect x="160" y="108" width="460" height="256" rx="14" fill="none" stroke-dasharray="8 6" stroke="#2e6b62" stroke-width="2.5"/><text x="390" y="136" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">Primary: accessed directly by the CPU</text><rect x="174" y="150" width="144" height="190" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="246" y="186" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Cache</text><text x="246" y="212" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">fastest; copies</text><text x="246" y="231" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">of frequent data</text><rect x="184" y="288" width="124" height="34" rx="17" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="246" y="310.4" font-size="15" font-weight="600" fill="#b5602e" text-anchor="middle">volatile</text><rect x="326" y="150" width="130" height="190" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="391" y="186" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">RAM</text><text x="391" y="212" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">programs and</text><text x="391" y="231" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">data in use</text><rect x="329" y="288" width="124" height="34" rx="17" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="391" y="310.4" font-size="15" font-weight="600" fill="#b5602e" text-anchor="middle">volatile</text><rect x="464" y="150" width="142" height="190" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="535" y="186" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">ROM</text><text x="535" y="212" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">start-up</text><text x="535" y="231" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">instructions</text><rect x="473" y="288" width="124" height="34" rx="17" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="535" y="310.4" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">non-volatile</text><rect x="640" y="108" width="230" height="256" rx="14" fill="none" stroke-dasharray="8 6" stroke="#8a6d0d" stroke-width="2.5"/><text x="755" y="136" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">Secondary</text><rect x="656" y="150" width="198" height="190" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="755" y="186" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">HDD, SSD,</text><text x="755" y="212" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">optical disc,</text><text x="755" y="231" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">USB flash drive</text><rect x="693" y="288" width="124" height="34" rx="17" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="755" y="310.4" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">non-volatile</text><line x1="144" y1="245" x2="172" y2="245" stroke="#1e2a44" stroke-width="3.5" marker-start="url(#ah)" marker-end="url(#ah)"/><rect x="30" y="384" width="840" height="66" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="412" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Secondary storage is slower and is reached through input/output:</text><text x="52" y="436" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">data must be loaded into RAM before the CPU can use it.</text><rect x="30" y="470" width="840" height="220" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="504" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Virtual memory: when RAM is full</text><rect x="60" y="528" width="250" height="90" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="185" y="560" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">RAM (full)</text><rect x="78" y="574" width="46" height="28" rx="4" fill="#8a6d0d" opacity="0.65"/><rect x="134" y="574" width="46" height="28" rx="4" fill="#8a6d0d" opacity="0.65"/><rect x="190" y="574" width="46" height="28" rx="4" fill="#8a6d0d" opacity="0.65"/><rect x="246" y="574" width="46" height="28" rx="4" fill="#8a6d0d" opacity="0.65"/><line x1="318" y1="573" x2="520" y2="573" stroke="#2e6b62" stroke-width="3.5" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="419" y="560" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">swapped in and out</text><rect x="528" y="528" width="312" height="90" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="684" y="556" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Secondary storage</text><rect x="560" y="570" width="248" height="34" rx="6" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2" stroke-dasharray="6 4"/><text x="684" y="593" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">part used as virtual memory</text><text x="60" y="656" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">+ more programs can run</text><text x="500" y="656" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">− the system slows when data is swapped</text>
</svg>