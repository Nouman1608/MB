<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 706" width="900" height="706" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="706" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Applying A.1 to a scenario</text>

<rect x="30" y="110" width="840" height="60" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="147" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Scenario: school laptops are slow when many browser tabs are open</text><rect x="150" y="196" width="600" height="66" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="236" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">RAM is full</text><line x1="450" y1="264" x2="450" y2="286" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="150" y="288" width="600" height="66" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="328" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">the OS moves pages to virtual memory on the SSD</text><line x1="450" y1="356" x2="450" y2="378" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="150" y="380" width="600" height="66" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="420" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">secondary storage is much slower than RAM</text><line x1="450" y1="448" x2="450" y2="470" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="150" y="472" width="600" height="66" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="512" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">the CPU waits</text><rect x="30" y="578" width="840" height="66" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="618" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Fix: adding RAM would reduce swapping.</text><text x="450" y="680" font-size="17" font-weight="600" fill="#4a5568" text-anchor="middle">Name the concept, then link it to the details given in the scenario.</text>
</svg>