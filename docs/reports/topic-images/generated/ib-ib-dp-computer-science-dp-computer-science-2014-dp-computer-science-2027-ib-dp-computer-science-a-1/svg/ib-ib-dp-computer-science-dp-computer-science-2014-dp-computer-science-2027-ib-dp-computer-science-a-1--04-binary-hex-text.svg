<rect width="900" height="714" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Numbers and text in binary</text>

<rect x="30" y="110" width="840" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Integers: each place is a power of 2</text><rect x="70" y="166" width="88" height="44" rx="6" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="114" y="195" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">8</text><rect x="70" y="218" width="88" height="54" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="114" y="253" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="114" y="300" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">8</text><text x="164" y="300" font-size="18" font-weight="400" fill="#4a5568" text-anchor="middle">+</text><rect x="170" y="166" width="88" height="44" rx="6" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="214" y="195" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">4</text><rect x="170" y="218" width="88" height="54" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="214" y="253" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="214" y="300" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">4</text><text x="264" y="300" font-size="18" font-weight="400" fill="#4a5568" text-anchor="middle">+</text><rect x="270" y="166" width="88" height="44" rx="6" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="314" y="195" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">2</text><rect x="270" y="218" width="88" height="54" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="314" y="253" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">0</text><text x="314" y="300" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">0</text><text x="364" y="300" font-size="18" font-weight="400" fill="#4a5568" text-anchor="middle">+</text><rect x="370" y="166" width="88" height="44" rx="6" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="414" y="195" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">1</text><rect x="370" y="218" width="88" height="54" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="414" y="253" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="414" y="300" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">1</text><text x="470" y="300" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="start">= 13</text><text x="40" y="195" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><rect x="560" y="166" width="290" height="150" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="705" y="200" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">8 bits = 1 byte</text><text x="705" y="236" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">2⁸ = 256 values</text><text x="705" y="264" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">0 to 255 unsigned</text><text x="705" y="298" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">1 kB = 1000 B · 1 KiB = 1024 B</text><text x="70" y="338" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">1101 in binary is 8 + 4 + 0 + 1 = 13</text><rect x="30" y="380" width="840" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="416" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Hexadecimal: each hex digit stands for four bits</text><rect x="70" y="440" width="44" height="44" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="92" y="470" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="92" y="504" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">8</text><rect x="120" y="440" width="44" height="44" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="142" y="470" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">0</text><text x="142" y="504" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">4</text><rect x="170" y="440" width="44" height="44" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="192" y="470" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="192" y="504" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">2</text><rect x="220" y="440" width="44" height="44" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="242" y="470" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="242" y="504" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">1</text><text x="167" y="532" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle">8 + 2 + 1 = 11</text><path d="M70,545 L70,552 L264,552 L264,545" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><line x1="167" y1="554" x2="167" y2="554" stroke="#1e2a44" stroke-width="0" marker-end="url(#ah)"/><rect x="300" y="440" width="44" height="44" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="322" y="470" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">0</text><text x="322" y="504" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">8</text><rect x="350" y="440" width="44" height="44" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="372" y="470" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="372" y="504" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">4</text><rect x="400" y="440" width="44" height="44" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="422" y="470" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="422" y="504" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">2</text><rect x="450" y="440" width="44" height="44" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="472" y="470" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">0</text><text x="472" y="504" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">1</text><text x="397" y="532" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle">4 + 2 = 6</text><path d="M300,545 L300,552 L494,552 L494,545" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><line x1="397" y1="554" x2="397" y2="554" stroke="#1e2a44" stroke-width="0" marker-end="url(#ah)"/><line x1="520" y1="466" x2="580" y2="466" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="596" y="434" width="76" height="64" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="634" y="478" font-size="32" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><rect x="684" y="434" width="76" height="64" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="722" y="478" font-size="32" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="678" y="528" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">11 is B in hex</text><rect x="30" y="598" width="840" height="92" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="630" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Text</text><text x="120" y="630" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">each character has a numeric code</text><text x="52" y="664" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">ASCII: 7 bits (often stored in 8), English letters, digits, symbols · Unicode: more bits, world scripts</text>
</svg>