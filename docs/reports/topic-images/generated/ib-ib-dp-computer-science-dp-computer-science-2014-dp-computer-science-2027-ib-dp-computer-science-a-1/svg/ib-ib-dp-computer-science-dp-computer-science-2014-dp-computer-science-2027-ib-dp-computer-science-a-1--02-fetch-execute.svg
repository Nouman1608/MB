<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 810" width="900" height="810" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="810" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The fetch-execute cycle, step by step</text>

<rect x="30" y="110" width="150" height="282" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="105" y="259" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="middle">Fetch</text><rect x="30" y="410" width="150" height="62" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="105" y="449" font-size="22" font-weight="700" fill="#8a6d0d" text-anchor="middle">Decode</text><rect x="30" y="490" width="150" height="208" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="105" y="602" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Execute</text><rect x="196" y="110" width="674" height="62" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="226" cy="141" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="226" y="146.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="254" y="123" width="64" height="36" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="286" y="147" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">PC</text><line x1="322" y1="141" x2="356" y2="141" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="362" y="123" width="74" height="36" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="399" y="147" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">MAR</text><text x="560" y="147" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">address copied from PC to MAR</text><rect x="196" y="184" width="674" height="62" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="226" cy="215" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="226" y="220.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="254" y="197" width="64" height="36" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="286" y="221" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">CU</text><line x1="322" y1="215" x2="356" y2="215" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="364" y="221" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">read signal</text><text x="560" y="221" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">on the control bus</text><rect x="196" y="258" width="674" height="62" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="226" cy="289" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="226" y="294.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="254" y="271" width="104" height="36" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="306" y="295" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">memory</text><line x1="362" y1="289" x2="396" y2="289" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="402" y="271" width="74" height="36" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="439" y="295" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">MDR</text><text x="560" y="295" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">instruction travels on the data bus</text><rect x="196" y="332" width="674" height="62" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="226" cy="363" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="226" y="368.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="254" y="345" width="64" height="36" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="286" y="369" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">PC</text><text x="330" y="369" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">+ 1</text><text x="560" y="369" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">PC now points to the next instruction</text><rect x="196" y="410" width="674" height="62" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="226" cy="441" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="226" y="446.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="254" y="423" width="74" height="36" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="291" y="447" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">MDR</text><line x1="332" y1="441" x2="366" y2="441" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="372" y="423" width="64" height="36" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="404" y="447" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">CU</text><text x="560" y="447" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">CU works out the operation and data</text><rect x="196" y="490" width="674" height="62" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="226" cy="521" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="226" y="526.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><rect x="254" y="503" width="84" height="36" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="296" y="527" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">address</text><line x1="342" y1="521" x2="372" y2="521" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="378" y="503" width="74" height="36" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="415" y="527" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">MAR</text><text x="560" y="527" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">if data must be loaded, it arrives in MDR</text><rect x="196" y="564" width="674" height="62" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="226" cy="595" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="226" y="600.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">7</text><rect x="254" y="577" width="64" height="36" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="286" y="601" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">ALU</text><text x="560" y="601" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">performs any calculation</text><rect x="196" y="638" width="674" height="62" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="226" cy="669" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="226" y="674.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">8</text><rect x="254" y="651" width="84" height="36" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="296" y="675" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">result</text><line x1="342" y1="669" x2="372" y2="669" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="378" y="651" width="74" height="36" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="415" y="675" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">ACC</text><text x="560" y="675" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">or written back to memory</text><path d="M30,600 C-0,600 0,250 28,250" fill="none" stroke="#1e2a44" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><rect x="30" y="716" width="840" height="70" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="52" y="746" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Then the cycle repeats from Fetch.</text><text x="52" y="772" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">A jump or branch instruction changes the PC during execution: that is how selection and loops work.</text>
</svg>