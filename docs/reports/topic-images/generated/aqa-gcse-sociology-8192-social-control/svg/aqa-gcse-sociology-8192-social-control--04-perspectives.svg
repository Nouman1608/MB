<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 432" width="900" height="432" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="432" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Whose interests does control serve?</text>

<rect x="30" y="150" width="201" height="258" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,200 L31.25,164.25 Q31.25,151.25 44.25,151.25 L216.75,151.25 Q229.75,151.25 229.75,164.25 L229.75,200 Z" fill="#b5d3cf"/><line x1="31.25" y1="200" x2="229.75" y2="200" stroke="#c9d6d4" stroke-width="2"/><text x="130.5" y="180.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Functionalist</text><text x="44" y="231.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Serves society</text><text x="44" y="258.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Maintains value</text><text x="44" y="279.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">consensus and order;</text><text x="44" y="300.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">punishing deviance</text><text x="44" y="321.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reinforces boundaries</text><rect x="243" y="150" width="201" height="258" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M244.25,200 L244.25,164.25 Q244.25,151.25 257.25,151.25 L429.75,151.25 Q442.75,151.25 442.75,164.25 L442.75,200 Z" fill="#dce9e7"/><line x1="244.25" y1="200" x2="442.75" y2="200" stroke="#c9d6d4" stroke-width="2"/><text x="343.5" y="180.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Marxist</text><text x="257" y="231.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Serves the ruling</text><text x="257" y="252.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">class</text><text x="257" y="279.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Policing and law</text><text x="257" y="300.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">protect private</text><text x="257" y="321.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">property; media and</text><text x="257" y="342.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">education encourage</text><text x="257" y="363.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">acceptance of</text><text x="257" y="384.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">inequality</text><rect x="456" y="150" width="201" height="258" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M457.25,200 L457.25,164.25 Q457.25,151.25 470.25,151.25 L642.75,151.25 Q655.75,151.25 655.75,164.25 L655.75,200 Z" fill="#f2e7b8"/><line x1="457.25" y1="200" x2="655.75" y2="200" stroke="#c9d6d4" stroke-width="2"/><text x="556.5" y="180.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Feminist</text><text x="470" y="231.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Serves men</text><text x="470" y="258.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Heavier informal</text><text x="470" y="279.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">control of women at</text><text x="470" y="300.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">home, in public and</text><text x="470" y="321.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">at work (Heidensohn)</text><rect x="669" y="150" width="201" height="258" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M670.25,200 L670.25,164.25 Q670.25,151.25 683.25,151.25 L855.75,151.25 Q868.75,151.25 868.75,164.25 L868.75,200 Z" fill="#d4b02e"/><line x1="670.25" y1="200" x2="868.75" y2="200" stroke="#c9d6d4" stroke-width="2"/><text x="769.5" y="180.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Interactionist</text><text x="683" y="231.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">How is control</text><text x="683" y="252.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">applied?</text><text x="683" y="279.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Agents use discretion</text><text x="683" y="300.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and label some</text><text x="683" y="321.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">groups; control can</text><text x="683" y="342.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">create further</text><text x="683" y="363.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">deviance (Becker)</text><path d="M30,138 L30,126 L444,126 L444,138" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="237" y="116" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">Structural: what does control do for society?</text><path d="M669,138 L669,126 L870,126 L870,138" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="769.5" y="116" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">Face-to-face decisions</text>
</svg>