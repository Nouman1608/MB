<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 512" width="900" height="512" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="512" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Whose interests does control serve?</text>

<rect x="30" y="108" width="560" height="380" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="310" y="140" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Structural: what does control do?</text><rect x="48" y="160" width="256" height="310" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="64" y="190" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Functionalist</text><text x="64" y="214" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Serves society</text><text x="64" y="242" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Maintains value consensus and</text><text x="64" y="262" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">order; punishing deviance</text><text x="64" y="282" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">reinforces boundaries</text><rect x="316" y="160" width="256" height="310" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="332" y="190" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Marxist</text><text x="332" y="214" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Serves the ruling class</text><text x="332" y="242" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Policing and law protect</text><text x="332" y="262" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">private property; media and</text><text x="332" y="282" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">education encourage</text><text x="332" y="302" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">acceptance of inequality</text><rect x="610" y="108" width="260" height="182" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="626" y="138" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Feminist</text><text x="626" y="162" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Serves men</text><text x="626" y="190" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Heavier informal control of</text><text x="626" y="210" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">women at home, in public and</text><text x="626" y="230" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">at work (Heidensohn)</text><rect x="610" y="306" width="260" height="182" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="626" y="336" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Interactionist</text><text x="626" y="360" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">Face-to-face decisions</text><text x="626" y="388" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Agents use discretion and</text><text x="626" y="408" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">label some groups; control</text><text x="626" y="428" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">can create further deviance</text><text x="626" y="448" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">(Becker)</text>
</svg>