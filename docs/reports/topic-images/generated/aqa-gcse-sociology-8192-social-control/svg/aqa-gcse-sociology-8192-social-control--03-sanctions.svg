<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 735" width="900" height="735" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="735" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four kinds of sanction</text>

<rect x="210" y="108" width="322" height="56" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="371" y="144" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Positive (reward)</text><rect x="548" y="108" width="322" height="56" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="709" y="144" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Negative (punishment)</text><rect x="30" y="176" width="166" height="170" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="113" y="269" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Formal</text><rect x="210" y="176" width="322" height="170" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="235" cy="208.39" r="4.5" fill="#2e6b62"/><text x="248" y="214" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A medal</text><circle cx="235" cy="236.39" r="4.5" fill="#2e6b62"/><text x="248" y="242" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">An award</text><circle cx="235" cy="264.39" r="4.5" fill="#2e6b62"/><text x="248" y="270" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A promotion</text><circle cx="235" cy="292.39" r="4.5" fill="#2e6b62"/><text x="248" y="298" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A certificate</text><rect x="548" y="176" width="322" height="170" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="573" cy="208.39" r="4.5" fill="#b5602e"/><text x="586" y="214" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A fine</text><circle cx="573" cy="236.39" r="4.5" fill="#b5602e"/><text x="586" y="242" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A prison sentence</text><circle cx="573" cy="264.39" r="4.5" fill="#b5602e"/><text x="586" y="270" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A school exclusion</text><circle cx="573" cy="292.39" r="4.5" fill="#b5602e"/><text x="586" y="298" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A police caution</text><rect x="30" y="360" width="166" height="170" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="113" y="453" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Informal</text><rect x="210" y="360" width="322" height="170" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="235" cy="392.39" r="4.5" fill="#2e6b62"/><text x="248" y="398" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Praise</text><circle cx="235" cy="420.39" r="4.5" fill="#2e6b62"/><text x="248" y="426" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A smile</text><circle cx="235" cy="448.39" r="4.5" fill="#2e6b62"/><text x="248" y="454" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Being included</text><rect x="548" y="360" width="322" height="170" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="573" cy="392.39" r="4.5" fill="#b5602e"/><text x="586" y="398" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A frown</text><circle cx="573" cy="420.39" r="4.5" fill="#b5602e"/><text x="586" y="426" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Gossip</text><circle cx="573" cy="448.39" r="4.5" fill="#b5602e"/><text x="586" y="454" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Ridicule</text><circle cx="573" cy="476.39" r="4.5" fill="#b5602e"/><text x="586" y="482" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Being ignored or excluded by</text><text x="586" y="504" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">friends</text><rect x="30" y="548" width="840" height="163" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="584" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Two points that earn credit</text><circle cx="61" cy="607.39" r="4.5" fill="#8a6d0d"/><text x="74" y="613" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Sanctions work through <tspan font-weight="700">anticipation</tspan>: people conform to avoid a negative sanction, not only</text><text x="74" y="635" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">after receiving one</text><circle cx="61" cy="659.39" r="4.5" fill="#8a6d0d"/><text x="74" y="665" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The same agent can use both: a school gives formal detentions and a teacher’s informal</text><text x="74" y="687" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">praise</text>
</svg>