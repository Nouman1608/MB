<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 623" width="900" height="623" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="623" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Formal and informal social control</text>

<rect x="168" y="104" width="347" height="44" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="341.5" y="131.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Formal</text><rect x="523" y="104" width="347" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="696.5" y="131.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Informal</text><rect x="30" y="156" width="130" height="93" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="207.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Rules</text><rect x="168" y="156" width="347" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="182" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Written</tspan>: laws, school rules, workplace</text><text x="182" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">contracts</text><rect x="523" y="156" width="347" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="537" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Unwritten</tspan>: norms everyone knows, e.g.</text><text x="537" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">not interrupting, saying thank you,</text><text x="537" y="228.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">dressing appropriately at a funeral</text><rect x="30" y="257" width="130" height="114" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="319.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Agents</text><rect x="168" y="257" width="347" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="182" y="287.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Police; courts and the judiciary;</text><text x="182" y="308.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">prisons and probation; government and</text><text x="182" y="329.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the legislature; schools and employers</text><text x="182" y="350.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(their formal rules)</text><rect x="523" y="257" width="347" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="537" y="287.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Family; peer group; workplace</text><text x="537" y="308.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">colleagues; religion; media</text><rect x="30" y="379" width="130" height="93" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="430.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Examples</text><rect x="168" y="379" width="347" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="182" y="409.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Stop and search, arrest, caution,</text><text x="182" y="430.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sentence, disciplinary procedure</text><rect x="523" y="379" width="347" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="537" y="409.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Grounding, teasing, exclusion from the</text><text x="537" y="430.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">group, cold-shouldering, approval of a</text><text x="537" y="451.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">faith community</text><rect x="30" y="488" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="524" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Not about seriousness</text><text x="56" y="553" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The difference is whether rules are written and enforced by official agents, not how serious</text><text x="56" y="575" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">they are.</text>
</svg>