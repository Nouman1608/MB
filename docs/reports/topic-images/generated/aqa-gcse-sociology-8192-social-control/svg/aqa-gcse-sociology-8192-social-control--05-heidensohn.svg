<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 685" width="900" height="685" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="685" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Heidensohn: women and crime (1985)</text>

<rect x="30" y="108" width="840" height="84" rx="12" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="142" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Patriarchal societies control women more effectively than men</text><text x="450" y="172" font-size="16" font-weight="400" fill="#ffffff" text-anchor="middle">so it is harder for women to break the law (control theory)</text><line x1="170" y1="196" x2="170" y2="222" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="450" y1="196" x2="450" y2="222" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="730" y1="196" x2="730" y2="222" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="226" width="269.3333333333333" height="276" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,276 L31.25,240.25 Q31.25,227.25 44.25,227.25 L285.0833333333333,227.25 Q298.0833333333333,227.25 298.0833333333333,240.25 L298.0833333333333,276 Z" fill="#b5d3cf"/><line x1="31.25" y1="276" x2="298.0833333333333" y2="276" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="257" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">In the home</text><circle cx="49" cy="301.92" r="4.5" fill="#2e6b62"/><text x="62" y="307.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Housework and childcare</text><text x="62" y="328.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">leave little time for crime</text><circle cx="49" cy="351.92" r="4.5" fill="#2e6b62"/><text x="62" y="357.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Challenging expectations</text><text x="62" y="378.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">risks male violence</text><circle cx="49" cy="401.92" r="4.5" fill="#2e6b62"/><text x="62" y="407.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Breadwinners’ financial</text><text x="62" y="428.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">power over wives</text><circle cx="49" cy="451.92" r="4.5" fill="#2e6b62"/><text x="62" y="457.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Daughters more closely</text><text x="62" y="478.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">controlled than sons</text><rect x="315.3333333333333" y="226" width="269.3333333333333" height="276" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,276 L316.5833333333333,240.25 Q316.5833333333333,227.25 329.5833333333333,227.25 L570.4166666666666,227.25 Q583.4166666666666,227.25 583.4166666666666,240.25 L583.4166666666666,276 Z" fill="#dce9e7"/><line x1="316.5833333333333" y1="276" x2="583.4166666666666" y2="276" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="257" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">In public</text><circle cx="334.3333333333333" cy="301.92" r="4.5" fill="#2e6b62"/><text x="347.3333333333333" y="307.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Threat of male sexual</text><text x="347.3333333333333" y="328.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">violence discourages going</text><text x="347.3333333333333" y="349.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">out alone at night</text><circle cx="334.3333333333333" cy="372.92" r="4.5" fill="#2e6b62"/><text x="347.3333333333333" y="378.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fear of losing reputation</text><text x="347.3333333333333" y="399.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and shaming the family</text><circle cx="334.3333333333333" cy="422.92" r="4.5" fill="#2e6b62"/><text x="347.3333333333333" y="428.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Separate spheres:</tspan> women who</text><text x="347.3333333333333" y="449.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">speak out may be ridiculed</text><rect x="600.6666666666666" y="226" width="269.3333333333333" height="276" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,276 L601.9166666666666,240.25 Q601.9166666666666,227.25 614.9166666666666,227.25 L855.75,227.25 Q868.75,227.25 868.75,240.25 L868.75,276 Z" fill="#f2e7b8"/><line x1="601.9166666666666" y1="276" x2="868.75" y2="276" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="257" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">At work</text><circle cx="619.6666666666666" cy="301.92" r="4.5" fill="#2e6b62"/><text x="632.6666666666666" y="307.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Male-dominated hierarchies</text><text x="632.6666666666666" y="328.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and workers’ organisations</text><text x="632.6666666666666" y="349.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">keep women subordinate</text><circle cx="619.6666666666666" cy="372.92" r="4.5" fill="#2e6b62"/><text x="632.6666666666666" y="378.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sexual harassment</text><text x="632.6666666666666" y="399.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">intimidates women</text><rect x="30" y="520" width="840" height="141" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="556" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluation</text><circle cx="61" cy="579.39" r="4.5" fill="#8a6d0d"/><text x="74" y="585" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Generalisations may not apply to all women; claims not always backed by strong research</text><text x="74" y="607" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">evidence</text><circle cx="61" cy="631.39" r="4.5" fill="#8a6d0d"/><text x="74" y="637" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">May apply less today, though harassment and domestic violence persist</text>
</svg>