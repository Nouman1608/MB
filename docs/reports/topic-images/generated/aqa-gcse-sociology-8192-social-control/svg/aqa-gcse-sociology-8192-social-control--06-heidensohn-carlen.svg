<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 447" width="900" height="447" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="447" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Heidensohn and Carlen: two sides of control theory</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Both: people choose crime when the advantages outweigh the disadvantages</text>
<rect x="30" y="120" width="404" height="194" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,170 L31.25,134.25 Q31.25,121.25 44.25,121.25 L419.75,121.25 Q432.75,121.25 432.75,134.25 L432.75,170 Z" fill="#b5d3cf"/><line x1="31.25" y1="170" x2="432.75" y2="170" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="150.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Heidensohn (3.5.2)</text><circle cx="53" cy="200.79" r="4.5" fill="#2e6b62"/><text x="66" y="206.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Explains <tspan font-weight="700">conformity</tspan></text><circle cx="53" cy="230.79" r="4.5" fill="#2e6b62"/><text x="66" y="236.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Patriarchal control keeps most women from</text><text x="66" y="258.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">crime</text><circle cx="53" cy="282.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="288.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">At home, in public and at work</text><rect x="466" y="120" width="404" height="194" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,170 L467.25,134.25 Q467.25,121.25 480.25,121.25 L855.75,121.25 Q868.75,121.25 868.75,134.25 L868.75,170 Z" fill="#f2e7b8"/><line x1="467.25" y1="170" x2="868.75" y2="170" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="150.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Carlen (3.5.3)</text><circle cx="489" cy="200.79" r="4.5" fill="#8a6d0d"/><text x="502" y="206.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Explains <tspan font-weight="700">its breakdown</tspan></text><circle cx="489" cy="230.79" r="4.5" fill="#8a6d0d"/><text x="502" y="236.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Some working-class women offend when</text><text x="502" y="258.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">promised rewards fail</text><circle cx="489" cy="282.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="288.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The class deal and the gender deal</text><circle cx="450" cy="217" r="24" fill="#1e2a44"/><text x="450" y="224" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">vs</text><rect x="30" y="332" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="368" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Common mistake</text><text x="56" y="397" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Do not confuse Heidensohn (why women conform) with Carlen (why some women offend).</text>
</svg>