<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 564" width="900" height="564" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="564" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why most people conform</text>

<rect x="30" y="120" width="840" height="110" rx="16" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="160" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Socialisation</text><text x="450" y="190" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">Norms are internalised: most people conform because they have learned to</text><line x1="450" y1="234" x2="450" y2="260" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="95" y="266" width="710" height="110" rx="16" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="306" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Informal control</text><text x="450" y="336" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">Family, peers, colleagues, religion and media keep most people in line</text><line x1="450" y1="380" x2="450" y2="406" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="160" y="412" width="580" height="110" rx="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="452" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Formal control</text><text x="450" y="482" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">Needed only when informal control fails</text><text x="40" y="180" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">most</text><text x="40" y="200" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">of the</text><text x="40" y="220" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">time</text>
</svg>