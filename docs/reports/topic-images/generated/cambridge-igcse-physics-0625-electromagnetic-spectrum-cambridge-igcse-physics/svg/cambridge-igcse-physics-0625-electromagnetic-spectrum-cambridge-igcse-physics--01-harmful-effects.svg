<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Harmful effects of excessive exposure</text>

<rect x="30" y="110" width="840" height="460" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="190" y="150" width="500" height="64" rx="12" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="212" y="190" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Microwaves</text><text x="360" y="190" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">internal heating of body cells</text><rect x="190" y="228" width="500" height="64" rx="12" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2"/><text x="212" y="268" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Infrared</text><text x="360" y="268" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">skin burns</text><rect x="190" y="306" width="500" height="64" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="212" y="346" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Ultraviolet</text><text x="360" y="334" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">damage to surface cells and eyes → skin</text><text x="360" y="356" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cancer, eye conditions</text><rect x="190" y="384" width="500" height="64" rx="12" fill="#b5d3cf" stroke="#c9d6d4" stroke-width="2"/><text x="212" y="424" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">X-rays</text><text x="360" y="424" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mutation or damage to cells in the body</text><rect x="190" y="462" width="500" height="64" rx="12" fill="#b5d3cf" stroke="#c9d6d4" stroke-width="2"/><text x="212" y="502" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Gamma rays</text><text x="360" y="502" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mutation or damage to cells in the body</text><path d="M708,150 q14,0 14,14 L722,213 l10,8 l-10,8 L722,278 q0,14 -14,14" fill="none" stroke="#8a6d0d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="744" y="217" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">harm by</text><text x="744" y="239" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">heating</text><path d="M708,306 q14,0 14,14 L722,330 l10,8 l-10,8 L722,356 q0,14 -14,14" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="744" y="334" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">surface</text><text x="744" y="356" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">(skin, eyes)</text><path d="M708,384 q14,0 14,14 L722,447 l10,8 l-10,8 L722,512 q0,14 -14,14" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="744" y="451" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">reach cells</text><text x="744" y="473" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">inside body</text><line x1="150" y1="150" x2="150" y2="520" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="128" y="335" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 128 335)">frequency increases</text>
