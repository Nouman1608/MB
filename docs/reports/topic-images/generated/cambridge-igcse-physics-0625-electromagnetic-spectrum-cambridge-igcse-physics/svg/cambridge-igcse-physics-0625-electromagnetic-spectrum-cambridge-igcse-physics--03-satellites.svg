<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 678" width="900" height="678" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="678" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Satellite communication: mainly microwaves</text>

<rect x="30" y="110" width="420" height="538" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="220" cy="330" r="60" fill="#a9c48f" stroke="#1e2a44" stroke-width="3"/><text x="220" y="336" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Earth</text><circle cx="220" cy="330" r="85" fill="none" stroke="#4a5568" stroke-width="2" stroke-dasharray="6 5"/><circle cx="220" cy="330" r="160" fill="none" stroke="#2e6b62" stroke-width="2.5"/><rect x="373" y="323" width="14" height="14" rx="0" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text paint-order="stroke" stroke="#ffffff" stroke-width="6" x="370" y="366" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">geostationary</text><rect x="128" y="263" width="12" height="12" rx="0" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text paint-order="stroke" stroke="#ffffff" stroke-width="6" x="134" y="248" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">low orbit</text><path d="M152.1,475.2 L138.1,459.0 L130.9,472.2 Z" fill="#2e6b62"/><path d="M134.5,194.4 L155.7,191.4 L148.5,178.2 Z" fill="#2e6b62"/><path d="M142.3,365.8 L143.2,344.4 L128.9,349.1 Z" fill="#4a5568"/><path d="M180,402 A82,82 0 0 0 260,402" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#ah)"/><text paint-order="stroke" stroke="#ffffff" stroke-width="6" x="220" y="442" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Earth rotates</text><text x="220" y="525" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">not to scale; Earth seen from above a pole</text><rect x="470" y="110" width="400" height="168" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="488" y="160.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Geostationary: once every</text><text x="488" y="186.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">24 hours above the equator,</text><text x="488" y="212.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">same direction as the Earth</text><text x="488" y="238.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">rotates; a fixed dish points at it</text><rect x="470" y="292" width="400" height="160" rx="12" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="488" y="338.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Low orbit: close, so a short</text><text x="488" y="364.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">signal path, but it moves across</text><text x="488" y="390.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">the sky, so a network of many</text><text x="488" y="416.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">satellites is needed</text><rect x="470" y="470" width="400" height="178" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="490" y="506" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Worked example 2 (Extended)</text><text x="490" y="540" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">up 3.6 × 10⁷ m, down 3.6 × 10⁷ m</text><text x="490" y="570" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">distance = 7.2 × 10⁷ m</text><text x="490" y="600" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">t = 7.2 × 10⁷ / 3.0 × 10⁸</text><text x="490" y="630" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">= 0.24 s</text>
</svg>