<rect width="900" height="482" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Compare like with like</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Bus or bicycle: each object measured on the same category</text>
<text x="150" y="132" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle" xml:space="preserve">CATEGORY</text><text x="420" y="132" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">BUS</text><text x="680" y="132" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle" xml:space="preserve">BICYCLE</text><rect x="30" y="148" width="240" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="44" y="186.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Cost</tspan> <tspan font-weight="700">per</tspan> <tspan font-weight="700">journey</tspan></text><rect x="300" y="148" width="240" height="66" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="420" y="186.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">£1.80</text><rect x="560" y="148" width="240" height="66" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="680" y="186.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">£0.10 for repairs and lights</text><circle cx="840" cy="181" r="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="840" y="188" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">✓</text><rect x="30" y="226" width="240" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="44" y="264.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Time</tspan> <tspan font-weight="700">for</tspan> <tspan font-weight="700">a</tspan> <tspan font-weight="700">5</tspan> <tspan font-weight="700">km</tspan> <tspan font-weight="700">journey</tspan></text><rect x="300" y="226" width="240" height="66" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="420" y="253.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">25 minutes including</text><text x="420" y="274.71999999999997" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">waiting</text><rect x="560" y="226" width="240" height="66" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="680" y="264.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">20 minutes</text><circle cx="840" cy="259" r="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="840" y="266" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">✓</text><rect x="30" y="304" width="240" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="44" y="342.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Reliability</tspan></text><rect x="300" y="304" width="240" height="66" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="420" y="342.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Bus can be late</text><rect x="560" y="304" width="240" height="66" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="680" y="342.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“Fun”</text><circle cx="840" cy="337" r="20" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="840" y="344" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">✗</text><rect x="30" y="388" width="840" height="74.24000000000001" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" /><text x="450" y="419.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">Last</tspan> <tspan font-weight="700" fill="#b5602e">row</tspan> <tspan font-weight="700" fill="#b5602e">fails:</tspan> reliability is set against enjoyment. Compare both on reliability, or both on enjoyment.</text><text x="450" y="440.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Categories must also be <tspan font-weight="700">relevant</tspan> <tspan font-weight="700">to</tspan> <tspan font-weight="700">the</tspan> <tspan font-weight="700">claim</tspan>.</text>
</svg>