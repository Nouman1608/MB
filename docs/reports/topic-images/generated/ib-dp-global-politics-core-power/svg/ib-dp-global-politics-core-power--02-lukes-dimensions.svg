<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="600" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Lukes: three dimensions of power</text>

<rect x="30" y="120" width="840" height="120" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="450" y="174.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">1st dimension: open decisions</text><text x="450" y="202.07" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">winning visible decisions; Dahl (1957): A gets B to do what B would not otherwise do</text><rect x="80" y="260" width="740" height="120" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="450" y="314.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">2nd dimension: the agenda</text><text x="450" y="342.07" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">“non-decisions” keep issues off the agenda (Bachrach and Baratz)</text><rect x="130" y="400" width="640" height="120" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="450" y="454.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">3rd dimension: shaping wants</text><text x="450" y="482.07" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">people’s wants are shaped so conflict never appears</text><line x1="890" y1="140" x2="890" y2="500" stroke="#1e2a44" stroke-width="0"/><text x="450" y="568" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">more hidden ↓   harder to see, and to classify</text>
</svg>