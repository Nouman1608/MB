<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Hard, smart and soft power</text>

<defs><linearGradient id="hs" x1="0" x2="1"><stop offset="0" stop-color="#efcdb8"/><stop offset="0.5" stop-color="#f2e7b8"/><stop offset="1" stop-color="#dce9e7"/></linearGradient></defs><rect x="30" y="120" width="840" height="56" rx="28" fill="url(#hs)" stroke="#1e2a44" stroke-width="2.2"/><text x="60" y="156" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">coercion</text><text x="450" y="156" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">eclectic mix</text><text x="840" y="156" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="end">persuasion, attraction</text><rect x="30" y="200" width="270" height="300" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="48" y="238.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Hard power</text><text x="48" y="265.36" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">force, threats, penalties;</text><text x="48" y="285.82" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">guide: military interventions,</text><text x="48" y="306.28000000000003" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">economic sanctions</text><text x="48" y="326.74" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start"></text><text x="48" y="347.20000000000005" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">• Russia’s full-scale invasion</text><text x="48" y="367.66" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">of Ukraine, Feb 2022</text><text x="48" y="388.12" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">(military)</text><text x="48" y="408.58000000000004" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">• EU, UK, US sanctions on</text><text x="48" y="429.04" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Russia (economic)</text><rect x="315" y="200" width="270" height="300" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="333" y="238.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Smart power</text><text x="333" y="265.36" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">hard and soft chosen to fit</text><text x="333" y="285.82" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">the aim; guide: climate</text><text x="333" y="306.28000000000003" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">change, negotiations</text><text x="333" y="326.74" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start"></text><text x="333" y="347.20000000000005" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">• JCPOA (2015): years of</text><text x="333" y="367.66" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">sanctions plus multilateral</text><text x="333" y="388.12" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">diplomacy</text><text x="333" y="408.58000000000004" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">• EU climate lead by example</text><text x="333" y="429.04" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">plus its Carbon Border</text><text x="333" y="449.5" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Adjustment Mechanism (Oct</text><text x="333" y="469.96000000000004" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">2023)</text><rect x="600" y="200" width="270" height="300" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="618" y="238.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Soft power</text><text x="618" y="265.36" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">culture, political values,</text><text x="618" y="285.82" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">legitimate foreign policy</text><text x="618" y="306.28000000000003" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">(Nye); guide: cultural</text><text x="618" y="326.74" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">influence, ideology, aid</text><text x="618" y="347.20000000000005" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start"></text><text x="618" y="367.66" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">• Korean Wave: K-pop and film</text><text x="618" y="388.12" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">• Parasite: first</text><text x="618" y="408.58000000000004" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">non-English-language Best</text><text x="618" y="429.04" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Picture Oscar, 2020</text>
</svg>