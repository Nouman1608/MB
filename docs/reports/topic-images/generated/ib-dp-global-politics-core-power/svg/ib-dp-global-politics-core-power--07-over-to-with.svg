<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="610" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Power over, power to, power with</text>

<rect x="30" y="110" width="270" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165" y="148" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">Power over</text><text x="165" y="410" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">control of others: getting</text><text x="165" y="431" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">them to do what they would not</text><text x="165" y="452" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">choose</text><text x="165" y="490" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">sanctions; military threats</text><text x="165" y="509" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">(Dahl, Lukes)</text><circle cx="165" cy="215" r="30" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="165" y="222" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><line x1="165" y1="249" x2="165" y2="305" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><circle cx="165" cy="340" r="26" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="165" y="347" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><rect x="315" y="110" width="270" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="148" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">Power to</text><text x="450" y="410" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">capacity to act or achieve</text><text x="450" y="431" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">something</text><text x="450" y="490" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">a state vaccinating its</text><text x="450" y="509" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">population; citizens voting</text><text x="450" y="528" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">(Pitkin)</text><circle cx="400" cy="280" r="30" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="400" y="287" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><line x1="434" y1="280" x2="492" y2="280" stroke="#8a6d0d" stroke-width="5" marker-end="url(#ahO)"/><rect x="496" y="250" width="40" height="60" rx="6" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="516" y="287" font-size="22" font-weight="700" fill="#8a6d0d" text-anchor="middle">✓</text><rect x="600" y="110" width="270" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="735" y="148" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">Power with</text><text x="735" y="410" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">collective power built through</text><text x="735" y="431" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">cooperation</text><text x="735" y="490" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">AOSIS (1990) pushed the 1.5°C</text><text x="735" y="509" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">goal in the Paris Agreement</text><text x="735" y="528" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">(Follett, Arendt)</text><circle cx="700" cy="240" r="24" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="770" cy="240" r="24" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="700" cy="310" r="24" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="770" cy="310" r="24" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="735" cy="275" r="92" fill="none" stroke="#2e6b62" stroke-width="3" stroke-dasharray="8 6"/>
</svg>