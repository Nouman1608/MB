<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 603" width="900" height="603" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="603" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Economic, political, social and cultural power</text>

<rect x="30" y="115" width="410" height="185" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="154.85" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Economic</text><text x="48" y="181.97" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">rests on: money, markets, trade, supply chains</text><text x="48" y="203.09" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"></text><text x="48" y="224.21" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">e.g. US advanced-chip export controls (Oct</text><text x="48" y="245.32999999999998" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">2022); China’s gallium and germanium controls</text><text x="48" y="266.45" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(2023)</text><rect x="460" y="115" width="410" height="185" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="478" y="154.85" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Political</text><text x="478" y="181.97" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">rests on: authority to make and enforce</text><text x="478" y="203.09" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">binding decisions</text><text x="478" y="224.21" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"></text><text x="478" y="245.32999999999998" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">e.g. Security Council resolutions; the EU</text><text x="478" y="266.45" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">setting single-market rules</text><rect x="30" y="315" width="410" height="185" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="48" y="354.85" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Social</text><text x="48" y="381.97" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">rests on: networks, norms, status,</text><text x="48" y="403.09000000000003" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">mobilisation</text><text x="48" y="424.21000000000004" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"></text><text x="48" y="445.33000000000004" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">e.g. ICAN, 2017 Nobel Peace Prize</text><rect x="460" y="315" width="410" height="185" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="354.85" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Cultural</text><text x="478" y="381.97" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">rests on: shaping values, identity and taste</text><text x="478" y="403.09000000000003" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"></text><text x="478" y="424.21000000000004" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">e.g. Hollywood, Bollywood, the Korean Wave;</text><text x="478" y="445.33000000000004" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reach of English</text><rect x="30" y="520" width="840" height="52.44" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="551.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Types overlap (sanctions are economic AND hard): say which dominates in your case, and why.</text>
</svg>