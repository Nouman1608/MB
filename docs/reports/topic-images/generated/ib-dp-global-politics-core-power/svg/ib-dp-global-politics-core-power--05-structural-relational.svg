<rect width="900" height="645" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Structural and relational power</text>

<rect x="30" y="110" width="410" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="148" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Structural power</text><text x="235" y="172" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">from POSITION in a system</text><path d="M235,195 L355,275 L115,275 Z" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="235" cy="232" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="235" y="310" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">permanent Security Council seat:</text><text x="235" y="332" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">veto under Article 27</text><text x="235" y="354" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">head of state’s office</text><text x="235" y="415" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">linked to Susan Strange</text><rect x="460" y="110" width="410" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="148" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Relational power</text><text x="665" y="172" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">from TIES between actors</text><line x1="600" y1="215" x2="665" y2="250" stroke="#2e6b62" stroke-width="2"/><line x1="730" y1="215" x2="665" y2="250" stroke="#2e6b62" stroke-width="2"/><line x1="560" y1="270" x2="665" y2="250" stroke="#2e6b62" stroke-width="2"/><line x1="770" y1="270" x2="665" y2="250" stroke="#2e6b62" stroke-width="2"/><line x1="600" y1="215" x2="560" y2="270" stroke="#2e6b62" stroke-width="2"/><line x1="730" y1="215" x2="770" y2="270" stroke="#2e6b62" stroke-width="2"/><line x1="600" y1="215" x2="730" y2="215" stroke="#2e6b62" stroke-width="2"/><circle cx="600" cy="215" r="13" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><circle cx="730" cy="215" r="13" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><circle cx="560" cy="270" r="13" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><circle cx="770" cy="270" r="13" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><circle cx="665" cy="250" r="13" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="665" y="320" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">NATO Article 5: Finland (2023)</text><text x="665" y="341" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">and Sweden (2024) joined</text><text x="665" y="362" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">Fridays for Future: from one</text><text x="665" y="383" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">school strike (2018) to a global movement</text><text x="30" y="480" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">They interact: Ukraine, 2022</text><rect x="30" y="495" width="256" height="120" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="158" y="539.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">25 Feb: Russian veto</text><text x="158" y="565.4" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">structural block in the</text><text x="158" y="585.1999999999999" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Security Council</text><line x1="289" y1="555" x2="317" y2="555" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="322" y="495" width="256" height="120" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="450" y="527.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2 Mar: 141 states in</text><text x="450" y="551.36" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">the GA</text><text x="450" y="577.1600000000001" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">demand Russian withdrawal:</text><text x="450" y="596.96" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">relational pressure</text><line x1="581" y1="555" x2="609" y2="555" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="614" y="495" width="256" height="120" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="742" y="539.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">April 2022</text><text x="742" y="565.4" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">the Assembly agrees to meet</text><text x="742" y="585.1999999999999" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">after any veto is cast</text>
</svg>