<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 615" width="900" height="615" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="615" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Power as capacity or as relationship</text>

<rect x="30" y="110" width="410" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="148" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Capacity view</text><text x="235" y="172" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">power is what an actor HAS</text><rect x="60" y="200" width="160" height="60" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="140" y="237.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">troops</text><rect x="240" y="200" width="160" height="60" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="320" y="237.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">money</text><rect x="60" y="276" width="160" height="60" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="140" y="313.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">votes</text><rect x="240" y="276" width="160" height="60" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="320" y="313.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">ideas</text><text x="235" y="385" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle">countable and comparable</text><rect x="460" y="110" width="410" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="148" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Relational view</text><text x="665" y="172" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">power exists BETWEEN actors</text><circle cx="560" cy="275" r="50" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="560" y="281" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><circle cx="770" cy="275" r="50" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="770" y="281" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><line x1="614" y1="275" x2="716" y2="275" stroke="#2e6b62" stroke-width="4" stroke-dasharray="8 6"/><text x="665" y="360" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">a large army gives no power over a state that</text><text x="665" y="381" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">does not fear it</text><text x="30" y="450" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Resources do not guarantee outcomes</text><rect x="30" y="465" width="360" height="120" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="210" y="508.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Resources</text><text x="210" y="535.67" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">US troops in Afghanistan for almost 20</text><text x="210" y="556.79" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">years</text><line x1="394" y1="525" x2="496" y2="525" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)" stroke-dasharray="10 7"/><text x="445" y="512" font-size="22" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><rect x="510" y="465" width="360" height="120" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="690" y="508.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Outcome</text><text x="690" y="535.67" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Taliban took Kabul on 15 August 2021 as</text><text x="690" y="556.79" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">US forces withdrew</text>
</svg>