bel</text><rect x="30" y="456.91999999999996" width="840" height="116.6" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="84" cy="515.2199999999999" r="28" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="84" y="525.3" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="136" y="496.77" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Conclude</text><text x="136" y="522.49" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the same aid can be soft or hard depending on how it is used and seen: a limit of</text><text x="136" y="544.9300000000001" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the hard/soft split</text>
