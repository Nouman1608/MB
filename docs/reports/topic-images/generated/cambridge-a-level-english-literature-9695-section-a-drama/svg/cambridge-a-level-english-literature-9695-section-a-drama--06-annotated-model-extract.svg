<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 786" width="900" height="786" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="786" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading the model extract as theatre</text>

<rect x="30" y="120" width="840" height="252" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="150" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Original extract, written for the guide</text><text x="54" y="190" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">HELEN:</text><rect x="149" y="168" width="621.4492" height="31" rx="5" fill="#f2e7b8"/><text x="154" y="190" font-size="17" font-weight="400" fill="#8a6d0d" text-anchor="start" font-style="italic">(setting down two cups, then moving one away from his side of the table)</text><text x="154" y="224" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">You’re early.</text><text x="54" y="268" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">MARCUS:</text><text x="154" y="268" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">The train was early.</text><text x="54" y="312" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">HELEN:</text><rect x="149" y="290" width="223.20999999999998" height="31" rx="5" fill="#b5d3cf"/><text x="154" y="312" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Trains are never early.</text><rect x="383.21" y="290" width="81.9352" height="31" rx="5" fill="#dce9e7"/><text x="388.21" y="312" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">(Pause.)</text><text x="479.1452" y="312" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Sit down,</text><rect x="571.5752" y="290" width="176.85999999999999" height="31" rx="5" fill="#f6e3d6"/><text x="576.5752" y="312" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">if you’re staying.</text><circle cx="792.4492" cy="183" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="792.4492" y="188.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><circle cx="263.105" cy="338" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="263.105" y="343.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><circle cx="426.6776" cy="338" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="426.6776" y="343.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><circle cx="662.5052000000001" cy="338" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="662.5052000000001" y="343.04" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="76" y="394" width="366" height="117" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="90" y="422.4" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">Staged before it is spoken</text><text x="90" y="450.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The audience watches her withdraw a</text><text x="90" y="471.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">welcome she had prepared: a reversal that</text><text x="90" y="492.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">needs no dialogue.</text><circle cx="50" cy="452.5" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="50" y="458.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="504" y="394" width="366" height="117" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="518" y="422.4" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">A flat contradiction</text><text x="518" y="450.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“Trains are never early” contradicts him</text><text x="518" y="471.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">outright.</text><circle cx="478" cy="452.5" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="478" y="458.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="76" y="525" width="366" height="117" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="90" y="553.4" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">What is left unsaid</text><text x="90" y="581.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The pause lets the accusation hang</text><text x="90" y="602.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">without being named.</text><circle cx="50" cy="583.5" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="50" y="589.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="504" y="525" width="366" height="117" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="518" y="553.4" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">An invitation turned challenge</text><text x="518" y="581.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The conditional “if you’re staying”</text><text x="518" y="602.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">places the decision, and the blame, on</text><text x="518" y="623.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">him.</text><circle cx="478" cy="583.5" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="478" y="589.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="30" y="660" width="840" height="102" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="693.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The paragraph quotes a stage direction as evidence, explains the effect on an audience,</text><text x="50" y="715.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">notices what is left unsaid and ends on an interpretation. A real answer would then link</text><text x="50" y="737.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the moment to a later scene.</text>
</svg>