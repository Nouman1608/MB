<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 784" width="900" height="784" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="784" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The (b) passage answer in four moves</text>

<text x="30" y="124" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">The whole play</text><rect x="30" y="190" width="84" height="54" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><rect x="114" y="190" width="84" height="54" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><rect x="198" y="190" width="84" height="54" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><rect x="282" y="190" width="84" height="54" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><rect x="366" y="190" width="84" height="54" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="450" y="190" width="84" height="54" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><rect x="534" y="190" width="84" height="54" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><rect x="618" y="190" width="84" height="54" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><rect x="702" y="190" width="84" height="54" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><rect x="786" y="190" width="84" height="54" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="408" y="224" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">passage</text><path d="M408,186 Q282,130 156,184" fill="none" stroke="#2e6b62" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#ahT)"/><text x="156" y="270" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">echo</text><path d="M408,186 Q492,156 576,184" fill="none" stroke="#2e6b62" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#ahT)"/><text x="576" y="270" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">contrast</text><path d="M408,186 Q618,98 828,184" fill="none" stroke="#2e6b62" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#ahT)"/><text x="828" y="270" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">reversal</text><text x="870" y="124" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="end">look outward two or three times</text><line x1="62" y1="314" x2="62" y2="740" stroke="#c9d6d4" stroke-width="4"/><rect x="108" y="294" width="762" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="329.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Place it</text><text x="128" y="357.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">In one or two sentences: where the passage falls and what the audience knows at this</text><text x="128" y="378.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">point. This sets up dramatic irony and shows AO1 without retelling the plot.</text><circle cx="62" cy="348.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="357.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="108" y="413" width="762" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="128" y="448.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Find its dramatic function</text><text x="128" y="476.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Does it turn the action, reveal a character, build tension or release it? This becomes</text><text x="128" y="497.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">your thesis.</text><circle cx="62" cy="467.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="476.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="108" y="532" width="762" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="567.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Move through it purposefully</text><text x="128" y="595.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Follow the passage’s own shape: how it opens, where it shifts, how it ends. Do not list</text><text x="128" y="616.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">techniques in any order.</text><circle cx="62" cy="586.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="595.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="108" y="651" width="762" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="686.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Look outward</text><text x="128" y="714.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Two or three times, connect a detail to another moment in the play: an echo, a</text><text x="128" y="735.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">contrast, a reversal.</text><circle cx="62" cy="705.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="714.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text>
</svg>