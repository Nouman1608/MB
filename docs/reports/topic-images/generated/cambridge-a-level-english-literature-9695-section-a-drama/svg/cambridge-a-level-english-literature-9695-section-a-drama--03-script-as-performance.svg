<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A script is a set of instructions for performance</text>

<rect x="30" y="116" width="300" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="180" y="156" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">A novel</text><path d="M110,186 L180,198 L250,186 L250,276 L180,288 L110,276 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><line x1="180" y1="198" x2="180" y2="288" stroke="#1e2a44" stroke-width="2.5"/><line x1="180" y1="298" x2="180" y2="338" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><path d="M97,344 L263,344 Q275,344 275,356 L275,382 Q275,394 263,394 L119,394 L101,410 L105,394 L97,394 Q85,394 85,382 L85,356 Q85,344 97,344 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="180" y="376" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Narrator</text><line x1="180" y1="416" x2="180" y2="452" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="180" y="478" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">tells the reader</text><text x="180" y="502" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">what to think</text><rect x="360" y="116" width="510" height="420" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="615" y="156" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="middle">A play: no narrator</text><rect x="400" y="182" width="430" height="170" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5"/><path d="M400,182 L440,212 L790,212 L830,182" fill="none" stroke="#9c8f6e" stroke-width="2"/><path d="M760,184 L680,344 L800,344 Z" fill="#f2e7b8" opacity="0.9"/><path d="M503,342 L508,290 Q520,280 532,290 L537,342 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="520" cy="270" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><path d="M723,342 L728,290 Q740,280 752,290 L757,342 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="740" cy="270" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="595" y="306" width="48" height="36" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><path d="M432,222 L488,222 Q500,222 500,234 L500,244 Q500,256 488,256 L454,256 L436,272 L440,256 L432,256 Q420,256 420,244 L420,234 Q420,222 432,222 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="460" y="245" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">“…”</text><line x1="550" y1="312" x2="580" y2="312" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><rect x="388" y="372" width="78" height="31" rx="15.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="427" y="392.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">speech</text><rect x="474" y="372" width="86" height="31" rx="15.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="517" y="392.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">silence</text><rect x="568" y="372" width="95" height="31" rx="15.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="615.5" y="392.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">movement</text><rect x="671" y="372" width="86" height="31" rx="15.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="714" y="392.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">objects</text><rect x="765" y="372" width="69" height="31" rx="15.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="799.5" y="392.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">light</text><rect x="388" y="412" width="69" height="31" rx="15.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="422.5" y="432.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">sound</text><rect x="465" y="412" width="155" height="31" rx="15.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="542.5" y="432.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">order of scenes</text><text x="430" y="511" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">The audience</text><path d="M560,505 Q582,487 604,505 Q582,523 560,505 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="582" cy="505" r="7" fill="#2e6b62"/><text x="612" y="511" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">sees</text><path d="M672,519 Q666,489 684,487 Q698,489 694,505 Q690,513 684,517 Q680,525 672,519" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M678,507 Q678,497 686,497" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="705" y="511" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">and hears</text><rect x="30" y="556" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="589.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">These are the dramatist’s choices. AO2 asks you to analyse a writer’s choices of language,</text><text x="50" y="611.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">form and structure, so keep the stage in view.</text>
