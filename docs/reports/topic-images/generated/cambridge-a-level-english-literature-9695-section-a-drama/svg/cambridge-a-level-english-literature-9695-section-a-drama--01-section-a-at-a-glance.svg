<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 737" width="900" height="737" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="737" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Paper 1 Section A at a glance</text>

<text x="30" y="118" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Paper 1 · 50 marks</text><rect x="30" y="130" width="420" height="74" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="240" y="162" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Section A: Drama</text><text x="240" y="188" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">25 marks · one essay</text><rect x="450" y="130" width="420" height="74" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="660" y="162" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Section B: Poetry</text><text x="660" y="188" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">25 marks</text><rect x="30" y="130" width="840" height="74" fill="none" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="222" width="380" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="255" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">QUESTION (a)</text><text x="50" y="282" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Essay on the whole play</text><text x="50" y="311.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="311.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Nothing is printed.</text><text x="50" y="338.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="338.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Range across the play from memory.</text><rect x="490" y="222" width="380" height="170" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="510" y="255" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">QUESTION (b)</text><text x="510" y="282" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Printed passage</text><text x="510" y="311.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="526.15" y="311.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Analyse the passage closely.</text><text x="510" y="338.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="526.15" y="338.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Relate it to the rest of the play.</text><circle cx="450" cy="307" r="30" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="314" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">or</text><text x="450" y="426" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">On each set play you choose one. Both need an essay-length answer.</text><text x="30" y="474" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Assessed on AO1 to AO4 only</text><rect x="30" y="488" width="199.5" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="129.75" y="518.8" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">AO1</text><text x="129.75" y="548.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Knowledge and</text><text x="129.75" y="569.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">understanding, with</text><text x="129.75" y="590.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">relevant context</text><rect x="243.5" y="488" width="199.5" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="343.25" y="529.3" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">AO2</text><text x="343.25" y="559.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Analysis of the</text><text x="343.25" y="580.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">dramatist’s choices</text><rect x="457" y="488" width="199.5" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="556.75" y="529.3" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">AO3</text><text x="556.75" y="559.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">An informed personal</text><text x="556.75" y="580.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">response</text><rect x="670.5" y="488" width="199.5" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="770.25" y="529.3" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">AO4</text><text x="770.25" y="559.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">A structured,</text><text x="770.25" y="580.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">supported argument</text><rect x="30" y="627" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="660.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">You cannot take the play into the exam: know it well enough to refer to scenes and quote</text><text x="50" y="682.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">short phrases from memory.</text>
</svg>