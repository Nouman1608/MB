<rect width="900" height="818" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The (a) essay: range and direction</text>

<text x="30" y="126" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">The whole play</text><rect x="30" y="144" width="840" height="50" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><rect x="76" y="144" width="76" height="50" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="114" y="220" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">opening</text><rect x="328" y="144" width="76" height="50" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="366" y="220" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">middle</text><rect x="563.2" y="144" width="76" height="50" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="601.2" y="220" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">later</text><rect x="764.8000000000001" y="144" width="76" height="50" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="802.8000000000001" y="220" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">ending</text><path d="M114,314 L366,288 L601.2,274 L802.8000000000001,238" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><line x1="114" y1="230" x2="114" y2="304" stroke="#c9d6d4" stroke-width="2.5" stroke-dasharray="5 5"/><line x1="366" y1="230" x2="366" y2="278" stroke="#c9d6d4" stroke-width="2.5" stroke-dasharray="5 5"/><line x1="601.2" y1="230" x2="601.2" y2="264" stroke="#c9d6d4" stroke-width="2.5" stroke-dasharray="5 5"/><line x1="802.8000000000001" y1="230" x2="802.8000000000001" y2="228" stroke="#c9d6d4" stroke-width="2.5" stroke-dasharray="5 5"/><circle cx="114" cy="314" r="8" fill="#2e6b62"/><circle cx="366" cy="288" r="8" fill="#2e6b62"/><circle cx="601.2" cy="274" r="8" fill="#2e6b62"/><circle cx="802.8000000000001" cy="238" r="8" fill="#2e6b62"/><text x="240" y="344" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Track change: the focus develops</text><line x1="62" y1="390" x2="62" y2="774" stroke="#c9d6d4" stroke-width="4"/><rect x="108" y="370" width="762" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="405.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Thesis first</text><text x="128" y="433.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Answer the question in your opening paragraph with a clear, arguable claim.</text><circle cx="62" cy="414" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="422.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="108" y="468" width="762" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="503.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Choose three or four moments</text><text x="128" y="531.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">From different parts of the play, including the ending. Range shows AO1; selection</text><text x="128" y="552.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">shows judgement.</text><circle cx="62" cy="522.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="531.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="108" y="587" width="762" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="622.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Analyse each moment as theatre</text><text x="128" y="650.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Short, precise quotations and references to staging.</text><circle cx="62" cy="631" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="639.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="108" y="685" width="762" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="720.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Track change</text><text x="128" y="748.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Show how the focus develops, so the essay has a direction rather than a list of</text><text x="128" y="769.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">examples.</text><circle cx="62" cy="739.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="748.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text>
</svg>