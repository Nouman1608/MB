<rect width="900" height="538" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading the question’s command words</text>

<rect x="30" y="104" width="269.3333333333333" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="164.66666666666666" y="161.8" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">discuss</text><text x="164.66666666666666" y="191.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Write about an issue in</text><text x="164.66666666666666" y="212.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">depth in a structured way.</text><rect x="315.3333333333333" y="104" width="269.3333333333333" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="140.8" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">analyse</text><text x="450" y="170.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Examine in detail to show</text><text x="450" y="191.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">meaning and the</text><text x="450" y="212.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">relationship between</text><text x="450" y="233.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">elements.</text><rect x="600.6666666666666" y="104" width="269.3333333333333" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="735.3333333333333" y="172.3" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">comment</text><text x="735.3333333333333" y="202.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Give an informed opinion.</text><rect x="30" y="276" width="412" height="232" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="309" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">“HOW FAR…?”</text><text x="50" y="336" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Needs a judgement</text><text x="50" y="365.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Say to what extent you agree, then qualify</text><text x="50" y="387.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">it.</text><rect x="458" y="276" width="412" height="232" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="309" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">“IN WHAT WAYS…?”</text><text x="478" y="336" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Needs a range of methods</text><text x="478" y="365.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Cover these, not just one.</text><line x1="70" y1="450" x2="402" y2="450" stroke="#1e2a44" stroke-width="3.5" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="70" y="484" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">not at all</text><text x="402" y="484" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">entirely</text><circle cx="310" cy="450" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="310" y="430" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">your position</text><rect x="482" y="432" width="104" height="33" rx="16.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="534" y="454.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">language</text><rect x="598" y="432" width="94" height="33" rx="16.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="645" y="454.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">staging</text><rect x="704" y="432" width="114" height="33" rx="16.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="761" y="454.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">structure</text>
</svg>