<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 638" width="900" height="638" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="638" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading a script as theatre</text>

<rect x="30" y="104" width="269.3333333333333" height="328" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="133" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LANGUAGE</text><text x="46" y="159.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">What is the line</text><text x="46" y="184.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">doing?</text><text x="46" y="212.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="212.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Verse or prose: a shift,</text><text x="61.2" y="233.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">or a broken verse line,</text><text x="61.2" y="254.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">can mark status, mood or</text><text x="61.2" y="275.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">self-control.</text><text x="46" y="301.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="301.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Interruption and overlap:</text><text x="61.2" y="322.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">who controls the</text><text x="61.2" y="343.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">turn-taking?</text><text x="46" y="369.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="369.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Subtext: the gap between</text><text x="61.2" y="390.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">what is said and what is</text><text x="61.2" y="411.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">meant.</text><rect x="315.3333333333333" y="104" width="269.3333333333333" height="328" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="331.3333333333333" y="133" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">THE VISUAL STAGE</text><text x="331.3333333333333" y="159.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Stage directions are</text><text x="331.3333333333333" y="184.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">evidence</text><text x="331.3333333333333" y="212.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="346.5333333333333" y="212.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A pause, an exit, a prop</text><text x="346.5333333333333" y="233.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">that changes hands.</text><text x="331.3333333333333" y="259.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="346.5333333333333" y="259.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Embedded directions in the</text><text x="346.5333333333333" y="280.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">lines: “kneel”, “look</text><text x="346.5333333333333" y="301.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">here”, “who comes?”</text><text x="331.3333333333333" y="327.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="346.5333333333333" y="327.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A silent onlooker makes a</text><text x="346.5333333333333" y="348.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">private exchange public.</text><rect x="600.6666666666666" y="104" width="269.3333333333333" height="328" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="616.6666666666666" y="133" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRUCTURE</text><text x="616.6666666666666" y="159.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Order and knowledge</text><text x="616.6666666666666" y="187.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="631.8666666666667" y="187.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Dramatic irony: the</text><text x="631.8666666666667" y="208.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">audience knows more.</text><text x="616.6666666666666" y="234.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="631.8666666666667" y="234.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Juxtaposed scenes shape</text><text x="631.8666666666667" y="255.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">how we judge both.</text><text x="616.6666666666666" y="281.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="631.8666666666667" y="281.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Pace: short exchanges</text><text x="631.8666666666667" y="302.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">speed up, long speeches</text><text x="631.8666666666667" y="323.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">slow down.</text><text x="616.6666666666666" y="349.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="631.8666666666667" y="349.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">What is the audience left</text><text x="631.8666666666667" y="370.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">looking at?</text><rect x="30" y="450" width="840" height="158" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="483" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GENRE AND CONTEXT (AO1)</text><text x="50" y="510" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The most useful contexts are often theatrical</text><text x="50" y="539.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Revenge tragedy, romance or naturalism, and the stage the play was written for. Explain why</text><text x="50" y="561.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">a dramatist uses a convention, or breaks it: that is worth more than a paragraph of</text><text x="50" y="583.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">historical background.</text>
</svg>