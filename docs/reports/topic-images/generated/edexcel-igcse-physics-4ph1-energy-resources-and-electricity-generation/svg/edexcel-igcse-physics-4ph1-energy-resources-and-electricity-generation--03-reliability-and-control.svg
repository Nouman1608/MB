<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="560" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Can it meet demand when needed?</text>

<rect x="30" y="110" width="270" height="330" rx="14" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="165" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Variable</text><text x="165" y="170" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">depends on weather or time</text><text x="50" y="214" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Wind</text><text x="50" y="236" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">wind speed</text><text x="50" y="270" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Solar</text><text x="50" y="292" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">none at night, less if cloudy</text><text x="50" y="326" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Waves</text><text x="50" y="348" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">varies with weather</text><text x="50" y="382" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Tidal</text><text x="50" y="404" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">predictable, but varies</text><rect x="315" y="110" width="270" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Steady</text><text x="450" y="170" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">reliable, but not quick</text><text x="335" y="214" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Nuclear</text><text x="335" y="236" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">large, steady; slow to start</text><text x="335" y="270" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Geothermal</text><text x="335" y="292" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">available all the time</text><text x="335" y="326" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Coal</text><text x="335" y="348" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">reliable, large output</text><text x="335" y="382" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start"></text><text x="335" y="404" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"></text><rect x="600" y="110" width="270" height="330" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="735" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Controllable</text><text x="735" y="170" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">can rise quickly with demand</text><text x="620" y="214" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Hydroelectric</text><text x="620" y="236" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">can start very quickly</text><text x="620" y="270" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Gas-fired</text><text x="620" y="292" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">can start quickly</text><text x="620" y="326" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start"></text><text x="620" y="348" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"></text><text x="620" y="382" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start"></text><text x="620" y="404" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"></text><rect x="30" y="460" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="494" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">A grid using wind, solar and waves also needs resources that can be</text><text x="450" y="520" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">controlled, such as hydroelectric or gas, to meet a rise in demand.</text>
</svg>