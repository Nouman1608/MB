<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 805" width="900" height="805" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="805" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: a coal-fired station</text>

<path d="M80,200 L410,200 L410,500 L80,500 Z" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><path d="M410,200 L680,200 L680,182 L740,254 L680,326 L680,308 L410,308 Z" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2"/><path d="M410,308 A212,212 0 0 1 622,520 L622,580 L638,580 L526,630 L414,580 L430,580 L430,520 A20,20 0 0 0 410,500 Z" fill="#f6e3d6" stroke="#b5602e" stroke-width="2"/><text x="95" y="186" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">total: 2500 MJ each second</text><text x="680" y="170" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">electrically to the grid: 900 MJ</text><text x="652" y="560" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">wasted: 1600 MJ</text><text x="652" y="582" font-size="15" font-weight="400" fill="#b5602e" text-anchor="start">heating cooling water</text><text x="652" y="600" font-size="15" font-weight="400" fill="#b5602e" text-anchor="start">and air</text><rect x="30" y="655" width="840" height="109.6" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="696.1" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">efficiency = useful ÷ total × 100% = 900 ÷ 2500 × 100% = 36%</text><text x="54" y="734.1" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">energy wasted each second = 2500 − 900 = 1600 MJ</text><text x="450" y="785" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Band widths are drawn to scale. Figures invented for practice.</text>
</svg>