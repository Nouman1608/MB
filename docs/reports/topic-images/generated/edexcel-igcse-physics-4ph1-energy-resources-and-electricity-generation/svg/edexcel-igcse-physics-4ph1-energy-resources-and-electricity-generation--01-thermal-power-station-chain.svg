<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Thermal power stations: steam, turbine, generator</text>

<rect x="40" y="115" width="190" height="38" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2" /><text x="135" y="140" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Fossil fuels</text><rect x="250" y="115" width="190" height="38" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2" /><text x="345" y="140" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Nuclear fuel</text><rect x="460" y="115" width="190" height="38" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2" /><text x="555" y="140" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Geothermal</text><rect x="670" y="115" width="190" height="38" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2" /><text x="765" y="140" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Solar heating</text><line x1="135" y1="156" x2="390" y2="205" stroke="#b5602e" stroke-width="2.5" marker-end="url(#ahR)"/><line x1="345" y1="156" x2="430" y2="205" stroke="#b5602e" stroke-width="2.5" marker-end="url(#ahR)"/><line x1="555" y1="156" x2="470" y2="205" stroke="#b5602e" stroke-width="2.5" marker-end="url(#ahR)"/><line x1="765" y1="156" x2="510" y2="205" stroke="#b5602e" stroke-width="2.5" marker-end="url(#ahR)"/><text x="450" y="240" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><rect x="330" y="210" width="240" height="110" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="3" /><rect x="333" y="265" width="234" height="52" rx="0" fill="#dce9e7" stroke="none" stroke-width="0" /><path d="M380,255 q-8,-10 0,-20 q8,-10 0,-20" fill="none" stroke="#4a5568" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M430,255 q-8,-10 0,-20 q8,-10 0,-20" fill="none" stroke="#4a5568" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M480,255 q-8,-10 0,-20 q8,-10 0,-20" fill="none" stroke="#4a5568" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M530,255 q-8,-10 0,-20 q8,-10 0,-20" fill="none" stroke="#4a5568" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="450" y="345" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">water heated to high-pressure steam</text><polyline points="570,230 700,230 700,420 664,420" fill="none" stroke="#4a5568" stroke-width="10" stroke-linejoin="round"/><text x="712" y="330" font-size="16" font-weight="600" fill="#4a5568" text-anchor="start">steam</text><circle cx="620" cy="420" r="40" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><ellipse cx="620" cy="400.8" rx="8" ry="18.400000000000002" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2" transform="rotate(0 620 420)"/><ellipse cx="620" cy="400.8" rx="8" ry="18.400000000000002" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2" transform="rotate(72 620 420)"/><ellipse cx="620" cy="400.8" rx="8" ry="18.400000000000002" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2" transform="rotate(144 620 420)"/><ellipse cx="620" cy="400.8" rx="8" ry="18.400000000000002" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2" transform="rotate(216 620 420)"/><ellipse cx="620" cy="400.8" rx="8" ry="18.400000000000002" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2" transform="rotate(288 620 420)"/><circle cx="620" cy="420" r="5" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><text x="620" y="490" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">turbine</text><line x1="580" y1="420" x2="470" y2="420" stroke="#1e2a44" stroke-width="6" stroke-linecap="round"/><circle cx="430" cy="420" r="42" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="430" y="428" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">G</text><text x="430" y="490" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">generator</text><line x1="386" y1="420" x2="260" y2="420" stroke="#8a6d0d" stroke-width="5" marker-end="url(#ahO)"/><text x="200" y="410" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">electrically</text><text x="200" y="432" font-size="16" font-weight="400" fill="#8a6d0d" text-anchor="middle">to the grid</text><line x1="662" y1="432" x2="760" y2="520" stroke="#4a5568" stroke-width="3" marker-end="url(#ah)" stroke-dasharray="6 5"/><text x="770" y="556" font-size="15" font-weight="600" fill="#b5602e" text-anchor="end">wasted heating the</text><text x="770" y="574" font-size="15" font-weight="600" fill="#b5602e" text-anchor="end">cooling water and air</text><rect x="30" y="600" width="840" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="636" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Wind and water spin the turbine directly. Solar cells transfer energy</text><text x="450" y="662" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">from light electrically, with no turbine or generator at all.</text>
