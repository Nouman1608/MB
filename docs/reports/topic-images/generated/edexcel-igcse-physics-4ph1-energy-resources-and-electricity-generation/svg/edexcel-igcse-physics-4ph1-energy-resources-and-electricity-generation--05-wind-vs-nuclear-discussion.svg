<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="650" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Discuss: wind farm or nuclear power station?</text>

<text x="340" y="140" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Wind farm</text><text x="680" y="140" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">Nuclear power station</text><rect x="30" y="155" width="840" height="56" rx="0" fill="#fbfcfc" stroke="#c9d6d4" stroke-width="1.5" /><text x="45" y="189" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Renewable?</text><text x="215" y="189" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Yes</text><text x="500" y="189" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">No: fuel is non-renewable</text><rect x="30" y="217" width="840" height="56" rx="0" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5" /><text x="45" y="251" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">CO₂ in use</text><text x="215" y="251" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">None while operating</text><text x="500" y="251" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">None while generating</text><rect x="30" y="279" width="840" height="56" rx="0" fill="#fbfcfc" stroke="#c9d6d4" stroke-width="1.5" /><text x="45" y="313" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Reliability</text><text x="215" y="313" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Depends on the wind</text><text x="500" y="313" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Large, steady output</text><rect x="30" y="341" width="840" height="56" rx="0" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5" /><text x="45" y="375" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Scale</text><text x="215" y="375" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Many turbines over a large area</text><text x="500" y="375" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Large output from a small mass of fuel</text><rect x="30" y="403" width="840" height="56" rx="0" fill="#fbfcfc" stroke="#c9d6d4" stroke-width="1.5" /><text x="45" y="437" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Fuel, waste, cost</text><text x="215" y="437" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">No fuel to buy</text><text x="500" y="427" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Radioactive waste stored for a very long time;</text><text x="500" y="446" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">expensive to build and decommission</text><rect x="30" y="490" width="840" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="525" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement linked to the criteria:</text><text x="55" y="553" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">if a reliable supply is needed, nuclear is better; wind would need backup</text><text x="55" y="575" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">from a resource that can be controlled.</text><text x="450" y="630" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Judge both resources on the same criteria, one developed point per sentence, then conclude.</text>
</svg>