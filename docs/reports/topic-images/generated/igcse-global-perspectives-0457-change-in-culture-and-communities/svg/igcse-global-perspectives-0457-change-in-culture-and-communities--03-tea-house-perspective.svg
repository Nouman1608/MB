<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 543" width="900" height="543" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="543" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Analysing one perspective in four moves</text>

<rect x="30" y="104" width="840" height="89" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AN OLDER RESIDENT ON THE TEA HOUSE CLOSING</text><text x="50" y="165.6" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">“Neighbours stop knowing each other.”</text><rect x="30" y="211" width="170" height="50" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="243" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Knowledge</text><rect x="214" y="211" width="656" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="240.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">She says the closure means neighbours stop knowing each other.</text><rect x="30" y="273" width="170" height="72" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="316" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Application</text><rect x="214" y="273" width="656" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="302.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A perspective based on a value (community contact) and on her</text><text x="230" y="324.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">experience of meeting people there.</text><rect x="30" y="357" width="170" height="72" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="400" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Analysis</text><rect x="214" y="357" width="656" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="386.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Her reasoning links a place to social ties: if the place goes, the ties</text><text x="230" y="408.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">weaken.</text><rect x="30" y="441" width="170" height="72" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="484" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Evaluation</text><rect x="214" y="441" width="656" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="470.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Plausible, but no evidence that people have stopped meeting elsewhere,</text><text x="230" y="492.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">online or at the new café. Reasonable, not yet supported.</text>
</svg>