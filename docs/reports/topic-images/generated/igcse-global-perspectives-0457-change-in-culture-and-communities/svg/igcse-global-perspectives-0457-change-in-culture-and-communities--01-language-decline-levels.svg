width="450" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="436" y="250.2" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Local</text><text x="436" y="279.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Fewer children attend the local language class,</text><text x="436" y="301.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">and the class closes.</text><rect x="420" y="334" width="450" height="81" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="436" y="365.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">National</text><text x="436" y="394.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Which languages schools should teach in.</text><rect x="420" y="427" width="450" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="436" y="458.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Global</text><text x="436" y="487.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Smaller languages decline as a few global</text><text x="436" y="509.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">languages spread.</text><rect x="30" y="548" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="581.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Many issues work at more than one level. Strong answers move between them.</text>
