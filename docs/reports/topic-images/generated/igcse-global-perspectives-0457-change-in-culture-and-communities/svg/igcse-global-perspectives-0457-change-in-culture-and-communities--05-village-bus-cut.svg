<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 566" width="900" height="566" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="566" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One cause among several: a fictional village</text>

<rect x="30" y="116" width="330" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="149" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CAUSE 1</text><text x="50" y="175.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The only bus to town is</text><text x="50" y="200.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">cut</text><rect x="30" y="266" width="330" height="138" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="299" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CAUSE 2</text><text x="50" y="325.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The pull of jobs in the</text><text x="50" y="350.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">town</text><text x="50" y="379.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">would probably exist anyway</text><rect x="500" y="186" width="370" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="520" y="223.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Young people move to the town</text><text x="520" y="248.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">to work</text><line x1="366" y1="166" x2="494" y2="216" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)" stroke-dasharray="9 7"/><line x1="366" y1="321" x2="494" y2="256" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><text x="436" y="162" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">speeds it up</text><text x="455" y="330" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">drives it</text><line x1="685" y1="282" x2="685" y2="330" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="500" y="336" width="370" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="520" y="370.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Fewer people take part in the</text><text x="520" y="394.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">harvest festival</text><line x1="685" y1="422" x2="685" y2="460" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="500" y="466" width="370" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="520" y="505.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Older residents carry it alone</text><rect x="30" y="416" width="440" height="108" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="449" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">EVALUATION</text><text x="50" y="474.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The bus cut may speed up a change</text><text x="50" y="498.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">rather than create it.</text>
</svg>