<rect width="900" height="611" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Build chains, not lists</text>

<text x="450" y="124" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Common causes of cultural and community change</text><rect x="74.20000000000005" y="150" width="337.025" height="42" rx="21" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="242.71250000000003" y="177.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Globalised media and technology</text><rect x="423.225" y="150" width="209.95" height="42" rx="21" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="528.2" y="177.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Movement of people</text><rect x="645.175" y="150" width="180.62499999999997" height="42" rx="21" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="735.4875" y="177.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Economic change</text><rect x="292.70000000000005" y="202" width="200.17499999999998" height="42" rx="21" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="392.7875" y="229.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Government policy</text><rect x="504.875" y="202" width="102.42499999999998" height="42" rx="21" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="556.0875" y="229.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Tourism</text><rect x="30" y="268" width="180" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="120" y="328.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Rents rise</text><line x1="216" y1="324" x2="244" y2="324" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="250" y="268" width="180" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="340" y="306.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Long-standing</text><text x="340" y="328.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">families move</text><text x="340" y="350.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">out</text><line x1="436" y1="324" x2="464" y2="324" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="470" y="268" width="180" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="560" y="295.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Fewer children</text><text x="560" y="317.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">attend the</text><text x="560" y="339.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">local language</text><text x="560" y="361.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">class</text><line x1="656" y1="324" x2="684" y2="324" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="690" y="268" width="180" height="112" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="780" y="317.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">The class</text><text x="780" y="339.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">closes</text><rect x="30" y="392" width="408" height="189" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="425" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">A LIST</text><text x="50" y="450.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Four separate points</text><text x="50" y="478.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="478.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Rents rise.</text><text x="50" y="504.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="504.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Families move.</text><text x="50" y="530.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="530.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Classes are smaller.</text><text x="50" y="556.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="556.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A class closed.</text><rect x="462" y="392" width="408" height="189" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="482" y="425" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">A CHAIN</text><text x="482" y="450.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Each step causes the next</text><text x="482" y="478.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Linking the steps with “so” and “as a</text><text x="482" y="499.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">result” is what shows analysis.</text>
</svg>