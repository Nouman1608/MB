<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 744" width="900" height="744" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="744" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Assessing an action: free dialect classes</text>

<rect x="30" y="104" width="158.4" height="114" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="109.2" y="130.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Record</text><text x="109.2" y="158" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">archives of</text><text x="109.2" y="178" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">songs, recipes,</text><text x="109.2" y="198" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">words</text><rect x="200.4" y="104" width="158.4" height="114" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="279.6" y="130.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Teach</text><text x="279.6" y="158" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">classes, school</text><text x="279.6" y="178" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">programmes</text><rect x="370.8" y="104" width="158.4" height="114" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="130.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Share spaces</text><text x="450" y="158" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">events across</text><text x="450" y="178" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">groups</text><rect x="541.2" y="104" width="158.4" height="114" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="620.4000000000001" y="130.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Fund,</text><text x="620.4000000000001" y="154.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">protect</text><text x="620.4000000000001" y="182" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">grants, heritage</text><text x="620.4000000000001" y="202" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">status</text><rect x="711.6" y="104" width="158.4" height="114" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="790.8000000000001" y="130.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Adapt</text><text x="790.8000000000001" y="158" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">let new groups</text><text x="790.8000000000001" y="178" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">take part</text><rect x="30" y="236" width="840" height="103" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="265" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">THE ACTION</text><text x="46" y="290.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A council offers free evening classes in a fading local dialect</text><text x="46" y="318.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">It targets one cause: the lack of chances to learn it.</text><line x1="450" y1="344" x2="450" y2="374" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="379" width="840" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="408" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">IF IT WORKS</text><text x="46" y="433.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Adults use the dialect at home, so children hear it</text><line x1="450" y1="460" x2="450" y2="490" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="495" width="840" height="103" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="46" y="524" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">RISK</text><text x="46" y="549.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Few attend, or the dialect is never used at work or school</text><text x="46" y="577.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The classes may record the dialect rather than keep it alive.</text><line x1="450" y1="603" x2="450" y2="633" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="638" width="840" height="76" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="667" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">JUDGEMENT</text><text x="46" y="692.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">More likely to work if combined with local signs and events</text>
</svg>