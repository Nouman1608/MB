<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 715" width="900" height="715" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="715" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Checking a claim about teenagers and music</text>

<rect x="30" y="104" width="840" height="112" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INVENTED SOURCE</text><text x="50" y="164" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">“A survey shows 80% of teenagers prefer global pop music to local</text><text x="50" y="190" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">music, so local music has no future.”</text><rect x="40" y="251.5" width="40" height="40" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M51,262.5 l18,18 m0,-18 l-18,18" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="94" y="234" width="776" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="108" y="262.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Who produced it?</text><text x="108" y="290.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">We are not told who ran the survey.</text><rect x="40" y="334.5" width="40" height="40" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M51,345.5 l18,18 m0,-18 l-18,18" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="94" y="317" width="776" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="108" y="345.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">How was the evidence gathered?</text><text x="108" y="373.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">No sample size, and no information on who was asked or where.</text><rect x="40" y="428" width="40" height="40" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M51,439 l18,18 m0,-18 l-18,18" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="94" y="400" width="776" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="108" y="428.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Does the conclusion follow?</text><text x="108" y="456.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Preferring one kind of music does not mean rejecting the other. A preference is not a</text><text x="108" y="477.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">prediction.</text><rect x="40" y="521.5" width="40" height="40" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M51,532.5 l18,18 m0,-18 l-18,18" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="94" y="504" width="776" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="108" y="532.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">What does the language do?</text><text x="108" y="560.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“No future” persuades, but it is not evidence.</text><text x="450" y="617" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Reasoning flaws to watch for in this topic</text><rect x="56.08750000000009" y="643" width="219.72499999999997" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="165.95000000000007" y="670.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Appeal to tradition</text><rect x="287.81250000000006" y="643" width="200.17499999999998" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="387.90000000000003" y="670.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Appeal to novelty</text><rect x="499.98750000000007" y="643" width="161.075" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="580.5250000000001" y="670.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">False dilemma</text><rect x="673.0625" y="643" width="170.84999999999997" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="758.4875" y="670.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Generalisation</text>
</svg>