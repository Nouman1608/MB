<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="660" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A historic market closes: who sees it how?</text>

<line x1="300" y1="166" x2="365" y2="240.1" stroke="#1e2a44" stroke-width="2.5"/><line x1="300" y1="292" x2="365" y2="284.2" stroke="#1e2a44" stroke-width="2.5"/><line x1="300" y1="406" x2="365" y2="324.1" stroke="#1e2a44" stroke-width="2.5"/><line x1="600" y1="155.5" x2="535" y2="236.425" stroke="#1e2a44" stroke-width="2.5"/><line x1="600" y1="269.5" x2="535" y2="276.325" stroke="#1e2a44" stroke-width="2.5"/><line x1="600" y1="394" x2="535" y2="319.9" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="280" r="100" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="274.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">A historic</text><text x="450" y="299.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">market closes</text><g transform="translate(0,0)"><rect x="30" y="104" width="270" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="134.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Long-standing</text><text x="46" y="158.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">residents</text><text x="46" y="186.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A meeting place and part of</text><text x="46" y="207.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the town’s identity.</text><rect x="30" y="242" width="270" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="272.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Younger residents</text><text x="46" y="300.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Prefer convenience, online</text><text x="46" y="321.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">shopping or new venues.</text><rect x="30" y="356" width="270" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="386.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Traders</text><text x="46" y="414.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Their income depends on what</text><text x="46" y="435.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">happens.</text></g><g transform="translate(0,1.5)"><rect x="600" y="104" width="270" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="616" y="134.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The local council</text><text x="616" y="162.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Balancing budgets, traffic</text><text x="616" y="183.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and public opinion.</text><rect x="600" y="218" width="270" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="616" y="248.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Newcomers</text><text x="616" y="276.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">May want both the old and</text><text x="616" y="297.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the new.</text><rect x="600" y="332" width="270" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="616" y="362.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Heritage organisations</text><text x="616" y="390.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Some traditions are worth</text><text x="616" y="411.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">protecting for their own</text><text x="616" y="432.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">sake.</text></g><text x="450" y="494" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Ask why each group holds its view</text><rect x="30" y="520" width="268" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="164" y="556" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Values</text><text x="164" y="584.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">what people think matters</text><rect x="316" y="520" width="268" height="110" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="556" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Interests</text><text x="450" y="584.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">what they gain or lose</text><rect x="602" y="520" width="268" height="110" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="736" y="556" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Experience</text><text x="736" y="584.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">what they have lived</text><text x="736" y="605.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">through</text>
</svg>