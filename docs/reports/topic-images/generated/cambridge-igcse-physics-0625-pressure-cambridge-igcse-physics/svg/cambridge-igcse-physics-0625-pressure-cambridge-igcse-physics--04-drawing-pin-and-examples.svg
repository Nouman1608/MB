<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="660" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Same force, different areas</text>

<rect x="30" y="110" width="840" height="355" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="150" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A drawing pin</text><rect x="300" y="300" width="300" height="120" rx="0" fill="#d9b27a" stroke="#1e2a44" stroke-width="3"/><rect x="380" y="170" width="140" height="18" rx="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><path d="M440,188 L450,330 L460,188 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><path d="M380,140 Q450,110 520,140 L520,168 L380,168 Z" fill="#e8c9a8" stroke="#1e2a44" stroke-width="2.5"/><text x="372" y="150" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">thumb</text><text x="330" y="440" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">board</text><line x1="560" y1="200" x2="525" y2="182" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="570" y="200" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">large head: low pressure,</text><text x="570" y="222" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">no pain</text><line x1="615" y1="325" x2="458" y2="326" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="625" y="320" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">tiny point: high</text><text x="625" y="342" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">pressure, the pin</text><text x="625" y="364" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">goes in</text><rect x="30" y="480" width="840" height="68" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="55" y="508" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">large area → low pressure</text><text x="55" y="534" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">snowshoes, skis, wide tractor tyres, bag straps, foundations</text><rect x="30" y="560" width="840" height="68" rx="12" fill="#f2e7b8" stroke="#b5602e" stroke-width="2"/><text x="55" y="588" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">small area → high pressure</text><text x="55" y="614" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">knife blade, drawing pin, needle, nail, football studs</text>
</svg>