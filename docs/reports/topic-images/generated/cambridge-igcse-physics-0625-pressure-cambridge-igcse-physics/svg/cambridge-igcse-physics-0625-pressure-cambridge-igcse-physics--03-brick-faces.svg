<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="520" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One brick, two pressures</text>

<rect x="30" y="110" width="420" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M70,340 L120,300 L280,300 L230,340 Z" fill="#efdfa8" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><path d="M230,340 L280,300 L280,340 L230,380 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><rect x="70" y="340" width="160" height="40" rx="0" fill="#d9a37a" stroke="#1e2a44" stroke-width="3"/><text x="150" y="410" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">flat: 20 × 10 cm</text><text x="150" y="432" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">smallest pressure</text><path d="M320,220 L345,200 L385,200 L360,220 Z" fill="#efdfa8" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><path d="M360,220 L385,200 L385,360 L360,380 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><rect x="320" y="220" width="40" height="160" rx="0" fill="#d9a37a" stroke="#1e2a44" stroke-width="3"/><text x="350" y="410" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">on end: 10 × 5.0 cm</text><text x="350" y="432" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">largest pressure</text><line x1="50" y1="381" x2="430" y2="381" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><text x="240" y="150" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">mass 2.4 kg, 20 cm × 10 cm × 5.0 cm</text><text x="240" y="470" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">same weight on every face</text><rect x="470" y="140" width="400" height="218" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="490" y="176" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Worked example 2</text><text x="490" y="210" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">W = 2.4 × 9.8 = 23.5 N</text><text x="490" y="242" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">end face 50 cm² = 0.0050 m²</text><text x="490" y="274" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">p = 23.5 / 0.0050 = 4700 Pa</text><text x="490" y="306" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">big face 200 cm² = 0.020 m²</text><text x="490" y="338" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">p = 23.5 / 0.020 = 1200 Pa</text>
</svg>