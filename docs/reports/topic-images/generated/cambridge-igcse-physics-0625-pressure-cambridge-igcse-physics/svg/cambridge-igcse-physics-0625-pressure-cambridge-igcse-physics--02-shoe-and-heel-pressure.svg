<rect width="900" height="624" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Same force, smaller area, bigger pressure</text>

<rect x="30" y="110" width="410" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="110" width="410" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="235" y1="140" x2="235" y2="225" stroke="#b5602e" stroke-width="6" marker-end="url(#ahR)"/><text x="250" y="175" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">600 N</text><path d="M120,300 L350,300 L350,280 Q320,230 240,240 L140,250 Q115,260 120,300 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3"/><rect x="120" y="300" width="230" height="10" fill="#2e6b62"/><line x1="60" y1="312" x2="410" y2="312" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="665" y1="140" x2="665" y2="225" stroke="#b5602e" stroke-width="6" marker-end="url(#ahR)"/><text x="680" y="175" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">600 N</text><path d="M560,262 L760,262 L760,244 Q730,206 650,216 L590,228 Q560,236 560,262 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3"/><line x1="578" y1="262" x2="580" y2="309" stroke="#1e2a44" stroke-width="5" stroke-linecap="round"/><line x1="490" y1="312" x2="840" y2="312" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><text x="580" y="340" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">only the heel touches the floor</text><rect x="30" y="380" width="410" height="154" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="416" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Flat shoes, 300 cm²</text><text x="50" y="450" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">A = 300 / 10 000 = 0.030 m²</text><text x="50" y="482" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">p = 600 / 0.030</text><text x="50" y="514" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">= 20 000 Pa</text><rect x="460" y="380" width="410" height="154" rx="12" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="480" y="416" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">One heel, 1.0 cm²</text><text x="480" y="450" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">A = 1.0 / 10 000 = 0.000 10 m²</text><text x="480" y="482" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">p = 600 / 0.000 10</text><text x="480" y="514" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">= 6 000 000 Pa</text><rect x="30" y="549" width="840" height="56" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="583.3" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Area 300 times smaller → pressure 300 times larger: enough to dent a wooden floor.</text>
</svg>