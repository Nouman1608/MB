<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="600" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Converting areas to m²</text>

<rect x="30" y="110" width="840" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="80" y="150" width="300" height="300" rx="0" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><line x1="110" y1="150" x2="110" y2="450" stroke="#2e6b62" stroke-width="1" stroke-linecap="round"/><line x1="80" y1="180" x2="380" y2="180" stroke="#2e6b62" stroke-width="1" stroke-linecap="round"/><line x1="140" y1="150" x2="140" y2="450" stroke="#2e6b62" stroke-width="1" stroke-linecap="round"/><line x1="80" y1="210" x2="380" y2="210" stroke="#2e6b62" stroke-width="1" stroke-linecap="round"/><line x1="170" y1="150" x2="170" y2="450" stroke="#2e6b62" stroke-width="1" stroke-linecap="round"/><line x1="80" y1="240" x2="380" y2="240" stroke="#2e6b62" stroke-width="1" stroke-linecap="round"/><line x1="200" y1="150" x2="200" y2="450" stroke="#2e6b62" stroke-width="1" stroke-linecap="round"/><line x1="80" y1="270" x2="380" y2="270" stroke="#2e6b62" stroke-width="1" stroke-linecap="round"/><line x1="230" y1="150" x2="230" y2="450" stroke="#2e6b62" stroke-width="1" stroke-linecap="round"/><line x1="80" y1="300" x2="380" y2="300" stroke="#2e6b62" stroke-width="1" stroke-linecap="round"/><line x1="260" y1="150" x2="260" y2="450" stroke="#2e6b62" stroke-width="1" stroke-linecap="round"/><line x1="80" y1="330" x2="380" y2="330" stroke="#2e6b62" stroke-width="1" stroke-linecap="round"/><line x1="290" y1="150" x2="290" y2="450" stroke="#2e6b62" stroke-width="1" stroke-linecap="round"/><line x1="80" y1="360" x2="380" y2="360" stroke="#2e6b62" stroke-width="1" stroke-linecap="round"/><line x1="320" y1="150" x2="320" y2="450" stroke="#2e6b62" stroke-width="1" stroke-linecap="round"/><line x1="80" y1="390" x2="380" y2="390" stroke="#2e6b62" stroke-width="1" stroke-linecap="round"/><line x1="350" y1="150" x2="350" y2="450" stroke="#2e6b62" stroke-width="1" stroke-linecap="round"/><line x1="80" y1="420" x2="380" y2="420" stroke="#2e6b62" stroke-width="1" stroke-linecap="round"/><rect x="80" y="150" width="30" height="30" rx="0" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><line x1="80" y1="480" x2="380" y2="480" stroke="#1e2a44" stroke-width="2.5" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="230" y="508" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1 m = 100 cm</text><text x="392" y="310" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">1 m</text><text x="230" y="556" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">(each small square here stands for 10 cm × 10 cm)</text><rect x="530" y="150" width="320" height="110" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="690" y="195.7" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1 m² = 100 × 100</text><text x="690" y="229.7" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">= 10 000 cm²</text><rect x="530" y="280" width="320" height="90" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="690" y="317.65" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="middle">1 m² = 1000 × 1000</text><text x="690" y="345.65" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="middle">= 1 000 000 mm²</text><rect x="530" y="390" width="320" height="110" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="690" y="424.3" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">25 cm² = 25 ÷ 10 000</text><text x="690" y="451.3" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">= 0.0025 m²</text><text x="690" y="478.3" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">(divide by 10 000, not 100)</text>
</svg>