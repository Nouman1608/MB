<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="540" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Δp = ρ g Δh</text>

<rect x="30" y="72" width="148.8" height="30" rx="15" fill="#8a6d0d"/><text x="42" y="93" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Extended only</text><rect x="30" y="110" width="430" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="60" y="170" width="380" height="330" fill="#b5d3cf"/><line x1="60" y1="170" x2="440" y2="170" stroke="#2e6b62" stroke-width="3" stroke-linecap="round"/><text x="70" y="160" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="start">sea surface</text><circle cx="300" cy="450" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><line x1="380" y1="172" x2="380" y2="448" stroke="#1e2a44" stroke-width="2.5" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="392" y="316" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">25 m</text><text x="300" y="488" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">diver</text><text x="80" y="200" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">ρ = 1030 kg/m³</text><rect x="470" y="140" width="400" height="178" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="490" y="176" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Worked example 3</text><text x="490" y="210" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Δp = ρ g Δh = 1030 × 9.8 × 25</text><text x="490" y="240" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">= 252 350 Pa ≈ 2.5 × 10⁵ Pa</text><text x="490" y="270" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">total pressure: add the</text><text x="490" y="300" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">atmosphere's pressure</text><rect x="470" y="332" width="400" height="148" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="490" y="368" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Examples 4 and 5</text><text x="490" y="402" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">0.40 m of oil: 800 × 9.8 × 0.40 ≈ 3100 Pa</text><text x="490" y="432" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">0.40 m of water: 1000 × 9.8 × 0.40 ≈ 3900 Pa</text><text x="490" y="462" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">49 000 Pa in water: Δh = 49 000 / 9800 = 5.0 m</text>
</svg>