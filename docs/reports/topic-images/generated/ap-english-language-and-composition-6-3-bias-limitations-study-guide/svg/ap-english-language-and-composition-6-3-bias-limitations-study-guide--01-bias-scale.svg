<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 676" width="900" height="676" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="676" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Measuring bias</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">How fairly does the source deal with what others think?</text>
<defs><linearGradient id="bg1" x1="0" x2="1"><stop offset="0" stop-color="#dce9e7"/><stop offset="1" stop-color="#f6e3d8"/></linearGradient></defs><rect x="60" y="162" width="780" height="34" rx="17" fill="url(#bg1)" stroke="#1e2a44" stroke-width="2"/><text x="60" y="150" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">LOW BIAS</text><text x="840" y="150" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end" xml:space="preserve">HIGH BIAS</text><rect x="30" y="218" width="400" height="48" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="42" y="246.85" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">states opposing views fairly and answers them</text><rect x="470" y="218" width="400" height="48" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5" /><text x="482" y="246.85" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">ignores or caricatures opposing views</text><text x="450" y="248" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle" xml:space="preserve">↔</text><rect x="30" y="274" width="400" height="48" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="42" y="302.85" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">measured language</text><rect x="470" y="274" width="400" height="48" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5" /><text x="482" y="302.85" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">loaded or emotive language</text><text x="450" y="304" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle" xml:space="preserve">↔</text><rect x="30" y="330" width="400" height="48" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="42" y="358.85" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">presents evidence that complicates its own claim</text><rect x="470" y="330" width="400" height="48" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5" /><text x="482" y="358.85" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">presents only favourable evidence</text><text x="450" y="360" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle" xml:space="preserve">↔</text><rect x="30" y="386" width="400" height="48" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="42" y="414.85" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">says how and by whom its data were gathered</text><rect x="470" y="386" width="400" height="48" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5" /><text x="482" y="414.85" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">hides the method or the source of the data</text><text x="450" y="416" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle" xml:space="preserve">↔</text><rect x="30" y="442" width="400" height="48" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="42" y="470.85" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">admits uncertainty (“suggests”, “may”)</text><rect x="470" y="442" width="400" height="48" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5" /><text x="482" y="470.85" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">claims certainty beyond the evidence</text><text x="450" y="472" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle" xml:space="preserve">↔</text><rect x="30" y="498" width="400" height="48" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="42" y="526.85" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">no obvious stake, or discloses it</text><rect x="470" y="498" width="400" height="48" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5" /><text x="482" y="526.85" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">an interest in the outcome, undisclosed</text><text x="450" y="528" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle" xml:space="preserve">↔</text><rect x="30" y="562" width="840" height="95.36000000000001" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5" /><text x="48" y="593.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">A position is not bias. <tspan font-weight="700">Vested</tspan> <tspan font-weight="700">interest:</tspan> a filter seller and a water company each deserve a careful</text><text x="48" y="614.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">reading. <tspan font-weight="700">Purpose</tspan> <tspan font-weight="700">matters:</tspan> the Declaration of Independence is one-sided by design (“let Facts be</text><text x="48" y="635.84" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">submitted to a candid world”) because it is an indictment.</text>
</svg>