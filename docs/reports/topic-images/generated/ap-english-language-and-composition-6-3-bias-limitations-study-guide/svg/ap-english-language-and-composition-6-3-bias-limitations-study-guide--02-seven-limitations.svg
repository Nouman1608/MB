<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="610" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Seven limitations to check</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A limitation tells you how far the evidence goes</text>
<circle cx="52" cy="148" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="52" y="153.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="80" y="154" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Sample size</text><text x="300" y="154" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" xml:space="preserve">How many people or cases?</text><text x="870" y="154" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic" xml:space="preserve">“9 in 10” of 50 people</text><line x1="30" y1="174" x2="870" y2="174" stroke="#c9d6d4" stroke-width="1.5"/><circle cx="52" cy="204" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="52" y="209.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="80" y="210" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Sample selection</text><text x="300" y="210" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" xml:space="preserve">Who was asked, and how chosen?</text><text x="870" y="210" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic" xml:space="preserve">visitors to a company’s own stand</text><line x1="30" y1="230" x2="870" y2="230" stroke="#c9d6d4" stroke-width="1.5"/><circle cx="52" cy="260" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="52" y="265.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="80" y="266" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Scope</text><text x="300" y="266" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" xml:space="preserve">What does it cover, and not?</text><text x="870" y="266" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic" xml:space="preserve">one region, one season</text><line x1="30" y1="286" x2="870" y2="286" stroke="#c9d6d4" stroke-width="1.5"/><circle cx="52" cy="316" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="52" y="321.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="80" y="322" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Date</text><text x="300" y="322" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" xml:space="preserve">How recent?</text><text x="870" y="322" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic" xml:space="preserve">a report from before a major change</text><line x1="30" y1="342" x2="870" y2="342" stroke="#c9d6d4" stroke-width="1.5"/><circle cx="52" cy="372" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="52" y="377.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="80" y="378" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Method</text><text x="300" y="378" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" xml:space="preserve">How was it measured?</text><text x="870" y="378" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic" xml:space="preserve">self-reported taste, not blind tests</text><line x1="30" y1="398" x2="870" y2="398" stroke="#c9d6d4" stroke-width="1.5"/><circle cx="52" cy="428" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="52" y="433.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="80" y="434" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Type of evidence</text><text x="300" y="434" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" xml:space="preserve">Anecdote, expert opinion, data?</text><text x="870" y="434" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic" xml:space="preserve">one story as proof of a trend</text><line x1="30" y1="454" x2="870" y2="454" stroke="#c9d6d4" stroke-width="1.5"/><circle cx="52" cy="484" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="52" y="489.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">7</text><text x="80" y="490" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Correlation</text><text x="300" y="490" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" xml:space="preserve">Cause, or just association?</text><text x="870" y="490" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic" xml:space="preserve">two things that rose together</text><line x1="30" y1="510" x2="870" y2="510" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="526" width="840" height="74.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="450" y="557.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">A small survey can <tspan font-weight="700">suggest</tspan> a trend without proving it; an anecdote can <tspan font-weight="700">illustrate</tspan> a point but cannot</text><text x="450" y="578.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">prove it is common.</text>
</svg>