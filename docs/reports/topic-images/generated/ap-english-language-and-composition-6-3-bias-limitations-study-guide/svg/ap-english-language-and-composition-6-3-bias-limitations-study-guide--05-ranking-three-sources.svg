" /><circle cx="76" cy="326" r="30" fill="#ffffff" stroke="#8a6d0d" stroke-width="3"/><text x="76" y="335" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">I</text><text x="126" y="292" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Regional water company</text><text x="126" y="316" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">water</tspan> <tspan font-style="italic">meets</tspan> <tspan font-style="italic">all</tspan> <tspan font-style="italic">standards;</tspan> <tspan font-style="italic">complaints</tspan> <tspan font-style="italic">are</tspan> <tspan font-style="italic">rare</tspan></text><text x="126" y="341.8" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Bias:</tspan> an interest in trust; no data beyond assertion. <tspan font-weight="700">Limits:</tspan> “complaints are</text><text x="126" y="361.6" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">rare” cannot be checked.</text><rect x="720" y="304" width="130" height="44" rx="22" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5" /><text x="785" y="333" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle" xml:space="preserve">More bias</text><rect x="30" y="402" width="840" height="128" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5" /><circle cx="76" cy="466" r="30" fill="#ffffff" stroke="#b5602e" stroke-width="3"/><text x="76" y="475" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">G</text><text x="126" y="432" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Filter company brochure</text><text x="126" y="456" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">9</tspan> <tspan font-style="italic">in</tspan> <tspan font-style="italic">10</tspan> <tspan font-style="italic">of</tspan> <tspan font-style="italic">50</tspan> <tspan font-style="italic">stand</tspan> <tspan font-style="italic">visitors</tspan> <tspan font-style="italic">preferred</tspan> <tspan font-style="italic">the</tspan> <tspan font-style="italic">taste</tspan></text><text x="126" y="481.8" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700">Bias:</tspan> sells the product; loaded language; no other views. <tspan font-weight="700">Limits:</tspan> small,</text><text x="126" y="501.6" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">self-selected, taste only.</text><rect x="720" y="444" width="130" height="44" rx="22" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" /><text x="785" y="473" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">Most bias</text>
