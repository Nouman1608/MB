<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 685" width="900" height="685" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="685" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Auditing a source</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Worked example 1: Source G, a water-filter brochure (fictional)</text>
<rect x="30" y="128" width="462.79288" height="35" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="261.39644" y="151.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">In a survey of 50 visitors to our stand at the town fair,</text><text x="261.39644" y="184.5" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle" xml:space="preserve">small, self-selected sample</text><rect x="498.79288" y="128" width="370.16498" height="35" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="683.87537" y="151.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">9 in 10 said our filtered water tasted better</text><text x="683.87537" y="184.5" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle" xml:space="preserve">taste only, not safety</text><rect x="30" y="213.3" width="144.11088" height="35" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="102.05544" y="236.75" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">than tap water.</text><rect x="180.11088" y="213.3" width="259.79945" height="35" rx="8" fill="#f6e3d8" stroke="#1e2a44" stroke-width="2" /><text x="310.010605" y="236.75" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Tap water is full of impurities</text><text x="310.010605" y="269.8" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">loaded; unsupported by the</text><text x="310.010605" y="288.1" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">survey</text><rect x="445.91033" y="213.3" width="248.13779" height="35" rx="8" fill="#f6e3d8" stroke="#1e2a44" stroke-width="2" /><text x="569.979225" y="236.75" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">that only our filter removes.</text><text x="569.979225" y="269.8" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">no other positions</text><rect x="30" y="316.9" width="369.13189000000006" height="35" rx="8" fill="#f6e3d8" stroke="#1e2a44" stroke-width="2" /><text x="214.56594500000003" y="340.34999999999997" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Isn’t it time your family drank clean water?</text><text x="214.56594500000003" y="373.4" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">fear for one’s family</text><rect x="30" y="406.2" width="269.3333333333333" height="128.4" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="48" y="440.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Position and</text><text x="48" y="466.59999999999997" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">perspective</text><text x="48" y="493.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">buy filters; a company that sells</text><text x="48" y="513.55" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">them</text><rect x="315.3333333333333" y="406.2" width="269.3333333333333" height="128.4" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" /><text x="333.3333333333333" y="440.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">Bias</tspan></text><text x="333.3333333333333" y="467.34999999999997" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">interest in sales, loaded words,</text><text x="333.3333333333333" y="487.15" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">a fearful question, no other</text><text x="333.3333333333333" y="506.95" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">views</text><rect x="600.6666666666666" y="406.2" width="269.3333333333333" height="128.4" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5" /><text x="618.6666666666666" y="440.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#8a6d0d">Limitations</tspan></text><text x="618.6666666666666" y="467.34999999999997" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">50 people, its own visitors, a</text><text x="618.6666666666666" y="487.15" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">taste test</text><rect x="30" y="554.6" width="840" height="104.63999999999999" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="48" y="588.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Responsible use</text><text x="48" y="616.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">evidence of what the company claims, not proof about water quality: “...so it says little about whether</text><text x="48" y="637.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">tap water is unsafe.”</text>
</svg>