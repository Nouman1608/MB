<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 729" width="900" height="729" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="729" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Interference in memory for adverts</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Burke and Srull (1988): competing brands in the same product category</text>
<rect x="30" y="124" width="840" height="220" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="160" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Retroactive interference</text><text x="50" y="186" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">later adverts disrupt memory of an earlier one ("retro" = backwards)</text><line x1="60" y1="310" x2="850" y2="310" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="850" y="334" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">time</text><rect x="120" y="216" width="170" height="70" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="205" y="258" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Brand A advert</text><rect x="560" y="216" width="170" height="70" rx="10" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="645" y="258" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Rival advert</text><path d="M600,214 Q450,164 300,218" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahR)"/><rect x="30" y="366" width="840" height="220" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="402" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Proactive interference</text><text x="50" y="428" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">earlier adverts disrupt learning of a later one</text><line x1="60" y1="552" x2="850" y2="552" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="850" y="576" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">time</text><rect x="120" y="458" width="170" height="70" rx="10" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="205" y="500" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Rival advert</text><rect x="560" y="458" width="170" height="70" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="645" y="500" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Brand A advert</text><path d="M260,456 Q410,406 560,460" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahR)"/><rect x="30" y="608" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="642.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Practical implication</text><text x="450" y="672.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Avoid showing a brand's adverts next to adverts for direct competitors.</text>
</svg>