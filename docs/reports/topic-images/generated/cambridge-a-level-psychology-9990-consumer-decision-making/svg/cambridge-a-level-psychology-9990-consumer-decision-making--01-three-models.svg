<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 612" width="900" height="612" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="612" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three models of consumer decisions</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">From the perfectly rational buyer to how people actually choose</text>
<rect x="30" y="124" width="270.6666666666667" height="229" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">UTILITY THEORY</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The rational calculator</text><text x="50" y="211.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">weighs all the information</text><text x="50" y="238.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="238.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">chooses the highest</text><text x="65.2" y="259.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">expected value</text><text x="50" y="286.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="286.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">normative: what a rational</text><text x="65.2" y="307.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">buyer <tspan font-weight="700" fill="#1e2a44">should</tspan> do</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="229" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334.6666666666667" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SATISFICING (SIMON)</text><text x="334.6666666666667" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Good enough</text><text x="334.6666666666667" y="211.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="349.8666666666667" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">bounded rationality: limited</text><text x="349.8666666666667" y="232.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">time, information and</text><text x="349.8666666666667" y="253.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">memory</text><text x="334.6666666666667" y="280.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="349.8666666666667" y="280.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sets a minimum standard</text><text x="334.6666666666667" y="307.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="349.8666666666667" y="307.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">accepts the <tspan font-weight="700" fill="#1e2a44">first</tspan> option that</text><text x="349.8666666666667" y="328.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">meets it</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="229" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="619.3333333333334" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PROSPECT THEORY</text><text x="619.3333333333334" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Gains and losses</text><text x="619.3333333333334" y="211.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="634.5333333333334" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">outcomes coded from a</text><text x="634.5333333333334" y="232.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">reference</tspan> <tspan font-weight="700" fill="#1e2a44">point</tspan></text><text x="619.3333333333334" y="259.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="634.5333333333334" y="259.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">losses weigh more than</text><text x="634.5333333333334" y="280.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">equal gains</text><text x="619.3333333333334" y="307.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="634.5333333333334" y="307.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sensitivity falls as amounts</text><text x="634.5333333333334" y="328.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">grow</text><clipPath id="tc375"><rect x="30" y="375" width="840" height="205" rx="14"/></clipPath><g clip-path="url(#tc375)"><rect x="30" y="375" width="253.95348837209303" height="48" fill="#b5d3cf"/><text x="44" y="402.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Prediction</text><rect x="283.95348837209303" y="375" width="195.34883720930233" height="48" fill="#b5d3cf"/><text x="297.95348837209303" y="402.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Utility theory</text><rect x="479.3023255813954" y="375" width="195.34883720930233" height="48" fill="#b5d3cf"/><text x="493.3023255813954" y="402.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Satisficing</text><rect x="674.6511627906978" y="375" width="195.34883720930233" height="48" fill="#b5d3cf"/><text x="688.6511627906978" y="402.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Prospect theory</text><rect x="30" y="423" width="253.95348837209303" height="89" fill="#dce9e7"/><text x="44" y="449.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Does the way an offer is</text><text x="44" y="470.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">described matter?</text><rect x="283.95348837209303" y="423" width="195.34883720930233" height="89" fill="#ffffff"/><text x="297.95348837209303" y="449.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No, if the outcome is</text><text x="297.95348837209303" y="470.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the same</text><rect x="479.3023255813954" y="423" width="195.34883720930233" height="89" fill="#ffffff"/><text x="493.3023255813954" y="449.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">—</text><rect x="674.6511627906978" y="423" width="195.34883720930233" height="89" fill="#ffffff"/><text x="688.6511627906978" y="449.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Yes</tspan>: a description</text><text x="688.6511627906978" y="470.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">shifts the reference</text><text x="688.6511627906978" y="491.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">point</text><line x1="30" y1="512" x2="870" y2="512" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="512" width="253.95348837209303" height="68" fill="#dce9e7"/><text x="44" y="538.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">How long do people search?</text><rect x="283.95348837209303" y="512" width="195.34883720930233" height="68" fill="#f8faf9"/><text x="297.95348837209303" y="538.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Through all the</text><text x="297.95348837209303" y="559.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">information</text><rect x="479.3023255813954" y="512" width="195.34883720930233" height="68" fill="#f8faf9"/><text x="493.3023255813954" y="538.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Stop</tspan> <tspan font-weight="700">early</tspan> at a</text><text x="493.3023255813954" y="559.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">good-enough option</text><rect x="674.6511627906978" y="512" width="195.34883720930233" height="68" fill="#f8faf9"/><text x="688.6511627906978" y="538.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">—</text></g><line x1="283.95348837209303" y1="375" x2="283.95348837209303" y2="580" stroke="#c9d6d4" stroke-width="1.5"/><line x1="479.3023255813954" y1="375" x2="479.3023255813954" y2="580" stroke="#c9d6d4" stroke-width="1.5"/><line x1="674.6511627906978" y1="375" x2="674.6511627906978" y2="580" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="375" width="840" height="205" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>