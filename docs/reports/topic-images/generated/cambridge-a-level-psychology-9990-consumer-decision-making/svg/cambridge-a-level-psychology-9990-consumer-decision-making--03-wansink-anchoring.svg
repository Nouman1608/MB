<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 653" width="900" height="653" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="653" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Anchoring at the shelf</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Wansink, Kent and Hoch (1998)</text>
<rect x="30" y="124" width="270.6666666666667" height="159" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="165.33333333333334" y="179" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">MULTIPLE UNIT PRICING</text><text x="165.33333333333334" y="206.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">"4 for £2"</text><text x="165.33333333333334" y="235.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">rather than "50p each"</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="159" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="156" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">SUGGESTIVE SELLING</text><text x="450" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">"Buy 18 for your</text><text x="450" y="208.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">freezer"</text><text x="450" y="237.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">a sign suggesting a large</text><text x="450" y="258.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">quantity</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="159" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="734.6666666666667" y="193" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">PURCHASE LIMIT</text><text x="734.6666666666667" y="220.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">"Limit 12 per person"</text><line x1="165" y1="289" x2="165" y2="345" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="289" x2="450" y2="345" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="735" y1="289" x2="735" y2="345" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="353" width="840" height="91" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="389.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">The number in the offer acts as an anchor</text><text x="450" y="419.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Shoppers adjust down from it, but not enough</text><line x1="450" y1="450" x2="450" y2="506" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="250" y="514" width="400" height="64" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="551.16" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">More items bought</text><text x="450" y="612.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Anchoring is always tied to a starting value: describe the number.</text>
</svg>