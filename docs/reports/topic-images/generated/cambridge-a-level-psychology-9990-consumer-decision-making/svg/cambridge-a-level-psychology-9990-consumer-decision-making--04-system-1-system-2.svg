<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 649" width="900" height="649" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="649" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">System 1 and system 2</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Kahneman; reviewed by Shleifer (2012)</text>
<rect x="30" y="124" width="410" height="117" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="235" y="156" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">SYSTEM 1</text><text x="235" y="185.16" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Fast and intuitive</text><text x="235" y="216.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">automatic · effortless</text><rect x="460" y="124" width="410" height="117" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="665" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">SYSTEM 2</text><text x="665" y="185.16" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Slow and deliberate</text><text x="665" y="216.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">logical · effortful</text><rect x="30" y="263" width="840" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="295" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">THE BAT AND BALL</text><text x="450" y="321.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">A bat and a ball cost £1.10 in total. The bat costs £1 more than the ball. How much is</text><text x="450" y="345.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">the ball?</text><rect x="30" y="393" width="410" height="122" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="235" y="425" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">SYSTEM 1 ANSWERS</text><text x="235" y="457.28" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">10p ✗</text><text x="235" y="490.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">intuitive, and wrong</text><rect x="460" y="393" width="410" height="122" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="665" y="425" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">SYSTEM 2 CHECKS</text><text x="665" y="457.28" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">5p ✓</text><text x="665" y="490.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">ball 5p + bat £1.05 = £1.10</text><rect x="30" y="537" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="570.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Consumer errors arise when system 1 answers a question that deserves system 2, such as judging</text><text x="450" y="592.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">value from a large "SALE" sign.</text>
</svg>