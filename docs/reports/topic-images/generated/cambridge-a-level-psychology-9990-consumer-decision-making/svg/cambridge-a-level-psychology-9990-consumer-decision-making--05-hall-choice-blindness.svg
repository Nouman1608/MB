<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 905" width="900" height="905" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="905" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Key study: Hall et al. (2010)</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Choice blindness for taste and smell at a supermarket tasting stall</text>
<rect x="30" y="124" width="840" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="160" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Double-ended containers with a hidden divider</text><rect x="110" y="188" width="70" height="150" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><line x1="110" y1="263" x2="180" y2="263" stroke="#1e2a44" stroke-width="4"/><rect x="116" y="194" width="58" height="63" rx="8" fill="#b5d3cf"/><text x="145" y="234" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><rect x="116" y="269" width="58" height="63" rx="8" fill="#f2e7b8"/><text x="145" y="309" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><text x="145" y="364" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">taste A</text><path d="M215,244 Q255,194 295,244" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><text x="255" y="284" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">turned</text><text x="255" y="304" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">over</text><rect x="330" y="188" width="70" height="150" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><line x1="330" y1="263" x2="400" y2="263" stroke="#1e2a44" stroke-width="4"/><rect x="336" y="194" width="58" height="63" rx="8" fill="#f2e7b8"/><text x="365" y="234" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><rect x="336" y="269" width="58" height="63" rx="8" fill="#b5d3cf"/><text x="365" y="309" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><text x="365" y="364" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">now gives B</text><text x="460" y="206" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Shoppers tasted two jams or smelled two teas</text><text x="460" y="227" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and said which they preferred: <tspan font-weight="700">A</tspan>. They sampled</text><text x="460" y="248" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the "chosen" one again and explained why they</text><text x="460" y="269" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">liked it, but were secretly given the <tspan font-weight="700">rejected</tspan> one,</text><text x="460" y="290" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">B</tspan>.</text><rect x="30" y="396" width="466.8695652173913" height="151" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="428" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RESULTS</text><text x="50" y="459.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No more than <tspan font-weight="700" fill="#1e2a44">a</tspan> <tspan font-weight="700" fill="#1e2a44">third</tspan> of manipulated trials were</text><text x="50" y="480.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">detected; even very different pairs were detected in no</text><text x="50" y="501.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">more than <tspan font-weight="700" fill="#1e2a44">half</tspan>. Many gave reasons for an option they</text><text x="50" y="522.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">had rejected.</text><rect x="510.8695652173913" y="396" width="359.13043478260875" height="151" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="530.8695652173913" y="428" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONCLUSION</text><text x="530.8695652173913" y="459.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Preferences are less fixed than people</text><text x="530.8695652173913" y="480.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">believe; reasons are constructed after the</text><text x="530.8695652173913" y="501.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">choice.</text><clipPath id="tc569"><rect x="30" y="569" width="840" height="304" rx="14"/></clipPath><g clip-path="url(#tc569)"><rect x="30" y="569" width="182.970297029703" height="48" fill="#b5d3cf"/><text x="44" y="596.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Issue</text><rect x="212.970297029703" y="569" width="565.5445544554456" height="48" fill="#b5d3cf"/><text x="226.970297029703" y="596.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Point</text><rect x="778.5148514851486" y="569" width="91.4851485148515" height="48" fill="#b5d3cf"/><text x="792.5148514851486" y="596.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">+/−</text><rect x="30" y="617" width="182.970297029703" height="47" fill="#dce9e7"/><text x="44" y="643.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Validity</text><rect x="212.970297029703" y="617" width="565.5445544554456" height="47" fill="#ffffff"/><text x="226.970297029703" y="643.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Supermarket setting and real products give high ecological validity.</text><rect x="778.5148514851486" y="617" width="91.4851485148515" height="47" fill="#dce9e7"/><text x="792.5148514851486" y="643.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">+</tspan></text><line x1="30" y1="664" x2="870" y2="664" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="664" width="182.970297029703" height="47" fill="#dce9e7"/><text x="44" y="690.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Control</text><rect x="212.970297029703" y="664" width="565.5445544554456" height="47" fill="#f8faf9"/><text x="226.970297029703" y="690.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Standardised containers allowed a controlled manipulation.</text><rect x="778.5148514851486" y="664" width="91.4851485148515" height="47" fill="#dce9e7"/><text x="792.5148514851486" y="690.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">+</tspan></text><line x1="30" y1="711" x2="870" y2="711" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="711" width="182.970297029703" height="68" fill="#dce9e7"/><text x="44" y="737.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Reliability</text><rect x="212.970297029703" y="711" width="565.5445544554456" height="68" fill="#ffffff"/><text x="226.970297029703" y="737.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Detection judged partly from what participants said; two observers</text><text x="226.970297029703" y="758.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">agreeing improves reliability.</text><rect x="778.5148514851486" y="711" width="91.4851485148515" height="68" fill="#f2e7b8"/><text x="792.5148514851486" y="737.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">±</tspan></text><line x1="30" y1="779" x2="870" y2="779" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="779" width="182.970297029703" height="47" fill="#dce9e7"/><text x="44" y="805.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Ethics</text><rect x="212.970297029703" y="779" width="565.5445544554456" height="47" fill="#f8faf9"/><text x="226.970297029703" y="805.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Deception was essential, so a full debrief was needed.</text><rect x="778.5148514851486" y="779" width="91.4851485148515" height="47" fill="#f6e3d8"/><text x="792.5148514851486" y="805.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">−</tspan></text><line x1="30" y1="826" x2="870" y2="826" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="826" width="182.970297029703" height="47" fill="#dce9e7"/><text x="44" y="852.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Free will</text><rect x="212.970297029703" y="826" width="565.5445544554456" height="47" fill="#ffffff"/><text x="226.970297029703" y="852.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Findings challenge the free-will assumption behind utility theory.</text><rect x="778.5148514851486" y="826" width="91.4851485148515" height="47" fill="#f2e7b8"/><text x="792.5148514851486" y="852.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">±</tspan></text></g><line x1="212.970297029703" y1="569" x2="212.970297029703" y2="873" stroke="#c9d6d4" stroke-width="1.5"/><line x1="778.5148514851486" y1="569" x2="778.5148514851486" y2="873" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="569" width="840" height="304" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>