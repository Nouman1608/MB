<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Prospect theory: how outcomes feel</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Losses loom larger than equal gains</text>
<rect x="30" y="124" width="840" height="430" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="90" y1="334" x2="810" y2="334" stroke="#1e2a44" stroke-width="3"/><line x1="450" y1="154" x2="450" y2="514" stroke="#1e2a44" stroke-width="3"/><text x="810" y="364" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">gains →</text><text x="90" y="364" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">← losses</text><text x="462" y="164" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">feels good</text><text x="462" y="508" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">feels bad</text><path d="M450,334 L459,318.1886116991581 L468,311.6393202250021 L477,306.6138721247417 L486,302.37722339831623 L495,298.6446609406726 L504,295.27016653792583 L513,292.16699867329623 L522,289.2786404500042 L531,286.5658350974743 L540,284 L549,281.5595575914924 L558,279.2277442494834 L567,276.9912287450431 L576,274.83920216900384 L585,272.76275643042055 L594,270.7544467966324 L603,268.80797594797355 L612,266.9179606750063 L621,265.0797562395489 L630,263.28932188134524 L639,261.5431162690528 L648,259.83801512904336 L657,258.17124555948453 L666,256.54033307585166 L675,254.94305849579052 L684,253.3774225170145 L693,251.84161637422508 L702,250.33399734659244 L711,248.853068170368 L720,247.39745962155615 L729,245.96591569170494 L738,244.5572809000084 L747,243.17048937707526 L756,241.80455542707114 L765,240.45856533065148 L774,239.13167019494864 L783,237.82307969164327 L792,236.5320565519104 L801,235.25791170934252 L810,234" fill="none" stroke="#2e6b62" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><path d="M450,334 L441,360.08879069638914 L432,370.89512162874655 L423,379.1871109941762 L414,386.1775813927783 L405,392.3363094478902 L396,397.9042252124224 L387,403.0244521890612 L378,407.79024325749305 L369,412.26637208916736 L360,416.5 L351,420.5267299740375 L342,424.3742219883524 L333,428.0644725706789 L324,431.6153164211437 L315,435.04145188980607 L306,438.3551627855565 L297,441.5668396858437 L288,444.6853648862396 L279,447.71840220474434 L270,450.6726188957804 L261,453.55385815606286 L251.99999999999997,456.36727503707846 L243.00000000000003,459.1174448268506 L234,461.80845042484475 L225,464.44395348194564 L216,467.0272528469261 L206.99999999999997,469.5613329825286 L198.00000000000003,472.0489043781225 L189,474.4924375188928 L180,476.8941916244324 L171,479.2562391086868 L162,481.5804865149861 L153,483.86869252782583 L144,486.12248354533267 L135,488.3433672044251 L126,490.5327441783348 L117,492.6919185087886 L108,494.8221066893479 L99,496.9244456795849 L90,499" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><line x1="630" y1="334" x2="630" y2="263.28932188134524" stroke="#2e6b62" stroke-width="2.5" stroke-dasharray="6 5"/><line x1="270" y1="334" x2="270" y2="450.6726188957804" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="630" y="360" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">+£X</text><text x="270" y="322" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">−£X</text><text x="432" y="320" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="end">reference point</text><text x="560" y="404" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Diminishing</tspan> <tspan font-weight="700">sensitivity:</tspan> £10 to £20 feels</text><text x="560" y="424" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">bigger than £1,010 to £1,020, so the</text><text x="560" y="444" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">curve flattens</text><text x="70" y="184" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Loss</tspan> <tspan font-weight="700">aversion:</tspan> an equal loss feels</text><text x="70" y="204" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">worse than the gain feels good</text><text x="850" y="544" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">illustrative shape: no data in the lesson</text><rect x="30" y="576" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="610.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Retail use</text><text x="450" y="640.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Framing a price rise as "a discount for paying early" codes the same outcome as a gain, not a loss.</text>
</svg>