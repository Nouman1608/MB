<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 741" width="900" height="741" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="741" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From Sèvres to Lausanne</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">How Turkey overturned a treaty by force</text>
<line x1="140" y1="132" x2="140" y2="701" stroke="#1e2a44" stroke-width="4"/><rect x="180" y="124" width="690" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="193" y="151.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sykes-Picot Agreement</text><text x="193" y="175.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Britain and France secretly agree how to divide Ottoman lands (while Britain also</text><text x="193" y="196.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">encourages Arab hopes).</text><circle cx="140" cy="169" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="175" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1916</text><rect x="180" y="224" width="690" height="69" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="193" y="251.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Balfour Declaration</text><text x="193" y="275.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Britain supports a Jewish "national home" in Palestine.</text><circle cx="140" cy="258.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="264.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1917</text><rect x="180" y="303" width="690" height="69" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="193" y="330.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Treaty of Sèvres</text><text x="193" y="354.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Signed by the Sultan's government; rejected by nationalists led by Mustafa Kemal.</text><circle cx="140" cy="337.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="343.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Aug 1920</text><rect x="180" y="382" width="690" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="193" y="409.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Kemal's victories</text><text x="193" y="433.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Defeats Armenian and French forces; drives the Greek army out of Anatolia; retakes</text><text x="193" y="454.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Smyrna, September 1922.</text><circle cx="140" cy="427" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="433" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1919-22</text><rect x="180" y="482" width="690" height="69" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="193" y="509.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Chanak</text><text x="193" y="533.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Britain close to war with the nationalists, but no ally willing to fight.</text><circle cx="140" cy="516.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="522.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1922</text><rect x="180" y="561" width="690" height="69" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="193" y="588.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Treaty of Lausanne</text><text x="193" y="612.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Negotiated as equals; Sèvres never put into effect.</text><circle cx="140" cy="595.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="601.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Jul 1923</text><rect x="180" y="640" width="690" height="69" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="193" y="667.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Turkey becomes a republic</text><text x="193" y="691.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Kemal as president.</text><circle cx="140" cy="674.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="680.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Oct 1923</text>
</svg>