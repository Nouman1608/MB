<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 674" width="900" height="674" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="674" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why a "wider" settlement was needed</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">By January 1919 the empires had already collapsed</text>
<rect x="30" y="124" width="411" height="133" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">OCT-NOV 1918</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Austria-Hungary broke apart</text><text x="50" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Czechs, Slovaks, Poles and South Slavs</text><text x="50" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">declared independence.</text><rect x="459" y="124" width="411" height="133" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="166.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BY 1918</text><text x="479" y="193.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Ottoman Empire lost its Arab provinces</text><text x="479" y="222.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">To British and Arab forces.</text><line x1="450" y1="267" x2="450" y2="301" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="311" width="840" height="111" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="345.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">The peacemakers' task</text><text x="450" y="375.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Recognise new states, draw borders through mixed populations, and decide what to do with the</text><text x="450" y="397.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">territories of defeated empires.</text><line x1="310" y1="492.5" x2="408" y2="515.25" stroke="#1e2a44" stroke-width="2.5"/><line x1="310" y1="557.5" x2="408" y2="534.75" stroke="#1e2a44" stroke-width="2.5"/><line x1="590" y1="481" x2="492" y2="511.8" stroke="#1e2a44" stroke-width="2.5"/><line x1="590" y1="557.5" x2="492" y2="534.75" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="525" r="84" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="519.8" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Self-</text><text x="450" y="544.1999999999999" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">determination</text><rect x="30" y="467" width="280" height="51" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="170" y="497.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Reward allies</text><rect x="30" y="532" width="280" height="51" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="170" y="562.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Punish the defeated</text><rect x="590" y="455.5" width="280" height="51" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="730" y="485.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Strategic frontiers</text><rect x="590" y="520.5" width="280" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="730" y="550.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">British and French imperial</text><text x="730" y="573.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">interests</text><text x="450" y="640" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Wilson's principle clashed with the other aims around it</text>
</svg>