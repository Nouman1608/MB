<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 611" width="900" height="611" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="611" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Hungary and Trianon</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The most resented treaty</text>
<text x="30" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">HUNGARY'S PRE-WAR TERRITORY (bar to scale: "about two-thirds" lost)</text><rect x="30" y="152" width="280" height="70" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="170" y="194" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">kept: about one-third</text><rect x="310" y="152" width="560" height="70" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="590" y="194" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">lost: about two-thirds</text><rect x="310" y="240" width="174.66666666666666" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="397.3333333333333" y="275.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Transylvania</text><text x="397.3333333333333" y="302.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">to Romania</text><rect x="502.66666666666663" y="240" width="174.66666666666666" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="590" y="265.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Slovakia and</text><text x="590" y="286.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Ruthenia</text><text x="590" y="313" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">to Czechoslovakia</text><rect x="695.3333333333333" y="240" width="174.66666666666666" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="782.6666666666666" y="275.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Croatia</text><text x="782.6666666666666" y="302.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">to Yugoslavia</text><rect x="30" y="345" width="411" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="379.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Over three million Hungarians</text><text x="50" y="407.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Left living in neighbouring states, especially</text><text x="50" y="428.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Transylvania and Czechoslovakia.</text><rect x="459" y="345" width="411" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="379.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Signed from weakness</text><text x="479" y="407.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">After a short-lived communist revolution and a</text><text x="479" y="428.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Romanian invasion in 1919.</text><rect x="30" y="471" width="411" height="108" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="505.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">"No, no, never!"</text><text x="50" y="533.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Resentment dominated Hungarian politics</text><text x="50" y="554.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">between the wars.</text><rect x="459" y="471" width="411" height="108" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="479" y="505.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Revisionism</text><text x="479" y="533.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Wish to recover lost lands later drew Hungary</text><text x="479" y="554.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">towards Germany and Italy.</text>
</svg>