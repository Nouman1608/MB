<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 622" width="900" height="622" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="622" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The five treaties, 1919-1923</text>

<line x1="140" y1="108" x2="140" y2="582" stroke="#1e2a44" stroke-width="4"/><rect x="180" y="100" width="690" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="193" y="127.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Saint-Germain · Austria</text><text x="193" y="151.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">New states recognised; South Tyrol and Trieste to Italy; German-speaking Bohemia and</text><text x="193" y="172.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Moravia to Czechoslovakia; union with Germany forbidden; army 30,000.</text><circle cx="140" cy="145" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="151" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Sep 1919</text><rect x="180" y="200" width="690" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="193" y="227.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Neuilly · Bulgaria</text><text x="193" y="251.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Western Thrace and Aegean access to Greece; land to Yugoslavia; army 20,000;</text><text x="193" y="272.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reparations.</text><circle cx="140" cy="245" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="251" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Nov 1919</text><rect x="180" y="300" width="690" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="193" y="327.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Trianon · Hungary</text><text x="193" y="351.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">About two-thirds of territory lost: Transylvania to Romania, Slovakia and Ruthenia to</text><text x="193" y="372.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Czechoslovakia, Croatia to Yugoslavia; army 35,000.</text><circle cx="140" cy="345" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="351" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Jun 1920</text><rect x="180" y="400" width="690" height="90" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="193" y="427.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sèvres · Ottoman Empire</text><text x="193" y="451.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Arab lands mandates; Smyrna under Greek administration; eastern Thrace to Greece;</text><text x="193" y="472.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Straits international; Armenian independence. Never put into effect.</text><circle cx="140" cy="445" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="451" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Aug 1920</text><rect x="180" y="500" width="690" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="193" y="527.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Lausanne · Turkey</text><text x="193" y="551.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Replaced Sèvres: Turkey kept Anatolia, Smyrna and eastern Thrace; no reparations;</text><text x="193" y="572.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Straits demilitarised but open; population exchange with Greece.</text><circle cx="140" cy="545" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="551" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Jul 1923</text>
</svg>