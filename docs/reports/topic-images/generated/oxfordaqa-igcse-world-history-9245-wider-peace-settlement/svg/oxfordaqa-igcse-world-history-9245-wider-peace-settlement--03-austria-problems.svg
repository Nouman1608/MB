<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 525" width="900" height="525" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="525" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Austria: a small state with a large capital</text>

<line x1="60" y1="120" x2="60" y2="473" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="100" width="766" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="132.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A small, landlocked republic of German speakers</text><text x="122" y="161.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Its capital, Vienna, built for an empire of over fifty million people.</text><circle cx="60" cy="142" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="150.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="196" width="766" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="228.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Lost industrial areas and markets</text><text x="122" y="257.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The new successor states put up tariffs against each other.</text><circle cx="60" cy="238" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="246.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="292" width="766" height="105" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122" y="324.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Union with Germany forbidden</text><text x="122" y="353.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Many Austrians saw union as the obvious solution; banning it seemed to contradict</text><text x="122" y="374.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">self-determination.</text><circle cx="60" cy="344.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="353.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="409" width="766" height="84" rx="14" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="441.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">By 1922: a League of Nations loan</text><text x="122" y="470.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Austria could not stand alone.</text><circle cx="60" cy="451" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="459.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text>
</svg>