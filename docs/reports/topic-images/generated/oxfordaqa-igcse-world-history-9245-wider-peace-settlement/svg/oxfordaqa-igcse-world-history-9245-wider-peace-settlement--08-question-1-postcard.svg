<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 601" width="900" height="601" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="601" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Using knowledge to support a source</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Question 1: Hungarians resented the Treaty of Trianon</text>
<rect x="30" y="124" width="840" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Source (invented): a 1921 Hungarian postcard</text><text x="50" y="187.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A map of Hungary with most of its land cut away by scissors labelled "Trianon", and the words "Can a</text><text x="50" y="208.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">nation live like this?"</text><rect x="30" y="249" width="249.33333333333334" height="195" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="291.5" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">CONTENT</text><text x="50" y="317.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">What it shows</text><text x="50" y="346.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Most of the map cut away;</text><text x="50" y="367.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the question expresses</text><text x="50" y="388.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">bitterness at a mutilated</text><text x="50" y="409.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">country.</text><line x1="285.33333333333337" y1="346.5" x2="319.33333333333337" y2="346.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="249" width="249.33333333333334" height="195" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="345.33333333333337" y="281" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">KNOWLEDGE</text><text x="345.33333333333337" y="307.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Precise context</text><text x="345.33333333333337" y="335.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">About two-thirds of</text><text x="345.33333333333337" y="356.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">territory lost; over three</text><text x="345.33333333333337" y="377.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">million Hungarians outside</text><text x="345.33333333333337" y="398.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the borders, especially in</text><text x="345.33333333333337" y="419.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Transylvania.</text><line x1="580.6666666666667" y1="346.5" x2="614.6666666666667" y2="346.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="249" width="249.33333333333334" height="195" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="640.6666666666667" y="281" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PROVENANCE</text><text x="640.6666666666667" y="307.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Strengthens it</text><text x="640.6666666666667" y="335.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A postcard is bought and</text><text x="640.6666666666667" y="356.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">sent by ordinary people:</text><text x="640.6666666666667" y="377.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">resentment was widely</text><text x="640.6666666666667" y="398.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">shared, not just among</text><text x="640.6666666666667" y="419.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">politicians.</text><rect x="30" y="460" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="494.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Check provenance against the treaty</text><text x="50" y="523.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A Hungarian source of the 1920s will almost certainly condemn Trianon; a Czech source may praise the</text><text x="50" y="544.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">same borders.</text>
</svg>