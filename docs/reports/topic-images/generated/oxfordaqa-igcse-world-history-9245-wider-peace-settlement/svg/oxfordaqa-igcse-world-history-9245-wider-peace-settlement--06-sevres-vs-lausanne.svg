<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 767" width="900" height="767" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="767" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Sèvres and Lausanne compared</text>

<clipPath id="tc100"><rect x="30" y="100" width="840" height="504" rx="14"/></clipPath><g clip-path="url(#tc100)"><rect x="30" y="100" width="186.66666666666666" height="49" fill="#b5d3cf"/><rect x="216.66666666666666" y="100" width="326.6666666666667" height="49" fill="#f2e7b8"/><text x="230.66666666666666" y="128.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sèvres, August 1920 (imposed)</text><rect x="543.3333333333334" y="100" width="326.6666666666667" height="49" fill="#b5d3cf"/><text x="557.3333333333334" y="128.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Lausanne, July 1923 (negotiated)</text><rect x="30" y="149" width="186.66666666666666" height="47" fill="#dce9e7"/><text x="44" y="175.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Smyrna</text><rect x="216.66666666666666" y="149" width="326.6666666666667" height="47" fill="#ffffff"/><text x="230.66666666666666" y="175.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Under Greek administration</text><rect x="543.3333333333334" y="149" width="326.6666666666667" height="47" fill="#ffffff"/><text x="557.3333333333334" y="175.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Kept by Turkey</text><line x1="30" y1="196" x2="870" y2="196" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="196" width="186.66666666666666" height="47" fill="#dce9e7"/><text x="44" y="222.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Eastern Thrace</text><rect x="216.66666666666666" y="196" width="326.6666666666667" height="47" fill="#f8faf9"/><text x="230.66666666666666" y="222.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">To Greece</text><rect x="543.3333333333334" y="196" width="326.6666666666667" height="47" fill="#f8faf9"/><text x="557.3333333333334" y="222.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Kept by Turkey</text><line x1="30" y1="243" x2="870" y2="243" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="243" width="186.66666666666666" height="47" fill="#dce9e7"/><text x="44" y="269.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Armenia</text><rect x="216.66666666666666" y="243" width="326.6666666666667" height="47" fill="#ffffff"/><text x="230.66666666666666" y="269.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Independent</text><rect x="543.3333333333334" y="243" width="326.6666666666667" height="47" fill="#ffffff"/><text x="557.3333333333334" y="269.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Turkey kept all of Anatolia</text><line x1="30" y1="290" x2="870" y2="290" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="290" width="186.66666666666666" height="47" fill="#dce9e7"/><text x="44" y="316.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">The Straits</text><rect x="216.66666666666666" y="290" width="326.6666666666667" height="47" fill="#f8faf9"/><text x="230.66666666666666" y="316.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Under international control</text><rect x="543.3333333333334" y="290" width="326.6666666666667" height="47" fill="#f8faf9"/><text x="557.3333333333334" y="316.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Demilitarised but open to shipping</text><line x1="30" y1="337" x2="870" y2="337" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="337" width="186.66666666666666" height="68" fill="#dce9e7"/><text x="44" y="363.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Reparations and</text><text x="44" y="384.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">privileges</text><rect x="216.66666666666666" y="337" width="326.6666666666667" height="68" fill="#ffffff"/><rect x="543.3333333333334" y="337" width="326.6666666666667" height="68" fill="#ffffff"/><text x="557.3333333333334" y="363.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No reparations; foreign legal privileges</text><text x="557.3333333333334" y="384.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ended</text><line x1="30" y1="405" x2="870" y2="405" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="405" width="186.66666666666666" height="110" fill="#dce9e7"/><text x="44" y="431.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">People</text><rect x="216.66666666666666" y="405" width="326.6666666666667" height="110" fill="#f8faf9"/><rect x="543.3333333333334" y="405" width="326.6666666666667" height="110" fill="#f8faf9"/><text x="557.3333333333334" y="431.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Compulsory Greek-Turkish exchange:</text><text x="557.3333333333334" y="452.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">over a million Greek Orthodox</text><text x="557.3333333333334" y="473.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Christians left Turkey; several hundred</text><text x="557.3333333333334" y="494.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">thousand Muslims left Greece</text><line x1="30" y1="515" x2="870" y2="515" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="515" width="186.66666666666666" height="89" fill="#dce9e7"/><text x="44" y="541.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Arab lands</text><rect x="216.66666666666666" y="515" width="326.6666666666667" height="89" fill="#ffffff"/><text x="230.66666666666666" y="541.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mandates: Syria and Lebanon (France);</text><text x="230.66666666666666" y="562.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Iraq, Palestine incl. Transjordan</text><text x="230.66666666666666" y="583.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(Britain)</text><rect x="543.3333333333334" y="515" width="326.6666666666667" height="89" fill="#ffffff"/><text x="557.3333333333334" y="541.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mandates stayed in place</text></g><line x1="216.66666666666666" y1="100" x2="216.66666666666666" y2="604" stroke="#c9d6d4" stroke-width="1.5"/><line x1="543.3333333333334" y1="100" x2="543.3333333333334" y2="604" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="100" width="840" height="504" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="626" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="660.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Why Lausanne matters</text><text x="50" y="689.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The only peace treaty negotiated rather than imposed, and proof that a defeated nation could overturn a</text><text x="50" y="710.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">treaty by force when the victors would not enforce it.</text>
</svg>