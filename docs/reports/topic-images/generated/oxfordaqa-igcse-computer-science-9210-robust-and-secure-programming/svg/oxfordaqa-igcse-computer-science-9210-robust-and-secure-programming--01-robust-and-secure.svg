<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="640" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Robust and secure programs</text>

<rect x="30" y="110" width="411" height="230" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="150" font-size="24" font-weight="700" fill="#2e6b62" text-anchor="start">Robust</text><text x="54" y="182" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Keeps working sensibly with unexpected or</text><text x="54" y="203" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">invalid input, rather than crashing or producing</text><text x="54" y="224" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">nonsense.</text><rect x="54" y="268" width="363" height="50" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="235.5" y="299" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">supported by validation</text><rect x="459" y="110" width="411" height="230" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="483" y="150" font-size="24" font-weight="700" fill="#8a6d0d" text-anchor="start">Secure</text><text x="483" y="182" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Only lets authorised users in.</text><rect x="483" y="268" width="363" height="50" rx="10" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="664.5" y="299" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">supported by authentication</text><path d="M235,340 L235,372 L664,372 L664,340" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><line x1="450" y1="372" x2="450" y2="400" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="250" y="404" width="400" height="56" rx="28" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="439" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">Testing checks both</text><rect x="30" y="486" width="840" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="524" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Validation checks data is reasonable, not that it is true</text><text x="54" y="570" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">age = 15</text><text x="190" y="569" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">passes a range check of 11 to 18</text><text x="846" y="569" font-size="17" font-weight="600" fill="#b5602e" text-anchor="end">even if the user is really 16</text>
</svg>