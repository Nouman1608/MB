a' 0,'calt' 0" font-size="20" font-weight="700" fill="#2b5a9a" text-anchor="middle">20</text><circle cx="502.8888888888889" cy="250" r="11" fill="#ffffff" stroke="#8a6d0d" stroke-width="4"/><text x="502.8888888888889" y="228" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="middle">21</text><circle cx="714.4444444444445" cy="250" r="11" fill="#ffffff" stroke="#b5602e" stroke-width="4"/><text x="714.4444444444445" y="300" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle">35</text><rect x="760" y="226" width="96" height="48" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="808" y="257" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">"ten"</text><text x="808" y="306" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">wrong type</text><rect x="30" y="340" width="840" height="80" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="340" width="10" height="80" rx="5" fill="#2e6b62"/><text x="58" y="372" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Normal</text><text x="58" y="402" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">7</text><text x="250" y="372" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Accepted</text><text x="250" y="398" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">accepts ordinary valid data</text><rect x="30" y="432" width="840" height="80" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="432" width="10" height="80" rx="5" fill="#2b5a9a"/><text x="58" y="464" font-size="18" font-weight="700" fill="#2b5a9a" text-anchor="start">Boundary</text><text x="58" y="494" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">1 and 20</text><text x="250" y="464" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Accepted</text><text x="250" y="490" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">the right operator: if 20 is rejected, &lt; 20 was used instead of ≤ 20</text><rect x="30" y="524" width="840" height="80" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="524" width="10" height="80" rx="5" fill="#8a6d0d"/><text x="58" y="556" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">Just outside</text><text x="58" y="586" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">0 and 21</text><text x="250" y="556" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">Rejected</text><text x="250" y="582" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">some books call these boundary, others erroneous: state the expected result</text><rect x="30" y="616" width="840" height="80" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="616" width="10" height="80" rx="5" fill="#b5602e"/><text x="58" y="648" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Erroneous</text><text x="58" y="678" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">35, −4, "ten"</text><text x="250" y="648" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">Rejected</text><text x="250" y="674" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">invalid data is rejected and the program does not crash</text>
