<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 906" width="900" height="906" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="906" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A validation loop</text>

<rect x="30" y="110" width="840" height="206" rx="12" fill="#1e2a44"/><text x="48" y="140" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="400" fill="#e8eef0" text-anchor="start">OUTPUT "Enter your age (11 to 18)"</text><text x="48" y="170" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="400" fill="#e8eef0" text-anchor="start">age ← STRING_TO_INT(USERINPUT)</text><text x="48" y="200" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="700" fill="#d4b02e" text-anchor="start">WHILE age &lt; 11 OR age > 18</text><text x="68.4" y="230" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="400" fill="#e8eef0" text-anchor="start">OUTPUT "Age must be from 11 to 18. Try again"</text><text x="68.4" y="260" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="400" fill="#e8eef0" text-anchor="start">age ← STRING_TO_INT(USERINPUT)</text><text x="48" y="290" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="400" fill="#e8eef0" text-anchor="start">ENDWHILE</text><text x="30" y="380" font-size="17" font-weight="600" fill="#8a6d0d" text-anchor="start">Invalid condition uses OR: outside the range</text><text x="30" y="402" font-size="17" font-weight="600" fill="#8a6d0d" text-anchor="start">breaks one limit or the other.</text><text x="30" y="460" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The REPEAT version tests the valid condition with</text><text x="30" y="481" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">AND:</text><text x="30" y="512" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">UNTIL age ≥ 11 AND age ≤ 18</text><g transform="translate(0 226)"><rect x="470" y="110" width="400" height="540" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="530" y="127" width="260" height="46" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="660" y="156" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Prompt and input age</text><line x1="660" y1="173" x2="660" y2="210" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><path d="M660,215 L810,270 L660,325 L510,270 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="660" y="266" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">age &lt; 11 OR</text><text x="660" y="286" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">age > 18 ?</text><line x1="660" y1="325" x2="660" y2="372" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><text x="682" y="356" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">True</text><rect x="510" y="377" width="300" height="46" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="660" y="406" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">Error message</text><line x1="660" y1="423" x2="660" y2="456" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><rect x="510" y="457" width="300" height="46" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="660" y="486" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Input age again</text><path d="M510,480 L490,480 L490,194 L654,194" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahR)"/><path d="M810,270 L852,270 L852,590 L772,590" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><text x="838" y="258" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">False</text><rect x="550" y="567" width="220" height="46" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="660" y="596" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">Use the valid age</text></g>
</svg>