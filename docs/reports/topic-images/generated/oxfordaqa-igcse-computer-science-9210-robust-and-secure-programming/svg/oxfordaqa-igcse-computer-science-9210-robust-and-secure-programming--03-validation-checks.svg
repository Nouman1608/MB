<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="900" height="630" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="630" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three validation checks</text>

<text x="450" y="132" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">Each condition below means the input is INVALID</text><rect x="30" y="150" width="268" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="182" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PRESENCE</text><text x="50" y="210" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Empty string</text><rect x="46" y="228" width="236" height="50" rx="10" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="164" y="259" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="700" fill="#d4b02e" text-anchor="middle">LEN(name) = 0</text><text x="50" y="306" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">a required name field</text><rect x="316" y="150" width="268" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="336" y="182" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MINIMUM LENGTH</text><text x="336" y="210" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Too short</text><rect x="332" y="228" width="236" height="50" rx="10" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="259" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="700" fill="#d4b02e" text-anchor="middle">LEN(username) &lt; 6</text><text x="336" y="306" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">usernames of at least 6</text><text x="336" y="326" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">characters</text><rect x="602" y="150" width="268" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="622" y="182" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RANGE</text><text x="622" y="210" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Outside the range</text><rect x="618" y="228" width="236" height="50" rx="10" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="736" y="259" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="700" fill="#d4b02e" text-anchor="middle">qty &lt; 1 OR qty > 20</text><text x="622" y="306" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">order quantity from 1 to 20</text><rect x="30" y="370" width="840" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="408" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Overlap: a username must be present and at least 6 characters</text><line x1="90" y1="490" x2="830" y2="490" stroke="#1e2a44" stroke-width="3"/><rect x="78" y="462" width="524" height="56" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5" opacity="0.9"/><rect x="56" y="452" width="68" height="76" rx="16" fill="none" stroke="#8a6d0d" stroke-width="3" stroke-dasharray="7 5"/><circle cx="90" cy="490" r="8" fill="#b5602e"/><text x="90" y="554" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">0</text><circle cx="190" cy="490" r="8" fill="#b5602e"/><text x="190" y="554" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><circle cx="290" cy="490" r="8" fill="#b5602e"/><text x="290" y="554" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><circle cx="390" cy="490" r="8" fill="#b5602e"/><text x="390" y="554" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><circle cx="490" cy="490" r="8" fill="#b5602e"/><text x="490" y="554" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><circle cx="590" cy="490" r="8" fill="#b5602e"/><text x="590" y="554" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><circle cx="690" cy="490" r="8" fill="#2e6b62"/><text x="690" y="554" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><circle cx="790" cy="490" r="8" fill="#2e6b62"/><text x="790" y="554" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">7</text><text x="840" y="496" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">length</text><text x="90" y="442" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">empty: 0</text><text x="340" y="442" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">LEN(username) &lt; 6: rejected</text><text x="740" y="442" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">accepted</text><text x="54" y="584" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">An empty string has length 0, which is already less than 6, so the length check alone is enough.</text>
</svg>