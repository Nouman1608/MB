<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 830" width="900" height="830" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="830" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">An authentication routine</text>

<rect x="30" y="110" width="840" height="690" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="150" y="127" width="300" height="46" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="300" y="156" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">attempts ← 0, success ← False</text><line x1="300" y1="173" x2="300" y2="206" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="150" y="209" width="300" height="46" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="300" y="238" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Input username and password</text><line x1="300" y1="255" x2="300" y2="290" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><path d="M300,290 L465,350 L300,410 L135,350 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="300" y="346" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">user = "jkaur" AND</text><text x="300" y="366" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">pass = "Orchid#7" ?</text><path d="M465,350 L640,350 L640,396" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><text x="560" y="338" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">True</text><rect x="525" y="397" width="230" height="46" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="640" y="426" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">success ← True</text><line x1="300" y1="410" x2="300" y2="452" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><text x="322" y="436" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">False</text><rect x="150" y="455" width="300" height="46" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="300" y="484" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">attempts ← attempts + 1</text><line x1="300" y1="501" x2="300" y2="524" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><rect x="130" y="525" width="340" height="46" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="300" y="554" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">"Incorrect username or password"</text><line x1="300" y1="571" x2="300" y2="604" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><path d="M640,443 L640,664 L472,664" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><path d="M300,609 L470,664 L300,719 L130,664 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="300" y="660" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">success OR</text><text x="300" y="680" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">attempts = MaxAttempts ?</text><path d="M130,664 L62,664 L62,232 L144,232" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><text x="100" y="652" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">False</text><line x1="300" y1="719" x2="300" y2="750" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="322" y="742" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">True</text><text x="300" y="782" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">IF success: "Welcome", else "access denied"</text><rect x="476" y="130" width="380" height="166" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="494" y="160" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">Design points</text><text x="494" y="190" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">• OR: stop on success or no attempts left</text><text x="494" y="216" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">• Message never says which item was wrong</text><text x="494" y="242" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">• MaxAttempts ← 3 is a named constant</text><text x="494" y="268" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">• Case-sensitive: "orchid#7" is rejected</text>
</svg>