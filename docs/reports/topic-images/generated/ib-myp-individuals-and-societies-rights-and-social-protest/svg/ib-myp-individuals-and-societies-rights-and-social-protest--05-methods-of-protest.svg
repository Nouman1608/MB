<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 754" width="900" height="754" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="754" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Methods of protest</text>

<rect x="110" y="120" width="760" height="74" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="130" y="152" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Persuasion</text><text x="130" y="178" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">petitions, speeches, marches</text><text x="850" y="164" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="end" font-style="italic">March on Washington, 1963</text><circle cx="490" cy="157" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="110" y="202" width="760" height="74" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="130" y="234" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Legal and political</text><text x="130" y="260" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">court cases, lobbying, voter registration</text><text x="850" y="246" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="end" font-style="italic">Brown v. Board, 1954</text><rect x="110" y="284" width="760" height="74" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="130" y="316" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Non-cooperation</text><text x="130" y="342" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">boycotts, strikes, refusing unjust laws</text><text x="850" y="328" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="end" font-style="italic">Montgomery Bus Boycott</text><circle cx="490" cy="321" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="110" y="366" width="760" height="74" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="130" y="398" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Non-violent intervention</text><text x="130" y="424" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">sit-ins, occupations, freedom rides</text><text x="850" y="410" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="end" font-style="italic">Greensboro, 1960</text><circle cx="490" cy="403" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="110" y="448" width="760" height="74" rx="12" fill="#f6e3d6" stroke="#c9d6d4" stroke-width="2.2"/><text x="130" y="480" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Militant action against property</text><text x="130" y="506" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">window-smashing, arson</text><text x="850" y="492" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="end" font-style="italic">WSPU, 1912–14</text><rect x="110" y="530" width="760" height="74" rx="12" fill="#efcdb8" stroke="#c9d6d4" stroke-width="2.2"/><text x="130" y="562" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Armed struggle</text><text x="130" y="588" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">sabotage, guerrilla war</text><text x="850" y="574" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="end" font-style="italic">Umkhonto we Sizwe, from 1961</text><rect x="110" y="612" width="760" height="74" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="130" y="644" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">International pressure</text><text x="130" y="670" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">sanctions, embargoes, sports boycotts</text><text x="850" y="656" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="end" font-style="italic">UN arms embargo, 1977</text><line x1="70" y1="125" x2="70" y2="598" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><text x="52" y="370" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle" transform="rotate(-90 52 370)">more confrontational</text><circle cx="210" cy="716" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="226" y="722" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Gene Sharp’s 1973 headings of non-violent action (198 methods)</text>
</svg>