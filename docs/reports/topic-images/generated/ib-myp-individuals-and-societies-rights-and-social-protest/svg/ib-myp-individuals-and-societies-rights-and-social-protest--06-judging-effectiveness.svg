<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 628" width="900" height="628" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="628" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Was the Montgomery Bus Boycott effective?</text>

<rect x="30" y="110" width="840" height="92.84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="84" cy="156.42000000000002" r="28" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="84" y="166.50000000000003" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="136" y="149.85" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Aims achieved? (de jure)</text><text x="136" y="175.57" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Aim: end segregated seating on Montgomery buses. Achieved: ruled unconstitutional, 1956.</text><rect x="30" y="216.84" width="840" height="92.84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="84" cy="263.26" r="28" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="84" y="273.34" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="136" y="256.69" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Real change? (de facto)</text><text x="136" y="282.41" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Limits: Southern schools and voting stayed segregated or restricted for years.</text><rect x="30" y="323.68" width="840" height="92.84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="84" cy="370.1" r="28" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="84" y="380.18" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="136" y="363.53000000000003" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">When?</text><text x="136" y="389.25000000000006" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Short-term local win; longer term, it made King a national figure.</text><rect x="30" y="430.52" width="840" height="92.84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="84" cy="476.94" r="28" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="84" y="487.02" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="136" y="470.37" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Why?</text><text x="136" y="496.09000000000003" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Economic pressure on the bus company, unity for 381 days, a court case alongside.</text><rect x="30" y="543.36" width="840" height="53.760000000000005" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="575.46" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Judgement: highly effective for its local aim. Always state the aims first.</text>
</svg>