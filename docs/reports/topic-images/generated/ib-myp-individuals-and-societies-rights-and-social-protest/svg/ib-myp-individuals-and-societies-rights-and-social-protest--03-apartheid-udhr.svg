<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 715" width="900" height="715" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="715" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Applying the UDHR to apartheid</text>

<text x="225" y="140" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">Apartheid law</text><text x="700" y="140" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">UDHR article breached</text><rect x="30" y="158" width="390" height="92" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="44" y="198.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Population Registration Act (1950)</text><text x="44" y="224.4" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">classified every person by race</text><rect x="30" y="268" width="390" height="92" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="44" y="308.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Group Areas Act (1950)</text><text x="44" y="334.40000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">decided where each group could live</text><rect x="30" y="378" width="390" height="92" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="44" y="409.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Pass laws</text><text x="44" y="434.90000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">controlled where Black South Africans could</text><text x="44" y="454.70000000000005" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">travel and work</text><rect x="30" y="488" width="390" height="92" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="44" y="541.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Black majority denied the vote</text><rect x="560" y="175" width="310" height="76" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="715" y="207.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Article 2</text><text x="715" y="233.35000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">non-discrimination</text><rect x="560" y="320" width="310" height="76" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="715" y="352.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Article 13</text><text x="715" y="378.35" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">freedom of movement</text><rect x="560" y="470" width="310" height="76" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="715" y="502.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Article 21</text><text x="715" y="528.35" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">take part in government; elections</text><line x1="424" y1="204" x2="554" y2="213" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="424" y1="314" x2="554" y2="358" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="424" y1="424" x2="554" y2="358" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="424" y1="534" x2="554" y2="508" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="610" width="840" height="74.88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="641.15" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">South Africa abstained in 1948 and the UDHR is not binding, so critics used it as a moral</text><text x="450" y="663.59" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">standard, not as law.</text>
</svg>