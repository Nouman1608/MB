<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 625" width="900" height="625" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="625" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Percentage points, not percent</text>

<rect x="30" y="110" width="840" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="148" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Norland (fictional): 480,000 eligible minority adults</text><rect x="250" y="175" width="140" height="60" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><rect x="250" y="175" width="560" height="60" rx="6" fill="none" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="6 5"/><text x="230" y="203" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="end">Before</text><text x="230" y="225" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">120,000 registered</text><text x="400" y="213" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">25%</text><rect x="250" y="265" width="364" height="60" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><rect x="250" y="265" width="560" height="60" rx="6" fill="none" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="6 5"/><text x="230" y="293" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="end">Five years later</text><text x="230" y="315" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">312,000 registered</text><text x="624" y="303" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">65%</text><text x="250" y="365" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">0%</text><text x="810" y="365" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">100%</text><text x="450" y="410" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">registration rate: 25% → 65%</text><text x="450" y="440" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">registrations: (312,000 − 120,000) ÷ 120,000 × 100 = 160% increase</text><rect x="30" y="490" width="410" height="105" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="48" y="526.05" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Wrong</text><text x="48" y="553.17" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“A 40% rise”</text><rect x="460" y="490" width="410" height="105" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="526.05" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">✓ Right</text><text x="478" y="553.17" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“A rise of 40 percentage points” (and</text><text x="478" y="574.29" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">registering is not voting)</text>
</svg>