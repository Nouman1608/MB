<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 595" width="900" height="595" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="595" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Rights in law and rights in practice</text>

<rect x="30" y="120" width="380" height="170" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="220" y="177.8" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">De jure</text><text x="220" y="206.24" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">exists in law</text><text x="220" y="228.68" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle"></text><text x="220" y="251.12" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">1870: US law gave Black men the vote</text><rect x="490" y="120" width="380" height="170" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="680" y="166.8" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">De facto</text><text x="680" y="195.24" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">exists in practice</text><text x="680" y="217.68" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle"></text><text x="680" y="240.12" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">for decades many could not use it in the</text><text x="680" y="262.56" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">South</text><path d="M418,205 L482,205" stroke="#b5602e" stroke-width="4" stroke-dasharray="7 6"/><text x="450" y="190" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">gap</text><rect x="150" y="320" width="600" height="80" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="450" y="369.45" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Many protests target this gap</text><text x="30" y="440" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Two families of rights</text><rect x="30" y="455" width="410" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="235" y="504.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Civil and political</text><text x="235" y="531.17" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">liberty, free speech, fair trial, voting</text><rect x="460" y="455" width="410" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="665" y="504.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Economic, social and cultural</text><text x="665" y="531.17" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">work, education, health</text>
</svg>