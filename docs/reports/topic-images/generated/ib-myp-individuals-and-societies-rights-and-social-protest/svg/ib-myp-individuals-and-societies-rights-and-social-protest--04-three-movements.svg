<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" width="900" height="780" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="780" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three protest movements, key dates</text>

<rect x="30" y="110" width="270" height="640" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="110" width="270" height="56" rx="14" fill="#2e6b62"/><rect x="30" y="150" width="270" height="16" fill="#2e6b62"/><text x="165" y="146" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">US civil rights</text><line x1="56" y1="190" x2="56" y2="600" stroke="#2e6b62" stroke-width="3"/><circle cx="56" cy="190" r="8" fill="#2e6b62"/><text x="74" y="196" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">1954</text><text x="74" y="218" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Brown v. Board of Education</text><circle cx="56" cy="272" r="8" fill="#2e6b62"/><text x="74" y="278" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">1955–56</text><text x="74" y="300" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Montgomery Bus Boycott, 381</text><text x="74" y="319" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">days</text><circle cx="56" cy="354" r="8" fill="#2e6b62"/><text x="74" y="360" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">1960</text><text x="74" y="382" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Greensboro sit-in</text><circle cx="56" cy="436" r="8" fill="#2e6b62"/><text x="74" y="442" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">1963</text><text x="74" y="464" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Birmingham; March on</text><text x="74" y="483" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Washington</text><circle cx="56" cy="518" r="8" fill="#2e6b62"/><text x="74" y="524" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">1964</text><text x="74" y="546" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Civil Rights Act</text><circle cx="56" cy="600" r="8" fill="#2e6b62"/><text x="74" y="606" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">1965</text><text x="74" y="628" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Selma; Voting Rights Act</text><rect x="315" y="110" width="270" height="640" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="315" y="110" width="270" height="56" rx="14" fill="#b5602e"/><rect x="315" y="150" width="270" height="16" fill="#b5602e"/><text x="450" y="146" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">Anti-apartheid</text><line x1="341" y1="190" x2="341" y2="682" stroke="#b5602e" stroke-width="3"/><circle cx="341" cy="190" r="8" fill="#b5602e"/><text x="359" y="196" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">1952</text><text x="359" y="218" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Defiance Campaign</text><circle cx="341" cy="272" r="8" fill="#b5602e"/><text x="359" y="278" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">1955</text><text x="359" y="300" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Freedom Charter</text><circle cx="341" cy="354" r="8" fill="#b5602e"/><text x="359" y="360" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">1960</text><text x="359" y="382" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Sharpeville; ANC banned</text><circle cx="341" cy="436" r="8" fill="#b5602e"/><text x="359" y="442" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">1961</text><text x="359" y="464" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Umkhonto we Sizwe</text><circle cx="341" cy="518" r="8" fill="#b5602e"/><text x="359" y="524" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">1976</text><text x="359" y="546" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Soweto uprising</text><circle cx="341" cy="600" r="8" fill="#b5602e"/><text x="359" y="606" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">1990</text><text x="359" y="628" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">ANC unbanned; Mandela freed</text><circle cx="341" cy="682" r="8" fill="#b5602e"/><text x="359" y="688" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">1994</text><text x="359" y="710" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">first election open to all</text><text x="359" y="729" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">races</text><rect x="600" y="110" width="270" height="640" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="600" y="110" width="270" height="56" rx="14" fill="#8a6d0d"/><rect x="600" y="150" width="270" height="16" fill="#8a6d0d"/><text x="735" y="146" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">Women’s suffrage (UK)</text><line x1="626" y1="190" x2="626" y2="682" stroke="#8a6d0d" stroke-width="3"/><circle cx="626" cy="190" r="8" fill="#8a6d0d"/><text x="644" y="196" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">1897</text><text x="644" y="218" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">NUWSS (suffragists)</text><circle cx="626" cy="272" r="8" fill="#8a6d0d"/><text x="644" y="278" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">1903</text><text x="644" y="300" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">WSPU (suffragettes)</text><circle cx="626" cy="354" r="8" fill="#8a6d0d"/><text x="644" y="360" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">1909</text><text x="644" y="382" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">hunger strikes begin</text><circle cx="626" cy="436" r="8" fill="#8a6d0d"/><text x="644" y="442" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">1913</text><text x="644" y="464" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Cat and Mouse Act</text><circle cx="626" cy="518" r="8" fill="#8a6d0d"/><text x="644" y="524" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">1914</text><text x="644" y="546" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">WSPU suspends campaign</text><circle cx="626" cy="600" r="8" fill="#8a6d0d"/><text x="644" y="606" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">1918</text><text x="644" y="628" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">vote for women over 30 with</text><text x="644" y="647" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">property</text><circle cx="626" cy="682" r="8" fill="#8a6d0d"/><text x="644" y="688" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">1928</text><text x="644" y="710" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Equal Franchise Act: vote at</text><text x="644" y="729" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">21</text>
</svg>