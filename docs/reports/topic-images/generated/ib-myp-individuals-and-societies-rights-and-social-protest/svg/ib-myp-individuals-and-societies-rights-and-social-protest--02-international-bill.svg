<rect width="900" height="718" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The International Bill of Human Rights</text>

<rect x="250" y="120" width="400" height="150" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="450" y="177.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">UDHR, 10 December 1948</text><text x="450" y="206.39" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">General Assembly declaration, 30 articles</text><text x="450" y="228.82999999999998" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">not legally binding: moral force</text><line x1="380" y1="274" x2="250" y2="330" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="520" y1="274" x2="650" y2="330" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="450" y="312" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">1966</text><rect x="30" y="336" width="410" height="150" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="235" y="392.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">International Covenant on Civil and</text><text x="235" y="417.13" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Political Rights</text><text x="235" y="445.57" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">binding treaty</text><rect x="460" y="336" width="410" height="150" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="665" y="392.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">International Covenant on Economic,</text><text x="665" y="417.13" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Social and Cultural Rights</text><text x="665" y="445.57" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">binding treaty</text><text x="450" y="520" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Both in force from 1976 for the states that ratified them</text><rect x="20" y="105" width="860" height="490" rx="18" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="10 7"/><text x="450" y="572" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Together: the International Bill of Human Rights</text><rect x="30" y="615" width="840" height="72.24000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="645.2" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Vote of 1948: 48 for, none against, 8 abstentions (including the USSR, South Africa and Saudi</text><text x="450" y="666.32" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Arabia).</text>
</svg>