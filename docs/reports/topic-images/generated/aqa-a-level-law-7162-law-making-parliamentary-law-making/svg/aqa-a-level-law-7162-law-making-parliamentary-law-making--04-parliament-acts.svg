<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 559" width="900" height="559" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="559" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">When the Lords and Commons disagree</text>

<rect x="30" y="100" width="400" height="158" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PARLIAMENT ACT 1911</text><text x="48" y="156.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Lords lose their veto over most public</text><text x="48" y="180.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Bills</text><text x="48" y="209.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="209.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Money Bills: delay of <tspan font-weight="700" fill="#1e2a44">one</tspan> <tspan font-weight="700" fill="#1e2a44">month</tspan></text><text x="48" y="235.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="235.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Other Bills: delay of <tspan font-weight="700" fill="#1e2a44">two</tspan> <tspan font-weight="700" fill="#1e2a44">years</tspan></text><line x1="436" y1="179" x2="464" y2="179" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="470" y="100" width="400" height="158" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="488" y="130" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">PARLIAMENT ACT 1949</text><text x="488" y="156.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Delay cut further</text><text x="488" y="185.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="503.2" y="185.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Non-money Bills: delay of <tspan font-weight="700" fill="#1e2a44">one</tspan> <tspan font-weight="700" fill="#1e2a44">year</tspan></text><text x="450" y="304" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Used rarely: Acts passed under the Parliament Acts</text><rect x="171.928" y="322" width="185.36" height="30" rx="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="264.608" y="342.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">War Crimes Act 1991</text><rect x="367.288" y="322" width="360.784" height="30" rx="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="547.6800000000001" y="342.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">European Parliamentary Elections Act 1999</text><rect x="192.10399999999998" y="362" width="342.368" height="30" rx="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="363.288" y="382.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Sexual Offences (Amendment) Act 2000</text><rect x="544.472" y="362" width="163.424" height="30" rx="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="626.184" y="382.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Hunting Act 2004</text><rect x="30" y="416" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="450.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Salisbury Convention</text><text x="50" y="480.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The Lords do not usually block, at second reading, a government Bill delivering a manifesto</text><text x="50" y="502.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">commitment.</text>
</svg>