<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 469" width="900" height="469" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="469" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Before a Bill: from options to proposals</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Consultation is normal for significant reform, but not legally required</text>
<rect x="30" y="124" width="253.33333333333334" height="188" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GREEN PAPER</text><text x="46" y="178.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Options</text><text x="46" y="207.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Invites comment from</text><text x="46" y="228.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">anyone: professional bodies,</text><text x="46" y="249.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">pressure groups,</text><text x="46" y="270.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">businesses, the public.</text><text x="46" y="291.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Genuinely open.</text><line x1="289.33333333333337" y1="218" x2="317.33333333333337" y2="218" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="124" width="253.33333333333334" height="188" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="339.33333333333337" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WHITE PAPER</text><text x="339.33333333333337" y="178.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Settled proposals</text><text x="339.33333333333337" y="207.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The government’s firm</text><text x="339.33333333333337" y="228.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">plans, usually after</text><text x="339.33333333333337" y="249.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">consultation; often followed</text><text x="339.33333333333337" y="270.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">directly by a Bill.</text><line x1="582.6666666666667" y1="218" x2="610.6666666666667" y2="218" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="124" width="253.33333333333334" height="188" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="632.6666666666667" y="152" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">DRAFT BILL (MAY BE)</text><text x="632.6666666666667" y="178.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Pre-legislative scrutiny</text><text x="632.6666666666667" y="207.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A parliamentary committee</text><text x="632.6666666666667" y="228.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">checks it before formal</text><text x="632.6666666666667" y="249.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">introduction, so technical</text><text x="632.6666666666667" y="270.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">problems are fixed early.</text><rect x="30" y="336" width="412" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="364" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FOR</text><text x="46" y="395.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Consultation improves quality and legitimacy</text><rect x="458" y="336" width="412" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="364" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">AGAINST</text><text x="474" y="395.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Government decides whether to consult, for how</text><text x="474" y="416.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">long, and whether to take any notice of responses</text>
</svg>