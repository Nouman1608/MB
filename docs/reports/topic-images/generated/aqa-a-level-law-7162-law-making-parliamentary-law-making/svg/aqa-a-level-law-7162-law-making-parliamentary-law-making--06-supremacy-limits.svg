<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 615" width="900" height="615" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="615" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Parliamentary supremacy and its limits</text>

<rect x="30" y="100" width="840" height="199" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THE DOCTRINE</text><rect x="46" y="146" width="261.3333333333333" height="137" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="174.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Can make or unmake any</text><text x="60" y="197.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">law</text><rect x="319.3333333333333" y="146" width="261.3333333333333" height="137" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="333.3333333333333" y="174.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Cannot bind its</text><text x="333.3333333333333" y="197.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">successors</text><text x="333.3333333333333" y="225" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Later Act impliedly repeals:</text><text x="333.3333333333333" y="245" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Vauxhall</tspan> <tspan font-style="italic">Estates</tspan> (1932); <tspan font-style="italic">Ellen</tspan></text><text x="333.3333333333333" y="265" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Street</tspan> <tspan font-style="italic">Estates</tspan> (1934)</text><rect x="592.6666666666666" y="146" width="261.3333333333333" height="137" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="606.6666666666666" y="174.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">No court can set aside an</text><text x="606.6666666666666" y="197.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Act</text><text x="606.6666666666666" y="225" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">British</tspan> <tspan font-style="italic">Railways</tspan> <tspan font-style="italic">Board</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Pickin</tspan></text><text x="606.6666666666666" y="245" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">(1974)</text><text x="450" y="321" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">limited by</text><rect x="30" y="341" width="272" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="367" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">CONSTITUTIONAL STATUTES</text><text x="44" y="398" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Thoburn</tspan> (2002): e.g. European</text><text x="44" y="418" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Communities Act 1972, HRA 1998</text><text x="44" y="438" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">need express repeal</text><rect x="314" y="341" width="272" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="328" y="367" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">HUMAN RIGHTS ACT 1998</text><text x="328" y="398" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">s3 compatible reading; s4</text><text x="328" y="418" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">declaration; s19 statement of</text><text x="328" y="438" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">compatibility</text><rect x="598" y="341" width="272" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="612" y="367" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">DEVOLUTION</text><text x="612" y="398" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Scotland Act, Government of</text><text x="612" y="418" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Wales Act, Northern Ireland Act</text><text x="612" y="438" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">1998. Sewel Convention not</text><text x="612" y="458" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">enforceable: <tspan font-style="italic">Miller</tspan> (2017)</text><rect x="30" y="488" width="414" height="95" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="514" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">EU MEMBERSHIP (HISTORICAL)</text><text x="44" y="545" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Factortame</tspan>: courts could disapply conflicting Acts;</text><text x="44" y="565" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">removed by withdrawal</text><rect x="456" y="488" width="414" height="95" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="470" y="514" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">PRACTICAL AND POLITICAL</text><text x="470" y="545" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Electorate, public opinion and international obligations</text>
</svg>