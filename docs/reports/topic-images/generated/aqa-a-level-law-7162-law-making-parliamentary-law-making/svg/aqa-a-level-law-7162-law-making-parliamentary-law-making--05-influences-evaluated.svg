<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five influences on Parliament, weighed</text>

<clipPath id="tc100"><rect x="30" y="100" width="840" height="414" rx="14"/></clipPath><g clip-path="url(#tc100)"><rect x="30" y="100" width="157.5" height="44" fill="#b5d3cf"/><text x="42" y="125.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Influence</text><rect x="187.5" y="100" width="262.5" height="44" fill="#b5d3cf"/><text x="199.5" y="125.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">How it works</text><rect x="450" y="100" width="210" height="44" fill="#dce9e7"/><text x="462" y="125.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">+ Advantage</text><rect x="660" y="100" width="210" height="44" fill="#f2e7b8"/><text x="672" y="125.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">− Disadvantage</text><rect x="30" y="144" width="157.5" height="102" fill="#dce9e7"/><text x="42" y="168" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Pressure groups</text><rect x="187.5" y="144" width="262.5" height="102" fill="#ffffff"/><text x="199.5" y="168" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Insider (British Medical</text><text x="199.5" y="188" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Association, Law Society) and</text><text x="199.5" y="208" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">outsider groups; Gina Martin’s</text><text x="199.5" y="228" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">campaign; “Finn’s Law” 2019</text><rect x="450" y="144" width="210" height="102" fill="#ffffff"/><text x="462" y="168" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Expertise; a voice for the</text><text x="462" y="188" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">unheard</text><rect x="660" y="144" width="210" height="102" fill="#ffffff"/><text x="672" y="168" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Money and contacts;</text><text x="672" y="188" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">narrow interest as</text><text x="672" y="208" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">opinion; law too narrow</text><line x1="30" y1="246" x2="870" y2="246" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="246" width="157.5" height="62" fill="#dce9e7"/><text x="42" y="270" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Media</text><rect x="187.5" y="246" width="262.5" height="62" fill="#f8faf9"/><text x="199.5" y="270" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Newspapers, broadcasters and</text><text x="199.5" y="290" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">social media publicise issues</text><rect x="450" y="246" width="210" height="62" fill="#f8faf9"/><text x="462" y="270" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Fast, wide reach, exposes</text><text x="462" y="290" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">failures</text><rect x="660" y="246" width="210" height="62" fill="#f8faf9"/><text x="672" y="270" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Owners’ agendas;</text><text x="672" y="290" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">rushed, badly drafted law</text><line x1="30" y1="308" x2="870" y2="308" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="308" width="157.5" height="82" fill="#dce9e7"/><text x="42" y="332" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Parties and</text><text x="42" y="352" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">manifestos</text><rect x="187.5" y="308" width="262.5" height="82" fill="#ffffff"/><text x="199.5" y="332" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Manifesto sets the programme;</text><text x="199.5" y="352" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">King’s Speech announces it</text><rect x="450" y="308" width="210" height="82" fill="#ffffff"/><text x="462" y="332" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Democratic mandate;</text><text x="462" y="352" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">voters know what to</text><text x="462" y="372" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">expect</text><rect x="660" y="308" width="210" height="82" fill="#ffffff"/><text x="672" y="332" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Large majority, little</text><text x="672" y="352" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">opposition; policies</text><text x="672" y="372" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">bundled</text><line x1="30" y1="390" x2="870" y2="390" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="390" width="157.5" height="62" fill="#dce9e7"/><text x="42" y="414" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Law Commission</text><rect x="187.5" y="390" width="262.5" height="62" fill="#f8faf9"/><text x="199.5" y="414" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Reports with draft Bills, e.g.</text><text x="199.5" y="434" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Fraud Act 2006</text><rect x="450" y="390" width="210" height="62" fill="#f8faf9"/><text x="462" y="414" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Independence and</text><text x="462" y="434" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">expertise; consultation</text><rect x="660" y="390" width="210" height="62" fill="#f8faf9"/><text x="672" y="414" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Depends on government</text><text x="672" y="434" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">time; many delayed</text><line x1="30" y1="452" x2="870" y2="452" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="452" width="157.5" height="62" fill="#dce9e7"/><text x="42" y="476" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Public opinion</text><rect x="187.5" y="452" width="262.5" height="62" fill="#ffffff"/><text x="199.5" y="476" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Constituents, petitions and polls</text><rect x="450" y="452" width="210" height="62" fill="#ffffff"/><text x="462" y="476" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Keeps law in line with</text><text x="462" y="496" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">social attitudes</text><rect x="660" y="452" width="210" height="62" fill="#ffffff"/><text x="672" y="476" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Volatile, poorly informed</text><text x="672" y="496" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">or hostile to minorities</text></g><line x1="187.5" y1="100" x2="187.5" y2="514" stroke="#c9d6d4" stroke-width="1.5"/><line x1="450" y1="100" x2="450" y2="514" stroke="#c9d6d4" stroke-width="1.5"/><line x1="660" y1="100" x2="660" y2="514" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="100" width="840" height="414" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>