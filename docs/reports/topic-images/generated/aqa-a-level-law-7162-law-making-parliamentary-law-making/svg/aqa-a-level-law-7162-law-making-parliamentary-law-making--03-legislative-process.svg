<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 878" width="900" height="878" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="878" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From Bill to Act in force</text>

<rect x="110" y="100" width="500" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="126.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">First reading</text><text x="122" y="154" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Formal: title read; no debate</text><circle cx="62" cy="135" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="142.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="110" y="178" width="500" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="122" y="204.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Second reading</text><text x="122" y="232" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Main debate on principle; vote</text><circle cx="62" cy="213" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="220.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="110" y="256" width="500" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="122" y="282.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Committee stage</text><text x="122" y="310" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Public Bill Committee of about 16 to 50 MPs, or a Committee of the</text><text x="122" y="330" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">whole House</text><circle cx="62" cy="301" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="308.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="110" y="354" width="500" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="380.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Report stage</text><text x="122" y="408" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">The amended Bill considered; further amendments</text><circle cx="62" cy="389" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="396.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="110" y="432" width="500" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="458.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Third reading</text><text x="122" y="486" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Final debate; no substantive amendments in the Commons</text><circle cx="62" cy="467" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="474.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="636" y="100" width="234" height="402" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="753" y="140" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Then the same</text><text x="753" y="164" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">five stages in the</text><text x="753" y="188" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">other House</text><text x="656" y="224" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">In</tspan> <tspan font-weight="700">the</tspan> <tspan font-weight="700">Lords:</tspan> rarely vote</text><text x="656" y="244" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">against a government Bill</text><text x="656" y="264" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">at second reading;</text><text x="656" y="284" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">committee usually of the</text><text x="656" y="304" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">whole House or a Grand</text><text x="656" y="324" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Committee; amendments</text><text x="656" y="344" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">still possible at third</text><text x="656" y="364" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">reading</text><line x1="612" y1="301" x2="632" y2="301" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="524" width="400" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="552" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PING-PONG</text><text x="46" y="583.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">If the second House amends the Bill, it goes</text><text x="46" y="604.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">back to the first, back and forth until both agree</text><text x="46" y="625.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the text</text><rect x="470" y="524" width="400" height="122" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="486" y="552" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ROYAL ASSENT</text><text x="486" y="583.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Normally notified to each House (Royal Assent</text><text x="486" y="604.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Act 1967). Not refused since 1708: a formality by</text><text x="486" y="625.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">convention</text><line x1="434" y1="585" x2="466" y2="585" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="670" y1="650" x2="670" y2="670" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="30" y="712" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Commencement: the Act comes into force</text><rect x="30" y="728" width="270.6666666666667" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165.33333333333334" y="774.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">on Royal Assent</text><rect x="314.6666666666667" y="728" width="270.6666666666667" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="774.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">on a date stated in the Act</text><rect x="599.3333333333334" y="728" width="270.6666666666667" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="734.6666666666667" y="754.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">by a minister’s</text><text x="734.6666666666667" y="774.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">commencement order (a</text><text x="734.6666666666667" y="794.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">statutory instrument)</text><text x="450" y="840" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">Some provisions are never brought into force.</text>
</svg>