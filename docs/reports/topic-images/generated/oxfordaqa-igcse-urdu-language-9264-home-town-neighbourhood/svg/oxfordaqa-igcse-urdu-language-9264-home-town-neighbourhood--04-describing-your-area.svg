<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 912" width="900" height="912" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="912" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five moves for describing your area</text>

<text x="450" y="128" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Task: describe your area, how it has changed, and one improvement</text><rect x="30" y="148" width="840" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="186" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">1. Where you live</text><text x="846" y="232" font-family="Noto Nastaliq Urdu" font-size="23" font-weight="400" fill="#1e2a44" text-anchor="end">‏میں ایک چھوٹے قصبے میں رہتی ہوں۔‏</text><text x="846" y="268" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">I live in a small town.</text><rect x="30" y="292" width="840" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="330" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">2. What there is</text><text x="846" y="376" font-family="Noto Nastaliq Urdu" font-size="23" font-weight="400" fill="#1e2a44" text-anchor="end">‏ہمارے گھر کے قریب ایک بازار ہے‏</text><text x="846" y="412" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">There is a market near our house.</text><rect x="30" y="436" width="840" height="136" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="474" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">3. How it has changed</text><text x="846" y="520" font-family="Noto Nastaliq Urdu" font-size="23" font-weight="400" fill="#1e2a44" text-anchor="end">‏پہلے یہاں بہت کم دکانیں تھیں، لیکن اب ایک نیا شاپنگ سینٹر کھل گیا ہے۔‏</text><text x="846" y="556" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">There used to be very few shops, but now a new shopping centre has opened.</text><rect x="30" y="580" width="840" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="618" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">4. Opinion with a reason</text><text x="846" y="664" font-family="Noto Nastaliq Urdu" font-size="23" font-weight="400" fill="#1e2a44" text-anchor="end">‏مجھے اپنا علاقہ پسند ہے کیونکہ یہ پرسکون ہے‏</text><text x="846" y="700" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">I like my area because it is peaceful.</text><rect x="30" y="724" width="840" height="136" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="762" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">5. One improvement</text><text x="846" y="808" font-family="Noto Nastaliq Urdu" font-size="23" font-weight="400" fill="#1e2a44" text-anchor="end">‏اگر یہاں ایک کھیل کا میدان بن جائے تو بہت اچھا ہو گا۔‏</text><text x="846" y="844" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">If a playing field were built here, it would be very good.</text><text x="450" y="886" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Then and now gives two time frames; the condition links forward to social and global issues</text>
</svg>