<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 840" width="900" height="840" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="840" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Following the directions</text>

<rect x="30" y="110" width="840" height="350" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="700" y="116" width="44" height="338" fill="#efdfa8"/><rect x="40" y="214" width="660" height="40" fill="#efdfa8"/><rect x="40" y="374" width="660" height="40" fill="#efdfa8"/><text x="60" y="240" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">2nd street</text><text x="60" y="400" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">1st street</text><rect x="330" y="122" width="170" height="84" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="415" y="160" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏لائبریری‏</text><text x="415" y="194" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">library</text><rect x="330" y="262" width="170" height="84" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="415" y="300" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏مسجد‏</text><text x="415" y="334" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">mosque</text><path d="M500,164 C560,164 560,304 500,304" fill="none" stroke="#4a5568" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5"/><text x="566" y="240" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">opposite</text><path d="M722,440 V234 H520" fill="none" stroke="#2e6b62" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="12 8" marker-end="url(#ahT)"/><circle cx="722" cy="440" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="752" y="446" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">you start here</text><circle cx="782" cy="330" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="782" y="336.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><circle cx="620" cy="192" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="620" y="198.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><circle cx="560" cy="300" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="560" y="306.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="30" y="478" width="840" height="68" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="62" cy="512" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="518.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="92" y="518" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">go straight on</text><text x="846" y="522" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏سیدھے جائیے‏</text><rect x="30" y="558" width="840" height="68" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="62" cy="592" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="598.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="92" y="598" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">turn left into the second street</text><text x="846" y="602" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏بائیں طرف دوسری گلی میں مڑ جائیے‏</text><rect x="30" y="638" width="840" height="68" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="62" cy="672" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="678.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="92" y="678" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the library is opposite the mosque</text><text x="846" y="682" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏لائبریری مسجد کے سامنے ہے‏</text><rect x="30" y="718" width="840" height="68" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="62" cy="752" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="758.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="92" y="758" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">about ten minutes’ walk from here</text><text x="846" y="762" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏یہاں سے تقریباً دس منٹ کا پیدل راستہ‏</text><text x="450" y="816" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Polite imperatives for a stranger; gali is feminine, so the second street takes the feminine ordinal</text>
</svg>