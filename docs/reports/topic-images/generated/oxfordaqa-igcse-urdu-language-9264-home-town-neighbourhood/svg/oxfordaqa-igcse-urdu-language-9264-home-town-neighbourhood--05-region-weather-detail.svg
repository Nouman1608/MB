<rect width="900" height="712" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Describing your region</text>

<text x="54" y="138" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Landscape words</text><rect x="30" y="154" width="170" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="115" y="200" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏پہاڑی علاقہ‏</text><text x="115" y="238" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">mountainous area</text><rect x="210" y="154" width="170" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="295" y="200" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏میدانی علاقہ‏</text><text x="295" y="238" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">plains</text><rect x="390" y="154" width="160" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="470" y="200" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏ساحلی شہر‏</text><text x="470" y="238" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">coastal city</text><rect x="560" y="154" width="150" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="635" y="200" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏صحرا‏</text><text x="635" y="238" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">desert</text><rect x="720" y="154" width="150" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="795" y="200" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏دریا‏</text><text x="795" y="238" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">river</text><rect x="30" y="280" width="840" height="140" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="318" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Heat and cold: the idiom</text><text x="380" y="322" font-family="Noto Nastaliq Urdu" font-size="22" font-weight="400" fill="#8a6d0d" text-anchor="middle">‏گرمی / سردی پڑنا‏</text><text x="846" y="368" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏گرمیوں میں یہاں بہت گرمی پڑتی ہے۔‏</text><text x="846" y="404" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">It gets very hot here in summer.</text><rect x="30" y="432" width="840" height="64" rx="12" fill="#f6ece4" stroke="#b5602e" stroke-width="2.5"/><circle cx="66" cy="464" r="15" fill="#f6ece4" stroke="#b5602e" stroke-width="2.5"/><path d="M60,458 l12,12 m0,-12 l-12,12" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="170" y="472" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#b5602e" text-anchor="middle">‏یہ گرم ہے‏</text><text x="240" y="469" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">word for word: sounds unnatural about the weather</text><rect x="30" y="512" width="840" height="140" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="550" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">One memorable detail</text><text x="400" y="554" font-family="Noto Nastaliq Urdu" font-size="22" font-weight="400" fill="#2e6b62" text-anchor="middle">‏کے لیے مشہور ہے‏</text><text x="846" y="600" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏یہ علاقہ اپنے آموں کے لیے مشہور ہے۔‏</text><text x="846" y="636" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">This area is famous for its mangoes.</text><text x="450" y="688" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Choose a detail you know well, such as a crop, a festival or a landmark: no figures needed</text>
</svg>