<rect width="900" height="866" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two checks for every description</text>

<rect x="30" y="110" width="840" height="260" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Saying what there is: place phrase + is / are</text><text x="846" y="200" font-family="Noto Nastaliq Urdu" font-size="25" font-weight="400" fill="#1e2a44" text-anchor="end">‏ہمارے محلے میں ایک بڑا پارک ہے‏</text><text x="54" y="196" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">There is a big park in our neighbourhood.</text><text x="846" y="262" font-family="Noto Nastaliq Urdu" font-size="25" font-weight="400" fill="#1e2a44" text-anchor="end">‏یہاں دو اسکول ہیں‏</text><text x="54" y="258" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">There are two schools here.</text><text x="846" y="324" font-family="Noto Nastaliq Urdu" font-size="25" font-weight="400" fill="#1e2a44" text-anchor="end">‏یہاں کوئی سینما نہیں ہے‏</text><text x="54" y="320" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">There is no cinema here.</text><rect x="30" y="390" width="840" height="370" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="426" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Before a postposition, masculine nouns ending in</text><text x="560" y="430" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#2e6b62" text-anchor="middle">‏ہ‏</text><text x="582" y="426" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">or</text><text x="622" y="430" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#2e6b62" text-anchor="middle">‏ا‏</text><text x="642" y="426" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">change</text><rect x="500" y="450" width="346" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="673" y="496" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="middle">‏محلہ‏</text><line x1="494" y1="485" x2="446" y2="485" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="54" y="450" width="386" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="247" y="496" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="middle">‏محلے میں‏</text><rect x="500" y="530" width="346" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="673" y="576" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="middle">‏کمرہ‏</text><line x1="494" y1="565" x2="446" y2="565" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="54" y="530" width="386" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="247" y="576" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="middle">‏کمرے میں‏</text><rect x="500" y="610" width="346" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="673" y="656" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="middle">‏قصبہ‏</text><line x1="494" y1="645" x2="446" y2="645" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="54" y="610" width="386" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="247" y="656" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="middle">‏قصبے سے‏</text><text x="54" y="728" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Others do not change:</text><text x="330" y="732" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏گاؤں میں‏</text><text x="460" y="732" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏شہر میں‏</text><rect x="30" y="776" width="840" height="64" rx="12" fill="#f6ece4" stroke="#b5602e" stroke-width="2.5"/><circle cx="66" cy="808" r="15" fill="#f6ece4" stroke="#b5602e" stroke-width="2.5"/><path d="M60,802 l12,12 m0,-12 l-12,12" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="260" y="816" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#b5602e" text-anchor="middle">‏محلہ میں‏</text><text x="330" y="812" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">is one of the most common errors here</text>
</svg>