<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="690" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four themes, one connected map</text>

<rect x="40" y="120" width="330" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="78" cy="164" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="78" y="171.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><text x="112" y="171" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Unity and diversity</text><text x="64" y="232" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">evolution and speciation</text><rect x="530" y="120" width="330" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="568" cy="164" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="568" y="171.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><text x="602" y="171" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Form and function</text><text x="554" y="232" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">membranes</text><text x="554" y="256" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">organelles</text><rect x="530" y="470" width="330" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="568" cy="514" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="568" y="521.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">C</text><text x="602" y="508" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Interaction and</text><text x="602" y="533" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">interdependence</text><text x="554" y="582" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">cell respiration</text><text x="554" y="606" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">photosynthesis</text><rect x="40" y="470" width="330" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="78" cy="514" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="78" y="521.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">D</text><text x="112" y="508" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Continuity and</text><text x="112" y="533" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">change</text><text x="64" y="582" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">natural selection</text><line x1="695" y1="274" x2="695" y2="464" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="710" y="375" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">concepts</text><text x="710" y="397" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">needed by</text><line x1="205" y1="468" x2="205" y2="276" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><text x="190" y="375" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="end">closes the loop</text><text x="190" y="397" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="end">back to Theme A</text><ellipse cx="450" cy="370" rx="150" ry="74" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="350" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Paper 2 questions</text><text x="450" y="373" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">are set across the</text><text x="450" y="396" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">whole syllabus</text><text x="450" y="660" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Four lenses on the same living systems, not four unconnected blocks.</text>
</svg>