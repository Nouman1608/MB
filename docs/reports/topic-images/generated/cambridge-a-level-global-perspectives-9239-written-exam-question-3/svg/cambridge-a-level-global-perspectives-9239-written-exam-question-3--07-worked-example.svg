<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 724" width="900" height="724" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="724" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Comparing two sources on nurse recruitment</text>

<text x="450" y="104" font-size="17" font-weight="600" fill="#4a5568" text-anchor="middle" font-style="italic">International recruitment of nurses (fictional sources)</text><rect x="30" y="120" width="410" height="48" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="151" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Source A: hospital trust director</text><rect x="460" y="120" width="410" height="48" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="665" y="151" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Source B: researcher, country nurses leave</text><text x="450" y="198" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Conclusion</text><rect x="30" y="208" width="410" height="87.36" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="50" y="234" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">recruit trained nurses from abroad: the</text><text x="50" y="255.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fastest way to fill posts</text><rect x="460" y="208" width="410" height="87.36" rx="10" fill="#ffffff" stroke="#8a6d0d" stroke-width="2"/><text x="480" y="234" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">recruiting countries should pay into training</text><text x="480" y="255.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">systems, or recruit only where there is a</text><text x="480" y="276.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">surplus</text><text x="450" y="325.36" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Key assumption</text><rect x="30" y="335.36" width="410" height="87.36" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="50" y="361.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">benefits to nurses and families add up to</text><text x="50" y="382.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">benefits for their country (“so everyone</text><text x="50" y="403.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">benefits”)</text><rect x="460" y="335.36" width="410" height="87.36" rx="10" fill="#ffffff" stroke="#8a6d0d" stroke-width="2"/><text x="480" y="361.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">recruitment is the main cause of shortages at</text><text x="480" y="382.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">home, supported by one hospital’s experience</text><text x="450" y="452.72" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Perspective</text><rect x="30" y="462.72" width="410" height="87.36" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="50" y="488.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a manager’s duty to patients in one country: a</text><text x="50" y="509.84000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">domestic problem, an international solution</text><rect x="460" y="462.72" width="410" height="87.36" rx="10" fill="#ffffff" stroke="#8a6d0d" stroke-width="2"/><text x="480" y="488.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the countries nurses leave: a transfer of</text><text x="480" y="509.84000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">public investment from poorer to richer</text><text x="480" y="530.96" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">systems</text><rect x="30" y="568.08" width="840" height="127.32000000000001" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="52" y="600.08" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Reasoned judgement</text><text x="52" y="628.08" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Overall, Source B is more convincing: it answers A’s main argument (remittances “do not</text><text x="52" y="650.5200000000001" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">staff a maternity ward”), while A’s “everyone benefits” rests on an undefended assumption.</text><text x="52" y="672.96" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Limit: B generalises from one hospital; national staffing data would strengthen it.</text>
</svg>