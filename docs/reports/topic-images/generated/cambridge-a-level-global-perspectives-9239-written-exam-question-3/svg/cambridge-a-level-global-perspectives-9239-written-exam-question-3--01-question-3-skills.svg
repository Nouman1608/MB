<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What Question 3 asks you to do</text>

<text x="30" y="128" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">The paper: 45 marks in 90 minutes</text><rect x="30" y="144" width="373.33333333333337" height="50" rx="8" fill="#eef2f2" stroke="#c9d6d4" stroke-width="2"/><text x="216.66666666666669" y="175" font-size="17" font-weight="600" fill="#4a5568" text-anchor="middle">Questions 1 and 2</text><rect x="403.33333333333337" y="144" width="466.6666666666667" height="50" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="636.6666666666667" y="175" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Question 3: 25 marks ≈ 50 minutes</text><text x="450" y="236" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Four skills come together in Question 3</text><rect x="30" y="256" width="410" height="82" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="72" cy="297" r="26" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="72" y="303" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">AO1</text><text x="112" y="291.78" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">identify and compare key components</text><text x="112" y="314.21999999999997" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">of arguments</text><rect x="460" y="256" width="410" height="82" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="502" cy="297" r="26" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="502" y="303" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">AO1</text><text x="542" y="303" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">analyse and compare perspectives</text><rect x="30" y="352" width="410" height="82" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="72" cy="393" r="26" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="72" y="399" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">AO1</text><text x="112" y="376.56" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">evaluate arguments and make</text><text x="112" y="399" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">judgements about arguments and</text><text x="112" y="421.44" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">perspectives</text><rect x="460" y="352" width="410" height="82" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="502" cy="393" r="26" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="502" y="399" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">AO3</text><text x="542" y="399" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">communicate clearly and logically</text><rect x="30" y="460" width="840" height="74.88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="491.15" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Not two summaries plus your opinion: a comparison organised by criteria, ending in a reasoned</text><text x="450" y="513.59" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">judgement. The only question that credits AO3.</text>
