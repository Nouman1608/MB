<rect width="900" height="648" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reaching a reasoned judgement</text>

<text x="30" y="128" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Mini-judgements from your paragraphs (illustrative)</text><rect x="30" y="142" width="196" height="64" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="128" y="168" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Logic</text><text x="128" y="192" font-size="16" font-weight="400" fill="#8a6d0d" text-anchor="middle">stronger: Source B</text><line x1="128" y1="208" x2="369.5" y2="252" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="242" y="142" width="196" height="64" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="340" y="168" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Assumptions</text><text x="340" y="192" font-size="16" font-weight="400" fill="#8a6d0d" text-anchor="middle">stronger: Source B</text><line x1="340" y1="208" x2="422.5" y2="252" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="454" y="142" width="196" height="64" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="552" y="168" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Language</text><text x="552" y="192" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="middle">stronger: Source A</text><line x1="552" y1="208" x2="475.5" y2="252" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="666" y="142" width="196" height="64" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="764" y="168" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Counter-arguments</text><text x="764" y="192" font-size="16" font-weight="400" fill="#8a6d0d" text-anchor="middle">stronger: Source B</text><line x1="764" y1="208" x2="528.5" y2="252" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="258" width="840" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="68" cy="293" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="68" y="300.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="104" y="301" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Answer the question asked</text><text x="400" y="301" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">If it asks which source is more convincing, name one.</text><rect x="30" y="338" width="840" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="68" cy="373" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="68" y="380.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="104" y="381" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Weigh the criteria</text><text x="400" y="381" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Not all count equally: say which criterion decided it, and why.</text><rect x="30" y="418" width="840" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="68" cy="453" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="68" y="460.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="104" y="461" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Acknowledge the limit</text><text x="400" y="461" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“A is more convincing overall, although …”</text><text x="30" y="514" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Two weak endings</text><rect x="30" y="528" width="410" height="92" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="48" y="562.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">“Both sources have strengths and</text><text x="48" y="584.59" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">weaknesses”</text><text x="48" y="611.71" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">no judgement</text><rect x="460" y="528" width="410" height="92" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="478" y="567.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">A sudden personal view on the issue</text><text x="478" y="594.77" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">judgement not reasoned from the analysis</text>
</svg>