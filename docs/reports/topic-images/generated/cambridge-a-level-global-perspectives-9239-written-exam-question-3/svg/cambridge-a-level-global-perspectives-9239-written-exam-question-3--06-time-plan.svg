<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 611" width="900" height="611" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="611" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A plan under time pressure</text>

<rect x="30" y="110" width="840" height="74.88" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><circle cx="68" cy="147.44" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="68" y="154.64" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="104" y="154.44" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Reread and jot</text><text x="380" y="142" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">five minutes: argument parts; three or four criteria,</text><text x="380" y="164.44" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">noting which source is stronger on each</text><line x1="68" y1="186.88" x2="68" y2="200.88" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="202.88" width="840" height="74.88" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><circle cx="68" cy="240.32" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="68" y="247.51999999999998" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="104" y="247.32" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Introduction</text><text x="380" y="234.88" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the issue, the two positions, your verdict (two</text><text x="380" y="257.32" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">sentences can do it)</text><line x1="68" y1="279.76" x2="68" y2="293.76" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="295.76" width="840" height="74.88" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><circle cx="68" cy="333.2" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="68" y="340.4" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="104" y="340.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Comparative paragraphs</text><text x="380" y="327.76" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">three or four, one per criterion, each ending with a</text><text x="380" y="350.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">mini-judgement</text><line x1="68" y1="372.64" x2="68" y2="386.64" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="388.64" width="840" height="74.88" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><circle cx="68" cy="426.08" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="68" y="433.28" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="104" y="433.08" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Perspective paragraph</text><text x="380" y="420.64" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">if not already covered: the world view and context</text><text x="380" y="443.08" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">behind each source</text><line x1="68" y1="465.52" x2="68" y2="479.52" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="481.52" width="840" height="74.88" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><circle cx="68" cy="518.96" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="68" y="526.1600000000001" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="104" y="525.96" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Conclusion</text><text x="380" y="513.52" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">weighed verdict and its limit, consistent with the</text><text x="380" y="535.96" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">mini-judgements</text><text x="450" y="582.4" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle">About 50 minutes in all for 25 marks.</text>
</svg>