<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 616" width="900" height="616" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="616" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A toolkit of comparison criteria</text>

<text x="450" y="112" font-size="18" font-weight="600" fill="#2e6b62" text-anchor="middle">Choose three or four that fit the sources: each becomes a paragraph</text><rect x="30" y="132" width="410" height="105" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="168.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Logic and structure</text><text x="48" y="195.17000000000002" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Do the reasons lead to the conclusion? Any</text><text x="48" y="216.29000000000002" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">flaws?</text><rect x="460" y="132" width="410" height="105" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="178.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Use of evidence</text><text x="478" y="205.67000000000002" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">How much, of what quality? Keep it brief.</text><rect x="30" y="249" width="410" height="105" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="295.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Assumptions</text><text x="48" y="322.67" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">What must be true for each argument to work?</text><rect x="460" y="249" width="410" height="105" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="285.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Counter-arguments</text><text x="478" y="312.17" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Are objections anticipated and answered</text><text x="478" y="333.29" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fairly?</text><rect x="30" y="366" width="410" height="105" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="402.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Use of language</text><text x="48" y="429.17" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Measured or emotive? Loaded words replacing</text><text x="48" y="450.29" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reasons?</text><rect x="460" y="366" width="410" height="105" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="402.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Use of analogy</text><text x="478" y="429.17" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Are the two cases alike in the ways that</text><text x="478" y="450.29" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">matter?</text><rect x="30" y="483" width="410" height="105" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="519.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Implications</text><text x="48" y="546.17" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">What would follow if each recommendation were</text><text x="48" y="567.29" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">adopted?</text><rect x="460" y="483" width="410" height="105" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="519.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Context and provenance</text><text x="478" y="546.17" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Who wrote it, for whom, and how might that</text><text x="478" y="567.29" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">shape it?</text>
</svg>