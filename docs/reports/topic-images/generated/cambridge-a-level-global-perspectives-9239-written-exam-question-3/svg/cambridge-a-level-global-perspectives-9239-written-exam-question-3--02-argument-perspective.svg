<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 524" width="900" height="524" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="524" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Arguments and perspectives: two levels</text>

<rect x="30" y="115" width="410" height="200" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="153.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Argument level</text><text x="48" y="182.34" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“one or more reasons that lead to a</text><text x="48" y="204.78" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">conclusion”</text><text x="48" y="227.22" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="48" y="249.66000000000003" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Ask: how well do each source’s reasons</text><text x="48" y="272.1" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">support its conclusion?</text><rect x="460" y="115" width="410" height="200" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="478" y="153.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Perspective level</text><text x="478" y="182.34" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“a coherent world view which is a response</text><text x="478" y="204.78" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">to an issue”: argument, evidence and</text><text x="478" y="227.22" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">assumptions, perhaps shaped by context</text><text x="478" y="249.66000000000003" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="478" y="272.1" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Ask: which values come first, what is taken</text><text x="478" y="294.54" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">for granted, and why?</text><path d="M235,322 C235,372 665,372 665,322" fill="none" stroke="#2e6b62" stroke-width="3.5" marker-start="url(#ahT)" marker-end="url(#ahT)"/><text x="450" y="394" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">A top answer moves between the two</text><rect x="30" y="412" width="840" height="83.52000000000001" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="450" y="442" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">“Source B’s argument is weaker in its use of evidence, but its perspective takes</text><text x="450" y="465.76" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">account of people that Source A ignores.”</text>
</svg>