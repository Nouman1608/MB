<rect width="900" height="866" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Brockley Gyms: which PED is right?</text>

<rect x="30" y="110" width="840" height="520" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Monthly revenue from a 10% rise to $44</text><line x1="130" y1="560" x2="850" y2="560" stroke="#c9d6d4" stroke-width="1.5"/><text x="120" y="566" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$0</text><line x1="130" y1="480" x2="850" y2="480" stroke="#c9d6d4" stroke-width="1.5"/><text x="120" y="486" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$100,000</text><line x1="130" y1="400" x2="850" y2="400" stroke="#c9d6d4" stroke-width="1.5"/><text x="120" y="406" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$200,000</text><line x1="130" y1="320" x2="850" y2="320" stroke="#c9d6d4" stroke-width="1.5"/><text x="120" y="326" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$300,000</text><line x1="130" y1="240" x2="850" y2="240" stroke="#c9d6d4" stroke-width="1.5"/><text x="120" y="246" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$400,000</text><rect x="190" y="240" width="130" height="320" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="255" y="228" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">$400,000</text><text x="255" y="588" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Now</text><text x="255" y="610" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">10,000 × $40</text><rect x="420" y="222.07999999999998" width="130" height="337.92" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="485" y="210.07999999999998" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">$422,400</text><text x="485" y="286.08" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">+$22,400</text><text x="485" y="588" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">If PED = −0.4</text><text x="485" y="610" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">9,600 × $44</text><rect x="650" y="271.36" width="130" height="288.64" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><text x="715" y="259.36" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">$360,800</text><text x="715" y="335.36" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">−$39,200</text><text x="715" y="588" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">If PED = −1.8</text><text x="715" y="610" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">8,200 × $44</text><line x1="130" y1="240" x2="850" y2="240" stroke="#2e6b62" stroke-width="2" stroke-dasharray="7 6"/><line x1="130" y1="560" x2="850" y2="560" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="650" width="410" height="150" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="688" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Closer to −0.4</text><text x="48" y="719" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Long contracts and few rivals nearby</text><rect x="460" y="650" width="410" height="150" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="478" y="688" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Closer to −1.8</text><text x="478" y="719" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Surrounded by budget gyms</text><text x="450" y="836" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Judging which estimate fits the business’s context earns the evaluation marks.</text>
</svg>