26" y="600" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">New equilibrium marked at</text><text x="626" y="623" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">P2 and Q2</text><text x="450" y="706" font-size="17" font-weight="600" fill="#b5602e" text-anchor="middle">Marks are lost for unlabelled axes or an arrow that points the wrong way.</text>
