<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 869" width="900" height="869" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="869" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What shifts demand and supply</text>

<rect x="30" y="110" width="840" height="330" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="146" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Demand shifts</text><rect x="50" y="166" width="390" height="62" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="66" y="192" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Price of coffee pods rises: demand</text><text x="66" y="213" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">for loose coffee (substitute)</text><line x1="378" y1="197" x2="422" y2="197" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><rect x="460" y="166" width="390" height="62" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="476" y="192" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Price of pod machines falls: demand</text><text x="476" y="213" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">for pods (complement)</text><line x1="788" y1="197" x2="832" y2="197" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><rect x="50" y="242" width="390" height="62" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="66" y="279" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ageing population: mobility aids</text><line x1="378" y1="273" x2="422" y2="273" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><rect x="460" y="242" width="390" height="62" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="476" y="268" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ageing population: products bought</text><text x="476" y="289" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mainly by young adults</text><line x1="832" y1="273" x2="788" y2="273" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><rect x="50" y="318" width="390" height="62" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="66" y="344" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Seasons: ice cream, school uniforms,</text><text x="66" y="365" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">heating oil</text><line x1="378" y1="349" x2="422" y2="349" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><rect x="460" y="318" width="390" height="62" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="476" y="344" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Incomes, fashions, tastes,</text><text x="476" y="365" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">marketing, branding</text><line x1="788" y1="349" x2="832" y2="349" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="56" y="418" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Arrow shows the direction of the shift for the example given; the last row can move either way.</text><rect x="30" y="460" width="840" height="250" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="496" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Supply shifts</text><rect x="50" y="516" width="390" height="62" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="66" y="553" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Indirect tax per unit raises costs</text><line x1="422" y1="547" x2="378" y2="547" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><rect x="460" y="516" width="390" height="62" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="476" y="553" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Subsidy per unit lowers costs</text><line x1="788" y1="547" x2="832" y2="547" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><rect x="50" y="592" width="390" height="62" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="66" y="629" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Higher costs of production</text><line x1="422" y1="623" x2="378" y2="623" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><rect x="460" y="592" width="390" height="62" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="476" y="629" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">New technology</text><line x1="788" y1="623" x2="832" y2="623" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><rect x="30" y="730" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="770" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">External shocks can shift either curve suddenly.</text><text x="56" y="797" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A storm closing a port or a health scare is often temporary, so a firm must judge whether</text><text x="56" y="820" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">to change prices or wait.</text>
</svg>