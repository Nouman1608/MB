<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 716" width="900" height="716" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="716" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Movement along a curve or a shift?</text>

<rect x="30" y="110" width="410" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Own price changes</text><text x="235" y="174" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle">movement along the curve</text><line x1="100" y1="200" x2="100" y2="500" stroke="#1e2a44" stroke-width="3"/><line x1="100" y1="500" x2="410" y2="500" stroke="#1e2a44" stroke-width="3"/><text x="90" y="208" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">Price</text><text x="410" y="528" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">Quantity</text><line x1="130" y1="220" x2="380" y2="470" stroke="#2e6b62" stroke-width="4"/><text x="388" y="470" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">D</text><circle cx="200" cy="290" r="8" fill="#1e2a44"/><circle cx="300" cy="390" r="8" fill="#1e2a44"/><line x1="100" y1="290" x2="200" y2="290" stroke="#1e2a44" stroke-width="2" stroke-dasharray="6 5"/><line x1="100" y1="390" x2="300" y2="390" stroke="#1e2a44" stroke-width="2" stroke-dasharray="6 5"/><line x1="200" y1="290" x2="200" y2="500" stroke="#1e2a44" stroke-width="2" stroke-dasharray="6 5"/><line x1="300" y1="390" x2="300" y2="500" stroke="#1e2a44" stroke-width="2" stroke-dasharray="6 5"/><path d="M214,292 Q260,320 288,376" fill="none" stroke="#8a6d0d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ahO)"/><text x="90" y="296" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="end">P1</text><text x="90" y="396" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="end">P2</text><text x="200" y="522" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Q1</text><text x="300" y="522" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Q2</text><text x="235" y="562" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle">Price falls: extension of demand</text><rect x="460" y="110" width="410" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Any other factor changes</text><text x="665" y="174" font-size="17" font-weight="600" fill="#b5602e" text-anchor="middle">the whole curve shifts</text><line x1="530" y1="200" x2="530" y2="500" stroke="#1e2a44" stroke-width="3"/><line x1="530" y1="500" x2="840" y2="500" stroke="#1e2a44" stroke-width="3"/><text x="520" y="208" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">Price</text><text x="840" y="528" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">Quantity</text><line x1="540" y1="230" x2="760" y2="450" stroke="#2e6b62" stroke-width="4"/><text x="768" y="452" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">D</text><line x1="610" y1="230" x2="830" y2="450" stroke="#b5602e" stroke-width="4"/><text x="824" y="432" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">D1</text><line x1="660" y1="340" x2="718" y2="340" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><text x="665" y="562" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">e.g. a rival’s price rises: demand shifts right</text><rect x="30" y="600" width="840" height="86" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="640" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">“Demand rises because the price fell” describes a movement, not a shift.</text><text x="56" y="667" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The examiner expects the word “extension”.</text>
</svg>