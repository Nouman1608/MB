<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="660" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">When both curves shift</text>

<rect x="30" y="110" width="520" height="520" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="100" y1="150" x2="100" y2="550" stroke="#1e2a44" stroke-width="3"/><line x1="100" y1="550" x2="520" y2="550" stroke="#1e2a44" stroke-width="3"/><text x="90" y="158" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">Price</text><text x="520" y="578" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">Quantity</text><line x1="130" y1="190" x2="400" y2="520" stroke="#2e6b62" stroke-width="4"/><text x="400" y="540" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">D</text><line x1="230" y1="190" x2="500" y2="520" stroke="#2e6b62" stroke-width="4" stroke-dasharray="10 6"/><text x="500" y="540" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">D1</text><line x1="130" y1="500" x2="400" y2="200" stroke="#b5602e" stroke-width="4"/><text x="410" y="196" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">S</text><line x1="230" y1="500" x2="500" y2="200" stroke="#b5602e" stroke-width="4" stroke-dasharray="10 6"/><text x="486" y="186" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">S1</text><line x1="100" y1="352.38095238095235" x2="262.85714285714283" y2="352.38095238095235" stroke="#1e2a44" stroke-width="2" stroke-dasharray="6 5"/><line x1="262.85714285714283" y1="352.38095238095235" x2="262.85714285714283" y2="550" stroke="#1e2a44" stroke-width="2" stroke-dasharray="6 5"/><line x1="362.85714285714283" y1="352.38095238095235" x2="362.85714285714283" y2="550" stroke="#1e2a44" stroke-width="2" stroke-dasharray="6 5"/><circle cx="262.85714285714283" cy="352.38095238095235" r="8" fill="#1e2a44"/><circle cx="362.85714285714283" cy="352.38095238095235" r="8" fill="#1e2a44"/><text x="262.85714285714283" y="574" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Q1</text><text x="362.85714285714283" y="574" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Q2</text><text x="92" y="358.38095238095235" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="end">P1 = P2?</text><line x1="200" y1="260" x2="260" y2="260" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><line x1="250" y1="440" x2="310" y2="440" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><rect x="570" y="110" width="300" height="150" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="588" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Demand rises</text><text x="588" y="177" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and new technology raises supply</text><text x="588" y="198" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">at the same time</text><rect x="570" y="280" width="300" height="110" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="588" y="316" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Quantity</text><text x="588" y="347" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">certainly rises</text><rect x="570" y="410" width="300" height="220" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="588" y="446" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Price</text><text x="588" y="477" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">may rise, fall or stay the</text><text x="588" y="500" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">same: it depends on which</text><text x="588" y="523" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">shift is larger</text>
</svg>