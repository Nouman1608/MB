<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 746" width="900" height="746" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="746" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Income elasticity: Brockley’s two products</text>

<rect x="30" y="110" width="840" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="153" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">YED = % change in quantity demanded ÷ % change in income</text><rect x="80" y="284" width="234.375" height="32" fill="#f3dccd"/><rect x="314.375" y="284" width="234.375" height="32" fill="#dce9e7"/><rect x="548.75" y="284" width="281.25" height="32" fill="#b5d3cf"/><line x1="70" y1="300" x2="850" y2="300" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="80" y1="278" x2="80" y2="322" stroke="#1e2a44" stroke-width="1.5"/><text x="80" y="346" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">-1</text><line x1="314.375" y1="278" x2="314.375" y2="322" stroke="#1e2a44" stroke-width="3"/><text x="314.375" y="346" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">0</text><line x1="548.75" y1="278" x2="548.75" y2="322" stroke="#1e2a44" stroke-width="3"/><text x="548.75" y="346" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">+1</text><line x1="783.125" y1="278" x2="783.125" y2="322" stroke="#1e2a44" stroke-width="1.5"/><text x="783.125" y="346" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">+2</text><text x="197.1875" y="236" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">Inferior good</text><text x="197.1875" y="258" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">bought less as incomes rise</text><text x="431.5625" y="236" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Normal: income inelastic</text><text x="431.5625" y="258" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">typical of necessities</text><text x="689.375" y="236" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Normal: income elastic</text><text x="689.375" y="258" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">often a luxury</text><circle cx="220.62499999999997" cy="300" r="13" fill="#b5602e" stroke="#1e2a44" stroke-width="3"/><line x1="220.62499999999997" y1="316" x2="220.62499999999997" y2="380" stroke="#b5602e" stroke-width="2.5"/><rect x="70.62499999999997" y="380" width="300" height="140" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="88.62499999999997" y="414" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Off-peak budget membership</text><text x="88.62499999999997" y="444" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Demand −2% when incomes +5%</text><text x="88.62499999999997" y="465" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">YED = −2 ÷ 5 = −0.4</text><circle cx="736.2499999999999" cy="300" r="13" fill="#2e6b62" stroke="#1e2a44" stroke-width="3"/><line x1="736.2499999999999" y1="316" x2="736.2499999999999" y2="380" stroke="#2e6b62" stroke-width="2.5"/><rect x="586.2499999999999" y="380" width="300" height="140" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="604.2499999999999" y="414" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Premium personal training</text><text x="604.2499999999999" y="444" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Demand +9% when incomes +5%</text><text x="604.2499999999999" y="465" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">YED = 9 ÷ 5 = +1.8</text><rect x="30" y="550" width="410" height="130" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="584" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Incomes rising</text><text x="50" y="612" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Expect growth in personal training; plan</text><text x="50" y="635" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">staff for it</text><rect x="460" y="550" width="410" height="130" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="480" y="584" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Recession</text><text x="480" y="612" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The pattern reverses: the budget</text><text x="480" y="635" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">membership protects revenue</text><text x="450" y="716" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">The sign matters: keep it, or an inferior good looks like a normal one.</text>
</svg>