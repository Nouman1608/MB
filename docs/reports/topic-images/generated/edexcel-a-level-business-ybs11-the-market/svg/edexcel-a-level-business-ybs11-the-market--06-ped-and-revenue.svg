<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" width="900" height="740" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="740" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Price elasticity of demand and revenue</text>

<rect x="30" y="110" width="840" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="153" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">PED = % change in quantity demanded ÷ % change in price</text><rect x="80" y="216" width="296" height="28" fill="#dce9e7" stroke="none"/><rect x="376" y="216" width="444" height="28" fill="#f3dccd" stroke="none"/><line x1="80" y1="230" x2="840" y2="230" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="80" y1="208" x2="80" y2="252" stroke="#1e2a44" stroke-width="3"/><text x="80" y="278" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">0</text><line x1="376" y1="208" x2="376" y2="252" stroke="#1e2a44" stroke-width="3"/><text x="376" y="278" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="731.2" y="278" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">ignore the minus sign</text><rect x="30" y="300" width="190" height="210" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="336" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">PED = 0</text><text x="48" y="360" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Perfectly</text><text x="48" y="381" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">inelastic</text><text x="48" y="440" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Price rise: revenue</text><text x="48" y="476" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">rises with price</text><rect x="236" y="300" width="210" height="210" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="254" y="336" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">0 to 1</text><text x="254" y="360" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Inelastic</text><text x="254" y="440" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Price rise: revenue</text><text x="254" y="476" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">rises</text><rect x="462" y="300" width="190" height="210" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="336" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">PED = 1</text><text x="480" y="360" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Unitary</text><text x="480" y="440" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Price rise: revenue</text><text x="480" y="476" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="start">unchanged</text><rect x="668" y="300" width="202" height="210" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="686" y="336" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Above 1</text><text x="686" y="360" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Elastic</text><text x="686" y="440" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Price rise: revenue</text><text x="686" y="476" font-size="21" font-weight="700" fill="#b5602e" text-anchor="start">falls</text><rect x="30" y="530" width="410" height="180" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="564" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">More elastic when…</text><text x="50" y="594" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• many close substitutes</text><text x="50" y="617" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• not a necessity</text><text x="50" y="640" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• a large share of income</text><text x="50" y="663" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• little brand loyalty or habit</text><text x="50" y="686" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• customers have longer to adjust</text><rect x="460" y="530" width="410" height="180" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="564" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Revenue is not profit</text><text x="480" y="594" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Inelastic: a price rise lifts revenue and</text><text x="480" y="615" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cuts costs, as fewer units are made. Elastic:</text><text x="480" y="636" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a price cut lifts revenue, but extra units</text><text x="480" y="657" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">add variable costs.</text>
</svg>