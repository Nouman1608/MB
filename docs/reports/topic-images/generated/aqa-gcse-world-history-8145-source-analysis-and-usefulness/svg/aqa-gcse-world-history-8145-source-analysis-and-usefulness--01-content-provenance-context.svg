<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three things to analyse in every source</text>

<rect x="30" y="100" width="268" height="208" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1</text><text x="50" y="160.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Content</text><text x="50" y="190.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="190.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">What does it say or show?</text><text x="50" y="217.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="217.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">What is its message?</text><text x="50" y="244.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="244.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">What can you infer?</text><rect x="316" y="100" width="268" height="208" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="336" y="132" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">2</text><text x="336" y="160.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Provenance</text><text x="336" y="190.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="352.15" y="190.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Who made it, when,</text><text x="352.15" y="212.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">where, why and for</text><text x="352.15" y="234.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">whom?</text><text x="336" y="261.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="352.15" y="261.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">What type of source is it?</text><rect x="602" y="100" width="268" height="208" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="622" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">3</text><text x="622" y="160.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Context</text><text x="622" y="190.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="638.15" y="190.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">What was happening at</text><text x="638.15" y="212.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the time?</text><text x="622" y="239.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="638.15" y="239.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">What do you know that</text><text x="638.15" y="261.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">confirms, explains or</text><text x="638.15" y="283.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">adds to it?</text><text x="30" y="338" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">THE BEST ANSWERS CONNECT ALL THREE</text><rect x="30" y="356" width="249.33333333333334" height="105" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="154.66666666666669" y="401.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">The content shows a</text><text x="154.66666666666669" y="424.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">view</text><line x1="285.33333333333337" y1="408.5" x2="319.33333333333337" y2="408.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="356" width="249.33333333333334" height="105" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450.00000000000006" y="390.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">The provenance</text><text x="450.00000000000006" y="413.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">explains why that view</text><text x="450.00000000000006" y="436.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">was held</text><line x1="580.6666666666667" y1="408.5" x2="614.6666666666667" y2="408.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="356" width="249.33333333333334" height="105" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="745.3333333333334" y="401.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Context shows how the</text><text x="745.3333333333334" y="424.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">source fits the events</text>
