" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="745.3333333333334" y="315.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Note</text><text x="745.3333333333334" y="345.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">one fact you know</text><rect x="30" y="384" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="418.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Question 2 layout</text><text x="450" y="448.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">One paragraph per source, then a final sentence comparing them.</text>
