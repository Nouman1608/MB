<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 541" width="900" height="541" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="541" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Context for the worked example</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Korea, 1950-51: towards MacArthur's dismissal</text>
<line x1="170" y1="132" x2="170" y2="501" stroke="#1e2a44" stroke-width="4"/><rect x="210" y="124" width="660" height="69" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="223" y="151.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Inchon landings</text><text x="223" y="175.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">UN forces under MacArthur then advance north towards the Yalu River.</text><circle cx="170" cy="158.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="150" y="164.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Sep 1950</text><rect x="210" y="203" width="660" height="69" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="223" y="230.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Chinese intervention</text><text x="223" y="254.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Provoked by the advance towards the Yalu.</text><circle cx="170" cy="237.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="150" y="243.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Oct 1950</text><rect x="210" y="282" width="660" height="69" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="223" y="309.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">MacArthur's public call</text><text x="223" y="333.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">He calls for attacks on China itself; Truman fears a wider war.</text><circle cx="170" cy="316.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="150" y="322.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Then</text><rect x="210" y="361" width="660" height="69" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="223" y="388.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Retreat</text><text x="223" y="412.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Chinese forces drive UN troops back below the 38th parallel.</text><circle cx="170" cy="395.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="150" y="391.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Winter 1950-51</text><rect x="210" y="440" width="660" height="69" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="223" y="467.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Truman dismisses MacArthur</text><text x="223" y="491.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The same month as Source B.</text><circle cx="170" cy="474.5" r="10" fill="#b5602e" stroke="#1e2a44" stroke-width="3"/><text x="150" y="480.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Apr 1951</text>
</svg>