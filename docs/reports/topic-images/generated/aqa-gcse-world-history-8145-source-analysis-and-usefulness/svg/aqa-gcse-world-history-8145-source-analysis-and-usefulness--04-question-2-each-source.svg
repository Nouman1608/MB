<rect width="900" height="771" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Question 2: how useful is each source?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">12 marks: evaluate each source separately, then compare</text>
<line x1="60" y1="144" x2="60" y2="408" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="157.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Content and context</text><text x="122" y="187.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">What it tells the historian about the issue in the question; how your knowledge confirms or</text><text x="122" y="209.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">adds to it.</text><circle cx="60" cy="178" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="186.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="244" width="766" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="277.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Provenance</text><text x="122" y="307.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">How its author, date, type and purpose affect what it is useful for.</text><circle cx="60" cy="287" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="295.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="342" width="766" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="375.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">What it is less useful for</text><text x="122" y="405.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Gaps or one-sidedness, explained through provenance, not just "it is biased".</text><circle cx="60" cy="385" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="393.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="30" y="458" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">A BIASED SOURCE CAN STILL BE USEFUL: SAY WHAT FOR</text><clipPath id="tc476"><rect x="30" y="476" width="840" height="263" rx="14"/></clipPath><g clip-path="url(#tc476)"><rect x="30" y="476" width="355.3846153846154" height="49" fill="#b5d3cf"/><text x="44" y="504.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Source type</text><rect x="385.3846153846154" y="476" width="484.6153846153846" height="49" fill="#b5d3cf"/><text x="399.3846153846154" y="504.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Useful evidence of...</text><rect x="30" y="525" width="355.3846153846154" height="48" fill="#dce9e7"/><text x="44" y="552.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Propaganda poster</text><rect x="385.3846153846154" y="525" width="484.6153846153846" height="48" fill="#ffffff"/><text x="399.3846153846154" y="552.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">What a government wanted people to think</text><line x1="30" y1="573" x2="870" y2="573" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="573" width="355.3846153846154" height="48" fill="#dce9e7"/><text x="44" y="600.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Private diary</text><rect x="385.3846153846154" y="573" width="484.6153846153846" height="48" fill="#f8faf9"/><text x="399.3846153846154" y="600.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">One person's reaction</text><line x1="30" y1="621" x2="870" y2="621" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="621" width="355.3846153846154" height="48" fill="#dce9e7"/><text x="44" y="648.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Speech</text><rect x="385.3846153846154" y="621" width="484.6153846153846" height="48" fill="#ffffff"/><text x="399.3846153846154" y="648.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">What a leader wanted the public to believe</text><line x1="30" y1="669" x2="870" y2="669" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="669" width="355.3846153846154" height="70" fill="#dce9e7"/><text x="44" y="696.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Soviet newspaper on Hungary, 1956</text><rect x="385.3846153846154" y="669" width="484.6153846153846" height="70" fill="#f8faf9"/><text x="399.3846153846154" y="696.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">How the Soviet leadership justified the invasion (poor</text><text x="399.3846153846154" y="718.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">evidence of what happened in Budapest)</text></g><line x1="385.3846153846154" y1="476" x2="385.3846153846154" y2="739" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="476" width="840" height="263" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>