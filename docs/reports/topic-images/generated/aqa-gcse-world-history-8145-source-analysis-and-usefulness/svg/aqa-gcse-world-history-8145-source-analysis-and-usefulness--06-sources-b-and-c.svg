<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 652" width="900" height="652" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="652" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How useful are Sources B and C?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Reasons why MacArthur was dismissed (invented sources)</text>
<clipPath id="tc124"><rect x="30" y="124" width="840" height="363" rx="14"/></clipPath><g clip-path="url(#tc124)"><rect x="30" y="124" width="177.46478873239437" height="70" fill="#b5d3cf"/><rect x="207.46478873239437" y="124" width="331.2676056338028" height="70" fill="#b5d3cf"/><text x="221.46478873239437" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Source B: British cartoon, April 1951</text><rect x="538.7323943661972" y="124" width="331.2676056338028" height="70" fill="#f2e7b8"/><text x="552.7323943661972" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Source C: soldier's letter, January</text><text x="552.7323943661972" y="173.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">1951</text><rect x="30" y="194" width="177.46478873239437" height="89" fill="#dce9e7"/><text x="44" y="220.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Content</text><rect x="207.46478873239437" y="194" width="331.2676056338028" height="89" fill="#ffffff"/><text x="221.46478873239437" y="220.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">MacArthur as a giant dragging the UN</text><text x="221.46478873239437" y="241.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">towards China; Truman: "sent to Korea,</text><text x="221.46478873239437" y="262.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">not Peking"</text><rect x="538.7323943661972" y="194" width="331.2676056338028" height="89" fill="#ffffff"/><text x="552.7323943661972" y="220.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"Home by Christmas"; surprise Chinese</text><text x="552.7323943661972" y="241.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">attack; long retreat in winter</text><line x1="30" y1="283" x2="870" y2="283" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="283" width="177.46478873239437" height="68" fill="#dce9e7"/><text x="44" y="309.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Context</text><rect x="207.46478873239437" y="283" width="331.2676056338028" height="68" fill="#f8faf9"/><text x="221.46478873239437" y="309.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Advance to the Yalu; Chinese</text><text x="221.46478873239437" y="330.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">intervention; calls to attack China</text><rect x="538.7323943661972" y="283" width="331.2676056338028" height="68" fill="#f8faf9"/><text x="552.7323943661972" y="309.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">UN troops driven back below the 38th</text><text x="552.7323943661972" y="330.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">parallel, winter 1950-51</text><line x1="30" y1="351" x2="870" y2="351" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="351" width="177.46478873239437" height="68" fill="#dce9e7"/><text x="44" y="377.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Provenance</text><rect x="207.46478873239437" y="351" width="331.2676056338028" height="68" fill="#ffffff"/><text x="221.46478873239437" y="377.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">From Britain, a UN ally, in the month of</text><text x="221.46478873239437" y="398.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the dismissal: how allies saw him</text><rect x="538.7323943661972" y="351" width="331.2676056338028" height="68" fill="#ffffff"/><text x="552.7323943661972" y="377.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Private letter to family at the time: a</text><text x="552.7323943661972" y="398.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">frank record of morale</text><line x1="30" y1="419" x2="870" y2="419" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="419" width="177.46478873239437" height="68" fill="#dce9e7"/><text x="44" y="445.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Less useful for</text><rect x="207.46478873239437" y="419" width="331.2676056338028" height="68" fill="#f8faf9"/><text x="221.46478873239437" y="445.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Simplifies; does not show MacArthur's</text><text x="221.46478873239437" y="466.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">own case</text><rect x="538.7323943661972" y="419" width="331.2676056338028" height="68" fill="#f8faf9"/><text x="552.7323943661972" y="445.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The political reasons; a soldier would</text><text x="552.7323943661972" y="466.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">not know of the public disagreements</text></g><line x1="207.46478873239437" y1="124" x2="207.46478873239437" y2="487" stroke="#c9d6d4" stroke-width="1.5"/><line x1="538.7323943661972" y1="124" x2="538.7323943661972" y2="487" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="124" width="840" height="363" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="509" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="543.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Together</text><text x="50" y="573.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">B shows how political leaders and allies saw MacArthur as a danger; C shows why his strategy had</text><text x="50" y="595.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">lost support among the troops. Most useful when combined.</text>
</svg>