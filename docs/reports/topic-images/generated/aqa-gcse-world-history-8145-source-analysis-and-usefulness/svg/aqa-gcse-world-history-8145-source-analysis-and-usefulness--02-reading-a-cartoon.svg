<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 479" width="900" height="479" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="479" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading a cartoon in six steps</text>

<rect x="30" y="100" width="268" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="142.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STEP 1</text><text x="50" y="169.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Caption and labels</text><text x="50" y="198.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Usually tell you who or what</text><text x="50" y="219.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the figures represent.</text><rect x="316" y="100" width="268" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="336" y="142.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STEP 2</text><text x="336" y="169.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Figures and caricature</text><text x="336" y="198.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Large or small, strong or</text><text x="336" y="219.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">foolish, calm or frightened?</text><rect x="602" y="100" width="268" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="622" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STEP 3</text><text x="622" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Symbols</text><text x="622" y="187.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Bombs, chains, a globe, a</text><text x="622" y="208.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">dove, a bear for Russia, Uncle</text><text x="622" y="229.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Sam for the USA.</text><rect x="30" y="272" width="268" height="175" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="325" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STEP 4</text><text x="50" y="351.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Action</text><text x="50" y="380.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">What is happening, and what</text><text x="50" y="401.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">might happen next?</text><rect x="316" y="272" width="268" height="175" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="336" y="325" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">STEP 5</text><text x="336" y="351.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Message</text><text x="336" y="380.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The cartoonist's opinion in</text><text x="336" y="401.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">one sentence.</text><rect x="602" y="272" width="268" height="175" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="622" y="304" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STEP 6</text><text x="622" y="330.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Provenance</text><text x="622" y="359.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A British and a German</text><text x="622" y="380.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">cartoon of 1938 on the same</text><text x="622" y="401.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">event may say opposite</text><text x="622" y="422.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">things.</text>
</svg>