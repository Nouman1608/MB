<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 527" width="900" height="527" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="527" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Question 1: how do you know?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">4 marks: show how the source supports the stated view</text>
<rect x="30" y="124" width="840" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Example question</text><text x="50" y="188.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">"Source A opposes the Munich Agreement. How do you know? Explain your answer using Source</text><text x="50" y="210.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A and your contextual knowledge."</text><rect x="30" y="257" width="411" height="158" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="289" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DETAIL 1</text><text x="50" y="316.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Content + context</text><text x="50" y="346.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A specific detail (a caption, a figure's</text><text x="50" y="368.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">expression, a phrase) plus a precise fact</text><text x="50" y="390.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">explaining why someone might hold this view.</text><rect x="459" y="257" width="411" height="158" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="289" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">DETAIL 2</text><text x="479" y="316.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Content + provenance</text><text x="479" y="346.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A second detail plus the cartoonist's country,</text><text x="479" y="368.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the newspaper's politics or the date to explain</text><text x="479" y="390.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the attitude.</text><rect x="30" y="437" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="470.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Two well-explained details beat a long description of everything in the picture.</text>
</svg>