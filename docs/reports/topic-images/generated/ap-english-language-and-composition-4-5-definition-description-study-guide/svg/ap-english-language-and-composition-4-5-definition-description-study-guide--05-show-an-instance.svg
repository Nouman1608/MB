<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Let the reader see an instance</text>

<text x="30" y="110" font-size="18" font-weight="700" fill="#4a5568" text-anchor="start" xml:space="preserve">Definition</text><rect x="30" y="124" width="300" height="95.32" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="46" y="176.89" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Loyalty means being faithful.”</text><rect x="400" y="124" width="470" height="95.32" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="416" y="154.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Loyalty is sitting through a friend’s third retelling of</text><text x="416" y="176.89" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">a story and laughing where you laughed the first</text><text x="416" y="199.32999999999998" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">time.”</text><line x1="336" y1="171.66" x2="394" y2="171.66" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="30" y="259.32" font-size="18" font-weight="700" fill="#4a5568" text-anchor="start" xml:space="preserve">Description</text><rect x="30" y="273.32" width="300" height="95.32" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="46" y="326.21" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“The market was busy.”</text><rect x="400" y="273.32" width="470" height="95.32" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="416" y="303.77" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Crates scraped on stone, a vendor shouted the</text><text x="416" y="326.21" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">price of figs, and the air smelled of fish and wet</text><text x="416" y="348.65" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">cardboard.”</text><line x1="336" y1="320.98" x2="394" y2="320.98" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="180" y="398.64" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">asserts</text><text x="635" y="398.64" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">shows: specific nouns, verbs, senses</text>
</svg>