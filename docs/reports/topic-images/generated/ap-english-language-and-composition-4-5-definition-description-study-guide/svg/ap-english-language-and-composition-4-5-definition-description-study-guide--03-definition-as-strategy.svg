<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 569" width="900" height="569" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="569" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A definition can decide the argument</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Read definitions critically; write ones you can defend</text>
<rect x="30" y="122" width="400" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="230" y="167.92000000000002" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Definition</text><text x="230" y="197.62000000000003" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“Success means a high salary.”</text><line x1="436" y1="177" x2="464" y2="177" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><rect x="470" y="122" width="400" height="110" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="670" y="157.36" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">Argument already decided</text><text x="670" y="186.21" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">whether college is worthwhile, before it</text><text x="670" y="208.65" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">starts</text><rect x="30" y="262" width="840" height="152.15999999999997" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="48" y="296" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">A satirical definition carries a claim</text><text x="48" y="324.84999999999997" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“<tspan font-weight="700">Positive</tspan>, adj. Mistaken at the top of one’s voice.”</text><text x="48" y="347.28999999999996" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">Ambrose</tspan> <tspan font-style="italic">Bierce,</tspan> <tspan font-style="italic">The</tspan> <tspan font-style="italic">Devil’s</tspan> <tspan font-style="italic">Dictionary</tspan> <tspan font-style="italic">(first</tspan> <tspan font-style="italic">published</tspan> <tspan font-style="italic">as</tspan> <tspan font-style="italic">The</tspan> <tspan font-style="italic">Cynic’s</tspan> <tspan font-style="italic">Word</tspan> <tspan font-style="italic">Book,</tspan> <tspan font-style="italic">1906)</tspan></text><text x="48" y="369.72999999999996" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"></text><text x="48" y="392.16999999999996" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#2e6b62">The</tspan> <tspan font-weight="700" fill="#2e6b62">claim</tspan> <tspan font-weight="700" fill="#2e6b62">inside</tspan> <tspan font-weight="700" fill="#2e6b62">the</tspan> <tspan font-weight="700" fill="#2e6b62">joke:</tspan> loudness is not knowledge.</text><rect x="30" y="434.15999999999997" width="408" height="104.64000000000001" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="48" y="468.15999999999997" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">As a writer</text><text x="48" y="496.15999999999997" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">state a definition you can defend</text><rect x="462" y="434.15999999999997" width="408" height="104.64000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="480" y="468.15999999999997" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">As a reader</text><text x="480" y="496.15999999999997" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">is it fair, and is the writer relying on it to carry</text><text x="480" y="517.28" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">the claim?</text>
</svg>