<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 631" width="900" height="631" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="631" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Formal and extended definitions</text>

<text x="30" y="108" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Formal: term + class + what distinguishes it</text><rect x="30" y="126" width="84.9621" height="35" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="72.48105000000001" y="149.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">drought</text><text x="72.48105000000001" y="182.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">term</text><rect x="122.9621" y="126" width="181.79240000000001" height="35" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="213.8583" y="149.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">a period of weather</text><text x="213.8583" y="182.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">class</text><rect x="30" y="205.3" width="644.45913" height="35" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2" /><text x="352.229565" y="228.75" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">in which rainfall is so far below normal that water supplies fall short of need</text><text x="352.229565" y="261.8" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">what distinguishes it</text><text x="30" y="302.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Extended: a paragraph or more, using...</text><rect x="30" y="320.6" width="200" height="62.24000000000001" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="130" y="357.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">Examples</tspan></text><rect x="250" y="320.6" width="620" height="62.24000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="262" y="346.20000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Generosity is giving what you could keep: the neighbour who mows a lawn</text><text x="262" y="367.32000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">without being asked.”</text><rect x="30" y="390.84000000000003" width="200" height="41.120000000000005" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="130" y="417.40000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">Negation</tspan></text><rect x="250" y="390.84000000000003" width="620" height="41.120000000000005" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="262" y="416.44000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Courage is not the absence of fear...”</text><rect x="30" y="439.96000000000004" width="200" height="41.120000000000005" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="130" y="466.52000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">Comparison</tspan></text><rect x="250" y="439.96000000000004" width="620" height="41.120000000000005" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="262" y="465.56000000000006" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Patience is to waiting what a pilot is to a storm.”</text><rect x="30" y="489.08000000000004" width="200" height="62.24000000000001" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="130" y="526.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">Features</tspan> <tspan font-weight="700">and</tspan></text><text x="130" y="547.32" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">requirements</tspan></text><rect x="250" y="489.08000000000004" width="620" height="62.24000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="262" y="514.6800000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“A fair test changes one variable at a time, uses the same conditions and</text><text x="262" y="535.8000000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">can be repeated.”</text><rect x="30" y="559.32" width="200" height="41.120000000000005" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="130" y="585.8800000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">Origin</tspan> <tspan font-weight="700">of</tspan> <tspan font-weight="700">the</tspan> <tspan font-weight="700">word</tspan></text><rect x="250" y="559.32" width="620" height="41.120000000000005" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="262" y="584.9200000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">when it illuminates the idea</text>
</svg>