<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 565" width="900" height="565" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="565" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Building a fair definition</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Worked example 1: open-book tests</text>
<rect x="30" y="122" width="800" height="72.88" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="44" y="150.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">1 Formal definition</text><text x="44" y="177.35999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Cheating is gaining an advantage on an assessment by methods the rules forbid.”</text><rect x="70" y="206.88" width="800" height="72.88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="84" y="235.28" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start" xml:space="preserve">2 Notice the hidden problem</text><text x="84" y="262.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">It depends on the rules: if the rules allow notes, the same act is not cheating.</text><rect x="30" y="291.76" width="800" height="72.88" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="44" y="320.15999999999997" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">3 Extend with example and contrast</text><text x="44" y="347.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Copying a neighbour’s answer: cheating under any rules. An allowed formula sheet: not cheating.</text><rect x="70" y="376.64" width="800" height="72.88" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="84" y="405.03999999999996" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">4 Link to the claim</text><text x="84" y="432" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“...the cure for cheating is a better question, not a locked drawer.”</text><rect x="30" y="461.52" width="800" height="72.88" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5" /><text x="44" y="489.91999999999996" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">5 Check it is fair</text><text x="44" y="516.88" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">It sets terms on which a reader who disagrees can still engage.</text>
</svg>