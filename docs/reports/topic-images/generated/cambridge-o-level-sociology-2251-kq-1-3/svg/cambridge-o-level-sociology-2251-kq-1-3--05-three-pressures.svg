<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="400" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three pressures on choosing a method</text>

<rect x="30" y="104" width="268" height="266" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THEORETICAL</text><text x="50" y="164" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Perspective</text><text x="50" y="192.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="192.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Positivist:</text><text x="65.2" y="213.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">questionnaires,</text><text x="65.2" y="234.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">structured interviews</text><text x="65.2" y="255.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(reliability)</text><text x="50" y="282.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="282.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Interpretivist:</text><text x="65.2" y="303.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">unstructured interviews,</text><text x="65.2" y="324.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">participant observation</text><text x="65.2" y="345.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(validity)</text><rect x="316" y="104" width="268" height="266" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="336" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PRACTICAL</text><text x="336" y="164" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Limits</text><text x="336" y="192.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="351.2" y="192.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Access to the sample</text><text x="351.2" y="213.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(prisoners, elites,</text><text x="351.2" y="234.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">gangs)</text><text x="336" y="261.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="351.2" y="261.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Response rate</text><text x="336" y="288.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="351.2" y="288.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Funding and cost</text><text x="336" y="315.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="351.2" y="315.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Time</text><rect x="602" y="104" width="268" height="266" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="622" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">ETHICAL</text><text x="622" y="164" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Five issues</text><text x="622" y="192.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="637.2" y="192.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Informed consent</text><text x="622" y="219.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="637.2" y="219.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Privacy and</text><text x="637.2" y="240.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">confidentiality</text><text x="622" y="267.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="637.2" y="267.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Deception</text><text x="622" y="294.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="637.2" y="294.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Prevention of harm</text><text x="622" y="321.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="637.2" y="321.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Legality</text>
</svg>