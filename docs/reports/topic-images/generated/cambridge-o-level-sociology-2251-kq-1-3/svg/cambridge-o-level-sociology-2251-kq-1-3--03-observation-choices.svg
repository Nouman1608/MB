<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 656" width="900" height="656" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="656" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two choices in every observation</text>

<text x="395" y="134" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">Overt (open)</text><text x="715" y="134" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle">Covert (hidden)</text><rect x="240" y="154" width="310" height="250" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="260" y="187" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">OVERT PARTICIPANT</text><text x="260" y="212.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Whyte, Street Corner</text><text x="260" y="236.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Society (1943)</text><text x="260" y="264.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Young men in a Boston district;</text><text x="260" y="285.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">access through "Doc", his</text><text x="260" y="306.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">sponsor.</text><text x="260" y="332.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">+ informed consent</text><text x="260" y="358.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">− observer effect</text><rect x="560" y="154" width="310" height="250" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="580" y="187" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">COVERT PARTICIPANT</text><text x="580" y="212.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Patrick, A Glasgow Gang</text><text x="580" y="236.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Observed (1973)</text><text x="580" y="264.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Joined a gang without revealing</text><text x="580" y="285.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">he was a researcher.</text><text x="580" y="311.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">+ less observer effect; reaches</text><text x="580" y="332.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">groups who refuse access</text><text x="580" y="358.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">− deception; exposure to</text><text x="580" y="379.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">violence</text><rect x="30" y="154" width="192" height="250" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="126" y="271.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Participant:</text><text x="126" y="295.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">joins in</text><rect x="30" y="420" width="192" height="132" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="126" y="478.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Non-participant:</text><text x="126" y="502.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">watches</text><rect x="240" y="420" width="630" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="260" y="453" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NON-PARTICIPANT</text><text x="260" y="478.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Watching a classroom from the back</text><text x="260" y="506.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Less involvement in the group, but more chance behaviour changes</text><text x="260" y="527.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">because people know they are watched.</text><rect x="30" y="568" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="601.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Covert means hidden identity; non-participant means not joining in. Do not confuse them.</text>
</svg>