<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 714" width="900" height="714" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="714" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A part (e) plan: every choice has a reason</text>

<rect x="30" y="104" width="840" height="86" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">TOPIC</text><text x="450" y="164" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">How do teenagers decide which subjects to study?</text><text x="228.5" y="228" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Choice</text><text x="671.5" y="228" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Because…</text><rect x="30" y="244" width="397" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="272.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Semi-structured interviews, students aged</text><text x="46" y="293.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">15–16</text><line x1="433" y1="279" x2="467" y2="279" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="244" width="397" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="489" y="272.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Depth on how decisions are made; set</text><text x="489" y="293.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">questions allow comparison</text><rect x="30" y="328" width="397" height="49" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="356.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Pilot interview with two students</text><line x1="433" y1="352.5" x2="467" y2="352.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="328" width="397" height="49" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="489" y="356.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Checks that questions are clear</text><rect x="30" y="391" width="397" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="419.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Stratified sample by gender and school, from</text><text x="46" y="440.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">registers of three schools</text><line x1="433" y1="426" x2="467" y2="426" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="391" width="397" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="489" y="419.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Boys, girls and school types represented in</text><text x="489" y="440.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the right proportions</text><rect x="30" y="475" width="397" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="503.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">National figures on subject entries by</text><text x="46" y="524.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">gender</text><line x1="433" y1="510" x2="467" y2="510" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="475" width="397" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="489" y="503.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Secondary evidence places findings in</text><text x="489" y="524.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">context</text><rect x="30" y="559" width="397" height="49" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="587.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Informed consent; names kept confidential</text><line x1="433" y1="583.5" x2="467" y2="583.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="559" width="397" height="49" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="489" y="587.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Covers ethics briefly</text><rect x="30" y="626" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="659.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">No evaluation: part (e) asks you to justify a plan, not to criticise it.</text>
</svg>