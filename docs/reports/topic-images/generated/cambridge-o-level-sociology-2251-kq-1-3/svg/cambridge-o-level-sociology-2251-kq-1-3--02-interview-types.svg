<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 611" width="900" height="611" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="611" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four kinds of interview</text>

<line x1="60" y1="140" x2="840" y2="140" stroke="#1e2a44" stroke-width="4" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="60" y="125" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">More comparable, more reliable</text><text x="840" y="125" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="end">More depth, more valid</text><rect x="30" y="166" width="268" height="162" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="202" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Structured</text><text x="50" y="230.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Fixed questions, fixed</text><text x="50" y="251.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">order</text><text x="50" y="282.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Reliable and comparable,</text><text x="50" y="303.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">but rigid</text><rect x="316" y="166" width="268" height="162" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="336" y="202" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Semi-structured</text><text x="336" y="230.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Set questions plus freedom</text><text x="336" y="251.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">to probe</text><text x="336" y="282.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A balance of comparability</text><text x="336" y="303.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and depth</text><rect x="602" y="166" width="268" height="162" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="622" y="202" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Unstructured</text><text x="622" y="230.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A guided conversation</text><text x="622" y="261.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Depth and validity; slow,</text><text x="622" y="282.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">hard to compare,</text><text x="622" y="303.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">interviewer effect</text><rect x="30" y="346" width="840" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="381.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Group interviews</text><text x="50" y="409.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Several people together: interaction can spark ideas, but dominant members may silence others and</text><text x="50" y="430.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">peer pressure may shape answers.</text><rect x="30" y="469" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="505" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Example of in-depth interviewing</text><text x="50" y="534.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Ann Oakley, The Sociology of Housework (1974): in-depth interviews with 40 London</text><text x="50" y="556.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">housewives about how they experienced domestic work.</text>
</svg>