<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 852" width="900" height="852" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="852" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Seven stages of research design</text>

<line x1="62" y1="124" x2="62" y2="802" stroke="#c9d6d4" stroke-width="4"/><rect x="108" y="104" width="762" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="139.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Selection of topic</text><text x="128" y="167.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Shaped by interests and values, current issues and what funders will pay for.</text><circle cx="62" cy="148" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="156.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="108" y="202" width="762" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="237.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Aims</text><text x="128" y="265.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A question: "Why do some students leave school early?"</text><circle cx="62" cy="246" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="254.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="108" y="300" width="762" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="335.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Hypothesis</text><text x="128" y="363.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A testable prediction: "Students from low-income households are more likely to leave</text><text x="128" y="384.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">early."</text><circle cx="62" cy="354.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="363.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="108" y="419" width="762" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="454.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Target population</text><text x="128" y="482.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The whole group studied, e.g. all students aged 15–16 in one region.</text><circle cx="62" cy="463" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="471.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="108" y="517" width="762" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="552.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Methods</text><text x="128" y="580.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Chosen to fit the aims, the perspective and the practical limits.</text><circle cx="62" cy="561" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="569.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="108" y="615" width="762" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="128" y="650.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Operationalisation</text><text x="128" y="678.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Make a concept measurable: social class by parents’ occupation. Poor indicators lower</text><text x="128" y="699.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">validity.</text><circle cx="62" cy="669.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="678.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><rect x="108" y="734" width="762" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="769.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Pilot study</text><text x="128" y="797.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A small trial run finds confusing questions, missing options and timing.</text><circle cx="62" cy="778" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="786.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">7</text>
</svg>