<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 668" width="900" height="668" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="668" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One study, five ethical problems</text>

<text x="235" y="132" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">What Humphreys did</text><text x="690" y="132" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle">Ethical issues raised</text><rect x="30" y="152" width="410" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="180.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Covertly observed men meeting in public</text><text x="235" y="202.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">toilets</text><line x1="235" y1="226" x2="235" y2="248" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="252" width="410" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="291.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Noted their car registration numbers</text><line x1="235" y1="326" x2="235" y2="348" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="352" width="410" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="391.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Traced their home addresses</text><line x1="235" y1="426" x2="235" y2="448" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="452" width="410" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="480.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Interviewed some in disguise in a</text><text x="235" y="502.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">different survey</text><rect x="520" y="152" width="350" height="56" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="695" y="184.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">No informed consent</text><rect x="520" y="230" width="350" height="56" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="695" y="262.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Risk to privacy</text><rect x="520" y="308" width="350" height="56" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="695" y="340.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Deception</text><rect x="520" y="386" width="350" height="64" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="695" y="411.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Potential harm if identities</text><text x="695" y="433.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">known</text><rect x="520" y="464" width="350" height="56" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="695" y="496.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Questions of legality</text><line x1="442" y1="337" x2="482" y2="337" stroke="#1e2a44" stroke-width="3"/><line x1="482" y1="180" x2="482" y2="492" stroke="#1e2a44" stroke-width="3"/><line x1="482" y1="180" x2="512" y2="180" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="482" y1="258" x2="512" y2="258" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="482" y1="336" x2="512" y2="336" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="482" y1="414" x2="512" y2="414" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="482" y1="492" x2="512" y2="492" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="558" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="591.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Laud Humphreys, Tearoom Trade (1970): the standard warning, because one study raised all</text><text x="50" y="613.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">five ethical issues at once.</text>
</svg>