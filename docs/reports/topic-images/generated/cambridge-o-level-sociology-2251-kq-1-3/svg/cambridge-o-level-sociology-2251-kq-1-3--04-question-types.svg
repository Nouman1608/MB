<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 436" width="900" height="436" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="436" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four types of question</text>

<rect x="30" y="104" width="190" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Type</text><rect x="220" y="104" width="360" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="232" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Example</text><rect x="580" y="104" width="290" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="592" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Use</text><rect x="30" y="150" width="190" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="175.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Open</text><rect x="220" y="150" width="360" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="232" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">"What do you think makes a good parent?"</text><rect x="580" y="150" width="290" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="592" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Own words; valid but hard to</text><text x="592" y="196.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">compare</text><rect x="30" y="214" width="190" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="239.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Closed</text><rect x="220" y="214" width="360" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="232" y="239.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">"Do you live with both parents? Yes /</text><text x="232" y="260.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">No"</text><rect x="580" y="214" width="290" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="592" y="239.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Quick, quantitative, reliable;</text><text x="592" y="260.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">may not fit everyone</text><rect x="30" y="278" width="190" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="303.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Multiple choice</text><rect x="220" y="278" width="360" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="232" y="303.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">"How do you travel to school? Walk / bus</text><text x="232" y="324.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">/ car / other"</text><rect x="580" y="278" width="290" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="592" y="303.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Several options, still countable</text><rect x="30" y="342" width="190" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="367.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Scaled</text><rect x="220" y="342" width="360" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="232" y="367.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">"School prepares me for work: strongly</text><text x="232" y="388.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">agree … strongly disagree"</text><rect x="580" y="342" width="290" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="592" y="367.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Strength of opinion; people may</text><text x="592" y="388.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">avoid extremes</text>
</svg>