<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" width="900" height="570" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="570" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The language of rules</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Five functions, from not allowed to necessary</text>
<line x1="80" y1="154" x2="820" y2="154" stroke="#1e2a44" stroke-width="4"/><circle cx="110" cy="154" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="110" y="198" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Prohibition</text><text x="110" y="252" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">"must not"</text><text x="110" y="278" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">not allowed</text><circle cx="280" cy="154" r="14" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="280" y="198" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Permission</text><text x="280" y="252" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">"may"</text><text x="280" y="278" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">allowed</text><circle cx="450" cy="154" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="198" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Absence of</text><text x="450" y="220" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">obligation</text><text x="450" y="252" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">"do not have to"</text><text x="450" y="278" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">not necessary, but</text><text x="450" y="298" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">you may</text><circle cx="620" cy="154" r="14" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="620" y="198" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Recommendation</text><text x="620" y="252" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">"should"</text><text x="620" y="278" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">advised</text><circle cx="790" cy="154" r="14" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="790" y="198" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Obligation</text><text x="790" y="252" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">"must"</text><text x="790" y="278" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">necessary</text><rect x="30" y="336" width="385" height="136" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="379" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ABSENCE OF OBLIGATION</text><text x="50" y="406.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">"You don't have to come."</text><text x="50" y="436.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">German: <tspan font-style="italic">Du</tspan> <tspan font-style="italic">musst</tspan> <tspan font-style="italic">nicht</tspan> <tspan font-style="italic">kommen.</tspan></text><rect x="485" y="336" width="385" height="136" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="505" y="368" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">PROHIBITION</text><text x="505" y="395.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">"You must not come."</text><text x="505" y="425.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">German needs <tspan font-style="italic">dürfen</tspan>: <tspan font-style="italic">Du</tspan> <tspan font-style="italic">darfst</tspan> <tspan font-style="italic">nicht</tspan></text><text x="505" y="447.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">kommen.</tspan></text><text x="450" y="413" font-size="34" font-weight="700" fill="#b5602e" text-anchor="middle">≠</text><text x="450" y="326" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="450" y="507.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle"><tspan font-weight="700">The</tspan> <tspan font-weight="700">trap:</tspan> target languages mark this difference in ways that do not map directly onto English.</text><text x="450" y="529.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Notices also prefer impersonal forms: the English passive, French <tspan font-style="italic">on</tspan>, German <tspan font-style="italic">man</tspan>, Spanish <tspan font-style="italic">se</tspan>.</text>
</svg>