<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 847" width="900" height="847" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="847" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Planning a formal letter to the council</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The youth centre will close on weekday evenings to save money</text>
<rect x="123.76800000000003" y="124" width="233.408" height="30" rx="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="240.47200000000004" y="144.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Context: a council decision</text><rect x="367.17600000000004" y="124" width="409.056" height="30" rx="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="571.7040000000001" y="144.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Audience: council members who do not know you</text><rect x="125.072" y="164" width="332.48" height="30" rx="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="291.312" y="184.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Purpose: persuade politely and propose</text><rect x="467.552" y="164" width="307.376" height="30" rx="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="621.24" y="184.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Formal "you", set formulas, no slang</text><line x1="60" y1="236" x2="60" y2="662" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="216" width="766" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="242.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Opening</text><text x="116" y="270.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Opening formula; who you are; why you are writing (the planned closure)</text><circle cx="60" cy="251.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="260.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="295" width="766" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="321.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">What the centre does</text><text x="116" y="349.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Homework club, sport, a safe place to meet</text><circle cx="60" cy="330.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="339.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="374" width="766" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="400.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Who would lose out</text><text x="116" y="428.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Two or three specific groups, not "everyone"</text><circle cx="60" cy="409.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="418.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="453" width="766" height="71" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="116" y="479.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Acknowledge their reason</text><text x="116" y="507.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The budget, before you disagree</text><circle cx="60" cy="488.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="497.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="532" width="766" height="71" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="116" y="558.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Propose an alternative</text><text x="116" y="586.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Volunteer-run evenings; shared use with a sports club</text><circle cx="60" cy="567.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="576.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="104" y="611" width="766" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="637.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Request and close</text><text x="116" y="665.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A polite request for a reply or a meeting; closing formula</text><circle cx="60" cy="646.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="655.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><rect x="30" y="704" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="738.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">At HL: argue for a compromise</text><text x="50" y="768.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Concession: "Although the budget is limited…" · Hypothesis: "If volunteers ran two evenings a</text><text x="50" y="790.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">week, the centre could…"</text>
</svg>