<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 675" width="900" height="675" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="675" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Classify every rule in a notice</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Study rooms, second floor</text>
<rect x="30" y="124" width="470" height="56" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="156.4" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">"Rooms can be booked for up to two hours."</text><line x1="506" y1="152" x2="546" y2="152" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="552" y="124" width="318" height="56" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="570" y="149" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">PERMISSION</text><text x="570" y="170" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">with a condition: "up to two hours"</text><rect x="30" y="190" width="470" height="56" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="222.4" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">"Groups must leave the room as they found it."</text><line x1="506" y1="218" x2="546" y2="218" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="552" y="190" width="318" height="56" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="570" y="224" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">OBLIGATION</text><rect x="30" y="256" width="470" height="56" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="288.4" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">"Food is not permitted;"</text><line x1="506" y1="284" x2="546" y2="284" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="552" y="256" width="318" height="56" rx="12" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="570" y="281" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">PROHIBITION</text><text x="570" y="302" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">impersonal passive</text><rect x="30" y="322" width="470" height="56" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="354.4" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">"water is."</text><line x1="506" y1="350" x2="546" y2="350" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="552" y="322" width="318" height="56" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="570" y="356" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">PERMISSION</text><rect x="30" y="388" width="470" height="56" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="420.4" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">"Silence is not required,"</text><line x1="506" y1="416" x2="546" y2="416" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="552" y="388" width="318" height="56" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="570" y="422" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">ABSENCE OF OBLIGATION</text><rect x="30" y="454" width="470" height="56" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="486.4" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">"but please keep voices low."</text><line x1="506" y1="482" x2="546" y2="482" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="552" y="454" width="318" height="56" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="570" y="488" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">REQUEST</text><rect x="30" y="532" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="566.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">What the rules reveal</text><text x="50" y="596.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The rooms are shared, so each rule protects the next group (clean room, low voices) while leaving</text><text x="50" y="618.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">each group free to talk: rules make a shared space work for people who never meet.</text>
</svg>