<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 704" width="900" height="704" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="704" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two directions in one sentence</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">"…groups of people organize themselves, or are organized…"</text>
<rect x="30" y="124" width="400" height="136" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FROM BELOW</text><text x="50" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">People organize themselves</text><text x="50" y="213.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A group chooses to act together because it</text><text x="50" y="235.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">shares an interest.</text><rect x="470" y="124" width="400" height="136" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="490" y="156" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">FROM ABOVE</text><text x="490" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">People are organized</text><text x="490" y="213.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A structure is set from outside or above.</text><text x="450" y="202" font-size="20" font-weight="700" fill="#4a5568" text-anchor="middle">or</text><clipPath id="tc282"><rect x="30" y="282" width="840" height="257" rx="14"/></clipPath><g clip-path="url(#tc282)"><rect x="30" y="282" width="216" height="48" fill="#b5d3cf"/><text x="44" y="309.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Topic</text><rect x="246" y="282" width="312" height="48" fill="#b5d3cf"/><text x="260" y="309.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Organize themselves</text><rect x="558" y="282" width="312" height="48" fill="#f2e7b8"/><text x="572" y="309.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Are organized</text><rect x="30" y="330" width="216" height="47" fill="#dce9e7"/><text x="44" y="356.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Community</text><rect x="246" y="330" width="312" height="47" fill="#ffffff"/><text x="260" y="356.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Residents run a garden or festival</text><rect x="558" y="330" width="312" height="47" fill="#ffffff"/><text x="572" y="356.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A council decides bin collections</text><line x1="30" y1="377" x2="870" y2="377" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="377" width="216" height="47" fill="#dce9e7"/><text x="44" y="403.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Education</text><rect x="246" y="377" width="312" height="47" fill="#f8faf9"/><text x="260" y="403.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A student council proposes a change</text><rect x="558" y="377" width="312" height="47" fill="#f8faf9"/><text x="572" y="403.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A ministry sets a curriculum</text><line x1="30" y1="424" x2="870" y2="424" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="424" width="216" height="68" fill="#dce9e7"/><text x="44" y="450.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">The working world</text><rect x="246" y="424" width="312" height="68" fill="#ffffff"/><text x="260" y="450.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Staff share decisions in a</text><text x="260" y="471.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cooperative</text><rect x="558" y="424" width="312" height="68" fill="#ffffff"/><text x="572" y="450.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A manager sets a rota</text><line x1="30" y1="492" x2="870" y2="492" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="492" width="216" height="47" fill="#dce9e7"/><text x="44" y="518.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Law and order</text><rect x="246" y="492" width="312" height="47" fill="#f8faf9"/><text x="260" y="518.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Neighbours agree on quiet hours</text><rect x="558" y="492" width="312" height="47" fill="#f8faf9"/><text x="572" y="518.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Parliament passes a law</text></g><line x1="246" y1="282" x2="246" y2="539" stroke="#c9d6d4" stroke-width="1.5"/><line x1="558" y1="282" x2="558" y2="539" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="282" width="840" height="257" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="561" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="595.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">With any unseen text, ask: who made this system, and who has to follow it?</text><text x="50" y="625.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The first possible question looks from below (what one person contributes); the second from</text><text x="50" y="647.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">above (what rules do).</text>
</svg>