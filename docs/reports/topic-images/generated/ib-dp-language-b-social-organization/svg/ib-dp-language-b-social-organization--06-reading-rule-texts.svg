<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 474" width="900" height="474" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="474" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three habits for Social organization texts</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Notices, reports on a decision, debates</text>
<rect x="30" y="124" width="269.3333333333333" height="181" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="157" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1</text><text x="50" y="183.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Classify modal verbs</text><text x="50" y="213.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">must</tspan> <tspan font-style="italic">·</tspan> <tspan font-style="italic">may</tspan> <tspan font-style="italic">·</tspan> <tspan font-style="italic">must</tspan> <tspan font-style="italic">not</tspan> <tspan font-style="italic">·</tspan> <tspan font-style="italic">do</tspan></text><text x="50" y="235.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">not</tspan> <tspan font-style="italic">have</tspan> <tspan font-style="italic">to</tspan>: one word</text><text x="50" y="257.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">changes a true/false</text><text x="50" y="279.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">answer.</text><rect x="315.3333333333333" y="124" width="269.3333333333333" height="181" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="335.3333333333333" y="167" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">2</text><text x="335.3333333333333" y="193.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Circle conditions and</text><text x="335.3333333333333" y="217.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">exceptions</text><text x="335.3333333333333" y="247.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">unless</tspan> <tspan font-style="italic">·</tspan> <tspan font-style="italic">only</tspan> <tspan font-style="italic">if</tspan> <tspan font-style="italic">·</tspan> <tspan font-style="italic">except</tspan> <tspan font-style="italic">·</tspan> <tspan font-style="italic">up</tspan></text><text x="335.3333333333333" y="269.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">to</tspan> limit a rule.</text><rect x="600.6666666666666" y="124" width="269.3333333333333" height="181" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="620.6666666666666" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">3</text><text x="620.6666666666666" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Track who decides and</text><text x="620.6666666666666" y="206.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">who follows</text><text x="620.6666666666666" y="236.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Match each view (head</text><text x="620.6666666666666" y="258.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">teacher, parent, student) to</text><text x="620.6666666666666" y="280.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the right person.</text><rect x="30" y="327" width="840" height="115" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="359" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXAMPLE STATEMENT</text><text x="50" y="392.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">"The study rooms can be booked for as long as you like." <tspan font-weight="700" fill="#1e2a44">False</tspan>: the notice limits booking to</text><text x="50" y="416.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">"up to two hours".</text>
</svg>