<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="520" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Average speed: total distance ÷ total time</text>

<rect x="30" y="110" width="840" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="80" y="200" width="240" height="60" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><rect x="320" y="200" width="360" height="60" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="200" y="236" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">12 km at 60 km/h</text><text x="500" y="236" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">12 km at 40 km/h</text><line x1="80" y1="290" x2="320" y2="290" stroke="#1e2a44" stroke-width="2.5" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="200" y="318" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">12 / 60 = 0.20 h</text><line x1="320" y1="290" x2="680" y2="290" stroke="#1e2a44" stroke-width="2.5" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="500" y="318" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">12 / 40 = 0.30 h</text><text x="80" y="180" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">time →</text><rect x="30" y="375" width="520" height="120" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="290" y="425.7" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">average speed = 24 km / 0.50 h</text><text x="290" y="459.7" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">= 48 km/h</text><rect x="570" y="375" width="300" height="120" rx="12" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="720" y="415.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">not (60 + 40) ÷ 2 = 50:</text><text x="720" y="440.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">the bus spends longer</text><text x="720" y="465.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">at the lower speed</text>
</svg>