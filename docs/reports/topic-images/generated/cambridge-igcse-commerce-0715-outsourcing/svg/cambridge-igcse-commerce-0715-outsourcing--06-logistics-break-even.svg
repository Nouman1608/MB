<rect width="900" height="740" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Own warehouse or contract logistics?</text>

<rect x="140" y="160" width="463" height="400" fill="#dce9e7"/><rect x="603" y="160" width="237" height="400" fill="#f2e7b8"/><line x1="140" y1="460" x2="840" y2="460" stroke="#c9d6d4" stroke-width="1.5"/><text x="128" y="466" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$5,000</text><line x1="140" y1="360" x2="840" y2="360" stroke="#c9d6d4" stroke-width="1.5"/><text x="128" y="366" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$10,000</text><line x1="140" y1="260" x2="840" y2="260" stroke="#c9d6d4" stroke-width="1.5"/><text x="128" y="266" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$15,000</text><line x1="140" y1="160" x2="840" y2="160" stroke="#c9d6d4" stroke-width="1.5"/><text x="128" y="166" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$20,000</text><text x="140" y="588" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">0</text><text x="340" y="588" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">1,000</text><text x="540" y="588" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">2,000</text><text x="740" y="588" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">3,000</text><line x1="140" y1="560" x2="840" y2="560" stroke="#1e2a44" stroke-width="3"/><line x1="140" y1="560" x2="140" y2="160" stroke="#1e2a44" stroke-width="3"/><text x="490" y="618" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Orders per month</text><text x="371.4" y="188" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">Contract logistics cheaper</text><text x="721.4" y="188" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">Own warehouse cheaper</text><line x1="140" y1="310" x2="840" y2="310" stroke="#8a6d0d" stroke-width="5"/><text x="152" y="298" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">Own warehouse: $12,500 a month</text><line x1="140" y1="560" x2="840" y2="182" stroke="#2e6b62" stroke-width="5"/><text x="470" y="362.4" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end">Contract: $5.40 per order</text><circle cx="340" cy="452" r="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="356" y="458" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">1,000 × 5.40 = $5,400</text><circle cx="740" cy="236" r="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="724" y="242" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="end">3,000 × 5.40 = $16,200</text><circle cx="603" cy="310" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="603" y1="320" x2="603" y2="560" stroke="#1e2a44" stroke-width="2" stroke-dasharray="6 5"/><text x="617" y="350" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">equal at 12,500 / 5.40</text><text x="617" y="370" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">≈ 2,315 orders</text><rect x="30" y="650" width="840" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="680" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Own warehouse per order: $12.50 at 1,000 orders, $4.17 at 3,000 orders.</text><text x="450" y="705" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">Low or uneven volumes favour contract logistics.</text>
