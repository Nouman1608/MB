<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 705" width="900" height="705" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="705" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What a contract logistics firm does</text>

<rect x="30" y="150" width="150" height="64" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="105" y="188.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Client A</text><line x1="184" y1="182" x2="262" y2="190" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="250" width="150" height="64" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="105" y="288.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Client B</text><line x1="184" y1="282" x2="262" y2="194" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="350" width="150" height="64" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="105" y="388.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Client C</text><line x1="184" y1="382" x2="262" y2="198" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="225" y="110" width="390" height="470" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="3" stroke-dasharray="10 7"/><text x="420" y="140" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Contract logistics firm</text><rect x="270" y="162" width="300" height="62" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="420" y="189" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Receiving</text><text x="420" y="212" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">unload and check stock</text><line x1="420" y1="226" x2="420" y2="250" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="270" y="254" width="300" height="62" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="420" y="281" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Storage</text><text x="420" y="304" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">shared warehouse</text><line x1="420" y1="318" x2="420" y2="342" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="270" y="346" width="300" height="62" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="420" y="373" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Picking and packing</text><text x="420" y="396" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">each customer order</text><line x1="420" y1="410" x2="420" y2="434" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="270" y="438" width="300" height="62" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="420" y="465" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Transport and delivery</text><text x="420" y="488" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">to shops or homes</text><rect x="690" y="440" width="180" height="70" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="780" y="481.65" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Customers</text><line x1="572" y1="470" x2="684" y2="472" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><path d="M780,436 C785,260 700,192 578,192" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ahR)" stroke-dasharray="9 6"/><text x="800" y="300" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">Returns</text><text x="800" y="319" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">checked and</text><text x="800" y="338" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">restocked</text><text x="420" y="555" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle" font-style="italic">Stock records shared with clients online</text><rect x="30" y="600" width="840" height="80" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="633" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">One warehouse and one delivery network serve many clients,</text><text x="450" y="659" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">so costs are spread and each client pays less per order.</text>
</svg>