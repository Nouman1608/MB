<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="690" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">CaseCraft: make 5,000 covers or buy them in?</text>

<rect x="30" y="110" width="410" height="440" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="110" width="410" height="52" rx="14" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="144" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">In-house</text><text x="52" y="200" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Machinery lease</text><text x="418" y="200" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">6,000</text><line x1="52" y1="214" x2="418" y2="214" stroke="#c9d6d4" stroke-width="1.5"/><text x="52" y="244" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Labour</text><text x="418" y="244" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">9,000</text><line x1="52" y1="258" x2="418" y2="258" stroke="#c9d6d4" stroke-width="1.5"/><text x="52" y="288" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Materials: 5,000 × 1.20</text><text x="418" y="288" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">6,000</text><line x1="52" y1="302" x2="418" y2="302" stroke="#c9d6d4" stroke-width="1.5"/><text x="52" y="332" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Utilities</text><text x="418" y="332" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">1,000</text><line x1="52" y1="346" x2="418" y2="346" stroke="#c9d6d4" stroke-width="1.5"/><text x="52" y="410" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Total</text><text x="418" y="410" font-size="22" font-weight="700" fill="#b5602e" text-anchor="end">$22,000</text><text x="52" y="452" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Cost per cover</text><text x="418" y="488" font-size="18" font-weight="700" fill="#b5602e" text-anchor="end">22,000 / 5,000 = $4.40</text><rect x="460" y="110" width="410" height="440" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="110" width="410" height="52" rx="14" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="144" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Outsourced</text><text x="482" y="200" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Contract: 5,000 × 3.50</text><text x="848" y="200" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">17,500</text><line x1="482" y1="214" x2="848" y2="214" stroke="#c9d6d4" stroke-width="1.5"/><text x="482" y="244" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Transport</text><text x="848" y="244" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">1,500</text><line x1="482" y1="258" x2="848" y2="258" stroke="#c9d6d4" stroke-width="1.5"/><text x="482" y="288" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Inspection</text><text x="848" y="288" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">800</text><line x1="482" y1="302" x2="848" y2="302" stroke="#c9d6d4" stroke-width="1.5"/><text x="482" y="332" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Materials</text><text x="848" y="332" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">included</text><line x1="482" y1="346" x2="848" y2="346" stroke="#c9d6d4" stroke-width="1.5"/><text x="482" y="410" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Total</text><text x="848" y="410" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="end">$19,800</text><text x="482" y="452" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Cost per cover</text><text x="848" y="488" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="end">19,800 / 5,000 = $3.96</text><rect x="30" y="572" width="840" height="92" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="608" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Saving: 22,000 − 19,800 = $2,200 a year, or $0.44 per cover</text><text x="450" y="640" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Then weigh control of quality and waiting for shipments.</text>
</svg>