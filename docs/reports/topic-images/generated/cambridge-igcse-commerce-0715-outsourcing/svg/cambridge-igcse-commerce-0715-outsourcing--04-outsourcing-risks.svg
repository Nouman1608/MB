<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="650" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Outsourcing risks and how to reduce them</text>

<text x="150" y="128" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">Risk</text><text x="330" y="128" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">How to reduce it</text><rect x="30" y="142" width="240" height="70" rx="12" fill="#f3d9c8" stroke="#b5602e" stroke-width="2.5"/><text x="150" y="172.1" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Quality falls below</text><text x="150" y="193.1" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">standard</text><line x1="278" y1="177" x2="320" y2="177" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="330" y="142" width="540" height="70" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="350" y="172" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Clear specification, sample approval, inspection before</text><text x="350" y="194" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">shipping</text><rect x="30" y="224" width="240" height="70" rx="12" fill="#f3d9c8" stroke="#b5602e" stroke-width="2.5"/><text x="150" y="264.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Late delivery</text><line x1="278" y1="259" x2="320" y2="259" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="330" y="224" width="540" height="70" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="350" y="254" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Contract with delivery dates and penalties; keep some</text><text x="350" y="276" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">safety stock</text><rect x="30" y="306" width="240" height="70" rx="12" fill="#f3d9c8" stroke="#b5602e" stroke-width="2.5"/><text x="150" y="346.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Designs or recipes copied</text><line x1="278" y1="341" x2="320" y2="341" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="330" y="306" width="540" height="70" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="350" y="347" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Confidentiality clauses; share only what is needed</text><rect x="30" y="388" width="240" height="70" rx="12" fill="#f3d9c8" stroke="#b5602e" stroke-width="2.5"/><text x="150" y="418.1" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Dependence on one</text><text x="150" y="439.1" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">contractor</text><line x1="278" y1="423" x2="320" y2="423" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="330" y="388" width="540" height="70" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="350" y="429" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Use more than one supplier for important products</text><rect x="30" y="470" width="240" height="70" rx="12" fill="#f3d9c8" stroke="#b5602e" stroke-width="2.5"/><text x="150" y="500.1" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Reputation damage at the</text><text x="150" y="521.1" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">contractor</text><line x1="278" y1="505" x2="320" y2="505" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="330" y="470" width="540" height="70" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="350" y="500" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Visit and audit factories; choose contractors with good</text><text x="350" y="522" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">records</text><rect x="30" y="552" width="240" height="70" rx="12" fill="#f3d9c8" stroke="#b5602e" stroke-width="2.5"/><text x="150" y="582.1" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Less contact with</text><text x="150" y="603.1" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">customers (logistics)</text><line x1="278" y1="587" x2="320" y2="587" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="330" y="552" width="540" height="70" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="350" y="582" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Agree service standards for delivery times and</text><text x="350" y="604" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">packaging</text>
</svg>