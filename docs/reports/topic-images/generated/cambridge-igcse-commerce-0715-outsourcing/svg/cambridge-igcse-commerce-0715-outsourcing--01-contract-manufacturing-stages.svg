<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 715" width="900" height="715" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="715" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Contract manufacturing in five stages</text>

<rect x="100" y="110" width="620" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="60" cy="155" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="163.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="122" y="142" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Specification</text><text x="122" y="168" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Brand owner sets the design, materials, quantities and quality</text><text x="122" y="189" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">standard</text><line x1="60" y1="179" x2="60" y2="231" stroke="#1e2a44" stroke-width="3"/><rect x="100" y="210" width="620" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="60" cy="255" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="263.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="122" y="242" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Quotation and contract</text><text x="122" y="268" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Manufacturers quote a price per unit; the contract covers price,</text><text x="122" y="289" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">delivery dates, quality and confidentiality</text><line x1="60" y1="279" x2="60" y2="331" stroke="#1e2a44" stroke-width="3"/><rect x="100" y="310" width="620" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="60" cy="355" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="363.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="122" y="342" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Sample approval</text><text x="122" y="368" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A first sample is made and checked before full production</text><line x1="60" y1="379" x2="60" y2="431" stroke="#1e2a44" stroke-width="3"/><rect x="100" y="410" width="620" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="60" cy="455" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="463.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="122" y="442" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Production and inspection</text><text x="122" y="468" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The order is made; the brand owner or a hired inspection firm checks</text><text x="122" y="489" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">quality before shipping</text><line x1="60" y1="479" x2="60" y2="531" stroke="#1e2a44" stroke-width="3"/><rect x="100" y="510" width="620" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="60" cy="555" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="563.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="122" y="542" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Delivery</text><text x="122" y="568" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Finished goods go to the brand owner’s warehouse or straight to</text><text x="122" y="589" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">retailers</text><path d="M732,312 L752,312 L752,498 L732,498" fill="none" stroke="#8a6d0d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="764" y="384" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">quality</text><text x="764" y="406" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">checked</text><text x="764" y="428" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">here</text><rect x="30" y="620" width="840" height="70" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="662" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle">Common in electronics, clothing, cosmetics, medicines and toys</text>
</svg>