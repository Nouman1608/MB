<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 730" width="900" height="730" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="730" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why outsourcing has grown</text>

<text x="150" y="128" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">Cause</text><text x="330" y="128" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Effect on the business</text><rect x="30" y="142" width="240" height="70" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="150" y="171.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Globalisation of</text><text x="150" y="193.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">production</text><line x1="278" y1="177" x2="320" y2="177" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="330" y="142" width="540" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="350" y="172" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Choose the lowest-cost or most skilled producer</text><text x="350" y="194" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">worldwide</text><rect x="30" y="224" width="240" height="70" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="150" y="264.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Better transport</text><line x1="278" y1="259" x2="320" y2="259" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="330" y="224" width="540" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="350" y="254" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Goods made far away can be brought to market by</text><text x="350" y="276" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">container ship or air freight</text><rect x="30" y="306" width="240" height="70" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="150" y="346.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Digital communication</text><line x1="278" y1="341" x2="320" y2="341" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="330" y="306" width="540" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="350" y="336" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Designs, orders and quality reports sent instantly;</text><text x="350" y="358" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">remote firms managed online</text><rect x="30" y="388" width="240" height="70" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="150" y="428.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Growth of ecommerce</text><line x1="278" y1="423" x2="320" y2="423" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="330" y="388" width="540" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="350" y="418" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Small online sellers use contract logistics instead of</text><text x="350" y="440" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">their own warehouses</text><rect x="30" y="470" width="240" height="70" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="150" y="510.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Specialisation</text><line x1="278" y1="505" x2="320" y2="505" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="330" y="470" width="540" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="350" y="500" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Focus on design, branding and marketing; buy in the</text><text x="350" y="522" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">rest from specialists</text><rect x="30" y="552" width="240" height="70" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="150" y="592.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Pressure on costs</text><line x1="278" y1="587" x2="320" y2="587" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="330" y="552" width="540" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="350" y="582" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Avoid the capital cost of factories, machinery,</text><text x="350" y="604" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">warehouses and vehicles</text><rect x="30" y="634" width="240" height="70" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="150" y="674.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Flexibility</text><line x1="278" y1="669" x2="320" y2="669" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="330" y="634" width="540" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="350" y="664" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Extra output or storage for peaks, without capacity</text><text x="350" y="686" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">standing idle all year</text>
</svg>