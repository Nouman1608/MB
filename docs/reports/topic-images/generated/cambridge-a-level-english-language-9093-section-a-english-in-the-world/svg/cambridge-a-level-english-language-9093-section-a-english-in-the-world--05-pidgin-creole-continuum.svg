<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 585" width="900" height="585" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="585" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From pidgin to creole, and the continuum</text>

<rect x="40" y="120" width="230" height="110" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="155" y="160" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">speakers of different</text><text x="155" y="181" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">languages need to</text><text x="155" y="202" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">communicate</text><line x1="272" y1="175" x2="318" y2="175" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="322" y="120" width="240" height="110" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="3"/><text x="442" y="154" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Pidgin</text><text x="442" y="184" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">reduced contact language,</text><text x="442" y="204" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">no native speakers</text><line x1="564" y1="175" x2="610" y2="175" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="587" y="160" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><rect x="614" y="120" width="246" height="122" rx="12" fill="#b5d3cf" stroke="#2e6b62" stroke-width="3"/><text x="737" y="154" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Creole</text><text x="737" y="184" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">children speak it first;</text><text x="737" y="204" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">grammar and vocabulary</text><text x="737" y="224" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">expand</text><text x="587" y="262" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">creolisation</text><text x="450" y="292" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Example: Tok Pisin, now an official language of Papua New Guinea</text><rect x="40" y="310" width="820" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="64" y="345" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The sociolect continuum</text><defs><linearGradient id="cg" x1="0" x2="1"><stop offset="0" stop-color="#f2e7b8"/><stop offset="1" stop-color="#b5d3cf"/></linearGradient></defs><rect x="70" y="375" width="760" height="56" rx="28" fill="url(#cg)" stroke="#1e2a44" stroke-width="2.5"/><text x="100" y="410" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Basilect</text><text x="450" y="410" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Mesolects</text><text x="800" y="410" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">Acrolect</text><text x="100" y="455" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">furthest from the standard</text><text x="800" y="455" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">closest to the standard</text><line x1="300" y1="500" x2="600" y2="500" stroke="#1e2a44" stroke-width="3" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="450" y="490" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">a speaker moves</text><text x="450" y="535" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">according to setting, audience and purpose: style-shifting as well as social difference</text>
</svg>