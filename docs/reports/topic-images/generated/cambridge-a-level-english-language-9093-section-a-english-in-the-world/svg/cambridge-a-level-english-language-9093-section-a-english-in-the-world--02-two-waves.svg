<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="600" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How English spread: two waves</text>

<rect x="40" y="115" width="400" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="152" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="159.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="108" y="160" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Migration and empire</text><rect x="64" y="190" width="352" height="100" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="80" y="216" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">colonial settlement</text><text x="80" y="240" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">first-language communities in North</text><text x="80" y="260" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">America, Australia and New Zealand</text><rect x="64" y="305" width="352" height="120" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="80" y="331" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">colonial administration</text><text x="80" y="355" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">parts of Africa and Asia: English for</text><text x="80" y="375" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">government, law and education,</text><text x="80" y="395" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">alongside local languages</text><rect x="460" y="115" width="400" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="496" cy="152" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="496" y="159.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="528" y="160" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Twentieth century</text><rect x="484" y="190" width="352" height="70" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="500" y="216" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">United States</text><text x="500" y="240" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">economic and cultural influence</text><line x1="660" y1="260" x2="660" y2="285" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="484" y="290" width="352" height="135" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="500" y="316" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">global media, science, business,</text><text x="500" y="338" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">the internet</text><text x="500" y="368" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">extended English to places with no</text><text x="500" y="388" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">colonial link to Britain</text><rect x="40" y="465" width="820" height="110" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="64" y="500" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">David Crystal, English as a Global Language (1997)</text><text x="64" y="530" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A language becomes global through the power of its speakers (political, economic,</text><text x="64" y="554" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cultural), not because the language is "simple" or "flexible".</text>
</svg>