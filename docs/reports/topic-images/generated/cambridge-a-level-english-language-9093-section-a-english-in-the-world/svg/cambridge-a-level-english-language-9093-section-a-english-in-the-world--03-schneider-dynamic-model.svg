<rect width="900" height="630" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Schneider's Dynamic Model</text>

<rect x="40" y="300" width="154" height="170" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="68" cy="330" r="17" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="68" y="336.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="52" y="376" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Foundation</text><rect x="206" y="260" width="154" height="210" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><circle cx="234" cy="290" r="17" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="234" y="296.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="218" y="336" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Exonormative</text><text x="218" y="356" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">stabilisation</text><text x="218" y="388" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">norms imported</text><text x="218" y="407" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">from outside</text><rect x="372" y="220" width="154" height="250" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="400" cy="250" r="17" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="400" y="256.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="384" y="296" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Nativisation</text><text x="384" y="328" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">local features</text><text x="384" y="347" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">develop</text><rect x="538" y="180" width="154" height="290" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="566" cy="210" r="17" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="566" y="216.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="550" y="256" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Endonormative</text><text x="550" y="276" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">stabilisation</text><text x="550" y="308" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">local norms</text><text x="550" y="327" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">accepted as</text><text x="550" y="346" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">standard</text><rect x="704" y="140" width="154" height="330" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="732" cy="170" r="17" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="732" y="176.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="716" y="216" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Differentiation</text><text x="716" y="248" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">internal</text><text x="716" y="267" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">varieties emerge</text><line x1="60" y1="488" x2="840" y2="488" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="450" y="515" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">phases of a postcolonial English (Edgar Schneider)</text><rect x="40" y="535" width="820" height="70" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="450" y="578" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Useful for explaining why attitudes to a local variety change over time.</text>
</svg>