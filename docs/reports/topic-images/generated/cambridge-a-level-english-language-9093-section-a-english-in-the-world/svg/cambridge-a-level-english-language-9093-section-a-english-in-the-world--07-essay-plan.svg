<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 658" width="900" height="658" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="658" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Planning the Section A essay</text>

<rect x="40" y="112" width="820" height="56" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="450" y="147" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Underline the specified aspect; read once for the argument, once for issues</text><text x="450" y="205" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Choose three or four issues and rank them: one paragraph each</text><rect x="40" y="225" width="190" height="158" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><circle cx="135" cy="258" r="18" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="135" y="264.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="135" y="302" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Quote</text><text x="135" y="328" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">the text precisely</text><line x1="231" y1="295" x2="245" y2="295" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="247" y="225" width="190" height="158" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><circle cx="342" cy="258" r="18" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="342" y="264.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="342" y="302" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Explain</text><text x="342" y="328" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">the issue</text><line x1="438" y1="295" x2="452" y2="295" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="454" y="225" width="190" height="158" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="549" cy="258" r="18" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="549" y="264.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="549" y="302" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Connect</text><text x="549" y="328" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">to a theory, study,</text><text x="549" y="347" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">model or real</text><text x="549" y="366" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">example</text><line x1="645" y1="295" x2="659" y2="295" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="661" y="225" width="190" height="158" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="756" cy="258" r="18" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="756" y="264.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="756" y="302" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Evaluate</text><text x="756" y="328" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">do not simply agree</text><rect x="40" y="403" width="820" height="145" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="64" y="436" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">In the model paragraph (English and education)</text><text x="64" y="465" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Quote: "unable to tell her grandmother"</text><text x="64" y="490" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Connect: language shift (a domain lost); equality of opportunity; Phillipson</text><text x="64" y="515" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Evaluate: why not add English without subtracting the home language?</text><rect x="40" y="568" width="820" height="64" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="607" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Conclude with a judgement that answers the question, not a restatement.</text>
</svg>