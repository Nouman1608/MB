<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Paper 4 Section A: the task</text>

<text x="450" y="128" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">Paper 4 Language Topics</text><rect x="40" y="142" width="410" height="70" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="245" y="175" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Section A: English in the World</text><text x="245" y="200" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">25 marks, compulsory</text><rect x="450" y="142" width="410" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="655" y="182" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Section B (the other half)</text><rect x="40" y="240" width="150" height="66" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="280" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Read</text><rect x="204" y="240" width="656" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="224" y="280" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">400-500 words of unseen text on the topic</text><line x1="115" y1="306" x2="115" y2="320" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="40" y="322" width="150" height="66" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="362" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Focus</text><rect x="204" y="322" width="656" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="224" y="362" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the specified aspect, e.g. education, identity, the future of English</text><line x1="115" y1="388" x2="115" y2="402" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="40" y="404" width="150" height="66" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="444" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Select</text><rect x="204" y="404" width="656" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="224" y="444" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the most important issues: select and rank, do not summarise</text><line x1="115" y1="470" x2="115" y2="484" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="40" y="486" width="150" height="66" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="526" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Write</text><rect x="204" y="486" width="656" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="224" y="526" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">an essay: details from the text + ideas from wider study</text><rect x="40" y="580" width="260" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="52" y="593" width="68" height="44" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="86" y="622" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">AO1</text><text x="132" y="610" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">reading and</text><text x="132" y="629" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">understanding</text><rect x="320" y="580" width="260" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="332" y="593" width="68" height="44" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="366" y="622" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">AO2</text><text x="412" y="620" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">writing effectively</text><rect x="600" y="580" width="260" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="612" y="593" width="68" height="44" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="646" y="622" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">AO4</text><text x="692" y="610" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">linguistic issues,</text><text x="692" y="629" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">concepts, methods</text>
