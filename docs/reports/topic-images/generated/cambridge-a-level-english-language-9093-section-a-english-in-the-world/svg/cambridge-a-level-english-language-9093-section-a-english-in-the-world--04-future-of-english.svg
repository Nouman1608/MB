<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="520" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three views of the future of English</text>

<rect x="330" y="112" width="240" height="56" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="147" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">The future of English?</text><line x1="450" y1="168" x2="170" y2="200" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="40" y="205" width="260" height="290" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="52" y="217" width="236" height="50" rx="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="170" y="249" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Main lingua franca</text><text x="62" y="300" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">English keeps its role as</text><text x="62" y="322" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the main international</text><text x="62" y="344" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">lingua franca</text><line x1="450" y1="168" x2="450" y2="200" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="320" y="205" width="260" height="290" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="332" y="217" width="236" height="50" rx="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="450" y="249" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Advantage shifts</text><text x="342" y="300" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">as more people use</text><text x="342" y="322" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">English as an additional</text><text x="342" y="344" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">language, monolingual</text><text x="342" y="366" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">speakers may lose their</text><text x="342" y="388" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">advantage; other</text><text x="342" y="410" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">languages may grow</text><text x="342" y="435" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">associated with David</text><text x="342" y="455" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Graddol</text><line x1="450" y1="168" x2="730" y2="200" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="600" y="205" width="260" height="290" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="612" y="217" width="236" height="50" rx="9" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="730" y="249" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Fragmentation</text><text x="622" y="300" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">English splits into</text><text x="622" y="322" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mutually less</text><text x="622" y="344" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">intelligible varieties,</text><text x="622" y="366" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">as Latin did</text><text x="622" y="435" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">critics: global media and</text><text x="622" y="455" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">communication make this</text><text x="622" y="475" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">less likely</text>
</svg>