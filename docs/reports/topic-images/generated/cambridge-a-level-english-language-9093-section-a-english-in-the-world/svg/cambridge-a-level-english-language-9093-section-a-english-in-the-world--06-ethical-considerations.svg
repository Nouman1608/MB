<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 665" width="900" height="665" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="665" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Ethical considerations</text>

<rect x="40" y="115" width="230" height="98" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="155" y="159" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Language shift</text><text x="155" y="181" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">and death</text><rect x="282" y="115" width="578" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="300" y="148" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a community moves to a dominant language in more</text><text x="300" y="170" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">domains; younger generations may stop learning the</text><text x="300" y="192" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">heritage language</text><rect x="40" y="227" width="230" height="98" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="155" y="271" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Cultural</text><text x="155" y="293" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">imperialism</text><rect x="282" y="227" width="578" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="300" y="260" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Phillipson (1992): English promoted for powerful</text><text x="300" y="282" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">nations; Ngũgĩ wrote in Gikuyu. Critics: people choose</text><text x="300" y="304" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and adapt English</text><rect x="40" y="339" width="230" height="98" rx="10" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5"/><text x="155" y="383" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Equality of</text><text x="155" y="405" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">opportunity</text><rect x="282" y="339" width="578" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="300" y="383" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">English opens education, work and information, but as a</text><text x="300" y="405" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">gatekeeper it excludes those without good teaching</text><rect x="40" y="451" width="230" height="98" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="155" y="495" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Global</text><text x="155" y="517" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">cooperation</text><rect x="282" y="451" width="578" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="300" y="495" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a shared lingua franca supports science, diplomacy and</text><text x="300" y="517" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">safety-critical communication, e.g. aviation</text><rect x="40" y="570" width="820" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="612" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">The same language can widen and narrow opportunity: weigh both sides.</text>
</svg>