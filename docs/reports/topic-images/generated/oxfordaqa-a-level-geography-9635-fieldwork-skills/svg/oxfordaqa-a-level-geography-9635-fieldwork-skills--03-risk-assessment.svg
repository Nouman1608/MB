<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Risk assessment: likelihood and severity</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Every hazard needs a control measure</text>
<rect x="200" y="336" width="210" height="96" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><rect x="410" y="336" width="210" height="96" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><rect x="620" y="336" width="210" height="96" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><rect x="200" y="240" width="210" height="96" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><rect x="410" y="240" width="210" height="96" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><rect x="620" y="240" width="210" height="96" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><rect x="200" y="144" width="210" height="96" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><rect x="410" y="144" width="210" height="96" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><rect x="620" y="144" width="210" height="96" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><text x="305" y="458" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Low</text><text x="186" y="390" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="end">Low</text><text x="515" y="458" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Medium</text><text x="186" y="294" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="end">Medium</text><text x="725" y="458" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">High</text><text x="186" y="198" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="end">High</text><text x="515" y="486" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">LIKELIHOOD</text><text transform="translate(60,288) rotate(-90)" text-anchor="middle" font-size="16" font-weight="700" fill="#4a5568">SEVERITY</text><circle cx="515" cy="192" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="515" y="198.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><circle cx="410" cy="214" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="410" y="220.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><circle cx="515" cy="288" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="515" y="294.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><circle cx="305" cy="192" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="305" y="198.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><clipPath id="tc498"><rect x="30" y="498" width="840" height="257" rx="14"/></clipPath><g clip-path="url(#tc498)"><rect x="30" y="498" width="70" height="48" fill="#b5d3cf"/><rect x="100" y="498" width="303.3333333333333" height="48" fill="#b5d3cf"/><text x="114" y="525.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Hazard</text><rect x="403.3333333333333" y="498" width="466.66666666666663" height="48" fill="#b5d3cf"/><text x="417.3333333333333" y="525.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Control measure</text><rect x="30" y="546" width="70" height="47" fill="#dce9e7"/><text x="44" y="572.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">1</text><rect x="100" y="546" width="303.3333333333333" height="47" fill="#ffffff"/><text x="114" y="572.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Traffic when counting pedestrians</text><rect x="403.3333333333333" y="546" width="466.66666666666663" height="47" fill="#ffffff"/><text x="417.3333333333333" y="572.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Stand away from the kerb; work only at marked crossings</text><line x1="30" y1="593" x2="870" y2="593" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="593" width="70" height="68" fill="#dce9e7"/><text x="44" y="619.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">2</text><rect x="100" y="593" width="303.3333333333333" height="68" fill="#f8faf9"/><text x="114" y="619.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fast-flowing water in a river (low to</text><text x="114" y="640.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">medium likelihood)</text><rect x="403.3333333333333" y="593" width="466.66666666666663" height="68" fill="#f8faf9"/><text x="417.3333333333333" y="619.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Do not enter above knee depth; check river levels</text><text x="417.3333333333333" y="640.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">beforehand</text><line x1="30" y1="661" x2="870" y2="661" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="661" width="70" height="47" fill="#dce9e7"/><text x="44" y="687.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">3</text><rect x="100" y="661" width="303.3333333333333" height="47" fill="#ffffff"/><text x="114" y="687.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Hot weather</text><rect x="403.3333333333333" y="661" width="466.66666666666663" height="47" fill="#ffffff"/><text x="417.3333333333333" y="687.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Carry water; work in shade; limit time outdoors</text><line x1="30" y1="708" x2="870" y2="708" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="708" width="70" height="47" fill="#dce9e7"/><text x="44" y="734.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">4</text><rect x="100" y="708" width="303.3333333333333" height="47" fill="#f8faf9"/><text x="114" y="734.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lone working</text><rect x="403.3333333333333" y="708" width="466.66666666666663" height="47" fill="#f8faf9"/><text x="417.3333333333333" y="734.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Work in groups; agree a meeting time and carry a phone</text></g><line x1="100" y1="498" x2="100" y2="755" stroke="#c9d6d4" stroke-width="1.5"/><line x1="403.3333333333333" y1="498" x2="403.3333333333333" y2="755" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="498" width="840" height="257" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
