<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Match the technique to the data</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Presentation and analysis must be justified</text>
<clipPath id="tc124"><rect x="30" y="124" width="840" height="399" rx="14"/></clipPath><g clip-path="url(#tc124)"><rect x="30" y="124" width="387.69230769230774" height="49" fill="#b5d3cf"/><text x="44" y="152.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Data or purpose</text><rect x="417.69230769230774" y="124" width="452.3076923076924" height="49" fill="#b5d3cf"/><text x="431.69230769230774" y="152.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Technique</text><rect x="30" y="173" width="387.69230769230774" height="47" fill="#dce9e7"/><text x="44" y="199.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Footfall at named sites</text><rect x="417.69230769230774" y="173" width="452.3076923076924" height="47" fill="#ffffff"/><text x="431.69230769230774" y="199.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Located proportional circles on a base map</text><line x1="30" y1="220" x2="870" y2="220" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="220" width="387.69230769230774" height="68" fill="#dce9e7"/><text x="44" y="246.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Footfall against distance</text><rect x="417.69230769230774" y="220" width="452.3076923076924" height="68" fill="#f8faf9"/><text x="431.69230769230774" y="246.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Scatter graph; Spearman's rank (paired continuous</text><text x="431.69230769230774" y="267.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">data)</text><line x1="30" y1="288" x2="870" y2="288" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="288" width="387.69230769230774" height="47" fill="#dce9e7"/><text x="44" y="314.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">River channel shape</text><rect x="417.69230769230774" y="288" width="452.3076923076924" height="47" fill="#ffffff"/><text x="431.69230769230774" y="314.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cross-section</text><line x1="30" y1="335" x2="870" y2="335" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="335" width="387.69230769230774" height="47" fill="#dce9e7"/><text x="44" y="361.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Land use</text><rect x="417.69230769230774" y="335" width="452.3076923076924" height="47" fill="#f8faf9"/><text x="431.69230769230774" y="361.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Annotated photographs</text><line x1="30" y1="382" x2="870" y2="382" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="382" width="387.69230769230774" height="47" fill="#dce9e7"/><text x="44" y="408.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Counts in categories</text><rect x="417.69230769230774" y="382" width="452.3076923076924" height="47" fill="#ffffff"/><text x="431.69230769230774" y="408.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Chi-square</text><line x1="30" y1="429" x2="870" y2="429" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="429" width="387.69230769230774" height="47" fill="#dce9e7"/><text x="44" y="455.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Comparing sites</text><rect x="417.69230769230774" y="429" width="452.3076923076924" height="47" fill="#f8faf9"/><text x="431.69230769230774" y="455.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Central tendency and dispersion</text><line x1="30" y1="476" x2="870" y2="476" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="476" width="387.69230769230774" height="47" fill="#dce9e7"/><text x="44" y="502.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Interviews (qualitative)</text><rect x="417.69230769230774" y="476" width="452.3076923076924" height="47" fill="#ffffff"/><text x="431.69230769230774" y="502.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Code into themes, count, quote briefly</text></g><line x1="417.69230769230774" y1="124" x2="417.69230769230774" y2="523" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="124" width="840" height="399" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="545" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="579.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Always return to the hypothesis</text><text x="50" y="608.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Integrate presentation with location (graphs on a base map often show spatial pattern more clearly), and</text><text x="50" y="629.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">say what each pattern shows.</text>
