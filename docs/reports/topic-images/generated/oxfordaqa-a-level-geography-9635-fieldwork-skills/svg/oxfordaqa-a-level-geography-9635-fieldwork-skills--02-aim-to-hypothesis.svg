<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 703" width="900" height="703" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="703" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From aim to justified hypothesis</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The guide's invented Marton example</text>
<rect x="30" y="124" width="840" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AIM</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">What you want to find out</text><text x="50" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">To investigate how pedestrian footfall changes with distance from the centre of Marton.</text><line x1="450" y1="241" x2="450" y2="271" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="276" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="308" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">HYPOTHESIS</text><text x="50" y="334.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A testable prediction based on theory</text><text x="50" y="363.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Footfall decreases with distance from the main square.</text><line x1="450" y1="393" x2="450" y2="423" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="428" width="840" height="133" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="460" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">JUSTIFICATION</text><text x="50" y="486.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Link it to a concept you have studied</text><text x="50" y="515.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Bid-rent theory: the most accessible central locations attract the highest density of shops and therefore</text><text x="50" y="536.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">of shoppers.</text><rect x="30" y="583" width="840" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="617.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Or a research question</text><text x="50" y="646.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">An open question, used when a prediction is not appropriate, for example with qualitative data.</text>
</svg>