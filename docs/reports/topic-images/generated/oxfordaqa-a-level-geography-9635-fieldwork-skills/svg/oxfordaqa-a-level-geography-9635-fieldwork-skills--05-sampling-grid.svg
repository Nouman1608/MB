 height="22" fill="none" stroke="#2e6b62" stroke-width="3"/><rect x="200" y="620" width="211.33333333333334" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="213" y="656.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Random</text><text x="213" y="683" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Locations chosen by</text><text x="213" y="703" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">chance.</text><rect x="429.33333333333337" y="620" width="211.33333333333334" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="442.33333333333337" y="656.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Systematic</text><text x="442.33333333333337" y="683" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">At regular intervals, e.g.</text><text x="442.33333333333337" y="703" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">every 100 m.</text><rect x="658.6666666666667" y="620" width="211.33333333333334" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="671.6666666666667" y="646.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Stratified</text><text x="671.6666666666667" y="673" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">In proportion to</text><text x="671.6666666666667" y="693" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">sub-groups or zones</text><text x="671.6666666666667" y="713" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(shaded), e.g. by age.</text>
