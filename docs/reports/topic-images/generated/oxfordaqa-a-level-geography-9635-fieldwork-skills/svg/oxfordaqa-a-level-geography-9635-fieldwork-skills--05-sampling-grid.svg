<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three sampling methods, three shapes</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Random, systematic and stratified, at points, along lines or within areas</text>
