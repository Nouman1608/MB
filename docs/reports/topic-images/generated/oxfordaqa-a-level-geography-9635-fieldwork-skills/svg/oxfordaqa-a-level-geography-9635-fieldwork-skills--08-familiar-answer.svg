<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 656" width="900" height="656" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="656" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Anatomy of a familiar fieldwork answer</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">"Evaluate the sampling strategy you used." [9]</text>
<line x1="60" y1="144" x2="60" y2="604" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="152.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">State the method precisely</text><text x="118" y="180.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Systematic: five-minute counts every 100 m along a transect from the main square.</text><circle cx="60" cy="161.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="170.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="209" width="766" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="237.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Strength linked to the hypothesis</text><text x="118" y="265.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Even coverage; footfall plotted against distance for Spearman's rank.</text><circle cx="60" cy="246.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="255.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="294" width="766" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="322.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Limitations with evidence</text><text x="118" y="350.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Missed clusters between points; a bus stop inflated one count.</text><circle cx="60" cy="331.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="340.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="379" width="766" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="407.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Reliability</text><text x="118" y="435.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">One afternoon only: a very small sample in time.</text><circle cx="60" cy="416.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="425.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="464" width="766" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="492.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Specific improvement</text><text x="118" y="520.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Stratified by land-use zone, repeated on a weekday and a weekend.</text><circle cx="60" cy="501.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="510.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="104" y="549" width="766" height="75" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="118" y="577.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement</text><text x="118" y="605.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Adequate for the overall trend; limited for explaining local anomalies.</text><circle cx="60" cy="586.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="595.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text>
</svg>