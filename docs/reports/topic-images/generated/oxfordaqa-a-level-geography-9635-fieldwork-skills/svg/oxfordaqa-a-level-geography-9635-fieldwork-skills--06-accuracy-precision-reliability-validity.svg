<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 588" width="900" height="588" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="588" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four words that are often confused</text>

<rect x="30" y="100" width="411" height="133" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="142.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ACCURACY</text><text x="50" y="169.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Close to the true value?</text><text x="50" y="198.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">How close a measurement is to the true value.</text><rect x="459" y="100" width="411" height="133" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="479" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PRECISION</text><text x="479" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">How fine is the scale?</text><text x="479" y="187.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">E.g. to the nearest millimetre rather than</text><text x="479" y="208.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">centimetre.</text><rect x="30" y="251" width="411" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="283" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">RELIABILITY</text><text x="50" y="309.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Same result if repeated?</text><text x="50" y="338.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Whether repeating the method would give</text><text x="50" y="359.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">similar results.</text><rect x="459" y="251" width="411" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="283" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">VALIDITY</text><text x="479" y="309.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Measuring the right thing?</text><text x="479" y="338.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Whether the method actually measures what the</text><text x="479" y="359.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">hypothesis is about.</text><rect x="30" y="406" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="440" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Example: one footfall count on a rainy Monday</text><circle cx="70" cy="496" r="18" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="70" y="503" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="98" y="502" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">may be accurate for that moment</text><circle cx="470" cy="496" r="18" fill="#ffffff" stroke="#b5602e" stroke-width="3"/><text x="470" y="503" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><text x="498" y="502" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">not reliable</text><circle cx="660" cy="496" r="18" fill="#ffffff" stroke="#b5602e" stroke-width="3"/><text x="660" y="503" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><text x="688" y="502" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">not valid as typical</text><text x="50" y="542" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">A single count cannot be repeated, and one wet weekday does not represent typical footfall.</text>
</svg>