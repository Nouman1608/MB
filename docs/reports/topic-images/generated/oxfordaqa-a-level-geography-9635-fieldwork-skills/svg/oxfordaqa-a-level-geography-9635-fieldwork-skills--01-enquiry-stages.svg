<rect width="900" height="603" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five stages of a fieldwork enquiry</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Unit 5: 60 marks, 15 of them on your own investigation</text>
<rect x="30" y="124" width="147.2" height="152" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="42" y="148" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">3.5.2.1</text><text x="42" y="173.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Planning</text><text x="42" y="200" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Aim, hypothesis,</text><text x="42" y="220" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">location,</text><text x="42" y="240" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">secondary</text><text x="42" y="260" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">research, risk</text><line x1="183.2" y1="200" x2="197.2" y2="200" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="203.2" y="124" width="147.2" height="152" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="215.2" y="148" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">3.5.2.2</text><text x="215.2" y="173.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Collection</text><text x="215.2" y="200" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Primary and</text><text x="215.2" y="220" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">secondary data;</text><text x="215.2" y="240" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">sampling; pilot</text><line x1="356.4" y1="200" x2="370.4" y2="200" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="376.4" y="124" width="147.2" height="152" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="388.4" y="148" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">3.5.2.3</text><text x="388.4" y="173.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Presentation</text><text x="388.4" y="200" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Maps, graphs,</text><text x="388.4" y="220" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">photos,</text><text x="388.4" y="240" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">sketches, tables,</text><text x="388.4" y="260" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">quotations</text><line x1="529.5999999999999" y1="200" x2="543.5999999999999" y2="200" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="549.5999999999999" y="124" width="147.2" height="152" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="561.5999999999999" y="148" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">3.5.2.4</text><text x="561.5999999999999" y="173.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Analysis</text><text x="561.5999999999999" y="200" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Patterns, trends,</text><text x="561.5999999999999" y="220" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">anomalies;</text><text x="561.5999999999999" y="240" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">statistics</text><line x1="702.8" y1="200" x2="716.8" y2="200" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="722.8" y="124" width="147.2" height="152" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="734.8" y="148" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">3.5.2.5</text><text x="734.8" y="173.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Conclusions</text><text x="734.8" y="200" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Accept or reject;</text><text x="734.8" y="220" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">ethics; evaluate</text><rect x="30" y="290" width="210" height="78" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="135" y="325" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Own investigation</text><text x="135" y="349" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">15 marks</text><rect x="240" y="290" width="630" height="78" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="555" y="325" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Rest of Unit 5</text><text x="555" y="349" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">45 marks</text><text x="450" y="394" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Unit 5 marks, bar to scale</text><rect x="30" y="410" width="411" height="161" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="444.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Acceptable alternatives</text><text x="50" y="473.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="473.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Enquiries within the school grounds</text><text x="50" y="499.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="499.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Interviewing people in school or at home</text><text x="50" y="525.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="525.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Raw, unprocessed data from the teacher,</text><text x="65.2" y="546.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">which you sample and judge</text><rect x="459" y="410" width="411" height="161" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="479" y="444.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Not acceptable</text><text x="479" y="473.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="494.2" y="473.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Pre-processed data handed over ready for</text><text x="494.2" y="494.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">analysis: "there must be some element of</text><text x="494.2" y="515.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">planning and selecting"</text>
</svg>