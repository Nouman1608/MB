<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 564" width="900" height="564" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="564" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three ways of measuring crime</text>

<rect x="30" y="104" width="190" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Measure</text><rect x="220" y="104" width="300" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="232" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Strengths</text><rect x="520" y="104" width="350" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="532" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Limitations</text><rect x="30" y="150" width="190" height="85" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="175.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Official</text><text x="42" y="196.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">statistics</text><rect x="220" y="150" width="300" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="232" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">National coverage; show trends;</text><text x="232" y="196.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">cheap</text><rect x="520" y="150" width="350" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="532" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Miss unreported and unrecorded crime;</text><text x="532" y="196.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">police priorities and counting rules</text><text x="532" y="217.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">change</text><rect x="30" y="235" width="190" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="260.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Self-report</text><text x="42" y="281.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">studies</text><rect x="220" y="235" width="300" height="64" fill="#fbf8ea" stroke="#1e2a44" stroke-width="2"/><text x="232" y="260.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Reveal undetected offending; show</text><text x="232" y="281.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">who offends, not who is caught</text><rect x="520" y="235" width="350" height="64" fill="#fbf8ea" stroke="#1e2a44" stroke-width="2"/><text x="532" y="260.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Lying, exaggeration, memory; mainly</text><text x="532" y="281.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">minor offences; often young samples</text><rect x="30" y="299" width="190" height="85" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="324.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Victim surveys</text><rect x="220" y="299" width="300" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="232" y="324.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Reveal crime not reported to</text><text x="232" y="345.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">police</text><rect x="520" y="299" width="350" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="532" y="324.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Miss victimless and business crimes;</text><text x="532" y="345.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">memory; some victims do not know, e.g.</text><text x="532" y="366.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">fraud</text><rect x="30" y="402" width="410" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="435" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NATIONAL</text><text x="50" y="460.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Crime Survey for England and Wales</text><text x="50" y="488.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Began in 1982 as the British Crime Survey</text><rect x="460" y="402" width="410" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="435" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LOCAL</text><text x="480" y="460.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Islington Crime Survey (1986)</text><text x="480" y="488.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Much higher victimisation in an inner-city</text><text x="480" y="509.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">area than national averages suggested</text>
</svg>