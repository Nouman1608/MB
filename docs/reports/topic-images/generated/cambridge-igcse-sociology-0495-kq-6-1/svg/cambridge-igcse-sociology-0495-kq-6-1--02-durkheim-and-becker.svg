<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 352" width="900" height="352" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="352" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two explanations of relativity</text>

<rect x="30" y="104" width="410" height="218" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DURKHEIM</text><text x="50" y="164" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Some crime is normal and</text><text x="50" y="190" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">functional</text><text x="50" y="219.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="219.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Reacting to crime reminds people of</text><text x="66.15" y="241.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">shared rules: boundary maintenance</text><text x="50" y="271.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="271.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">It can prompt social change</text><rect x="460" y="104" width="410" height="218" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">BECKER (1963)</text><text x="480" y="164" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Deviance is a label</text><text x="480" y="193.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="496.15" y="193.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Not a quality of the act itself</text><text x="480" y="223.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="496.15" y="223.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Deviant behaviour is behaviour people so</text><text x="496.15" y="245.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">label</text><text x="480" y="275.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="496.15" y="275.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Powerful groups decide which acts are</text><text x="496.15" y="297.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">labelled</text>
</svg>