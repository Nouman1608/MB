<rect width="900" height="707" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Eleven types of crime</text>

<rect x="30" y="110" width="200" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="130" y="147.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Violent</text><text x="130" y="174" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">e.g. Assault</text><rect x="243.33" y="110" width="200" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="343.33000000000004" y="147.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Property</text><text x="343.33000000000004" y="174" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">e.g. Burglary, theft</text><rect x="456.66" y="110" width="200" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="556.6600000000001" y="136.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">White-collar /</text><text x="556.6600000000001" y="158.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">corporate</text><text x="556.6600000000001" y="185" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">e.g. Embezzlement</text><rect x="669.99" y="110" width="200" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="769.99" y="137.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Expressive</text><text x="769.99" y="164" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">e.g. Fight after an</text><text x="769.99" y="184" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">insult</text><rect x="30" y="214" width="200" height="92" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="130" y="241.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Instrumental</text><text x="130" y="268" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">e.g. Shoplifting to</text><text x="130" y="288" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">sell</text><rect x="243.33" y="214" width="200" height="92" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="343.33000000000004" y="241.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Gang</text><text x="343.33000000000004" y="268" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">e.g. Drug dealing for</text><text x="343.33000000000004" y="288" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">territory</text><rect x="456.66" y="214" width="200" height="92" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="556.6600000000001" y="241.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Green</text><text x="556.6600000000001" y="268" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">e.g. Dumping toxic</text><text x="556.6600000000001" y="288" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">waste</text><rect x="669.99" y="214" width="200" height="92" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="769.99" y="251.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Global / organised</text><text x="769.99" y="278" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">e.g. People trafficking</text><rect x="30" y="318" width="200" height="92" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="130" y="345.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Cyber</text><text x="130" y="372" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">e.g. Hacking,</text><text x="130" y="392" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">ransomware</text><rect x="243.33" y="318" width="200" height="92" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="343.33000000000004" y="345.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Hate</text><text x="343.33000000000004" y="372" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">e.g. Attacks on a</text><text x="343.33000000000004" y="392" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">religion</text><rect x="456.66" y="318" width="200" height="92" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="556.6600000000001" y="355.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Domestic</text><text x="556.6600000000001" y="382" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">e.g. Coercive control</text><rect x="669.99" y="318" width="200" height="92" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="769.99" y="345.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Types overlap</text><text x="769.99" y="372" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Say which features fit</text><text x="769.99" y="392" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">each label</text><rect x="30" y="430" width="840" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="463" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">WORKED STIMULUS</text><text x="50" y="488.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Young men steal designer trainers, then post videos insulting a rival group</text><text x="50" y="512.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">of another religion</text><rect x="30" y="550" width="272" height="129" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="584.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The theft</text><text x="50" y="612.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Property + instrumental;</text><text x="50" y="633.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">gang if organised around</text><text x="50" y="654.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">territory or identity</text><rect x="314" y="550" width="272" height="129" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334" y="584.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The posts</text><text x="334" y="612.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Hate crime if targeting</text><text x="334" y="633.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">religion; cyber-enabled</text><rect x="598" y="550" width="272" height="129" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="618" y="584.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Apply 6.1.6</text><text x="618" y="612.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Theft may not be recorded:</text><text x="618" y="633.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">no witness, low value, shop</text><text x="618" y="654.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">does not report</text>
</svg>