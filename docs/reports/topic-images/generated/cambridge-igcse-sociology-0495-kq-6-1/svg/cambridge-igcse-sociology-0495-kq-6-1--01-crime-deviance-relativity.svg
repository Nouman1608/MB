<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 746" width="900" height="746" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="746" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Crime, deviance and relativity</text>

<rect x="30" y="110" width="840" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="350" cy="315" r="140" fill="#f2e7b8" fill-opacity="0.85" stroke="#8a6d0d" stroke-width="3"/><circle cx="550" cy="315" r="140" fill="#b5d3cf" fill-opacity="0.55" stroke="#2e6b62" stroke-width="3"/><text x="330" y="152" font-size="22" font-weight="700" fill="#8a6d0d" text-anchor="middle">Deviance</text><text x="570" y="152" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="middle">Crime</text><text x="115" y="275" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle">Breaks social</text><text x="115" y="296" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle">norms; attracts</text><text x="115" y="317" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle">disapproval</text><text x="785" y="275" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">Breaks criminal</text><text x="785" y="296" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">law; punishable</text><text x="785" y="317" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">by the state</text><text x="285" y="297" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Talking</text><text x="285" y="319" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">loudly in a</text><text x="285" y="341" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">library</text><text x="285" y="365" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="middle">deviant, not</text><text x="285" y="383" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="middle">criminal</text><text x="450" y="311" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Most</text><text x="450" y="333" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">crime</text><text x="615" y="309" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Minor</text><text x="615" y="331" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">speeding</text><text x="615" y="365" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">criminal, barely</text><text x="615" y="383" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">deviant</text><rect x="30" y="510" width="201" height="184" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="543.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Between</text><text x="50" y="565.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">societies</text><text x="50" y="592" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Alcohol legal in</text><text x="50" y="612" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">many countries,</text><text x="50" y="632" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">prohibited in others</text><text x="50" y="652" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">such as Saudi Arabia</text><rect x="243" y="510" width="201" height="184" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="263" y="543.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Within a society</text><text x="263" y="570" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Face tattoos</text><text x="263" y="590" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">accepted in one</text><text x="263" y="610" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">subculture, deviant</text><text x="263" y="630" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">to others</text><rect x="456" y="510" width="201" height="184" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="476" y="543.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Situation</text><text x="476" y="570" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Killing: murder in</text><text x="476" y="590" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">peacetime, lawful</text><text x="476" y="610" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">for a soldier in war</text><rect x="669" y="510" width="201" height="184" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="689" y="543.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Across time</text><text x="689" y="570" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">England and Wales:</text><text x="689" y="590" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">sex between men</text><text x="689" y="610" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">partly</text><text x="689" y="630" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">decriminalised in</text><text x="689" y="650" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">1967; smoking ban in</text><text x="689" y="670" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">2007</text><text x="450" y="724" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">Relativity: whether an act counts depends on context</text>
</svg>