<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="650" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Agencies of social control</text>

<text x="235" y="132" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="middle">Formal control</text><text x="235" y="156" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">state agencies; written rules; official sanctions</text><rect x="30" y="172" width="410" height="88" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="42" y="197.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Police</text><text x="42" y="224" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Patrol, investigate, arrest, caution; presence</text><text x="42" y="244" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">deters</text><rect x="30" y="268" width="410" height="68" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="42" y="293.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Courts</text><text x="42" y="320" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Decide guilt; sentence; make an example</text><rect x="30" y="344" width="410" height="68" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="42" y="369.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Armed forces</text><text x="42" y="396" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Defend the state; restore order in emergencies</text><rect x="30" y="420" width="410" height="68" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="42" y="445.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Government</text><text x="42" y="472" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Makes laws defining crime; sets policy</text><rect x="30" y="496" width="410" height="68" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="42" y="521.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Penal system</text><text x="42" y="548" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Prisons, probation, community sentences</text><text x="665" y="132" font-size="22" font-weight="700" fill="#8a6d0d" text-anchor="middle">Informal control</text><text x="665" y="156" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">everyday relationships; informal sanctions</text><rect x="460" y="172" width="410" height="68" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="472" y="197.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Family</text><text x="472" y="224" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Grounding, praise, disappointment</text><rect x="460" y="248" width="410" height="68" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="472" y="273.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Education</text><text x="472" y="300" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Rules, detentions, rewards, hidden curriculum</text><rect x="460" y="324" width="410" height="68" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="472" y="349.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Workplace</text><text x="472" y="376" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Promotion, warnings, dismissal</text><rect x="460" y="400" width="410" height="68" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="472" y="425.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Peer group</text><text x="472" y="452" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Acceptance or ridicule</text><rect x="460" y="476" width="410" height="68" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="472" y="501.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Traditional and digital media</text><text x="472" y="528" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Public shaming, “likes”, removing posts</text><rect x="460" y="552" width="410" height="68" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="472" y="577.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Religion</text><text x="472" y="604" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Moral codes; reward or punishment after death</text>
</svg>