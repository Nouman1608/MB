<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 669" width="900" height="669" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="669" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Measuring crime and the dark figure</text>

<rect x="30" y="110" width="840" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="60" y="134" width="780" height="64" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="173" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">All crime</text><rect x="130" y="212" width="640" height="64" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="251" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Experienced by victims who know</text><rect x="215" y="290" width="470" height="64" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="329" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Reported to police</text><rect x="295" y="368" width="310" height="64" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="407" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Recorded by police</text><rect x="70" y="151" width="150" height="30" rx="15" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="145" y="172" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">Self-report</text><rect x="140" y="229" width="150" height="30" rx="15" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="215" y="250" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">Victim surveys</text><rect x="630" y="385" width="150" height="30" rx="15" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="705" y="406" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">Official stats</text><text x="450" y="452" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">Gap between all crime and recorded crime = the dark figure</text><rect x="30" y="490" width="410" height="151" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="525.2" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Why unreported</text><text x="50" y="553.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Seen as trivial; no confidence in police;</text><text x="50" y="574.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">fear of reprisals; embarrassment; not</text><text x="50" y="595.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">realising; relationship with the offender;</text><text x="50" y="616.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">victimless crimes</text><rect x="460" y="490" width="410" height="151" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="480" y="525.2" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Why unrecorded</text><text x="480" y="553.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Police discretion; decision that no crime</text><text x="480" y="574.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">occurred; insufficient evidence; pressure</text><text x="480" y="595.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">from targets</text>
</svg>