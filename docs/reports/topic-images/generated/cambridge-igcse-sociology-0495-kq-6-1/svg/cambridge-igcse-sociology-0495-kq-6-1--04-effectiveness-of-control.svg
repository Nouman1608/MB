<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 904" width="900" height="904" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="904" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Which kind of control works better?</text>

<rect x="30" y="104" width="840" height="85" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">HIRSCHI’S SOCIAL BOND THEORY (1969)</text><text x="50" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">People avoid crime when bonds to society are strong</text><rect x="30" y="207" width="201" height="109" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="130.5" y="242.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Attachment</text><text x="130.5" y="270.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">to other people</text><rect x="243" y="207" width="201" height="109" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="343.5" y="242.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Commitment</text><text x="343.5" y="270.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">to conventional</text><text x="343.5" y="291.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">goals</text><rect x="456" y="207" width="201" height="109" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="556.5" y="242.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Involvement</text><text x="556.5" y="270.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">in conventional</text><text x="556.5" y="291.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">activities</text><rect x="669" y="207" width="201" height="109" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="769.5" y="242.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Belief</text><text x="769.5" y="270.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">in the rules</text><line x1="215" y1="384" x2="685" y2="384" stroke="#1e2a44" stroke-width="7" stroke-linecap="round"/><path d="M450,384 L420,476 L480,476 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><circle cx="450" cy="384" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="215" y1="384" x2="160" y2="439" stroke="#1e2a44" stroke-width="2.5"/><line x1="215" y1="384" x2="270" y2="439" stroke="#1e2a44" stroke-width="2.5"/><path d="M140,439 L290,439 Q275,466 215,466 Q155,466 140,439 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><line x1="685" y1="384" x2="630" y2="439" stroke="#1e2a44" stroke-width="2.5"/><line x1="685" y1="384" x2="740" y2="439" stroke="#1e2a44" stroke-width="2.5"/><path d="M610,439 L760,439 Q745,466 685,466 Q625,466 610,439 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="215" y="488" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">INFORMAL</text><text x="685" y="488" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">FORMAL</text><rect x="30" y="512" width="405" height="210" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="548" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Informal is more effective</text><text x="50" y="577.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="577.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Constant: people care what family and</text><text x="66.15" y="599.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">friends think</text><text x="50" y="626.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="626.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Internalised: well-socialised people</text><text x="66.15" y="648.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">control themselves</text><rect x="465" y="512" width="405" height="210" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="485" y="548" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Formal is needed</text><text x="485" y="577.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="577.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Some people are not reached by informal</text><text x="501.15" y="599.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">control</text><text x="485" y="626.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="626.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Serious crime needs arrest and</text><text x="501.15" y="648.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">imprisonment</text><text x="485" y="675.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="675.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Surveillance: Foucault, people who may</text><text x="501.15" y="697.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">be watched discipline themselves</text><rect x="30" y="740" width="840" height="134" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="776" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Limits of both</text><text x="50" y="805.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Many crimes are never detected; peers and media can encourage deviance; Marxists say formal</text><text x="50" y="827.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">control targets the working class; Heidensohn says women are more tightly controlled</text><text x="50" y="849.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">informally.</text>
</svg>