<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="560" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four directions of semantic change</text>

<rect x="40" y="115" width="400" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="64" y="153" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Broadening</text><text x="64" y="177" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">meaning widens</text><text x="64" y="235" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">"holiday"</text><text x="64" y="267" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">once: a holy day</text><text x="64" y="291" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">now: any day off</text><circle cx="290" cy="240" r="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><line x1="308" y1="240" x2="342" y2="240" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><circle cx="380" cy="240" r="36" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><rect x="460" y="115" width="400" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="484" y="153" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Narrowing</text><text x="484" y="177" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">meaning becomes more specific</text><text x="484" y="235" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">"meat"</text><text x="484" y="267" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">once: food in general</text><circle cx="720" cy="240" r="36" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><line x1="758" y1="240" x2="792" y2="240" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><circle cx="810" cy="240" r="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><rect x="40" y="335" width="400" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="64" y="373" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Amelioration</text><text x="64" y="397" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">meaning becomes more positive</text><text x="64" y="455" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">"nice"</text><text x="64" y="487" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">once: foolish</text><line x1="340" y1="510" x2="340" y2="420" stroke="#2e6b62" stroke-width="7" marker-end="url(#ahT)"/><rect x="460" y="335" width="400" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="484" y="373" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Pejoration</text><text x="484" y="397" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">meaning becomes more negative</text><text x="484" y="455" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">"villain"</text><text x="484" y="487" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">once: a farm labourer</text><line x1="760" y1="420" x2="760" y2="510" stroke="#b5602e" stroke-width="7" marker-end="url(#ahR)"/>
</svg>