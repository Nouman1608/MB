er-end="url(#ah)"/><rect x="536" y="363" width="324" height="50" rx="9" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="698" y="395" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">edit</text><rect x="40" y="425" width="190" height="50" rx="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="135" y="457" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Borrowing</text><rect x="250" y="425" width="230" height="50" rx="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="365" y="456" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">other languages</text><line x1="484" y1="450" x2="530" y2="450" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="536" y="425" width="324" height="50" rx="9" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="698" y="457" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">bungalow, tsunami, algebra</text><rect x="40" y="487" width="190" height="50" rx="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="135" y="519" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Telescoping</text><rect x="250" y="487" width="230" height="50" rx="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="365" y="518" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">God be with you</text><line x1="484" y1="512" x2="530" y2="512" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="536" y="487" width="324" height="50" rx="9" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="698" y="519" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">goodbye</text><rect x="40" y="549" width="190" height="50" rx="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="135" y="581" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Coalescence</text><rect x="250" y="549" width="230" height="50" rx="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="365" y="580" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">to-day, any one</text><line x1="484" y1="574" x2="530" y2="574" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="536" y="549" width="324" height="50" rx="9" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="698" y="581" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">today, anyone</text><rect x="40" y="611" width="190" height="50" rx="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="135" y="643" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Acronym</text><rect x="250" y="611" width="230" height="50" rx="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="365" y="633" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">initial letters said</text><text x="365" y="653" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">as a word</text><line x1="484" y1="636" x2="530" y2="636" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="536" y="611" width="324" height="50" rx="9" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="698" y="643" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">scuba, laser</text><text x="450" y="701" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Also: etymology (a word's origin and history) and inflection (endings English has largely lost).</text>
