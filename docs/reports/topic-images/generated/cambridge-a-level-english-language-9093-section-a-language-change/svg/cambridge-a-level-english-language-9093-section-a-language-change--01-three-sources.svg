<rect width="900" height="610" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Paper 3 Section A: three sources, one essay</text>

<rect x="40" y="115" width="260" height="200" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="170" y="152" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Prose text</text><text x="170" y="190" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">about 300-400 words</text><text x="170" y="212" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">any time from Early</text><text x="170" y="234" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Modern English (c.1500)</text><text x="170" y="256" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">to the present</text><line x1="170" y1="317" x2="450" y2="368" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="320" y="115" width="260" height="200" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="152" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">N-gram graph</text><text x="450" y="190" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">how often a word or</text><text x="450" y="212" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">phrase appears in</text><text x="450" y="234" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">printed texts, year</text><text x="450" y="256" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">by year</text><line x1="450" y1="317" x2="450" y2="368" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="600" y="115" width="260" height="200" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="730" y="152" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Corpus word table</text><text x="730" y="190" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">collocates or synonym</text><text x="730" y="212" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">lists drawn from a</text><text x="730" y="234" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">corpus</text><line x1="730" y1="317" x2="450" y2="368" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="220" y="372" width="460" height="90" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="450" y="408" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">One essay that synthesises all three</text><text x="450" y="438" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">how the text exemplifies ways English has changed</text><rect x="40" y="485" width="820" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="64" y="520" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Section A of Paper 3: compulsory, 25 marks, half the paper</text><text x="64" y="552" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">AO2 writing effectively · AO4 issues, concepts, approaches · AO5 analysing and synthesising data</text><text x="836" y="520" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">no dictionaries</text>
</svg>