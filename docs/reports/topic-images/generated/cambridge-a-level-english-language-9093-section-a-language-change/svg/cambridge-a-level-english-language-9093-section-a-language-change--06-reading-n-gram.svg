<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 615" width="900" height="615" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="615" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading an n-gram graph</text>

<rect x="40" y="112" width="520" height="434" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="90" y1="455" x2="520" y2="455" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="90" y1="455" x2="90" y2="135" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="305" y="489" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">time (years)</text><text x="0" y="0" font-size="15" fill="#4a5568" text-anchor="middle" transform="translate(72 295) rotate(-90)">relative frequency</text><path d="M100,195 C240,205 310,355 490,405" fill="none" stroke="#b5602e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><path d="M100,405 C240,395 310,225 490,185" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><circle cx="295" cy="297" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><line x1="302" y1="305" x2="408" y2="425" stroke="#1e2a44" stroke-width="1.5" stroke-dasharray="4 4"/><text x="412" y="441" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">crossover</text><text x="120" y="180" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">older form</text><text x="390" y="175" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">newer form</text><text x="300" y="532" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Illustrative shape only, no real data</text><rect x="580" y="112" width="280" height="84" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><circle cx="606" cy="153" r="15" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="606" y="158.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="630" y="138" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">State</text><text x="630" y="158" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">what is plotted and the time</text><text x="630" y="175" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">span</text><rect x="580" y="202" width="280" height="84" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><circle cx="606" cy="243" r="15" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="606" y="248.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="630" y="228" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Describe</text><text x="630" y="248" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">each trend: rise, fall,</text><text x="630" y="265" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">crossover, plateau</text><rect x="580" y="292" width="280" height="84" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><circle cx="606" cy="333" r="15" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="606" y="338.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="630" y="318" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Date</text><text x="630" y="338" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">approximate dates,</text><text x="630" y="355" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">comparative language</text><rect x="580" y="382" width="280" height="84" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><circle cx="606" cy="423" r="15" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="606" y="428.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="630" y="408" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Interpret</text><text x="630" y="428" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">link to a process and a</text><text x="630" y="445" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">theory</text><rect x="580" y="472" width="280" height="84" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><circle cx="606" cy="513" r="15" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="606" y="518.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="630" y="498" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Qualify</text><text x="630" y="518" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">printed texts only; long s</text><text x="630" y="535" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">misread as "f"; frequency is</text><text x="630" y="552" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">not meaning</text><text x="450" y="590" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Comparisons to look for: variant spellings, synonyms, parts of speech, inflections ("hath" against "has"), collocations</text>
</svg>