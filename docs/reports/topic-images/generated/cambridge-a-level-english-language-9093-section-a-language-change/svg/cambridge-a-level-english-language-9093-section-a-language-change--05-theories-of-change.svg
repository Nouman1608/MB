<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 715" width="900" height="715" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="715" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Theories of change</text>

<text x="240" y="130" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Why did it change?</text><rect x="40" y="145" width="400" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="173" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Random fluctuation</text><text x="60" y="195" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">no single cause; forms drift like fashions</text><rect x="40" y="233" width="400" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="261" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Cultural transmission</text><text x="60" y="283" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">passed on by social learning, so each</text><text x="60" y="301" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">generation can alter it</text><rect x="40" y="321" width="400" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="349" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Lexical gaps</text><text x="60" y="371" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">new words fill gaps where a concept has no</text><text x="60" y="389" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">name</text><rect x="40" y="409" width="400" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="437" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Substratum</text><text x="60" y="459" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">features of an earlier language persist after</text><text x="60" y="477" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">a shift</text><rect x="40" y="497" width="400" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="525" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Functional</text><text x="60" y="547" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">language changes to meet users' communicative</text><text x="60" y="565" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">needs</text><text x="660" y="130" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">How do languages relate?</text><rect x="460" y="145" width="400" height="210" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="484" y="175" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Tree model</text><text x="484" y="197" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">August Schleicher</text><path d="M760,175 L760,215 M760,215 L700,260 M760,215 L820,260 M700,260 L670,305 M700,260 L730,305" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><circle cx="760" cy="175" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="700" cy="260" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="820" cy="260" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="670" cy="305" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="730" cy="305" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="484" y="240" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">branches descend</text><text x="484" y="259" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">from common</text><text x="484" y="278" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">ancestors</text><rect x="460" y="370" width="400" height="215" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="484" y="400" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Wave model</text><text x="484" y="422" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Johannes Schmidt</text><circle cx="760" cy="478" r="24" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray=""/><circle cx="760" cy="478" r="48" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray="6 5"/><circle cx="760" cy="478" r="72" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray="6 5"/><circle cx="760" cy="478" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="484" y="465" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">changes ripple out</text><text x="484" y="484" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">from a centre across</text><text x="484" y="503" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">neighbouring varieties</text><rect x="40" y="600" width="820" height="92" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="64" y="634" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Attitudes: prescriptivism treats change as decline; descriptivism records it.</text><text x="64" y="666" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Aitchison's "crumbling castle" names a prescriptive fear that she challenges.</text>
</svg>