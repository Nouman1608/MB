<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="680" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Synthesising the three sources</text>

<rect x="40" y="112" width="820" height="95" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="64" y="145" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"Sir, I have receiv'd your Letter, and do most heartily thank you for the Care you shew'd my Son.</text><text x="64" y="167" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">He hath been sicke these three Daies, yet the Physick worketh well, and I doubt not he shall be</text><text x="64" y="189" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">recover'd ere Sunday."</text><text x="160" y="240" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">Prose text</text><text x="470" y="240" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">Data</text><text x="745" y="240" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Concept</text><text x="40" y="275" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Orthography</text><rect x="40" y="287" width="240" height="86" rx="9" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="56" y="325" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"shew'd", "sicke",</text><text x="56" y="345" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"Daies"</text><rect x="300" y="287" width="340" height="86" rx="9" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="316" y="325" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">n-gram: "shew" falls, "show" rises;</text><text x="316" y="345" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">crossover in the 18th century</text><rect x="660" y="287" width="200" height="86" rx="9" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="674" y="325" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">cultural transmission,</text><text x="674" y="345" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">not random fluctuation</text><text x="290" y="337" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><text x="650" y="337" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><text x="40" y="403" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Grammar</text><rect x="40" y="415" width="240" height="86" rx="9" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="56" y="453" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"hath", "worketh"; "I</text><text x="56" y="473" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">doubt not"</text><rect x="300" y="415" width="340" height="86" rx="9" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="316" y="453" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">the "-eth" inflection later replaced</text><text x="316" y="473" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">by "-s"; negation without "do"</text><rect x="660" y="415" width="200" height="86" rx="9" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="674" y="453" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">the syntax now sounds</text><text x="674" y="473" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">archaic</text><text x="290" y="465" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><text x="650" y="465" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><text x="40" y="531" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Lexis</text><rect x="40" y="543" width="240" height="86" rx="9" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="56" y="591" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"Physick" = medicine</text><rect x="300" y="543" width="340" height="86" rx="9" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="316" y="571" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">word table: old collocates of</text><text x="316" y="591" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">"physic" now cluster around</text><text x="316" y="611" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">"medicine"</text><rect x="660" y="543" width="200" height="86" rx="9" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="674" y="571" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">one word replaces</text><text x="674" y="591" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">another in the same</text><text x="674" y="611" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">semantic space</text><text x="290" y="593" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><text x="650" y="593" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><text x="450" y="655" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Each paragraph combines text, data and a concept. The data here are invented for the example.</text>
</svg>