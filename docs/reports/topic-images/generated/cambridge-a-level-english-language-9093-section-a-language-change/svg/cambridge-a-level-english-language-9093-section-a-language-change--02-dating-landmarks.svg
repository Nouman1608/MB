<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="900" height="630" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="630" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three landmarks for dating a text</text>

<line x1="60" y1="300" x2="850" y2="300" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><circle cx="110" cy="300" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><line x1="110" y1="250" x2="110" y2="289" stroke="#1e2a44" stroke-width="2"/><rect x="15" y="130" width="190" height="132" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="110" y="160" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">c.1500</text><text x="110" y="186" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Early Modern English</text><text x="110" y="210" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">period begins</text><circle cx="290" cy="300" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><line x1="290" y1="311" x2="290" y2="330" stroke="#1e2a44" stroke-width="2"/><rect x="195" y="330" width="190" height="132" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="290" y="360" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">late 1400s on</text><text x="290" y="386" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Printing spreads</text><text x="290" y="410" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">more fixed spellings</text><circle cx="500" cy="300" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><line x1="500" y1="250" x2="500" y2="289" stroke="#1e2a44" stroke-width="2"/><rect x="405" y="130" width="190" height="132" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="500" y="160" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">1755</text><text x="500" y="186" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Johnson's Dictionary</text><text x="500" y="210" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">reference for</text><text x="500" y="228" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">spelling, meaning</text><circle cx="700" cy="300" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><line x1="700" y1="311" x2="700" y2="330" stroke="#1e2a44" stroke-width="2"/><rect x="605" y="330" width="190" height="132" rx="10" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5"/><text x="700" y="360" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">1762</text><text x="700" y="386" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Lowth's grammar</text><text x="700" y="410" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">prescriptive rules,</text><text x="700" y="428" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">e.g. against multiple</text><text x="700" y="446" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">negation</text><text x="845" y="285" font-size="16" font-weight="700" fill="#4a5568" text-anchor="end">today</text><rect x="40" y="485" width="400" height="120" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="64" y="518" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Probably early</text><text x="64" y="548" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">variable spelling ("musick", "shew")</text><text x="64" y="570" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and "-eth" endings (hath, doth)</text><rect x="460" y="485" width="400" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="484" y="518" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Perhaps 18th or 19th century</text><text x="484" y="548" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">standardised spelling, but very formal</text><text x="484" y="570" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">syntax and politeness formulas</text>
</svg>