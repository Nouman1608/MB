<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 679" width="900" height="679" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="679" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four stages of research design</text>

<rect x="30" y="108" width="187.5" height="130" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="123.75" y="140.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1. Aims and</text><text x="123.75" y="164.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">hypotheses</text><text x="123.75" y="194.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Open aim, or a</text><text x="123.75" y="215.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">testable hypothesis</text><line x1="221.5" y1="173" x2="243.5" y2="173" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="247.5" y="108" width="187.5" height="130" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="341.25" y="152.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2. Pilot study</text><text x="341.25" y="182.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Small trial run</text><text x="341.25" y="203.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">first</text><line x1="439" y1="173" x2="461" y2="173" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="465" y="108" width="187.5" height="130" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="558.75" y="152.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3. Sampling</text><text x="558.75" y="182.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Sampling frame, then</text><text x="558.75" y="203.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">a method</text><line x1="656.5" y1="173" x2="678.5" y2="173" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="682.5" y="108" width="187.5" height="130" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="776.25" y="140.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4. Analysis of</text><text x="776.25" y="164.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">data</text><text x="776.25" y="194.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Count it, or sort it</text><text x="776.25" y="215.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">into themes</text><text x="450" y="288" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Aim or hypothesis?</text><rect x="30" y="306" width="412" height="222" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,356 L31.25,320.25 Q31.25,307.25 44.25,307.25 L427.75,307.25 Q440.75,307.25 440.75,320.25 L440.75,356 Z" fill="#dce9e7"/><line x1="31.25" y1="356" x2="440.75" y2="356" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="337" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Aim</text><text x="44" y="388.15" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">A general statement of what you want to</text><text x="44" y="410.15" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">find out</text><text x="44" y="438.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“To investigate how couples divide</text><text x="44" y="460.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">housework.” Qualitative research often starts</text><text x="44" y="482.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">with an open aim, so as not to decide the</text><text x="44" y="504.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">answer in advance.</text><rect x="458" y="306" width="412" height="222" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,356 L459.25,320.25 Q459.25,307.25 472.25,307.25 L855.75,307.25 Q868.75,307.25 868.75,320.25 L868.75,356 Z" fill="#f2e7b8"/><line x1="459.25" y1="356" x2="868.75" y2="356" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="337" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Hypothesis</text><text x="472" y="388.15" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">Narrower and testable</text><text x="472" y="416.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“Dual-career couples share housework more</text><text x="472" y="438.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">equally than couples with one earner.”</text><text x="472" y="460.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Quantitative research usually tests a</text><text x="472" y="482.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">hypothesis.</text><rect x="30" y="544" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="580" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">What a pilot study shows</text><text x="56" y="609" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Whether questions are confusing, whether the method takes too long, and whether people will</text><text x="56" y="631" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">take part.</text>
</svg>