<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 597" width="900" height="597" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="597" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Ethical issues and how to address them</text>

<rect x="30" y="108" width="269.3333333333333" height="295" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,158 L31.25,122.25 Q31.25,109.25 44.25,109.25 L285.0833333333333,109.25 Q298.0833333333333,109.25 298.0833333333333,122.25 L298.0833333333333,158 Z" fill="#b5d3cf"/><line x1="31.25" y1="158" x2="298.0833333333333" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="138.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Consent</text><text x="44" y="189.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Agree to take part, knowing</text><text x="44" y="210.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">what it involves (informed</text><text x="44" y="231.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">consent)</text><circle cx="49" cy="252.92" r="4.5" fill="#2e6b62"/><text x="62" y="258.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Explain aims; information</text><text x="62" y="279.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sheets</text><circle cx="49" cy="302.92" r="4.5" fill="#2e6b62"/><text x="62" y="308.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Written consent; parental</text><text x="62" y="329.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">consent for children</text><circle cx="49" cy="352.92" r="4.5" fill="#2e6b62"/><text x="62" y="358.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Tell people they can</text><text x="62" y="379.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">withdraw</text><rect x="315.3333333333333" y="108" width="269.3333333333333" height="295" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,158 L316.5833333333333,122.25 Q316.5833333333333,109.25 329.5833333333333,109.25 L570.4166666666666,109.25 Q583.4166666666666,109.25 583.4166666666666,122.25 L583.4166666666666,158 Z" fill="#dce9e7"/><line x1="316.5833333333333" y1="158" x2="583.4166666666666" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="138.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Confidentiality</text><text x="329.3333333333333" y="189.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Identities and information</text><text x="329.3333333333333" y="210.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">kept private</text><circle cx="334.3333333333333" cy="231.92" r="4.5" fill="#2e6b62"/><text x="347.3333333333333" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Anonymise names and places</text><circle cx="334.3333333333333" cy="260.92" r="4.5" fill="#2e6b62"/><text x="347.3333333333333" y="266.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Store data securely under</text><text x="347.3333333333333" y="287.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">data protection law</text><circle cx="334.3333333333333" cy="310.92" r="4.5" fill="#2e6b62"/><text x="347.3333333333333" y="316.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Report so no one can be</text><text x="347.3333333333333" y="337.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">identified</text><rect x="600.6666666666666" y="108" width="269.3333333333333" height="295" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,158 L601.9166666666666,122.25 Q601.9166666666666,109.25 614.9166666666666,109.25 L855.75,109.25 Q868.75,109.25 868.75,122.25 L868.75,158 Z" fill="#f2e7b8"/><line x1="601.9166666666666" y1="158" x2="868.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="138.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Harm</text><text x="614.6666666666666" y="189.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">No physical, emotional or</text><text x="614.6666666666666" y="210.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">social damage</text><circle cx="619.6666666666666" cy="231.92" r="4.5" fill="#2e6b62"/><text x="632.6666666666666" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Avoid distressing questions</text><circle cx="619.6666666666666" cy="260.92" r="4.5" fill="#2e6b62"/><text x="632.6666666666666" y="266.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Allow people to stop</text><circle cx="619.6666666666666" cy="289.92" r="4.5" fill="#2e6b62"/><text x="632.6666666666666" y="295.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Offer support contacts;</text><text x="632.6666666666666" y="316.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">debrief</text><rect x="30" y="423" width="840" height="150" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="457" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">The classic dilemma: covert observation</text><rect x="50" y="475" width="385" height="82" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="66" y="499.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">For:</tspan> may give the most valid picture of a</text><text x="66" y="520.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">deviant group; justified if no other method</text><text x="66" y="541.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reaches it and identities are protected</text><rect x="465" y="475" width="385" height="82" rx="12" fill="#f3d9c9" stroke="#c9d6d4" stroke-width="2"/><text x="481" y="510.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Against:</tspan> it breaks informed consent; some</text><text x="481" y="531.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">say deception is never acceptable</text>
</svg>