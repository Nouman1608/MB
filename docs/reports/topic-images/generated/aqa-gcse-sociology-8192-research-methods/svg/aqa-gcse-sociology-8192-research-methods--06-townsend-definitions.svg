<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 689" width="900" height="689" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="689" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How definitions change the numbers</text>

<text x="450" y="92" font-size="19" font-weight="400" fill="#4a5568" text-anchor="middle">Population in poverty, 1968–69, on three measures</text><line x1="140" y1="470" x2="820" y2="470" stroke="#1e2a44" stroke-width="3"/><rect x="170" y="392" width="160" height="78" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="250" y="378" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">just over 6%</text><text x="250" y="500" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">State standard</text><rect x="400" y="353" width="160" height="117" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="480" y="339" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">a little over 9%</text><text x="480" y="500" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Relative income</text><rect x="630" y="184" width="160" height="286" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="710" y="170" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">more than 22%</text><text x="710" y="500" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Relative deprivation</text><text x="710" y="526" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">(Townsend’s own measure)</text><rect x="30" y="554" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="590" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">One society, three figures</text><text x="56" y="619" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The definition decides the number. Official statistics use definitions set by government,</text><text x="56" y="641" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">which can change; check how any statistic was defined.</text>
</svg>