stroke="#1e2a44" stroke-width="1.8"/><circle cx="208" cy="282" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="254" cy="282" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="300" cy="282" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="346" cy="282" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="392" cy="282" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="70" cy="328" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="116" cy="328" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="162" cy="328" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="208" cy="328" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="254" cy="328" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="300" cy="328" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="346" cy="328" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="392" cy="328" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><text x="54" y="408" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">+</text><text x="74" y="408" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Every member has an equal chance of</text><text x="74" y="429" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">selection (e.g. names drawn by computer)</text><text x="54" y="458" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">−</text><text x="74" y="458" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A small random sample can still be</text><text x="74" y="479" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">unrepresentative by chance</text><rect x="458" y="108" width="412" height="410" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,158 L459.25,122.25 Q459.25,109.25 472.25,109.25 L855.75,109.25 Q868.75,109.25 868.75,122.25 L868.75,158 Z" fill="#b5d3cf"/><line x1="459.25" y1="158" x2="868.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="138.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Systematic</text><circle cx="498" cy="190" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="544" cy="190" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="590" cy="190" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="636" cy="190" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="682" cy="190" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="728" cy="190" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="774" cy="190" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="820" cy="190" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="498" cy="236" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="544" cy="236" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="590" cy="236" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="636" cy="236" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="682" cy="236" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="728" cy="236" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="774" cy="236" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="820" cy="236" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="498" cy="282" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="544" cy="282" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="590" cy="282" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="636" cy="282" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="682" cy="282" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="728" cy="282" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="774" cy="282" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="820" cy="282" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="498" cy="328" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="544" cy="328" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="590" cy="328" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="636" cy="328" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="682" cy="328" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="728" cy="328" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="774" cy="328" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="820" cy="328" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="664" y="370" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">every nth name on the list (here every 4th)</text><text x="482" y="408" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">+</text><text x="502" y="408" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Quick: for 100 from a roll of 1,200, take</text><text x="502" y="429" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">every 12th name</text><text x="482" y="458" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">−</text><text x="502" y="458" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A list ordered in a pattern can create bias</text><rect x="30" y="536" width="412" height="410" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,586 L31.25,550.25 Q31.25,537.25 44.25,537.25 L427.75,537.25 Q440.75,537.25 440.75,550.25 L440.75,586 Z" fill="#b5d3cf"/><line x1="31.25" y1="586" x2="440.75" y2="586" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="566.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Quota</text><circle cx="70" cy="618" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="116" cy="618" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="162" cy="618" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="208" cy="618" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="270" cy="618" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="316" cy="618" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="362" cy="618" r="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.8"/><circle cx="408" cy="618" r="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.8"/><circle cx="70" cy="664" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="116" cy="664" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="162" cy="664" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="208" cy="664" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="270" cy="664" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="316" cy="664" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="362" cy="664" r="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.8"/><circle cx="408" cy="664" r="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.8"/><circle cx="70" cy="710" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="116" cy="710" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="162" cy="710" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="208" cy="710" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="270" cy="710" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="316" cy="710" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="362" cy="710" r="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.8"/><circle cx="408" cy="710" r="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.8"/><circle cx="70" cy="756" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="116" cy="756" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="162" cy="756" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="208" cy="756" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="270" cy="756" r="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.8"/><circle cx="316" cy="756" r="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.8"/><circle cx="362" cy="756" r="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.8"/><circle cx="408" cy="756" r="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.8"/><text x="139" y="798" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">52% women: 78</text><text x="339" y="798" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">48% men: 72</text><text x="54" y="836" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">+</text><text x="74" y="836" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fill set numbers for each group to match the</text><text x="74" y="857" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">population; no sampling frame needed</text><text x="54" y="886" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">−</text><text x="74" y="886" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The researcher chooses who fills each quota,</text><text x="74" y="907" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">which can bring in bias</text><rect x="458" y="536" width="412" height="410" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,586 L459.25,550.25 Q459.25,537.25 472.25,537.25 L855.75,537.25 Q868.75,537.25 868.75,550.25 L868.75,586 Z" fill="#b5d3cf"/><line x1="459.25" y1="586" x2="868.75" y2="586" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="566.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Snowball</text><line x1="559.8719762560712" y1="663.4199851600446" x2="614.4320271359186" y2="697.5200169599491" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="640.5219806739988" y1="699.7390096630006" x2="693.6891649440014" y2="673.1554175279994" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="626.2635137157511" y1="719.8918902739913" x2="619.9845557534273" y2="770.1235539725814" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="719.2" y1="674.4" x2="775.2" y2="716.4" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="776.1280237439288" y1="733.4199851600446" x2="721.5679728640814" y2="767.5200169599491" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="721.9587627970221" y1="664.9262490156137" x2="822.0471282319747" y2="657.2271439821558" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><circle cx="548" cy="656" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="628" cy="706" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="708" cy="666" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="788" cy="726" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="708" cy="776" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="618" cy="786" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><circle cx="838" cy="656" r="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.8"/><text x="548" y="638" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">first contact</text><text x="482" y="836" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">+</text><text x="502" y="836" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">One participant introduces the next; reaches</text><text x="502" y="857" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">hidden groups</text><text x="482" y="886" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">−</text><text x="502" y="886" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Contacts tend to be similar, so the sample</text><text x="502" y="907" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">is rarely representative</text>
</svg>