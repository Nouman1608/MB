<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 734" width="900" height="734" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="734" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Sorting sources of data</text>

<rect x="210" y="108" width="322" height="70" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="371" y="138" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Quantitative data</text><text x="371" y="162" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">numbers: patterns and trends</text><rect x="548" y="108" width="322" height="70" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="709" y="138" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Qualitative data</text><text x="709" y="162" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">words: depth and meaning</text><rect x="30" y="194" width="170" height="176" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="115" y="264" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Primary</text><text x="115" y="292" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">collected</text><text x="115" y="312" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">first-hand by the</text><text x="115" y="332" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">researcher</text><rect x="30" y="386" width="170" height="176" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="115" y="456" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Secondary</text><text x="115" y="484" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">already exists,</text><text x="115" y="504" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">made by someone</text><text x="115" y="524" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">else</text><rect x="210" y="194" width="322" height="176" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="233" cy="224.39" r="4.5" fill="#2e6b62"/><text x="246" y="230" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Your own questionnaire with</text><text x="246" y="252" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">closed questions</text><circle cx="233" cy="276.39" r="4.5" fill="#2e6b62"/><text x="246" y="282" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Your own structured interviews</text><rect x="548" y="194" width="322" height="176" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="571" cy="224.39" r="4.5" fill="#2e6b62"/><text x="584" y="230" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Your own unstructured</text><text x="584" y="252" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">interviews</text><circle cx="571" cy="276.39" r="4.5" fill="#2e6b62"/><text x="584" y="282" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Your own observations</text><rect x="210" y="386" width="322" height="176" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="233" cy="416.39" r="4.5" fill="#2e6b62"/><text x="246" y="422" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Official statistics (e.g.</text><text x="246" y="444" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">census, exam results, recorded</text><text x="246" y="466" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">crime)</text><circle cx="233" cy="490.39" r="4.5" fill="#2e6b62"/><text x="246" y="496" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Non-official statistics</text><text x="246" y="518" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">(charities, universities,</text><text x="246" y="540" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">businesses)</text><rect x="548" y="386" width="322" height="176" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="571" cy="416.39" r="4.5" fill="#2e6b62"/><text x="584" y="422" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Diaries and letters</text><circle cx="571" cy="446.39" r="4.5" fill="#2e6b62"/><text x="584" y="452" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Media content and websites</text><circle cx="571" cy="476.39" r="4.5" fill="#2e6b62"/><text x="584" y="482" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Earlier studies</text><rect x="30" y="582" width="412" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,632 L31.25,596.25 Q31.25,583.25 44.25,583.25 L427.75,583.25 Q440.75,583.25 440.75,596.25 L440.75,632 Z" fill="#d4b02e"/><line x1="31.25" y1="632" x2="440.75" y2="632" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="612.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Primary data</text><text x="44" y="664.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Fit the aim exactly, but cost time and money.</text><rect x="458" y="582" width="412" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,632 L459.25,596.25 Q459.25,583.25 472.25,583.25 L855.75,583.25 Q868.75,583.25 868.75,596.25 L868.75,632 Z" fill="#dce9e7"/><line x1="459.25" y1="632" x2="868.75" y2="632" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="612.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Secondary data</text><text x="472" y="664.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Quick and cheap, and may cover the past or a</text><text x="472" y="686.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">whole country, but made for another purpose.</text>
</svg>