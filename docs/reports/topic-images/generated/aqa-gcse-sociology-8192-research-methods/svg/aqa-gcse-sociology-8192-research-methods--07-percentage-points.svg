<rect width="900" height="663" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Percentage points or per cent?</text>

<text x="450" y="92" font-size="18" font-weight="400" fill="#4a5568" text-anchor="middle">Fictional town of Dunmarsh: couples who said they shared housework equally</text><rect x="150" y="278" width="150" height="182" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="225" y="312" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">28%</text><text x="225" y="490" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">2005</text><rect x="400" y="187" width="150" height="273" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="475" y="221" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">42%</text><text x="475" y="490" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">2025</text><line x1="100" y1="460" x2="600" y2="460" stroke="#1e2a44" stroke-width="3"/><line x1="300" y1="278" x2="580" y2="278" stroke="#b5602e" stroke-width="2" stroke-dasharray="7 5"/><path d="M568,187 h12 v91 h-12" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="590" y="238.5" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">+14</text><rect x="640" y="150" width="230" height="130" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="755" y="186" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Percentage points</text><text x="755" y="222" font-size="20" font-weight="400" fill="#1e2a44" text-anchor="middle">42 − 28 = 14</text><text x="755" y="258" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">+14 points</text><rect x="640" y="300" width="230" height="130" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="755" y="336" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Percentage change</text><text x="755" y="372" font-size="20" font-weight="400" fill="#1e2a44" text-anchor="middle">14 ÷ 28 × 100</text><text x="755" y="408" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="middle">+50%</text><rect x="30" y="520" width="840" height="119" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="556" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Wrong: “It rose by 14%”</text><circle cx="61" cy="579.39" r="4.5" fill="#8a6d0d"/><text x="74" y="585" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Then evaluate: “said they shared” is self-reported</text><circle cx="61" cy="609.39" r="4.5" fill="#8a6d0d"/><text x="74" y="615" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Two years of data cannot show what happened in between</text>
</svg>