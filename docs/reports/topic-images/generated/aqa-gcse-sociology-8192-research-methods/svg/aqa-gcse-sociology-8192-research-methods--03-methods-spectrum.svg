<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 744" width="900" height="744" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="744" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From numbers to meanings</text>

<defs><linearGradient id="spec" x1="0" x2="1"><stop offset="0" stop-color="#b5d3cf"/><stop offset="1" stop-color="#f2e7b8"/></linearGradient></defs><rect x="30" y="176" width="840" height="56" rx="28" fill="url(#spec)" stroke="#1e2a44" stroke-width="2.5"/><text x="40" y="134" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">QUANTITATIVE: numbers</text><text x="860" y="134" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="end">QUALITATIVE: words, meanings</text><text x="40" y="160" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">more reliable, easy to compare</text><text x="860" y="160" font-size="17" font-weight="600" fill="#8a6d0d" text-anchor="end">more depth and validity</text><circle cx="129" cy="204" r="9" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><line x1="129" y1="234" x2="129" y2="262" stroke="#1e2a44" stroke-width="2.5"/><circle cx="343" cy="204" r="9" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><line x1="343" y1="234" x2="343" y2="262" stroke="#1e2a44" stroke-width="2.5"/><circle cx="557" cy="204" r="9" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><line x1="557" y1="234" x2="557" y2="262" stroke="#1e2a44" stroke-width="2.5"/><circle cx="771" cy="204" r="9" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><line x1="771" y1="234" x2="771" y2="262" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="264" width="198" height="287" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="42" y="292" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Questionnaire</text><text x="42" y="344" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">closed questions</text><text x="48" y="378" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">+</text><text x="68" y="378" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cheap and fast for</text><text x="68" y="399" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">large samples;</text><text x="68" y="420" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">anonymous</text><text x="48" y="449" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">−</text><text x="68" y="449" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Low response</text><text x="68" y="470" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rates; forces</text><text x="68" y="491" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">answers into set</text><text x="68" y="512" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">categories</text><rect x="244" y="264" width="198" height="287" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="256" y="292" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Structured</text><text x="256" y="316" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">interview</text><text x="256" y="344" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">set questions read aloud</text><text x="262" y="378" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">+</text><text x="282" y="378" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Good response</text><text x="282" y="399" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rates and</text><text x="282" y="420" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reliability</text><text x="262" y="449" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">−</text><text x="282" y="449" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Time-consuming;</text><text x="282" y="470" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">interviewer bias</text><rect x="458" y="264" width="198" height="287" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="470" y="292" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Unstructured</text><text x="470" y="316" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">interview</text><text x="470" y="344" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">a guided conversation</text><text x="476" y="378" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">+</text><text x="496" y="378" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Depth, validity,</text><text x="496" y="399" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rapport for</text><text x="496" y="420" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sensitive topics</text><text x="476" y="449" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">−</text><text x="496" y="449" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Hard to compare or</text><text x="496" y="470" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">repeat</text><rect x="672" y="264" width="198" height="287" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="684" y="292" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Participant</text><text x="684" y="316" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">observation</text><text x="684" y="344" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">joins the group</text><text x="690" y="378" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">+</text><text x="710" y="378" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sees what people</text><text x="710" y="399" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">do, not what they</text><text x="710" y="420" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">say</text><text x="690" y="449" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">−</text><text x="710" y="449" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">May change</text><text x="710" y="470" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">behaviour; low</text><text x="710" y="491" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reliability</text><rect x="30" y="571" width="840" height="149" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="607" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Mixed methods: use both</text><circle cx="61" cy="630.39" r="4.5" fill="#8a6d0d"/><text x="74" y="636" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A questionnaire to find how common something is, then interviews to find out why</text><circle cx="61" cy="660.39" r="4.5" fill="#8a6d0d"/><text x="74" y="666" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Useful:</tspan> numbers show the pattern, words explain it; allows triangulation</text><circle cx="61" cy="690.39" r="4.5" fill="#8a6d0d"/><text x="74" y="696" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Limits:</tspan> more time and money; results may clash; needs skills in both</text>
</svg>