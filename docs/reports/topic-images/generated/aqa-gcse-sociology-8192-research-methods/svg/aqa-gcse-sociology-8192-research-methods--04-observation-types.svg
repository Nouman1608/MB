<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 671" width="900" height="671" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="671" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four kinds of observation</text>

<rect x="210" y="108" width="322" height="44" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="371" y="137" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Participant: joins the group</text><rect x="548" y="108" width="322" height="44" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="709" y="137" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Non-participant: watches only</text><rect x="30" y="160" width="170" height="170" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="115" y="234" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Overt</text><text x="115" y="260" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">the group knows</text><rect x="30" y="346" width="170" height="170" rx="12" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2"/><text x="115" y="420" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Covert</text><text x="115" y="446" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">secret</text><rect x="210" y="160" width="322" height="170" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="228" y="194" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Joins openly</text><text x="234" y="228" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">+</text><text x="254" y="228" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Reaches groups that would not</text><text x="254" y="249" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fill in forms</text><text x="234" y="278" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">−</text><text x="254" y="278" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The observer may change the</text><text x="254" y="299" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">group’s behaviour</text><rect x="548" y="160" width="322" height="170" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="566" y="194" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Watches openly</text><text x="572" y="228" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">+</text><text x="592" y="228" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sees what people do, not what</text><text x="592" y="249" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">they say</text><text x="572" y="278" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">−</text><text x="592" y="278" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The observer may change the</text><text x="592" y="299" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">group’s behaviour</text><rect x="210" y="346" width="322" height="170" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="228" y="380" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Joins in secret</text><text x="234" y="414" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">+</text><text x="254" y="414" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">May give the most valid picture</text><text x="254" y="435" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">of a deviant group</text><text x="234" y="464" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">−</text><text x="254" y="464" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Breaks informed consent</text><rect x="548" y="346" width="322" height="170" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="566" y="380" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Watches in secret</text><text x="572" y="414" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">+</text><text x="592" y="414" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Behaviour is not changed by</text><text x="592" y="435" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">being watched</text><text x="572" y="464" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">−</text><text x="592" y="464" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Consent problems</text><rect x="30" y="536" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="572" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Ethnography</text><text x="56" y="601" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A detailed study of a group’s way of life, usually by participant observation over a long</text><text x="56" y="623" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">period, e.g. Ball’s three years at Beachside.</text>
</svg>