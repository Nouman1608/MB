<!-- place after: ## Embedding: weaving a quotation into your own sentence -->
<figure class="topic-figure">

<!-- place after: ## Signal verbs and what they tell the reader -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/ap-english-language-1-6-claim-evidence-paragraph-study-guide--04-signal-verbs.webp" width="900" height="582" alt="Five groups of signal verbs and what they suggest: states, notes and observes for a neutral report; urges and calls on for action; warns and cautions for a risk; concedes and admits for granting a point; insists and maintains for a strongly held claim. Notes warn against “proves” and “shows” when the source only suggests or opines." loading="lazy">
  <figcaption>“Says” is neutral; verbs like “urges” or “concedes” show the writer’s stance.</figcaption>
</figure>
