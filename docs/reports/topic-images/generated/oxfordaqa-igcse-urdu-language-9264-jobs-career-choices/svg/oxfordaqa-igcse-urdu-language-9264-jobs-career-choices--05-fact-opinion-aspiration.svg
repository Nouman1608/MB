<rect width="900" height="750" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading in layers</text>

<text x="450" y="128" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Give one advantage and one disadvantage of the aunt’s job, and state her ambition. [3]</text><rect x="30" y="150" width="840" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="184" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Fact</text><text x="846" y="200" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏میری خالہ ایک بینک میں کام کرتی ہیں‏</text><text x="846" y="236" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">she works in a bank</text><rect x="30" y="262" width="840" height="100" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="296" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">Advantage</text><text x="250" y="296" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">[1]</text><text x="846" y="312" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏اور ان کی تنخواہ اچھی ہے،‏</text><text x="846" y="348" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">the pay is good</text><rect x="30" y="374" width="840" height="100" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="408" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">Disadvantage</text><text x="250" y="408" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">[1]</text><text x="846" y="424" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏لیکن وہ کہتی ہیں کہ انہیں اپنا کام اکتا دینے والا لگتا ہے۔‏</text><text x="846" y="460" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">she finds the work boring</text><rect x="30" y="486" width="840" height="100" rx="12" fill="#f6ece4" stroke="#b5602e" stroke-width="2.5"/><text x="52" y="520" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">What she does now</text><text x="250" y="520" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">trap</text><text x="846" y="536" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏اس لیے وہ اب شام کو کھانا پکانے کی کلاسیں لیتی ہیں‏</text><text x="846" y="572" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">cooking classes: not the ambition</text><rect x="30" y="598" width="840" height="100" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="632" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Ambition</text><text x="250" y="632" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">[1]</text><text x="846" y="648" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏اور ایک دن اپنا ریستوران کھولنا چاہتی ہیں۔‏</text><text x="846" y="684" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">to open her own restaurant one day</text><text x="450" y="724" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">The connective at the start of each clause signals its job: but, so, and</text>
</svg>