<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 716" width="900" height="716" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="716" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Become, not make</text>

<rect x="30" y="110" width="410" height="150" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="180" font-family="Noto Nastaliq Urdu" font-size="40" font-weight="400" fill="#2e6b62" text-anchor="middle">‏بننا‏</text><text x="235" y="232" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">to become</text><rect x="460" y="110" width="410" height="150" rx="14" fill="#f6ece4" stroke="#b5602e" stroke-width="2.5"/><text x="665" y="180" font-family="Noto Nastaliq Urdu" font-size="40" font-weight="400" fill="#b5602e" text-anchor="middle">‏بنانا‏</text><text x="665" y="232" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">to make</text><rect x="30" y="280" width="840" height="260" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="316" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Ambition: become + want</text><circle cx="66" cy="368" r="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M59,368 l5,6 l10,-12" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="846" y="378" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="end">‏میں ڈاکٹر بننا چاہتا ہوں۔‏</text><text x="96" y="374" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">I want to become a doctor.</text><circle cx="66" cy="434" r="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M59,434 l5,6 l10,-12" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="846" y="444" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#1e2a44" text-anchor="end">‏میں صحافی بننا چاہتی ہوں۔‏</text><text x="96" y="440" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">I want to become a journalist (a girl).</text><circle cx="66" cy="500" r="15" fill="#f6ece4" stroke="#b5602e" stroke-width="2.5"/><path d="M60,494 l12,12 m0,-12 l-12,12" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="846" y="510" font-family="Noto Nastaliq Urdu" font-size="26" font-weight="400" fill="#b5602e" text-anchor="end">‏میں ڈاکٹر بنانا چاہتا ہوں‏</text><text x="96" y="506" font-size="17" font-weight="400" fill="#b5602e" text-anchor="start" font-style="italic">"I want to make a doctor"</text><rect x="30" y="560" width="840" height="130" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="594" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Then add a reason</text><text x="846" y="638" font-family="Noto Nastaliq Urdu" font-size="25" font-weight="400" fill="#1e2a44" text-anchor="end">‏میں نرس بننا چاہتی ہوں کیونکہ میں بیمار لوگوں کی مدد کرنا چاہتی ہوں۔‏</text><text x="846" y="674" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">I want to become a nurse because I want to help sick people.</text>
</svg>