t-size="16" font-weight="400" fill="#4a5568" text-anchor="start">involve</text><rect x="704" y="272" width="150" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="779" y="318" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏ڈاکٹر‏</text><text x="779" y="356" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">doctor</text><rect x="546" y="272" width="150" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="621" y="318" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏وکیل‏</text><text x="621" y="356" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">lawyer</text><rect x="388" y="272" width="150" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="463" y="318" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏صحافی‏</text><text x="463" y="356" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">journalist</text><rect x="30" y="402" width="840" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="438" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Career choices</text><text x="52" y="466" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">what matters to you, and</text><text x="52" y="486" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">qualities a job needs</text><rect x="704" y="418" width="150" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="779" y="464" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏تنخواہ‏</text><text x="779" y="502" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">salary, pay</text><rect x="546" y="418" width="150" height="100" rx="12" fill="#f