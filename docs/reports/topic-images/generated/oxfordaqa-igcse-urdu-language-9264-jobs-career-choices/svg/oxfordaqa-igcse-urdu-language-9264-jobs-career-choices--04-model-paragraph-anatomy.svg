r="start">Ambition + reason</text><text x="100" y="424" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">I want to become a journalist because ...</text><text x="846" y="416" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏... صحافی بننا چاہتا ہوں کیونکہ ...‏</text><rect x="30" y="462" width="840" height="90" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="507" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="514.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="100" y="500" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Priority (comparison)</text><text x="100" y="528" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">more important than a good salary is ...</text><text x="846" y="520" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏... سے زیادہ اہم یہ ہے کہ ... لگے‏</text><rect x="30" y="576" width="840" height="62" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="450" y="614" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">The ambition links back to the job (talking to people): the answer hangs together</text>
