<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="900" height="800" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="800" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Talking about work in four time frames</text>

<rect x="30" y="110" width="840" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="148" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Present routine</text><text x="846" y="198" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏ہفتے کے آخر میں میں اپنے چچا کی دکان پر کام کرتا ہوں۔‏</text><text x="846" y="234" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">At weekends I work in my uncle’s shop.</text><rect x="30" y="260" width="840" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="298" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">One past event</text><text x="52" y="324" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">transitive: takes the ergative</text><text x="846" y="348" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏پچھلی گرمیوں میں میں نے ایک دفتر میں کام کا تجربہ حاصل کیا۔‏</text><text x="846" y="384" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Last summer I did work experience in an office.</text><rect x="30" y="410" width="840" height="140" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="448" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Repeated past tasks</text><text x="52" y="474" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">habitual past: no ergative</text><text x="846" y="498" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏وہاں میں فون سنتی تھی۔‏</text><text x="846" y="534" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">I used to answer the phone there.</text><rect x="30" y="560" width="840" height="140" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="598" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Condition and hope</text><text x="846" y="648" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏اگر میں ڈاکٹر بن گیا تو اپنے گاؤں میں ایک کلینک کھولوں گا۔‏</text><text x="846" y="684" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">If I become a doctor, I will open a clinic in my village.</text><rect x="30" y="714" width="840" height="64" rx="12" fill="#f6ece4" stroke="#b5602e" stroke-width="2.5"/><circle cx="66" cy="746" r="15" fill="#f6ece4" stroke="#b5602e" stroke-width="2.5"/><path d="M60,740 l12,12 m0,-12 l-12,12" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="270" y="754" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#b5602e" text-anchor="middle">‏میں نے فون سنتی تھی‏</text><text x="400" y="750" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">is wrong: the habitual past takes no ergative</text>
</svg>