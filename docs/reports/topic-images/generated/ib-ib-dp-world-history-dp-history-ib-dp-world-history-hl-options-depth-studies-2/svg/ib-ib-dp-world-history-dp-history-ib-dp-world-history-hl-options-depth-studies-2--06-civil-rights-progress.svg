<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why progress came in the 1960s</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Weigh five factors behind the laws of 1964 and 1965</text>
<line x1="310" y1="163.5" x2="400" y2="243.3" stroke="#1e2a44" stroke-width="2.5"/><line x1="310" y1="267" x2="400" y2="274.35" stroke="#1e2a44" stroke-width="2.5"/><line x1="310" y1="381" x2="400" y2="308.55" stroke="#1e2a44" stroke-width="2.5"/><line x1="590" y1="220.5" x2="500" y2="260.4" stroke="#1e2a44" stroke-width="2.5"/><line x1="590" y1="321.5" x2="500" y2="290.7" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="277.5" r="100" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="250.86" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Civil Rights Act</text><text x="450" y="272.82" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1964</text><text x="450" y="294.78000000000003" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Voting Rights Act</text><text x="450" y="316.74" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1965</text><rect x="30" y="124" width="280" height="79" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Grassroots organization</text><text x="46" y="182.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and non-violent direct action</text><rect x="30" y="217" width="280" height="100" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="247.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Media coverage</text><text x="46" y="275.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">of violent responses</text><text x="46" y="296.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(Birmingham, Selma)</text><rect x="30" y="331" width="280" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="361.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Federal courts</text><text x="46" y="389.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Brown v. Board of Education</text><text x="46" y="410.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(1954)</text><rect x="590" y="183.5" width="280" height="74" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="606" y="213.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Presidents Kennedy and</text><text x="606" y="236.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Johnson</text><rect x="590" y="271.5" width="280" height="100" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="606" y="301.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The Cold War</text><text x="606" y="330.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Segregation an embarrassment</text><text x="606" y="351.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">abroad</text><rect x="30" y="453" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="487.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Beyond King</text><text x="50" y="517.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Include grassroots groups, courts and federal government; extend to the farm workers led by</text><text x="50" y="539.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">César Chávez and the American Indian Movement.</text>
</svg>