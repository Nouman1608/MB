<rect width="900" height="623" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why the Union won</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Weigh resources against leadership and Confederate weaknesses</text>
<line x1="320" y1="187" x2="410" y2="267.15" stroke="#1e2a44" stroke-width="2.5"/><line x1="320" y1="315.5" x2="410" y2="305.7" stroke="#1e2a44" stroke-width="2.5"/><line x1="320" y1="430" x2="410" y2="340.05" stroke="#1e2a44" stroke-width="2.5"/><line x1="580" y1="222" x2="490" y2="277.65" stroke="#1e2a44" stroke-width="2.5"/><line x1="580" y1="381" x2="490" y2="325.35" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="301.5" r="80" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="296.04" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Union</text><text x="450" y="321.66" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">victory</text><rect x="30" y="124" width="290" height="126" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RESOURCES</text><text x="46" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Population, industry,</text><text x="46" y="201.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">railways</text><text x="46" y="229.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Supported a long war</text><rect x="30" y="264" width="290" height="103" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="292" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RESOURCES</text><text x="46" y="318.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Naval blockade</text><text x="46" y="346.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Cut Southern trade</text><rect x="30" y="381" width="290" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="409" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONFEDERATE WEAKNESS</text><text x="46" y="435.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">States' rights against central</text><text x="46" y="458.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">direction</text><rect x="580" y="149.5" width="290" height="145" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="596" y="177.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LEADERSHIP</text><text x="596" y="203.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Lincoln and emancipation</text><text x="596" y="232.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Proclamation of 1 January 1863</text><text x="596" y="253.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">kept Britain and France out and</text><text x="596" y="274.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">added Black soldiers</text><rect x="580" y="308.5" width="290" height="145" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="596" y="336.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LEADERSHIP</text><text x="596" y="362.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Grant and Sherman</text><text x="596" y="391.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Sustained pressure after 1863:</text><text x="596" y="412.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Vicksburg and Gettysburg (July</text><text x="596" y="433.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">1863), Atlanta (1864)</text><rect x="200" y="501" width="500" height="90" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="536.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Lee's surrender at Appomattox</text><text x="450" y="566.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">9 April 1865</text>
</svg>