<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 813" width="900" height="813" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="813" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Mexican Revolution, 1910-1940</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Many questions run to 1940, not 1917 or 1920</text>
<line x1="160" y1="134" x2="160" y2="771" stroke="#1e2a44" stroke-width="4"/><rect x="194" y="124" width="676" height="69" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="207" y="151.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Díaz rules</text><text x="207" y="175.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Railways and foreign investment; land concentrated; opposition repressed</text><line x1="160" y1="158.5" x2="194" y2="158.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="160" cy="158.5" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="140" y="164.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1876-1911</text><rect x="194" y="202" width="676" height="69" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="207" y="229.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Plan of San Luis Potosí</text><text x="207" y="253.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Madero calls for revolt; Díaz resigns in May 1911</text><line x1="160" y1="236.5" x2="194" y2="236.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="160" cy="236.5" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="140" y="242.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">20 Nov 1910</text><rect x="194" y="280" width="676" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="207" y="307.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Madero</text><text x="207" y="331.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Political reform without land reform; Zapata's Plan of Ayala (November 1911) demands</text><text x="207" y="352.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">land restitution</text><line x1="160" y1="325" x2="194" y2="325" stroke="#1e2a44" stroke-width="2.5"/><circle cx="160" cy="325" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="140" y="331" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1911-13</text><rect x="194" y="379" width="676" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="207" y="406.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Huerta</text><text x="207" y="430.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Coup and murder of Madero; opposed by the Constitutionalists and Zapata; US</text><text x="207" y="451.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">occupation of Veracruz</text><line x1="160" y1="424" x2="194" y2="424" stroke="#1e2a44" stroke-width="2.5"/><circle cx="160" cy="424" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="140" y="430" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1913-14</text><rect x="194" y="478" width="676" height="69" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="207" y="505.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Civil war among revolutionaries</text><text x="207" y="529.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Obregón defeats Villa at Celaya (1915)</text><line x1="160" y1="512.5" x2="194" y2="512.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="160" cy="512.5" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="140" y="518.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1914-15</text><rect x="194" y="556" width="676" height="69" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="207" y="583.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The 1917 Constitution</text><text x="207" y="607.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Article 27 land and subsoil; Article 123 labour rights; Article 3 secular education</text><line x1="160" y1="590.5" x2="194" y2="590.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="160" cy="590.5" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="140" y="596.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1917</text><rect x="194" y="634" width="676" height="69" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="207" y="661.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Consolidation: Obregón and Calles</text><text x="207" y="685.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Cristero War (1926-29); PNR founded (1929), later the PRI</text><line x1="160" y1="668.5" x2="194" y2="668.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="160" cy="668.5" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="140" y="674.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1920-34</text><rect x="194" y="712" width="676" height="69" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="207" y="739.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Cárdenas</text><text x="207" y="763.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Land distributed through ejidos; oil expropriation, 18 March 1938</text><line x1="160" y1="746.5" x2="194" y2="746.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="160" cy="746.5" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="140" y="752.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1934-40</text>
</svg>