<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 601" width="900" height="601" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="601" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Judging "to what extent" aim by aim</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">"To what extent did the Mexican Revolution achieve its aims by 1940?"</text>
<rect x="30" y="124" width="600" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">End the Porfiriato's personal dictatorship</text><text x="46" y="182.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Political aim</text><rect x="650" y="124" width="220" height="96" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="760" y="179" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Achieved</text><line x1="632" y1="172" x2="646" y2="172" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="232" width="600" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="262.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Land reform, labour rights, national control of resources</text><text x="46" y="290.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Promises in 1917; policy only with Cárdenas (ejidos; oil, 1938)</text><rect x="650" y="232" width="220" height="96" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="760" y="287" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Achieved in part</text><line x1="632" y1="280" x2="646" y2="280" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="340" width="600" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="370.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Madero's effective suffrage</text><text x="46" y="398.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The party founded in 1929 governed without real electoral competition</text><rect x="650" y="340" width="220" height="96" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="760" y="395" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">Fell short</text><line x1="632" y1="388" x2="646" y2="388" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="458" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="492.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Overall judgement in the final sentence</text><text x="50" y="522.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Most social and nationalist aims achieved by 1940, but only by replacing one form of centralized</text><text x="50" y="544.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">power with another.</text>
</svg>