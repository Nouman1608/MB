<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 698" width="900" height="698" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="698" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reconstruction, 1865-1877</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">What changed, and what undermined it</text>
<text x="30" y="140" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">CHANGES</text><text x="480" y="140" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">UNDERMINED BY</text><rect x="30" y="154" width="410" height="99" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="180" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1865</text><text x="44" y="206.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Thirteenth Amendment</text><text x="44" y="234.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">abolished slavery</text><rect x="30" y="265" width="410" height="99" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="291" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1868</text><text x="44" y="317.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Fourteenth Amendment</text><text x="44" y="345.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">defined citizenship and equal protection</text><rect x="30" y="376" width="410" height="99" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="402" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1870</text><text x="44" y="428.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Fifteenth Amendment</text><text x="44" y="456.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">barred racial discrimination in voting</text><rect x="30" y="487" width="410" height="96" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="515.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Freedmen's Bureau</text><text x="44" y="543.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">supported education and labour contracts</text><rect x="480" y="154" width="390" height="98.25" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="494" y="207.665" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Black Codes</text><rect x="480" y="264.25" width="390" height="98.25" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="494" y="317.915" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Violence by the Ku Klux Klan</text><rect x="480" y="374.5" width="390" height="98.25" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="494" y="428.165" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Northern loss of interest</text><rect x="480" y="484.75" width="390" height="98.25" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="494" y="524.415" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Compromise of 1877</text><text x="494" y="553.175" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">withdrew federal troops from the South</text><text x="450" y="615" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Judge success by explicit criteria:</text><rect x="89.03250000000003" y="635" width="129.92700000000002" height="31" rx="15.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="153.99600000000004" y="656.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">legal change</text><rect x="228.95950000000005" y="635" width="199.049" height="31" rx="15.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="328.48400000000004" y="656.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">political participation</text><rect x="438.0085" y="635" width="228.748" height="31" rx="15.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="552.3825" y="656.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">economic independence</text><rect x="676.7565" y="635" width="134.211" height="31" rx="15.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="743.862" y="656.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">lasting effect</text>
</svg>