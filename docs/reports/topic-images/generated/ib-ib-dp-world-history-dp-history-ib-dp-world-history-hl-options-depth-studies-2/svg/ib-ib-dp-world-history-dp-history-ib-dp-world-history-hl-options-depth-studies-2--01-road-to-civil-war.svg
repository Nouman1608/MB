<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 636" width="900" height="636" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="636" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The road to the Civil War, 1846-1860</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Each step reopened the question of slavery's expansion</text>
<line x1="150" y1="134" x2="150" y2="594" stroke="#1e2a44" stroke-width="4"/><rect x="184" y="124" width="686" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="197" y="151.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">War with Mexico</text><text x="197" y="176.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">New territory reopened the question of slavery's expansion</text><line x1="150" y1="159" x2="184" y2="159" stroke="#1e2a44" stroke-width="2.5"/><circle cx="150" cy="159" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="130" y="165" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1846-48</text><rect x="184" y="206" width="686" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="197" y="233.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Compromise of 1850</text><text x="197" y="258.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A stricter Fugitive Slave Act required Northerners to help return escaped slaves</text><line x1="150" y1="241" x2="184" y2="241" stroke="#1e2a44" stroke-width="2.5"/><circle cx="150" cy="241" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="130" y="247" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1850</text><rect x="184" y="288" width="686" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="197" y="315.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Kansas-Nebraska Act; Republican Party founded</text><text x="197" y="340.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Popular sovereignty replaced the Missouri Compromise line; violence in Kansas</text><line x1="150" y1="323" x2="184" y2="323" stroke="#1e2a44" stroke-width="2.5"/><circle cx="150" cy="323" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="130" y="329" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1854</text><rect x="184" y="370" width="686" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="197" y="397.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Dred Scott decision</text><text x="197" y="422.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The Supreme Court ruled that Congress could not ban slavery in the territories</text><line x1="150" y1="405" x2="184" y2="405" stroke="#1e2a44" stroke-width="2.5"/><circle cx="150" cy="405" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="130" y="411" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1857</text><rect x="184" y="452" width="686" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="197" y="479.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">John Brown's raid on Harpers Ferry</text><text x="197" y="504.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Southern fear of slave insurrection; Northern abolitionism</text><line x1="150" y1="487" x2="184" y2="487" stroke="#1e2a44" stroke-width="2.5"/><circle cx="150" cy="487" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="130" y="493" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1859</text><rect x="184" y="534" width="686" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="197" y="561.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Lincoln elected without Southern votes</text><text x="197" y="586.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Secession began with South Carolina in December</text><line x1="150" y1="569" x2="184" y2="569" stroke="#1e2a44" stroke-width="2.5"/><circle cx="150" cy="569" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="130" y="575" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Nov 1860</text>
</svg>