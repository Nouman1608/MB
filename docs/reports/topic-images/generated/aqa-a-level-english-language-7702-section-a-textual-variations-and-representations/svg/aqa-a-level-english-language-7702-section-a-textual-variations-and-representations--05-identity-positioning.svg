<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="700" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Identity, positioning and relationships</text>

<rect x="40" y="115" width="260" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="170" y="152" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Producer</text><text x="170" y="176" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">constructs an identity</text><rect x="60" y="195" width="220" height="44" rx="9" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="170" y="223" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">an expert</text><rect x="60" y="251" width="220" height="44" rx="9" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="170" y="279" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">a friend</text><rect x="60" y="307" width="220" height="44" rx="9" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="170" y="335" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">a guardian</text><rect x="60" y="363" width="220" height="44" rx="9" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="170" y="391" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">an ordinary person "like you"</text><line x1="302" y1="280" x2="350" y2="280" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="355" y="200" width="190" height="160" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="450" y="270" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">Text</text><text x="450" y="298" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">addresses and</text><text x="450" y="317" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">positions</text><line x1="547" y1="280" x2="595" y2="280" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="600" y="115" width="260" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="730" y="152" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Reader</text><text x="730" y="176" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">given a position</text><rect x="620" y="195" width="220" height="80" rx="9" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="730" y="226" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Ideal reader</text><text x="730" y="252" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">shares the values</text><text x="632" y="305" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">inclusive "we"</text><text x="632" y="327" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">presupposition</text><text x="632" y="349" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rhetorical questions</text><text x="632" y="385" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">make agreement feel</text><text x="632" y="405" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">natural</text><rect x="40" y="465" width="400" height="210" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="64" y="500" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Synthetic personalisation</text><text x="64" y="524" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Norman Fairclough</text><text x="64" y="556" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A mass-audience text addresses each</text><text x="64" y="578" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reader as if individually, through</text><text x="64" y="600" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"you", imperatives and a chatty</text><text x="64" y="622" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">register.</text><rect x="460" y="465" width="400" height="210" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="484" y="500" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Relationships within a text</text><text x="484" y="524" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">spoken or scripted, several participants</text><text x="484" y="556" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">turn-taking, interruption, topic control,</text><text x="484" y="578" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">terms of address and politeness show</text><text x="484" y="600" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">who holds power. Brown and Levinson:</text><text x="484" y="622" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">positive and negative face.</text>
</svg>