<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" width="900" height="760" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="760" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Every feature has a contextual cause</text>

<text x="165" y="130" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">Contextual factor</text><text x="420" y="130" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">Question to ask</text><text x="718" y="130" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">Typical language result</text><rect x="40" y="145" width="250" height="70" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="165" y="187" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Audience</text><rect x="300" y="145" width="260" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="316" y="175.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Who is addressed, and what</text><text x="316" y="196.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">are they assumed to know?</text><line x1="562" y1="180" x2="590" y2="180" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="594" y="145" width="266" height="70" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="610" y="175.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">density of technical lexis;</text><text x="610" y="196.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">amount of explanation</text><rect x="40" y="227" width="250" height="70" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="165" y="269" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Purpose</text><rect x="300" y="227" width="260" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="316" y="257.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">What is the text trying to</text><text x="316" y="278.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">do?</text><line x1="562" y1="262" x2="590" y2="262" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="594" y="227" width="266" height="70" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="610" y="257.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sentence functions;</text><text x="610" y="278.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">modality; evaluative lexis</text><rect x="40" y="309" width="250" height="70" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="165" y="351" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Genre</text><rect x="300" y="309" width="260" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="316" y="339.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Which conventions does it</text><text x="316" y="360.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">follow or break?</text><line x1="562" y1="344" x2="590" y2="344" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="594" y="309" width="266" height="70" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="610" y="339.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">headlines, sign-offs,</text><text x="610" y="360.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">recipe layout, star ratings</text><rect x="40" y="391" width="250" height="70" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="165" y="433" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Mode</text><rect x="300" y="391" width="260" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="316" y="421.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Between spoken and</text><text x="316" y="442.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">written? Multimodal?</text><line x1="562" y1="426" x2="590" y2="426" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="594" y="391" width="266" height="70" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="610" y="421.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">planned or spontaneous</text><text x="610" y="442.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">structure; images, layout</text><rect x="40" y="473" width="250" height="70" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="165" y="515" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Time</text><rect x="300" y="473" width="260" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="316" y="503.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">When was it produced; what</text><text x="316" y="524.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">was normal then?</text><line x1="562" y1="508" x2="590" y2="508" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="594" y="473" width="266" height="70" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="610" y="503.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">formality, address forms,</text><text x="610" y="524.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sentence length, spelling</text><rect x="40" y="555" width="250" height="70" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="165" y="597" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Place</text><rect x="300" y="555" width="260" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="316" y="585.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Global, national or</text><text x="316" y="606.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">regional in reach?</text><line x1="562" y1="590" x2="590" y2="590" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="594" y="555" width="266" height="70" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="610" y="585.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">dialect lexis; shared local</text><text x="610" y="606.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reference; inclusive "we"</text><rect x="40" y="645" width="820" height="90" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="64" y="680" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The older text's conventions are not mistakes.</text><text x="64" y="710" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Use the date as context for meaning, not as a cue to list "old-fashioned words".</text>
</svg>