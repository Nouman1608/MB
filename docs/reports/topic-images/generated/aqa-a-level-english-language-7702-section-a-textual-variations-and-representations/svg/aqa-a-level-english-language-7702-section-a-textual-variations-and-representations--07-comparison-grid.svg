<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 709" width="900" height="709" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="709" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Comparing the older and contemporary texts</text>

<rect x="210" y="112" width="315" height="50" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="367" y="144" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Victorian-style guidebook</text><rect x="545" y="112" width="315" height="50" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="702" y="144" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Tourism board post</text><circle cx="60" cy="214" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="220.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="86" y="220" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Address</text><rect x="210" y="176" width="315" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="228" y="209.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">third person and "his":</text><text x="228" y="230.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">deference</text><rect x="545" y="176" width="315" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="563" y="209.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"you" and imperatives:</text><text x="563" y="230.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">synthetic personalisation</text><text x="535" y="221" font-size="22" font-weight="700" fill="#b5602e" text-anchor="middle">≠</text><circle cx="60" cy="302" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="308.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="86" y="308" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Visitor</text><rect x="210" y="264" width="315" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="228" y="308" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">solitary male invalid; health</text><rect x="545" y="264" width="315" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="563" y="297.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sociable group ("your crew");</text><text x="563" y="318.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fun</text><text x="535" y="309" font-size="22" font-weight="700" fill="#b5602e" text-anchor="middle">≠</text><circle cx="60" cy="390" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="396.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="86" y="396" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Town</text><rect x="210" y="352" width="315" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="228" y="396" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">governed and orderly</text><rect x="545" y="352" width="315" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="563" y="385.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">personified and eager</text><text x="563" y="406.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">("waiting for you")</text><text x="535" y="397" font-size="22" font-weight="700" fill="#b5602e" text-anchor="middle">≠</text><circle cx="60" cy="478" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="484.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="86" y="484" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Mode, genre</text><rect x="210" y="440" width="315" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="228" y="473.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">printed guide; planned,</text><text x="228" y="494.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">complex syntax</text><rect x="545" y="440" width="315" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="563" y="473.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">short, informal online post</text><text x="563" y="494.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">for sharing</text><text x="535" y="485" font-size="22" font-weight="700" fill="#b5602e" text-anchor="middle">≠</text><rect x="40" y="534" width="820" height="64" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="64" y="573" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Similarity:</text><text x="170" y="573" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">both present the town as existing for the visitor</text><rect x="40" y="614" width="820" height="70" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="450" y="646" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Explain why each difference exists: audience expectations,</text><text x="450" y="670" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">genre, technology, social attitudes.</text>
</svg>