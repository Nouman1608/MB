<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 685" width="900" height="685" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="685" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who acts on whom?</text>

<rect x="40" y="115" width="400" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="240" y="152" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Group as agent</text><rect x="70" y="200" width="120" height="70" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="130" y="242" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Group</text><line x1="192" y1="235" x2="300" y2="235" stroke="#2e6b62" stroke-width="6" marker-end="url(#ahT)"/><text x="246" y="222" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">acts</text><rect x="305" y="200" width="110" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="360" y="242" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">goal</text><text x="240" y="320" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">agent of material verbs:</text><text x="240" y="344" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">seems powerful or responsible</text><rect x="460" y="115" width="400" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="660" y="152" font-size="21" font-weight="700" fill="#b5602e" text-anchor="middle">Group on the receiving end</text><rect x="490" y="200" width="120" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="550" y="242" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">others</text><line x1="612" y1="235" x2="720" y2="235" stroke="#b5602e" stroke-width="6" marker-end="url(#ahR)"/><text x="666" y="222" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">act on</text><rect x="725" y="200" width="110" height="70" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="780" y="242" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Group</text><text x="660" y="320" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">always acted upon:</text><text x="660" y="344" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">seems passive or vulnerable</text><text x="450" y="410" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Removing the person responsible</text><rect x="40" y="430" width="400" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="64" y="465" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Agentless passive</text><text x="64" y="505" font-size="21" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"Mistakes were made"</text><rect x="310" y="480" width="106" height="40" rx="8" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="363" y="506" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">who?</text><rect x="460" y="430" width="400" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="484" y="465" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Nominalisation</text><text x="484" y="505" font-size="21" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"the closure"</text><rect x="730" y="480" width="106" height="40" rx="8" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="783" y="506" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">who?</text><rect x="40" y="570" width="820" height="90" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="64" y="605" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Presupposition</text><text x="64" y="636" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">"When will the council stop wasting money?" assumes that money is being wasted.</text>
</svg>