<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" width="900" height="760" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="760" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Grouping features into one representation</text>

<text x="225" y="128" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">Feature</text><text x="635" y="128" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">What it represents</text><rect x="40" y="142" width="370" height="62" rx="9" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="58" y="179" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"The visitor ... his comfort"</text><line x1="412" y1="173" x2="436" y2="173" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="440" y="142" width="390" height="62" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="458" y="168.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">generic reader, assumed male; women</text><text x="458" y="189.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">appear only as staff</text><path d="M830,173 L850,173 L850,590" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="40" y="216" width="370" height="62" rx="9" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="58" y="253" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"entirely devoted to"</text><line x1="412" y1="247" x2="436" y2="247" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="440" y="216" width="390" height="62" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="458" y="242.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">hyperbole: the town exists to serve</text><text x="458" y="263.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">outsiders</text><path d="M830,247 L850,247 L850,590" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="40" y="290" width="370" height="62" rx="9" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="58" y="316.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"lately extended at great</text><text x="58" y="337.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">expense by the Corporation"</text><line x1="412" y1="321" x2="436" y2="321" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="440" y="290" width="390" height="62" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="458" y="316.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">passive with a named agent: civic</text><text x="458" y="337.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">pride and trust</text><path d="M830,321 L850,321 L850,590" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="40" y="364" width="370" height="62" rx="9" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="58" y="401" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"the invalid ... bracing"</text><line x1="412" y1="395" x2="436" y2="395" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="440" y="364" width="390" height="62" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="458" y="390.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">health discourse: the resort as</text><text x="458" y="411.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">therapeutic</text><path d="M830,395 L850,395 L850,590" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="40" y="438" width="370" height="62" rx="9" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="58" y="475" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"orderly rows", "respectable"</text><line x1="412" y1="469" x2="436" y2="469" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="440" y="438" width="390" height="62" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="458" y="464.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">modifiers of order and propriety</text><text x="458" y="485.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reassure</text><path d="M830,469 L850,469 L850,590" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="40" y="512" width="370" height="62" rx="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="58" y="549" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Long complex sentences</text><line x1="412" y1="543" x2="436" y2="543" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="440" y="512" width="390" height="62" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="458" y="538.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">formal printed style: authority, not</text><text x="458" y="559.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">intimacy</text><path d="M830,543 L850,543 L850,590" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><line x1="850" y1="590" x2="850" y2="614" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="40" y="618" width="820" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="64" y="652" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">One idea, not a list of devices</text><text x="64" y="682" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">A safe, health-giving, well-governed town for respectable male visitors;</text><text x="64" y="706" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">the reader is positioned as someone entitled to be served.</text>
</svg>