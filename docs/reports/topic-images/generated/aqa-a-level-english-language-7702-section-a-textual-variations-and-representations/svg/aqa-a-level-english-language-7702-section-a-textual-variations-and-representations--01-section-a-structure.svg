<rect width="900" height="620" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Paper 1 Section A: two texts, three questions</text>

<rect x="110" y="115" width="260" height="80" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="240" y="150" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Text A</text><text x="240" y="177" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">contemporary</text><rect x="530" y="115" width="260" height="80" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="3"/><text x="660" y="150" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Text B</text><text x="660" y="177" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">older</text><line x1="370" y1="155" x2="530" y2="155" stroke="#1e2a44" stroke-width="3" stroke-dasharray="7 6"/><text x="450" y="145" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">linked by</text><text x="450" y="178" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">topic or theme</text><line x1="240" y1="195" x2="240" y2="228" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="660" y1="195" x2="660" y2="228" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="115" y="232" width="250" height="70" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="240" y="262" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Analyse Text A</text><text x="240" y="288" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">25 marks</text><rect x="535" y="232" width="250" height="70" rx="12" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5"/><text x="660" y="262" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Analyse Text B</text><text x="660" y="288" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">25 marks</text><path d="M240,302 L240,330 L660,330 L660,302" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><line x1="450" y1="330" x2="450" y2="352" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="325" y="356" width="250" height="70" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="386" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Compare them</text><text x="450" y="412" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">20 marks</text><text x="450" y="475" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">In each text, explore how language is</text><rect x="40" y="495" width="193" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="136" y="528" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">shaped by</text><text x="136" y="556" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">audience, purpose,</text><text x="136" y="578" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">genre and mode</text><rect x="247" y="495" width="193" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="343" y="528" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">shaped by</text><text x="343" y="556" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">context</text><rect x="454" y="495" width="193" height="100" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="550" y="528" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">used to construct</text><text x="550" y="556" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">meanings and</text><text x="550" y="578" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">representations</text><rect x="661" y="495" width="193" height="100" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="757" y="528" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">used to enact</text><text x="757" y="556" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">relationships</text>
</svg>