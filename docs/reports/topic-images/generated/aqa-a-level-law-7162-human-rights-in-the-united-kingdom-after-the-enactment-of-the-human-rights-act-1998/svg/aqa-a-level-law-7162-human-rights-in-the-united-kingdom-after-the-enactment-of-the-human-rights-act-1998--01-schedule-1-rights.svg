<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 504" width="900" height="504" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="504" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Which rights did the Act bring in?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">In force 2 October 2000. Section 1 and Schedule 1 define the “Convention rights”</text>
<rect x="30" y="124" width="412" height="248" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INCLUDED</text><text x="50" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Convention rights</text><text x="50" y="213.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="213.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Articles 2 to 12 and 14</text><text x="50" y="243.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="243.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Protocol 1, Articles 1 to 3: property,</text><text x="66.15" y="265.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">education, free elections</text><text x="50" y="295.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="295.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Protocol 13, Article 1: abolition of the death</text><text x="66.15" y="317.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">penalty</text><text x="50" y="347.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="347.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Read with Articles 16 to 18</text><rect x="458" y="124" width="412" height="248" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="478" y="156" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LEFT OUT</text><text x="478" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Not incorporated</text><text x="478" y="213.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494.15" y="213.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Article</tspan> <tspan font-weight="700" fill="#1e2a44">1</tspan>: the state’s duty to secure the</text><text x="494.15" y="235.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">rights</text><text x="478" y="265.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494.15" y="265.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Article</tspan> <tspan font-weight="700" fill="#1e2a44">13</tspan>: the right to an effective remedy</text><text x="478" y="295.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494.15" y="295.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Government view: the Act itself provides</text><text x="494.15" y="317.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the remedy</text><rect x="30" y="394" width="840" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="426.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">The Convention itself is not made part of UK law. UK derogations and reservations can be designated so</text><text x="450" y="447.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">the rights apply subject to them (ss14 and 15).</text>
</svg>