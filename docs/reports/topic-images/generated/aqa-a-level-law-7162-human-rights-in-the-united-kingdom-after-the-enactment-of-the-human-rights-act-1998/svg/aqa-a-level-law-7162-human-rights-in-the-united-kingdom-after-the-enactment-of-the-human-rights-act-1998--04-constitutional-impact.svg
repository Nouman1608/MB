<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 435" width="900" height="435" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="435" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Impact on the constitution</text>

<rect x="30" y="100" width="413" height="153" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SOVEREIGNTY</text><text x="50" y="158.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Preserved in form</text><text x="50" y="186.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Courts cannot invalidate Acts; governments have</text><text x="50" y="207.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">usually changed the law after declarations</text><rect x="457" y="100" width="413" height="153" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">JUDICIAL ROLE</text><text x="477" y="158.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Proportionality review</text><text x="477" y="186.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">More intense than Wednesbury; sensitive issues</text><text x="477" y="207.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">such as detention of terror suspects (<tspan font-style="italic">A</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">SSHD</tspan>,</text><text x="477" y="228.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">2004)</text><rect x="30" y="271" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="303" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONSTITUTIONAL STATUTE</text><text x="50" y="329.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Thoburn v Sunderland CC (2002)</text><text x="50" y="357.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Cannot be impliedly repealed; only express</text><text x="50" y="378.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">words will do</text><rect x="457" y="271" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="303" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ORDINARY LAW</text><text x="477" y="329.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Changed across many areas</text><text x="477" y="357.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Privacy (<tspan font-style="italic">Campbell</tspan>), inquests, police powers,</text><text x="477" y="378.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">housing</text>
</svg>