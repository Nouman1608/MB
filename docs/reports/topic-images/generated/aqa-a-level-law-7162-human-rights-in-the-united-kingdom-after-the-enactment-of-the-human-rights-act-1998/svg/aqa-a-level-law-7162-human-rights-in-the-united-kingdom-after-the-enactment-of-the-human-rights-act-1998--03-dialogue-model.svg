<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 790" width="900" height="790" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="790" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The “dialogue” model</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Rights protected without courts striking down Acts of Parliament</text>
<rect x="30" y="124" width="395" height="160" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COURTS: SECTION 4</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Declaration of incompatibility</text><text x="50" y="211.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">High Court or above, when s3 cannot work</text><text x="50" y="238.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="238.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">s4(6): law stays valid and operative; parties</text><text x="65.2" y="259.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">not bound</text><line x1="431" y1="204" x2="469" y2="204" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="475" y="124" width="395" height="160" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="495" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PARLIAMENT AND MINISTERS</text><text x="495" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Respond</text><text x="495" y="211.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="510.2" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Change the law, or s10 <tspan font-weight="700" fill="#1e2a44">remedial</tspan> <tspan font-weight="700" fill="#1e2a44">order</tspan> (fast</text><text x="510.2" y="232.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">track)</text><text x="495" y="259.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="510.2" y="259.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">s19 <tspan font-weight="700" fill="#1e2a44">statement</tspan> <tspan font-weight="700" fill="#1e2a44">of</tspan> <tspan font-weight="700" fill="#1e2a44">compatibility</tspan> before a Bill</text><clipPath id="tc306"><rect x="30" y="306" width="840" height="321" rx="14"/></clipPath><g clip-path="url(#tc306)"><rect x="30" y="306" width="376.551724137931" height="44" fill="#b5d3cf"/><text x="42" y="331.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Case</text><rect x="406.551724137931" y="306" width="463.4482758620689" height="44" fill="#b5d3cf"/><text x="418.551724137931" y="331.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Outcome</text><rect x="30" y="350" width="376.551724137931" height="64" fill="#dce9e7"/><text x="42" y="374.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Bellinger v Bellinger (2003)</text><rect x="406.551724137931" y="350" width="463.4482758620689" height="64" fill="#ffffff"/><text x="418.551724137931" y="374.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Declaration (Matrimonial Causes Act 1973) → Gender</text><text x="418.551724137931" y="395.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Recognition Act 2004</text><line x1="30" y1="414" x2="870" y2="414" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="414" width="376.551724137931" height="85" fill="#dce9e7"/><text x="42" y="438.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">R (Anderson) (2002)</text><rect x="406.551724137931" y="414" width="463.4482758620689" height="85" fill="#f8faf9"/><text x="418.551724137931" y="438.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Home Secretary setting life minimum terms breached</text><text x="418.551724137931" y="459.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Article 6 → power moved to judges, Criminal Justice Act</text><text x="418.551724137931" y="480.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">2003</text><line x1="30" y1="499" x2="870" y2="499" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="499" width="376.551724137931" height="64" fill="#dce9e7"/><text x="42" y="523.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">R (Nicklinson) (2014)</text><rect x="406.551724137931" y="499" width="463.4482758620689" height="64" fill="#ffffff"/><text x="418.551724137931" y="523.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Declaration declined on assisted suicide: left to</text><text x="418.551724137931" y="544.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Parliament for the time being</text><line x1="30" y1="563" x2="870" y2="563" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="563" width="376.551724137931" height="64" fill="#dce9e7"/><text x="42" y="587.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Communications Act 2003</text><rect x="406.551724137931" y="563" width="463.4482758620689" height="64" fill="#f8faf9"/><text x="418.551724137931" y="587.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Introduced without a s19 statement (political advertising</text><text x="418.551724137931" y="608.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ban); upheld in <tspan font-style="italic">Animal</tspan> <tspan font-style="italic">Defenders</tspan> (2013)</text></g><line x1="406.551724137931" y1="306" x2="406.551724137931" y2="627" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="306" width="840" height="321" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="649" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="683.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Section 6: who is bound</text><text x="50" y="712.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Public authorities, including <tspan font-weight="700" fill="#1e2a44">courts</tspan> <tspan font-weight="700" fill="#1e2a44">and</tspan> <tspan font-weight="700" fill="#1e2a44">tribunals</tspan> (s6(3)), but <tspan font-weight="700" fill="#1e2a44">not</tspan> <tspan font-weight="700" fill="#1e2a44">Parliament</tspan>. Defence where primary</text><text x="50" y="733.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">legislation required the act (s6(2)).</text>
</svg>