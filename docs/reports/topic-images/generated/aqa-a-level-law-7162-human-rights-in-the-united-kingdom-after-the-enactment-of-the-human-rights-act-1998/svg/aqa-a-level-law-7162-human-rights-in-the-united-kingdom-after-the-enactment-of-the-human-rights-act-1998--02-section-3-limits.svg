<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 425" width="900" height="425" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="425" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Section 3: interpretation or amendment?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">“So far as it is possible to do so”: validity unaffected (s3(2))</text>
<defs><linearGradient id="s3g" x1="0" x2="1"><stop offset="0" stop-color="#dce9e7"/><stop offset="0.7" stop-color="#b5d3cf"/><stop offset="1" stop-color="#f2e7b8"/></linearGradient></defs><rect x="30" y="124" width="840" height="40" rx="20" fill="url(#s3g)" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="150" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Interpretation</text><text x="850" y="150" font-size="17" font-weight="700" fill="#b5602e" text-anchor="end">Amendment</text><line x1="640" y1="116" x2="640" y2="172" stroke="#b5602e" stroke-width="3" stroke-dasharray="6 5"/><text x="640" y="190" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">limit of section 3</text><rect x="30" y="208" width="280" height="185" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="236" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">R v A (No 2) (2001)</text><text x="46" y="261.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Implied provision added</text><text x="46" y="288.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Sexual history restriction</text><text x="46" y="309.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(YJCEA 1999) read so evidence</text><text x="46" y="330.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">needed for a fair trial (Art 6) is</text><text x="46" y="351.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">not excluded</text><rect x="325" y="208" width="280" height="185" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="341" y="236" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GHAIDAN (2004)</text><text x="341" y="261.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">“As his or her wife or</text><text x="341" y="282.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">husband” includes a</text><text x="341" y="303.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">same-sex partner</text><text x="341" y="330.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">May depart from unambiguous</text><text x="341" y="351.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">meaning, but must “go with the</text><text x="341" y="372.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">grain”</text><rect x="620" y="208" width="250" height="185" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="636" y="236" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">RE S AND RE W (2002)</text><text x="636" y="261.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Refused</text><text x="636" y="288.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A new care-plan supervision</text><text x="636" y="309.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">scheme would be</text><text x="636" y="330.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">amendment, not</text><text x="636" y="351.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">interpretation</text>
</svg>