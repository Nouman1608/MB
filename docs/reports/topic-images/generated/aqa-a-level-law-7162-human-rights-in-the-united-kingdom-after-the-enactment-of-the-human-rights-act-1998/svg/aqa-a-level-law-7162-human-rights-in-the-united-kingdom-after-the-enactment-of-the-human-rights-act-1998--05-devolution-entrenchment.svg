<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 602" width="900" height="602" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="602" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Westminster statute, devolved higher law</text>

<rect x="30" y="100" width="270.6666666666667" height="339" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WESTMINSTER</text><text x="50" y="158.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">An Act of Parliament</text><text x="50" y="186.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="186.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cannot be struck down</text><text x="50" y="211.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Only a declaration of</text><text x="65.2" y="232.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">incompatibility</text><text x="50" y="257.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="257.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The HRA itself is an ordinary</text><text x="65.2" y="278.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">statute</text><rect x="314.6666666666667" y="100" width="270.6666666666667" height="339" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="334.6666666666667" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SCOTLAND ACT 1998</text><text x="334.6666666666667" y="158.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Incompatible Act is “not</text><text x="334.6666666666667" y="181.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">law”</text><text x="334.6666666666667" y="209.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="349.8666666666667" y="209.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">s29(2)(d): outside</text><text x="349.8666666666667" y="230.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">competence</text><text x="334.6666666666667" y="255.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="349.8666666666667" y="255.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">s57(2): ministers cannot act</text><text x="349.8666666666667" y="276.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">incompatibly</text><text x="334.6666666666667" y="301.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="349.8666666666667" y="301.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">HRA protected: cannot be</text><text x="349.8666666666667" y="322.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">modified</text><text x="334.6666666666667" y="347.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="349.8666666666667" y="347.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Salvesen</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Riddell</tspan> (2013):</text><text x="349.8666666666667" y="368.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">right to property</text><text x="334.6666666666667" y="393.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="349.8666666666667" y="393.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Christian</tspan> <tspan font-style="italic">Institute</tspan> (2016):</text><text x="349.8666666666667" y="414.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Article 8</text><rect x="599.3333333333334" y="100" width="270.6666666666667" height="339" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="619.3333333333334" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NORTHERN IRELAND ACT 1998</text><text x="619.3333333333334" y="158.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Outside competence</text><text x="619.3333333333334" y="186.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="634.5333333333334" y="186.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">s6(2)(c): Assembly</text><text x="634.5333333333334" y="207.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">legislation</text><text x="619.3333333333334" y="232.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="634.5333333333334" y="232.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">s24: ministers</text><text x="619.3333333333334" y="257.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="634.5333333333334" y="257.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">s7: HRA an <tspan font-weight="700" fill="#1e2a44">entrenched</tspan></text><text x="634.5333333333334" y="278.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">enactment</tspan></text><text x="619.3333333333334" y="303.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="634.5333333333334" y="303.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Good Friday Agreement</text><text x="634.5333333333334" y="324.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">commitment</text><rect x="30" y="461" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="495.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Repeal would affect the devolved settlements</text><text x="50" y="524.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Devolved legislation can be <tspan font-weight="700" fill="#1e2a44">struck</tspan> <tspan font-weight="700" fill="#1e2a44">down</tspan> for incompatibility. Under the Sewel convention, Westminster</text><text x="50" y="545.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">would not normally legislate on devolved matters without consent.</text>
</svg>