<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 391" width="900" height="391" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="391" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Criticised from both sides</text>

<rect x="30" y="100" width="412" height="259" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TOO MUCH JUDICIAL OR EUROPEAN INFLUENCE</text><text x="50" y="163.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="163.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Section 3 lets judges rewrite statutes (<tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">A</tspan>;</text><text x="65.2" y="184.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Ghaidan</tspan>)</text><text x="50" y="213.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="213.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Article 8 in deportation cases; Immigration Act</text><text x="65.2" y="234.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">2014 public interest factors</text><text x="50" y="263.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="263.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Smith</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">MoD</tspan> (2013): Article 2 for soldiers</text><text x="65.2" y="284.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">abroad</text><text x="50" y="313.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="313.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Section 2 and sovereignty: prisoner voting</text><text x="65.2" y="334.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">after <tspan font-style="italic">Hirst</tspan></text><rect x="458" y="100" width="412" height="259" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NOT ENOUGH PROTECTION</text><text x="478" y="163.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="493.2" y="163.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Not entrenched at Westminster: repealable by</text><text x="493.2" y="184.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">simple majority</text><text x="478" y="213.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="493.2" y="213.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Declarations do not bind; the law keeps</text><text x="493.2" y="234.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">operating</text><text x="478" y="263.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="493.2" y="263.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No economic and social rights</text><text x="478" y="292.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="493.2" y="292.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Private bodies running public services may fall</text><text x="493.2" y="313.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">outside s6</text>
</svg>