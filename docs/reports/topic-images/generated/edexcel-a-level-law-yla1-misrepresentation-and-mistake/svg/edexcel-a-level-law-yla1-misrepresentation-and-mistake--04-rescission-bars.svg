<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 592" width="900" height="592" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="592" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Rescission and its bars</text>

<rect x="30" y="110" width="840" height="113" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RESCISSION</text><text x="50" y="170.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Sets the contract aside and puts the parties back where they were</text><text x="50" y="198.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">An equitable remedy, so it can be lost.</text><path d="M450,240 C450,262 129,258 129,276" fill="none" stroke="#b5602e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahR)"/><rect x="30" y="282" width="198" height="196" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="315" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">BAR</text><text x="50" y="340.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Affirmation</text><text x="50" y="367" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">carries on after</text><text x="50" y="387" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">discovering the truth</text><text x="50" y="412" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Long v Lloyd</tspan> [1958]</text><path d="M450,240 C450,262 343,258 343,276" fill="none" stroke="#b5602e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahR)"/><rect x="244" y="282" width="198" height="196" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="264" y="315" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">BAR</text><text x="264" y="340.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Undue delay</text><text x="264" y="367" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">waits too long</text><text x="264" y="392" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Leaf v International</tspan></text><text x="264" y="412" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Galleries</tspan> [1950]</text><path d="M450,240 C450,262 557,258 557,276" fill="none" stroke="#b5602e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahR)"/><rect x="458" y="282" width="198" height="196" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="478" y="315" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">BAR</text><text x="478" y="340.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Restitution</text><text x="478" y="362.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">impossible</text><text x="478" y="389" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">the subject matter</text><text x="478" y="409" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">cannot be returned</text><text x="478" y="434" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Clarke v Dickson</tspan></text><text x="478" y="454" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(1858)</text><path d="M450,240 C450,262 771,258 771,276" fill="none" stroke="#b5602e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahR)"/><rect x="672" y="282" width="198" height="196" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="692" y="315" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">BAR</text><text x="692" y="340.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Third-party rights</text><text x="692" y="367" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">an innocent third</text><text x="692" y="387" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">party has acquired</text><text x="692" y="407" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">rights for value</text><rect x="30" y="498" width="840" height="64" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="536" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Act promptly and do not affirm once the truth is known.</text>
</svg>