<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 726" width="900" height="726" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="726" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: Sana and the café</text>

<rect x="30" y="110" width="840" height="102" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="143.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Sana buys a café from Bilal, who says, "It makes £800 a week." That was true a year ago, but</text><text x="50" y="165.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">takings fell to £400 after a new road closed the street; Bilal knew. Sana did not check the accounts</text><text x="50" y="187.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">she was offered.</text><rect x="30" y="232" width="128" height="78" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="94" y="277" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Statement</text><rect x="170" y="232" width="520" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="190" y="264.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"makes £800 a week": a statement of fact about current</text><text x="190" y="285.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">takings</text><rect x="30" y="320" width="128" height="60" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="94" y="356" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Silence?</text><rect x="170" y="320" width="520" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="190" y="354.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a stated fact became untrue and was not corrected</text><rect x="702" y="320" width="168" height="60" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="786" y="356" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-style="italic">With v O’Flanagan</tspan></text><rect x="30" y="390" width="128" height="60" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="94" y="426" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Inducement</text><rect x="170" y="390" width="520" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="190" y="424.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">she relied on it; failure to check does not matter</text><rect x="702" y="390" width="168" height="60" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="786" y="426" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-style="italic">Redgrave v Hurd</tspan></text><rect x="30" y="460" width="128" height="78" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="94" y="505" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Type</text><rect x="170" y="460" width="520" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="190" y="492.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Bilal knew the truth: fraudulent; or at least s 2(1), as he cannot</text><text x="190" y="513.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">prove reasonable belief</text><rect x="702" y="460" width="168" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="786" y="505" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-style="italic">Derry v Peek</tspan></text><rect x="30" y="548" width="128" height="78" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="94" y="593" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Remedy</text><rect x="170" y="548" width="520" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="190" y="580.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rescission plus damages for all direct losses; if fraud, no</text><text x="190" y="601.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reduction for her failure to check</text><rect x="702" y="548" width="168" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="786" y="593" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-style="italic">Standard Chartered</tspan></text><rect x="30" y="636" width="128" height="60" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="94" y="672" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Bars</text><rect x="170" y="636" width="520" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="190" y="670.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">act promptly and do not affirm</text><rect x="702" y="636" width="168" height="60" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="786" y="672" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-style="italic">Long v Lloyd</tspan></text>
</svg>