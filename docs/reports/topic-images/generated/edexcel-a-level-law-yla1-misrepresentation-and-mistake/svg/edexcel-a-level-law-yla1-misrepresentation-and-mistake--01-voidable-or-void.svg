<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 556" width="900" height="556" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="556" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Flawed consent: voidable or void</text>

<rect x="30" y="110" width="411" height="330" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="142" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MISREPRESENTATION</text><text x="54" y="172" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Voidable</text><text x="54" y="202" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Stands until the innocent party chooses to set it</text><text x="54" y="223" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">aside.</text><path d="M70,260 H160 L190,290 V390 H70 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><rect x="86" y="304" width="80" height="8" rx="4" fill="#c9d6d4"/><rect x="86" y="322" width="60" height="8" rx="4" fill="#c9d6d4"/><rect x="86" y="340" width="80" height="8" rx="4" fill="#c9d6d4"/><rect x="86" y="358" width="60" height="8" rx="4" fill="#c9d6d4"/><line x1="210" y1="330" x2="260" y2="330" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="270" y="318" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">innocent party</text><text x="270" y="340" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">may rescind</text><rect x="459" y="110" width="411" height="330" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="483" y="142" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">OPERATIVE MISTAKE</text><text x="483" y="172" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Void</text><text x="483" y="202" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Usually never a contract at all.</text><path d="M500,260 H590 L620,290 V390 H500 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="8 6"/><rect x="516" y="304" width="80" height="8" rx="4" fill="#c9d6d4"/><rect x="516" y="322" width="60" height="8" rx="4" fill="#c9d6d4"/><rect x="516" y="340" width="80" height="8" rx="4" fill="#c9d6d4"/><rect x="516" y="358" width="60" height="8" rx="4" fill="#c9d6d4"/><path d="M490,400 L630,250" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><text x="650" y="330" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">no contract</text><rect x="30" y="462" width="840" height="64" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="500" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">The difference matters most when goods have been sold on to an innocent third party.</text>
</svg>