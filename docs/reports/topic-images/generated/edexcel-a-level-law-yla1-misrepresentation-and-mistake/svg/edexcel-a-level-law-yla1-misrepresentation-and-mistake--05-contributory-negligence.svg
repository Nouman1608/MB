<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 438" width="900" height="438" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="438" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Contributory negligence and misrepresentation</text>

<rect x="30" y="110" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="143" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">LAW REFORM (CONTRIBUTORY NEGLIGENCE) ACT 1945</text><text x="50" y="170.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Damages reduced to the extent the court thinks just, where the claimant was partly at</text><text x="50" y="195.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">fault</text><rect x="30" y="232" width="411" height="176" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="265" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">s 2(1) NEGLIGENT MISREPRESENTATION</text><text x="50" y="292.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Can in principle be reduced</text><text x="50" y="320.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Gran Gelato v Richcliff</tspan> [1992]: where D was also</text><text x="50" y="341.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">liable in negligence; on the facts, no reduction</text><text x="50" y="362.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">was made</text><rect x="459" y="232" width="411" height="176" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="479" y="265" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">FRAUDULENT MISREPRESENTATION</text><text x="479" y="292.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Never reduced</text><text x="479" y="320.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Standard Chartered Bank v Pakistan National</tspan></text><text x="479" y="341.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Shipping (No 2)</tspan> [2002]: a fraudster cannot</text><text x="479" y="362.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">complain the victim should have been more</text><text x="479" y="383.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">careful</text>
</svg>