<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="560" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Mistake as to identity</text>

<rect x="30" y="110" width="840" height="60" rx="14" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="147" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">A rogue pretends to be someone else to obtain a contract</text><rect x="30" y="190" width="411" height="340" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="235" y="226" font-size="21" font-weight="700" fill="#b5602e" text-anchor="middle">Written contract</text><text x="54" y="258" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The identity of the named party is usually vital.</text><rect x="135" y="320" width="200" height="56" rx="28" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="235" y="356" font-size="22" font-weight="700" fill="#b5602e" text-anchor="middle">Void</text><text x="54" y="410" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Cundy v Lindsay</tspan> (1878); <tspan font-style="italic">Shogun Finance v Hudson</tspan></text><text x="54" y="430" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">[2003]</text><text x="54" y="480" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">never a contract at all</text><rect x="459" y="190" width="411" height="340" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="664" y="226" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Face to face</text><text x="483" y="258" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The seller is presumed to intend to deal with</text><text x="483" y="279" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the person in front of them.</text><rect x="564" y="320" width="200" height="56" rx="28" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="664" y="356" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="middle">Voidable</text><text x="483" y="410" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Phillips v Brooks</tspan> [1919]; <tspan font-style="italic">Lewis v Averay</tspan> [1972];</text><text x="483" y="430" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Ingram v Little</tspan> [1961] usually treated as exceptional</text><text x="483" y="480" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">stands until the mistaken party sets it aside</text>
</svg>