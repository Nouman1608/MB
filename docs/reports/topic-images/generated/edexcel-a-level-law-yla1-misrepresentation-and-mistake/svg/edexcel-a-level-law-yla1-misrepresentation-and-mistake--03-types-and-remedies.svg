<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 787" width="900" height="787" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="787" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Types of misrepresentation and their remedies</text>

<text x="240" y="132" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">TYPE AND TEST</text><text x="700" y="132" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">REMEDIES</text><rect x="30" y="146" width="450" height="106" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="180.4" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Fraudulent</text><text x="50" y="208" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">knowingly, without belief, or recklessly: <tspan font-style="italic">Derry v Peek</tspan></text><text x="50" y="228" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(1889)</text><line x1="486" y1="199" x2="524" y2="199" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="530" y="146" width="340" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="550" y="192.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rescission + damages in deceit for all</text><text x="550" y="213.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">direct losses (<tspan font-style="italic">Doyle v Olby</tspan> [1969])</text><rect x="30" y="264" width="450" height="106" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="298.4" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">Negligent: s 2(1) MA 1967</text><text x="50" y="326" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">liable unless the maker proves reasonable grounds and</text><text x="50" y="346" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">belief up to the contract</text><line x1="486" y1="317" x2="524" y2="317" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="530" y="264" width="340" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="550" y="300.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rescission + damages measured as if</text><text x="550" y="321.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fraudulent (<tspan font-style="italic">Royscot Trust v Rogerson</tspan></text><text x="550" y="342.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">[1991])</text><rect x="30" y="382" width="450" height="106" rx="14" fill="#dfe7f3" stroke="#2b5a9a" stroke-width="2.5"/><text x="50" y="416.4" font-size="18" font-weight="700" fill="#2b5a9a" text-anchor="start">Negligent at common law</text><text x="50" y="444" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">negligent misstatement with a special relationship:</text><text x="50" y="464" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Hedley Byrne v Heller</tspan> [1964]</text><line x1="486" y1="435" x2="524" y2="435" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="530" y="382" width="340" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="550" y="439.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Damages in tort</text><rect x="30" y="500" width="450" height="86" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="534.4" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Innocent</text><text x="50" y="562" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">the maker had reasonable grounds for believing it</text><line x1="486" y1="543" x2="524" y2="543" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="530" y="500" width="340" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="550" y="536.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rescission; s 2(2): damages may be</text><text x="550" y="557.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">awarded instead</text><rect x="30" y="606" width="411" height="151" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="639" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WHY s 2(1) HELPS CLAIMANTS</text><text x="50" y="665.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Burden of proof reversed</text><text x="50" y="693" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Howard Marine v Ogden</tspan> [1978]: barge capacity</text><text x="50" y="713" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">from the Lloyd’s Register was wrong; their own</text><text x="50" y="733" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">documents were right, so no reasonable grounds.</text><rect x="459" y="606" width="411" height="151" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="639" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">s 3 MA 1967</text><text x="479" y="665.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Excluding liability</text><text x="479" y="693" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">effective only if reasonable under the Unfair</text><text x="479" y="713" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Contract Terms Act 1977</text>
</svg>