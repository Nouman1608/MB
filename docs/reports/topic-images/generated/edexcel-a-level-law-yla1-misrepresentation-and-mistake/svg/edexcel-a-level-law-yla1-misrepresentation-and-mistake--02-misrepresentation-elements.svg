<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 546" width="900" height="546" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="546" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Misrepresentation: the three elements</text>

<rect x="30" y="110" width="840" height="84" rx="14" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="144.4" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">An untrue statement of fact, made by one party to the other before or at the time of the</text><text x="50" y="168.4" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">contract, which induces the other party to enter into it</text><rect x="30" y="232" width="268" height="262" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="270" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">A statement</text><text x="52" y="298" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.25" y="298" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">by words or conduct: <tspan font-style="italic">Spice</tspan></text><text x="66.25" y="318" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Girls v Aprilia</tspan> [2002]</text><text x="52" y="343" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.25" y="343" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">silence generally not:</text><text x="66.25" y="363" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Fletcher v Krell</tspan> (1873)</text><text x="52" y="388" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.25" y="388" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">except half-truths (<tspan font-style="italic">Dimmock</tspan></text><text x="66.25" y="408" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">v Hallett</tspan>), changed</text><text x="66.25" y="428" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">circumstances (<tspan font-style="italic">With v</tspan></text><text x="66.25" y="448" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">O’Flanagan</tspan>), utmost good</text><text x="66.25" y="468" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">faith</text><circle cx="164" cy="232" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="164" y="239.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="316" y="232" width="268" height="258" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="338" y="270" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Of fact</text><text x="338" y="298" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="352.25" y="298" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">not opinion: <tspan font-style="italic">Bisset v</tspan></text><text x="352.25" y="318" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Wilkinson</tspan> [1927]</text><text x="338" y="343" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="352.25" y="343" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">expert opinion can be fact:</text><text x="352.25" y="363" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Esso v Mardon</tspan> [1976]</text><text x="338" y="388" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="352.25" y="388" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">a lie about present intention</text><text x="352.25" y="408" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">is fact: <tspan font-style="italic">Edgington v</tspan></text><text x="352.25" y="428" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Fitzmaurice</tspan> (1885)</text><text x="338" y="453" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="352.25" y="453" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">sales puff is too vague</text><circle cx="450" cy="232" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="239.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="602" y="232" width="268" height="258" rx="14" fill="#dfe7f3" stroke="#2b5a9a" stroke-width="2.5"/><text x="624" y="270" font-size="20" font-weight="700" fill="#2b5a9a" text-anchor="start">Inducement</text><text x="624" y="298" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="638.25" y="298" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">no reliance if D checked and</text><text x="638.25" y="318" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">relied on the check: <tspan font-style="italic">Attwood</tspan></text><text x="638.25" y="338" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">v Small</tspan> (1838)</text><text x="624" y="363" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="638.25" y="363" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">could have checked but did</text><text x="638.25" y="383" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">not: still relying, <tspan font-style="italic">Redgrave v</tspan></text><text x="638.25" y="403" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Hurd</tspan> (1881)</text><text x="624" y="428" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="638.25" y="428" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">need not be the only reason</text><circle cx="736" cy="232" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="736" y="239.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="450" y="520" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">"The state of a man’s mind is as much a fact as the state of his digestion" (Bowen LJ, <tspan font-style="italic">Edgington</tspan>)</text>
</svg>