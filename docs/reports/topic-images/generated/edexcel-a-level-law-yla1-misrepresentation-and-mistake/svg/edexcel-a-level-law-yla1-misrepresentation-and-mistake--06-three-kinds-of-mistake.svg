<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 695" width="900" height="695" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="695" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three kinds of mistake</text>

<rect x="30" y="110" width="268" height="210" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="164" y="144" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Common</text><text x="164" y="168" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">both make the same mistake</text><circle cx="104" cy="232" r="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><path d="M82,272 Q82,250 104,250 Q126,250 126,272 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="224" cy="232" r="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><path d="M202,272 Q202,250 224,250 Q246,250 246,272 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><rect x="58" y="174" width="92" height="40" rx="20" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="104" y="200" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">X</text><rect x="178" y="174" width="92" height="40" rx="20" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="224" y="200" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">X</text><text x="164" y="300" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">both wrong about X</text><rect x="30" y="334" width="268" height="251" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="366" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64.25" y="366" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Res extincta</tspan>: <tspan font-style="italic">Couturier v</tspan></text><text x="64.25" y="386" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Hastie</tspan> (1856), void</text><text x="50" y="411" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64.25" y="411" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Res sua</tspan>: <tspan font-style="italic">Cooper v Phibbs</tspan></text><text x="64.25" y="431" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">(1867)</text><text x="50" y="456" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64.25" y="456" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Quality: almost never</text><text x="64.25" y="476" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">operative, <tspan font-style="italic">Bell v Lever Bros</tspan></text><text x="64.25" y="496" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">[1932]</text><text x="50" y="521" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64.25" y="521" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Great Peace</tspan> [2002]: only if</text><text x="64.25" y="541" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">performance essentially</text><text x="64.25" y="561" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">different or impossible</text><rect x="316" y="110" width="268" height="210" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="144" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Mutual</text><text x="450" y="168" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">at cross-purposes</text><circle cx="390" cy="232" r="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><path d="M368,272 Q368,250 390,250 Q412,250 412,272 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="510" cy="232" r="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><path d="M488,272 Q488,250 510,250 Q532,250 532,272 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><rect x="344" y="174" width="92" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="390" y="200" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">A</text><rect x="464" y="174" width="92" height="40" rx="20" fill="#dfe7f3" stroke="#2b5a9a" stroke-width="2.5"/><text x="510" y="200" font-size="16" font-weight="700" fill="#2b5a9a" text-anchor="middle">B</text><text x="450" y="300" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">each means something different</text><rect x="316" y="334" width="268" height="251" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="336" y="366" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="350.25" y="366" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Raffles v Wichelhaus</tspan> (1864):</text><text x="350.25" y="386" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">two ships called <tspan font-style="italic">Peerless</tspan></text><text x="336" y="411" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="350.25" y="411" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Scriven v Hindley</tspan> [1913]:</text><text x="350.25" y="431" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">hemp or tow, misleading</text><text x="350.25" y="451" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">catalogue</text><text x="336" y="476" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="350.25" y="476" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">If a reasonable person can</text><text x="350.25" y="496" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">find one meaning, there is a</text><text x="350.25" y="516" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">contract</text><rect x="602" y="110" width="268" height="210" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="736" y="144" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Unilateral</text><text x="736" y="168" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">one mistaken, the other knows</text><circle cx="676" cy="232" r="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><path d="M654,272 Q654,250 676,250 Q698,250 698,272 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="796" cy="232" r="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><path d="M774,272 Q774,250 796,250 Q818,250 818,272 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><rect x="630" y="174" width="92" height="40" rx="20" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="676" y="200" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">X?</text><rect x="750" y="174" width="92" height="40" rx="20" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="796" y="200" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">!</text><text x="736" y="300" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">the other party knows</text><rect x="602" y="334" width="268" height="251" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="622" y="366" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="636.25" y="366" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Terms: <tspan font-style="italic">Hartog v Colin and</tspan></text><text x="636.25" y="386" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Shields</tspan> [1939], per pound not</text><text x="636.25" y="406" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">per piece</text><text x="622" y="431" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="636.25" y="431" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Identity in writing: void,</text><text x="636.25" y="451" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Cundy v Lindsay</tspan>; <tspan font-style="italic">Shogun</tspan></text><text x="636.25" y="471" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Finance v Hudson</tspan> [2003]</text><text x="622" y="496" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="636.25" y="496" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Face to face: voidable,</text><text x="636.25" y="516" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Phillips v Brooks</tspan>; <tspan font-style="italic">Lewis v</tspan></text><text x="636.25" y="536" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Averay</tspan> (<tspan font-style="italic">Ingram v Little</tspan></text><text x="636.25" y="556" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">exceptional)</text><rect x="30" y="601" width="840" height="64" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="639" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Only an operative mistake affects validity; the law is reluctant to let a party escape.</text>
</svg>