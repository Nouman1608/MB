<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 534" width="900" height="534" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="534" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How the European Court reads the Convention</text>

<rect x="30" y="100" width="412" height="149" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LIVING INSTRUMENT</text><text x="48" y="156.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Tyrer v UK (1978)</text><text x="48" y="184.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Birching a juvenile on the Isle of Man was</text><text x="48" y="205.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">degrading; read “in the light of present-day</text><text x="48" y="226.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">conditions”.</text><rect x="458" y="100" width="412" height="149" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="476" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PRACTICAL AND EFFECTIVE</text><text x="476" y="156.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Airey v Ireland (1979)</text><text x="476" y="184.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Not “theoretical or illusory”: a woman who could</text><text x="476" y="205.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">not afford a lawyer for judicial separation had no</text><text x="476" y="226.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">real access to court.</text><rect x="30" y="263" width="412" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="293" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AUTONOMOUS MEANING</text><text x="48" y="319.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Engel v Netherlands (1976)</text><text x="48" y="347.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Words such as “criminal charge” have a</text><text x="48" y="368.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Convention meaning, whatever label a state uses.</text><rect x="458" y="263" width="412" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="476" y="293" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MARGIN OF APPRECIATION</text><text x="476" y="319.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Some discretion for states</text><text x="476" y="347.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Wider on moral or social questions; narrower</text><text x="476" y="368.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">where an especially important right is at stake.</text><rect x="30" y="413" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="447.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Proportionality</text><text x="450" y="477.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Any restriction must go no further than needed to meet its aim.</text>
</svg>