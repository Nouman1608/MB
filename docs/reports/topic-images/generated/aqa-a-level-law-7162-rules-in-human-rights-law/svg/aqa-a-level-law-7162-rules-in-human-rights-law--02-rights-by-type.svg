<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 654" width="900" height="654" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="654" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The type of right decides the test</text>

<rect x="30" y="100" width="250" height="420" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="155" y="136" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">ABSOLUTE</text><text x="155" y="158" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">for contrast</text><rect x="44" y="180" width="222" height="79" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="72" cy="219.5" r="19" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="72" y="226.34" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="102" y="205" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Torture, inhuman</text><text x="102" y="224" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">or degrading</text><text x="102" y="243" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">treatment</text><line x1="44" y1="390" x2="266" y2="390" stroke="#1e2a44" stroke-width="1.5" opacity="0.4"/><text x="48" y="416" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LIMITS</text><text x="48" y="442" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No balancing at all</text><rect x="295" y="100" width="260" height="420" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="425" y="136" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">LIMITED</text><rect x="309" y="180" width="232" height="56" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="337" cy="208" r="19" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="337" y="214.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="367" y="212.5" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Life</text><rect x="309" y="246" width="232" height="56" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="337" cy="274" r="19" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="337" y="280.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="367" y="278.5" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Liberty and security</text><line x1="309" y1="390" x2="541" y2="390" stroke="#1e2a44" stroke-width="1.5" opacity="0.4"/><text x="313" y="416" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LIMITS</text><text x="313" y="442" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Only in the ways the Article</text><text x="313" y="463" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">itself lists (2.2; 5.1 with</text><text x="313" y="484" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">safeguards in 5.2 to 5.5)</text><rect x="570" y="100" width="300" height="420" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="720" y="136" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">QUALIFIED</text><rect x="584" y="180" width="272" height="56" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="612" cy="208" r="19" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="612" y="214.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">8</text><text x="642" y="212.5" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Private and family life</text><rect x="584" y="246" width="272" height="56" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="612" cy="274" r="19" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="612" y="280.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">10</text><text x="642" y="278.5" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Expression</text><rect x="584" y="312" width="272" height="60" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="612" cy="342" r="19" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="612" y="348.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">11</text><text x="642" y="337" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Assembly and</text><text x="642" y="356" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">association</text><line x1="584" y1="390" x2="856" y2="390" stroke="#1e2a44" stroke-width="1.5" opacity="0.4"/><text x="588" y="416" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LIMITS</text><text x="588" y="442" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Prescribed by law, legitimate aim,</text><text x="588" y="463" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">necessary in a democratic society</text><rect x="30" y="542" width="840" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="575.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700" fill="#1e2a44">Common</tspan> <tspan font-weight="700" fill="#1e2a44">mistake:</tspan> applying “necessary in a democratic society” to Articles 2 or 5, which are</text><text x="450" y="597.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">limited rights.</text>
</svg>