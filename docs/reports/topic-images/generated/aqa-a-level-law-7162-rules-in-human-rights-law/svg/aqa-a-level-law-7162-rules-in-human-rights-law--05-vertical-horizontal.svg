<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="580" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Vertical and horizontal effect</text>

<rect x="30" y="100" width="840" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="200" y="138" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">VERTICAL</text><rect x="90" y="160" width="220" height="54" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="200" y="194" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">State / public authority</text><rect x="90" y="310" width="220" height="54" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="200" y="344" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Individual</text><line x1="200" y1="310" x2="200" y2="222" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="214" y="270" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">HRA s6</text><line x1="400" y1="130" x2="400" y2="370" stroke="#c9d6d4" stroke-width="2.5"/><text x="640" y="138" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">INDIRECT HORIZONTAL</text><rect x="500" y="160" width="280" height="54" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="640" y="194" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Court (a public authority)</text><rect x="440" y="310" width="170" height="54" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="525" y="344" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Model</text><rect x="680" y="310" width="170" height="54" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="765" y="344" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Newspaper</text><line x1="612" y1="337" x2="676" y2="337" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="678" y1="337" x2="614" y2="337" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="640" y1="222" x2="525" y2="304" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><line x1="640" y1="222" x2="765" y2="304" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><text x="640" y="288" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="middle">develops the law</text><rect x="30" y="422" width="412" height="126" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="452" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CAMPBELL v MGN (2004)</text><text x="48" y="483.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The House of Lords developed misuse of private</text><text x="48" y="504.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">information between a model and a newspaper</text><text x="48" y="525.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">by balancing Articles 8 and 10.</text><rect x="458" y="422" width="412" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="476" y="452" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">ARTICLE 14: NOT FREE-STANDING</text><text x="476" y="483.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Discrimination must be argued with another</text><text x="476" y="504.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Article: <tspan font-style="italic">A</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Home</tspan> <tspan font-style="italic">Secretary</tspan> (2004), detaining</text><text x="476" y="525.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">foreign nationals only, Article 14 with Article 5.</text>
</svg>