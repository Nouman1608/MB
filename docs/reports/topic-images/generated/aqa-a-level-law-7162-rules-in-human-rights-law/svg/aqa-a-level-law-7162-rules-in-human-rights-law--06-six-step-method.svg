<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" width="900" height="710" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="710" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A method for any human rights problem</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Repeat for each right the facts raise</text>
<line x1="60" y1="144" x2="60" y2="658" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="156.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Identify the right and the Article</text><text x="122" y="185.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Death, detention, surveillance, a ban on speech, a ban on a march</text><circle cx="60" cy="166" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="174.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="218" width="766" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="250.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Classify it: limited or qualified</text><text x="122" y="279.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">This tells you which test to apply</text><circle cx="60" cy="260" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="268.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="312" width="766" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="344.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Is the right engaged?</text><text x="122" y="373.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A deprivation of liberty? A reasonable expectation of privacy?</text><circle cx="60" cy="354" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="362.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="406" width="766" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="438.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Interference, or failure to protect?</text><text x="122" y="467.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Name the public authority, or the positive obligation in issue</text><circle cx="60" cy="448" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="456.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="500" width="766" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122" y="532.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Is it justified?</text><text x="122" y="561.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Listed exceptions for a limited right; three-part test for a qualified right</text><circle cx="60" cy="542" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="550.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="104" y="594" width="766" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="626.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Enforcement and remedy</text><text x="122" y="655.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Who can claim, in which court, and what they can obtain</text><circle cx="60" cy="636" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="644.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text>
</svg>