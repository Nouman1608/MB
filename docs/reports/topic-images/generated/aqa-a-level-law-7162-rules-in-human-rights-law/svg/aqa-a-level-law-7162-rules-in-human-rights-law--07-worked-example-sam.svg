<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 465" width="900" height="465" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="465" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: Sam, the anti-war organiser</text>

<rect x="30" y="100" width="412" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PHONE CALLS INTERCEPTED</text><text x="48" y="156.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Article 8: qualified</text><text x="48" y="184.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Interference. A vague local by-law power may</text><text x="48" y="205.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">not be “in accordance with the law” (accessible,</text><text x="48" y="226.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">foreseeable rules); if not, the analysis stops</text><text x="48" y="247.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">there.</text><rect x="458" y="100" width="412" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="476" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MARCH BANNED; ARRESTED FOR SPEAKING</text><text x="476" y="156.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Articles 10 and 11: qualified</text><text x="476" y="184.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Aim: preventing disorder. A total ban on a</text><text x="476" y="205.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">peaceful group needs strong evidence;</text><text x="476" y="226.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">conditions on route or time are less restrictive.</text><rect x="30" y="284" width="412" height="149" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="314" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">HELD 40 HOURS BEFORE A JUDGE</text><text x="48" y="340.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Article 5: limited</text><text x="48" y="368.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Arrest needs a 5.1(c) ground (reasonable</text><text x="48" y="389.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">suspicion) and prompt appearance before a</text><text x="48" y="410.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">judge (5.3).</text><rect x="458" y="284" width="412" height="149" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="476" y="314" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">REMEDY</text><text x="476" y="340.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Human Rights Act 1998</text><text x="476" y="368.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Police are a public authority (s6); Sam is a victim</text><text x="476" y="389.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(s7); damages or a declaration (s8).</text>
</svg>