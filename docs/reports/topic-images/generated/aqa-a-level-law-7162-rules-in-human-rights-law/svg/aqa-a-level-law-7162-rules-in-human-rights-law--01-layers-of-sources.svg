<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 753" width="900" height="753" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="753" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Where human rights rules come from</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Name the layer you are using</text>
<rect x="30" y="124" width="840" height="86" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="52" y="160" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The Convention text</text><text x="52" y="188" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The rights and their permitted limits</text><line x1="500" y1="140" x2="500" y2="194" stroke="#1e2a44" stroke-width="1.5" opacity="0.4"/><text x="516" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXAMPLE</text><text x="516" y="176" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Article 10.1 and 10.2</text><rect x="30" y="220" width="840" height="86" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="52" y="256" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Strasbourg case law</text><text x="52" y="284" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The meaning and scope of each right</text><line x1="500" y1="236" x2="500" y2="290" stroke="#1e2a44" stroke-width="1.5" opacity="0.4"/><text x="516" y="248" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXAMPLE</text><text x="516" y="272" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Handyside</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">UK</tspan> (1976): expression that</text><text x="516" y="293" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">offends</text><rect x="30" y="316" width="840" height="86" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="52" y="352" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Human Rights Act 1998</text><text x="52" y="380" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The domestic route to rely on Convention rights</text><line x1="500" y1="332" x2="500" y2="386" stroke="#1e2a44" stroke-width="1.5" opacity="0.4"/><text x="516" y="344" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXAMPLE</text><text x="516" y="368" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Section 6 duty on public authorities</text><rect x="30" y="412" width="840" height="86" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="52" y="448" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Statute</text><text x="52" y="476" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Specific powers that protect or restrict rights</text><line x1="500" y1="428" x2="500" y2="482" stroke="#1e2a44" stroke-width="1.5" opacity="0.4"/><text x="516" y="440" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXAMPLE</text><text x="516" y="464" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">PACE 1984 on arrest and detention</text><rect x="30" y="508" width="840" height="86" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="52" y="544" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Common law</text><text x="52" y="572" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rights and liberties recognised by English judges</text><line x1="500" y1="524" x2="500" y2="578" stroke="#1e2a44" stroke-width="1.5" opacity="0.4"/><text x="516" y="536" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXAMPLE</text><text x="516" y="560" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Entick</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Carrington</tspan> (1765); <tspan font-style="italic">Derbyshire</tspan> <tspan font-style="italic">CC</tspan> <tspan font-style="italic">v</tspan></text><text x="516" y="581" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Times</tspan> <tspan font-style="italic">Newspapers</tspan> (1993)</text><rect x="30" y="616" width="412" height="105" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="646" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COMMON LAW: DERBYSHIRE CC v TIMES (1993)</text><text x="48" y="677.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A local authority cannot sue for defamation: it</text><text x="48" y="698.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">would chill free speech about government.</text><rect x="458" y="616" width="412" height="105" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="476" y="646" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PRINCIPLE OF LEGALITY: SIMMS (1999)</text><text x="476" y="677.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Parliament must use clear words to override</text><text x="476" y="698.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fundamental rights; general words do not.</text>
</svg>