<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="610" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Negative and positive obligations</text>

<rect x="30" y="100" width="410" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="100" width="410" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="136" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Negative</text><text x="235" y="160" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">do not interfere without justification</text><path d="M74,280 L74,230 L120,204 L166,230 L166,280 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="120" y="260" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">STATE</text><circle cx="350" cy="210" r="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><path d="M350,222 L350,254 M334,234 L366,234 M350,254 L337,276 M350,254 L363,276" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><line x1="180" y1="245" x2="315" y2="245" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><line x1="232" y1="224" x2="262" y2="266" stroke="#b5602e" stroke-width="4"/><line x1="262" y1="224" x2="232" y2="266" stroke="#b5602e" stroke-width="4"/><text x="350" y="310" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">individual</text><text x="120" y="310" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">every right</text><text x="665" y="136" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Positive</text><text x="665" y="160" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">take steps to protect the right</text><path d="M474,280 L474,230 L520,204 L566,230 L566,280 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="520" y="260" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">STATE</text><circle cx="630" cy="210" r="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><path d="M630,222 L630,254 M614,234 L646,234 M630,254 L617,276 M630,254 L643,276" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="810" cy="210" r="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><path d="M810,222 L810,254 M794,234 L826,234 M810,254 L797,276 M810,254 L823,276" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="694" y="192" width="12" height="100" rx="4" fill="#2e6b62"/><path d="M548,212 Q620,150 696,186" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><line x1="788" y1="245" x2="714" y2="245" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)" stroke-dasharray="7 6"/><text x="630" y="310" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">individual</text><text x="810" y="310" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">private person</text><text x="520" y="310" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">many rights</text><rect x="30" y="372" width="270.6666666666667" height="206" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="400" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ARTICLE 8</text><text x="46" y="425.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">X and Y v Netherlands</text><text x="46" y="446.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">(1985)</text><text x="46" y="473.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A gap in Dutch criminal law</text><text x="46" y="494.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">meant no prosecution for a</text><text x="46" y="515.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sexual assault: breach for</text><text x="46" y="536.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">failing to provide effective</text><text x="46" y="557.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">protection.</text><rect x="314.6666666666667" y="372" width="270.6666666666667" height="206" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330.6666666666667" y="400" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ARTICLE 2</text><text x="330.6666666666667" y="425.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Osman v UK (1998)</text><text x="330.6666666666667" y="452.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Protect from a real and</text><text x="330.6666666666667" y="473.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">immediate risk to life the</text><text x="330.6666666666667" y="494.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">authorities knew or ought to</text><text x="330.6666666666667" y="515.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">have known about; investigate</text><text x="330.6666666666667" y="536.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">deaths.</text><rect x="599.3333333333334" y="372" width="270.6666666666667" height="206" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="615.3333333333334" y="400" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ARTICLE 11</text><text x="615.3333333333334" y="425.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Counter-protesters</text><text x="615.3333333333334" y="452.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The state may need to protect</text><text x="615.3333333333334" y="473.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a lawful demonstration from</text><text x="615.3333333333334" y="494.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">violent counter-protesters.</text>
</svg>