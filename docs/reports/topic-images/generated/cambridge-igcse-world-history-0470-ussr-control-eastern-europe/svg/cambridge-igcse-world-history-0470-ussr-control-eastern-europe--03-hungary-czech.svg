<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 671" width="900" height="671" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="671" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Hungary 1956 and Czechoslovakia 1968</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">How similar were they?</text>
<clipPath id="tc124"><rect x="30" y="124" width="840" height="404" rx="14"/></clipPath><g clip-path="url(#tc124)"><rect x="30" y="124" width="189.67741935483872" height="48" fill="#b5d3cf"/><rect x="219.67741935483872" y="124" width="325.16129032258067" height="48" fill="#f3dccd"/><text x="233.67741935483872" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Hungary 1956</text><rect x="544.8387096774194" y="124" width="325.16129032258067" height="48" fill="#f2e7b8"/><text x="558.8387096774194" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Czechoslovakia 1968</text><rect x="30" y="172" width="189.67741935483872" height="46" fill="#dce9e7"/><text x="44" y="198" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Trigger</text><rect x="219.67741935483872" y="172" width="325.16129032258067" height="46" fill="#ffffff"/><text x="233.67741935483872" y="198" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">De-Stalinisation; fall of Rákosi</text><rect x="544.8387096774194" y="172" width="325.16129032258067" height="46" fill="#ffffff"/><text x="558.8387096774194" y="198" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Economic stagnation; Dubček's reforms</text><line x1="30" y1="218" x2="870" y2="218" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="218" width="189.67741935483872" height="66" fill="#dce9e7"/><text x="44" y="244" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Leaders' aim</text><rect x="219.67741935483872" y="218" width="325.16129032258067" height="66" fill="#f8faf9"/><text x="233.67741935483872" y="244" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Free elections, many parties, leave the</text><text x="233.67741935483872" y="264" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Warsaw Pact</text><rect x="544.8387096774194" y="218" width="325.16129032258067" height="66" fill="#f8faf9"/><text x="558.8387096774194" y="244" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Reformed communism inside the Warsaw</text><text x="558.8387096774194" y="264" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Pact</text><line x1="30" y1="284" x2="870" y2="284" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="284" width="189.67741935483872" height="66" fill="#dce9e7"/><text x="44" y="310" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Invaded by</text><rect x="219.67741935483872" y="284" width="325.16129032258067" height="66" fill="#ffffff"/><text x="233.67741935483872" y="310" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Soviet forces</text><rect x="544.8387096774194" y="284" width="325.16129032258067" height="66" fill="#ffffff"/><text x="558.8387096774194" y="310" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Soviet and other Warsaw Pact forces</text><text x="558.8387096774194" y="330" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">(20-21 August)</text><line x1="30" y1="350" x2="870" y2="350" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="350" width="189.67741935483872" height="66" fill="#dce9e7"/><text x="44" y="376" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Resistance</text><rect x="219.67741935483872" y="350" width="325.16129032258067" height="66" fill="#f8faf9"/><text x="233.67741935483872" y="376" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Armed street fighting</text><rect x="544.8387096774194" y="350" width="325.16129032258067" height="66" fill="#f8faf9"/><text x="558.8387096774194" y="376" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Mainly passive: street signs removed;</text><text x="558.8387096774194" y="396" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Jan Palach (1969)</text><line x1="30" y1="416" x2="870" y2="416" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="416" width="189.67741935483872" height="66" fill="#dce9e7"/><text x="44" y="442" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Result</text><rect x="219.67741935483872" y="416" width="325.16129032258067" height="66" fill="#ffffff"/><text x="233.67741935483872" y="442" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Thousands dead; Nagy executed</text><rect x="544.8387096774194" y="416" width="325.16129032258067" height="66" fill="#ffffff"/><text x="558.8387096774194" y="442" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Far fewer deaths; Dubček replaced by</text><text x="558.8387096774194" y="462" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Husák; Brezhnev Doctrine</text><line x1="30" y1="482" x2="870" y2="482" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="482" width="189.67741935483872" height="46" fill="#dce9e7"/><text x="44" y="508" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">The West</text><rect x="219.67741935483872" y="482" width="325.16129032258067" height="46" fill="#f8faf9"/><text x="233.67741935483872" y="508" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Sympathy, no action; Suez</text><rect x="544.8387096774194" y="482" width="325.16129032258067" height="46" fill="#f8faf9"/><text x="558.8387096774194" y="508" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Condemnation, no action</text></g><line x1="219.67741935483872" y1="124" x2="219.67741935483872" y2="528" stroke="#c9d6d4" stroke-width="1.5"/><line x1="544.8387096774194" y1="124" x2="544.8387096774194" y2="528" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="124" width="840" height="404" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="550" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="584.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">The key difference</text><text x="450" y="614.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Hungary challenged <tspan font-weight="700" fill="#1e2a44">Soviet</tspan> <tspan font-weight="700" fill="#1e2a44">security</tspan>; Czechoslovakia challenged the <tspan font-weight="700" fill="#1e2a44">model</tspan> <tspan font-weight="700" fill="#1e2a44">of</tspan> <tspan font-weight="700" fill="#1e2a44">communism</tspan>.</text>
</svg>