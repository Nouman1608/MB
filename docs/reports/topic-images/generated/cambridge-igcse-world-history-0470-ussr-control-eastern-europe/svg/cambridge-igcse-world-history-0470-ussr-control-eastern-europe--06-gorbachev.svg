<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 668" width="900" height="668" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="668" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How far was Gorbachev responsible?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The essential trigger, not the sole cause</text>
<line x1="320" y1="196.5" x2="408" y2="278.4" stroke="#1e2a44" stroke-width="2.5"/><line x1="320" y1="334.5" x2="408" y2="319.8" stroke="#1e2a44" stroke-width="2.5"/><line x1="320" y1="451.5" x2="408" y2="354.9" stroke="#1e2a44" stroke-width="2.5"/><line x1="580" y1="244.5" x2="492" y2="292.8" stroke="#1e2a44" stroke-width="2.5"/><line x1="580" y1="393" x2="492" y2="337.35" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="313.5" r="84" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="450" y="297.84000000000003" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Collapse</text><text x="450" y="319.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">of control,</text><text x="450" y="341.76000000000005" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1989</text><rect x="30" y="124" width="290" height="145" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="46" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GORBACHEV</text><text x="46" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">No more force</text><text x="46" y="206.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Glasnost, perestroika; Brezhnev</text><text x="46" y="227.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Doctrine abandoned; no tanks in</text><text x="46" y="248.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1989</text><rect x="30" y="283" width="290" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="311" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LONG-TERM</text><text x="46" y="337.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Force, not consent</text><text x="46" y="365.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">As 1956 and 1968 showed</text><rect x="30" y="400" width="290" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="428" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AFGHANISTAN</text><text x="46" y="454.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">From 1979</text><text x="46" y="482.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Drained resources and morale</text><rect x="580" y="172" width="290" height="145" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="596" y="200" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ECONOMY</text><text x="596" y="226.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Stagnation</text><text x="596" y="254.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Could not subsidise Eastern</text><text x="596" y="275.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Europe or match Reagan's arms</text><text x="596" y="296.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">race</text><rect x="580" y="331" width="290" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="596" y="359" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PEOPLE</text><text x="596" y="385.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Popular movements</text><text x="596" y="413.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Solidarity; Leipzig and Prague;</text><text x="596" y="434.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Hungary opens its border (1989)</text><rect x="30" y="525" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="559.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement</text><text x="50" y="589.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Gorbachev hoped to <tspan font-weight="700" fill="#1e2a44">reform</tspan> communism; his refusal to use force let the long-term pressures</text><text x="50" y="611.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">succeed.</text>
</svg>