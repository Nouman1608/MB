<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" width="900" height="780" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="780" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Hungary, 1956</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Why opposition grew, and why the USSR struck</text>
<rect x="30" y="124" width="411" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GRIEVANCES</text><text x="50" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Rákosi's rule</text><text x="50" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">ÁVH terror, collectivisation, shortages, Soviet</text><text x="50" y="231.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">troops; national and Catholic pride</text><rect x="459" y="124" width="411" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">HOPE</text><text x="479" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">De-Stalinisation</text><text x="479" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Secret Speech (February 1956); Rákosi removed</text><text x="479" y="231.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(July); unrest in Poland</text><line x1="60" y1="298" x2="60" y2="595" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="278" width="766" height="107" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="308" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">23 OCTOBER</text><text x="122" y="334.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Demonstrations in Budapest</text><text x="122" y="362.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Stalin's statue pulled down; Nagy prime minister; Soviet troops withdraw</text><circle cx="60" cy="331.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="340.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="393" width="766" height="107" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122" y="423" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1 NOVEMBER</text><text x="122" y="449.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Hungary to leave the Warsaw Pact</text><text x="122" y="477.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Free elections and other parties promised; neutrality</text><circle cx="60" cy="446.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="455.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="508" width="766" height="107" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="538" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">4 NOVEMBER</text><text x="122" y="564.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Soviet tanks enter Budapest</text><text x="122" y="592.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Thousands killed; about 200,000 flee; Kádár installed; Nagy executed (1958)</text><circle cx="60" cy="561.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="570.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="30" y="637" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="671.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Why so harsh, and why no help</text><text x="50" y="701.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Leaving the Pact threatened the whole buffer zone; the West was divided by Suez and would not</text><text x="50" y="723.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">risk war.</text>
</svg>