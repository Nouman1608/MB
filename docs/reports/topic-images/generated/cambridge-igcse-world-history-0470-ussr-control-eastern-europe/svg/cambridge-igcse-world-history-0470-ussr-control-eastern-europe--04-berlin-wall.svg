<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 571" width="900" height="571" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="571" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why the Berlin Wall was built</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">From open border to sealed city, 1949-61</text>
<rect x="30" y="124" width="189" height="171" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="43" y="157" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1949-61</text><text x="43" y="182.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Millions leave via</text><text x="43" y="203.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Berlin</text><text x="43" y="230" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Many young and</text><text x="43" y="250" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">skilled: doctors,</text><text x="43" y="270" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">engineers, teachers</text><line x1="225" y1="209.5" x2="241" y2="209.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="247" y="124" width="189" height="171" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="260" y="150.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">East Germany</text><text x="260" y="171.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">drained</text><text x="260" y="198" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Economy damaged;</text><text x="260" y="218" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">West Berlin's</text><text x="260" y="238" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">prosperity</text><text x="260" y="258" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">embarrasses</text><text x="260" y="278" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">communism</text><line x1="442" y1="209.5" x2="458" y2="209.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="464" y="124" width="189" height="171" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="167.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1958; JUNE 1961</text><text x="477" y="192.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Diplomacy fails</text><text x="477" y="219.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Khrushchev's</text><text x="477" y="239.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">demands; Vienna</text><text x="477" y="259.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">meeting with Kennedy</text><line x1="659" y1="209.5" x2="675" y2="209.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="681" y="124" width="189" height="171" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="694" y="167.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">12-13 AUGUST 1961</text><text x="694" y="192.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Border sealed</text><text x="694" y="219.5" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Barbed wire, then a</text><text x="694" y="239.5" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">wall, watchtowers, a</text><text x="694" y="259.5" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">"death strip"</text><rect x="30" y="317" width="411" height="111" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="349" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FOR MOSCOW</text><text x="50" y="375.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">East Germany stabilised</text><text x="50" y="403.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The exodus stopped</text><rect x="459" y="317" width="411" height="111" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="479" y="349" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AGAINST</text><text x="479" y="375.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A symbol of failure</text><text x="479" y="403.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A system that had to imprison its own people</text><rect x="30" y="450" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="484.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Not to keep spies out</text><text x="450" y="514.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">East Germany claimed this; its purpose was to stop emigration.</text>
</svg>