<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 553" width="900" height="553" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="553" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The mischief rule: Heydon’s four questions</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Heydon’s Case (1584)</text>
<rect x="30" y="124" width="187.5" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1</text><text x="44" y="175.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">What was the</text><text x="44" y="196.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">common law</text><text x="44" y="217.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">before the Act?</text><line x1="223.5" y1="179.5" x2="241.5" y2="179.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="247.5" y="124" width="187.5" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="261.5" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">2</text><text x="261.5" y="175.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">What was the</text><text x="261.5" y="196.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">mischief or</text><text x="261.5" y="217.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">defect?</text><line x1="441" y1="179.5" x2="459" y2="179.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="465" y="124" width="187.5" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">3</text><text x="479" y="175.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">What remedy did</text><text x="479" y="196.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Parliament</text><text x="479" y="217.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">choose?</text><line x1="658.5" y1="179.5" x2="676.5" y2="179.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="682.5" y="124" width="187.5" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="696.5" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">4</text><text x="696.5" y="175.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">What was the true</text><text x="696.5" y="196.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">reason for the</text><text x="696.5" y="217.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">remedy?</text><line x1="450" y1="241" x2="450" y2="261" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="170" y="279" width="560" height="52" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="309.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Interpret the Act to suppress the mischief</text><rect x="30" y="353" width="412" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="383" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RCN v DHSS (1981)</text><text x="48" y="414.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Abortion Act 1967: “registered medical</text><text x="48" y="435.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">practitioner”. Nurses under a doctor’s</text><text x="48" y="456.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">supervision acted lawfully, because the mischief</text><text x="48" y="477.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">was <tspan font-weight="700" fill="#1e2a44">unsafe</tspan> <tspan font-weight="700" fill="#1e2a44">backstreet</tspan> <tspan font-weight="700" fill="#1e2a44">abortions</tspan>. A majority</text><text x="48" y="498.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">decision.</text><rect x="458" y="353" width="412" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="476" y="383" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ELLIOTT v GREY (1960)</text><text x="476" y="414.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A car on a road with wheels off the ground and</text><text x="476" y="435.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">no battery was “used on a road”: the Act aimed</text><text x="476" y="456.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to protect people from <tspan font-weight="700" fill="#1e2a44">uninsured</tspan> <tspan font-weight="700" fill="#1e2a44">vehicles</tspan> that</text><text x="476" y="477.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">could cause a hazard.</text>
</svg>