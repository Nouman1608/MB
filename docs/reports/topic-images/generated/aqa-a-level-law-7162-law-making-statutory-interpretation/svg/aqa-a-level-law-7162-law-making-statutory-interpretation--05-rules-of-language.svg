<rect width="900" height="598" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Rules of language: read the words around the word</text>

<rect x="30" y="100" width="840" height="146" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="138" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">Ejusdem generis</text><text x="224.44" y="138" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">(general words take the kind of the list)</text><rect x="50" y="156" width="72.24000000000001" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="86.12" y="176.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">house</text><rect x="130.24" y="156" width="69.824" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="165.15200000000002" y="176.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">office</text><rect x="208.06400000000002" y="156" width="64.73599999999999" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="240.43200000000002" y="176.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">room</text><rect x="280.8" y="156" width="132.24" height="30" rx="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="346.92" y="176.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">or other place</text><text x="50" y="222" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Powell</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Kempton</tspan> <tspan font-style="italic">Park</tspan> <tspan font-style="italic">Racecourse</tspan> (1899): indoor places only, so an outdoor enclosure was not covered</text><rect x="30" y="260" width="840" height="146" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="298" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">Expressio unius est exclusio alterius</text><text x="417.42" y="298" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">(expressing one thing excludes others)</text><rect x="50" y="316" width="66.64" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="83.32" y="336.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">lands</text><rect x="124.64" y="316" width="81.2" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="165.24" y="336.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">houses</text><rect x="213.84" y="316" width="108.048" height="30" rx="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="267.86400000000003" y="336.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">coal mines</text><text x="50" y="382" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Inhabitants</tspan> <tspan font-style="italic">of</tspan> <tspan font-style="italic">Sedgley</tspan> (1831): the rate did not apply to other kinds of mine</text><rect x="30" y="420" width="840" height="146" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="458" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">Noscitur a sociis</text><text x="224.16" y="458" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">(a word is known by the company it keeps)</text><rect x="50" y="476" width="84.56" height="30" rx="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="92.28" y="496.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">interest</text><rect x="142.56" y="476" width="96.224" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="190.672" y="496.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">annuities</text><rect x="246.784" y="476" width="224.144" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="358.856" y="496.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">or other annual payments</text><text x="50" y="542" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">IRC</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Frere</tspan> (1965): meant annual interest only</text>
