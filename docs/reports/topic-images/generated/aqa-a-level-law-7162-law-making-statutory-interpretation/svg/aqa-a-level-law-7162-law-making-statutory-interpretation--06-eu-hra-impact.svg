<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 546" width="900" height="546" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="546" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Interpretation under EU law and the Human Rights Act</text>

<rect x="30" y="100" width="840" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EU LAW (WHILE A MEMBER)</text><text x="48" y="161.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Interpret national law so far as possible to give effect to EU law: pushed judges towards <tspan font-weight="700" fill="#1e2a44">purposive</tspan></text><text x="48" y="182.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reasoning, even reading words in. Since withdrawal the duty has largely gone for new law; the legacy is</text><text x="48" y="203.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">comfort with purpose over literal wording.</text><rect x="30" y="250" width="840" height="108" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="280" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">HUMAN RIGHTS ACT 1998, SECTION 3</text><text x="48" y="306.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Read compatibly with Convention rights “so far as it is possible to do so”</text><text x="48" y="335.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Goes further than the ordinary rules: applies even where the words are not ambiguous</text><line x1="450" y1="364" x2="450" y2="384" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="462" y="379" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">impossible?</text><rect x="30" y="406" width="410" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="235" y="436" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">SECTION 4</text><text x="235" y="462.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Declaration of incompatibility</text><text x="235" y="491.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">by the higher courts</text><rect x="460" y="406" width="410" height="108" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="665" y="436" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">COMMON MISTAKE</text><text x="665" y="462.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Courts cannot strike down the Act</text><text x="665" y="491.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Section 3 is not a power to set Acts aside</text>
</svg>