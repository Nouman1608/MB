<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 613" width="900" height="613" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="613" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The golden rule: narrow and broad approaches</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Start with the literal meaning; modify it only to avoid absurdity</text>
<rect x="30" y="124" width="410" height="108" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NARROW APPROACH</text><text x="48" y="180.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Word has more than one meaning</text><text x="48" y="209.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Choose the meaning that avoids absurdity</text><rect x="460" y="124" width="410" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="478" y="154" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">BROAD APPROACH</text><text x="478" y="180.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Word has only one meaning</text><text x="478" y="209.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Modify it anyway to avoid a repugnant result</text><rect x="30" y="250" width="410" height="143" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="278" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">R v ALLEN (1872)</text><text x="46" y="309.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Bigamy: a married person who “shall marry”</text><text x="46" y="330.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">another. Read as <tspan font-weight="700" fill="#1e2a44">“go</tspan> <tspan font-weight="700" fill="#1e2a44">through</tspan> <tspan font-weight="700" fill="#1e2a44">a</tspan> <tspan font-weight="700" fill="#1e2a44">ceremony</tspan> <tspan font-weight="700" fill="#1e2a44">of</tspan></text><text x="46" y="351.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">marriage”</tspan>, since a second valid marriage is</text><text x="46" y="372.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">impossible.</text><rect x="460" y="250" width="410" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="476" y="278" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RE SIGSWORTH (1935)</text><text x="476" y="309.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A son who murdered his mother could not inherit</text><text x="476" y="330.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">as her “issue”.</text><rect x="460" y="361" width="410" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="476" y="389" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">R v REGISTRAR GENERAL, ex p SMITH (1991)</text><text x="476" y="420.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Statutory right to a birth certificate refused: real</text><text x="476" y="441.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">risk he would harm his birth mother.</text><rect x="30" y="480" width="840" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="508" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ADLER v GEORGE (1964)</text><text x="46" y="539.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Obstructing armed forces “in the vicinity of” a prohibited place; the defendant was inside the base. Read</text><text x="46" y="560.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">as <tspan font-weight="700" fill="#1e2a44">“in</tspan> <tspan font-weight="700" fill="#1e2a44">or</tspan> <tspan font-weight="700" fill="#1e2a44">in</tspan> <tspan font-weight="700" fill="#1e2a44">the</tspan> <tspan font-weight="700" fill="#1e2a44">vicinity</tspan> <tspan font-weight="700" fill="#1e2a44">of”</tspan>.</text>
</svg>