<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 453" width="900" height="453" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="453" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four approaches: from the words to the purpose</text>

<defs><linearGradient id="spg" x1="0" x2="1"><stop offset="0" stop-color="#dce9e7"/><stop offset="1" stop-color="#d4b02e"/></linearGradient></defs><path d="M30,100 L830,100 L830,88 L870,122 L830,156 L830,144 L30,144 Z" fill="url(#spg)" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="50" y="129" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">THE WORDS</text><text x="810" y="129" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">THE PURPOSE</text><rect x="30" y="164" width="201" height="157" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="190" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LITERAL</text><text x="44" y="215.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Plain, ordinary</text><text x="44" y="236.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">meaning</text><text x="44" y="263" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Even if absurd. <tspan font-style="italic">Whiteley</tspan></text><text x="44" y="283" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">v</tspan> <tspan font-style="italic">Chappell</tspan>: a dead man</text><text x="44" y="303" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">is not “entitled to vote”</text><rect x="243" y="164" width="201" height="157" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="257" y="190" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GOLDEN</text><text x="257" y="215.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Literal, unless</text><text x="257" y="236.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">absurd or repugnant</text><text x="257" y="263" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Adler</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">George</tspan>: “in the</text><text x="257" y="283" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">vicinity of” read as “in</text><text x="257" y="303" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">or in the vicinity of”</text><rect x="456" y="164" width="201" height="157" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="470" y="190" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MISCHIEF</text><text x="470" y="215.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Suppress the defect</text><text x="470" y="236.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Parliament targeted</text><text x="470" y="263" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Heydon’s</tspan> <tspan font-style="italic">Case</tspan> (1584);</text><text x="470" y="283" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Elliott</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Grey</tspan></text><rect x="669" y="164" width="201" height="157" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="683" y="190" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">PURPOSIVE</text><text x="683" y="215.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Purpose of the Act</text><text x="683" y="236.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">as a whole</text><text x="683" y="263" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Quintavalle</tspan> (2003):</text><text x="683" y="283" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">cloned embryos</text><text x="683" y="303" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">regulated</text><rect x="30" y="341" width="840" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="374.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">The purposive approach is now <tspan font-weight="700" fill="#1e2a44">dominant</tspan>; it is wider than the mischief rule because it is not limited</text><text x="450" y="396.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">to a defect in the earlier law.</text>
</svg>