<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 638" width="900" height="638" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="638" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Applying the rules: Mia’s electric wheelchair</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">“It is an offence to ride a bicycle, scooter or other vehicle on a footpath.”</text>
<rect x="30" y="124" width="640" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="152.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Literal</text><text x="44" y="180.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“Vehicle” in its ordinary meaning could include a wheelchair</text><rect x="690" y="124" width="180" height="75" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="780" y="168.5" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">Guilty?</text><line x1="674" y1="161.5" x2="686" y2="161.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="209" width="640" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="237.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ejusdem generis</text><text x="44" y="265.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Bicycle, scooter: recreational ridden devices. A mobility aid may not be of the</text><text x="44" y="286.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">same kind</text><rect x="690" y="209" width="180" height="96" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="780" y="264" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Likely not guilty</text><line x1="674" y1="257" x2="686" y2="257" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="315" width="640" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="343.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Golden</text><text x="44" y="371.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Convicting disabled people for using footpaths would be absurd</text><rect x="690" y="315" width="180" height="75" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="780" y="359.5" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Likely not guilty</text><line x1="674" y1="352.5" x2="686" y2="352.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="400" width="640" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="428.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Mischief / purposive</text><text x="44" y="456.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Aim: protect pedestrians from cyclists and scooter riders, not mobility aids</text><rect x="690" y="400" width="180" height="75" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="780" y="444.5" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Likely not guilty</text><line x1="674" y1="437.5" x2="686" y2="437.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="495" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="529.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Conclusion</text><text x="50" y="559.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Most approaches suggest not guilty; the literal rule is the outlier. Each rule is <tspan font-weight="700" fill="#1e2a44">named,</tspan> <tspan font-weight="700" fill="#1e2a44">defined,</tspan></text><text x="50" y="581.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">applied</tspan> <tspan font-weight="700" fill="#1e2a44">and</tspan> <tspan font-weight="700" fill="#1e2a44">given</tspan> <tspan font-weight="700" fill="#1e2a44">a</tspan> <tspan font-weight="700" fill="#1e2a44">result</tspan>.</text>
</svg>