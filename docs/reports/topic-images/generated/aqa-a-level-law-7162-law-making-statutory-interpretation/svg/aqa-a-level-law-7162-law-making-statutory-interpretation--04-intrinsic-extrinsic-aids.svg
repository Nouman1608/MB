and historical</text><text x="58" y="321.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">setting</text><rect x="46" y="366" width="236" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="58" y="402.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Hansard</tspan>, within <tspan font-style="italic">Pepper</tspan> <tspan font-style="italic">v</tspan></text><text x="58" y="423.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Hart</tspan></text><rect x="618" y="162" width="236" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="630" y="188.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Law Commission and</text><text x="630" y="209.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">committee reports</text><text x="630" y="230.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(<tspan font-style="italic">Black-Clawson</tspan>)</text><rect x="618" y="264" width="236" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="630" y="300.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Explanatory notes</text><text x="630" y="321.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(<tspan font-style="italic">Westminster</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">NASS</tspan>)</text><rect x="618" y="366" width="236" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="630" y="402.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Treaties the Act gives</text><text x="630" y="423.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">effect to</text><text x="30" y="522" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Hansard may be used only if (Pepper v Hart, 1993):</text><rect x="30" y="538" width="270.6666666666667" height="66" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="165.33333333333334" y="575.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">The Act is ambiguous</text><rect x="314.6666666666667" y="538" width="270.6666666666667" height="66" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="565.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">The statement is by a</text><text x="450" y="586.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">minister or promoter</text><rect x="599.3333333333334" y="538" width="270.6666666666667" height="66" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="734.6666666666667" y="575.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">The statement is clear</text>
