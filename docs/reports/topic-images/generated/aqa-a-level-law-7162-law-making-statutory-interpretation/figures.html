<figure class="topic-figure">
  <img src="https://img.marlbridge.com/aqa-a-level-law-7162-law-making-statutory-interpretation--01-approaches-spectrum.webp" width="900" height="453" alt="Four approaches on a scale from the words to the purpose: the literal rule (plain meaning, Whiteley v Chappell), the golden rule (literal unless absurd, Adler v George), the mischief rule (Heydon’s Case, Elliott v Grey) and the purposive approach (Quintavalle), which is now dominant." loading="lazy">

<!-- place after: ## The golden rule -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/aqa-a-level-law-7162-law-making-statutory-interpretation--02-golden-rule.webp" width="900" height="613" alt="The golden rule has a narrow approach, choosing between meanings to avoid absurdity, as in R v Allen (“shall marry” meaning a ceremony), and a broad approach, modifying a single meaning to avoid repugnance, as in Re Sigsworth and ex p Smith. In Adler v George “in the vicinity of” was read as “in or in the vicinity of”." loading="lazy">
  <figcaption>Narrow: pick the sensible meaning. Broad: change the only meaning to avoid a repugnant result.</figcaption>
</figure>

<!-- place after: ## The mischief rule -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/aqa-a-level-law-7162-law-making-statutory-interpretation--03-mischief-rule.webp" width="900" height="553" alt="Heydon’s Case asks four questions: the common law before the Act, the mischief or defect, the remedy Parliament chose, and the true reason for it; the court then interprets the Act to suppress the mischief. In RCN v DHSS nurses’ involvement was lawful because the mischief was backstreet abortions; in Elliott v Grey a car with no battery was “used on a road”." loading="lazy">
  <figcaption>Find the defect the Act was passed to cure, then read the words to cure it.</figcaption>
</figure>

<!-- place after: ## Intrinsic and extrinsic aids -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/aqa-a-level-law-7162-law-making-statutory-interpretation--04-intrinsic-extrinsic-aids.webp" width="900" height="636" alt="The Act in the centre holds the intrinsic aids: long and short titles, preamble, headings, interpretation sections and schedules. Around it are extrinsic aids: dictionaries of the time, earlier Acts, Hansard, Law Commission reports (Black-Clawson), explanatory notes (Westminster v NASS) and treaties. Hansard is limited by Pepper v Hart to ambiguous Acts and clear statements by a minister or promoter." loading="lazy">
  <figcaption>Intrinsic aids are in the Act; extrinsic aids come from outside it, Hansard only on the Pepper v Hart conditions.</figcaption>
</figure>

<!-- place after: ## Intrinsic and extrinsic aids -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/aqa-a-level-law-7162-law-making-statutory-interpretation--05-rules-of-language.webp" width="900" height="598" alt="Three rules of language. Ejusdem generis: “house, office, room or other place” covered indoor places only (Powell v Kempton Park). Expressio unius: “lands, houses and coal mines” excluded other mines (R v Inhabitants of Sedgley). Noscitur a sociis: “interest” among annual payments meant annual interest only (IRC v Frere)." loading="lazy">
  <figcaption>The surrounding words limit the meaning of the word in question.</figcaption>
</figure>

<!-- place after: ## Impact of EU law and the Human Rights Act 1998 -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/aqa-a-level-law-7162-law-making-statutory-interpretation--06-eu-hra-impact.webp" width="900" height="546" alt="EU law, while the UK was a member, required national law to be read so far as possible to give effect to EU law, encouraging purposive reasoning. Section 3 of the Human Rights Act requires a Convention-compatible reading so far as possible, even without ambiguity; where impossible, higher courts may make a section 4 declaration of incompatibility, but cannot strike the Act down." loading="lazy">
  <figcaption>Section 3 reaches further than the ordinary rules; section 4 is the fallback, not a strike-down power.</figcaption>
</figure>

<!-- place after: ## Worked example: applying the rules to an unseen statute -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/aqa-a-level-law-7162-law-making-statutory-interpretation--07-mia-wheelchair.webp" width="900" height="638" alt="Four rules applied to Mia riding an electric wheelchair on a footpath under a fictional Act. Literal: “vehicle” could include a wheelchair, so possibly guilty. Ejusdem generis: a mobility aid is not of the same kind as a bicycle or scooter. Golden: convicting her would be absurd. Mischief or purposive: the Act protects pedestrians from cyclists and scooter riders. Most approaches point to not guilty." loading="lazy">
  <figcaption>Take each rule in turn: state it, apply it, give a result.</figcaption>
