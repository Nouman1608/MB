<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 524" width="900" height="524" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="524" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Turning weak claims into strong ones</text>

<rect x="30" y="110" width="840" height="50" rx="10" fill="#1e2a44"/><text x="44" y="141" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Weak claim</text><text x="254" y="141" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Evidence</text><text x="464" y="141" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Idea</text><text x="664" y="141" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Function</text><rect x="30" y="160" width="840" height="68" fill="#f8faf9" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="187.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"The author uses</text><text x="44" y="208.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">imagery."</text><text x="254" y="187.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the repeated images of</text><text x="254" y="208.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">thin, cold light</text><line x1="240" y1="160" x2="240" y2="228" stroke="#c9d6d4" stroke-width="2"/><text x="464" y="187.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">lack of warmth</text><line x1="450" y1="160" x2="450" y2="228" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="187.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">makes the schoolroom's</text><text x="664" y="208.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">lack of warmth visible</text><line x1="650" y1="160" x2="650" y2="228" stroke="#c9d6d4" stroke-width="2"/><rect x="30" y="228" width="840" height="89" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="255.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"The marsh is a symbol</text><text x="44" y="276.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">of death."</text><text x="254" y="255.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the village's silence:</text><text x="254" y="276.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">unspoken yet</text><text x="254" y="297.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">universally known</text><line x1="240" y1="228" x2="240" y2="317" stroke="#c9d6d4" stroke-width="2"/><text x="464" y="255.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the unsaid</text><line x1="450" y1="228" x2="450" y2="317" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="255.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">marks a boundary</text><text x="664" y="276.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">around what the village</text><text x="664" y="297.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cannot say</text><line x1="650" y1="228" x2="650" y2="317" stroke="#c9d6d4" stroke-width="2"/><rect x="30" y="317" width="840" height="89" fill="#f8faf9" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="344.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"The house symbolises</text><text x="44" y="365.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">the family."</text><text x="254" y="344.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the crack in the wall</text><text x="254" y="365.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">running down to the</text><text x="254" y="386.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">tarn</text><line x1="240" y1="317" x2="240" y2="406" stroke="#c9d6d4" stroke-width="2"/><text x="464" y="344.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">decay</text><line x1="450" y1="317" x2="450" y2="406" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="344.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">links the building's decay</text><text x="664" y="365.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to the family's end</text><line x1="650" y1="317" x2="650" y2="406" stroke="#c9d6d4" stroke-width="2"/><rect x="30" y="430" width="840" height="64" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="469" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Strong claim = evidence + idea + function</text>
</svg>