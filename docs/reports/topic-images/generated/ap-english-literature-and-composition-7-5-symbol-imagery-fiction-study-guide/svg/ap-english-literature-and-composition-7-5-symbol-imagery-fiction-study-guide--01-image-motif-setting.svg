<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 675" width="900" height="675" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="675" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Image, motif and symbolic setting</text>

<rect x="30" y="110" width="840" height="115" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">IMAGE</text><text x="50" y="171" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A sensory detail</text><text x="50" y="200.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">what we see, hear, smell, taste or feel; builds the world and its mood</text><rect x="560" y="128" width="52" height="30" rx="15" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="586" y="148.25" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">see</text><rect x="620" y="128" width="52" height="30" rx="15" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="646" y="148.25" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">hear</text><rect x="680" y="128" width="52" height="30" rx="15" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="706" y="148.25" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">smell</text><rect x="740" y="128" width="52" height="30" rx="15" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="766" y="148.25" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">taste</text><rect x="800" y="128" width="52" height="30" rx="15" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="826" y="148.25" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">feel</text><line x1="450" y1="229" x2="450" y2="255" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="462" y="248" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">images recur and converge on an idea</text><rect x="70" y="261" width="760" height="115" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="90" y="294" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">MOTIF</text><text x="90" y="322" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A unified pattern of recurring objects or images</text><text x="90" y="351.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">emphasises a significant idea across large parts of the text</text><line x1="450" y1="380" x2="450" y2="406" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="462" y="399" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">a place gathers associations</text><rect x="110" y="412" width="680" height="115" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="130" y="445" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SYMBOLIC SETTING</text><text x="130" y="473" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A place associated with abstractions</text><text x="130" y="502.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">emotions, ideologies and beliefs</text><text x="450" y="557" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Settings with near-universal associations: a starting point only</text><rect x="30" y="575" width="264" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="162" y="603" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">desert</text><text x="162" y="629" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">emptiness or testing</text><rect x="318" y="575" width="264" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="603" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">garden</text><text x="450" y="629" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">innocence or retreat</text><rect x="606" y="575" width="264" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="738" y="603" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">storm</text><text x="738" y="629" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">upheaval</text>
</svg>