<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" width="900" height="570" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="570" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: a motif of cold light</text>

<text x="127.5" y="130" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Morning</text><rect x="30" y="146" width="195" height="178" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="173" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COLD LIGHT</text><text x="44" y="203" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">light "thin and white,</text><text x="44" y="223" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">like milk held up to a</text><text x="44" y="243" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">window"</text><text x="44" y="273" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">hands held out "as to a</text><text x="44" y="293" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">fire that was not there"</text><line x1="227" y1="235" x2="243" y2="235" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="342.5" y="130" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Noon</text><rect x="245" y="146" width="195" height="178" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="259" y="173" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COLD LIGHT</text><text x="259" y="203" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">light "like a sheet of ice</text><text x="259" y="223" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">that nobody dared to</text><text x="259" y="243" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">step on"</text><text x="259" y="273" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">children eat "in</text><text x="259" y="293" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">silence"</text><line x1="442" y1="235" x2="458" y2="235" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="557.5" y="130" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Three o'clock</text><rect x="460" y="146" width="195" height="178" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="173" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COLD LIGHT</text><text x="474" y="203" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">the light "had thinned</text><text x="474" y="223" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">further"</text><line x1="657" y1="235" x2="673" y2="235" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="772.5" y="130" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Dismissal</text><rect x="675" y="146" width="195" height="178" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="689" y="173" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">REVERSAL</text><text x="689" y="203" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"letting go of a last</text><text x="689" y="223" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">warm coin"</text><text x="689" y="253" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">the children were his</text><text x="689" y="273" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">only warmth</text><text x="30" y="358" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">light</text><path d="M90,340 L860,352 L860,356 L90,368 Z" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="860" y="384" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">thins and intensifies through the day</text><rect x="30" y="406" width="411" height="134" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="439" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THE MOTIF</text><text x="50" y="466.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Absent warmth</text><text x="50" y="494.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">cold, thin light against a missing fire</text><rect x="459" y="406" width="411" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="439" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FUNCTION</text><text x="479" y="466.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Makes an emotional state visible</text><text x="479" y="494.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">characterises the room and Mr Alder's isolation;</text><text x="479" y="515.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">prepares a story about loneliness</text>
</svg>