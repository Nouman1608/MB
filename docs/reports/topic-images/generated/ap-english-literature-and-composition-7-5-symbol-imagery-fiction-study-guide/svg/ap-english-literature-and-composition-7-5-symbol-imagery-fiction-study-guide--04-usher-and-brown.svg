<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="520" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Symbolic settings in two stories</text>

<rect x="30" y="110" width="411" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The Fall of the House of Usher</text><rect x="120" y="200" width="200" height="120" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3"/><path d="M110,200 L220,160 L330,200 Z" fill="#9c8f6e" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><rect x="142" y="224" width="34" height="40" fill="#1e2a44" opacity="0.7"/><rect x="202" y="224" width="34" height="40" fill="#1e2a44" opacity="0.7"/><rect x="262" y="224" width="34" height="40" fill="#1e2a44" opacity="0.7"/><rect x="60" y="328" width="320" height="36" rx="18" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="220" y="352" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">the tarn</text><path d="M270,178 l-8,22 l10,20 l-12,24 l9,22 l-10,26 l8,24 l-6,30" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="288" y="300" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">fissure</text><text x="50" y="380" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"the House of Usher" is both the building and</text><text x="50" y="401" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the family line</text><text x="50" y="430" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A crack runs down the wall to the tarn: decay in</text><text x="50" y="451" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the family. The house falls into the tarn, and</text><text x="50" y="472" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">building and family end together.</text><rect x="459" y="110" width="411" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Young Goodman Brown</text><rect x="479" y="170" width="160" height="150" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="559" y="235" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Salem</text><text x="559" y="260" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">faith</text><rect x="690" y="170" width="160" height="150" rx="12" fill="#cfdcc0" stroke="#6f9a52" stroke-width="2.5"/><path d="M715,235 L701,235 L715,205 L729,235 Z" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><path d="M760,220 L746,220 L760,190 L774,220 Z" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><path d="M805,240 L791,240 L805,210 L819,240 Z" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><path d="M735,290 L721,290 L735,260 L749,290 Z" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><path d="M790,285 L776,285 L790,255 L804,285 Z" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><text x="770" y="310" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">forest: doubt</text><line x1="645" y1="245" x2="684" y2="245" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="684" y1="245" x2="645" y2="245" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><path d="M560,342 q12,-10 24,0 q12,10 24,0" fill="none" stroke="#b5602e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><path d="M745,342 q12,-10 24,0 q12,10 24,0" fill="none" stroke="#b5602e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="584" y="368" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">on Faith's cap</text><text x="769" y="368" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">falls in the forest</text><text x="479" y="406" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The pink ribbon recurs and is tied to her</text><text x="479" y="427" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">innocence: "My Faith is gone!" Name and ribbon</text><text x="479" y="448" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">work together.</text>
</svg>