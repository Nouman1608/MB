<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 622" width="900" height="622" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="622" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four things an image can do</text>

<rect x="30" y="110" width="411" height="189" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FUNCTION 1</text><text x="50" y="171" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Create mood</text><text x="50" y="200.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">sets an atmosphere through sensory detail</text><rect x="48" y="221" width="375" height="62" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="62" y="246" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"The sound of dripping water builds a mood</text><text x="62" y="267" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">of neglect"</text><rect x="459" y="110" width="411" height="189" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FUNCTION 2</text><text x="479" y="171" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Make the abstract concrete</text><text x="479" y="200.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">gives an idea a physical form</text><rect x="477" y="221" width="375" height="62" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="491" y="256.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"The cold light makes loneliness visible"</text><rect x="30" y="315" width="411" height="189" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="348" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FUNCTION 3</text><text x="50" y="376" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Characterise</text><text x="50" y="405.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">shows how a character perceives the world</text><rect x="48" y="426" width="375" height="62" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="62" y="461.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"She notices only the stains on the cloth"</text><rect x="459" y="315" width="411" height="189" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="348" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FUNCTION 4</text><text x="479" y="376" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Link and repeat</text><text x="479" y="405.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">ties scenes together by echo</text><rect x="477" y="426" width="375" height="62" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="491" y="451" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"The recurring smell of smoke connects each</text><text x="491" y="472" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">warning"</text><rect x="30" y="528" width="840" height="64" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="567" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Ask: what does this detail suggest, and why this one and not another?</text>
</svg>