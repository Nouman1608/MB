oke-width="2"/><rect x="150" y="170" width="54" height="40" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M146,170 L177,148 L208,170 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="230" y="170" width="54" height="40" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M226,170 L257,148 L288,170 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="180" y="250" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">SALTBY</text><text x="180" y="278" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">nobody speaks of the marsh,</text><text x="180" y="298" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">everybody knows its depth</text><text x="180" y="332" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle" font-style="italic">mothers: "the marsh was patient"</text><line x1="330" y1="120" x2="330" y2="136" stroke="#1e2a44" stroke-width="5"/><line x1="330" y1="146" x2="330" y2="162" stroke="#1e2a44" stroke-width="5"/><line x1="330" y1="172" x2="330" y2="188" stroke="#1e2a44" stroke-width="5"/><line x1="330" y1="198" x2="330" y2="214" stroke="#1e2a44" stroke-width="5"/><line x1="330" y1="224" x2="330" y2="240" stroke="#1e2a44" stroke-width="5"/><line x1="330" y1="250" x2="330" y2="266" stroke="#1e2a44" stroke-width="5"/><line x1="330" y1="276" x2="330" y2="292" stroke="#1e2a44" stroke-width="5"/><line x1="330" y1="302" x2="330" y2="318" stroke="#1e2a44" stroke-width="5"/><line x1="330" y1="328" x2="330" y2="344" stroke="#1e2a44" stroke-width="5"/><line x1="330" y1="354" x2="330" y2="370" stroke="#1e2a44" stroke-width="5"/><text x="330" y="394" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">the last fence: a boundary</text><circle cx="470" cy="220" r="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><path d="M450,262 Q470,230 490,262 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="280" y1="240" x2="444" y2="240" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)" stroke-dasharray="8 6"/><text x="510" y="222" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Joss, "good boots in his hand"</text><text x="510" y="246" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">on the evening of the fair</text><text x="600" y="320" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">reeds close "like a long exhaled breath"</text><text x="840" y="150" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="end">THE MARSH</text><rect x="30" y="420" width="411" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="453" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COMMON ASSOCIATIONS</text><text x="50" y="483.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">decay, danger, the edge between solid ground</text><text x="50" y="504.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and dissolution</text><rect x="459" y="420" width="411" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="453" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">ADDED BY THIS TEXT</text><text x="479" y="483.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the fence as boundary, a shared taboo, "patient"</text><text x="479" y="504.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">as an inevitable reckoning</text><rect x="30" y="545" width="840" height="111" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="578" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">A READING</text><text x="50" y="609.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The marsh stands for what the community will not name: fear, death, or the consequences of</text><text x="50" y="631.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">leaving its rules. Joss's walk crosses that boundary.</text>
</svg>