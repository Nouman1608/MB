<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 810" width="900" height="810" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="810" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Dynamic markets and competition</text>

<circle cx="450" cy="300" r="92" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><text x="450" y="296" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">A dynamic</text><text x="450" y="324" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">market</text><rect x="30" y="110" width="270" height="160" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Online retailing</text><text x="48" y="177" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Reaches distant customers;</text><text x="48" y="198" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">small firms sell without a</text><text x="48" y="219" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">shop; prices easy to compare</text><line x1="300" y1="190" x2="370" y2="250" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="600" y="110" width="270" height="160" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="618" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">How markets change</text><text x="618" y="177" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Tastes, incomes, technology</text><text x="618" y="198" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and new rivals shift what</text><text x="618" y="219" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">customers want</text><line x1="600" y1="190" x2="530" y2="250" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="370" width="270" height="160" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="406" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Innovation and growth</text><text x="48" y="437" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A new product creates new</text><text x="48" y="458" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">demand: the market itself</text><text x="48" y="479" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">grows</text><line x1="300" y1="450" x2="370" y2="350" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="600" y="370" width="270" height="160" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="618" y="406" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Adapting to change</text><text x="618" y="437" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Firms that update products,</text><text x="618" y="458" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">channels and prices survive</text><line x1="600" y1="450" x2="530" y2="350" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="560" width="840" height="220" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="596" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Competition in the market</text><rect x="56" y="616" width="252" height="100" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="74" y="650" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Limits price</text><text x="74" y="680" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Customers can switch</text><rect x="328" y="616" width="252" height="100" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="346" y="650" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Pushes improvement</text><text x="346" y="680" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Quality, service and range</text><rect x="600" y="616" width="252" height="100" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="618" y="650" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Squeezes margins</text><text x="618" y="680" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Less profit per unit</text><text x="450" y="754" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Few rivals means more freedom over price, so firms work to create a point of difference.</text>
</svg>