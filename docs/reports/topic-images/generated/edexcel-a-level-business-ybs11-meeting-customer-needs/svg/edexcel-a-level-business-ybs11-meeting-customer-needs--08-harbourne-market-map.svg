<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 869" width="900" height="869" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="869" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A market map for a new tea range</text>

<rect x="30" y="110" width="840" height="560" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="480" y1="630" x2="480" y2="140" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="480" y1="140" x2="480" y2="630" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="130" y1="385" x2="830" y2="385" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="830" y1="385" x2="130" y2="385" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="492" y="156" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">High price</text><text x="492" y="626" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Low price</text><text x="130" y="371" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Traditional</text><text x="830" y="371" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Modern</text><circle cx="220" cy="220" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="260" cy="260" r="18" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="300" cy="205" r="18" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="210" cy="300" r="18" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="330" cy="290" r="18" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="220" y="226" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">H</text><text x="270" y="345" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">rivals cluster</text><circle cx="260" cy="470" r="18" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="600" cy="480" r="18" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="700" cy="540" r="18" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><rect x="560" y="170" width="230" height="140" rx="16" fill="none" stroke="#b5602e" stroke-width="3" stroke-dasharray="10 7"/><text x="675" y="230" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">Gap: modern-style</text><text x="675" y="254" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">premium blends</text><text x="675" y="282" font-size="15" font-weight="400" fill="#b5602e" text-anchor="middle">fewer direct rivals</text><circle cx="56" cy="700" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="76" y="706" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">H = Harbourne’s current range ($6.50)</text><circle cx="450" cy="700" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="470" y="706" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rival brands (illustrative positions)</text><rect x="30" y="730" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="770" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A gap is only an opportunity if research shows demand.</text><text x="56" y="797" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">And the firm must be able to serve it profitably. The map also shows where competition is</text><text x="56" y="820" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">heaviest, so Harbourne avoids launching a copy of a stronger brand.</text>
</svg>