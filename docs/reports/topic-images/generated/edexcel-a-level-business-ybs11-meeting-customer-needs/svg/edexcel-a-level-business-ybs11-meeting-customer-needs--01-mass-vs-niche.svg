<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 830" width="900" height="830" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="830" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Mass and niche markets</text>

<rect x="30" y="110" width="410" height="690" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="150" font-size="23" font-weight="700" fill="#2e6b62" text-anchor="middle">Mass market</text><rect x="60" y="300" width="350" height="34" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="235" y="290" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">many units × thin margin</text><circle cx="72" cy="200" r="8" fill="#2e6b62"/><circle cx="97" cy="222" r="8" fill="#2e6b62"/><circle cx="122" cy="244" r="8" fill="#2e6b62"/><circle cx="147" cy="200" r="8" fill="#2e6b62"/><circle cx="172" cy="222" r="8" fill="#2e6b62"/><circle cx="197" cy="244" r="8" fill="#2e6b62"/><circle cx="222" cy="200" r="8" fill="#2e6b62"/><circle cx="247" cy="222" r="8" fill="#2e6b62"/><circle cx="272" cy="244" r="8" fill="#2e6b62"/><circle cx="297" cy="200" r="8" fill="#2e6b62"/><circle cx="322" cy="222" r="8" fill="#2e6b62"/><circle cx="347" cy="244" r="8" fill="#2e6b62"/><circle cx="372" cy="200" r="8" fill="#2e6b62"/><circle cx="397" cy="222" r="8" fill="#2e6b62"/><text x="52" y="380" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Customers</text><text x="52" y="404" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Very many, with broadly similar needs</text><text x="52" y="448" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Product</text><text x="52" y="472" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Standardised</text><text x="52" y="516" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Unit costs</text><text x="52" y="540" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Low: long runs spread fixed costs</text><text x="52" y="584" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Competition</text><text x="52" y="608" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Many large rivals</text><text x="52" y="652" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Main danger</text><text x="52" y="676" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Price wars and falling margins</text><text x="52" y="720" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Brand</text><text x="52" y="744" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Helps stand out among near-identical</text><text x="52" y="767" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">rivals</text><rect x="460" y="110" width="410" height="690" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="665" y="150" font-size="23" font-weight="700" fill="#8a6d0d" text-anchor="middle">Niche market</text><rect x="610" y="190" width="120" height="144" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="800" y="250" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle">few units ×</text><text x="800" y="270" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle">premium margin</text><circle cx="630" cy="176" r="8" fill="#8a6d0d"/><circle cx="670" cy="168" r="8" fill="#8a6d0d"/><circle cx="710" cy="176" r="8" fill="#8a6d0d"/><text x="482" y="380" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Customers</text><text x="482" y="404" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A small group with a specific need</text><text x="482" y="448" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Product</text><text x="482" y="472" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Specialised or tailored</text><text x="482" y="516" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Unit costs</text><text x="482" y="540" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Higher: volumes are small</text><text x="482" y="584" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Competition</text><text x="482" y="608" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Fewer rivals, at least at first</text><text x="482" y="652" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Main danger</text><text x="482" y="676" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Relies on one group; big firms may enter</text><text x="482" y="720" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Brand</text><text x="482" y="744" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Carries the specialist reputation itself</text>
</svg>