<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750" width="900" height="750" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="750" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Matching research to the question</text>

<text x="365" y="136" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Primary</text><text x="705" y="136" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Secondary</text><text transform="translate(176,260) rotate(-90)" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Quantitative</text><text transform="translate(176,490) rotate(-90)" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Qualitative</text><rect x="200" y="150" width="330" height="220" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="218" y="190" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">“How many people would buy at</text><text x="218" y="214" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">$12?”</text><text x="218" y="294" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Method</text><text x="218" y="320" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Survey or questionnaire; test</text><text x="218" y="343" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">marketing</text><rect x="540" y="150" width="330" height="220" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="558" y="190" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">“How big is the national</text><text x="558" y="214" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">market and is it growing?”</text><text x="558" y="294" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Method</text><text x="558" y="320" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Reports, databases</text><rect x="200" y="380" width="330" height="220" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="218" y="420" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">“Why do customers stop</text><text x="218" y="444" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">buying?”</text><text x="218" y="524" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Method</text><text x="218" y="550" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Focus group or face-to-face</text><text x="218" y="573" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">interview</text><rect x="540" y="380" width="330" height="220" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="558" y="420" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">“What are customers saying</text><text x="558" y="444" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">about rivals?”</text><text x="558" y="524" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Method</text><text x="558" y="550" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Websites, social media, magazines</text><rect x="30" y="620" width="840" height="100" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="656" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Both, primary: “Will a new flavour sell in practice?”</text><text x="56" y="690" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Product trial or test marketing gives numbers and reactions.</text><text x="36" y="200" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Purposes:</text><text x="36" y="220" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">identify and</text><text x="36" y="240" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">anticipate</text><text x="36" y="260" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">needs; quantify</text><text x="36" y="280" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">demand; gain</text><text x="36" y="300" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">insight into</text><text x="36" y="320" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">behaviour</text>
</svg>