<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 736" width="900" height="736" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="736" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Routes to competitive advantage</text>

<rect x="300" y="110" width="300" height="80" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="139" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Competitive advantage</text><text x="450" y="172" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">why customers choose this firm</text><path d="M380,190 L380,212 L235,212 L235,236" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M520,190 L520,212 L665,212 L665,236" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="30" y="240" width="410" height="120" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="278" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Route 1: lower cost</text><text x="48" y="309" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Similar value to rivals, at a lower cost</text><rect x="460" y="240" width="410" height="120" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="278" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Route 2: differentiation</text><text x="478" y="309" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Something rivals do not offer</text><rect x="470" y="376" width="88" height="40" rx="20" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="514" y="402" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Design</text><rect x="568" y="376" width="88" height="40" rx="20" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="612" y="402" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Quality</text><rect x="666" y="376" width="88" height="40" rx="20" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="710" y="402" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Service</text><rect x="764" y="376" width="88" height="40" rx="20" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="808" y="402" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Brand</text><line x1="665" y1="420" x2="665" y2="450" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="460" y="454" width="410" height="76" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="481.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Customers become less willing to switch on</text><text x="478" y="504.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">price</text><rect x="30" y="556" width="840" height="150" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="592" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Adding value</text><text x="56" y="622" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Raising the price customers will pay above the cost of bought-in inputs, through branding,</text><text x="56" y="645" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">convenience, design, quality or service.</text><text x="56" y="690" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start" font-style="italic">Differentiation is one way to create an advantage, not the advantage itself.</text>
</svg>