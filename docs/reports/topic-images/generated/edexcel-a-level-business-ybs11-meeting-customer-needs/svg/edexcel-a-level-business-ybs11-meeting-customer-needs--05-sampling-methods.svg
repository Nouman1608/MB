<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Random, quota and stratified samples</text>

<rect x="30" y="110" width="270" height="640" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Random</text><circle cx="73" cy="190" r="15" fill="#ffffff" stroke="#b5d3cf" stroke-width="3"/><circle cx="119" cy="190" r="15" fill="#b5d3cf" stroke="#b5d3cf" stroke-width="3"/><circle cx="165" cy="190" r="15" fill="#b5d3cf" stroke="#b5d3cf" stroke-width="3"/><circle cx="211" cy="190" r="15" fill="#ffffff" stroke="#b5d3cf" stroke-width="3"/><circle cx="257" cy="190" r="15" fill="#ffffff" stroke="#b5d3cf" stroke-width="3"/><circle cx="73" cy="236" r="15" fill="#ffffff" stroke="#b5d3cf" stroke-width="3"/><circle cx="119" cy="236" r="15" fill="#b5d3cf" stroke="#b5d3cf" stroke-width="3"/><circle cx="165" cy="236" r="15" fill="#ffffff" stroke="#b5d3cf" stroke-width="3"/><circle cx="211" cy="236" r="15" fill="#ffffff" stroke="#b5d3cf" stroke-width="3"/><circle cx="257" cy="236" r="15" fill="#b5d3cf" stroke="#b5d3cf" stroke-width="3"/><circle cx="73" cy="282" r="15" fill="#ffffff" stroke="#b5d3cf" stroke-width="3"/><circle cx="119" cy="282" r="15" fill="#b5d3cf" stroke="#b5d3cf" stroke-width="3"/><circle cx="165" cy="282" r="15" fill="#d4b02e" stroke="#d4b02e" stroke-width="3"/><circle cx="211" cy="282" r="15" fill="#d4b02e" stroke="#d4b02e" stroke-width="3"/><circle cx="257" cy="282" r="15" fill="#ffffff" stroke="#d4b02e" stroke-width="3"/><circle cx="73" cy="328" r="15" fill="#d4b02e" stroke="#d4b02e" stroke-width="3"/><circle cx="119" cy="328" r="15" fill="#d4b02e" stroke="#d4b02e" stroke-width="3"/><circle cx="165" cy="328" r="15" fill="#d4b02e" stroke="#d4b02e" stroke-width="3"/><circle cx="211" cy="328" r="15" fill="#ffffff" stroke="#b5602e" stroke-width="3"/><circle cx="257" cy="328" r="15" fill="#ffffff" stroke="#b5602e" stroke-width="3"/><text x="48" y="404" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Everyone has an equal chance</text><text x="48" y="425" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">of selection</text><text x="48" y="520" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">+</text><text x="70" y="520" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Avoids interviewer bias</text><text x="48" y="640" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">−</text><text x="70" y="640" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Needs a full list of the</text><text x="70" y="661" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">population</text><rect x="315" y="110" width="270" height="640" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Quota</text><circle cx="358" cy="190" r="15" fill="#b5d3cf" stroke="#b5d3cf" stroke-width="3"/><circle cx="404" cy="190" r="15" fill="#b5d3cf" stroke="#b5d3cf" stroke-width="3"/><circle cx="450" cy="190" r="15" fill="#b5d3cf" stroke="#b5d3cf" stroke-width="3"/><circle cx="496" cy="190" r="15" fill="#b5d3cf" stroke="#b5d3cf" stroke-width="3"/><circle cx="542" cy="190" r="15" fill="#b5d3cf" stroke="#b5d3cf" stroke-width="3"/><circle cx="358" cy="236" r="15" fill="#b5d3cf" stroke="#b5d3cf" stroke-width="3"/><circle cx="404" cy="236" r="15" fill="#ffffff" stroke="#b5d3cf" stroke-width="3"/><circle cx="450" cy="236" r="15" fill="#ffffff" stroke="#b5d3cf" stroke-width="3"/><circle cx="496" cy="236" r="15" fill="#ffffff" stroke="#b5d3cf" stroke-width="3"/><circle cx="542" cy="236" r="15" fill="#ffffff" stroke="#b5d3cf" stroke-width="3"/><circle cx="358" cy="282" r="15" fill="#ffffff" stroke="#b5d3cf" stroke-width="3"/><circle cx="404" cy="282" r="15" fill="#ffffff" stroke="#b5d3cf" stroke-width="3"/><circle cx="450" cy="282" r="15" fill="#d4b02e" stroke="#d4b02e" stroke-width="3"/><circle cx="496" cy="282" r="15" fill="#d4b02e" stroke="#d4b02e" stroke-width="3"/><circle cx="542" cy="282" r="15" fill="#d4b02e" stroke="#d4b02e" stroke-width="3"/><circle cx="358" cy="328" r="15" fill="#ffffff" stroke="#d4b02e" stroke-width="3"/><circle cx="404" cy="328" r="15" fill="#ffffff" stroke="#d4b02e" stroke-width="3"/><circle cx="450" cy="328" r="15" fill="#ffffff" stroke="#d4b02e" stroke-width="3"/><circle cx="496" cy="328" r="15" fill="#b5602e" stroke="#b5602e" stroke-width="3"/><circle cx="542" cy="328" r="15" fill="#ffffff" stroke="#b5602e" stroke-width="3"/><text x="333" y="404" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Numbers set for each group;</text><text x="333" y="425" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the researcher chooses who</text><text x="333" y="446" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fills them</text><text x="333" y="520" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">+</text><text x="355" y="520" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Quick and cheap</text><text x="333" y="640" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">−</text><text x="355" y="640" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Open to bias in who is</text><text x="355" y="661" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">approached</text><rect x="600" y="110" width="270" height="640" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="735" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Stratified</text><circle cx="643" cy="190" r="15" fill="#ffffff" stroke="#b5d3cf" stroke-width="3"/><circle cx="689" cy="190" r="15" fill="#b5d3cf" stroke="#b5d3cf" stroke-width="3"/><circle cx="735" cy="190" r="15" fill="#ffffff" stroke="#b5d3cf" stroke-width="3"/><circle cx="781" cy="190" r="15" fill="#b5d3cf" stroke="#b5d3cf" stroke-width="3"/><circle cx="827" cy="190" r="15" fill="#b5d3cf" stroke="#b5d3cf" stroke-width="3"/><circle cx="643" cy="236" r="15" fill="#ffffff" stroke="#b5d3cf" stroke-width="3"/><circle cx="689" cy="236" r="15" fill="#ffffff" stroke="#b5d3cf" stroke-width="3"/><circle cx="735" cy="236" r="15" fill="#b5d3cf" stroke="#b5d3cf" stroke-width="3"/><circle cx="781" cy="236" r="15" fill="#b5d3cf" stroke="#b5d3cf" stroke-width="3"/><circle cx="827" cy="236" r="15" fill="#ffffff" stroke="#b5d3cf" stroke-width="3"/><circle cx="643" cy="282" r="15" fill="#b5d3cf" stroke="#b5d3cf" stroke-width="3"/><circle cx="689" cy="282" r="15" fill="#ffffff" stroke="#b5d3cf" stroke-width="3"/><circle cx="735" cy="282" r="15" fill="#d4b02e" stroke="#d4b02e" stroke-width="3"/><circle cx="781" cy="282" r="15" fill="#ffffff" stroke="#d4b02e" stroke-width="3"/><circle cx="827" cy="282" r="15" fill="#d4b02e" stroke="#d4b02e" stroke-width="3"/><circle cx="643" cy="328" r="15" fill="#ffffff" stroke="#d4b02e" stroke-width="3"/><circle cx="689" cy="328" r="15" fill="#ffffff" stroke="#d4b02e" stroke-width="3"/><circle cx="735" cy="328" r="15" fill="#d4b02e" stroke="#d4b02e" stroke-width="3"/><circle cx="781" cy="328" r="15" fill="#ffffff" stroke="#b5602e" stroke-width="3"/><circle cx="827" cy="328" r="15" fill="#b5602e" stroke="#b5602e" stroke-width="3"/><text x="618" y="404" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Random selection within each</text><text x="618" y="425" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">group, in proportion to its</text><text x="618" y="446" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">size</text><text x="618" y="520" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">+</text><text x="640" y="520" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Most representative when</text><text x="640" y="541" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">groups behave differently</text><text x="618" y="640" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">−</text><text x="640" y="640" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Needs population data to</text><text x="640" y="661" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">set proportions</text><text x="450" y="780" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Population of 20 in three groups (12, 6, 2); 10 selected (filled). Illustrative.</text>
