<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" width="900" height="740" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="740" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Degrees: angles from the normal</text>

<rect x="30" y="110" width="520" height="500" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="50" y="360" width="480" height="230" fill="#dce9e7"/><line x1="50" y1="360" x2="530" y2="360" stroke="#1e2a44" stroke-width="3"/><text x="60" y="346" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">air</text><text x="60" y="388" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">glass</text><line x1="290" y1="140" x2="290" y2="580" stroke="#1e2a44" stroke-width="2" stroke-dasharray="8 6"/><text x="298" y="156" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">normal</text><line x1="148.58672586896137" y1="191.47022251382484" x2="226.3640266410326" y2="284.1616001312212" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><line x1="223.53576115841184" y1="280.79100458149765" x2="290" y2="360" stroke="#b5602e" stroke-width="4"/><line x1="290" y1="360" x2="341.13680967062464" y2="469.66324223143465" stroke="#b5602e" stroke-width="4"/><line x1="336.48800879147694" y1="459.6938565740315" x2="382.9760175829539" y2="559.387713148063" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><path d="M290,290 A70,70 0 0 0 245.00486732194224,306.3768889816715" fill="none" stroke="#1e2a44" stroke-width="2.5"/><text x="249" y="252" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">i = 40°</text><path d="M290,440 A80,80 0 0 0 323.8094609392559,432.504622962932" fill="none" stroke="#1e2a44" stroke-width="2.5"/><text x="366" y="476" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">r = 25°</text><rect x="570" y="110" width="300" height="230" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="590" y="150" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Measure every angle</text><text x="590" y="175" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">from the normal, the</text><text x="590" y="200" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">line at 90° to the</text><text x="590" y="225" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">surface.</text><text x="590" y="250" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="590" y="275" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">30° from the normal</text><text x="590" y="300" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">= 60° from the surface.</text><rect x="570" y="360" width="300" height="250" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="590" y="398" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">n = sin i / sin r</text><text x="590" y="430" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">  = sin 40° / sin 25°</text><text x="590" y="462" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">  = 0.643 / 0.423</text><text x="590" y="494" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">  = 1.52  (no unit)</text><text x="590" y="548" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">glass: about 1.5,</text><text x="590" y="572" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">always greater than 1</text><rect x="30" y="630" width="840" height="90" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="668" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">Calculator in DEGREE mode (D or DEG on the screen).</text><text x="450" y="698" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">In radian mode sin 30 gives −0.988 instead of 0.500.</text>
</svg>