<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 770" width="900" height="770" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="770" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The five units of Topic 3</text>

<rect x="30" y="110" width="840" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="48" y="120" width="92" height="48" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="94" y="153" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">°</text><text x="165" y="152" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">degree</text><text x="340" y="152" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">angles of incidence, reflection, refraction; critical angle</text><rect x="30" y="188" width="840" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="48" y="198" width="92" height="48" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="94" y="231" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">Hz</text><text x="165" y="230" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">hertz</text><text x="340" y="230" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">frequency</text><rect x="30" y="266" width="840" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="48" y="276" width="92" height="48" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="94" y="309" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">m</text><text x="165" y="308" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">metre</text><text x="340" y="308" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">wavelength, amplitude, distance</text><rect x="30" y="344" width="840" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="48" y="354" width="92" height="48" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="94" y="387" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">m/s</text><text x="165" y="386" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">metre/second</text><text x="340" y="386" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">wave speed, speed of sound and light</text><rect x="30" y="422" width="840" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="48" y="432" width="92" height="48" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="94" y="465" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">s</text><text x="165" y="464" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">second</text><text x="340" y="464" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">time period, echo or travel time</text><rect x="30" y="510" width="840" height="240" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="550" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Unit checks</text><text x="60" y="594" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">v = f × λ</text><text x="330" y="594" font-size="21" font-weight="600" fill="#2b5a9a" text-anchor="start">Hz × m = (1/s) × m = m/s</text><text x="60" y="640" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">f = 1 / T</text><text x="330" y="640" font-size="21" font-weight="600" fill="#2b5a9a" text-anchor="start">1 / s = Hz   (1 Hz = 1 /s = s⁻¹)</text><text x="60" y="686" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">n = sin i / sin r</text><text x="330" y="686" font-size="21" font-weight="600" fill="#2b5a9a" text-anchor="start">a ratio of two sines: no unit</text><text x="60" y="726" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">So f must be in Hz (not kHz or MHz) and λ in m (not cm or nm) to give m/s.</text>
</svg>