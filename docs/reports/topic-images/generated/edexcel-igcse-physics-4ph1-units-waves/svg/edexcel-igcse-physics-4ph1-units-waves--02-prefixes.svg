<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 770" width="900" height="770" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="770" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Prefixes in wave questions</text>

<rect x="30" y="110" width="840" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="85" y="157" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">G</text><text x="140" y="142" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">giga</text><text x="140" y="166" font-size="17" font-weight="700" fill="#2b5a9a" text-anchor="start">× 10⁹</text><text x="840" y="154" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="end">microwaves: 2.4 GHz = 2.4 × 10⁹ Hz</text><rect x="30" y="190" width="840" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="85" y="237" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">M</text><text x="140" y="222" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">mega</text><text x="140" y="246" font-size="17" font-weight="700" fill="#2b5a9a" text-anchor="start">× 10⁶</text><text x="840" y="234" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="end">radio: 98 MHz = 9.8 × 10⁷ Hz</text><rect x="30" y="270" width="840" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="85" y="317" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">k</text><text x="140" y="302" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">kilo</text><text x="140" y="326" font-size="17" font-weight="700" fill="#2b5a9a" text-anchor="start">× 10³</text><text x="840" y="314" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="end">sound: 2.5 kHz = 2500 Hz; distances in km</text><rect x="30" y="350" width="840" height="70" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="85" y="397" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">c</text><text x="140" y="382" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">centi</text><text x="140" y="406" font-size="17" font-weight="700" fill="#2b5a9a" text-anchor="start">× 10⁻²</text><text x="840" y="394" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="end">ripple tank: 1.5 cm = 0.015 m</text><rect x="30" y="430" width="840" height="70" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="85" y="477" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">m</text><text x="140" y="462" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">milli</text><text x="140" y="486" font-size="17" font-weight="700" fill="#2b5a9a" text-anchor="start">× 10⁻³</text><text x="840" y="474" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="end">time periods: 4.0 ms = 0.0040 s</text><rect x="30" y="510" width="840" height="70" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="85" y="557" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">μ</text><text x="140" y="542" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">micro</text><text x="140" y="566" font-size="17" font-weight="700" fill="#2b5a9a" text-anchor="start">× 10⁻⁶</text><text x="840" y="554" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="end">infrared: 10 μm = 1.0 × 10⁻⁵ m</text><rect x="30" y="590" width="840" height="70" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="85" y="637" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">n</text><text x="140" y="622" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">nano</text><text x="140" y="646" font-size="17" font-weight="700" fill="#2b5a9a" text-anchor="start">× 10⁻⁹</text><text x="840" y="634" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="end">visible light: 600 nm = 6.0 × 10⁻⁷ m</text><rect x="30" y="680" width="840" height="70" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="722" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">M (mega, a million) and m (milli, a thousandth) differ by 10⁹.</text>
</svg>