<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="610" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked examples: standard form</text>

<rect x="30" y="110" width="410" height="260" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Radio station at 100 MHz</text><text x="54" y="192" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">f = 100 MHz = 1.00 × 10⁸ Hz</text><text x="54" y="226" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">λ = v / f</text><text x="54" y="260" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">  = (3.0 × 10⁸) / (1.00 × 10⁸)</text><rect x="50" y="296" width="370" height="54" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="331" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">λ = 3.0 m</text><rect x="460" y="110" width="410" height="260" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="484" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Green light, 500 nm</text><text x="484" y="192" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">λ = 500 nm = 5.00 × 10⁻⁷ m</text><text x="484" y="226" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">f = v / λ</text><text x="484" y="260" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">  = (3.0 × 10⁸) / (5.00 × 10⁻⁷)</text><rect x="480" y="296" width="370" height="54" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="665" y="331" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">f = 6.0 × 10¹⁴ Hz</text><rect x="30" y="390" width="840" height="200" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="428" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">On the calculator</text><text x="60" y="466" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Use the ×10ˣ (EXP) key, or brackets round each number.</text><text x="60" y="502" font-size="17" font-weight="600" fill="#b5602e" text-anchor="start">✗ 3.0 × 10⁸ ÷ 5.00 × 10⁻⁷ typed without brackets multiplies by 10⁻⁷.</text><text x="60" y="550" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">Size check: visible light is of order 10¹⁴ Hz, so 6.0 × 10¹⁴ Hz is sensible.</text>
</svg>