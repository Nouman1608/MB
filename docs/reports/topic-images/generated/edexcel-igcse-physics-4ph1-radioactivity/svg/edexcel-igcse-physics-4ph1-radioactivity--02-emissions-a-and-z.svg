<rect x="30" y="110" width="840" height="50" rx="10" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><text x="90" y="143" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle"></text><text x="160" y="143" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Nature</text><text x="470" y="143" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Symbol</text><text x="610" y="143" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Charge</text><text x="730" y="143" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">A</text><text x="830" y="143" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Z</text><rect x="30" y="172" width="840" height="100" rx="10" fill="#f8faf9" stroke="#c9d6d4" stroke-width="2"/><circle cx="70" cy="222" r="26" fill="#ffffff" stroke="#b5602e" stroke-width="3.5"/><text x="70" y="231" font-size="22" font-weight="700" fill="#b5602e" text-anchor="middle">α</text><text x="160" y="208" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Alpha</text><text x="160" y="234" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">2 protons + 2 neutrons</text><text x="160" y="254" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(a helium nucleus)</text><text x="470" y="220.5" font-size="18.6" font-weight="700" fill="#1e2a44" text-anchor="end">4</text><text x="470" y="240.51" font-size="18.6" font-weight="700" fill="#1e2a44" text-anchor="end">2</text><text x="472" y="234" font-size="30" font-weight="700" fill="#1e2a44">He</text><text x="610" y="230" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">+2</text><text x="730" y="230" font-size="22" font-weight="700" fill="#b5602e" text-anchor="middle">−4</text><text x="830" y="230" font-size="22" font-weight="700" fill="#b5602e" text-anchor="middle">−2</text><rect x="30" y="284" width="840" height="100" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="70" cy="334" r="26" fill="#ffffff" stroke="#2e6b62" stroke-width="3.5"/><text x="70" y="343" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="middle">β⁻</text><text x="160" y="320" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Beta-minus</text><text x="160" y="346" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">fast electron</text><text x="160" y="366" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">from the nucleus</text><text x="470" y="332.5" font-size="18.6" font-weight="700" fill="#1e2a44" text-anchor="end">0</text><text x="470" y="352.51" font-size="18.6" font-weight="700" fill="#1e2a44" text-anchor="end">−1</text><text x="472" y="346" font-size="30" font-weight="700" fill="#1e2a44">e</text><text x="610" y="342" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">−1</text><text x="730" y="342" font-size="22" font-weight="700" fill="#4a5568" text-anchor="middle">0</text><text x="830" y="342" font-size="22" font-weight="700" fill="#b5602e" text-anchor="middle">+1</text><rect x="30" y="396" width="840" height="100" rx="10" fill="#f8faf9" stroke="#c9d6d4" stroke-width="2"/><circle cx="70" cy="446" r="26" fill="#ffffff" stroke="#8a6d0d" stroke-width="3.5"/><text x="70" y="455" font-size="22" font-weight="700" fill="#8a6d0d" text-anchor="middle">γ</text><text x="160" y="432" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Gamma</text><text x="160" y="458" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">electromagnetic wave</text><text x="160" y="478" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">removes energy only</text><text x="470" y="444.5" font-size="18.6" font-weight="700" fill="#1e2a44" text-anchor="end">0</text><text x="470" y="464.51" font-size="18.6" font-weight="700" fill="#1e2a44" text-anchor="end">0</text><text x="472" y="458" font-size="30" font-weight="700" fill="#1e2a44">γ</text><text x="610" y="454" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">0</text><text x="730" y="454" font-size="22" font-weight="700" fill="#4a5568" text-anchor="middle">0</text><text x="830" y="454" font-size="22" font-weight="700" fill="#4a5568" text-anchor="middle">0</text><rect x="30" y="508" width="840" height="100" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="70" cy="558" r="26" fill="#ffffff" stroke="#2b5a9a" stroke-width="3.5"/><text x="70" y="567" font-size="22" font-weight="700" fill="#2b5a9a" text-anchor="middle">n</text><text x="160" y="544" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Neutron</text><text x="160" y="570" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">a neutron</text><text x="160" y="590" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"></text><text x="470" y="556.5" font-size="18.6" font-weight="700" fill="#1e2a44" text-anchor="end">1</text><text x="470" y="576.51" font-size="18.6" font-weight="700" fill="#1e2a44" text-anchor="end">0</text><text x="472" y="570" font-size="30" font-weight="700" fill="#1e2a44">n</text><text x="610" y="566" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">0</text><text x="730" y="566" font-size="22" font-weight="700" fill="#b5602e" text-anchor="middle">−1</text><text x="830" y="566" font-size="22" font-weight="700" fill="#4a5568" text-anchor="middle">0</text><rect x="30" y="630" width="840" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="668" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Beta-minus decay inside the nucleus</text><circle cx="110" cy="725" r="22" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3"/><text x="110" y="732" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">n</text><line x1="145" y1="725" x2="225" y2="725" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><circle cx="265" cy="725" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="265" y="732" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">p</text><text x="305" y="733" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><circle cx="340" cy="725" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="340" y="731" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">e</text><line x1="358" y1="725" x2="420" y2="725" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><text x="430" y="731" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">emitted</text><text x="540" y="712" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">One more proton: Z rises by 1.</text><text x="540" y="738" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Nucleon total unchanged: A same.</text>
