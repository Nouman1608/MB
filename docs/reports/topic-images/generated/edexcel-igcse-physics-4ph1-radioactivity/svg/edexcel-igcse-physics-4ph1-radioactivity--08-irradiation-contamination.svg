<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 820" width="900" height="820" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="820" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Irradiation and contamination</text>

<rect x="30" y="110" width="410" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="148" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="middle">Irradiation</text><rect x="60" y="250" width="90" height="60" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="105" y="286" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">source</text><line x1="155" y1="265" x2="280" y2="250" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><line x1="155" y1="280" x2="280" y2="280" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><line x1="155" y1="295" x2="280" y2="310" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><circle cx="340" cy="230" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><rect x="312" y="254" width="56" height="90" rx="10" fill="#dce6f0" stroke="#1e2a44" stroke-width="3"/><line x1="326" y1="344" x2="326" y2="390" stroke="#1e2a44" stroke-width="3"/><line x1="354" y1="344" x2="354" y2="390" stroke="#1e2a44" stroke-width="3"/><text x="60" y="440" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Radiation from a source</text><text x="60" y="465" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">outside the body.</text><text x="60" y="490" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Stops when you move away</text><text x="60" y="515" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">or the source is removed.</text><text x="60" y="540" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">You do not become radioactive.</text><rect x="460" y="110" width="410" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="148" font-size="22" font-weight="700" fill="#b5602e" text-anchor="middle">Contamination</text><circle cx="665" cy="230" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><rect x="637" y="254" width="56" height="90" rx="10" fill="#dce6f0" stroke="#1e2a44" stroke-width="3"/><line x1="651" y1="344" x2="651" y2="390" stroke="#1e2a44" stroke-width="3"/><line x1="679" y1="344" x2="679" y2="390" stroke="#1e2a44" stroke-width="3"/><circle cx="640" cy="240" r="7" fill="#b5602e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="688" cy="268" r="7" fill="#b5602e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="655" cy="300" r="7" fill="#b5602e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="690" cy="325" r="7" fill="#b5602e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="620" cy="205" r="7" fill="#b5602e" stroke="#1e2a44" stroke-width="1.5"/><line x1="688" y1="268" x2="760" y2="240" stroke="#b5602e" stroke-width="2.5" marker-end="url(#ahR)"/><line x1="655" y1="300" x2="580" y2="330" stroke="#b5602e" stroke-width="2.5" marker-end="url(#ahR)"/><line x1="620" y1="205" x2="570" y2="180" stroke="#b5602e" stroke-width="2.5" marker-end="url(#ahR)"/><text x="490" y="440" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Radioactive material on or in</text><text x="490" y="465" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the body (dust on skin, gas</text><text x="490" y="490" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">breathed in). Keeps irradiating</text><text x="490" y="515" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">until removed. Alpha inside the</text><text x="490" y="540" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">body is the most dangerous.</text><rect x="30" y="600" width="840" height="200" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="638" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Ionising radiation damages cells and can cause DNA mutations, leading to cancer.</text><text x="60" y="676" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Workers reduce their dose:</text><rect x="60" y="694" width="240" height="46" rx="10" fill="#ffffff" stroke="#8a6d0d" stroke-width="2"/><text x="180" y="724" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">limit time</text><rect x="320" y="694" width="240" height="46" rx="10" fill="#ffffff" stroke="#8a6d0d" stroke-width="2"/><text x="440" y="724" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">keep distance</text><rect x="580" y="694" width="240" height="46" rx="10" fill="#ffffff" stroke="#8a6d0d" stroke-width="2"/><text x="700" y="724" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">use shielding</text><text x="60" y="776" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Waste: sealed, shielded (concrete, lead, water), stored deep underground, monitored.</text>
</svg>