<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 810" width="900" height="810" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="810" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading a nuclide symbol</text>

<rect x="30" y="110" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330" y="330" font-size="70" font-weight="700" fill="#2e6b62" text-anchor="end">14</text><text x="330" y="400" font-size="70" font-weight="700" fill="#b5602e" text-anchor="end">6</text><text x="340" y="370" font-size="130" font-weight="700" fill="#1e2a44">C</text><line x1="530" y1="220" x2="315" y2="270" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><text x="540" y="200" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">A: mass (nucleon) number</text><text x="540" y="224" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">= protons + neutrons</text><line x1="530" y1="400" x2="340" y2="385" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="540" y="395" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Z: atomic (proton) number</text><text x="540" y="419" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">= protons only</text><text x="60" y="160" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Carbon-14</text><rect x="30" y="460" width="840" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="505" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">neutrons = A − Z = 14 − 6 = 8</text><text x="450" y="545" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">6 protons (+1 each), 8 neutrons (0), and in a neutral atom 6 electrons (−1 each)</text><rect x="30" y="610" width="840" height="180" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="648" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Isotopes: same Z, different A</text><text x="170" y="714.3" font-size="28.52" font-weight="700" fill="#1e2a44" text-anchor="end">12</text><text x="170" y="744.982" font-size="28.52" font-weight="700" fill="#1e2a44" text-anchor="end">6</text><text x="172" y="735" font-size="46" font-weight="700" fill="#1e2a44">C</text><text x="175" y="775" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">6 p, 6 n</text><text x="420" y="714.3" font-size="28.52" font-weight="700" fill="#1e2a44" text-anchor="end">14</text><text x="420" y="744.982" font-size="28.52" font-weight="700" fill="#1e2a44" text-anchor="end">6</text><text x="422" y="735" font-size="46" font-weight="700" fill="#1e2a44">C</text><text x="425" y="775" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">6 p, 8 n</text><text x="560" y="700" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Same element (Z = 6).</text><text x="560" y="725" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Carbon-14 is unstable</text><text x="560" y="750" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">and radioactive.</text>
</svg>