<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 850" width="900" height="850" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="850" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Detecting radiation and background</text>

<rect x="30" y="110" width="410" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Photographic film</text><rect x="80" y="175" width="310" height="100" rx="6" fill="#eef1f3" stroke="#1e2a44" stroke-width="2.5"/><rect x="200" y="177" width="130" height="96" fill="#4a5568"/><text x="265" y="300" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">darkens where exposed</text><rect x="460" y="110" width="410" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Geiger-Müller tube + counter</text><rect x="500" y="205" width="160" height="46" rx="22" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="500" y="205" width="30" height="46" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><path d="M660,228 Q690,228 710,210" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="710" y="180" width="120" height="80" rx="8" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><rect x="722" y="192" width="96" height="40" rx="4" fill="#e9f5ec" stroke="#1e2a44" stroke-width="1"/><text x="770" y="220" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">0024</text><text x="665" y="300" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">counts each ionising event</text><rect x="30" y="360" width="840" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="398" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Background radiation is always present</text><circle cx="450" cy="530" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><rect x="422" y="554" width="56" height="90" rx="10" fill="#dce6f0" stroke="#1e2a44" stroke-width="3"/><line x1="436" y1="644" x2="436" y2="690" stroke="#1e2a44" stroke-width="3"/><line x1="464" y1="644" x2="464" y2="690" stroke="#1e2a44" stroke-width="3"/><text x="60" y="440" font-size="18" font-weight="700" fill="#2b5a9a" text-anchor="start">From space</text><rect x="60" y="452" width="262" height="102" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="74" y="476" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Cosmic rays</text><text x="74" y="500" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">from the Sun and beyond; mostly</text><text x="74" y="521" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">absorbed by the atmosphere,</text><text x="74" y="542" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">so more at altitude</text><text x="60" y="600" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">From Earth</text><rect x="60" y="612" width="262" height="58" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="74" y="636" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Rocks, soil, building</text><text x="74" y="660" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">materials made from them</text><rect x="578" y="452" width="262" height="58" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="592" y="476" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Radon gas</text><text x="592" y="500" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">seeps out of the ground</text><rect x="578" y="560" width="262" height="58" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="592" y="584" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Food and drink</text><text x="592" y="608" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">e.g. potassium-40</text><rect x="578" y="668" width="262" height="80" rx="10" fill="#eef1f3" stroke="#4a5568" stroke-width="2.5"/><text x="592" y="692" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Human activity</text><text x="592" y="716" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">medical X-rays, nuclear</text><text x="592" y="737" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">industry: a smaller amount</text><line x1="326" y1="500" x2="410" y2="545" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)" stroke-dasharray="6 5"/><line x1="326" y1="650" x2="410" y2="620" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)" stroke-dasharray="6 5"/><line x1="576" y1="480" x2="490" y2="535" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)" stroke-dasharray="6 5"/><line x1="576" y1="588" x2="490" y2="589" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)" stroke-dasharray="6 5"/><line x1="576" y1="700" x2="490" y2="645" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)" stroke-dasharray="6 5"/><text x="450" y="812" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Subtract the background count before using any reading.</text>
</svg>