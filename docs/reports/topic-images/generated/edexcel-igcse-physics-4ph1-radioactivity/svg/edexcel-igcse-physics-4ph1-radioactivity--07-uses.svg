<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750" width="900" height="750" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="750" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Uses of radioactivity</text>

<rect x="30" y="110" width="840" height="50" rx="10" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><text x="60" y="143" font-size="18" font-weight="700" fill="#fff" text-anchor="start">Use</text><text x="320" y="143" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Type</text><text x="370" y="143" font-size="18" font-weight="700" fill="#fff" text-anchor="start">Why this radiation</text><rect x="30" y="170" width="840" height="92" rx="10" fill="#f8faf9" stroke="#c9d6d4" stroke-width="2"/><text x="60" y="222" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Smoke detector</text><circle cx="320" cy="216" r="22" fill="#ffffff" stroke="#b5602e" stroke-width="3"/><text x="320" y="224" font-size="21" font-weight="700" fill="#b5602e" text-anchor="middle">α</text><text x="370" y="200" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ionises air so a tiny current flows; smoke absorbs</text><text x="370" y="222" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">α, current drops, alarm sounds; cannot escape the</text><text x="370" y="244" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">casing</text><rect x="30" y="270" width="840" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="60" y="300" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Paper or foil</text><text x="60" y="322" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">thickness</text><circle cx="320" cy="305" r="22" fill="#ffffff" stroke="#2e6b62" stroke-width="3"/><text x="320" y="313" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">β</text><text x="370" y="300" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">partly absorbed, so the count changes with</text><text x="370" y="322" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">thickness</text><rect x="30" y="348" width="840" height="70" rx="10" fill="#f8faf9" stroke="#c9d6d4" stroke-width="2"/><text x="60" y="378" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Leaks in underground</text><text x="60" y="400" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">pipes</text><circle cx="320" cy="383" r="22" fill="#ffffff" stroke="#8a6d0d" stroke-width="3"/><text x="320" y="391" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="middle">γ</text><text x="370" y="378" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">short half-life tracer in the fluid; a detector</text><text x="370" y="400" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">above ground finds where the count rises</text><rect x="30" y="426" width="840" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="60" y="456" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Sterilising</text><text x="60" y="478" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">equipment, food</text><circle cx="320" cy="461" r="22" fill="#ffffff" stroke="#8a6d0d" stroke-width="3"/><text x="320" y="469" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="middle">γ</text><text x="370" y="456" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">passes through packaging and kills bacteria; the</text><text x="370" y="478" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">item does not become radioactive</text><rect x="30" y="504" width="840" height="70" rx="10" fill="#f8faf9" stroke="#c9d6d4" stroke-width="2"/><text x="60" y="545" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Medical tracer</text><circle cx="320" cy="539" r="22" fill="#ffffff" stroke="#8a6d0d" stroke-width="3"/><text x="320" y="547" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="middle">γ</text><text x="370" y="534" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">detected from outside the body; short half-life,</text><text x="370" y="556" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">so it decays quickly</text><rect x="30" y="582" width="840" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="60" y="623" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Radiotherapy</text><circle cx="320" cy="617" r="22" fill="#ffffff" stroke="#8a6d0d" stroke-width="3"/><text x="320" y="625" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="middle">γ</text><text x="370" y="623" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">carefully aimed beams kill cancer cells</text><rect x="30" y="666" width="840" height="60" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="704" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Choose by penetration and by half-life.</text>
</svg>