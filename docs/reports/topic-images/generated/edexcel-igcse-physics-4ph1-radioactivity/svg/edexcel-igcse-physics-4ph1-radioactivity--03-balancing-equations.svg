<rect width="900" height="830" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Balancing nuclear equations</text>

<rect x="30" y="110" width="840" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Alpha decay</text><text x="150" y="200.9" font-size="23.56" font-weight="700" fill="#1e2a44" text-anchor="end">226</text><text x="150" y="226.246" font-size="23.56" font-weight="700" fill="#1e2a44" text-anchor="end">88</text><text x="152" y="218" font-size="38" font-weight="700" fill="#1e2a44">Ra</text><text x="250" y="218" font-size="32" font-weight="700" fill="#4a5568" text-anchor="middle">→</text><text x="335" y="200.9" font-size="23.56" font-weight="700" fill="#1e2a44" text-anchor="end">222</text><text x="335" y="226.246" font-size="23.56" font-weight="700" fill="#1e2a44" text-anchor="end">86</text><text x="337" y="218" font-size="38" font-weight="700" fill="#1e2a44">Rn</text><text x="425" y="218" font-size="32" font-weight="700" fill="#4a5568" text-anchor="middle">+</text><text x="495" y="200.9" font-size="23.56" font-weight="700" fill="#b5602e" text-anchor="end">4</text><text x="495" y="226.246" font-size="23.56" font-weight="700" fill="#b5602e" text-anchor="end">2</text><text x="497" y="218" font-size="38" font-weight="700" fill="#b5602e">He</text><rect x="590" y="168" width="260" height="100" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="610" y="202" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">top: 226 = 222 + 4</text><text x="610" y="234" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">bottom: 88 = 86 + 2</text><text x="60" y="282" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"></text><rect x="30" y="320" width="840" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="358" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Beta-minus decay</text><text x="150" y="410.9" font-size="23.56" font-weight="700" fill="#1e2a44" text-anchor="end">90</text><text x="150" y="436.246" font-size="23.56" font-weight="700" fill="#1e2a44" text-anchor="end">38</text><text x="152" y="428" font-size="38" font-weight="700" fill="#1e2a44">Sr</text><text x="250" y="428" font-size="32" font-weight="700" fill="#4a5568" text-anchor="middle">→</text><text x="335" y="410.9" font-size="23.56" font-weight="700" fill="#1e2a44" text-anchor="end">90</text><text x="335" y="436.246" font-size="23.56" font-weight="700" fill="#1e2a44" text-anchor="end">39</text><text x="337" y="428" font-size="38" font-weight="700" fill="#1e2a44">Y</text><text x="425" y="428" font-size="32" font-weight="700" fill="#4a5568" text-anchor="middle">+</text><text x="495" y="410.9" font-size="23.56" font-weight="700" fill="#2e6b62" text-anchor="end">0</text><text x="495" y="436.246" font-size="23.56" font-weight="700" fill="#2e6b62" text-anchor="end">−1</text><text x="497" y="428" font-size="38" font-weight="700" fill="#2e6b62">e</text><rect x="590" y="378" width="260" height="100" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="610" y="412" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">top: 90 = 90 + 0</text><text x="610" y="444" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">bottom: 38 = 39 + (−1)</text><text x="60" y="492" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"></text><rect x="30" y="530" width="840" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="568" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Neutron emission (illustrative nucleus X)</text><text x="150" y="620.9" font-size="23.56" font-weight="700" fill="#1e2a44" text-anchor="end">87</text><text x="150" y="646.246" font-size="23.56" font-weight="700" fill="#1e2a44" text-anchor="end">36</text><text x="152" y="638" font-size="38" font-weight="700" fill="#1e2a44">X</text><text x="250" y="638" font-size="32" font-weight="700" fill="#4a5568" text-anchor="middle">→</text><text x="335" y="620.9" font-size="23.56" font-weight="700" fill="#1e2a44" text-anchor="end">86</text><text x="335" y="646.246" font-size="23.56" font-weight="700" fill="#1e2a44" text-anchor="end">36</text><text x="337" y="638" font-size="38" font-weight="700" fill="#1e2a44">X</text><text x="425" y="638" font-size="32" font-weight="700" fill="#4a5568" text-anchor="middle">+</text><text x="495" y="620.9" font-size="23.56" font-weight="700" fill="#2b5a9a" text-anchor="end">1</text><text x="495" y="646.246" font-size="23.56" font-weight="700" fill="#2b5a9a" text-anchor="end">0</text><text x="497" y="638" font-size="38" font-weight="700" fill="#2b5a9a">n</text><rect x="590" y="588" width="260" height="100" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="610" y="622" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">top: 87 = 86 + 1</text><text x="610" y="654" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">bottom: 36 = 36 + 0</text><text x="60" y="702" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Z unchanged, so same element: a lighter isotope.</text><rect x="30" y="740" width="840" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="783" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Top numbers balance (mass) and bottom numbers balance (charge).</text>
</svg>