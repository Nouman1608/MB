<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 870" width="900" height="870" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="870" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Practical: what stops the radiation?</text>

<rect x="30" y="110" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="70" y="230" width="90" height="70" rx="6" fill="#e7ecef" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="272" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">source</text><text x="115" y="325" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">tongs, point</text><text x="115" y="343" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">away from people</text><line x1="165" y1="265" x2="330" y2="265" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)" stroke-dasharray="8 6"/><rect x="345" y="190" width="26" height="150" rx="3" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="358" y="178" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">absorber</text><line x1="378" y1="265" x2="500" y2="265" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)" stroke-dasharray="8 6"/><rect x="510" y="242" width="150" height="46" rx="22" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="510" y="242" width="30" height="46" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="600" y="271" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">G-M tube</text><path d="M660,265 Q700,265 720,240" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="720" y="180" width="120" height="100" rx="8" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><rect x="732" y="196" width="96" height="44" rx="4" fill="#e9f5ec" stroke="#1e2a44" stroke-width="1"/><text x="780" y="226" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">0372</text><text x="780" y="266" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">counter</text><line x1="160" y1="380" x2="510" y2="380" stroke="#1e2a44" stroke-width="2"/><text x="335" y="402" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">fixed distance</text><line x1="160" y1="370" x2="160" y2="390" stroke="#1e2a44" stroke-width="2"/><line x1="510" y1="370" x2="510" y2="390" stroke="#1e2a44" stroke-width="2"/><rect x="30" y="460" width="840" height="160" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="496" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Absorbers in order</text><rect x="60" y="516" width="250" height="44" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="185" y="544" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">paper</text><line x1="312" y1="538" x2="328" y2="538" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="330" y="516" width="250" height="44" rx="6" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><text x="455" y="544" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">thicker and thicker aluminium</text><line x1="582" y1="538" x2="598" y2="538" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="600" y="516" width="250" height="44" rx="6" fill="#5f6b7a" stroke="#1e2a44" stroke-width="2"/><text x="725" y="544" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">lead</text><text x="60" y="598" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">The absorber that brings the corrected count rate to about zero identifies the radiation.</text><rect x="30" y="640" width="840" height="210" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="678" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">1. Measure the background count rate with no source.</text><text x="60" y="712" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">2. Source at a fixed distance from the tube: record the count rate.</text><text x="60" y="746" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">3. Add paper, then aluminium of increasing thickness, then lead.</text><text x="60" y="780" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">4. Subtract the background from every reading.</text><text x="60" y="814" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Safety: tongs, point it away, keep your distance, short time out of its box.</text>
</svg>