<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 850" width="900" height="850" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="850" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Pennant Print: break-even chart</text>

<rect x="30" y="110" width="620" height="600" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="140" y1="170" x2="140" y2="620" stroke="#1e2a44" stroke-width="3"/><line x1="140" y1="620" x2="630" y2="620" stroke="#1e2a44" stroke-width="3"/><line x1="140" y1="620" x2="620" y2="620" stroke="#c9d6d4" stroke-width="1.2"/><text x="130" y="625" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$0</text><line x1="140" y1="473.33333333333337" x2="620" y2="473.33333333333337" stroke="#c9d6d4" stroke-width="1.2"/><text x="130" y="478.33333333333337" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$15,000</text><line x1="140" y1="326.6666666666667" x2="620" y2="326.6666666666667" stroke="#c9d6d4" stroke-width="1.2"/><text x="130" y="331.6666666666667" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$30,000</text><line x1="140" y1="180" x2="620" y2="180" stroke="#c9d6d4" stroke-width="1.2"/><text x="130" y="185" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$45,000</text><line x1="140" y1="620" x2="140" y2="626" stroke="#1e2a44" stroke-width="2"/><text x="140" y="646" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">0</text><line x1="236" y1="620" x2="236" y2="626" stroke="#1e2a44" stroke-width="2"/><text x="236" y="646" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">1,000</text><line x1="332" y1="620" x2="332" y2="626" stroke="#1e2a44" stroke-width="2"/><text x="332" y="646" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">2,000</text><line x1="428" y1="620" x2="428" y2="626" stroke="#1e2a44" stroke-width="2"/><text x="428" y="646" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">3,000</text><line x1="524" y1="620" x2="524" y2="626" stroke="#1e2a44" stroke-width="2"/><text x="524" y="646" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">4,000</text><line x1="620" y1="620" x2="620" y2="626" stroke="#1e2a44" stroke-width="2"/><text x="620" y="646" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">5,000</text><text x="56" y="146" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Costs and revenue</text><text x="620" y="676" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">Units a month</text><path d="M140,444 L428,370.6666666666667 L140,620 Z" fill="#f3dccd" opacity="0.8"/><path d="M428,370.6666666666667 L620,204.44444444444446 L620,321.77777777777777 Z" fill="#dce9e7" opacity="0.9"/><line x1="140" y1="444" x2="620" y2="444" stroke="#4a5568" stroke-width="3" stroke-dasharray="9 6"/><text x="616" y="466" font-size="15" font-weight="600" fill="#4a5568" text-anchor="end">Fixed costs $18,000</text><line x1="140" y1="444" x2="620" y2="321.77777777777777" stroke="#b5602e" stroke-width="4"/><text x="624" y="326.77777777777777" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">TC</text><line x1="140" y1="620" x2="620" y2="204.44444444444446" stroke="#2e6b62" stroke-width="4"/><text x="624" y="209.44444444444446" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">TR</text><line x1="428" y1="370.6666666666667" x2="428" y2="620" stroke="#1e2a44" stroke-width="2" stroke-dasharray="6 5"/><circle cx="428" cy="370.6666666666667" r="8" fill="#1e2a44"/><text x="416" y="356.6666666666667" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="end">break-even: 3,000 units, $25,500</text><line x1="543.2" y1="270.93333333333334" x2="543.2" y2="620" stroke="#2e6b62" stroke-width="2" stroke-dasharray="6 5"/><line x1="428" y1="590" x2="543.2" y2="590" stroke="#8a6d0d" stroke-width="3" marker-start="url(#ahO)" marker-end="url(#ahO)"/><text x="485.6" y="580" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">MoS 1,200</text><text x="549.2" y="556" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">sales 4,200</text><text x="581.6" y="291.55555555555554" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">profit</text><text x="264.8" y="507.55555555555554" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">loss</text><rect x="670" y="110" width="200" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="686" y="140" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Contribution</text><text x="686" y="168" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">$8.50 − $2.50</text><text x="686" y="192" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">= $6.00</text><rect x="670" y="232" width="200" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="686" y="262" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Break-even</text><text x="686" y="290" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">18,000 ÷ 6.00</text><text x="686" y="314" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">= 3,000 units</text><rect x="670" y="354" width="200" height="134" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="686" y="384" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Check</text><text x="686" y="412" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">18,000 + 7,500</text><text x="686" y="436" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">= 25,500</text><text x="686" y="460" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">= 8.50 × 3,000</text><rect x="670" y="500" width="200" height="110" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="686" y="530" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Margin of safety</text><text x="686" y="558" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">4,200 − 3,000</text><text x="686" y="582" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">= 1,200 units</text><rect x="30" y="730" width="840" height="90" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="56" y="766" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Gap between TR and TC: profit to the right of break-even, loss to the left. The horizontal</text><text x="56" y="789" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">distance from break-even to actual output is the margin of safety.</text>
</svg>