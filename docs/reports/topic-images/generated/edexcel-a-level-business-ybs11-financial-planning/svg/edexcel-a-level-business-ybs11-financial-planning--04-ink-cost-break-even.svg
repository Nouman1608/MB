06" stroke="#1e2a44" stroke-width="2"/><text x="750" y="526" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">5,000</text><text x="130" y="150" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="end">$</text><text x="750" y="556" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">Units a month</text><line x1="140" y1="500" x2="750" y2="178.8888888888889" stroke="#2e6b62" stroke-width="4"/><text x="754" y="183.8888888888889" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">TR</text><line x1="140" y1="364" x2="750" y2="269.55555555555554" stroke="#1e2a44" stroke-width="3.5"/><text x="754" y="287.55555555555554" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">TC</text><line x1="140" y1="364" x2="750" y2="231.77777777777777" stroke="#b5602e" stroke-width="3.5" stroke-dasharray="10 6"/><text x="756" y="235.77777777777777" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">TC at $3.50</text><circle cx="506" cy="307.33333333333337" r="7" fill="#1e2a44"/><circle cx="579.2" cy="268.79999999999995" r="7" fill="#b5602e"/><line x1="506" y1="307.33333333333337" x2="506" y2="500" stroke="#1e2a44" stroke-width="2" stroke-dasharray="5 5"/><line x1="579.2" y1="268.79999999999995" x2="579.2" y2="500" stroke="#b5602e" stroke-width="2" stroke-dasharray="5 5"/><line x1="652.4" y1="230.26666666666665" x2="652.4" y2="500" stroke="#2e6b62" stroke-width="2" stroke-dasharray="5 5"/><text x="658.4" y="486" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">forecast 4,200</text><text x="380" y="612" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Contribution</text><text x="590" y="612" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Break-even</text><text x="846" y="612" font-size="15" font-weight="700" fill="#4a5568" text-anchor="end">Margin of safety</text><rect x="30" y="624" width="840" height="70" rx="12" fill="#ffffff" stroke="#2e6