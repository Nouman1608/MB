<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 790" width="900" height="790" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="790" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading changes on a break-even chart</text>

<rect x="30" y="110" width="410" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Price rises</text><line x1="80" y1="190" x2="80" y2="470" stroke="#1e2a44" stroke-width="3"/><line x1="80" y1="470" x2="410" y2="470" stroke="#1e2a44" stroke-width="3"/><line x1="80" y1="360" x2="410" y2="270" stroke="#b5602e" stroke-width="3.5"/><text x="414" y="275" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">TC</text><line x1="80" y1="470" x2="410" y2="210" stroke="#2e6b62" stroke-width="3.5"/><text x="414" y="215" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TR</text><line x1="80" y1="470" x2="348.125" y2="210" stroke="#2e6b62" stroke-width="3.5" stroke-dasharray="9 6"/><text x="344.125" y="200" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">TR after price rise</text><line x1="293.52941176470586" y1="460" x2="293.52941176470586" y2="470" stroke="#1e2a44" stroke-width="3"/><line x1="237.82608695652172" y1="460" x2="237.82608695652172" y2="470" stroke="#1e2a44" stroke-width="3"/><line x1="289.52941176470586" y1="492" x2="241.82608695652172" y2="492" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><text x="265.6777493606138" y="520" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">break-even moves left</text><rect x="460" y="110" width="410" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Fixed costs rise</text><line x1="510" y1="190" x2="510" y2="470" stroke="#1e2a44" stroke-width="3"/><line x1="510" y1="470" x2="840" y2="470" stroke="#1e2a44" stroke-width="3"/><line x1="510" y1="470" x2="840" y2="210" stroke="#2e6b62" stroke-width="3.5"/><text x="844" y="215" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TR</text><line x1="510" y1="360" x2="840" y2="270" stroke="#b5602e" stroke-width="3.5"/><text x="844" y="284" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">TC</text><line x1="510" y1="310" x2="840" y2="220" stroke="#b5602e" stroke-width="3.5" stroke-dasharray="9 6"/><text x="520" y="248" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">TC after fixed costs rise</text><line x1="723.5294117647059" y1="460" x2="723.5294117647059" y2="470" stroke="#1e2a44" stroke-width="3"/><line x1="820.5882352941177" y1="460" x2="820.5882352941177" y2="470" stroke="#1e2a44" stroke-width="3"/><line x1="727.5294117647059" y1="492" x2="816.5882352941177" y2="492" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><text x="752.0588235294117" y="520" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">break-even moves right</text><rect x="30" y="550" width="840" height="210" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="56" y="586" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Limitations of break-even</text><rect x="56" y="604" width="252" height="62" rx="10" fill="#fbf3ee" stroke="#b5602e" stroke-width="2"/><text x="70" y="641" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Assumes all output is sold</text><rect x="328" y="604" width="252" height="62" rx="10" fill="#fbf3ee" stroke="#b5602e" stroke-width="2"/><text x="342" y="630" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Assumes price and unit</text><text x="342" y="651" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">variable cost stay constant</text><rect x="600" y="604" width="252" height="62" rx="10" fill="#fbf3ee" stroke="#b5602e" stroke-width="2"/><text x="614" y="630" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Treats fixed costs as fixed</text><text x="614" y="651" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">at every output</text><rect x="56" y="678" width="252" height="62" rx="10" fill="#fbf3ee" stroke="#b5602e" stroke-width="2"/><text x="70" y="704" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Hard to use with many</text><text x="70" y="725" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">products</text><rect x="328" y="678" width="252" height="62" rx="10" fill="#fbf3ee" stroke="#b5602e" stroke-width="2"/><text x="342" y="704" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Only as reliable as the</text><text x="342" y="725" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sales forecast</text>
</svg>