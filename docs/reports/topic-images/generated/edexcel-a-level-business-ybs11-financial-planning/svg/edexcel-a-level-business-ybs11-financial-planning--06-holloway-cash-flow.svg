<rect width="900" height="1002" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Holloway Tiles: rising sales, falling cash</text>

<rect x="30" y="110" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="146" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Half of each month’s sales is paid now, half next month</text><text x="160" y="186" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Dec</text><text x="160" y="210" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">sales $10,000</text><rect x="100" y="224" width="58" height="50" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="162" y="224" width="58" height="50" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="129" y="255" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle"></text><text x="191" y="255" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">$5,000</text><path d="M191,276 C210,330 290,330 325,300" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ahO)"/><text x="360" y="186" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Jan</text><text x="360" y="210" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">sales $12,000</text><rect x="300" y="224" width="58" height="50" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="362" y="224" width="58" height="50" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="329" y="255" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">$6,000</text><text x="391" y="255" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">$6,000</text><path d="M391,276 C410,330 490,330 525,300" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ahO)"/><text x="360" y="410" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">in: $11,000</text><text x="560" y="186" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Feb</text><text x="560" y="210" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">sales $15,000</text><rect x="500" y="224" width="58" height="50" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="562" y="224" width="58" height="50" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="529" y="255" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">$7,500</text><text x="591" y="255" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">$7,500</text><path d="M591,276 C610,330 690,330 725,300" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ahO)"/><text x="560" y="410" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">in: $13,500</text><text x="760" y="186" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Mar</text><text x="760" y="210" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">sales $18,000</text><rect x="700" y="224" width="58" height="50" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="762" y="224" width="58" height="50" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="729" y="255" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">$9,000</text><text x="791" y="255" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">$9,000</text><text x="760" y="410" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">in: $16,500</text><rect x="80" y="386" width="18" height="18" rx="3" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.5"/><text x="104" y="401" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">cash now</text><rect x="80" y="412" width="18" height="18" rx="3" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.5"/><text x="104" y="427" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">credit: paid next month</text><rect x="30" y="460" width="840" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="496" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Closing balance</text><line x1="140" y1="760" x2="850" y2="760" stroke="#c9d6d4" stroke-width="1.5"/><text x="130" y="766" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$0</text><line x1="140" y1="640" x2="850" y2="640" stroke="#c9d6d4" stroke-width="1.5"/><text x="130" y="646" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$2,000</text><line x1="140" y1="520" x2="850" y2="520" stroke="#c9d6d4" stroke-width="1.5"/><text x="130" y="526" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$4,000</text><rect x="180" y="520" width="110" height="240" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="235" y="510" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">$4,000</text><text x="235" y="786" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Start</text><text x="235" y="808" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle"></text><rect x="350" y="610" width="110" height="150" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="405" y="600" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">$2,500</text><text x="405" y="786" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Jan</text><text x="405" y="808" font-size="15" font-weight="600" fill="#b5602e" text-anchor="middle">net −$1,500</text><rect x="520" y="640" width="110" height="120" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="575" y="630" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">$2,000</text><text x="575" y="786" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Feb</text><text x="575" y="808" font-size="15" font-weight="600" fill="#b5602e" text-anchor="middle">net −$500</text><rect x="690" y="550" width="110" height="210" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="745" y="540" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">$3,500</text><text x="745" y="786" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Mar</text><text x="745" y="808" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">net +$1,500</text><line x1="140" y1="760" x2="850" y2="760" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="840" width="840" height="132" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="880" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Sales rise every month, but cash falls in January and February.</text><text x="56" y="907" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Outflows of $12,500 and $14,000 exceed inflows of $11,000 and $13,500, because half of each</text><text x="56" y="930" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">month’s sales arrives a month later. Holloway can arrange an overdraft or shorten credit</text><text x="56" y="953" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">terms in advance.</text>
</svg>