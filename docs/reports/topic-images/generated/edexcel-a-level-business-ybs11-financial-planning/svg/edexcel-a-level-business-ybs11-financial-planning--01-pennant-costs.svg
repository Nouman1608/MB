<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="670" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Fixed, variable and average cost</text>

<rect x="30" y="110" width="520" height="530" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Pennant Print: monthly costs</text><line x1="140" y1="560" x2="525" y2="560" stroke="#c9d6d4" stroke-width="1.5"/><text x="130" y="566" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$0</text><line x1="140" y1="436.6666666666667" x2="525" y2="436.6666666666667" stroke="#c9d6d4" stroke-width="1.5"/><text x="130" y="442.6666666666667" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$15,000</text><line x1="140" y1="313.33333333333337" x2="525" y2="313.33333333333337" stroke="#c9d6d4" stroke-width="1.5"/><text x="130" y="319.33333333333337" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$30,000</text><line x1="140" y1="190" x2="525" y2="190" stroke="#c9d6d4" stroke-width="1.5"/><text x="130" y="196" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$45,000</text><rect x="190" y="412" width="130" height="148" fill="#2e6b62" stroke="#1e2a44" stroke-width="2.5"/><rect x="190" y="288.6666666666667" width="130" height="123.33333333333333" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="255" y="492" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">FC $18,000</text><text x="255" y="356.33333333333337" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">VC $15,000</text><text x="255" y="276.6666666666667" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">TC $33,000</text><text x="255" y="588" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">6,000 units</text><text x="255" y="612" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">average $5.50</text><rect x="370" y="412" width="130" height="148" fill="#2e6b62" stroke="#1e2a44" stroke-width="2.5"/><rect x="370" y="227" width="130" height="185" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="435" y="492" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">FC $18,000</text><text x="435" y="325.5" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">VC $22,500</text><text x="435" y="215" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">TC $40,500</text><text x="435" y="588" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">9,000 units</text><text x="435" y="612" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">average $4.50</text><line x1="140" y1="560" x2="525" y2="560" stroke="#1e2a44" stroke-width="2.5"/><rect x="570" y="110" width="300" height="125" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="590" y="142" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">At 6,000 units</text><text x="590" y="170" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">VC = 6,000 × $2.50 = $15,000</text><text x="590" y="195" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">AC = $33,000 ÷ 6,000 = $5.50</text><rect x="570" y="250" width="300" height="125" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="590" y="282" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">At 9,000 units</text><text x="590" y="310" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">VC = 9,000 × $2.50 = $22,500</text><text x="590" y="335" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">AC = $40,500 ÷ 9,000 = $4.50</text><rect x="570" y="390" width="300" height="250" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="590" y="424" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Why average cost falls</text><text x="590" y="456" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The same $18,000 of fixed</text><text x="590" y="479" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">costs is spread over more</text><text x="590" y="502" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">units, so higher volume</text><text x="590" y="525" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">improves profit per unit, not</text><text x="590" y="548" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">just revenue.</text>
</svg>