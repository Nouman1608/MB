x1="367" y1="366.66666666666663" x2="394" y2="366.66666666666663" stroke="#1e2a44" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="394" y="316.6666666666667" width="90" height="50" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="439" y="306.6666666666667" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">+$1,500 F</text><text x="439" y="626" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Materials</text><line x1="484" y1="316.6666666666667" x2="511" y2="316.6666666666667" stroke="#1e2a44" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="511" y="316.6666666666667" width="90" height="40" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="556" y="306.6666666666667" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">−$1,200 A</text><text x="556" y="626" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Labour</text><line x1="601" y1="356.66666666666663" x2="628" y2="356.66666666666663" stroke="#1e2a44" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="628" y="356.66666666666663" width="90" height="3" fill="#4a5568" stroke="#1e2a44" stroke-width="2"/><text x="673" y="346.66666666666663" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">none</text><text x="673" y="626" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Overheads</text><line x1="718" y1="356.66666666666663" x2="745" y2="356.66666666666663" stroke="#1e2a44" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="745" y="356.66666666666663" width="90" height="243.33333333333334" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="790" y="346.66666666666663" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">$7,300</text><text x="790" y="626" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Actual</text><text x="790" y="646" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">profit</text><line x1="140" y1="600" x2="850" y2="600" stroke="#1e2a44" stroke-width="2.5"/><text x="56" y="676" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">F = favourable (raises profit)   A = adverse (lowers profit)</text><rect x="30" y="710" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="750" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Investigate labour first.</text><text x="56" y="777" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Labour is $1,200 over budget despite lower sales. The materials saving may only reflect</text><text x="56" y="800" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">lower sales volume, not better buying.</text>
