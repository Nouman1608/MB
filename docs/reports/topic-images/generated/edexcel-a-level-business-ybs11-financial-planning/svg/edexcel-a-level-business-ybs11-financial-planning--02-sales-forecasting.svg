<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 836" width="900" height="836" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="836" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What feeds a sales forecast, and what it feeds</text>

<rect x="30" y="110" width="290" height="134" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Consumer trends</text><text x="48" y="177" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">e.g. a shift towards healthier</text><text x="48" y="198" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">food changes what people buy</text><line x1="322" y1="177" x2="372" y2="330" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="260" width="290" height="134" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="296" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Economic variables</text><text x="48" y="327" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Incomes, inflation, interest</text><text x="48" y="348" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">rates, exchange rates change</text><text x="48" y="369" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">ability to spend</text><line x1="322" y1="327" x2="372" y2="330" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="410" width="290" height="134" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="446" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Competitors’ actions</text><text x="48" y="477" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A new rival or a price cut</text><text x="48" y="498" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">changes the firm’s share</text><line x1="322" y1="477" x2="372" y2="330" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="376" y="270" width="160" height="120" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="456" y="319" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Sales</text><text x="456" y="346" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">forecast</text><text x="706" y="132" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Used to plan</text><rect x="580" y="150" width="290" height="68" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="598" y="191" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Production and inventory</text><rect x="580" y="232" width="290" height="68" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="598" y="273" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Staffing</text><rect x="580" y="314" width="290" height="68" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="598" y="342" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Cash-flow forecasts and</text><text x="598" y="365" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">budgets</text><rect x="580" y="396" width="290" height="68" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="598" y="437" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Applications for finance</text><line x1="538" y1="330" x2="576" y2="330" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="580" width="840" height="190" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="56" y="616" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Difficulties</text><rect x="56" y="632" width="252" height="54" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="70" y="654" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">No sales history for new</text><text x="70" y="674" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">businesses or products</text><rect x="328" y="632" width="252" height="54" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="342" y="665" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Tastes can change quickly</text><rect x="600" y="632" width="252" height="54" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="614" y="654" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Economic conditions are hard</text><text x="614" y="674" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">to predict</text><rect x="56" y="696" width="252" height="54" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="70" y="718" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Rivals’ actions are unknown</text><text x="70" y="738" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">in advance</text><rect x="328" y="696" width="252" height="54" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="342" y="718" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">An over-optimistic owner may</text><text x="342" y="738" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">bias the figures</text><text x="450" y="806" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">A wrong forecast feeds errors into every plan built on it.</text>
</svg>