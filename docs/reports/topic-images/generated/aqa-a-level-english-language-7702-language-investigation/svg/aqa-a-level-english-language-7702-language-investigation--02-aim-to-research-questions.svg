<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="670" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From aim to research questions</text>

<rect x="150" y="120" width="600" height="92" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="450" y="155" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">AIM</text><text x="450" y="186" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">To explore how two football commentators construct excitement</text><line x1="450" y1="212" x2="170" y2="282" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="40" y="290" width="260" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="80" cy="330" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="80" y="337.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="115" y="323" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">RQ1</text><text x="115" y="346" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Grammar</text><text x="64" y="395" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">tense, ellipsis, sentence</text><text x="64" y="420" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">length at moments of</text><text x="64" y="445" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">high action</text><text x="64" y="474" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">points to features + data</text><line x1="450" y1="212" x2="450" y2="282" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="320" y="290" width="260" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="360" cy="330" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="360" y="337.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="395" y="323" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">RQ2</text><text x="395" y="346" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Prosody</text><text x="344" y="395" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">pace, pitch and volume</text><text x="344" y="420" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">accompanying these</text><text x="344" y="445" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">moments</text><text x="344" y="474" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">points to features + data</text><line x1="450" y1="212" x2="730" y2="282" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="600" y="290" width="260" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="640" cy="330" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="640" y="337.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="675" y="323" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">RQ3</text><text x="675" y="346" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Context</text><text x="624" y="395" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">how radio or television</text><text x="624" y="420" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">shapes the language</text><text x="624" y="445" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">used</text><text x="624" y="474" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">points to features + data</text><rect x="40" y="520" width="820" height="120" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="64" y="556" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Alternative: a hypothesis</text><text x="64" y="586" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"Commentator A will use more ellipsis during goals"</text><text x="64" y="616" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Research questions are often more flexible: language data rarely gives yes or no answers.</text>
</svg>