<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="720" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Recording people: ethics and the observer's paradox</text>

<rect x="40" y="115" width="360" height="430" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="220" y="155" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">Ethics</text><circle cx="78" cy="205" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="78" y="211" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">✓</text><text x="104" y="211" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Informed consent</text><text x="104" y="237" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">before recording anyone</text><circle cx="78" cy="285" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="78" y="291" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">✓</text><text x="104" y="291" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Anonymise</text><text x="104" y="317" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">initials or labels such</text><text x="104" y="338" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">as Speaker A</text><circle cx="78" cy="390" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="78" y="396" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">✓</text><text x="104" y="396" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Store data</text><text x="104" y="422" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">responsibly</text><circle cx="78" cy="470" r="13" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="78" y="476" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">!</text><text x="104" y="476" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Covert recording</text><text x="104" y="502" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">discuss with your teacher</text><rect x="420" y="115" width="440" height="430" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="640" y="155" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">The observer's paradox</text><text x="640" y="180" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">described by William Labov</text><rect x="450" y="200" width="380" height="70" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="640" y="228" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">You want how people talk</text><text x="640" y="250" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">when they are not observed</text><line x1="640" y1="270" x2="640" y2="305" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="450" y="310" width="380" height="46" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="640" y="340" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">But you have to record them</text><line x1="640" y1="356" x2="640" y2="391" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="450" y="396" width="380" height="70" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="640" y="424" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Recording may make speech</text><text x="640" y="446" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">more careful or formal</text><path d="M450,431 L436,431 L436,235 L446,235" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahR)" stroke-dasharray="7 6"/><text x="640" y="498" font-size="17" font-weight="600" fill="#b5602e" text-anchor="middle">Acknowledge any effect that remains</text><text x="640" y="524" font-size="17" font-weight="600" fill="#b5602e" text-anchor="middle">in the methodology</text><rect x="40" y="565" width="820" height="125" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="64" y="600" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Strategies to reduce the effect</text><rect x="64" y="616" width="250" height="60" rx="12" fill="#ffffff" stroke="#d4b02e" stroke-width="2"/><text x="189" y="640" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Longer recordings</text><text x="189" y="664" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">(people relax)</text><rect x="334" y="616" width="250" height="60" rx="12" fill="#ffffff" stroke="#d4b02e" stroke-width="2"/><text x="459" y="652" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Familiar settings</text><rect x="604" y="616" width="250" height="60" rx="12" fill="#ffffff" stroke="#d4b02e" stroke-width="2"/><text x="729" y="640" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">An activity that</text><text x="729" y="664" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">absorbs attention</text>
</svg>