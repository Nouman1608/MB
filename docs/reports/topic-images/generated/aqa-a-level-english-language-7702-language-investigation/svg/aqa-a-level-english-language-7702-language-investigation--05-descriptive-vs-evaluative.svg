<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="670" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Methodology: describe or evaluate?</text>

<rect x="40" y="115" width="820" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="64" y="150" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Descriptive</text><text x="64" y="185" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"I recorded my family at dinner for 20 minutes and transcribed it."</text><text x="64" y="210" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Says what was done, but not why, how good it was, or what could be better.</text><rect x="40" y="245" width="820" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="64" y="282" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Evaluative</text><rect x="64" y="302" width="130" height="99" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="129" y="357.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">WHY</text><text x="210" y="332" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"I recorded a 20-minute family meal because a familiar, routine setting</text><text x="210" y="357" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">was likely to reduce the observer's paradox; the first five minutes were</text><text x="210" y="382" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">excluded from analysis as participants were visibly aware of the recorder."</text><rect x="64" y="415" width="130" height="49" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="129" y="445.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">WEAKNESS</text><text x="210" y="445" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"A single meal limits how far the findings can be generalised,"</text><rect x="64" y="478" width="130" height="74" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="129" y="521" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">IMPROVE</text><text x="210" y="508" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"and a second recording on a different day would have strengthened</text><text x="210" y="533" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">reliability."</text><text x="64" y="588" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Also state the approach to analysis: which levels and frameworks, and</text><text x="64" y="612" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">whether it is quantitative, qualitative or both.</text>
</svg>