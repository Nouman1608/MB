<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="560" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Writing a cautious conclusion</text>

<rect x="40" y="120" width="460" height="56" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="78" cy="148" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="78" y="154.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="110" y="155" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Answer each research question in turn</text><line x1="270" y1="176" x2="270" y2="188" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="40" y="190" width="460" height="56" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="78" cy="218" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="78" y="224.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="110" y="225" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">State what the data suggests</text><line x1="270" y1="246" x2="270" y2="258" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="40" y="260" width="460" height="56" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="78" cy="288" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="78" y="294.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="110" y="295" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Qualify by sample size and context</text><line x1="270" y1="316" x2="270" y2="328" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="40" y="330" width="460" height="56" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="78" cy="358" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="78" y="364.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="110" y="365" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Identify what further research could test</text><rect x="530" y="120" width="330" height="266" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="695" y="160" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">Signs of caution</text><rect x="590" y="182" width="210" height="46" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="695" y="212" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">"suggests"</text><rect x="590" y="244" width="210" height="46" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="695" y="274" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">"in this data"</text><rect x="590" y="306" width="210" height="46" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="695" y="336" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">"may"</text><rect x="40" y="410" width="820" height="120" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="64" y="448" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Avoid</text><text x="140" y="448" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"all men interrupt"</text><text x="64" y="482" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A claim from a tiny sample, stated as fact. Qualify every claim by how</text><text x="64" y="508" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">much data you collected and the context it came from.</text>
</svg>