<rect x="40" y="120" width="820" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="60" y="137" width="90" height="44" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="105" y="166" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">AO1</text><text x="175" y="155" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Methods of language analysis</text><text x="175" y="182" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">terminology and coherent expression</text><rect x="40" y="212" width="820" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="60" y="229" width="90" height="44" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="105" y="258" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">AO2</text><text x="175" y="247" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Concepts and issues</text><text x="175" y="274" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">critical understanding</text><rect x="40" y="304" width="820" height="78" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><rect x="60" y="321" width="90" height="44" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="105" y="350" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">AO3</text><text x="175" y="339" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Context and meaning</text><text x="175" y="366" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">how contextual factors and language features construct meaning</text><text x="450" y="420" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">AO3 runs through the whole analysis, not one paragraph</text><rect x="60" y="442" width="180" height="90" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="150" y="472" font-size="17" font-weight="40