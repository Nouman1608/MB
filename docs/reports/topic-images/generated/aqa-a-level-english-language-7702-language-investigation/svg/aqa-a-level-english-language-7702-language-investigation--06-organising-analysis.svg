<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" width="900" height="740" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="740" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Organising the analysis</text>

<rect x="40" y="115" width="395" height="215" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="237" y="152" font-size="21" font-weight="700" fill="#b5602e" text-anchor="middle">Text by text</text><rect x="80" y="172" width="315" height="36" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="237" y="196" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Text 1: everything</text><rect x="80" y="218" width="315" height="36" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="237" y="242" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Text 2: everything</text><rect x="80" y="264" width="315" height="36" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="237" y="288" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Text 3: everything</text><text x="237" y="318" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">turns into description</text><rect x="465" y="115" width="395" height="215" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="662" y="152" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">By research question or feature</text><rect x="505" y="172" width="315" height="36" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="662" y="196" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">RQ1: all the data compared</text><rect x="505" y="218" width="315" height="36" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="662" y="242" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">RQ2: all the data compared</text><rect x="505" y="264" width="315" height="36" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="662" y="288" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">RQ3: all the data compared</text><text x="662" y="318" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">keeps the analysis on the aim</text><text x="450" y="375" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Inside each section</text><rect x="40" y="398" width="820" height="56" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="78" cy="426" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="78" y="432.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="112" y="433" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evidence</text><text x="270" y="433" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">examples, counts, percentages, referenced to the appendices</text><rect x="40" y="464" width="820" height="56" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="78" cy="492" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="78" y="498.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="112" y="499" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Interpret</text><text x="270" y="499" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">concepts and terminology from the relevant level</text><rect x="40" y="530" width="820" height="56" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="78" cy="558" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="78" y="564.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="112" y="565" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Test theory</text><text x="270" y="565" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">bring in research critically; test it against your data</text><rect x="40" y="596" width="820" height="56" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="78" cy="624" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="78" y="630.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="112" y="631" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Context</text><text x="270" y="631" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">audience, purpose, genre, mode, relationships, setting</text><rect x="40" y="662" width="820" height="56" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="78" cy="690" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="78" y="696.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="112" y="697" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Complexities</text><text x="270" y="697" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">note counter-examples</text>
</svg>