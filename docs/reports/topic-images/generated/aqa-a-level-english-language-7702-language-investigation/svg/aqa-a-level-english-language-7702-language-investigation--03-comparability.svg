<rect width="900" height="730" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Keeping data sets comparable</text>

<rect x="40" y="120" width="820" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330" y="165" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Data set A</text><text x="680" y="165" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Data set B</text><text x="70" y="230" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Length</text><rect x="220" y="190" width="220" height="58" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="330" y="226" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">similar</text><rect x="570" y="190" width="220" height="58" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="680" y="226" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">similar</text><text x="505" y="230" font-size="30" font-weight="700" fill="#2e6b62" text-anchor="middle">=</text><text x="70" y="308" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Context</text><rect x="220" y="268" width="220" height="58" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="330" y="304" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">similar</text><rect x="570" y="268" width="220" height="58" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="680" y="304" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">similar</text><text x="505" y="308" font-size="30" font-weight="700" fill="#2e6b62" text-anchor="middle">=</text><text x="70" y="386" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Date</text><rect x="220" y="346" width="220" height="58" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="330" y="382" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">similar</text><rect x="570" y="346" width="220" height="58" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="680" y="382" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">similar</text><text x="505" y="386" font-size="30" font-weight="700" fill="#2e6b62" text-anchor="middle">=</text><text x="70" y="464" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Factor</text><text x="70" y="486" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">you study</text><rect x="220" y="434" width="220" height="70" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="3"/><text x="330" y="476" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><rect x="570" y="434" width="220" height="70" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="3"/><text x="680" y="476" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><text x="505" y="478" font-size="30" font-weight="700" fill="#b5602e" text-anchor="middle">≠</text><text x="450" y="560" font-size="18" font-weight="600" fill="#2e6b62" text-anchor="middle">Only one thing differs, so a difference in the data can be traced to it.</text><rect x="40" y="610" width="820" height="90" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="64" y="645" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Broadcast example: same sport, same length of extract.</text><text x="64" y="675" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">If other variables differ too, you cannot tell which one caused the difference.</text>
</svg>