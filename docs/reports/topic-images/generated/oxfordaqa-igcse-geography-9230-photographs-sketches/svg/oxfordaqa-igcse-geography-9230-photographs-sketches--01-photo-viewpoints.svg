<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 721" width="900" height="721" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="721" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four kinds of photograph</text>

<rect x="30" y="110" width="840" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M60,360 Q200,330 330,345 Q470,300 600,330 Q720,350 840,320 L840,390 L60,390 Z" fill="#d8e3c6" stroke="#1e2a44" stroke-width="2"/><g transform="translate(130,336) rotate(0)"><rect x="-14" y="-9" width="28" height="18" rx="3" fill="#1e2a44"/><circle cx="14" cy="0" r="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/></g><line x1="150" y1="336" x2="250" y2="336" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)" stroke-dasharray="6 5"/><text x="110" y="312" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Ground</text><g transform="translate(330,190) rotate(40)"><rect x="-14" y="-9" width="28" height="18" rx="3" fill="#1e2a44"/><circle cx="14" cy="0" r="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/></g><line x1="346" y1="204" x2="430" y2="290" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)" stroke-dasharray="6 5"/><text x="300" y="168" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Oblique aerial</text><g transform="translate(560,180) rotate(90)"><rect x="-14" y="-9" width="28" height="18" rx="3" fill="#1e2a44"/><circle cx="14" cy="0" r="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/></g><line x1="560" y1="196" x2="560" y2="296" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)" stroke-dasharray="6 5"/><text x="560" y="158" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Vertical aerial</text><rect x="740" y="140" width="40" height="22" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><rect x="718" y="146" width="20" height="10" fill="#2b5a9a"/><rect x="782" y="146" width="20" height="10" fill="#2b5a9a"/><line x1="760" y1="164" x2="760" y2="296" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)" stroke-dasharray="6 5"/><text x="760" y="188" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="774" y="226" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Satellite</text><text x="774" y="246" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(from space)</text><text x="856" y="404" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">schematic, not to scale</text><text x="220" y="434" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">✓ Best for</text><text x="560" y="434" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">✗ Limitation</text><rect x="30" y="444" width="840" height="62.24" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="46" y="481.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Ground</text><text x="220" y="469" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">detail of landforms, buildings and</text><text x="220" y="490.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">people</text><text x="560" y="469" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">only what is in line of sight;</text><text x="560" y="490.12" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">foreground hides background</text><rect x="30" y="506.24" width="840" height="62.24" fill="#f7f9f9" stroke="#c9d6d4" stroke-width="1.5"/><text x="46" y="543.36" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Oblique aerial</text><text x="220" y="531.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">shape of landforms and settlement,</text><text x="220" y="552.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">with a sense of height</text><text x="560" y="541.8" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">scale changes from front to back</text><rect x="30" y="568.48" width="840" height="62.24" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="46" y="605.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Vertical aerial</text><text x="220" y="593.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">layout, like a map; measuring and</text><text x="220" y="614.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">matching to maps</text><text x="560" y="604.04" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">height is hard to judge</text><rect x="30" y="630.72" width="840" height="62.24" fill="#f7f9f9" stroke="#c9d6d4" stroke-width="1.5"/><text x="46" y="667.84" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Satellite</text><text x="220" y="666.28" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">large areas; change over time</text><text x="560" y="655.72" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">less detail; colours may be</text><text x="560" y="676.84" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">processed</text>
</svg>