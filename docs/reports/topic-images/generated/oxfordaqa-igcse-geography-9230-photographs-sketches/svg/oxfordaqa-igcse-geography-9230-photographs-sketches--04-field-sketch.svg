ight="400" fill="#1e2a44" text-anchor="start">Label each feature</text><rect x="590" y="398.96000000000004" width="280" height="64.24000000000001" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><circle cx="612" cy="431.08000000000004" r="13" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="612" y="435.76000000000005" font-size="13" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="634" y="424.96000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Annotate to explain, if</text><text x="634" y="446.08000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">asked</text><rect x="590" y="471.20000000000005" width="280" height="64.24000000000001" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><circle cx="612" cy="503.32000000000005" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="612" y="508.00000000000006" font-size="13" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="634" y="497.20000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Add a title, the place and</text><text x="634" y="518.32" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the direction of view</text><rect x="30" y="557.44" width="840" height="52.44" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="588.59" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">A few clean lines with good annotations beat a detailed drawing with no labels.</text>
