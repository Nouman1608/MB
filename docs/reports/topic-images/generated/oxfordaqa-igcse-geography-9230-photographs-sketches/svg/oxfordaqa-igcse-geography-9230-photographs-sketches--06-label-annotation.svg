<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 469" width="900" height="469" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="469" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Labels and annotations</text>

<text x="240" y="132" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Label: names a feature</text><text x="650" y="132" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">Annotation: explains or describes it</text><rect x="30" y="150" width="400" height="90" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="230" y="204" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">“Beach”</text><line x1="434" y1="195" x2="456" y2="195" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="460" y="150" width="410" height="90" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="480" y="189.78" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Wide sandy beach, built up by</text><text x="480" y="212.22" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">constructive waves in a sheltered bay”</text><rect x="30" y="256" width="400" height="90" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="230" y="310" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">“Housing”</text><line x1="434" y1="301" x2="456" y2="301" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="460" y="256" width="410" height="90" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="480" y="295.78" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Terraced housing close to the old town</text><text x="480" y="318.21999999999997" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">centre, high density”</text><rect x="30" y="366" width="840" height="74.88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="397.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">A good annotation often includes a reason or a process, linking the skill to your knowledge of</text><text x="450" y="419.59" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">the topic.</text>
</svg>