<rect width="900" height="631" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Matching a photograph to a map</text>

<rect x="30" y="110" width="520" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="70" y="140" width="440" height="440" fill="#f4f7ee" stroke="#1e2a44" stroke-width="2"/><line x1="180" y1="140" x2="180" y2="580" stroke="#c9d6d4" stroke-width="1.5"/><line x1="70" y1="250" x2="510" y2="250" stroke="#c9d6d4" stroke-width="1.5"/><line x1="290" y1="140" x2="290" y2="580" stroke="#c9d6d4" stroke-width="1.5"/><line x1="70" y1="360" x2="510" y2="360" stroke="#c9d6d4" stroke-width="1.5"/><line x1="400" y1="140" x2="400" y2="580" stroke="#c9d6d4" stroke-width="1.5"/><line x1="70" y1="470" x2="510" y2="470" stroke="#c9d6d4" stroke-width="1.5"/><path d="M70,470 Q270,440 330,340 Q390,230 510,200" fill="none" stroke="#2b5a9a" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" /><rect x="306" y="354" width="52" height="14" rx="2" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><text x="366" y="380" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">bridge</text><rect x="388" y="284" width="24" height="20" rx="1" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><path d="M396,284 L396,266 M390,272 L402,272" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="418" y="298" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">church</text><path d="M160,520 L470,250 L320,180 Z" fill="#d4b02e" opacity="0.25"/><line x1="160" y1="520" x2="370" y2="310" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><circle cx="160" cy="520" r="11" fill="#1e2a44"/><text x="176" y="526" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">camera</text><circle cx="490" cy="520" r="24" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><line x1="490" y1="534" x2="490" y2="500" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="490" y="490" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">N</text><text x="290" y="572" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">plan view, fictional map, not to scale</text><rect x="566" y="120" width="304" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="592" cy="148" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="592" y="153.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="616" y="154" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Identify two features in</text><text x="616" y="176.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">the photograph</text><text x="586" y="202.88" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">e.g. a church and a bridge</text><rect x="566" y="232" width="304" height="98.68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="592" cy="260" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="592" y="265.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="616" y="266" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Locate them on the map</text><text x="586" y="292.44" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">four-figure reference for an</text><text x="586" y="313.56" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">area, six-figure for a point</text><rect x="566" y="342.68" width="304" height="121.12" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="592" cy="370.68" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="592" y="376.08" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="616" y="376.68" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Work out where the camera</text><text x="616" y="399.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">was pointing</text><text x="586" y="425.56" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">give a compass direction:</text><text x="586" y="446.68" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“looking north-east”</text><rect x="566" y="479.8" width="304" height="123" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="584" y="513.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Map and photograph</text><text x="584" y="541.07" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">map: height, distance, names,</text><text x="584" y="562.19" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">wider area. Photograph: land use,</text><text x="584" y="583.3100000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">vegetation, appearance.</text>
</svg>