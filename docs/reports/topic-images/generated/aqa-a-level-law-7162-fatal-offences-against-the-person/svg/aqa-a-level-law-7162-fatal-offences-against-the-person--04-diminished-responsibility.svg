<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 672" width="900" height="672" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="672" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Diminished responsibility: s2 Homicide Act 1957</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">As amended in 2009. D proves it on the balance of probabilities</text>
<rect x="30" y="124" width="840" height="61" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">An abnormality of mental functioning which…</text><rect x="30" y="207" width="270.6666666666667" height="197" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="239" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1</text><text x="50" y="265.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Arose from a recognised</text><text x="50" y="288.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">medical condition</text><text x="50" y="316.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Psychiatric or physical:</text><text x="50" y="337.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">depression, schizophrenia,</text><text x="50" y="358.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">alcohol dependency</text><text x="50" y="379.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">syndrome</text><rect x="314.6666666666667" y="207" width="270.6666666666667" height="197" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="334.6666666666667" y="239" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">2</text><text x="334.6666666666667" y="265.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Substantially impaired his</text><text x="334.6666666666667" y="288.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">ability (s2(1A))</text><text x="334.6666666666667" y="316.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">To understand his conduct,</text><text x="334.6666666666667" y="337.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">form a rational judgment or</text><text x="334.6666666666667" y="358.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">exercise self-control</text><rect x="599.3333333333334" y="207" width="270.6666666666667" height="197" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="619.3333333333334" y="239" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">3</text><text x="619.3333333333334" y="265.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Provides an explanation</text><text x="619.3333333333334" y="288.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">(s2(1B))</text><text x="619.3333333333334" y="316.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Caused, or was a significant</text><text x="619.3333333333334" y="337.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">contributory factor in causing,</text><text x="619.3333333333334" y="358.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">his acts</text><rect x="30" y="426" width="414" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="455.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">R v Golds (2016)</text><text x="46" y="482.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“Substantially” means important or weighty, not</text><text x="46" y="503.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">merely more than trivial</text><rect x="456" y="426" width="414" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="472" y="455.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">R v Dowds (2012)</text><text x="472" y="482.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Voluntary acute intoxication is not a recognised</text><text x="472" y="503.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">medical condition</text><rect x="30" y="542" width="414" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="571.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">R v Dietschmann (2003)</text><text x="46" y="598.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Drunk plus an abnormality: did the abnormality</text><text x="46" y="619.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">impair him despite the drink?</text><rect x="456" y="542" width="414" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="472" y="571.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">R v Wood (2008)</text><text x="472" y="598.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Alcohol dependency syndrome can found the</text><text x="472" y="619.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">defence</text>
</svg>