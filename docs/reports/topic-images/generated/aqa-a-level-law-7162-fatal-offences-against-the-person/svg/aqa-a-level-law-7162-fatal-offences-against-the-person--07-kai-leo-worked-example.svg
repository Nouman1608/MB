<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 607" width="900" height="607" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="607" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: one punch outside a pub</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Test murder first, then the partial defence, then involuntary manslaughter</text>
<rect x="30" y="124" width="840" height="111" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FACTS</text><text x="50" y="188.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Kai and Leo argue outside a pub. Leo says Kai’s sister is a thief. Kai, furious, punches Leo once in</text><text x="50" y="210.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the face. Leo falls, hits his head on the kerb and dies.</text><line x1="60" y1="277" x2="60" y2="555" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="257" width="766" height="105" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="289.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Murder? Unlikely</text><text x="122" y="318.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Kai caused death. But one punch suggests no intention to kill or to cause GBH; at most some</text><text x="122" y="339.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">harm (<tspan font-style="italic">Vickers</tspan> needs GBH).</text><circle cx="60" cy="309.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="318.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="374" width="766" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="406.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Loss of control? Not needed</text><text x="122" y="435.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Only if murder is proved; an insult about a sister is unlikely to be “extremely grave” (s55(4)).</text><circle cx="60" cy="416" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="424.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="470" width="766" height="105" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122" y="502.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Unlawful act manslaughter? Likely</text><text x="122" y="531.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Battery (or s47) is the unlawful act; dangerous (<tspan font-style="italic">Church</tspan>); the fall is a foreseeable result; mens</text><text x="122" y="552.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">rea of battery present.</text><circle cx="60" cy="522.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="531.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text>
</svg>