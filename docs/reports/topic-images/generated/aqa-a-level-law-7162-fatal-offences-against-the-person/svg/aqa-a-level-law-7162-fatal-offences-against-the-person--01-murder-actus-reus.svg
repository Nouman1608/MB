<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 592" width="900" height="592" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="592" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Murder: the actus reus</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The unlawful killing of a reasonable creature in being under the King’s peace</text>
<rect x="30" y="124" width="413" height="153" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">REASONABLE CREATURE IN BEING</text><text x="50" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A human born alive</text><text x="50" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Not a foetus; but injury before birth, born alive,</text><text x="50" y="231.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">then death can be manslaughter (<tspan font-style="italic">A-G’s</tspan> <tspan font-style="italic">Ref</tspan> <tspan font-style="italic">(No</tspan></text><text x="50" y="252.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">3</tspan> <tspan font-style="italic">of</tspan> <tspan font-style="italic">1994)</tspan>)</text><rect x="457" y="124" width="413" height="153" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DEATH</text><text x="477" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Brain-stem death</text><text x="477" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Switching off life support afterwards does not</text><text x="477" y="231.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">break the chain (<tspan font-style="italic">Malcherek</tspan> <tspan font-style="italic">and</tspan> <tspan font-style="italic">Steel</tspan>, 1981)</text><rect x="30" y="295" width="413" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="327" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">UNLAWFUL</text><text x="50" y="353.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Not lawful self-defence</text><text x="50" y="381.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A killing in lawful self-defence is not murder</text><rect x="457" y="295" width="413" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="327" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NO TIME LIMIT</text><text x="477" y="353.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">“Year and a day” rule abolished</text><text x="477" y="381.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Law Reform (Year and a Day Rule) Act 1996</text><rect x="30" y="428" width="840" height="132" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="460" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CAUSATION</text><text x="50" y="486.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Factual (“but for”, R v White, 1910) and legal</text><text x="50" y="514.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Medical treatment: <tspan font-style="italic">Smith</tspan> (1959), <tspan font-style="italic">Cheshire</tspan> (1991); “palpably wrong” treatment: <tspan font-style="italic">Jordan</tspan> (1956). Thin skull:</text><text x="50" y="535.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Blaue</tspan> (1975). Foreseeable escape: <tspan font-style="italic">Roberts</tspan> (1971). Reasonable third-party acts: <tspan font-style="italic">Pagett</tspan> (1983).</text>
</svg>