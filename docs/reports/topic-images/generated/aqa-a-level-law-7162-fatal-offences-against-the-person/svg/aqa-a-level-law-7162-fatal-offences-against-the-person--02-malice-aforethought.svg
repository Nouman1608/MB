<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 643" width="900" height="643" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="643" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The mens rea of murder</text>

<rect x="250" y="100" width="400" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="136.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Malice aforethought</text><text x="450" y="165.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Express or implied</text><line x1="380" y1="194" x2="232" y2="230" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="520" y1="194" x2="668" y2="230" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="236" width="405" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="274" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXPRESS</text><text x="50" y="300.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Intention to kill</text><rect x="465" y="236" width="405" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="485" y="268" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">IMPLIED</text><text x="485" y="294.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Intention to cause GBH</text><text x="485" y="323.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Vickers</tspan> (1957); <tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Cunningham</tspan> (1981)</text><text x="450" y="388" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Either intention may be…</text><rect x="30" y="408" width="300" height="190" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="481" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DIRECT</text><text x="50" y="507.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The defendant’s aim or</text><text x="50" y="531.8199999999999" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">purpose</text><rect x="350" y="408" width="520" height="203" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="370" y="440" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">OBLIQUE: NEDRICK (1986) AS MODIFIED BY WOOLLIN (1998)</text><text x="370" y="466.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Jury entitled to find intention where:</text><text x="370" y="494.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="385.2" y="494.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">death or serious injury was a <tspan font-weight="700" fill="#1e2a44">virtual</tspan> <tspan font-weight="700" fill="#1e2a44">certainty</tspan> from the</text><text x="385.2" y="515.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">defendant’s actions, and</text><text x="370" y="540.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="385.2" y="540.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the defendant <tspan font-weight="700" fill="#1e2a44">appreciated</tspan> that this was the case</text><text x="370" y="565.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="385.2" y="565.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Matthews</tspan> <tspan font-style="italic">and</tspan> <tspan font-style="italic">Alleyne</tspan> (2003): a rule of evidence, not</text><text x="385.2" y="586.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">intention itself</text>
</svg>