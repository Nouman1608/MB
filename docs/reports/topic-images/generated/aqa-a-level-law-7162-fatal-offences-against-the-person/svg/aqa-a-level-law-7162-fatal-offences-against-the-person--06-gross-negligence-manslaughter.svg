<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 487" width="900" height="487" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="487" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Gross negligence manslaughter</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">R v Adomako (1995), building on R v Bateman (1925)</text>
<rect x="30" y="124" width="160" height="198" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1</text><text x="44" y="175.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Duty of care</text><text x="44" y="202" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Even in an illegal</text><text x="44" y="222" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">enterprise</text><text x="44" y="242" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(<tspan font-style="italic">Wacker</tspan>); or a</text><text x="44" y="262" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">dangerous state</text><text x="44" y="282" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">of affairs (<tspan font-style="italic">Evans</tspan>)</text><rect x="200" y="124" width="160" height="198" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="214" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">2</text><text x="214" y="175.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Breach</text><text x="214" y="202" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">of that duty</text><rect x="370" y="124" width="160" height="198" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="384" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">3</text><text x="384" y="175.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Serious and</text><text x="384" y="196.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">obvious risk of</text><text x="384" y="217.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">death</text><text x="384" y="244" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Not serious injury</text><text x="384" y="264" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(<tspan font-style="italic">Misra</tspan>); judged on</text><text x="384" y="284" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">information at the</text><text x="384" y="304" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">time (<tspan font-style="italic">Rose</tspan>)</text><rect x="540" y="124" width="160" height="198" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="554" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">4</text><text x="554" y="175.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Causes death</text><rect x="710" y="124" width="160" height="198" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="724" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">5</text><text x="724" y="175.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Gross</text><text x="724" y="202" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">So bad as to</text><text x="724" y="222" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">amount to a crime</text><rect x="30" y="344" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="378.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">The jury’s question</text><text x="450" y="408.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Did the conduct show such disregard for the life and safety of others as to deserve criminal</text><text x="450" y="430.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">punishment?</text>
</svg>