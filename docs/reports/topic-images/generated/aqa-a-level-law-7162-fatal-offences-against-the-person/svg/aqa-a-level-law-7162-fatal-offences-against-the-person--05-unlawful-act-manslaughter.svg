<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 629" width="900" height="629" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="629" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Unlawful act manslaughter</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Involuntary manslaughter: no malice aforethought; maximum life</text>
<line x1="60" y1="144" x2="60" y2="577" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="156.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">An unlawful act: a crime, not a civil wrong</text><text x="122" y="184.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Franklin</tspan> (1883); <tspan font-style="italic">Lamb</tspan> (1967): pointing a gun as a joke was no assault. Must be an act, not an</text><text x="122" y="205.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">omission (<tspan font-style="italic">Lowe</tspan>, 1973).</text><circle cx="60" cy="176" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="184.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="240" width="766" height="125" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="272.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Dangerous, judged objectively</text><text x="122" y="300.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Sober and reasonable people would recognise a risk of some harm (<tspan font-style="italic">Church</tspan>, 1966), knowing</text><text x="122" y="321.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">what D knew or would have learned (<tspan font-style="italic">Dawson</tspan>, 1985; <tspan font-style="italic">Watson</tspan>, 1989). The harm need not be the</text><text x="122" y="342.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">harm that killed (<tspan font-style="italic">JM</tspan> <tspan font-style="italic">and</tspan> <tspan font-style="italic">SM</tspan>, 2012).</text><circle cx="60" cy="302.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="311.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="377" width="766" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="409.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Causes death</text><text x="122" y="437.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Chain broken by the victim’s free, deliberate, informed act (<tspan font-style="italic">Kennedy</tspan> <tspan font-style="italic">(No</tspan> <tspan font-style="italic">2)</tspan>, 2007); contrast</text><text x="122" y="458.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Cato</tspan> (1976), where D injected the victim.</text><circle cx="60" cy="429" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="437.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="493" width="766" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="525.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Mens rea of the unlawful act only</text><text x="122" y="553.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">No need to foresee harm (<tspan font-style="italic">DPP</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Newbury</tspan> <tspan font-style="italic">and</tspan> <tspan font-style="italic">Jones</tspan>, 1977). The act need not be aimed at the</text><text x="122" y="574.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">victim (<tspan font-style="italic">Goodfellow</tspan>, 1986; <tspan font-style="italic">Mitchell</tspan>, 1983).</text><circle cx="60" cy="545" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="553.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text>
</svg>