<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 714" width="900" height="714" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="714" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Loss of control: ss54–56 Coroners and Justice Act 2009</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">All three elements are required; murder becomes manslaughter</text>
<line x1="60" y1="144" x2="60" y2="485" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="105" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="156.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Loss of self-control (s54(1)(a))</text><text x="122" y="185.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Need not be sudden (s54(2)). Excluded for a <tspan font-weight="700" fill="#1e2a44">considered</tspan> <tspan font-weight="700" fill="#1e2a44">desire</tspan> <tspan font-weight="700" fill="#1e2a44">for</tspan> <tspan font-weight="700" fill="#1e2a44">revenge</tspan> (s54(4)); <tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan></text><text x="122" y="206.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Jewell</tspan> (2014): a planned shooting.</text><circle cx="60" cy="176.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="185.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="241" width="766" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="273.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A qualifying trigger (s55)</text><text x="122" y="302.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Fear</tspan> of serious violence from the victim against D or another identified person (s55(3)), and/or</text><text x="122" y="323.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">anger</tspan>: things done or said, extremely grave, giving a justifiable sense of being seriously</text><text x="122" y="344.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">wronged (s55(4)).</text><circle cx="60" cy="304" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="312.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="379" width="766" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="411.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The normal person test (s54(1)(c))</text><text x="122" y="440.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A person of D’s sex and age, with normal tolerance and self-restraint, in D’s circumstances,</text><text x="122" y="461.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">might have reacted in the same or a similar way. Circumstances relevant only to general</text><text x="122" y="482.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">capacity for self-restraint are excluded (s54(3)).</text><circle cx="60" cy="442" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="450.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="30" y="527" width="413" height="155" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="559" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">EXCLUDED TRIGGERS: s55(6)</text><text x="50" y="585.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Incited as an excuse for violence; sexual</text><text x="50" y="608.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">infidelity</text><text x="50" y="636.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Clinton</tspan> (2012): infidelity can still be context</text><text x="50" y="657.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">for other triggers</text><rect x="457" y="527" width="413" height="155" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="477" y="559" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BURDEN: s54(5)–(6)</text><text x="477" y="585.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Once there is sufficient evidence</text><text x="477" y="613.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The prosecution must disprove it beyond</text><text x="477" y="634.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reasonable doubt</text>
</svg>