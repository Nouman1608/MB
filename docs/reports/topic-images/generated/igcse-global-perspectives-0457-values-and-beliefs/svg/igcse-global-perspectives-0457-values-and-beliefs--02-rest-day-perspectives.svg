<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 598" width="900" height="598" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="598" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Should large shops open on the day of rest?</text>

<text x="165" y="124" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Favour closure</text><rect x="30" y="140" width="270" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="167.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Religious groups</text><text x="44" y="194" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Rest and worship are part of</text><text x="44" y="214" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">their faith.</text><rect x="30" y="242" width="270" height="94" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="269.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Some non-religious</text><text x="44" y="291.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">families</text><text x="44" y="318" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Value shared family time.</text><rect x="30" y="346" width="270" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="373.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Small shop owners</text><text x="44" y="400" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Rest-day trade is their</text><text x="44" y="420" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">advantage.</text><text x="450" y="124" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">Divided</text><rect x="315" y="140" width="270" height="112" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="329" y="167.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Shop workers</text><text x="329" y="194" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Some want extra hours and pay;</text><text x="329" y="214" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">others fear pressure to work on</text><text x="329" y="234" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">a day they want off.</text><text x="735" y="124" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">Favour opening</text><rect x="600" y="140" width="270" height="72" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="614" y="167.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Large retailers</text><text x="614" y="194" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Expect more sales.</text><rect x="600" y="222" width="270" height="92" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="614" y="249.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Free-choice supporters</text><text x="614" y="276" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">People should decide when to</text><text x="614" y="296" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">shop or rest.</text><rect x="30" y="456" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="492" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A real compromise</text><text x="50" y="521.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Sunday Trading Act 1994 (England and Wales): large shops may open on Sundays but only for</text><text x="50" y="543.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">six hours; smaller shops for longer. A law can balance values rather than pick a side.</text>
</svg>