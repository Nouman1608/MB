<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 673" width="900" height="673" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="673" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Actions on value disagreements</text>

<rect x="30" y="104" width="840" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DENMARK, DECEMBER 2023 (94 VOTES TO 77)</text><text x="50" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A law protecting religious objects from public destruction</text><text x="50" y="191.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Penalties: a fine or up to two years in prison.</text><line x1="215" y1="284" x2="685" y2="284" stroke="#1e2a44" stroke-width="7" stroke-linecap="round"/><path d="M450,284 L420,376 L480,376 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><circle cx="450" cy="284" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="215" y1="284" x2="160" y2="339" stroke="#1e2a44" stroke-width="2.5"/><line x1="215" y1="284" x2="270" y2="339" stroke="#1e2a44" stroke-width="2.5"/><path d="M140,339 L290,339 Q275,366 215,366 Q155,366 140,339 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><line x1="685" y1="284" x2="630" y2="339" stroke="#1e2a44" stroke-width="2.5"/><line x1="685" y1="284" x2="740" y2="339" stroke="#1e2a44" stroke-width="2.5"/><path d="M610,339 L760,339 Q745,366 685,366 Q625,366 610,339 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="215" y="388" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">government</text><text x="685" y="388" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">critics</text><rect x="30" y="412" width="405" height="89" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="448" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">The government argued</text><text x="50" y="476.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="476.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Needed for Denmark’s security</text><rect x="465" y="412" width="405" height="89" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="485" y="448" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Critics argued</text><text x="485" y="476.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="500.2" y="476.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">It restricts freedom of expression</text><rect x="30" y="519" width="268" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="552.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Compromise laws</text><text x="50" y="579" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">keep some of each side’s</text><text x="50" y="599" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">values; may fully satisfy</text><text x="50" y="619" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">nobody</text><rect x="316" y="519" width="268" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="336" y="552.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Dialogue groups</text><text x="336" y="579" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">people of different faiths</text><text x="336" y="599" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">and none discuss shared</text><text x="336" y="619" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">concerns</text><rect x="602" y="519" width="268" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="622" y="552.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Flexible policies</text><text x="622" y="579" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">menu choices, time off for</text><text x="622" y="599" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">festivals</text>
</svg>