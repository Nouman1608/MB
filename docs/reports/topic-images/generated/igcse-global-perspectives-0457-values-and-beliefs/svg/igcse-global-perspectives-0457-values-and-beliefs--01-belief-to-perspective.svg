<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 830" width="900" height="830" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="830" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">When does a belief become a perspective?</text>

<rect x="30" y="104" width="249.33333333333334" height="156" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">A BELIEF</text><text x="50" y="162.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Held by faith or</text><text x="50" y="186.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">habit</text><text x="50" y="214" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Not yet a perspective in</text><text x="50" y="234" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">the syllabus sense.</text><line x1="285.33333333333337" y1="182" x2="319.33333333333337" y2="182" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="104" width="249.33333333333334" height="156" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450.00000000000006" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">+ REASONS AND EVIDENCE</text><text x="450.00000000000006" y="162.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Set out why it is</text><text x="450.00000000000006" y="186.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">held</text><line x1="580.6666666666667" y1="182" x2="614.6666666666667" y2="182" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="104" width="249.33333333333334" height="156" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="640.6666666666667" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">A PERSPECTIVE</text><text x="640.6666666666667" y="162.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">“A viewpoint on an</text><text x="640.6666666666667" y="186.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">issue based on</text><text x="640.6666666666667" y="210.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">evidence and</text><text x="640.6666666666667" y="234.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">reasoning”</text><text x="450" y="298" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Two views of values to present fairly</text><line x1="70" y1="458" x2="830" y2="458" stroke="#1e2a44" stroke-width="4" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="60" y="500" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Same everywhere</text><text x="840" y="500" font-size="18" font-weight="700" fill="#b5602e" text-anchor="end">Depends on culture</text><circle cx="114" cy="458" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><line x1="114" y1="447" x2="114" y2="434" stroke="#1e2a44" stroke-width="2.5"/><g transform="translate(0,326)"><rect x="30" y="0" width="260" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="160" y="25.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Universalism</text><text x="160" y="52" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Some values, such as basic</text><text x="160" y="72" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">human rights, apply to</text><text x="160" y="92" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">everyone everywhere.</text></g><circle cx="450" cy="458" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="450" y1="469" x2="450" y2="528" stroke="#1e2a44" stroke-width="2.5"/><g transform="translate(0,528)"><rect x="320" y="0" width="260" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="25.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Vienna Declaration</text><text x="450" y="47.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">(1993)</text><text x="450" y="74" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Rights are universal, but</text><text x="450" y="94" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">cultural and religious</text><text x="450" y="114" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">backgrounds must be borne in</text><text x="450" y="134" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">mind.</text></g><circle cx="786" cy="458" r="11" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><line x1="786" y1="447" x2="786" y2="434" stroke="#1e2a44" stroke-width="2.5"/><g transform="translate(0,326)"><rect x="610" y="0" width="260" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="740" y="25.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Cultural relativism</text><text x="740" y="52" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Values understood within each</text><text x="740" y="72" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">culture, not judged only by</text><text x="740" y="92" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">outside standards.</text></g><rect x="30" y="696" width="268" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="729.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Value</text><text x="50" y="756" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">a belief about what is</text><text x="50" y="776" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">important or right</text><rect x="316" y="696" width="268" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="336" y="729.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Secular</text><text x="336" y="756" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">not connected with religion</text><rect x="602" y="696" width="268" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="622" y="729.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Tolerance</text><text x="622" y="756" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">accepting others may live by</text><text x="622" y="776" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">beliefs you do not share</text>
</svg>