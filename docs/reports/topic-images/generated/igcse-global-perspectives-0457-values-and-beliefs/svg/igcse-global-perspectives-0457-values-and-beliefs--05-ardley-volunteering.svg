t="40" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M51,471 l18,18 m0,-18 l-18,18" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="94" y="456" width="776" height="48" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="108" y="484.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The sample is only club members</text><rect x="40" y="516" width="40" height="40" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M51,527 l18,18 m0,-18 l-18,18" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="94" y="512" width="776" height="48" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="108" y="540.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Informal help, such as caring for a relative, may not be counted</text><rect x="30" y="576" width="840" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="612" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement</text><text x="50" y="641.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The evidence cannot settle the generalisation either way.</text>
