<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 668" width="900" height="668" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="668" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Rights documents, and where they pull apart</text>

<rect x="30" y="104" width="375" height="108" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">UDHR (1948), ARTICLE 18</text><text x="50" y="162.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Freedom of thought, conscience</text><text x="50" y="186.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">and religion</text><rect x="495" y="104" width="375" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="515" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">UDHR (1948), ARTICLE 19</text><text x="515" y="162.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Freedom of opinion and</text><text x="515" y="186.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">expression</text><path d="M420,170 L480,170" stroke="#b5602e" stroke-width="4" marker-start="url(#ahR)" marker-end="url(#ahR)"/><text x="450" y="160" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">can pull</text><text x="450" y="194" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">apart</text><rect x="30" y="248" width="260" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="278" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Source</text><rect x="290" y="248" width="320" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="302" y="278" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Strength</text><rect x="610" y="248" width="260" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="622" y="278" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Limitation</text><rect x="30" y="294" width="260" height="43" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="319.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">UDHR (1948)</text><rect x="290" y="294" width="320" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="302" y="319.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Widely recognised</text><rect x="610" y="294" width="260" height="43" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="622" y="319.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A declaration, not a treaty</text><rect x="30" y="337" width="260" height="85" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="362.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">ICCPR (adopted 1966, in</text><text x="42" y="383.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">force 1976)</text><rect x="290" y="337" width="320" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="302" y="362.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">States that ratify agree to be</text><text x="302" y="383.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">bound; allows limits set by law</text><text x="302" y="404.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">where necessary</text><rect x="610" y="337" width="260" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="622" y="362.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">States interpret “necessary”</text><text x="622" y="383.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">differently</text><rect x="30" y="422" width="260" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="447.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Pew Research Center (June</text><text x="42" y="468.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">2025)</text><rect x="290" y="422" width="320" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="302" y="447.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Over 2,700 data sources, 201</text><text x="302" y="468.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">countries; transparent method</text><rect x="610" y="422" width="260" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="622" y="447.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Measures identity, not</text><text x="622" y="468.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">belief or practice</text><rect x="30" y="504" width="840" height="134" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="540" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Reliable evidence, weak reasoning</text><text x="50" y="569.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Pew estimated that in 2020 about 24.2% of the world was religiously unaffiliated. Using</text><text x="50" y="591.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">that global figure to call one country’s rest-day law out of date is a jump: the local</text><text x="50" y="613.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">share may differ, and unaffiliated people may still value a day of rest.</text>
</svg>