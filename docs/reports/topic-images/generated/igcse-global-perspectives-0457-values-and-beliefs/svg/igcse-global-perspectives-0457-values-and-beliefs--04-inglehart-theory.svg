<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 424" width="900" height="424" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="424" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Evaluating a theory of changing values</text>

<defs><linearGradient id="ig" x1="0" x2="1"><stop offset="0" stop-color="#f2e7b8"/><stop offset="1" stop-color="#b5d3cf"/></linearGradient></defs><path d="M40,124 L800,124 L860,174 L800,224 L40,224 Z" fill="url(#ig)" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><text x="70" y="168" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Survival priorities</text><text x="70" y="196" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">as economic security grows…</text><text x="780" y="168" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="end">Self-expression</text><text x="780" y="196" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">personal freedom, tolerance</text><text x="450" y="246" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Ronald Inglehart’s argument, drawing on the World Values Survey (first carried out 1981)</text><rect x="30" y="268" width="268" height="126" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="301" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRENGTH</text><text x="50" y="325.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Surveys repeated over</text><text x="50" y="347.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">decades in many</text><text x="50" y="369.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">countries</text><rect x="316" y="268" width="268" height="126" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="336" y="312" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="336" y="336.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Survey data show links,</text><text x="336" y="358.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">not proof of cause</text><rect x="602" y="268" width="268" height="126" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="622" y="301" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">CRITICS</text><text x="622" y="325.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Treats one path of</text><text x="622" y="347.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">change as normal for</text><text x="622" y="369.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">every society</text>
</svg>