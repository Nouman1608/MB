<line x1="300" y1="154" x2="373.5" y2="212.5" stroke="#1e2a44" stroke-width="2.5"/><line x1="300" y1="244" x2="373.5" y2="244" stroke="#1e2a44" stroke-width="2.5"/><line x1="300" y1="334" x2="373.5" y2="275.5" stroke="#1e2a44" stroke-width="2.5"/><line x1="600" y1="154" x2="526.5" y2="212.5" stroke="#1e2a44" stroke-width="2.5"/><line x1="600" y1="244" x2="526.5" y2="244" stroke="#1e2a44" stroke-width="2.5"/><line x1="600" y1="334" x2="526.5" y2="275.5" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="244" r="90" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="239.125" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">A person’s</text><text x="450" y="262.875" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">values</text><g transform="translate(0,24)"><rect x="30" y="104" width="270" height="52" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="134.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Upbringing and family</text><rect x="30" y="170" width="270" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="200.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Religion or belief</text><text x="46" y="228.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">teachings about rest, food,</text><text x="46" y="249.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">charity, duty</text><rect x="30" y="284" width="270" height="52" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="314.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Culture and history</text></g><g transform="translate(0,0)"><rect x="600" y="104" width="270" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="616" y="134.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Economic position</text><text x="616" y="162.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">what they stand to gain or</text><text x="616" y="183.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">lose</text><rect x="600" y="218" width="270" height="52" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="616" y="248.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Personal experience</text><rect x="600" y="284" width="270" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="616" y="314.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Generation</text><text x="616" y="342.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">growing up in different</text><text x="616" y="363.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">conditions</text></g><text x="450" y="422" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Causes of value disagreements</text><rect x="83.40000000000003" y="448" width="383.59999999999997" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="275.20000000000005" y="474.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Different religious or moral teachings</text><rect x="479" y="448" width="208.79999999999998" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="583.4" y="474.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Generational change</text><rect x="699.8" y="448" width="116.8" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="758.1999999999999" y="474.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Migration</text><rect x="115.60000000000002" y="500" width="264" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="247.60000000000002" y="526.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Economic change and media</text><rect x="391.6" y="500" width="392.79999999999995" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="588" y="526.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Laws from a time of more shared beliefs</text>
