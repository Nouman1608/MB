<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 588" width="900" height="588" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="588" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What is education for?</text>

<rect x="30" y="108" width="269.3333333333333" height="172" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,158 L31.25,122.25 Q31.25,109.25 44.25,109.25 L285.0833333333333,109.25 Q298.0833333333333,109.25 298.0833333333333,122.25 L298.0833333333333,158 Z" fill="#b5d3cf"/><line x1="31.25" y1="158" x2="298.0833333333333" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="139" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Serving the economy</text><text x="44" y="190.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Schools teach the skills and</text><text x="44" y="212.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">qualifications employers</text><text x="44" y="234.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">need, and sift people into</text><text x="44" y="256.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">jobs.</text><rect x="315.3333333333333" y="108" width="269.3333333333333" height="172" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,158 L316.5833333333333,122.25 Q316.5833333333333,109.25 329.5833333333333,109.25 L570.4166666666666,109.25 Q583.4166666666666,109.25 583.4166666666666,122.25 L583.4166666666666,158 Z" fill="#dce9e7"/><line x1="316.5833333333333" y1="158" x2="583.4166666666666" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="139" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Social mobility</text><text x="329.3333333333333" y="190.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Qualifications let people</text><text x="329.3333333333333" y="212.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">move up (or down) the class</text><text x="329.3333333333333" y="234.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">structure, wherever they</text><text x="329.3333333333333" y="256.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">started.</text><rect x="600.6666666666666" y="108" width="269.3333333333333" height="172" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,158 L601.9166666666666,122.25 Q601.9166666666666,109.25 614.9166666666666,109.25 L855.75,109.25 Q868.75,109.25 868.75,122.25 L868.75,158 Z" fill="#f2e7b8"/><line x1="601.9166666666666" y1="158" x2="868.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="139" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Social cohesion</text><text x="614.6666666666666" y="190.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Schools pass on shared norms</text><text x="614.6666666666666" y="212.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and values that bind people</text><text x="614.6666666666666" y="234.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">into one society.</text><text x="450" y="320" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Who does education really serve?</text><rect x="30" y="340" width="190" height="72" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="125" y="383" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Functionalist</text><rect x="232" y="340" width="638" height="72" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="250" y="370.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Society as a whole: shared values, meritocracy and role allocation</text><text x="250" y="392.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">(Durkheim, Parsons)</text><rect x="30" y="422" width="190" height="58" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="125" y="458" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Marxist</text><rect x="232" y="422" width="638" height="58" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="250" y="456.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Capitalism, not society as a whole</text><rect x="30" y="490" width="190" height="72" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="125" y="533" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Feminist</text><rect x="232" y="490" width="638" height="72" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="250" y="520.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Has reproduced gender inequality through a gendered curriculum, subject</text><text x="250" y="542.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">choices and the hidden curriculum</text>
</svg>