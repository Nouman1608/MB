<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" width="900" height="570" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="570" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why achievement differs</text>

<rect x="30" y="108" width="269.3333333333333" height="331" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,158 L31.25,122.25 Q31.25,109.25 44.25,109.25 L285.0833333333333,109.25 Q298.0833333333333,109.25 298.0833333333333,122.25 L298.0833333333333,158 Z" fill="#b5d3cf"/><line x1="31.25" y1="158" x2="298.0833333333333" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="138.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Class</text><circle cx="49" cy="183.92" r="4.5" fill="#2e6b62"/><text x="62" y="189.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Material deprivation:</tspan> no</text><text x="62" y="210.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">money for books, computers,</text><text x="62" y="231.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a quiet place to study or a</text><text x="62" y="252.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">good diet</text><circle cx="49" cy="275.92" r="4.5" fill="#2e6b62"/><text x="62" y="281.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Cultural deprivation:</tspan> said</text><text x="62" y="302.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to lack helpful attitudes</text><text x="62" y="323.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and language (critics:</text><text x="62" y="344.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">blames the victim)</text><circle cx="49" cy="367.92" r="4.5" fill="#2e6b62"/><text x="62" y="373.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Cultural capital</tspan> (Bourdieu):</text><text x="62" y="394.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">middle-class knowledge and</text><text x="62" y="415.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">confidence schools reward</text><rect x="315.3333333333333" y="108" width="269.3333333333333" height="331" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,158 L316.5833333333333,122.25 Q316.5833333333333,109.25 329.5833333333333,109.25 L570.4166666666666,109.25 Q583.4166666666666,109.25 583.4166666666666,122.25 L583.4166666666666,158 Z" fill="#f2e7b8"/><line x1="316.5833333333333" y1="158" x2="583.4166666666666" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="138.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Gender</text><circle cx="334.3333333333333" cy="183.92" r="4.5" fill="#2e6b62"/><text x="347.3333333333333" y="189.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Girls now outperform boys at</text><text x="347.3333333333333" y="210.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">most levels, including GCSE</text><circle cx="334.3333333333333" cy="233.92" r="4.5" fill="#2e6b62"/><text x="347.3333333333333" y="239.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Impact of feminism on girls’</text><text x="347.3333333333333" y="260.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ambitions</text><circle cx="334.3333333333333" cy="283.92" r="4.5" fill="#2e6b62"/><text x="347.3333333333333" y="289.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Equal opportunities policies</text><circle cx="334.3333333333333" cy="312.92" r="4.5" fill="#2e6b62"/><text x="347.3333333333333" y="318.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fewer traditional manual</text><text x="347.3333333333333" y="339.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">jobs for boys</text><circle cx="334.3333333333333" cy="362.92" r="4.5" fill="#2e6b62"/><text x="347.3333333333333" y="368.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Subject choice is still</text><text x="347.3333333333333" y="389.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">gendered</text><rect x="600.6666666666666" y="108" width="269.3333333333333" height="331" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,158 L601.9166666666666,122.25 Q601.9166666666666,109.25 614.9166666666666,109.25 L855.75,109.25 Q868.75,109.25 868.75,122.25 L868.75,158 Z" fill="#dce9e7"/><line x1="601.9166666666666" y1="158" x2="868.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="138.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Ethnicity</text><circle cx="619.6666666666666" cy="183.92" r="4.5" fill="#2e6b62"/><text x="632.6666666666666" y="189.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Material factors:</tspan> some</text><text x="632.6666666666666" y="210.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">groups more likely to live</text><text x="632.6666666666666" y="231.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">in poverty</text><circle cx="619.6666666666666" cy="254.92" r="4.5" fill="#2e6b62"/><text x="632.6666666666666" y="260.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Language</tspan> for pupils new to</text><text x="632.6666666666666" y="281.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">English</text><circle cx="619.6666666666666" cy="304.92" r="4.5" fill="#2e6b62"/><text x="632.6666666666666" y="310.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Ethnocentric curriculum</tspan></text><text x="632.6666666666666" y="331.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">centred on one culture</text><circle cx="619.6666666666666" cy="354.92" r="4.5" fill="#2e6b62"/><text x="632.6666666666666" y="360.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Institutional racism</tspan> and</text><text x="632.6666666666666" y="381.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">teacher labelling</text><rect x="30" y="457" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="493" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The three factors overlap</text><text x="56" y="522" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A good answer asks how much of an “ethnic” gap is really a class gap.</text>
</svg>