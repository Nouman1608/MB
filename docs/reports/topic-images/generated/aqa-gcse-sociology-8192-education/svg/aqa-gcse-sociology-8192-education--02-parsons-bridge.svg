<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 917" width="900" height="917" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="917" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Parsons: school as a bridge</text>

<path d="M30,330 L230,330 L230,520 L30,520 Z" fill="#d8e3c6" stroke="#1e2a44" stroke-width="3"/><path d="M670,330 L870,330 L870,520 L670,520 Z" fill="#d8e3c6" stroke="#1e2a44" stroke-width="3"/><rect x="230" y="450" width="440" height="70" fill="#b5d3cf"/><path d="M230,330 L670,330 L670,352 L640,352 Q450,370 260,352 L230,352 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><path d="M262,352 Q450,490 638,352" fill="none" stroke="#1e2a44" stroke-width="3"/><rect x="375" y="238" width="150" height="92" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M365,238 L450,190 L535,238 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><rect x="436" y="286" width="28" height="44" fill="#2e6b62"/><text x="450" y="272" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">SCHOOL</text><rect x="80" y="270" width="70" height="60" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M72,270 L115,234 L158,270 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><rect x="700" y="260" width="44" height="70" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><rect x="745" y="220" width="44" height="110" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><rect x="800" y="245" width="44" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="130" y="150" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">FAMILY</text><text x="770" y="150" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">SOCIETY</text><text x="450" y="150" font-size="18" font-weight="600" fill="#2e6b62" text-anchor="middle" font-style="italic">a bridge between the two</text><line x1="310" y1="186" x2="590" y2="186" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><rect x="30" y="540" width="360" height="156" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,590 L31.25,554.25 Q31.25,541.25 44.25,541.25 L375.75,541.25 Q388.75,541.25 388.75,554.25 L388.75,590 Z" fill="#f2e7b8"/><line x1="31.25" y1="590" x2="388.75" y2="590" stroke="#c9d6d4" stroke-width="2"/><text x="210" y="571" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">In the family</text><text x="44" y="622.15" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">Particularistic standards</text><text x="44" y="650.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Rules that apply only to you as a</text><text x="44" y="672.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">particular son or daughter</text><rect x="510" y="540" width="360" height="156" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M511.25,590 L511.25,554.25 Q511.25,541.25 524.25,541.25 L855.75,541.25 Q868.75,541.25 868.75,554.25 L868.75,590 Z" fill="#b5d3cf"/><line x1="511.25" y1="590" x2="868.75" y2="590" stroke="#c9d6d4" stroke-width="2"/><text x="690" y="571" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">In wider society</text><text x="524" y="622.15" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">Universalistic standards</text><text x="524" y="650.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The same rules for everyone, regardless</text><text x="524" y="672.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">of kinship</text><line x1="392" y1="618" x2="506" y2="618" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="450" y="606" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">school</text><rect x="30" y="714" width="840" height="179" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="750" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">What school does</text><circle cx="61" cy="773.39" r="4.5" fill="#8a6d0d"/><text x="74" y="779" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Takes over as the main agency of socialisation</text><circle cx="61" cy="803.39" r="4.5" fill="#8a6d0d"/><text x="74" y="809" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Runs on meritocratic principles: status is <tspan font-weight="700">achieved</tspan> through merit, not ascribed at birth</text><circle cx="61" cy="833.39" r="4.5" fill="#8a6d0d"/><text x="74" y="839" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Socialises pupils into a value consensus of achievement and equality of opportunity</text><circle cx="61" cy="863.39" r="4.5" fill="#8a6d0d"/><text x="74" y="869" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Selects individuals for their future roles in society</text>
</svg>