<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Halsey, Heath and Ridge: class and staying on</text>

<text x="450" y="92" font-size="19" font-weight="400" fill="#4a5568" text-anchor="middle">Chances of a service-class boy compared with a working-class boy</text><text x="234" y="174" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="end">At school at 16</text><rect x="250" y="146" width="208" height="44" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="470" y="177" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">4×</text><text x="234" y="248" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="end">At school at 17</text><rect x="250" y="220" width="416" height="44" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="678" y="251" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">8×</text><text x="234" y="322" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="end">At school at 18</text><rect x="250" y="294" width="520" height="44" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="782" y="325" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">10×</text><text x="234" y="396" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="end">Attending university</text><rect x="250" y="368" width="572" height="44" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="834" y="399" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">11×</text><line x1="302" y1="128" x2="302" y2="440" stroke="#b5602e" stroke-width="3" stroke-dasharray="8 6"/><text x="310" y="462" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">working-class boy = 1×</text><text x="450" y="516" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Three classes, by father’s occupation</text><rect x="30" y="534" width="269.3333333333333" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,584 L31.25,548.25 Q31.25,535.25 44.25,535.25 L285.0833333333333,535.25 Q298.0833333333333,535.25 298.0833333333333,548.25 L298.0833333333333,584 Z" fill="#d4b02e"/><line x1="31.25" y1="584" x2="298.0833333333333" y2="584" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="564.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Service class</text><text x="44" y="615.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Professionals, administrators</text><text x="44" y="636.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and managers</text><rect x="315.3333333333333" y="534" width="269.3333333333333" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,584 L316.5833333333333,548.25 Q316.5833333333333,535.25 329.5833333333333,535.25 L570.4166666666666,535.25 Q583.4166666666666,535.25 583.4166666666666,548.25 L583.4166666666666,584 Z" fill="#f2e7b8"/><line x1="316.5833333333333" y1="584" x2="583.4166666666666" y2="584" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="564.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Intermediate class</text><text x="329.3333333333333" y="615.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Clerical or sales workers,</text><text x="329.3333333333333" y="636.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">self-employed, lower grade</text><text x="329.3333333333333" y="657.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">technicians, foremen</text><rect x="600.6666666666666" y="534" width="269.3333333333333" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,584 L601.9166666666666,548.25 Q601.9166666666666,535.25 614.9166666666666,535.25 L855.75,535.25 Q868.75,535.25 868.75,548.25 L868.75,584 Z" fill="#b5d3cf"/><line x1="601.9166666666666" y1="584" x2="868.75" y2="584" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="564.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Working class</text><text x="614.6666666666666" y="615.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Manual workers in industry and</text><text x="614.6666666666666" y="636.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">agriculture</text><rect x="30" y="697" width="840" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="61" cy="727.39" r="4.5" fill="#8a6d0d"/><text x="74" y="733" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Sample: over 8,000 males born 1913–1952 (Origins and Destinations, 1980)</text><circle cx="61" cy="757.39" r="4.5" fill="#8a6d0d"/><text x="74" y="763" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Limitation:</tspan> no females, which might have changed the findings</text>
