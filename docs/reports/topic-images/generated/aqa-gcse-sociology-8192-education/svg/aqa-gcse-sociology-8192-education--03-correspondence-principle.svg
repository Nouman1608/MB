<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 927" width="900" height="927" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="927" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Bowles and Gintis: the correspondence principle</text>

<rect x="30" y="108" width="360" height="54" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="210" y="143" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">At school</text><rect x="510" y="108" width="360" height="54" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="690" y="143" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">At work</text><rect x="30" y="178" width="360" height="76" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="221.1" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Pupils obey teachers and the head</text><rect x="510" y="178" width="360" height="76" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="528" y="209.1" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Workers obey supervisors and</text><text x="528" y="233.1" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">managers</text><line x1="396" y1="216" x2="504" y2="216" stroke="#2e6b62" stroke-width="4" marker-start="url(#ahT)" marker-end="url(#ahT)"/><rect x="30" y="270" width="360" height="76" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="301.1" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Pupils work for grades, not interest</text><text x="48" y="325.1" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">in learning</text><rect x="510" y="270" width="360" height="76" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="528" y="301.1" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Workers work for wages, not</text><text x="528" y="325.1" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">satisfaction</text><line x1="396" y1="308" x2="504" y2="308" stroke="#2e6b62" stroke-width="4" marker-start="url(#ahT)" marker-end="url(#ahT)"/><rect x="30" y="362" width="360" height="76" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="405.1" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Subjects split into separate lessons</text><rect x="510" y="362" width="360" height="76" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="528" y="405.1" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Work split into narrow tasks</text><line x1="396" y1="400" x2="504" y2="400" stroke="#2e6b62" stroke-width="4" marker-start="url(#ahT)" marker-end="url(#ahT)"/><rect x="30" y="454" width="360" height="76" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="497.1" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Pupils compete and are ranked</text><rect x="510" y="454" width="360" height="76" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="528" y="497.1" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Workers compete for promotion</text><line x1="396" y1="492" x2="504" y2="492" stroke="#2e6b62" stroke-width="4" marker-start="url(#ahT)" marker-end="url(#ahT)"/><text x="450" y="204" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">corresponds to</text><line x1="450" y1="554" x2="450" y2="588" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="594" width="840" height="112" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="628" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle">Result: a <tspan font-weight="700">hardworking, docile, obedient and highly motivated</tspan> workforce,</text><text x="450" y="656" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle">too divided to challenge the authority of management</text><text x="450" y="690" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">the reproduction of labour power</text><rect x="30" y="724" width="840" height="179" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="760" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Alternative views</text><circle cx="61" cy="783.39" r="4.5" fill="#8a6d0d"/><text x="74" y="789" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Willis:</tspan> the lads resisted school, yet still ended up in manual work</text><circle cx="61" cy="813.39" r="4.5" fill="#8a6d0d"/><text x="74" y="819" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Functionalists:</tspan> preparing pupils for work is fair role allocation</text><circle cx="61" cy="843.39" r="4.5" fill="#8a6d0d"/><text x="74" y="849" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Feminists:</tspan> school also corresponds to patriarchy</text><circle cx="61" cy="873.39" r="4.5" fill="#8a6d0d"/><text x="74" y="879" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Interactionists:</tspan> pupils are not passive; meanings are negotiated</text>
</svg>