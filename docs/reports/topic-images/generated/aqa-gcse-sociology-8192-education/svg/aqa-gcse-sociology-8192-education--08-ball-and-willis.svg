<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 902" width="900" height="902" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="902" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Inside schools: Ball and Willis</text>

<rect x="30" y="108" width="404" height="770" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,158 L31.25,122.25 Q31.25,109.25 44.25,109.25 L419.75,109.25 Q432.75,109.25 432.75,122.25 L432.75,158 Z" fill="#b5d3cf"/><line x1="31.25" y1="158" x2="432.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="138.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Ball: Beachside (1981)</text><text x="232" y="190" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Participant observer in one comprehensive for</text><text x="232" y="211" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">three years</text><rect x="48" y="236" width="368" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="64" y="265.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Pupils banded by ability (a mixed</text><text x="64" y="287.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">ability cohort was the comparison)</text><line x1="232" y1="309" x2="232" y2="333" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="48" y="336" width="368" height="92" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="64" y="365.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Middle-class pupils more likely to be</text><text x="64" y="387.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">placed in <tspan font-weight="700">band 1</tspan> than working-class</text><text x="64" y="409.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">pupils of similar ability</text><line x1="232" y1="431" x2="232" y2="455" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="48" y="458" width="368" height="48" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="64" y="487.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Band 1 met <tspan font-weight="700">higher teacher expectations</tspan></text><line x1="232" y1="509" x2="232" y2="533" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="48" y="536" width="368" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="64" y="565.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Band 2 steered to easier exams and</text><text x="64" y="587.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">practical subjects</text><line x1="232" y1="609" x2="232" y2="633" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="48" y="636" width="368" height="70" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="64" y="665.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Band 2 most likely to develop</text><text x="64" y="687.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">anti-school attitudes</tspan></text><rect x="48" y="747" width="368" height="113" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="64" y="773" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">Evaluation</text><text x="64" y="797" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Detailed, valid data, but one school may</text><text x="64" y="818" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">not be representative, and the researcher</text><text x="64" y="839" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">can change behaviour.</text><rect x="466" y="108" width="404" height="770" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,158 L467.25,122.25 Q467.25,109.25 480.25,109.25 L855.75,109.25 Q868.75,109.25 868.75,122.25 L868.75,158 Z" fill="#f2e7b8"/><line x1="467.25" y1="158" x2="868.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="138.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Willis: the lads (1977)</text><text x="668" y="190" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Twelve working-class boys on a Midlands estate</text><rect x="484" y="236" width="368" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="500" y="265.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Formed a <tspan font-weight="700">counter school culture</tspan> opposed</text><text x="500" y="287.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">to school values</text><line x1="668" y1="309" x2="668" y2="333" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="484" y="336" width="368" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="500" y="365.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Felt superior to teachers and to</text><text x="500" y="387.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">conformist “ear’oles”</text><line x1="668" y1="409" x2="668" y2="433" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="484" y="436" width="368" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="500" y="465.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Aimed to avoid lessons and “have a</text><text x="500" y="487.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">laff”; neither docile nor obedient</text><line x1="668" y1="509" x2="668" y2="533" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="484" y="536" width="368" height="70" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="500" y="565.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Rejecting school suited them to</text><text x="500" y="587.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">male-dominated manual work</text><rect x="484" y="747" width="368" height="113" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="500" y="773" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">Evaluation</text><text x="500" y="797" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Small, all-male sample; such jobs are now</text><text x="500" y="818" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">much harder to find, so the link has</text><text x="500" y="839" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">weakened.</text>
</svg>