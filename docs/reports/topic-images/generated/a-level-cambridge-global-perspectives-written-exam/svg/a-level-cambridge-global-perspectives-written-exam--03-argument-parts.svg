<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 503" width="900" height="503" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="503" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Deconstructing an argument</text>

<rect x="220" y="115" width="460" height="90" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="450" y="155.4" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Conclusion</text><text x="450" y="181.20000000000002" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">a stated claim is the conclusion, not a sixth element</text><line x1="130" y1="260" x2="345" y2="211" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="265" width="200" height="110" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="130" y="304.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Reasons (premises)</text><text x="130" y="330.40000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">why the conclusion</text><text x="130" y="350.20000000000005" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">should be accepted</text><line x1="343" y1="260" x2="415" y2="211" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="243" y="265" width="200" height="110" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="343" y="304.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Evidence</text><text x="343" y="330.40000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">what supports the</text><text x="343" y="350.20000000000005" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">reasons</text><line x1="556" y1="260" x2="485" y2="211" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="456" y="265" width="200" height="110" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="556" y="314.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Assumptions</text><text x="556" y="340.40000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">stated and unstated</text><line x1="769" y1="260" x2="555" y2="211" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="669" y="265" width="200" height="110" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="769" y="314.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Assertions</text><text x="769" y="340.40000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">and counter-assertions</text><rect x="30" y="400" width="840" height="72.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="430.2" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Identify all five before judging any of them, and examine the reasoning rather than disagreeing with</text><text x="450" y="451.32" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">the conclusion.</text>
</svg>