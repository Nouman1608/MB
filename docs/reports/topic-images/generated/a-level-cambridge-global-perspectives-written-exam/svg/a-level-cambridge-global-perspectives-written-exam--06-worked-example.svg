<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" width="900" height="740" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="740" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: education and GDP</text>

<rect x="30" y="115" width="840" height="100" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="450" y="161.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">“Countries that invest more in education have higher GDP per capita. Therefore</text><text x="450" y="184.85999999999999" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">increasing education spending will raise national income.”</text><rect x="30" y="235" width="410" height="80" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="235" y="270.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Evidence</text><text x="235" y="297.22" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">a correlation across countries</text><line x1="444" y1="275" x2="486" y2="275" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)" stroke-dasharray="9 6"/><text x="465" y="262" font-size="22" font-weight="700" fill="#b5602e" text-anchor="middle">?</text><rect x="490" y="235" width="380" height="80" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="680" y="270.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Conclusion</text><text x="680" y="297.22" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">spending raises income</text><rect x="30" y="340" width="840" height="260" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="374" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">False cause: other explanations for the correlation</text><rect x="80" y="430" width="230" height="64" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="195" y="469.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">education spending</text><rect x="590" y="430" width="230" height="64" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="705" y="469.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">GDP per capita</text><path d="M588,450 C500,425 400,425 314,450" fill="none" stroke="#b5602e" stroke-width="3" stroke-linecap="round" marker-end="url(#ahR)"/><text x="450" y="418" font-size="15" font-weight="600" fill="#b5602e" text-anchor="middle">reverse: richer countries can afford more education</text><rect x="320" y="520" width="260" height="64" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="450" y="548.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">governance, stability,</text><text x="450" y="568.55" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">infrastructure</text><line x1="322" y1="535" x2="200" y2="498" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><line x1="578" y1="535" x2="700" y2="498" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="160" y="578" font-size="15" font-weight="600" fill="#b5602e" text-anchor="middle">confounding variable</text><rect x="30" y="620" width="410" height="90" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="48" y="659.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Oversimplified</text><text x="48" y="685.4" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">how money is spent matters more than how much</text><rect x="460" y="620" width="410" height="90" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="478" y="659.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sufficiency</text><text x="478" y="685.4" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">no data on timescale or size of effect</text>
</svg>