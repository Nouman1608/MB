<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 585" width="900" height="585" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="585" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Evaluating evidence</text>

<rect x="30" y="120" width="160" height="150" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="110" y="179.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Provenance</text><text x="110" y="205.4" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">who produced it</text><text x="110" y="225.20000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">and why</text><rect x="200" y="120" width="160" height="150" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="280" y="159.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Methodology</text><text x="280" y="185.4" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">sample size,</text><text x="280" y="205.20000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">selection,</text><text x="280" y="225" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">instrument,</text><text x="280" y="244.8" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">replicability</text><rect x="370" y="120" width="160" height="150" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="450" y="189.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Currency</text><text x="450" y="215.4" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">how up to date</text><rect x="540" y="120" width="160" height="150" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="620" y="179.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Corroboration</text><text x="620" y="205.4" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">do other sources</text><text x="620" y="225.20000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">agree?</text><rect x="710" y="120" width="160" height="150" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="790" y="169.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Sufficiency</text><text x="790" y="195.4" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">can it carry the</text><text x="790" y="215.20000000000002" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">weight of the</text><text x="790" y="235" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">claim?</text><text x="30" y="310" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Statistics: check the baseline, the sample and whether the comparison is fair</text><rect x="30" y="325" width="840" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="120" y="480" width="70" height="40" rx="4" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="155" y="470" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="155" y="544" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">before</text><rect x="220" y="440" width="70" height="80" rx="4" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="255" y="430" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="255" y="544" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">after</text><line x1="100" y1="520" x2="320" y2="520" stroke="#1e2a44" stroke-width="2"/><text x="370" y="410" font-size="24" font-weight="700" fill="#b5602e" text-anchor="start">“A 100% increase!”</text><text x="370" y="450" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">from 2 cases to 4: almost meaningless</text><text x="370" y="482" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a percentage can hide small absolute numbers</text>
</svg>