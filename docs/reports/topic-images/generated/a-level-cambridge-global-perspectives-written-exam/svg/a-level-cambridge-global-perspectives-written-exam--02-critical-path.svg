<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Critical Path in the Written Exam</text>

<rect x="30" y="150" width="200" height="110" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="130" y="212.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Deconstruction</text><line x1="232" y1="205" x2="241" y2="205" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="130" y="292" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">✓ used</text><rect x="243" y="150" width="200" height="110" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="343" y="212.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Reconstruction</text><line x1="445" y1="205" x2="454" y2="205" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="343" y="292" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">✓ used</text><rect x="456" y="150" width="200" height="110" rx="12" fill="#eef0f0" stroke="#c9d6d4" stroke-width="2.2"/><text x="556" y="212.6" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle">Reflection</text><line x1="658" y1="205" x2="667" y2="205" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="556" y="292" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">✗ not used</text><rect x="669" y="150" width="200" height="110" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><text x="769" y="189.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Communication</text><text x="769" y="212.85999999999999" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">and</text><text x="769" y="236.62" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">collaboration</text><text x="769" y="292" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">communication only</text><text x="450" y="136" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">The Critical Path, and what the Written Exam uses</text><rect x="30" y="320" width="840" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="450" y="369.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Reflection and collaboration are excluded</text><text x="450" y="396.17" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">the exam is individually assessed and its AO2 Reflection weighting is 0%</text><rect x="30" y="450" width="840" height="74.88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="481.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Unseen sources on varied global topics: build general critical-reading skill, not topic</text><text x="450" y="503.59" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">knowledge.</text>
