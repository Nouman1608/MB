<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 603" width="900" height="603" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="603" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Structural weaknesses to look for</text>

<rect x="30" y="115" width="410" height="88" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.2"/><text x="44" y="153.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Hasty generalisation</text><text x="44" y="179.35000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">a broad claim from limited cases</text><rect x="460" y="115" width="410" height="88" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="474" y="147.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">False cause</text><text x="474" y="172.85000000000002" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">correlation as causation; confounding variable;</text><text x="474" y="192.65000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">reverse causation (any one earns credit)</text><rect x="30" y="215" width="410" height="88" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.2"/><text x="44" y="253.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">False dichotomy</text><text x="44" y="279.35" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">two options presented as the only ones</text><rect x="460" y="215" width="410" height="88" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.2"/><text x="474" y="253.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Ad hominem</text><text x="474" y="279.35" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">attacks the arguer, not the argument</text><rect x="30" y="315" width="410" height="88" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.2"/><text x="44" y="347.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Appeal to authority</text><text x="44" y="372.85" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">status instead of evidence, especially outside the</text><text x="44" y="392.65000000000003" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">field</text><rect x="460" y="315" width="410" height="88" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.2"/><text x="474" y="353.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Circular reasoning</text><text x="474" y="379.35" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">the conclusion is assumed in the premises</text><rect x="30" y="415" width="840" height="88" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.2"/><text x="44" y="453.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Straw man</text><text x="44" y="479.35" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">misrepresents an opposing view to defeat it easily</text><rect x="30" y="520" width="840" height="52.44" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="551.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Name the flaw AND show how it operates in the source: that separates the top band.</text>
</svg>