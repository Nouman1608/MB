<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" width="900" height="590" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="590" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Implicit information needs evidence</text>

<text x="450" y="132" font-size="18" font-weight="600" fill="#4a5568" text-anchor="middle">Evidence an inference can rest on</text><rect x="30" y="150" width="200" height="110" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="130" y="186" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Word choice</text><text x="130" y="214" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">“finally”, “just a</text><text x="130" y="233" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">small fee”</text><line x1="130" y1="264" x2="375" y2="300" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><rect x="243" y="150" width="200" height="110" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="343" y="186" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Tone</text><text x="343" y="214" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">enthusiastic rise,</text><text x="343" y="233" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">flat or sarcastic</text><line x1="343" y1="264" x2="425" y2="300" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><rect x="456" y="150" width="200" height="110" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="556" y="186" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">What is left out</text><text x="556" y="214" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">an advert that never</text><text x="556" y="233" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">gives the price</text><line x1="556" y1="264" x2="475" y2="300" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><rect x="669" y="150" width="200" height="110" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="769" y="186" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Visuals</text><text x="769" y="214" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">a smiling crowd: the</text><text x="769" y="233" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">event is popular</text><line x1="769" y1="264" x2="525" y2="300" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><rect x="250" y="306" width="400" height="56" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="341" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">inference = claim + evidence</text><rect x="30" y="385" width="410" height="150" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="52" y="421" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Earns little</text><text x="52" y="451" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“The speaker is worried.”</text><text x="52" y="473" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="52" y="495" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a claim with no evidence</text><rect x="460" y="385" width="410" height="150" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="482" y="421" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">✓ Earns much more</text><text x="482" y="451" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“She is worried because she repeats</text><text x="482" y="473" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">‘I really hope’ and her voice drops.”</text><text x="482" y="495" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="482" y="517" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">words + tone as evidence</text><text x="450" y="565" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Signal words in questions: infer, suggest, interpret, what does the speaker think</text>
</svg>