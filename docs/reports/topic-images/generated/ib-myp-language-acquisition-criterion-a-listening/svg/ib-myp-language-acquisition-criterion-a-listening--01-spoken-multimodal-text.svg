<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 725" width="900" height="725" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="725" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What makes a spoken text multimodal</text>

<rect x="330" y="320" width="240" height="120" rx="60" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="372" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">Speech</text><text x="450" y="402" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">only half the task</text><rect x="30" y="110" width="270" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Images</text><text x="50" y="172" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">photos, video, close-ups,</text><text x="50" y="191" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">maps, icons</text><line x1="355" y1="340" x2="200" y2="212" stroke="#2e6b62" stroke-width="2.5" stroke-dasharray="6 5"/><rect x="600" y="110" width="270" height="100" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="620" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Words on screen</text><text x="620" y="172" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">captions, subtitles, titles,</text><text x="620" y="191" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">logo, price banner</text><line x1="545" y1="340" x2="700" y2="212" stroke="#2e6b62" stroke-width="2.5" stroke-dasharray="6 5"/><rect x="30" y="420" width="270" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="456" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Sound</text><text x="50" y="482" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">music, sound effects,</text><text x="50" y="501" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">background noise, silence</text><line x1="335" y1="400" x2="200" y2="418" stroke="#2e6b62" stroke-width="2.5" stroke-dasharray="6 5"/><rect x="600" y="420" width="270" height="100" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="620" y="456" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Delivery</text><text x="620" y="482" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">tone, speed, stress, pauses,</text><text x="620" y="501" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">laughter</text><line x1="565" y1="400" x2="700" y2="418" stroke="#2e6b62" stroke-width="2.5" stroke-dasharray="6 5"/><rect x="315" y="560" width="270" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="335" y="596" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Body language</text><text x="335" y="622" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">gesture, facial expression,</text><text x="335" y="641" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">where the speaker stands</text><line x1="450" y1="442" x2="450" y2="558" stroke="#2e6b62" stroke-width="2.5" stroke-dasharray="6 5"/><text x="450" y="700" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">e.g. video adverts, podcasts, news reports, interviews, vlogs, announcements, voicemails</text>
</svg>