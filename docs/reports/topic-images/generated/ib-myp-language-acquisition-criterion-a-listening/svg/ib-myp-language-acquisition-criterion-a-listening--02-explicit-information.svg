<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="550" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Explicit information: method and traps</text>

<rect x="30" y="110" width="265" height="120" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Before</text><text x="50" y="176" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">read every question;</text><text x="50" y="196" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">underline the key word;</text><text x="50" y="216" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">predict the answer type</text><line x1="297" y1="170" x2="313" y2="170" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="315" y="110" width="265" height="120" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="335" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Listen 1</text><text x="335" y="176" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">short notes in the order you</text><text x="335" y="196" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">hear them</text><line x1="582" y1="170" x2="598" y2="170" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="600" y="110" width="265" height="120" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="620" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Listen 2</text><text x="620" y="176" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">check anything marked “?”</text><text x="450" y="270" font-size="21" font-weight="700" fill="#b5602e" text-anchor="middle">Three traps</text><rect x="30" y="290" width="265" height="230" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="326" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Paraphrase</text><rect x="46" y="344" width="233" height="76" rx="10" fill="#fff" stroke="#c9d6d4" stroke-width="2"/><text x="162.5" y="376" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">question: “cost”</text><text x="162.5" y="402" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">speaker: “you’ll pay”</text><text x="50" y="452" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">the answer is rarely in</text><text x="50" y="473" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">the question’s words</text><rect x="315" y="290" width="265" height="230" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="335" y="326" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Self-correction</text><rect x="331" y="344" width="233" height="76" rx="10" fill="#fff" stroke="#c9d6d4" stroke-width="2"/><text x="447.5" y="376" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">“We meet on Tuesday –</text><text x="447.5" y="402" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">no, sorry, Wednesday.”</text><text x="335" y="452" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">the last version is the</text><text x="335" y="473" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">answer</text><rect x="600" y="290" width="265" height="230" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="620" y="326" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Distractors</text><rect x="616" y="344" width="233" height="76" rx="10" fill="#fff" stroke="#c9d6d4" stroke-width="2"/><text x="732.5" y="376" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">two times or two prices</text><text x="732.5" y="402" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">are mentioned</text><text x="620" y="452" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">only one answers the</text><text x="620" y="473" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">question</text>
</svg>