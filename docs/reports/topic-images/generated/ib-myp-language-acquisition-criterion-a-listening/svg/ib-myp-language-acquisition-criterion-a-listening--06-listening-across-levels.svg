<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" width="900" height="510" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="510" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Listening across the three levels</text>

<defs><linearGradient id="lvg" x1="0" x2="1"><stop offset="0" stop-color="#dce9e7"/><stop offset="1" stop-color="#d4b02e"/></linearGradient></defs><path d="M40,140 L820,140 L820,124 L860,152 L820,180 L820,164 L40,164 Z" fill="url(#lvg)" stroke="#1e2a44" stroke-width="2"/><text x="60" y="158" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">texts get longer, faster and less familiar; more inference</text><rect x="30" y="200" width="270" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="200" width="270" height="56" rx="14" fill="#dce9e7"/><rect x="30" y="236" width="270" height="20" fill="#dce9e7"/><rect x="30" y="200" width="270" height="250" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="165" y="237" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Emergent</text><text x="50" y="290" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">short, clear texts on</text><text x="50" y="316" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">familiar topics</text><text x="50" y="342" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mostly explicit questions</text><text x="50" y="368" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">visuals strongly support</text><text x="50" y="394" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the speech</text><rect x="315" y="200" width="270" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="315" y="200" width="270" height="56" rx="14" fill="#b5d3cf"/><rect x="315" y="236" width="270" height="20" fill="#b5d3cf"/><rect x="315" y="200" width="270" height="250" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="237" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Capable</text><text x="335" y="290" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">longer texts, more than</text><text x="335" y="316" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">one speaker</text><text x="335" y="342" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">some inference</text><text x="335" y="368" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">visuals add information</text><rect x="600" y="200" width="270" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="600" y="200" width="270" height="56" rx="14" fill="#d4b02e"/><rect x="600" y="236" width="270" height="20" fill="#d4b02e"/><rect x="600" y="200" width="270" height="250" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="735" y="237" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Proficient</text><text x="620" y="290" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">less familiar topics, natural</text><text x="620" y="316" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">speed, opinions, humour</text><text x="620" y="342" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">more inference; contrast</text><text x="620" y="368" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">between modes; attitudes</text><text x="620" y="394" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and values</text><text x="450" y="485" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">The brief names the three levels but does not describe the texts; check your level with your teacher.</text>
</svg>