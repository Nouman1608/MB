<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How speech and images work together</text>

<rect x="30" y="110" width="270" height="420" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="165" y="150" font-size="23" font-weight="700" fill="#2e6b62" text-anchor="middle">Reinforce</text><text x="165" y="180" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">the image shows what the</text><text x="165" y="199" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">speech says</text><rect x="50" y="250" width="230" height="100" rx="10" fill="#fff" stroke="#c9d6d4" stroke-width="2"/><text x="66" y="278" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">SPEECH</text><text x="165" y="318" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">“the park is quiet”</text><text x="165" y="380" font-size="34" font-weight="700" fill="#2e6b62" text-anchor="middle">=</text><rect x="50" y="400" width="230" height="100" rx="10" fill="#fff" stroke="#c9d6d4" stroke-width="2"/><text x="66" y="428" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">IMAGE</text><text x="165" y="468" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">empty path</text><rect x="315" y="110" width="270" height="420" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="150" font-size="23" font-weight="700" fill="#8a6d0d" text-anchor="middle">Add</text><text x="450" y="180" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">the image gives</text><text x="450" y="199" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">information the speech</text><text x="450" y="218" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">does not</text><rect x="335" y="250" width="230" height="100" rx="10" fill="#fff" stroke="#c9d6d4" stroke-width="2"/><text x="351" y="278" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">SPEECH</text><text x="450" y="318" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">speaker gives no date</text><text x="450" y="380" font-size="34" font-weight="700" fill="#8a6d0d" text-anchor="middle">+</text><rect x="335" y="400" width="230" height="100" rx="10" fill="#fff" stroke="#c9d6d4" stroke-width="2"/><text x="351" y="428" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">IMAGE</text><text x="450" y="468" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">caption shows a date</text><rect x="600" y="110" width="270" height="420" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="735" y="150" font-size="23" font-weight="700" fill="#b5602e" text-anchor="middle">Contrast</text><text x="735" y="180" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">image and speech disagree,</text><text x="735" y="199" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">often for humour or</text><text x="735" y="218" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">criticism</text><rect x="620" y="250" width="230" height="100" rx="10" fill="#fff" stroke="#c9d6d4" stroke-width="2"/><text x="636" y="278" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">SPEECH</text><text x="735" y="318" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">“relaxing holiday”</text><text x="735" y="380" font-size="34" font-weight="700" fill="#b5602e" text-anchor="middle">≠</text><rect x="620" y="400" width="230" height="100" rx="10" fill="#fff" stroke="#c9d6d4" stroke-width="2"/><text x="636" y="428" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">IMAGE</text><text x="735" y="468" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">queue in the rain</text><rect x="30" y="550" width="840" height="80" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="584" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">In an answer: name the relationship, give the specific image and words,</text><text x="450" y="610" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">and explain the effect on the audience.</text>
