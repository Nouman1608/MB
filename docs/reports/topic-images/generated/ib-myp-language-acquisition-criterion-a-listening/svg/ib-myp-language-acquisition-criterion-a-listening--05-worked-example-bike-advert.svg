<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 785" width="900" height="785" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="785" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: the Rivermead Wheels advert</text>

<rect x="30" y="110" width="200" height="98" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><text x="46" y="140" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Traffic queue</text><text x="46" y="194" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">♪ low, slow music</text><rect x="245" y="110" width="400" height="98" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="262" y="165" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Stuck again? … the same wait.”</text><rect x="660" y="110" width="210" height="98" rx="10" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2"/><text x="676" y="154.5" font-size="15.5" font-weight="700" fill="#2e6b62" text-anchor="start">reinforce:</text><text x="676" y="175.5" font-size="15.5" font-weight="700" fill="#2e6b62" text-anchor="start">frustration</text><rect x="30" y="222" width="200" height="98" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><text x="46" y="252" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Green bike, phone</text><text x="46" y="272" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">app</text><text x="46" y="306" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">♪ fast guitar beat</text><rect x="245" y="222" width="400" height="98" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="262" y="266" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“200 bikes, 40 docking stations, first</text><text x="262" y="288" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">30 minutes free.”</text><rect x="660" y="222" width="210" height="98" rx="10" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2"/><text x="676" y="277" font-size="15.5" font-weight="700" fill="#2e6b62" text-anchor="start">explicit facts</text><rect x="30" y="334" width="200" height="98" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><text x="46" y="364" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">On-screen prices</text><rect x="245" y="334" width="400" height="98" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="262" y="389" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Day pass 3 euros – Year pass 40 euros”</text><rect x="660" y="334" width="210" height="98" rx="10" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2"/><text x="676" y="378.5" font-size="15.5" font-weight="700" fill="#2e6b62" text-anchor="start">add: prices never</text><text x="676" y="399.5" font-size="15.5" font-weight="700" fill="#2e6b62" text-anchor="start">said</text><rect x="30" y="446" width="200" height="98" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><text x="46" y="476" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Teen rides past</text><text x="46" y="496" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">the queue</text><text x="46" y="530" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">she is smiling</text><rect x="245" y="446" width="400" height="98" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="262" y="490" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“I get to school before my brother gets</text><text x="262" y="512" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">out of the car park.”</text><rect x="660" y="446" width="210" height="98" rx="10" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2"/><text x="676" y="490.5" font-size="15.5" font-weight="700" fill="#2e6b62" text-anchor="start">implied: cycling is</text><text x="676" y="511.5" font-size="15.5" font-weight="700" fill="#2e6b62" text-anchor="start">faster</text><rect x="30" y="558" width="200" height="98" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="46" y="588" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Logo and web</text><text x="46" y="608" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">address</text><text x="46" y="642" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">address read twice</text><rect x="245" y="558" width="400" height="98" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="262" y="613" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Ride your own way.”</text><rect x="660" y="558" width="210" height="98" rx="10" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2"/><text x="676" y="602.5" font-size="15.5" font-weight="700" fill="#2e6b62" text-anchor="start">persuade: call to</text><text x="676" y="623.5" font-size="15.5" font-weight="700" fill="#2e6b62" text-anchor="start">action</text><line x1="30" y1="215" x2="870" y2="215" stroke="#b5602e" stroke-width="3" stroke-dasharray="10 6"/><rect x="352" y="208" width="186" height="14" rx="6" fill="#f4f6f6"/><text x="445" y="220" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">music and mood change</text><rect x="30" y="680" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="714" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">The contrast between the slow first half and the fast second half</text><text x="450" y="740" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">is the main persuasive device.</text>
</svg>