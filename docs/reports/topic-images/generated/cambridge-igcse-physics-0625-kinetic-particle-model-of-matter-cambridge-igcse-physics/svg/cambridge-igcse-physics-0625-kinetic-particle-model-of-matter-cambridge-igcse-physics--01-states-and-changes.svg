<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Solids, liquids and gases</text>

<rect x="30" y="110" width="260" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="160" y="150" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Solid</text><text x="50" y="190" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">shape</text><text x="270" y="190" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">fixed</text><text x="50" y="230" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">volume</text><text x="270" y="230" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">fixed</text><text x="50" y="270" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">flows?</text><text x="270" y="270" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">no</text><text x="50" y="310" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">compressible?</text><text x="270" y="310" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">almost not</text><rect x="320" y="110" width="260" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="150" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Liquid</text><text x="340" y="190" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">shape</text><text x="560" y="190" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">of container</text><text x="340" y="230" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">volume</text><text x="560" y="230" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">fixed</text><text x="340" y="270" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">flows?</text><text x="560" y="270" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">yes</text><text x="340" y="310" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">compressible?</text><text x="560" y="310" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">almost not</text><rect x="610" y="110" width="260" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="740" y="150" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Gas</text><text x="630" y="190" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">shape</text><text x="850" y="190" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">fills container</text><text x="630" y="230" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">volume</text><text x="850" y="230" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">fills container</text><text x="630" y="270" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">flows?</text><text x="850" y="270" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">yes</text><text x="630" y="310" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">compressible?</text><text x="850" y="310" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">easily</text><rect x="80" y="470" width="190" height="70" rx="35" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="175" y="513" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">solid</text><rect x="355" y="470" width="190" height="70" rx="35" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="513" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">liquid</text><rect x="630" y="470" width="190" height="70" rx="35" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="725" y="513" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">gas</text><path d="M230,465 Q312.5,395 395,465" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahR)"/><text x="312.5" y="410" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">melting</text><p