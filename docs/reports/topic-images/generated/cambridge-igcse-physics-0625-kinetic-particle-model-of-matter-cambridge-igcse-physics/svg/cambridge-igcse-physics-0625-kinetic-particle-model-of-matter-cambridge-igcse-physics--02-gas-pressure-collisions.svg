<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="600" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Where gas pressure comes from</text>

<rect x="30" y="110" width="840" height="460" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="60" y="160" width="420" height="330" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="4"/><circle cx="140" cy="230" r="11" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><line x1="149.90402737891614" y1="223.22429031925958" x2="168.06141090692907" y2="210.8021559045688" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><circle cx="260" cy="300" r="11" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><line x1="249.71733495957264" y1="306.18601646185755" x2="230.8657823854558" y2="317.52704664192976" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><circle cx="360" cy="220" r="11" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><line x1="371.05273192803463" y1="224.6730201077038" x2="391.31607379609807" y2="233.24022363849411" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><circle cx="180" cy="400" r="11" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><line x1="184.34829305372008" y1="411.18446903160674" x2="192.3201636522069" y2="431.6893289228857" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><circle cx="320" cy="420" r="11" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><line x1="312.93798659293583" y1="410.29804315416493" x2="299.99096201331827" y2="392.5111222701339" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><circle cx="420" cy="330" r="11" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><line x1="431.9400499833363" y1="331.1980009997619" x2="453.8301416194529" y2="333.3943361659922" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><path d="M420,330 L476,300 L420,262" fill="none" stroke="#b5602e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5"/><line x1="484" y1="300" x2="530" y2="300" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><text x="540" y="306" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">push on wall</text><text x="540" y="190" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Particles move fast,</text><text x="540" y="214" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">randomly, in straight</text><text x="540" y="238" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">lines between collisions.</text><rect x="540" y="360" width="310" height="110" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="695" y="395.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">More frequent or harder</text><text x="695" y="420.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">collisions with the walls</text><text x="695" y="445.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">→ larger pressure</text><rect x="60" y="505" width="148.8" height="30" rx="15" fill="#8a6d0d"/><text x="72" y="526" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Extended only</text><text x="230" y="527" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">each rebound changes momentum: force ÷ wall area = pressure</text>
</svg>