<rect width="900" height="770" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Brownian motion: evidence for moving particles</text>

<rect x="30" y="110" width="400" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="150" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Set-up</text><rect x="80" y="330" width="150" height="80" rx="4" fill="#eef2f4" stroke="#1e2a44" stroke-width="3"/><text x="155" y="376" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">smoke cell</text><rect x="140" y="190" width="30" height="110" rx="4" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="132" y="300" width="46" height="20" rx="3" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><text x="185" y="210" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">microscope</text><path d="M300,345 L330,330 L330,410 L300,395 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><line x1="298" y1="370" x2="240" y2="370" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><text x="300" y="440" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">light from the side</text><rect x="450" y="110" width="420" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="660" y="150" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">What you see</text><path d="M590,330 L563,378 L620,353 L589,305 L652,290 L604,337 L678,313 L630,369 L616,326 L679,279 L713,240 L719,299 L758,237 L777,295 L745,366" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="745.1423820407819" cy="365.6868449108711" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="590" cy="330" r="5" fill="#4a5568" stroke="#4a5568" stroke-width="1"/><text x="645" y="505" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle">random, jerky, zigzag path of a bright speck</text><rect x="30" y="545" width="840" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="220" cy="640" r="34" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="220" y="646" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">smoke</text><circle cx="253.49874296382467" cy="587.8287989419105" r="4.5" fill="#2e6b62"/><line x1="253.49874296382467" y1="587.8287989419105" x2="242.69269684646187" y2="604.6582186380683" stroke="#2e6b62" stroke-width="2" marker-end="url(#ahT)"/><circle cx="288.7842272170436" cy="661.2774548796165" r="4.5" fill="#2e6b62"/><line x1="288.7842272170436" y1="661.2774548796165" x2="260.12413254327544" y2="652.4118486797763" stroke="#2e6b62" stroke-width="2" marker-end="url(#ahT)"/><circle cx="242.46618077755377" cy="697.786423329968" r="4.5" fill="#2e6b62"/><line x1="242.46618077755377" y1="697.786423329968" x2="235.21902568802028" y2="679.1456416106236" stroke="#2e6b62" stroke-width="2" marker-end="url(#ahT)"/><circle cx="172.02812646785267" cy="693.6907752767238" r="4.5" fill="#2e6b62"/><line x1="172.02812646785267" y1="693.6907752767238" x2="192.01640710624739" y2="671.3196189114223" stroke="#2e6b62" stroke-width="2" marker-end="url(#ahT)"/><circle cx="158.05362068305666" cy="642.578001070864" r="4.5" fill="#2e6b62"/><line x1="158.05362068305666" y1="642.578001070864" x2="178.03632368852226" y2="641.7463878221982" stroke="#2e6b62" stroke-width="2" marker-end="url(#ahT)"/><circle cx="166.9076524810303" cy="591.3666510003171" r="4.5" fill="#2e6b62"/><line x1="166.9076524810303" y1="591.3666510003171" x2="189.0294639472677" y2="611.6305464168516" stroke="#2e6b62" stroke-width="2" marker-end="url(#ahT)"/><circle cx="281.6902582472376" cy="633.8103281678966" r="4.5" fill="#2e6b62"/><line x1="281.6902582472376" y1="633.8103281678966" x2="261.7901749416771" y2="635.8069965008332" stroke="#2e6b62" stroke-width="2" marker-end="url(#ahT)"/><circle cx="264.75591771548784" cy="696.3995374931789" r="4.5" fill="#2e6b62"/><line x1="264.75591771548784" y1="696.3995374931789" x2="246.10761866736792" y2="672.8997302043543" stroke="#2e6b62" stroke-width="2" marker-end="url(#ahT)"/><line x1="262" y1="640" x2="320" y2="618" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><text x="330" y="615" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">net push</text><text x="420" y="600" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Fast, randomly moving air molecules (too small</text><text x="420" y="625" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">to see) hit the smoke particle from all sides.</text><text x="420" y="650" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">At each instant more hit one side, so it is</text><text x="420" y="675" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">pushed in a random direction.</text>
</svg>