<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 688" width="900" height="688" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="688" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Ten Blessed Companions</text>

<text x="450" y="124" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">Four who became caliphs</text><rect x="30" y="140" width="201" height="54" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="130" y="174" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Abu Bakr</text><rect x="243" y="140" width="201" height="54" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="343" y="174" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Umar</text><rect x="456" y="140" width="201" height="54" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="556" y="174" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Uthman</text><rect x="669" y="140" width="201" height="54" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="769" y="174" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Ali</text><text x="450" y="236" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Six more, each with one fact</text><rect x="30" y="252" width="410" height="100" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="284" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Talha ibn Ubaydullah</text><text x="48" y="310" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">shielded the Prophet (pbuh) at Uhud; his hand</text><text x="48" y="330" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">was badly injured</text><rect x="460" y="252" width="410" height="100" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="284" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">al-Zubayr ibn al-Awwam</text><text x="478" y="310" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">the Prophet's cousin, called his disciple</text><text x="478" y="330" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(hawari); an early convert</text><rect x="30" y="364" width="410" height="100" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="396" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Abd al-Rahman ibn Awf</text><text x="48" y="422" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">arrived in Madinah with nothing, asked to be</text><text x="48" y="442" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">shown the market, became a generous trader</text><rect x="460" y="364" width="410" height="100" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="396" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sa'd ibn Abi Waqqas</text><text x="478" y="422" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">an early convert and a famous archer</text><rect x="30" y="476" width="410" height="100" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="508" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sa'id ibn Zayd</text><text x="48" y="534" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">husband of Umar's sister Fatima; Umar's</text><text x="48" y="554" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">conversion took place in their house</text><rect x="460" y="476" width="410" height="100" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="508" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Abu Ubayda ibn al-Jarrah</text><text x="478" y="534" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">"the trustworthy one of this community"</text><rect x="30" y="596" width="840" height="64" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="636" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Named together in one Hadith as promised paradise. Never list names without facts.</text>
</svg>