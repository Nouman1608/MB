<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why the marriages matter</text>

<rect x="30" y="110" width="840" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="70" cy="156" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="163.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="112" y="150" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Security for widows</text><text x="112" y="178" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Several of the marriages gave security to widows.</text><rect x="30" y="214" width="840" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="260" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="267.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="112" y="254" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Tribes and families joined</text><text x="112" y="282" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Some joined tribes and families together and helped peace.</text><rect x="30" y="318" width="840" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="70" cy="364" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="371.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="112" y="358" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Teaching preserved</text><text x="112" y="386" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A'isha and Umm Salama preserved his teaching, especially on family and private life.</text><rect x="30" y="422" width="840" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="468" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="475.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="112" y="462" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A model for marriage</text><text x="112" y="490" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">His conduct as a husband is a model for Muslim marriage.</text><text x="450" y="546" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Use these reasons for part (b): what the marriages mean for Muslims.</text>
</svg>