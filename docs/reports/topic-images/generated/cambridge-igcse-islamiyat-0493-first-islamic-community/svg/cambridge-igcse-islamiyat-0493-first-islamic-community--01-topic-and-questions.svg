<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" width="900" height="590" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="590" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The First Islamic Community: three groups</text>

<rect x="30" y="110" width="268" height="172" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="144" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GROUP 1</text><text x="50" y="173" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The wives</text><text x="50" y="201.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the "Mothers of the</text><text x="50" y="223.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Believers" (Sura 33.6)</text><rect x="316" y="110" width="268" height="172" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="336" y="144" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GROUP 2</text><text x="336" y="173" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The descendants</text><text x="336" y="201.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">children, grandchildren and</text><text x="336" y="223.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the Imams recognised among</text><text x="336" y="245.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Shi'a Muslims</text><rect x="602" y="110" width="268" height="172" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="622" y="144" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GROUP 3</text><text x="622" y="173" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Leading Companions</text><text x="622" y="201.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Ten Blessed, Scribes, major</text><text x="622" y="223.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">characters, Emigrants and</text><text x="622" y="245.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Helpers, the four caliphs</text><rect x="30" y="302" width="410" height="100" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="338" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The four caliphs: up to 632 only</text><text x="54" y="366" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Abu Bakr, Umar, Uthman and Ali during</text><text x="54" y="388" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the Prophet's (pbuh) lifetime</text><line x1="446" y1="352" x2="474" y2="352" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><rect x="480" y="302" width="390" height="100" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="504" y="338" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Their rule after 632</text><text x="504" y="366" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">belongs to Paper 2 Topic 3,</text><text x="504" y="388" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">not to this topic</text><text x="450" y="446" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">One or two of Questions 3 to 5 are set on this topic</text><rect x="30" y="466" width="560" height="96" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="310" y="504" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Part (a): 10 marks</text><text x="310" y="534" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">write about named people</text><rect x="600" y="466" width="270" height="96" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="735" y="504" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Part (b): 4 marks</text><text x="735" y="534" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">what their actions mean</text>
</svg>