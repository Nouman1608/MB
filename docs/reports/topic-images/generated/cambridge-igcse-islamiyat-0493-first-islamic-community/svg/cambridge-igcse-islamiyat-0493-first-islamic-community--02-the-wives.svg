<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 832" width="900" height="832" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="832" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The wives: one fact that marks each</text>

<rect x="30" y="110" width="410" height="92" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="48" y="142" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Khadija bint Khuwaylid</text><text x="48" y="168" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">merchant; first to accept Islam; mother of all</text><text x="48" y="188" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">his children but Ibrahim; died 619</text><rect x="460" y="110" width="410" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="142" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sawda bint Zam'a</text><text x="478" y="168" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">widow of an emigrant to Abyssinia; married</text><text x="478" y="188" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">after Khadija's death</text><rect x="30" y="214" width="410" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="246" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A'isha bint Abi Bakr</text><text x="48" y="272" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">scholar who narrated many Hadiths; he died in</text><text x="48" y="292" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">her room</text><rect x="460" y="214" width="410" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="246" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Hafsa bint Umar</text><text x="478" y="272" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">daughter of Umar; kept the sheets of the Qur'an</text><rect x="30" y="318" width="410" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="350" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Zaynab bint Khuzayma</text><text x="48" y="376" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Umm al-Masakin, "mother of the poor"</text><rect x="460" y="318" width="410" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="350" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Umm Salama (Hind)</text><text x="478" y="376" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">early emigrant; gave the advice he followed at</text><text x="478" y="396" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Hudaybiyya</text><rect x="30" y="422" width="410" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="454" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Zaynab bint Jahsh</text><text x="48" y="480" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">his cousin; marriage referred to in Sura 33.37</text><rect x="460" y="422" width="410" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="454" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Juwayriya bint al-Harith</text><text x="478" y="480" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">after the marriage many Banu Mustaliq captives</text><text x="478" y="500" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">were freed</text><rect x="30" y="526" width="410" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="558" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Umm Habiba (Ramla)</text><text x="48" y="584" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">daughter of Abu Sufyan; stayed Muslim in</text><text x="48" y="604" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Abyssinia</text><rect x="460" y="526" width="410" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="558" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Safiyya bint Huyayy</text><text x="478" y="584" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">of Banu Nadir; married after Khaybar</text><rect x="30" y="630" width="410" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="662" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Maymuna bint al-Harith</text><text x="48" y="688" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">his last marriage, 7 AH, at the delayed umra</text><rect x="460" y="630" width="410" height="92" rx="14" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="662" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Also: Mariya al-Qibtiyya</text><text x="478" y="688" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">sent from Egypt; mother of his son Ibrahim</text><rect x="30" y="740" width="840" height="64" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="780" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">The Qur'an calls them "Mothers of the Believers" (Sura 33.6).</text>
</svg>