<rect width="900" height="766" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">His children and grandchildren</text>

<rect x="330" y="110" width="240" height="52" rx="10" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">The Prophet (pbuh)</text><path d="M450,162 L450,180 M220,180 L790,180 M220,180 L220,196 M790,180 L790,196" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="110" y="196" width="220" height="44" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="220" y="224" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">with Khadija (RA)</text><rect x="710" y="196" width="160" height="44" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="790" y="224" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">with Mariya</text><path d="M220,240 L220,256 M82,256 L642,256" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M82,256 L82,270" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="30" y="270" width="104" height="66" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="82" y="298" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">al-Qasim</text><text x="82" y="320" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">died young</text><path d="M194,256 L194,270" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="142" y="270" width="104" height="66" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="194" y="298" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Abdullah</text><text x="194" y="320" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">died young</text><path d="M306,256 L306,270" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="254" y="270" width="104" height="66" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="306" y="292" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Zaynab</text><text x="306" y="310" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">(RA)</text><text x="306" y="328" font-size="13" font-weight="400" fill="#4a5568" text-anchor="middle">m. Abu al-As</text><path d="M418,256 L418,270" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="366" y="270" width="104" height="66" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="418" y="292" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Ruqayya</text><text x="418" y="310" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">(RA)</text><text x="418" y="328" font-size="13" font-weight="400" fill="#4a5568" text-anchor="middle">m. Uthman (RA)</text><path d="M530,256 L530,270" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="478" y="270" width="104" height="66" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="530" y="292" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Umm Kulthum</text><text x="530" y="310" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">(RA)</text><text x="530" y="328" font-size="13" font-weight="400" fill="#4a5568" text-anchor="middle">m. Uthman (RA)</text><path d="M642,256 L642,270" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="590" y="270" width="104" height="66" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="642" y="292" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Fatima</text><text x="642" y="310" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">(RA)</text><text x="642" y="328" font-size="13" font-weight="400" fill="#4a5568" text-anchor="middle">m. Ali (RA)</text><path d="M790,240 L790,270" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="720" y="270" width="140" height="66" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="790" y="298" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Ibrahim</text><text x="790" y="320" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">died as an infant</text><path d="M418,338 L418,352 L530,352 L530,338" fill="none" stroke="#8a6d0d" stroke-width="2.5"/><path d="M474,352 L474,372" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="354" y="372" width="240" height="64" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="474" y="398" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Uthman (RA): Dhu al-Nurayn</text><text x="474" y="422" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">"possessor of two lights"</text><path d="M642,338 L642,470 M520,470 L756,470" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="470" y="486" width="110" height="52" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="525" y="518" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Hasan (RA)</text><rect x="700" y="486" width="110" height="52" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="755" y="518" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Husayn (RA)</text><path d="M525,470 L525,486 M755,470 L755,486" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M306,338 L306,486" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="242" y="486" width="120" height="52" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="302" y="518" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Umama</text><text x="450" y="572" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">Grandchildren</text><rect x="30" y="592" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="628" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Hasan (RA) and Husayn (RA), sons of Fatima (RA) and Ali (RA):</text><text x="54" y="654" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">he called them leaders of the youth of paradise.</text><text x="54" y="692" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Umama, daughter of Zaynab:</text><text x="54" y="718" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">he carried her while praying.</text>
</svg>