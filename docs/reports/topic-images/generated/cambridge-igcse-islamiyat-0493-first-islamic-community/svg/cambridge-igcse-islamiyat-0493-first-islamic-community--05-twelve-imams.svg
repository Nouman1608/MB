<rect width="900" height="760" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The twelve Imams of Twelver Shi'a Muslims</text>

<circle cx="56" cy="137" r="21" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="56" y="144.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="88" y="110" width="352" height="54" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="106" y="144" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ali ibn Abi Talib</text><circle cx="56" cy="203" r="21" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="56" y="210.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="88" y="176" width="352" height="54" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="106" y="210" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Hasan ibn Ali</text><circle cx="56" cy="269" r="21" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="56" y="276.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="88" y="242" width="352" height="54" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="106" y="276" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Husayn ibn Ali</text><circle cx="56" cy="335" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="56" y="342.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="88" y="308" width="352" height="54" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="106" y="342" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Ali Zayn al-Abidin</text><circle cx="56" cy="401" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="56" y="408.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="88" y="374" width="352" height="54" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="106" y="408" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Muhammad al-Baqir</text><circle cx="56" cy="467" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="56" y="474.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><rect x="88" y="440" width="352" height="54" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="106" y="474" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Ja'far al-Sadiq</text><circle cx="486" cy="137" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="486" y="144.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">7</text><rect x="518" y="110" width="352" height="54" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="536" y="144" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Musa al-Kazim</text><circle cx="486" cy="203" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="486" y="210.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">8</text><rect x="518" y="176" width="352" height="54" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="536" y="210" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Ali al-Rida</text><circle cx="486" cy="269" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="486" y="276.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">9</text><rect x="518" y="242" width="352" height="54" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="536" y="276" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Muhammad al-Jawad</text><circle cx="486" cy="335" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="486" y="342.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">10</text><rect x="518" y="308" width="352" height="54" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="536" y="342" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Ali al-Hadi</text><circle cx="486" cy="401" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="486" y="408.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">11</text><rect x="518" y="374" width="352" height="54" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="536" y="408" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Hasan al-Askari</text><circle cx="486" cy="467" r="21" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="486" y="474.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">12</text><rect x="518" y="440" width="352" height="54" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="536" y="474" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Muhammad al-Mahdi</text><rect x="30" y="516" width="410" height="112" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="552.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Husayn</text><text x="50" y="580.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the third Imam, martyred at Karbala</text><rect x="460" y="516" width="410" height="112" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="480" y="552.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Muhammad al-Mahdi</text><text x="480" y="580.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">believed to be in occultation and to return</text><rect x="30" y="648" width="840" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="684" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Twelver Shi'a belief: leadership passed by God's appointment</text><text x="54" y="710" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">through the Prophet's (pbuh) family, beginning with Ali. Know the names in order.</text>
</svg>