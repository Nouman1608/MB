<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 742" width="900" height="742" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="742" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The four caliphs before 632</text>

<rect x="30" y="110" width="410" height="254" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="150" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Abu Bakr</text><text x="420" y="150" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">al-Siddiq</text><circle cx="56" cy="181" r="4" fill="#1e2a44"/><text x="70" y="186" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">First adult man to accept Islam</text><circle cx="56" cy="212" r="4" fill="#1e2a44"/><text x="70" y="217" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Brought others to Islam; freed Bilal</text><circle cx="56" cy="243" r="4" fill="#1e2a44"/><text x="70" y="248" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Believed the Isra at once</text><circle cx="56" cy="274" r="4" fill="#1e2a44"/><text x="70" y="279" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Companion on the Hijra; led prayers in the</text><text x="70" y="300" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">final illness</text><rect x="460" y="110" width="410" height="254" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="480" y="150" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Umar</text><text x="850" y="150" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">al-Faruq</text><circle cx="486" cy="181" r="4" fill="#1e2a44"/><text x="500" y="186" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Accepted Islam after reading verses in his</text><text x="500" y="207" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sister's house</text><circle cx="486" cy="233" r="4" fill="#1e2a44"/><text x="500" y="238" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Muslims then prayed openly at the Ka'ba</text><circle cx="486" cy="264" r="4" fill="#1e2a44"/><text x="500" y="269" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">His daughter Hafsa married the Prophet</text><text x="500" y="290" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(pbuh)</text><rect x="30" y="380" width="410" height="254" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="50" y="420" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Uthman</text><text x="420" y="420" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Dhu al-Nurayn</text><circle cx="56" cy="451" r="4" fill="#1e2a44"/><text x="70" y="456" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Early convert; married Ruqayya, then Umm</text><text x="70" y="477" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Kulthum</text><circle cx="56" cy="503" r="4" fill="#1e2a44"/><text x="70" y="508" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Emigrated to Abyssinia; bought the well of</text><text x="70" y="529" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ruma</text><circle cx="56" cy="555" r="4" fill="#1e2a44"/><text x="70" y="560" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Equipped much of the army for Tabuk</text><rect x="460" y="380" width="410" height="254" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="480" y="420" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Ali</text><circle cx="486" cy="451" r="4" fill="#1e2a44"/><text x="500" y="456" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">First child to accept Islam</text><circle cx="486" cy="482" r="4" fill="#1e2a44"/><text x="500" y="487" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Slept in the Prophet's bed on the night of</text><text x="500" y="508" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the Hijra</text><circle cx="486" cy="534" r="4" fill="#1e2a44"/><text x="500" y="539" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Married Fatima; carried the standard at</text><text x="500" y="560" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Khaybar</text><circle cx="486" cy="586" r="4" fill="#1e2a44"/><text x="500" y="591" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Left in charge of Madinah during Tabuk</text><rect x="30" y="650" width="840" height="64" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="690" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Paper 1 stops at 632: their rule as caliphs belongs to Paper 2.</text>
</svg>