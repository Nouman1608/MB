<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 722" width="900" height="722" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="722" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Emigrants and the Helpers</text>

<rect x="30" y="110" width="360" height="160" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="50" y="150.4" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">Muhajirun</text><text x="50" y="181.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Emigrants</text><text x="50" y="209.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Left Makkah for the sake of faith,</text><text x="50" y="231.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">often losing homes and wealth.</text><rect x="510" y="110" width="360" height="160" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="530" y="150.4" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">Ansar</text><text x="530" y="181.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Helpers</text><text x="530" y="209.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The Muslims of Madinah, from the</text><text x="530" y="231.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">tribes of Aws and Khazraj, who</text><text x="530" y="253.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">sheltered them.</text><line x1="398" y1="176" x2="502" y2="176" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="502" y1="208" x2="398" y2="208" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="450" y="162" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">paired in</text><text x="450" y="236" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">brotherhood</text><rect x="30" y="292" width="840" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="328" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Example of the brotherhood</text><text x="54" y="360" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Sa'd ibn al-Rabi' (Helper) offered half his wealth to Abd al-Rahman ibn Awf (Emigrant),</text><text x="54" y="386" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">who asked only to be shown the market.</text><rect x="30" y="436" width="840" height="70" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="450" y="478" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Sura 59.9: the Ansar preferred others above themselves, even when in need.</text><text x="450" y="548" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Part (b): what Muslims today can learn</text><rect x="30" y="566" width="410" height="128" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="602.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">From the Helpers</text><text x="50" y="630.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Welcome refugees and migrants, and give</text><text x="50" y="652.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">practical help, not only sympathy.</text><rect x="460" y="566" width="410" height="128" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="480" y="602.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">From Abd al-Rahman</text><text x="480" y="630.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Those who receive help should work to stand</text><text x="480" y="652.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">on their own feet.</text>
</svg>