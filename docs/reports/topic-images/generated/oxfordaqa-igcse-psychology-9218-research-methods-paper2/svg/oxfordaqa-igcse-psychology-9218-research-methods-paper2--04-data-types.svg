<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 522" width="900" height="522" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="522" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Types of data compared</text>

<rect x="30" y="100" width="412" height="182" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">QUANTITATIVE</text><text x="50" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Numbers</text><text x="50" y="188.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">+</tspan> Easy to analyse and compare; tends to be</text><text x="50" y="209.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">more <tspan font-weight="700" fill="#1e2a44">reliable</tspan></text><text x="50" y="236.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">−</tspan> Can lack the depth to be fully <tspan font-weight="700" fill="#1e2a44">valid</tspan> about</text><text x="50" y="257.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">feelings and experiences</text><rect x="458" y="100" width="412" height="182" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="478" y="132" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">QUALITATIVE</text><text x="478" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Words, descriptions</text><text x="478" y="188.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">+</tspan> Detailed and often more <tspan font-weight="700" fill="#1e2a44">valid</tspan></text><text x="478" y="215.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">−</tspan> Harder to analyse and compare; subjective</text><text x="478" y="236.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">interpretation reduces <tspan font-weight="700" fill="#1e2a44">reliability</tspan></text><rect x="30" y="304" width="412" height="186" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="336" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PRIMARY</text><text x="50" y="362.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Collected by the researcher for this study</text><text x="50" y="390.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">+</tspan> Fits the aim exactly</text><text x="50" y="417.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">−</tspan> Takes time</text><rect x="458" y="304" width="412" height="186" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="336" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SECONDARY</text><text x="478" y="362.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Collected by someone else</text><text x="478" y="390.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">e.g.</tspan> <tspan font-style="italic">government</tspan> <tspan font-style="italic">statistics</tspan> <tspan font-style="italic">on</tspan> <tspan font-style="italic">mental</tspan> <tspan font-style="italic">health</tspan></text><text x="478" y="411.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">diagnoses</tspan></text><text x="478" y="438.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">+</tspan> Quick to use</text><text x="478" y="465.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">−</tspan> May not match the aim; quality harder to check</text>
</svg>