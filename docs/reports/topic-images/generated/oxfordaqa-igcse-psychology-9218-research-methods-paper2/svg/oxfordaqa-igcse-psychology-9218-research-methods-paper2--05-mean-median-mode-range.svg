<rect width="900" height="645" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Mean, median, mode and range</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Ten anxiety ratings (1-10): 3, 5, 5, 6, 6, 6, 7, 8, 9, 10</text>
<rect x="30" y="124" width="840" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="80" y1="324" x2="784" y2="324" stroke="#1e2a44" stroke-width="3"/><line x1="90" y1="324" x2="90" y2="334" stroke="#1e2a44" stroke-width="2.5"/><text x="90" y="356" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">1</text><line x1="166" y1="324" x2="166" y2="334" stroke="#1e2a44" stroke-width="2.5"/><text x="166" y="356" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">2</text><line x1="242" y1="324" x2="242" y2="334" stroke="#1e2a44" stroke-width="2.5"/><text x="242" y="356" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">3</text><line x1="318" y1="324" x2="318" y2="334" stroke="#1e2a44" stroke-width="2.5"/><text x="318" y="356" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">4</text><line x1="394" y1="324" x2="394" y2="334" stroke="#1e2a44" stroke-width="2.5"/><text x="394" y="356" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">5</text><line x1="470" y1="324" x2="470" y2="334" stroke="#1e2a44" stroke-width="2.5"/><text x="470" y="356" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">6</text><line x1="546" y1="324" x2="546" y2="334" stroke="#1e2a44" stroke-width="2.5"/><text x="546" y="356" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">7</text><line x1="622" y1="324" x2="622" y2="334" stroke="#1e2a44" stroke-width="2.5"/><text x="622" y="356" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">8</text><line x1="698" y1="324" x2="698" y2="334" stroke="#1e2a44" stroke-width="2.5"/><text x="698" y="356" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">9</text><line x1="774" y1="324" x2="774" y2="334" stroke="#1e2a44" stroke-width="2.5"/><text x="774" y="356" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">10</text><circle cx="242" cy="306" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="394" cy="306" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="394" cy="274" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="470" cy="306" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="470" cy="274" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="470" cy="242" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="546" cy="306" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="622" cy="306" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="698" cy="306" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="774" cy="306" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><line x1="508" y1="154" x2="508" y2="324" stroke="#b5602e" stroke-width="3" stroke-dasharray="7 5"/><text x="516" y="168" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">mean 6.5</text><text x="460" y="200" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="end">mode and median 6</text><path d="M242,376 L242,388 L774,388 L774,376" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="508" y="412" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">range = 10 − 3 = 7</text><rect x="30" y="446" width="201" height="167" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="474" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MEAN</text><text x="46" y="500.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">65 ÷ 10 = 6.5</text><text x="46" y="529.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Uses every score, but</text><text x="46" y="550.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">is distorted by</text><text x="46" y="571.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">extreme scores</text><rect x="243" y="446" width="201" height="167" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="259" y="474" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MEDIAN</text><text x="259" y="500.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">(6 + 6) ÷ 2 = 6</text><text x="259" y="529.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Average the 5th and</text><text x="259" y="550.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">6th ordered scores;</text><text x="259" y="571.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">not affected by</text><text x="259" y="592.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">extremes</text><rect x="456" y="446" width="201" height="167" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="472" y="474" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MODE</text><text x="472" y="500.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">6</text><text x="472" y="529.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The most frequent</text><text x="472" y="550.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">score; suits</text><text x="472" y="571.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">categories</text><rect x="669" y="446" width="201" height="167" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="685" y="474" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RANGE</text><text x="685" y="500.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">10 − 3 = 7</text><text x="685" y="529.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Shows spread, but</text><text x="685" y="550.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">depends only on the</text><text x="685" y="571.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">two most extreme</text><text x="685" y="592.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">scores</text>
</svg>