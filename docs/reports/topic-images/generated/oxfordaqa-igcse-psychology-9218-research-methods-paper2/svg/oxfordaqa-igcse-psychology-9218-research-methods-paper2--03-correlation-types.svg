cle cx="410.6" cy="226" r="5.5" fill="#2e6b62"/><circle cx="422" cy="248.39999999999998" r="5.5" fill="#2e6b62"/><circle cx="437.2" cy="254.8" r="5.5" fill="#2e6b62"/><circle cx="452.4" cy="264.4" r="5.5" fill="#2e6b62"/><circle cx="463.8" cy="277.2" r="5.5" fill="#2e6b62"/><circle cx="479" cy="283.6" r="5.5" fill="#2e6b62"/><circle cx="490.4" cy="299.6" r="5.5" fill="#2e6b62"/><circle cx="505.6" cy="306" r="5.5" fill="#2e6b62"/><circle cx="517" cy="318.8" r="5.5" fill="#2e6b62"/><circle cx="532.2" cy="328.4" r="5.5" fill="#2e6b62"/><text x="450" y="382" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">number of close friends →</text><text x="353" y="274" font-size="15" fill="#4a5568" text-anchor="middle" transform="rotate(-90 353 274)">anxiety →</text><text x="450" y="442" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">As one rises, the other falls</text><rect x="600" y="124" width="270" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="735" y="160" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">No correlation</text><rect x="650" y="194" width="190" height="160" fill="#ffffff"/><line x1="650" y1="354" x2="840" y2="354" stroke="#1e2a44" stroke-width="2.5"/><line x1="650" y1="354" x2="650" y2="194" stroke="#1e2a44" stroke-width="2.5"/><circle cx="669" cy="290" r="5.5" fill="#2e6b62"/><circle cx="684.2" cy="226" r="5.5" fill="#2e6b62"/><circle cx="695.6" cy="322" r="5.5" fill="#2e6b62"/><circle cx="707" cy="258" r="5.5" fill="#2e6b62"/><circle cx="722.2" cy="306" r="5.5" fill="#2e6b62"/><circle cx="737.4" cy="235.6" r="5.5" fill="#2e6b62"/><circle cx="748.8" cy="274" r="5.5" fill="#2e6b62"/><circle cx="764" cy="331.6" r="5.5" fill="#2e6b62"/><circle cx="775.4" cy="216.4" r="5.5" fill="#2e6b62"/><circle cx="790.6" cy="283.6" r="5.5" fill="#2e6b62"/><circle cx="802" cy="248.39999999999998" r="5.5" fill="#2e6b62"/><circle cx="817.2" cy="312.4" r="5.5" fill="#2e6b62"/><text x="