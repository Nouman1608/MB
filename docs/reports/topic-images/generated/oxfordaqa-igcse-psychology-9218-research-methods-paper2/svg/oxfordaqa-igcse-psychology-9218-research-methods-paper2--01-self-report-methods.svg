<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 752" width="900" height="752" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="752" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Self-report: asking people directly</text>

<path d="M240,176 L240,203 L140,203 L140,230" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M240,176 L240,203 L340,203 L340,230" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M660,176 L660,203 L560,203 L560,230" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M660,176 L660,203 L760,203 L760,230" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="50" y="100" width="380" height="76" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="240" y="128.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Questionnaire</text><text x="240" y="157.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Written questions</text><rect x="470" y="100" width="380" height="76" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="660" y="128.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Interview</text><text x="660" y="157.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Spoken questions</text><rect x="45" y="230" width="190" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="140" y="264.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Closed</text><text x="140" y="293.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Fixed answers:</text><text x="140" y="314.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">yes/no, tick boxes,</text><text x="140" y="335.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">rating scales</text><rect x="245" y="230" width="190" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="340" y="275.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Open</text><text x="340" y="304.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Answers in their own</text><text x="340" y="325.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">words</text><rect x="465" y="230" width="190" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="560" y="264.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Structured</text><text x="560" y="293.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Same questions,</text><text x="560" y="314.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">same order for</text><text x="560" y="335.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">everyone</text><rect x="665" y="230" width="190" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="760" y="275.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Unstructured</text><text x="760" y="304.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Like a conversation;</text><text x="760" y="325.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">follow up answers</text><path d="M140,360 L140,376" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="65.9825" y="376" width="148.035" height="29" rx="14.5" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="140" y="395.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">quantitative data</text><path d="M340,360 L340,376" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="271.3675" y="376" width="137.265" height="29" rx="14.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="340" y="395.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">qualitative data</text><path d="M560,360 L560,376" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="458.9975" y="376" width="202.005" height="29" rx="14.5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="560" y="395.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">easy to repeat, compare</text><path d="M760,360 L760,376" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="705.9175" y="376" width="108.165" height="29" rx="14.5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="760" y="395.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">more depth</text><rect x="30" y="432" width="412" height="157" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="464" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">QUESTIONNAIRE</text><text x="50" y="490.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Quick, many people</text><text x="50" y="518.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">+</tspan> Anonymous answers may be more honest</text><text x="50" y="543.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">−</tspan> Closed questions limit detail</text><rect x="458" y="432" width="412" height="157" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="464" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">INTERVIEW</text><text x="478" y="490.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Rich detail</text><text x="478" y="518.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">+</tspan> Misunderstandings can be clarified</text><text x="478" y="543.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">−</tspan> Time-consuming; interviewer's manner may</text><text x="478" y="564.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">influence answers</text><rect x="30" y="611" width="840" height="109" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="645.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Social desirability bias threatens both</text><text x="50" y="674.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Answering in a way that makes you look good, especially on topics such as helping behaviour or mental</text><text x="50" y="695.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">health.</text>
</svg>