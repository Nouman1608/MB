<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Categories and inter-observer reliability</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Observing personal space in a library. Tallies are illustrative</text>
<clipPath id="tc124"><rect x="30" y="124" width="840" height="240" rx="14"/></clipPath><g clip-path="url(#tc124)"><rect x="30" y="124" width="452.3076923076923" height="48" fill="#b5d3cf"/><text x="44" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Category of behaviour</text><rect x="482.3076923076923" y="124" width="193.84615384615384" height="48" fill="#b5d3cf"/><text x="496.3076923076923" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Observer A</text><rect x="676.1538461538462" y="124" width="193.84615384615384" height="48" fill="#b5d3cf"/><text x="690.1538461538462" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Observer B</text><rect x="30" y="172" width="452.3076923076923" height="48" fill="#dce9e7"/><text x="44" y="199.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Sits at an empty table</text><rect x="482.3076923076923" y="172" width="193.84615384615384" height="48" fill="#ffffff"/><rect x="676.1538461538462" y="172" width="193.84615384615384" height="48" fill="#ffffff"/><line x1="30" y1="220" x2="870" y2="220" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="220" width="452.3076923076923" height="48" fill="#dce9e7"/><text x="44" y="247.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Sits next to a stranger</text><rect x="482.3076923076923" y="220" width="193.84615384615384" height="48" fill="#f8faf9"/><rect x="676.1538461538462" y="220" width="193.84615384615384" height="48" fill="#f8faf9"/><line x1="30" y1="268" x2="870" y2="268" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="268" width="452.3076923076923" height="48" fill="#dce9e7"/><text x="44" y="295.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Sits one seat away from a stranger</text><rect x="482.3076923076923" y="268" width="193.84615384615384" height="48" fill="#ffffff"/><rect x="676.1538461538462" y="268" width="193.84615384615384" height="48" fill="#ffffff"/><line x1="30" y1="316" x2="870" y2="316" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="316" width="452.3076923076923" height="48" fill="#dce9e7"/><text x="44" y="343.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Moves after a stranger sits down</text><rect x="482.3076923076923" y="316" width="193.84615384615384" height="48" fill="#f8faf9"/><rect x="676.1538461538462" y="316" width="193.84615384615384" height="48" fill="#f8faf9"/></g><line x1="482.3076923076923" y1="124" x2="482.3076923076923" y2="364" stroke="#c9d6d4" stroke-width="1.5"/><line x1="676.1538461538462" y1="124" x2="676.1538461538462" y2="364" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="124" width="840" height="240" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><line x1="512.3076923076924" y1="180" x2="512.3076923076924" y2="202" stroke="#1e2a44" stroke-width="2.5"/><line x1="524.3076923076924" y1="180" x2="524.3076923076924" y2="202" stroke="#1e2a44" stroke-width="2.5"/><line x1="536.3076923076924" y1="180" x2="536.3076923076924" y2="202" stroke="#1e2a44" stroke-width="2.5"/><line x1="548.3076923076924" y1="180" x2="548.3076923076924" y2="202" stroke="#1e2a44" stroke-width="2.5"/><line x1="706.1538461538462" y1="180" x2="706.1538461538462" y2="202" stroke="#1e2a44" stroke-width="2.5"/><line x1="718.1538461538462" y1="180" x2="718.1538461538462" y2="202" stroke="#1e2a44" stroke-width="2.5"/><line x1="730.1538461538462" y1="180" x2="730.1538461538462" y2="202" stroke="#1e2a44" stroke-width="2.5"/><line x1="742.1538461538462" y1="180" x2="742.1538461538462" y2="202" stroke="#1e2a44" stroke-width="2.5"/><line x1="512.3076923076924" y1="229" x2="512.3076923076924" y2="251" stroke="#1e2a44" stroke-width="2.5"/><line x1="524.3076923076924" y1="229" x2="524.3076923076924" y2="251" stroke="#1e2a44" stroke-width="2.5"/><line x1="706.1538461538462" y1="229" x2="706.1538461538462" y2="251" stroke="#1e2a44" stroke-width="2.5"/><line x1="718.1538461538462" y1="229" x2="718.1538461538462" y2="251" stroke="#1e2a44" stroke-width="2.5"/><line x1="512.3076923076924" y1="278" x2="512.3076923076924" y2="300" stroke="#1e2a44" stroke-width="2.5"/><line x1="524.3076923076924" y1="278" x2="524.3076923076924" y2="300" stroke="#1e2a44" stroke-width="2.5"/><line x1="536.3076923076924" y1="278" x2="536.3076923076924" y2="300" stroke="#1e2a44" stroke-width="2.5"/><line x1="548.3076923076924" y1="278" x2="548.3076923076924" y2="300" stroke="#1e2a44" stroke-width="2.5"/><line x1="508.3076923076924" y1="298" x2="554.3076923076924" y2="278" stroke="#1e2a44" stroke-width="2.5"/><line x1="706.1538461538462" y1="278" x2="706.1538461538462" y2="300" stroke="#1e2a44" stroke-width="2.5"/><line x1="718.1538461538462" y1="278" x2="718.1538461538462" y2="300" stroke="#1e2a44" stroke-width="2.5"/><line x1="730.1538461538462" y1="278" x2="730.1538461538462" y2="300" stroke="#1e2a44" stroke-width="2.5"/><line x1="742.1538461538462" y1="278" x2="742.1538461538462" y2="300" stroke="#1e2a44" stroke-width="2.5"/><line x1="512.3076923076924" y1="327" x2="512.3076923076924" y2="349" stroke="#1e2a44" stroke-width="2.5"/><line x1="706.1538461538462" y1="327" x2="706.1538461538462" y2="349" stroke="#1e2a44" stroke-width="2.5"/><line x1="60" y1="418" x2="60" y2="572" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="398" width="766" height="43" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="424.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Observe the same people at the same time</text><circle cx="60" cy="419.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="428.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="449" width="766" height="43" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="475.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Record independently, using the same categories</text><circle cx="60" cy="470.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="479.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="500" width="766" height="92" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="116" y="526.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Compare tallies</text><text x="116" y="554.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">High agreement: the observation is <tspan font-weight="700" fill="#1e2a44">reliable</tspan>. Low agreement: make categories clearer and train</text><text x="116" y="575.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the observers.</text><circle cx="60" cy="546" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="554.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="30" y="614" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="647.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">A good category is something an observer can <tspan font-weight="700" fill="#1e2a44">see</tspan>, not guess: "sits next to a stranger", not "feels</text><text x="450" y="669.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">uncomfortable".</text>
</svg>