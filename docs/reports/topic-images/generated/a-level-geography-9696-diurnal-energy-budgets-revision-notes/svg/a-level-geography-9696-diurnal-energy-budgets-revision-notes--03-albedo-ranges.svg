<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="900" height="800" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="800" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Typical albedo of different surfaces</text>

<rect x="30" y="110" width="840" height="560" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="290" y1="140" x2="290" y2="572" stroke="#dce9e7" stroke-width="2"/><text x="290" y="598" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">0%</text><line x1="398" y1="140" x2="398" y2="572" stroke="#dce9e7" stroke-width="2"/><text x="398" y="598" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">20%</text><line x1="506" y1="140" x2="506" y2="572" stroke="#dce9e7" stroke-width="2"/><text x="506" y="598" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">40%</text><line x1="614" y1="140" x2="614" y2="572" stroke="#dce9e7" stroke-width="2"/><text x="614" y="598" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">60%</text><line x1="722" y1="140" x2="722" y2="572" stroke="#dce9e7" stroke-width="2"/><text x="722" y="598" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">80%</text><line x1="830" y1="140" x2="830" y2="572" stroke="#dce9e7" stroke-width="2"/><text x="830" y="598" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">100%</text><text x="60" y="182" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Fresh snow</text><rect x="722" y="160" width="54" height="32" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text paint-order="stroke" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" x="710" y="183" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">often 80–90%</text><text x="60" y="254" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Desert sand</text><rect x="452" y="232" width="54" height="32" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text paint-order="stroke" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" x="518" y="255" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">about 30–40%</text><text x="60" y="326" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Grass and crops</text><rect x="398" y="304" width="27" height="32" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text paint-order="stroke" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" x="437" y="327" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">about 20–25%</text><text x="60" y="398" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Forest</text><rect x="344" y="376" width="54" height="32" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text paint-order="stroke" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" x="410" y="399" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">about 10–20%</text><text x="60" y="470" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Asphalt</text><rect x="290" y="448" width="54" height="32" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="7 5"/><text paint-order="stroke" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" x="356" y="471" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">under 10%</text><text x="60" y="542" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Water</text><text paint-order="stroke" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" x="290" y="542" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">low when the sun is high; much higher at low sun angles</text><text x="450" y="630" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle">albedo = share of incoming radiation reflected</text><rect x="30" y="690" width="840" height="92" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="727" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">High albedo: reflects most radiation, heats little (snow).</text><text x="55" y="757" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Low albedo: dark, dry surfaces absorb more and heat quickly.</text>
</svg>