<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="900" height="800" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="800" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Dew, fog, inversions and frost hollows</text>

<rect x="30" y="110" width="560" height="560" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="40" y="120" width="540" height="540" rx="10" fill="#1e2a44" opacity="0.06"/><rect x="200" y="478" width="380" height="82" fill="#ffffff" opacity="0.95"/><line x1="232" y1="478" x2="560" y2="478" stroke="#4a5568" stroke-width="2" stroke-dasharray="6 5"/><path d="M40,250 Q160,260 250,420 Q320,560 400,560 Q480,560 545,420 Q562,380 580,350 L580,640 L40,640 Z" fill="#d8e3c6" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><path d="M98.125,264.375 l-7,-22 M98.125,264.375 l1,-26 M98.125,264.375 l9,-20" fill="none" stroke="#6f9a52" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M99.125,230.375 q-6,10 0,13 q6,-3 0,-13 z" fill="#b5d3cf" stroke="#2e6b62" stroke-width="1.5"/><path d="M135.50799999999998,284.86 l-7,-22 M135.50799999999998,284.86 l1,-26 M135.50799999999998,284.86 l9,-20" fill="none" stroke="#6f9a52" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M136.50799999999998,250.86 q-6,10 0,13 q6,-3 0,-13 z" fill="#b5d3cf" stroke="#2e6b62" stroke-width="1.5"/><path d="M169.108,312.06 l-7,-22 M169.108,312.06 l1,-26 M169.108,312.06 l9,-20" fill="none" stroke="#6f9a52" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M170.108,278.06 q-6,10 0,13 q6,-3 0,-13 z" fill="#b5d3cf" stroke="#2e6b62" stroke-width="1.5"/><line x1="235" y1="300" x2="320" y2="445" stroke="#2b5a9a" stroke-width="5" marker-end="url(#ah)"/><line x1="540" y1="385" x2="500" y2="470" stroke="#2b5a9a" stroke-width="5" marker-end="url(#ah)"/><text x="70" y="205" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Dew on grass</text><text x="70" y="226" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(frost below 0 °C)</text><text x="240" y="262" font-size="16" font-weight="600" fill="#2b5a9a" text-anchor="start">cold, dense air</text><text x="240" y="282" font-size="16" font-weight="600" fill="#2b5a9a" text-anchor="start">drains downhill</text><text x="400" y="520" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">radiation fog</text><text x="400" y="600" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Frost hollow:</text><text x="400" y="622" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">coldest on the valley floor</text><text x="400" y="165" font-size="17" font-weight="600" fill="#4a5568" text-anchor="middle">clear, calm night</text><path d="M430,380 q7,-10 0,-20 q-7,-10 0,-20 q7,-10 0,-20 q-7,-10 0,-20 q7,-10 0,-20 q-7,-10 0,-20 q7,-10 0,-20 q-7,-10 0,-20 L430,210" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahR)"/><text x="448" y="288" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">longwave</text><text x="448" y="306" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">loss</text><rect x="610" y="110" width="260" height="560" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="740" y="150" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Inversion</text><rect x="642" y="470" width="204" height="128" fill="#b5d3cf" opacity="0.45"/><line x1="640" y1="600" x2="640" y2="240" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="640" y1="600" x2="850" y2="600" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="745" y="630" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">temperature</text><text x="630" y="420" font-size="15" fill="#4a5568" text-anchor="middle" transform="rotate(-90 630 420)">height</text><path d="M655,598 L715,470 L660,280" fill="none" stroke="#b5602e" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" /><text x="730" y="430" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">warmer</text><text x="730" y="448" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">air above</text><text x="730" y="505" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">cold air</text><text x="730" y="523" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">traps fog</text><text x="730" y="541" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">and pollution</text><text x="740" y="178" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">air warms with height</text><text x="740" y="196" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">near the ground</text><rect x="30" y="690" width="840" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="726" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Surfaces cool by longwave loss; air cools to its dew point.</text><text x="55" y="756" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">Fog and pollution stay trapped until the morning sun warms the surface.</text>
</svg>