<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 790" width="900" height="790" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="790" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The night-time energy budget</text>

<defs><marker id="ahC" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b5d3cf"/></marker></defs><rect x="30" y="110" width="840" height="330" fill="#1e2a44"/><rect x="30" y="440" width="840" height="150" fill="#cbbf9f"/><line x1="30" y1="440" x2="870" y2="440" stroke="#1e2a44" stroke-width="3.5"/><rect x="30" y="440" width="840" height="14" fill="#6f9a52" opacity="0.6"/><circle cx="95" cy="185" r="30" fill="#f2e7b8"/><circle cx="110" cy="175" r="26" fill="#1e2a44"/><circle cx="180" cy="140" r="3" fill="#f2e7b8"/><circle cx="300" cy="175" r="3" fill="#f2e7b8"/><circle cx="560" cy="135" r="3" fill="#f2e7b8"/><circle cx="760" cy="150" r="3" fill="#f2e7b8"/><circle cx="840" cy="230" r="3" fill="#f2e7b8"/><circle cx="420" cy="140" r="3" fill="#f2e7b8"/><text x="95" y="250" font-size="16" font-weight="600" fill="#f2e7b8" text-anchor="middle">no solar input</text><path d="M260,434 q12,-15 0,-30 q-12,-15 0,-30 q12,-15 0,-30 q-12,-15 0,-30 q12,-15 0,-30 q-12,-15 0,-30 q12,-15 0,-30 L260,210" fill="none" stroke="#d4b02e" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahO)"/><path d="M320,434 q12,-15 0,-30 q-12,-15 0,-30 q12,-15 0,-30 q-12,-15 0,-30 q12,-15 0,-30 q-12,-15 0,-30 L320,230" fill="none" stroke="#d4b02e" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahO)"/><circle cx="361" cy="294" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="361" y="299.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">−</text><text x="385" y="300" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Longwave lost</text><text x="385" y="322" font-size="15" font-weight="400" fill="#b5d3cf" text-anchor="start">to the sky: the</text><text x="385" y="341" font-size="15" font-weight="400" fill="#b5d3cf" text-anchor="start">surface cools</text><line x1="260" y1="565" x2="260" y2="454" stroke="#1e2a44" stroke-width="6" marker-end="url(#ah)"/><circle cx="301" cy="486" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="301" y="491.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><text x="325" y="492" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Subsurface supply</text><text x="325" y="514" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">heat conducted up</text><text x="325" y="533" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">from the ground</text><line x1="560" y1="200" x2="560" y2="430" stroke="#b5d3cf" stroke-width="6" marker-end="url(#ahC)"/><circle cx="596" cy="194" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="596" y="199.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><text x="620" y="200" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Sensible heat</text><text x="620" y="222" font-size="15" font-weight="400" fill="#b5d3cf" text-anchor="start">from the air</text><path d="M700,422 q-7,10 0,14 q7,-4 0,-14 z" fill="#b5d3cf" stroke="#2e6b62" stroke-width="1.5"/><path d="M730,416 q-7,10 0,14 q7,-4 0,-14 z" fill="#b5d3cf" stroke="#2e6b62" stroke-width="1.5"/><path d="M760,422 q-7,10 0,14 q7,-4 0,-14 z" fill="#b5d3cf" stroke="#2e6b62" stroke-width="1.5"/><path d="M790,416 q-7,10 0,14 q7,-4 0,-14 z" fill="#b5d3cf" stroke="#2e6b62" stroke-width="1.5"/><path d="M820,422 q-7,10 0,14 q7,-4 0,-14 z" fill="#b5d3cf" stroke="#2e6b62" stroke-width="1.5"/><line x1="760" y1="312" x2="760" y2="406" stroke="#b5d3cf" stroke-width="4" marker-end="url(#ahC)" stroke-dasharray="9 6"/><circle cx="706" cy="264" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="706" y="269.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><text x="730" y="270" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Latent heat</text><text x="730" y="292" font-size="15" font-weight="400" fill="#b5d3cf" text-anchor="start">released if dew</text><text x="730" y="311" font-size="15" font-weight="400" fill="#b5d3cf" text-anchor="start">or fog forms</text><text x="850" y="570" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">GROUND</text><rect x="30" y="615" width="840" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="652" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Energy available at the surface =</text><text x="55" y="684" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">− longwave radiation + subsurface supply + sensible heat transfer</text><text x="55" y="712" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">+ latent heat transfer (condensation)</text><text x="55" y="746" font-size="17" font-weight="600" fill="#b5602e" text-anchor="start">Net radiation is negative; the coldest time is usually just before dawn.</text>
</svg>