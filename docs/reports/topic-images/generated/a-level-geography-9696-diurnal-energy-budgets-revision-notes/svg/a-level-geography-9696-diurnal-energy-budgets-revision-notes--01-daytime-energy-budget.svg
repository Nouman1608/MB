<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 790" width="900" height="790" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="790" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The daytime energy budget</text>

<rect x="30" y="110" width="840" height="330" fill="#dce9e7"/><rect x="30" y="440" width="840" height="150" fill="#cbbf9f"/><line x1="30" y1="440" x2="870" y2="440" stroke="#1e2a44" stroke-width="3.5"/><rect x="30" y="440" width="840" height="14" fill="#6f9a52" opacity="0.6"/><circle cx="95" cy="190" r="34" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="137" y1="190" x2="149" y2="190" stroke="#8a6d0d" stroke-width="4" stroke-linecap="round"/><line x1="124.698484809835" y1="219.698484809835" x2="133.18376618407356" y2="228.18376618407356" stroke="#8a6d0d" stroke-width="4" stroke-linecap="round"/><line x1="95" y1="232" x2="95" y2="244" stroke="#8a6d0d" stroke-width="4" stroke-linecap="round"/><line x1="65.301515190165" y1="219.698484809835" x2="56.81623381592644" y2="228.18376618407356" stroke="#8a6d0d" stroke-width="4" stroke-linecap="round"/><line x1="53" y1="190" x2="41" y2="190" stroke="#8a6d0d" stroke-width="4" stroke-linecap="round"/><line x1="65.30151519016499" y1="160.301515190165" x2="56.816233815926424" y2="151.81623381592644" stroke="#8a6d0d" stroke-width="4" stroke-linecap="round"/><line x1="94.99999999999999" y1="148" x2="94.99999999999999" y2="136" stroke="#8a6d0d" stroke-width="4" stroke-linecap="round"/><line x1="124.69848480983498" y1="160.301515190165" x2="133.18376618407356" y2="151.8162338159264" stroke="#8a6d0d" stroke-width="4" stroke-linecap="round"/><line x1="125" y1="232" x2="205" y2="434" stroke="#8a6d0d" stroke-width="12" marker-end="url(#ahO)"/><circle cx="166" cy="164" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="166" y="169.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="190" y="170" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Incoming solar</text><text x="190" y="192" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">shortwave</text><line x1="240" y1="434" x2="300" y2="300" stroke="#8a6d0d" stroke-width="5" marker-end="url(#ahO)"/><circle cx="271" cy="244" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="271" y="249.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="295" y="250" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Reflected</text><text x="295" y="272" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">set by albedo</text><line x1="365" y1="450" x2="365" y2="560" stroke="#1e2a44" stroke-width="6" marker-end="url(#ah)"/><circle cx="401" cy="486" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="401" y="491.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="425" y="492" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Surface absorption</text><text x="425" y="514" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">heat conducted</text><text x="425" y="533" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">into the ground</text><path d="M520,434 q-16,-30 0,-60 q16,-30 0,-60" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahR)"/><circle cx="446" cy="229" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="446" y="234.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="470" y="235" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sensible heat</text><text x="470" y="257" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">warms the air</text><text x="470" y="276" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(conduction,</text><text x="470" y="295" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">convection)</text><path d="M650,434 q9,-13 0,-26 q-9,-13 0,-26 q9,-13 0,-26 q-9,-13 0,-26 q9,-13 0,-26 q-9,-13 0,-26 L650,270" fill="none" stroke="#b5602e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahR)"/><circle cx="576" cy="159" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="576" y="164.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="600" y="165" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Longwave</text><text x="600" y="187" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">emitted by surface</text><path d="M790,440 q-4,-30 -22,-44 M790,440 q2,-34 18,-50 M790,440 l0,-36" fill="none" stroke="#6f9a52" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><ellipse cx="835" cy="444" rx="30" ry="8" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><path d="M810,390 l0,-100" fill="none" stroke="#2e6b62" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 7" marker-end="url(#ahT)"/><circle cx="706" cy="219" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="706" y="224.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="730" y="225" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Latent heat</text><text x="730" y="247" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">used in</text><text x="730" y="266" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">evaporation</text><text x="850" y="570" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">GROUND</text><text x="850" y="140" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end">AIR</text><rect x="30" y="615" width="840" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="652" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Energy available at the surface =</text><text x="55" y="684" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">① incoming solar − ② reflected solar − ③ surface absorption</text><text x="55" y="712" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">− ④ sensible heat − ⑤ longwave − ⑥ latent heat (evaporation)</text><text x="55" y="746" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">Net radiation is positive, so the surface warms into the early afternoon.</text>
</svg>