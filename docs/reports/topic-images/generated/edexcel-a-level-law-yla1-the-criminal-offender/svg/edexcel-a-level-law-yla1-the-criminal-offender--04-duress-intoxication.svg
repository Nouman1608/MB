<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 683" width="900" height="683" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="683" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Duress and intoxication</text>

<text x="30" y="114" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DURESS OF THREATS: THE R v GRAHAM [1982] TEST</text><line x1="60" y1="148" x2="60" y2="377" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="128" width="446" height="69" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THRESHOLD</text><text x="118" y="179.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">A threat of death or serious injury</text><circle cx="60" cy="162.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="171.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="207" width="446" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="233" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STAGE 1 (SUBJECTIVE)</text><text x="118" y="258.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Was D compelled by a reasonable belief in the</text><text x="118" y="279.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">threat?</text><circle cx="60" cy="252" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="260.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="307" width="446" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="333" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STAGE 2 (OBJECTIVE)</text><text x="118" y="358.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Would a sober person of reasonable firmness</text><text x="118" y="379.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">have responded the same way?</text><circle cx="60" cy="352" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="360.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="570" y="128" width="300" height="205" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="590" y="160" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">NOT AVAILABLE</text><text x="590" y="191.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="605.2" y="191.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Murder: <tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Howe</tspan> [1987]</text><text x="590" y="218.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="605.2" y="218.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Attempted murder: <tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Gotts</tspan></text><text x="605.2" y="239.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">[1992]</text><text x="590" y="266.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="605.2" y="266.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lost on voluntary association</text><text x="605.2" y="287.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">with criminals: <tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Hasan</tspan></text><text x="605.2" y="308.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">[2005]</text><rect x="570" y="343" width="300" height="107" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="590" y="375" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DURESS OF CIRCUMSTANCES</text><text x="590" y="406" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Same test, danger from a situation:</text><text x="590" y="426" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Willer</tspan> [1986]; <tspan font-style="italic">Martin</tspan> [1989]</text><text x="30" y="486" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INTOXICATION</text><rect x="30" y="500" width="413" height="151" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="532" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">VOLUNTARY</text><text x="50" y="557.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">No defence to basic-intent offences</text><text x="50" y="584.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">DPP</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Majewski</tspan> [1977]; can negate specific</text><text x="50" y="605.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">intent. "Dutch courage" defeats it: <tspan font-style="italic">A-G</tspan> <tspan font-style="italic">for</tspan> <tspan font-style="italic">NI</tspan> <tspan font-style="italic">v</tspan></text><text x="50" y="626.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Gallagher</tspan> [1963].</text><rect x="457" y="500" width="413" height="151" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="477" y="532" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INVOLUNTARY</text><text x="477" y="557.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Helps only if D did not form mens rea</text><text x="477" y="584.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">An intoxicated intent is still intent (<tspan font-style="italic">Kingston</tspan></text><text x="477" y="605.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">[1994]); a sedative with an unexpected effect</text><text x="477" y="626.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">may count (<tspan font-style="italic">Hardie</tspan> [1985]).</text>
</svg>