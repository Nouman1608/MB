<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 793" width="900" height="793" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="793" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Mens rea separates similar offences</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Offences Against the Person Act 1861</text>
<text x="150" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">OFFENCE</text><text x="600" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">MENS REA NEEDED</text><circle cx="62" cy="187" r="30" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="197.8" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle"></text><text x="62" y="194" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">s 47</text><rect x="110" y="152" width="440" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="126" y="191.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Assault occasioning actual bodily harm</text><rect x="600" y="152" width="270" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="616" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Mens rea for the assault</text><text x="616" y="205.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">only</text><line x1="556" y1="187" x2="594" y2="187" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><circle cx="62" cy="274" r="30" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="284.8" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle"></text><text x="62" y="281" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">s 20</text><rect x="110" y="238" width="440" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="126" y="267.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Unlawful wounding or inflicting grievous bodily</text><text x="126" y="289.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">harm</text><rect x="600" y="238" width="270" height="72" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="616" y="278.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Foresight of some harm</text><line x1="556" y1="274" x2="594" y2="274" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><circle cx="62" cy="358" r="30" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="368.8" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle"></text><text x="62" y="365" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">s 18</text><rect x="110" y="322" width="440" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="126" y="351.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Wounding or causing grievous bodily harm with</text><text x="126" y="373.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">intent</text><rect x="600" y="322" width="270" height="72" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="616" y="362.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Intention</text><line x1="556" y1="358" x2="594" y2="358" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="416" width="272" height="151" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="448" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DIRECT INTENTION</text><text x="50" y="473.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Aim or purpose</text><text x="50" y="500.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Mohan</tspan> [1975]</text><rect x="314" y="416" width="272" height="151" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334" y="448" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">OBLIQUE INTENTION</text><text x="334" y="473.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Virtual certainty,</text><text x="334" y="494.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">appreciated by D</text><text x="334" y="521.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Woollin</tspan> [1998], refining</text><text x="334" y="542.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Nedrick</tspan> [1986]</text><rect x="598" y="416" width="272" height="151" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="618" y="448" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SUBJECTIVE RECKLESSNESS</text><text x="618" y="473.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">D foresaw a risk and</text><text x="618" y="494.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">unreasonably took it</text><text x="618" y="521.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Cunningham</tspan> [1957]; <tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">G</tspan></text><text x="618" y="542.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">[2003]</text><rect x="30" y="589" width="272" height="172" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="621" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TRANSFERRED MALICE</text><text x="50" y="646.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Mens rea transfers to</text><text x="50" y="667.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">another victim</text><text x="50" y="694.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Latimer</tspan> [1886]</text><rect x="314" y="589" width="272" height="172" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334" y="621" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">BUT NOT</text><text x="334" y="646.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Between different kinds of</text><text x="334" y="667.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">offence</text><text x="334" y="694.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Pembliton</tspan> [1874]:</text><text x="334" y="715.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">intending to hit people, he</text><text x="334" y="736.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">broke a window</text><rect x="598" y="589" width="272" height="172" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="618" y="621" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COINCIDENCE</text><text x="618" y="646.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">AR and MR must coincide</text><text x="618" y="673.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A continuing act can satisfy</text><text x="618" y="694.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">this: <tspan font-style="italic">Fagan</tspan> [1969]</text>
</svg>