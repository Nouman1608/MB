<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 694" width="900" height="694" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="694" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Sentencing: four main types</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Criminal Justice Act 2003 framework, now consolidated in the Sentencing Act 2020</text>
<rect x="30" y="124" width="840" height="76" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="44" y="152.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Custody</text><text x="44" y="181.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Only where neither a fine nor a community sentence can be justified; may be suspended</text><rect x="65" y="210" width="770" height="76" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="79" y="238.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Community orders</text><text x="79" y="267.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">One or more requirements: unpaid work, curfew, rehabilitation activity</text><rect x="100" y="296" width="700" height="76" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="114" y="324.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Fines</text><text x="114" y="353.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Set by the seriousness of the offence and the offender's means</text><rect x="135" y="382" width="630" height="76" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="149" y="410.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Discharges</text><text x="149" y="439.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Conditional or absolute</text><text x="860" y="116" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="450" y="492" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Most severe at the top</text><rect x="30" y="522" width="202.5" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="584" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SERIOUSNESS</text><text x="50" y="608.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Culpability and harm</text><rect x="242.5" y="522" width="202.5" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="262.5" y="554" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">AGGRAVATING</text><text x="262.5" y="578.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">e.g. previous</text><text x="262.5" y="598.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">convictions;</text><text x="262.5" y="618.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">hostility based on</text><text x="262.5" y="638.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">race or religion</text><rect x="455" y="522" width="202.5" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="475" y="574" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MITIGATING</text><text x="475" y="598.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Factors that reduce</text><text x="475" y="618.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">the sentence</text><rect x="667.5" y="522" width="202.5" height="140" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="687.5" y="574" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GUILTY PLEA</text><text x="687.5" y="598.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Up to one third off</text><text x="687.5" y="618.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">for an early plea</text>
</svg>