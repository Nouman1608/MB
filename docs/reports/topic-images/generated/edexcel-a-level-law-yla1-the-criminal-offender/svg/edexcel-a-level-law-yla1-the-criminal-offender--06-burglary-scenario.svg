<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 682" width="900" height="682" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="682" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Applying s 9 to a scenario</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Owen enters a garage to take a bicycle, pushes the owner, takes nothing</text>
<rect x="30" y="124" width="411" height="132" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">s 9(1)(a)</text><text x="50" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Enters as a trespasser with intent</text><text x="50" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">to steal, inflict GBH or do unlawful damage:</text><text x="50" y="231.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">complete on entry</text><rect x="459" y="124" width="411" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="166.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">s 9(1)(b)</text><text x="479" y="192.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Having entered as a trespasser…</text><text x="479" y="221.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">steals or inflicts GBH, or attempts to</text><line x1="60" y1="298" x2="60" y2="566" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="278" width="766" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="304.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Trespasser?</text><text x="116" y="332.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">He had no permission: yes.</text><circle cx="60" cy="313.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="322.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="357" width="766" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="383.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Building or part of one?</text><text x="116" y="411.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A garage is a building.</text><circle cx="60" cy="392.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="401.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="436" width="766" height="71" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="116" y="462.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Intent on entry?</text><text x="116" y="490.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">He intended to steal: s 9(1)(a) burglary is complete on entry.</text><circle cx="60" cy="471.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="480.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="515" width="766" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="541.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Robbery?</text><text x="116" y="569.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">No theft occurred, so no robbery (<tspan font-style="italic">Robinson</tspan>); consider an assault offence for the push.</text><circle cx="60" cy="550.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="559.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="450" y="620.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Entry must be "effective" (<tspan font-style="italic">Collins</tspan>; <tspan font-style="italic">Brown</tspan>), can be partial (<tspan font-style="italic">Ryan</tspan>); part of a building includes behind a shop</text><text x="450" y="641.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">counter (<tspan font-style="italic">Walkington</tspan>).</text>
</svg>