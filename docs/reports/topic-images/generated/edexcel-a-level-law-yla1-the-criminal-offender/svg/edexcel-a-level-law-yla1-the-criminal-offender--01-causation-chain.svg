<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 569" width="900" height="569" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="569" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Causation: two tests, then the chain</text>

<rect x="30" y="100" width="446.5217391304348" height="176" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1 · FACTUAL CAUSATION</text><text x="50" y="158.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">"But for" the act, would the result have</text><text x="50" y="181.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">happened?</text><text x="50" y="209.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">White</tspan> [1910]: the victim died of a heart attack</text><text x="50" y="230.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">before the poison worked, so White was not the</text><text x="50" y="251.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">cause (guilty of attempted murder).</text><line x1="482.5217391304348" y1="188" x2="520.5217391304348" y2="188" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="526.5217391304348" y="100" width="343.47826086956525" height="176" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="546.5217391304348" y="153" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">2 · LEGAL CAUSATION</text><text x="546.5217391304348" y="179.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">An operating and substantial</text><text x="546.5217391304348" y="202.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">cause?</text><text x="546.5217391304348" y="230.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Smith</tspan> [1959]</text><text x="450" y="312.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700">Does</tspan> <tspan font-weight="700">an</tspan> <tspan font-weight="700">intervening</tspan> <tspan font-weight="700">act</tspan> <tspan font-weight="700">break</tspan> <tspan font-weight="700">the</tspan> <tspan font-weight="700">chain?</tspan></text><rect x="30" y="344" width="272" height="193" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="376" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THIN SKULL RULE</text><text x="50" y="401.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Take the victim as you find</text><text x="50" y="422.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">them</text><text x="50" y="449.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Blaue</tspan> [1975]</text><rect x="314" y="344" width="272" height="193" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334" y="376" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">POOR MEDICAL TREATMENT</text><text x="334" y="401.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Rarely breaks the chain</text><text x="334" y="428.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Unless "palpably wrong" (<tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan></text><text x="334" y="449.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Jordan</tspan> [1956]) or so</text><text x="334" y="470.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">independent the original</text><text x="334" y="491.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">wound is insignificant (<tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan></text><text x="334" y="512.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Cheshire</tspan> [1991])</text><rect x="598" y="344" width="272" height="193" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="618" y="376" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">VICTIM ESCAPING</text><text x="618" y="401.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">A reasonably foreseeable</text><text x="618" y="422.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">reaction does not break it</text><text x="618" y="449.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Roberts</tspan> [1971]</text>
</svg>