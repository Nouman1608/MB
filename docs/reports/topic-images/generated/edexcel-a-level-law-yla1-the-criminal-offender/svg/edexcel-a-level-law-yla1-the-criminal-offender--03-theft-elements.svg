<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 658" width="900" height="658" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="658" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Theft: five elements, Theft Act 1968</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">All five must be proved</text>
<rect x="30" y="124" width="290" height="104" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="100" y="180.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Dishonestly</text><rect x="46" y="161" width="45.405" height="29" rx="14.5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="68.7025" y="180.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">s 2</text><rect x="330" y="124" width="540" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="344" y="150" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Ivey</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Genting</tspan> <tspan font-style="italic">Casinos</tspan> [2017]: D's actual belief about the facts, then the</text><text x="344" y="170" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">standards of ordinary decent people. Not dishonest if D believes in a</text><text x="344" y="190" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">legal right, owner's consent, or owner cannot be found by reasonable</text><text x="344" y="210" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">steps</text><rect x="30" y="238" width="290" height="64" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="100" y="274.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Appropriates</text><rect x="46" y="255" width="45.644999999999996" height="29" rx="14.5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="68.82249999999999" y="274.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">s 3</text><rect x="330" y="238" width="540" height="64" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="344" y="264" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Any assumption of the rights of an owner (<tspan font-style="italic">Morris</tspan> [1983]), even with</text><text x="344" y="284" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">consent (<tspan font-style="italic">Gomez</tspan> [1993])</text><rect x="30" y="312" width="290" height="64" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="100" y="348.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Property</text><rect x="46" y="329" width="46.095" height="29" rx="14.5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="69.0475" y="348.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">s 4</text><rect x="330" y="312" width="540" height="64" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="344" y="348" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Money and all other property, real or personal, including things in action</text><rect x="30" y="386" width="290" height="64" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="100" y="422.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Belonging to another</text><rect x="46" y="403" width="45.54" height="29" rx="14.5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="68.77" y="422.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">s 5</text><rect x="330" y="386" width="540" height="64" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="344" y="412" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Includes possession or control; property got by another's mistake (s</text><text x="344" y="432" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">5(4))</text><rect x="30" y="460" width="290" height="72" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="100" y="488.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Intention permanently</text><text x="100" y="512.8199999999999" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">to deprive</text><rect x="46" y="477" width="45.69" height="29" rx="14.5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="68.845" y="496.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">s 6</text><rect x="330" y="460" width="540" height="64" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="344" y="486" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Treating the thing as one's own to dispose of; borrowing only if the</text><text x="344" y="506" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">"goodness" is gone (<tspan font-style="italic">Lloyd</tspan> [1985])</text><rect x="30" y="546" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="579.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Theft is dishonestly appropriating property belonging to another with the intention of permanently</text><text x="450" y="601.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">depriving the other of it (s 1).</text>
</svg>