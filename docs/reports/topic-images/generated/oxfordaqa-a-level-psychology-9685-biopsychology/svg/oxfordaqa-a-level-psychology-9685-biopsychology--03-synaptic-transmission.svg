<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 950" width="900" height="950" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="950" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Synaptic transmission</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Schematic, not to scale</text>
<path d="M40,144 L300,144 Q360,144 360,214 L360,334 Q360,404 300,404 L40,404 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="60" y="174" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Presynaptic terminal</text><circle cx="200" cy="234" r="22" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="193" cy="229" r="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="1"/><circle cx="206" cy="228" r="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="1"/><circle cx="200" cy="241" r="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="1"/><circle cx="250" cy="304" r="22" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="243" cy="299" r="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="1"/><circle cx="256" cy="298" r="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="1"/><circle cx="250" cy="311" r="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="1"/><circle cx="180" cy="344" r="22" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="173" cy="339" r="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="1"/><circle cx="186" cy="338" r="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="1"/><circle cx="180" cy="351" r="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="1"/><circle cx="300" cy="254" r="22" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="293" cy="249" r="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="1"/><circle cx="306" cy="248" r="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="1"/><circle cx="300" cy="261" r="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="1"/><text x="110" y="386" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="start">vesicles of neurotransmitter</text><path d="M860,144 L600,144 Q540,144 540,214 L540,334 Q540,404 600,404 L860,404 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="840" y="174" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Postsynaptic neuron</text><path d="M540,212 Q556,224 540,236" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M540,262 Q556,274 540,286" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M540,312 Q556,324 540,336" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="570" y="374" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">receptor sites</text><circle cx="390" cy="234" r="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="420" cy="274" r="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="460" cy="244" r="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="440" cy="314" r="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="500" cy="274" r="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="480" cy="344" r="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="410" cy="354" r="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><text x="450" y="184" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">synaptic cleft</text><line x1="380" y1="424" x2="520" y2="424" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><text x="450" y="454" font-size="15" font-weight="600" fill="#b5602e" text-anchor="middle">one-way: vesicles only in the presynaptic terminal, receptors only on the postsynaptic membrane</text><line x1="60" y1="502" x2="60" y2="747" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="482" width="766" height="45" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="117" y="509.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Action potential reaches the presynaptic terminal</text><circle cx="60" cy="504.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="513.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="535" width="766" height="45" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="117" y="562.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Vesicles release neurotransmitter into the synaptic cleft</text><circle cx="60" cy="557.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="566.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="588" width="766" height="45" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="117" y="615.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Neurotransmitter diffuses across and binds to receptor sites</text><circle cx="60" cy="610.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="619.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="641" width="766" height="45" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="117" y="668.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The charge of the postsynaptic membrane changes</text><circle cx="60" cy="663.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="672.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="694" width="766" height="73" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="117" y="721.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Neurotransmitter removed</text><text x="117" y="749.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reuptake into the presynaptic neuron, or broken down by enzymes</text><circle cx="60" cy="730.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="739.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="30" y="789" width="270.6666666666667" height="129" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="830" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXCITATORY</text><text x="50" y="856.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">More likely to fire</text><text x="50" y="884.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">e.g. adrenaline, noradrenaline</text><rect x="314.6666666666667" y="789" width="270.6666666666667" height="129" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="821" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">SUMMATION</text><text x="450" y="847.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Net effect reaches</text><text x="450" y="870.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">threshold → action</text><text x="450" y="893.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">potential</text><rect x="599.3333333333334" y="789" width="270.6666666666667" height="129" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="619.3333333333334" y="830" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INHIBITORY</text><text x="619.3333333333334" y="856.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Less likely to fire</text><text x="619.3333333333334" y="884.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">e.g. serotonin, GABA</text>
</svg>