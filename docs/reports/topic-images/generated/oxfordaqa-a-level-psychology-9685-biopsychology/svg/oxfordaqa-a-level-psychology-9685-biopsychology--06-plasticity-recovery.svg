<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 762" width="900" height="762" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="762" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Plasticity and functional recovery</text>

<rect x="30" y="100" width="840" height="220" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="136" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">MAGUIRE ET AL. (2000): LONDON TAXI DRIVERS</text><text x="54" y="164" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Posterior hippocampus (spatial memory). Illustrative sizes, not real data</text><rect x="100" y="240" width="120" height="40" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="160" y="302" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Controls</text><rect x="280" y="216" width="120" height="64" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="340" y="302" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Taxi drivers</text><rect x="460" y="194" width="120" height="86" fill="#2e6b62" stroke="#1e2a44" stroke-width="2.5"/><text x="520" y="302" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">More years</text><text x="520" y="184" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">larger still</text><line x1="80" y1="280" x2="610" y2="280" stroke="#1e2a44" stroke-width="3"/><text x="650" y="210" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Experience can change</text><text x="650" y="232" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the brain’s <tspan font-weight="700">structure</tspan>.</text><text x="450" y="358" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">FUNCTIONAL RECOVERY AFTER TRAUMA, SUCH AS A STROKE</text><rect x="30" y="380" width="413" height="108" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="414.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Axonal sprouting</text><text x="50" y="442.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">new nerve endings connect with undamaged</text><text x="50" y="463.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">areas</text><rect x="457" y="380" width="413" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="477" y="414.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Recruitment of homologous areas</text><text x="477" y="442.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the equivalent area in the other hemisphere</text><text x="477" y="463.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">takes over, e.g. language</text><rect x="30" y="500" width="413" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="548.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Reformation of blood vessels</text><rect x="457" y="500" width="413" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="534.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Denervation supersensitivity</text><text x="477" y="562.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">remaining neurons become more responsive</text><rect x="30" y="609" width="840" height="57" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="641.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Recovery tends to be greater in <tspan font-weight="700" fill="#1e2a44">younger</tspan> people and with <tspan font-weight="700" fill="#1e2a44">rehabilitation</tspan> (physiotherapy, speech therapy).</text><text x="450" y="700.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Limitation: evidence is often correlational (drivers may have chosen the job because of their memory) or from</text><text x="450" y="721.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">animals; recovery varies between individuals.</text>
</svg>