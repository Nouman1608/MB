<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 617" width="900" height="617" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="617" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Divisions of the nervous system</text>

<path d="M450,148 L450,179 L180,179 L180,210" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M450,148 L450,179 L605,179 L605,210" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M605,258 L605,289 L468,289 L468,320" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M605,258 L605,289 L742,289 L742,320" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M742,417 L742,452.5 L468,452.5 L468,488" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M742,417 L742,452.5 L742,452.5 L742,488" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="300" y="100" width="300" height="48" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="128.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Nervous system</text><rect x="30" y="210" width="300" height="76" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="180" y="238.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Central (CNS)</text><text x="180" y="267.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">brain and spinal cord</text><rect x="455" y="210" width="300" height="48" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="605" y="238.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Peripheral (PNS)</text><rect x="343" y="320" width="250" height="118" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="468" y="348.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Somatic</text><text x="468" y="377.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">voluntary movement;</text><text x="468" y="398.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">sensory information from</text><text x="468" y="419.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">skin, muscles, joints</text><rect x="617" y="320" width="250" height="97" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="742" y="348.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Autonomic</text><text x="742" y="377.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">involuntary control of</text><text x="742" y="398.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">internal organs and glands</text><rect x="343" y="488" width="250" height="97" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="468" y="516.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Sympathetic</text><text x="468" y="545.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">arousal: “fight or flight”;</text><text x="468" y="566.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">speeds the heart</text><rect x="617" y="488" width="250" height="97" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="742" y="516.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Parasympathetic</text><text x="742" y="545.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">calming: “rest and digest”;</text><text x="742" y="566.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">slows the heart</text><rect x="30" y="320" width="300" height="177" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="352" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CNS ROLES</text><text x="50" y="383.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="383.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Brain</tspan>: processes information</text><text x="65.2" y="404.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and controls behaviour</text><text x="50" y="430.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="430.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Spinal</tspan> <tspan font-weight="700" fill="#1e2a44">cord</tspan>: relays messages</text><text x="65.2" y="451.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">between brain and body;</text><text x="65.2" y="472.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">controls simple reflexes</text><text x="30" y="518" font-size="17" font-weight="400" fill="#b5602e" text-anchor="start">The two autonomic branches work</text><text x="30" y="540" font-size="17" font-weight="400" fill="#b5602e" text-anchor="start"><tspan font-weight="700">antagonistically</tspan>.</text>
</svg>