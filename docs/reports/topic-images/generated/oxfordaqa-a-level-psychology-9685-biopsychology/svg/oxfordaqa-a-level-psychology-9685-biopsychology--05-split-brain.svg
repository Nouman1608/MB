<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 708" width="900" height="708" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="708" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Sperry’s split-brain research</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Corpus callosum severed to control severe epilepsy. Schematic</text>
<rect x="60" y="124" width="220" height="86" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="170" y="158.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Left visual field</text><text x="170" y="186" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">image flashed briefly</text><rect x="620" y="124" width="220" height="86" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="730" y="158.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Right visual field</text><text x="730" y="186" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">image flashed briefly</text><text x="450" y="160" font-size="34" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><text x="450" y="186" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">fixed on centre</text><ellipse cx="320" cy="314" rx="120" ry="66" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><ellipse cx="580" cy="314" rx="120" ry="66" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="320" y="310" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Left hemisphere</text><text x="320" y="334" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">language</text><text x="580" y="310" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Right hemisphere</text><text x="580" y="334" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">spatial, faces</text><line x1="450" y1="264" x2="450" y2="364" stroke="#b5602e" stroke-width="4" stroke-dasharray="8 6"/><text x="450" y="388" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">corpus callosum cut</text><line x1="200" y1="198" x2="520" y2="252" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/><line x1="700" y1="198" x2="380" y2="252" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="30" y="416" width="413" height="106" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="236.5" y="459.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">RIGHT VISUAL FIELD → LEFT HEMISPHERE</text><text x="236.5" y="485.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Object can be named</text><rect x="457" y="416" width="413" height="106" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="663.5" y="448" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">LEFT VISUAL FIELD → RIGHT HEMISPHERE</text><text x="663.5" y="474.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Cannot be named, but the left hand picks</text><text x="663.5" y="497.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">it out by touch</text><rect x="30" y="544" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="576" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRENGTH</text><text x="50" y="602.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Highly controlled</text><text x="50" y="630.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Brief flashes to one visual field.</text><rect x="457" y="544" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="576" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="477" y="602.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Small, unusual samples</text><text x="477" y="630.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Epilepsy history; eye movements hide effects in</text><text x="477" y="651.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">everyday life.</text>
</svg>