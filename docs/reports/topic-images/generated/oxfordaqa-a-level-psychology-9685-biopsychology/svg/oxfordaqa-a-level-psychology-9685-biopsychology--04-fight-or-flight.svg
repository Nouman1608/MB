<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="700" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The fight or flight response</text>

<rect x="30" y="100" width="380" height="47" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="220" y="128.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Amygdala detects a threat</text><line x1="220" y1="152" x2="220" y2="176" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="181" width="380" height="47" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="220" y="209.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Hypothalamus</text><line x1="220" y1="233" x2="220" y2="257" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="262" width="380" height="47" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="220" y="290.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Sympathetic branch activated</text><line x1="220" y1="314" x2="220" y2="338" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="343" width="380" height="47" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="220" y="371.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Adrenal medulla releases adrenaline</text><rect x="470" y="100" width="400" height="290" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="490" y="155" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ADRENALINE PREPARES THE BODY</text><text x="490" y="187.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="506.15" y="187.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Heart rate and blood pressure up</text><text x="490" y="218.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="506.15" y="218.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Faster breathing, dilated airways</text><text x="490" y="249.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="506.15" y="249.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Dilated pupils</text><text x="490" y="280.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="506.15" y="280.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Glucose released for energy</text><text x="490" y="311.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="506.15" y="311.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Blood diverted to muscles</text><text x="490" y="342.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="506.15" y="342.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Digestion and salivation inhibited</text><line x1="414" y1="360" x2="464" y2="360" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="412" width="840" height="58" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="445.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">When the threat passes, the <tspan font-weight="700" fill="#1e2a44">parasympathetic</tspan> branch restores the resting state.</text><rect x="30" y="492" width="270.6666666666667" height="176" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="524" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="50" y="550.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Mismatch with modern</text><text x="50" y="573.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">stressors</text><text x="50" y="601.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Exams rarely need physical</text><text x="50" y="622.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">action; repeated activation</text><text x="50" y="643.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">may damage health.</text><rect x="314.6666666666667" y="492" width="270.6666666666667" height="176" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334.6666666666667" y="524" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">GRAY (1988)</text><text x="334.6666666666667" y="550.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Freeze first</text><text x="334.6666666666667" y="578.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Staying still and alert before</text><text x="334.6666666666667" y="599.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">fighting or fleeing.</text><rect x="599.3333333333334" y="492" width="270.6666666666667" height="176" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="619.3333333333334" y="524" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">TAYLOR ET AL. (2000)</text><text x="619.3333333333334" y="550.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Tend and befriend</text><text x="619.3333333333334" y="578.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Females more often protect</text><text x="619.3333333333334" y="599.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">offspring and seek support;</text><text x="619.3333333333334" y="620.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">early research used mainly</text><text x="619.3333333333334" y="641.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">males.</text>
</svg>