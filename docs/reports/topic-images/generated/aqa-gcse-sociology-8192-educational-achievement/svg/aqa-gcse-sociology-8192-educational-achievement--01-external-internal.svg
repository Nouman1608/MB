<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 659" width="900" height="659" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="659" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two kinds of explanation</text>

<rect x="470" y="200" width="400" height="300" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M455,200 L670,120 L885,200 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><text x="670" y="182" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">INSIDE SCHOOL</text><text x="670" y="236" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Internal factors</text><circle cx="505" cy="274.06" r="4.5" fill="#2e6b62"/><text x="518" y="280" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Setting</text><circle cx="505" cy="310.06" r="4.5" fill="#2e6b62"/><text x="518" y="316" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Labelling</text><circle cx="505" cy="346.06" r="4.5" fill="#2e6b62"/><text x="518" y="352" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Pupil subcultures</text><rect x="490" y="400" width="360" height="82" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="506" y="430" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Mainly 3.4.4: use briefly in a 3.4.3</text><text x="506" y="451" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">answer</text><rect x="30" y="200" width="400" height="300" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="230" y="182" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">OUTSIDE SCHOOL</text><text x="230" y="236" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">External factors</text><circle cx="65" cy="274.06" r="4.5" fill="#2e6b62"/><text x="78" y="280" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Family income</text><circle cx="65" cy="310.06" r="4.5" fill="#2e6b62"/><text x="78" y="316" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Home resources</text><circle cx="65" cy="346.06" r="4.5" fill="#2e6b62"/><text x="78" y="352" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Parents’ attitudes</text><circle cx="65" cy="382.06" r="4.5" fill="#2e6b62"/><text x="78" y="388" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Culture</text><rect x="48" y="432" width="364" height="50" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="230" y="464" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Focus of 3.4.3</text><line x1="30" y1="500" x2="870" y2="500" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="524" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="560" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Look for patterns between groups</text><text x="56" y="589" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">One bright working-class pupil does not disprove a class pattern; one struggling middle-class</text><text x="56" y="611" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">pupil does not prove one.</text>
</svg>