<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 576" width="900" height="576" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="576" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Gewirtz, Ball and Bowe: three kinds of chooser</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Markets, Choice and Equity in Education (1995)</text>
<rect x="30" y="120" width="840" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><rect x="31.25" y="121.25" width="250" height="101.5" rx="12" fill="#b5d3cf"/><text x="46" y="160" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Privileged or skilled</text><text x="46" y="185" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">choosers</text><text x="46" y="208" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start" font-style="italic">Mostly middle class</text><text x="300" y="165.1" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Money, time and knowledge to research schools, visit, appeal</text><text x="300" y="189.1" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">and travel</text><rect x="30" y="240" width="840" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><rect x="31.25" y="241.25" width="250" height="101.5" rx="12" fill="#dce9e7"/><text x="46" y="280" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Semi-skilled choosers</text><text x="300" y="297.1" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">The third group named in the study</text><rect x="30" y="360" width="840" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><rect x="31.25" y="361.25" width="250" height="101.5" rx="12" fill="#f2e7b8"/><text x="46" y="400" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Disconnected choosers</text><text x="46" y="448" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start" font-style="italic">Mostly working class</text><text x="300" y="417.1" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Tended to choose the nearest school</text><rect x="30" y="480" width="840" height="70" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="523" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Choice that looks equal on paper is unequal in practice</text>
</svg>