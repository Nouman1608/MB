<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Class, gender and ethnicity overlap</text>

<circle cx="350" cy="300" r="165" fill="#b5d3cf" fill-opacity="0.75" stroke="#1e2a44" stroke-width="3"/><circle cx="550" cy="300" r="165" fill="#f2e7b8" fill-opacity="0.75" stroke="#1e2a44" stroke-width="3"/><circle cx="450" cy="470" r="165" fill="#dce9e7" fill-opacity="0.75" stroke="#1e2a44" stroke-width="3"/><text x="290" y="250" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Class</text><text x="610" y="250" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Gender</text><text x="450" y="560" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Ethnicity</text><text x="290" y="280" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">free school meals</text><text x="610" y="280" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">boys</text><text x="450" y="590" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">white British</text><circle cx="450" cy="362" r="58" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="346" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">among the</text><text x="450" y="364" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">lowest-</text><text x="450" y="382" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">attaining</text><rect x="700" y="470" width="170" height="112" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="714" y="498" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">White British</text><text x="714" y="519" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">boys eligible</text><text x="714" y="540" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">for free school</text><text x="714" y="561" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">meals</text><line x1="700" y1="520" x2="510" y2="380" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="660" width="840" height="171" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="696" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Why a single-factor answer is weak</text><circle cx="61" cy="719.39" r="4.5" fill="#8a6d0d"/><text x="74" y="725" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Class, gender and ethnicity combine</text><circle cx="61" cy="749.39" r="4.5" fill="#8a6d0d"/><text x="74" y="755" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Part of an apparent “ethnic” gap may really be a class gap</text><circle cx="61" cy="779.39" r="4.5" fill="#8a6d0d"/><text x="74" y="785" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Ethnicity explanations: material factors, language, family attitudes (avoid stereotyping),</text><text x="74" y="807" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">ethnocentric curriculum, institutional racism</text>
