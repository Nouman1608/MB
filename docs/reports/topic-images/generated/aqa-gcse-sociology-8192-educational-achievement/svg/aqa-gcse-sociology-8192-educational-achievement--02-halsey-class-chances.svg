<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 658" width="900" height="658" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="658" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Halsey, Heath and Ridge: class and staying on</text>

<text x="450" y="92" font-size="19" font-weight="400" fill="#4a5568" text-anchor="middle">Chances of a service-class boy compared with a working-class boy</text><text x="234" y="156" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="end">At school at 16</text><rect x="250" y="130" width="200" height="40" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="462" y="159" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">4×</text><text x="234" y="222" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="end">At school at 17</text><rect x="250" y="196" width="400" height="40" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="662" y="225" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">8×</text><text x="234" y="288" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="end">At school at 18</text><rect x="250" y="262" width="500" height="40" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="762" y="291" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">10×</text><text x="234" y="354" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="end">Attending university</text><rect x="250" y="328" width="550" height="40" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="812" y="357" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">11×</text><line x1="300" y1="116" x2="300" y2="392" stroke="#b5602e" stroke-width="3" stroke-dasharray="8 6"/><text x="308" y="412" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">working-class boy = 1×</text><rect x="30" y="438" width="269.3333333333333" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,488 L31.25,452.25 Q31.25,439.25 44.25,439.25 L285.0833333333333,439.25 Q298.0833333333333,439.25 298.0833333333333,452.25 L298.0833333333333,488 Z" fill="#b5d3cf"/><line x1="31.25" y1="488" x2="298.0833333333333" y2="488" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="468.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">The gap widens</text><text x="44" y="519.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">From 4× to 11×: class matters</text><text x="44" y="540.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">more as education goes on and</text><text x="44" y="561.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">costs, such as years without a</text><text x="44" y="582.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">wage, build up</text><rect x="315.3333333333333" y="438" width="269.3333333333333" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,488 L316.5833333333333,452.25 Q316.5833333333333,439.25 329.5833333333333,439.25 L570.4166666666666,439.25 Q583.4166666666666,439.25 583.4166666666666,452.25 L583.4166666666666,488 Z" fill="#dce9e7"/><line x1="316.5833333333333" y1="488" x2="583.4166666666666" y2="488" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="468.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Challenges meritocracy</text><text x="329.3333333333333" y="519.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ability is unlikely to differ</text><text x="329.3333333333333" y="540.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">on this scale, so the gap</text><text x="329.3333333333333" y="561.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">points to inequality of</text><text x="329.3333333333333" y="582.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">opportunity</text><rect x="600.6666666666666" y="438" width="269.3333333333333" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,488 L601.9166666666666,452.25 Q601.9166666666666,439.25 614.9166666666666,439.25 L855.75,439.25 Q868.75,439.25 868.75,452.25 L868.75,488 Z" fill="#f2e7b8"/><line x1="601.9166666666666" y1="488" x2="868.75" y2="488" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="468.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Limits</text><text x="614.6666666666666" y="519.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Males only; born 1913–1952,</text><text x="614.6666666666666" y="540.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mostly educated before</text><text x="614.6666666666666" y="561.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">comprehensives spread</text><text x="450" y="636" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Origins and Destinations (1980): over 8,000 males, grouped by father’s occupation</text>
</svg>