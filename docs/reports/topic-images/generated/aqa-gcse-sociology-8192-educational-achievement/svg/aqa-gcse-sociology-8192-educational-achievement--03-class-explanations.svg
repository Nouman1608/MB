<rect width="900" height="675" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Explaining class differences</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Where does each explanation put the blame?</text>
<rect x="30" y="122" width="269.3333333333333" height="274" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,172 L31.25,136.25 Q31.25,123.25 44.25,123.25 L285.0833333333333,123.25 Q298.0833333333333,123.25 298.0833333333333,136.25 L298.0833333333333,172 Z" fill="#b5d3cf"/><line x1="31.25" y1="172" x2="298.0833333333333" y2="172" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="152.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Material deprivation</text><text x="44" y="203.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Lack of money limits</text><text x="44" y="224.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">learning</text><circle cx="49" cy="245.92" r="4.5" fill="#2e6b62"/><text x="62" y="251.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No laptop or quiet room for</text><text x="62" y="272.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">homework</text><circle cx="49" cy="295.92" r="4.5" fill="#2e6b62"/><text x="62" y="301.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Poor diet affecting</text><text x="62" y="322.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">concentration</text><circle cx="49" cy="345.92" r="4.5" fill="#2e6b62"/><text x="62" y="351.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Needing a part-time job at</text><text x="62" y="372.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">16</text><rect x="315.3333333333333" y="122" width="269.3333333333333" height="274" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,172 L316.5833333333333,136.25 Q316.5833333333333,123.25 329.5833333333333,123.25 L570.4166666666666,123.25 Q583.4166666666666,123.25 583.4166666666666,136.25 L583.4166666666666,172 Z" fill="#f2e7b8"/><line x1="316.5833333333333" y1="172" x2="583.4166666666666" y2="172" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="152.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Cultural deprivation</text><text x="329.3333333333333" y="203.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Home said to lack helpful</text><text x="329.3333333333333" y="224.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">values, attitudes and</text><text x="329.3333333333333" y="245.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">language</text><circle cx="334.3333333333333" cy="266.92" r="4.5" fill="#2e6b62"/><text x="347.3333333333333" y="272.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Less emphasis on staying on</text><text x="347.3333333333333" y="293.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">after 16</text><rect x="600.6666666666666" y="122" width="269.3333333333333" height="274" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,172 L601.9166666666666,136.25 Q601.9166666666666,123.25 614.9166666666666,123.25 L855.75,123.25 Q868.75,123.25 868.75,136.25 L868.75,172 Z" fill="#dce9e7"/><line x1="601.9166666666666" y1="172" x2="868.75" y2="172" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="152.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Cultural capital</text><text x="614.6666666666666" y="203.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Middle-class knowledge,</text><text x="614.6666666666666" y="224.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">tastes and confidence match</text><text x="614.6666666666666" y="245.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">what schools reward</text><circle cx="619.6666666666666" cy="266.92" r="4.5" fill="#2e6b62"/><text x="632.6666666666666" y="272.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Familiarity with museums,</text><text x="632.6666666666666" y="293.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">books and university life</text><rect x="40" y="410" width="250" height="44" rx="22" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="165" y="438" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Blames: lack of money</text><rect x="325" y="410" width="250" height="44" rx="22" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="450" y="438" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Blames: the family</text><rect x="610" y="410" width="250" height="44" rx="22" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="735" y="438" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Blames: the school</text><path d="M450,464 Q590,506 735,464" fill="none" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="592" y="522" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">critics: different, not deficient</text><rect x="30" y="540" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="576" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Free school meals</text><text x="56" y="605" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Eligibility depends on low family income. Pupils eligible for free school meals achieve lower</text><text x="56" y="627" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">results on average, consistent with material explanations.</text>
</svg>