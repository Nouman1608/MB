<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="610" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Girls now outperform boys at most levels</text>

<rect x="30" y="108" width="412" height="289" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,158 L31.25,122.25 Q31.25,109.25 44.25,109.25 L427.75,109.25 Q440.75,109.25 440.75,122.25 L440.75,158 Z" fill="#b5d3cf"/><line x1="31.25" y1="158" x2="440.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="139" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Why girls’ achievement rose</text><circle cx="49" cy="183.92" r="4.5" fill="#2e6b62"/><text x="62" y="189.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Feminism:</tspan> Sharpe found girls’ priorities</text><text x="62" y="210.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">shifted from love and marriage to jobs and</text><text x="62" y="231.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">careers (1970s to 1990s)</text><circle cx="49" cy="254.92" r="4.5" fill="#2e6b62"/><text x="62" y="260.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Equal opportunities:</tspan> Sex Discrimination Act</text><text x="62" y="281.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1975; national curriculum (1988) made science</text><text x="62" y="302.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">compulsory for all</text><circle cx="49" cy="325.92" r="4.5" fill="#2e6b62"/><text x="62" y="331.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Job market and family:</tspan> more women in paid work</text><text x="62" y="352.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and more female-headed households give role</text><text x="62" y="373.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">models</text><rect x="458" y="108" width="412" height="289" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,158 L459.25,122.25 Q459.25,109.25 472.25,109.25 L855.75,109.25 Q868.75,109.25 868.75,122.25 L868.75,158 Z" fill="#f2e7b8"/><line x1="459.25" y1="158" x2="868.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="139" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Why some boys fall behind</text><circle cx="477" cy="183.92" r="4.5" fill="#2e6b62"/><text x="490" y="189.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Decline of traditional manual jobs may weaken</text><text x="490" y="210.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">motivation</text><circle cx="477" cy="233.92" r="4.5" fill="#2e6b62"/><text x="490" y="239.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Some masculine identities treat working hard</text><text x="490" y="260.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">at school as “uncool”</text><rect x="30" y="415" width="840" height="171" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="451" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Continuing inequality: subject choice</text><circle cx="61" cy="474.39" r="4.5" fill="#8a6d0d"/><text x="74" y="480" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Girls less likely to take physics and computing; boys less likely to take subjects linked</text><text x="74" y="502" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">to caring</text><circle cx="61" cy="526.39" r="4.5" fill="#8a6d0d"/><text x="74" y="532" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Feminists: this channels women into lower-paid work and helps explain the <tspan font-weight="700">glass ceiling</tspan></text><circle cx="61" cy="556.39" r="4.5" fill="#8a6d0d"/><text x="74" y="562" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Patterns are averages: not all girls do better than all boys</text>
</svg>