<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 651" width="900" height="651" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="651" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four types of delusion</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A delusion is a fixed, false belief held despite clear evidence against it</text>
<rect x="30" y="124" width="413" height="137" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="168" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">PERSECUTORY</text><text x="50" y="194.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Others intend harm</text><text x="50" y="224.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">“My</tspan> <tspan font-style="italic">neighbours</tspan> <tspan font-style="italic">are</tspan> <tspan font-style="italic">poisoning</tspan> <tspan font-style="italic">my</tspan> <tspan font-style="italic">water.”</tspan></text><rect x="457" y="124" width="413" height="137" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="477" y="156" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">REFERENCE</text><text x="477" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Neutral events have special personal</text><text x="477" y="206.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">meaning</text><text x="477" y="236.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">“The</tspan> <tspan font-style="italic">newsreader</tspan> <tspan font-style="italic">is</tspan> <tspan font-style="italic">sending</tspan> <tspan font-style="italic">me</tspan> <tspan font-style="italic">messages.”</tspan></text><rect x="30" y="275" width="413" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="318" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GRANDEUR</text><text x="50" y="344.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">An inflated sense of importance or</text><text x="50" y="368.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">powers</text><rect x="457" y="275" width="413" height="130" rx="14" fill="#e3eaf3" stroke="#2b5a9a" stroke-width="2.5"/><text x="477" y="318" font-size="15" font-weight="700" fill="#2b5a9a" text-anchor="start">CONTROL</text><text x="477" y="344.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Thoughts or actions controlled by an</text><text x="477" y="368.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">outside force</text><rect x="30" y="427" width="413" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="236.5" y="459" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">DELUSION</text><text x="236.5" y="485.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">A fixed, false belief</text><text x="236.5" y="514.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">held despite clear evidence</text><rect x="457" y="427" width="413" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="663.5" y="459" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">HALLUCINATION</text><text x="663.5" y="485.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Hearing or “seeing things”</text><text x="663.5" y="514.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">most often hearing voices</text><rect x="30" y="561" width="840" height="58" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="594.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">A delusion is <tspan font-weight="700" fill="#1e2a44">not</tspan> “seeing things”: that is a hallucination.</text>
</svg>