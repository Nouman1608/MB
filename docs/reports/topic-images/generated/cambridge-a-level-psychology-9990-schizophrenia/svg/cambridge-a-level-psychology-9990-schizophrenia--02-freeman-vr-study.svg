<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 921" width="900" height="921" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="921" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Key study: Freeman et al. (2003)</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Investigating persecutory ideation with virtual reality</text>
<rect x="30" y="124" width="400" height="150" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">THE PROBLEM IN REAL LIFE</text><text x="50" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Someone might really be hostile</text><text x="50" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">So we cannot tell whether a suspicious thought</text><text x="50" y="231.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">is unfounded.</text><rect x="470" y="124" width="400" height="155" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="490" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THE VR SOLUTION</text><text x="490" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Characters programmed to behave</text><text x="490" y="205.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">neutrally</text><text x="490" y="233.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Any persecutory interpretation must come from</text><text x="490" y="254.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the participant.</text><line x1="434" y1="199" x2="466" y2="199" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="301" width="840" height="70" rx="14" fill="#ffffff"/><path d="M44,301 H200 V371 H44 A14,14 0 0 1 30,357 V315 A14,14 0 0 1 44,301 Z" fill="#f2e7b8"/><rect x="30" y="301" width="840" height="70" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="339.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Aim</text><text x="216" y="329.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">To test whether VR can investigate persecutory ideation, and whether such</text><text x="216" y="350.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">thoughts link to other psychological characteristics</text><rect x="30" y="381" width="840" height="56" rx="14" fill="#ffffff"/><path d="M44,381 H200 V437 H44 A14,14 0 0 1 30,423 V395 A14,14 0 0 1 44,381 Z" fill="#b5d3cf"/><rect x="30" y="381" width="840" height="56" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="412.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Sample</text><text x="216" y="413.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Pilot study: <tspan font-weight="700" fill="#1e2a44">24</tspan> <tspan font-weight="700" fill="#1e2a44">non-clinical</tspan> <tspan font-weight="700" fill="#1e2a44">participants</tspan></text><rect x="30" y="447" width="840" height="99" rx="14" fill="#ffffff"/><path d="M44,447 H200 V546 H44 A14,14 0 0 1 30,532 V461 A14,14 0 0 1 44,447 Z" fill="#b5d3cf"/><rect x="30" y="447" width="840" height="99" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="499.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Procedure</text><text x="216" y="475.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="231.2" y="475.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Assessments of symptoms such as anxiety and interpersonal sensitivity</text><text x="216" y="500.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="231.2" y="500.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Short time in a VR library with neutral computer-generated people</text><text x="216" y="525.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="231.2" y="525.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Reported thoughts and feelings about the characters</text><rect x="30" y="556" width="840" height="99" rx="14" fill="#fbf7e6"/><path d="M44,556 H200 V655 H44 A14,14 0 0 1 30,641 V570 A14,14 0 0 1 44,556 Z" fill="#d4b02e"/><rect x="30" y="556" width="840" height="99" rx="14" fill="none" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="608.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Results</text><text x="216" y="584.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="231.2" y="584.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Many: positive or neutral thoughts</text><text x="216" y="609.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="231.2" y="609.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Some: ideas of reference and persecutory thoughts</text><text x="216" y="634.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="231.2" y="634.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Persecutory thoughts linked to <tspan font-weight="700" fill="#1e2a44">higher</tspan> <tspan font-weight="700" fill="#1e2a44">interpersonal</tspan> <tspan font-weight="700" fill="#1e2a44">sensitivity</tspan> <tspan font-weight="700" fill="#1e2a44">and</tspan> <tspan font-weight="700" fill="#1e2a44">anxiety</tspan></text><rect x="30" y="665" width="840" height="70" rx="14" fill="#ffffff"/><path d="M44,665 H200 V735 H44 A14,14 0 0 1 30,721 V679 A14,14 0 0 1 44,665 Z" fill="#2e6b62"/><rect x="30" y="665" width="840" height="70" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="703.44" font-size="17" font-weight="700" fill="#ffffff" text-anchor="start">Conclusion</text><text x="216" y="693.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">People attribute mental states to virtual characters; VR is a promising standardised</text><text x="216" y="714.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">method</text><rect x="30" y="757" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="789" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRENGTH</text><text x="50" y="815.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Validity</text><text x="50" y="843.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Neutral, identical setting: persecutory thoughts</text><text x="50" y="864.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">known to be unfounded.</text><rect x="457" y="757" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="789" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="477" y="815.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Generalisation</text><text x="477" y="843.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Small non-clinical sample; not diagnosed</text><text x="477" y="864.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">schizophrenia.</text>
</svg>