<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 741" width="900" height="741" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="741" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Treating schizophrenia</text>

<clipPath id="tc100"><rect x="30" y="100" width="840" height="383" rx="14"/></clipPath><g clip-path="url(#tc100)"><rect x="30" y="100" width="205.33333333333337" height="48" fill="#b5d3cf"/><text x="44" y="127.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Treatment</text><rect x="235.33333333333337" y="100" width="317.3333333333333" height="48" fill="#b5d3cf"/><text x="249.33333333333337" y="127.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">How it works</text><rect x="552.6666666666667" y="100" width="317.3333333333333" height="48" fill="#b5d3cf"/><text x="566.6666666666667" y="127.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Points to evaluate</text><rect x="30" y="148" width="205.33333333333337" height="89" fill="#dce9e7"/><text x="44" y="174.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Typical</text><text x="44" y="195.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">antipsychotics</text><text x="44" y="216.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">(chlorpromazine)</text><rect x="235.33333333333337" y="148" width="317.3333333333333" height="89" fill="#ffffff"/><text x="249.33333333333337" y="174.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Block D2 receptors</text><rect x="552.6666666666667" y="148" width="317.3333333333333" height="89" fill="#ffffff"/><text x="566.6666666666667" y="174.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Reduce positive symptoms;</text><text x="566.6666666666667" y="195.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">movement side effects, including</text><text x="566.6666666666667" y="216.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">tardive dyskinesia</text><line x1="30" y1="237" x2="870" y2="237" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="237" width="205.33333333333337" height="89" fill="#dce9e7"/><text x="44" y="263.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Atypical</text><text x="44" y="284.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">antipsychotics</text><text x="44" y="305.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">(clozapine)</text><rect x="235.33333333333337" y="237" width="317.3333333333333" height="89" fill="#f8faf9"/><text x="249.33333333333337" y="263.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Act on serotonin as well as dopamine</text><text x="249.33333333333337" y="284.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">receptors</text><rect x="552.6666666666667" y="237" width="317.3333333333333" height="89" fill="#f8faf9"/><text x="566.6666666666667" y="263.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lower risk of movement side effects;</text><text x="566.6666666666667" y="284.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">may help some negative symptoms;</text><text x="566.6666666666667" y="305.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">clozapine needs blood tests</text><line x1="30" y1="326" x2="870" y2="326" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="326" width="205.33333333333337" height="68" fill="#dce9e7"/><text x="44" y="352.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">ECT</text><rect x="235.33333333333337" y="326" width="317.3333333333333" height="68" fill="#ffffff"/><text x="249.33333333333337" y="352.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Brief seizure under anaesthetic and a</text><text x="249.33333333333337" y="373.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">muscle relaxant</text><rect x="552.6666666666667" y="326" width="317.3333333333333" height="68" fill="#ffffff"/><text x="566.6666666666667" y="352.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Reserved for when others fail or</text><text x="566.6666666666667" y="373.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">catatonia is present; memory loss</text><line x1="30" y1="394" x2="870" y2="394" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="394" width="205.33333333333337" height="89" fill="#dce9e7"/><text x="44" y="420.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">CBT</text><rect x="235.33333333333337" y="394" width="317.3333333333333" height="89" fill="#f8faf9"/><text x="249.33333333333337" y="420.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Examine evidence for delusions;</text><text x="249.33333333333337" y="441.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">alternative explanations for voices;</text><text x="249.33333333333337" y="462.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">coping strategies</text><rect x="552.6666666666667" y="394" width="317.3333333333333" height="89" fill="#f8faf9"/><text x="566.6666666666667" y="420.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Tailored to the person; lasting benefit</text><text x="566.6666666666667" y="441.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(Sensky et al.)</text></g><line x1="235.33333333333337" y1="100" x2="235.33333333333337" y2="483" stroke="#c9d6d4" stroke-width="1.5"/><line x1="552.6666666666667" y1="100" x2="552.6666666666667" y2="483" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="100" width="840" height="383" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="521" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">SENSKY ET AL. (2000): 90 PATIENTS WITH SYMPTOMS PERSISTING DESPITE MEDICATION</text><rect x="30" y="543" width="170" height="60" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="115" y="577.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">CBT</text><rect x="215" y="553" width="300" height="40" rx="20" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="365" y="579" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">treatment: both improved</text><line x1="520" y1="573" x2="580" y2="573" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="586" y="553" width="284" height="40" rx="20" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="728" y="579" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">still improving</text><rect x="30" y="619" width="170" height="60" rx="14" fill="#eef1f0" stroke="#c9d6d4" stroke-width="2.5"/><text x="115" y="653.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Befriending</text><rect x="215" y="629" width="300" height="40" rx="20" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="365" y="655" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">treatment: both improved</text><line x1="520" y1="649" x2="580" y2="649" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="586" y="629" width="284" height="40" rx="20" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="728" y="655" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">did not keep improving</text><text x="728" y="703" font-size="15" font-weight="600" fill="#4a5568" text-anchor="middle">nine-month follow-up</text>
</svg>