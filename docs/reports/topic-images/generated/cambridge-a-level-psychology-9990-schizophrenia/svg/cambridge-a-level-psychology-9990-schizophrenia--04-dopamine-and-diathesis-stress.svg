<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 764" width="900" height="764" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="764" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Bringing the explanations together</text>

<text x="450" y="116" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">REVISED DOPAMINE HYPOTHESIS</text><rect x="30" y="138" width="413" height="113" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="236.5" y="170" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">SUBCORTICAL PATHWAYS</text><text x="236.5" y="196.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Too much dopamine activity</text><text x="236.5" y="226.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">→ positive symptoms</text><rect x="457" y="138" width="413" height="113" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="663.5" y="170" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">PREFRONTAL CORTEX</text><text x="663.5" y="196.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Too little dopamine activity</text><text x="663.5" y="226.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">→ negative symptoms</text><text x="450" y="299" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">DIATHESIS-STRESS</text><rect x="30" y="321" width="360" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="210" y="353" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">NATURE</text><text x="210" y="379.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Inherited vulnerability</text><text x="210" y="408.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">many genes each add a small risk</text><rect x="510" y="321" width="360" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="690" y="353" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">NURTURE</text><text x="690" y="379.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Stressful experience</text><text x="690" y="408.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">acts as the trigger</text><text x="450" y="389" font-size="40" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><line x1="450" y1="439" x2="450" y2="473" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="250" y="479" width="400" height="61" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="514.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Schizophrenia may develop</text><rect x="30" y="562" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="595.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Fits the twin evidence: identical twins share all genes, yet concordance is only about 48%.</text><line x1="80" y1="682" x2="820" y2="682" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ah)"/><text x="80" y="658" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">More reductionist</text><text x="820" y="658" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end">More holistic</text><rect x="115.2" y="696" width="169.6" height="30" rx="15" fill="#f6e3d8" stroke="#b5602e" stroke-width="2"/><text x="200" y="716.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">genetic, dopamine</text><rect x="345.408" y="696" width="209.184" height="30" rx="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="450" y="716.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">cognitive (one process)</text><rect x="624.2" y="696" width="151.6" height="30" rx="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="700" y="716.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">diathesis-stress</text>
</svg>