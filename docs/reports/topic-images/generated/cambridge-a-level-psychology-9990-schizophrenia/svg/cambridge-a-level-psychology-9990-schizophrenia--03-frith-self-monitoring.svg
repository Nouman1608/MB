<rect width="900" height="441" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Frith: faulty self-monitoring</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The cognitive explanation</text>
<rect x="30" y="124" width="249.33333333333334" height="157" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="154.66666666666669" y="166.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">1</text><text x="154.66666666666669" y="193.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Inner speech or</text><text x="154.66666666666669" y="217.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">thought</text><text x="154.66666666666669" y="246.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">generated by the person</text><line x1="285.33333333333337" y1="202.5" x2="319.33333333333337" y2="202.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="124" width="249.33333333333334" height="157" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="450.00000000000006" y="168" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">2</text><text x="450.00000000000006" y="194.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Self-monitoring fails</text><text x="450.00000000000006" y="223.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">not recognised as their</text><text x="450.00000000000006" y="244.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">own</text><line x1="580.6666666666667" y1="202.5" x2="614.6666666666667" y2="202.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="124" width="249.33333333333334" height="157" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="745.3333333333334" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">3</text><text x="745.3333333333334" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Experienced as</text><text x="745.3333333333334" y="206.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">external</text><text x="745.3333333333334" y="235.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">voices, or thoughts</text><text x="745.3333333333334" y="256.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">inserted by others</text><rect x="30" y="303" width="413" height="106" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="346.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXPLAINS WELL</text><text x="50" y="372.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Hallucinations and delusions of control</text><rect x="457" y="303" width="413" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="335" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="477" y="361.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Describes a fault without explaining its</text><text x="477" y="384.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">cause</text>
</svg>