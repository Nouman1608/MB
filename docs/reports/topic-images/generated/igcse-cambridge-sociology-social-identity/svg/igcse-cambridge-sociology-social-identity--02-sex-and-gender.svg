<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 473" width="900" height="473" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="473" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Sex is biological; gender is learned</text>

<rect x="30" y="110" width="330" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="195" y="158.5" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">SEX</text><text x="195" y="187.1" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Biological</text><rect x="540" y="110" width="330" height="138" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="705" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">GENDER</text><text x="705" y="170" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Socially learned</text><text x="705" y="196" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">masculinity and</text><text x="705" y="222" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">femininity</text><line x1="368" y1="170" x2="532" y2="170" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><text x="450" y="154" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">socialisation</text><rect x="30" y="260" width="840" height="85" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="293" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">ANN OAKLEY (1972)</text><text x="450" y="319.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Families shape gender identity through manipulation and canalisation</text><rect x="30" y="363" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="396.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Gender identities differ between societies and are changing as women enter education and</text><text x="50" y="418.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">paid work, though expectations about domestic roles often change more slowly.</text>
</svg>