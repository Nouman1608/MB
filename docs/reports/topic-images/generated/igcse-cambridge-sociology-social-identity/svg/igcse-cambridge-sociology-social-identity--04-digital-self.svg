<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 678" width="900" height="678" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="678" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The digital self: positive and negative</text>

<line x1="215" y1="154" x2="685" y2="154" stroke="#1e2a44" stroke-width="7" stroke-linecap="round"/><path d="M450,154 L420,246 L480,246 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><circle cx="450" cy="154" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="215" y1="154" x2="160" y2="209" stroke="#1e2a44" stroke-width="2.5"/><line x1="215" y1="154" x2="270" y2="209" stroke="#1e2a44" stroke-width="2.5"/><path d="M140,209 L290,209 Q275,236 215,236 Q155,236 140,209 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><line x1="685" y1="154" x2="630" y2="209" stroke="#1e2a44" stroke-width="2.5"/><line x1="685" y1="154" x2="740" y2="209" stroke="#1e2a44" stroke-width="2.5"/><path d="M610,209 L760,209 Q745,236 685,236 Q625,236 610,209 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="215" y="258" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">POSITIVE</text><text x="685" y="258" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">NEGATIVE</text><rect x="30" y="282" width="405" height="215" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="318" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Positive impacts</text><text x="50" y="347.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="347.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Freedom to explore and express identity</text><text x="50" y="374.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="374.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Virtual communities worldwide</text><text x="50" y="401.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="401.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Ties with distant family, including</text><text x="66.15" y="423.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">migrants</text><text x="50" y="450.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="450.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Platforms for activism and minority</text><text x="66.15" y="472.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">voices</text><rect x="465" y="282" width="405" height="215" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="485" y="318" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Negative impacts</text><text x="485" y="347.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="347.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Pressure to look perfect; low</text><text x="501.15" y="369.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">self-esteem</text><text x="485" y="396.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="396.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Cyberbullying and harassment</text><text x="485" y="423.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="423.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">“Filter bubbles” reinforce narrow views</text><text x="485" y="450.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="450.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Privacy risks; permanent records</text><rect x="30" y="515" width="410" height="133" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="548" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DANAH BOYD (2014)</text><text x="50" y="574.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Extends social life</text><text x="50" y="602.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Teenagers use social media to extend their</text><text x="50" y="623.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">social lives, not replace them.</text><rect x="460" y="515" width="410" height="133" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="480" y="548" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">SHERRY TURKLE (2011)</text><text x="480" y="574.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Alone together</text><text x="480" y="602.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Constant connection may weaken face-to-face</text><text x="480" y="623.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">relationships.</text>
</svg>