<rect width="900" height="444" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How class identity is passed on</text>

<rect x="30" y="104" width="183" height="180" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="121.5" y="175" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">ECONOMIC POSITION</text><text x="121.5" y="199.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Occupation,</text><text x="121.5" y="221.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">income, wealth</text><line x1="219" y1="194" x2="243" y2="194" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="249" y="104" width="183" height="180" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="340.5" y="153" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">SHAPES</text><text x="340.5" y="177.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Accent, tastes,</text><text x="340.5" y="199.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">leisure,</text><text x="340.5" y="221.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">values,</text><text x="340.5" y="243.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">aspirations</text><line x1="438" y1="194" x2="462" y2="194" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="468" y="104" width="183" height="180" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="559.5" y="131" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">BOURDIEU</text><text x="559.5" y="155.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Cultural</text><text x="559.5" y="177.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">capital passed</text><text x="559.5" y="199.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">on in families</text><text x="559.5" y="226" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Knowledge, tastes</text><text x="559.5" y="246" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">and skills valued by</text><text x="559.5" y="266" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">dominant groups</text><line x1="657" y1="194" x2="681" y2="194" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="687" y="104" width="183" height="180" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="778.5" y="175" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">RESULT</text><text x="778.5" y="199.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Class is</text><text x="778.5" y="221.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">reproduced</text><rect x="30" y="302" width="410" height="112" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="335" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">SOME SOCIOLOGISTS</text><text x="50" y="361.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Class identity is weakening</text><text x="50" y="389.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">as traditional industries decline</text><rect x="460" y="302" width="410" height="112" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="480" y="335" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">OTHERS</text><text x="480" y="361.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Class still shapes life chances</text>
</svg>