<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 637" width="900" height="637" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="637" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three ways globalisation affects identity</text>

<rect x="200" y="110" width="500" height="112" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="146.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Globalisation</text><text x="450" y="176.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Growing interconnection through trade, travel,</text><text x="450" y="197.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">migration, media and technology</text><rect x="30" y="280" width="260" height="194" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="316" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Homogenisation</text><text x="50" y="344.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Global brands and media</text><text x="50" y="365.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">make young people share</text><text x="50" y="386.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">similar fashions, music</text><text x="50" y="407.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and values</text><text x="50" y="428.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(“Westernisation”).</text><rect x="320" y="280" width="260" height="194" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="340" y="316" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Hybrid identities</text><text x="340" y="344.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Combining cultures, e.g.</text><text x="340" y="365.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">children of migrants</text><text x="340" y="386.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">mixing the language, food</text><text x="340" y="407.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and music of two</text><text x="340" y="428.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">societies. Stuart Hall:</text><text x="340" y="449.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">diaspora identities.</text><rect x="610" y="280" width="260" height="194" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="630" y="316" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Cultural defence</text><text x="630" y="344.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">When a culture feels</text><text x="630" y="365.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">threatened, people</text><text x="630" y="386.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">strengthen traditional or</text><text x="630" y="407.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">religious identity.</text><line x1="350" y1="222" x2="170" y2="272" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="222" x2="450" y2="272" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="550" y1="222" x2="730" y2="272" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="494" width="840" height="113" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="527" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">EXAMPLE</text><text x="50" y="553.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">South Korean pop music and television</text><text x="50" y="582.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Global culture is not only Western: local cultures can become global.</text>
</svg>