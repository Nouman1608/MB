<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Age stages are socially constructed</text>

<text x="30" y="136" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Some societies</text><text x="30" y="158" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">early adult work and marriage</text><rect x="280" y="110" width="118" height="56" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="339" y="144" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Childhood</text><rect x="398" y="110" width="59" height="56" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="427.5" y="144" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Youth</text><rect x="457" y="110" width="295" height="56" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="604.5" y="144" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Adulthood</text><rect x="752" y="110" width="118" height="56" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="811" y="144" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Old age</text><text x="30" y="226" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Other societies</text><text x="30" y="248" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">long education</text><rect x="280" y="200" width="107.27272727272727" height="56" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="333.6363636363636" y="234" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Childhood</text><rect x="387.27272727272725" y="200" width="225.27272727272728" height="56" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="499.9090909090909" y="234" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Youth: into the twenties</text><rect x="612.5454545454545" y="200" width="150.1818181818182" height="56" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="687.6363636363636" y="234" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Adulthood</text><rect x="762.7272727272727" y="200" width="107.27272727272727" height="56" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="816.3636363636364" y="234" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Old age</text><text x="280" y="286" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">birth</text><text x="870" y="286" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">death</text><rect x="30" y="310" width="410" height="85" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="343" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">OLD AGE IN SOME CULTURES</text><text x="50" y="369.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Respected as wise elders</text><rect x="460" y="310" width="410" height="85" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="480" y="343" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">OLD AGE IN OTHERS</text><text x="480" y="369.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Stereotyped as dependent</text><rect x="30" y="413" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="446.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Jane Pilcher (1995): age is a source of both identity and inequality.</text>
</svg>