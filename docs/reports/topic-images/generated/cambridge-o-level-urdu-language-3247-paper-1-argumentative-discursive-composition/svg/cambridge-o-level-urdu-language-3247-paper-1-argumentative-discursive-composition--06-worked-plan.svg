<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 816" width="900" height="816" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="816" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: planning the argument</text>

<rect x="30" y="110" width="840" height="94" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="146" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">Title</text><text x="846" y="156" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;"شہروں میں ذاتی گاڑیوں کے بجائے پبلک ٹرانسپورٹ کو فروغ دینا چاہیے۔"&#x200F;</text><line x1="450" y1="206" x2="450" y2="238" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="250" y="242" width="400" height="82" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="278.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Thesis</text><text x="450" y="307.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">public transport must be the priority</text><path d="M450,326 L450,346 L164,346 L164,366" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><polygon points="157,362 164,376 171,362" fill="#1e2a44"/><rect x="30" y="378" width="268" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="164" y="414.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Reason 1</text><text x="164" y="443.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">less congestion and lost</text><text x="164" y="466.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">time</text><path d="M450,326 L450,346 L450,346 L450,366" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><polygon points="443,362 450,376 457,362" fill="#1e2a44"/><rect x="316" y="378" width="268" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="414.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Reason 2</text><text x="450" y="443.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">cleaner air</text><path d="M450,326 L450,346 L736,346 L736,366" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><polygon points="729,362 736,376 743,362" fill="#1e2a44"/><rect x="602" y="378" width="268" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="736" y="414.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Reason 3</text><text x="736" y="443.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">fairer for those who</text><text x="736" y="466.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">cannot afford a car</text><rect x="30" y="520" width="400" height="112" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="230" y="556.15" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">Objection</text><text x="230" y="585.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">buses are slow and unsafe</text><line x1="436" y1="576" x2="464" y2="576" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="470" y="520" width="400" height="112" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="670" y="556.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Reply</text><text x="670" y="585.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">a fault of the present system, not of</text><text x="670" y="608.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">the idea</text><rect x="30" y="656" width="840" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="694" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Model introduction</text><rect x="54" y="714" width="370" height="54" rx="10" fill="#dce9e7"/><text x="239" y="748" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">opening scene engages the reader</text><line x1="430" y1="741" x2="466" y2="741" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="472" y="714" width="374" height="54" rx="10" fill="#f2e7b8"/><text x="659" y="748" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">thesis stated plainly in the last sentence</text>
</svg>