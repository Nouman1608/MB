<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 732" width="900" height="732" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="732" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Same material, discursive title</text>

<rect x="30" y="110" width="840" height="120" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="150" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">Discursive title</text><text x="846" y="190" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کیا ذاتی گاڑیوں پر پابندیاں لگانا درست ہوگا؟ بحث کیجیے&#x200F;</text><rect x="30" y="246" width="360" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="280" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ARGUMENTATIVE</text><text x="50" y="309" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">In the argument</text><text x="50" y="338.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The objection is one paragraph,</text><text x="50" y="361.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">raised in order to answer it.</text><rect x="52" y="380" width="316" height="42" rx="8" fill="#fbf1ea"/><text x="210" y="407" font-size="17" font-weight="600" fill="#b5602e" text-anchor="middle">objection</text><line x1="210" y1="424" x2="210" y2="456" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="52" y="462" width="316" height="42" rx="8" fill="#dce9e7"/><text x="210" y="489" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle">answered</text><line x1="398" y1="396" x2="452" y2="396" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="460" y="246" width="410" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="280" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">DISCURSIVE</text><text x="480" y="309" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">In the discussion</text><text x="480" y="338.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The objection becomes a full side of the</text><text x="480" y="361.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">essay:</text><rect x="482" y="380" width="366" height="42" rx="8" fill="#f2e7b8"/><text x="500" y="407" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the needs of families</text><rect x="482" y="432" width="366" height="42" rx="8" fill="#f2e7b8"/><text x="500" y="459" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">people in areas with no bus route</text><rect x="482" y="484" width="366" height="42" rx="8" fill="#f2e7b8"/><text x="500" y="511" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">small traders who carry goods</text><rect x="30" y="572" width="840" height="132" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="610" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The conclusion weighs the sides: a judgement</text><text x="54" y="644" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Limits make sense in crowded city centres only once a reliable alternative exists.</text><text x="54" y="680" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">A discursive essay without a judgement reads as two lists.</text>
</svg>