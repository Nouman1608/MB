<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 744" width="900" height="744" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="744" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Connectives for reasoning</text>

<rect x="30" y="110" width="840" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,160 L31.25,124 Q31.25,111.25 44,111.25 L856,111.25 Q868.75,111.25 868.75,124 L868.75,160 Z" fill="#b5d3cf"/><text x="46" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Purpose</text><text x="854" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Urdu</text><line x1="280" y1="110" x2="280" y2="580" stroke="#c9d6d4" stroke-width="2"/><line x1="30" y1="160" x2="870" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="206.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">ordering points</text><text x="854" y="216.29999999999998" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;اوّل تو، دوسرے یہ کہ، آخر میں&#x200F;</text><line x1="30" y1="244" x2="870" y2="244" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="290.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">adding</text><text x="854" y="300.3" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;علاوہ ازیں، مزید برآں، اس کے ساتھ ساتھ&#x200F;</text><rect x="32" y="328" width="836" height="84" fill="#f2e7b8"/><line x1="30" y1="328" x2="870" y2="328" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="374.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">conceding</text><text x="854" y="384.3" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;یہ درست ہے کہ ... لیکن، اگرچہ ... پھر بھی، بلاشبہ&#x200F;</text><line x1="30" y1="412" x2="870" y2="412" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="458.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">contrasting</text><text x="854" y="468.3" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;اس کے برعکس، دوسری طرف، تاہم&#x200F;</text><line x1="30" y1="496" x2="870" y2="496" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="542.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">concluding</text><text x="854" y="552.3" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;لہٰذا، نتیجتاً، مختصر یہ کہ، ان تمام باتوں کے پیشِ نظر&#x200F;</text><rect x="30" y="604" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="644" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Show real relationships between ideas</text><text x="54" y="680" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The same connective at the start of every</text><text x="54" y="702" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">paragraph signals a list, not an argument.</text><text x="846" y="674" font-size="26" fill="#b5602e" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;علاوہ ازیں ... علاوہ ازیں ...&#x200F;</text><text x="560" y="666" font-size="26" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text>
</svg>