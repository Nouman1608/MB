<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What the three strands reward</text>

<rect x="30" y="110" width="330" height="70" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="195" y="140" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Content</text><text x="195" y="166" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">10 marks</text><rect x="366" y="110" width="162" height="70" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="447" y="140" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Structure</text><text x="447" y="166" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">5 marks</text><rect x="534" y="110" width="330" height="70" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="699" y="140" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Language</text><text x="699" y="166" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">10 marks</text><text x="450" y="210" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Part 2: 25 marks, best-fit levels</text><rect x="30" y="232" width="268" height="350" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="266" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">W1, W2, W3</text><text x="50" y="294.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Task achievement and</text><text x="50" y="319.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">content</text><text x="50" y="354" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"very detailed"</text><text x="50" y="383" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"wholly relevant to task"</text><text x="50" y="412" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"makes points thoughtfully"</text><text x="50" y="441" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"shows insight or</text><text x="50" y="462" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">engagement with the subject</text><text x="50" y="483" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">matter"</text><text x="50" y="522" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Specific reasons and</text><text x="50" y="543" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">examples, not general</text><text x="50" y="564" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">statements.</text><rect x="316" y="232" width="268" height="350" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="336" y="266" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">W4</text><text x="336" y="294.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Structure</text><text x="336" y="329" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"confidently argued and</text><text x="336" y="350" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">structured"</text><text x="336" y="379" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Level below: "some ability</text><text x="336" y="400" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to develop argument; clear</text><text x="336" y="421" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">structure"</text><text x="336" y="543" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Each paragraph moves the</text><text x="336" y="564" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">argument forward.</text><rect x="602" y="232" width="268" height="350" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="622" y="266" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">W5, W6</text><text x="622" y="294.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Language</text><text x="622" y="329" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"a range of complex</text><text x="622" y="350" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sentence structures"</text><text x="622" y="379" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"a wide range of</text><text x="622" y="400" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">appropriate vocabulary"</text><text x="622" y="429" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"generally accurate"</text><text x="622" y="564" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Range without strain.</text><rect x="30" y="604" width="840" height="196" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="642" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Sentence patterns that suit argument</text><rect x="54" y="664" width="250" height="112" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="179" y="722" font-size="28" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;اگر ... تو&#x200F;</text><text x="179" y="760" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">conditional</text><rect x="322" y="664" width="250" height="112" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="447" y="722" font-size="28" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;اگرچہ ... پھر بھی&#x200F;</text><text x="447" y="760" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">concessive</text><rect x="590" y="664" width="250" height="112" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="715" y="722" font-size="28" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;وہ لوگ جو ...&#x200F;</text><text x="715" y="760" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">relative clause</text>
</svg>