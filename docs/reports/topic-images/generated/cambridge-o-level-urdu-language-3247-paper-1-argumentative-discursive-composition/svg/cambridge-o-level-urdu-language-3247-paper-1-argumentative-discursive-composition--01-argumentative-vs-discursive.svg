<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 502" width="900" height="502" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="502" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Argumentative or discursive?</text>

<rect x="30" y="110" width="840" height="362" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,160 L31.25,124 Q31.25,111.25 44,111.25 L856,111.25 Q868.75,111.25 868.75,124 L868.75,160 Z" fill="#b5d3cf"/><text x="46" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start"></text><text x="236" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Argumentative</text><line x1="220" y1="110" x2="220" y2="472" stroke="#c9d6d4" stroke-width="2"/><text x="561" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Discursive</text><line x1="545" y1="110" x2="545" y2="472" stroke="#c9d6d4" stroke-width="2"/><line x1="30" y1="160" x2="870" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="204.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Aim</text><text x="236" y="192.1" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">persuade the reader that one</text><text x="236" y="216.1" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">view is right</text><text x="561" y="192.1" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">explore a question from more</text><text x="561" y="216.1" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">than one side</text><line x1="30" y1="238" x2="870" y2="238" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="282.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Your position</text><text x="236" y="270.1" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">stated at the start, held</text><text x="236" y="294.1" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">throughout</text><text x="561" y="270.1" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">weighed through the essay,</text><text x="561" y="294.1" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">settled at the end</text><line x1="30" y1="316" x2="870" y2="316" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="360.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Other side</text><text x="236" y="360.1" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">raised in order to answer it</text><text x="561" y="348.1" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">given fair space with its own</text><text x="561" y="372.1" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">evidence</text><line x1="30" y1="394" x2="870" y2="394" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="438.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ending</text><text x="236" y="426.1" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">restates and strengthens your</text><text x="236" y="450.1" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">case</text><text x="561" y="426.1" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">a balanced judgement drawn from</text><text x="561" y="450.1" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">what came before</text>
</svg>