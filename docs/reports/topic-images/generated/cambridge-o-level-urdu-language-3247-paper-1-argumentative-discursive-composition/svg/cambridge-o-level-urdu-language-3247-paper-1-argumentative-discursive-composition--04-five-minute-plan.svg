<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 819" width="900" height="819" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="819" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Planning in five minutes</text>

<rect x="30" y="110" width="840" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="165" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="173.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="122" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Decide your answer</text><text x="122" y="176" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Your thesis in one sentence. Discursive: note the two sides and a provisional</text><text x="122" y="199" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">judgement.</text><rect x="30" y="230" width="840" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="273.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="282.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="122" y="268" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Choose three main points</text><text x="122" y="296" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Argument: three reasons. Discussion: two and one, or two and two.</text><rect x="30" y="327" width="840" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="382" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="76" y="390.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="122" y="365" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Give each point evidence</text><text x="122" y="393" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">An example, a likely consequence, a comparison: this lifts content from Level 3 to</text><text x="122" y="416" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Level 5.</text><rect x="30" y="447" width="840" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="490.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="499.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="122" y="485" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Note one objection</text><text x="122" y="513" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">And how you will answer it, or how the two sides weigh against each other.</text><rect x="30" y="544" width="840" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="587.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="596.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="122" y="582" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Write the last sentence first</text><text x="122" y="610" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">So the essay has somewhere to arrive.</text><text x="846" y="152" font-size="26" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;دعویٰ&#x200F;</text><text x="846" y="182" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">thesis</text><text x="450" y="663" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">300-400 words: five paragraphs of 60 to 80 words each</text><rect x="30" y="683" width="160" height="78" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="110" y="717" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Introduction</text><text x="110" y="743" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">60-80 words</text><rect x="200" y="683" width="160" height="78" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="280" y="717" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Body 1</text><text x="280" y="743" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">60-80 words</text><rect x="370" y="683" width="160" height="78" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="717" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Body 2</text><text x="450" y="743" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">60-80 words</text><rect x="540" y="683" width="160" height="78" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="620" y="717" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Body 3</text><text x="620" y="743" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">60-80 words</text><rect x="710" y="683" width="160" height="78" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="790" y="717" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Conclusion</text><text x="790" y="743" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">60-80 words</text><text x="450" y="793" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Far beyond 400 usually means repetition; under 300 rarely allows a "very detailed response".</text>
</svg>