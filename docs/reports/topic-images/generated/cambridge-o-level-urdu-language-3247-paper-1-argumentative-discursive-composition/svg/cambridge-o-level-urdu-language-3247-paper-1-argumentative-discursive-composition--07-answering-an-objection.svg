<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 890" width="900" height="890" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="890" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Answering an objection in five moves</text>

<rect x="30" y="110" width="840" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="148" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="155.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="104" y="155" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">State the objection fairly</text><text x="846" y="216" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;یہ اعتراض کیا جاتا ہے کہ بسوں اور ویگنوں میں سفر وقت طلب اور تکلیف دہ ہے، ...&#x200F;</text><line x1="450" y1="245" x2="450" y2="263" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="264" width="840" height="134" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><circle cx="70" cy="302" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="309.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="104" y="309" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Concede in part</text><text x="846" y="370" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;یہ شکایت بے بنیاد نہیں&#x200F;</text><line x1="450" y1="399" x2="450" y2="417" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="418" width="840" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="456" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="463.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="104" y="463" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Turn it</text><text x="846" y="524" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;لیکن یہ موجودہ ناقص نظام کی خرابی ہے، پبلک ٹرانسپورٹ کے تصور کی نہیں۔&#x200F;</text><line x1="450" y1="553" x2="450" y2="571" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="572" width="840" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="610" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="617.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="104" y="617" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Conditional sentence</text><text x="846" y="678" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;جب بسیں مقررہ وقت پر چلیں ... تو یہی شہری خوشی سے اپنی گاڑی گھر چھوڑ آئیں گے۔&#x200F;</text><line x1="450" y1="707" x2="450" y2="725" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="726" width="840" height="134" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="70" cy="764" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="771.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="104" y="771" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Return to the thesis</text><text x="846" y="832" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;گویا حل نظام کو ترک کرنا نہیں، اسے بہتر بنانا ہے۔&#x200F;</text>
</svg>