<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 806" width="900" height="806" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="806" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The instruction decides the task</text>

<rect x="30" y="110" width="840" height="226" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="846" y="178" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;"شہروں میں ذاتی گاڑیوں کے بجائے پبلک ٹرانسپورٹ&#x200F;</text><text x="846" y="238" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کو فروغ دینا چاہیے۔" اس کے حق میں دلائل دیجیے&#x200F;</text><line x1="54" y1="270" x2="846" y2="270" stroke="#c9d6d4" stroke-width="2"/><rect x="55" y="282" width="170" height="38" rx="19" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="140" y="308" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Argumentative</text><text x="244" y="308" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The instruction asks for arguments in favour: one side.</text><rect x="30" y="350" width="840" height="166" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="846" y="418" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;آن لائن تعلیم کے فوائد اور نقصانات پر بحث کیجیے&#x200F;</text><line x1="54" y1="450" x2="846" y2="450" stroke="#c9d6d4" stroke-width="2"/><rect x="55" y="462" width="170" height="38" rx="19" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="140" y="488" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">Discursive</text><text x="244" y="488" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The instruction asks you to discuss benefits and drawbacks.</text><rect x="30" y="530" width="840" height="166" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="846" y="598" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کیا آپ اس بات سے متفق ہیں کہ ...؟&#x200F;</text><line x1="54" y1="630" x2="846" y2="630" stroke="#c9d6d4" stroke-width="2"/><rect x="55" y="642" width="170" height="38" rx="19" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="140" y="668" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Either</text><text x="244" y="668" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Either shape works, as long as your answer is clear by the end.</text><rect x="30" y="714" width="840" height="64" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="450" y="754" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Read the instruction rather than guessing from the topic.</text>
</svg>