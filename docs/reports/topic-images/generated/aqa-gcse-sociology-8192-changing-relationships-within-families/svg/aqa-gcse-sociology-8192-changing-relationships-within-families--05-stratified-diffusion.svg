<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 712" width="900" height="712" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="712" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The principle of stratified diffusion</text>

<rect x="60" y="120" width="520" height="84" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="320" y="156" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Top of the stratification system</text><text x="320" y="184" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Managers: Stage 4 managing director family found here</text><rect x="100" y="220" width="440" height="84" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="320" y="256" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Middle</text><text x="320" y="284" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">The pattern spreads down over time</text><rect x="140" y="320" width="360" height="84" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="320" y="356" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Bottom</text><text x="320" y="384" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">…and reaches other classes later</text><line x1="625" y1="140" x2="625" y2="400" stroke="#2e6b62" stroke-width="6" marker-end="url(#ahT)"/><text x="650" y="210" font-size="17" font-weight="400" fill="#2e6b62" text-anchor="start">“What happens at the top</text><text x="650" y="232" font-size="17" font-weight="400" fill="#2e6b62" text-anchor="start">today will diffuse</text><text x="650" y="254" font-size="17" font-weight="400" fill="#2e6b62" text-anchor="start"><tspan font-weight="700">downwards</tspan> tomorrow”</text><rect x="30" y="450" width="400" height="140" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="230" y="484" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Functionalist prediction</text><text x="230" y="516" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">The Stage 4 family will spread to other</text><text x="230" y="537" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">classes over time: change is gradual and</text><text x="230" y="558" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">generally for the better</text><rect x="470" y="450" width="400" height="140" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="670" y="484" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Feminist criticism</text><text x="670" y="516" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Little evidence of symmetry or of a move to</text><text x="670" y="537" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Stage 4 in working-class families (Oakley:</text><text x="670" y="558" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">few husbands did a large share of housework)</text><circle cx="450" cy="520" r="22" fill="#1e2a44"/><text x="450" y="527" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">vs</text><rect x="30" y="610" width="840" height="76" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="642" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">The contradiction: Stage 4 is less equal than Stage 3, so if stratified</text><text x="450" y="670" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">diffusion works, family life may become less symmetrical, not more</text>
</svg>