<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 584" width="900" height="584" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="584" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why the privatised nuclear family spread</text>

<rect x="30" y="108" width="440" height="78" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="50" y="140" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Rising living standards</text><text x="50" y="166" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and better housing made the home more comfortable</text><line x1="476" y1="147" x2="594" y2="263" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="200" width="440" height="78" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="50" y="232" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Geographical mobility</text><text x="50" y="258" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">families moved to new estates and towns for work</text><line x1="476" y1="239" x2="594" y2="297" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="292" width="440" height="78" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="50" y="324" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Smaller families</text><text x="50" y="350" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">more time and money for each child</text><line x1="476" y1="331" x2="594" y2="331" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="384" width="440" height="78" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="50" y="416" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">More married women</text><text x="50" y="442" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">in paid work</text><line x1="476" y1="423" x2="594" y2="365" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="476" width="440" height="78" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="50" y="508" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Home-based leisure</text><text x="50" y="534" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">such as television kept couples at home together</text><line x1="476" y1="515" x2="594" y2="399" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="600" y="211" width="270" height="240" rx="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="735" y="281" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">Privatised</text><text x="735" y="311" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">nuclear family</text><text x="735" y="353" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">home-centred</text><text x="735" y="376" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">smaller</text><text x="735" y="399" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">less dependent</text><text x="735" y="422" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">on wider kin</text>
</svg>