<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="600" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What “symmetry” means</text>

<path d="M395,430 L450,258 L505,430 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><rect x="130" y="242" width="640" height="16" rx="6" fill="#1e2a44"/><line x1="230" y1="250" x2="130" y2="310" stroke="#1e2a44" stroke-width="2.5"/><line x1="230" y1="250" x2="330" y2="310" stroke="#1e2a44" stroke-width="2.5"/><path d="M110,310 L350,310 Q340,365 230,367 Q120,365 110,310 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="230" y="344" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Partner A</text><line x1="670" y1="250" x2="570" y2="310" stroke="#1e2a44" stroke-width="2.5"/><line x1="670" y1="250" x2="770" y2="310" stroke="#1e2a44" stroke-width="2.5"/><path d="M550,310 L790,310 Q780,365 670,367 Q560,365 550,310 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="670" y="344" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Partner B</text><rect x="80" y="108" width="300" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><rect x="520" y="108" width="300" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="230" y="146" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Different tasks</text><text x="230" y="178" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">roles are <tspan font-weight="700">not interchangeable</tspan></text><text x="670" y="146" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">Equal weight</text><text x="670" y="178" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">roles are <tspan font-weight="700">of equal importance</tspan></text><text x="450" y="470" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Symmetry = similar contributions to running the household,</text><text x="450" y="498" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">e.g. shared chores and shared decisions</text><rect x="140" y="522" width="620" height="52" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="450" y="555" font-size="17" font-weight="600" fill="#b5602e" text-anchor="middle">Common mistake: “partners do exactly the same jobs”</text>
</svg>