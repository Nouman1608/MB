<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 997" width="900" height="997" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="997" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Willmott and Young: four stages of the family</text>

<rect x="30" y="590" width="205" height="150" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="64" cy="624" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="64" y="631.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="92" y="620" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Pre-industrial</text><text x="44" y="666" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The family works</text><text x="44" y="687" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">together as a unit of</text><text x="44" y="708" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">production</text><rect x="235" y="440" width="205" height="300" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><circle cx="269" cy="474" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="269" y="481.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="297" y="470" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Early</text><text x="297" y="494" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">industrial</text><text x="249" y="540" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Men work long hours</text><text x="249" y="561" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">outside the home;</text><text x="249" y="582" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">women rely on extended</text><text x="249" y="603" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">female kin</text><rect x="440" y="290" width="205" height="450" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="474" cy="324" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="474" y="331.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="502" y="320" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Symmetrical</text><text x="502" y="344" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">(home-centred)</text><text x="454" y="390" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A privatised nuclear</text><text x="454" y="411" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">family; partners make</text><text x="454" y="432" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">similar contributions</text><text x="454" y="453" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to running the home</text><rect x="645" y="140" width="205" height="600" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="679" cy="174" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="679" y="181.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="707" y="170" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Managing</text><text x="707" y="194" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">director</text><text x="659" y="240" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Work-centred: husband</text><text x="659" y="261" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">focused on his career,</text><text x="659" y="282" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">wife responsible for</text><text x="659" y="303" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">home and children</text><line x1="60" y1="200" x2="360" y2="200" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><text x="60" y="185" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">functionalist “march of progress”</text><rect x="470" y="754" width="390" height="36" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="665" y="779" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Stage 4 is LESS equal than Stage 3</text><rect x="30" y="810" width="840" height="163" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="846" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The Symmetrical Family (1973)</text><circle cx="61" cy="869.39" r="4.5" fill="#8a6d0d"/><text x="74" y="875" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Large-scale social survey: nearly 2,000 people interviewed in Greater London and</text><text x="74" y="897" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">surrounding areas</text><circle cx="61" cy="921.39" r="4.5" fill="#8a6d0d"/><text x="74" y="927" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Symmetry was found to be more common in working-class families: manual work was “often</text><text x="74" y="949" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">boring and uninvolving”, so manual workers focused on family life</text>
</svg>