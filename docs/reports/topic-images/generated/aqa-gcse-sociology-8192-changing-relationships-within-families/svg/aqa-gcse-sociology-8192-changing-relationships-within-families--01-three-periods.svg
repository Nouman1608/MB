<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 764" width="900" height="764" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="764" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How family relationships changed over time</text>

<rect x="30" y="150" width="264" height="461" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,206 L31.25,164.25 Q31.25,151.25 44.25,151.25 L279.75,151.25 Q292.75,151.25 292.75,164.25 L292.75,206 Z" fill="#f2e7b8"/><line x1="31.25" y1="206" x2="292.75" y2="206" stroke="#c9d6d4" stroke-width="2"/><text x="162" y="183.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Pre-industrial</text><text x="162" y="234" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Before industrialisation</text><circle cx="51" cy="266.72" r="4.5" fill="#2e6b62"/><text x="64" y="272" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Most people lived and</text><text x="64" y="293" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">worked on the land</text><circle cx="51" cy="316.72" r="4.5" fill="#2e6b62"/><text x="64" y="322" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Family = <tspan font-weight="700">unit of</tspan></text><text x="64" y="343" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">production</tspan>: husband, wife</text><text x="64" y="364" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and children worked</text><text x="64" y="385" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">together</text><circle cx="51" cy="408.72" r="4.5" fill="#2e6b62"/><text x="64" y="414" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Children worked from a</text><text x="64" y="435" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">young age</text><rect x="42" y="472" width="240" height="127" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="52" y="499.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Laslett</tspan> (parish records):</text><text x="52" y="520.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">most households were</text><text x="52" y="541.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">nuclear</tspan>, partly because</text><text x="52" y="562.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">people married late and</text><text x="52" y="583.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">died young</text><line x1="297" y1="178" x2="315" y2="178" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="318" y="150" width="264" height="461" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M319.25,206 L319.25,164.25 Q319.25,151.25 332.25,151.25 L567.75,151.25 Q580.75,151.25 580.75,164.25 L580.75,206 Z" fill="#dce9e7"/><line x1="319.25" y1="206" x2="580.75" y2="206" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="183.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Industrial</text><text x="450" y="234" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Nineteenth century</text><circle cx="339" cy="266.72" r="4.5" fill="#2e6b62"/><text x="352" y="272" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Work moved into factories</text><circle cx="339" cy="295.72" r="4.5" fill="#2e6b62"/><text x="352" y="301" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Family stopped being the</text><text x="352" y="322" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">main unit of production</text><circle cx="339" cy="345.72" r="4.5" fill="#2e6b62"/><text x="352" y="351" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Women relied on mothers and</text><text x="352" y="372" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">female kin</text><rect x="330" y="472" width="240" height="127" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="340" y="499.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Anderson</tspan> (1851 census,</text><text x="340" y="520.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Preston): more households</text><text x="340" y="541.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">included <tspan font-weight="700">extended kin</tspan>,</text><text x="340" y="562.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">helping with housing, jobs</text><text x="340" y="583.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and childcare</text><line x1="585" y1="178" x2="603" y2="178" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="606" y="150" width="264" height="461" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M607.25,206 L607.25,164.25 Q607.25,151.25 620.25,151.25 L855.75,151.25 Q868.75,151.25 868.75,164.25 L868.75,206 Z" fill="#b5d3cf"/><line x1="607.25" y1="206" x2="868.75" y2="206" stroke="#c9d6d4" stroke-width="2"/><text x="738" y="183.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Contemporary</text><text x="738" y="234" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Twentieth century onwards</text><circle cx="627" cy="266.72" r="4.5" fill="#2e6b62"/><text x="640" y="272" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Privatised nuclear family</tspan></text><text x="640" y="293" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">more common</text><circle cx="627" cy="316.72" r="4.5" fill="#2e6b62"/><text x="640" y="322" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Home-centred and smaller</text><circle cx="627" cy="345.72" r="4.5" fill="#2e6b62"/><text x="640" y="351" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Less dependent on wider kin</text><rect x="618" y="472" width="240" height="127" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="628" y="499.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Willmott and Young: the</text><text x="628" y="520.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">symmetrical</tspan>, home-centred</text><text x="628" y="541.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">family (Stage 3)</text><line x1="60" y1="118" x2="840" y2="118" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="450" y="108" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">time</text><rect x="30" y="629" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="665" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Myth to avoid</text><text x="56" y="694" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Pre-industrial families were not mainly extended: Laslett found most were nuclear, so the</text><text x="56" y="716" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">shift to the nuclear family did not simply begin with industry.</text>
</svg>