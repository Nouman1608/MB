<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 679" width="900" height="679" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="679" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four contemporary family issues</text>

<rect x="30" y="108" width="412" height="276" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,158 L31.25,122.25 Q31.25,109.25 44.25,109.25 L427.75,109.25 Q440.75,109.25 440.75,122.25 L440.75,158 Z" fill="#b5d3cf"/><line x1="31.25" y1="158" x2="440.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="139" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Quality of parenting</text><circle cx="49" cy="183.92" r="4.5" fill="#2e6b62"/><text x="62" y="189.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">More <tspan font-weight="700">child-centred</tspan>: more time, money and</text><text x="62" y="210.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">attention on fewer children</text><circle cx="49" cy="233.92" r="4.5" fill="#2e6b62"/><text x="62" y="239.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Higher expectations: is parenting “good</text><text x="62" y="260.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">enough”?</text><circle cx="49" cy="283.92" r="4.5" fill="#2e6b62"/><text x="62" y="289.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">State sets standards: smacking no longer</text><text x="62" y="310.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">lawful in Scotland and Wales</text><circle cx="49" cy="333.92" r="4.5" fill="#2e6b62"/><text x="62" y="339.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Feminists: criticism usually focuses on</text><text x="62" y="360.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mothers</text><rect x="458" y="108" width="412" height="276" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,158 L459.25,122.25 Q459.25,109.25 472.25,109.25 L855.75,109.25 Q868.75,109.25 868.75,122.25 L868.75,158 Z" fill="#dce9e7"/><line x1="459.25" y1="158" x2="868.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="139" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Teenagers and adults</text><circle cx="477" cy="183.92" r="4.5" fill="#2e6b62"/><text x="490" y="189.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">More <tspan font-weight="700">democratic</tspan>: rules on curfews, money and</text><text x="490" y="210.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">technology negotiated</text><circle cx="477" cy="233.92" r="4.5" fill="#2e6b62"/><text x="490" y="239.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">But dependence lasts longer: education or</text><text x="490" y="260.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">training to 18, costly housing</text><circle cx="477" cy="283.92" r="4.5" fill="#2e6b62"/><text x="490" y="289.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Conflict over independence; a <tspan font-weight="700">youth culture</tspan></text><text x="490" y="310.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">parents may not share</text><rect x="30" y="400" width="412" height="255" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,450 L31.25,414.25 Q31.25,401.25 44.25,401.25 L427.75,401.25 Q440.75,401.25 440.75,414.25 L440.75,450 Z" fill="#f2e7b8"/><line x1="31.25" y1="450" x2="440.75" y2="450" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="431" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Care of the disabled and elderly</text><circle cx="49" cy="475.92" r="4.5" fill="#2e6b62"/><text x="62" y="481.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ageing population: more families care for</text><text x="62" y="502.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">older relatives, some while raising children</text><circle cx="49" cy="525.9200000000001" r="4.5" fill="#2e6b62"/><text x="62" y="531.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Beanpole family</tspan> makes this more common</text><circle cx="49" cy="554.9200000000001" r="4.5" fill="#2e6b62"/><text x="62" y="560.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Feminists: unpaid care falls mainly on women,</text><text x="62" y="581.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">adding to the dual burden</text><circle cx="49" cy="604.9200000000001" r="4.5" fill="#2e6b62"/><text x="62" y="610.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Functionalists: a caring function; Marxists:</text><text x="62" y="631.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">saves the state and employers money</text><rect x="458" y="400" width="412" height="255" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,450 L459.25,414.25 Q459.25,401.25 472.25,401.25 L855.75,401.25 Q868.75,401.25 868.75,414.25 L868.75,450 Z" fill="#dce9e7"/><line x1="459.25" y1="450" x2="868.75" y2="450" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="431" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Arranged marriage</text><circle cx="477" cy="475.92" r="4.5" fill="#2e6b62"/><text x="490" y="481.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Families choose or introduce partners, but</text><text x="490" y="502.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">both partners consent</tspan></text><circle cx="477" cy="525.9200000000001" r="4.5" fill="#2e6b62"/><text x="490" y="531.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Can link families and keep cultural and</text><text x="490" y="552.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">religious traditions</text><circle cx="477" cy="575.9200000000001" r="4.5" fill="#2e6b62"/><text x="490" y="581.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Many younger people describe a more “assisted”</text><text x="490" y="602.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">process with a strong say</text>
</svg>