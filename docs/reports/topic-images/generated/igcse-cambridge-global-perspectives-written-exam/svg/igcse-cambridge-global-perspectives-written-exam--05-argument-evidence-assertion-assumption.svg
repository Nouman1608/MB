<rect x="30" y="116" width="840" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="154" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="start">Argument</text><text x="56" y="178" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a conclusion supported by reasons</text><rect x="560" y="206" width="280" height="70" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="700" y="249" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Conclusion</text><rect x="300" y="198" width="170" height="54" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="385" y="232" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Reason</text><line x1="470" y1="225" x2="554" y2="241" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="300" y="276" width="170" height="54" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="385" y="310" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Reason</text><line x1="470" y1="303" x2="554" y2="241" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="60" y="198" width="170" height="54" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="145" y="232" font-size="18" font-weight="600" fill="#2e6b62" text-anchor="middle">Evidence</text><line x1="230" y1="225" x2="294" y2="225" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="60" y="276" width="170" height="54" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="145" y="310" font-size="18" font-weight="600" fill="#2e6b62" text-anchor="middle">Evidence</text><line x1="230" y1="303" x2="294" y2="303" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><text x="145" y="352" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="middle">data, examples, testimony</text><rect x="30" y="386" width="410" height="210" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="424" font-size="22" font-weight="700" fill="#b5602e" text-anchor="start">Assertion</text><text x="56" y="448" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a claim with no support at all</text><rect x="150" y="482" width="170" height="60" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="235" y="519" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Claim</text><rect x="70" y="552" width="330" height="34" rx="6" fill="none" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="7 6"/><text x="235" y="575" font-size="15" font-weight="600" fill="#b5602e" text-anchor="middle">nothing underneath</text><rect x="460" y="386" width="410" height="210" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="486" y="424" font-size="22" font-weight="700" fill="#8a6d0d" text-anchor="start">Assumption</text><text x="486" y="448" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">taken for granted but unstated</text><rect x="480" y="486" width="120" height="54" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="540" y="519" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Reason</text><rect x="730" y="486" width="120" height="54" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="790" y="519" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Claim</text><line x1="600" y1="513" x2="722" y2="513" stroke="#8a6d0d" stroke-width="3.5" stroke-dasharray="8 6" marker-end="url(#ahO)"/><text x="665" y="571" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">hidden link</text>
