<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" width="900" height="740" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="740" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What makes a perspective</text>

<text x="140" y="122" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">The holder’s context</text><rect x="40" y="138" width="200" height="42" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="140" y="166" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">national</text><line x1="240" y1="159" x2="330" y2="259" stroke="#2e6b62" stroke-width="2.5"/><rect x="40" y="190" width="200" height="42" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="140" y="218" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">cultural</text><line x1="240" y1="211" x2="330" y2="259" stroke="#2e6b62" stroke-width="2.5"/><rect x="40" y="242" width="200" height="42" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="140" y="270" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">economic</text><line x1="240" y1="263" x2="330" y2="259" stroke="#2e6b62" stroke-width="2.5"/><rect x="40" y="294" width="200" height="42" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="140" y="322" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">generational</text><line x1="240" y1="315" x2="330" y2="259" stroke="#2e6b62" stroke-width="2.5"/><rect x="40" y="346" width="200" height="42" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="140" y="374" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">professional</text><line x1="240" y1="367" x2="330" y2="259" stroke="#2e6b62" stroke-width="2.5"/><line x1="330" y1="259" x2="368" y2="259" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="374" y="138" width="496" height="252" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="394" y="175.6" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">A perspective</text><rect x="400" y="196" width="444" height="44" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="622" y="225" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Point of view</text><rect x="400" y="252" width="444" height="44" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="622" y="281" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">+ reasoning</text><rect x="400" y="308" width="444" height="44" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="622" y="337" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">+ evidence</text><rect x="30" y="418" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="451.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">An opinion on its own is not a perspective: it needs reasoning and evidence behind it.</text><text x="450" y="516" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Consider every issue at three levels</text><rect x="30" y="540" width="249.33333333333334" height="88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="154.66666666666669" y="589" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Personal</text><line x1="285.33333333333337" y1="584" x2="319.33333333333337" y2="584" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="540" width="249.33333333333334" height="88" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="450.00000000000006" y="576" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Local and/or</text><text x="450.00000000000006" y="602" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">national</text><line x1="580.6666666666667" y1="584" x2="614.6666666666667" y2="584" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="540" width="249.33333333333334" height="88" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="745.3333333333334" y="589" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Global</text><path d="M210,650 Q450,696 690,650" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="450" y="706" font-size="17" font-weight="600" fill="#4a5568" text-anchor="middle">a strong answer moves between levels</text>
</svg>