<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 624" width="900" height="624" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="624" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Constructing an extended answer</text>

<line x1="62" y1="124" x2="62" y2="574" stroke="#c9d6d4" stroke-width="4"/><rect x="108" y="104" width="762" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="140" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">State a clear line of reasoning</text><text x="128" y="169.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Say where the answer is going.</text><circle cx="62" cy="149" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="157.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="108" y="204" width="762" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="240" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Use the sources as evidence</text><text x="128" y="269.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Make each source support a point, rather than summarising it.</text><circle cx="62" cy="249" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="257.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="108" y="304" width="762" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="340" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Consider at least one counter-argument</text><text x="128" y="369.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Treat it genuinely, not as a token gesture.</text><circle cx="62" cy="349" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="357.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="108" y="404" width="762" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="128" y="440" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Respond to the counter-argument</text><text x="128" y="469.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Presenting it and then ignoring it is a common mistake.</text><circle cx="62" cy="449" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="457.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="108" y="504" width="762" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="540" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Reach a justified conclusion</text><text x="128" y="569.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">It must follow from what came before.</text><circle cx="62" cy="549" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="557.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text>
</svg>