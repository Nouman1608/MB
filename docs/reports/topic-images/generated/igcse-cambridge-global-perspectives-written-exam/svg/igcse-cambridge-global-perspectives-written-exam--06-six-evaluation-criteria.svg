<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 584" width="900" height="584" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="584" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Six criteria for evaluating a source</text>

<rect x="30" y="104" width="250" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Criterion</text><rect x="280" y="104" width="590" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="292" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Question to ask</text><rect x="30" y="150" width="250" height="46" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="177.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Credibility</text><rect x="280" y="150" width="590" height="46" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="292" y="177.3" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">Who wrote it, and what expertise do they have?</text><rect x="30" y="196" width="250" height="46" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="223.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Bias</text><rect x="280" y="196" width="590" height="46" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="292" y="223.3" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">Do they gain from this view? Is the language loaded?</text><rect x="30" y="242" width="250" height="46" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="269.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Currency</text><rect x="280" y="242" width="590" height="46" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="292" y="269.3" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">Is it recent enough for the claim?</text><rect x="30" y="288" width="250" height="46" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="315.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Relevance</text><rect x="280" y="288" width="590" height="46" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="292" y="315.3" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">Does it actually address the question?</text><rect x="30" y="334" width="250" height="46" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="361.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Corroboration</text><rect x="280" y="334" width="590" height="46" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="292" y="361.3" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">Do independent sources agree?</text><rect x="30" y="380" width="250" height="46" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="407.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sample and method</text><rect x="280" y="380" width="590" height="46" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="292" y="407.3" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">Where data is used, how was it gathered?</text><rect x="30" y="444" width="408" height="110" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="477" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">WEAKER: ASSERTS BIAS</text><text x="50" y="507.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“This source is biased because it is from</text><text x="50" y="529.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">an oil company.”</text><rect x="462" y="444" width="408" height="110" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="482" y="477" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRONGER: DEMONSTRATES IT</text><text x="482" y="507.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Quotes the loaded phrasing and explains</text><text x="482" y="529.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">whose interest it serves.</text>
</svg>