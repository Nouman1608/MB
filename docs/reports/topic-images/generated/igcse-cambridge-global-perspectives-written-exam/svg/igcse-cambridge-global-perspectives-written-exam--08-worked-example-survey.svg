<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 682" width="900" height="682" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="682" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Taking apart a survey claim</text>

<rect x="30" y="104" width="840" height="112" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SOURCE</text><text x="50" y="164" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">“A survey of 200 people in one city found 78% support the new</text><text x="50" y="190" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">transport policy, so the country clearly backs it.”</text><rect x="30" y="234" width="268" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="267" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">CLAIM</text><text x="50" y="292.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The country supports</text><text x="50" y="316.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">the policy</text><rect x="316" y="234" width="268" height="108" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="336" y="267" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EVIDENCE</text><text x="336" y="292.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A survey: 78% of 200</text><text x="336" y="316.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">people</text><rect x="602" y="234" width="268" height="108" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="622" y="267" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">ASSUMPTION</text><text x="622" y="292.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">One city represents</text><text x="622" y="316.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">the whole country</text><rect x="40" y="364" width="40" height="40" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M51,375 l18,18 m0,-18 l-18,18" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="94" y="360" width="776" height="48" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="108" y="388.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sample size: 200 is small for a national claim</text><rect x="40" y="420" width="40" height="40" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M51,431 l18,18 m0,-18 l-18,18" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="94" y="416" width="776" height="48" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="108" y="444.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sample is narrow: one city, urban only</text><rect x="40" y="476" width="40" height="40" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M51,487 l18,18 m0,-18 l-18,18" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="94" y="472" width="776" height="48" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="108" y="500.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">“Clearly” overstates what the data can support</text><rect x="40" y="532" width="40" height="40" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M51,543 l18,18 m0,-18 l-18,18" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="94" y="528" width="776" height="48" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="108" y="556.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">No information on who ran it or how people were chosen</text><rect x="30" y="594" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="627.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Naming the specific weakness beats a general comment about reliability.</text>
</svg>