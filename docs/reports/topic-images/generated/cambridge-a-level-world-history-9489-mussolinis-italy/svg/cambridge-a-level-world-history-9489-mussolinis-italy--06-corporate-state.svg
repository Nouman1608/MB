<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 738" width="900" height="738" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="738" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Corporate State, step by step</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Sold as a "Third Way"; in practice it controlled workers</text>
<line x1="60" y1="144" x2="60" y2="555" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="99" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1925</text><text x="118" y="176.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Palazzo Vidoni Pact</text><text x="118" y="204.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Only fascist unions and the employers' Confindustria recognised</text><circle cx="60" cy="173.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="182.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="233" width="766" height="99" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="259" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1926</text><text x="118" y="285.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Rocco Law; Ministry of Corporations</text><text x="118" y="313.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Strikes and lockouts banned; labour courts</text><circle cx="60" cy="282.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="291.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="342" width="766" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="368" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1927</text><text x="118" y="394.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Charter of Labour</text><circle cx="60" cy="377.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="386.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="423" width="766" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="449" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1930</text><text x="118" y="475.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">National Council of Corporations</text><circle cx="60" cy="458.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="467.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="504" width="766" height="71" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="118" y="530" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1934</text><text x="118" y="556.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">22 corporations</text><circle cx="60" cy="539.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="548.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="30" y="597" width="411" height="109" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="631.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Employers shielded</text><text x="50" y="660.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Confindustria kept as the recognised employers'</text><text x="50" y="681.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">body</text><rect x="459" y="597" width="411" height="109" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="479" y="631.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Workers controlled</text><text x="479" y="660.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">No independent unions or strikes; real wages fell</text><text x="479" y="681.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">for many</text>
</svg>