<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 502" width="900" height="502" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="502" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A dictatorship by 1926?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Set the criterion: rule free of legal and political checks</text>
<rect x="30" y="124" width="410" height="213" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CHECKS REMOVED</text><text x="50" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">For</text><text x="50" y="212.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="212.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Acerbo Law; the 1924 election</text><text x="50" y="237.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="237.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Matteotti: the Aventine fails</text><text x="50" y="262.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="262.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">December 1925 law</text><text x="50" y="287.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="287.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Parties banned; Special Tribunal (1926)</text><text x="50" y="312.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="312.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Press controls</text><rect x="460" y="124" width="410" height="213" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="480" y="156" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">CHECKS REMAINING</text><text x="480" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Against</text><text x="480" y="212.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.2" y="212.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The king could still dismiss him (as in 1943)</text><text x="480" y="237.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.2" y="237.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Army, Church and industrialists autonomous</text><text x="480" y="262.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.2" y="262.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">PNF divided: ras against moderates</text><text x="480" y="287.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.2" y="287.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Mass consent not yet organised</text><rect x="30" y="359" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="393.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement</text><text x="50" y="423.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A personal dictatorship over parliament and parties by the end of 1926, but a <tspan font-weight="700" fill="#1e2a44">compromise</tspan> <tspan font-weight="700" fill="#1e2a44">with</tspan></text><text x="50" y="445.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">traditional</tspan> <tspan font-weight="700" fill="#1e2a44">elites</tspan> rather than total control.</text>
</svg>