<rect width="900" height="1014" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Building the dictatorship, 1922-26</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Drawn to scale: the Matteotti crisis is the turning point</text>
<line x1="96" y1="215.5" x2="870" y2="215.5" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="221.5" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1923</text><line x1="96" y1="405.5" x2="870" y2="405.5" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="411.5" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1924</text><line x1="96" y1="595.5" x2="870" y2="595.5" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="601.5" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1925</text><line x1="96" y1="785.5" x2="870" y2="785.5" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="791.5" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1926</text><line x1="96" y1="975.5" x2="870" y2="975.5" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="981.5" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">1927</text><line x1="96" y1="168" x2="870" y2="168" stroke="#c9d6d4" stroke-width="1.2"/><text x="30" y="174" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Oct 1922</text><line x1="470" y1="168" x2="470" y2="975.5" stroke="#1e2a44" stroke-width="4" stroke-linecap="round"/><text x="430" y="138" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">POWER AND LAW</text><text x="510" y="138" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CRISIS AND REPRESSION</text><path d="M470,182.01639344263003 L454,182.01639344263003 L436,182.01639344263" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="234.84" y="167.41639344263" width="200.16" height="46" fill="#f4f6f6"/><text x="430" y="186.21639344263002" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">October 1922</text><text x="430" y="207.21639344263002" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Appointed prime minister</text><path d="M470,199.66666666668107 L454,199.66666666668107 L436,234.01639344263" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="259.17600000000004" y="219.41639344263" width="175.82399999999998" height="46" fill="#f4f6f6"/><text x="430" y="238.21639344263002" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">December 1922</text><text x="430" y="259.21639344263" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Fascist Grand Council</text><path d="M470,272.49999999999136 L454,272.49999999999136 L436,286.01639344263003" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="217" y="271.41639344263" width="218" height="46" fill="#f4f6f6"/><text x="430" y="290.21639344263" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">1923</text><text x="430" y="311.21639344263" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Militia (MVSN); Acerbo Law</text><path d="M470,453 L486,453 L504,453" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="438.4" width="330.528" height="67" fill="#f4f6f6"/><text x="510" y="457.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">April 1924</text><text x="510" y="478.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fascist-led list wins about two-thirds amid</text><text x="510" y="499.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">violence</text><path d="M470,484.66666666668107 L486,484.66666666668107 L504,526" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="511.4" width="347.168" height="67" fill="#f4f6f6"/><text x="510" y="530.1999999999999" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">June 1924</text><text x="510" y="551.1999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Matteotti murdered; Aventine Secession; the</text><text x="510" y="572.1999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">king does nothing</text><path d="M470,596.5382513661079 L454,596.5382513661079 L436,596.5382513661079" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="185.33599999999998" y="581.9382513661079" width="249.66400000000002" height="67" fill="#f4f6f6"/><text x="430" y="600.7382513661079" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">3 January 1925</text><text x="430" y="621.7382513661079" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Mussolini takes responsibility in</text><text x="430" y="642.7382513661079" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">parliament</text><path d="M470,690.5 L486,690.5 L504,690.5" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="675.9" width="192.592" height="46" fill="#f4f6f6"/><text x="510" y="694.6999999999999" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">1925-26</text><text x="510" y="715.6999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Four attempts on his life</text><path d="M470,769.6666666666811 L454,769.6666666666811 L436,769.6666666666811" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="127.47999999999996" y="755.066666666681" width="307.52000000000004" height="67" fill="#f4f6f6"/><text x="430" y="773.866666666681" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">December 1925</text><text x="430" y="794.866666666681" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">Head of Government answerable to the</text><text x="430" y="815.866666666681" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">king alone</text><path d="M470,861.5000000000173 L486,861.5000000000173 L504,861.5000000000173" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="505" y="846.9000000000173" width="345.1039999999999" height="67" fill="#f4f6f6"/><text x="510" y="865.7000000000172" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">1926</text><text x="510" y="886.7000000000172" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Opposition parties banned; Special Tribunal;</text><text x="510" y="907.7000000000172" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">podestà replace mayors</text><circle cx="470" cy="182.01639344263003" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="199.66666666668107" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="272.49999999999136" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="453" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="484.66666666668107" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="596.5382513661079" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="690.5" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="769.6666666666811" r="7" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="470" cy="861.5000000000173" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/>
</svg>