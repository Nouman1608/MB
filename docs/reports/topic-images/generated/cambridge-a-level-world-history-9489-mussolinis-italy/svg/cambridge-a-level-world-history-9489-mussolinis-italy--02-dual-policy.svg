<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 715" width="900" height="715" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="715" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The dual policy and the March on Rome</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Threaten force, negotiate, and let the king decide</text>
<rect x="30" y="124" width="411" height="183" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TRACK 1: FORCE</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The squads</text><text x="50" y="211.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Ras such as Balbo attack socialist town halls,</text><text x="65.2" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">unions, co-operatives (1920-22)</text><text x="50" y="257.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="257.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Funded by landowners; tolerated by police</text><text x="50" y="282.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="282.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Break the August 1922 general strike</text><rect x="459" y="124" width="411" height="183" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="479" y="166.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TRACK 2: NEGOTIATION</text><text x="479" y="193.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Respectability</text><text x="479" y="222.3" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="494.2" y="222.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">35 deputies via Giolitti's National Blocs (1921)</text><text x="479" y="247.3" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="494.2" y="247.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">PNF founded (November 1921)</text><text x="479" y="272.3" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="494.2" y="272.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Talks with liberal politicians</text><line x1="235" y1="313" x2="400" y2="351" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="665" y1="313" x2="500" y2="351" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="180" y="373" width="540" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="405" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">LATE OCTOBER 1922</text><text x="450" y="431.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Squads converge on Rome</text><text x="450" y="460.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Facta's cabinet prepares martial law</text><line x1="450" y1="491" x2="450" y2="527" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="150" y="549" width="600" height="134" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="581" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">28 OCTOBER 1922</text><text x="450" y="608.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Victor Emmanuel III refuses to sign</text><text x="450" y="637.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Mussolini invited to form a government: appointed legally, at the head of</text><text x="450" y="658.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">a coalition with fascists in a minority</text>
</svg>