<rect width="900" height="471" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why liberal Italy was vulnerable</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Four pressures, 1915-22</text>
<rect x="30" y="124" width="198" height="160" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="172" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THE WAR</text><text x="46" y="197.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Heavy losses</text><text x="46" y="224" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Around 600,000 dead;</text><text x="46" y="244" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Caporetto (1917)</text><rect x="244" y="124" width="198" height="160" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="260" y="162" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THE PEACE</text><text x="260" y="187.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">"Mutilated victory"</text><text x="260" y="214" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">No Dalmatia or Fiume;</text><text x="260" y="234" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">d'Annunzio holds</text><text x="260" y="254" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Fiume, 1919-20</text><rect x="458" y="124" width="198" height="160" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THE ECONOMY</text><text x="474" y="177.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Biennio Rosso</text><text x="474" y="204" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Inflation,</text><text x="474" y="224" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">unemployment; strikes,</text><text x="474" y="244" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">land seizures, factory</text><text x="474" y="264" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">occupations (1920)</text><rect x="672" y="124" width="198" height="160" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="688" y="162" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PARLIAMENT</text><text x="688" y="187.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">No stable majority</text><text x="688" y="214" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Socialists 156, Popolari</text><text x="688" y="234" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">100; four prime</text><text x="688" y="254" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">ministers by 1922</text><rect x="150" y="348" width="600" height="91" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="384.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">A weak state facing left and right</text><text x="450" y="414.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Fear of revolution; nationalist anger at the peace</text><line x1="129" y1="290" x2="300" y2="342" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="343" y1="290" x2="400" y2="342" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="557" y1="290" x2="500" y2="342" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="771" y1="290" x2="600" y2="342" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/>
</svg>