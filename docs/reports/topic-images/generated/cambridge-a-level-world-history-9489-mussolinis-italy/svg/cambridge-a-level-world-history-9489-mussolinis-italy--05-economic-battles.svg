<rect width="900" height="610" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Mussolini's economic "battles"</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Propaganda success, economic cost</text>
<clipPath id="tc124"><rect x="30" y="124" width="840" height="321" rx="14"/></clipPath><g clip-path="url(#tc124)"><rect x="30" y="124" width="193.84615384615384" height="49" fill="#b5d3cf"/><text x="44" y="152.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Battle</text><rect x="223.84615384615384" y="124" width="323.0769230769231" height="49" fill="#dce9e7"/><text x="237.84615384615384" y="152.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Method</text><rect x="546.9230769230769" y="124" width="323.0769230769231" height="49" fill="#f2e7b8"/><text x="560.9230769230769" y="152.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Cost</text><rect x="30" y="173" width="193.84615384615384" height="68" fill="#dce9e7"/><text x="44" y="199.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Grain (1925)</text><rect x="223.84615384615384" y="173" width="323.0769230769231" height="68" fill="#ffffff"/><text x="237.84615384615384" y="199.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Tariffs, prizes, propaganda; wheat</text><text x="237.84615384615384" y="220.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">output rose</text><rect x="546.9230769230769" y="173" width="323.0769230769231" height="68" fill="#ffffff"/><text x="560.9230769230769" y="199.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Land shifted from olives and fruit;</text><text x="560.9230769230769" y="220.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">dearer bread</text><line x1="30" y1="241" x2="870" y2="241" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="241" width="193.84615384615384" height="68" fill="#dce9e7"/><text x="44" y="267.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Lira (1927)</text><rect x="223.84615384615384" y="241" width="323.0769230769231" height="68" fill="#f8faf9"/><text x="237.84615384615384" y="267.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"Quota 90" to the pound: a prestige</text><text x="237.84615384615384" y="288.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rate</text><rect x="546.9230769230769" y="241" width="323.0769230769231" height="68" fill="#f8faf9"/><text x="560.9230769230769" y="267.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Hurt exporters; deflation and wage</text><text x="560.9230769230769" y="288.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cuts</text><line x1="30" y1="309" x2="870" y2="309" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="309" width="193.84615384615384" height="68" fill="#dce9e7"/><text x="44" y="335.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Land</text><rect x="223.84615384615384" y="309" width="323.0769230769231" height="68" fill="#ffffff"/><text x="237.84615384615384" y="335.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Pontine Marshes drained; Littoria,</text><text x="237.84615384615384" y="356.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sabaudia</text><rect x="546.9230769230769" y="309" width="323.0769230769231" height="68" fill="#ffffff"/><text x="560.9230769230769" y="335.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Far less land reclaimed nationally than</text><text x="560.9230769230769" y="356.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">planned</text><line x1="30" y1="377" x2="870" y2="377" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="377" width="193.84615384615384" height="68" fill="#dce9e7"/><text x="44" y="403.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Births (from 1927)</text><rect x="223.84615384615384" y="377" width="323.0769230769231" height="68" fill="#f8faf9"/><text x="237.84615384615384" y="403.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Marriage loans, tax breaks, bachelor</text><text x="237.84615384615384" y="424.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">tax; target 60 million by 1950</text><rect x="546.9230769230769" y="377" width="323.0769230769231" height="68" fill="#f8faf9"/><text x="560.9230769230769" y="403.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The birth rate kept falling</text></g><line x1="223.84615384615384" y1="124" x2="223.84615384615384" y2="445" stroke="#c9d6d4" stroke-width="1.5"/><line x1="546.9230769230769" y1="124" x2="546.9230769230769" y2="445" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="124" width="840" height="321" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="467" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="501.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Judge by who gained and lost</text><text x="50" y="531.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Not by the propaganda aims: the battles made headlines while costing consumers, exporters and</text><text x="50" y="553.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">workers.</text>
</svg>