<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 502" width="900" height="502" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="502" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Internal and international migration</text>

<rect x="300" y="110" width="300" height="70" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="140" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Same push factors</text><text x="450" y="164" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">poverty, conflict</text><line x1="380" y1="184" x2="230" y2="238" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="520" y1="184" x2="670" y2="238" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="244" width="412" height="232" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,294 L31.25,258.25 Q31.25,245.25 44.25,245.25 L427.75,245.25 Q440.75,245.25 440.75,258.25 L440.75,294 Z" fill="#b5d3cf"/><line x1="31.25" y1="294" x2="440.75" y2="294" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="274.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Internal migration</text><text x="44" y="325.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">most people; usually larger in scale</text><circle cx="49" cy="346.92" r="4.5" fill="#2e6b62"/><text x="62" y="352.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">China’s hukou:</tspan> urban schooling and health</text><text x="62" y="373.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">care tied to registered home</text><circle cx="49" cy="396.92" r="4.5" fill="#2e6b62"/><text x="62" y="402.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rural migrants in cities treated almost</text><text x="62" y="423.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">like foreigners</text><circle cx="49" cy="446.92" r="4.5" fill="#2e6b62"/><text x="62" y="452.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Children often left with grandparents</text><rect x="458" y="244" width="412" height="232" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,294 L459.25,258.25 Q459.25,245.25 472.25,245.25 L855.75,245.25 Q868.75,245.25 868.75,258.25 L868.75,294 Z" fill="#dce9e7"/><line x1="459.25" y1="294" x2="868.75" y2="294" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="274.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">International migration</text><text x="472" y="325.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">a minority with money, contacts or</text><text x="472" y="346.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">documents</text><circle cx="477" cy="367.92" r="4.5" fill="#2e6b62"/><text x="490" y="373.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Crosses a border that a state controls</text><circle cx="477" cy="396.92" r="4.5" fill="#2e6b62"/><text x="490" y="402.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Shaped by passports and visas</text>
</svg>