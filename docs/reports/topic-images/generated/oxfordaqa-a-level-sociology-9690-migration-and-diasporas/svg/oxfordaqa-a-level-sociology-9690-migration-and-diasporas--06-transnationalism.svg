<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 742" width="900" height="742" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="742" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Diasporas as transnational networks</text>

<rect x="30" y="150" width="230" height="200" rx="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="145" y="240" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Country of</text><text x="145" y="266" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">origin</text><rect x="640" y="150" width="230" height="200" rx="16" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="755" y="240" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Country of</text><text x="755" y="266" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">settlement</text><line x1="268" y1="172" x2="632" y2="172" stroke="#2e6b62" stroke-width="3.5" marker-start="url(#ahT)" marker-end="url(#ahT)"/><rect x="390" y="156" width="120" height="30" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="450" y="177" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Family</text><line x1="268" y1="218" x2="632" y2="218" stroke="#2e6b62" stroke-width="3.5" marker-start="url(#ahT)" marker-end="url(#ahT)"/><rect x="390" y="202" width="120" height="30" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="450" y="223" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Business</text><line x1="268" y1="264" x2="632" y2="264" stroke="#2e6b62" stroke-width="3.5" marker-start="url(#ahT)" marker-end="url(#ahT)"/><rect x="390" y="248" width="120" height="30" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="450" y="269" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Religion</text><line x1="268" y1="310" x2="632" y2="310" stroke="#2e6b62" stroke-width="3.5" marker-start="url(#ahT)" marker-end="url(#ahT)"/><rect x="390" y="294" width="120" height="30" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="450" y="315" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Politics</text><text x="450" y="380" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">Transmigrants build social fields across borders rather than cutting ties (Glick Schiller,</text><text x="450" y="401" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">Basch and Szanton Blanc, 1992): remittances, home-town associations, video calls, homeland</text><text x="450" y="422" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">campaigns.</text><rect x="30" y="440" width="269.3333333333333" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,490 L31.25,454.25 Q31.25,441.25 44.25,441.25 L285.0833333333333,441.25 Q298.0833333333333,441.25 298.0833333333333,454.25 L298.0833333333333,490 Z" fill="#dce9e7"/><line x1="31.25" y1="490" x2="298.0833333333333" y2="490" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="470.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Hall (1990)</text><text x="44" y="521.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Diaspora identity is</text><text x="44" y="542.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"becoming" as well as</text><text x="44" y="563.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"being".</text><rect x="315.3333333333333" y="440" width="269.3333333333333" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,490 L316.5833333333333,454.25 Q316.5833333333333,441.25 329.5833333333333,441.25 L570.4166666666666,441.25 Q583.4166666666666,441.25 583.4166666666666,454.25 L583.4166666666666,490 Z" fill="#dce9e7"/><line x1="316.5833333333333" y1="490" x2="583.4166666666666" y2="490" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="470.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Gilroy (1993)</text><text x="329.3333333333333" y="521.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The Black Atlantic: culture</text><text x="329.3333333333333" y="542.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">shaped by movement, not one</text><text x="329.3333333333333" y="563.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">nation.</text><rect x="600.6666666666666" y="440" width="269.3333333333333" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,490 L601.9166666666666,454.25 Q601.9166666666666,441.25 614.9166666666666,441.25 L855.75,441.25 Q868.75,441.25 868.75,454.25 L868.75,490 Z" fill="#dce9e7"/><line x1="601.9166666666666" y1="490" x2="868.75" y2="490" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="470.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Vertovec (2007)</text><text x="614.6666666666666" y="521.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Super-diversity: many</text><text x="614.6666666666666" y="542.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">origins, statuses and</text><text x="614.6666666666666" y="563.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reasons.</text><rect x="30" y="605" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="641" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluation</text><text x="56" y="670" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Diaspora links can fund development or sustain conflict at home; later generations may</text><text x="56" y="692" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">identify more with the society of settlement.</text>
</svg>