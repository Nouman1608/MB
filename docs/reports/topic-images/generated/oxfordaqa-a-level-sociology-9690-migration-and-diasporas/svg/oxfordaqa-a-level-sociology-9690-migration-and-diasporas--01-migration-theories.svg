<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" width="900" height="740" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="740" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Explaining migration: beyond push and pull</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Ravenstein (1885) and Lee (1966) treat migration as the sum of individual decisions</text>
<rect x="208" y="120" width="327" height="44" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="371.5" y="147.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Core argument</text><rect x="543" y="120" width="327" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="706.5" y="147.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Explains well</text><rect x="30" y="172" width="170" height="93" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="212.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Household</text><text x="42" y="234.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">strategy</text><rect x="208" y="172" width="327" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="222" y="202.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Families decide who migrates,</text><text x="222" y="223.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">spreading risk across labour</text><text x="222" y="244.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">markets</text><rect x="543" y="172" width="327" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="557" y="202.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Why remittances matter; migration</text><text x="557" y="223.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">without a large wage gap</text><rect x="30" y="273" width="170" height="93" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="313.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Network</text><text x="42" y="335.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">approach</text><rect x="208" y="273" width="327" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="222" y="303.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Earlier migrants lower cost and</text><text x="222" y="324.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">risk through information, housing</text><text x="222" y="345.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and job contacts</text><rect x="543" y="273" width="327" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="557" y="303.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Why flows follow the same routes</text><text x="557" y="324.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">for decades (chain migration)</text><rect x="30" y="374" width="170" height="93" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="414.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Structural /</text><text x="42" y="436.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">world-systems</text><rect x="208" y="374" width="327" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="222" y="404.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Capitalism uproots people in poorer</text><text x="222" y="425.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">regions; global cities demand cheap</text><text x="222" y="446.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">service labour (Sassen, 1991)</text><rect x="543" y="374" width="327" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="557" y="404.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Links between former colonies and</text><text x="557" y="425.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rulers, and between rich cities and</text><text x="557" y="446.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">poorer regions</text><rect x="30" y="475" width="170" height="114" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="526.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Migration</text><text x="42" y="548.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">systems</text><rect x="208" y="475" width="327" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="222" y="505.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Castles and Miller (1993):</text><text x="222" y="526.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">globalisation, acceleration,</text><text x="222" y="547.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">differentiation, feminisation,</text><text x="222" y="568.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">politicisation</text><rect x="543" y="475" width="327" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="557" y="505.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Why migration is more varied, more</text><text x="557" y="526.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">female and more contested</text><rect x="30" y="605" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="641" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Feminisation of migration</text><text x="56" y="670" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Many women move independently as domestic workers, nurses and carers: link to</text><text x="56" y="692" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Hochschild’s global care chains.</text>
</svg>