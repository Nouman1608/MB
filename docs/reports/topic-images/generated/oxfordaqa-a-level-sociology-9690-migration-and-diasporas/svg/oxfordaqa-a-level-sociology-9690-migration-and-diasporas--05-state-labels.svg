<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 547" width="900" height="547" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="547" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How the state’s label shapes a migrant’s life</text>

<rect x="158" y="104" width="232" height="66" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="274" y="142.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Economic migrants</text><rect x="398" y="104" width="232" height="66" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="514" y="129.67000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Undocumented</text><text x="514" y="154.67000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">workers</text><rect x="638" y="104" width="232" height="66" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="754" y="142.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Digital nomads</text><rect x="30" y="178" width="120" height="93" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="229.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Who</text><rect x="158" y="178" width="232" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="172" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Move mainly for work</text><rect x="398" y="178" width="232" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="412" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Entered without</text><text x="412" y="229.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">permission or overstayed</text><text x="412" y="250.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a visa</text><rect x="638" y="178" width="232" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="652" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Work online while</text><text x="652" y="229.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">travelling</text><rect x="30" y="279" width="120" height="114" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="330.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">State</text><text x="42" y="352.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">response</text><rect x="158" y="279" width="232" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="172" y="309.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ranked by skill: doctors</text><text x="172" y="330.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and engineers welcomed,</text><text x="172" y="351.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">low-wage workers</text><text x="172" y="372.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">restricted</text><rect x="398" y="279" width="232" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="412" y="309.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No legal status</text><rect x="638" y="279" width="232" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="652" y="309.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Several countries offer</text><text x="652" y="330.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">visas aimed at them</text><rect x="30" y="401" width="120" height="114" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="463.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Effect</text><rect x="158" y="401" width="232" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="172" y="431.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sending countries: brain</text><text x="172" y="452.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">drain, but remittances</text><text x="172" y="473.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and brain gain</text><rect x="398" y="401" width="232" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="412" y="431.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Less able to complain</text><text x="412" y="452.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">about unpaid wages or</text><text x="412" y="473.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">unsafe work; benefits</text><text x="412" y="494.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">some employers</text><rect x="638" y="401" width="232" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="652" y="431.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Bauman’s "tourist" side:</text><text x="652" y="452.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">passport privilege and</text><text x="652" y="473.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">skills in demand</text>
</svg>