<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 883" width="900" height="883" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="883" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Key study: Becker et al. (2011)</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Does the look of a yoghurt pot change how the yoghurt tastes?</text>
<rect x="300" y="164" width="270" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><path d="M336,189 L404,189 L396,269 L344,269 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="3" stroke-linejoin="miter"/><text x="420" y="225" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Most</tspan> <tspan font-weight="700">intense:</tspan></text><text x="420" y="246" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">shape and</text><text x="420" y="267" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">colour</text><rect x="582" y="164" width="270" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M618,195 Q618,187 628,187 L676,187 Q686,187 686,195 Q688,269 652,271 Q616,269 618,195 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="3"/><text x="702" y="225" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Colour adds</text><text x="702" y="246" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">intensity</text><rect x="300" y="306" width="270" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M336,331 L404,331 L396,411 L344,411 Z" fill="#f2d9c9" stroke="#1e2a44" stroke-width="3" stroke-linejoin="miter"/><text x="420" y="367" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Shape adds</text><text x="420" y="388" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">intensity</text><rect x="582" y="306" width="270" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M618,337 Q618,329 628,329 L676,329 Q686,329 686,337 Q688,411 652,413 Q616,411 618,337 Z" fill="#f2d9c9" stroke="#1e2a44" stroke-width="3"/><text x="702" y="367" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Mildest</tspan> image</text><text x="435" y="152" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Angular</text><text x="717" y="152" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Rounded</text><text x="284" y="235" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">High saturation</text><text x="284" y="377" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Low saturation</text><text x="284" y="436" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Schematic of the 2 × 2 design</text><rect x="30" y="458" width="840" height="70" rx="14" fill="#ffffff"/><path d="M44,458 H200 V528 H44 A14,14 0 0 1 30,514 V472 A14,14 0 0 1 44,458 Z" fill="#f2e7b8"/><rect x="30" y="458" width="840" height="70" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="496.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Aim</text><text x="216" y="486.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Do package shape and colour saturation influence expected and rated taste</text><text x="216" y="507.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">intensity, especially for people who value visual design?</text><rect x="30" y="538" width="840" height="99" rx="14" fill="#ffffff"/><path d="M44,538 H200 V637 H44 A14,14 0 0 1 30,623 V552 A14,14 0 0 1 44,538 Z" fill="#b5d3cf"/><rect x="30" y="538" width="840" height="99" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="590.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Method</text><text x="216" y="566.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="231.2" y="566.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Controlled experiment: view yoghurt packages, rate expectations</text><text x="216" y="591.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="231.2" y="591.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Taste the yoghurt; rate taste intensity and other qualities</text><text x="216" y="616.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="231.2" y="616.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sensitivity to visual design measured</text><rect x="30" y="647" width="840" height="74" rx="14" fill="#fbf7e6"/><path d="M44,647 H200 V721 H44 A14,14 0 0 1 30,707 V661 A14,14 0 0 1 44,647 Z" fill="#d4b02e"/><rect x="30" y="647" width="840" height="74" rx="14" fill="none" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="687.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Results</text><text x="216" y="675.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="231.2" y="675.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Angular shape and high saturation → stronger, more intense taste</text><text x="216" y="700.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="231.2" y="700.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Effects strongest for people high in importance of visual design</text><rect x="30" y="731" width="840" height="56" rx="14" fill="#ffffff"/><path d="M44,731 H200 V787 H44 A14,14 0 0 1 30,773 V745 A14,14 0 0 1 44,731 Z" fill="#2e6b62"/><rect x="30" y="731" width="840" height="56" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="762.44" font-size="17" font-weight="700" fill="#ffffff" text-anchor="start">Conclusion</text><text x="216" y="763.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Package design changes how a product is <tspan font-weight="700" fill="#1e2a44">experienced</tspan> (sensory transfer)</text><text x="450" y="821.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">It changed expected and rated <tspan font-weight="700">taste</tspan>, not sales. One product type; tasting in a research setting is less natural</text><text x="450" y="842.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">than at home.</text>
</svg>