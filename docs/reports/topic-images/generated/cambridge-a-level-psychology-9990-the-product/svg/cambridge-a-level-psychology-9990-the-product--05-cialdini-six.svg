<rect width="900" height="540" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Cialdini’s six ways to close a sale</text>

<rect x="30" y="100" width="413" height="108" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RECIPROCITY</text><text x="50" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A free sample creates a sense of</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">obligation</text><rect x="457" y="100" width="413" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="144" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COMMITMENT AND CONSISTENCY</text><text x="477" y="170.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A small agreement leads to a larger one</text><rect x="30" y="222" width="413" height="96" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="260" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SOCIAL PROOF</text><text x="50" y="286.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Others are buying it</text><rect x="457" y="222" width="413" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="260" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LIKING</text><text x="477" y="286.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">We agree with people we like</text><rect x="30" y="332" width="413" height="96" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="370" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AUTHORITY</text><text x="50" y="396.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">An expert recommends it</text><rect x="457" y="332" width="413" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="370" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SCARCITY</text><text x="477" y="396.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Only a few left</text><rect x="30" y="450" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="483.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">In an answer, show <tspan font-weight="700" fill="#1e2a44">how</tspan> each principle would close the sale, not just its name.</text>
</svg>