<rect width="900" height="697" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Buying: the EKB model and dissonance</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Engel Kollat Blackwell: five stages</text>
<rect x="30" y="124" width="144" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="102" y="148" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">1</text><text x="102" y="172.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Problem</text><text x="102" y="192.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">recognition</text><line x1="180" y1="166" x2="198" y2="166" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="204" y="124" width="144" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="276" y="148" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">2</text><text x="276" y="172.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Information</text><text x="276" y="192.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">search</text><line x1="354" y1="166" x2="372" y2="166" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="378" y="124" width="144" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="148" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">3</text><text x="450" y="172.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Evaluation of</text><text x="450" y="192.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">alternatives</text><line x1="528" y1="166" x2="546" y2="166" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="552" y="124" width="144" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="624" y="158" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">4</text><text x="624" y="182.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Purchase</text><line x1="702" y1="166" x2="720" y2="166" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="726" y="124" width="144" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="798" y="148" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">5</text><text x="798" y="172.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Post-purchase</text><text x="798" y="192.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">outcomes</text><text x="450" y="242.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Search can be internal (memory) or external (reviews, friends). Useful for planned, high-involvement</text><text x="450" y="263.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">purchases; impulse buys skip stages.</text><rect x="30" y="304" width="840" height="176" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="340" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">POST-PURCHASE COGNITIVE DISSONANCE (FESTINGER)</text><rect x="80" y="360" width="300" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="394.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">“I chose this”</text><rect x="520" y="360" width="300" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="670" y="393.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">“The rejected option had good</text><text x="670" y="414.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">features”</text><path d="M392,390 l18,-14 l12,24 l12,-24 l12,24 l12,-24 l18,14" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round"/><text x="450" y="464" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">conflicting cognitions → discomfort after the decision</text><rect x="30" y="502" width="413" height="163" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="534" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">INCREASED WHEN</text><text x="50" y="565.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="565.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Expensive</text><text x="50" y="590.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="590.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Important</text><text x="50" y="615.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="615.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Hard to reverse</text><text x="50" y="640.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="640.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Rejected alternatives were attractive</text><rect x="457" y="502" width="413" height="163" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="477" y="534" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">REDUCED BY</text><text x="477" y="565.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="492.2" y="565.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Seeking information that supports the choice</text><text x="477" y="590.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="492.2" y="590.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Playing down the rejected option</text><text x="477" y="615.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="492.2" y="615.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Returning the item</text>
</svg>