<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The central gaze cascade effect</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Atalay, Bodur and Rasolofoarison (2012), using eye-tracking. Illustrative display</text>
<rect x="30" y="124" width="840" height="270" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="90" y="164" width="720" height="190" fill="#eef1f0" stroke="#1e2a44" stroke-width="3"/><line x1="90" y1="259" x2="810" y2="259" stroke="#1e2a44" stroke-width="3"/><line x1="90" y1="259" x2="810" y2="259" stroke="#1e2a44" stroke-width="3"/><ellipse cx="450" cy="259" rx="150" ry="95" fill="#d4b02e" opacity="0.35"/><ellipse cx="450" cy="259" rx="80" ry="60" fill="#d4b02e" opacity="0.5"/><rect x="120" y="180" width="100" height="64" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="260" y="180" width="100" height="64" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="400" y="180" width="100" height="64" rx="6" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3.5"/><rect x="540" y="180" width="100" height="64" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="680" y="180" width="100" height="64" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="120" y="275" width="100" height="64" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="260" y="275" width="100" height="64" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="400" y="275" width="100" height="64" rx="6" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3.5"/><rect x="540" y="275" width="100" height="64" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="680" y="275" width="100" height="64" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="450" y="380" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">horizontal centre of the display</text><rect x="30" y="416" width="249.33333333333334" height="99" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="154.66666666666669" y="459.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Centre products get</text><text x="154.66666666666669" y="480.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">more visual attention</text><line x1="285.33333333333337" y1="465.5" x2="319.33333333333337" y2="465.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="416" width="249.33333333333334" height="99" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450.00000000000006" y="449.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Attention to the centre</text><text x="450.00000000000006" y="470.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">rises just before</text><text x="450.00000000000006" y="491.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">choosing</text><line x1="580.6666666666667" y1="465.5" x2="614.6666666666667" y2="465.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="416" width="249.33333333333334" height="99" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="745.3333333333334" y="459.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Central products chosen</text><text x="745.3333333333334" y="480.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">more often</text><rect x="30" y="537" width="413" height="155" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="569" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PLANOGRAM</text><text x="50" y="595.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A diagram of exactly where each product</text><text x="50" y="618.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">sits</text><text x="50" y="646.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">keeps displays consistent; best positions for</text><text x="50" y="667.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">chosen products</text><rect x="457" y="537" width="413" height="155" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="569" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="477" y="595.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Looking is not buying</text><text x="477" y="623.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a simulated display may not reflect a busy real</text><text x="477" y="644.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">shop</text><rect x="30" y="714" width="840" height="58" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="747.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">It is the <tspan font-weight="700" fill="#1e2a44">horizontal</tspan> <tspan font-weight="700" fill="#1e2a44">centre</tspan>, not “eye level”.</text>
</svg>