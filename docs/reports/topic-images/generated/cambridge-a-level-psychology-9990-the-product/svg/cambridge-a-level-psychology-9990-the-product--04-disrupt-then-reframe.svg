<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 628" width="900" height="628" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="628" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Disrupt-then-reframe</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Davis and Knowles (1999): selling note cards</text>
<rect x="30" y="124" width="249.33333333333334" height="157" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="154.66666666666669" y="168" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">DISRUPT</text><text x="154.66666666666669" y="194.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">“300 pennies”</text><text x="154.66666666666669" y="223.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">an odd price briefly</text><text x="154.66666666666669" y="244.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">confuses</text><line x1="285.33333333333337" y1="202.5" x2="319.33333333333337" y2="202.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="124" width="249.33333333333334" height="157" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450.00000000000006" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">REFRAME</text><text x="450.00000000000006" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">“That’s $3, it’s a</text><text x="450.00000000000006" y="206.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">bargain”</text><text x="450.00000000000006" y="235.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">an easy way to resolve the</text><text x="450.00000000000006" y="256.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">confusion</text><line x1="580.6666666666667" y1="202.5" x2="614.6666666666667" y2="202.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="124" width="249.33333333333334" height="157" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="745.3333333333334" y="192.5" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">RESULT</text><text x="745.3333333333334" y="219.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Sales increased</text><text x="450" y="319" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">KARDES ET AL. (2007): NEED FOR COGNITIVE CLOSURE</text><rect x="30" y="341" width="250" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="155" y="375" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">SITUATION</text><text x="155" y="401.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Time pressure, fatigue,</text><text x="155" y="424.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">noise</text><rect x="325" y="341" width="250" height="153" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="373" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">PERSON</text><text x="450" y="399.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">High need for cognitive</text><text x="450" y="422.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">closure</text><text x="450" y="450" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">wants a firm answer; dislikes</text><text x="450" y="470" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">ambiguity</text><rect x="620" y="341" width="250" height="111" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="745" y="373" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">OUTCOME</text><text x="745" y="399.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Grabs the reframe</text><text x="745" y="427.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">it ends the confusion</text><line x1="286" y1="417.5" x2="319" y2="417.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="581" y1="417.5" x2="614" y2="417.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="516" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="549.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">An interaction of an <tspan font-weight="700" fill="#1e2a44">individual</tspan> <tspan font-weight="700" fill="#1e2a44">difference</tspan> and <tspan font-weight="700" fill="#1e2a44">situational</tspan> <tspan font-weight="700" fill="#1e2a44">factors</tspan>: a busy, tired customer is more</text><text x="450" y="571.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">susceptible.</text>
</svg>