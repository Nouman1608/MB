<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 768" width="900" height="768" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="768" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Gift-wrapping</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Why we wrap, and why givers and recipients can disagree</text>
<text x="450" y="140" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">WHY WRAP?</text><rect x="30" y="162" width="270.6666666666667" height="88" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="165.33333333333334" y="196.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Hides the gift</text><text x="165.33333333333334" y="225.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">surprise and anticipation</text><rect x="314.6666666666667" y="162" width="270.6666666666667" height="88" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="196.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Marks it as a gift</text><text x="450" y="225.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">not an ordinary purchase</text><rect x="599.3333333333334" y="162" width="270.6666666666667" height="88" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="734.6666666666667" y="196.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Signals effort</text><text x="734.6666666666667" y="225.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">the thought of the giver</text><text x="450" y="288" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">RIXOM ET AL. (2020): A GIFT FROM A FRIEND</text><rect x="30" y="310" width="397" height="83" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="228.5" y="342" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">NEATLY WRAPPED</text><text x="228.5" y="368.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Raises expectations</text><line x1="433" y1="351.5" x2="467" y2="351.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="310" width="397" height="83" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="671.5" y="356.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Gift itself liked less</text><rect x="30" y="407" width="397" height="83" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="228.5" y="439" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">SLOPPILY WRAPPED</text><text x="228.5" y="465.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Sets low expectations</text><line x1="433" y1="448.5" x2="467" y2="448.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="407" width="397" height="83" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="671.5" y="453.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Gift exceeds them</text><rect x="30" y="512" width="413" height="134" rx="14" fill="#eef1f0" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="544" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GIVERS BELIEVE</text><text x="50" y="570.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Careful, elaborate wrapping makes a gift</text><text x="50" y="593.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">more appreciated</text><rect x="457" y="512" width="413" height="134" rx="14" fill="#eef1f0" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="544" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">HOWARD (1992)</text><text x="477" y="570.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Wrapping puts the recipient in a positive</text><text x="477" y="593.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">mood</text><text x="477" y="621.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">which biases their attitude to the item favourably</text><text x="450" y="684" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">TYPES OF WRAPPING</text><rect x="82.06400000000002" y="706" width="63.28" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="113.70400000000002" y="726.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">none</text><rect x="155.34400000000002" y="706" width="83.952" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="197.32000000000002" y="726.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">gift bag</text><rect x="249.29600000000002" y="706" width="111.312" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="304.952" y="726.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">plain paper</text><rect x="370.608" y="706" width="157.264" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="449.24" y="726.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">decorative paper</text><rect x="537.8720000000001" y="706" width="74.78399999999999" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="575.2640000000001" y="726.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">ribbon</text><rect x="622.6560000000001" y="706" width="53.168" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="649.24" y="726.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">box</text><rect x="685.8240000000001" y="706" width="132.112" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="751.8800000000001" y="726.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">neat … untidy</text>
</svg>