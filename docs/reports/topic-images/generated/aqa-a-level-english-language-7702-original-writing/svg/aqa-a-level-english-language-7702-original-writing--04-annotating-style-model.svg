<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="660" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Annotating the style model</text>

<rect x="40" y="112" width="400" height="82" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="64" y="145" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Highlighting</text><text x="64" y="175" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">only labels: "metaphor", "list"</text><rect x="460" y="112" width="400" height="82" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="484" y="145" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Annotation</text><text x="484" y="175" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">what the feature is + what it does</text><rect x="40" y="212" width="820" height="62" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="52" y="221" width="200" height="44" rx="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="152" y="249" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Graphology</text><text x="270" y="238" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">How do headings, paragraph lengths, white space and images</text><text x="270" y="260" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">guide the reader?</text><rect x="40" y="284" width="820" height="62" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="52" y="293" width="200" height="44" rx="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="152" y="321" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Phonology</text><text x="270" y="310" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Does it use sound patterning, rhythm or patterns written</text><text x="270" y="332" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to be read aloud?</text><rect x="40" y="356" width="820" height="62" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="52" y="365" width="200" height="44" rx="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="152" y="393" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Lexis and semantics</text><text x="270" y="382" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Which semantic fields, register and evaluative words</text><text x="270" y="404" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">create its tone?</text><rect x="40" y="428" width="820" height="62" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="52" y="437" width="200" height="44" rx="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="152" y="465" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Grammar</text><text x="270" y="454" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">What sentence types and lengths, tenses, voices and clause</text><text x="270" y="476" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">patterns recur, and where?</text><rect x="40" y="500" width="820" height="62" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="52" y="509" width="200" height="44" rx="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="152" y="537" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Pragmatics</text><text x="270" y="526" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">What does it assume the reader knows? How does it handle</text><text x="270" y="548" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">politeness and implication?</text><rect x="40" y="572" width="820" height="62" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="52" y="581" width="200" height="44" rx="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="152" y="609" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Discourse</text><text x="270" y="598" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">How is it structured: hook, development, turning point,</text><text x="270" y="620" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">close? How is cohesion created?</text>
</svg>