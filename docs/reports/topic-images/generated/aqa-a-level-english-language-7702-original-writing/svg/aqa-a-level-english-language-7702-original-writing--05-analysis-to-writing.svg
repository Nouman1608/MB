<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="650" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From style model to craft decisions</text>

<text x="220" y="132" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">Style model feature</text><text x="655" y="132" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Decision for my piece</text><rect x="40" y="148" width="360" height="92" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="188.5" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Opens with a one-line anecdote</text><text x="60" y="211.5" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">in present tense</text><line x1="404" y1="194" x2="446" y2="194" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="450" y="148" width="410" height="92" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="470" y="177" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Open my speech with a 2-sentence</text><text x="470" y="200" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">anecdote about my grandfather, in</text><text x="470" y="223" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">present tense</text><rect x="40" y="258" width="360" height="92" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="310" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Triadic structures at key points</text><line x1="404" y1="304" x2="446" y2="304" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="450" y="258" width="410" height="92" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="470" y="298.5" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Use three triples, saved for the three</text><text x="470" y="321.5" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">main turns in the argument</text><rect x="40" y="368" width="360" height="92" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="408.5" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Shifts from "I" to "we" in the</text><text x="60" y="431.5" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">final third</text><line x1="404" y1="414" x2="446" y2="414" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="450" y="368" width="410" height="92" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="470" y="408.5" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Move from personal to collective</text><text x="470" y="431.5" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">address before the call to action</text><line x1="655" y1="478" x2="655" y2="510" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><rect x="40" y="515" width="820" height="110" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="64" y="552" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Then adapt</text><text x="64" y="582" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Your audience and purpose are not identical to the style model's, so some features</text><text x="64" y="607" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">must change. The commentary rewards explaining these adaptations.</text>
</svg>