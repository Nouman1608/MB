<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 555" width="900" height="555" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="555" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Recording redrafting decisions</text>

<text x="270" y="132" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">What changed</text><text x="705" y="132" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Why, in linguistic terms</text><rect x="40" y="148" width="470" height="76" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="186" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="192.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="108" y="180.5" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Cut three adjectives from the</text><text x="108" y="203.5" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">opening noun phrase</text><line x1="514" y1="186" x2="556" y2="186" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="560" y="148" width="300" height="76" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="710" y="192" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">to quicken pace</text><rect x="40" y="240" width="470" height="76" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="278" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="284.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="108" y="272.5" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Moved the statistic from paragraph</text><text x="108" y="295.5" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">four to the opening</text><line x1="514" y1="278" x2="556" y2="278" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="560" y="240" width="300" height="76" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="710" y="284" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">to establish credibility</text><rect x="40" y="332" width="470" height="76" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="370" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="376.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="108" y="376" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Changed passive to active</text><line x1="514" y1="370" x2="556" y2="370" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="560" y="332" width="300" height="76" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="710" y="376" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">to make the council responsible</text><rect x="40" y="440" width="820" height="90" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="450" y="476" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Keep earlier drafts and note why you changed things.</text><text x="450" y="506" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Those notes become commentary material.</text>
</svg>