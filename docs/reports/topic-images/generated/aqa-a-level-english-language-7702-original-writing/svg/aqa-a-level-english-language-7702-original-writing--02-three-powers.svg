<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" width="900" height="740" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="740" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What each "power" asks of a writer</text>

<rect x="40" y="115" width="260" height="480" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="52" y="127" width="236" height="126" rx="10" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="170" y="158" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">The Power of</text><text x="170" y="184" font-size="21" font-weight="700" fill="#b5602e" text-anchor="middle">Persuasion</text><text x="170" y="209" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Change what a reader or</text><text x="170" y="228" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">listener thinks or does</text><text x="62" y="284" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Choices that matter</text><circle cx="68" cy="306" r="5" fill="#b5602e"/><text x="82" y="312" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">address and pronouns</text><circle cx="68" cy="340" r="5" fill="#b5602e"/><text x="82" y="346" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">rhetorical patterning</text><circle cx="68" cy="374" r="5" fill="#b5602e"/><text x="82" y="380" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">modality</text><circle cx="68" cy="408" r="5" fill="#b5602e"/><text x="82" y="414" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">evaluative lexis</text><circle cx="68" cy="442" r="5" fill="#b5602e"/><text x="82" y="448" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">evidence and anecdote</text><circle cx="68" cy="476" r="5" fill="#b5602e"/><text x="82" y="482" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">structure building to a</text><text x="82" y="504" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">call to action</text><rect x="320" y="115" width="260" height="480" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="332" y="127" width="236" height="126" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="158" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">The Power of</text><text x="450" y="184" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Storytelling</text><text x="450" y="209" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Engage a reader in</text><text x="450" y="228" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">characters, events and</text><text x="450" y="247" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">experience</text><text x="342" y="284" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Choices that matter</text><circle cx="348" cy="306" r="5" fill="#2e6b62"/><text x="362" y="312" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">narrative voice and</text><text x="362" y="334" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">viewpoint</text><circle cx="348" cy="362" r="5" fill="#2e6b62"/><text x="362" y="368" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">tense, dialogue</text><circle cx="348" cy="396" r="5" fill="#2e6b62"/><text x="362" y="402" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">pace through sentence</text><text x="362" y="424" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">structure</text><circle cx="348" cy="452" r="5" fill="#2e6b62"/><text x="362" y="458" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">sensory lexis</text><circle cx="348" cy="486" r="5" fill="#2e6b62"/><text x="362" y="492" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">structural shape:</text><text x="362" y="514" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">openings, turning</text><text x="362" y="536" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">points, endings</text><rect x="600" y="115" width="260" height="480" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="612" y="127" width="236" height="126" rx="10" fill="#efdfa8" stroke="#8a6d0d" stroke-width="2.5"/><text x="730" y="158" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">The Power of</text><text x="730" y="184" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="middle">Information</text><text x="730" y="209" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Inform an audience clearly</text><text x="730" y="228" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">and engagingly</text><text x="622" y="284" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Choices that matter</text><circle cx="628" cy="306" r="5" fill="#8a6d0d"/><text x="642" y="312" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">organisation and</text><text x="642" y="334" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">signposting</text><circle cx="628" cy="362" r="5" fill="#8a6d0d"/><text x="642" y="368" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">register suited to</text><text x="642" y="390" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">expertise</text><circle cx="628" cy="418" r="5" fill="#8a6d0d"/><text x="642" y="424" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">precise lexis</text><circle cx="628" cy="452" r="5" fill="#8a6d0d"/><text x="642" y="458" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">explanation through</text><text x="642" y="480" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">example</text><circle cx="628" cy="508" r="5" fill="#8a6d0d"/><text x="642" y="514" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">headings and layout</text><rect x="40" y="615" width="820" height="100" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="64" y="650" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Define audience and purpose precisely: every later choice depends on them.</text><text x="64" y="682" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">"readers of a regional magazine who walk but have never visited the coast path"</text>
</svg>