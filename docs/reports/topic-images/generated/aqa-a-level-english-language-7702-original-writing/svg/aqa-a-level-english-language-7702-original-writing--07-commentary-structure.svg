<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 661" width="900" height="661" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="661" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A reliable commentary structure</text>

<rect x="110" y="120" width="750" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="150" cy="154" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="150" y="161.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="186" y="150" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Context</text><text x="186" y="175" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">form, audience, purpose and area, briefly</text><rect x="110" y="202" width="750" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="150" cy="236" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="150" y="243.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="186" y="232" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The style model</text><text x="186" y="257" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">key techniques identified, with terminology</text><rect x="110" y="284" width="750" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="150" cy="318" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="150" y="325.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="186" y="314" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Your choices</text><text x="186" y="339" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">adopted, adapted and why, linked to audience and purpose</text><rect x="110" y="366" width="750" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="150" cy="400" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="150" y="407.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="186" y="396" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The writing process</text><text x="186" y="421" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">significant redrafting decisions and their reasons</text><rect x="110" y="448" width="750" height="68" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><circle cx="150" cy="482" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="150" y="489.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="186" y="478" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluation</text><text x="186" y="503" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">how well the piece achieves its purpose, with honest limitations</text><line x1="84" y1="125" x2="84" y2="516" stroke="#2e6b62" stroke-width="8" stroke-linecap="round"/><text x="0" y="0" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle" transform="translate(56 320.5) rotate(-90)">connections between the two texts throughout</text><rect x="40" y="546" width="820" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="64" y="580" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Analytical and evaluative, not a narrative</text><text x="64" y="610" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Avoid "First I planned..." and describing the two texts separately.</text>
</svg>