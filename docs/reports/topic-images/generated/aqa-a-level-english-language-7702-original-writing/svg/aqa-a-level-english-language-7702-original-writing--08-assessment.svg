<rect width="900" height="580" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How the two parts are assessed</text>

<rect x="40" y="115" width="400" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="240" y="155" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Original writing</text><text x="240" y="185" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">750 words, 25 marks</text><rect x="160" y="205" width="160" height="50" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="240" y="238" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">AO5</text><text x="240" y="288" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">expertise and creativity in</text><text x="240" y="311" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">using English</text><text x="64" y="352" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">• handling the form</text><text x="64" y="374" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">• controlling register</text><text x="64" y="396" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">• positioning the audience</text><text x="64" y="418" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">• accuracy and cohesion</text><rect x="460" y="115" width="400" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="660" y="155" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Commentary</text><text x="660" y="185" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">750 words, 25 marks</text><text x="660" y="238" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">draws on all the AOs, including</text><rect x="580" y="258" width="160" height="50" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="660" y="291" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">AO4</text><text x="660" y="340" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">connections between your</text><text x="660" y="363" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">writing and the style model</text><rect x="40" y="465" width="820" height="90" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="450" y="501" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">A commentary that discusses only one of the two texts limits its own marks.</text><text x="450" y="531" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Write it with both texts in view throughout.</text>
</svg>