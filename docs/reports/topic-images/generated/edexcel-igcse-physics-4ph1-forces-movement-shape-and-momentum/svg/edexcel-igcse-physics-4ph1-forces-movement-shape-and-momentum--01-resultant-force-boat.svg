<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="600" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: the resultant force on a boat</text>

<rect x="30" y="110" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="32" y="320" width="836" height="108" rx="0" fill="#dce9e7" stroke="none" stroke-width="0" /><path d="M32,320 q25,-8 50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t36,0" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M300,270 L600,270 L560,340 L340,340 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><rect x="390" y="220" width="110" height="50" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="450" y="305" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">400 kg</text><line x1="610" y1="300" x2="830" y2="300" stroke="#2e6b62" stroke-width="8" marker-end="url(#ahT)"/><text x="720" y="280" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">engine 1500 N</text><line x1="330" y1="370" x2="150" y2="370" stroke="#b5602e" stroke-width="6" marker-end="url(#ahR)"/><text x="240" y="405" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">water resistance 900 N</text><line x1="330" y1="190" x2="270" y2="190" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><text x="300" y="172" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">wind 200 N</text><text x="860" y="150" font-size="16" font-weight="600" fill="#4a5568" text-anchor="end">forwards = positive →</text><rect x="30" y="460" width="840" height="141.6" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="501.1" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">resultant force = 1500 − 900 − 200 = 400 N forwards</text><text x="54" y="537.1" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">a = F ÷ m = 400 ÷ 400 = 1.0 m/s²</text><text x="54" y="573.1" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Zero resultant: balanced, so at rest or constant velocity. Only an unbalanced force accelerates.</text>
</svg>