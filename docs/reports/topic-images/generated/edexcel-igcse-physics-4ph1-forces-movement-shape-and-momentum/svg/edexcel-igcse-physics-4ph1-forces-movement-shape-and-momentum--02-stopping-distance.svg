<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="660" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Stopping distance</text>

<rect x="30" y="110" width="840" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="190" y="135" width="220" height="46" rx="0" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><rect x="410" y="135" width="420" height="46" rx="0" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5" /><text x="300" y="164" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">thinking distance</text><text x="620" y="164" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">braking distance</text><line x1="190" y1="200" x2="830" y2="200" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="190" y1="192" x2="190" y2="208" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="830" y1="192" x2="830" y2="208" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><text x="510" y="228" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">stopping distance = thinking distance + braking distance</text><text x="55" y="164" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">at constant</text><text x="55" y="182" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">speed, then</text><text x="55" y="200" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">brakes act</text><text x="300" y="270" font-size="15" font-weight="400" fill="#8a6d0d" text-anchor="middle">during the reaction time</text><text x="620" y="270" font-size="15" font-weight="400" fill="#b5602e" text-anchor="middle">while the brakes act</text><rect x="30" y="325" width="410" height="210" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="363.8" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="start">Thinking distance increases with</text><text x="55" y="400" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• higher speed</text><text x="55" y="424" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• longer reaction time: tiredness,</text><text x="69" y="448" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">alcohol, some drugs, distractions</text><text x="69" y="472" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">such as a mobile phone</text><rect x="460" y="325" width="410" height="210" rx="14" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="482" y="363.8" font-size="21" font-weight="700" fill="#b5602e" text-anchor="start">Braking distance increases with</text><text x="485" y="400" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• higher speed</text><text x="485" y="424" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• larger mass of the vehicle</text><text x="485" y="448" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• wet, icy or loose road (less friction)</text><text x="485" y="472" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• worn tyres or worn brakes</text><rect x="30" y="550" width="840" height="105.6" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="590.2" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">thinking distance = speed × reaction time   (reaction time 0.70 s)</text><text x="54" y="626.2" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">20 m/s: 20 × 0.70 = 14 m        40 m/s: 40 × 0.70 = 28 m (doubles)</text>
</svg>