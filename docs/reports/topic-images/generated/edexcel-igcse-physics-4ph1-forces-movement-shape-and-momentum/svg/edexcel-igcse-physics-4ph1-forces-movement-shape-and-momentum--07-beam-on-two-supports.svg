<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="610" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: a beam on two supports</text>

<rect x="30" y="110" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="150" y="250" width="600" height="20" rx="0" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><path d="M150,270 L126,310 L174,310 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M750,270 L726,310 L774,310 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="150" y="338" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><text x="750" y="338" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><line x1="300" y1="150" x2="300" y2="246" stroke="#b5602e" stroke-width="7" marker-end="url(#ahR)"/><text x="314" y="172" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">600 N load</text><line x1="190" y1="400" x2="190" y2="274" stroke="#2e6b62" stroke-width="6" marker-end="url(#ahT)"/><text x="204" y="390" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">R_A = 450 N</text><line x1="710" y1="350" x2="710" y2="274" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="696" y="390" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="end">R_B = 150 N</text><line x1="150" y1="210" x2="300" y2="210" stroke="#8a6d0d" stroke-width="2" stroke-linecap="round"/><line x1="150" y1="202" x2="150" y2="218" stroke="#8a6d0d" stroke-width="2" stroke-linecap="round"/><line x1="300" y1="202" x2="300" y2="218" stroke="#8a6d0d" stroke-width="2" stroke-linecap="round"/><text x="225" y="200" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">0.50 m</text><line x1="150" y1="425" x2="750" y2="425" stroke="#8a6d0d" stroke-width="2" stroke-linecap="round"/><line x1="150" y1="417" x2="150" y2="433" stroke="#8a6d0d" stroke-width="2" stroke-linecap="round"/><line x1="750" y1="417" x2="750" y2="433" stroke="#8a6d0d" stroke-width="2" stroke-linecap="round"/><text x="450" y="418" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">2.0 m (light beam)</text><rect x="30" y="455" width="840" height="109.6" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="495.2" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Moments about A (removes R_A):   R_B × 2.0 = 600 × 0.50   →   R_B = 150 N</text><text x="54" y="533.2" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Upward forces balance the load:   R_A + R_B = 600   →   R_A = 450 N</text><text x="450" y="585" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">The support nearer the load carries more. Load at the centre: 300 N each.</text>
</svg>