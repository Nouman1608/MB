<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="640" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Conservation of momentum: an explosion</text>

<rect x="30" y="110" width="410" height="240" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Before: at rest</text><rect x="150" y="220" width="130" height="60" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3" /><circle cx="170" cy="292" r="12" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><circle cx="260" cy="292" r="12" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><text x="215" y="257" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2.0 kg</text><rect x="280" y="220" width="150" height="60" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="3" /><circle cx="300" cy="292" r="12" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><circle cx="410" cy="292" r="12" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><text x="355" y="257" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3.0 kg</text><line x1="45" y1="306" x2="425" y2="306" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><text x="235" y="335" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">total momentum = 0</text><rect x="460" y="110" width="410" height="240" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">After: spring released</text><rect x="500" y="220" width="120" height="60" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3" /><circle cx="520" cy="292" r="12" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><circle cx="600" cy="292" r="12" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><text x="560" y="257" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2.0 kg</text><rect x="700" y="220" width="140" height="60" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="3" /><circle cx="720" cy="292" r="12" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><circle cx="820" cy="292" r="12" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><text x="770" y="257" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3.0 kg</text><line x1="475" y1="306" x2="855" y2="306" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="580" y1="195" x2="495" y2="195" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><text x="560" y="182" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">v = ?</text><line x1="760" y1="195" x2="830" y2="195" stroke="#2e6b62" stroke-width="5" marker-end="url(#ahT)"/><text x="795" y="182" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">0.40 m/s</text><rect x="30" y="370" width="840" height="147.6" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="411.1" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">Take right as positive.   momentum before = 0</text><text x="54" y="449.1" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">momentum after = (3.0 × 0.40) + (2.0 × v) = 0</text><text x="54" y="487.1" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">1.2 + 2.0v = 0   →   v = −0.60 m/s, so 0.60 m/s to the left</text><rect x="30" y="530" width="840" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="565" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Newton's third law: the spring pushes each trolley with equal and opposite</text><text x="55" y="591" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">forces for the same time, so the momenta (1.2 kg m/s each) are equal and opposite.</text>
</svg>