<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="720" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why a longer stopping time means a smaller force</text>

<rect x="30" y="110" width="840" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="110" y1="450" x2="810" y2="450" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="110" y1="450" x2="110" y2="150" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="810" y="484" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">time / s</text><text x="88" y="300" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 88 300)">force / N</text><rect x="114" y="190" width="40" height="260" rx="0" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5" /><text x="170" y="210" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">about 0.05 s against the dashboard:</text><text x="170" y="230" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">force ten times larger</text><rect x="114" y="424" width="400" height="26" rx="0" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="170" y="410" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">0.50 s with seat belt and airbag: 2100 N</text><text x="370" y="330" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Same change in momentum in both cases</text><text x="370" y="350" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">(equal areas under force × time)</text><rect x="30" y="525" width="840" height="141.6" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="565.2" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">70 kg passenger, 15 m/s → 0 in 0.50 s</text><text x="54" y="601.2" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">change in momentum = 70 × 0 − 70 × 15 = −1050 kg m/s</text><text x="54" y="637.2" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">F = (mv − mu) ÷ t = −1050 ÷ 0.50 = −2100 N, so 2100 N against the motion</text><text x="450" y="695" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Crumple zones, airbags, seat belts, cycle helmets and crash mats all increase the stopping time.</text>
</svg>