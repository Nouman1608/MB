<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 594" width="900" height="594" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="594" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How to recognise a symbol</text>

<rect x="30" y="110" width="411" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="52" y="142" width="13" height="24" rx="3" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><rect x="70" y="142" width="13" height="24" rx="3" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><rect x="88" y="142" width="13" height="24" rx="3" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="120" y="160" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Repetition</text><text x="52" y="198" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">appears again and again, often at important</text><text x="52" y="220" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">moments</text><rect x="459" y="110" width="411" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="499" cy="150" r="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><line x1="509" y1="160" x2="525" y2="174" stroke="#1e2a44" stroke-width="5" stroke-linecap="round"/><text x="549" y="160" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Prominence</text><text x="481" y="198" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">unusual detail, a whole sentence or</text><text x="481" y="220" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">paragraph on something small</text><rect x="30" y="254" width="411" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="74" cy="298" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><circle cx="68" cy="294" r="2.5" fill="#1e2a44"/><circle cx="80" cy="294" r="2.5" fill="#1e2a44"/><circle cx="74" cy="305" r="4" fill="none" stroke="#1e2a44" stroke-width="2.5"/><text x="120" y="304" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Character reaction</text><text x="52" y="342" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">characters avoid it, guard it, fear it or cannot</text><text x="52" y="364" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">let go</text><rect x="459" y="254" width="411" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="481" y1="304" x2="531" y2="304" stroke="#1e2a44" stroke-width="3"/><circle cx="515" cy="304" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><path d="M515,294 l0,-12" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="549" y="304" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Placement</text><text x="481" y="342" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">at a turning point, an ending or an opening</text><rect x="30" y="398" width="411" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="52" y="434" width="26" height="16" rx="8" fill="none" stroke="#1e2a44" stroke-width="3.5"/><rect x="70" y="434" width="26" height="16" rx="8" fill="none" stroke="#2e6b62" stroke-width="3.5"/><text x="120" y="448" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Linked language</text><text x="52" y="486" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">described in words from another realm: grief,</text><text x="52" y="508" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">power, time</text><rect x="459" y="398" width="411" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="481" y="432" width="14" height="20" rx="3" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><line x1="499" y1="442" x2="515" y2="442" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="517" y="432" width="14" height="20" rx="3" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2.5"/><text x="549" y="448" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Change</text><text x="481" y="486" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">its condition changes as the story's situation</text><text x="481" y="508" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">changes</text><text x="450" y="566" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Most objects are just objects: a symbol earns the name through these signals</text>
</svg>