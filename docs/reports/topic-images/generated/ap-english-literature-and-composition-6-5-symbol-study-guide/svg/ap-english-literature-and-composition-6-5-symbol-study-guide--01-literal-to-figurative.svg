<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 551" width="900" height="551" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="551" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From object to symbol</text>

<rect x="30" y="110" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><g transform="translate(110,185) scale(1.1)"><circle cx="0" cy="0" r="30" fill="#d4b02e" stroke="#1e2a44" stroke-width="4"/><circle cx="0" cy="0" r="11" fill="#f4f6f6" stroke="#1e2a44" stroke-width="3.5"/><path d="M30,-7 L130,-7 L130,22 L116,22 L116,7 L102,7 L102,26 L88,26 L88,7 L30,7 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="4" stroke-linejoin="round"/></g><text x="300" y="165" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="start">A key</text><text x="300" y="195" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">a material object in the story</text><text x="300" y="228" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">handed over with ceremony, kept for years, lost at a decisive moment</text><line x1="300" y1="264" x2="240" y2="294" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="600" y1="264" x2="660" y2="294" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="300" width="390" height="139" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="333" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LITERAL LEVEL</text><text x="50" y="361.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">It opens a lock</text><text x="50" y="392.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The object does not stop being a key.</text><rect x="480" y="300" width="390" height="139" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="500" y="333" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">FIGURATIVE LEVEL</text><text x="500" y="361.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">It stands for an idea</text><text x="500" y="392.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">access, trust, a secret, or a past that</text><text x="500" y="414.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">can be reopened</text><rect x="30" y="463" width="840" height="58" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="499" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">A good symbol lives on both levels at once</text>
</svg>