<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 592" width="900" height="592" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="592" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Where a symbol gets its meaning</text>

<rect x="30" y="110" width="411" height="172" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COMMON, RECURRENT</text><text x="50" y="171" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Readers bring associations to the</text><text x="50" y="197" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">text</text><text x="50" y="227.4" font-size="18" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="67.1" y="227.4" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">dove → peace</text><text x="50" y="256.4" font-size="18" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="67.1" y="256.4" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">winter → death or decline</text><rect x="459" y="110" width="411" height="172" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONTEXTUALISED</text><text x="479" y="171" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Meaning is built inside one text</text><text x="479" y="201.4" font-size="18" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="496.1" y="201.4" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">a locked gate in one novel may mean</text><text x="496.1" y="225.4" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">something it means nowhere else</text><rect x="30" y="302" width="840" height="56" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="337" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Meaning can vary with the reader and the context, so evidence matters</text><text x="450" y="408" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">What can become symbolic?</text><rect x="30" y="428" width="268" height="134" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="164" y="475" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">An object</text><text x="164" y="504.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">when it comes to stand for</text><text x="164" y="526.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">an idea or concept</text><rect x="316" y="428" width="268" height="134" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="464" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">A character</text><text x="450" y="493.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">when they come to</text><text x="450" y="515.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">represent an idea (no need</text><text x="450" y="537.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">to label archetypes)</text><rect x="602" y="428" width="268" height="134" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="736" y="464" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">A setting</text><text x="736" y="493.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">when it is associated with</text><text x="736" y="515.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">emotions, ideologies or</text><text x="736" y="537.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">beliefs</text>
</svg>