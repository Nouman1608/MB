<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading a symbol in four steps</text>

<rect x="30" y="110" width="184.5" height="161" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STEP 1</text><text x="50" y="171.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Notice</text><text x="50" y="202.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">What is the</text><text x="50" y="224.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">object? What</text><text x="50" y="246.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">signals weight?</text><line x1="220.5" y1="190.5" x2="242.5" y2="190.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="248.5" y="110" width="184.5" height="161" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="268.5" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STEP 2</text><text x="268.5" y="171.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Associate</text><text x="268.5" y="202.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">What ideas does</text><text x="268.5" y="224.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the text connect</text><text x="268.5" y="246.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">it with?</text><line x1="439" y1="190.5" x2="461" y2="190.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="467" y="110" width="184.5" height="161" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="487" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STEP 3</text><text x="487" y="171.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">State</text><text x="487" y="202.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">What idea does it</text><text x="487" y="224.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">represent here? A</text><text x="487" y="246.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">short phrase.</text><line x1="657.5" y1="190.5" x2="679.5" y2="190.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="685.5" y="110" width="184.5" height="161" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="705.5" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STEP 4</text><text x="705.5" y="171.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Function</text><text x="705.5" y="202.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">What does it do</text><text x="705.5" y="224.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">in the work?</text><text x="30" y="315" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">A symbol can...</text><rect x="30" y="335" width="158" height="64" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="109" y="362.1" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">make an internal</text><text x="109" y="383.1" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">feeling visible</text><rect x="200" y="335" width="158" height="64" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="279" y="362.1" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">mark a stage of</text><text x="279" y="383.1" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">change</text><rect x="370" y="335" width="158" height="64" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="449" y="372.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">connect scenes</text><rect x="540" y="335" width="158" height="64" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="619" y="372.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">deepen a conflict</text><rect x="710" y="335" width="158" height="64" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="789" y="362.1" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">invite an</text><text x="789" y="383.1" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">interpretation</text><rect x="150" y="433" width="600" height="115" rx="14" fill="none"/><rect x="150" y="433" width="600" height="115" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="9 6"/><text x="450" y="466" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">STEP 5, IF THE MEANING CHANGES</text><text x="450" y="494" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Trace the shift</text><text x="450" y="523.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">and explain what the change shows</text>
