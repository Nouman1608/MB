<rect width="900" height="711" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The gate's meaning shifts</text>

<line x1="70" y1="300" x2="840" y2="300" stroke="#1e2a44" stroke-width="4"/><line x1="820" y1="300" x2="860" y2="300" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><circle cx="170" cy="300" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="170" y="270" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Autumn</text><rect x="45" y="120" width="250" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="170" y="173.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Padlocked since Papa</text><text x="170" y="195.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">died</text><rect x="45" y="330" width="250" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="170" y="374.6" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Barrier: grief sealed off</text><circle cx="450" cy="300" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="270" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Midsummer</text><rect x="325" y="120" width="250" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="184.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">She asks for the key</text><rect x="325" y="330" width="250" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="363.6" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">First step from avoidance</text><text x="450" y="385.6" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">to confrontation</text><circle cx="730" cy="300" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="730" y="270" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">November storm</text><rect x="605" y="120" width="250" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="730" y="173.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Gate face-down in the</text><text x="730" y="195.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">grass</text><rect x="605" y="330" width="250" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="730" y="374.6" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Relief, not loss</text><rect x="110" y="440" width="260" height="60" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="240" y="477" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">ENCLOSURE</text><rect x="530" y="440" width="260" height="60" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="660" y="477" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">RELEASE</text><line x1="380" y1="470" x2="520" y2="470" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><rect x="30" y="536" width="411" height="115" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="569" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COMMON SYMBOL</text><text x="50" y="597" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The storm</text><text x="50" y="626.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">upheaval: readers already know it</text><rect x="459" y="536" width="411" height="115" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="569" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONTEXTUAL SYMBOL</text><text x="479" y="597" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The gate</text><text x="479" y="626.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">meaning made by this text</text><text x="450" y="685" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">The two meet at the moment of change</text>
</svg>