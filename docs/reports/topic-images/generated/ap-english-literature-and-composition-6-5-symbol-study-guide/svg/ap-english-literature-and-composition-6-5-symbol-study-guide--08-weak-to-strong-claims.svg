<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 577" width="900" height="577" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="577" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From "symbolizes" to analysis</text>

<rect x="30" y="110" width="840" height="91" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="143" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">NAMES A TECHNIQUE ONLY</text><text x="50" y="175.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"The gate is a symbol."</text><text x="850" y="143" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">no meaning, no function</text><line x1="120" y1="205" x2="120" y2="235" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="90" y="241" width="780" height="91" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="110" y="274" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">STATES A MEANING THAT FITS THE EVIDENCE</text><text x="110" y="306.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"The gate, tied to the autumn her father died, represents grief she has locked away."</text><text x="850" y="274" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">meaning, but no function yet</text><line x1="180" y1="336" x2="180" y2="366" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="150" y="372" width="720" height="139" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="170" y="405" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXPLAINS THE FUNCTION</text><text x="170" y="437.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"Having the storm remove the gate lets the narrator mark Eleanor's release as</text><text x="170" y="461.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">something that comes unbidden, so that her relief seems both surprising and</text><text x="170" y="485.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">earned."</text><text x="850" y="405" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">evidence + idea + function</text><text x="30" y="551" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Weaker claims point at a technique; stronger claims say what it does.</text>
</svg>