<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 536" width="900" height="536" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="536" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Symbols in four classics</text>

<rect x="30" y="110" width="840" height="50" rx="10" fill="#1e2a44"/><text x="44" y="141" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Work</text><text x="219" y="141" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Symbol</text><text x="424" y="141" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Literal</text><text x="644" y="141" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Comes to stand for</text><rect x="30" y="160" width="840" height="92" fill="#f8faf9" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="188.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Macbeth</text><text x="219" y="188.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Blood on the hands</text><line x1="205" y1="160" x2="205" y2="252" stroke="#c9d6d4" stroke-width="2"/><text x="424" y="188.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A stain: "Will all</text><text x="424" y="210.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">great Neptune's ocean</text><text x="424" y="232.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">wash this blood..."</text><line x1="410" y1="160" x2="410" y2="252" stroke="#c9d6d4" stroke-width="2"/><text x="644" y="188.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Guilt that cannot be</text><text x="644" y="210.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">removed; returns in the</text><text x="644" y="232.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">sleepwalking</text><line x1="630" y1="160" x2="630" y2="252" stroke="#c9d6d4" stroke-width="2"/><rect x="30" y="252" width="840" height="92" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="280.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Jane Eyre</text><text x="219" y="280.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The chestnut tree</text><line x1="205" y1="252" x2="205" y2="344" stroke="#c9d6d4" stroke-width="2"/><text x="424" y="280.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Split by lightning the</text><text x="424" y="302.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">night Rochester</text><text x="424" y="324.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">proposes</text><line x1="410" y1="252" x2="410" y2="344" stroke="#c9d6d4" stroke-width="2"/><text x="644" y="280.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A sign that the union is</text><text x="644" y="302.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">threatened</text><line x1="630" y1="252" x2="630" y2="344" stroke="#c9d6d4" stroke-width="2"/><rect x="30" y="344" width="840" height="70" fill="#f8faf9" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="372.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">The Scarlet</text><text x="44" y="394.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Letter</text><text x="219" y="372.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The letter Hester</text><text x="219" y="394.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">wears</text><line x1="205" y1="344" x2="205" y2="414" stroke="#c9d6d4" stroke-width="2"/><text x="424" y="372.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A public mark of shame</text><line x1="410" y1="344" x2="410" y2="414" stroke="#c9d6d4" stroke-width="2"/><text x="644" y="372.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A contested meaning that</text><text x="644" y="394.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">shifts as others read it</text><line x1="630" y1="344" x2="630" y2="414" stroke="#c9d6d4" stroke-width="2"/><rect x="30" y="414" width="840" height="92" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="442.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Great</text><text x="44" y="464.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Expectations</text><text x="219" y="442.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Miss Havisham (a</text><text x="219" y="464.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">character)</text><line x1="205" y1="414" x2="205" y2="506" stroke="#c9d6d4" stroke-width="2"/><text x="424" y="442.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Stops the clocks at</text><text x="424" y="464.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the moment she was</text><text x="424" y="486.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">jilted</text><line x1="410" y1="414" x2="410" y2="506" stroke="#c9d6d4" stroke-width="2"/><text x="644" y="442.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A refusal to let time</text><text x="644" y="464.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">move</text><line x1="630" y1="414" x2="630" y2="506" stroke="#c9d6d4" stroke-width="2"/>
</svg>