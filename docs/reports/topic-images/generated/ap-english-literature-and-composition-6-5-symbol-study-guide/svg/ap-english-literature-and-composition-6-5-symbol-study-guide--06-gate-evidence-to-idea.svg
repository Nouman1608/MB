<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 765" width="900" height="765" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="765" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: the orchard gate</text>

<text x="270" y="126" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle">Evidence in the passage</text><text x="690" y="126" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle">What it shows</text><rect x="120" y="142" width="300" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="136" y="176.1" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"since the autumn Papa died";</text><text x="136" y="198.1" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">she walks "the long way round";</text><text x="136" y="220.1" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"Spring after spring"</text><line x1="424" y1="193.5" x2="482" y2="193.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="490" y="142" width="380" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="506" y="171" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NOTICE</text><text x="506" y="202.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The gate is dated, avoided and kept in</text><text x="506" y="224.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">view: more than a gate</text><circle cx="70" cy="193.5" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="201.42" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="120" y="259" width="300" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="136" y="304.1" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">blossom "climbed the wall and</text><text x="136" y="326.1" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">spilled over the top"</text><line x1="424" y1="310.5" x2="482" y2="310.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="490" y="259" width="380" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="506" y="288" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ASSOCIATE</text><text x="506" y="319.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Tied to the father's death and</text><text x="506" y="341.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">avoidance; life pressing on an enclosure</text><circle cx="70" cy="310.5" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="318.42" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="490" y="376" width="380" height="103" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="506" y="405" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STATE</text><text x="506" y="436.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The locked gate stands for Eleanor's</text><text x="506" y="458.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">sealed-off grief</text><circle cx="70" cy="427.5" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="70" y="435.42" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="120" y="493" width="300" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="136" y="527.1" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">the key in her palm "as though</text><text x="136" y="549.1" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">it were something that might</text><text x="136" y="571.1" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">wake"</text><line x1="424" y1="544.5" x2="482" y2="544.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="490" y="493" width="380" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="506" y="522" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TRACE THE SHIFT</text><text x="506" y="553.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Her first step from avoidance to</text><text x="506" y="575.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">confrontation</text><circle cx="70" cy="544.5" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="552.42" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="490" y="610" width="380" height="125" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="506" y="639" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FUNCTION</text><text x="506" y="670.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A private emotion becomes something</text><text x="506" y="692.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">seen, walked round and approached; it</text><text x="506" y="714.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">marks stages of change</text><circle cx="70" cy="672.5" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="680.42" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text>
</svg>