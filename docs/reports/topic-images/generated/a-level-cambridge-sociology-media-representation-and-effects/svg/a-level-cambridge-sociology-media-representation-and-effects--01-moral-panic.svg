<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 961" width="900" height="961" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="961" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How a moral panic develops</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Cohen, Folk Devils and Moral Panics (1972): Mods and Rockers, 1964</text>
<rect x="30" y="120" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="168" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="175.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="104" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">An event involving a group</text><text x="104" y="189.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Mods and Rockers in English seaside towns.</text><line x1="450" y1="220" x2="450" y2="256" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="262" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="310" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="317.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="104" y="301.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Exaggerated, sensational reporting</text><text x="104" y="331.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The media distort and dramatise what happened.</text><line x1="450" y1="362" x2="450" y2="398" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="404" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="452" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="459.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="104" y="443.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Folk devils</text><text x="104" y="473.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The group is labelled as a threat to society.</text><line x1="450" y1="504" x2="450" y2="540" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="546" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="594" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="601.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="104" y="585.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Public concern</text><text x="104" y="615.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The reporting provokes widespread concern.</text><line x1="450" y1="646" x2="450" y2="682" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="688" width="840" height="96" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="67" cy="736" r="21" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="67" y="743.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="104" y="727.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Harsher control</text><text x="104" y="757.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The reaction leads to tighter control of the group.</text><rect x="30" y="802" width="840" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="838" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Targets can be any group</text><text x="56" y="867" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Class (welfare claimants), gender (single mothers), ethnicity (migrants), age (youth</text><text x="56" y="889" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">subcultures, online gaming). Hall et al. (1978) linked a panic about “mugging” to the</text><text x="56" y="911" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">racialisation of crime and a crisis of hegemony.</text>
</svg>