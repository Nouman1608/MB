<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 663" width="900" height="663" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="663" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Encoding and decoding</text>

<rect x="30" y="250" width="200" height="90" rx="14" fill="#1e2a44"/><text x="130" y="290" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Producers</text><text x="130" y="316" font-size="16" font-weight="400" fill="#ffffff" text-anchor="middle">encode a meaning</text><line x1="234" y1="295" x2="294" y2="295" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="300" y="250" width="200" height="90" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="400" y="290" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">One programme</text><text x="400" y="316" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">the same text</text><line x1="504" y1="295" x2="580" y2="165" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="586" y="120" width="284" height="90" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="728" y="158" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Dominant reading</text><text x="728" y="184" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">accepts the intended meaning</text><line x1="504" y1="295" x2="580" y2="295" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="586" y="250" width="284" height="90" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="728" y="288" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Negotiated reading</text><text x="728" y="314" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">accepts it in part</text><line x1="504" y1="295" x2="580" y2="425" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="586" y="380" width="284" height="90" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="728" y="418" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Oppositional reading</text><text x="728" y="444" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">rejects it</text><text x="728" y="500" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">audiences decode</text><rect x="30" y="528" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="564" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evidence</text><text x="56" y="593" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Hall (1973) and Morley’s The Nationwide Audience (1980): audiences read the same programme</text><text x="56" y="615" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">in different ways, supporting active-audience views.</text>
</svg>