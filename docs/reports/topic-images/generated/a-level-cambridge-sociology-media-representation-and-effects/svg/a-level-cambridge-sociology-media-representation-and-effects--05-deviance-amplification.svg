<circle cx="450" cy="360" r="175" fill="none" stroke="#c9d6d4" stroke-width="2"/><path d="M551.6811530940283,217.57127008405658 A175,175 0 0 1 613.7819441436386,298.35200917685927" fill="none" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><path d="M617.1838855969811,411.7160361657344 A175,175 0 0 1 560.038779203232,496.0752257814124" fill="none" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><path d="M348.3188469059716,502.42872991594345 A175,175 0 0 1 286.2180558563614,421.64799082314073" fill="none" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><path d="M282.8161144030189,308.28396383426565 A175,175 0 0 1 339.96122079676803,223.9247742185876" fill="none" stroke="#b5602e" stroke-width="6" marker-end="url(#ahR)"/><rect x="355" y="155" width="190" height="60" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="450" y="192" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Deviance</text><rect x="530" y="330" width="190" height="60" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="625" y="367" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Media attention</text><rect x="355" y="505" width="190" height="60" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="450" y="542" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Police reaction</text><rect x="180" y="330" width="190" height="60" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="275" y="367" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">More deviance</text><text x="450" y="354" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">Each turn</text><text x="450" y="380" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">is bigger</text><text x="450" y="128" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Wilkins (1964); Young, The Drugtakers (1971)</text><rect x="30" y="594" width="269.3333333333333" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,644 L31.25,608.25 Q31.25,595.25 44.25,595.25 L285.0833333333333,595.25 Q298.0833333333333,595.25 298.0833333333333,608.25 L298.0833333333333,644 Z" fill="#dce9e7"/><line x1="31.25" y1="644" x2="298.0833333333333" y2="644" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="624.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Moral panics</text><text x="44" y="675.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cohen (1972); Hall et al.</text><text x="44" y="696.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1978).</text><rect x="315.3333333333333" y="594" width="269.3333333333333" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,644 L316.5833333333333,608.25 Q316.5833333333333,595.25 329.5833333333333,595.25 L570.4166666666666,595.25 Q583.4166666666666,595.25 583.4166666666666,608.25 L583.4166666666666,644 Z" fill="#dce9e7"/><line x1="316.5833333333333" y1="644" x2="583.4166666666666" y2="644" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="624.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Copycat crime</text><text x="329.3333333333333" y="675.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Offending may be glamorised</text><text x="329.3333333333333" y="696.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and imitated.</text><rect x="600.6666666666666" y="594" width="269.3333333333333" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,644 L601.9166666666666,608.25 Q601.9166666666666,595.25 614.9166666666666,595.25 L855.75,595.25 Q868.75,595.25 868.75,608.25 L868.75,644 Z" fill="#dce9e7"/><line x1="601.9166666666666" y1="644" x2="868.75" y2="644" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="624.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Fear of crime</text><text x="614.6666666666666" y="675.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Gerbner: heavy viewers</text><text x="614.6666666666666" y="696.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">overestimate their risk of</text><text x="614.6666666666666" y="717.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">victimisation.</text>
