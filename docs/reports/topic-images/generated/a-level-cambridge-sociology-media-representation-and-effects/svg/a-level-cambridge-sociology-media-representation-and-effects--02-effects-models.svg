fill="#1e2a44"/><text x="523" y="261" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Media</text><line x1="570" y1="255" x2="630" y2="255" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><circle cx="655" cy="255" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="655" y="300" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">opinion</text><text x="655" y="318" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">leader</text><line x1="678" y1="255" x2="780" y2="210" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><circle cx="800" cy="210" r="13" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><line x1="678" y1="255" x2="780" y2="255" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><circle cx="800" cy="255" r="13" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><line x1="678" y1="255" x2="780" y2="300" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><circle cx="800" cy="300" r="13" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="482" y="358" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Opinion leaders interpret messages for</text><text x="482" y="379" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">others. Katz and Lazarsfeld (1955).</text><rect x="30" y="440" width="410" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="478" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Uses and gratifications</text><text x="52" y="502" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">active audience</text><circle cx="100" cy="595" r="24" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="100" y="640" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">active user</text><line x1="130" y1="595" x2="230" y2="535" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><rect x="235" y="520" width="170" height="30" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="320" y="541" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">diversion</text><line x1="130" y1="595" x2="230" y2="571" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><rect x="235" y="556" width="170" height="30" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="320" y="577" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">relationships</text><line x1="130" y1="595" x2="230" y2="607" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><rect x="235" y="592" width="170" height="30" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="320" y="613" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">identity</text><line x1="130" y1="595" x2="230" y2="643" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><rect x="235" y="628" width="170" height="30" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="320" y="649" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">surveillance</text><text x="52" y="688" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Audiences use media to meet needs. Blumler</text><text x="52" y="709" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and McQuail (1968).</text><rect x="460" y="440" width="410" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="482" y="478" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Cultural effects</text><text x="482" y="502" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">slow, long-term</text><rect x="480" y="525" width="86" height="50" rx="8" fill="#1e2a44"/><text x="523" y="556" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Media</text><circle cx="590" cy="550" r="7" fill="#8a6d0d"/><circle cx="628" cy="550" r="7" fill="#8a6d0d"/><circle cx="666" cy="550" r="7" fill="#8a6d0d"/><circle cx="704" cy="550" r="7" fill="#8a6d0d"/><circle cx="742" cy="550" r="7" fill="#8a6d0d"/><circle cx="780" cy="550" r="7" fill="#8a6d0d"/><line x1="590" y1="590" x2="820" y2="590" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><text x="705" y="615" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="middle">repeated messages over time</text><rect x="570" y="630" width="270" height="34" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="705" y="653" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">attitudes and “common sense”</text><text x="482" y="688" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Repeated messages shape attitudes. Gerbner;</text><text x="482" y="709" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Glasgow University Media Group.</text><rect x="30" y="770" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="806" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Normative model</text><text x="56" y="835" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Media shape norms of what is acceptable, especially where other socialising agencies are</text><text x="56" y="857" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">weak.</text>
