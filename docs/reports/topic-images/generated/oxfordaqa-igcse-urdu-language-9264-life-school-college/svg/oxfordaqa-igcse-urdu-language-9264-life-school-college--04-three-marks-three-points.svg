<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 656" width="900" height="656" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="656" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Permission with a condition</text>

<text x="450" y="128" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Are students allowed to bring mobile phones to school? Explain your answer. [3]</text><rect x="30" y="150" width="840" height="116" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="184" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Yes, they are allowed</text><text x="846" y="184" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="end">[1]</text><text x="52" y="242" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">permission</text><text x="846" y="238" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏ہمارے اسکول میں موبائل فون لانے کی اجازت ہے،‏</text><rect x="30" y="280" width="840" height="116" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="314" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">But they must hand them in</text><text x="846" y="314" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="end">[1]</text><text x="52" y="372" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">but ... have to</text><text x="846" y="368" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏لیکن انہیں صبح دفتر میں جمع کرانا پڑتا ہے۔‏</text><rect x="30" y="410" width="840" height="116" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="444" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">They get them back at the end of the day</text><text x="846" y="444" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="end">[1]</text><text x="52" y="502" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">not "in the holidays"</text><text x="846" y="498" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏چھٹی کے وقت طلبہ اپنے فون واپس لے لیتے ہیں۔‏</text><rect x="30" y="548" width="840" height="80" rx="12" fill="#f6ece4" stroke="#b5602e" stroke-width="2.5"/><text x="52" y="582" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">A bare "yes" earns one mark at most:</text><text x="52" y="610" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">"explain" and three marks signal three points</text><text x="846" y="600" font-family="Noto Nastaliq Urdu" font-size="30" font-weight="400" fill="#2e6b62" text-anchor="end">‏چھٹی‏</text><text x="770" y="592" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">holiday or end of the day?</text><text x="770" y="612" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">decide from context</text>
</svg>