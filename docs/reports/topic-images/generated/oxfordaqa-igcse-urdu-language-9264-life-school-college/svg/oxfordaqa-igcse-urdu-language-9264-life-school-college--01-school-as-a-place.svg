<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Life at school: the place, not the subjects</text>

<rect x="30" y="110" width="840" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="150" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Facilities</text><text x="52" y="180" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">library, laboratories, sports</text><text x="52" y="201" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">field, canteen</text><rect x="704" y="126" width="150" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="779" y="172" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏لائبریری‏</text><text x="779" y="210" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">library</text><rect x="546" y="126" width="150" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="621" y="172" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏لیبارٹری‏</text><text x="621" y="210" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">laboratory</text><rect x="388" y="126" width="150" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="463" y="172" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏کینٹین‏</text><text x="463" y="210" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">canteen</text><rect x="30" y="256" width="840" height="132" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="296" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Uniform and rules</text><text x="52" y="326" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">what you must and must not do;</text><text x="52" y="347" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">are they fair?</text><rect x="704" y="272" width="150" height="100" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="779" y="318" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏وردی / یونیفارم‏</text><text x="779" y="356" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">uniform</text><rect x="546" y="272" width="150" height="100" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="621" y="318" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏اصول / قواعد‏</text><text x="621" y="356" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">rules</text><rect x="388" y="272" width="150" height="100" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="463" y="318" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏اجازت‏</text><text x="463" y="356" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">permission</text><rect x="30" y="402" width="840" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="442" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Routine</text><text x="52" y="472" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">start and end of the day,</text><text x="52" y="493" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">assembly, breaks</text><rect x="704" y="418" width="150" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="779" y="464" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏اسمبلی‏</text><text x="779" y="502" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">assembly</text><rect x="546" y="418" width="150" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="621" y="464" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏وقفہ‏</text><text x="621" y="502" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">break</text><rect x="388" y="418" width="150" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="463" y="464" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏حاضری‏</text><text x="463" y="502" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">attendance</text><rect x="30" y="548" width="840" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="588" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">School life</text><text x="52" y="618" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">clubs, trips, sports day,</text><text x="52" y="639" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">comparing schools</text><rect x="704" y="564" width="150" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="779" y="610" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏کلب‏</text><text x="779" y="648" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">club</text><rect x="546" y="564" width="150" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="621" y="610" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏تعلیمی دورہ‏</text><text x="621" y="648" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">school trip</text><rect x="388" y="564" width="150" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="463" y="610" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="middle">‏کھیلوں کا دن‏</text><text x="463" y="648" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">sports day</text><rect x="30" y="698" width="840" height="52" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="450" y="731" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Subjects and your opinions of them belong to Topic 1, My studies</text>
