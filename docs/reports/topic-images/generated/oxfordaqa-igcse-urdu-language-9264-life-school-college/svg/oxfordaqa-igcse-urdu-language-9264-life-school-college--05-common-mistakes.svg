<rect width="900" height="660" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three slips to check</text>

<rect x="30" y="110" width="840" height="164" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The person needs the oblique form: us, not we</text><rect x="52" y="166" width="380" height="90" rx="10" fill="#f6ece4" stroke="#b5602e" stroke-width="2"/><circle cx="80" cy="211" r="15" fill="#f6ece4" stroke="#b5602e" stroke-width="2.5"/><path d="M74,205 l12,12 m0,-12 l-12,12" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="416" y="222" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#b5602e" text-anchor="end">‏ہم وردی پہننی پڑتی ہے‏</text><line x1="440" y1="211" x2="462" y2="211" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="468" y="166" width="380" height="90" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><circle cx="496" cy="211" r="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M489,211 l5,6 l10,-12" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="832" y="222" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏ہمیں وردی پہننی پڑتی ہے۔‏</text><rect x="30" y="288" width="840" height="164" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="324" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Oblique infinitive before the permission phrase</text><rect x="52" y="344" width="380" height="90" rx="10" fill="#f6ece4" stroke="#b5602e" stroke-width="2"/><circle cx="80" cy="389" r="15" fill="#f6ece4" stroke="#b5602e" stroke-width="2.5"/><path d="M74,383 l12,12 m0,-12 l-12,12" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="416" y="400" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#b5602e" text-anchor="end">‏استعمال کرنا کی اجازت‏</text><line x1="440" y1="389" x2="462" y2="389" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="468" y="344" width="380" height="90" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><circle cx="496" cy="389" r="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M489,389 l5,6 l10,-12" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="832" y="400" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏استعمال کرنے کی اجازت‏</text><rect x="30" y="466" width="840" height="164" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="502" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Going takes no ergative</text><rect x="52" y="522" width="380" height="90" rx="10" fill="#f6ece4" stroke="#b5602e" stroke-width="2"/><circle cx="80" cy="567" r="15" fill="#f6ece4" stroke="#b5602e" stroke-width="2.5"/><path d="M74,561 l12,12 m0,-12 l-12,12" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="416" y="578" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#b5602e" text-anchor="end">‏ہماری جماعت نے عجائب گھر گئی‏</text><line x1="440" y1="567" x2="462" y2="567" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="468" y="522" width="380" height="90" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><circle cx="496" cy="567" r="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M489,567 l5,6 l10,-12" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="832" y="578" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏ہماری جماعت عجائب گھر گئی‏</text>
</svg>