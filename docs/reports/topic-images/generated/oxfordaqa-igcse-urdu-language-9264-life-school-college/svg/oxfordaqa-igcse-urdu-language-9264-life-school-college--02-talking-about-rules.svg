<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 730" width="900" height="730" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="730" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four ways to talk about rules</text>

<rect x="30" y="110" width="840" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="148" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Have to</text><text x="360" y="152" font-family="Noto Nastaliq Urdu" font-size="22" font-weight="400" fill="#2e6b62" text-anchor="middle">‏ہمیں ... پڑنا‏</text><text x="480" y="148" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">agrees with a feminine object</text><text x="846" y="198" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏ہمیں وردی پہننی پڑتی ہے۔‏</text><text x="846" y="234" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">We have to wear a uniform.</text><rect x="30" y="262" width="840" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="300" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Not allowed</text><text x="360" y="304" font-family="Noto Nastaliq Urdu" font-size="22" font-weight="400" fill="#2e6b62" text-anchor="middle">‏کی اجازت نہیں ہے‏</text><text x="480" y="300" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">oblique infinitive before it</text><text x="846" y="350" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏کلاس میں موبائل فون استعمال کرنے کی اجازت نہیں ہے۔‏</text><text x="846" y="386" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Using mobile phones in class is not allowed.</text><rect x="30" y="414" width="840" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="452" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Should</text><text x="360" y="456" font-family="Noto Nastaliq Urdu" font-size="22" font-weight="400" fill="#2e6b62" text-anchor="middle">‏کو ... چاہیے‏</text><text x="846" y="502" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏طلبہ کو ایک دوسرے کی عزت کرنی چاہیے۔‏</text><text x="846" y="538" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Students should respect one another.</text><rect x="30" y="566" width="840" height="140" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="604" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Judging a rule</text><text x="360" y="608" font-family="Noto Nastaliq Urdu" font-size="22" font-weight="400" fill="#2e6b62" text-anchor="middle">‏مناسب / غیر منصفانہ‏</text><text x="480" y="604" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reasonable / unfair</text><text x="846" y="654" font-family="Noto Nastaliq Urdu" font-size="24" font-weight="400" fill="#1e2a44" text-anchor="end">‏میرے خیال میں یہ اصول مناسب ہے کیونکہ ...‏</text><text x="846" y="690" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">I think this rule is reasonable because ...</text>
</svg>