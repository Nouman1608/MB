<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 634" width="900" height="634" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="634" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Effects of migration, and what can be done</text>

<rect x="30" y="112" width="410" height="179" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Effects in cities</text><text x="48" y="174.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="174.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Shanty settlements (katchi abadis): poor</text><text x="64" y="196.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">housing, little clean water or sanitation</text><text x="48" y="221.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="221.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Congestion and pollution</text><text x="48" y="246.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="246.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Tent cities when refugees arrive or after</text><text x="64" y="268.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">floods and earthquakes</text><rect x="460" y="112" width="410" height="179" rx="12" fill="#e3ecd6" stroke="#6f9a52" stroke-width="2.5"/><text x="478" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Effects in rural areas</text><text x="478" y="174.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="174.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Depopulation</text><text x="478" y="199.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="199.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Loss of young workers</text><text x="478" y="224.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="224.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">But income from remittances</text><line x1="235" y1="297" x2="235" y2="325" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="260" y="317" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">SOLUTIONS</text><rect x="30" y="331" width="266" height="147" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="364" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Self-help schemes</text><text x="48" y="392.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Residents build their own</text><text x="48" y="413.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sewers and improve homes,</text><text x="48" y="434.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">e.g. the Orangi Pilot Project,</text><text x="48" y="455.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Karachi</text><rect x="317" y="331" width="266" height="147" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="335" y="364" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Services</text><text x="335" y="392.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Standpipes, clean water and</text><text x="335" y="413.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">services</text><rect x="604" y="331" width="266" height="147" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="622" y="364" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Upgrading</text><text x="622" y="392.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Improve katchi abadis rather</text><text x="622" y="413.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">than demolish them</text><rect x="30" y="498" width="840" height="106" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="530.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">But…</text><text x="48" y="559.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Evaluate: upgrading can encourage more migration, and poorly planned schemes may still leave bad</text><text x="48" y="581.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">housing.</text>
</svg>