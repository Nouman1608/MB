<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 658" width="900" height="658" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="658" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How the workforce is employed</text>

<rect x="30" y="112" width="270" height="192" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="146.7" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Primary</text><text x="48" y="171.75" font-size="15" font-weight="600" fill="#4a5568" text-anchor="start">farming, fishing, mining</text><text x="48" y="199.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Largest single share, but</text><text x="48" y="221.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">falling</text><text x="276" y="286" font-size="40" font-weight="700" fill="#8a6d0d" text-anchor="end">↘</text><rect x="315" y="112" width="270" height="192" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="333" y="146.7" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Secondary</text><text x="333" y="171.75" font-size="15" font-weight="600" fill="#4a5568" text-anchor="start">manufacturing, construction</text><text x="333" y="199.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Has grown with industry</text><text x="561" y="286" font-size="40" font-weight="700" fill="#2e6b62" text-anchor="end">↗</text><rect x="600" y="112" width="270" height="192" rx="12" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="618" y="146.7" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Tertiary</text><text x="618" y="171.75" font-size="15" font-weight="600" fill="#4a5568" text-anchor="start">trade, transport, government,</text><text x="618" y="191.75" font-size="15" font-weight="600" fill="#4a5568" text-anchor="start">education, health</text><text x="618" y="219.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Growing fastest, in the cities</text><text x="846" y="286" font-size="40" font-weight="700" fill="#2e6b62" text-anchor="end">⇈</text><rect x="30" y="334" width="410" height="129" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="367" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Unemployment</text><text x="48" y="396.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Having no job.</text><rect x="460" y="334" width="410" height="129" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="367" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Underemployment</text><text x="478" y="396.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Not having enough work: farm labourers idle</text><text x="478" y="418.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">outside planting and harvest, or street vendors</text><text x="478" y="440.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">earning very little.</text><rect x="30" y="479" width="840" height="54" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="513" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Both reduce GNP and GDP: people produce less than they could</text><rect x="30" y="553" width="840" height="75" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="583.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Plenty of manual labour, but a shortage of skilled labour: raising literacy, technical training and</text><text x="48" y="605.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">female education is central to development.</text>
</svg>