<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 651" width="900" height="651" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="651" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Push and pull: why people move</text>

<rect x="30" y="112" width="300" height="270" rx="12" fill="#e3ecd6" stroke="#6f9a52" stroke-width="2.5"/><rect x="570" y="112" width="300" height="270" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="180" y="152" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Rural area</text><text x="720" y="152" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">City</text><text x="50" y="192" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">PUSH</text><text x="50" y="222" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• Few jobs, low wages</text><text x="50" y="248" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• Landlessness</text><text x="50" y="274" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• Poor services</text><text x="50" y="300" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• Floods</text><text x="590" y="192" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">PULL</text><text x="590" y="222" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• Jobs in industry and</text><text x="605" y="248" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">services</text><text x="590" y="274" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• Schools, hospitals</text><text x="590" y="300" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• Bright lights</text><line x1="340" y1="262" x2="560" y2="262" stroke="#8a6d0d" stroke-width="10" marker-end="url(#ahO)"/><text x="450" y="246" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">migrants</text><line x1="560" y1="322" x2="340" y2="322" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)" stroke-dasharray="10 7"/><text x="450" y="308" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">remittances</text><text x="450" y="348" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">money sent home</text><rect x="30" y="412" width="840" height="209" rx="12" fill="#ffffff"/><path d="M30,456 L30,424 Q30,412 42,412 L858,412 Q870,412 870,424 L870,456 Z" fill="#b5d3cf"/><rect x="30" y="456" width="840" height="62" fill="#ffffff"/><text x="42" y="481.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Seasonal</text><text x="272" y="481.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Little farm work in the slack season;</text><text x="272" y="502.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">winter snow in the mountains</text><text x="572" y="481.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Harvest work on the plains; urban</text><text x="572" y="502.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">jobs in winter</text><line x1="30" y1="456" x2="870" y2="456" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="518" width="840" height="62" fill="#dce9e7"/><text x="42" y="543.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Emigration</text><text x="272" y="543.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Unemployment, low pay</text><text x="572" y="543.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">High wages in the Gulf states, the UK</text><text x="572" y="564.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and elsewhere</text><line x1="30" y1="518" x2="870" y2="518" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="580" width="840" height="41" fill="#ffffff"/><text x="42" y="605.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Immigration and refugees</text><text x="272" y="605.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Conflict in neighbouring countries</text><text x="572" y="605.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Safety, family links</text><line x1="30" y1="580" x2="870" y2="580" stroke="#c9d6d4" stroke-width="1.5"/><line x1="260" y1="412" x2="260" y2="621" stroke="#c9d6d4" stroke-width="1.5"/><line x1="560" y1="412" x2="560" y2="621" stroke="#c9d6d4" stroke-width="1.5"/><text x="42" y="441.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Other movements</text><text x="272" y="441.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Push</text><text x="572" y="441.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Pull</text><rect x="30" y="412" width="840" height="209" rx="12" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>