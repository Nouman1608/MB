<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 416" width="900" height="416" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="416" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A young population: two possible outcomes</text>

<rect x="30" y="112" width="840" height="107" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A young population</text><text x="48" y="174.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">High dependency: heavy demand for schools, health care and food, and a fast-growing labour force</text><text x="48" y="196.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">that needs jobs.</text><path d="M450,221 L450,249 L235,249 L235,273" fill="none" stroke="#1e2a44" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><path d="M450,249 L665,249 L665,273" fill="none" stroke="#1e2a44" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="30" y="279" width="410" height="107" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="312" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">If jobs are created</text><text x="48" y="341.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A large working-age population can boost</text><text x="48" y="363.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">output.</text><rect x="460" y="279" width="410" height="107" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="478" y="312" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">If jobs are not created</text><text x="478" y="341.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Unemployment rises.</text>
</svg>