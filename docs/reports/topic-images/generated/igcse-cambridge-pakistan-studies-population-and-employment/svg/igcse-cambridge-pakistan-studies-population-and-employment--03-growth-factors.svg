<rect width="900" height="697" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why Pakistan’s population grows quickly</text>

<rect x="170" y="112" width="560" height="56" rx="28" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Natural increase = birth rate − death rate</text><rect x="30" y="196" width="156" height="139" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="226.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Social</text><text x="48" y="252.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Early marriage;</text><text x="48" y="272.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">large families;</text><text x="48" y="292.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">sons as old-age</text><text x="48" y="312.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">support</text><rect x="201" y="196" width="156" height="139" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="219" y="226.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Educational</text><text x="219" y="252.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Low female</text><text x="219" y="272.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">literacy; limited</text><text x="219" y="292.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">family-planning</text><text x="219" y="312.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">awareness</text><rect x="372" y="196" width="156" height="139" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="390" y="226.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Economic</text><text x="390" y="252.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Children add</text><text x="390" y="272.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">family income</text><rect x="543" y="196" width="156" height="139" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="561" y="226.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Political</text><text x="561" y="252.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Uneven funding</text><text x="561" y="272.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">and reach of</text><text x="561" y="292.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">family planning</text><rect x="714" y="196" width="156" height="139" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="732" y="226.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Health</text><text x="732" y="252.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Better care and</text><text x="732" y="272.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">vaccination</text><text x="732" y="292.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">lower the death</text><text x="732" y="312.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">rate</text><line x1="450" y1="341" x2="450" y2="379" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="250" y="385" width="400" height="56" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="421" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Rapid population growth</text><path d="M350,443 L350,463 L235,463 L235,479" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahR)"/><path d="M550,443 L550,463 L665,463 L665,479" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><rect x="30" y="485" width="410" height="182" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="518" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Problems</text><text x="48" y="547.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="547.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Pressure on food, water, housing, schools,</text><text x="64" y="569.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">hospitals and jobs</text><text x="48" y="594.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="594.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Growth of slums</text><text x="48" y="619.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64" y="619.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Environmental damage</text><rect x="460" y="485" width="410" height="182" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="518" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Solutions</text><text x="478" y="547.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="547.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Female education</text><text x="478" y="572.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="572.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Family planning services</text><text x="478" y="597.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="597.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Better health care to reduce infant deaths</text><text x="478" y="622.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494" y="622.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Economic development that reduces the</text><text x="494" y="644.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">need for large families</text>
</svg>