<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 775" width="900" height="775" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="775" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two cross-sections to learn</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Schematic, not to scale</text>
<rect x="30" y="110" width="840" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Across a meander bend (A–B)</text><rect x="690" y="125" width="160" height="120" rx="8" fill="#d8e3c6"/><path d="M710,240 Q710,158 770,158 Q830,158 830,240" fill="none" stroke="#2b5a9a" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" /><line x1="770" y1="134" x2="770" y2="196" stroke="#1e2a44" stroke-width="2" stroke-dasharray="5 4"/><text x="756" y="146" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">A</text><text x="756" y="198" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">B</text><text x="770" y="262" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">plan view</text><path d="M60,200 L170,200 L180,350 Q260,360 340,310 Q450,250 560,210 L640,200 L640,385 L60,385 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><path d="M180,222 L180,350 Q260,360 340,310 Q420,260 480,222 Z" fill="#b5d3cf"/><line x1="180" y1="222" x2="480" y2="222" stroke="#2e6b62" stroke-width="2.5"/><path d="M340,310 Q450,250 560,210 L480,222 Q420,260 340,310 Z" fill="#efdfa8"/><line x1="250" y1="270" x2="195" y2="270" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><rect x="206" y="287.75" width="156" height="20.25" rx="5" fill="#b5d3cf" opacity="1"/><text x="212" y="302" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">fastest, deepest</text><text x="80" y="188" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">A</text><text x="625" y="188" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">B</text><rect x="64" y="225.75" width="120" height="20.25" rx="5" fill="#cbbf9f" opacity="1"/><text x="70" y="240" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">river cliff:</text><rect x="64" y="244.75" width="69.75" height="20.25" rx="5" fill="#cbbf9f" opacity="1"/><text x="70" y="259" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">erosion</text><rect x="494" y="255.75" width="147" height="20.25" rx="5" fill="#cbbf9f" opacity="1"/><text x="500" y="270" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">slip-off slope:</text><rect x="494" y="274.75" width="94.5" height="20.25" rx="5" fill="#cbbf9f" opacity="1"/><text x="500" y="289" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">deposition</text><rect x="30" y="426" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="464" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Flood plain and levées</text><line x1="60" y1="550" x2="840" y2="550" stroke="#2b5a9a" stroke-width="2.5" stroke-dasharray="10 7"/><text x="835" y="540" font-size="15" font-weight="600" fill="#2b5a9a" text-anchor="end">flood water spreads out</text><rect x="60" y="640" width="780" height="70" fill="#cbbf9f"/><path d="M60,640 L330,634 Q370,628 390,612 L400,612 L405,680 L495,680 L500,612 L510,612 Q530,628 570,634 L840,640 L840,644 L60,644 Z" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><path d="M300,638 Q360,632 390,612 L400,612 L400,640 Z M600,638 Q540,632 510,612 L500,612 L500,640 Z" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.5"/><rect x="405" y="620" width="90" height="60" fill="#b5d3cf"/><rect x="344" y="575.75" width="57" height="20.25" rx="5" fill="#ffffff" opacity="1"/><text x="395" y="590" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="end">levée</text><rect x="499" y="575.75" width="57" height="20.25" rx="5" fill="#ffffff" opacity="1"/><text x="505" y="590" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">levée</text><rect x="74" y="659.75" width="336" height="20.25" rx="5" fill="#cbbf9f" opacity="1"/><text x="80" y="674" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">fine silt (alluvium) carried further</text><rect x="670" y="659.75" width="156" height="20.25" rx="5" fill="#cbbf9f" opacity="1"/><text x="820" y="674" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="end">flat flood plain</text><text x="55" y="495" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Water leaving the channel loses energy at once: the coarsest material drops on the banks,</text><text x="55" y="516" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">finer silt further away. Repeated floods build levées.</text>
</svg>