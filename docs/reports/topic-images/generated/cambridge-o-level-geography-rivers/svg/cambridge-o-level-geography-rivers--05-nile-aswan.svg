cle cx="246" cy="340" r="3.5" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1"/><circle cx="264" cy="332" r="3.5" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1"/><circle cx="282" cy="348" r="3.5" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1"/><circle cx="300" cy="340" r="3.5" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1"/><circle cx="318" cy="332" r="3.5" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1"/><path d="M430,342 l-5,-20 M430,342 l0,-24 M430,342 l5,-20" fill="none" stroke="#6f9a52" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" /><path d="M470,342 l-5,-20 M470,342 l0,-24 M470,342 l5,-20" fill="none" stroke="#6f9a52" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" /><path d="M520,342 l-5,-20 M520,342 l0,-24 M520,342 l5,-20" fill="none" stroke="#6f9a52" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" /><path d="M570,342 l-5,-20 M570,342 l0,-24 M570,342 l5,-20" fill="none" stroke="#6f9a52" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" /><path d="M620,342 l-5,-20 M620,342 l0,-24 M620,342 l5,-20" fill="none" stroke="#6f9a52" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" /><path d="M670,342 l-5,-20 M670,342 l0,-24 M670,342 l5,-20" fill="none" stroke="#6f9a52" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" /><line x1="364" y1="230" x2="420" y2="190" stroke="#1e2a44" stroke-width="2.5"/><path d="M420,190 l8,-12 l-2,10 l8,-2 l-10,14" fill="none" stroke="#d4b02e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><rect x="54" y="259.8" width="117.6" height="21.6" rx="5" fill="#b5d3cf" opacity="1"/><text x="60" y="275" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Lake Nasser</text><rect x="54" y="321.225" width="116.39999999999999" height="19.575000000000003" rx="5" fill="#b5d3cf" opacity="1"/><text x="60" y="335" font-size="14.5" font-weight="700" fill="#9c8f6e" text-anchor="start">silt trapped</text><rect x="243.35000000000002" y="190.275" width="207.29999999999998" height="20.925" rx="5" fill="#ffffff" opacity="0.92"/><text x="347" y="205" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="middle">Aswan High Dam (1970)</text><rect x="424" y="166.225" width="186" height="19.575000000000003" rx="5" fill="#ffffff" opacity="0.92"/><text x="430" y="180" font-size="14.5" font-weight="700" fill="#1e2a44" text-anchor="start">hydro-electric power</text><rect x="446.35" y="285.275" width="207.29999999999998" height="20.925" rx="5" fill="#ffffff" opacity="0.92"/><text x="550" y="300" font-size="15.5" font-weight="700" fill="#6f9a52" text-anchor="middle">year-round irrigation</text><rect x="656.3" y="306.225" width="194.7" height="19.575000000000003" rx="5" fill="#ffffff" opacity="0.92"/><text x="845" y="320" font-size="14.5" font-weight="700" fill="#b5602e" text-anchor="end">delta coast no longer</text><rect x="671.525" y="325.225" width="179.47500000000002" height="19.575000000000003" rx="5" fill="#ffffff" opacity="0.92"/><text x="845" y="339" font-size="14.5" font-weight="400" fill="#b5602e" text-anchor="end">replenished with silt</text><text x="60" y="405" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">south (upstream)</text><text x="845" y="405" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="end">north (to the delta and sea)</text><rect x="30" y="460" width="270" height="176" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="493.725" font-size="18.5" font-weight="700" fill="#2e6b62" text-anchor="start">Opportunities</text><text x="48" y="517.75" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Water for irrigation in a</text><text x="48" y="538.21" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">desert; fertile alluvium on</text><text x="48" y="558.67" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">the flood plain and delta;</text><text x="48" y="579.13" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">transport and tourism.</text><rect x="315" y="460" width="270" height="176" rx="14" fill="#f6e6dc" stroke="#b5602e" stroke-width="2.5"/><text x="333" y="493.725" font-size="18.5" font-weight="700" fill="#b5602e" text-anchor="start">Hazard before the dam</text><text x="333" y="517.75" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">The annual flood was</text><text x="333" y="538.21" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">unreliable: too high in some</text><text x="333" y="558.67" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">years (crops and homes</text><text x="333" y="579.13" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">destroyed), too low in</text><text x="333" y="599.59" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">others.</text><rect x="600" y="460" width="270" height="176" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="618" y="493.725" font-size="18.5" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluation</text><text x="618" y="517.75" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Flood controlled and power</text><text x="618" y="538.21" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">generated, but silt is</text><text x="618" y="558.67" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">trapped: farmers rely on</text><text x="618" y="579.13" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">artificial fertiliser.</text>
</svg>