<rect width="900" height="530" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How a waterfall and gorge form</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Schematic side views, not to scale</text>
<rect x="30" y="110" width="270" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="42" y="125" width="246" height="300" rx="8" fill="#dce9e7"/><path d="M42,245 L200,245 L200,330 L288,330 L288,425 L42,425 Z" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><rect x="42" y="205" width="158" height="40" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="42" y="196" width="158" height="9" fill="#b5d3cf"/><path d="M200,200 Q214,210 216,330" fill="none" stroke="#2b5a9a" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><path d="M194,330 Q216,358 246,330 Z" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><rect x="246" y="322" width="42" height="8" fill="#b5d3cf"/><rect x="44" y="213.75" width="93" height="20.25" rx="5" fill="#9c8f6e" opacity="1"/><text x="50" y="228" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">hard rock</text><rect x="44" y="275.75" width="93" height="20.25" rx="5" fill="#efdfa8" opacity="1"/><text x="50" y="290" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">soft rock</text><rect x="315" y="110" width="270" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="327" y="125" width="246" height="300" rx="8" fill="#dce9e7"/><path d="M327,245 L451,245 L451,330 L573,330 L573,425 L327,425 Z" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><rect x="327" y="205" width="158" height="40" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="327" y="196" width="158" height="9" fill="#b5d3cf"/><path d="M485,200 Q499,210 501,330" fill="none" stroke="#2b5a9a" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><path d="M445,330 Q501,382 531,330 Z" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><rect x="531" y="322" width="42" height="8" fill="#b5d3cf"/><rect x="403" y="253.75" width="84" height="20.25" rx="5" fill="#dce9e7" opacity="1"/><text x="481" y="268" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="end">overhang</text><rect x="329" y="213.75" width="93" height="20.25" rx="5" fill="#9c8f6e" opacity="1"/><text x="335" y="228" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">hard rock</text><rect x="329" y="275.75" width="93" height="20.25" rx="5" fill="#efdfa8" opacity="1"/><text x="335" y="290" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">soft rock</text><rect x="600" y="110" width="270" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="612" y="125" width="246" height="300" rx="8" fill="#dce9e7"/><path d="M612,245 L686,245 L686,330 L858,330 L858,425 L612,425 Z" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><rect x="612" y="205" width="108" height="40" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="612" y="196" width="108" height="9" fill="#b5d3cf"/><path d="M720,200 Q734,210 736,330" fill="none" stroke="#2b5a9a" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><path d="M680,330 Q736,382 766,330 Z" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><rect x="766" y="322" width="92" height="8" fill="#b5d3cf"/><rect x="720" y="205" width="50" height="40" fill="none" stroke="#4a5568" stroke-width="2" stroke-dasharray="6 5"/><path d="M750,336 l14,-10 l14,8 l-4,12 z M782,338 l10,-12 l14,6 l-4,10 z" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.6"/><line x1="770" y1="185" x2="728" y2="185" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><rect x="614" y="213.75" width="93" height="20.25" rx="5" fill="#9c8f6e" opacity="1"/><text x="620" y="228" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">hard rock</text><rect x="614" y="275.75" width="93" height="20.25" rx="5" fill="#efdfa8" opacity="1"/><text x="620" y="290" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">soft rock</text><circle cx="60" cy="150" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="155.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="84" y="157" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Hard rock over soft</text><text x="48" y="446" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Soft rock erodes faster; a</text><text x="48" y="465" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">plunge pool forms by</text><text x="48" y="484" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">hydraulic action and</text><text x="48" y="503" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">abrasion.</text><circle cx="345" cy="150" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="345" y="155.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="369" y="157" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Undercutting</text><text x="333" y="446" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">The soft rock is undercut,</text><text x="333" y="465" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">leaving an overhang of hard</text><text x="333" y="484" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">rock; the pool deepens.</text><circle cx="630" cy="150" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="630" y="155.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="654" y="157" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Collapse and retreat</text><text x="618" y="446" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">The overhang collapses; the</text><text x="618" y="465" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">waterfall retreats upstream,</text><text x="618" y="484" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">leaving a steep-sided gorge.</text><rect x="759" y="165.75" width="75" height="20.25" rx="5" fill="#dce9e7" opacity="1"/><text x="828" y="180" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">retreat</text>
</svg>