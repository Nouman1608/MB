<rect width="900" height="775" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How a river changes from source to mouth</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Schematic, not to scale</text>
<rect x="30" y="110" width="840" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="45" y="125" width="810" height="200" rx="10" fill="#dce9e7"/><path d="M60,150 Q200,290 450,300 Q650,306 780,312 L780,325 L60,325 Z" fill="#cbbf9f"/><rect x="780" y="300" width="75" height="25" fill="#b5d3cf"/><path d="M60,150 Q200,290 450,300 Q650,306 780,312" fill="none" stroke="#2b5a9a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><text x="70" y="145" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">source</text><text x="840" y="292" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">mouth</text><text x="150" y="315" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">upper course</text><text x="420" y="290" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">middle course</text><text x="680" y="296" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">lower course</text><rect x="237.6" y="159.8" width="424.8" height="21.6" rx="5" fill="#dce9e7" opacity="1"/><text x="450" y="175" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">long profile: gradient decreases downstream</text><rect x="60" y="360" width="240" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M75,390 L134,390 L154,392 Q180,436 206,392 L226,390 L285,390 L285,460 L75,460 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><path d="M154,392 Q180,436 206,392 Z" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><path d="M120,485 l16,-8 l12,10 l-6,14 l-18,2 z M160,482 l20,-4 l6,14 l-14,10 l-14,-6 z M205,486 l14,-6 l10,12 l-12,10 l-12,-4 z" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.6"/><text x="180" y="520" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="middle">load: large, angular</text><rect x="330" y="360" width="240" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M345,390 L370,390 L390,392 Q450,468 510,392 L530,390 L555,390 L555,460 L345,460 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><path d="M390,392 Q450,468 510,392 Z" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><ellipse cx="400" cy="490" rx="10" ry="8" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.6"/><ellipse cx="430" cy="490" rx="10" ry="8" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.6"/><ellipse cx="460" cy="490" rx="10" ry="8" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.6"/><ellipse cx="490" cy="490" rx="10" ry="8" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.6"/><text x="450" y="520" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="middle">load: smaller</text><rect x="600" y="360" width="240" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M615,390 L595,390 L615,392 Q720,496 825,392 L845,390 L825,390 L825,460 L615,460 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><path d="M615,392 Q720,496 825,392 Z" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><circle cx="660" cy="490" r="5" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.4"/><circle cx="680" cy="490" r="5" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.4"/><circle cx="700" cy="490" r="5" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.4"/><circle cx="720" cy="490" r="5" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.4"/><circle cx="740" cy="490" r="5" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.4"/><circle cx="760" cy="490" r="5" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.4"/><circle cx="780" cy="490" r="5" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.4"/><text x="720" y="520" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="middle">load: small, rounded</text><line x1="305" y1="445" x2="325" y2="445" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="575" y1="445" x2="595" y2="445" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="550" width="272" height="52" rx="26" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="52" y="583" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Width</text><text x="282" y="583" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="end">↑</text><rect x="313" y="550" width="272" height="52" rx="26" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="335" y="583" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Depth</text><text x="565" y="583" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="end">↑</text><rect x="596" y="550" width="272" height="52" rx="26" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="618" y="583" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Discharge</text><text x="848" y="583" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="end">↑</text><rect x="30" y="612" width="272" height="52" rx="26" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="52" y="645" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Velocity</text><text x="282" y="645" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="end">↑ usually</text><rect x="313" y="612" width="272" height="52" rx="26" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="335" y="645" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Gradient</text><text x="565" y="645" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="end">↓</text><rect x="596" y="612" width="272" height="52" rx="26" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="618" y="645" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Load size</text><text x="848" y="645" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="end">↓ and rounder</text><rect x="30" y="684" width="840" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="714" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Why velocity usually rises: a wider, deeper, smoother channel</text><text x="450" y="738" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">loses less energy to friction, even though the gradient is gentler.</text>
</svg>