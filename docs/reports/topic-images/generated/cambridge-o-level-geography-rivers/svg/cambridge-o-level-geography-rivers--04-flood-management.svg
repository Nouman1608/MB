ht="18" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M467.75,380 L481.25,370.25 L494.75,380 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="505" y="395" width="22.5" height="18" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M502.75,395 L516.25,385.25 L529.75,395 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="540" y="410" width="22.5" height="18" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M537.75,410 L551.25,400.25 L564.75,410 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="490" y="430" width="22.5" height="18" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M487.75,430 L501.25,420.25 L514.75,430 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><path d="M455,360 Q540,380 600,420" fill="none" stroke="#1e2a44" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><ellipse cx="760" cy="420" rx="60" ry="26" fill="#b5d3cf" opacity="0.6" stroke="#2e6b62" stroke-width="2" stroke-dasharray="6 4"/><rect x="720" y="300" width="22.5" height="18" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M717.75,300 L731.25,290.25 L744.75,300 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="760" y="280" width="22.5" height="18" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M757.75,280 L771.25,270.25 L784.75,280 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="800" y="305" width="22.5" height="18" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M797.75,305 L811.25,295.25 L824.75,305 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="300" y="420" width="40" height="30" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><path d="M305,425 L335,425 L320,447 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><line x1="320" y1="450" x2="320" y2="470" stroke="#1e2a44" stroke-width="3"/><rect x="249" y="135.275" width="170.1" height="20.925" rx="5" fill="#ffffff" opacity="0.92"/><text x="255" y="150" font-size="15.5" font-weight="700" fill="#b5602e" text-anchor="start">Dam and reservoir</text><rect x="249" y="156.175" width="249.60000000000002" height="18.225" rx="5" fill="#ffffff" opacity="0.92"/><text x="255" y="169" font-size="13.5" font-weight="400" fill="#1e2a44" text-anchor="start">stores water, releases it slowly</text><rect x="49" y="455.275" width="132.89999999999998" height="20.925" rx="5" fill="#ffffff" opacity="0.92"/><text x="55" y="470" font-size="15.5" font-weight="700" fill="#2e6b62" text-anchor="start">Afforestation</text><rect x="49" y="476.175" width="249.60000000000002" height="18.225" rx="5" fill="#ffffff" opacity="0.92"/><text x="55" y="489" font-size="13.5" font-weight="400" fill="#1e2a44" text-anchor="start">more interception, slower runoff</text><rect x="424" y="207.275" width="198" height="20.925" rx="5" fill="#ffffff" opacity="0.92"/><text x="430" y="222" font-size="15.5" font-weight="700" fill="#b5602e" text-anchor="start">Flood relief channel</text><rect x="424" y="228.175" width="160.5" height="18.225" rx="5" fill="#ffffff" opacity="0.92"/><text x="430" y="241" font-size="13.5" font-weight="400" fill="#1e2a44" text-anchor="start">diverts excess water</text><rect x="464" y="455.275" width="114.3" height="20.925" rx="5" fill="#ffffff" opacity="0.92"/><text x="470" y="470" font-size="15.5" font-weight="700" fill="#b5602e" text-anchor="start">Embankments</text><rect x="464" y="476.175" width="167.925" height="18.225" rx="5" fill="#ffffff" opacity="0.92"/><text x="470" y="489" font-size="13.5" font-weight="400" fill="#1e2a44" text-anchor="start">more channel capacity</text><rect x="694" y="353.275" width="160.79999999999998" height="20.925" rx="5" fill="#ffffff" opacity="0.92"/><text x="700" y="368" font-size="15.5" font-weight="700" fill="#2e6b62" text-anchor="start">Wetland restored</text><rect x="694" y="374.175" width="138.22500000000002" height="18.225" rx="5" fill="#ffffff" opacity="0.92"/><text x="700" y="387" font-size="13.5" font-weight="400" fill="#1e2a44" text-anchor="start">stores floodwater</text><rect x="662" y="229.275" width="67.8" height="20.925" rx="5" fill="#ffffff" opacity="0.92"/><text x="668" y="244" font-size="15.5" font-weight="700" fill="#2e6b62" text-anchor="start">Zoning</text><rect x="662" y="250.175" width="212.47500000000002" height="18.225" rx="5" fill="#ffffff" opacity="0.92"/><text x="668" y="263" font-size="13.5" font-weight="400" fill="#1e2a44" text-anchor="start">homes on higher, safer land</text><rect x="254" y="485.275" width="151.5" height="20.925" rx="5" fill="#ffffff" opacity="0.92"/><text x="260" y="500" font-size="15.5" font-weight="700" fill="#2e6b62" text-anchor="start">Warning systems</text><rect x="254" y="506.175" width="145.65" height="18.225" rx="5" fill="#ffffff" opacity="0.92"/><text x="260" y="519" font-size="13.5" font-weight="400" fill="#1e2a44" text-anchor="start">and flood shelters</text><rect x="30" y="570" width="410" height="130" rx="14" fill="#f6e6dc" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="603.725" font-size="18.5" font-weight="700" fill="#b5602e" text-anchor="start">Hard engineering</text><text x="48" y="627.75" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Dams, embankments, straightening and</text><text x="48" y="648.21" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">dredging, relief channels: expensive; can</text><text x="48" y="668.67" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">move the problem downstream.</text><rect x="460" y="570" width="410" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="603.725" font-size="18.5" font-weight="700" fill="#2e6b62" text-anchor="start">Soft and other measures</text><text x="478" y="627.75" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Afforestation, zoning, wetlands, warnings:</text><text x="478" y="648.21" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">cheaper, more sustainable, less protection</text><text x="478" y="668.67" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">from the largest floods.</text>
</svg>