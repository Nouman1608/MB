<!-- place after: ## How the landforms form -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/cambridge-o-level-geography-rivers--02-waterfall-gorge.webp" width="900" height="530" alt="Three side views. 1: a band of hard rock lies over softer rock; the soft rock erodes faster and a plunge pool forms. 2: the soft rock is undercut, leaving an overhang of hard rock, and the plunge pool deepens. 3: the overhang collapses into the pool and the waterfall retreats upstream, leaving a steep-sided gorge; the old position is dashed." loading="lazy">
  <figcaption>Undercut, overhang, collapse, retreat: repeated, it cuts a gorge.</figcaption>
</figure>

<!-- place after: ## How the landforms form -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/cambridge-o-level-geography-rivers--03-meander-levee-sections.webp" width="900" height="775" alt="Top: a cross-section from A to B across a meander bend. The deepest, fastest water is against the outer bank, forming a steep river cliff by erosion; the inner bank is a gentle slip-off slope of deposited material. Bottom: a flood plain cross-section. Flood water spreads out and drops the coarsest material on the banks, building levées, and carries fine silt further across the flat flood plain." loading="lazy">
  <figcaption>Erosion on the outside, deposition inside; coarse load on the banks, fine silt beyond.</figcaption>
</figure>

<!-- place after: ## Managing river flooding -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/cambridge-o-level-geography-rivers--04-flood-management.webp" width="900" height="720" alt="A schematic valley plan. Hard engineering (rust labels): a dam and reservoir upstream, a flood relief channel around a town and embankments along the river. Soft measures (teal labels): afforestation of slopes, a restored wetland, zoning that keeps homes on higher land, and warning systems. Below, hard engineering is expensive and can move the problem downstream; soft measures are cheaper and more sustainable but protect less against the largest floods." loading="lazy">
  <figcaption>Hard engineering controls the river; soft measures work with it.</figcaption>
</figure>

<!-- place after: ## Worked example 2: case-study plan -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/cambridge-o-level-geography-rivers--05-nile-aswan.webp" width="900" height="660" alt="A schematic side view from south to north. Lake Nasser lies behind the Aswan High Dam, completed in 1970, where silt is trapped. The dam generates hydro-electric power and releases water for year-round irrigation downstream, but the delta coast is no longer replenished with silt. Below: opportunities of irrigation, fertile soils, transport and tourism; the unreliable flood before the dam; and an evaluation noting farmers now rely on artificial fertiliser." loading="lazy">
  <figcaption>The dam tamed the flood, but trapped the silt that fed the land.</figcaption>
</figure>

<!-- place after: ## The drainage basin as a system -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/igcse-geography-rivers--09-riv-pathways.webp" width="900" height="1010" alt="A hillside cross-section running down to a river. Numbered arrows show alternative routes for rainfall. 1 Interception: rain caught by a tree. 2 Infiltration: water soaking into the soil. 3 Overland flow: water running across the surface. 4 Throughflow: water moving sideways through the soil. 5 Groundwater flow: water moving through the underlying rock. 6 Evaporation: water lost to the air from the river and the ground. Water that infiltrates has not travelled as overland flow, so these are competing routes. Schematic, not to scale." loading="lazy">
  <figcaption>Rainfall can take several alternative routes to the river channel; they are competing routes, not consecutive steps.</figcaption>
</figure>

<!-- place after: ## Erosion, transport and deposition -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/igcse-geography-rivers--11-riv-transport.webp" width="900" height="870" alt="A side view of a river flowing left to right. 1 Traction: large heavy pieces are rolled along the bed. 2 Saltation: smaller pieces bounce along the bed. 3 Suspension: fine material is carried within the water. 4 Solution: dissolved material is carried invisibly in the water. Schematic, not to scale." loading="lazy">
  <figcaption>The four ways a river transports its load, from large pieces rolled along the bed to dissolved material.</figcaption>
</figure>

<!-- reused from igcse-geography-rivers -->
<!-- place after: ## How the landforms form -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/igcse-geography-rivers--13-riv-meander-oxbow.webp" width="900" height="890" alt="Four plan views of a river bend drawn from a computed meander curve. 1: the river erodes the outside of each bend, where water flows fastest and deepest, and deposits on the inside, where it is slowest and shallowest. 2: the bend grows and the neck of land between two bends narrows. 3: during a flood the river breaks through the neck and takes a shorter, straighter course. 4: deposition seals the ends of the abandoned loop, leaving an isolated curved oxbow lake. Schematic, not to scale." loading="lazy">
  <figcaption>How erosion and deposition at a bend lead to a cut-off neck and an isolated oxbow lake.</figcaption>
</figure>
