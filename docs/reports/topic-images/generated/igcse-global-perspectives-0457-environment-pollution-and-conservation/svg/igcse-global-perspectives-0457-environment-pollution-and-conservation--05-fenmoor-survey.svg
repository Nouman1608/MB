<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 762" width="900" height="762" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="762" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who was actually asked?</text>

<rect x="30" y="114" width="840" height="88" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="147" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INVENTED SURVEY BY A WETLAND CHARITY</text><text x="50" y="174.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">“80% of residents of Fenmoor want the wetland protected.”</text><circle cx="300" cy="440" r="190" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="300" y="295" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">All Fenmoor residents</text><circle cx="320" cy="480" r="110" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><text x="320" y="415" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">Newsletter readers</text><text x="320" y="437" font-size="15" font-weight="400" fill="#8a6d0d" text-anchor="middle">likely supporters already</text><circle cx="320" cy="520" r="45" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="320" y="517" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">50</text><text x="320" y="538" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">replied</text><rect x="530" y="240" width="340" height="135" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="550" y="273" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">ANALYSIS</text><text x="550" y="299.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Small and self-selected</text><text x="550" y="328.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Only 50 replies, all through the</text><text x="550" y="350.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">charity’s own newsletter.</text><rect x="530" y="400" width="340" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="550" y="433" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EVALUATION</text><text x="550" y="458.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Shows support among existing</text><text x="550" y="482.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">supporters, not what Fenmoor</text><text x="550" y="506.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">thinks</text><rect x="30" y="650" width="840" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="686" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Better test</text><text x="50" y="715.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A random survey of households would test the claim more fairly.</text>
</svg>