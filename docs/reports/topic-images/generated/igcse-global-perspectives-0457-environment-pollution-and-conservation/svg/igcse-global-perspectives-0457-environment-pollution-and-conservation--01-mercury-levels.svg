<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 662" width="900" height="662" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="662" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Mercury pollution: one issue, three levels</text>

<circle cx="205" cy="270.5" r="166.5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="205" cy="270.5" r="111" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="205" cy="270.5" r="55.5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="205" y="276.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Local</text><text x="205" y="359.75" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">National</text><text x="205" y="415.25" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Global</text><path d="M236,271.5 C328,271.5 328,155.5 416,155.5" fill="none" stroke="#1e2a44" stroke-width="2" stroke-dasharray="5 5"/><circle cx="236" cy="271.5" r="4" fill="#1e2a44"/><path d="M249.8,354.75 C334.9,354.75 334.9,270.5 416,270.5" fill="none" stroke="#1e2a44" stroke-width="2" stroke-dasharray="5 5"/><circle cx="249.8" cy="354.75" r="4" fill="#1e2a44"/><path d="M240.6,410.25 C330.3,410.25 330.3,385.5 416,385.5" fill="none" stroke="#1e2a44" stroke-width="2" stroke-dasharray="5 5"/><circle cx="240.6" cy="410.25" r="4" fill="#1e2a44"/><rect x="420" y="104" width="450" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="436" y="135.2" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Local</text><text x="436" y="164.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Can a community safely eat fish from its own</text><text x="436" y="186.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">bay?</text><rect x="420" y="219" width="450" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="436" y="250.2" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">National</text><text x="436" y="279.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">How tightly should a government regulate</text><text x="436" y="301.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">industries that release mercury?</text><rect x="420" y="334" width="450" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="436" y="365.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Global</text><text x="436" y="394.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Mercury travels through air and water and</text><text x="436" y="416.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">builds up in fish eaten across the world.</text><rect x="30" y="455" width="395" height="177" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="488" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">1956: LOCAL</text><text x="50" y="513.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Minamata disease officially</text><text x="50" y="537.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">identified</text><text x="50" y="565.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Mercury in factory wastewater poisoned fish</text><text x="50" y="586.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">in Minamata Bay, Japan; people who ate them</text><text x="50" y="607.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">became seriously ill.</text><line x1="431" y1="543.5" x2="469" y2="543.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="475" y="455" width="395" height="177" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="495" y="488" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">2013: GLOBAL</text><text x="495" y="513.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Minamata Convention on Mercury</text><text x="495" y="537.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">adopted</text><text x="495" y="565.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A local disaster gave its name to a global</text><text x="495" y="586.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">treaty, but it took decades.</text>
</svg>