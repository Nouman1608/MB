<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 744" width="900" height="744" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="744" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">When a solution creates a new problem</text>

<rect x="30" y="104" width="840" height="85" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PROBLEM</text><text x="50" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Chemicals damage the ozone layer</text><line x1="450" y1="194" x2="450" y2="224" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="229" width="840" height="112" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="262" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1987: GLOBAL ACTION</text><text x="50" y="288.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Montreal Protocol: phase out ozone-damaging chemicals</text><text x="50" y="316.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Ratified by every UN member state.</text><line x1="450" y1="346" x2="450" y2="376" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="381" width="840" height="110" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="414" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">UNINTENDED CONSEQUENCE</text><text x="50" y="440.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Some replacement chemicals (HFCs) turned out to be strong greenhouse</text><text x="50" y="465.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">gases</text><line x1="450" y1="496" x2="450" y2="526" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="531" width="840" height="85" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="564" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">2016: FURTHER ACTION</text><text x="50" y="590.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Kigali Amendment</text><rect x="30" y="634" width="840" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="667.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Strength: a global problem solved by global action. Limitation: a solution can create a new</text><text x="50" y="689.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">problem, so check for unintended consequences.</text>
</svg>