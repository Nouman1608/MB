<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="600" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A new protected area: who supports it, and why?</text>

<line x1="70" y1="240" x2="830" y2="240" stroke="#1e2a44" stroke-width="4" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="60" y="282" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Worried</text><text x="840" y="282" font-size="18" font-weight="700" fill="#b5602e" text-anchor="end">Supportive</text><circle cx="128" cy="240" r="11" fill="#b5602e" stroke="#1e2a44" stroke-width="3"/><line x1="128" y1="229" x2="128" y2="216" stroke="#1e2a44" stroke-width="2.5"/><g transform="translate(0,106)"><rect x="30" y="0" width="230" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="145" y="25.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Local farmers,</text><text x="145" y="47.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">fishers, herders</text><text x="145" y="74" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Livelihoods depend on</text><text x="145" y="94" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">using the area now.</text></g><circle cx="380" cy="240" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="380" y1="251" x2="380" y2="310" stroke="#1e2a44" stroke-width="2.5"/><g transform="translate(0,310)"><rect x="265" y="0" width="230" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="380" y="25.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">National government</text><text x="380" y="52" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Mixed: credit and tourism,</text><text x="380" y="72" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">but also jobs and votes.</text></g><circle cx="590" cy="240" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><line x1="590" y1="229" x2="590" y2="216" stroke="#1e2a44" stroke-width="2.5"/><g transform="translate(0,128)"><rect x="475" y="0" width="230" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="590" y="25.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Tourism businesses</text><text x="590" y="52" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Wildlife and scenery</text><text x="590" y="72" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">attract visitors.</text></g><circle cx="751" cy="240" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><line x1="751" y1="251" x2="751" y2="310" stroke="#1e2a44" stroke-width="2.5"/><g transform="translate(0,310)"><rect x="636" y="0" width="230" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="751" y="25.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Conservation groups,</text><text x="751" y="47.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">international bodies</text><text x="751" y="74" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Protect species; the 2022</text><text x="751" y="94" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">target is 30% of land and</text><text x="751" y="114" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">sea by 2030.</text></g><rect x="30" y="458" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="494" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Empathy, not labels</text><text x="50" y="523.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A perspective is not the same as a group: two fishers can disagree. A herder opposing a</text><text x="50" y="545.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">reserve may have a reasonable concern about food and income, not be “against nature”.</text>
</svg>