<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">River pollution: a chain and a trade-off</text>

<rect x="30" y="104" width="840" height="84" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">A LIST (WEAK)</text><text x="50" y="162.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Causes of river pollution are factories, farms and sewage.</text><text x="450" y="226" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">A chain (strong)</text><rect x="30" y="252" width="180" height="125" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="120" y="308.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Cheap production</text><text x="120" y="329.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">for export</text><line x1="216" y1="314.5" x2="244" y2="314.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="250" y="252" width="180" height="125" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="340" y="276.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Factories cut</text><text x="340" y="297.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">costs;</text><text x="340" y="318.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">wastewater</text><text x="340" y="339.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">treatment is</text><text x="340" y="360.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">expensive</text><line x1="436" y1="314.5" x2="464" y2="314.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="470" y="252" width="180" height="125" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="560" y="287.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Untreated</text><text x="560" y="308.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">discharge where</text><text x="560" y="329.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">enforcement is</text><text x="560" y="350.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">weak</text><line x1="656" y1="314.5" x2="684" y2="314.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="690" y="252" width="180" height="125" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="780" y="276.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Fish stocks</text><text x="780" y="297.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">fall; fishing</text><text x="780" y="318.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">families</text><text x="780" y="339.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">downstream lose</text><text x="780" y="360.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">income</text><line x1="215" y1="445" x2="685" y2="445" stroke="#1e2a44" stroke-width="7" stroke-linecap="round"/><path d="M450,445 L420,537 L480,537 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><circle cx="450" cy="445" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="215" y1="445" x2="160" y2="500" stroke="#1e2a44" stroke-width="2.5"/><line x1="215" y1="445" x2="270" y2="500" stroke="#1e2a44" stroke-width="2.5"/><path d="M140,500 L290,500 Q275,527 215,527 Q155,527 140,500 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><line x1="685" y1="445" x2="630" y2="500" stroke="#1e2a44" stroke-width="2.5"/><line x1="685" y1="445" x2="740" y2="500" stroke="#1e2a44" stroke-width="2.5"/><path d="M610,500 L760,500 Q745,527 685,527 Q625,527 610,500 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="215" y="549" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">downstream</text><text x="685" y="549" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">workers</text><rect x="30" y="573" width="405" height="110" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="609" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Close the factory: who gains</text><text x="50" y="637.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="637.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">People downstream, including fishing</text><text x="65.2" y="658.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">families</text><rect x="465" y="573" width="405" height="110" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="485" y="609" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Close the factory: who loses</text><text x="485" y="637.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="500.2" y="637.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Workers lose their jobs</text>
</svg>