<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 823" width="900" height="823" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="823" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Actions from global to individual</text>

<rect x="30" y="104" width="840" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="130.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">International agreements</text><text x="450" y="158" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">treaties, trade controls, conservation funding</text><rect x="70" y="182" width="760" height="70" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="208.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">National laws and limits</text><text x="450" y="236" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">emission limits, fines, protected areas, product bans</text><rect x="110" y="260" width="680" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="286.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Market tools</text><text x="450" y="314" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">taxes on polluters, deposit-return schemes, eco-labels</text><rect x="150" y="338" width="600" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="364.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Local and community action</text><text x="450" y="392" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">clean-ups, monitoring, campaigns, community reserves</text><rect x="190" y="416" width="520" height="70" rx="14" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="442.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Individual choices</text><text x="450" y="470" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">what people buy, use and throw away</text><rect x="30" y="504" width="408" height="159" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="537" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">A NATIONAL BAN ON SINGLE-USE BAGS</text><text x="50" y="563.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">For</text><text x="50" y="591.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="591.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Tackles one visible source of waste</text><text x="50" y="617.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="617.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Simple to enforce in shops</text><rect x="462" y="504" width="408" height="159" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="482" y="537" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start"> </text><text x="482" y="563.2" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Against</text><text x="482" y="591.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="497.2" y="591.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Does nothing about other plastics</text><text x="482" y="617.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="497.2" y="617.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Thicker bags used only once cut the</text><text x="497.2" y="638.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">benefit</text><rect x="30" y="681" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="717" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement</text><text x="50" y="746.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A ban works best as one part of a wider plan, with reusable alternatives poorer households</text><text x="50" y="768.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">can afford.</text>
</svg>