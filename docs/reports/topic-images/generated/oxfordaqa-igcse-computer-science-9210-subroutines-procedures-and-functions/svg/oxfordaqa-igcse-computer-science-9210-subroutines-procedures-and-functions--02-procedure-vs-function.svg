<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" width="900" height="570" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="570" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Procedure or function?</text>

<rect x="30" y="110" width="411" height="400" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="148" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="middle">Procedure</text><text x="235" y="174" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">carries out a task</text><rect x="60" y="196" width="351" height="56" rx="10" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="235" y="231" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="19" font-weight="700" fill="#d4b02e" text-anchor="middle">ShowBanner()</text><line x1="235" y1="256" x2="235" y2="290" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="120" y="296" width="230" height="70" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="338" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">outputs a banner</text><text x="235" y="410" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">nothing comes back</text><text x="235" y="440" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">called as a statement on its own</text><text x="235" y="480" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">e.g. output a receipt, draw a board</text><rect x="459" y="110" width="411" height="400" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="664" y="148" font-size="22" font-weight="700" fill="#8a6d0d" text-anchor="middle">Function</text><text x="664" y="174" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">calculates and returns a value</text><rect x="489" y="196" width="351" height="56" rx="10" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="664" y="231" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="19" font-weight="700" fill="#d4b02e" text-anchor="middle">area ← Area(4, 3)</text><line x1="664" y1="256" x2="664" y2="290" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="549" y="296" width="230" height="70" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="664" y="338" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">calculates</text><path d="M784,331 L850,331 L850,224 L842,224" fill="none" stroke="#8a6d0d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahO)"/><text x="820" y="280" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">RETURN</text><text x="664" y="410" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">a value comes back</text><text x="664" y="440" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">called as part of an expression</text><text x="664" y="480" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">e.g. calculate a total, check a password</text><text x="450" y="540" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Built-in subroutines such as LEN, RANDOM_INT and STRING_TO_INT work the same way.</text>
</svg>