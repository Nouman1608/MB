<rect x="30" y="110" width="840" height="222" rx="12" fill="#1e2a44"/><text x="48" y="140" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="700" fill="#d4b02e" text-anchor="start">SUBROUTINE ShowLine(symbol, length)</text><text x="68.4" y="168" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="400" fill="#e8eef0" text-anchor="start">line ← ""</text><text x="68.4" y="196" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="400" fill="#e8eef0" text-anchor="start">FOR i ← 1 TO length</text><text x="88.8" y="224" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="400" fill="#e8eef0" text-anchor="start">line ← line + symbol</text><text x="68.4" y="252" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="400" fill="#e8eef0" text-anchor="start">ENDFOR</text><text x="68.4" y="280" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="400" fill="#e8eef0" text-anchor="start">OUTPUT line</text><text x="48" y="308" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="400" fill="#e8eef0" text-anchor="start">ENDSUBROUTINE</text><rect x="30" y="356" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="400" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="start">ShowLine("*", 5)</text><text x="440" y="404" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">symbol</text><rect x="370" y="414" width="140" height="52" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="440" y="448" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">"*"</text><text x="600" y="404" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">length</text><rect x="530" y="414" width="140" height="52" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="600" y="448" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="846" y="448" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">outputs *****</text><path d="M151.2,408 C200,446 300,440 364,440" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><rect x="30" y="522" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="566" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="start">ShowLine("-", 3)</text><text x="440" y="570" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">symbol</text><rect x="370" y="580" width="140" height="52" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="440" y="614" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">"-"</text><text x="600" y="570" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">length</text><rect x="530" y="580" width="140" height="52" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="600" y="614" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="846" y="614" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">outputs ---</text><rect x="30" y="688" width="840" height="150" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="54" y="732" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="22" font-weight="700" fill="#b5602e" text-anchor="start">ShowLine(5, "*")</text><text x="440" y="736" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">symbol</text><rect x="370" y="746" width="140" height="52" rx="10" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="440" y="780" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle">5</text><text x="600" y="736" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">length</text><rect x="530" y="746" width="140" height="52" rx="10" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="600" y="780" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle">"*"</text><text x="846" y="780" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">breaks the loop</text><text x="54" y="816" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">swapped: a number in symbol, a string in length</text><text x="54" y="484" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">values are copied in order: first to first, second to second</text>
