<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 697" width="900" height="697" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="697" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Return values: passing data out</text>

<rect x="30" y="110" width="840" height="116" rx="12" fill="#1e2a44"/><text x="48" y="140" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="400" fill="#e8eef0" text-anchor="start">SUBROUTINE PriceAfterDiscount(price, percent)</text><text x="69.6" y="170" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="700" fill="#d4b02e" text-anchor="start">RETURN price - price * percent / 100</text><text x="48" y="200" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="400" fill="#e8eef0" text-anchor="start">ENDSUBROUTINE</text><text x="54" y="286" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">cost ← PriceAfterDiscount(80.0, 25)</text><text x="175" y="326" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">price</text><rect x="100" y="336" width="150" height="52" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="175" y="370" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">80.0</text><text x="355" y="326" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">percent</text><rect x="280" y="336" width="150" height="52" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="355" y="370" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">25</text><line x1="440" y1="362" x2="490" y2="362" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="500" y="326" width="370" height="72" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="685" y="370" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">80.0 - 80.0 * 25 / 100</text><line x1="685" y1="402" x2="685" y2="436" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><text x="700" y="426" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">RETURN</text><rect x="30" y="444" width="840" height="64" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="484" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">cost ← 60.0</text><text x="260" y="483" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the call is replaced by the returned value; RETURN also ends the subroutine</text><rect x="30" y="532" width="411" height="135" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="565" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RETURNS</text><text x="50" y="593" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The caller decides</text><text x="50" y="621.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">store it, compare it, output it or pass it to another</text><text x="50" y="642.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">subroutine</text><rect x="459" y="532" width="411" height="135" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="479" y="565" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">ONLY OUTPUTS</text><text x="479" y="593" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Shown on screen</text><text x="479" y="621.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the calling program cannot use the answer</text>
</svg>