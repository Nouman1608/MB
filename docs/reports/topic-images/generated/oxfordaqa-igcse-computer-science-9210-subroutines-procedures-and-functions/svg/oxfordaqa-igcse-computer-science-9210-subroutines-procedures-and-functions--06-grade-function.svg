<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 624" width="900" height="624" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="624" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Annotated model answer: Grade(mark)</text>

<rect x="30" y="110" width="400" height="222" rx="12" fill="#1e2a44"/><text x="48" y="140" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="400" fill="#e8eef0" text-anchor="start">SUBROUTINE Grade(mark)</text><text x="68.4" y="168" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="700" fill="#d4b02e" text-anchor="start">IF mark ≥ 40 THEN</text><text x="88.8" y="196" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="400" fill="#e8eef0" text-anchor="start">RETURN "Pass"</text><text x="68.4" y="224" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="400" fill="#e8eef0" text-anchor="start">ELSE</text><text x="88.8" y="252" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="400" fill="#e8eef0" text-anchor="start">RETURN "Fail"</text><text x="68.4" y="280" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="400" fill="#e8eef0" text-anchor="start">ENDIF</text><text x="48" y="308" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="400" fill="#e8eef0" text-anchor="start">ENDSUBROUTINE</text><rect x="450" y="110" width="420" height="222" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="472" y="146" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Why it scores</text><text x="472" y="182" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• mark is a parameter: no input inside</text><text x="472" y="216" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• ≥ so that 40 passes</text><text x="472" y="250" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• returns the result, does not output it</text><text x="472" y="284" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• caller converts input and outputs</text><text x="450" y="376" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">OUTPUT Grade(STRING_TO_INT(USERINPUT))</text><rect x="30" y="406" width="190" height="70" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="125" y="438" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">USERINPUT</text><text x="125" y="462" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">a string</text><line x1="224" y1="441" x2="242" y2="441" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="246" y="406" width="190" height="70" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="341" y="438" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">STRING_TO_INT</text><text x="341" y="462" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">an integer</text><line x1="440" y1="441" x2="458" y2="441" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="462" y="406" width="190" height="70" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="557" y="438" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Grade</text><text x="557" y="462" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">"Pass" / "Fail"</text><line x1="656" y1="441" x2="674" y2="441" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="678" y="406" width="190" height="70" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="773" y="438" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">OUTPUT</text><text x="773" y="462" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">shown on screen</text><rect x="30" y="502" width="840" height="92" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="538" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Input and output stay in the calling routine,</text><text x="54" y="568" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">so Grade can be reused for marks that come from a file or an array.</text>
</svg>