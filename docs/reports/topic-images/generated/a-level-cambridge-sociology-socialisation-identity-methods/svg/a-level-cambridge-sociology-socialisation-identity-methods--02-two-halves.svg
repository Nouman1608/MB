<rect width="900" height="590" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Paper 1: two paired halves</text>

<rect x="30" y="108" width="380" height="56" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="220" y="144" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Socialisation and identity</text><rect x="30" y="180" width="380" height="116" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="220" r="22" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="66" y="227.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle"></text><text x="66" y="226" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1.1</text><text x="100" y="214" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Learning and socialisation</text><text x="100" y="240" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">culture, roles, norms, values,</text><text x="100" y="261" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">status; nature v nurture; agencies</text><rect x="30" y="310" width="380" height="116" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="350" r="22" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="66" y="357.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle"></text><text x="66" y="356" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1.2</text><text x="100" y="344" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Social control, conformity</text><text x="100" y="368" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">and resistance</text><text x="100" y="394" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">structure and agency; deviance</text><rect x="30" y="440" width="380" height="116" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="480" r="22" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="66" y="487.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle"></text><text x="66" y="486" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1.3</text><text x="100" y="474" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Social identity and change</text><text x="100" y="500" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">class, gender, ethnicity, age; hybrid</text><text x="100" y="521" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">identities</text><rect x="490" y="108" width="380" height="56" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="680" y="144" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Methods of research</text><rect x="490" y="180" width="380" height="116" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="526" cy="220" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="526" y="227.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle"></text><text x="526" y="226" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2.1</text><text x="560" y="214" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Types of data, methods and</text><text x="560" y="238" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">research design</text><text x="560" y="264" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">primary/secondary;</text><text x="560" y="285" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">quantitative/qualitative; stages</text><rect x="490" y="310" width="380" height="116" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="526" cy="350" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="526" y="357.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle"></text><text x="526" y="356" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2.2</text><text x="560" y="344" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Approaches to research</text><text x="560" y="370" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">case studies, surveys, ethnography,</text><text x="560" y="391" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">mixed methods; positivism and</text><text x="560" y="412" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">interpretivism</text><rect x="490" y="440" width="380" height="116" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="526" cy="480" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="526" y="487.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle"></text><text x="526" y="486" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2.3</text><text x="560" y="474" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Research issues</text><text x="560" y="500" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">practical, ethical and theoretical</text><line x1="488" y1="360" x2="414" y2="360" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><text x="450" y="330" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">evaluate</text><text x="450" y="395" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">the</text><text x="450" y="413" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">evidence</text>
</svg>