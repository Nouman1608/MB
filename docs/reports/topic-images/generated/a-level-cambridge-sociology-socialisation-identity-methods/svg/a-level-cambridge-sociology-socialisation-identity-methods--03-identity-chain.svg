<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 705" width="900" height="705" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="705" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One argument: construction, maintenance, change</text>

<rect x="30" y="104" width="840" height="118" rx="14" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="163" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="170.56" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1.1</text><text x="104" y="143.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Construction</text><text x="104" y="173.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Identity is not innate: family, education, peer group, media and religion transmit</text><text x="104" y="195.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">norms and values, sometimes reinforcing and sometimes contradicting one another.</text><line x1="450" y1="226" x2="450" y2="262" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="268" width="840" height="118" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="327" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="334.56" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1.2</text><text x="104" y="307.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Maintenance</text><text x="104" y="337.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Formal and informal social control maintain conformity; theories of deviance explain</text><text x="104" y="359.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">when conformity breaks down.</text><line x1="450" y1="390" x2="450" y2="426" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="432" width="840" height="118" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="67" cy="491" r="21" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="67" y="498.56" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1.3</text><text x="104" y="471.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Change</text><text x="104" y="501.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Class, gender, ethnicity and age identities shift over time; globalisation creates</text><text x="104" y="523.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">new, hybrid identities.</text><rect x="30" y="568" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="604" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Why revise it as a chain?</text><text x="56" y="633" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Paper 1 questions often span two or more sub-topics, so a continuous argument beats three</text><text x="56" y="655" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">separate lists of definitions.</text>
</svg>