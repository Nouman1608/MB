<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 693" width="900" height="693" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="693" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Positivism and interpretivism</text>

<rect x="198" y="104" width="332" height="44" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="364" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Positivist</text><rect x="538" y="104" width="332" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="704" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Interpretivist</text><rect x="30" y="156" width="160" height="52" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="187.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Data</text><rect x="198" y="156" width="332" height="52" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="212" y="187.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Quantitative</text><rect x="538" y="156" width="332" height="52" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="552" y="187.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Qualitative</text><rect x="30" y="216" width="160" height="74" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="258.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Methods</text><rect x="198" y="216" width="332" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="212" y="247.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Structured: social surveys,</text><text x="212" y="269.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">official statistics</text><rect x="538" y="216" width="332" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="552" y="247.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Less structured: unstructured</text><text x="552" y="269.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">interviews, participant observation</text><rect x="30" y="298" width="160" height="140" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="373.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Aims for</text><rect x="198" y="298" width="332" height="140" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="212" y="329.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Objectivity, reliability,</text><text x="212" y="351.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">generalisation across a population</text><rect x="538" y="298" width="332" height="140" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="552" y="329.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Validity: rich, authentic</text><text x="552" y="351.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">understanding of meaning from the</text><text x="552" y="373.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">subjects’ own perspective, even at</text><text x="552" y="395.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">some cost to reliability and</text><text x="552" y="417.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">generalisability</text><rect x="30" y="446" width="160" height="96" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="499.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Roots</text><rect x="198" y="446" width="332" height="96" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="212" y="477.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Models sociology on the natural</text><text x="212" y="499.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">sciences</text><rect x="538" y="446" width="332" height="96" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="552" y="477.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Human behaviour cannot be fully</text><text x="552" y="499.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">understood by natural-science</text><text x="552" y="521.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">methods</text><rect x="30" y="558" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="594" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Exam skill</text><text x="56" y="623" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Given an unfamiliar scenario, decide which approach a described method sits closer to, and</text><text x="56" y="645" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">explain why.</text>
</svg>