<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Evaluating a method: generic or specific?</text>

<rect x="30" y="104" width="404" height="238" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L419.75,105.25 Q432.75,105.25 432.75,118.25 L432.75,154 Z" fill="#f2e7b8"/><line x1="31.25" y1="154" x2="432.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Generic (scores lower)</text><circle cx="53" cy="184.79" r="4.5" fill="#2e6b62"/><text x="66" y="190.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“Strengths and weaknesses of interviews”</text><text x="66" y="212.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">in general</text><circle cx="53" cy="236.79" r="4.5" fill="#2e6b62"/><text x="66" y="242.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Defines positivism and interpretivism in</text><text x="66" y="264.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the abstract</text><circle cx="53" cy="288.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="294.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Treats 1.1, 1.2 and 1.3 as separate lists</text><rect x="466" y="104" width="404" height="238" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,154 L467.25,118.25 Q467.25,105.25 480.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#b5d3cf"/><line x1="467.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Specific (scores higher)</text><circle cx="489" cy="184.79" r="4.5" fill="#8a6d0d"/><text x="502" y="190.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Explains why an <tspan font-weight="700">unstructured interview</tspan></text><text x="502" y="212.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">suits a sensitive or hard-to-access topic</text><circle cx="489" cy="236.79" r="4.5" fill="#8a6d0d"/><text x="502" y="242.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Applies positivism and interpretivism to</text><text x="502" y="264.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">a new research scenario</text><circle cx="489" cy="288.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="294.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Uses structure and agency as a lens on</text><text x="502" y="316.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">specific examples</text><circle cx="450" cy="223" r="24" fill="#1e2a44"/><text x="450" y="230" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">vs</text>
</svg>