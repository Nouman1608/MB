<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 688" width="900" height="688" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="688" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The European Court of Human Rights</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">One judge per state; single nine-year term; sitting as individuals</text>
<rect x="30" y="124" width="840" height="296" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="300" y="148" width="300" height="56" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="173" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Grand Chamber of 17</text><text x="450" y="194" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">most important cases, incl. referral</text><rect x="230" y="214" width="440" height="56" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="239" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Chambers of 7</text><text x="450" y="260" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">decide most other cases</text><rect x="160" y="280" width="580" height="56" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="305" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Committees of 3</text><text x="450" y="326" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">well-established case law</text><rect x="90" y="346" width="720" height="56" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="371" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Single judges</text><text x="450" y="392" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">filter clearly inadmissible cases</text><rect x="30" y="442" width="397" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="472" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">APPLICATIONS</text><text x="48" y="503.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="503.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">States (Article 33)</text><text x="48" y="528.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="528.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Individuals, groups and NGOs claiming to be</text><text x="63.2" y="549.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">victims (Article 34)</text><line x1="433" y1="509" x2="467" y2="509" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="442" width="397" height="134" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="491" y="472" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">JUDGMENTS</text><text x="491" y="503.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="506.2" y="503.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Just satisfaction (Article 41)</text><text x="491" y="528.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="506.2" y="528.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">States abide by final judgments (Article 46)</text><text x="491" y="553.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="506.2" y="553.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Committee of Ministers supervises execution</text><rect x="30" y="598" width="840" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="631.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700" fill="#1e2a44">Common</tspan> <tspan font-weight="700" fill="#1e2a44">mistake:</tspan> calling the judges representatives of their governments.</text>
</svg>