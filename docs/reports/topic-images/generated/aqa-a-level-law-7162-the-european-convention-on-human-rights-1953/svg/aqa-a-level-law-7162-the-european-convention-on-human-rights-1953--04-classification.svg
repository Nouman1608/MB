<rect width="900" height="467" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Absolute, limited and qualified rights</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Labels the structure of each Article supports</text>
<rect x="30" y="124" width="840" height="85" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ABSOLUTE: NO EXCEPTIONS, NO BALANCING</text><text x="50" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Article 3 · Article 4.1 (slavery) · Article 7</text><rect x="30" y="223" width="840" height="85" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="255" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LIMITED: THE ARTICLE LISTS THE ONLY EXCEPTIONS</text><text x="50" y="282.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Article 2 (2.2) · Article 5 (5.1(a) to (f))</text><rect x="30" y="322" width="840" height="113" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="354" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">QUALIFIED: RIGHT IN PARAGRAPH 1, RESTRICTIONS IN PARAGRAPH 2</text><text x="50" y="381.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Articles 8, 9, 10 and 11</text><text x="50" y="410.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Restrictions prescribed by law, for a listed aim, necessary in a democratic society</text>
</svg>