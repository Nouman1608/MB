<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 668" width="900" height="668" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="668" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">General provisions that affect every right</text>

<rect x="30" y="100" width="270.6666666666667" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="128" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ARTICLE 13</text><text x="46" y="159.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">An effective remedy before a</text><text x="46" y="180.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">national authority</text><rect x="314.6666666666667" y="100" width="270.6666666666667" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330.6666666666667" y="128" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ARTICLE 14</text><text x="330.6666666666667" y="159.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No discrimination in enjoying</text><text x="330.6666666666667" y="180.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Convention rights; <tspan font-weight="700" fill="#1e2a44">not</tspan></text><text x="330.6666666666667" y="201.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">free-standing</tspan></text><rect x="599.3333333333334" y="100" width="270.6666666666667" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="615.3333333333334" y="128" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ARTICLE 16</text><text x="615.3333333333334" y="159.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Restrictions on the political</text><text x="615.3333333333334" y="180.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">activity of aliens allowed</text><rect x="30" y="236" width="413" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="264" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ARTICLE 17</text><text x="46" y="295.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No right to activity aimed at destroying the rights</text><text x="46" y="316.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">of others</text><rect x="457" y="236" width="413" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="473" y="264" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ARTICLE 18</text><text x="473" y="295.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Restrictions only for the purposes for which they</text><text x="473" y="316.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">are prescribed</text><rect x="30" y="359" width="840" height="277" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="389" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ARTICLE 15: DEROGATION</text><text x="48" y="415.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">In war or public emergency threatening the life of the nation, to the extent strictly required</text><text x="50" y="456" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">NO DEROGATION FROM</text><rect x="50" y="468" width="265.7391304347826" height="90" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="182.8695652173913" y="494.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Article 2</text><text x="182.8695652173913" y="522" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">except deaths from lawful acts of</text><text x="182.8695652173913" y="542" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">war</text><rect x="327.7391304347826" y="468" width="166.08695652173915" height="90" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="410.7826086956522" y="517.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Article 3</text><rect x="505.82608695652175" y="468" width="166.08695652173915" height="90" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="588.8695652173914" y="517.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Article 4.1</text><rect x="683.9130434782609" y="468" width="166.08695652173915" height="90" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="766.9565217391305" y="517.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Article 7</text><text x="50" y="588" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Used by the UK after <tspan font-style="italic">Brogan</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">UK</tspan> (1988) and after 11 September 2001; that derogation was quashed in <tspan font-style="italic">A</tspan></text><text x="50" y="609" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">v</tspan> <tspan font-style="italic">Home</tspan> <tspan font-style="italic">Secretary</tspan> (2004).</text>
</svg>