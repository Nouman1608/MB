<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 538" width="900" height="538" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="538" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The protocols and the UK</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A state is bound only by the protocols it has ratified</text>
<rect x="30" y="124" width="412" height="180" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RATIFIED BY THE UK</text><text x="48" y="185.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="185.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Protocol</tspan> <tspan font-weight="700" fill="#1e2a44">1:</tspan> property, education, free elections</text><text x="63.2" y="206.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(Articles 1 to 3 in the HRA 1998)</text><text x="48" y="233.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="233.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Protocol</tspan> <tspan font-weight="700" fill="#1e2a44">6:</tspan> no death penalty in peacetime</text><text x="48" y="260.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="260.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Protocol</tspan> <tspan font-weight="700" fill="#1e2a44">13:</tspan> no death penalty in all</text><text x="63.2" y="281.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">circumstances (Article 1 in the HRA 1998)</text><rect x="458" y="124" width="412" height="180" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="476" y="154" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">NOT RATIFIED</text><text x="476" y="185.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="185.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Protocol</tspan> <tspan font-weight="700" fill="#1e2a44">4:</tspan> freedom of movement and other</text><text x="491.2" y="206.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rights</text><text x="476" y="233.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="233.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Protocol</tspan> <tspan font-weight="700" fill="#1e2a44">12:</tspan> free-standing prohibition of</text><text x="491.2" y="254.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">discrimination</text><rect x="30" y="326" width="840" height="180" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="356" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PROCEDURAL: CHANGE THE COURT</text><text x="48" y="387.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="387.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Protocol</tspan> <tspan font-weight="700" fill="#1e2a44">11</tspan> <tspan font-weight="700" fill="#1e2a44">(1998):</tspan> single full-time Court; Commission abolished</text><text x="48" y="414.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="414.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Protocol</tspan> <tspan font-weight="700" fill="#1e2a44">14:</tspan> single-judge filtering; “significant disadvantage” admissibility criterion; infringement</text><text x="63.2" y="435.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">proceedings</text><text x="48" y="462.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="462.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Protocol</tspan> <tspan font-weight="700" fill="#1e2a44">15</tspan> <tspan font-weight="700" fill="#1e2a44">(in</tspan> <tspan font-weight="700" fill="#1e2a44">force</tspan> <tspan font-weight="700" fill="#1e2a44">2021):</tspan> subsidiarity and the margin of appreciation added to the preamble; time</text><text x="63.2" y="483.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">limit cut from six months to four</text>
</svg>