<rect width="900" height="462" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Article 1: “everyone within their jurisdiction”</text>

<rect x="30" y="100" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><ellipse cx="260" cy="275" rx="200" ry="140" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" stroke-dasharray="9 7"/><ellipse cx="260" cy="295" rx="120" ry="80" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="260" y="285" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">State territory</text><text x="260" y="309" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">primarily territorial</text><text x="260" y="184" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Authority and control abroad</text><text x="260" y="204" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="middle">over people or territory</text><text x="500" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EVERYONE, NOT ONLY CITIZENS</text><rect x="500" y="166" width="86.912" height="30" rx="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="543.456" y="186.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Citizens</text><rect x="596.912" y="166" width="157.488" height="30" rx="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="675.6560000000001" y="186.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Foreign nationals</text><rect x="500" y="206" width="97.776" height="30" rx="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="548.888" y="226.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Prisoners</text><rect x="607.776" y="206" width="147.648" height="30" rx="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="681.5999999999999" y="226.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Asylum seekers</text><rect x="500" y="280" width="350" height="143" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="516" y="308" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AL-SKEINI v UK (2011)</text><text x="516" y="339.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Grand Chamber: UK had jurisdiction over</text><text x="516" y="360.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Iraqi civilians killed by British soldiers in</text><text x="516" y="381.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Basra, where it exercised public powers;</text><text x="516" y="402.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">breach of the Article 2 duty to investigate.</text><line x1="500" y1="290" x2="445" y2="250" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/>
</svg>