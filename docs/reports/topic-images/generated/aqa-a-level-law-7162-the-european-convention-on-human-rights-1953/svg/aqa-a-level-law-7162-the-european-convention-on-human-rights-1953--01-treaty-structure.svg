<rect width="900" height="537" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Convention: a Council of Europe treaty</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Convention for the Protection of Human Rights and Fundamental Freedoms</text>
<rect x="30" y="124" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="80" y1="194" x2="820" y2="194" stroke="#1e2a44" stroke-width="3"/><circle cx="170" cy="194" r="12" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="170" y="170" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1948</text><text x="170" y="232" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Universal Declaration</text><text x="170" y="254" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">referred to in the preamble</text><circle cx="450" cy="194" r="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="450" y="170" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">4 November 1950</text><text x="450" y="232" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Signed in Rome</text><text x="450" y="254" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Council of Europe</text><circle cx="730" cy="194" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="730" y="170" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">3 September 1953</text><text x="730" y="232" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">In force</text><text x="730" y="254" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle"></text><text x="450" y="312" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">HOW IT IS ORGANISED</text><rect x="30" y="326" width="190.9090909090909" height="80" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="125.45454545454545" y="373" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Article 1</text><rect x="220.9090909090909" y="326" width="229.09090909090907" height="80" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="335.45454545454544" y="362" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Section I</text><text x="335.45454545454544" y="386" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Articles 2–18</text><rect x="450" y="326" width="229.09090909090907" height="80" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="564.5454545454545" y="362" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Section II</text><text x="564.5454545454545" y="386" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Articles 19–51</text><rect x="679.090909090909" y="326" width="190.9090909090909" height="80" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="774.5454545454545" y="362" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Section III</text><text x="774.5454545454545" y="386" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Articles 52–59</text><rect x="35" y="422" width="180.9090909090909" height="83" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="125.45454545454545" y="446.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">The obligation to</text><text x="125.45454545454545" y="467.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">respect human</text><text x="125.45454545454545" y="488.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">rights</text><line x1="125.45454545454545" y1="406" x2="125.45454545454545" y2="422" stroke="#1e2a44" stroke-width="2"/><rect x="225.9090909090909" y="422" width="219.09090909090907" height="83" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="335.45454545454544" y="457.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Rights and freedoms,</text><text x="335.45454545454544" y="478.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">plus general provisions</text><line x1="335.45454545454544" y1="406" x2="335.45454545454544" y2="422" stroke="#1e2a44" stroke-width="2"/><rect x="455" y="422" width="219.09090909090907" height="83" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="564.5454545454545" y="457.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">The European Court of</text><text x="564.5454545454545" y="478.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Human Rights</text><line x1="564.5454545454545" y1="406" x2="564.5454545454545" y2="422" stroke="#1e2a44" stroke-width="2"/><rect x="684.090909090909" y="422" width="180.9090909090909" height="83" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="774.5454545454545" y="446.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Miscellaneous:</text><text x="774.5454545454545" y="467.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">reservations and</text><text x="774.5454545454545" y="488.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">denunciation</text><line x1="774.5454545454545" y1="406" x2="774.5454545454545" y2="422" stroke="#1e2a44" stroke-width="2"/>
</svg>