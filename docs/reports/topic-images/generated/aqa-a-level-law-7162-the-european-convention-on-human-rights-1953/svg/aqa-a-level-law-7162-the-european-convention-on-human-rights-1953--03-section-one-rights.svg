<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 524" width="900" height="524" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="524" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The rights in Section I</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The five specification Articles highlighted</text>
<rect x="30" y="124" width="270" height="64" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><circle cx="62" cy="156" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="163.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="92" y="160.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Right to life</text><rect x="315" y="124" width="270" height="64" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="347" cy="156" r="20" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="347" y="163.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="377" y="160.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Prohibition of torture</text><rect x="600" y="124" width="270" height="64" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="632" cy="156" r="20" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="632" y="163.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="662" y="160.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Slavery and forced labour</text><rect x="30" y="200" width="270" height="64" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><circle cx="62" cy="232" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="239.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="92" y="236.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Liberty and security</text><rect x="315" y="200" width="270" height="64" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="347" cy="232" r="20" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="347" y="239.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="377" y="236.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fair trial</text><rect x="600" y="200" width="270" height="64" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="632" cy="232" r="20" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="632" y="239.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">7</text><text x="662" y="227" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No punishment without</text><text x="662" y="246" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">law</text><rect x="30" y="276" width="270" height="64" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><circle cx="62" cy="308" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="315.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">8</text><text x="92" y="312.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Private and family life</text><rect x="315" y="276" width="270" height="64" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="347" cy="308" r="20" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="347" y="315.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">9</text><text x="377" y="303" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Thought, conscience and</text><text x="377" y="322" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">religion</text><rect x="600" y="276" width="270" height="64" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><circle cx="632" cy="308" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="632" y="315.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">10</text><text x="662" y="312.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Freedom of expression</text><rect x="30" y="352" width="270" height="64" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><circle cx="62" cy="384" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="391.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">11</text><text x="92" y="379" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Assembly and</text><text x="92" y="398" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">association</text><rect x="315" y="352" width="270" height="64" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="347" cy="384" r="20" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="347" y="391.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">12</text><text x="377" y="388.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Right to marry</text><rect x="600" y="352" width="270" height="64" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="632" cy="384" r="20" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="632" y="391.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">13</text><text x="662" y="388.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Effective remedy</text><rect x="30" y="428" width="270" height="64" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="62" cy="460" r="20" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="62" y="467.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">14</text><text x="92" y="455" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Prohibition of</text><text x="92" y="474" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">discrimination</text>
</svg>