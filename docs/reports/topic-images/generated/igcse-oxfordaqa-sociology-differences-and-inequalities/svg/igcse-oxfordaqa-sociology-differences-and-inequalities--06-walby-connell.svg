<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="900" height="630" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="630" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Explaining gender inequality</text>

<text x="450" y="112" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Walby: patriarchy has changed form</text><rect x="30" y="130" width="360" height="104" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="210" y="168" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Private patriarchy</text><text x="210" y="198" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">based in the home</text><line x1="398" y1="182" x2="502" y2="182" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><rect x="510" y="130" width="360" height="104" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="690" y="168" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Public patriarchy</text><text x="690" y="198" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">women in paid work and public life, but</text><text x="690" y="219" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">still disadvantaged there</text><text x="450" y="272" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">Six structures of patriarchy</text><rect x="30" y="286" width="132" height="44" rx="22" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="96" y="312.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">paid work</text><rect x="172" y="286" width="132" height="44" rx="22" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="238" y="302.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">household</text><text x="238" y="322.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">production</text><rect x="314" y="286" width="132" height="44" rx="22" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="380" y="312.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">culture</text><rect x="456" y="286" width="132" height="44" rx="22" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="522" y="312.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">sexuality</text><rect x="598" y="286" width="132" height="44" rx="22" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="664" y="312.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">male violence</text><rect x="740" y="286" width="132" height="44" rx="22" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="806" y="312.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">the state</text><text x="450" y="376" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Connell: hegemonic masculinity</text><path d="M450,396 L650,600 L250,600 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><path d="M450,396 L518,466 L382,466 Z" fill="#d4b02e"/><path d="M450,396 L518,466 L382,466 Z" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><line x1="345" y1="530" x2="555" y2="530" stroke="#1e2a44" stroke-width="2"/><text x="450" y="506" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">other men</text><text x="450" y="574" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">women</text><text x="540" y="442" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">the dominant ideal of manhood</text><text x="140" y="490" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">ranks some men above</text><text x="140" y="511" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">others, and above women</text>
</svg>