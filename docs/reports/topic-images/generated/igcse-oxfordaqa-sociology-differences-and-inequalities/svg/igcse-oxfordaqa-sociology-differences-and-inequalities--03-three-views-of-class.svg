<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 549" width="900" height="549" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="549" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three views of social class</text>

<rect x="30" y="104" width="269.3333333333333" height="415" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,178 L31.25,118.25 Q31.25,105.25 44.25,105.25 L285.0833333333333,105.25 Q298.0833333333333,105.25 298.0833333333333,118.25 L298.0833333333333,178 Z" fill="#b5d3cf"/><line x1="31.25" y1="178" x2="298.0833333333333" y2="178" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="147" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Marxism (Marx)</text><text x="46" y="211.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Class conflict</text><circle cx="51" cy="234.92" r="4.5" fill="#2e6b62"/><text x="64" y="240.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Bourgeoisie</tspan> own the means</text><text x="64" y="261.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">of production; <tspan font-weight="700">proletariat</tspan></text><text x="64" y="282.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sell their labour</text><circle cx="51" cy="305.92" r="4.5" fill="#2e6b62"/><text x="64" y="311.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Bourgeoisie <tspan font-weight="700">exploit</tspan> workers</text><text x="64" y="332.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">by keeping value beyond</text><text x="64" y="353.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">wages</text><circle cx="51" cy="376.92" r="4.5" fill="#2e6b62"/><text x="64" y="382.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">False consciousness:</tspan></text><text x="64" y="403.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ruling-class ideas make</text><text x="64" y="424.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">inequality seem fair</text><circle cx="51" cy="447.92" r="4.5" fill="#2e6b62"/><text x="64" y="453.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">−</tspan> Ignores status, gender,</text><text x="64" y="474.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ethnicity; revolution did</text><text x="64" y="495.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">not occur</text><rect x="315.3333333333333" y="104" width="269.3333333333333" height="415" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,178 L316.5833333333333,118.25 Q316.5833333333333,105.25 329.5833333333333,105.25 L570.4166666666666,105.25 Q583.4166666666666,105.25 583.4166666666666,118.25 L583.4166666666666,178 Z" fill="#f2e7b8"/><line x1="316.5833333333333" y1="178" x2="583.4166666666666" y2="178" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="134" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Functionalism (Davis</text><text x="450" y="160" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">and Moore)</text><text x="331.3333333333333" y="211.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Functional necessity</text><circle cx="336.3333333333333" cy="234.92" r="4.5" fill="#2e6b62"/><text x="349.3333333333333" y="240.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Most important jobs need</text><text x="349.3333333333333" y="261.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the highest rewards to</text><text x="349.3333333333333" y="282.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">motivate the most able</text><circle cx="336.3333333333333" cy="305.92" r="4.5" fill="#2e6b62"/><text x="349.3333333333333" y="311.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A <tspan font-weight="700">meritocracy</tspan>: positions</text><text x="349.3333333333333" y="332.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">achieved by ability and</text><text x="349.3333333333333" y="353.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">effort</text><circle cx="336.3333333333333" cy="376.92" r="4.5" fill="#2e6b62"/><text x="349.3333333333333" y="382.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">−</tspan> Inherited wealth and</text><text x="349.3333333333333" y="403.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">unequal opportunities: not</text><text x="349.3333333333333" y="424.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a true meritocracy</text><rect x="600.6666666666666" y="104" width="269.3333333333333" height="415" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,178 L601.9166666666666,118.25 Q601.9166666666666,105.25 614.9166666666666,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,178 Z" fill="#dce9e7"/><line x1="601.9166666666666" y1="178" x2="868.75" y2="178" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="147" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Weberianism (Weber)</text><text x="616.6666666666666" y="211.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Three dimensions</text><circle cx="621.6666666666666" cy="234.92" r="4.5" fill="#2e6b62"/><text x="634.6666666666666" y="240.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Class:</tspan> economic position in</text><text x="634.6666666666666" y="261.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the market</text><circle cx="621.6666666666666" cy="284.92" r="4.5" fill="#2e6b62"/><text x="634.6666666666666" y="290.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Status:</tspan> social honour</text><circle cx="621.6666666666666" cy="313.92" r="4.5" fill="#2e6b62"/><text x="634.6666666666666" y="319.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Party:</tspan> political power</text><text x="634.6666666666666" y="340.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">through organised groups</text><circle cx="621.6666666666666" cy="363.92" r="4.5" fill="#2e6b62"/><text x="634.6666666666666" y="369.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A person can rank</text><text x="634.6666666666666" y="390.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">differently on each</text><circle cx="621.6666666666666" cy="413.92" r="4.5" fill="#2e6b62"/><text x="634.6666666666666" y="419.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">+</tspan> Captures more complexity</text>
</svg>