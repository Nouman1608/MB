<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Social mobility: up, down, and across time</text>

<rect x="30" y="108" width="404" height="440" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,158 L31.25,122.25 Q31.25,109.25 44.25,109.25 L419.75,109.25 Q432.75,109.25 432.75,122.25 L432.75,158 Z" fill="#b5d3cf"/><line x1="31.25" y1="158" x2="432.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="138.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Intergenerational</text><text x="232" y="192" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">a person compared with their parents</text><line x1="70" y1="250" x2="394" y2="250" stroke="#c9d6d4" stroke-width="3"/><text x="70" y="242" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Higher class</text><line x1="70" y1="350" x2="394" y2="350" stroke="#c9d6d4" stroke-width="3"/><text x="70" y="342" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Middle</text><line x1="70" y1="450" x2="394" y2="450" stroke="#c9d6d4" stroke-width="3"/><text x="70" y="442" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Lower class</text><circle cx="200" cy="420" r="11" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><path d="M185,450 Q200,416 215,450 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="200" y="480" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">parent</text><circle cx="340" cy="220" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><path d="M325,250 Q340,216 355,250 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="340" y="280" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">child</text><line x1="222" y1="412" x2="318" y2="284" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="284" y="380" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">upward</text><rect x="466" y="108" width="404" height="440" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,158 L467.25,122.25 Q467.25,109.25 480.25,109.25 L855.75,109.25 Q868.75,109.25 868.75,122.25 L868.75,158 Z" fill="#b5d3cf"/><line x1="467.25" y1="158" x2="868.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="138.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Intragenerational</text><text x="668" y="192" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">within one person’s working life</text><line x1="506" y1="250" x2="830" y2="250" stroke="#c9d6d4" stroke-width="3"/><text x="506" y="242" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Higher class</text><line x1="506" y1="350" x2="830" y2="350" stroke="#c9d6d4" stroke-width="3"/><text x="506" y="342" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Middle</text><line x1="506" y1="450" x2="830" y2="450" stroke="#c9d6d4" stroke-width="3"/><text x="506" y="442" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Lower class</text><circle cx="656" cy="320" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><path d="M641,350 Q656,316 671,350 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="656" y="380" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">first job</text><circle cx="800" cy="420" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><path d="M785,450 Q800,416 815,450 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="800" y="480" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">later</text><line x1="682" y1="336" x2="776" y2="418" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><text x="722" y="324" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">downward</text><rect x="30" y="568" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="604" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Factors affecting mobility</text><text x="56" y="633" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Education, family background, gender, ethnicity, the availability of jobs, and economic</text><text x="56" y="655" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">change such as the growth of professional work.</text>
