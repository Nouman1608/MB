<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 718" width="900" height="718" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="718" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Ten ways to classify people</text>

<rect x="30" y="108" width="160" height="120" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="110" y="138" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Social class</text><text x="110" y="164" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">economic position</text><rect x="200" y="108" width="160" height="120" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="280" y="138" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Status</text><text x="280" y="164" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">social honour or</text><text x="280" y="184" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">prestige</text><rect x="370" y="108" width="160" height="120" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="450" y="138" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Caste</text><text x="450" y="164" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">closed hierarchy</text><text x="450" y="184" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">fixed at birth</text><rect x="540" y="108" width="160" height="120" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="620" y="138" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Slavery</text><text x="620" y="164" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">people owned as</text><text x="620" y="184" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">property</text><rect x="710" y="108" width="160" height="120" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="790" y="138" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Sex and gender</text><text x="790" y="164" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">biology vs learned</text><text x="790" y="184" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">roles</text><rect x="30" y="238" width="160" height="120" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="110" y="268" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Race and</text><text x="110" y="290" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">ethnicity</text><text x="110" y="316" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">physical</text><text x="110" y="336" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">differences vs</text><text x="110" y="356" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">culture</text><rect x="200" y="238" width="160" height="120" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="280" y="268" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Age and cohort</text><text x="280" y="294" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">born in the same</text><text x="280" y="314" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">period</text><rect x="370" y="238" width="160" height="120" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="450" y="303.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Religion</text><rect x="540" y="238" width="160" height="120" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="620" y="292.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Ability or</text><text x="620" y="314.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">disability</text><rect x="710" y="238" width="160" height="120" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="790" y="303.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Nationality</text><rect x="30" y="382" width="412" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,432 L31.25,396.25 Q31.25,383.25 44.25,383.25 L427.75,383.25 Q440.75,383.25 440.75,396.25 L440.75,432 Z" fill="#f2e7b8"/><line x1="31.25" y1="432" x2="440.75" y2="432" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="412.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Ascribed</text><text x="44" y="464.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Given at birth, e.g. caste</text><rect x="458" y="382" width="412" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,432 L459.25,396.25 Q459.25,383.25 472.25,383.25 L855.75,383.25 Q868.75,383.25 868.75,396.25 L868.75,432 Z" fill="#f2e7b8"/><line x1="459.25" y1="432" x2="868.75" y2="432" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="412.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Achieved</text><text x="472" y="464.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Gained through a person’s own actions</text><text x="450" y="528" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">How people identify with groups</text><rect x="30" y="544" width="412" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,594 L31.25,558.25 Q31.25,545.25 44.25,545.25 L427.75,545.25 Q440.75,545.25 440.75,558.25 L440.75,594 Z" fill="#dce9e7"/><line x1="31.25" y1="594" x2="440.75" y2="594" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="574.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Individual identity</text><text x="44" y="626.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">How a person sees themselves</text><rect x="458" y="544" width="412" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,594 L459.25,558.25 Q459.25,545.25 472.25,545.25 L855.75,545.25 Q868.75,545.25 868.75,558.25 L868.75,594 Z" fill="#d4b02e"/><line x1="459.25" y1="594" x2="868.75" y2="594" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="574.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Collective identity</text><text x="472" y="626.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A shared sense of belonging (national,</text><text x="472" y="648.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">religious, ethnic) that unites people and</text><text x="472" y="670.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">marks boundaries</text>
</svg>