<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 436" width="900" height="436" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="436" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three ways to reduce inequality</text>

<rect x="30" y="104" width="269.3333333333333" height="302" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,178 L31.25,118.25 Q31.25,105.25 44.25,105.25 L285.0833333333333,105.25 Q298.0833333333333,105.25 298.0833333333333,118.25 L298.0833333333333,178 Z" fill="#b5d3cf"/><line x1="31.25" y1="178" x2="298.0833333333333" y2="178" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="147" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Abolish capitalism</text><text x="46" y="211.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Marxism</text><circle cx="51" cy="234.92" r="4.5" fill="#2e6b62"/><text x="64" y="240.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Replace it with common</text><text x="64" y="261.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ownership of the means of</text><text x="64" y="282.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">production</text><circle cx="51" cy="305.92" r="4.5" fill="#2e6b62"/><text x="64" y="311.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">−</tspan> Inequality and lack of</text><text x="64" y="332.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">freedom in societies that</text><text x="64" y="353.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">claimed to follow this</text><text x="64" y="374.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">route</text><rect x="315.3333333333333" y="104" width="269.3333333333333" height="302" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,178 L316.5833333333333,118.25 Q316.5833333333333,105.25 329.5833333333333,105.25 L570.4166666666666,105.25 Q583.4166666666666,105.25 583.4166666666666,118.25 L583.4166666666666,178 Z" fill="#f2e7b8"/><line x1="316.5833333333333" y1="178" x2="583.4166666666666" y2="178" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="134" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Social democratic</text><text x="450" y="160" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">welfare state</text><text x="331.3333333333333" y="211.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Within capitalism</text><circle cx="336.3333333333333" cy="234.92" r="4.5" fill="#2e6b62"/><text x="349.3333333333333" y="240.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Progressive taxation</text><circle cx="336.3333333333333" cy="263.92" r="4.5" fill="#2e6b62"/><text x="349.3333333333333" y="269.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Universal healthcare,</text><text x="349.3333333333333" y="290.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">education and benefits</text><circle cx="336.3333333333333" cy="313.92" r="4.5" fill="#2e6b62"/><text x="349.3333333333333" y="319.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">+</tspan> Narrows gaps</text><circle cx="336.3333333333333" cy="342.92" r="4.5" fill="#2e6b62"/><text x="349.3333333333333" y="348.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">−</tspan> Costly; does not remove</text><text x="349.3333333333333" y="369.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">wealth inequality</text><rect x="600.6666666666666" y="104" width="269.3333333333333" height="302" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,178 L601.9166666666666,118.25 Q601.9166666666666,105.25 614.9166666666666,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,178 Z" fill="#dce9e7"/><line x1="601.9166666666666" y1="178" x2="868.75" y2="178" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="147" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Development aid</text><text x="616.6666666666666" y="211.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Between countries</text><circle cx="621.6666666666666" cy="234.92" r="4.5" fill="#2e6b62"/><text x="634.6666666666666" y="240.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Money, expertise or goods</text><text x="634.6666666666666" y="261.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">from richer to poorer</text><text x="634.6666666666666" y="282.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">countries</text><circle cx="621.6666666666666" cy="305.92" r="4.5" fill="#2e6b62"/><text x="634.6666666666666" y="311.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">+</tspan> Improvements in health</text><text x="634.6666666666666" y="332.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and education</text><circle cx="621.6666666666666" cy="355.92" r="4.5" fill="#2e6b62"/><text x="634.6666666666666" y="361.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">−</tspan> Can create dependency or</text><text x="634.6666666666666" y="382.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">serve donors’ interests</text>
</svg>