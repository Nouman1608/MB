<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 805" width="900" height="805" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="805" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Living with cultural difference</text>

<rect x="30" y="108" width="412" height="250" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="144" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Assimilation</text><text x="50" y="170" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Minority groups adopt the majority culture</text><circle cx="130" cy="290" r="48" fill="#b5d3cf" fill-opacity="1" stroke="#1e2a44" stroke-width="2.5"/><circle cx="205" cy="290" r="18" fill="#d4b02e" fill-opacity="1" stroke="#1e2a44" stroke-width="2.5"/><line x1="228" y1="290" x2="268" y2="290" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><circle cx="330" cy="290" r="54" fill="#b5d3cf" fill-opacity="1" stroke="#1e2a44" stroke-width="2.5"/><rect x="458" y="108" width="412" height="250" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="144" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Multiculturalism</text><text x="478" y="170" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Different cultures coexist with equal respect</text><circle cx="570" cy="290" r="36" fill="#b5d3cf" fill-opacity="1" stroke="#1e2a44" stroke-width="2.5"/><circle cx="660" cy="290" r="36" fill="#d4b02e" fill-opacity="1" stroke="#1e2a44" stroke-width="2.5"/><circle cx="750" cy="290" r="36" fill="#f2e7b8" fill-opacity="1" stroke="#1e2a44" stroke-width="2.5"/><rect x="520" y="234" width="280" height="112" rx="18" fill="none" stroke="#1e2a44" stroke-width="2" stroke-dasharray="7 6"/><rect x="30" y="374" width="412" height="250" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="410" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Diaspora</text><text x="50" y="436" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A community dispersed from its homeland that</text><text x="50" y="457" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">keeps links with it</text><circle cx="110" cy="546" r="34" fill="#d4b02e" fill-opacity="1" stroke="#1e2a44" stroke-width="2.5"/><circle cx="260" cy="514" r="16" fill="#d4b02e" fill-opacity="1" stroke="#1e2a44" stroke-width="2.5"/><line x1="144" y1="546" x2="244" y2="514" stroke="#1e2a44" stroke-width="2" stroke-dasharray="5 5"/><circle cx="320" cy="570" r="16" fill="#d4b02e" fill-opacity="1" stroke="#1e2a44" stroke-width="2.5"/><line x1="144" y1="546" x2="304" y2="570" stroke="#1e2a44" stroke-width="2" stroke-dasharray="5 5"/><circle cx="250" cy="594" r="16" fill="#d4b02e" fill-opacity="1" stroke="#1e2a44" stroke-width="2.5"/><line x1="144" y1="546" x2="234" y2="594" stroke="#1e2a44" stroke-width="2" stroke-dasharray="5 5"/><text x="110" y="602" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">homeland</text><rect x="458" y="374" width="412" height="250" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="410" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Hybrid identity</text><text x="478" y="436" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">An identity that blends elements of more than</text><text x="478" y="457" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">one culture</text><circle cx="620" cy="554" r="50" fill="#b5d3cf" fill-opacity="0.8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="690" cy="554" r="50" fill="#d4b02e" fill-opacity="0.7" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="640" width="840" height="141" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="676" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Race or ethnicity?</text><circle cx="61" cy="699.39" r="4.5" fill="#8a6d0d"/><text x="74" y="705" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Race:</tspan> classifying people by supposed physical differences; sociologists see it as socially</text><text x="74" y="727" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">constructed</text><circle cx="61" cy="751.39" r="4.5" fill="#8a6d0d"/><text x="74" y="757" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Ethnicity:</tspan> shared culture: language, religion, traditions, a sense of common origin</text>
</svg>