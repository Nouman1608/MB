<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 725" width="900" height="725" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="725" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Intersectionality</text>

<circle cx="360" cy="270" r="150" fill="#b5d3cf" fill-opacity="0.7" stroke="#1e2a44" stroke-width="3"/><circle cx="540" cy="270" r="150" fill="#f2e7b8" fill-opacity="0.7" stroke="#1e2a44" stroke-width="3"/><circle cx="450" cy="420" r="150" fill="#dce9e7" fill-opacity="0.7" stroke="#1e2a44" stroke-width="3"/><text x="290" y="220" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Class</text><text x="610" y="220" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Gender</text><text x="450" y="520" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Ethnicity</text><circle cx="450" cy="322" r="40" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="316" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">one</text><text x="450" y="336" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">person</text><text x="450" y="106" font-size="18" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Differences combine: look at one alone and you miss the experience</text><rect x="30" y="590" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="626" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Crenshaw (1989)</text><text x="56" y="655" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Black women could face discrimination that neither a “race” claim nor a “sex” claim alone</text><text x="56" y="677" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">recognised.</text>
</svg>