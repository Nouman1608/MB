<rect x="30" y="108" width="404" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,159 L31.25,122.25 Q31.25,109.25 44.25,109.25 L419.75,109.25 Q432.75,109.25 432.75,122.25 L432.75,159 Z" fill="#b5d3cf"/><line x1="31.25" y1="159" x2="432.75" y2="159" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="139.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Income: a flow</text><path d="M120,200 L200,200 L200,220 L140,220 L140,240 L120,240 Z" fill="#9c8f6e" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><rect x="190" y="190" width="18" height="40" rx="4" fill="#9c8f6e" stroke="#1e2a44" stroke-width="3"/><path d="M130,258 q-7,12 0,18 q7,-6 0,-18 z" fill="#2b5a9a"/><path d="M130,288 q-7,12 0,18 q7,-6 0,-18 z" fill="#2b5a9a"/><path d="M130,318 q-7,12 0,18 q7,-6 0,-18 z" fill="#2b5a9a"/><path d="M130,348 q-7,12 0,18 q7,-6 0,-18 z" fill="#2b5a9a"/><text x="240" y="250" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">wages</text><text x="240" y="280" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">benefits</text><text x="240" y="310" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">interest</text><text x="232" y="400" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Money coming in over time</text><rect x="466" y="108" width="404" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,159 L467.25,122.25 Q467.25,109.25 480.25,109.25 L855.75,109.25 Q868.75,109.25 868.75,122.25 L868.75,159 Z" fill="#f2e7b8"/><line x1="467.25" y1="159" x2="868.75" y2="159" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="139.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Wealth: a stock</text><rect x="520" y="190" width="150" height="170" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="522" y="250" width="146" height="108" rx="8" fill="#d4b02e"/><text x="700" y="250" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">property</text><text x="700" y="280" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">savings</text><text x="700" y="310" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">shares</text><text x="668" y="400" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">Assets held at one time</text><rect x="30" y="508" width="840" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="61" cy="538.39" r="4.5" fill="#8a6d0d"/><text x="74" y="544" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Wealth is usually distributed <tspan font-weight="700">far more unequally</tspan> than income, within societies and globally</text><circle cx="61" cy="568.39" r="4.5" fill="#8a6d0d"/><text x="74" y="574" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Inequality changes over time with taxation, welfare and economic change</text>
