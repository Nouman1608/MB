<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 665" width="900" height="665" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="665" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A reading routine in three passes</text>

<rect x="30" y="110" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="110" width="220" height="150" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><circle cx="70" cy="154" r="22" fill="#fff" stroke="#1e2a44" stroke-width="3"/><text x="70" y="161.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="102" y="162" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Skim</text><text x="52" y="214" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1–2 minutes</text><text x="275" y="154" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">title, headings, images,</text><text x="275" y="179" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">captions, first and last lines</text><text x="275" y="242" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start" font-style="italic">What type? For whom? Mainly about?</text><line x1="140" y1="262" x2="140" y2="278" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="280" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="280" width="220" height="150" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="70" cy="324" r="22" fill="#fff" stroke="#1e2a44" stroke-width="3"/><text x="70" y="331.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="102" y="332" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Scan</text><text x="52" y="384" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">for the question</text><text x="275" y="324" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">key words in the question,</text><text x="275" y="349" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">or their synonyms, in the text</text><text x="275" y="412" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start" font-style="italic">question “worried” = text “nervous”</text><line x1="140" y1="432" x2="140" y2="448" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="450" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="450" width="220" height="150" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="70" cy="494" r="22" fill="#fff" stroke="#1e2a44" stroke-width="3"/><text x="70" y="501.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="102" y="502" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Read closely</text><text x="52" y="554" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">around the match</text><text x="275" y="494" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">negatives: not, never, hardly</text><text x="275" y="519" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">contrast: but, however</text><text x="275" y="544" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">time: at first, by week three</text><text x="275" y="582" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start" font-style="italic">these often decide the answer</text><text x="450" y="640" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">Answering too early causes most slips.</text>
</svg>