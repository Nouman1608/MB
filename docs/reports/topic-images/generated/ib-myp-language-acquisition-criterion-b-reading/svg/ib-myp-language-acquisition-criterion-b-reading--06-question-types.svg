<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 725" width="900" height="725" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="725" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What each question type rewards</text>

<rect x="30" y="110" width="380" height="62" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="48" y="148" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Find the word or phrase that means…</text><line x1="412" y1="141" x2="444" y2="141" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="450" y="110" width="420" height="62" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="468" y="148" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the exact words from the text, no extras</text><rect x="30" y="184" width="380" height="62" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="48" y="222" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">True or false, with justification</text><line x1="412" y1="215" x2="444" y2="215" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="450" y="184" width="420" height="62" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="468" y="222" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">right choice + shortest proving quotation</text><rect x="30" y="258" width="380" height="62" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="48" y="296" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Choose the correct statements</text><line x1="412" y1="289" x2="444" y2="289" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="450" y="258" width="420" height="62" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="468" y="296" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">check every option against the text</text><rect x="30" y="332" width="380" height="62" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="48" y="370" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Answer in your own words</text><line x1="412" y1="363" x2="444" y2="363" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="450" y="332" width="420" height="62" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="468" y="370" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rephrase; do not lift whole sentences</text><rect x="30" y="406" width="380" height="62" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="48" y="444" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Explain the effect of a visual</text><line x1="412" y1="437" x2="444" y2="437" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="450" y="406" width="420" height="62" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="468" y="444" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">name it, describe it, link it to the message</text><rect x="30" y="480" width="380" height="62" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="48" y="518" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Identify purpose or attitude</text><line x1="412" y1="511" x2="444" y2="511" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="450" y="480" width="420" height="62" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="468" y="518" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a clear label + evidence from words and visuals</text><rect x="30" y="570" width="840" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="606" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">“Mira felt confident on her first night.” True or false?</text><text x="55" y="640" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">✓ False – “I was nervous.”</text><text x="55" y="674" font-size="17" font-weight="600" fill="#b5602e" text-anchor="start">✗ a tick alone, or a whole copied paragraph</text>
</svg>