<rect width="900" height="725" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Source B: how the poster persuades</text>

<rect x="30" y="110" width="390" height="560" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="60" y="130" width="330" height="520" rx="6" fill="#fff" stroke="#1e2a44" stroke-width="2.5"/><rect x="60" y="130" width="330" height="80" rx="6" fill="#2e6b62"/><text x="225" y="180" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">GROW IT. SHARE IT.</text><rect x="80" y="226" width="290" height="150" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><circle cx="180" cy="280" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><circle cx="270" cy="288" r="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><path d="M150,360 Q180,310 210,360 M245,360 Q270,315 295,360" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M100,366 l10,-20 l10,20 M320,366 l10,-20 l10,20" fill="none" stroke="#6f9a52" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><circle cx="130" cy="420" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><circle cx="225" cy="420" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><circle cx="320" cy="420" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="130" y="466" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">trowel</text><text x="225" y="466" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">watering can</text><text x="320" y="466" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">basket</text><rect x="90" y="486" width="270" height="10" rx="5" fill="#c9d6d4"/><rect x="90" y="508" width="230" height="10" rx="5" fill="#c9d6d4"/><rect x="90" y="530" width="190" height="10" rx="5" fill="#c9d6d4"/><text x="225" y="562" font-size="22" font-weight="700" fill="#8a6d0d" text-anchor="middle">312 kg</text><rect x="60" y="586" width="330" height="64" rx="6" fill="#6f9a52"/><rect x="80" y="606" width="250" height="10" rx="5" fill="#fff"/><rect x="80" y="626" width="190" height="10" rx="5" fill="#fff"/><line x1="394" y1="170" x2="460" y2="164" stroke="#2e6b62" stroke-width="2"/><circle cx="394" cy="170" r="5" fill="#2e6b62"/><rect x="460" y="120" width="410" height="96" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="478" y="152" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Headline: largest, at the top</text><text x="478" y="178" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">read first; two short balanced commands are</text><text x="478" y="198" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">easy to remember</text><line x1="394" y1="300" x2="460" y2="276" stroke="#2e6b62" stroke-width="2"/><circle cx="394" cy="300" r="5" fill="#2e6b62"/><rect x="460" y="232" width="410" height="96" rx="10" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2"/><text x="478" y="264" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Photo: two generations, smiling</text><text x="478" y="290" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">friendly and open to everyone; supports “No</text><text x="478" y="310" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">experience”</text><line x1="394" y1="420" x2="460" y2="388" stroke="#2e6b62" stroke-width="2"/><circle cx="394" cy="420" r="5" fill="#2e6b62"/><rect x="460" y="344" width="410" height="96" rx="10" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2"/><text x="478" y="376" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Three icons</text><text x="478" y="402" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">match the three jobs: dig, water, harvest</text><line x1="394" y1="550" x2="460" y2="500" stroke="#2e6b62" stroke-width="2"/><circle cx="394" cy="550" r="5" fill="#2e6b62"/><rect x="460" y="456" width="410" height="96" rx="10" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2"/><text x="478" y="488" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">“312 kg” and a question</text><text x="478" y="514" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">invite the reader to join in</text><line x1="394" y1="618" x2="460" y2="612" stroke="#2e6b62" stroke-width="2"/><circle cx="394" cy="618" r="5" fill="#2e6b62"/><rect x="460" y="568" width="410" height="96" rx="10" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2"/><text x="478" y="600" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Green strip at the bottom</text><text x="478" y="626" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">time and place grouped; green suggests</text><text x="478" y="646" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">nature</text><text x="450" y="700" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">Each point links a feature to a specific effect on the reader.</text>
</svg>