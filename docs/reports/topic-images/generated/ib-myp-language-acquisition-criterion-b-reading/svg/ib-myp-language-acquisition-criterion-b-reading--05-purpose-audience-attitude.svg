<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 728" width="900" height="728" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="728" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Purpose, audience, perspective and attitudes</text>

<rect x="330" y="110" width="260" height="44" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="460" y="137.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Source A: blog</text><rect x="610" y="110" width="260" height="44" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="740" y="137.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Source B: poster</text><rect x="30" y="168" width="285" height="100" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="48" y="204" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Purpose</text><text x="48" y="230" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">why the text exists</text><rect x="330" y="168" width="260" height="100" rx="10" fill="#eaf3f1" stroke="#2e6b62" stroke-width="1.8"/><text x="346" y="222" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">entertains and advises</text><rect x="610" y="168" width="260" height="100" rx="10" fill="#fbf6e0" stroke="#8a6d0d" stroke-width="1.8"/><text x="626" y="222" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">informs and persuades</text><rect x="30" y="280" width="285" height="100" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="48" y="316" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Audience</text><text x="48" y="342" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">who it is for: register,</text><text x="48" y="361" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">vocabulary, where it appears</text><rect x="330" y="280" width="260" height="100" rx="10" fill="#eaf3f1" stroke="#2e6b62" stroke-width="1.8"/><text x="346" y="324" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">people thinking of going</text><text x="346" y="345" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">on an exchange</text><rect x="610" y="280" width="260" height="100" rx="10" fill="#fbf6e0" stroke="#8a6d0d" stroke-width="1.8"/><text x="626" y="314" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">open to everyone: no</text><text x="626" y="335" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">garden or experience</text><text x="626" y="356" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">needed; children welcome</text><rect x="30" y="392" width="285" height="100" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="48" y="428" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Perspective</text><text x="48" y="454" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">whose point of view</text><rect x="330" y="392" width="540" height="100" rx="10" fill="#eaf3f1" stroke="#2e6b62" stroke-width="1.8"/><text x="346" y="436" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Blog: one visitor’s view; the hosts might tell the</text><text x="346" y="457" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">pan-fire story differently</text><rect x="30" y="504" width="285" height="100" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="48" y="540" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Values and attitudes</text><text x="48" y="566" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">what the writer believes or</text><text x="48" y="585" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">feels</text><rect x="330" y="504" width="540" height="100" rx="10" fill="#eaf3f1" stroke="#2e6b62" stroke-width="1.8"/><text x="346" y="548" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Blog: Mira values everyday contact; relaxed,</text><text x="346" y="569" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">self-mocking about mistakes</text><rect x="30" y="620" width="840" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="655" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Word choice is often the best evidence of attitude:</text><text x="55" y="683" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“finally trusted” shows pride in progress, which “allowed” would not.</text>
</svg>