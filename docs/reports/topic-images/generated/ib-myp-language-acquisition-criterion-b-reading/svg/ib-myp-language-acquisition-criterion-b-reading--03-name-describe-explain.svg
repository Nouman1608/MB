<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 702" width="900" height="702" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="702" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Visual and spatial elements: name, describe, explain</text>

<rect x="30" y="110" width="270" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Visual</text><text x="50" y="174" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">photos, drawings, icons,</text><text x="50" y="193" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">charts, logos, colour</text><text x="50" y="236" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">repeat, add to or contrast</text><text x="50" y="255" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">with the words?</text><rect x="315" y="110" width="270" height="170" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="335" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Spatial</text><text x="335" y="174" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">position, size, columns,</text><text x="335" y="193" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">boxes, white space</text><text x="335" y="236" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">what do you notice first;</text><text x="335" y="255" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">what is grouped?</text><rect x="600" y="110" width="270" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="620" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Typographic</text><text x="620" y="174" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">capitals, bold, font size,</text><text x="620" y="193" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">bullet points</text><text x="620" y="236" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">which words stand out, and</text><text x="620" y="255" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">why?</text><text x="450" y="322" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">A strong answer does three things</text><rect x="30" y="342" width="170" height="62" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><text x="115" y="379.65" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Name</text><rect x="215" y="342" width="655" height="62" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="235" y="380" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the photo</text><line x1="115" y1="405" x2="115" y2="417" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="418" width="170" height="62" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.2"/><text x="115" y="455.65" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Describe</text><rect x="215" y="418" width="655" height="62" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="235" y="456" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Mira and her hosts laughing over a chopping board</text><line x1="115" y1="481" x2="115" y2="493" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="494" width="170" height="62" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="115" y="531.65" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Explain</text><rect x="215" y="494" width="655" height="62" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="235" y="532" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the kitchen became a social place, not a chore</text><text x="235" y="600" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">+ the caption “finally trusted with the big knife” adds humour and shows progress</text><rect x="30" y="620" width="840" height="58" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="52" y="656" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Weak: “There is a photo of people cooking.”</text>
</svg>