<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 685" width="900" height="685" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="685" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Source A: main idea and supporting details</text>

<rect x="110" y="110" width="680" height="110" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="144" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Main idea</text><text x="450" y="172" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">helping with everyday jobs, especially cooking with her host</text><text x="450" y="195" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">family, improved Mira’s language more than sightseeing</text><line x1="165" y1="300" x2="300" y2="226" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="30" y="306" width="270" height="110" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="334" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">supporting detail</text><text x="50" y="362" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">learnt words through need</text><text x="50" y="388" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“the word for ‘pan’”</text><line x1="450" y1="300" x2="450" y2="226" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="315" y="306" width="270" height="110" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="335" y="334" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">supporting detail</text><text x="335" y="362" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">by week three: follows a recipe,</text><text x="335" y="388" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">jokes, asks for seconds</text><line x1="735" y1="300" x2="600" y2="226" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="600" y="306" width="270" height="110" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="620" y="334" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">supporting detail</text><text x="620" y="362" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">her advice sums it up:</text><text x="620" y="388" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“say yes to the boring jobs”</text><rect x="30" y="440" width="840" height="92" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="52" y="476" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Not the main idea</text><text x="52" y="506" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“I pictured museums and markets” only sets up a contrast with what actually helped.</text><rect x="30" y="552" width="840" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="588" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Blog conventions are clues</text><text x="55" y="618" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“week 3” label: looks back over the trip</text><text x="55" y="644" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“12 comments”: written for a public audience, not a private diary</text>
</svg>