<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How the levels nest: a sugary drinks tax</text>

<rect x="30" y="110" width="840" height="430" rx="18" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="56" y="148" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">GLOBAL</text><text x="56" y="176" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A pattern seen in many countries</text><rect x="80" y="202" width="740" height="310" rx="16" fill="#b5d3cf" stroke="#2e6b62" stroke-width="3"/><text x="106" y="238" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">NATIONAL</text><text x="106" y="266" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A tax on sugary drinks</text><rect x="130" y="294" width="640" height="190" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><text x="156" y="330" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">LOCAL</text><text x="156" y="358" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">What is sold in your school canteen changes</text><rect x="180" y="384" width="540" height="76" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="417" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">SDG 3 (2015): “Ensure healthy lives and promote</text><text x="450" y="440" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">well-being for all at all ages”: a value, not evidence</text><rect x="30" y="560" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="593.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A strong answer shows how the levels link, not just that each exists.</text>
