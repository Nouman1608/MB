<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 752" width="900" height="752" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="752" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Evaluating a sugary drinks tax</text>

<rect x="30" y="104" width="408" height="135" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MEXICO, 2014</text><text x="50" y="162.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">One peso per litre on</text><text x="50" y="186.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">sugar-sweetened drinks</text><rect x="462" y="104" width="408" height="135" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="482" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">UK, APRIL 2018</text><text x="482" y="162.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Soft Drinks Industry Levy:</text><text x="482" y="186.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">producers charged by sugar content</text><text x="482" y="214.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Many cut sugar before it began.</text><line x1="215" y1="307" x2="685" y2="307" stroke="#1e2a44" stroke-width="7" stroke-linecap="round"/><path d="M450,307 L420,399 L480,399 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><circle cx="450" cy="307" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="215" y1="307" x2="160" y2="362" stroke="#1e2a44" stroke-width="2.5"/><line x1="215" y1="307" x2="270" y2="362" stroke="#1e2a44" stroke-width="2.5"/><path d="M140,362 L290,362 Q275,389 215,389 Q155,389 140,362 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><line x1="685" y1="307" x2="630" y2="362" stroke="#1e2a44" stroke-width="2.5"/><line x1="685" y1="307" x2="740" y2="362" stroke="#1e2a44" stroke-width="2.5"/><path d="M610,362 L760,362 Q745,389 685,389 Q625,389 610,362 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="215" y="411" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">effective</text><text x="685" y="411" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">limits</text><rect x="30" y="435" width="405" height="157" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="471" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Likely effective</text><text x="50" y="499.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="499.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Targets one clear source of sugar</text><text x="50" y="525.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="525.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Gives manufacturers a reason to change</text><text x="65.2" y="546.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">recipes</text><rect x="465" y="435" width="405" height="157" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="485" y="471" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Limits</text><text x="485" y="499.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="500.2" y="499.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Treats one cause: people may switch to</text><text x="500.2" y="520.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">sweets</text><text x="485" y="546.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="500.2" y="546.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Fairness: poorer families spend more of</text><text x="500.2" y="567.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">their income on food</text><rect x="30" y="610" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="646" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">On balance</text><text x="50" y="675.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Best as one part of a wider plan, for example if the money raised funds free water and</text><text x="50" y="697.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">sport in schools.</text>
</svg>