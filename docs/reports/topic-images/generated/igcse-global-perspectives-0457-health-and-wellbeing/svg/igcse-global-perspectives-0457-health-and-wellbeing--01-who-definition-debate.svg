<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 508" width="900" height="508" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="508" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Even a definition is a perspective</text>

<rect x="30" y="104" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">WHO CONSTITUTION (ADOPTED 1946, IN FORCE 1948)</text><text x="50" y="164" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Health is “a state of complete physical, mental and social well-being</text><text x="50" y="190" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">and not merely the absence of disease or infirmity”</text><rect x="30" y="234" width="408" height="108" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="267" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">CRITICS</text><text x="50" y="292.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">“Complete” well-being sets a bar</text><text x="50" y="316.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">almost nobody reaches</text><rect x="462" y="234" width="408" height="108" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="482" y="267" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SUPPORTERS</text><text x="482" y="292.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">It reminds governments that mental</text><text x="482" y="316.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">and social health matter too</text><rect x="30" y="360" width="268" height="118" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="390.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Wellbeing</text><text x="46" y="418" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">how well a person feels and</text><text x="46" y="438" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">functions: mood,</text><text x="46" y="458" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">relationships, sleep, purpose</text><rect x="316" y="360" width="268" height="118" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="332" y="390.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Public health</text><text x="332" y="418" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">action to protect a whole</text><text x="332" y="438" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">population: vaccination, clean</text><text x="332" y="458" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">water, food rules</text><rect x="602" y="360" width="268" height="118" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="618" y="390.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Health inequality</text><text x="618" y="418" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">differences in health between</text><text x="618" y="438" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">groups, such as rich and poor</text><text x="618" y="458" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">areas</text>
</svg>