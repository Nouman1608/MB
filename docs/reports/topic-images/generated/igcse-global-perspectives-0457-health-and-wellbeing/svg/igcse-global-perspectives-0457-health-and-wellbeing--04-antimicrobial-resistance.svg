<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 729" width="900" height="729" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="729" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Health issues rarely have one cause</text>

<rect x="30" y="104" width="201" height="138" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="130.5" y="132.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Individual</text><text x="130.5" y="160" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">diet, exercise, sleep,</text><text x="130.5" y="180" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">smoking</text><rect x="243" y="104" width="201" height="138" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="343.5" y="132.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Social and</text><text x="343.5" y="156.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">economic</text><text x="343.5" y="184" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">income, housing,</text><text x="343.5" y="204" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">education, cost of</text><text x="343.5" y="224" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">healthy food</text><rect x="456" y="104" width="201" height="138" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="556.5" y="132.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Environmental</text><text x="556.5" y="160" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">air quality, unsafe</text><text x="556.5" y="180" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">water, lack of green</text><text x="556.5" y="200" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">space</text><rect x="669" y="104" width="201" height="138" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="769.5" y="132.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Political</text><text x="769.5" y="160" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">health spending, laws,</text><text x="769.5" y="180" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">advertising rules</text><text x="450" y="282" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Worked chain: antimicrobial resistance, a top global threat (WHO)</text><text x="228.5" y="326" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Cause</text><text x="671.5" y="326" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Consequence</text><rect x="30" y="342" width="397" height="91" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="370.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Antibiotics overused or misused in people,</text><text x="46" y="391.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">such as for viral infections they cannot</text><text x="46" y="412.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">treat</text><line x1="433" y1="387.5" x2="467" y2="387.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="342" width="397" height="91" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="489" y="381.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Surviving bacteria become resistant; common</text><text x="489" y="402.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">infections get harder to treat</text><rect x="30" y="447" width="397" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="486.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Antibiotics widely used in farm animals</text><line x1="433" y1="482" x2="467" y2="482" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="447" width="397" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="489" y="475.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Resistant bacteria spread through food</text><text x="489" y="496.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">chains and the environment</text><rect x="30" y="531" width="397" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="570.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Few new antibiotics being developed</text><line x1="433" y1="566" x2="467" y2="566" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="531" width="397" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="489" y="559.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fewer options for doctors; longer, more</text><text x="489" y="580.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">costly hospital stays</text><rect x="30" y="619" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="652.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Say who is affected and how: “routine operations become riskier because infections after</text><text x="50" y="674.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">surgery are harder to treat” earns more than “it is bad for health”.</text>
</svg>