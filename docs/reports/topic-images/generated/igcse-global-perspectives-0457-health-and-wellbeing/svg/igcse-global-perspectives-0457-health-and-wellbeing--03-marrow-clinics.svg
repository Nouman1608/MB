<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 684" width="900" height="684" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="684" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Closing village clinics: whose value comes first?</text>

<rect x="30" y="110" width="840" height="300" rx="14" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><rect x="560" y="220" width="200" height="110" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M650,245 h20 v20 h20 v20 h-20 v20 h-20 v-20 h-20 v-20 h20 z" fill="#b5602e"/><text x="660" y="360" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">New large hospital</text><text x="660" y="382" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">in the main town</text><rect x="70" y="150" width="80" height="56" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M88,162 l44,34 m0,-34 l-44,34" fill="none" stroke="#b5602e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><line x1="154" y1="180" x2="555" y2="275" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="8 7"/><rect x="100" y="270" width="80" height="56" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M118,282 l44,34 m0,-34 l-44,34" fill="none" stroke="#b5602e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><line x1="184" y1="300" x2="555" y2="275" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="8 7"/><rect x="290" y="335" width="80" height="56" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M308,347 l44,34 m0,-34 l-44,34" fill="none" stroke="#b5602e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><line x1="374" y1="365" x2="555" y2="275" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="8 7"/><text x="110" y="230" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">village clinic</text><text x="140" y="350" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">village clinic</text><text x="330" y="415" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">village clinic</text><text x="350" y="260" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">longer journeys</text><rect x="30" y="428" width="408" height="154" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="461" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">HEALTH AUTHORITY</text><text x="50" y="487.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Value: quality and efficiency</text><text x="50" y="515.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">One large hospital can afford specialist</text><text x="50" y="536.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">staff and equipment that three small clinics</text><text x="50" y="557.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">cannot.</text><rect x="462" y="428" width="408" height="154" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="482" y="461" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">OLDER VILLAGE RESIDENTS</text><text x="482" y="487.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Value: access and closeness</text><text x="482" y="515.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Many do not drive, so a longer journey may</text><text x="482" y="536.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">stop them seeking help early.</text><rect x="30" y="600" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="633.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Both sides use reasoning. The disagreement is really about which value should come first.</text>
</svg>