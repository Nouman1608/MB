<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 757" width="900" height="757" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="757" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">“9 out of 10 users felt less stressed”</text>

<rect x="30" y="104" width="840" height="86" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FICTIONAL ADVERT FROM THE COMPANY THAT SELLS CALMLEAF DROPS</text><text x="50" y="164" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">“In our trial, 9 out of 10 users felt less stressed after two weeks.”</text><rect x="40" y="225.5" width="40" height="40" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M51,236.5 l18,18 m0,-18 l-18,18" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="94" y="208" width="776" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="108" y="236.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Vested interest</text><text x="108" y="264.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The seller ran the trial and gains from a positive result.</text><rect x="40" y="308.5" width="40" height="40" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M51,319.5 l18,18 m0,-18 l-18,18" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="94" y="291" width="776" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="108" y="319.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">No sample size given</text><text x="108" y="347.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">If 40 users took part, that is 36 people: too few to generalise to everyone.</text><rect x="40" y="391.5" width="40" height="40" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M51,402.5 l18,18 m0,-18 l-18,18" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><rect x="94" y="374" width="776" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="108" y="402.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Self-reported, no comparison group</text><text x="108" y="430.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“Felt less stressed” is what users said, with no group who did not take the drops.</text><text x="450" y="487" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">So which explains the fall in stress?</text><rect x="30" y="513" width="268" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="164" y="559.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">The drops worked</text><rect x="316" y="513" width="268" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="547.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">People expected to</text><text x="450" y="571.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">feel better</text><rect x="602" y="513" width="268" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="736" y="547.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">The two weeks were</text><text x="736" y="571.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">simply calmer</text><rect x="30" y="615" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="651" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement</text><text x="50" y="680.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Without a comparison group the evidence cannot tell these apart, so it is weak support for</text><text x="50" y="702.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the claim.</text>
</svg>