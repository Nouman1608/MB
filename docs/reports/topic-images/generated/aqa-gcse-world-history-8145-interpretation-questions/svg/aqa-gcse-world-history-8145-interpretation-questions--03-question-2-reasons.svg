<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 601" width="900" height="601" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="601" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Question 2: why do they differ?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Link each author's circumstances to what they say</text>
<rect x="30" y="124" width="411" height="158" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="167" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXPERIENCE</text><text x="50" y="194.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Lived through it</text><text x="50" y="224.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Remembers what happened to them: vivid but</text><text x="50" y="246.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">may be narrow.</text><rect x="459" y="124" width="411" height="158" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">HINDSIGHT</text><text x="479" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Knows how it turned out</text><text x="479" y="213.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A historian in the 1990s writing on the 1920s</text><text x="479" y="235.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">boom knows the Crash followed; a 1927</text><text x="479" y="257.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">speech does not.</text><rect x="30" y="300" width="411" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="332" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PURPOSE AND AUDIENCE</text><text x="50" y="359.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Why and for whom</text><text x="50" y="389.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A politician's memoir may defend his record;</text><text x="50" y="411.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">a textbook aims at a balanced overview.</text><rect x="459" y="300" width="411" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="332" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FOCUS</text><text x="479" y="359.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Looking at different things</text><text x="479" y="389.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Different groups, places or parts of the</text><text x="479" y="411.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">period.</text><rect x="30" y="458" width="397" height="111" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="492.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Weak</text><text x="50" y="522.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">"One is biased." "They had different</text><text x="50" y="544.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">opinions." These explain nothing.</text><line x1="433" y1="513.5" x2="467" y2="513.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="458" width="397" height="111" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="493" y="492.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Strong</text><text x="493" y="522.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Connects the provenance to the particular</text><text x="493" y="544.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">difference found in question 1.</text>
</svg>