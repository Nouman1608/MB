<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 636" width="900" height="636" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="636" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The New Deal: weighing A and B</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Question 3 plan</text>
<rect x="30" y="124" width="411" height="154" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">A IS CONVINCING</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Lasting change</text><text x="50" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Emergency Banking Act and fireside chats</text><text x="50" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(1933); CCC and WPA gave work to millions;</text><text x="50" y="253.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Social Security Act (1935).</text><rect x="459" y="124" width="411" height="154" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="479" y="166.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">A IS LIMITED</text><text x="479" y="193.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Unemployment stayed high</text><text x="479" y="222.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">About a quarter of the workforce in 1933; still</text><text x="479" y="243.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">high at the end of the decade, as A admits.</text><rect x="30" y="296" width="411" height="175" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="328" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">B IS CONVINCING</text><text x="50" y="354.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Recovery came with war</text><text x="50" y="383.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Recession again in 1937-38; wartime production</text><text x="50" y="404.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">after 1941 ended mass unemployment; Supreme</text><text x="50" y="425.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Court and many Republicans opposed</text><text x="50" y="446.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">regulation.</text><rect x="459" y="296" width="411" height="175" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="338.5" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">B IS LIMITED</text><text x="479" y="365.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A hostile caricature</text><text x="479" y="394.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Work schemes built roads, schools, dams and</text><text x="479" y="415.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">bridges; the TVA brought electricity to a poor</text><text x="479" y="436.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">region.</text><rect x="30" y="493" width="411" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="235.5" y="527.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Did it END the Depression?</text><text x="235.5" y="557.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">B is more convincing, and A concedes the</text><text x="235.5" y="579.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">point.</text><rect x="459" y="493" width="411" height="111" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="664.5" y="538.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Did it CHANGE America?</text><text x="664.5" y="568.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">A is stronger.</text>
</svg>