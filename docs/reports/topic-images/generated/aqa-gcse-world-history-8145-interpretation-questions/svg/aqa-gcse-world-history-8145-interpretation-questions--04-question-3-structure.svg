<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 599" width="900" height="599" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="599" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Question 3: which is more convincing?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">8 marks, about ten minutes</text>
<rect x="30" y="124" width="411" height="141" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INTERPRETATION A</text><text x="50" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Test its main claim</text><text x="50" y="213.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="213.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Knowledge that <tspan font-weight="700" fill="#1e2a44">supports</tspan> it</text><text x="50" y="240.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="240.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Knowledge that <tspan font-weight="700" fill="#1e2a44">challenges</tspan> <tspan font-weight="700" fill="#1e2a44">or</tspan> <tspan font-weight="700" fill="#1e2a44">limits</tspan> it</text><rect x="459" y="124" width="411" height="141" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="156" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">INTERPRETATION B</text><text x="479" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Test its main claim</text><text x="479" y="213.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.15" y="213.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Knowledge that <tspan font-weight="700" fill="#1e2a44">supports</tspan> it</text><text x="479" y="240.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.15" y="240.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Knowledge that <tspan font-weight="700" fill="#1e2a44">challenges</tspan> <tspan font-weight="700" fill="#1e2a44">or</tspan> <tspan font-weight="700" fill="#1e2a44">limits</tspan> it</text><line x1="240" y1="279" x2="400" y2="317" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="660" y1="279" x2="500" y2="317" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="333" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="367.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement</text><text x="50" y="397.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Which is more convincing <tspan font-weight="700" fill="#1e2a44">and</tspan> <tspan font-weight="700" fill="#1e2a44">why</tspan>, based on the weight of evidence. A split judgement is</text><text x="50" y="419.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">acceptable if you then decide which matters more for the question asked.</text><rect x="30" y="456" width="840" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="490.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">"Convincing" = supported by accurate historical knowledge</text><text x="50" y="520.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Provenance can support the judgement but not replace it: an eyewitness can be right; a historian</text><text x="50" y="542.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">can be one-sided.</text>
</svg>