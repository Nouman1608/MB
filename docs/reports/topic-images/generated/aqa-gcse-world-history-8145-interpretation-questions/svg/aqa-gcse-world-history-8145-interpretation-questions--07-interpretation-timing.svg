<rect width="900" height="568" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Questions 1-3 at a glance</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">16 marks in roughly 20-25 minutes</text>
<rect x="30" y="124" width="210" height="84" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="135" y="162" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Q1 · 4</text><text x="135" y="186" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">how they differ</text><rect x="240" y="124" width="210" height="84" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="345" y="162" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Q2 · 4</text><text x="345" y="186" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">why they differ</text><rect x="450" y="124" width="420" height="84" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="660" y="162" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Q3 · 8</text><text x="660" y="186" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">how convincing</text><text x="450" y="236" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Bar widths to scale by marks</text><rect x="30" y="254" width="243.63636363636365" height="133" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="286" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Q1 USES</text><text x="50" y="312.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Content</text><text x="50" y="341.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">What each interpretation</text><text x="50" y="362.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">says.</text><rect x="291.6363636363636" y="254" width="243.63636363636365" height="133" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="311.6363636363636" y="286" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Q2 USES</text><text x="311.6363636363636" y="312.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Provenance</text><text x="311.6363636363636" y="341.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Who wrote it, when, why</text><text x="311.6363636363636" y="362.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and for whom.</text><rect x="553.2727272727273" y="254" width="316.72727272727275" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="573.2727272727273" y="286" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">Q3 USES</text><text x="573.2727272727273" y="312.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Your knowledge</text><text x="573.2727272727273" y="341.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">At least two precise facts, dates or</text><text x="573.2727272727273" y="362.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">names per paragraph.</text><rect x="30" y="403" width="840" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="437.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Before you start</text><text x="50" y="467.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Read both ascriptions first; underline the date and the author's role. Open each answer with the</text><text x="50" y="489.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">command phrase: "B differs from A because...", "They differ because the authors...", "A is more</text><text x="50" y="511.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">convincing because..."</text>
</svg>