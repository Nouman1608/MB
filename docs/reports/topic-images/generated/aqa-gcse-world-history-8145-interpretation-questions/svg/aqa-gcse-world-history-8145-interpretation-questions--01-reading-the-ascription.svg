<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 604" width="900" height="604" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="604" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading the ascription</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">An interpretation is a view of the past formed afterwards</text>
<rect x="30" y="124" width="411" height="158" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SECTION A</text><text x="50" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Interpretation</text><text x="50" y="213.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Formed afterwards, usually with hindsight: a</text><text x="50" y="235.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">historian's book, textbook, later memoir,</text><text x="50" y="257.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">documentary script or biography.</text><rect x="459" y="124" width="411" height="158" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SECTION B</text><text x="479" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Contemporary source</text><text x="479" y="213.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Produced at the time. Not the same thing. No</text><text x="479" y="235.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">historiography is needed: you will never have</text><text x="479" y="257.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">to name historians.</text><text x="30" y="312" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">FOUR DETAILS IN EVERY ASCRIPTION</text><rect x="30" y="330" width="411" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="365.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Who</text><text x="50" y="395.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">What the author experienced, believed or had</text><text x="50" y="417.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">at stake.</text><rect x="459" y="330" width="411" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="365.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">When</text><text x="479" y="395.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">How much hindsight the author had; what had</text><text x="479" y="417.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">happened by then.</text><rect x="30" y="460" width="411" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="495.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">What kind of work</text><text x="50" y="525.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">How much the author was trying to persuade,</text><text x="50" y="547.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">remember or explain.</text><rect x="459" y="460" width="411" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="495.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Where or for whom</text><text x="479" y="525.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Who the audience was and what they wanted</text><text x="479" y="547.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">to hear.</text>
</svg>