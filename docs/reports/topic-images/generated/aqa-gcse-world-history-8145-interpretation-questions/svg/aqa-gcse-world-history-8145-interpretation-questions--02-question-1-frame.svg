<rect width="900" height="611" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Question 1: state the difference</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Content only, 4 marks</text>
<line x1="60" y1="144" x2="60" y2="386" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="86" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122" y="157.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">State the main difference directly</text><text x="122" y="187.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">"Interpretation A argues that..., whereas Interpretation B argues that..."</text><circle cx="60" cy="167" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="175.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="222" width="766" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="255.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Support A</text><text x="122" y="285.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A short quotation or close paraphrase from A.</text><circle cx="60" cy="265" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="273.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="320" width="766" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="353.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Support B</text><text x="122" y="383.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A short quotation or close paraphrase from B.</text><circle cx="60" cy="363" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="371.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="30" y="428" width="411" height="151" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="462.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Aim for the overall view</text><text x="50" y="491.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">One well-supported difference in overall</text><text x="50" y="512.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">argument beats a list of small details. A</text><text x="50" y="533.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">difference of emphasis counts if you can show</text><text x="50" y="554.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">it.</text><rect x="459" y="428" width="411" height="151" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="479" y="483.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Not here: provenance</text><text x="479" y="512.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Explaining why they differ belongs in question 2</text><text x="479" y="533.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and earns nothing in question 1.</text>
</svg>