<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 651" width="900" height="651" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="651" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Impacts on soils, plants and buildings</text>

<rect x="121.6875" y="118.5" width="78.625" height="33" rx="16.5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="161" y="141.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Soils</text><rect x="30" y="170" width="262" height="127" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="213.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Nutrients washed out</text><text x="48" y="245.32" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">calcium and magnesium</text><text x="48" y="266.32" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">leave the soil</text><line x1="161" y1="301" x2="161" y2="335" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="341" width="262" height="106" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="384.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Aluminium released</text><text x="48" y="416.32" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">it damages roots</text><line x1="161" y1="451" x2="161" y2="485" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="491" width="262" height="130" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="523.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Trees and crops</text><text x="48" y="547.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">struggle</text><text x="48" y="579.82" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to take up water and</text><text x="48" y="600.82" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">nutrients</text><rect x="405.225" y="118.5" width="89.55" height="33" rx="16.5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="450" y="141.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Leaves</text><rect x="319" y="170" width="262" height="127" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="337" y="223.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Leaves damaged</text><text x="337" y="255.82" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">by acid deposits</text><line x1="450" y1="301" x2="450" y2="335" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="319" y="341" width="262" height="106" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="337" y="373.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Defoliation</text><text x="337" y="405.82" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">weakened trees lose leaves</text><text x="337" y="426.82" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">or needles</text><line x1="450" y1="451" x2="450" y2="485" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="319" y="491" width="262" height="130" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="337" y="535.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Less photosynthesis</text><text x="337" y="567.82" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">growth slows and crop</text><text x="337" y="588.82" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">yields fall</text><rect x="677.8375" y="118.5" width="122.32499999999999" height="33" rx="16.5" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><text x="739" y="141.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Buildings</text><rect x="608" y="170" width="262" height="127" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="626" y="202.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Limestone and marble</text><text x="626" y="234.82" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">calcium carbonate reacts</text><text x="626" y="255.82" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">with acid: carvings and</text><text x="626" y="276.82" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">statues wear away</text><line x1="739" y1="301" x2="739" y2="335" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="608" y="341" width="262" height="106" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="626" y="384.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Iron and steel</text><text x="626" y="416.32" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">corrode faster</text><line x1="739" y1="451" x2="739" y2="485" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="608" y="491" width="262" height="130" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="626" y="535.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">High repair costs</text><text x="626" y="567.82" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and cultural heritage is</text><text x="626" y="588.82" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">lost</text>
</svg>