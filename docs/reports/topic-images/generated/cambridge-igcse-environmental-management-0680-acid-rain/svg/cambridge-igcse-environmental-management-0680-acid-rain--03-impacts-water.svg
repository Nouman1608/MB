<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 698" width="900" height="698" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="698" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Impacts on lakes, rivers and food webs</text>

<rect x="200" y="110" width="500" height="109" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="143.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Lakes and rivers become more acidic</text><text x="450" y="176.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">worst where the rock cannot neutralise acid; spring</text><text x="450" y="198.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">snowmelt brings a sudden pulse</text><polyline points="380,219 380,237 240,237 240,239" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#ah)"/><polyline points="520,219 520,237 660,237 660,239" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#ah)"/><text x="240" y="263" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Direct harm to fish</text><rect x="40" y="279" width="400" height="106" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="58" y="311.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Aluminium released</text><text x="58" y="343.82" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">acid water releases aluminium from soils</text><text x="58" y="364.82" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">into lakes</text><line x1="240" y1="389" x2="240" y2="425" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="40" y="431" width="400" height="85" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="58" y="463.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Fish gills damaged</text><text x="58" y="495.82" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">eggs and young fish are the most sensitive</text><line x1="240" y1="520" x2="240" y2="556" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="40" y="562" width="400" height="106" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="58" y="594.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Fish populations fall</text><text x="58" y="626.82" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fewer survive to breed; some lakes lose</text><text x="58" y="647.82" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">their fish entirely</text><text x="660" y="263" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Harm through the food web</text><rect x="460" y="279" width="400" height="106" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="311.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Invertebrates die out</text><text x="478" y="343.82" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">snails, mayfly larvae and crustaceans</text><text x="478" y="364.82" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cannot survive low pH</text><line x1="660" y1="389" x2="660" y2="425" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="460" y="431" width="400" height="85" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="463.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Fish lose their food</text><text x="478" y="495.82" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the food web loses a link</text><line x1="660" y1="520" x2="660" y2="556" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="460" y="562" width="400" height="106" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="478" y="594.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Birds and mammals follow</text><text x="478" y="626.82" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">animals that feed on fish decline;</text><text x="478" y="647.82" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">biodiversity falls</text>
</svg>