<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 758" width="900" height="758" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="758" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Match each strategy to its source</text>

<rect x="30" y="120" width="230" height="110" rx="12" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><text x="145" y="152.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Power stations</text><text x="145" y="176.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">and factories</text><text x="145" y="208.82" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">sulfur dioxide</text><rect x="30" y="330" width="230" height="110" rx="12" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><text x="145" y="374.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Vehicles</text><text x="145" y="406.82" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">oxides of nitrogen</text><rect x="330" y="120" width="540" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="350" y="150" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Flue-gas desulfurisation</text><text x="350" y="178" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">+</text><text x="372" y="178" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">removes most SO₂ from large single sources</text><text x="350" y="203" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">−</text><text x="372" y="203" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">expensive; needs quarried limestone; releases carbon</text><text x="372" y="224" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">dioxide; does nothing for vehicles</text><rect x="330" y="280" width="540" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="350" y="310" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Catalytic converters</text><text x="350" y="338" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">+</text><text x="372" y="338" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">cut NOₓ from every fitted vehicle</text><text x="350" y="363" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">−</text><text x="372" y="363" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">not until warm, so short journeys less effective; rare,</text><text x="372" y="384" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">costly metals; no cut in carbon dioxide</text><rect x="330" y="440" width="540" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="350" y="470" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Transport policies</text><text x="350" y="498" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">+</text><text x="372" y="498" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">cut several pollutants, congestion and carbon</text><text x="372" y="519" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">dioxide</text><text x="350" y="544" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">−</text><text x="372" y="544" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">can be unpopular; need good alternatives; slow to change</text><text x="372" y="565" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">habits; fewer rural options</text><line x1="262" y1="175" x2="324" y2="190" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="262" y1="385" x2="324" y2="330" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="262" y1="395" x2="324" y2="500" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="620" width="840" height="108" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="652.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">All three act at source</text><text x="48" y="684.82" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">They prevent future acid rain, but they do not repair lakes and soils that are already</text><text x="48" y="706.82" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">acidified: these can take many years to recover.</text>
</svg>