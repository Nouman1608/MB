<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" width="900" height="760" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="760" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three ways to cut the gases at source</text>

<rect x="30" y="110" width="840" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Flue-gas desulfurisation (power stations)</text><rect x="60" y="220" width="120" height="110" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="120" y="268" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">boiler</text><text x="120" y="290" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">burns coal</text><line x1="184" y1="275" x2="300" y2="275" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><text x="242" y="262" font-size="15" font-weight="600" fill="#b5602e" text-anchor="middle">flue gas</text><text x="242" y="300" font-size="15" font-weight="600" fill="#b5602e" text-anchor="middle">with SO₂</text><rect x="305" y="190" width="200" height="160" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="405" y="222" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">scrubber</text><line x1="335" y1="238" x2="329" y2="262" stroke="#2b5a9a" stroke-width="3"/><line x1="365" y1="238" x2="359" y2="272" stroke="#2b5a9a" stroke-width="3"/><line x1="395" y1="238" x2="389" y2="262" stroke="#2b5a9a" stroke-width="3"/><line x1="425" y1="238" x2="419" y2="272" stroke="#2b5a9a" stroke-width="3"/><line x1="455" y1="238" x2="449" y2="262" stroke="#2b5a9a" stroke-width="3"/><line x1="475" y1="238" x2="469" y2="272" stroke="#2b5a9a" stroke-width="3"/><text x="405" y="296" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">slurry of calcium</text><text x="405" y="314" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">carbonate or oxide</text><text x="405" y="332" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">reacts with SO₂</text><polyline points="505,230 560,230 560,175" fill="none" stroke="#2e6b62" stroke-width="5" stroke-linejoin="round" marker-end="url(#ahT)"/><rect x="548" y="150" width="24" height="0" rx="0" fill="#1e2a44"/><text x="585" y="200" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">cleaner gas leaves</text><text x="585" y="220" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">the chimney</text><line x1="505" y1="320" x2="640" y2="320" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="648" y="290" width="200" height="66" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="748" y="318" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">solid calcium</text><text x="748" y="340" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">compound</text><text x="748" y="384" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">used to make plasterboard</text><rect x="30" y="430" width="410" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="468" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Catalytic converter (vehicles)</text><rect x="150" y="540" width="150" height="80" rx="30" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3"/><text x="225" y="576" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">catalyst</text><text x="225" y="598" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">once warm</text><line x1="52" y1="580" x2="146" y2="580" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><text x="60" y="562" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">NOₓ in</text><line x1="304" y1="580" x2="410" y2="580" stroke="#2e6b62" stroke-width="5" marker-end="url(#ahT)"/><text x="310" y="562" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">out:</text><text x="54" y="660" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Oxides of nitrogen are converted</text><text x="54" y="682" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">into nitrogen and oxygen before</text><text x="54" y="704" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">they leave the exhaust pipe.</text><text x="310" y="612" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">nitrogen +</text><text x="310" y="630" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">oxygen</text><rect x="460" y="430" width="410" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="484" y="468" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Transport policies</text><rect x="484" y="495.5" width="162" height="29" rx="14.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="565" y="515.4" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">public transport</text><rect x="674" y="495.5" width="179.25" height="29" rx="14.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="763.625" y="515.4" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">congestion charges</text><rect x="484" y="539.5" width="179.25" height="29" rx="14.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="573.625" y="559.4" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">low-emission zones</text><rect x="674" y="539.5" width="136.125" height="29" rx="14.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="742.0625" y="559.4" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">park-and-ride</text><rect x="484" y="583.5" width="118.87499999999999" height="29" rx="14.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="543.4375" y="603.4" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">cycle lanes</text><rect x="674" y="583.5" width="170.625" height="29" rx="14.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="759.3125" y="603.4" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">electric vehicles</text><line x1="665" y1="630" x2="665" y2="662" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="665" y="692" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">fewer vehicle journeys,</text><text x="665" y="714" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">so less oxides of nitrogen</text>
</svg>