<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="610" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading the pH of rain</text>

<rect x="30" y="110" width="840" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="110" y="250" width="170" height="50" rx="0" fill="#b5602e"/><rect x="280" y="250" width="170" height="50" rx="0" fill="#d4b02e"/><rect x="450" y="250" width="170" height="50" rx="0" fill="#f2e7b8"/><rect x="620" y="250" width="170" height="50" rx="0" fill="#dce9e7"/><rect x="110" y="250" width="680" height="50" rx="0" fill="none" stroke="#1e2a44" stroke-width="3"/><line x1="110" y1="300" x2="110" y2="312" stroke="#1e2a44" stroke-width="2.5"/><text x="110" y="336" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">pH 3</text><line x1="280" y1="300" x2="280" y2="312" stroke="#1e2a44" stroke-width="2.5"/><text x="280" y="336" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">pH 4</text><line x1="450" y1="300" x2="450" y2="312" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="336" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">pH 5</text><line x1="620" y1="300" x2="620" y2="312" stroke="#1e2a44" stroke-width="2.5"/><text x="620" y="336" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">pH 6</text><line x1="790" y1="300" x2="790" y2="312" stroke="#1e2a44" stroke-width="2.5"/><text x="790" y="336" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">pH 7</text><text x="110" y="230" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">more acidic</text><text x="790" y="230" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="end">neutral</text><line x1="552" y1="160" x2="552" y2="306" stroke="#1e2a44" stroke-width="3.5"/><path d="M543,245 L561,245 L552,258 Z" fill="#1e2a44"/><text x="564" y="160" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">normal rain: about pH 5.6</text><text x="564" y="182" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(carbon dioxide dissolves in it)</text><path d="M110,352 L110,364 L552,364 L552,352" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="331" y="390" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">acid rain: lower pH than normal rain</text><path d="M780,440 Q705,404 632,440" fill="none" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><text x="705" y="460" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">×10</text><path d="M610,440 Q535,404 462,440" fill="none" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><text x="535" y="460" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">×10</text><path d="M440,440 Q365,404 292,440" fill="none" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><text x="365" y="460" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">×10</text><path d="M270,440 Q195,404 122,440" fill="none" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><text x="195" y="460" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">×10</text><rect x="60" y="488" width="780" height="72" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="516.04" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">The scale is logarithmic: each fall of one unit means ten times more acidic,</text><text x="450" y="540.04" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">so a fall of two units means a hundred times more acidic.</text>
</svg>