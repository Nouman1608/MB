ke-width="3"/><line x1="682" y1="336" x2="674" y2="366" stroke="#2b5a9a" stroke-width="3"/><line x1="720" y1="298" x2="712" y2="328" stroke="#2b5a9a" stroke-width="3"/><line x1="706" y1="360" x2="698" y2="390" stroke="#2b5a9a" stroke-width="3"/><line x1="744" y1="250" x2="736" y2="280" stroke="#2b5a9a" stroke-width="3"/><line x1="730" y1="312" x2="722" y2="342" stroke="#2b5a9a" stroke-width="3"/><text x="860" y="262" font-size="17" font-weight="700" fill="#2b5a9a" text-anchor="end">acid rain,</text><text x="860" y="283" font-size="17" font-weight="700" fill="#2b5a9a" text-anchor="end">snow or mist</text><line x1="180" y1="152" x2="500" y2="152" stroke="#8a6d0d" stroke-width="5" marker-end="url(#ahO)"/><text x="340" y="138" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">wind carries the gases hundreds of km</text><text x="130" y="450" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">volcano</text><text x="290" y="450" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">power station</text><text x="437" y="450" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">vehicles</text><text x="645" y="450" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">forest</text><text x="742" y="472" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">lake</text><text x="835" y="450" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">building</text><text x="290" y="472" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">tall chimney: gases travel further</text><text x="858" y="500" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Not to scale</text><rect x="30" y="545" width="201" height="188" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="597.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sulfur dioxide</text><text x="46" y="628.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">from burning fossil</text><text x="46" y="649.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fuels that contain</text><text x="46" y="670.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sulfur: power</text><text x="46" y="691.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">stations,</text><text x="46" y="712.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">factories, ships</text><circle cx="52" cy="545" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="52" y="551.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="243" y="545" width="201" height="188" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="259" y="597.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sulfur dioxide</text><text x="259" y="628.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">from volcanic</text><text x="259" y="649.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">gases: a natural</text><text x="259" y="670.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">source that cannot</text><text x="259" y="691.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">be managed</text><circle cx="265" cy="545" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="265" y="551.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="456" y="545" width="201" height="188" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="472" y="597.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Oxides of</text><text x="472" y="620.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">nitrogen</text><text x="472" y="651.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">nitrogen from the</text><text x="472" y="672.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">air reacts with</text><text x="472" y="693.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">oxygen in hot</text><text x="472" y="714.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">vehicle engines</text><circle cx="478" cy="545" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="478" y="551.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="669" y="545" width="201" height="188" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="685" y="597.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Reaction</text><text x="685" y="628.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">both gases react</text><text x="685" y="649.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">with oxygen and</text><text x="685" y="670.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">water vapour to</text><text x="685" y="691.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">form acids</text><circle cx="691" cy="545" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="691" y="551.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text>
