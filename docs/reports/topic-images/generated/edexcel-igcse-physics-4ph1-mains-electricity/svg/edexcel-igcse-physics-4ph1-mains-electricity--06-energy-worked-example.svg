<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 425" width="900" height="425" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="425" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: energy from the mains</text>

<rect x="30" y="110" width="300" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="80" y="160" width="200" height="120" rx="10" fill="#e3e6e6" stroke="#1e2a44" stroke-width="3" /><path d="M110,225 l8.75,-12 l8.75,12 l8.75,-12 l8.75,12 l8.75,-12 l8.75,12 l8.75,-12 l8.75,12 l8.75,-12 l8.75,12 l8.75,-12 l8.75,12 l8.75,-12 l8.75,12 l8.75,-12 l8.75,12" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="180" y="300" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">electric heater</text><text x="180" y="330" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">8.7 A from 230 V, 2.0 hours</text><rect x="350" y="110" width="520" height="261.6" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="374" y="151.1" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Convert the time first</text><text x="374" y="189.1" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">t = 2.0 × 3600 = 7200 s</text><text x="374" y="227.1" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">E = I × V × t</text><text x="396" y="265.1" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">= 8.7 × 230 × 7200</text><text x="396" y="303.1" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">= 14 407 200 J</text><text x="396" y="341.1" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">≈ 1.4 × 10⁷ J (14 MJ)</text><text x="450" y="400" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">E in J, I in A, V in V, t in s. Give large answers in standard form or MJ.</text>
</svg>