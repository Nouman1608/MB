<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 625" width="900" height="625" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="625" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Earthing: what happens in a fault</text>

<rect x="30" y="110" width="270" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="58" cy="140" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="58" y="145.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="82" y="146" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Fault</text><rect x="160" y="200" width="110" height="150" rx="8" fill="#e3e6e6" stroke="#1e2a44" stroke-width="3.5" /><polyline points="50,230 215,230" fill="none" stroke="#b5602e" stroke-width="4" stroke-linejoin="round"/><rect x="82" y="219" width="56" height="22" rx="3" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><line x1="82" y1="230" x2="138" y2="230" stroke="#1e2a44" stroke-width="2.5" stroke-linecap="round"/><path d="M215,230 l12,0" fill="none" stroke="#b5602e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><circle cx="229" cy="230" r="6" fill="#d4b02e" stroke="#b5602e" stroke-width="2"/><polyline points="160,300 110,300 110,370" fill="none" stroke="#6f9a52" stroke-width="4" stroke-linejoin="round"/><line x1="110" y1="370" x2="110" y2="384" stroke="#6f9a52" stroke-width="3.5" stroke-linecap="round"/><line x1="92" y1="384" x2="128" y2="384" stroke="#6f9a52" stroke-width="3.5" stroke-linecap="round"/><line x1="99" y1="392" x2="121" y2="392" stroke="#6f9a52" stroke-width="3" stroke-linecap="round"/><line x1="105" y1="400" x2="115" y2="400" stroke="#6f9a52" stroke-width="2.5" stroke-linecap="round"/><text x="185" y="380" font-size="15" font-weight="600" fill="#b5602e" text-anchor="middle">live touches</text><text x="185" y="398" font-size="15" font-weight="600" fill="#b5602e" text-anchor="middle">the case</text><text x="48" y="420" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">The live wire comes loose and</text><text x="48" y="440" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">touches the metal case.</text><rect x="315" y="110" width="270" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="343" cy="140" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="343" y="145.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="367" y="146" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Low-resistance path</text><rect x="445" y="200" width="110" height="150" rx="8" fill="#e3e6e6" stroke="#1e2a44" stroke-width="3.5" /><polyline points="335,230 510,230" fill="none" stroke="#b5602e" stroke-width="6" stroke-linejoin="round"/><rect x="367" y="219" width="56" height="22" rx="3" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><line x1="367" y1="230" x2="423" y2="230" stroke="#1e2a44" stroke-width="2.5" stroke-linecap="round"/><polyline points="445,300 395,300 395,370" fill="none" stroke="#6f9a52" stroke-width="6" stroke-linejoin="round"/><line x1="395" y1="370" x2="395" y2="384" stroke="#6f9a52" stroke-width="3.5" stroke-linecap="round"/><line x1="377" y1="384" x2="413" y2="384" stroke="#6f9a52" stroke-width="3.5" stroke-linecap="round"/><line x1="384" y1="392" x2="406" y2="392" stroke="#6f9a52" stroke-width="3" stroke-linecap="round"/><line x1="390" y1="400" x2="400" y2="400" stroke="#6f9a52" stroke-width="2.5" stroke-linecap="round"/><line x1="345" y1="214" x2="375" y2="214" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><line x1="470" y1="250" x2="470" y2="290" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><line x1="425" y1="286" x2="405" y2="286" stroke="#6f9a52" stroke-width="3.5" marker-end="url(#ahO)"/><line x1="395" y1="320" x2="395" y2="355" stroke="#6f9a52" stroke-width="3.5" marker-end="url(#ahO)"/><text x="500" y="380" font-size="15" font-weight="600" fill="#b5602e" text-anchor="end">large current</text><text x="500" y="398" font-size="15" font-weight="600" fill="#b5602e" text-anchor="end">to earth</text><text x="333" y="420" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">A large current flows through</text><text x="333" y="440" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">the case and earth wire to</text><text x="333" y="460" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">the ground, not through a</text><text x="333" y="480" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">person.</text><rect x="600" y="110" width="270" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="628" cy="140" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="628" y="145.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="652" y="146" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Supply cut off</text><rect x="730" y="200" width="110" height="150" rx="8" fill="#e3e6e6" stroke="#1e2a44" stroke-width="3.5" /><polyline points="620,230 650,230" fill="none" stroke="#b5602e" stroke-width="4" stroke-linejoin="round"/><rect x="652" y="219" width="56" height="22" rx="3" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><line x1="652" y1="230" x2="672" y2="230" stroke="#1e2a44" stroke-width="2.5" stroke-linecap="round"/><line x1="688" y1="230" x2="708" y2="230" stroke="#1e2a44" stroke-width="2.5" stroke-linecap="round"/><path d="M674,224 l4,4 l-3,3 M686,236 l-4,-4 l3,-3" fill="none" stroke="#b5602e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><polyline points="710,230 800,230" fill="none" stroke="#9aa5a5" stroke-width="4" stroke-linejoin="round"/><polyline points="730,300 680,300 680,370" fill="none" stroke="#6f9a52" stroke-width="4" stroke-linejoin="round"/><line x1="680" y1="370" x2="680" y2="384" stroke="#6f9a52" stroke-width="3.5" stroke-linecap="round"/><line x1="662" y1="384" x2="698" y2="384" stroke="#6f9a52" stroke-width="3.5" stroke-linecap="round"/><line x1="669" y1="392" x2="691" y2="392" stroke="#6f9a52" stroke-width="3" stroke-linecap="round"/><line x1="675" y1="400" x2="685" y2="400" stroke="#6f9a52" stroke-width="2.5" stroke-linecap="round"/><text x="680" y="205" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">fuse melts</text><text x="785" y="380" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="end">case safe</text><text x="618" y="420" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">The large current blows the</text><text x="618" y="440" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">fuse (or trips the breaker),</text><text x="618" y="460" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">disconnecting the live wire.</text><rect x="30" y="545" width="840" height="60" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="582" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">The earth wire does not "absorb" the current: it gives a low-resistance path, then the fuse blows.</text>
</svg>