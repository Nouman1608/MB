roke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5"/><circle cx="150" cy="262" r="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><circle cx="400" cy="262" r="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><circle cx="620" cy="290" r="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><line x1="770" y1="262" x2="830" y2="262" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><text x="450" y="160" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">metal resistor</text><text x="205" y="412" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">electron collides with an ion</text><text x="650" y="412" font-size="15" font-weight="600" fill="#b5602e" text-anchor="middle">ions vibrate more: temperature rises</text><rect x="30" y="455" width="410" height="170" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="493.8" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="start">Useful</text><text x="52" y="517.05" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Kettles, toasters, heaters, irons, immersion</text><text x="52" y="536.8499999999999" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">heaters, hairdryers, electric showers:</text><text x="52" y="556.65" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">elements of high-resistance wire. Also how a</text><text x="52" y="576.4499999999999" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">fuse works.</text><rect x="460" y="455" width="410" height="170" rx="14" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="482" y="493.8" font-size="21" font-weight="700" fill="#b5602e" text-anchor="start">Wasteful</text><text x="482" y="517.05" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Heating in cables, so cables are</text><text x="482" y="536.8499999999999" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">low-resistance copper. A cable carrying too</text><text x="482" y="556.65" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">large a current becomes hot.</text>
