<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="680" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Fuses, circuit breakers and double insulation</text>

<rect x="30" y="110" width="270" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165" y="146" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Double insulation</text><rect x="70" y="175" width="190" height="130" rx="22" fill="#dce9e7" stroke="#1e2a44" stroke-width="3" /><rect x="110" y="210" width="110" height="60" rx="6" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2" /><text x="165" y="246" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">live parts</text><text x="165" y="325" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">insulating (plastic) case</text><rect x="140" y="345" width="50" height="50" rx="0" fill="none" stroke="#1e2a44" stroke-width="3" /><rect x="152" y="357" width="26" height="26" rx="0" fill="none" stroke="#1e2a44" stroke-width="3" /><text x="48" y="425" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">No touchable metal part can</text><text x="48" y="445" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">become live: no earth wire</text><text x="48" y="465" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">needed.</text><rect x="315" y="110" width="270" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="146" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Fuse</text><rect x="372" y="199" width="56" height="22" rx="3" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><line x1="372" y1="210" x2="428" y2="210" stroke="#1e2a44" stroke-width="2.5" stroke-linecap="round"/><text x="400" y="245" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">normal</text><rect x="472" y="199" width="56" height="22" rx="3" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><line x1="472" y1="210" x2="492" y2="210" stroke="#1e2a44" stroke-width="2.5" stroke-linecap="round"/><line x1="508" y1="210" x2="528" y2="210" stroke="#1e2a44" stroke-width="2.5" stroke-linecap="round"/><path d="M494,204 l4,4 l-3,3 M506,216 l-4,-4 l3,-3" fill="none" stroke="#b5602e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="500" y="245" font-size="15" font-weight="600" fill="#b5602e" text-anchor="middle">melted</text><text x="333" y="290" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Thin wire heats and melts</text><text x="333" y="310" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">when the current exceeds its</text><text x="333" y="330" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">rating. Must be replaced.</text><rect x="600" y="110" width="270" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="735" y="146" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Circuit breaker</text><rect x="656" y="202" width="48" height="16" rx="0" fill="#ffffff" stroke="none" stroke-width="0" /><circle cx="660" cy="210" r="4" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><circle cx="700" cy="210" r="4" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><line x1="660" y1="210" x2="700" y2="210" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><text x="680" y="245" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">normal</text><rect x="766" y="202" width="48" height="16" rx="0" fill="#ffffff" stroke="none" stroke-width="0" /><circle cx="770" cy="210" r="4" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><circle cx="810" cy="210" r="4" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><line x1="770" y1="210" x2="808" y2="190" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><text x="790" y="245" font-size="15" font-weight="600" fill="#b5602e" text-anchor="middle">tripped</text><text x="618" y="290" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Automatic switch opens when</text><text x="618" y="310" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">the current is too large. Can</text><text x="618" y="330" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">be reset; generally faster.</text><rect x="30" y="485" width="840" height="175" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="520" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Fuses and circuit breakers go in the LIVE side</text><polyline points="60,570 400,570" fill="none" stroke="#b5602e" stroke-width="4" stroke-linejoin="round"/><rect x="172" y="559" width="56" height="22" rx="3" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><line x1="172" y1="570" x2="192" y2="570" stroke="#1e2a44" stroke-width="2.5" stroke-linecap="round"/><line x1="208" y1="570" x2="228" y2="570" stroke="#1e2a44" stroke-width="2.5" stroke-linecap="round"/><path d="M194,564 l4,4 l-3,3 M206,576 l-4,-4 l3,-3" fill="none" stroke="#b5602e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><polyline points="60,630 400,630" fill="none" stroke="#2b5a9a" stroke-width="4" stroke-linejoin="round"/><rect x="400" y="552" width="90" height="96" rx="6" fill="#e3e6e6" stroke="#1e2a44" stroke-width="3" /><text x="50" y="575" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">L</text><text x="50" y="635" font-size="16" font-weight="700" fill="#2b5a9a" text-anchor="end">N</text><text x="520" y="565" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Once it breaks the circuit, the</text><text x="520" y="585" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">appliance is cut off from the high</text><text x="520" y="605" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">voltage. In the neutral it would stop</text><text x="520" y="625" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">the current but leave the appliance</text><text x="520" y="645" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">live.</text>
</svg>