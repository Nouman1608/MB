<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="680" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Choosing the right fuse</text>

<rect x="30" y="110" width="840" height="220" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="146" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Hairdryer: 1.4 kW, 230 V</text><text x="845" y="146" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="end">I = 1400 ÷ 230 = 6.1 A</text><line x1="80" y1="240" x2="850" y2="240" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="80" y1="240" x2="80" y2="248" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><text x="80" y="268" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">0 A</text><line x1="355" y1="240" x2="355" y2="248" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><text x="355" y="268" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">5 A</text><line x1="630" y1="240" x2="630" y2="248" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><text x="630" y="268" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">10 A</text><rect x="219" y="178" width="52" height="32" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="245" y="200" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3 A</text><line x1="245" y1="210" x2="245" y2="240" stroke="#1e2a44" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/><rect x="329" y="178" width="52" height="32" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="355" y="200" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">5 A</text><line x1="355" y1="210" x2="355" y2="240" stroke="#1e2a44" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/><rect x="769" y="178" width="52" height="32" rx="6" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2.5" /><text x="795" y="200" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">13 A</text><line x1="795" y1="210" x2="795" y2="240" stroke="#8a6d0d" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/><circle cx="415.5" cy="240" r="8" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="415.5" y="292" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">6.1 A</text><text x="845" y="300" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="end">3 A and 5 A would blow: choose 13 A</text><rect x="30" y="345" width="840" height="220" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="381" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Lamp: 60 W, 230 V</text><text x="845" y="381" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="end">I = 60 ÷ 230 = 0.26 A</text><line x1="80" y1="475" x2="850" y2="475" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><line x1="80" y1="475" x2="80" y2="483" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><text x="80" y="503" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">0 A</text><line x1="355" y1="475" x2="355" y2="483" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><text x="355" y="503" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">5 A</text><line x1="630" y1="475" x2="630" y2="483" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><text x="630" y="503" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">10 A</text><rect x="219" y="413" width="52" height="32" rx="6" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2.5" /><text x="245" y="435" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3 A</text><line x1="245" y1="445" x2="245" y2="475" stroke="#8a6d0d" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/><rect x="329" y="413" width="52" height="32" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="355" y="435" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">5 A</text><line x1="355" y1="445" x2="355" y2="475" stroke="#1e2a44" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/><rect x="769" y="413" width="52" height="32" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="795" y="435" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">13 A</text><line x1="795" y1="445" x2="795" y2="475" stroke="#1e2a44" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/><circle cx="94.3" cy="475" r="8" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="94.3" y="527" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">0.26 A</text><text x="845" y="535" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="end">choose 3 A, the smallest rating above 0.26 A</text><rect x="30" y="580" width="840" height="82" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="614" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Rule: the smallest rating ABOVE the normal current.</text><text x="450" y="642" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Too high: a fault current might not blow it. Equal to the current: it blows in normal use.</text>
</svg>