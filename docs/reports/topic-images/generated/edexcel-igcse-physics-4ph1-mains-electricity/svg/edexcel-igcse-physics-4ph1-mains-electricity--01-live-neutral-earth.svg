<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 605" width="900" height="605" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="605" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How an appliance connects to the mains</text>

<rect x="30" y="110" width="840" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="560" y="170" width="260" height="240" rx="10" fill="#e3e6e6" stroke="#1e2a44" stroke-width="4" /><text x="690" y="156" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">metal case</text><path d="M620,290 l8.75,-12 l8.75,12 l8.75,-12 l8.75,12 l8.75,-12 l8.75,12 l8.75,-12 l8.75,12 l8.75,-12 l8.75,12 l8.75,-12 l8.75,12 l8.75,-12 l8.75,12 l8.75,-12 l8.75,12" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="690" y="330" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">heating element</text><polyline points="90,220 620,220 620,290" fill="none" stroke="#b5602e" stroke-width="4" stroke-linejoin="round"/><rect x="302" y="209" width="56" height="22" rx="3" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><line x1="302" y1="220" x2="358" y2="220" stroke="#1e2a44" stroke-width="2.5" stroke-linecap="round"/><text x="330" y="200" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">fuse</text><polyline points="90,360 760,360 760,290" fill="none" stroke="#2b5a9a" stroke-width="4" stroke-linejoin="round"/><polyline points="560,260 470,260 470,395" fill="none" stroke="#6f9a52" stroke-width="4" stroke-linejoin="round"/><circle cx="560" cy="260" r="6" fill="#6f9a52"/><line x1="470" y1="395" x2="470" y2="409" stroke="#6f9a52" stroke-width="3.5" stroke-linecap="round"/><line x1="452" y1="409" x2="488" y2="409" stroke="#6f9a52" stroke-width="3.5" stroke-linecap="round"/><line x1="459" y1="417" x2="481" y2="417" stroke="#6f9a52" stroke-width="3" stroke-linecap="round"/><line x1="465" y1="425" x2="475" y2="425" stroke="#6f9a52" stroke-width="2.5" stroke-linecap="round"/><text x="70" y="226" font-size="17" font-weight="700" fill="#b5602e" text-anchor="end">live</text><text x="70" y="366" font-size="17" font-weight="700" fill="#2b5a9a" text-anchor="end">neutral</text><text x="495" y="418" font-size="17" font-weight="700" fill="#6f9a52" text-anchor="start">earth</text><line x1="150" y1="205" x2="230" y2="205" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><line x1="230" y1="377" x2="150" y2="377" stroke="#2b5a9a" stroke-width="3.5" marker-end="url(#ah)"/><text x="190" y="196" font-size="15" font-weight="600" fill="#b5602e" text-anchor="middle">current in</text><text x="190" y="400" font-size="15" font-weight="600" fill="#2b5a9a" text-anchor="middle">current back</text><text x="380" y="300" font-size="15" font-weight="600" fill="#6f9a52" text-anchor="end">no current</text><text x="380" y="318" font-size="15" font-weight="600" fill="#6f9a52" text-anchor="end">when working</text><text x="55" y="470" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Live: carries the alternating voltage.   Neutral: completes the circuit, close to 0 V.</text><text x="55" y="494" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Earth: connects a metal case to the ground.</text><rect x="30" y="525" width="840" height="60" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="562" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">The danger: a large current through a person, e.g. if the live wire touches something they hold.</text>
</svg>