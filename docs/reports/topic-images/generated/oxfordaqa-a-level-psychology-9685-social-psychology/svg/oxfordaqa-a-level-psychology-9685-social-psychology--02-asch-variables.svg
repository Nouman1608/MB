<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 949" width="900" height="949" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="949" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Asch: how much people conformed</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Line-judgement task; confederates gave a unanimous wrong answer on critical trials</text>
<rect x="30" y="124" width="840" height="140" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="158" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">BASELINE</text><text x="54" y="198" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">about 37%</text><text x="54" y="224" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">of critical trials:</text><text x="54" y="244" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">conformed</text><text x="258" y="198" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">about 75%</text><text x="258" y="224" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">conformed at least once</text><text x="462" y="198" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">about 25%</text><text x="462" y="224" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">never conformed</text><text x="666" y="198" font-size="24" font-weight="700" fill="#4a5568" text-anchor="start">almost 0</text><text x="666" y="224" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">errors when judging</text><text x="666" y="244" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">alone</text><rect x="30" y="286" width="840" height="290" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="320" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">GROUP SIZE: CONFORMITY ON CRITICAL TRIALS</text><line x1="110" y1="526" x2="490" y2="526" stroke="#1e2a44" stroke-width="2.5"/><line x1="110" y1="526" x2="110" y2="356" stroke="#1e2a44" stroke-width="2.5"/><line x1="104" y1="526" x2="110" y2="526" stroke="#1e2a44" stroke-width="2"/><text x="100" y="531" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">0%</text><line x1="104" y1="483.5" x2="110" y2="483.5" stroke="#1e2a44" stroke-width="2"/><text x="100" y="488.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">10%</text><line x1="104" y1="441" x2="110" y2="441" stroke="#1e2a44" stroke-width="2"/><text x="100" y="446" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">20%</text><line x1="104" y1="398.5" x2="110" y2="398.5" stroke="#1e2a44" stroke-width="2"/><text x="100" y="403.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">30%</text><line x1="104" y1="356" x2="110" y2="356" stroke="#1e2a44" stroke-width="2"/><text x="100" y="361" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">40%</text><rect x="150" y="513.25" width="80" height="12.75" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="190" y="505.25" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3%</text><text x="190" y="550" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="265" y="470.75" width="80" height="55.25" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="305" y="462.75" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">13%</text><text x="305" y="550" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="380" y="390" width="80" height="136" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="420" y="382" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">32%</text><text x="420" y="550" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="300" y="572" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">number of confederates</text><text x="540" y="386" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">More confederates beyond three</text><text x="540" y="408" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">added <tspan font-weight="700">little</tspan> <tspan font-weight="700">further</tspan> <tspan font-weight="700">increase</tspan>: a small</text><text x="540" y="430" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">majority is enough.</text><rect x="30" y="608" width="413" height="155" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="640" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">UNANIMITY</text><text x="50" y="666.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">One confederate gives the right answer →</text><text x="50" y="689.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">about 5.5%</text><text x="50" y="717.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Even a different wrong answer reduced</text><text x="50" y="738.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">conformity: breaking unanimity matters</text><rect x="457" y="608" width="413" height="155" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="640" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TASK DIFFICULTY</text><text x="477" y="666.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Lines made more similar → conformity</text><text x="477" y="689.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">increased</text><text x="477" y="717.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">More ambiguity, so more informational influence</text><rect x="30" y="785" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="817" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="50" y="843.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Artificial, trivial task</text><text x="50" y="871.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">No consequences; American male students;</text><text x="50" y="892.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">deception and stress.</text><rect x="457" y="785" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="817" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">BOND AND SMITH (1996)</text><text x="477" y="843.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">133 studies in 17 countries</text><text x="477" y="871.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Higher conformity in collectivist than individualist</text><text x="477" y="892.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">cultures.</text>
</svg>