<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 929" width="900" height="929" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="929" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Asch: how much people conformed</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Line-judgement task; confederates gave a unanimous wrong answer on critical trials</text>
<rect x="30" y="124" width="840" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="158" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">BASELINE</text><text x="54" y="198" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">about 37%</text><text x="54" y="224" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">of critical trials:</text><text x="54" y="244" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">conformed</text><text x="258" y="198" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">about 75%</text><text x="258" y="224" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">conformed at least once</text><text x="462" y="198" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">about 25%</text><text x="462" y="224" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">never conformed</text><text x="666" y="198" font-size="24" font-weight="700" fill="#4a5568" text-anchor="start">almost 0</text><text x="666" y="224" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">errors when judging alone</text><rect x="30" y="266" width="840" height="290" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="300" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">GROUP SIZE: CONFORMITY ON CRITICAL TRIALS</text><line x1="110" y1="506" x2="490" y2="506" stroke="#1e2a44" stroke-width="2.5"/><line x1="110" y1="506" x2="110" y2="336" stroke="#1e2a44" stroke-width="2.5"/><line x1="104" y1="506" x2="110" y2="506" stroke="#1e2a44" stroke-width="2"/><text x="100" y="511" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">0%</text><line x1="104" y1="463.5" x2="110" y2="463.5" stroke="#1e2a44" stroke-width="2"/><text x="100" y="468.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">10%</text><line x1="104" y1="421" x2="110" y2="421" stroke="#1e2a44" stroke-width="2"/><text x="100" y="426" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">20%</text><line x1="104" y1="378.5" x2="110" y2="378.5" stroke="#1e2a44" stroke-width="2"/><text x="100" y="383.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">30%</text><line x1="104" y1="336" x2="110" y2="336" stroke="#1e2a44" stroke-width="2"/><text x="100" y="341" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">40%</text><rect x="150" y="493.25" width="80" height="12.75" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="190" y="485.25" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3%</text><text x="190" y="530" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="265" y="450.75" width="80" height="55.25" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="305" y="442.75" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">13%</text><text x="305" y="530" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="380" y="370" width="80" height="136" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="420" y="362" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">32%</text><text x="420" y="530" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="300" y="552" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">number of confederates</text><text x="540" y="366" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">More confederates beyond three</text><text x="540" y="388" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">added <tspan font-weight="700">little</tspan> <tspan font-weight="700">further</tspan> <tspan font-weight="700">increase</tspan>: a small</text><text x="540" y="410" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">majority is enough.</text><rect x="30" y="588" width="413" height="155" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="620" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">UNANIMITY</text><text x="50" y="646.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">One confederate gives the right answer →</text><text x="50" y="669.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">about 5.5%</text><text x="50" y="697.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Even a different wrong answer reduced</text><text x="50" y="718.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">conformity: breaking unanimity matters</text><rect x="457" y="588" width="413" height="155" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="620" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TASK DIFFICULTY</text><text x="477" y="646.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Lines made more similar → conformity</text><text x="477" y="669.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">increased</text><text x="477" y="697.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">More ambiguity, so more informational influence</text><rect x="30" y="765" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="797" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="50" y="823.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Artificial, trivial task</text><text x="50" y="851.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">No consequences; American male students;</text><text x="50" y="872.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">deception and stress.</text><rect x="457" y="765" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="797" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">BOND AND SMITH (1996)</text><text x="477" y="823.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">133 studies in 17 countries</text><text x="477" y="851.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Higher conformity in collectivist than individualist</text><text x="477" y="872.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">cultures.</text>
</svg>