<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 568" width="900" height="568" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="568" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">An application answer: the football club</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Explain the players’ behaviour [6]</text>
<rect x="30" y="124" width="840" height="70" rx="14" fill="#ffffff"/><path d="M44,124 H250 V194 H44 A14,14 0 0 1 30,180 V138 A14,14 0 0 1 44,124 Z" fill="#f2e7b8"/><rect x="30" y="124" width="840" height="70" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="162.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Type and explanation</text><text x="266" y="152.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Compliance</tspan> from <tspan font-weight="700" fill="#1e2a44">normative</tspan> influence: they want acceptance, not because</text><text x="266" y="173.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the rule is right</text><rect x="30" y="202" width="840" height="70" rx="14" fill="#ffffff"/><path d="M44,202 H250 V272 H44 A14,14 0 0 1 30,258 V216 A14,14 0 0 1 44,202 Z" fill="#f2e7b8"/><rect x="30" y="202" width="840" height="70" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="240.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Precise distinction</text><text x="266" y="230.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The captain is a group member, not a legitimate authority: <tspan font-weight="700" fill="#1e2a44">conformity,</tspan> <tspan font-weight="700" fill="#1e2a44">not</tspan></text><text x="266" y="251.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">obedience</tspan></text><rect x="30" y="280" width="840" height="54" rx="14" fill="#ffffff"/><path d="M44,280 H250 V334 H44 A14,14 0 0 1 30,320 V294 A14,14 0 0 1 44,280 Z" fill="#dce9e7"/><rect x="30" y="280" width="840" height="54" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="310.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Evidence</text><text x="266" y="311.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Asch: one dissenter cut conformity to about <tspan font-weight="700" fill="#1e2a44">5.5%</tspan></text><rect x="30" y="342" width="840" height="54" rx="14" fill="#ffffff"/><path d="M44,342 H250 V396 H44 A14,14 0 0 1 30,382 V356 A14,14 0 0 1 44,342 Z" fill="#dce9e7"/><rect x="30" y="342" width="840" height="54" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="372.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Resistance applied</text><text x="266" y="373.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">One refusal broke unanimity, giving the other two <tspan font-weight="700" fill="#1e2a44">social</tspan> <tspan font-weight="700" fill="#1e2a44">support</tspan></text><rect x="30" y="404" width="840" height="54" rx="14" fill="#ffffff"/><path d="M44,404 H250 V458 H44 A14,14 0 0 1 30,444 V418 A14,14 0 0 1 44,404 Z" fill="#dce9e7"/><rect x="30" y="404" width="840" height="54" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="434.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Individual difference</text><text x="266" y="435.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Those who refused first may have an <tspan font-weight="700" fill="#1e2a44">internal</tspan> <tspan font-weight="700" fill="#1e2a44">locus</tspan> <tspan font-weight="700" fill="#1e2a44">of</tspan> <tspan font-weight="700" fill="#1e2a44">control</tspan></text><rect x="30" y="466" width="840" height="70" rx="14" fill="#ffffff"/><path d="M44,466 H250 V536 H44 A14,14 0 0 1 30,522 V480 A14,14 0 0 1 44,466 Z" fill="#d4b02e"/><rect x="30" y="466" width="840" height="70" rx="14" fill="none" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="504.44" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluation</text><text x="266" y="494.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Real consequences for belonging: normative pressure may be <tspan font-weight="700" fill="#1e2a44">stronger</tspan> than</text><text x="266" y="515.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">in Asch’s laboratory</text>
</svg>