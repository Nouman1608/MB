<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 581" width="900" height="581" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="581" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why people conform</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Deutsch and Gerard (1955): two motives</text>
<rect x="30" y="124" width="405" height="220" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">NORMATIVE SOCIAL INFLUENCE</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">To be liked and accepted</text><text x="50" y="211.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Avoid rejection</text><text x="50" y="238.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="238.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Asch participants who went along to avoid</text><text x="65.2" y="259.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">looking foolish</text><text x="50" y="286.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="286.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">People high in need for affiliation seem more</text><text x="65.2" y="307.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">open to it</text><line x1="232" y1="348" x2="232" y2="378" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="90" y="384" width="285" height="85" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="232.5" y="416" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">USUALLY PRODUCES</text><text x="232.5" y="443.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Compliance</text><rect x="465" y="124" width="405" height="220" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="485" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INFORMATIONAL SOCIAL INFLUENCE</text><text x="485" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Because others seem right</text><text x="485" y="211.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="500.2" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Especially when a situation is ambiguous</text><text x="485" y="238.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="500.2" y="238.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Jenness (1932): bean-jar estimates moved</text><text x="500.2" y="259.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">towards the group’s after discussion</text><line x1="667" y1="348" x2="667" y2="378" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="525" y="384" width="285" height="85" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="667.5" y="416" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">USUALLY PRODUCES</text><text x="667.5" y="443.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Internalisation</text><rect x="30" y="491" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="524.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Hard to separate in practice: a person may conform <tspan font-weight="700" fill="#1e2a44">both</tspan> to be right and to be liked.</text>
</svg>