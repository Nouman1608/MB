<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 841" width="900" height="841" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="841" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Milgram: situational variables</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Percentage obeying to the maximum 450 volts</text>
<text x="284" y="150" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">Baseline (Yale)</text><rect x="300" y="124" width="445.7142857142857" height="40" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="755.7142857142858" y="151" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">65%</text><text x="284" y="204" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">Learner in same room</text><rect x="300" y="178" width="274.2857142857143" height="40" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="584.2857142857142" y="205" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">40%</text><text x="284" y="258" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">Hand on shock plate</text><rect x="300" y="232" width="205.71428571428572" height="40" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="515.7142857142858" y="259" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">30%</text><text x="284" y="312" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">Orders by telephone</text><rect x="300" y="286" width="140.57142857142858" height="40" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="450.57142857142856" y="313" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">20.5%</text><text x="284" y="366" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">Run-down office, Bridgeport</text><rect x="300" y="340" width="325.7142857142857" height="40" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="635.7142857142858" y="367" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">47.5%</text><text x="284" y="420" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">Two peers refuse</text><rect x="300" y="394" width="68.57142857142857" height="40" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="378.57142857142856" y="421" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">10%</text><line x1="300" y1="116" x2="300" y2="442" stroke="#1e2a44" stroke-width="2.5"/><rect x="300" y="456" width="18" height="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><text x="326" y="471" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">proximity</text><rect x="430.128" y="456" width="18" height="18" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.5"/><text x="456.128" y="471" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">location</text><rect x="549.8879999999999" y="456" width="18" height="18" fill="#2e6b62" stroke="#1e2a44" stroke-width="1.5"/><text x="575.8879999999999" y="471" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">social support</text><rect x="30" y="498" width="413" height="134" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="530" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PROXIMITY</text><text x="50" y="556.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Victim closer: consequences harder to</text><text x="50" y="579.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">ignore</text><text x="50" y="607.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">authority further away: easier to resist</text><rect x="457" y="498" width="413" height="134" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="477" y="530" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LOCATION</text><text x="477" y="556.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A prestigious setting lends legitimacy</text><rect x="30" y="654" width="270.6666666666667" height="155" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="686" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">HOFLING ET AL. (1966)</text><text x="50" y="712.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">21 of 22 nurses</text><text x="50" y="740.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Would give an excessive dose</text><text x="50" y="761.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">on a phone order from an</text><text x="50" y="782.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">unknown doctor.</text><rect x="314.6666666666667" y="654" width="270.6666666666667" height="155" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334.6666666666667" y="686" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">BURGER (2009)</text><text x="334.6666666666667" y="712.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">About 70% willing to go</text><text x="334.6666666666667" y="735.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">past 150 V</text><text x="334.6666666666667" y="763.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Partial replication, stopped at</text><text x="334.6666666666667" y="784.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">150 V for ethics.</text><rect x="599.3333333333334" y="654" width="270.6666666666667" height="155" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="619.3333333333334" y="686" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">SHERIDAN AND KING (1972)</text><text x="619.3333333333334" y="712.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Real shocks to a puppy</text><text x="619.3333333333334" y="740.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Still high obedience, against</text><text x="619.3333333333334" y="761.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the “not believed” criticism.</text>
</svg>