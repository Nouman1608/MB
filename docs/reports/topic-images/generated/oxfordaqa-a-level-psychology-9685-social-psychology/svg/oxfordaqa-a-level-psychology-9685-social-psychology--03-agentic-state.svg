<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 832" width="900" height="832" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="832" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Explaining obedience</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Obedience: following a direct order from a person in authority</text>
<rect x="30" y="124" width="300" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="180" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">AUTONOMOUS STATE</text><text x="180" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">I am responsible for my</text><text x="180" y="205.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">actions</text><rect x="570" y="124" width="300" height="106" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="720" y="156" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">AGENTIC STATE</text><text x="720" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">I act for another person, who</text><text x="720" y="205.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">is responsible</text><line x1="336" y1="174" x2="564" y2="174" stroke="#1e2a44" stroke-width="4.5" marker-end="url(#ah)"/><text x="450" y="162" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">agentic shift</text><rect x="30" y="254" width="413" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="286" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MORAL STRAIN</text><text x="50" y="311.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Participants may feel distress at what they</text><text x="50" y="332.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">are doing</text><rect x="457" y="254" width="413" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="477" y="286" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BINDING FACTORS</text><text x="477" y="311.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Keep them obeying</text><text x="477" y="338.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">not wanting to break an agreement or appear</text><text x="477" y="359.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">rude</text><text x="450" y="204" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Milgram (1974)</text><rect x="30" y="416" width="840" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="450" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">LEGITIMACY OF AUTHORITY</text><polygon points="450,468 560,528 340,528" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="250" y="536" width="400" height="56" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="450" y="520" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">authority</text><text x="450" y="570" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">socialised to accept their orders</text><text x="54" y="506" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Societies are</text><text x="54" y="527" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">organised</text><text x="54" y="548" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">hierarchically</tspan></text><text x="706" y="506" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Status reduced →</text><text x="706" y="527" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">obedience</tspan> <tspan font-weight="700">falls</tspan></text><text x="450" y="622" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">legitimate power, e.g. police officers, teachers, doctors</text><rect x="30" y="668" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="700" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRENGTH</text><text x="50" y="726.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Fit Milgram’s variations</text><text x="50" y="754.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Obedience fell when an ordinary member of the</text><text x="50" y="775.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">public gave orders.</text><rect x="457" y="668" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="700" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="477" y="726.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A third refused</text><text x="477" y="754.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Agentic state does not explain them; many who</text><text x="477" y="775.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">obeyed were distressed, not calm.</text>
</svg>