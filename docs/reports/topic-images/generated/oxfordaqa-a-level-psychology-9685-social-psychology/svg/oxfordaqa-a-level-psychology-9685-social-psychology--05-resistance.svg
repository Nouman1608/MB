<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 722" width="900" height="722" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="722" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Resistance to social influence</text>

<rect x="30" y="100" width="840" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="134" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">SOCIAL SUPPORT: AN ALLY BREAKS THE PRESSURE</text><text x="254" y="176" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">Asch: unanimous</text><rect x="270" y="154" width="153.28571428571428" height="32" fill="#c9d6d4" stroke="#1e2a44" stroke-width="2"/><text x="433.2857142857143" y="177" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">about 37%</text><text x="254" y="218" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">Asch: one dissenter</text><rect x="270" y="196" width="22.785714285714285" height="32" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="302.7857142857143" y="219" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">about 5.5%</text><line x1="270" y1="146" x2="270" y2="236" stroke="#1e2a44" stroke-width="2.5"/><text x="674" y="176" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">Milgram baseline</text><rect x="690" y="154" width="139.28571428571428" height="32" fill="#c9d6d4" stroke="#1e2a44" stroke-width="2"/><text x="839.2857142857142" y="177" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">65%</text><text x="674" y="218" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">Two peers refuse</text><rect x="690" y="196" width="21.428571428571427" height="32" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="721.4285714285714" y="219" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">10%</text><line x1="690" y1="146" x2="690" y2="236" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="305.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">A dissenter shows resistance is <tspan font-weight="700">possible</tspan> and <tspan font-weight="700">shares</tspan> <tspan font-weight="700">the</tspan> <tspan font-weight="700">social</tspan> <tspan font-weight="700">cost</tspan> of disobeying.</text><rect x="30" y="336" width="840" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="370" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">LOCUS OF CONTROL: ROTTER (1966)</text><defs><linearGradient id="loc" x1="0" x2="1"><stop offset="0" stop-color="#b5d3cf"/><stop offset="1" stop-color="#f2e7b8"/></linearGradient></defs><rect x="90" y="410" width="720" height="32" rx="16" fill="url(#loc)" stroke="#1e2a44" stroke-width="2"/><text x="90" y="472" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">INTERNAL</text><text x="90" y="496" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">outcomes result from my own actions →</text><text x="90" y="517" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">more</tspan> <tspan font-weight="700">likely</tspan> <tspan font-weight="700">to</tspan> <tspan font-weight="700">resist</tspan></text><text x="810" y="472" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="end">EXTERNAL</text><text x="510" y="496" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">outcomes controlled by luck or others</text><rect x="30" y="558" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="590" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">HOLLAND (1967)</text><text x="50" y="616.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Internals more likely to resist</text><text x="50" y="644.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">In a repeat of Milgram’s procedure.</text><rect x="457" y="558" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="590" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="477" y="616.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Mixed later support</text><text x="477" y="644.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Locus of control may matter less than situational</text><text x="477" y="665.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">factors.</text>
</svg>