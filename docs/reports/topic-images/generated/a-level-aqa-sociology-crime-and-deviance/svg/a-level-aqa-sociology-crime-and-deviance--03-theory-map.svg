<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 629" width="900" height="629" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="629" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three ways of explaining crime</text>

<rect x="188" y="104" width="222" height="66" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="299" y="142.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Consensus</text><rect x="418" y="104" width="222" height="66" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="529" y="142.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Conflict</text><rect x="648" y="104" width="222" height="66" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="759" y="129.67000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Interactionist /</text><text x="759" y="154.67000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">labelling</text><rect x="30" y="178" width="150" height="114" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="240.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">What crime is</text><rect x="188" y="178" width="222" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="202" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A failure of shared</text><text x="202" y="229.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">norms, or a functional</text><text x="202" y="250.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">safety valve.</text><rect x="418" y="178" width="222" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="432" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A product of unequal</text><text x="432" y="229.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">power; law written to</text><text x="432" y="250.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">serve some groups’</text><text x="432" y="271.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">interests over others’.</text><rect x="648" y="178" width="222" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="662" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Socially constructed</text><text x="662" y="229.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">through being labelled,</text><text x="662" y="250.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">not an inherent</text><text x="662" y="271.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">property of an act.</text><rect x="30" y="300" width="150" height="156" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="361.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Why crime</text><text x="42" y="383.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">might vary by</text><text x="42" y="405.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">class</text><rect x="188" y="300" width="222" height="156" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="202" y="330.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Crime as a failure of</text><text x="202" y="351.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">shared norms, or as</text><text x="202" y="372.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">serving a function in</text><text x="202" y="393.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reinforcing social</text><text x="202" y="414.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">solidarity.</text><rect x="418" y="300" width="222" height="156" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="432" y="330.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Crime and its</text><text x="432" y="351.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">enforcement reflect</text><text x="432" y="372.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">unequal power, with law</text><text x="432" y="393.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">written or applied to</text><text x="432" y="414.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">serve some groups.</text><rect x="648" y="300" width="222" height="156" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="662" y="330.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Apparent class</text><text x="662" y="351.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">differences partly</text><text x="662" y="372.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reflect differential</text><text x="662" y="393.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">policing and labelling,</text><text x="662" y="414.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">not different</text><text x="662" y="435.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">behaviour.</text><rect x="30" y="472" width="840" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="508" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Apply the map to official statistics</text><text x="56" y="537" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A labelling or conflict lens explains why working-class or ethnic-minority offending might</text><text x="56" y="559" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">be recorded at different rates than it actually occurs, instead of assuming statistics</text><text x="56" y="581" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">simply describe reality.</text>
</svg>