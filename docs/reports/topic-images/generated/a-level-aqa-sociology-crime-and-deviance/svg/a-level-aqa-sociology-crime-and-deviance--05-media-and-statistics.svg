<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 413" width="900" height="413" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="413" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How the media can shape crime figures</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">a chain of influence</text>
<rect x="30" y="120" width="174" height="130" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="117" y="162.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Media</text><text x="117" y="186.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">representation</text><text x="117" y="216.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">how crime is shown</text><line x1="208" y1="185" x2="248" y2="185" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="252" y="120" width="174" height="130" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="339" y="152.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Public</text><text x="339" y="176.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">perception</text><text x="339" y="206.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">who commits crime,</text><text x="339" y="227.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">and how much</text><line x1="430" y1="185" x2="470" y2="185" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="474" y="120" width="174" height="130" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="561" y="152.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Policing</text><text x="561" y="176.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">priorities</text><text x="561" y="206.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">where attention</text><text x="561" y="227.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">goes</text><line x1="652" y1="185" x2="692" y2="185" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="696" y="120" width="174" height="130" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="783" y="162.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Official</text><text x="783" y="186.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">statistics</text><text x="783" y="216.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">what is recorded</text><rect x="30" y="276" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="312" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Not independent of each other</text><text x="56" y="341" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Media representation and the "real" social distribution of crime are linked, so the media</text><text x="56" y="363" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">topic belongs with the social-distribution content.</text>
</svg>