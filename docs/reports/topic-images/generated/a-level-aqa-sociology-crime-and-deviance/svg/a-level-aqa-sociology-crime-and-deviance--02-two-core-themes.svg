<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 559" width="900" height="559" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="559" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Connecting crime theories to the core themes</text>

<rect x="260" y="104" width="380" height="58" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="141" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">An explanation of crime</text><line x1="360" y1="166" x2="230" y2="216" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="540" y1="166" x2="670" y2="216" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="450" y="204" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle" font-style="italic">connect to</text><rect x="30" y="224" width="412" height="178" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,296 L31.25,238.25 Q31.25,225.25 44.25,225.25 L427.75,225.25 Q440.75,225.25 440.75,238.25 L440.75,296 Z" fill="#b5d3cf"/><line x1="31.25" y1="296" x2="440.75" y2="296" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="265.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Socialisation, culture and identity</text><text x="44" y="328.15" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">Example: subcultural values</text><text x="44" y="356.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">How group norms are learned and transmitted.</text><rect x="458" y="224" width="412" height="178" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,296 L459.25,238.25 Q459.25,225.25 472.25,225.25 L855.75,225.25 Q868.75,225.25 868.75,238.25 L868.75,296 Z" fill="#f2e7b8"/><line x1="459.25" y1="296" x2="868.75" y2="296" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="253.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Social differentiation, power and</text><text x="664" y="278.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">stratification</text><text x="472" y="328.15" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">Example: crime and social class</text><text x="472" y="356.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Whose behaviour gets defined and processed</text><text x="472" y="378.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">as criminal in the first place.</text><rect x="30" y="422" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="458" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A list of named perspectives is not enough</text><text x="56" y="487" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Stating a theory without connecting it to one or both core themes misses what the</text><text x="56" y="509" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">specification is built to test.</text>
</svg>