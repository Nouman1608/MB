<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 526" width="900" height="526" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="526" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One debate, three scales</text>

<rect x="150" y="104" width="600" height="62" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="143" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">How is harmful behaviour defined, and by whom?</text><line x1="330" y1="170" x2="164.66666666666666" y2="220" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="170" x2="450" y2="220" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="570" y1="170" x2="735.3333333333333" y2="220" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="228" width="269.3333333333333" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,278 L31.25,242.25 Q31.25,229.25 44.25,229.25 L285.0833333333333,229.25 Q298.0833333333333,229.25 298.0833333333333,242.25 L298.0833333333333,278 Z" fill="#b5d3cf"/><line x1="31.25" y1="278" x2="298.0833333333333" y2="278" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="258.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Individual offender</text><text x="44" y="310.15" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">Social order and control;</text><text x="44" y="332.15" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">social distribution</text><text x="44" y="360.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Who commits crime, and who</text><text x="44" y="382.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">is recorded as committing</text><text x="44" y="404.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">it.</text><rect x="315.3333333333333" y="228" width="269.3333333333333" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,278 L316.5833333333333,242.25 Q316.5833333333333,229.25 329.5833333333333,229.25 L570.4166666666666,229.25 Q583.4166666666666,229.25 583.4166666666666,242.25 L583.4166666666666,278 Z" fill="#f2e7b8"/><line x1="316.5833333333333" y1="278" x2="583.4166666666666" y2="278" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="258.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Corporation</text><text x="329.3333333333333" y="310.15" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">Green crime</text><text x="329.3333333333333" y="338.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A multinational</text><text x="329.3333333333333" y="360.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">corporation’s environmental</text><text x="329.3333333333333" y="382.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">harm.</text><rect x="600.6666666666666" y="228" width="269.3333333333333" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,278 L601.9166666666666,242.25 Q601.9166666666666,229.25 614.9166666666666,229.25 L855.75,229.25 Q868.75,229.25 868.75,242.25 L868.75,278 Z" fill="#dce9e7"/><line x1="601.9166666666666" y1="278" x2="868.75" y2="278" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="258.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">State</text><text x="614.6666666666666" y="310.15" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">State crime</text><text x="614.6666666666666" y="338.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A state’s own human rights</text><text x="614.6666666666666" y="360.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">violations.</text><line x1="60" y1="460" x2="840" y2="460" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><text x="450" y="492" font-size="17" font-weight="600" fill="#8a6d0d" text-anchor="middle">from individual to institutional and global scale</text>
</svg>