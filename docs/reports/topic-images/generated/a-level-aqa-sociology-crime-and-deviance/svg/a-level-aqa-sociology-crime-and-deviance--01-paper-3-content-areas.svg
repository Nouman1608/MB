<rect width="900" height="759" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Crime and Deviance in Paper 3</text>

<rect x="30" y="104" width="380" height="85" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="220" y="136.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3.3.1 Crime and Deviance</text><text x="220" y="166.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">substantive content</text><rect x="490" y="104" width="380" height="85" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="680" y="136.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3.3.2 Theory and Methods</text><text x="680" y="166.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">theory and the research process</text><circle cx="450" cy="146.5" r="22" fill="#1e2a44"/><text x="450" y="155.5" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">+</text><line x1="450" y1="195" x2="450" y2="233" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="250" y="241" width="400" height="56" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="277" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Paper 3: a single examination</text><text x="450" y="337" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">The four content areas of 3.3.1</text><rect x="30" y="357" width="412" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,407 L31.25,371.25 Q31.25,358.25 44.25,358.25 L427.75,358.25 Q440.75,358.25 440.75,371.25 L440.75,407 Z" fill="#b5d3cf"/><line x1="31.25" y1="407" x2="440.75" y2="407" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="387.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Social order and control</text><text x="44" y="439.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Why most people conform most of the time,</text><text x="44" y="461.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and how deviance is defined and regulated.</text><rect x="458" y="357" width="412" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,407 L459.25,371.25 Q459.25,358.25 472.25,358.25 L855.75,358.25 Q868.75,358.25 868.75,371.25 L868.75,407 Z" fill="#b5d3cf"/><line x1="459.25" y1="407" x2="868.75" y2="407" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="387.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Social distribution of crime</text><text x="472" y="439.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">By ethnicity, gender and social class, with</text><text x="472" y="461.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">recent patterns and trends: who commits, and</text><text x="472" y="483.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">who is recorded as committing, crime.</text><rect x="30" y="523" width="412" height="210" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,573 L31.25,537.25 Q31.25,524.25 44.25,524.25 L427.75,524.25 Q440.75,524.25 440.75,537.25 L440.75,573 Z" fill="#f2e7b8"/><line x1="31.25" y1="573" x2="440.75" y2="573" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="553.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Global and institutional scale</text><circle cx="49" cy="599.54" r="4.5" fill="#2e6b62"/><text x="62" y="605.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Globalisation and crime</text><circle cx="49" cy="629.54" r="4.5" fill="#2e6b62"/><text x="62" y="635.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The media and crime</text><circle cx="49" cy="659.54" r="4.5" fill="#2e6b62"/><text x="62" y="665.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Green crime</text><circle cx="49" cy="689.54" r="4.5" fill="#2e6b62"/><text x="62" y="695.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Human rights and state crimes</text><rect x="458" y="523" width="412" height="210" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,573 L459.25,537.25 Q459.25,524.25 472.25,524.25 L855.75,524.25 Q868.75,524.25 868.75,537.25 L868.75,573 Z" fill="#f2e7b8"/><line x1="459.25" y1="573" x2="868.75" y2="573" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="553.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Responding to crime</text><circle cx="477" cy="599.54" r="4.5" fill="#2e6b62"/><text x="490" y="605.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Crime control, surveillance, prevention</text><text x="490" y="627.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and punishment</text><circle cx="477" cy="651.54" r="4.5" fill="#2e6b62"/><text x="490" y="657.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Victims</text><circle cx="477" cy="681.54" r="4.5" fill="#2e6b62"/><text x="490" y="687.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The criminal justice system and other</text><text x="490" y="709.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">agencies</text>
</svg>