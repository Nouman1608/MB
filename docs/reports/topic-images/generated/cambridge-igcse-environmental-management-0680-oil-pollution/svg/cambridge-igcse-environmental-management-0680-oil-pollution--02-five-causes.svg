<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five causes of oil pollution</text>

<rect x="30" y="330" width="840" height="230" fill="#b5d3cf"/><rect x="30" y="560" width="840" height="40" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5"/><path d="M30,290 L290,290 L350,560 L30,560 Z" fill="#d8e3c6" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><path d="M300,330 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M70,290 l18,-60 l18,60" fill="none" stroke="#1e2a44" stroke-width="2.5"/><line x1="88" y1="230" x2="88" y2="290" stroke="#1e2a44" stroke-width="2.5"/><line x1="74" y1="270" x2="102" y2="270" stroke="#1e2a44" stroke-width="2"/><path d="M120,294 L284,294 L300,332" fill="none" stroke="#2b5a9a" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" /><text x="200" y="320" font-size="15" font-weight="600" fill="#2b5a9a" text-anchor="middle">river</text><circle cx="112" cy="282" r="5" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="1"/><circle cx="130" cy="294" r="5" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="1"/><circle cx="240" cy="294" r="4" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="1"/><rect x="175" y="238" width="80" height="52" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><circle cx="195" cy="228" r="13" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><rect x="235" y="198" width="10" height="40" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.8"/><path d="M255,270 L300,270 Q312,270 314,334" fill="none" stroke="#2b2b2b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><circle cx="316" cy="342" r="5" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="1"/><path d="M340,552 L612,552 L612,300" fill="none" stroke="#9c8f6e" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" /><circle cx="470" cy="538" r="7" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="1"/><circle cx="480" cy="522" r="5" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="1"/><circle cx="486" cy="508" r="4" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="1"/><rect x="580" y="280" width="80" height="20" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><line x1="592" y1="300" x2="592" y2="560" stroke="#1e2a44" stroke-width="3"/><line x1="648" y1="300" x2="648" y2="560" stroke="#1e2a44" stroke-width="3"/><path d="M604,280 l16,-56 l16,56" fill="none" stroke="#1e2a44" stroke-width="2.5"/><path d="M650,332 q6,-10 15,-4 q12,-7 24,-3 q12,-6 21,7 Z" fill="#2b2b2b"/><path d="M395,316 L525,316 L512,340 L408,340 Z" fill="#3a4660" stroke="#1e2a44" stroke-width="2.2"/><path d="M500,326 q18,0 24,24" fill="none" stroke="#2b2b2b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><path d="M515,334 q5,-8 12.5,-3.2 q10,-5.6 20,-2.4 q10,-4.8 17.5,5.6 Z" fill="#2b2b2b"/><path d="M720,560 Q760,360 800,352 Q850,360 870,560 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><g transform="rotate(-6 780 330)"><path d="M700,314.6 L840,314.6 L826,339.8 L709.8,339.8 Z" fill="#3a4660" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><rect x="712.6" y="293.6" width="23.799999999999997" height="21" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="719.6" y="283.8" width="7" height="9.799999999999999" fill="#b5602e" stroke="#1e2a44" stroke-width="1.6"/></g><path d="M735,342 q13,-10 32.5,-4 q26,-7 52,-3 q26,-6 45.5,7 Z" fill="#2b2b2b"/><circle cx="88" cy="195" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="88" y="201.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><circle cx="620" cy="195" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="620" y="201.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><circle cx="470" cy="480" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="470" y="486.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><circle cx="780" cy="245" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="780" y="251.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><circle cx="460" cy="280" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="460" y="286.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><circle cx="215" cy="165" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="215" y="171.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="860" y="588" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="end" font-style="italic">schematic, not to scale</text><circle cx="50" cy="645" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="50" y="650.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="76" y="651" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Oil extraction</text><text x="76" y="675" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">blowouts and leaks at platforms and wells;</text><text x="76" y="694" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">land oilfields drain to rivers</text><circle cx="480" cy="645" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="480" y="650.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="506" y="651" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Pipelines</text><text x="506" y="675" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">corrosion, damage or poor maintenance, even</text><text x="506" y="694" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">under the sea bed</text><circle cx="50" cy="725" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="50" y="730.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="76" y="731" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Shipping</text><text x="76" y="755" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">ships run aground, collide or sink; fuel</text><text x="76" y="774" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">leaks</text><circle cx="480" cy="725" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="480" y="730.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="506" y="731" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Cleaning tanks at sea</text><text x="506" y="755" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">oily washing water pumped overboard</text><circle cx="50" cy="805" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="50" y="810.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="76" y="811" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Refineries</text><text x="76" y="835" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">leaks, spills and oily wastewater</text><text x="450" y="878" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">Big accidents make headlines, but frequent small releases add a great deal of oil over time.</text>
</svg>