<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 605" width="900" height="605" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="605" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: how much was recovered?</text>

<rect x="30" y="110" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="60" y="200" width="234" height="80" fill="#2e6b62" stroke="#1e2a44" stroke-width="2.5"/><text x="177" y="236" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">1,800 t</text><text x="177" y="260" font-size="16" font-weight="400" fill="#ffffff" text-anchor="middle">skimming</text><rect x="294" y="200" width="117" height="80" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="352.5" y="236" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">900 t</text><text x="352.5" y="260" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">sorbents</text><rect x="411" y="200" width="429" height="80" fill="#d6dedd" stroke="#1e2a44" stroke-width="2.5"/><text x="625.5" y="236" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">3,300 t</text><text x="625.5" y="260" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">not recovered</text><text x="60" y="180" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">spill: 6,000 tonnes</text><path d="M60,300 L60,312 L411,312 L411,300" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="235.5" y="340" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">recovered 2,700 t = 45%</text><text x="840" y="140" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">invented figures</text><text x="60" y="400" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">2,700 ÷ 6,000 × 100 = 45%</text><rect x="30" y="460" width="840" height="120" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="498" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Where could the rest have gone?</text><rect x="60" y="514" width="160" height="44" rx="22" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="140" y="541.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">evaporation</text><rect x="235" y="514" width="235" height="44" rx="22" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="352.5" y="541.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">dispersal into the water</text><rect x="485" y="514" width="120" height="44" rx="22" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="545" y="541.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">sinking</text><rect x="620" y="514" width="230" height="44" rx="22" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="735" y="541.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">stranding on beaches</text>
</svg>