<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 725" width="900" height="725" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="725" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Double hulls and MARPOL</text>

<rect x="30" y="110" width="410" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Single hull</text><rect x="50" y="260" width="370" height="160" fill="#b5d3cf"/><path d="M105,190 L365,190 L345,350 L125,350 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="4" stroke-linejoin="round"/><path d="M108,193 L362,193 L343,347 L127,347 Z" fill="#2b2b2b"/><path d="M353,288 l14,8 l-10,10 l12,10" fill="none" stroke="#b5602e" stroke-width="5"/><path d="M351,305 l-16,0" fill="none" stroke="#ffffff" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><circle cx="375" cy="302" r="5" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="1"/><circle cx="384" cy="312" r="5" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="1"/><circle cx="393" cy="302" r="5" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="1"/><circle cx="402" cy="312" r="5" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="1"/><circle cx="411" cy="302" r="5" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="1"/><circle cx="420" cy="312" r="5" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="1"/><text x="235" y="395" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">oil escapes</text><text x="375" y="275" font-size="15.5" font-weight="700" fill="#b5602e" text-anchor="start">holed</text><rect x="460" y="110" width="410" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Double hull</text><rect x="480" y="260" width="370" height="160" fill="#b5d3cf"/><path d="M535,190 L795,190 L775,350 L555,350 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="4" stroke-linejoin="round"/><path d="M561,204 L769,204 L755,328 L575,328 Z" fill="#2b2b2b" stroke="#1e2a44" stroke-width="3.5"/><path d="M783,288 l14,8 l-10,10 l12,10" fill="none" stroke="#b5602e" stroke-width="5"/><path d="M781,305 l-16,0" fill="none" stroke="#ffffff" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><text x="665" y="395" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">inner hull keeps oil in</text><rect x="645.5" y="175.75" width="39" height="20.25" rx="5" fill="#ffffff" opacity="0.92"/><text x="665" y="190" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">gap</text><text x="805" y="275" font-size="15.5" font-weight="700" fill="#b5602e" text-anchor="start">holed</text><text x="450" y="476" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Double hulls do not prevent accidents: they reduce the oil released.</text><rect x="30" y="500" width="840" height="200" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="538" font-size="18.5" font-weight="700" fill="#1e2a44" text-anchor="start">MARPOL: an international convention (through the IMO), not a clean-up</text><rect x="50" y="560" width="190" height="110" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="145" y="605" font-size="16.5" font-weight="600" fill="#1e2a44" text-anchor="middle">restricts what</text><text x="145" y="627" font-size="16.5" font-weight="600" fill="#1e2a44" text-anchor="middle">ships may</text><text x="145" y="649" font-size="16.5" font-weight="600" fill="#1e2a44" text-anchor="middle">discharge</text><line x1="242" y1="615" x2="253" y2="615" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="255" y="560" width="190" height="110" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="350" y="605" font-size="16.5" font-weight="600" fill="#1e2a44" text-anchor="middle">oily waste kept on</text><text x="350" y="627" font-size="16.5" font-weight="600" fill="#1e2a44" text-anchor="middle">board</text><line x1="447" y1="615" x2="458" y2="615" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="460" y="560" width="190" height="110" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="555" y="605" font-size="16.5" font-weight="600" fill="#1e2a44" text-anchor="middle">unloaded at port</text><text x="555" y="627" font-size="16.5" font-weight="600" fill="#1e2a44" text-anchor="middle">facilities</text><line x1="652" y1="615" x2="663" y2="615" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="665" y="560" width="190" height="110" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="760" y="605" font-size="16.5" font-weight="600" fill="#1e2a44" text-anchor="middle">records kept for</text><text x="760" y="627" font-size="16.5" font-weight="600" fill="#1e2a44" text-anchor="middle">inspectors</text>
</svg>