<rect x="30" y="260" width="840" height="260" fill="#b5d3cf"/><path d="M30,520 L870,520 L870,560 L30,560 Z" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5"/><path d="M720,260 Q790,320 870,330 L870,210 L760,210 Q740,240 720,260 Z" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><path d="M30,260 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0 q10,-7 20,0 q10,7 20,0" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M70,240.2 L250,240.2 L232,272.6 L82.6,272.6 Z" fill="#3a4660" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><rect x="86.2" y="213.2" width="30.6" height="27" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="95.2" y="200.6" width="9" height="12.6" fill="#b5602e" stroke="#1e2a44" stroke-width="1.6"/><path d="M260,260 L700,260 L700,267 L260,267 Z" fill="#2b2b2b"/><path d="M330,250 q-8,-14 0,-28 q8,-14 0,-28" fill="none" stroke="#4a5568" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M356,250 q-8,-14 0,-28 q8,-14 0,-28" fill="none" stroke="#4a5568" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M382,250 q-8,-14 0,-28 q8,-14 0,-28" fill="none" stroke="#4a5568" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><circle cx="470" cy="290" r="4" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="1"/><circle cx="488" cy="296" r="4" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="1"/><circle cx="506" cy="290" r="4" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="1"/><circle cx="524" cy="296" r="4" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="1"/><circle cx="542" cy="290" r="4" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="1"/><circle cx="560" cy="296" r="4" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="1"/><circle cx="578" cy="290" r="4" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="1"/><circle cx="470" cy="318" r="4" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="1"/><circle cx="488" cy="312" r="4" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="1"/><circle cx="506" cy="318" r="4" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="1"/><circle cx="524" cy="312" r="4" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="1"/><circle cx="542" cy="318" r="4" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="1"/><circle cx="560" cy="312" r="4" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="1"/><circle cx="578" cy="318" r="4" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="1"/><circle cx="610" cy="330" r="6" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="1"/><circle cx="618" cy="364" r="6" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="1"/><circle cx="626" cy="398" r="6" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="1"/><circle cx="634" cy="432" r="6" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="1"/><circle cx="642" cy="466" r="6" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="1"/><ellipse cx="640" cy="518" rx="40" ry="7" fill="#2b2b2b"/><ellipse cx="775" cy="264" rx="22" ry="5" fill="#2b2b2b"/><ellipse cx="815" cy="280" rx="16" ry="4" fill="#2b2b2b"/><line x1="640" y1="150" x2="760" y2="150" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="625" y="156" font-size="16.5" font-weight="600" fill="#1e2a44" text-anchor="end">wind and currents</text><circle cx="300" cy="310" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="300" y="316.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><circle cx="350" cy="168" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="350" y="174.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><circle cx="520" cy="370" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="520" y="376.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><circle cx="670" cy="420" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="670" y="426.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><circle cx="790" cy="190" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="790" y="196.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="860" y="548" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="end" font-style="italic">schematic, not to scale</text><circle cx="50" cy="610" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="50" y="615.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="76" y="616" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Floats and spreads</text><text x="76" y="640" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">less dense than water: a thin slick moved by</text><text x="76" y="659" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">wind and currents</text><circle cx="480" cy="610" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="480" y="615.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="506" y="616" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Evaporates</text><text x="506" y="640" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">lighter parts, in the first days</text><circle cx="50" cy="690" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="50" y="695.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="76" y="696" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Emulsion or droplets</text><text x="76" y="720" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">waves whip it into a thick emulsion or break</text><text x="76" y="739" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">it up</text><circle cx="480" cy="690" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="480" y="695.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="506" y="696" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sinks</text><text x="506" y="720" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">some heavier residues</text><circle cx="50" cy="770" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="50" y="775.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="76" y="776" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Washes ashore as tar</text><text x="76" y="800" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">sticky, does not mix with water, coats what</text><text x="76" y="819" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">it touches</text>
</svg>