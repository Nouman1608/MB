<rect width="900" height="650" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: choosing a response</text>

<rect x="30" y="110" width="840" height="300" rx="14" fill="#b5d3cf"/><path d="M30,110 L870,110 L870,190 Q700,210 600,180 Q450,140 300,185 Q150,220 30,190 Z" fill="#d8e3c6" stroke="#1e2a44" stroke-width="2.5"/><path d="M300,185 Q370,165 440,165 L440,176 Q370,176 300,196 Z" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.5"/><text x="250" y="160" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">tourist beach</text><path d="M560,235 q30,-14 60,0 q30,-14 60,0 q-30,14 -60,0 q-30,14 -60,0 Z" fill="#b5602e" opacity="0.8" stroke="#1e2a44" stroke-width="2"/><text x="620" y="270" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">coral reef</text><g transform="rotate(-12 430 325)"><path d="M350,309.6 L490,309.6 L476,334.8 L359.8,334.8 Z" fill="#3a4660" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><rect x="362.6" y="288.6" width="23.799999999999997" height="21" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="369.6" y="278.8" width="7" height="9.799999999999999" fill="#b5602e" stroke="#1e2a44" stroke-width="1.6"/></g><path d="M400,350 q18,-14 45,-5.6000000000000005 q36,-9.799999999999999 72,-4.2 q36,-8.4 62.99999999999999,9.799999999999999 Z" fill="#2b2b2b"/><text x="450" y="382" font-size="16.5" font-weight="700" fill="#ffffff" text-anchor="middle">tanker aground in a storm</text><line x1="480" y1="300" x2="590" y2="250" stroke="#1e2a44" stroke-width="2" stroke-dasharray="6 5"/><rect x="522.8" y="276.8" width="50.4" height="21.6" rx="5" fill="#ffffff" opacity="0.92"/><text x="548" y="292" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">5 km</text><text x="860" y="400" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="end" font-style="italic">not to scale</text><text x="60" y="260" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">rough seas</text><text x="60" y="282" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">for 3 days</text><rect x="30" y="430" width="270" height="160" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="464.15" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Ruled out by weather</text><text x="48" y="489.72499999999997" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">booms and skimmers work</text><text x="48" y="511.505" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">poorly in rough seas;</text><text x="48" y="533.285" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">burning needs calm</text><rect x="315" y="430" width="270" height="160" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="333" y="464.15" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Risky here</text><text x="333" y="489.72499999999997" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">detergent sprays work in</text><text x="333" y="511.505" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">rough water but push oil</text><text x="333" y="533.285" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">down towards the reef</text><rect x="600" y="430" width="270" height="160" rx="14" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="618" y="464.15" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Sensible plan</text><text x="618" y="489.72499999999997" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">booms at the beach and</text><text x="618" y="511.505" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">reef entrance when</text><text x="618" y="533.285" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">possible; sorbents on the</text><text x="618" y="555.0649999999999" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">shore; skim once calm</text><text x="450" y="625" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">Prevention lesson: better navigation and a double hull might have stopped or reduced the spill.</text>
</svg>