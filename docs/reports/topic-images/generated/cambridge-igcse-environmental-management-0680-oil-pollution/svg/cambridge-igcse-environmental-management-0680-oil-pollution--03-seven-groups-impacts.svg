<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 815" width="900" height="815" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="815" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Impacts on the seven named groups</text>

<rect x="30" y="110" width="840" height="50" rx="10" fill="#1e2a44"/><text x="50" y="142" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Group</text><text x="230" y="142" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Physical</text><text x="445" y="142" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Toxic or lethal</text><text x="660" y="142" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Knock-on</text><rect x="30" y="170" width="840" height="76" rx="10" fill="#eef3f2" stroke="#c9d6d4" stroke-width="1.5"/><text x="50" y="214" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Birds</text><text x="230" y="194" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">feathers matted: lose</text><text x="230" y="213" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">waterproofing,</text><text x="230" y="232" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">insulation and buoyancy</text><text x="445" y="204" font-size="15.5" font-weight="400" fill="#b5602e" text-anchor="start">swallow oil while</text><text x="445" y="223" font-size="15.5" font-weight="400" fill="#b5602e" text-anchor="start">preening</text><text x="660" y="204" font-size="15.5" font-weight="400" fill="#2e6b62" text-anchor="start">oiled eggs may fail to</text><text x="660" y="223" font-size="15.5" font-weight="400" fill="#2e6b62" text-anchor="start">hatch</text><rect x="30" y="254" width="840" height="76" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="50" y="298" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Marine mammals</text><text x="230" y="288" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">oil coats fur, cutting</text><text x="230" y="307" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">insulation</text><text x="445" y="288" font-size="15.5" font-weight="400" fill="#b5602e" text-anchor="start">inhale fumes when they</text><text x="445" y="307" font-size="15.5" font-weight="400" fill="#b5602e" text-anchor="start">surface to breathe</text><text x="660" y="288" font-size="15.5" font-weight="400" fill="#2e6b62" text-anchor="start">poisoned by feeding on</text><text x="660" y="307" font-size="15.5" font-weight="400" fill="#2e6b62" text-anchor="start">contaminated prey</text><rect x="30" y="338" width="840" height="76" rx="10" fill="#eef3f2" stroke="#c9d6d4" stroke-width="1.5"/><text x="50" y="382" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Fish</text><text x="230" y="372" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">gills coated: less</text><text x="230" y="391" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">oxygen taken up</text><text x="445" y="372" font-size="15.5" font-weight="400" fill="#b5602e" text-anchor="start">eggs and larvae near</text><text x="445" y="391" font-size="15.5" font-weight="400" fill="#b5602e" text-anchor="start">the surface killed</text><text x="660" y="372" font-size="15.5" font-weight="400" fill="#2e6b62" text-anchor="start">fisheries close; income</text><text x="660" y="391" font-size="15.5" font-weight="400" fill="#2e6b62" text-anchor="start">lost</text><rect x="30" y="422" width="840" height="76" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="50" y="466" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Crustaceans</text><text x="230" y="456" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">smothered by sinking or</text><text x="230" y="475" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">stranded oil</text><text x="445" y="466" font-size="15.5" font-weight="400" fill="#b5602e" text-anchor="start">absorb toxic compounds</text><text x="660" y="456" font-size="15.5" font-weight="400" fill="#2e6b62" text-anchor="start">survivors may be unsafe</text><text x="660" y="475" font-size="15.5" font-weight="400" fill="#2e6b62" text-anchor="start">to eat</text><rect x="30" y="506" width="840" height="76" rx="10" fill="#eef3f2" stroke="#c9d6d4" stroke-width="1.5"/><text x="50" y="550" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Seaweeds</text><text x="230" y="540" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">coating blocks light</text><text x="230" y="559" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">and gas exchange</text><text x="445" y="540" font-size="15.5" font-weight="400" fill="#b5602e" text-anchor="start">photosynthesis falls;</text><text x="445" y="559" font-size="15.5" font-weight="400" fill="#b5602e" text-anchor="start">die back</text><text x="660" y="540" font-size="15.5" font-weight="400" fill="#2e6b62" text-anchor="start">less food and shelter</text><text x="660" y="559" font-size="15.5" font-weight="400" fill="#2e6b62" text-anchor="start">for others</text><rect x="30" y="590" width="840" height="76" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="50" y="634" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Coral reefs</text><text x="230" y="614" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">smothered; light</text><text x="230" y="633" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">blocked to algae in</text><text x="230" y="652" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">coral</text><text x="445" y="624" font-size="15.5" font-weight="400" fill="#b5602e" text-anchor="start">toxins kill coral</text><text x="445" y="643" font-size="15.5" font-weight="400" fill="#b5602e" text-anchor="start">polyps</text><text x="660" y="624" font-size="15.5" font-weight="400" fill="#2e6b62" text-anchor="start">damage spreads through</text><text x="660" y="643" font-size="15.5" font-weight="400" fill="#2e6b62" text-anchor="start">reef food web</text><rect x="30" y="674" width="840" height="76" rx="10" fill="#eef3f2" stroke="#c9d6d4" stroke-width="1.5"/><text x="50" y="718" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Beaches</text><text x="230" y="708" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">oil and tar coat sand</text><text x="230" y="727" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">and rocks</text><text x="445" y="718" font-size="15.5" font-weight="400" fill="#b5602e" text-anchor="start">shore organisms killed</text><text x="660" y="708" font-size="15.5" font-weight="400" fill="#2e6b62" text-anchor="start">tourists leave;</text><text x="660" y="727" font-size="15.5" font-weight="400" fill="#2e6b62" text-anchor="start">clean-up disturbs</text><text x="450" y="790" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">For each group give a physical effect, a toxic effect, then a knock-on effect.</text>
</svg>