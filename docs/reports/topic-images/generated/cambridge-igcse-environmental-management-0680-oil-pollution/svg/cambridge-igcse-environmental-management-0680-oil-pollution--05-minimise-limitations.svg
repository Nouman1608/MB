<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 815" width="900" height="815" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="815" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Limiting the damage: what holds each method back</text>

<rect x="30" y="110" width="840" height="520" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="400" y="150" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">Weather</text><text x="520" y="150" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">Toxicity</text><text x="640" y="150" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">Waste or</text><text x="640" y="170" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">pollution</text><text x="770" y="150" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">Cost or</text><text x="770" y="170" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">slow</text><text x="60" y="160" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Strategy and how it works</text><rect x="40" y="190" width="820" height="84" fill="#f1f5f4"/><text x="60" y="226" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Improved navigation</text><text x="60" y="252" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">satellites, radar, charts avoid hazards</text><circle cx="400" cy="232" r="6" fill="#d6dedd" stroke="#d6dedd" stroke-width="1"/><circle cx="520" cy="232" r="6" fill="#d6dedd" stroke="#d6dedd" stroke-width="1"/><circle cx="640" cy="232" r="6" fill="#d6dedd" stroke="#d6dedd" stroke-width="1"/><circle cx="770" cy="232" r="13" fill="#b5602e" stroke="#b5602e" stroke-width="2.5"/><text x="60" y="310" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Booms and sorbents</text><text x="60" y="336" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">contain, steer or soak up oil</text><circle cx="400" cy="316" r="13" fill="#b5602e" stroke="#b5602e" stroke-width="2.5"/><circle cx="520" cy="316" r="6" fill="#d6dedd" stroke="#d6dedd" stroke-width="1"/><circle cx="640" cy="316" r="13" fill="#b5602e" stroke="#b5602e" stroke-width="2.5"/><circle cx="770" cy="316" r="6" fill="#d6dedd" stroke="#d6dedd" stroke-width="1"/><rect x="40" y="358" width="820" height="84" fill="#f1f5f4"/><text x="60" y="394" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Detergent sprays</text><text x="60" y="420" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">break slick into droplets</text><circle cx="400" cy="400" r="6" fill="#d6dedd" stroke="#d6dedd" stroke-width="1"/><circle cx="520" cy="400" r="13" fill="#b5602e" stroke="#b5602e" stroke-width="2.5"/><circle cx="640" cy="400" r="6" fill="#d6dedd" stroke="#d6dedd" stroke-width="1"/><circle cx="770" cy="400" r="6" fill="#d6dedd" stroke="#d6dedd" stroke-width="1"/><text x="60" y="478" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Skimmers</text><text x="60" y="504" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">lift oil off the surface</text><circle cx="400" cy="484" r="13" fill="#b5602e" stroke="#b5602e" stroke-width="2.5"/><circle cx="520" cy="484" r="6" fill="#d6dedd" stroke="#d6dedd" stroke-width="1"/><circle cx="640" cy="484" r="6" fill="#d6dedd" stroke="#d6dedd" stroke-width="1"/><circle cx="770" cy="484" r="13" fill="#b5602e" stroke="#b5602e" stroke-width="2.5"/><rect x="40" y="526" width="820" height="84" fill="#f1f5f4"/><text x="60" y="562" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Controlled burning</text><text x="60" y="588" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">set surface oil alight</text><circle cx="400" cy="568" r="13" fill="#b5602e" stroke="#b5602e" stroke-width="2.5"/><circle cx="520" cy="568" r="6" fill="#d6dedd" stroke="#d6dedd" stroke-width="1"/><circle cx="640" cy="568" r="13" fill="#b5602e" stroke="#b5602e" stroke-width="2.5"/><circle cx="770" cy="568" r="6" fill="#d6dedd" stroke="#d6dedd" stroke-width="1"/><text x="450" y="655" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">Limitations noted in the lesson</text><text x="40" y="690" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="56" y="690" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Weather: high waves, strong currents, rough water; burning needs calm</text><text x="40" y="719" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="56" y="719" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Toxicity: detergents toxic; dispersed oil reaches fish and sea-bed life</text><text x="40" y="748" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="56" y="748" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Waste: used sorbents are oily waste; burning makes smoke and carbon dioxide</text><text x="40" y="777" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="56" y="777" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cost: equipment and training cost; skimmers slow</text>
</svg>