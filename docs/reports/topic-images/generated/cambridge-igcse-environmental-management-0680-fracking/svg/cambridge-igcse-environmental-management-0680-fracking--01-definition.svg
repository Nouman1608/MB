<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 596" width="900" height="596" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="596" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Unpacking the definition</text>

<text x="450" y="140" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Fracking is…</text><rect x="30" y="165" width="330" height="104" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="195" y="209.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">the extraction of natural</text><text x="195" y="233.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">gas or petroleum</text><line x1="366" y1="217" x2="420" y2="217" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="426" y="165" width="444" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="444" y="210.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">gas, oil or both: a way of obtaining fossil</text><text x="444" y="232.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">fuels, not a new energy resource</text><rect x="30" y="295" width="330" height="104" rx="12" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><text x="195" y="351.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">from shale rock</text><line x1="366" y1="347" x2="420" y2="347" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="426" y="295" width="444" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="444" y="340.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the fine-grained, impermeable sedimentary</text><text x="444" y="362.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">rock that holds the fuel</text><rect x="30" y="425" width="330" height="104" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="195" y="481.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">by hydraulic fracturing</text><line x1="366" y1="477" x2="420" y2="477" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="426" y="425" width="444" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="444" y="470.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“hydraulic” = liquid under pressure;</text><text x="444" y="492.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“fracturing” = cracking the rock</text><text x="450" y="568" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">A definition answer needs all three parts.</text>
</svg>