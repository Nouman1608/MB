<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 820" width="900" height="820" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="820" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Where the risks come from</text>

<text x="130" y="140" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Process step</text><text x="440" y="140" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">Limitation</text><text x="735" y="140" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Reduce it by</text><rect x="30" y="160" width="200" height="96" rx="12" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><text x="130" y="202.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Drilling and</text><text x="130" y="223.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">sealing</text><line x1="234" y1="208" x2="304" y2="208" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="268" y="198" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><rect x="310" y="160" width="260" height="96" rx="12" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="322" y="188.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Ground water</text><text x="322" y="209.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">contamination</text><text x="322" y="238.26" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">casing may fail</text><line x1="574" y1="208" x2="594" y2="208" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="600" y="160" width="270" height="96" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="612" y="191.7" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">strict well-construction laws;</text><text x="612" y="211.7" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">inspections; test ground water</text><text x="612" y="231.7" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">before, during and after</text><rect x="30" y="270" width="200" height="96" rx="12" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><text x="130" y="312.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Fracturing at high</text><text x="130" y="333.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">pressure</text><line x1="234" y1="318" x2="304" y2="318" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="268" y="308" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><rect x="310" y="270" width="260" height="96" rx="12" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="322" y="308.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Induced earthquakes</text><text x="322" y="337.76" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">pressure makes faults slip</text><line x1="574" y1="318" x2="594" y2="318" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="600" y="270" width="270" height="96" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="612" y="311.7" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">monitor ground movement; pause</text><text x="612" y="331.7" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">if tremors are detected</text><rect x="30" y="380" width="200" height="96" rx="12" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><text x="130" y="422.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Fluid: water,</text><text x="130" y="443.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">sand, chemicals</text><line x1="234" y1="428" x2="304" y2="428" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="268" y="418" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><rect x="310" y="380" width="260" height="96" rx="12" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="322" y="418.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Heavy water use</text><text x="322" y="447.76" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">large volumes needed</text><line x1="574" y1="428" x2="594" y2="428" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="600" y="380" width="270" height="96" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="612" y="421.7" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">no control listed: weigh it</text><text x="612" y="441.7" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">carefully in dry areas</text><rect x="30" y="490" width="200" height="96" rx="12" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><text x="130" y="532.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Flowback and</text><text x="130" y="553.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">production</text><line x1="234" y1="538" x2="304" y2="538" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="268" y="528" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><rect x="310" y="490" width="260" height="96" rx="12" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="322" y="518.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Wastewater and methane</text><text x="322" y="539.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">leaks</text><text x="322" y="568.26" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">fluid returns; gas can escape</text><line x1="574" y1="538" x2="594" y2="538" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="600" y="490" width="270" height="96" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="612" y="531.7" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">treat or recycle wastewater;</text><text x="612" y="551.7" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">detect and repair leaks</text><rect x="30" y="600" width="200" height="96" rx="12" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><text x="130" y="642.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Well pad and</text><text x="130" y="663.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">traffic</text><line x1="234" y1="648" x2="304" y2="648" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="268" y="638" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><rect x="310" y="600" width="260" height="96" rx="12" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="322" y="628.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Local disruption</text><text x="322" y="657.76" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">noise, lorries, lighting,</text><text x="322" y="677.76" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">land</text><line x1="574" y1="648" x2="594" y2="648" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="600" y="600" width="270" height="96" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="612" y="641.7" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">keep well sites away from</text><text x="612" y="661.7" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">homes and sensitive habitats</text><rect x="30" y="714" width="840" height="76" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" stroke-dasharray="8 6"/><text x="48" y="745.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The limitation of every control is cost and enforcement: rules only work if they are</text><text x="48" y="767.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">monitored and obeyed.</text>
</svg>