<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 762" width="900" height="762" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="762" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who gains, who bears the cost</text>

<rect x="30" y="110" width="410" height="60" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="148" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="middle">Benefits</text><rect x="460" y="110" width="410" height="60" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="665" y="148" font-size="22" font-weight="700" fill="#b5602e" text-anchor="middle">Limitations</text><rect x="30" y="184" width="410" height="58" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="40" y="207.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Greater energy security</text><text x="40" y="236.26" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">fewer imports</text><rect x="335" y="198.5" width="93" height="29" rx="14.5" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="381.5" y="218.4" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">national</text><rect x="30" y="250" width="410" height="58" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="40" y="273.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Jobs and income</text><text x="40" y="302.26" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">workers, taxes, landowner payments</text><rect x="360.875" y="264.5" width="67.125" height="29" rx="14.5" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="394.4375" y="284.4" font-size="15" font-weight="600" fill="#b5602e" text-anchor="middle">local</text><rect x="30" y="316" width="410" height="58" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="40" y="339.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Lower energy prices</text><text x="40" y="368.26" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">large new gas supplies</text><rect x="335" y="330.5" width="93" height="29" rx="14.5" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="381.5" y="350.4" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">national</text><rect x="30" y="382" width="410" height="58" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="40" y="405.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Less CO₂ and SO₂ than coal</text><text x="40" y="434.26" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">if gas replaces coal</text><rect x="352.25" y="396.5" width="75.75" height="29" rx="14.5" fill="#ffffff" stroke="#2b5a9a" stroke-width="2"/><text x="390.125" y="416.4" font-size="15" font-weight="600" fill="#2b5a9a" text-anchor="middle">global</text><rect x="30" y="448" width="410" height="58" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="40" y="471.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Uses existing networks</text><text x="40" y="500.26" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">pipelines, power stations</text><rect x="335" y="462.5" width="93" height="29" rx="14.5" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="381.5" y="482.4" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">national</text><rect x="30" y="514" width="410" height="58" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="40" y="537.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Access to new reserves</text><text x="40" y="566.26" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">fuel conventional wells cannot reach</text><rect x="335" y="528.5" width="93" height="29" rx="14.5" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="381.5" y="548.4" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">national</text><rect x="460" y="184" width="410" height="58" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="470" y="207.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Induced earthquakes</text><text x="470" y="236.26" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">fluid makes faults slip</text><rect x="790.875" y="198.5" width="67.125" height="29" rx="14.5" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="824.4375" y="218.4" font-size="15" font-weight="600" fill="#b5602e" text-anchor="middle">local</text><rect x="460" y="250" width="410" height="58" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="470" y="273.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Ground water contamination</text><text x="470" y="302.26" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">if casing fails or fluid spills</text><rect x="790.875" y="264.5" width="67.125" height="29" rx="14.5" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="824.4375" y="284.4" font-size="15" font-weight="600" fill="#b5602e" text-anchor="middle">local</text><rect x="460" y="316" width="410" height="58" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="470" y="339.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Heavy water use</text><text x="470" y="368.26" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">competes with farms and homes</text><rect x="790.875" y="330.5" width="67.125" height="29" rx="14.5" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="824.4375" y="350.4" font-size="15" font-weight="600" fill="#b5602e" text-anchor="middle">local</text><rect x="460" y="382" width="410" height="58" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="470" y="405.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Wastewater</text><text x="470" y="434.26" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">chemicals and salts in flowback</text><rect x="790.875" y="396.5" width="67.125" height="29" rx="14.5" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="824.4375" y="416.4" font-size="15" font-weight="600" fill="#b5602e" text-anchor="middle">local</text><rect x="460" y="448" width="410" height="58" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="470" y="471.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Methane leakage</text><text x="470" y="500.26" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">a powerful greenhouse gas</text><rect x="782.25" y="462.5" width="75.75" height="29" rx="14.5" fill="#ffffff" stroke="#2b5a9a" stroke-width="2"/><text x="820.125" y="482.4" font-size="15" font-weight="600" fill="#2b5a9a" text-anchor="middle">global</text><rect x="460" y="514" width="410" height="58" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="470" y="537.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Continued fossil fuel use</text><text x="470" y="566.26" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">can delay renewables</text><rect x="782.25" y="528.5" width="75.75" height="29" rx="14.5" fill="#ffffff" stroke="#2b5a9a" stroke-width="2"/><text x="820.125" y="548.4" font-size="15" font-weight="600" fill="#2b5a9a" text-anchor="middle">global</text><rect x="460" y="580" width="410" height="58" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="470" y="603.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Local disruption</text><text x="470" y="632.26" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">noise, lorries, lighting, land</text><rect x="790.875" y="594.5" width="67.125" height="29" rx="14.5" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="824.4375" y="614.4" font-size="15" font-weight="600" fill="#b5602e" text-anchor="middle">local</text><rect x="30" y="656" width="840" height="76" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="687.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Pattern to point out: many benefits are national, while many limitations are local. Who</text><text x="48" y="709.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">gains is often not who bears the cost.</text>
</svg>