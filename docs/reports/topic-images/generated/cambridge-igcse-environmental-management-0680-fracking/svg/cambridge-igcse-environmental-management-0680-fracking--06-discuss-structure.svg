<rect width="900" height="570" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Building a fracking discuss answer</text>

<rect x="30" y="110" width="840" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="110" width="190" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="64" cy="170" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="64" y="176.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="94" y="177" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Benefits</text><text x="244" y="152" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">energy security, jobs, tax, less CO₂ than coal</text><text x="244" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">link to the source: “Country Z imports most of its gas”</text><line x1="125" y1="232" x2="125" y2="248" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="250" width="840" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="250" width="190" height="120" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><circle cx="64" cy="310" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="64" y="316.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="94" y="317" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Limitations</text><text x="244" y="292" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">ground water, earthquakes, disruption, methane</text><text x="244" y="324" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">link to the source: farm wells, 2 km from a town, natural earthquakes</text><line x1="125" y1="372" x2="125" y2="388" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="390" width="840" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="390" width="190" height="120" rx="14" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><circle cx="64" cy="450" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="64" y="456.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="94" y="457" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement</text><text x="244" y="432" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">weigh national gains against local risks at this site</text><text x="244" y="464" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">conditions: strict monitoring, or alternatives such as conservation</text><text x="244" y="485" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">and renewables</text><text x="450" y="544" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">Explain every point with “because” or “so”, and use every detail in the source.</text>
</svg>