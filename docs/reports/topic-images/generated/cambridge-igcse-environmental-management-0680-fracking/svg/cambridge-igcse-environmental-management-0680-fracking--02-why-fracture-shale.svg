<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 706" width="900" height="706" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="706" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why shale has to be cracked</text>

<rect x="30" y="110" width="840" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="32" y="170" width="836" height="50" rx="0" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.5"/><rect x="32" y="220" width="836" height="60" rx="0" fill="#cbbf9f" stroke="#1e2a44" stroke-width="1.5"/><rect x="32" y="280" width="836" height="80" rx="0" fill="#efdfa8" stroke="#1e2a44" stroke-width="1.5"/><rect x="32" y="360" width="836" height="110" rx="0" fill="#4a5568" stroke="#1e2a44" stroke-width="1.5"/><rect x="32" y="470" width="836" height="108" rx="0" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.5"/><text x="46" y="256" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">impermeable cap rock</text><text x="46" y="326" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">permeable rock</text><text x="46" y="396" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">shale: impermeable, tiny unconnected pores</text><rect x="270" y="296" width="160" height="34" rx="0" fill="#1e2a44" opacity="0.75"/><text x="350" y="318" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">trapped gas and oil</text><rect x="344" y="130" width="12" height="170" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><line x1="332" y1="290" x2="332" y2="150" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><line x1="470" y1="455" x2="400" y2="338" stroke="#f2e7b8" stroke-width="2.5" marker-end="url(#ah)" stroke-dasharray="6 5"/><line x1="520" y1="455" x2="418" y2="338" stroke="#f2e7b8" stroke-width="2.5" marker-end="url(#ah)" stroke-dasharray="6 5"/><text x="460" y="458" font-size="15" font-weight="600" fill="#ffffff" text-anchor="end">some gas moved up long ago</text><rect x="644" y="130" width="12" height="280" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="600" cy="380" r="5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.5"/><circle cx="650" cy="380" r="5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.5"/><circle cx="700" cy="380" r="5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.5"/><circle cx="750" cy="380" r="5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.5"/><circle cx="800" cy="380" r="5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.5"/><circle cx="600" cy="420" r="5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.5"/><circle cx="650" cy="420" r="5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.5"/><circle cx="700" cy="420" r="5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.5"/><circle cx="750" cy="420" r="5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.5"/><circle cx="800" cy="420" r="5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.5"/><text x="670" y="136" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Well into shale:</text><text x="670" y="158" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">very little flows</text><text x="320" y="136" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">Conventional well:</text><text x="320" y="158" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end">flows out on its own</text><text x="858" y="568" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Not to scale</text><rect x="30" y="600" width="840" height="76" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="631.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Gas held in shale cannot flow to a well, so the rock must be cracked to make pathways:</text><text x="48" y="653.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">that is the purpose of hydraulic fracturing.</text>
</svg>