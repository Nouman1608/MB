<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 715" width="900" height="715" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="715" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Comparing five strategies</text>

<rect x="30" y="110" width="840" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="150" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Strategy</text><text x="370" y="142" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">Protects</text><text x="370" y="162" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">habitat?</text><text x="520" y="142" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">Keeps genetic</text><text x="520" y="162" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">variety?</text><text x="660" y="150" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Main weakness</text><rect x="40" y="180" width="820" height="78" fill="#f1f5f4"/><text x="60" y="225" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">National parks and reserves</text><circle cx="370" cy="210" r="15" fill="#2e6b62" stroke="#2e6b62" stroke-width="2.5"/><path d="M363,210 l5,6 l10,-12" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="370" y="246" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Yes</text><circle cx="520" cy="210" r="15" fill="#2e6b62" stroke="#2e6b62" stroke-width="2.5"/><path d="M513,210 l5,6 l10,-12" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="520" y="246" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Yes</text><text x="660" y="215" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Funding and</text><text x="660" y="236" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">enforcement</text><text x="60" y="303" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Wildlife corridors</text><circle cx="370" cy="288" r="15" fill="#ffffff" stroke="#8a6d0d" stroke-width="3"/><path d="M370,274.5 A13.5,13.5 0 0,1 370,301.5 Z" fill="#d4b02e"/><text x="370" y="324" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Partly</text><circle cx="520" cy="288" r="15" fill="#2e6b62" stroke="#2e6b62" stroke-width="2.5"/><path d="M513,288 l5,6 l10,-12" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="520" y="324" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Yes, by linking</text><text x="660" y="303" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Uses land</text><rect x="40" y="336" width="820" height="78" fill="#f1f5f4"/><text x="60" y="381" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Seed banks</text><circle cx="370" cy="366" r="15" fill="#b5602e" stroke="#b5602e" stroke-width="2.5"/><path d="M364,360 l12,12 M376,360 l-12,12" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="370" y="402" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">No</text><circle cx="520" cy="366" r="15" fill="#2e6b62" stroke="#2e6b62" stroke-width="2.5"/><path d="M513,366 l5,6 l10,-12" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="520" y="402" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Yes, for plants</text><text x="660" y="381" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">No wild protection</text><text x="60" y="459" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Zoos and captive breeding</text><circle cx="370" cy="444" r="15" fill="#b5602e" stroke="#b5602e" stroke-width="2.5"/><path d="M364,438 l12,12 M376,438 l-12,12" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="370" y="480" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">No</text><circle cx="520" cy="444" r="15" fill="#ffffff" stroke="#8a6d0d" stroke-width="3"/><path d="M520,430.5 A13.5,13.5 0 0,1 520,457.5 Z" fill="#d4b02e"/><text x="520" y="480" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Limited</text><text x="660" y="449" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Cost; habitat must</text><text x="660" y="470" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">exist</text><rect x="40" y="492" width="820" height="78" fill="#f1f5f4"/><text x="60" y="537" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Trade regulation</text><circle cx="370" cy="522" r="15" fill="#b5602e" stroke="#b5602e" stroke-width="2.5"/><path d="M364,516 l12,12 M376,516 l-12,12" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="370" y="558" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">No</text><circle cx="520" cy="522" r="15" fill="#ffffff" stroke="#8a6d0d" stroke-width="3"/><path d="M520,508.5 A13.5,13.5 0 0,1 520,535.5 Z" fill="#d4b02e"/><text x="520" y="558" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Indirectly</text><text x="660" y="537" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Smuggling</text><text x="450" y="620" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">No single strategy is enough. Argue for a combination, for example:</text><rect x="51" y="640" width="120" height="48" rx="24" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="111" y="669.94" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">reserve</text><text x="184" y="672" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><rect x="197" y="640" width="190" height="48" rx="24" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="292" y="669.94" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">linked by corridors</text><text x="400" y="672" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><rect x="413" y="640" width="210" height="48" rx="24" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="518" y="669.94" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">funded by ecotourism</text><text x="636" y="672" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><rect x="649" y="640" width="200" height="48" rx="24" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="749" y="669.94" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">backed by trade laws</text>
</svg>