<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 718" width="900" height="718" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="718" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Ten strategies for conserving biodiversity</text>

<rect x="30" y="110" width="190" height="122" rx="12" fill="#8a6d0d"/><text x="125" y="165" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Earn from wildlife</text><text x="125" y="189" font-size="16" font-weight="400" fill="#ffffff" text-anchor="middle">without using it up</text><rect x="236" y="110" width="203.33333333333334" height="122" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="262" cy="140" r="16" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="262" y="145.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="288" y="146" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Sustainable</text><text x="288" y="167" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">harvesting</text><text x="252" y="194" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">quotas, closed</text><text x="252" y="213" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">seasons, size limits</text><rect x="451.33333333333337" y="110" width="203.33333333333334" height="122" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="477.33333333333337" cy="140" r="16" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="477.33333333333337" y="145.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="503.33333333333337" y="146" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Sustainable</text><text x="503.33333333333337" y="167" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">forestry</text><text x="467.33333333333337" y="194" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">selective felling,</text><text x="467.33333333333337" y="213" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">replanting</text><rect x="666.6666666666667" y="110" width="203.33333333333334" height="122" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="692.6666666666667" cy="140" r="16" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="692.6666666666667" y="145.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">7</text><text x="718.6666666666667" y="146" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Ecotourism</text><text x="682.6666666666667" y="173" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">visitors pay to see</text><text x="682.6666666666667" y="192" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">wildlife</text><rect x="30" y="246" width="190" height="100" rx="12" fill="#2e6b62"/><text x="125" y="290" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Protect habitats</text><text x="125" y="314" font-size="16" font-weight="400" fill="#ffffff" text-anchor="middle">in situ</text><rect x="236" y="246" width="311" height="100" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="262" cy="276" r="16" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="262" y="281.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="288" y="282" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">National parks and</text><text x="288" y="303" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">reserves</text><text x="252" y="330" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">areas protected by law</text><rect x="559" y="246" width="311" height="100" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="585" cy="276" r="16" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="585" y="281.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="611" y="282" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Wildlife corridors</text><text x="575" y="309" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">strips of habitat link patches</text><rect x="30" y="360" width="190" height="100" rx="12" fill="#8a6d0d"/><text x="125" y="404" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Keep away from</text><text x="125" y="428" font-size="16" font-weight="400" fill="#ffffff" text-anchor="middle">the wild: ex situ</text><rect x="236" y="360" width="311" height="100" rx="12" fill="#fbf6e2" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="262" cy="390" r="16" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="262" y="395.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="288" y="396" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Seed banks</text><text x="252" y="423" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">seeds dried and stored cold</text><rect x="559" y="360" width="311" height="100" rx="12" fill="#fbf6e2" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="585" cy="390" r="16" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="585" y="395.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="611" y="396" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Zoos and captive breeding</text><text x="575" y="423" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">breed, sometimes release</text><rect x="30" y="474" width="190" height="100" rx="12" fill="#b5602e"/><text x="125" y="518" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Control trade</text><text x="125" y="542" font-size="16" font-weight="400" fill="#ffffff" text-anchor="middle">in animals</text><rect x="236" y="474" width="311" height="100" rx="12" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><circle cx="262" cy="504" r="16" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="262" y="509.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">8</text><text x="288" y="510" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">International cooperation</text><text x="252" y="537" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">against illegal animal trade</text><rect x="559" y="474" width="311" height="100" rx="12" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><circle cx="585" cy="504" r="16" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="585" y="509.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">9</text><text x="611" y="510" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Regulation of trade</text><text x="575" y="537" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">CITES (1973): lists, permits</text><rect x="30" y="588" width="190" height="100" rx="12" fill="#2e6b62"/><text x="125" y="644" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Set priorities</text><rect x="236" y="588" width="634" height="100" rx="12" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><circle cx="262" cy="618" r="16" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="262" y="623.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">10</text><text x="288" y="624" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Classify by threat level</text><text x="252" y="651" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">threatened, endangered, extinct; IUCN Red List</text>
</svg>