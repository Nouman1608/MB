<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="660" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Classifying species by threat level</text>

<defs><linearGradient id="risk" x1="0" x2="1"><stop offset="0" stop-color="#f2e7b8"/><stop offset="1" stop-color="#b5602e"/></linearGradient></defs><path d="M60,170 L800,170 L800,152 L850,184 L800,216 L800,198 L60,198 Z" fill="url(#risk)" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="60" y="152" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">risk of extinction increases →</text><circle cx="162" cy="184" r="12" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><line x1="162" y1="200" x2="162" y2="230" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="230" width="265" height="190" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="162" y="268" font-size="22" font-weight="700" fill="#8a6d0d" text-anchor="middle">Threatened</text><text x="162" y="302" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">numbers or habitat are</text><text x="162" y="324" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">declining; at risk of</text><text x="162" y="346" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">extinction if the threats</text><text x="162" y="368" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">continue</text><circle cx="447" cy="184" r="12" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><line x1="447" y1="200" x2="447" y2="230" stroke="#1e2a44" stroke-width="2.5"/><rect x="315" y="230" width="265" height="190" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="447" y="268" font-size="22" font-weight="700" fill="#b5602e" text-anchor="middle">Endangered</text><text x="447" y="302" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">very high risk of</text><text x="447" y="324" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">extinction in the near</text><text x="447" y="346" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">future; usually few</text><text x="447" y="368" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">individuals or a small</text><text x="447" y="390" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">range left</text><circle cx="732" cy="184" r="12" fill="#1e2a44" stroke="#1e2a44" stroke-width="3"/><line x1="732" y1="200" x2="732" y2="230" stroke="#1e2a44" stroke-width="2.5"/><rect x="600" y="230" width="265" height="190" rx="14" fill="#e8ecef" stroke="#1e2a44" stroke-width="2.5"/><text x="732" y="268" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Extinct</text><text x="732" y="302" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">no living individuals</text><text x="732" y="324" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">remain</text><rect x="30" y="460" width="840" height="170" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="498" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The IUCN Red List classifies species by their risk of extinction.</text><text x="60" y="534" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Benefit</text><text x="160" y="534" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">shows which species need action most urgently, so</text><text x="160" y="557" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">scarce money goes where it is needed</text><text x="60" y="592" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">Limitation</text><text x="160" y="592" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">many species have never been surveyed, and a label</text><text x="160" y="615" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">alone does not protect anything</text>
</svg>