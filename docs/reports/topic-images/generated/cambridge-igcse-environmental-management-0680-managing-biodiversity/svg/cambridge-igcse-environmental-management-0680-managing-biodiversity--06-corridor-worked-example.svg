4" text-anchor="middle">91 across both patches</text><rect x="630.6" y="220.8" width="88.8" height="21.6" rx="5" fill="#ffffff" opacity="0.92"/><text x="675" y="236" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">corridor</text><text x="840" y="400" font-size="15" font-weight="400" fill="#8a6d0d" text-anchor="end" font-style="italic">farmland</text><text x="410" y="400" font-size="15" font-weight="400" fill="#8a6d0d" text-anchor="end" font-style="italic">farmland</text><rect x="30" y="430" width="520" height="170" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="470" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Start = 40 + 25 = 65</text><text x="56" y="504" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Increase = 91 − 65 = 26</text><text x="56" y="538" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">% increase = 26 ÷ 65 × 100 = 40%</text><text x="56" y="578" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">invented data: a small mammal</text><rect x="570" y="430" width="300" height="170" rx="14" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="592" y="466" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Was it the corridor?</text><text x="592" y="496" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">A mild winter could also</text><text x="592" y="518" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">raise numbers. Survey a</text><text x="592" y="540" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">similar unlinked patch to</text><text x="592" y="562" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">compare.</text>
