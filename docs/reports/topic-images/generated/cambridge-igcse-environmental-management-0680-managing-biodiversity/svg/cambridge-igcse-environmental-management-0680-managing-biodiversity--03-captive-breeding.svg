<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="690" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Zoos and captive breeding</text>

<rect x="30" y="120" width="260" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="62" cy="155" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="162.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="94" y="163" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Capture</text><text x="52" y="205" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">take in the last wild</text><text x="52" y="227" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">individuals</text><line x1="293" y1="188" x2="316" y2="188" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="320" y="120" width="260" height="135" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="352" cy="155" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="352" y="162.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="384" y="163" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Breed</text><text x="342" y="205" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">in zoos or breeding</text><text x="342" y="227" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">centres; keep records to</text><text x="342" y="249" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">avoid inbreeding</text><line x1="583" y1="188" x2="606" y2="188" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="610" y="120" width="260" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="642" cy="155" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="642" y="162.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="674" y="163" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Release</text><text x="632" y="205" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">offspring go back into</text><text x="632" y="227" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">the wild</text><rect x="30" y="275" width="840" height="90" rx="14" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="60" y="311" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Release only works if a safe habitat still exists.</text><text x="60" y="341" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">So captive breeding is not a full solution on its own.</text><rect x="30" y="385" width="840" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="421" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Example: the California condor</text><text x="60" y="451" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The last wild birds were captured in the 1980s and bred in captivity;</text><text x="60" y="477" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">their offspring were released.</text><text x="30" y="535" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Benefit</text><text x="460" y="535" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Limitations</text><text x="30" y="565" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="46" y="565" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">rescues species with very few individuals</text><text x="46" y="586" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">left</text><text x="30" y="615" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="46" y="615" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">zoos raise public awareness and funds</text><text x="460" y="565" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="476" y="565" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">expensive</text><text x="460" y="594" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="476" y="594" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">small captive populations have limited</text><text x="476" y="615" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">genetic variety</text><text x="460" y="644" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="476" y="644" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">captive-bred animals may struggle in the</text><text x="476" y="665" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">wild</text>
</svg>