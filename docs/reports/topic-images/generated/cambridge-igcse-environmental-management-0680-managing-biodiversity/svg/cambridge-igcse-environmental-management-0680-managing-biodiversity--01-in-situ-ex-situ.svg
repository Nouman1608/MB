<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="640" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Biodiversity: protect it where, and how?</text>

<text x="450" y="132" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Biodiversity = the variety of life in an area</text><rect x="60" y="150" width="240" height="48" rx="24" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="180" y="180.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">species</text><rect x="330" y="150" width="240" height="48" rx="24" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="180.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">genes within them</text><rect x="600" y="150" width="240" height="48" rx="24" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="720" y="180.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">habitats</text><text x="450" y="228" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">Genetic resources: genes in wild species that people may use, e.g. to breed crops that resist disease or drought.</text><rect x="30" y="250" width="410" height="360" rx="14" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="288" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="middle">IN SITU</text><text x="235" y="313" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">protect the habitat where species live</text><rect x="60" y="335" width="350" height="150" rx="10" fill="#d8e3c6" stroke="#1e2a44" stroke-width="2"/><rect x="60" y="335" width="350" height="150" rx="10" fill="none" stroke="#2e6b62" stroke-width="4" stroke-dasharray="12 7"/><rect x="92.3" y="455.8" width="5.4" height="16.2" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.8"/><circle cx="95" cy="445" r="14.4" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><rect x="147.3" y="438.8" width="5.4" height="16.2" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.8"/><circle cx="150" cy="428" r="14.4" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><rect x="332.3" y="445.8" width="5.4" height="16.2" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.8"/><circle cx="335" cy="435" r="14.4" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><rect x="372.3" y="459.8" width="5.4" height="16.2" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.8"/><circle cx="375" cy="449" r="14.4" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><rect x="282.3" y="433.8" width="5.4" height="16.2" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.8"/><circle cx="285" cy="423" r="14.4" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><circle cx="210" cy="455" r="9" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="238" cy="465" r="7" fill="#8a6d0d" stroke="#1e2a44" stroke-width="2.5"/><text x="235" y="365" font-size="15.5" font-weight="600" fill="#1e2a44" text-anchor="middle">national park or reserve</text><text x="56" y="520" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">+ saves every species in the habitat,</text><text x="56" y="542" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">even unstudied ones</text><text x="56" y="580" font-size="16.5" font-weight="600" fill="#2e6b62" text-anchor="start">e.g. national parks and reserves</text><rect x="460" y="250" width="410" height="360" rx="14" fill="#fbf6e2" stroke="#8a6d0d" stroke-width="2.5"/><text x="665" y="288" font-size="22" font-weight="700" fill="#8a6d0d" text-anchor="middle">EX SITU</text><text x="665" y="313" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="middle">keep species or seeds away from the wild</text><rect x="495" y="345" width="150" height="130" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><line x1="510" y1="345" x2="510" y2="475" stroke="#4a5568" stroke-width="2"/><line x1="528" y1="345" x2="528" y2="475" stroke="#4a5568" stroke-width="2"/><line x1="546" y1="345" x2="546" y2="475" stroke="#4a5568" stroke-width="2"/><line x1="564" y1="345" x2="564" y2="475" stroke="#4a5568" stroke-width="2"/><line x1="582" y1="345" x2="582" y2="475" stroke="#4a5568" stroke-width="2"/><line x1="600" y1="345" x2="600" y2="475" stroke="#4a5568" stroke-width="2"/><line x1="618" y1="345" x2="618" y2="475" stroke="#4a5568" stroke-width="2"/><line x1="636" y1="345" x2="636" y2="475" stroke="#4a5568" stroke-width="2"/><circle cx="570" cy="440" r="13" fill="#8a6d0d" stroke="#1e2a44" stroke-width="2.5"/><text x="570" y="498" font-size="15.5" font-weight="600" fill="#1e2a44" text-anchor="middle">zoo</text><rect x="700" y="360" width="120" height="115" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><rect x="712" y="345" width="96" height="18" rx="4" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><ellipse cx="720" cy="395" rx="8" ry="5" fill="#8a6d0d"/><ellipse cx="746" cy="395" rx="8" ry="5" fill="#8a6d0d"/><ellipse cx="772" cy="395" rx="8" ry="5" fill="#8a6d0d"/><ellipse cx="798" cy="395" rx="8" ry="5" fill="#8a6d0d"/><ellipse cx="720" cy="421" rx="8" ry="5" fill="#8a6d0d"/><ellipse cx="746" cy="421" rx="8" ry="5" fill="#8a6d0d"/><ellipse cx="772" cy="421" rx="8" ry="5" fill="#8a6d0d"/><ellipse cx="798" cy="421" rx="8" ry="5" fill="#8a6d0d"/><ellipse cx="720" cy="447" rx="8" ry="5" fill="#8a6d0d"/><ellipse cx="746" cy="447" rx="8" ry="5" fill="#8a6d0d"/><ellipse cx="772" cy="447" rx="8" ry="5" fill="#8a6d0d"/><ellipse cx="798" cy="447" rx="8" ry="5" fill="#8a6d0d"/><text x="760" y="498" font-size="15.5" font-weight="600" fill="#1e2a44" text-anchor="middle">seed bank</text><text x="486" y="530" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">− main limitation: does not save</text><text x="486" y="552" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">the habitat</text><text x="486" y="580" font-size="16.5" font-weight="600" fill="#8a6d0d" text-anchor="start">e.g. zoos and seed banks</text>
</svg>