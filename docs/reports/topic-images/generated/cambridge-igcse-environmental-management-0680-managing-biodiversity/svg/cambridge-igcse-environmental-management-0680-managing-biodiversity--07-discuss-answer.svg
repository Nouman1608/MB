<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 695" width="900" height="695" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="695" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How to build a "discuss" answer</text>

<rect x="30" y="112" width="192" height="46" rx="23" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="126" y="140.94" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">what it does</text><line x1="224" y1="135" x2="243" y2="135" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="246" y="112" width="192" height="46" rx="23" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="342" y="140.94" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">benefit + reason</text><line x1="440" y1="135" x2="459" y2="135" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="462" y="112" width="192" height="46" rx="23" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="558" y="140.94" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">limitation + reason</text><line x1="656" y1="135" x2="675" y2="135" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="678" y="112" width="192" height="46" rx="23" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="774" y="140.94" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">judgement</text><text x="450" y="194" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Ecotourism, 4 marks: how the model answer scores</text><rect x="30" y="214" width="150" height="72" rx="12" fill="#2e6b62"/><text x="105" y="257" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Benefit</text><rect x="190" y="214" width="600" height="72" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="210" y="244" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Visitors bring money, which can pay for rangers and habitat</text><text x="210" y="266" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">protection.</text><circle cx="830" cy="250" r="26" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="830" y="257" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">[1]</text><rect x="30" y="300" width="150" height="72" rx="12" fill="#2e6b62"/><text x="105" y="343" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Benefit</text><rect x="190" y="300" width="600" height="72" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="210" y="330" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Local jobs give communities a reason to protect wildlife instead</text><text x="210" y="352" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">of hunting it or clearing forest.</text><circle cx="830" cy="336" r="26" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="830" y="343" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">[1]</text><rect x="30" y="386" width="150" height="72" rx="12" fill="#b5602e"/><text x="105" y="429" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Limitation</text><rect x="190" y="386" width="600" height="72" rx="12" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="210" y="416" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Large numbers of visitors can disturb breeding animals and erode</text><text x="210" y="438" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">paths.</text><circle cx="830" cy="422" r="26" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="830" y="429" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">[1]</text><rect x="30" y="472" width="150" height="72" rx="12" fill="#b5602e"/><text x="105" y="515" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Limitation</text><rect x="190" y="472" width="600" height="72" rx="12" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="210" y="502" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Income depends on tourism, so a fall in visitors can leave</text><text x="210" y="524" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">conservation without funding.</text><circle cx="830" cy="508" r="26" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="830" y="515" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">[1]</text><rect x="30" y="558" width="150" height="72" rx="12" fill="#8a6d0d"/><text x="105" y="601" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Judgement</text><rect x="190" y="558" width="680" height="72" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="210" y="588" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">Works best when visitor numbers are limited and income goes to</text><text x="210" y="610" font-size="16.5" font-weight="400" fill="#1e2a44" text-anchor="start">local people.</text><text x="450" y="668" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Two benefits and two limitations, each with a reason, then a short judgement.</text>
</svg>