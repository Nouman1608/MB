<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 674" width="900" height="674" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="674" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Analysing a short extract</text>

<rect x="30" y="100" width="478" height="404" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="144" font-size="17" fill="#1e2a44" xml:space="preserve"><tspan>The house </tspan><tspan fill="#b5602e" font-weight="700">had been sold</tspan><tspan> before Lena was told.</tspan></text><text x="52" y="180" font-size="17" fill="#1e2a44" xml:space="preserve"><tspan>She learned it from the sign at the gate,</tspan></text><text x="52" y="216" font-size="17" fill="#1e2a44" xml:space="preserve"><tspan>tilted slightly, as though it too were </tspan><tspan fill="#b5602e" font-weight="700">embarrassed</tspan><tspan>.</tspan></text><text x="52" y="252" font-size="17" fill="#1e2a44" xml:space="preserve"><tspan>Inside, her father was wrapping cups in</tspan></text><text x="52" y="288" font-size="17" fill="#1e2a44" xml:space="preserve"><tspan>newspaper with great care, </tspan><tspan fill="#b5602e" font-weight="700">each one turned</tspan></text><text x="52" y="324" font-size="17" fill="#1e2a44" xml:space="preserve"><tspan fill="#b5602e" font-weight="700">three times</tspan><tspan> before it went into the box.</tspan></text><text x="52" y="360" font-size="17" fill="#1e2a44" xml:space="preserve"><tspan>“We’ll talk later,” he said, not looking up.</tspan></text><text x="52" y="396" font-size="17" fill="#1e2a44" xml:space="preserve"><tspan>Later, she understood, was </tspan><tspan fill="#b5602e" font-weight="700">a place</tspan><tspan> he had</tspan></text><text x="52" y="432" font-size="17" fill="#1e2a44" xml:space="preserve"><tspan>been keeping for years.</tspan></text><circle cx="490" cy="138" r="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="490" y="143" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><circle cx="490" cy="210" r="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="490" y="215" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><circle cx="490" cy="282" r="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="490" y="287" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><circle cx="490" cy="390" r="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="490" y="395" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="530" y="100" width="340" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="542" y="125" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">1 · SHORT SENTENCE, PASSIVE VOICE</text><text x="542" y="154" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">The sale is stated bluntly; “had been</text><text x="542" y="174" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">sold” hides who decided, mirroring how</text><text x="542" y="194" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">power is kept from her.</text><rect x="530" y="218" width="340" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="542" y="243" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">2 · PERSONIFICATION</text><text x="542" y="272" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">The “embarrassed” sign shows the shame</text><text x="542" y="292" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">the father will not show.</text><rect x="530" y="316" width="340" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="542" y="341" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">3 · REPEATED ACTION</text><text x="542" y="370" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Careful wrapping: he gives attention to</text><text x="542" y="390" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">things more easily than to his daughter.</text><rect x="530" y="414" width="340" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="542" y="439" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">4 · METAPHOR</text><text x="542" y="468" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">“Later” becomes “a place”: delay sounds</text><text x="542" y="488" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">permanent, a habit, not a single moment.</text><rect x="30" y="520" width="840" height="108" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="553" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">THE CLAIM IT SUPPORTS</text><text x="50" y="578.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The writer presents Lena’s exclusion from her family’s decisions through what</text><text x="50" y="602.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">she is not told.</text><text x="30" y="654" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Invented practice passage, not from any set text.</text>
</svg>