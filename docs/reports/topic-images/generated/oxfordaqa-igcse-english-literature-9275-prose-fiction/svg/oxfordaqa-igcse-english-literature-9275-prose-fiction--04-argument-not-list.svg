<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 643" width="900" height="643" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="643" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Planning an essay question</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">How does the writer present ambition in your novel?</text>
<rect x="30" y="120" width="840" height="85" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="153" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">LINE OF ARGUMENT</text><text x="50" y="179.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Ambition promises freedom but costs a character their relationships.</text><rect x="30" y="235" width="249.33333333333334" height="154" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="268" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EARLY</text><text x="50" y="293.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">How ambition is</text><text x="50" y="317.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">introduced</text><text x="50" y="345" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">one short quotation and its</text><text x="50" y="365" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">method</text><line x1="285.33333333333337" y1="312" x2="319.33333333333337" y2="312" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="235" width="249.33333333333334" height="154" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="345.33333333333337" y="290" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MIDDLE</text><text x="345.33333333333337" y="315.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A turning point</text><text x="345.33333333333337" y="343" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">ambition tested or rewarded</text><line x1="580.6666666666667" y1="312" x2="614.6666666666667" y2="312" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="235" width="249.33333333333334" height="154" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="640.6666666666667" y="268" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LATE</text><text x="640.6666666666667" y="293.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">How the ending</text><text x="640.6666666666667" y="317.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">judges it</text><text x="640.6666666666667" y="345" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">and how the structure</text><text x="640.6666666666667" y="365" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">supports that</text><rect x="178" y="407" width="544" height="31" rx="15.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="427.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Context: one precise link, placed where it explains a choice</text><rect x="30" y="469" width="840" height="150" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="54" y="505" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">The swap test</text><rect x="60" y="539" width="90" height="46" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="105" y="568" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">P2</text><rect x="170" y="539" width="90" height="46" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="215" y="568" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">P1</text><path d="M105,533 C120,513 200,513 215,533" fill="none" stroke="#b5602e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-start="url(#ahR)" marker-end="url(#ahR)"/><text x="300" y="551" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">If you can swap two paragraphs without anyone noticing, the</text><text x="300" y="573" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">essay is a list rather than an argument. Each paragraph</text><text x="300" y="595" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">should move the argument forward.</text>
</svg>