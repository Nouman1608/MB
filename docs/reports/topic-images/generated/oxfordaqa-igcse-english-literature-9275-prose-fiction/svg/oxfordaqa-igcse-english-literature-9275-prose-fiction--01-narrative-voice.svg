<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 692" width="900" height="692" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="692" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Narrative voice and viewpoint</text>

<rect x="30" y="112" width="410" height="270" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">First person</text><path d="M218,272 L223,220 Q235,210 247,220 L252,272 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="235" cy="200" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><ellipse cx="320" cy="182" rx="58" ry="24" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="320" y="188" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">“I…”</text><circle cx="270" cy="210" r="5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="52" y="308" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Inside one character’s mind. How much does</text><text x="52" y="329" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">this narrator understand? Is an older self</text><text x="52" y="350" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">looking back?</text><rect x="460" y="112" width="410" height="270" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="482" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Third person, limited</text><ellipse cx="665" cy="178" rx="22" ry="13" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="665" cy="178" r="6" fill="#1e2a44"/><line x1="665" y1="194" x2="610" y2="224" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><path d="M586.4,288 L590.4,246.4 Q600,238.4 609.6,246.4 L613.6,288 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="600" cy="230.4" r="10.4" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><path d="M676.4,288 L680.4,246.4 Q690,238.4 699.6,246.4 L703.6,288 Z" fill="#c9d6d4" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="690" cy="230.4" r="10.4" fill="#c9d6d4" stroke="#1e2a44" stroke-width="2.5"/><path d="M746.4,288 L750.4,246.4 Q760,238.4 769.6,246.4 L773.6,288 Z" fill="#c9d6d4" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="760" cy="230.4" r="10.4" fill="#c9d6d4" stroke="#1e2a44" stroke-width="2.5"/><text x="482" y="308" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Close to one character. Notice when the</text><text x="482" y="329" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">narrator comments, judges or withholds.</text><rect x="30" y="398" width="410" height="270" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="434" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Third person, omniscient</text><ellipse cx="235" cy="464" rx="22" ry="13" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="235" cy="464" r="6" fill="#1e2a44"/><line x1="235" y1="480" x2="160" y2="506" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><line x1="235" y1="480" x2="235" y2="506" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><line x1="235" y1="480" x2="310" y2="506" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><path d="M146.4,574 L150.4,532.4 Q160,524.4 169.6,532.4 L173.6,574 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="160" cy="516.4" r="10.4" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><path d="M221.4,574 L225.4,532.4 Q235,524.4 244.6,532.4 L248.6,574 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="235" cy="516.4" r="10.4" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><path d="M296.4,574 L300.4,532.4 Q310,524.4 319.6,532.4 L323.6,574 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="310" cy="516.4" r="10.4" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="52" y="594" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Moves freely between many characters’ minds.</text><rect x="460" y="398" width="410" height="270" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="482" y="434" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Unreliable narrator</text><path d="M554.7,568 L559.2,521.2 Q570,512.2 580.8,521.2 L585.3,568 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="570" cy="503.2" r="11.700000000000001" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><rect x="600" y="450" width="110" height="40" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="655" y="476" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">says…</text><ellipse cx="790" cy="518" rx="22" ry="13" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="790" cy="518" r="6" fill="#1e2a44"/><text x="790" y="552" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">reader sees…</text><line x1="715" y1="474" x2="766" y2="508" stroke="#b5602e" stroke-width="3" stroke-dasharray="5 5"/><text x="760" y="474" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">gap</text><text x="482" y="594" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The gap between what the narrator says and</text><text x="482" y="615" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">what the reader sees is itself a method.</text>
</svg>