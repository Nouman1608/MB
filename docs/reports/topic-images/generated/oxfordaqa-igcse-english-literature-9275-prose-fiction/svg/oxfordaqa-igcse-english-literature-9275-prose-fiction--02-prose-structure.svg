<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Structure: the order and shape of the story</text>

<rect x="30" y="120" width="840" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="154" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Chronological</text><line x1="280" y1="190" x2="840" y2="190" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><circle cx="330" cy="190" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="190" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="570" cy="190" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="690" cy="190" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="790" cy="190" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="54" y="180" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">time moves forward</text><rect x="30" y="254" width="840" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="288" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Flashback</text><line x1="280" y1="324" x2="840" y2="324" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><circle cx="330" cy="324" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="324" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="690" cy="324" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="790" cy="324" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="560" cy="324" r="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><path d="M450,312 C470,272 360,272 380,310" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahR)"/><text x="54" y="314" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">the story jumps back</text><rect x="30" y="388" width="840" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="422" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Frame narrative</text><rect x="290" y="432" width="540" height="54" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><rect x="360" y="444" width="400" height="30" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="560" y="465" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">the main story</text><text x="54" y="448" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">a story within a story</text><rect x="30" y="522" width="840" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="556" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Links across the text</text><text x="54" y="580" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">connect two points in one paragraph</text><line x1="280" y1="652" x2="840" y2="652" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><circle cx="330" cy="652" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="520" cy="652" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="610" cy="652" r="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="790" cy="652" r="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><path d="M330,640 C380,592 470,592 520,640" fill="none" stroke="#8a6d0d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5" marker-end="url(#ahO)"/><text x="425" y="594" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">foreshadowing</text><path d="M610,640 C650,592 750,592 790,640" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-start="url(#ahT)" marker-end="url(#ahT)"/><text x="700" y="594" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">parallel scenes</text><rect x="30" y="708" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="741.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Also watch where turning points sit, how chapters open and close, and whether the ending</text><text x="50" y="763.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">answers or refuses to answer the opening.</text>
