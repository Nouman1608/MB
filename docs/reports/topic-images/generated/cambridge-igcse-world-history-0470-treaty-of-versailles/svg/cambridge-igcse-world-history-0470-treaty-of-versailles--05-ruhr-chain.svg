<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 593" width="900" height="593" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="593" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From reparations to hyperinflation</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The chain of events, 1922-23</text>
<line x1="60" y1="144" x2="60" y2="541" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LATE 1922</text><text x="122" y="180.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Germany falls behind with deliveries</text><circle cx="60" cy="164" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="172.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="216" width="766" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="246" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">JANUARY 1923</text><text x="122" y="272.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">French and Belgian troops occupy the Ruhr</text><text x="122" y="301.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">To take goods directly</text><circle cx="60" cy="270" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="278.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="336" width="766" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="368.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Passive resistance</text><text x="122" y="397.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The government prints money to pay striking workers</text><circle cx="60" cy="378" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="386.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="432" width="766" height="129" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122" y="462" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LATE 1923</text><text x="122" y="488.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Hyperinflation destroys the mark</text><text x="122" y="517.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Savings and pensions worthless; middle classes hit hardest; some debtors and speculators</text><text x="122" y="538.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">gained</text><circle cx="60" cy="496.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="505.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text>
</svg>