<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 529" width="900" height="529" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="529" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Big Three: how harsh a peace?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Lloyd George was caught between Clemenceau and Wilson</text>
<text x="40" y="140" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">WEAKEN GERMANY PERMANENTLY</text><text x="860" y="140" font-size="17" font-weight="700" fill="#b5602e" text-anchor="end">AVOID NEW GRIEVANCES</text><defs><linearGradient id="sg124" x1="0" x2="1"><stop offset="0" stop-color="#b5d3cf"/><stop offset="1" stop-color="#f2e7b8"/></linearGradient></defs><rect x="60" y="169" width="780" height="26" rx="13" fill="url(#sg124)" stroke="#1e2a44" stroke-width="2.5"/><path d="M122.4,195 L122.4,218 L165.33333333333334,232 L165.33333333333334,252" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="122.4" cy="182" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><path d="M450,195 L450,218 L450,232 L450,252" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="450" cy="182" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><path d="M777.6,195 L777.6,218 L734.6666666666667,232 L734.6666666666667,252" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="777.6" cy="182" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="252" width="270.6666666666667" height="112" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="165.33333333333334" y="279.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Clemenceau (France)</text><text x="165.33333333333334" y="306" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Security: small army, Rhineland</text><text x="165.33333333333334" y="326" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">separated or demilitarised, heavy</text><text x="165.33333333333334" y="346" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">reparations, Alsace-Lorraine</text><rect x="314.6666666666667" y="252" width="270.6666666666667" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="279.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Lloyd George (Britain)</text><text x="450" y="306" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Voters wanted Germany to pay;</text><text x="450" y="326" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">but a trading partner, and no turn</text><text x="450" y="346" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">to communism</text><rect x="599.3333333333334" y="252" width="270.6666666666667" height="112" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="734.6666666666667" y="279.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Wilson (USA)</text><text x="734.6666666666667" y="306" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Fourteen Points:</text><text x="734.6666666666667" y="326" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">self-determination, disarmament,</text><text x="734.6666666666667" y="346" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">a League of Nations</text><rect x="30" y="386" width="411" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="418" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WHY SO HARSH</text><text x="50" y="444.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">France invaded in 1870 and 1914</text><text x="50" y="472.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">North-east devastated; enormous losses</text><rect x="459" y="386" width="411" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="418" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WHY SO MILD</text><text x="479" y="444.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">USA entered late (1917)</text><text x="479" y="472.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Suffered far less; feared a vengeful peace</text>
</svg>