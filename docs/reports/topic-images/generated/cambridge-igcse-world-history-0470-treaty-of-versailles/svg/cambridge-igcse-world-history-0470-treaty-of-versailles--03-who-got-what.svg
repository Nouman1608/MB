<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why no one got everything they wanted</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Each leader's gains and losses</text>
<clipPath id="tc124"><rect x="30" y="124" width="840" height="294" rx="14"/></clipPath><g clip-path="url(#tc124)"><rect x="30" y="124" width="197.6470588235294" height="48" fill="#b5d3cf"/><text x="44" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Leader</text><rect x="227.6470588235294" y="124" width="321.17647058823525" height="48" fill="#dce9e7"/><text x="241.6470588235294" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Got</text><rect x="548.8235294117646" y="124" width="321.17647058823525" height="48" fill="#f3dccd"/><text x="562.8235294117646" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Did not get</text><rect x="30" y="172" width="197.6470588235294" height="89" fill="#dce9e7"/><text x="44" y="198.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Clemenceau</text><rect x="227.6470588235294" y="172" width="321.17647058823525" height="89" fill="#ffffff"/><text x="241.6470588235294" y="198.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Demilitarised, occupied Rhineland;</text><text x="241.6470588235294" y="219.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">promised guarantees</text><rect x="548.8235294117646" y="172" width="321.17647058823525" height="89" fill="#ffffff"/><text x="562.8235294117646" y="198.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Independent Rhineland; guarantees</text><text x="562.8235294117646" y="219.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fell when the US Senate refused to</text><text x="562.8235294117646" y="240.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ratify</text><line x1="30" y1="261" x2="870" y2="261" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="261" width="197.6470588235294" height="68" fill="#dce9e7"/><text x="44" y="287.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Wilson</text><rect x="227.6470588235294" y="261" width="321.17647058823525" height="68" fill="#f8faf9"/><text x="241.6470588235294" y="287.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The League created</text><rect x="548.8235294117646" y="261" width="321.17647058823525" height="68" fill="#f8faf9"/><text x="562.8235294117646" y="287.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Self-determination for Germans; USA</text><text x="562.8235294117646" y="308.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">never joined the League</text><line x1="30" y1="329" x2="870" y2="329" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="329" width="197.6470588235294" height="89" fill="#dce9e7"/><text x="44" y="355.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Lloyd George</text><rect x="227.6470588235294" y="329" width="321.17647058823525" height="89" fill="#ffffff"/><text x="241.6470588235294" y="355.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Colonies and naval limits</text><rect x="548.8235294117646" y="329" width="321.17647058823525" height="89" fill="#ffffff"/><text x="562.8235294117646" y="355.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lower reparations: they were higher</text><text x="562.8235294117646" y="376.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">than he thought wise; Germany left</text><text x="562.8235294117646" y="397.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">resentful</text></g><line x1="227.6470588235294" y1="124" x2="227.6470588235294" y2="418" stroke="#c9d6d4" stroke-width="1.5"/><line x1="548.8235294117646" y1="124" x2="548.8235294117646" y2="418" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="124" width="840" height="294" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="456" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">The deeper reasons</text><rect x="126.40700000000004" y="480" width="159.286" height="31" rx="15.5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="206.05000000000004" y="501.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Conflicting aims</text><rect x="295.69300000000004" y="480" width="212.326" height="31" rx="15.5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="401.85600000000005" y="501.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Public opinion at home</text><rect x="518.019" y="480" width="255.574" height="31" rx="15.5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="645.806" y="501.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Quick decisions amid chaos</text>
