<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 621" width="900" height="621" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="621" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Could the Treaty be justified?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Arguments at the time, and a criterion to judge by</text>
<polygon points="450,164 416,234 484,234" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><line x1="210" y1="198" x2="690" y2="130" stroke="#1e2a44" stroke-width="7" stroke-linecap="round"/><circle cx="450" cy="164" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="210" y1="198" x2="210" y2="238" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="238" width="360" height="218" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="268.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Justified</text><text x="46" y="297.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="297.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Brest-Litovsk (March 1918): huge</text><text x="61.2" y="318.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">territories taken from Russia</text><text x="46" y="343.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="343.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">France devastated, needing security and</text><text x="61.2" y="364.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">money</text><text x="46" y="389.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="389.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Germany took Alsace-Lorraine and an</text><text x="61.2" y="410.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">indemnity in 1871</text><text x="46" y="435.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="435.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Germany kept its industrial heartland</text><line x1="690" y1="130" x2="690" y2="170" stroke="#1e2a44" stroke-width="3"/><rect x="510" y="170" width="360" height="197" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="526" y="200.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Not justified</text><text x="526" y="229.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="541.2" y="229.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">No chance to negotiate</text><text x="526" y="254.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="541.2" y="254.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Article 231 blamed Germany alone</text><text x="526" y="279.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="541.2" y="279.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Self-determination denied to German</text><text x="541.2" y="300.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">speakers</text><text x="526" y="325.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="541.2" y="325.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Reparations, critics said, unpayable</text><text x="541.2" y="346.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(Keynes, 1919)</text><rect x="30" y="478" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="512.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Say whose standard</text><text x="50" y="542.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Fair by the <tspan font-weight="700" fill="#1e2a44">victors'</tspan> standards of 1919, unfair by <tspan font-weight="700" fill="#1e2a44">Wilson's</tspan> own: that gap explains German</text><text x="50" y="564.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">bitterness.</text>
</svg>