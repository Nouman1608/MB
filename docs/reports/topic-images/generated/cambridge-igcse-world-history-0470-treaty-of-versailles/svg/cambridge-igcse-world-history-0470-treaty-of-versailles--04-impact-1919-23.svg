<rect width="900" height="618" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The impact on Germany, 1919-23</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Drawn to scale: political crises and the economic collapse</text>
<line x1="180.83333333334159" y1="148" x2="180.83333333334159" y2="430" stroke="#c9d6d4" stroke-width="1.5"/><text x="180.83333333334159" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">1920</text><line x1="339.1666666666764" y1="148" x2="339.1666666666764" y2="430" stroke="#c9d6d4" stroke-width="1.5"/><text x="339.1666666666764" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">1921</text><line x1="497.50000000001125" y1="148" x2="497.50000000001125" y2="430" stroke="#c9d6d4" stroke-width="1.5"/><text x="497.50000000001125" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">1922</text><line x1="655.8333333333461" y1="148" x2="655.8333333333461" y2="430" stroke="#c9d6d4" stroke-width="1.5"/><text x="655.8333333333461" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">1923</text><line x1="814.166666666681" y1="148" x2="814.166666666681" y2="430" stroke="#c9d6d4" stroke-width="1.5"/><text x="814.166666666681" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">1924</text><rect x="655.8333333333461" y="396" width="145.13888888890222" height="34" rx="8" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="647.8333333333461" y="418.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">Ruhr occupied; hyperinflation</text><line x1="50" y1="264" x2="850" y2="264" stroke="#1e2a44" stroke-width="4" stroke-linecap="round"/><path d="M100.15255009110007,264 L100.15255009110007,248 L100.15255009110007,216" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="55.568550091100064" y="150" width="89.168" height="64" fill="#f4f6f6"/><text x="100.15255009110007" y="165" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">June 1919</text><text x="100.15255009110007" y="185" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Treaty: a</text><text x="100.15255009110007" y="205" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">"Diktat"</text><path d="M402.5000000000247,264 L402.5000000000247,248 L402.5000000000247,216" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="327.9960000000247" y="150" width="149.008" height="64" fill="#f4f6f6"/><text x="402.5000000000247" y="165" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1921</text><text x="402.5000000000247" y="185" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Reparations fixed;</text><text x="402.5000000000247" y="205" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Erzberger killed</text><path d="M655.8333333333461,264 L655.8333333333461,248 L655.8333333333461,216" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="576.9053333333461" y="150" width="157.856" height="64" fill="#f4f6f6"/><text x="655.8333333333461" y="165" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">Jan 1923</text><text x="655.8333333333461" y="185" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">French and Belgian</text><text x="655.8333333333461" y="205" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">troops in the Ruhr</text><path d="M207.22222222224272,264 L207.22222222224272,280 L207.22222222224272,312" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="164.89422222224272" y="314" width="84.656" height="64" fill="#f4f6f6"/><text x="207.22222222224272" y="329" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Mar 1920</text><text x="207.22222222224272" y="349" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Kapp</text><text x="207.22222222224272" y="369" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Putsch</text><path d="M576.6666666666787,264 L576.6666666666787,280 L576.6666666666787,312" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="535.0586666666787" y="314" width="83.216" height="64" fill="#f4f6f6"/><text x="576.6666666666787" y="329" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1922</text><text x="576.6666666666787" y="349" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Rathenau</text><text x="576.6666666666787" y="369" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">killed</text><path d="M787.7777777777798,264 L787.7777777777798,280 L787.7777777777798,312" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="745.2337777777798" y="314" width="85.088" height="64" fill="#f4f6f6"/><text x="787.7777777777798" y="329" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Nov 1923</text><text x="787.7777777777798" y="349" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Munich</text><text x="787.7777777777798" y="369" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Putsch</text><circle cx="100.15255009110007" cy="264" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="207.22222222224272" cy="264" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><circle cx="402.5000000000247" cy="264" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><circle cx="576.6666666666787" cy="264" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><circle cx="655.8333333333461" cy="264" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="787.7777777777798" cy="264" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="456" width="840" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="490.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Balance</text><text x="50" y="519.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Not all from the Treaty: heavy borrowing to fight the war, and the government's own choice to print</text><text x="50" y="540.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">money, caused hyperinflation. By the end of 1923 Stresemann had ended passive resistance and a new</text><text x="50" y="561.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">currency came in.</text>
</svg>