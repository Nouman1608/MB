<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 839" width="900" height="839" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="839" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The terms for Germany, 28 June 1919</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Labelled schematic, not to scale and not a map</text>
<rect x="30" y="124" width="840" height="430" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="320" y="244" width="260" height="180" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="272" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">GERMANY</text><text x="450" y="304" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Army 100,000; no tanks, aircraft</text><text x="450" y="323" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">or submarines; six battleships</text><rect x="50" y="154" width="230" height="92" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165" y="182" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">France</text><text x="165" y="204" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Alsace-Lorraine; Saar coal</text><text x="165" y="222" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">(League 15 years)</text><rect x="50" y="264" width="230" height="72" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165" y="292" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Belgium</text><text x="165" y="314" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Eupen and Malmédy</text><rect x="50" y="354" width="230" height="92" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="165" y="382" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Rhineland</text><text x="165" y="404" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Demilitarised; west bank</text><text x="165" y="422" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">occupied 15 years</text><rect x="335" y="144" width="230" height="72" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="172" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Denmark</text><text x="450" y="194" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">North Schleswig (plebiscite)</text><rect x="620" y="154" width="230" height="92" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="735" y="182" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Poland</text><text x="735" y="204" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">West Prussia and Posen: the</text><text x="735" y="222" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Corridor</text><rect x="620" y="264" width="230" height="72" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="735" y="292" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Danzig</text><text x="735" y="314" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Free City under the League</text><rect x="620" y="354" width="230" height="92" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="735" y="382" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Also</text><text x="735" y="404" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Memel taken; Upper Silesia</text><text x="735" y="422" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">plebiscite</text><rect x="320" y="444" width="260" height="72" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="472" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Austria</text><text x="450" y="494" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Anschluss forbidden</text><line x1="320" y1="284" x2="286" y2="200" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><line x1="320" y1="324" x2="286" y2="300" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><line x1="450" y1="244" x2="444" y2="216" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><line x1="580" y1="284" x2="614" y2="200" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><line x1="580" y1="324" x2="614" y2="300" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><line x1="580" y1="384" x2="614" y2="400" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><line x1="320" y1="394" x2="280" y2="400" stroke="#2e6b62" stroke-width="3" stroke-dasharray="7 5"/><line x1="450" y1="424" x2="450" y2="444" stroke="#b5602e" stroke-width="3" stroke-dasharray="7 5"/><text x="860" y="536" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">arrows: land lost, run by others or put to a vote; dashed: restrictions</text><rect x="30" y="576" width="270.6666666666667" height="120" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="45" y="603" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GUILT</text><text x="45" y="629.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Article 231</text><text x="45" y="657" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Responsibility for loss and</text><text x="45" y="677" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">damage</text><rect x="314.6666666666667" y="576" width="270.6666666666667" height="120" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="329.6666666666667" y="613" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">REPARATIONS</text><text x="329.6666666666667" y="639.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">£6,600 million</text><text x="329.6666666666667" y="667" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Fixed in 1921</text><rect x="599.3333333333334" y="576" width="270.6666666666667" height="120" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="614.3333333333334" y="603" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COLONIES</text><text x="614.3333333333334" y="629.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">All lost</text><text x="614.3333333333334" y="657" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">League mandates; Germany</text><text x="614.3333333333334" y="677" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">excluded from the League</text><rect x="30" y="718" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="752.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">In total</text><text x="450" y="782.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">About <tspan font-weight="700" fill="#1e2a44">13</tspan> <tspan font-weight="700" fill="#1e2a44">per</tspan> <tspan font-weight="700" fill="#1e2a44">cent</tspan> of Germany's European territory and <tspan font-weight="700" fill="#1e2a44">all</tspan> its colonies.</text>
</svg>