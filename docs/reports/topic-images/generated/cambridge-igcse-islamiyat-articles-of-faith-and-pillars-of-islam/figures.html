<!-- place after: ## What does jihad mean? -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/cambridge-igcse-islamiyat-articles-of-faith-and-pillars-of-islam--05-meanings-of-jihad.webp" width="900" height="682" alt="Jihad, meaning striving in the way of Allah, branches into three forms: the spiritual and mental struggle against wrong desires (the greater jihad); striving through speech, knowledge and wealth; and physical defence of the community, allowed only for a just cause, under proper authority and without harming non-combatants, women, children, the elderly, crops or places of worship." loading="lazy">
  <figcaption>Jihad covers inner, intellectual and physical striving; physical defence has strict limits.</figcaption>
