<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="719.58" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Angels and their duties</text>

<rect x="30" y="110" width="840" height="60" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="3"/><text x="450" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Created from light  ·  no free will  ·  always obey Allah</text><rect x="30" y="190" width="414" height="114" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="222.4" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Jibril</text><text x="46" y="251.94" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Brought revelation to the prophets,</text><text x="46" y="274.38" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">including the Qur'an to the Prophet</text><text x="46" y="296.82" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Muhammad (pbuh)</text><rect x="456" y="190" width="414" height="114" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="472" y="222.4" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Mika'il</text><text x="472" y="251.94" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Associated with providing sustenance and</text><text x="472" y="274.38" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">rain</text><rect x="30" y="318" width="414" height="114" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="350.4" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Israfil</text><text x="46" y="379.94" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Will blow the trumpet to begin the Day of</text><text x="46" y="402.38" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Judgement</text><rect x="456" y="318" width="414" height="114" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="472" y="350.4" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The Angel of Death</text><text x="472" y="379.94" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Takes souls at death</text><rect x="30" y="446" width="414" height="114" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="46" y="478.4" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Kiraman Katibin</text><text x="46" y="507.94" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The noble scribes: record each person's</text><text x="46" y="530.38" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">good and bad deeds</text><rect x="456" y="446" width="414" height="114" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="472" y="478.4" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Munkar and Nakir</text><text x="472" y="507.94" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Question the dead in the grave</text><rect x="30" y="584" width="840" height="111.58000000000001" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="50" y="619.58" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Why it matters</text><text x="50" y="648.6400000000001" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Belief that the Kiraman Katibin record every deed reminds Muslims they are never</text><text x="50" y="671.0800000000002" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">unobserved, which encourages good behaviour.</text>
</svg>