<rect width="900" height="754.02" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The main observances of hajj</text>

<rect x="30" y="112" width="250" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="62" cy="146" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="153.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="94" y="153" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MIQAT</text><text x="50" y="194" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Enter ihram</text><rect x="325" y="112" width="250" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="357" cy="146" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="357" y="153.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="389" y="153" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">KA'BA</text><text x="345" y="194" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Tawaf around the</text><text x="345" y="217" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Ka'ba</text><rect x="620" y="112" width="250" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="652" cy="146" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="652" y="153.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="684" y="153" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SAFA AND MARWA</text><text x="640" y="194" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Sa'y between the two</text><text x="640" y="217" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">hills</text><rect x="620" y="282" width="250" height="120" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="3.5"/><circle cx="652" cy="316" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="652" y="323.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="684" y="323" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ARAFAT</text><text x="640" y="364" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Standing at Arafat</text><text x="640" y="387" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">on the 9th</text><rect x="325" y="282" width="250" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="357" cy="316" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="357" y="323.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="389" y="323" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MUZDALIFA</text><text x="345" y="364" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Spend the night</text><rect x="30" y="282" width="250" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="62" cy="316" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="323.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="94" y="323" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MINA</text><text x="50" y="364" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Stone the pillars</text><rect x="30" y="452" width="250" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="62" cy="486" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="493.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">7</text><text x="50" y="534" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Animal sacrifice</text><rect x="325" y="452" width="250" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="357" cy="486" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="357" y="493.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">8</text><text x="345" y="534" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Shave or cut hair</text><rect x="620" y="452" width="250" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="652" cy="486" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="652" y="493.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">9</text><text x="684" y="493" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">KA'BA</text><text x="640" y="534" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Further tawaf</text><line x1="284" y1="172" x2="319" y2="172" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="579" y1="172" x2="614" y2="172" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="745" y1="236" x2="745" y2="276" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="616" y1="342" x2="581" y2="342" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="321" y1="342" x2="286" y2="342" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="155" y1="406" x2="155" y2="446" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="284" y1="512" x2="319" y2="512" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="579" y1="512" x2="614" y2="512" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="596" width="840" height="134.02" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="50" y="631.58" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">"Hajj is Arafat"</text><text x="50" y="660.6400000000001" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Standing in prayer at Arafat on the 9th of Dhu al-Hijja is essential for a valid hajj.</text><text x="50" y="683.0800000000002" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The whole journey stresses equality and unity, remembrance of Ibrahim, Hajar and</text><text x="50" y="705.5200000000001" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Isma'il, forgiveness of sins and the Day of Judgement.</text>
