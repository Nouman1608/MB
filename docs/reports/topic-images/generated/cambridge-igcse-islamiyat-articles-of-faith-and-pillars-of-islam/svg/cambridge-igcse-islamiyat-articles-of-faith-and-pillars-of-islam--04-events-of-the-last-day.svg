<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 808" width="900" height="808" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="807.14" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Events of the Last Day</text>

<line x1="130" y1="132" x2="130" y2="492" stroke="#1e2a44" stroke-width="4"/><circle cx="130" cy="134" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="130" y="141.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="170" y="108" width="620" height="54" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="192" y="142" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Israfil blows the trumpet</text><text x="768" y="142" font-size="17" font-weight="400" fill="#4a5568" text-anchor="end">at an appointed time</text><circle cx="130" cy="206" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="130" y="213.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="170" y="180" width="620" height="54" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="192" y="214" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The world ends</text><circle cx="130" cy="278" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="130" y="285.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="170" y="252" width="620" height="54" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="192" y="286" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">All people are resurrected</text><circle cx="130" cy="350" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="130" y="357.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="170" y="324" width="620" height="54" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="192" y="358" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Each person is judged by Allah</text><text x="768" y="358" font-size="17" font-weight="400" fill="#4a5568" text-anchor="end">the record of deeds is given</text><circle cx="130" cy="422" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="130" y="429.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="170" y="396" width="620" height="54" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="192" y="430" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Deeds are weighed</text><circle cx="130" cy="494" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="130" y="501.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><rect x="170" y="468" width="620" height="54" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="192" y="502" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">People cross the bridge (sirat)</text><path d="M480,522 L480,540 L240,540 L240,574" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#ahT)"/><path d="M480,540 L660,540 L660,574" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#ahR)"/><rect x="60" y="582" width="360" height="88" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="240" y="620" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">The righteous</text><text x="240" y="650" font-size="18" font-weight="600" fill="#2e6b62" text-anchor="middle">enter paradise (janna)</text><rect x="480" y="582" width="360" height="88" rx="14" fill="#f3dccd" stroke="#b5602e" stroke-width="3"/><text x="660" y="620" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">The wicked</text><text x="660" y="650" font-size="18" font-weight="600" fill="#b5602e" text-anchor="middle">enter hell (jahannam)</text><rect x="30" y="694" width="840" height="89.14" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="50" y="729.58" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Significance</text><text x="50" y="758.6400000000001" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Belief in accountability motivates Muslims to do good and avoid wrong (Sura 99).</text>
</svg>