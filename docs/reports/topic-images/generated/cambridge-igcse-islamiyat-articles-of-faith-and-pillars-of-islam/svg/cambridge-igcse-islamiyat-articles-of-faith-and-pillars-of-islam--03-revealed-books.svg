<rect width="900" height="516" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The revealed books</text>

<rect x="30" y="120" width="160" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="110" y="168" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">Suhuf</text><text x="110" y="194" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">(scrolls)</text><text x="110" y="228" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">given to</text><rect x="40" y="262" width="140" height="50" rx="25" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="110" y="293.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Ibrahim</text><rect x="200" y="120" width="160" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="280" y="168" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">Tawrat</text><text x="280" y="228" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">given to</text><rect x="210" y="262" width="140" height="50" rx="25" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="280" y="293.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Musa</text><rect x="370" y="120" width="160" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="168" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">Zabur</text><text x="450" y="228" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">given to</text><rect x="380" y="262" width="140" height="50" rx="25" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="293.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Dawud</text><rect x="540" y="120" width="160" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="620" y="168" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">Injil</text><text x="620" y="228" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">given to</text><rect x="550" y="262" width="140" height="50" rx="25" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="620" y="293.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Isa</text><rect x="710" y="120" width="160" height="130" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="3.5"/><text x="790" y="168" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">Qur'an</text><text x="790" y="228" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">given to</text><rect x="720" y="262" width="140" height="50" rx="25" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2.5"/><text x="790" y="282.65" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Muhammad</text><text x="790" y="301.84999999999997" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">(pbuh)</text><path d="M40,345 L690,345" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linejoin="round" marker-end="url(#ahT)"/><path d="M690,345 L40,345" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linejoin="round" marker-end="url(#ahT)"/><text x="365" y="375" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">all carried the same core message: tawhid</text><rect x="30" y="400" width="840" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="436" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The Qur'an is the final, complete and preserved revelation,</text><text x="56" y="466" font-size="19" font-weight="400" fill="#4a5568" text-anchor="start">so it is the standard by which Muslims live.</text><path d="M780,326 L780,398" fill="none" stroke="#8a6d0d" stroke-width="4" stroke-linejoin="round" marker-end="url(#ahO)"/>
</svg>