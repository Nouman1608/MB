<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 734" width="900" height="734" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="734" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Five Pillars: practice and significance</text>

<text x="218" y="132" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">What Muslims do</text><text x="554" y="132" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Why it matters</text><rect x="30" y="146" width="170" height="118" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><circle cx="64" cy="205" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="64" y="211.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="92" y="212" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Shahada</text><rect x="206" y="146" width="330" height="118" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="220" y="173" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">"There is no god but Allah, and</text><text x="220" y="195" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Muhammad is the Messenger of</text><text x="220" y="217" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Allah."</text><rect x="542" y="146" width="328" height="118" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="556" y="173" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Affirms tawhid and accepts the</text><text x="556" y="195" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Prophet's message; said</text><text x="556" y="217" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">sincerely, it makes a person</text><text x="556" y="239" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Muslim.</text><rect x="30" y="274" width="170" height="118" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><circle cx="64" cy="333" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="64" y="339.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="92" y="340" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Salat</text><rect x="206" y="274" width="330" height="118" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="220" y="301" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Five daily prayers: Fajr, Zuhr,</text><text x="220" y="323" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Asr, Maghrib and Isha, facing the</text><text x="220" y="345" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">qibla.</text><rect x="542" y="274" width="328" height="118" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="556" y="301" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Constant remembrance of Allah,</text><text x="556" y="323" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">discipline, equality in the rows,</text><text x="556" y="345" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">protection from wrongdoing</text><text x="556" y="367" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">(29.45).</text><rect x="30" y="402" width="170" height="96" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><circle cx="64" cy="450" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="64" y="456.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="92" y="457" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Zakat</text><rect x="206" y="402" width="330" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="220" y="429" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Usually 2.5 per cent of savings</text><text x="220" y="451" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">above the nisab held for a lunar</text><text x="220" y="473" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">year, paid to the groups in 9.60.</text><rect x="542" y="402" width="328" height="96" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="556" y="429" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Purifies wealth, reduces greed,</text><text x="556" y="451" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">narrows the gap between rich and</text><text x="556" y="473" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">poor.</text><rect x="30" y="508" width="170" height="96" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><circle cx="64" cy="556" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="64" y="562.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="92" y="563" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Sawm</text><rect x="206" y="508" width="330" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="220" y="535" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">No food, drink or marital</text><text x="220" y="557" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">relations from dawn to sunset in</text><text x="220" y="579" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Ramadan; suhur and iftar.</text><rect x="542" y="508" width="328" height="96" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="556" y="535" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Self-control, empathy with the</text><text x="556" y="557" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">hungry, gratitude; ends with Eid</text><text x="556" y="579" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">al-Fitr.</text><rect x="30" y="614" width="170" height="96" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><circle cx="64" cy="662" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="64" y="668.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="92" y="669" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Hajj</text><rect x="206" y="614" width="330" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="220" y="641" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Pilgrimage to Makka in Dhu</text><text x="220" y="663" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">al-Hijja, once in a lifetime for</text><text x="220" y="685" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">those able in health and wealth.</text><rect x="542" y="614" width="328" height="96" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="556" y="641" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Equality and unity of the Ummah,</text><text x="556" y="663" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">remembrance of Ibrahim, Hajar and</text><text x="556" y="685" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Isma'il, forgiveness of sins.</text>
</svg>