<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750" width="900" height="750" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="750" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Belief and practice in Islam</text>

<rect x="150" y="112" width="600" height="78" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="3"/><text x="450" y="145" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Tawhid: the absolute oneness of Allah</text><text x="450" y="173" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle">shapes every other belief and every act of worship</text><line x1="450" y1="192" x2="450" y2="232" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><rect x="30" y="240" width="840" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="278" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Six Articles of Faith</text><text x="844" y="278" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="end">what Muslims BELIEVE</text><rect x="56" y="300" width="250" height="76" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="181" y="333" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Allah</text><text x="181" y="358" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">tawhid</text><rect x="322" y="300" width="250" height="76" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="447" y="333" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Angels</text><text x="447" y="358" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">created from light</text><rect x="588" y="300" width="250" height="76" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="713" y="333" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Books</text><text x="713" y="358" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">revealed guidance</text><rect x="56" y="390" width="250" height="76" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="181" y="423" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Prophets</text><text x="181" y="448" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">chosen messengers</text><rect x="322" y="390" width="250" height="76" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="447" y="423" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Predestination</text><text x="447" y="448" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">al-qadr</text><rect x="588" y="390" width="250" height="76" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="713" y="423" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">The Last Day</text><text x="713" y="448" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">resurrection, judgement</text><line x1="450" y1="492" x2="450" y2="548" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><text x="470" y="527" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start" font-style="italic">put into action</text><rect x="30" y="556" width="840" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="594" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Five Pillars of Islam</text><text x="844" y="594" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="end">what Muslims DO</text><rect x="56" y="614" width="148" height="88" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="130" y="648" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Shahada</text><text x="130" y="675.65" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">declaration of</text><text x="130" y="694.85" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">faith</text><rect x="216" y="614" width="148" height="88" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="290" y="648" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Salat</text><text x="290" y="675.65" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">five daily</text><text x="290" y="694.85" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">prayers</text><rect x="376" y="614" width="148" height="88" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="450" y="648" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Zakat</text><text x="450" y="685.25" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">annual payment</text><rect x="536" y="614" width="148" height="88" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="610" y="648" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Sawm</text><text x="610" y="675.65" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">fasting in</text><text x="610" y="694.85" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Ramadan</text><rect x="696" y="614" width="148" height="88" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="770" y="648" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Hajj</text><text x="770" y="675.65" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">pilgrimage to</text><text x="770" y="694.85" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Makka</text>
</svg>