<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 628" width="900" height="628" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="628" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Handling the conversation</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Prepare the moves, not the answers</text>
<rect x="30" y="124" width="840" height="52" rx="14" fill="#eef1f0" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="154.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-style="italic">"Would</tspan> <tspan font-style="italic">you</tspan> <tspan font-style="italic">take</tspan> <tspan font-style="italic">part</tspan> <tspan font-style="italic">in</tspan> <tspan font-style="italic">a</tspan> <tspan font-style="italic">project</tspan> <tspan font-style="italic">like</tspan> <tspan font-style="italic">this?"</tspan> Weak: "Yes."</text><rect x="30" y="192" width="165.37499999999997" height="129" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="235.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ANSWER</text><text x="50" y="261.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">"Yes,</text><text x="50" y="284.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">probably,"</text><line x1="201.37499999999997" y1="256.5" x2="231.37499999999997" y2="256.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="237.37499999999997" y="192" width="259.875" height="129" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="257.375" y="224" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">REASON</text><text x="257.375" y="250.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">"because I think</text><text x="257.375" y="273.03999999999996" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">changes start in small</text><text x="257.375" y="296.03999999999996" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">groups."</text><line x1="503.25" y1="256.5" x2="533.25" y2="256.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="539.25" y="192" width="330.74999999999994" height="129" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="559.25" y="224" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXAMPLE</text><text x="559.25" y="250.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">"My class started a clothes</text><text x="559.25" y="273.03999999999996" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">swap last year, and now the</text><text x="559.25" y="296.03999999999996" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">whole school runs one."</text><rect x="30" y="343" width="412" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="377.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Repair</text><text x="50" y="406.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Missing a word? Paraphrase: "the thing you use</text><text x="50" y="427.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">to…", "a kind of…", "the opposite of…". Don't</text><text x="50" y="448.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">switch languages.</text><rect x="458" y="343" width="412" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="388.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Clarify</text><text x="478" y="417.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Didn't understand? "Do you mean…?" "Could</text><text x="478" y="438.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">you say that another way?"</text><rect x="30" y="487" width="412" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="521.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Agree, disagree, qualify</text><text x="50" y="550.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">"That's true up to a point, but…" · "I see it</text><text x="50" y="571.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">differently, because…" · "it depends on…"</text><rect x="458" y="487" width="412" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="521.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Buy time</text><text x="478" y="550.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">"That's a good question…" "Let me think…":</text><text x="478" y="571.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">once, then answer.</text>
</svg>