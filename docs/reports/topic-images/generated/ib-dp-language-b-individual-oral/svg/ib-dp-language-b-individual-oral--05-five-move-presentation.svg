<rect width="900" height="873" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A five-move presentation</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The same shape works at SL and HL</text>
<line x1="60" y1="144" x2="60" y2="511" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="117" y="151.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Frame</text><text x="117" y="181.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">One sentence: what the stimulus is + your main idea</text><circle cx="60" cy="161.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="170.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="207" width="766" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="117" y="234.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Describe</text><text x="117" y="264.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Brief literal account (SL) / place in the work (HL)</text><circle cx="60" cy="244.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="253.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="290" width="766" height="75" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="117" y="317.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Interpret</text><text x="117" y="347.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Two points, each linked to the theme or a possible question</text><circle cx="60" cy="327.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="336.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="373" width="766" height="75" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="117" y="400.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Connect</text><text x="117" y="430.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A specific target-language culture example (SL) / the wider work and its themes (HL)</text><circle cx="60" cy="410.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="419.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="456" width="766" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="117" y="483.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Close</text><text x="117" y="513.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A sentence that opens discussion: a question or tension</text><circle cx="60" cy="493.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="502.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="30" y="569" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">TIME BALANCE</text><rect x="30" y="581" width="109.0909090909091" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="84.54545454545455" y="620" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Frame</text><rect x="139.0909090909091" y="581" width="98.18181818181817" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="188.1818181818182" y="609" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Describe</text><text x="188.1818181818182" y="633" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">shortest</text><rect x="237.27272727272725" y="581" width="283.6363636363636" height="64" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="379.09090909090907" y="609" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Interpret</text><text x="379.09090909090907" y="633" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">most of the time</text><rect x="520.9090909090909" y="581" width="240.00000000000003" height="64" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="640.9090909090909" y="620" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Connect</text><rect x="760.9090909090909" y="581" width="109.0909090909091" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="815.4545454545454" y="620" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Close</text><text x="450" y="669" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Proportions illustrative: description is the shortest move; interpretation and connection take most of it.</text><text x="450" y="713" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">SIGNPOST EACH MOVE (learn the target-language equivalents)</text><rect x="127.32" y="727" width="184.048" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="219.344" y="747.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">"First I'll describe…"</text><rect x="321.368" y="727" width="256.624" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="449.68" y="747.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">"What interests me most is…"</text><rect x="587.992" y="727" width="184.688" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="680.336" y="747.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">"This connects to…"</text><rect x="278.992" y="767" width="194.864" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="376.42400000000004" y="787.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">"On the other hand…"</text><rect x="483.856" y="767" width="137.152" height="30" rx="15" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="552.432" y="787.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">"To sum up…"</text><text x="450" y="832.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Plan in key words, not a script: five headings and a few key words under each, if notes are allowed.</text>
</svg>