<rect width="900" height="543" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The individual oral at a glance</text>

<rect x="30" y="100" width="210" height="74" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="135" y="133" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Individual oral</text><text x="135" y="157" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">internal · 25% · 30 marks</text><rect x="240" y="100" width="630" height="74" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="555" y="133" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">External papers</text><text x="555" y="157" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">75%</text><rect x="30" y="196" width="411" height="158" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="239" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SL STIMULUS</text><text x="50" y="266.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A visual image</text><text x="50" y="296.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">"clearly relevant to one (or more) of the</text><text x="50" y="318.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">themes of the course"</text><rect x="459" y="196" width="411" height="158" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="228" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">HL STIMULUS</text><text x="479" y="255.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A literary excerpt</text><text x="479" y="285.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">"an excerpt from one of the two literary works</text><text x="479" y="307.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">studied", originally written in the target</text><text x="479" y="329.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">language</text><rect x="30" y="376" width="411" height="135" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="408" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">IN THE BRIEF</text><text x="50" y="434.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Same assessment outline at SL and HL</text><text x="50" y="464.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">"it is the nature of the assessment that</text><text x="50" y="486.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">differs"</text><rect x="459" y="376" width="411" height="135" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="408" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">FROM YOUR TEACHER</text><text x="479" y="434.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Timings, stages, rules on notes, criteria</text><text x="479" y="464.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Plan with their exact figures, not an old</text><text x="479" y="486.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">handout.</text>
</svg>