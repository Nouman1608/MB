<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 799" width="900" height="799" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="799" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">SL: four layers for a visual image</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Image: a girl follows a recipe on a video call with an older relative</text>
<text x="110" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">WHAT TO DO</text><text x="490" y="138" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">WORKED EXAMPLE</text><rect x="90" y="152" width="370" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="106" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Literal</text><text x="106" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Who, where, what is happening? Two or</text><text x="106" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">three sentences.</text><rect x="490" y="152" width="380" height="101" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="506" y="196.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A girl follows a recipe on a video call with an</text><text x="506" y="217.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">older relative, perhaps her grandmother.</text><circle cx="52" cy="202.5" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="52" y="210.42" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><line x1="463" y1="202.5" x2="486" y2="202.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="90" y="265" width="370" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="106" y="295.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Theme</text><text x="106" y="324.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Which theme is it "clearly relevant" to?</text><text x="106" y="345.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Which topic? Hold a second theme in</text><text x="106" y="366.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reserve.</text><rect x="490" y="265" width="380" height="122" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="506" y="309.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Identities</tspan> (language and identity). Also</text><text x="506" y="330.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">experiences</tspan> (migration): dark outside,</text><text x="506" y="351.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">daylight on screen.</text><circle cx="52" cy="326" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="52" y="333.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><line x1="463" y1="326" x2="486" y2="326" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="90" y="399" width="370" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="106" y="429.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Lens</text><text x="106" y="458.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Pick one possible question to turn the image</text><text x="106" y="479.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">into an argument.</text><rect x="490" y="399" width="380" height="101" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="506" y="432.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"How do language and culture contribute to</text><text x="506" y="453.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">form our identity?" The recipe is culture</text><text x="506" y="474.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">passed on.</text><circle cx="52" cy="449.5" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="52" y="457.42" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><line x1="463" y1="449.5" x2="486" y2="449.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="90" y="512" width="370" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="106" y="542.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Culture</text><text x="106" y="571.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Connect to a specific target-language</text><text x="106" y="592.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">example: a custom, a news story, a text</text><text x="106" y="613.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">from class.</text><rect x="490" y="512" width="380" height="122" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="506" y="566.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Compare a family food tradition you have</text><text x="506" y="587.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">studied: what is similar, what is different.</text><circle cx="52" cy="573" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="52" y="580.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><line x1="463" y1="573" x2="486" y2="573" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="656" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="690.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">One sentence of description, then straight to an idea</text><text x="50" y="720.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">"This image shows a girl learning a family recipe by video call, and I think it asks how a culture</text><text x="50" y="742.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">survives when a family is split between two countries."</text>
</svg>