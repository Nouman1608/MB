<rect width="900" height="512" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Be ready to move between themes</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The conversation can go beyond the stimulus</text>
<rect x="300" y="124" width="300" height="110" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">SHARING THE PLANET</text><text x="450" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">An image of a river</text><text x="450" y="208.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">clean-up</text><path d="M400,238 C380,274 250,264 220,298" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><path d="M500,238 C520,274 650,264 680,298" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><rect x="30" y="304" width="340" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="200" y="348.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">IDENTITIES</text><text x="200" y="376.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">What young people value</text><rect x="530" y="304" width="340" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="700" y="336" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">EXPERIENCES</text><text x="700" y="363.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">A community event that</text><text x="700" y="388.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">changed someone</text><text x="450" y="449.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Keep vocabulary ready for every theme your class has studied, and practise linking ideas from one</text><text x="450" y="471.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">theme to another.</text>
</svg>