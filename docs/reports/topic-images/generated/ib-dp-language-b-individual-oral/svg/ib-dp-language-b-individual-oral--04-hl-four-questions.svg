<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 714" width="900" height="714" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="714" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">HL: four questions for a literary extract</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Extract: Nadia reads her mother's letter and delays replying</text>
<text x="110" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">WHAT TO DO</text><text x="490" y="138" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">WORKED EXAMPLE</text><rect x="90" y="152" width="370" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="106" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Where is it?</text><text x="106" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">What happens just before, and what</text><text x="106" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">follows? One or two sentences.</text><rect x="490" y="152" width="380" height="101" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="506" y="196.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">In your real work: where this scene sits in the</text><text x="506" y="217.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">story.</text><circle cx="52" cy="202.5" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="52" y="210.42" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><line x1="463" y1="202.5" x2="486" y2="202.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="90" y="265" width="370" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="106" y="295.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">What happens here?</text><text x="106" y="324.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The key action, change or conflict.</text><rect x="490" y="265" width="380" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="506" y="298.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Nadia, living abroad, reads a letter from her</text><text x="506" y="319.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mother and delays replying.</text><circle cx="52" cy="305" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="52" y="312.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><line x1="463" y1="305" x2="486" y2="305" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="90" y="357" width="370" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="106" y="387.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">How is it written?</text><text x="106" y="416.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Two or three features, each with a short</text><text x="106" y="437.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">quotation and its effect.</text><rect x="490" y="357" width="380" height="101" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="506" y="390.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The untranslatable word for home · the</text><text x="506" y="411.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">repeated "Tomorrow" · the tram "timetable"</text><text x="506" y="432.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">learned first.</text><circle cx="52" cy="407.5" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="52" y="415.42" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><line x1="463" y1="407.5" x2="486" y2="407.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="90" y="470" width="370" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="106" y="500.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Why does it matter?</text><text x="106" y="529.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Link to the whole work and to a prescribed</text><text x="106" y="550.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">theme.</text><rect x="490" y="470" width="380" height="101" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="506" y="503.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Identities</tspan> (language and identity),</text><text x="506" y="524.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">experiences</tspan> (migration). Lens: "What</text><text x="506" y="545.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">constitutes an identity?"</text><circle cx="52" cy="520.5" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="52" y="528.42" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><line x1="463" y1="520.5" x2="486" y2="520.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="593" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="627.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Avoid retelling the plot.</text><text x="450" y="657.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">The extract is evidence for an interpretation, not a story to repeat.</text>
</svg>