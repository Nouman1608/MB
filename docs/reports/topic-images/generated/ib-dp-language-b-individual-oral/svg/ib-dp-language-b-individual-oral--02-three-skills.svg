<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 801" width="900" height="801" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="801" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The oral uses all three skills</text>

<circle cx="355" cy="260" r="150" fill="#b5d3cf" fill-opacity="0.6" stroke="#1e2a44" stroke-width="3"/><circle cx="545" cy="260" r="150" fill="#f2e7b8" fill-opacity="0.6" stroke="#1e2a44" stroke-width="3"/><circle cx="450" cy="420" r="150" fill="#d4b02e" fill-opacity="0.6" stroke="#1e2a44" stroke-width="3"/><text x="290" y="205" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Receptive</text><text x="290" y="233" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">understand the</text><text x="290" y="254" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">stimulus and the</text><text x="290" y="275" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">questions</text><text x="610" y="205" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Productive</text><text x="610" y="233" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">speak at length, in</text><text x="610" y="254" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">an organised way</text><text x="450" y="475" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Interactive</text><text x="450" y="503" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">a real exchange, not</text><text x="450" y="524" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">memorised answers</text><circle cx="450" cy="315" r="40" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="450" y="322" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Oral</text><rect x="30" y="592" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="626.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Notice the verb respond</text><text x="50" y="656.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">"understand and use language to express and <tspan font-weight="700" fill="#1e2a44">respond</tspan> to a range of ideas with fluency and</text><text x="50" y="678.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">accuracy": half of the skill is reacting to what someone else says.</text><text x="450" y="738.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Register: your audience is your teacher in a formal assessment, so be polite, clear and natural: full</text><text x="450" y="760.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">sentences, no slang, no essay phrasing read aloud.</text>
</svg>