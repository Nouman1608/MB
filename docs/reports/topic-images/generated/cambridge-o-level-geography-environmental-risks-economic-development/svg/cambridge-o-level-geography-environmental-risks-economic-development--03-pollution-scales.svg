<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 565" width="900" height="565" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="565" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From local to global</text>

<rect x="30" y="110" width="840" height="400" rx="18" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><rect x="80" y="180" width="740" height="310" rx="16" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><rect x="150" y="255" width="600" height="215" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="60" y="148" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">GLOBAL</text><text x="160" y="148" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">greenhouse gas emissions warm the whole planet</text><text x="110" y="218" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">CROSSES BORDERS</text><text x="310" y="218" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">acid rain from sulphur and nitrogen gases</text><text x="180" y="293" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">LOCAL</text><text x="180" y="330" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="196" y="330" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Quarry noise and dust</text><text x="180" y="364" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="196" y="364" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Noise from airports, motorways, factories: stress, poor</text><text x="196" y="386" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">sleep</text><text x="180" y="420" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="196" y="420" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Visual pollution: quarries, power lines, litter; can harm</text><text x="196" y="442" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">tourism</text><text x="450" y="540" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Exam questions often ask you to say which scale a threat works at.</text>
</svg>