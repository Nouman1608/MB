<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="620" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Sustainable development and how to manage for it</text>

<rect x="30" y="110" width="840" height="92" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="146" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Meets the needs of people today without reducing the ability of future</text><text x="55" y="170" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">generations to meet their own needs.</text><circle cx="230" cy="330" r="105" fill="#d4b02e" opacity="0.45" stroke="#1e2a44" stroke-width="2.5"/><circle cx="340" cy="330" r="105" fill="#b5d3cf" opacity="0.45" stroke="#1e2a44" stroke-width="2.5"/><circle cx="285" cy="425" r="105" fill="#6f9a52" opacity="0.45" stroke="#1e2a44" stroke-width="2.5"/><text x="185" y="305" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Economic</text><text x="185" y="327" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">growth</text><text x="390" y="305" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">People’s</text><text x="390" y="327" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">well-being</text><text x="285" y="478" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Environment</text><text x="285" y="500" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">protection</text><text x="285" y="375" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">balance</text><text x="285" y="568" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Sustainable development balances all three</text><rect x="510" y="222" width="360" height="58" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="526" y="246" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">Laws and regulation</text><text x="526" y="268" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">emissions limits, protected areas, fines</text><rect x="510" y="288" width="360" height="58" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="526" y="312" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">Cleaner technology</text><text x="526" y="334" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">treat waste water, chimney filters, renewables</text><rect x="510" y="354" width="360" height="58" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="526" y="378" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">Better farming</text><text x="526" y="400" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">terraces, contour ploughing, windbreaks</text><rect x="510" y="420" width="360" height="58" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="526" y="444" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">Restore damaged land</text><text x="526" y="466" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">replant forests, landscape quarries</text><rect x="510" y="486" width="360" height="58" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="526" y="510" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">Monitoring</text><text x="526" y="532" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">satellite images detect illegal clearance</text><rect x="510" y="552" width="360" height="58" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="526" y="576" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">International agreements</text><text x="526" y="598" font-size="14.5" font-weight="400" fill="#4a5568" text-anchor="start">targets to cut greenhouse gases</text>
</svg>