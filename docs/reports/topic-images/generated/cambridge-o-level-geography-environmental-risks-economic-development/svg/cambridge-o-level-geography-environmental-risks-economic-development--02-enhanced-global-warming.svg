0" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Changes to where crops can</text><text x="608" y="412" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">grow</text><rect x="30" y="510" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="548" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="start">Natural greenhouse effect: normal, keeps the Earth warm.</text><text x="55" y="580" font-size="17.5" font-weight="700" fill="#b5602e" text-anchor="start">Enhanced: extra CO₂ (fossil fuels, forest clearance) and methane trap more heat.</text><text x="55" y="606" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Fewer trees also means less carbon dioxide absorbed.</text>
