<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 730" width="900" height="730" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="730" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Trace every threat back to its cause</text>

<text x="137.5" y="136" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle">Activity</text><text x="376.5" y="136" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle">Process</text><text x="583" y="136" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">Threat</text><text x="776" y="136" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Effect</text><rect x="30" y="152" width="215" height="122" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="198" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Clearing forest;</text><text x="44" y="218" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">ploughing steep slopes;</text><text x="44" y="238" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">overgrazing</text><line x1="247" y1="213" x2="266" y2="213" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="269" y="152" width="215" height="122" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="283" y="198" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">No roots or cover: rain</text><text x="283" y="218" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">washes topsoil away,</text><text x="283" y="238" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">wind blows dry soil</text><line x1="486" y1="213" x2="505" y2="213" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="508" y="152" width="150" height="122" rx="12" fill="#f6e6dc" stroke="#b5602e" stroke-width="2.5"/><text x="583" y="218" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">Soil erosion</text><line x1="660" y1="213" x2="679" y2="213" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="682" y="152" width="188" height="122" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="696" y="188" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Lower yields,</text><text x="696" y="208" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">gullies; silt fills</text><text x="696" y="228" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">rivers, raising</text><text x="696" y="248" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">flood risk</text><rect x="30" y="292" width="215" height="122" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="328" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Overgrazing,</text><text x="44" y="348" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">over-cultivation,</text><text x="44" y="368" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">cutting fuelwood; worse</text><text x="44" y="388" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">in drought</text><line x1="247" y1="353" x2="266" y2="353" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="269" y="292" width="215" height="122" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="283" y="338" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Soil exhausted; trees</text><text x="283" y="358" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">and shrubs removed from</text><text x="283" y="378" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">dry land</text><line x1="486" y1="353" x2="505" y2="353" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="508" y="292" width="150" height="122" rx="12" fill="#f6e6dc" stroke="#b5602e" stroke-width="2.5"/><text x="583" y="336" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">Desertification</text><text x="583" y="358" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">(e.g. the</text><text x="583" y="380" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">Sahel)</text><line x1="660" y1="353" x2="679" y2="353" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="682" y="292" width="188" height="122" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="696" y="328" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Land cannot support</text><text x="696" y="348" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">crops or animals:</text><text x="696" y="368" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">food shortages,</text><text x="696" y="388" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">migration</text><rect x="30" y="432" width="215" height="122" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="478" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Burning fossil fuels;</text><text x="44" y="498" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">clearing forest;</text><text x="44" y="518" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">cattle, rice, landfill</text><line x1="247" y1="493" x2="266" y2="493" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="269" y="432" width="215" height="122" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="283" y="488" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Carbon dioxide and</text><text x="283" y="508" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">methane trap more heat</text><line x1="486" y1="493" x2="505" y2="493" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="508" y="432" width="150" height="122" rx="12" fill="#f6e6dc" stroke="#b5602e" stroke-width="2.5"/><text x="583" y="476" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">Enhanced</text><text x="583" y="498" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">global</text><text x="583" y="520" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">warming</text><line x1="660" y1="493" x2="679" y2="493" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="682" y="432" width="188" height="122" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="696" y="468" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Higher</text><text x="696" y="488" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">temperatures,</text><text x="696" y="508" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">sea-level rise,</text><text x="696" y="528" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">extreme weather</text><rect x="30" y="572" width="215" height="122" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="618" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Sewage, factory waste,</text><text x="44" y="638" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">fertiliser run-off, oil</text><text x="44" y="658" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">spills, mining waste</text><line x1="247" y1="633" x2="266" y2="633" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="269" y="572" width="215" height="122" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="283" y="618" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Harmful waste and</text><text x="283" y="638" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">excess nutrients reach</text><text x="283" y="658" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">water</text><line x1="486" y1="633" x2="505" y2="633" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="508" y="572" width="150" height="122" rx="12" fill="#f6e6dc" stroke="#b5602e" stroke-width="2.5"/><text x="583" y="627" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">Water</text><text x="583" y="649" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">pollution</text><line x1="660" y1="633" x2="679" y2="633" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="682" y="572" width="188" height="122" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="696" y="618" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Disease, fish</text><text x="696" y="638" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">deaths, algal</text><text x="696" y="658" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">blooms</text>
</svg>