<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" width="900" height="710" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="710" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Case study: the Amazon rainforest in Brazil</text>

<text x="165" y="138" font-size="20" font-weight="700" fill="#4a5568" text-anchor="middle">Activities</text><rect x="30" y="152" width="270" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="184.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Cattle ranching</text><text x="48" y="207.7" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">largest single cause</text><rect x="30" y="260" width="270" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="292.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Soya farming</text><text x="48" y="315.7" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">much exported as animal feed</text><rect x="30" y="368" width="270" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="400.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Logging</text><text x="48" y="423.7" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">roads open forest to settlers</text><rect x="30" y="476" width="270" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="508.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Mining</text><text x="48" y="531.7" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Carajás iron ore; gold with</text><text x="48" y="551.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">mercury</text><rect x="30" y="584" width="270" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="616.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Roads and HEP</text><text x="48" y="639.7" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Trans-Amazonian Highway; Belo</text><text x="48" y="659.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Monte</text><text x="450" y="138" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle">Risks</text><rect x="315" y="152" width="270" height="96" rx="14" fill="#f6e6dc" stroke="#b5602e" stroke-width="2.5"/><text x="333" y="184.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Soil erosion, leaching</text><text x="333" y="207.7" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">thin soils lose nutrients</text><text x="333" y="227.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">fast</text><rect x="315" y="260" width="270" height="96" rx="14" fill="#f6e6dc" stroke="#b5602e" stroke-width="2.5"/><text x="333" y="292.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Global warming</text><text x="333" y="315.7" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">carbon released; fewer trees</text><text x="333" y="335.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">absorb it</text><rect x="315" y="368" width="270" height="96" rx="14" fill="#f6e6dc" stroke="#b5602e" stroke-width="2.5"/><text x="333" y="400.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Water pollution</text><text x="333" y="423.7" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">mercury builds up in fish</text><text x="333" y="443.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">people eat</text><rect x="315" y="476" width="270" height="96" rx="14" fill="#f6e6dc" stroke="#b5602e" stroke-width="2.5"/><text x="333" y="508.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Biodiversity loss</text><text x="333" y="531.7" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">habitats destroyed</text><rect x="315" y="584" width="270" height="96" rx="14" fill="#f6e6dc" stroke="#b5602e" stroke-width="2.5"/><text x="333" y="616.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Threats to people</text><text x="333" y="639.7" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">indigenous land lost; land</text><text x="333" y="659.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">conflicts</text><text x="735" y="138" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">Management</text><rect x="600" y="152" width="270" height="96" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="618" y="184.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Protected areas</text><text x="618" y="207.7" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">and indigenous territories</text><rect x="600" y="260" width="270" height="96" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="618" y="292.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Forest Code</text><text x="618" y="315.7" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">landowners keep much land as</text><text x="618" y="335.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">forest</text><rect x="600" y="368" width="270" height="96" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="618" y="400.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Satellite monitoring</text><text x="618" y="423.7" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">INPE detects clearance</text><text x="618" y="443.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">quickly</text><rect x="600" y="476" width="270" height="96" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="618" y="508.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Soy Moratorium (2006)</text><text x="618" y="531.7" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">traders refuse soya from</text><text x="618" y="551.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">newly cleared land</text><rect x="600" y="584" width="270" height="104" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="616" y="612" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Evaluation: clearance fell in</text><text x="616" y="631" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">the late 2000s with strong</text><text x="616" y="650" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">enforcement, then rose again</text><text x="616" y="669" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">in some years.</text>
</svg>