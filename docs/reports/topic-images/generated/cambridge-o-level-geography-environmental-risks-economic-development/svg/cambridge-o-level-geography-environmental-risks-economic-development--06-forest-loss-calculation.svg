<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="550" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: forest loss in numbers</text>

<rect x="30" y="110" width="840" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="150" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">2005</text><rect x="130" y="128" width="600" height="40" rx="5" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><text x="742" y="155" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">8,400 km²</text><text x="55" y="220" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">2025</text><rect x="130" y="198" width="450" height="40" rx="5" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><rect x="580" y="198" width="150" height="40" rx="5" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="655" y="224" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">lost</text><text x="620" y="262" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="355" y="224" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">6,300 km²</text><rect x="55" y="268" width="250" height="76" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="69" y="292" font-size="15.5" font-weight="700" fill="#4a5568" text-anchor="start">Loss</text><text x="69" y="322" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">8,400 − 6,300</text><text x="291" y="322" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="end">= 2,100 km²</text><rect x="325" y="268" width="250" height="76" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="339" y="292" font-size="15.5" font-weight="700" fill="#4a5568" text-anchor="start">Percentage loss</text><text x="339" y="322" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">2,100 ÷ 8,400 × 100</text><text x="561" y="322" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="end">= 25%</text><rect x="595" y="268" width="250" height="76" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="609" y="292" font-size="15.5" font-weight="700" fill="#4a5568" text-anchor="start">Average per year</text><text x="609" y="322" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">2,100 ÷ 20</text><text x="831" y="322" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="end">= 105 km²/yr</text><text x="450" y="400" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Explain: why forest loss raises flood risk downstream</text><rect x="30" y="420" width="195" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="453.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Fewer trees</text><text x="48" y="477.325" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">less rain</text><text x="48" y="497.78499999999997" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">intercepted</text><line x1="228" y1="472" x2="241" y2="472" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="245" y="420" width="195" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="263" y="453.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">More runoff</text><text x="263" y="477.325" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">water runs quickly</text><text x="263" y="497.78499999999997" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">over the surface</text><line x1="443" y1="472" x2="456" y2="472" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="460" y="420" width="195" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="453.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Silted rivers</text><text x="478" y="477.325" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">eroded soil fills</text><text x="478" y="497.78499999999997" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">channels</text><line x1="658" y1="472" x2="671" y2="472" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="675" y="420" width="195" height="104" rx="14" fill="#f6e6dc" stroke="#b5602e" stroke-width="2.5"/><text x="693" y="453.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Flooding</text><text x="693" y="477.325" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">rivers overflow</text><text x="693" y="497.78499999999997" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">more easily</text>
</svg>