<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 444" width="900" height="444" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="444" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From description to explanation</text>

<rect x="30" y="104" width="400" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">A weak answer…</text><rect x="430" y="104" width="440" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="442" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">A strong answer…</text><rect x="30" y="150" width="400" height="66" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="176.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Lists types of inequality: class,</text><text x="42" y="198.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">gender, ethnicity</text><rect x="430" y="150" width="440" height="66" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="442" y="176.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Explains how each one affects life chances</text><rect x="30" y="216" width="400" height="66" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="242.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Defines meritocracy</text><rect x="430" y="216" width="440" height="66" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="442" y="242.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Defines it, then critiques how meritocratic</text><text x="442" y="264.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">society really is</text><rect x="30" y="282" width="400" height="66" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="308.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Uses “Marxism” as a label</text><rect x="430" y="282" width="440" height="66" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="442" y="308.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Explains the specific Marxist mechanism in the</text><text x="442" y="330.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">scenario</text><rect x="30" y="348" width="400" height="66" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="374.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Treats class, gender and ethnicity</text><text x="42" y="396.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">separately</text><rect x="430" y="348" width="440" height="66" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="442" y="374.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Shows how they intersect and compound one</text><text x="442" y="396.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">another</text>
</svg>