<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Topic 3 at a glance</text>

<rect x="30" y="104" width="269.3333333333333" height="320" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">3.1 · COVERED IN DEPTH</text><text x="50" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">What is social</text><text x="50" y="188.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">stratification?</text><text x="50" y="216.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="216.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Open and closed societies</text><text x="50" y="242.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="242.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Life chances: education,</text><text x="65.2" y="263.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">employment, health,</text><text x="65.2" y="284.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">housing, life expectancy</text><text x="50" y="310.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="310.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Intersectionality of age,</text><text x="65.2" y="331.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">ethnicity, gender and</text><text x="65.2" y="352.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">class</text><text x="50" y="378.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="378.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Theories: labelling</text><text x="65.2" y="399.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">theory and Marxism</text><rect x="315.3333333333333" y="104" width="269.3333333333333" height="320" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="335.3333333333333" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">3.2</text><text x="335.3333333333333" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Reducing social</text><text x="335.3333333333333" y="188.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">inequalities</text><text x="335.3333333333333" y="216.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="350.5333333333333" y="216.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Legislation</text><text x="335.3333333333333" y="242.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="350.5333333333333" y="242.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Welfare states</text><text x="335.3333333333333" y="268.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="350.5333333333333" y="268.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Global work of NGOs</text><text x="335.3333333333333" y="294.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="350.5333333333333" y="294.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">How successful have these</text><text x="350.5333333333333" y="315.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">been?</text><rect x="600.6666666666666" y="104" width="269.3333333333333" height="320" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="620.6666666666666" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">3.3</text><text x="620.6666666666666" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Globalisation and</text><text x="620.6666666666666" y="188.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">inequality between</text><text x="620.6666666666666" y="213.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">societies</text><text x="620.6666666666666" y="241.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="635.8666666666667" y="241.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Migration</text><text x="620.6666666666666" y="267.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="635.8666666666667" y="267.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Global ecological issues</text><text x="620.6666666666666" y="293.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="635.8666666666667" y="293.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Explanations for global</text><text x="635.8666666666667" y="314.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">inequalities</text><rect x="30" y="442" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="475.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Topic 3 builds on Topic 2: your place in the class, gender and ethnic hierarchy shapes your</text><text x="50" y="497.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">identity, and your identity shapes that place.</text>
