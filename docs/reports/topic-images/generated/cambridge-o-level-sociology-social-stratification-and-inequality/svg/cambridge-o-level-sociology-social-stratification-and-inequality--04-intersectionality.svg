<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 742" width="900" height="742" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="742" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Class, gender and ethnicity overlap</text>

<rect x="30" y="110" width="840" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="350" cy="270" r="140" fill="#b5d3cf" fill-opacity="0.55" stroke="#1e2a44" stroke-width="3"/><circle cx="550" cy="270" r="140" fill="#d4b02e" fill-opacity="0.55" stroke="#1e2a44" stroke-width="3"/><circle cx="450" cy="430" r="140" fill="#dce9e7" fill-opacity="0.55" stroke="#1e2a44" stroke-width="3"/><text x="300" y="220" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Social class</text><text x="300" y="247" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">family wealth,</text><text x="300" y="267" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">resources</text><text x="600" y="220" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Gender</text><text x="600" y="247" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">careers, pay,</text><text x="600" y="267" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">domestic roles</text><text x="450" y="480" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Ethnicity</text><text x="450" y="507" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">discrimination,</text><text x="450" y="527" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">unequal access</text><circle cx="450" cy="323" r="42" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="450" y="319" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">life</text><text x="450" y="338" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">chances</text><text x="855" y="562" font-size="17" font-weight="600" fill="#8a6d0d" text-anchor="end">+ age also combines</text><text x="855" y="150" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">Each circle = one</text><text x="855" y="170" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">form of stratification</text><rect x="30" y="600" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="636" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Intersectionality</text><text x="50" y="665.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Ask how the factors combine and compound one another, not which single factor explains a</text><text x="50" y="687.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">person’s life chances.</text>
</svg>