<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 768" width="900" height="768" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="768" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Same society, different life chances</text>

<rect x="30" y="120" width="840" height="95" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="157.6" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Life chances</text><text x="450" y="189.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">A person’s opportunities to improve their quality of life.</text><rect x="30" y="240" width="840" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="385" y="282" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Born into a higher class</text><text x="670" y="282" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">Born into a lower class</text><text x="50" y="350" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Good education</text><rect x="270" y="328" width="230" height="30" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><rect x="560" y="328" width="125" height="30" rx="8" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5"/><rect x="685" y="328" width="105" height="30" rx="8" fill="none" stroke="#c9d6d4" stroke-width="2.5" stroke-dasharray="6 5"/><line x1="50" y1="380" x2="850" y2="380" stroke="#c9d6d4" stroke-width="1.5"/><text x="50" y="426" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Secure employment</text><rect x="270" y="404" width="230" height="30" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><rect x="560" y="404" width="125" height="30" rx="8" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5"/><rect x="685" y="404" width="105" height="30" rx="8" fill="none" stroke="#c9d6d4" stroke-width="2.5" stroke-dasharray="6 5"/><line x1="50" y1="456" x2="850" y2="456" stroke="#c9d6d4" stroke-width="1.5"/><text x="50" y="502" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Healthcare</text><rect x="270" y="480" width="230" height="30" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><rect x="560" y="480" width="125" height="30" rx="8" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5"/><rect x="685" y="480" width="105" height="30" rx="8" fill="none" stroke="#c9d6d4" stroke-width="2.5" stroke-dasharray="6 5"/><line x1="50" y1="532" x2="850" y2="532" stroke="#c9d6d4" stroke-width="1.5"/><text x="50" y="578" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Material security</text><rect x="270" y="556" width="230" height="30" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><rect x="560" y="556" width="125" height="30" rx="8" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5"/><rect x="685" y="556" width="105" height="30" rx="8" fill="none" stroke="#c9d6d4" stroke-width="2.5" stroke-dasharray="6 5"/><text x="450" y="622" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Bars show the direction of the pattern, not real data.</text><rect x="30" y="658" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="691.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">This gap exists independent of individual effort: the class you are born into typically</text><text x="50" y="713.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">shapes your access to these opportunities.</text>
</svg>