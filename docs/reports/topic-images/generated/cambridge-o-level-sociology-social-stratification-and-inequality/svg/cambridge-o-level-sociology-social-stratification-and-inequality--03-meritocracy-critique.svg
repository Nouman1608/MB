<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 860" width="900" height="860" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="860" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Meritocracy: the claim and the critique</text>

<rect x="30" y="110" width="840" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="150" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="start">The claim</text><text x="55" y="178" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Everyone starts level; ability and effort decide where you end up.</text><rect x="55" y="215" width="790" height="50" fill="#eaf2f0"/><line x1="80" y1="215" x2="80" y2="265" stroke="#1e2a44" stroke-width="3"/><circle cx="102" cy="240" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><rect x="55" y="277" width="790" height="50" fill="#dce9e7"/><line x1="80" y1="277" x2="80" y2="327" stroke="#1e2a44" stroke-width="3"/><circle cx="102" cy="302" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><rect x="55" y="339" width="790" height="50" fill="#eaf2f0"/><line x1="80" y1="339" x2="80" y2="389" stroke="#1e2a44" stroke-width="3"/><circle cx="102" cy="364" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="800" y1="208" x2="800" y2="397" stroke="#1e2a44" stroke-width="5" stroke-dasharray="10 7"/><text x="790" y="178" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">social position</text><rect x="30" y="430" width="840" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="470" font-size="22" font-weight="700" fill="#b5602e" text-anchor="start">The critique</text><text x="55" y="498" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Unequal starting points give some people a head start.</text><rect x="55" y="535" width="790" height="50" fill="#eaf2f0"/><line x1="480" y1="535" x2="480" y2="585" stroke="#1e2a44" stroke-width="3"/><circle cx="502" cy="560" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="468" y="567" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="end">family wealth, social networks</text><rect x="55" y="597" width="790" height="50" fill="#dce9e7"/><line x1="280" y1="597" x2="280" y2="647" stroke="#1e2a44" stroke-width="3"/><circle cx="302" cy="622" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="268" y="629" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="end">education access</text><rect x="55" y="659" width="790" height="50" fill="#eaf2f0"/><line x1="80" y1="659" x2="80" y2="709" stroke="#1e2a44" stroke-width="3"/><circle cx="102" cy="684" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="800" y1="528" x2="800" y2="717" stroke="#1e2a44" stroke-width="5" stroke-dasharray="10 7"/><text x="790" y="498" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">social position</text><rect x="30" y="750" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="783.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">So outcomes are not purely a reflection of individual merit. Define meritocracy, then</text><text x="50" y="805.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">always add this critique.</text>
</svg>