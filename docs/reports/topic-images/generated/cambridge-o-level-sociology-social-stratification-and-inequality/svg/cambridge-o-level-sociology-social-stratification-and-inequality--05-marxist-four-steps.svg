<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 746" width="900" height="746" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="746" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Applying a Marxist explanation in four steps</text>

<rect x="30" y="104" width="840" height="110" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SCENARIO</text><text x="50" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Two children from different social classes achieve different levels of</text><text x="50" y="188.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">educational success.</text><line x1="62" y1="252" x2="62" y2="696" stroke="#c9d6d4" stroke-width="4"/><rect x="108" y="232" width="762" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="268" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Name the Marxist concept</text><text x="128" y="297.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Education tends to reproduce existing class inequality rather than neutrally</text><text x="128" y="319.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">rewarding ability.</text><circle cx="62" cy="288" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="296.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="108" y="356" width="762" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="128" y="392" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Explain the mechanism</text><text x="128" y="421.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The wealthier child has private tutoring, more resources at home, and cultural</text><text x="128" y="443.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">capital that matches how schools judge success.</text><circle cx="62" cy="412" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="420.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="108" y="480" width="762" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="516" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Link to life chances</text><text x="128" y="545.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Unequal access to educational resources becomes unequal life chances in adulthood,</text><text x="128" y="567.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">such as higher-paid work.</text><circle cx="62" cy="536" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="544.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="108" y="604" width="762" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="640" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Add a limitation</text><text x="128" y="669.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Ability and effort still play some role; not every child from one class follows</text><text x="128" y="691.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the same path.</text><circle cx="62" cy="660" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="668.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text>
</svg>