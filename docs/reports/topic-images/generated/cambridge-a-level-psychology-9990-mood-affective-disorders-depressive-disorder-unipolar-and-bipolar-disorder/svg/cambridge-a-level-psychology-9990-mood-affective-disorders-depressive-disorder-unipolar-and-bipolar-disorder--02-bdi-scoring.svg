<rect x="60" y="124" width="32" height="32" rx="4" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><rect x="97.2" y="124" width="32" height="32" rx="4" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><rect x="134.4" y="124" width="32" height="32" rx="4" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><rect x="171.60000000000002" y="124" width="32" height="32" rx="4" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><rect x="208.8" y="124" width="32" height="32" rx="4" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><rect x="246" y="124" width="32" height="32" rx="4" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><rect x="283.20000000000005" y="124" width="32" height="32" rx="4" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><rect x="320.40000000000003" y="124" width="32" height="32" rx="4" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><rect x="357.6" y="124" width="32" height="32" rx="4" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><rect x="394.8" y="124" width="32" height="32" rx="4" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><rect x="432" y="124" width="32" height="32" rx="4" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><rect x="469.20000000000005" y="124" width="32" height="32" rx="4" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><rect x="506.40000000000003" y="124" width="32" height="32" rx="4" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><rect x="543.6" y="124" width="32" height="32" rx="4" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><rect x="580.8000000000001" y="124" width="32" height="32" rx="4" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><rect x="618" y="124" width="32" height="32" rx="4" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><rect x="655.2" y="124" width="32" height="32" rx="4" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><rect x="692.4000000000001" y="124" width="32" height="32" rx="4" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><rect x="729.6" y="124" width="32" height="32" rx="4" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><rect x="766.8000000000001" y="124" width="32" height="32" rx="4" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><rect x="804" y="124" width="32" height="32" rx="4" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="450" y="182" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">21 items × 3 = maximum total of 63</text><text x="450" y="224" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">BDI-II: USUAL INTERPRETATION OF TOTALS</text><rect x="60" y="238" width="173.33333333333334" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="146.66666666666669" y="276" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">minimal</text><rect x="233.33333333333334" y="238" width="74.28571428571425" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="270.4761904761905" y="276" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">mild</text><rect x="307.6190476190476" y="238" width="111.42857142857144" height="64" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="363.3333333333333" y="276" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">moderate</text><rect x="419.04761904761904" y="238" width="433.33333333333337" height="64" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="635.7142857142858" y="276" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">severe</text><line x1="60" y1="302" x2="60" y2="314" stroke="#1e2a44" stroke-width="2.5"/><text x="60" y="336" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">0</text><line x1="233.33333333333334" y1="302" x2="233.33333333333334" y2="314" stroke="#1e2a44" stroke-width="2.5"/><text x="233.33333333333334" y="336" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">14</text><line x1="307.6190476190476" y1="302" x2="307.6190476190476" y2="314" stroke="#1e2a44" stroke-width="2.5"/><text x="307.6190476190476" y="336" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">20</text><line x1="419.04761904761904" y1="302" x2="419.04761904761904" y2="314" stroke="#1e2a44" stroke-width="2.5"/><text x="419.04761904761904" y="336" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">29</text><line x1="852.3809523809524" y1="302" x2="852.3809523809524" y2="314" stroke="#1e2a44" stroke-width="2.5"/><text x="852.3809523809524" y="336" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">63</text><rect x="30" y="364" width="413" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="396" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">+ STRENGTHS</text><text x="50" y="427.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Quick and standardised; quantitative data that</text><text x="50" y="448.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">track change; good reliability.</text><rect x="457" y="364" width="413" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="396" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">− PSYCHOMETRIC LIMITS</text><text x="477" y="427.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Self-report: social desirability and insight on the</text><text x="477" y="448.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">day. In some cultures distress shows as physical</text><text x="477" y="469.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">complaints, so it may <tspan font-weight="700" fill="#1e2a44">underestimate</tspan> depression.</text>
</svg>