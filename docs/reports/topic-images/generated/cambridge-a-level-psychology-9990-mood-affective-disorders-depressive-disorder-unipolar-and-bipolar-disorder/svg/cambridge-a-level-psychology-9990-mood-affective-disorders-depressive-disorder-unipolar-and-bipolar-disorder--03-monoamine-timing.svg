<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 658" width="900" height="658" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="658" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The monoamine hypothesis: a timing problem</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Low serotonin and noradrenaline (and possibly dopamine) linked to depression</text>
<rect x="30" y="124" width="840" height="350" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="140" y1="414" x2="830" y2="414" stroke="#1e2a44" stroke-width="3"/><line x1="140" y1="414" x2="140" y2="164" stroke="#1e2a44" stroke-width="3"/><text x="485" y="448" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">time after starting an antidepressant</text><text x="118" y="289" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 118 289)">level</text><text x="830" y="156" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">illustrative: no data in the lesson</text><path d="M140,376.5 C170,376.5 175,201.5 220,201.5 L830,201.5" fill="none" stroke="#2e6b62" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><path d="M140,389 L520,379 C600,374 640,264 830,244" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><text x="240" y="187.5" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">monoamine levels rise within hours</text><text x="330" y="368" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">mood improves only after several weeks</text><rect x="30" y="496" width="413" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="528" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SUPPORT</text><text x="50" y="559.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Antidepressants increase monoamine availability</text><text x="50" y="580.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and reduce symptoms for many people.</text><rect x="457" y="496" width="413" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="528" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">CRITICISM</text><text x="477" y="559.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The delay means low monoamines are unlikely to</text><text x="477" y="580.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">be the whole story; the explanation is also</text><text x="477" y="601.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reductionist.</text>
</svg>