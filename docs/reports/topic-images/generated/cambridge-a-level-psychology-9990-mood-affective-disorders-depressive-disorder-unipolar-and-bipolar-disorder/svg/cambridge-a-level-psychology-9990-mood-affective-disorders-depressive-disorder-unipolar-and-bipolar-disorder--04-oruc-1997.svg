<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 852" width="900" height="852" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="852" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Key study: Oruč et al. (1997)</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Serotonin-related genes and bipolar disorder</text>
<rect x="30" y="124" width="840" height="52" rx="14" fill="#2e6b62"/><rect x="30" y="154" width="840" height="22" fill="#2e6b62"/><text x="50" y="158" font-size="21" font-weight="700" fill="#ffffff" text-anchor="start">An association study</text><text x="850" y="158" font-size="16" font-weight="600" fill="#ffffff" text-anchor="end">DNA comparison</text><rect x="30" y="176" width="280" height="185" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="204" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AIM</text><text x="46" y="235.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Test for an association between</text><text x="46" y="256.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">bipolar disorder and</text><text x="46" y="277.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">polymorphisms in two genes:</text><text x="46" y="298.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the <tspan font-weight="700" fill="#1e2a44">5-HT2C</tspan> <tspan font-weight="700" fill="#1e2a44">receptor</tspan> gene and</text><text x="46" y="319.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the <tspan font-weight="700" fill="#1e2a44">serotonin</tspan> <tspan font-weight="700" fill="#1e2a44">transporter</tspan></text><text x="46" y="340.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">(5-HTT)</tspan> gene.</text><rect x="310" y="176" width="280" height="185" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="326" y="204" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SAMPLE</text><text x="326" y="235.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">42</tspan> patients with bipolar I</text><text x="326" y="256.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">disorder and <tspan font-weight="700" fill="#1e2a44">40</tspan> healthy</text><text x="326" y="277.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">controls.</text><rect x="590" y="176" width="280" height="185" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="606" y="204" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RESULTS</text><text x="606" y="235.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No significant association for</text><text x="606" y="256.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">either gene overall. Female</text><text x="606" y="277.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">patients showed <tspan font-weight="700" fill="#1e2a44">trends</tspan> towards</text><text x="606" y="298.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">association with both genes.</text><rect x="30" y="383" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="417.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Conclusion</text><text x="450" y="447.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Variation in these genes may cause only a <tspan font-weight="700" fill="#1e2a44">minor</tspan> increase in susceptibility to bipolar disorder,</text><text x="450" y="469.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">possibly in women.</text><clipPath id="tc516"><rect x="30" y="516" width="840" height="304" rx="14"/></clipPath><g clip-path="url(#tc516)"><rect x="30" y="516" width="182.970297029703" height="48" fill="#b5d3cf"/><text x="44" y="543.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Issue</text><rect x="212.970297029703" y="516" width="565.5445544554456" height="48" fill="#b5d3cf"/><text x="226.970297029703" y="543.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Point</text><rect x="778.5148514851486" y="516" width="91.4851485148515" height="48" fill="#b5d3cf"/><text x="792.5148514851486" y="543.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">+/−</text><rect x="30" y="564" width="182.970297029703" height="68" fill="#dce9e7"/><text x="44" y="590.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Objectivity</text><rect x="212.970297029703" y="564" width="565.5445544554456" height="68" fill="#ffffff"/><text x="226.970297029703" y="590.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Comparing patients with controls on specific genes is objective and</text><text x="226.970297029703" y="611.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">replicable.</text><rect x="778.5148514851486" y="564" width="91.4851485148515" height="68" fill="#dce9e7"/><text x="792.5148514851486" y="590.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">+</tspan></text><line x1="30" y1="632" x2="870" y2="632" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="632" width="182.970297029703" height="47" fill="#dce9e7"/><text x="44" y="658.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Sample</text><rect x="212.970297029703" y="632" width="565.5445544554456" height="47" fill="#f8faf9"/><text x="226.970297029703" y="658.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Small for detecting small genetic effects.</text><rect x="778.5148514851486" y="632" width="91.4851485148515" height="47" fill="#f6e3d8"/><text x="792.5148514851486" y="658.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">−</tspan></text><line x1="30" y1="679" x2="870" y2="679" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="679" width="182.970297029703" height="47" fill="#dce9e7"/><text x="44" y="705.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Scope</text><rect x="212.970297029703" y="679" width="565.5445544554456" height="47" fill="#ffffff"/><text x="226.970297029703" y="705.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Bipolar disorder, not unipolar depression.</text><rect x="778.5148514851486" y="679" width="91.4851485148515" height="47" fill="#f6e3d8"/><text x="792.5148514851486" y="705.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">−</tspan></text><line x1="30" y1="726" x2="870" y2="726" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="726" width="182.970297029703" height="47" fill="#dce9e7"/><text x="44" y="752.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Results</text><rect x="212.970297029703" y="726" width="565.5445544554456" height="47" fill="#f8faf9"/><text x="226.970297029703" y="752.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A trend is not a significant result.</text><rect x="778.5148514851486" y="726" width="91.4851485148515" height="47" fill="#f6e3d8"/><text x="792.5148514851486" y="752.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">−</tspan></text><line x1="30" y1="773" x2="870" y2="773" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="773" width="182.970297029703" height="47" fill="#dce9e7"/><text x="44" y="799.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Nature–nurture</text><rect x="212.970297029703" y="773" width="565.5445544554456" height="47" fill="#ffffff"/><text x="226.970297029703" y="799.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Genes contribute a small part of the risk, supporting a combined view.</text><rect x="778.5148514851486" y="773" width="91.4851485148515" height="47" fill="#f2e7b8"/><text x="792.5148514851486" y="799.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">±</tspan></text></g><line x1="212.970297029703" y1="516" x2="212.970297029703" y2="820" stroke="#c9d6d4" stroke-width="1.5"/><line x1="778.5148514851486" y1="516" x2="778.5148514851486" y2="820" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="516" width="840" height="304" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>