<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 765" width="900" height="765" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="765" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How the three antidepressants work</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Schematic synapse</text>
<rect x="30" y="124" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M260,154 L640,154 L640,234 Q450,274 260,234 Z" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="450" y="194" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">sending neuron</text><path d="M260,424 L640,424 L640,364 Q450,334 260,364 Z" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><text x="450" y="404" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">receiving neuron</text><circle cx="360" cy="294" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="410" cy="314" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="470" cy="299" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="520" cy="319" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="440" cy="329" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><path d="M560,304 Q610,284 600,242" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><text x="612" y="306" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">reuptake</text><line x1="575" y1="254" x2="625" y2="284" stroke="#b5602e" stroke-width="6"/><line x1="625" y1="254" x2="575" y2="284" stroke="#b5602e" stroke-width="6"/><rect x="290" y="290" width="50" height="34" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="315" y="313" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">MAO</text><text x="230" y="306" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">enzyme breaks</text><text x="230" y="324" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">down monoamines</text><line x1="700" y1="338" x2="530" y2="322" stroke="#8a6d0d" stroke-width="2"/><text x="706" y="344" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">monoamines</text><rect x="30" y="476" width="270.6666666666667" height="193" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="508" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TRICYCLICS</text><text x="50" y="534.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Block reuptake</text><text x="50" y="562" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">of serotonin and noradrenaline.</text><text x="50" y="582" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Dry mouth, drowsiness;</text><text x="50" y="602" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">dangerous in overdose.</text><rect x="314.6666666666667" y="476" width="270.6666666666667" height="193" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334.6666666666667" y="508" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MAOIs</text><text x="334.6666666666667" y="534.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Inhibit monoamine</text><text x="334.6666666666667" y="557.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">oxidase</text><text x="334.6666666666667" y="585" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">the enzyme that breaks down</text><text x="334.6666666666667" y="605" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">monoamines. Strict diet:</text><text x="334.6666666666667" y="625" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">tyramine-rich foods can raise</text><text x="334.6666666666667" y="645" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">blood pressure dangerously.</text><rect x="599.3333333333334" y="476" width="270.6666666666667" height="193" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="619.3333333333334" y="508" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SSRIs</text><text x="619.3333333333334" y="534.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Block serotonin reuptake</text><text x="619.3333333333334" y="562" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">selectively. Usually better</text><text x="619.3333333333334" y="582" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">tolerated; nausea; take weeks to</text><text x="619.3333333333334" y="602" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">work.</text><text x="450" y="703.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">All three: easy to administer, little effort from the patient; but relapse is common when they stop, and they treat</text><text x="450" y="724.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">symptoms, not causes.</text>
</svg>