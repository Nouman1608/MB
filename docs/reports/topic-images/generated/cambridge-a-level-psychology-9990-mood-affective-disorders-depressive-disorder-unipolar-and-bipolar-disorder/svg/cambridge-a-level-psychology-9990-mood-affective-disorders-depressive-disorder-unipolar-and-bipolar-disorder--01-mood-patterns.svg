<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 782" width="900" height="782" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="782" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Unipolar and bipolar patterns</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Schematic mood over time (illustrative)</text>
<rect x="30" y="124" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="160" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Depressive disorder</text><text x="50" y="186" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">unipolar: mood moves in one</text><text x="50" y="206" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">direction; single or recurrent</text><text x="50" y="226" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">episodes</text><line x1="300" y1="199" x2="850" y2="199" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="6 5"/><text x="850" y="191" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">usual mood</text><path d="M300,199 L360,199 C390,199 400,245 430,245 L560,245 C590,245 600,199 630,199 L850,199" fill="none" stroke="#2e6b62" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" /><text x="495" y="267" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">depressive episode ≥ 2 weeks</text><rect x="30" y="286" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="322" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Bipolar type I</text><text x="50" y="348" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">at least one manic or mixed</text><text x="50" y="368" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">episode</text><line x1="300" y1="361" x2="850" y2="361" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="6 5"/><text x="850" y="353" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">usual mood</text><path d="M300,361 C340,361 350,315 390,315 L500,315 C540,315 550,401 590,401 L700,401 C740,401 750,361 790,361 L850,361" fill="none" stroke="#2e6b62" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" /><text x="445" y="307" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">mania ≥ 1 week</text><text x="645" y="423" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">depression (usually)</text><rect x="30" y="448" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="484" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Bipolar type II</text><text x="50" y="510" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">at least one hypomanic and one</text><text x="50" y="530" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">depressive episode; no mania</text><line x1="300" y1="523" x2="850" y2="523" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="6 5"/><text x="850" y="515" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">usual mood</text><path d="M300,523 C340,523 350,499 390,499 L480,499 C520,499 530,567 570,567 L690,567 C730,567 740,523 780,523 L850,523" fill="none" stroke="#2e6b62" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" /><text x="435" y="489" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">hypomania (milder)</text><text x="630" y="589" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">depressive episode</text><rect x="30" y="620" width="840" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="652" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">MANIC EPISODE</text><text x="50" y="683.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">euphoria, irritability or expansiveness · increased activity or energy · rapid speech · racing thoughts ·</text><text x="50" y="704.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reduced need for sleep · distractibility · reckless behaviour · inflated self-esteem. <tspan font-weight="700" fill="#1e2a44">Hypomania</tspan> is milder,</text><text x="50" y="725.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">without marked impairment.</text>
</svg>