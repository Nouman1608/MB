<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 878" width="900" height="878" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="878" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Beck's cognitive theory of depression</text>

<rect x="30" y="100" width="253.33333333333334" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="156.66666666666669" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">CHILDHOOD</text><text x="156.66666666666669" y="158.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Negative schemas form</text><text x="156.66666666666669" y="186.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">e.g. through criticism or</text><text x="156.66666666666669" y="207.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">loss</text><line x1="289.33333333333337" y1="166" x2="317.33333333333337" y2="166" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="100" width="253.33333333333334" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450.00000000000006" y="142.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">LATER</text><text x="450.00000000000006" y="168.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">A stressful event</text><text x="450.00000000000006" y="197.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">triggers the schemas</text><line x1="582.6666666666667" y1="166" x2="610.6666666666667" y2="166" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="100" width="253.33333333333334" height="132" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="743.3333333333334" y="145" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">RESULT</text><text x="743.3333333333334" y="171.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Automatic negative</text><text x="743.3333333333334" y="194.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">thoughts</text><line x1="735" y1="238" x2="735" y2="290" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="298" width="840" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M450,368 L270,508 L630,508 Z" fill="#fbf1eb" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><rect x="340" y="308" width="220" height="60" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="342.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">View of the self</text><rect x="120" y="498" width="220" height="60" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="230" y="532.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">View of the world</text><rect x="560" y="498" width="220" height="60" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="670" y="532.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">View of the future</text><text x="450" y="468" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">NEGATIVE TRIAD</text><text x="450" y="634" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">KEPT IN PLACE BY COGNITIVE ERRORS</text><rect x="30" y="660" width="413" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="694.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Overgeneralisation</text><text x="50" y="722.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">one failure becomes "I always fail"</text><rect x="457" y="660" width="413" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="694.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Selective abstraction</text><text x="477" y="722.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">one negative detail, positives ignored</text><rect x="30" y="759" width="413" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="793.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Magnification and minimisation</text><text x="50" y="821.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">bad events exaggerated, good ones shrunk</text><rect x="457" y="759" width="413" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="793.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Personalisation</text><text x="477" y="821.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">responsibility for unrelated events</text>
</svg>