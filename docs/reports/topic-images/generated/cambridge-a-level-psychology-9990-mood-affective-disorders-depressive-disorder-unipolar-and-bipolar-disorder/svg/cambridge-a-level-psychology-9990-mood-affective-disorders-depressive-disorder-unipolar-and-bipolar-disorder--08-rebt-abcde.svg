<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Ellis's REBT: from ABC to DE</text>

<rect x="30" y="100" width="249.33333333333334" height="133" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="154.66666666666669" y="156.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">A</text><text x="154.66666666666669" y="183.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Activating event</text><line x1="285.33333333333337" y1="166.5" x2="319.33333333333337" y2="166.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="100" width="249.33333333333334" height="133" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="450.00000000000006" y="132" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">B</text><text x="450.00000000000006" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Belief</text><text x="450.00000000000006" y="187.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">e.g. "I must be liked by</text><text x="450.00000000000006" y="208.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">everyone"</text><line x1="580.6666666666667" y1="166.5" x2="614.6666666666667" y2="166.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="100" width="249.33333333333334" height="133" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="745.3333333333334" y="156.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">C</text><text x="745.3333333333334" y="183.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Consequence</text><line x1="450" y1="239" x2="450" y2="293" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="301" width="840" height="138" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="333" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">D: DISPUTING THE IRRATIONAL BELIEF</text><text x="50" y="364.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="364.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Logical</tspan>: "Does it follow that…?"</text><text x="50" y="389.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="389.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Empirical</tspan>: "Where is the evidence?"</text><text x="50" y="414.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="414.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Pragmatic</tspan>: "Does believing this help you?"</text><line x1="450" y1="445" x2="450" y2="499" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="250" y="507" width="400" height="85" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="539" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">E</text><text x="450" y="566.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Effective new beliefs</text><rect x="30" y="614" width="270.6666666666667" height="151" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="646" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BECK</text><text x="50" y="677.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Tests thoughts</text><text x="50" y="698.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">collaboratively</tspan> (collaborative</text><text x="50" y="719.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">empiricism) with a thought</text><text x="50" y="740.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">diary.</text><rect x="314.6666666666667" y="614" width="270.6666666666667" height="151" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334.6666666666667" y="646" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ELLIS</text><text x="334.6666666666667" y="677.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">More <tspan font-weight="700" fill="#1e2a44">direct</tspan> <tspan font-weight="700" fill="#1e2a44">and</tspan></text><text x="334.6666666666667" y="698.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">confrontational</tspan> disputing.</text><rect x="599.3333333333334" y="614" width="270.6666666666667" height="151" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="619.3333333333334" y="646" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BOTH</text><text x="619.3333333333334" y="677.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Need motivation and time;</text><text x="619.3333333333334" y="698.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">assume problems lie in</text><text x="619.3333333333334" y="719.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">thinking, not circumstances.</text>
</svg>