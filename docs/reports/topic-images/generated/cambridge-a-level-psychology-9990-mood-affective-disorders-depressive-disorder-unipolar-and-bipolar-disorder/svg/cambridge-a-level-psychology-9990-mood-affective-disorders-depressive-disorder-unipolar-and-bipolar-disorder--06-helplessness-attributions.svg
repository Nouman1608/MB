<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 592" width="900" height="592" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="592" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Learned helplessness and attributional style</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Seligman</text>
<rect x="30" y="124" width="395" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DOGS</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Shocks they could not escape</text><text x="50" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">later failed to escape even when they could</text><line x1="431" y1="180" x2="469" y2="180" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="475" y="124" width="395" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="495" y="156" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">HUMANS</text><text x="495" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Repeated uncontrollable bad events</text><text x="495" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">may lead to passivity and hopelessness</text><text x="450" y="272" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">REFORMULATED: HOW DEPRESSED PEOPLE EXPLAIN BAD EVENTS</text><rect x="30" y="298" width="270.6666666666667" height="110" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="165.33333333333334" y="342.5" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">INTERNAL</text><text x="165.33333333333334" y="370.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">"It's me"</text><rect x="314.6666666666667" y="298" width="270.6666666666667" height="110" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="330" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">STABLE</text><text x="450" y="357.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">"It will always be this</text><text x="450" y="382.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">way"</text><rect x="599.3333333333334" y="298" width="270.6666666666667" height="110" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="734.6666666666667" y="342.5" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">GLOBAL</text><text x="734.6666666666667" y="370.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">"It ruins everything"</text><rect x="30" y="430" width="840" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="464.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Seligman et al. (1988)</text><text x="50" y="493.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Depressed patients in cognitive therapy: explanatory style became <tspan font-weight="700" fill="#1e2a44">more</tspan> <tspan font-weight="700" fill="#1e2a44">optimistic</tspan> <tspan font-weight="700" fill="#1e2a44">as</tspan> <tspan font-weight="700" fill="#1e2a44">depression</tspan> <tspan font-weight="700" fill="#1e2a44">lifted</tspan>.</text><text x="50" y="514.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A link, but it does not show which comes first. Animal research raises ethical and generalisation</text><text x="50" y="535.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">concerns.</text>
</svg>