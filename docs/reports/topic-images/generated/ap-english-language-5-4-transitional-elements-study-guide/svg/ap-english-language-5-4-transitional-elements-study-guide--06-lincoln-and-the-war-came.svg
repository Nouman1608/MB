<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 628" width="900" height="628" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="628" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From agreement to division</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Lincoln, Second Inaugural Address, 1865</text>
<rect x="250" y="122" width="400" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="450" y="158.57999999999998" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Shared position</text><text x="450" y="187.42999999999998" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“Both parties deprecated war;”</text><rect x="400" y="228" width="100" height="40" rx="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" /><text x="450" y="254" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">but</text><line x1="450" y1="214" x2="450" y2="226" stroke="#1e2a44" stroke-width="3"/><path d="M420,270 C380,288 260,278 230,304" fill="none" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><path d="M480,270 C520,288 640,278 670,304" fill="none" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="308" width="400" height="90" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5" /><text x="230" y="347.01" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“one of them would make war <tspan font-weight="700">rather</tspan> <tspan font-weight="700">than</tspan></text><text x="230" y="369.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">let the nation survive;”</text><rect x="470" y="308" width="400" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="670" y="347.01" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“and the other would accept war <tspan font-weight="700">rather</tspan></text><text x="670" y="369.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">than</tspan> let it perish.”</text><line x1="230" y1="402" x2="420" y2="458" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="670" y1="402" x2="480" y2="458" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="300" y="464" width="300" height="70" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3" /><text x="450" y="504.99" font-size="21" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“<tspan font-weight="700">And</tspan> the war came.”</text><text x="450" y="566" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">“But” turns agreement into division; matching “rather than” clauses set out opposite choices; the plain</text><text x="450" y="587.12" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">“And” gives the outcome a flat, fateful tone.</text>
</svg>