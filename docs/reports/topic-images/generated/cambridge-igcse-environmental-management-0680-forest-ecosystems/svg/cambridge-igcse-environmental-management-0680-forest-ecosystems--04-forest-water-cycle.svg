<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 706" width="900" height="706" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="706" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Forests in the water cycle</text>

<rect x="30" y="110" width="410" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="110" width="410" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Forest</text><text x="665" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Cleared land</text><path d="M32,450 L438,490 L438,578 L32,578 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><path d="M462,450 L868,490 L868,578 L462,578 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><rect x="103.6" y="422.8" width="12.8" height="35.2" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><circle cx="110" cy="397.2" r="35.2" fill="#6f9a52" stroke="#1e2a44" stroke-width="2.5"/><rect x="222.4" y="428.2" width="15.2" height="41.8" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><circle cx="230" cy="397.8" r="41.8" fill="#6f9a52" stroke="#1e2a44" stroke-width="2.5"/><rect x="334" y="448" width="12" height="33" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><circle cx="340" cy="424" r="33" fill="#6f9a52" stroke="#1e2a44" stroke-width="2.5"/><line x1="60" y1="172" x2="55" y2="192" stroke="#2b5a9a" stroke-width="2.5"/><line x1="102" y1="184" x2="97" y2="204" stroke="#2b5a9a" stroke-width="2.5"/><line x1="144" y1="172" x2="139" y2="192" stroke="#2b5a9a" stroke-width="2.5"/><line x1="186" y1="184" x2="181" y2="204" stroke="#2b5a9a" stroke-width="2.5"/><line x1="228" y1="172" x2="223" y2="192" stroke="#2b5a9a" stroke-width="2.5"/><line x1="270" y1="184" x2="265" y2="204" stroke="#2b5a9a" stroke-width="2.5"/><line x1="312" y1="172" x2="307" y2="192" stroke="#2b5a9a" stroke-width="2.5"/><line x1="354" y1="184" x2="349" y2="204" stroke="#2b5a9a" stroke-width="2.5"/><line x1="396" y1="172" x2="391" y2="192" stroke="#2b5a9a" stroke-width="2.5"/><text x="110" y="344" font-size="15" font-weight="700" fill="#2b5a9a" text-anchor="middle">interception</text><line x1="245" y1="350" x2="280" y2="270" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><text x="250" y="258" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">transpiration</text><path d="M230,470 l-14,40 M230,470 l0,48 M230,470 l14,40" fill="none" stroke="#9c8f6e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="250" y="554" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">water uptake</text><line x1="110" y1="470" x2="110" y2="530" stroke="#2b5a9a" stroke-width="3" marker-end="url(#ah)"/><text x="56" y="556" font-size="15" font-weight="600" fill="#2b5a9a" text-anchor="start">soaks in</text><line x1="320" y1="484" x2="400" y2="492" stroke="#b5602e" stroke-width="2.5" marker-end="url(#ahR)"/><text x="330" y="516" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">little run-off</text><line x1="490" y1="172" x2="485" y2="192" stroke="#2b5a9a" stroke-width="2.5"/><line x1="532" y1="184" x2="527" y2="204" stroke="#2b5a9a" stroke-width="2.5"/><line x1="574" y1="172" x2="569" y2="192" stroke="#2b5a9a" stroke-width="2.5"/><line x1="616" y1="184" x2="611" y2="204" stroke="#2b5a9a" stroke-width="2.5"/><line x1="658" y1="172" x2="653" y2="192" stroke="#2b5a9a" stroke-width="2.5"/><line x1="700" y1="184" x2="695" y2="204" stroke="#2b5a9a" stroke-width="2.5"/><line x1="742" y1="172" x2="737" y2="192" stroke="#2b5a9a" stroke-width="2.5"/><line x1="784" y1="184" x2="779" y2="204" stroke="#2b5a9a" stroke-width="2.5"/><line x1="826" y1="172" x2="821" y2="192" stroke="#2b5a9a" stroke-width="2.5"/><rect x="530" y="447" width="14" height="10" rx="0" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.5"/><rect x="600" y="454" width="14" height="10" rx="0" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.5"/><text x="570" y="430" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">stumps</text><line x1="560" y1="472" x2="840" y2="484" stroke="#b5602e" stroke-width="6" marker-end="url(#ahR)"/><text x="560" y="360" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">more surface run-off,</text><text x="560" y="380" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">reaching rivers faster</text><text x="560" y="300" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">no canopy: rain hits</text><text x="560" y="318" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">bare soil</text><line x1="820" y1="520" x2="860" y2="520" stroke="#8a6d0d" stroke-width="0"/><text x="665" y="546" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">topsoil washed away</text><text x="858" y="568" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Not to scale</text><rect x="30" y="600" width="840" height="76" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="631.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Interception and uptake slow water on its way to rivers, so floods are lower and later;</text><text x="48" y="653.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">roots and leaf litter protect the soil.</text>
</svg>