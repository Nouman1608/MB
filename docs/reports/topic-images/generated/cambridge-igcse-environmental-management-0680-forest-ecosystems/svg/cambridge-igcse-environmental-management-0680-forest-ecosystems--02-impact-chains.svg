<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="900" height="630" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="630" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Impacts of deforestation as chains</text>

<rect x="330" y="110" width="240" height="56" rx="12" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="143.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Deforestation</text><polyline points="450,166 450,186 127.5,186 127.5,206" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="30" y="210" width="195" height="94" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="127.5" y="261.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Habitat loss</text><line x1="127.5" y1="306" x2="127.5" y2="336" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="340" width="195" height="94" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="127.5" y="381.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Loss of</text><text x="127.5" y="401.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">biodiversity</text><line x1="127.5" y1="436" x2="127.5" y2="466" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="470" width="195" height="94" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="127.5" y="521.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Genetic depletion</text><polyline points="450,166 450,186 342.5,186 342.5,206" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="245" y="210" width="195" height="94" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="342.5" y="241.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Less interception</text><text x="342.5" y="261.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">and uptake; bare</text><text x="342.5" y="281.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">soil</text><line x1="342.5" y1="306" x2="342.5" y2="336" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="245" y="340" width="195" height="94" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="342.5" y="381.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Soil erosion (and</text><text x="342.5" y="401.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">desertification)</text><line x1="342.5" y1="436" x2="342.5" y2="466" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="245" y="470" width="195" height="94" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="342.5" y="511.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Silting and</text><text x="342.5" y="531.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">flooding</text><polyline points="450,166 450,186 557.5,186 557.5,206" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="460" y="210" width="195" height="94" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="557.5" y="261.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Less transpiration</text><line x1="557.5" y1="306" x2="557.5" y2="336" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="460" y="340" width="195" height="94" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="557.5" y="381.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Less water vapour</text><text x="557.5" y="401.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">recycled</text><line x1="557.5" y1="436" x2="557.5" y2="466" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="460" y="470" width="195" height="94" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="557.5" y="511.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Changes to</text><text x="557.5" y="531.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">rainfall patterns</text><polyline points="450,166 450,186 772.5,186 772.5,206" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="675" y="210" width="195" height="94" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="772.5" y="251.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Trees burned or</text><text x="772.5" y="271.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">rot</text><line x1="772.5" y1="306" x2="772.5" y2="336" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="675" y="340" width="195" height="94" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="772.5" y="371.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Carbon released as</text><text x="772.5" y="391.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">CO₂; fewer trees</text><text x="772.5" y="411.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">absorb it</text><line x1="772.5" y1="436" x2="772.5" y2="466" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="675" y="470" width="195" height="94" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="772.5" y="521.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Global warming</text>
</svg>