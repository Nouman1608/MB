xt-anchor="middle">0</text><line x1="206" y1="500" x2="206" y2="507" stroke="#1e2a44" stroke-width="2"/><text x="206" y="528" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">6</text><line x1="336.66666666666663" y1="500" x2="336.66666666666663" y2="507" stroke="#1e2a44" stroke-width="2"/><text x="336.66666666666663" y="528" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">20</text><line x1="523.3333333333333" y1="500" x2="523.3333333333333" y2="507" stroke="#1e2a44" stroke-width="2"/><text x="523.3333333333333" y="528" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">40</text><line x1="710" y1="500" x2="710" y2="507" stroke="#1e2a44" stroke-width="2"/><text x="710" y="528" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">60</text><path d="M150,140 L150,500 L710,500" fill="none" stroke="#1e2a44" stroke-width="2.5"/><text x="430" y="560" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Years after first survey</text><text x="0" y="0" transform="translate(88,320) rotate(-90)" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Forest area (km²)</text><line x1="150" y1="176" x2="206" y2="208.39999999999998" stroke="#6f9a52" stroke-width="5"/><line x1="206" y1="208.39999999999998" x2="710" y2="500" stroke="#b5602e" stroke-width="3" stroke-dasharray="10 7"/><circle cx="150" cy="176" r="8" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><circle cx="206" cy="208.39999999999998" r="8" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><circle cx="710" cy="500" r="7" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="164" y="164" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">5,400</text><text x="220" y="200.39999999999998" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">4,860</text><text x="224.66666666666669" y="410" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">if 90 km² a year continue