<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="670" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Sustainable forest management</text>

<path d="M450,180 L280,430 L620,430 Z" fill="none" stroke="#8a6d0d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 7"/><circle cx="450" cy="180" r="78" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="450" y="187" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Environment</text><circle cx="280" cy="430" r="78" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="280" y="437" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Wildlife</text><circle cx="620" cy="430" r="78" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="620" y="437" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Humans</text><text x="450" y="352" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="middle">balance</text><line x1="720" y1="300" x2="830" y2="300" stroke="#2e6b62" stroke-width="5" marker-end="url(#ahT)"/><text x="775" y="280" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">future</text><text x="775" y="330" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">generations</text><rect x="30" y="540" width="840" height="80" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="572.04" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Sustainable management of forests: balancing the needs of the environment,</text><text x="450" y="596.04" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">wildlife and humans while conserving forests for future generations.</text><text x="450" y="648" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">Leaving out humans turns it into simple preservation.</text>
</svg>