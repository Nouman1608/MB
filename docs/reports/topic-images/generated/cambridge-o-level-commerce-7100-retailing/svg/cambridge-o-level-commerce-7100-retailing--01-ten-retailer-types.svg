<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 615" width="900" height="615" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="615" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Ten types of retailer</text>

<rect x="30" y="110" width="410" height="450" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="235" y="146" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="middle">Small-scale</text><rect x="46" y="166" width="378" height="66" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="62" y="193" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Itinerant retailer</text><text x="62" y="217" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">no fixed shop; moves place to place</text><rect x="46" y="242" width="378" height="66" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="62" y="269" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Vending machine</text><text x="62" y="293" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">automatic; drinks or snacks</text><rect x="46" y="318" width="378" height="66" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="62" y="345" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Independent retailer</text><text x="62" y="369" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">one shop, sole trader or family</text><rect x="46" y="394" width="378" height="66" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="62" y="421" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Street market</text><text x="62" y="445" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">stalls on set days</text><rect x="46" y="470" width="378" height="66" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="62" y="497" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Speciality shop</text><text x="62" y="521" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">one product type, e.g. sports goods</text><rect x="460" y="110" width="410" height="450" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="665" y="146" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Large-scale</text><rect x="476" y="166" width="378" height="66" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="492" y="193" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Online retailer*</text><text x="492" y="217" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">website or app; delivered or collected</text><rect x="476" y="242" width="378" height="66" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="492" y="269" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Multiple chain store</text><text x="492" y="293" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">many branches, one name, central control</text><rect x="476" y="318" width="378" height="66" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="492" y="345" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Supermarket</text><text x="492" y="369" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">self-service; mainly food and household</text><rect x="476" y="394" width="378" height="66" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="492" y="421" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Hypermarket</text><text x="492" y="445" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">very large, out of town; non-food too</text><rect x="476" y="470" width="378" height="66" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="492" y="497" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Department store</text><text x="492" y="521" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">city centre; many departments</text><text x="450" y="590" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">* Online retailers range from one-person websites to global companies: judge scale from the case.</text>
</svg>