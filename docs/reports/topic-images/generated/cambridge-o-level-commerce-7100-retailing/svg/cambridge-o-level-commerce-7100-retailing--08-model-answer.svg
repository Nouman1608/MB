<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" width="900" height="590" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="590" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Recommending one technique: 4 marks</text>

<circle cx="70" cy="160" r="26" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="70" y="169.36" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="115" y="110" width="755" height="100" rx="12" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5"/><text x="137" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Name the technique</text><text x="137" y="176" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Start a loyalty programme.</text><line x1="70" y1="188" x2="70" y2="250" stroke="#1e2a44" stroke-width="3"/><circle cx="70" cy="278" r="26" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="287.36" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="115" y="228" width="755" height="100" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="137" y="264" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Explain how it works</text><text x="137" y="294" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Customers earn points each time they buy, to spend on future purchases.</text><line x1="70" y1="306" x2="70" y2="368" stroke="#1e2a44" stroke-width="3"/><circle cx="70" cy="396" r="26" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="405.36" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="115" y="346" width="755" height="100" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="137" y="382" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Link to the problem</text><text x="137" y="412" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Regular customers have a reason to keep returning instead of trying the</text><text x="137" y="433" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">hypermarket.</text><line x1="70" y1="424" x2="70" y2="486" stroke="#1e2a44" stroke-width="3"/><circle cx="70" cy="514" r="26" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="70" y="523.36" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="115" y="464" width="755" height="100" rx="12" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5"/><text x="137" y="500" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Justify for this shop</text><text x="137" y="530" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">It can use the data for personal birthday offers, which a hypermarket is unlikely</text><text x="137" y="551" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to do.</text>
</svg>