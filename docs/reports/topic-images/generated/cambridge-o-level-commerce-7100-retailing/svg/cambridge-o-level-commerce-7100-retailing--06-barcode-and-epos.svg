or="middle">Sale: a computerised</text><text x="455" y="264" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">till</text><line x1="578" y1="190" x2="640" y2="160" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="578" y1="280" x2="640" y2="310" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="650" y="120" width="220" height="80" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="760" y="154.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Records</text><text x="760" y="176.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">each sale</text><rect x="650" y="270" width="220" height="80" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="760" y="304.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Updates stock</text><text x="760" y="326.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">records</text><rect x="30" y="380" width="840" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="422" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">Barcoding is the code on the product; EPoS is the till system that reads it.</text>
