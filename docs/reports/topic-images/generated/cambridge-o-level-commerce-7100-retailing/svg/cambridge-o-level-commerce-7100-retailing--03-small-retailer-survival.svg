<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="900" height="630" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="630" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why the small retailer survives</text>

<rect x="330" y="110" width="240" height="70" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="139.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Small-scale retailer</text><text x="450" y="163.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">e.g. a corner shop</text><path d="M450,184 C450,215 165,205 165,232" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="30" y="240" width="270" height="165" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="165" y="276" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Personal service</text><text x="48" y="310" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Knows regular customers by</text><text x="48" y="331" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">name and remembers their</text><text x="48" y="352" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">preferences</text><path d="M450,184 C450,215 450,205 450,232" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="315" y="240" width="270" height="165" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="276" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Flexible opening hours</text><text x="333" y="310" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Opens early, late or on</text><text x="333" y="331" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">public holidays when large</text><text x="333" y="352" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">stores cannot</text><path d="M450,184 C450,215 735,205 735,232" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="600" y="240" width="270" height="165" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="735" y="276" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Additional services</text><text x="618" y="310" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Home delivery for the</text><text x="618" y="331" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">elderly, informal credit,</text><text x="618" y="352" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">phone credit, bill payments</text><text x="450" y="435" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">The three syllabus examples: hard for large retailers to copy</text><rect x="30" y="455" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="490" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Other reasons you can apply</text><rect x="54" y="510" width="250" height="70" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="179" y="540.1" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Location close</text><text x="179" y="561.1" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">to homes</text><rect x="324" y="510" width="250" height="70" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="449" y="540.1" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Sells small</text><text x="449" y="561.1" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">quantities</text><rect x="594" y="510" width="252" height="70" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="720" y="540.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Voluntary chains:</text><text x="720" y="560.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">buy together via a wholesaler</text>
</svg>