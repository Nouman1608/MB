<rect width="900" height="595" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How ecommerce affects traditional commerce</text>

<rect x="30" y="110" width="410" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="148" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Positive impacts</text><circle cx="66" cy="184.05" r="12" fill="#2e6b62"/><path d="M60.6,184.29000000000002 L64.8,188.61 L72,179.85000000000002" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="86" y="190" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">24/7 selling opportunities</text><circle cx="66" cy="222.05" r="12" fill="#2e6b62"/><path d="M60.6,222.29000000000002 L64.8,226.61 L72,217.85000000000002" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="86" y="228" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">More potential customers, including</text><text x="86" y="250" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">overseas</text><circle cx="66" cy="282.05" r="12" fill="#2e6b62"/><path d="M60.6,282.29 L64.8,286.61 L72,277.85" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="86" y="288" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Increased revenue</text><circle cx="66" cy="320.05" r="12" fill="#2e6b62"/><path d="M60.6,320.29 L64.8,324.61 L72,315.85" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="86" y="326" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Targeted marketing using customer</text><text x="86" y="348" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">data</text><circle cx="66" cy="380.05" r="12" fill="#2e6b62"/><path d="M60.6,380.29 L64.8,384.61 L72,375.85" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="86" y="386" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Reduced operating store costs</text><rect x="460" y="110" width="410" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="484" y="148" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Negative impacts</text><circle cx="496" cy="184.05" r="12" fill="#b5602e"/><path d="M491.44,179.49 L500.56,188.61 M500.56,179.49 L491.44,188.61" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="516" y="190" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Increased delivery costs</text><circle cx="496" cy="222.05" r="12" fill="#b5602e"/><path d="M491.44,217.49 L500.56,226.61 M500.56,217.49 L491.44,226.61" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="516" y="228" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Staff training in new systems</text><circle cx="496" cy="260.05" r="12" fill="#b5602e"/><path d="M491.44,255.49 L500.56,264.61 M500.56,255.49 L491.44,264.61" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="516" y="266" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Larger warehousing space needed</text><circle cx="496" cy="298.05" r="12" fill="#b5602e"/><path d="M491.44,293.49 L500.56,302.61 M500.56,293.49 L491.44,302.61" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="516" y="304" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Website maintenance costs</text><rect x="30" y="460" width="840" height="110" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="494" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">Example: a bookshop adds a website</text><text x="54" y="524" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Gains: readers nationwide.</text><text x="54" y="550" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">Costs: packaging, couriers, and keeping the site secure and up to date.</text>
</svg>