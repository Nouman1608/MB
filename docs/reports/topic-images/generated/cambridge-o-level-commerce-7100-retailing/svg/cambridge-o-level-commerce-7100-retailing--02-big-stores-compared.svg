<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" width="900" height="530" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="530" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Supermarket, hypermarket or department store?</text>

<rect x="30" y="110" width="270" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="110" width="270" height="56" rx="14" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5"/><text x="165" y="146" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Supermarket</text><circle cx="56" cy="194" r="5" fill="#1e2a44"/><text x="70" y="200" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Large self-service store</text><circle cx="56" cy="225" r="5" fill="#1e2a44"/><text x="70" y="231" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mainly food and household</text><text x="70" y="252" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">goods</text><line x1="48" y1="290" x2="282" y2="290" stroke="#c9d6d4" stroke-width="2"/><circle cx="60" cy="322" r="12" fill="#2e6b62"/><path d="M54.6,322.24 L58.8,326.56 L66,317.8" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="82" y="328" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Low prices; one-stop</text><text x="82" y="349" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">shopping</text><circle cx="60" cy="400" r="12" fill="#b5602e"/><path d="M55.44,395.44 L64.56,404.56 M64.56,395.44 L55.44,404.56" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="82" y="406" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Impersonal; impulse</text><text x="82" y="427" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">buying</text><rect x="315" y="110" width="270" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="315" y="110" width="270" height="56" rx="14" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="146" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Hypermarket</text><circle cx="341" cy="194" r="5" fill="#1e2a44"/><text x="355" y="200" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Very large, often out of</text><text x="355" y="221" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">town</text><circle cx="341" cy="246" r="5" fill="#1e2a44"/><text x="355" y="252" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Food and non-food; large</text><text x="355" y="273" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">car parks</text><line x1="333" y1="290" x2="567" y2="290" stroke="#c9d6d4" stroke-width="2"/><circle cx="345" cy="322" r="12" fill="#2e6b62"/><path d="M339.6,322.24 L343.8,326.56 L351,317.8" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="367" y="328" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lowest prices; free</text><text x="367" y="349" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">parking</text><circle cx="345" cy="400" r="12" fill="#b5602e"/><path d="M340.44,395.44 L349.56,404.56 M349.56,395.44 L340.44,404.56" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="367" y="406" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Needs a car; draws</text><text x="367" y="427" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">trade from town</text><rect x="600" y="110" width="270" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="600" y="110" width="270" height="56" rx="14" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5"/><text x="735" y="146" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Department store</text><circle cx="626" cy="194" r="5" fill="#1e2a44"/><text x="640" y="200" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Usually city centre</text><circle cx="626" cy="225" r="5" fill="#1e2a44"/><text x="640" y="231" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Many separate departments</text><line x1="618" y1="290" x2="852" y2="290" stroke="#c9d6d4" stroke-width="2"/><circle cx="630" cy="322" r="12" fill="#2e6b62"/><path d="M624.6,322.24 L628.8,326.56 L636,317.8" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="652" y="328" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Wide range; cafés,</text><text x="652" y="349" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">delivery, gift wrapping</text><circle cx="630" cy="400" r="12" fill="#b5602e"/><path d="M625.44,395.44 L634.56,404.56 M634.56,395.44 L625.44,404.56" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="652" y="406" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">High prices and running</text><text x="652" y="427" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">costs</text><text x="450" y="505" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">A large supermarket is not a hypermarket: give the out-of-town site, non-food goods and car parks.</text>
</svg>