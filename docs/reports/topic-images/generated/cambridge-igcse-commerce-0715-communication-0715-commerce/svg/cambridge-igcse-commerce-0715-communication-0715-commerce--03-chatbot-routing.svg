<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 565" width="900" height="565" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="565" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What a chatbot does with a question</text>

<rect x="30" y="230" width="200" height="80" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="130" y="264.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Customer asks</text><text x="130" y="288.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">a question</text><line x1="238" y1="270" x2="300" y2="270" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="310" y="215" width="210" height="110" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="415" y="264.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Chatbot</text><text x="415" y="288.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">in a chat window</text><text x="415" y="352" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">set answers or AI</text><path d="M528,245 C560,200 570,170 600,165" fill="none" stroke="#2e6b62" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ahT)"/><path d="M528,295 C560,340 570,375 600,380" fill="none" stroke="#b5602e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ahR)"/><rect x="605" y="95" width="265" height="170" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="625" y="128" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Simple, repeated</text><text x="625" y="156" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">e.g. opening times, order</text><text x="625" y="177" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">tracking</text><text x="625" y="214" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Answered automatically, 24</text><text x="625" y="235" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">hours a day</text><rect x="605" y="300" width="265" height="150" rx="12" fill="#f3d9c8" stroke="#b5602e" stroke-width="2.5"/><text x="625" y="333" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Unusual or complex</text><text x="625" y="365" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Passed to human staff</text><text x="625" y="400" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Chatbots cannot handle</text><text x="625" y="421" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">these</text><rect x="30" y="470" width="840" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="512" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Low cost for common questions, but customers may find chatbots frustrating.</text>
</svg>