<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="680" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Eight methods: one strength, one weakness</text>

<rect x="30" y="110" width="410" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="144" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Letter</text><circle cx="62" cy="172" r="11" fill="#2e6b62"/><path d="M57.05,172.22 L60.9,176.18 L67.5,168.15" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="84" y="178" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Formal, with a permanent record</text><circle cx="62" cy="208" r="11" fill="#b5602e"/><path d="M57.82,203.82 L66.18,212.18 M66.18,203.82 L57.82,212.18" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="84" y="214" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Slow; postage cost; no instant reply</text><rect x="460" y="110" width="410" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="144" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Telephone</text><circle cx="492" cy="172" r="11" fill="#2e6b62"/><path d="M487.05,172.22 L490.9,176.18 L497.5,168.15" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="514" y="178" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Instant two-way conversation</text><circle cx="492" cy="208" r="11" fill="#b5602e"/><path d="M487.82,203.82 L496.18,212.18 M496.18,203.82 L487.82,212.18" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="514" y="214" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">No written record unless recorded</text><rect x="30" y="250" width="410" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="284" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Face to face</text><circle cx="62" cy="312" r="11" fill="#2e6b62"/><path d="M57.05,312.22 L60.9,316.18 L67.5,308.15" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="84" y="318" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Body language and tone build trust</text><circle cx="62" cy="348" r="11" fill="#b5602e"/><path d="M57.82,343.82 L66.18,352.18 M66.18,343.82 L57.82,352.18" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="84" y="354" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Travel time and cost</text><rect x="460" y="250" width="410" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="284" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Videoconferencing</text><circle cx="492" cy="312" r="11" fill="#2e6b62"/><path d="M487.05,312.22 L490.9,316.18 L497.5,308.15" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="514" y="318" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Face-to-face contact over distance</text><circle cx="492" cy="348" r="11" fill="#b5602e"/><path d="M487.82,343.82 L496.18,352.18 M496.18,343.82 L487.82,352.18" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="514" y="354" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Needs reliable internet and equipment</text><rect x="30" y="390" width="410" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="424" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Email</text><circle cx="62" cy="452" r="11" fill="#2e6b62"/><path d="M57.05,452.22 L60.9,456.18 L67.5,448.15" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="84" y="458" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fast, cheap, written record, attachments</text><circle cx="62" cy="488" r="11" fill="#b5602e"/><path d="M57.82,483.82 L66.18,492.18 M66.18,483.82 L57.82,492.18" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="84" y="494" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Can be ignored, lost or hacked</text><rect x="460" y="390" width="410" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="424" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Web-based chat</text><circle cx="492" cy="452" r="11" fill="#2e6b62"/><path d="M487.05,452.22 L490.9,456.18 L497.5,448.15" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="514" y="458" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Instant; chatbots answer 24 hours a day</text><circle cx="492" cy="488" r="11" fill="#b5602e"/><path d="M487.82,483.82 L496.18,492.18 M496.18,483.82 L487.82,492.18" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="514" y="494" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Chatbots cannot handle complex problems</text><rect x="30" y="530" width="410" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="564" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Social media</text><circle cx="62" cy="592" r="11" fill="#2e6b62"/><path d="M57.05,592.22 L60.9,596.18 L67.5,588.15" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="84" y="598" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Reaches large audiences cheaply; two-way</text><circle cx="62" cy="628" r="11" fill="#b5602e"/><path d="M57.82,623.82 L66.18,632.18 M66.18,623.82 L57.82,632.18" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="84" y="634" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Negative comments spread quickly</text><rect x="460" y="530" width="410" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="564" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Posters</text><circle cx="492" cy="592" r="11" fill="#2e6b62"/><path d="M487.05,592.22 L490.9,596.18 L497.5,588.15" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="514" y="598" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Eye-catching, seen by passers-by, cheap</text><circle cx="492" cy="628" r="11" fill="#b5602e"/><path d="M487.82,623.82 L496.18,632.18 M496.18,623.82 L487.82,632.18" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="514" y="634" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">One-way; limited information</text>
</svg>