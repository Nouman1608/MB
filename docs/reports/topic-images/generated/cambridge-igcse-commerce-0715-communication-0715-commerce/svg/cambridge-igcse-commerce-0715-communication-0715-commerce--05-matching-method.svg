<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" width="900" height="760" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="760" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Matching the method to the situation</text>

<text x="40" y="130" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Situation</text><text x="420" y="130" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Key factors</text><text x="640" y="130" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Method</text><rect x="30" y="145" width="840" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="177" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Factory machine broken; needs an engineer</text><text x="48" y="198" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">today</text><text x="420" y="189" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">Urgency</text><line x1="600" y1="183" x2="630" y2="183" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="640" y="189" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Telephone</text><rect x="30" y="231" width="840" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="275" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Bank sends a customer a new PIN</text><text x="420" y="263" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">Security,</text><text x="420" y="284" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">importance</text><line x1="600" y1="269" x2="630" y2="269" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="640" y="263" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Letter by post or secure</text><text x="640" y="284" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">app message</text><rect x="30" y="317" width="840" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="349" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sales team in four countries plans a</text><text x="48" y="370" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">launch</text><text x="420" y="349" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">Distance, cost,</text><text x="420" y="370" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">discussion</text><line x1="600" y1="355" x2="630" y2="355" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="640" y="361" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Videoconferencing</text><rect x="30" y="403" width="840" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="435" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Shop tells local people about a weekend</text><text x="48" y="456" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sale</text><text x="420" y="447" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">Cost, audience</text><line x1="600" y1="441" x2="630" y2="441" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="640" y="435" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Posters in the window and</text><text x="640" y="456" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">social media</text><rect x="30" y="489" width="840" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="521" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Signed contract to a buyer with weak</text><text x="48" y="542" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">internet</text><text x="420" y="521" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">Importance,</text><text x="420" y="542" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">networks</text><line x1="600" y1="527" x2="630" y2="527" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="640" y="533" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Letter by recorded post</text><rect x="30" y="575" width="840" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="607" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Manager tells an employee their job is</text><text x="48" y="628" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">changing</text><text x="420" y="607" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">Importance,</text><text x="420" y="628" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">sensitivity</text><line x1="600" y1="613" x2="630" y2="613" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="640" y="607" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Face to face, then a</text><text x="640" y="628" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">letter</text><rect x="30" y="661" width="840" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="693" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Hundreds of “where is my order?”</text><text x="48" y="714" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">questions daily</text><text x="420" y="693" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">Cost, urgency,</text><text x="420" y="714" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">24-hour demand</text><line x1="600" y1="699" x2="630" y2="699" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="640" y="693" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Chatbot, with option to</text><text x="640" y="714" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">reach a person</text>
</svg>