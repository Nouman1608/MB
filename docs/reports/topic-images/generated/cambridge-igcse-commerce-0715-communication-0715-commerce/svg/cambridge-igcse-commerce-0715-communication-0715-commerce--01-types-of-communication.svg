<rect width="900" height="615" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four types of communication</text>

<rect x="30" y="110" width="195" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="110" width="195" height="52" rx="14" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="127" y="144" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Written</text><text x="46" y="192" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Words on paper or</text><text x="46" y="213" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">screen; a permanent</text><text x="46" y="234" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">record</text><text x="46" y="271" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">e.g. Letter, email,</text><text x="46" y="292" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">report, contract</text><rect x="245" y="110" width="195" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="245" y="110" width="195" height="52" rx="14" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5"/><text x="342" y="144" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Oral</text><text x="261" y="192" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Spoken, in person</text><text x="261" y="213" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">or at a distance</text><text x="261" y="250" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">e.g. Face-to-face</text><text x="261" y="271" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">meeting, telephone</text><text x="261" y="292" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">call</text><rect x="460" y="110" width="195" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="110" width="195" height="52" rx="14" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="557" y="144" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Electronic</text><text x="476" y="192" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sent through</text><text x="476" y="213" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">digital devices and</text><text x="476" y="234" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">networks</text><text x="476" y="271" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">e.g. Email, web</text><text x="476" y="292" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">chat, social media,</text><text x="476" y="313" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">videoconferencing</text><rect x="675" y="110" width="195" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="675" y="110" width="195" height="52" rx="14" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5"/><text x="772" y="144" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Visual</text><text x="691" y="192" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Images, signs,</text><text x="691" y="213" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">charts or video</text><text x="691" y="250" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">e.g. Poster, chart,</text><text x="691" y="271" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">product video, logo</text><rect x="30" y="385" width="840" height="205" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="422" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The types overlap</text><text x="54" y="475" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">An email</text><text x="250" y="475" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">=</text><rect x="280" y="447" width="150" height="42" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="355" y="473.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Written</text><text x="454" y="475" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><rect x="470" y="447" width="150" height="42" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="545" y="473.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Electronic</text><text x="54" y="540" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A videoconference</text><text x="250" y="540" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">=</text><rect x="280" y="512" width="150" height="42" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="355" y="538.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Oral</text><text x="454" y="540" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><rect x="470" y="512" width="150" height="42" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="545" y="538.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Visual</text><text x="644" y="540" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><rect x="660" y="512" width="150" height="42" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="735" y="538.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Electronic</text>
</svg>