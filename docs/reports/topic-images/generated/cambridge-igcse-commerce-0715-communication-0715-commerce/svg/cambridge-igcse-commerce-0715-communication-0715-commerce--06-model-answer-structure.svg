<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" width="900" height="590" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="590" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A 4-mark recommendation, step by step</text>

<circle cx="70" cy="160" r="26" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="70" y="169.36" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="115" y="110" width="640" height="100" rx="12" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5"/><text x="137" y="144" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Recommend</text><text x="137" y="172" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">TravelEase should use email.</text><rect x="775" y="140" width="95" height="40" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="822.5" y="166.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">[1]</text><line x1="70" y1="190" x2="70" y2="250" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><circle cx="70" cy="278" r="26" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="287.36" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="115" y="228" width="640" height="100" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="137" y="262" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Factor 1, applied</text><text x="137" y="290" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A written record of flight times, prices and booking references, which</text><text x="137" y="311" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a telephone call does not give.</text><rect x="775" y="258" width="95" height="40" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="822.5" y="284.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">[1]</text><line x1="70" y1="308" x2="70" y2="368" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><circle cx="70" cy="396" r="26" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="405.36" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="115" y="346" width="640" height="100" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="137" y="380" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Factor 2, applied</text><text x="137" y="408" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cheap and fast: many confirmations sent in seconds, with etickets</text><text x="137" y="429" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">attached.</text><rect x="775" y="376" width="95" height="40" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="822.5" y="402.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">[1]</text><line x1="70" y1="426" x2="70" y2="486" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><circle cx="70" cy="514" r="26" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="70" y="523.36" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="115" y="464" width="640" height="100" rx="12" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5"/><text x="137" y="498" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Beat the alternative</text><text x="137" y="526" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Despite the hacking risk, it suits better than a letter, which is too</text><text x="137" y="547" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">slow for customers travelling soon.</text><rect x="775" y="494" width="95" height="40" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="822.5" y="520.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">[1]</text>
</svg>