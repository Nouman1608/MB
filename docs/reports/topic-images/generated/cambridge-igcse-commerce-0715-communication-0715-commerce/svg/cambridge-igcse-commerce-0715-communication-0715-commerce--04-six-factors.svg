<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750" width="900" height="750" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="750" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Six factors that steer the choice</text>

<text x="150" y="128" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">Factor</text><text x="250" y="128" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Question to ask</text><text x="560" y="128" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Methods it favours</text><rect x="30" y="142" width="840" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="46" y="162" width="190" height="48" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="141" y="192.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Urgency</text><text x="250" y="178" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">How quickly must it arrive, or a</text><text x="250" y="199" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reply come back?</text><text x="560" y="178" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Telephone, web chat,</text><text x="560" y="199" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">videoconferencing, email</text><rect x="30" y="242" width="840" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="46" y="262" width="190" height="48" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="141" y="292.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Cost</text><text x="250" y="278" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">What can the business afford, per</text><text x="250" y="299" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">message and in equipment?</text><text x="560" y="274" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Email, social media, chat</text><text x="560" y="295" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">Avoid travel for face to face</text><rect x="30" y="342" width="840" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="46" y="362" width="190" height="48" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="141" y="392.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Security</text><text x="250" y="378" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Is the information confidential?</text><text x="560" y="374" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Face to face, registered letter,</text><text x="560" y="395" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">encrypted email</text><text x="560" y="416" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">Avoid social media</text><rect x="30" y="442" width="840" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="46" y="462" width="190" height="48" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="141" y="492.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Distance</text><text x="250" y="478" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">How far apart are sender and</text><text x="250" y="499" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">receiver?</text><text x="560" y="478" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Videoconferencing, email,</text><text x="560" y="499" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">telephone</text><rect x="30" y="542" width="840" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="46" y="562" width="190" height="48" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="141" y="581.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Availability</text><text x="141" y="601.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">of networks</text><text x="250" y="578" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Does the receiver have internet</text><text x="250" y="599" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">or phone coverage?</text><text x="560" y="578" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Letter or telephone where internet</text><text x="560" y="599" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">is poor</text><rect x="30" y="642" width="840" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="46" y="662" width="190" height="48" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="141" y="692.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Importance</text><text x="250" y="678" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Does it need a record, signature</text><text x="250" y="699" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">or personal touch?</text><text x="560" y="678" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Letter or email for a record; face</text><text x="560" y="699" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">to face for serious matters</text>
</svg>