<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Paper 1: answer two of three questions</text>

<rect x="30" y="110" width="840" height="167" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="143" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">QUESTION 1 · COMPULSORY</text><text x="50" y="170.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Topic 1: Research Methods</text><text x="50" y="200.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="200.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">1.1 How do sociologists approach the study of society?</text><text x="50" y="226.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="226.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">1.2 What types of data and evidence do sociologists use?</text><text x="50" y="252.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="252.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">1.3 How do sociologists investigate society?</text><rect x="330" y="301" width="240" height="40" rx="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="328" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">then choose ONE of</text><rect x="30" y="361" width="390" height="231" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="394" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TOPIC 2</text><text x="50" y="420.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Identity: Self and Society</text><text x="50" y="448.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="448.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">2.1 How do we learn our identity?</text><text x="50" y="474.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="474.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">2.2 How does society control us?</text><text x="50" y="500.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="500.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">2.3 What influences our social identity?</text><rect x="480" y="361" width="390" height="231" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="500" y="394" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TOPIC 3</text><text x="500" y="420.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Social Stratification and</text><text x="500" y="445.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Inequality</text><text x="500" y="473.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="515.2" y="473.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">3.1 What is social stratification?</text><text x="500" y="499.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="515.2" y="499.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">3.2 What attempts have been made to</text><text x="515.2" y="520.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reduce social inequalities?</text><text x="500" y="546.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="515.2" y="546.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">3.3 How has globalisation affected</text><text x="515.2" y="567.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">inequalities between societies?</text><text x="450" y="484.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">or</text><line x1="390" y1="343" x2="250" y2="355" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="510" y1="343" x2="650" y2="355" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/>
