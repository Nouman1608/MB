<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="520" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Evaluating a method: four parts</text>

<rect x="30" y="110" width="410" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="100" y="110" width="340" height="134" rx="14" fill="none" stroke="none" stroke-width="2.5"/><text x="120" y="168" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Practical</text><text x="120" y="197.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Time, cost, access to participants</text><circle cx="76" cy="177" r="28" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="187.08" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">P</text><rect x="460" y="110" width="410" height="134" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><rect x="530" y="110" width="340" height="134" rx="14" fill="none" stroke="none" stroke-width="2.5"/><text x="550" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Ethical</text><text x="550" y="175.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Informed consent, harm,</text><text x="550" y="197.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">confidentiality; key for sensitive</text><text x="550" y="219.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">topics</text><circle cx="506" cy="177" r="28" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="506" y="187.08" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">E</text><rect x="30" y="260" width="410" height="134" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><rect x="100" y="260" width="340" height="134" rx="14" fill="none" stroke="none" stroke-width="2.5"/><text x="120" y="307" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Theoretical</text><text x="120" y="336.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Valid, in-depth data or reliable,</text><text x="120" y="358.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">generalisable data?</text><circle cx="76" cy="327" r="28" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="76" y="337.08" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">T</text><rect x="460" y="260" width="410" height="134" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><rect x="530" y="260" width="340" height="134" rx="14" fill="none" stroke="none" stroke-width="2.5"/><text x="550" y="307" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Representativeness</text><text x="550" y="336.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Does the sample reflect the wider</text><text x="550" y="358.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">population?</text><circle cx="506" cy="327" r="28" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="506" y="337.08" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">R</text><rect x="30" y="410" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="443.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Practical issues alone, however detailed, will not reach the top mark band: the theoretical</text><text x="50" y="465.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and ethical points make the evaluation sociological.</text>
</svg>