<rect width="900" height="373" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How society controls us (2.2)</text>

<rect x="30" y="104" width="410" height="163" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FORMAL SOCIAL CONTROL</text><text x="50" y="164" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Explicit rules and sanctions</text><text x="50" y="193.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="193.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Agencies: government, the police, the</text><text x="66.15" y="215.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">courts, the penal system</text><text x="50" y="242.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="242.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A written rule and a stated penalty</text><rect x="460" y="104" width="410" height="163" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">INFORMAL SOCIAL CONTROL</text><text x="480" y="164" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Unwritten norms</text><text x="480" y="193.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="496.15" y="193.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Agents: family, peers, media</text><text x="480" y="220.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="496.15" y="220.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Disapproval, praise, gossip and</text><text x="496.15" y="242.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">exclusion</text><rect x="30" y="285" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="318.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Name agencies on both sides and explain how each one achieves conformity.</text>
</svg>