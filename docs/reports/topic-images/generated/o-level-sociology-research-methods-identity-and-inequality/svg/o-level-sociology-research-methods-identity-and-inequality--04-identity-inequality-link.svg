<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 565" width="900" height="565" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="565" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Identity and inequality shape each other</text>

<rect x="30" y="150" width="300" height="190" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="180" y="186.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">TOPIC 2</text><text x="180" y="215.1" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Identity</text><text x="180" y="246.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Class, gender or ethnic</text><text x="180" y="268.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">identity formed through</text><text x="180" y="290.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">socialisation and its</text><text x="180" y="312.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">agencies</text><rect x="570" y="150" width="300" height="190" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="720" y="197.5" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">TOPIC 3</text><text x="720" y="226.1" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Inequality</text><text x="720" y="257.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">A position in the wider</text><text x="720" y="279.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">system of social</text><text x="720" y="301.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">stratification</text><path d="M340,200 Q450,130 560,200" fill="none" stroke="#1e2a44" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><text x="450" y="140" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">reinforces</text><path d="M560,300 Q450,370 340,300" fill="none" stroke="#1e2a44" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><text x="450" y="372" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">shapes</text><rect x="30" y="400" width="840" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="433" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">EXAMPLE OF A TWO-WAY LINK</text><text x="50" y="459.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A working-class identity</text><text x="50" y="488.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">is partly built through socialisation (Topic 2), is shaped by class inequality, and in turn</text><text x="50" y="510.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">reinforces it (Topic 3).</text>
</svg>