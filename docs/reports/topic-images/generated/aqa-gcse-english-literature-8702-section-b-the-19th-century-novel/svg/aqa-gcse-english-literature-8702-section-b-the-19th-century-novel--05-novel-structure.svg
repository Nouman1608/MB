<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Structure across the novel</text>

<rect x="30" y="110" width="840" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">First published in instalments? The structure often shows it:</text><rect x="54" y="170" width="250" height="86" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="179" y="206" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Chapter endings</text><text x="179" y="232" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">that create suspense</text><rect x="326" y="170" width="250" height="86" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="451" y="206" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Parallel scenes</text><text x="451" y="232" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">set against each other</text><rect x="598" y="170" width="250" height="86" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="723" y="206" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Reappearing characters</text><text x="723" y="232" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">with situations reversed</text><text x="450" y="310" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Structural patterns to look for</text><rect x="30" y="330" width="195" height="204" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M55,420 C100,360 150,450 200,385" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="2 9"/><circle cx="55" cy="420" r="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="200" cy="385" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="127.5" y="470" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">A journey</text><rect x="245" y="330" width="195" height="204" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M270,435 L342.5,365 L415,435" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><circle cx="342.5" cy="365" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="342.5" y="470" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">A rise and fall</text><rect x="460" y="330" width="195" height="204" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="488" y="370" width="30" height="60" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" opacity="0.4"/><rect x="524" y="370" width="30" height="60" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" opacity="0.6000000000000001"/><rect x="560" y="370" width="30" height="60" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" opacity="0.8"/><rect x="596" y="370" width="30" height="60" rx="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="2" opacity="1"/><text x="557.5" y="470" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">A secret slowly</text><text x="557.5" y="492" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">revealed</text><rect x="675" y="330" width="195" height="204" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="705" y="370" width="50" height="60" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="790" y="370" width="50" height="60" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><path d="M755,364 Q772.5,330 790,364" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5"/><text x="772.5" y="470" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">An ending that</text><text x="772.5" y="492" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">mirrors the</text><text x="772.5" y="514" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">beginning</text><rect x="30" y="552" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="585.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Ask where your extract falls and what has just happened.</text>
