<rect width="900" height="530" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What the novel question rewards</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">One question on your novel: an extract, then the whole book</text>
<rect x="30" y="126" width="336" height="74" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="198" y="158" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">AO1 · 12 marks</text><text x="198" y="183" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">informed personal response</text><rect x="366" y="126" width="336" height="74" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="534" y="158" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">AO2 · 12 marks</text><text x="534" y="183" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">language, form, structure</text><rect x="702" y="126" width="168" height="74" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="786" y="158" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">AO3 · 6 marks</text><text x="786" y="183" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">context</text><rect x="28" y="124" width="844" height="78" rx="6" fill="none" stroke="#1e2a44" stroke-width="3"/><text x="450" y="236" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">30 marks · no separate AO4 marks here, but clear writing carries your argument</text><rect x="30" y="266" width="397" height="114" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="228.5" y="299" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">BULLET 1</text><text x="228.5" y="326" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">The printed extract</text><text x="228.5" y="355.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Write about it in detail.</text><line x1="433" y1="323" x2="467" y2="323" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="266" width="397" height="114" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="671.5" y="299" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">BULLET 2</text><text x="671.5" y="326" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">The novel as a whole</text><text x="671.5" y="355.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Trace the focus across the book.</text><text x="30" y="414" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Time on Paper 1 (1 hour 45 minutes, 64 marks)</text><rect x="30" y="428" width="446.25" height="48" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="253.125" y="459" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Section A Shakespeare · 34</text><rect x="476.25" y="428" width="393.75" height="48" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="673.125" y="459" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Section B novel · 30</text><text x="450" y="506" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">Allow close to half the time for Section B; don’t overrun on Section A.</text>
