<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 755" width="900" height="755" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="755" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How the model paragraph works</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Original passage: Mr Grise in his counting-house</text>
<rect x="30" y="120" width="300" height="93" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="162" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">the sun… “resolved never to</text><text x="46" y="185" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">trouble itself again”</text><line x1="334" y1="166.5" x2="356" y2="166.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="360" y="120" width="510" height="93" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="376" y="148" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Personification turns the lane into a moral landscape:</text><text x="376" y="169" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">warmth and generosity have abandoned it.</text><text x="376" y="194" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">AO2: personification and setting</text><rect x="30" y="225" width="300" height="93" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="278.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">“a rumour of a fire”</text><line x1="334" y1="271.5" x2="356" y2="271.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="360" y="225" width="510" height="93" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="376" y="253" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">An ironic, not angry, narrator mocks Grise through</text><text x="376" y="274" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">exaggeration: we laugh before we judge.</text><text x="376" y="299" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">AO2: narrative voice</text><rect x="30" y="330" width="300" height="93" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="372" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">ledgers like “a regiment</text><text x="46" y="395" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">awaiting orders”</text><line x1="334" y1="376.5" x2="356" y2="376.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="360" y="330" width="510" height="93" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="376" y="358" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A simile: money is the only thing he commands or cares</text><text x="376" y="379" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">for.</text><text x="376" y="404" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">method: simile</text><rect x="30" y="435" width="300" height="93" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="477" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">“a moral failing” beside</text><text x="46" y="500" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Thomas’s hunger</text><line x1="334" y1="481.5" x2="356" y2="481.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="360" y="435" width="510" height="93" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="376" y="463" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The flat “agreed that it was” exposes hypocrisy without</text><text x="376" y="484" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">stating it.</text><text x="376" y="509" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">AO2: structure and juxtaposition</text><rect x="30" y="540" width="300" height="93" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="593.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">thrift praised as a virtue</text><line x1="334" y1="586.5" x2="356" y2="586.5" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="360" y="540" width="510" height="93" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="376" y="568" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Could such virtue become cruelty when the powerful</text><text x="376" y="589" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">practise it at the poor’s expense?</text><text x="376" y="614" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">AO3: linked to the line</text><rect x="30" y="651" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="684.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Argument: the writer presents Mr Grise’s meanness as something that has taken over the</text><text x="50" y="706.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">whole world around him.</text>
</svg>