<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="700" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Language at sentence level</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Analyse what the style does, never call it “old-fashioned”</text>
<rect x="30" y="110" width="840" height="180" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Long accumulating sentence, then a short one</text><rect x="54" y="172" width="84" height="34" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.5"/><rect x="144" y="172" width="64" height="34" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><rect x="214" y="172" width="104" height="34" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.5"/><rect x="324" y="172" width="54" height="34" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><rect x="384" y="172" width="89" height="34" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.5"/><rect x="479" y="172" width="74" height="34" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><rect x="559" y="172" width="64" height="34" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.5"/><text x="54" y="234" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">clauses, lists and qualifications pile up: breathlessness or overwhelming detail</text><rect x="645" y="166" width="70" height="46" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="680" y="260" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">lands with force</text><line x1="680" y1="244" x2="680" y2="218" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/><text x="30" y="330" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Also look at:</text><rect x="30" y="344" width="250" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="374" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Feature</text><rect x="280" y="344" width="590" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="292" y="374" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">What to say</text><rect x="30" y="390" width="250" height="66" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="416.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Semantic fields</text><rect x="280" y="390" width="590" height="66" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="292" y="416.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Clusters of related words, such as disease, imprisonment or</text><text x="292" y="438.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">light.</text><rect x="30" y="456" width="250" height="66" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="482.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Pathetic fallacy</text><rect x="280" y="456" width="590" height="66" fill="#fbf8ea" stroke="#1e2a44" stroke-width="2"/><text x="292" y="482.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Weather or setting reflecting emotion: why link them at this</text><text x="292" y="504.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">point?</text><rect x="30" y="522" width="250" height="44" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="548.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Contrasts</text><rect x="280" y="522" width="590" height="44" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="292" y="548.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Between characters, places or social classes, set side by side.</text><rect x="30" y="566" width="250" height="66" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="592.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Dialogue</text><rect x="280" y="566" width="590" height="66" fill="#fbf8ea" stroke="#1e2a44" stroke-width="2"/><text x="292" y="592.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">How characters speak reveals class, education, power and</text><text x="292" y="614.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">concealment.</text><rect x="30" y="632" width="250" height="44" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="658.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Narratorial comment</text><rect x="280" y="632" width="590" height="44" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="292" y="658.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Direct addresses or moral judgements that steer sympathy.</text>
</svg>