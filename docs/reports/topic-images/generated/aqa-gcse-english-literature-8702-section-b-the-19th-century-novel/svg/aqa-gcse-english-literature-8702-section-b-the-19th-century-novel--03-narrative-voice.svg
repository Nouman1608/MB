<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 617" width="900" height="617" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="617" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Narrative voice and viewpoint</text>

<rect x="30" y="110" width="411" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="145.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">First-person narrator</text><text x="50" y="173.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Looking back? Understanding more now than</text><text x="50" y="194.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">then? Can we trust them?</text><rect x="459" y="110" width="411" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="145.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Third-person narrator</text><text x="479" y="173.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Knows every character’s thoughts, or stays</text><text x="479" y="194.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">close to one? Comments and judges openly?</text><rect x="30" y="233" width="411" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="268.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Free indirect style</text><text x="50" y="296.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Slips into a character’s thoughts and</text><text x="50" y="317.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">phrasing without quotation marks: whose</text><text x="50" y="338.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">attitude is it?</text><rect x="459" y="233" width="411" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="278.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Multiple narrators or documents</text><text x="479" y="307.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Letters, statements, several voices: what</text><text x="479" y="328.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">does each one see, and miss?</text><rect x="30" y="393" width="840" height="200" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="429" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A retrospective first-person narrator has two selves</text><path d="M116.4,553 L120.4,511.4 Q130,503.4 139.6,511.4 L143.6,553 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="130" cy="495.4" r="10.4" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="130" y="579" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">younger self</text><text x="130" y="459" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">experiences events</text><path d="M753,553 L758,501 Q770,491 782,501 L787,553 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="770" cy="481" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="770" y="579" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">older narrator</text><text x="770" y="459" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">tells them</text><line x1="190" y1="513" x2="710" y2="513" stroke="#8a6d0d" stroke-width="3" stroke-dasharray="10 7" marker-start="url(#ahO)" marker-end="url(#ahO)"/><text x="450" y="499" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">the gap between them</text><text x="450" y="545" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">the narrator can foreshadow, regret or correct</text><text x="450" y="567" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">what the younger self believed</text>
</svg>