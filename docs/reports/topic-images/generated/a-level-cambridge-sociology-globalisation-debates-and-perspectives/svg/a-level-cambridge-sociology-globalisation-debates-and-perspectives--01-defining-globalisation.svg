<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="640" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Defining globalisation</text>

<rect x="30" y="108" width="269.3333333333333" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,158 L31.25,122.25 Q31.25,109.25 44.25,109.25 L285.0833333333333,109.25 Q298.0833333333333,109.25 298.0833333333333,122.25 L298.0833333333333,158 Z" fill="#b5d3cf"/><line x1="31.25" y1="158" x2="298.0833333333333" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="138.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Giddens (1999)</text><text x="44" y="189.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Intensification of worldwide</text><text x="44" y="210.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">social relations: local</text><text x="44" y="231.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">events are shaped by distant</text><text x="44" y="252.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ones.</text><rect x="315.3333333333333" y="108" width="269.3333333333333" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,158 L316.5833333333333,122.25 Q316.5833333333333,109.25 329.5833333333333,109.25 L570.4166666666666,109.25 Q583.4166666666666,109.25 583.4166666666666,122.25 L583.4166666666666,158 Z" fill="#b5d3cf"/><line x1="316.5833333333333" y1="158" x2="583.4166666666666" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="138.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Harvey (1989)</text><text x="329.3333333333333" y="189.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Time-space compression</tspan>:</text><text x="329.3333333333333" y="210.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">distance and time matter</text><text x="329.3333333333333" y="231.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">less.</text><rect x="600.6666666666666" y="108" width="269.3333333333333" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,158 L601.9166666666666,122.25 Q601.9166666666666,109.25 614.9166666666666,109.25 L855.75,109.25 Q868.75,109.25 868.75,122.25 L868.75,158 Z" fill="#b5d3cf"/><line x1="601.9166666666666" y1="158" x2="868.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="138.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">McLuhan (1962)</text><text x="614.6666666666666" y="189.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The <tspan font-weight="700">global village</tspan>.</text><text x="450" y="310" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Three problems with defining it</text><rect x="30" y="326" width="269.3333333333333" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,398 L31.25,340.25 Q31.25,327.25 44.25,327.25 L285.0833333333333,327.25 Q298.0833333333333,327.25 298.0833333333333,340.25 L298.0833333333333,398 Z" fill="#f2e7b8"/><line x1="31.25" y1="398" x2="298.0833333333333" y2="398" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="367.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1 Is it new?</text><text x="44" y="429.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Trade empires and colonialism</text><text x="44" y="450.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">linked continents centuries</text><text x="44" y="471.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ago; sceptics see a</text><text x="44" y="492.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">difference of degree.</text><rect x="315.3333333333333" y="326" width="269.3333333333333" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,398 L316.5833333333333,340.25 Q316.5833333333333,327.25 329.5833333333333,327.25 L570.4166666666666,327.25 Q583.4166666666666,327.25 583.4166666666666,340.25 L583.4166666666666,398 Z" fill="#f2e7b8"/><line x1="316.5833333333333" y1="398" x2="583.4166666666666" y2="398" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="355.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">2 One process or</text><text x="450" y="380.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">several?</text><text x="329.3333333333333" y="429.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Economic, political and</text><text x="329.3333333333333" y="450.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cultural globalisation move</text><text x="329.3333333333333" y="471.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">at different speeds.</text><rect x="600.6666666666666" y="326" width="269.3333333333333" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,398 L601.9166666666666,340.25 Q601.9166666666666,327.25 614.9166666666666,327.25 L855.75,327.25 Q868.75,327.25 868.75,340.25 L868.75,398 Z" fill="#f2e7b8"/><line x1="601.9166666666666" y1="398" x2="868.75" y2="398" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="367.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">3 Is it global at all?</text><text x="614.6666666666666" y="429.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The rural poor have little</text><text x="614.6666666666666" y="450.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">access to global networks; it</text><text x="614.6666666666666" y="471.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">may describe richer groups’</text><text x="614.6666666666666" y="492.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">experience.</text><rect x="30" y="534" width="840" height="82" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="570" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Glocalisation</tspan> (Robertson, 1992): global products and ideas adapted to local cultures.</text><text x="56" y="592" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Global culture</tspan>: shared consumer goods, media and values circulating worldwide.</text>
</svg>