<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 646" width="900" height="646" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="646" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who benefits? Six perspectives</text>

<text x="450" y="116" font-size="18" font-weight="400" fill="#4a5568" text-anchor="middle">Held et al.’s typology: how far has globalisation changed the world?</text><line x1="70" y1="190" x2="840" y2="190" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="830" y1="190" x2="60" y2="190" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="60" y="172" font-size="17" font-weight="600" fill="#4a5568" text-anchor="start">Least change</text><text x="840" y="172" font-size="17" font-weight="600" fill="#4a5568" text-anchor="end">Most change</text><circle cx="167" cy="190" r="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><circle cx="450" cy="190" r="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><circle cx="733" cy="190" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="222" width="269.3333333333333" height="174" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,272 L31.25,236.25 Q31.25,223.25 44.25,223.25 L285.0833333333333,223.25 Q298.0833333333333,223.25 298.0833333333333,236.25 L298.0833333333333,272 Z" fill="#f2e7b8"/><line x1="31.25" y1="272" x2="298.0833333333333" y2="272" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="252.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Sceptic</text><text x="44" y="303.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Hirst and Thompson (1996)</text><text x="44" y="330.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Exaggerated: most trade is</text><text x="44" y="351.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">regional and states remain</text><text x="44" y="372.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">powerful.</text><rect x="315.3333333333333" y="222" width="269.3333333333333" height="174" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,272 L316.5833333333333,236.25 Q316.5833333333333,223.25 329.5833333333333,223.25 L570.4166666666666,223.25 Q583.4166666666666,223.25 583.4166666666666,236.25 L583.4166666666666,272 Z" fill="#dce9e7"/><line x1="316.5833333333333" y1="272" x2="583.4166666666666" y2="272" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="252.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Transformationalist</text><text x="329.3333333333333" y="303.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Held et al. (1999)</text><text x="329.3333333333333" y="330.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Real but uneven: reshapes</text><text x="329.3333333333333" y="351.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">states rather than abolishing</text><text x="329.3333333333333" y="372.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">them.</text><rect x="600.6666666666666" y="222" width="269.3333333333333" height="174" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,272 L601.9166666666666,236.25 Q601.9166666666666,223.25 614.9166666666666,223.25 L855.75,223.25 Q868.75,223.25 868.75,236.25 L868.75,272 Z" fill="#b5d3cf"/><line x1="601.9166666666666" y1="272" x2="868.75" y2="272" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="252.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Globalist</text><text x="614.6666666666666" y="303.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Ohmae (1990)</text><text x="614.6666666666666" y="330.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Real and largely positive:</text><text x="614.6666666666666" y="351.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">borders and states matter</text><text x="614.6666666666666" y="372.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">less.</text><text x="450" y="432" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Critical perspectives: who gains and who loses?</text><rect x="30" y="452" width="269.3333333333333" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,502 L31.25,466.25 Q31.25,453.25 44.25,453.25 L285.0833333333333,453.25 Q298.0833333333333,453.25 298.0833333333333,466.25 L298.0833333333333,502 Z" fill="#ffffff"/><line x1="31.25" y1="502" x2="298.0833333333333" y2="502" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="482.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Marxist</text><text x="44" y="533.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Expansion of capitalism; a</text><text x="44" y="554.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">transnational capitalist</text><text x="44" y="575.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">class benefits (Sklair;</text><text x="44" y="596.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Wallerstein).</text><rect x="315.3333333333333" y="452" width="269.3333333333333" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,502 L316.5833333333333,466.25 Q316.5833333333333,453.25 329.5833333333333,453.25 L570.4166666666666,453.25 Q583.4166666666666,453.25 583.4166666666666,466.25 L583.4166666666666,502 Z" fill="#ffffff"/><line x1="316.5833333333333" y1="502" x2="583.4166666666666" y2="502" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="482.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Feminist</text><text x="329.3333333333333" y="533.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Relies on and may deepen</text><text x="329.3333333333333" y="554.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">exploitation of women’s paid</text><text x="329.3333333333333" y="575.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and unpaid labour (Enloe;</text><text x="329.3333333333333" y="596.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Hochschild).</text><rect x="600.6666666666666" y="452" width="269.3333333333333" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,502 L601.9166666666666,466.25 Q601.9166666666666,453.25 614.9166666666666,453.25 L855.75,453.25 Q868.75,453.25 868.75,466.25 L868.75,502 Z" fill="#ffffff"/><line x1="601.9166666666666" y1="502" x2="868.75" y2="502" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="482.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Postmodernist</text><text x="614.6666666666666" y="533.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fragmented, hybrid,</text><text x="614.6666666666666" y="554.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">consumer-based identities;</text><text x="614.6666666666666" y="575.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">decline of grand narratives</text><text x="614.6666666666666" y="596.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(Baudrillard; Bauman).</text>
</svg>