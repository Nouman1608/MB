<rect width="900" height="794" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Planning a 35-mark Paper 4 essay</text>

<rect x="30" y="104" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="152" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="159.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="104" y="143.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Define</text><text x="104" y="173.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Define the key term in the question and show awareness of debate about it.</text><line x1="450" y1="204" x2="450" y2="240" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="246" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="294" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="301.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="104" y="285.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Set out the view</text><text x="104" y="315.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Present the view in the question with evidence (for example, globalist arguments).</text><line x1="450" y1="346" x2="450" y2="382" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="388" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="436" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="443.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="104" y="427.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluate</text><text x="104" y="457.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Challenge it with contrasting perspectives: sceptic, Marxist, feminist.</text><line x1="450" y1="488" x2="450" y2="524" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="530" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="578" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="585.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="104" y="569.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Apply</text><text x="104" y="599.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Use examples from more than one society.</text><line x1="450" y1="630" x2="450" y2="666" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="672" width="840" height="96" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="67" cy="720" r="21" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="67" y="727.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="104" y="711.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Judge</text><text x="104" y="741.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Conclude with a judgement; transformationalism often gives a balanced position.</text>
</svg>