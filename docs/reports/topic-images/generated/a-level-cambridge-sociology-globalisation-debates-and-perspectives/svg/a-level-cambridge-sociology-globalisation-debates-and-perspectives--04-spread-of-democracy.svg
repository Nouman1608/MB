<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 429" width="900" height="429" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="429" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Is globalisation spreading democracy?</text>

<rect x="30" y="104" width="404" height="299" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L419.75,105.25 Q432.75,105.25 432.75,118.25 L432.75,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="432.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Yes</text><text x="48" y="190.4" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Fukuyama, “The End of History?” (1989)</text><circle cx="53" cy="215.79" r="4.5" fill="#2e6b62"/><text x="66" y="221.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Liberal democracy defeated its rivals</text><text x="66" y="243.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">after the Cold War</text><circle cx="53" cy="267.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="273.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Universal Declaration of Human Rights</text><text x="66" y="295.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">(1948)</text><circle cx="53" cy="319.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="325.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">International courts</text><circle cx="53" cy="349.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="355.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Global media scrutiny spreads rights</text><text x="66" y="377.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">norms</text><rect x="466" y="104" width="404" height="299" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,154 L467.25,118.25 Q467.25,105.25 480.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#f2e7b8"/><line x1="467.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Critics</text><text x="484" y="190.4" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Gains are partial and contested</text><circle cx="489" cy="215.79" r="4.5" fill="#8a6d0d"/><text x="502" y="221.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Democratic gains are uneven and in some</text><text x="502" y="243.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">places reversed</text><circle cx="489" cy="267.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="273.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“Democracy promotion” can serve Western</text><text x="502" y="295.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">interests</text><circle cx="489" cy="319.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="325.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">TNCs and global markets can override the</text><text x="502" y="347.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">choices of elected governments</text><circle cx="450" cy="253.5" r="24" fill="#1e2a44"/><text x="450" y="260.5" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">vs</text>
</svg>