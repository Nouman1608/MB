<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 629" width="900" height="629" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="629" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Globalisation and identity</text>

<rect x="30" y="104" width="404" height="348" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L419.75,105.25 Q432.75,105.25 432.75,118.25 L432.75,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="432.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Cultural convergence</text><text x="48" y="190.4" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Global media and brands make cultures more</text><text x="48" y="211.4" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">alike (homogenisation)</text><circle cx="53" cy="236.79" r="4.5" fill="#2e6b62"/><text x="66" y="242.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">McDonaldization</tspan> (Ritzer, 1993):</text><text x="66" y="264.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">efficiency, calculability,</text><text x="66" y="286.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">predictability and control spread to</text><text x="66" y="308.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">all areas of life</text><circle cx="53" cy="332.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="338.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Westernisation</tspan>: convergence is really</text><text x="66" y="360.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the spread of Western, especially</text><text x="66" y="382.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">American, consumerism, individualism</text><text x="66" y="404.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and liberal values (cultural</text><text x="66" y="426.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">imperialism)</text><rect x="466" y="104" width="404" height="348" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,154 L467.25,118.25 Q467.25,105.25 480.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#f2e7b8"/><line x1="467.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Cultural divergence</text><text x="484" y="190.4" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Contact between cultures can increase</text><text x="484" y="211.4" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">difference</text><circle cx="489" cy="236.79" r="4.5" fill="#8a6d0d"/><text x="502" y="242.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Hybrid identity</tspan>: blending more than one</text><text x="502" y="264.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">culture (Bhabha; Hall)</text><circle cx="489" cy="288.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="294.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Cultural defence</tspan>: protecting culture</text><text x="502" y="316.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">against outside threat through religion</text><text x="502" y="338.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">or nationalism (Bruce)</text><circle cx="489" cy="362.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="368.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Ethnic revitalisation</tspan>: reviving ethnic</text><text x="502" y="390.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">languages, dress or traditions</text><circle cx="450" cy="278" r="24" fill="#1e2a44"/><text x="450" y="285" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">vs</text><rect x="30" y="470" width="840" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="506" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Both at once?</text><text x="56" y="535" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Barber’s Jihad vs. McWorld (1995): homogenisation and backlash are two sides of one</text><text x="56" y="557" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">process. Huntington (1996) predicted cultural identities would drive conflict; critics say</text><text x="56" y="579" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">he exaggerates the unity of “civilisations”.</text>
</svg>