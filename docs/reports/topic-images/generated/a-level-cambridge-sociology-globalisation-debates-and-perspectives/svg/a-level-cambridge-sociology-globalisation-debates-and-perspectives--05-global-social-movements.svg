<line x1="50" y1="320" x2="850" y2="320" stroke="#1e2a44" stroke-width="4"/><line x1="127.5" y1="240" x2="100" y2="307" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="108" width="195" height="132" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="127.5" y="140" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Seattle</text><text x="127.5" y="167" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">protests at the WTO</text><text x="127.5" y="188" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">meeting</text><circle cx="100" cy="320" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="92" y="362" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="end">1999</text><line x1="342.5" y1="240" x2="173.68421052631578" y2="307" stroke="#1e2a44" stroke-width="2.5"/><rect x="245" y="108" width="195" height="132" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="342.5" y="140" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">World Social</text><text x="342.5" y="165" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Forum</text><text x="342.5" y="192" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">first held in Porto</text><text x="342.5" y="213" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Alegre, Brazil</text><circle cx="173.68421052631578" cy="320" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="181.68421052631578" y="362" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">2001</text><line x1="557.5" y1="240" x2="542.1052631578948" y2="307" stroke="#1e2a44" stroke-width="2.5"/><rect x="460" y="108" width="195" height="132" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="557.5" y="140" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Occupy</text><text x="557.5" y="167" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">movement</text><circle cx="542.1052631578948" cy="320" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="542.1052631578948" y="362" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2011</text><line x1="772.5" y1="240" x2="800" y2="307" stroke="#1e2a44" stroke-width="2.5"/><rect x="675" y="108" width="195" height="132" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="772.5" y="140" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Fridays for</text><text x="772.5" y="165" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Future</text><text x="772.5" y="192" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">climate movement</text><text x="772.5" y="213" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">(from 2018)</text><circle cx="800" cy="320" r="13" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="800" y="362" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2018</text><rect x="30" y="396" width="269.3333333333333" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,446 L31.25,410.25 Q31.25,397.25 44.25,397.25 L285.0833333333333,397.25 Q298.0833333333333,397.25 298.0833333333333,410.25 L298.0833333333333,446 Z" fill="#dce9e7"/><line x1="31.25" y1="446" x2="298.0833333333333" y2="446" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="426.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">“Alter-globalisation”</text><text x="44" y="477.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Many movements seek a</text><text x="44" y="498.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">different globalisation, not</text><text x="44" y="519.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">none, and use the same</text><text x="44" y="540.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">networks they criticise.</text><rect x="315.3333333333333" y="396" width="269.3333333333333" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,446 L316.5833333333333,410.25 Q316.5833333333333,397.25 329.5833333333333,397.25 L570.4166666666666,397.25 Q583.4166666666666,397.25 583.4166666666666,410.25 L583.4166666666666,446 Z" fill="#b5d3cf"/><line x1="316.5833333333333" y1="446" x2="583.4166666666666" y2="446" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="426.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Castells (1996)</text><text x="329.3333333333333" y="477.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Networked communication gives</text><text x="329.3333333333333" y="498.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">such movements new power.</text><rect x="600.6666666666666" y="396" width="269.3333333333333" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,446 L601.9166666666666,410.25 Q601.9166666666666,397.25 614.9166666666666,397.25 L855.75,397.25 Q868.75,397.25 868.75,410.25 L868.75,446 Z" fill="#f2e7b8"/><line x1="601.9166666666666" y1="446" x2="868.75" y2="446" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="426.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Evaluation</text><text x="614.6666666666666" y="477.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Movements often struggle to</text><text x="614.6666666666666" y="498.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">turn protest into lasting</text><text x="614.6666666666666" y="519.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">policy change.</text>
