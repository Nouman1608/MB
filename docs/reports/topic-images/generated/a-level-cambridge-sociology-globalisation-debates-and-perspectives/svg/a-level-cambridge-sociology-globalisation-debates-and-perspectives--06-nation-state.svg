<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 444" width="900" height="444" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="444" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Can nation states still tackle global problems?</text>

<rect x="30" y="104" width="269.3333333333333" height="199" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L285.0833333333333,105.25 Q298.0833333333333,105.25 298.0833333333333,118.25 L298.0833333333333,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="298.0833333333333" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Globalist</text><text x="46" y="187.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">States are losing power</text><text x="46" y="216.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Power shifts to markets and</text><text x="46" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">TNCs. Ohmae, The End of the</text><text x="46" y="258.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Nation State (1995).</text><rect x="315.3333333333333" y="104" width="269.3333333333333" height="199" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,154 L316.5833333333333,118.25 Q316.5833333333333,105.25 329.5833333333333,105.25 L570.4166666666666,105.25 Q583.4166666666666,105.25 583.4166666666666,118.25 L583.4166666666666,154 Z" fill="#f2e7b8"/><line x1="316.5833333333333" y1="154" x2="583.4166666666666" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Sceptic</text><text x="331.3333333333333" y="187.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">States are still strong</text><text x="331.3333333333333" y="216.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">They control borders, taxes,</text><text x="331.3333333333333" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">armies and law: shown by</text><text x="331.3333333333333" y="258.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">trade wars and border</text><text x="331.3333333333333" y="279.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">closures.</text><rect x="600.6666666666666" y="104" width="269.3333333333333" height="199" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,154 L601.9166666666666,118.25 Q601.9166666666666,105.25 614.9166666666666,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#dce9e7"/><line x1="601.9166666666666" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Transformationalist</text><text x="616.6666666666666" y="187.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">States act together</text><text x="616.6666666666666" y="216.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cooperation through</text><text x="616.6666666666666" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">agreements such as the Kyoto</text><text x="616.6666666666666" y="258.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Protocol (1997) and Paris</text><text x="616.6666666666666" y="279.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Agreement (2015).</text><rect x="30" y="319" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="355" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Beck, Risk Society (1986)</text><text x="56" y="384" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Manufactured risks such as climate change cross borders, so national solutions alone cannot</text><text x="56" y="406" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">work.</text>
</svg>