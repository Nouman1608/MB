<rect width="900" height="590" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Using the open book well</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Precise detail is expected, so you must find it fast</text>
<rect x="30" y="110" width="840" height="214" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">1  Map the novel by place</text><text x="846" y="146" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">pattern illustrative</text><rect x="60" y="196" width="140.4" height="44" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="130.2" y="224" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">place A</text><rect x="200.4" y="196" width="210.60000000000002" height="44" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="305.7" y="224" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">place B</text><rect x="411" y="196" width="132.6" height="44" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="477.3" y="224" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">place C</text><rect x="543.6" y="196" width="179.39999999999998" height="44" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="633.3" y="224" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">place B</text><rect x="723" y="196" width="117.00000000000001" height="44" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="781.5" y="224" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">place A</text><text x="60" y="262" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">opening</text><text x="840" y="262" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">ending</text><path d="M83.4,194 l-8,-14 a9,9 0 1,1 16,0 z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><path d="M294,194 l-8,-14 a9,9 0 1,1 16,0 z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><path d="M465.6,194 l-8,-14 a9,9 0 1,1 16,0 z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><path d="M606,194 l-8,-14 a9,9 0 1,1 16,0 z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><path d="M816.6,194 l-8,-14 a9,9 0 1,1 16,0 z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="450" y="304" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">chapters or sections set where, with five or six key passages (pins) including the opening and ending</text><rect x="30" y="340" width="410" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="375.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">2 Mark key passages</text><text x="50" y="403.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Five or six descriptive passages, in your</text><text x="50" y="424.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">head or in planning notes kept outside the</text><text x="50" y="445.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">exam.</text><rect x="460" y="340" width="410" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="385.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">3 Practise short quotations</text><text x="480" y="414.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A phrase, not a paragraph: short, analysed</text><text x="480" y="435.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">quotations earn more.</text><rect x="30" y="486" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="519.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Your centre will confirm the rules about what kind of copy you may take in. In the exam,</text><text x="50" y="541.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">allow about five minutes to choose three or four passages.</text>
</svg>