<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 940" width="900" height="940" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="940" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The road that leads back indoors</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Explore the significance of the English landscape in Remains of the Day</text>
<path d="M50,210 L120,160 L190,210 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><rect x="60" y="210" width="120" height="70" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><rect x="74" y="224" width="20" height="22" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.5"/><rect x="108" y="224" width="20" height="22" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.5"/><rect x="142" y="224" width="20" height="22" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.5"/><text x="120" y="308" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Darlington Hall</text><text x="120" y="328" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">the 1930s, in memory</text><path d="M210,350 L860,350" fill="none" stroke="#9c8f6e" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" /><line x1="210" y1="350" x2="860" y2="350" stroke="#ffffff" stroke-width="2" stroke-dasharray="14 12"/><text x="530" y="390" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">the drive through the West Country</text><circle cx="360" cy="350" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><path d="M360,334 C360,210 280,160 200,220" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#ahT)"/><circle cx="520" cy="350" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><path d="M520,334 C520,210 360,170 200,220" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#ahT)"/><circle cx="680" cy="350" r="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><path d="M680,334 C680,210 440,180 200,220" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#ahT)"/><text x="560" y="150" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">each stop prompts a recollection of the house</text><path d="M800,290 q15,-10 30,0 q15,-10 30,0" fill="none" stroke="#2b5a9a" stroke-width="3"/><text x="830" y="274" font-size="15" font-weight="700" fill="#2b5a9a" text-anchor="middle">the sea</text><line x1="62" y1="440" x2="62" y2="778" stroke="#c9d6d4" stroke-width="4"/><rect x="108" y="420" width="762" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="454.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The journey itself</text><text x="128" y="482.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A rare trip away from Darlington Hall, the centre of his world.</text><circle cx="62" cy="463.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="472.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="108" y="517" width="762" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="551.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The “greatness” of English landscape</text><text x="128" y="579.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Calm restraint and lack of obvious drama: the same quality he values in a butler.</text><circle cx="62" cy="560.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="569.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="108" y="614" width="762" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="648.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Places as memory</text><text x="128" y="676.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Geography structures the novel’s movement into the past.</text><circle cx="62" cy="657.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="666.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="108" y="711" width="762" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="745.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The final evening by the sea</text><text x="128" y="773.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The place allows a rare moment of emotion.</text><circle cx="62" cy="754.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="763.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="30" y="814" width="840" height="102" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="847.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Argument: the landscape is Stevens’s way of talking about himself without admitting</text><text x="50" y="869.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">anything. Context: the post-war decline of the great country houses; appeasement politics</text><text x="50" y="891.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">at Darlington Hall.</text>
</svg>