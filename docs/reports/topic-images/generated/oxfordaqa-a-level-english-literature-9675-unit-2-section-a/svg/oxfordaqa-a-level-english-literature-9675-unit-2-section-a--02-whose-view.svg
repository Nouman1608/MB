<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 744" width="900" height="744" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="744" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Whose view of the place?</text>

<text x="150" y="124" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">Narrator</text><text x="450" y="124" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">Position</text><text x="750" y="124" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">The place we receive</text><rect x="30" y="138" width="230" height="96" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><path d="M54.1,220 L57.6,183.6 Q66,176.6 74.4,183.6 L77.9,220 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="66" cy="169.6" r="9.1" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="160" y="193" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Marlow</text><line x1="264" y1="186" x2="296" y2="186" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="300" y="138" width="300" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="181.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">tells his story aboard a boat</text><text x="450" y="202.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">on the Thames</text><line x1="604" y1="186" x2="636" y2="186" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="640" y="138" width="230" height="96" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="755" y="178" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">the Congo</text><text x="755" y="202" font-size="15" font-weight="400" fill="#8a6d0d" text-anchor="middle">a European storyteller’s</text><text x="755" y="222" font-size="15" font-weight="400" fill="#8a6d0d" text-anchor="middle">memory</text><rect x="30" y="246" width="230" height="96" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><path d="M54.1,328 L57.6,291.6 Q66,284.6 74.4,291.6 L77.9,328 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="66" cy="277.6" r="9.1" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="160" y="301" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Nick Carraway</text><line x1="264" y1="294" x2="296" y2="294" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="300" y="246" width="300" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="300" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">an outsider from the Midwest</text><line x1="604" y1="294" x2="636" y2="294" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="640" y="246" width="230" height="96" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="755" y="286" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">the Eggs</text><text x="755" y="310" font-size="15" font-weight="400" fill="#8a6d0d" text-anchor="middle">seen from outside</text><rect x="30" y="354" width="230" height="96" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><path d="M54.1,436 L57.6,399.6 Q66,392.6 74.4,399.6 L77.9,436 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="66" cy="385.6" r="9.1" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="160" y="409" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Stevens</text><line x1="264" y1="402" x2="296" y2="402" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="300" y="354" width="300" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="397.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">restraint makes him unreliable</text><text x="450" y="418.5" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">about his own feelings</text><line x1="604" y1="402" x2="636" y2="402" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="640" y="354" width="230" height="96" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="755" y="394" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">the West Country</text><text x="755" y="418" font-size="15" font-weight="400" fill="#8a6d0d" text-anchor="middle">an unreliable guide</text><rect x="30" y="470" width="408" height="132" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="503" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRUCTURE</text><text x="50" y="528.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The order of places is a method</text><text x="50" y="556.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The plot is organised around movement</text><text x="50" y="577.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">between places.</text><rect x="462" y="470" width="408" height="132" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="482" y="503" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">REPRESENTATION</text><text x="482" y="528.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Every place is someone’s view</text><text x="482" y="556.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">No place exists except as words chosen by a</text><text x="482" y="577.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">narrator.</text><rect x="30" y="618" width="840" height="102" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="651.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Achebe’s lecture “An Image of Africa” (1975) argued that Heart of Darkness reduces Africa</text><text x="50" y="673.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">to a backdrop for a European mind. Ask of any narrator: whose view of a place do we hear,</text><text x="50" y="695.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and whose is left out?</text>
</svg>