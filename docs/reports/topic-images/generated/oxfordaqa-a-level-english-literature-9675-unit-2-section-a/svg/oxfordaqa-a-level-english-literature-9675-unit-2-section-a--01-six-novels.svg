<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">One essay, 25 marks, open book</text>
<rect x="30" y="110" width="840" height="56" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="136" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">Heart of Darkness</text><text x="48" y="157" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Conrad</text><rect x="270" y="122" width="112" height="32" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="326" y="143.4" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">the Thames</text><rect x="392" y="122" width="95" height="32" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="439.5" y="143.4" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Brussels</text><rect x="497" y="122" width="302" height="32" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="648" y="143.4" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">the Congo River and its stations</text><rect x="30" y="176" width="840" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="223" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">The Great Gatsby</text><text x="48" y="244" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Fitzgerald</text><rect x="270" y="188" width="95" height="32" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="317.5" y="209.4" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">West Egg</text><rect x="375" y="188" width="95" height="32" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="422.5" y="209.4" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">East Egg</text><rect x="480" y="188" width="190" height="32" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="575" y="209.4" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">the valley of ashes