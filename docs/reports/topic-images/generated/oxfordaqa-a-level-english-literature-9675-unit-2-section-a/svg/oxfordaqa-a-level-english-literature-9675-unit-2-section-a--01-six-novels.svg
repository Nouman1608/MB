ight="32" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="313" y="383.4" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Jamaica</text><rect x="366" y="362" width="259" height="32" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="495.5" y="383.4" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">wartime and post-war London</text><rect x="635" y="362" width="69" height="32" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="669.5" y="383.4" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">India</text><rect x="30" y="416" width="840" height="56" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="442" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">Last Man in Tower</text><text x="48" y="463" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Adiga</text><rect x="270" y="428" width="233" height="32" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="386.5" y="449.4" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">a Mumbai housing society</text><rect x="513" y="428" width="181" height="32" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="603.5" y="449.4" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">the city around it</text><rect x="30" y="482" width="840" height="56" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="508" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">Remains of the Day</text><text x="48" y="529" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Ishiguro</text><rect x="270" y="494" width="155" height="32" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="347.5" y="515.4" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">Darlington Hall</text><rect x="435" y="494" width="233" height="32" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="551.5" y="515.4" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">the English West Country</text><rect x="30" y="554" width="840" height="102" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="587.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">You study one, chosen by your centre (Version 5.3 list; a revised 9675 for teaching from</text><text x="50" y="609.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">2027 has a refreshed list). In every novel the plot is organised around movement between</text><text x="50" y="631.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">places.</text>
