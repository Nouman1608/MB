<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 636" width="900" height="636" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="636" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How novels build place</text>

<text x="30" y="128" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Contrast: paired places carry social and moral oppositions</text><rect x="30" y="144" width="300" height="50" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="180" y="175" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">East Egg</text><text x="360" y="176" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">vs</text><rect x="390" y="144" width="300" height="50" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="540" y="175" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">West Egg</text><text x="706" y="175" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">The Great Gatsby</text><rect x="30" y="204" width="300" height="50" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="180" y="235" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">the England Hortense imagines</text><text x="360" y="236" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">vs</text><rect x="390" y="204" width="300" height="50" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="540" y="235" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Gilbert’s single cramped room</text><text x="706" y="235" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Small Island</text><rect x="30" y="264" width="300" height="50" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="180" y="295" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">the old tower</text><text x="360" y="296" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">vs</text><rect x="390" y="264" width="300" height="50" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="540" y="295" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">the luxury development promised</text><text x="706" y="295" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Last Man in Tower</text><rect x="30" y="338" width="411" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="373.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Journeys</text><text x="50" y="401.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Up a river, across the Atlantic, through</text><text x="50" y="422.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">England by car, Lagos to America and back:</text><text x="50" y="443.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">compare places; does the traveller change?</text><rect x="459" y="338" width="411" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="373.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Home and homeland</text><text x="479" y="401.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Ifemelu’s return to Lagos; an unwelcoming</text><text x="479" y="422.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">London; Stevens’s loyalty to a great house:</text><text x="479" y="443.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">is home a place or relationships?</text><rect x="30" y="482" width="411" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="517.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Political space</text><text x="50" y="545.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Colonial power in the Congo, Empire, property</text><text x="50" y="566.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">development in Mumbai, politics at Darlington</text><text x="50" y="587.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Hall in the 1930s.</text><rect x="459" y="482" width="411" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="517.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Time</text><text x="479" y="545.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Locations “and possibly times”: a place</text><text x="479" y="566.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">revisited, or described by an older narrator,</text><text x="479" y="587.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">carries the weight of change.</text>
</svg>