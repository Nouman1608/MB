<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 705" width="900" height="705" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="705" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five ideas: claim, evidence, limitation</text>

<text x="370" y="128" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">Claim</text><text x="570" y="128" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">For</text><text x="765" y="128" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">Against</text><rect x="40" y="142" width="230" height="98" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="155" y="172" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Imitation and</text><text x="155" y="192" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">reinforcement</text><text x="155" y="216" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">B.F. Skinner</text><rect x="280" y="142" width="180" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="294" y="177" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">imitate adults,</text><text x="294" y="197" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">rewarded for</text><text x="294" y="217" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">success</text><rect x="470" y="142" width="200" height="98" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="484" y="177" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">accent, vocabulary,</text><text x="484" y="197" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">routines ("ta") are</text><text x="484" y="217" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">copied</text><rect x="680" y="142" width="180" height="98" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="694" y="187" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">"goed", "mouses"</text><text x="694" y="207" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">were never heard</text><rect x="40" y="250" width="230" height="98" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="155" y="290" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">LAD</text><text x="155" y="324" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Noam Chomsky</text><rect x="280" y="250" width="180" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="294" y="295" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">an innate capacity</text><text x="294" y="315" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">for grammar</text><rect x="470" y="250" width="200" height="98" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="484" y="285" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">overgeneralisation;</text><text x="484" y="305" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Berko's "wug" test</text><text x="484" y="325" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">(1958)</text><rect x="680" y="250" width="180" height="98" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="694" y="275" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">little on</text><text x="694" y="295" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">interaction; no</text><text x="694" y="315" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">physical device</text><text x="694" y="335" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">found</text><rect x="40" y="358" width="230" height="98" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="155" y="398" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">LASS</text><text x="155" y="432" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Jerome Bruner</text><rect x="280" y="358" width="180" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="294" y="393" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">caregivers</text><text x="294" y="413" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">scaffold through</text><text x="294" y="433" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">routines</text><rect x="470" y="358" width="200" height="98" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="484" y="403" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">adults structure turns</text><text x="484" y="423" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">in transcripts</text><rect x="680" y="358" width="180" height="98" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="694" y="393" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">children with less</text><text x="694" y="413" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">interaction still</text><text x="694" y="433" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">acquire language</text><rect x="40" y="466" width="230" height="98" rx="10" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5"/><text x="155" y="506" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Cognitive</text><text x="155" y="540" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Jean Piaget</text><rect x="280" y="466" width="180" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="294" y="511" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">language follows</text><text x="294" y="531" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">thought</text><rect x="470" y="466" width="200" height="98" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="484" y="501" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">"allgone", "more"</text><text x="484" y="521" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">follow object</text><text x="484" y="541" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">permanence</text><rect x="680" y="466" width="180" height="98" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="694" y="501" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">some with cognitive</text><text x="694" y="521" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">difficulties have</text><text x="694" y="541" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">strong language</text><rect x="40" y="580" width="820" height="100" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="64" y="614" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Child-directed (caretaker) speech</text><text x="64" y="642" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">higher pitch, exaggerated intonation, simple vocabulary, repetition, questions, expansions, recasts</text><text x="64" y="666" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">supports interactionist views, but is not used the same way in every culture</text>
</svg>