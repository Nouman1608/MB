<text x="40" y="130" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Questions</text><rect x="40" y="144" width="250" height="84" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="165" y="180" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">"Where daddy going?"</text><text x="165" y="210" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">wh-word, no inversion</text><line x1="292" y1="186" x2="607" y2="186" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="610" y="144" width="250" height="84" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="735" y="180" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">"Where is daddy going?"</text><text x="735" y="210" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">adult form, inverted</text><text x="40" y="260" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Negation</text><rect x="40" y="274" width="250" height="84" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="165" y="310" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">"no bed"</text><text x="165" y="340" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">"no" at the front</text><line x1="292" y1="316" x2="322" y2="316" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325" y="274" width="250" height="84" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="310" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">"I no want it"</text><text x="450" y="340" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">inside the sentence</text><line x1="577" y1="316" x2="607" y2="316" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="610" y="274" width="250" height="84" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="735" y="310" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">"I don't want it"</text><text x="735" y="340" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">adult auxiliary</text><rect x="40" y="395" width="820" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="434" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Grammar</text><text x="200" y="424" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"and" coordination gives way to "because", "when", "if";</text><text x="200" y="444" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">more accurate irregulars; passives later</text><rect x="40" y="473" width="820" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="512" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Narrative</text><text x="200" y="502" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"and then", "after that", "suddenly"; scene-setting for a</text><text x="200" y="522" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">listener</text><rect x="40" y="551" width="820" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="590" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Pragmatics</text><text x="200" y="580" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">turn-taking, politeness, adjusting for younger listeners,</text><text x="200" y="600" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">repairing misunderstandings</text>
</svg>