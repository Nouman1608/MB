<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="640" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Phonological simplification in transcripts</text>

<rect x="40" y="115" width="820" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="147" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Deletion</text><text x="60" y="171" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">final consonant or unstressed syllable</text><rect x="420" y="129" width="90" height="44" rx="9" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="465" y="158" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">"ca"</text><text x="520" y="158" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">for "cat"</text><rect x="640" y="129" width="90" height="44" rx="9" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="685" y="158" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">"nana"</text><text x="740" y="158" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">for "banana"</text><rect x="40" y="199" width="820" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="231" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Cluster reduction</text><text x="60" y="255" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">a consonant cluster is reduced</text><rect x="420" y="213" width="90" height="44" rx="9" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="465" y="242" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">"pider"</text><text x="520" y="242" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">for "spider"</text><rect x="40" y="283" width="820" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="315" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Substitution</text><text x="60" y="339" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">an easier sound, e.g. /w/ for /r/</text><rect x="420" y="297" width="90" height="44" rx="9" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="465" y="326" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">"wed"</text><text x="520" y="326" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">for "red"</text><rect x="40" y="367" width="820" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="399" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Assimilation</text><text x="60" y="423" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">a sound changes to match another</text><rect x="420" y="381" width="90" height="44" rx="9" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="465" y="410" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">"gog"</text><text x="520" y="410" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">for "dog"</text><rect x="40" y="451" width="820" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="483" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Reduplication</text><text x="60" y="507" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">a syllable is repeated</text><rect x="420" y="465" width="90" height="44" rx="9" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="465" y="494" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">"dada"</text><rect x="640" y="465" width="90" height="44" rx="9" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="685" y="494" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">"bibi"</text><rect x="40" y="545" width="820" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="588" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Name the process, quote the form, explain it: simplification is systematic, not random.</text>
</svg>