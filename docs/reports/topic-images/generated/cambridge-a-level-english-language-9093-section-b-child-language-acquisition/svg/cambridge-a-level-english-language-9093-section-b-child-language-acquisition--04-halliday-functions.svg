<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 695" width="900" height="695" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="695" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Seven functions of children's language</text>

<text x="450" y="98" font-size="18" font-weight="400" fill="#4a5568" text-anchor="middle">M.A.K. Halliday</text><rect x="40" y="118" width="210" height="54" rx="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="145" y="151" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Instrumental</text><text x="270" y="151" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">getting needs met</text><rect x="580" y="118" width="280" height="54" rx="27" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="720" y="151" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">"Want biscuit."</text><rect x="40" y="184" width="210" height="54" rx="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="145" y="217" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Regulatory</text><text x="270" y="217" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">controlling others' behaviour</text><rect x="580" y="184" width="280" height="54" rx="27" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="720" y="217" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">"Stop it!"</text><rect x="40" y="250" width="210" height="54" rx="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="145" y="283" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Interactional</text><text x="270" y="283" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">building relationships</text><rect x="580" y="250" width="280" height="54" rx="27" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="720" y="283" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">"Love you, mummy."</text><rect x="40" y="316" width="210" height="54" rx="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="145" y="349" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Personal</text><text x="270" y="349" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">expressing feelings and identity</text><rect x="580" y="316" width="280" height="54" rx="27" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="720" y="349" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">"Me sad."</text><rect x="40" y="382" width="210" height="54" rx="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="145" y="415" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Representational</text><text x="270" y="415" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">conveying information</text><rect x="580" y="382" width="280" height="54" rx="27" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="720" y="415" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">"Doggy gone outside."</text><rect x="40" y="448" width="210" height="54" rx="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="145" y="481" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Heuristic</text><text x="270" y="481" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">exploring and finding out</text><rect x="580" y="448" width="280" height="54" rx="27" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="720" y="481" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">"What that?"</text><rect x="40" y="514" width="210" height="54" rx="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="145" y="547" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Imaginative</text><text x="270" y="547" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">creating imagined worlds</text><rect x="580" y="514" width="280" height="54" rx="27" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="720" y="547" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle" font-style="italic">"I'm a lion, roar!"</text><rect x="40" y="590" width="820" height="80" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="64" y="622" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">One utterance, more than one function</text><text x="64" y="650" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"What that noise?" may be heuristic and, if the child is frightened, personal.</text>
</svg>