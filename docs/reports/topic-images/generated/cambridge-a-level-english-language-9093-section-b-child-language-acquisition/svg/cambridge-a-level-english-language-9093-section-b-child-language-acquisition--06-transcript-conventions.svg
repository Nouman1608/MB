<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 595" width="900" height="595" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="595" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading transcript conventions</text>

<text x="450" y="98" font-size="18" font-weight="400" fill="#4a5568" text-anchor="middle">Always read the key: conventions vary</text><rect x="40" y="118" width="400" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="50" y="126" width="160" height="42" rx="8" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="130" y="154" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">(.)</text><text x="226" y="154" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">micro-pause</text><rect x="40" y="188" width="400" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="50" y="196" width="160" height="42" rx="8" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="130" y="224" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">(2)</text><text x="226" y="224" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">pause, about two seconds</text><rect x="40" y="258" width="400" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="50" y="266" width="160" height="42" rx="8" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="130" y="294" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">//  [ ]</text><text x="226" y="294" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">overlapping speech</text><rect x="40" y="328" width="400" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="50" y="336" width="160" height="42" rx="8" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="130" y="364" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">bold or underline</text><text x="226" y="364" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">stress</text><rect x="460" y="118" width="400" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="470" y="126" width="160" height="42" rx="8" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="550" y="154" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">↗  ↘</text><text x="646" y="154" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rising or falling intonation</text><rect x="460" y="188" width="400" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="470" y="196" width="160" height="42" rx="8" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="550" y="224" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">/slashes/</text><text x="646" y="224" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">phonemic transcription</text><rect x="460" y="258" width="400" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="470" y="266" width="160" height="42" rx="8" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="550" y="294" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle" font-style="italic">[points at dog]</text><text x="646" y="294" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">context note</text><text x="450" y="430" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">These marks are evidence</text><rect x="40" y="450" width="400" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="64" y="485" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">"Juice?" with rising intonation</text><text x="64" y="515" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">turns a holophrase into a question</text><rect x="460" y="450" width="400" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="484" y="485" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">An adult's pause</text><text x="484" y="515" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">can be a deliberate space for the</text><text x="484" y="537" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">child's turn</text>
</svg>