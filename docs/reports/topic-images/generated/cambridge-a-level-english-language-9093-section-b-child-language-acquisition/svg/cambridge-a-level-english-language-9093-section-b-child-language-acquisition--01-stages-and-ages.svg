<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" width="900" height="710" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="710" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Early stages with rough ages</text>

<rect x="40" y="115" width="220" height="72" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="150" y="147" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Pre-verbal</text><text x="150" y="171" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">0-4 months</text><rect x="272" y="115" width="588" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="290" y="157" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">crying, cooing; vowel-like sounds, comfort noises</text><rect x="40" y="199" width="220" height="72" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="150" y="231" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Babbling</text><text x="150" y="255" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">about 6-12 months</text><rect x="272" y="199" width="588" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="290" y="229" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">repeated, then varied syllables; home-language intonation</text><text x="290" y="257" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start" font-style="italic">"bababa", "bada"</text><rect x="40" y="283" width="220" height="72" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="150" y="315" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Holophrastic</text><text x="150" y="339" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">about 12-18 months</text><rect x="272" y="283" width="588" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="290" y="313" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">single words carrying whole-utterance meanings</text><text x="290" y="341" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start" font-style="italic">"up" = "pick me up"</text><rect x="40" y="367" width="220" height="72" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="150" y="399" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Two-word</text><text x="150" y="423" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">about 18-24 months</text><rect x="272" y="367" width="588" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="290" y="397" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">two-word combinations with consistent order</text><text x="290" y="425" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start" font-style="italic">"daddy shoe", "more juice"</text><rect x="40" y="451" width="220" height="72" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="150" y="483" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Telegraphic</text><text x="150" y="507" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">about 24-36 months</text><rect x="272" y="451" width="588" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="290" y="481" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">content words; function words and inflections missing</text><text x="290" y="509" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start" font-style="italic">"mummy put cup table"</text><rect x="40" y="535" width="220" height="72" rx="10" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5"/><text x="150" y="567" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Post-telegraphic</text><text x="150" y="591" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">from about 3 years</text><rect x="272" y="535" width="588" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="290" y="567" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">function words, inflections, inverted questions, joined</text><text x="290" y="587" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">clauses</text><rect x="40" y="625" width="820" height="60" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="450" y="662" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Ages are approximate and vary widely: rough guides, never rules.</text>
</svg>