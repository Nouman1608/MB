<text x="40" y="128" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Ava, about 2;6, playing with a toy farm with her father (invented transcript)</text><rect x="40" y="142" width="90" height="68" rx="9" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="85" y="182" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">AVA</text><rect x="138" y="142" width="380" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="156" y="182" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">cow (.) cow eated the grass ↗</text><line x1="520" y1="176" x2="542" y2="176" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="550" y="171" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="start">virtuous error "eated";</text><text x="550" y="193" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="start">article omitted</text><rect x="40" y="218" width="90" height="68" rx="9" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="85" y="258" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">DAD</text><rect x="138" y="218" width="380" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="156" y="247" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">yes (.) the cow ate the grass</text><text x="156" y="269" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">(.) what's the horse doing</text><line x1="520" y1="252" x2="542" y2="252" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="550" y="247" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">recast "ate"; wh-question</text><text x="550" y="269" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">hands over the turn</text><rect x="40" y="294" width="90" height="68" rx="9" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="85" y="334" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">AVA</text><rect x="138" y="294" width="380" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="156" y="323" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">horsey (.) horsey jumping (2)</text><text x="156" y="345" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">big jump</text><line x1="520" y1="328" x2="542" y2="328" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="550" y="334" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="start">telegraphic: auxiliary missing</text><rect x="40" y="370" width="90" height="46" rx="9" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="85" y="399" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">DAD</text><rect x="138" y="370" width="380" height="46" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="156" y="399" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">a big jump (.) wow</text><line x1="520" y1="393" x2="542" y2="393" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="550" y="399" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">repeats and praises</text><rect x="40" y="424" width="90" height="68" rx="9" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="85" y="464" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">AVA</text><rect x="138" y="424" width="380" height="68" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="156" y="464" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">me do it // me do it</text><line x1="520" y1="458" x2="542" y2="458" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="550" y="453" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="start">regulatory and personal;</text><text x="550" y="475" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="start">subject "me"</text><rect x="40" y="500" width="90" height="46" rx="9" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="85" y="529" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">DAD</text><rect x="138" y="500" width="380" height="46" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="156" y="529" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">// you do it (.) careful</text><line x1="520" y1="523" x2="542" y2="523" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="550" y="529" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start">overlap</text><rect x="40" y="562" width="400" height="104" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="64" y="594" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Supports Chomsky</text><text x="64" y="622" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">"eated" is inferred, not copied;</text><text x="64" y="643" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">compare Berko's "wug" test</text><rect x="460" y="562" width="400" height="104" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="484" y="594" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Supports Bruner's LASS</text><text x="484" y="622" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">recast without correction; the</text><text x="484" y="643" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">wh-question scaffolds Ava's turn</text>
