<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 622" width="900" height="622" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="622" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The four perspectives at a glance</text>

<rect x="30" y="104" width="412" height="236" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L427.75,105.25 Q440.75,105.25 440.75,118.25 L440.75,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="440.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Functionalism</text><text x="46" y="187.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">What does each institution do for society?</text><circle cx="51" cy="210.92" r="4.5" fill="#2e6b62"/><text x="64" y="216.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Durkheim, Parsons, Merton, Albert Cohen,</text><text x="64" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Davis and Moore, Willmott and Young</text><circle cx="51" cy="260.92" r="4.5" fill="#2e6b62"/><text x="64" y="266.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">+</tspan> Explains how societies hold together</text><circle cx="51" cy="289.92" r="4.5" fill="#2e6b62"/><text x="64" y="295.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">−</tspan> Idealised middle-class picture (Parsons);</text><text x="64" y="316.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ignores power</text><rect x="458" y="104" width="412" height="236" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,154 L459.25,118.25 Q459.25,105.25 472.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#dce9e7"/><line x1="459.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Marxism</text><text x="474" y="187.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Bourgeoisie exploit the proletariat</text><circle cx="479" cy="210.92" r="4.5" fill="#2e6b62"/><text x="492" y="216.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Bowles and Gintis (schooling), Zaretsky</text><text x="492" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(family)</text><circle cx="479" cy="260.92" r="4.5" fill="#2e6b62"/><text x="492" y="266.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">+</tspan> Explains persistent class inequality</text><circle cx="479" cy="289.92" r="4.5" fill="#2e6b62"/><text x="492" y="295.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">−</tspan> Neglects gender and ethnicity; Willis shows</text><text x="492" y="316.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">pupils resist</text><rect x="30" y="356" width="412" height="236" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,406 L31.25,370.25 Q31.25,357.25 44.25,357.25 L427.75,357.25 Q440.75,357.25 440.75,370.25 L440.75,406 Z" fill="#f2e7b8"/><line x1="31.25" y1="406" x2="440.75" y2="406" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="387" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Feminism</text><text x="46" y="439.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Society is patriarchal</text><circle cx="51" cy="462.92" r="4.5" fill="#2e6b62"/><text x="64" y="468.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Oakley, Delphy and Leonard, Walby,</text><text x="64" y="489.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Heidensohn, Carlen</text><circle cx="51" cy="512.9200000000001" r="4.5" fill="#2e6b62"/><text x="64" y="518.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">+</tspan> Made gender and housework visible</text><circle cx="51" cy="541.9200000000001" r="4.5" fill="#2e6b62"/><text x="64" y="547.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">−</tspan> Generalises about women; feminists disagree</text><text x="64" y="568.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">on the cause</text><rect x="458" y="356" width="412" height="236" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,406 L459.25,370.25 Q459.25,357.25 472.25,357.25 L855.75,357.25 Q868.75,357.25 868.75,370.25 L868.75,406 Z" fill="#efdfa8"/><line x1="459.25" y1="406" x2="868.75" y2="406" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="387" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Interactionism</text><text x="474" y="439.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Meanings and labels in everyday interaction</text><circle cx="479" cy="462.92" r="4.5" fill="#2e6b62"/><text x="492" y="468.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Becker (labelling, master status); Ball</text><text x="492" y="489.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(Beachside)</text><circle cx="479" cy="512.9200000000001" r="4.5" fill="#2e6b62"/><text x="492" y="518.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">+</tspan> People actively create social life</text><circle cx="479" cy="541.9200000000001" r="4.5" fill="#2e6b62"/><text x="492" y="547.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">−</tspan> Says less about where labels come from</text>
</svg>