<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 605" width="900" height="605" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="605" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three founders compared</text>

<rect x="168" y="104" width="228.66666666666666" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="282.3333333333333" y="131.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Durkheim</text><rect x="404.66666666666663" y="104" width="228.66666666666666" height="44" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="519" y="131.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Marx</text><rect x="641.3333333333333" y="104" width="228.66666666666666" height="44" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="755.6666666666666" y="131.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Weber</text><rect x="30" y="156" width="130" height="93" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="196.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Time and</text><text x="42" y="218.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">place</text><rect x="168" y="156" width="228.66666666666666" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="182" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">France, Third Republic:</text><text x="182" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">industrialisation weakens</text><text x="182" y="228.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">old ties</text><rect x="404.66666666666663" y="156" width="228.66666666666666" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="418.66666666666663" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">19th-century Britain:</text><text x="418.66666666666663" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">first industrial</text><text x="418.66666666666663" y="228.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">capitalist society</text><rect x="641.3333333333333" y="156" width="228.66666666666666" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="655.3333333333333" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Germany: fast</text><text x="655.3333333333333" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">industrialisation, big</text><text x="655.3333333333333" y="228.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">bureaucracies</text><rect x="30" y="257" width="130" height="114" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="308.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Central</text><text x="42" y="330.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">idea</text><rect x="168" y="257" width="228.66666666666666" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="182" y="287.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">What holds society</text><text x="182" y="308.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">together? Shared norms</text><text x="182" y="329.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and values; without them,</text><text x="182" y="350.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">anomie</text><rect x="404.66666666666663" y="257" width="228.66666666666666" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="418.66666666666663" y="287.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Class struggle drives</text><text x="418.66666666666663" y="308.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">change; ruling class</text><text x="418.66666666666663" y="329.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ideology</text><rect x="641.3333333333333" y="257" width="228.66666666666666" height="114" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="655.3333333333333" y="287.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Class, status and party;</text><text x="655.3333333333333" y="308.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">three types of authority</text><rect x="30" y="379" width="130" height="93" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="430.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Contribution</text><rect x="168" y="379" width="228.66666666666666" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="182" y="409.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Study “social facts”</text><text x="182" y="430.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">scientifically; Suicide</text><text x="182" y="451.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">used statistics</text><rect x="404.66666666666663" y="379" width="228.66666666666666" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="418.66666666666663" y="409.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Founded the conflict</text><text x="418.66666666666663" y="430.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">tradition</text><rect x="641.3333333333333" y="379" width="228.66666666666666" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="655.3333333333333" y="409.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Understanding meanings;</text><text x="655.3333333333333" y="430.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ideas can cause change</text><rect x="30" y="480" width="130" height="93" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="531.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Criticism</text><rect x="168" y="480" width="228.66666666666666" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="182" y="510.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Overstated consensus;</text><text x="182" y="531.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">suicide statistics are</text><text x="182" y="552.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">social constructions</text><rect x="404.66666666666663" y="480" width="228.66666666666666" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="418.66666666666663" y="510.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No revolution in Britain;</text><text x="418.66666666666663" y="531.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the middle class grew</text><rect x="641.3333333333333" y="480" width="228.66666666666666" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="655.3333333333333" y="510.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Marxists: ownership is</text><text x="655.3333333333333" y="531.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">still the main division</text>
</svg>