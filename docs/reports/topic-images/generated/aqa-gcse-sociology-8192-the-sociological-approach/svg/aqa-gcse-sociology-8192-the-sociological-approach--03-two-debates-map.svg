<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" width="900" height="710" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="710" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two debates, four perspectives</text>

<rect x="120" y="140" width="350" height="440" fill="#dce9e7"/><rect x="470" y="140" width="350" height="440" fill="#f2e7b8"/><rect x="120" y="140" width="700" height="440" fill="none" stroke="#1e2a44" stroke-width="2.5"/><line x1="470" y1="140" x2="470" y2="580" stroke="#1e2a44" stroke-width="2" stroke-dasharray="6 6"/><line x1="120" y1="360" x2="820" y2="360" stroke="#1e2a44" stroke-width="2" stroke-dasharray="6 6"/><text x="295" y="126" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">CONSENSUS</text><text x="645" y="126" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">CONFLICT</text><text x="96" y="250" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 96 250)">STRUCTURE</text><text x="96" y="470" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 96 470)">AGENCY</text><text x="134" y="348" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">institutions shape people</text><text x="134" y="386" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">people interpret and choose</text><rect x="195" y="182" width="200" height="72" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="295" y="212" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Functionalism</text><text x="295" y="238" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">shared values</text><rect x="545" y="182" width="200" height="72" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="645" y="212" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Marxism</text><text x="645" y="238" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">ruling class</text><rect x="545" y="272" width="200" height="72" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="645" y="302" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Feminism</text><text x="645" y="328" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">men benefit</text><rect x="370" y="454" width="200" height="72" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="470" y="484" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Interactionism</text><text x="470" y="510" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">meanings, labels</text><rect x="30" y="604" width="840" height="82" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="640" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Interactionism sits on the line: it studies small-scale interaction, not society-wide</text><text x="56" y="662" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">agreement or conflict.</text>
</svg>