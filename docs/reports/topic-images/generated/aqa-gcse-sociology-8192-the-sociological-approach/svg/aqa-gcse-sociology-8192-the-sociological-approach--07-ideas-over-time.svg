<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 682" width="900" height="682" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="682" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Sociological ideas change over time</text>

<line x1="140" y1="120" x2="140" y2="652" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="118" y="164" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="end">1959</text><circle cx="140" cy="158" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="166" y="128" width="470" height="64" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="182" y="154" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Parsons</text><text x="182" y="178" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Criticised for an idealised middle-class picture of the family</text><text x="118" y="240" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="end">1977</text><circle cx="140" cy="234" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="166" y="204" width="470" height="64" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="182" y="230" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Willis</text><text x="182" y="254" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Manual work was relatively easy to get in the 1970s</text><text x="118" y="316" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="end">1980</text><circle cx="140" cy="310" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="166" y="280" width="470" height="64" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="182" y="306" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Halsey and colleagues</text><text x="182" y="330" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Studied males only</text><text x="118" y="392" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="end">1982</text><circle cx="140" cy="386" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="166" y="356" width="470" height="64" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="182" y="382" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The Rapoports</text><text x="182" y="406" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Predates open acceptance of gay and lesbian households</text><text x="118" y="468" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="end">1984</text><circle cx="140" cy="462" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="166" y="432" width="470" height="64" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="182" y="458" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Murray</text><text x="182" y="482" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">New Right ideas challenge both traditions</text><text x="118" y="544" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="end">1990</text><circle cx="140" cy="538" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="166" y="508" width="470" height="64" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="182" y="534" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Walby</text><text x="182" y="558" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Patriarchy has moved from private to public</text><text x="118" y="620" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="end">1992</text><circle cx="140" cy="614" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="166" y="584" width="470" height="64" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="182" y="610" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Devine</text><text x="182" y="634" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Did not find the “privatised instrumentalism” of the 1960s</text><rect x="656" y="128" width="214" height="64" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="763" y="156" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Functionalism</text><text x="763" y="178" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">influential mid-century</text><rect x="656" y="204" width="100" height="444" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="706" y="426" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 706 426)">Conflict and feminist approaches grow</text><rect x="770" y="432" width="100" height="216" rx="12" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><text x="820" y="540" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 820 540)">New Right (Murray)</text>
</svg>