<rect width="900" height="660" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How a society passes on its rules</text>

<rect x="30" y="108" width="250.66666666666666" height="127" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="155.33333333333331" y="140.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Values</text><text x="155.33333333333331" y="170.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Shared beliefs about what is</text><text x="155.33333333333331" y="191.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">important, e.g. honesty,</text><text x="155.33333333333331" y="212.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">achievement</text><line x1="284.66666666666663" y1="171.5" x2="320.66666666666663" y2="171.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="324.66666666666663" y="108" width="250.66666666666666" height="127" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="449.99999999999994" y="140.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Norms</text><text x="449.99999999999994" y="170.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Unwritten rules that put</text><text x="449.99999999999994" y="191.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">values into practice, e.g.</text><text x="449.99999999999994" y="212.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">queuing</text><line x1="579.3333333333333" y1="171.5" x2="615.3333333333333" y2="171.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="619.3333333333333" y="108" width="250.66666666666666" height="127" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="744.6666666666666" y="150.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Sanctions</text><text x="744.6666666666666" y="180.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Rewards and punishments that</text><text x="744.6666666666666" y="201.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">make people follow norms</text><text x="450" y="279" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Learned through socialisation, a lifelong process</text><rect x="30" y="299" width="300" height="170" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="180" y="339" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Primary</text><text x="180" y="365" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">socialisation</text><rect x="135" y="407" width="90" height="48" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M127,407 L180,379 L233,407 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><text x="180" y="439" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">family</text><line x1="336" y1="384" x2="384" y2="384" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="390" y="299" width="480" height="170" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="630" y="339" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Secondary socialisation</text><rect x="406" y="361" width="216" height="40" rx="20" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="514" y="387" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">schools</text><rect x="634" y="361" width="216" height="40" rx="20" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="742" y="387" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">peer groups</text><rect x="406" y="411" width="216" height="40" rx="20" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="514" y="437" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">religion</text><rect x="634" y="411" width="216" height="40" rx="20" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="742" y="437" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">mass media</text><rect x="30" y="489" width="269.3333333333333" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,539 L31.25,503.25 Q31.25,490.25 44.25,490.25 L285.0833333333333,490.25 Q298.0833333333333,490.25 298.0833333333333,503.25 L298.0833333333333,539 Z" fill="#f2e7b8"/><line x1="31.25" y1="539" x2="298.0833333333333" y2="539" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="519.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Status: ascribed</text><text x="44" y="570.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fixed at birth, such as sex or</text><text x="44" y="591.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a royal title</text><rect x="315.3333333333333" y="489" width="269.3333333333333" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,539 L316.5833333333333,503.25 Q316.5833333333333,490.25 329.5833333333333,490.25 L570.4166666666666,490.25 Q583.4166666666666,490.25 583.4166666666666,503.25 L583.4166666666666,539 Z" fill="#dce9e7"/><line x1="316.5833333333333" y1="539" x2="583.4166666666666" y2="539" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="519.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Status: achieved</text><text x="329.3333333333333" y="570.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Earned, such as a</text><text x="329.3333333333333" y="591.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">qualification</text><rect x="600.6666666666666" y="489" width="269.3333333333333" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,539 L601.9166666666666,503.25 Q601.9166666666666,490.25 614.9166666666666,490.25 L855.75,490.25 Q868.75,490.25 868.75,503.25 L868.75,539 Z" fill="#ffffff"/><line x1="601.9166666666666" y1="539" x2="868.75" y2="539" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="519.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Roles</text><text x="614.6666666666666" y="570.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Behaviour expected in a</text><text x="614.6666666666666" y="591.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">position: parent, pupil,</text><text x="614.6666666666666" y="612.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">police officer</text>
</svg>