<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 556" width="900" height="556" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="556" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">al-Ghazali (1058–1111): law and spirit together</text>

<rect x="30" y="112" width="260" height="120" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="160" y="156" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Correct practice</text><text x="160" y="184" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">under the Sharia</text><rect x="610" y="112" width="260" height="120" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="740" y="156" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Inner sincerity</text><text x="740" y="184" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">the Sufi path</text><text x="450" y="164" font-size="48" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><line x1="160" y1="236" x2="400" y2="308" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="740" y1="236" x2="500" y2="308" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="300" y="312" width="300" height="70" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="355" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">True faith</text><text x="450" y="408" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle" font-style="italic">Ihya Ulum al-Din (The Revival of the Religious Sciences)</text><rect x="30" y="432" width="270" height="94" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="461.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Brought Sufism within</text><text x="48" y="482.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mainstream Sunni Islam</text><rect x="315" y="432" width="270" height="94" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="333" y="461.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Criticised philosophers who</text><text x="333" y="482.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">put reason above revelation</text><rect x="600" y="432" width="270" height="94" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="618" y="461.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Shaped teaching in madrasas</text><text x="618" y="482.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and Sufi orders in the</text><text x="618" y="503.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">subcontinent for centuries</text>
</svg>