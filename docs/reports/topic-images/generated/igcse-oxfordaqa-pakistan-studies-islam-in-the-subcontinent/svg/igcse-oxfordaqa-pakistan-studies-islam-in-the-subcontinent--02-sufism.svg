<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 695" width="900" height="695" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="695" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How Sufism is organised</text>

<rect x="330" y="112" width="240" height="80" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="146" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Master</text><text x="450" y="172" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">pir or shaikh</text><rect x="150" y="252" width="120" height="56" rx="28" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="210" y="286" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">murid</text><line x1="450" y1="194" x2="210" y2="250" stroke="#2e6b62" stroke-width="2.5"/><rect x="310" y="252" width="120" height="56" rx="28" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="370" y="286" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">murid</text><line x1="450" y1="194" x2="370" y2="250" stroke="#2e6b62" stroke-width="2.5"/><rect x="470" y="252" width="120" height="56" rx="28" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="530" y="286" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">murid</text><line x1="450" y1="194" x2="530" y2="250" stroke="#2e6b62" stroke-width="2.5"/><rect x="630" y="252" width="120" height="56" rx="28" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="690" y="286" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">murid</text><line x1="450" y1="194" x2="690" y2="250" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="338" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">disciples gather around the master</text><rect x="30" y="112" width="260" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="142" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">khanqah</text><text x="46" y="164" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the lodge where all</text><text x="46" y="186" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">backgrounds are welcomed</text><rect x="610" y="112" width="260" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="626" y="142" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">silsila</text><text x="626" y="164" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">an order: a chain of</text><text x="626" y="186" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">masters and disciples</text><rect x="30" y="362" width="840" height="208" rx="12" fill="#ffffff"/><path d="M30,406 L30,374 Q30,362 42,362 L858,362 Q870,362 870,374 L870,406 Z" fill="#b5d3cf"/><rect x="30" y="406" width="840" height="41" fill="#ffffff"/><text x="42" y="431.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">—</text><text x="242" y="431.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ali Hujwiri (Data Ganj Bakhsh) of Lahore, author of Kashf al-Mahjub</text><line x1="30" y1="406" x2="870" y2="406" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="447" width="840" height="41" fill="#dce9e7"/><text x="42" y="472.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Chishti</text><text x="242" y="472.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Khwaja Moinuddin Chishti of Ajmer, founder of the order in India</text><line x1="30" y1="447" x2="870" y2="447" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="488" width="840" height="41" fill="#ffffff"/><text x="42" y="513.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Suhrawardi</text><text x="242" y="513.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Bahauddin Zakariya of Multan</text><line x1="30" y1="488" x2="870" y2="488" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="529" width="840" height="41" fill="#dce9e7"/><text x="42" y="554.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Qadiri, Naqshbandi</text><text x="242" y="554.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Spread later</text><line x1="30" y1="529" x2="870" y2="529" stroke="#c9d6d4" stroke-width="1.5"/><line x1="230" y1="362" x2="230" y2="570" stroke="#c9d6d4" stroke-width="1.5"/><text x="42" y="391.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Order</text><text x="242" y="391.45" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Figure in the lesson</text><rect x="30" y="362" width="840" height="208" rx="12" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="590" width="840" height="75" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="620.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Sufi practice: remembrance of Allah (dhikr), self-discipline and love of Allah, alongside obedience to</text><text x="48" y="642.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the Sharia. Saints spread Islam by example and service to the poor.</text>
</svg>