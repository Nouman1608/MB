<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 554" width="900" height="554" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="554" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Muhammad bin Qasim and Sindh, 711–712</text>

<rect x="30" y="112" width="260" height="147" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Umayyad Caliphate</text><text x="48" y="173.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Governor Hajjaj bin Yusuf</text><text x="48" y="194.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sends the young commander</text><text x="48" y="215.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Muhammad bin Qasim to</text><text x="48" y="236.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sindh</text><line x1="294" y1="185.5" x2="316" y2="185.5" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="320" y="112" width="260" height="147" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="338" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">711–712</text><text x="338" y="173.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Captures the port of Debal;</text><text x="338" y="194.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">defeats Raja Dahir</text><line x1="584" y1="185.5" x2="606" y2="185.5" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="610" y="112" width="260" height="147" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="628" y="145" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Result</text><text x="628" y="173.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sindh and southern Punjab,</text><text x="628" y="194.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">including Multan, under</text><text x="628" y="215.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Muslim rule</text><text x="30" y="287" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">RELIGIOUS IMPACT</text><rect x="30" y="299" width="197" height="131" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="327.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">First part of the</text><text x="48" y="347.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">subcontinent under</text><text x="48" y="367.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Muslim rule</text><rect x="244.3" y="299" width="197" height="131" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="262.3" y="327.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Mosques built</text><rect x="458.6" y="299" width="197" height="131" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="476.6" y="327.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Hindus and Buddhists</text><text x="476.6" y="347.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">given protected status</text><text x="476.6" y="367.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">and kept their places</text><text x="476.6" y="387.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">of worship, on</text><text x="476.6" y="407.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">payment of jizya</text><rect x="672.9000000000001" y="299" width="197" height="131" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="690.9000000000001" y="327.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Trade and learning</text><text x="690.9000000000001" y="347.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">linked Sindh to the</text><text x="690.9000000000001" y="367.75" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">wider Muslim world</text><line x1="450" y1="434" x2="450" y2="456" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="200" y="460" width="500" height="64" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="490" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Sindh: Bab-ul-Islam</text><text x="450" y="512" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">“the gateway of Islam”</text>
</svg>