<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 647" width="900" height="647" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="647" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Shah Waliullah’s answers to Muslim weakness</text>

<text x="225" y="136" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">Problem</text><text x="665" y="136" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Related reform</text><rect x="30" y="152" width="390" height="94" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="181.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Political decline after 1707: weak emperors,</text><text x="48" y="202.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rival nobles, Maratha and Sikh expansion,</text><text x="48" y="223.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">invasions</text><rect x="460" y="152" width="410" height="94" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="181.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Wrote to Muslim rulers urging them to defend</text><text x="478" y="202.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Muslim power; letters to Ahmad Shah Abdali</text><text x="478" y="223.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">linked to the Third Battle of Panipat (1761)</text><line x1="424" y1="199" x2="454" y2="199" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="258" width="390" height="73" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="287.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Many Muslims had little direct knowledge of</text><text x="48" y="308.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the Qur’an, mainly available in Arabic</text><rect x="460" y="258" width="410" height="73" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="287.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Translated the Qur’an into Persian; his sons later</text><text x="478" y="308.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">produced Urdu translations</text><line x1="424" y1="294.5" x2="454" y2="294.5" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="343" width="390" height="73" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="372.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Division between Sunnis and Shias</text><rect x="460" y="343" width="410" height="73" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="372.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Tried to reduce sectarian conflict and reconcile</text><text x="478" y="393.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the schools of thought</text><line x1="424" y1="379.5" x2="454" y2="379.5" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="428" width="390" height="94" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="457.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Scholars stressing law vs popular customs at</text><text x="48" y="478.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">shrines</text><rect x="460" y="428" width="410" height="94" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="457.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Stressed the Sharia and hadith; wrote Hujjat Allah</text><text x="478" y="478.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">al-Baligha explaining the reasons behind Islamic</text><text x="478" y="499.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">law</text><line x1="424" y1="475" x2="454" y2="475" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="542" width="840" height="75" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="572.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Shah Waliullah (1703–1762) of Delhi studied and taught at the Madrasa Rahimiya founded by his</text><text x="48" y="594.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">father, Shah Abdur Rahim, and studied hadith in Madinah after the Hajj.</text>
</svg>