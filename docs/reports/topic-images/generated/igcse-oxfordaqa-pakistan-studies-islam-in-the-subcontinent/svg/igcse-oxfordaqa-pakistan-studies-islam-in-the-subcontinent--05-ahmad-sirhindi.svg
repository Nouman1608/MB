<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 685" width="900" height="685" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="685" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Ahmad Sirhindi (1564–1624) and orthodox revival</text>

<line x1="100" y1="130" x2="100" y2="645" stroke="#1e2a44" stroke-width="4"/><rect x="192" y="120" width="678" height="103" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="210" y="151.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Born in Sirhind, Punjab</text><text x="210" y="179.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A scholar of the Naqshbandi order; known as Mujaddid Alf Thani, “renewer of the</text><text x="210" y="200.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">second millennium”.</text><rect x="192" y="233" width="678" height="82" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="210" y="264.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Opposes syncretism at court</text><text x="210" y="292.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Including the Din-i-Ilahi. Argues that Sufism must follow the Sharia strictly.</text><rect x="192" y="325" width="678" height="82" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="210" y="356.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Hundreds of letters (Maktubat)</text><text x="210" y="384.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Urge nobles to return to orthodox practice.</text><rect x="192" y="417" width="678" height="54" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="210" y="448.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Imprisoned in Gwalior fort, then released</text><rect x="192" y="481" width="678" height="82" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="210" y="512.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Dies</text><text x="210" y="540.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">His influence helps revive orthodox Sunni Sufism.</text><rect x="192" y="573" width="678" height="82" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="210" y="604.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">More orthodox policies</text><text x="210" y="632.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Often linked to Sirhindi’s influence; the Fatawa-e-Alamgiri is compiled.</text><rect x="30" y="134" width="140" height="40" rx="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="100" y="161" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1564</text><line x1="170" y1="154" x2="192" y2="154" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="247" width="140" height="40" rx="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="100" y="274" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Akbar</text><line x1="170" y1="267" x2="192" y2="267" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="339" width="140" height="40" rx="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="100" y="366" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Letters</text><line x1="170" y1="359" x2="192" y2="359" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="424" width="140" height="40" rx="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="100" y="451" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Jahangir</text><line x1="170" y1="444" x2="192" y2="444" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="495" width="140" height="40" rx="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="100" y="522" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1624</text><line x1="170" y1="515" x2="192" y2="515" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="587" width="140" height="40" rx="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="100" y="614" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Aurangzeb</text><line x1="170" y1="607" x2="192" y2="607" stroke="#1e2a44" stroke-width="2.5"/>
</svg>