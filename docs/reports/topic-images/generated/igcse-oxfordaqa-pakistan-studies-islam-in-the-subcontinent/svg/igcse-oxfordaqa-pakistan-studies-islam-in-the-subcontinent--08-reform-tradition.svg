<line x1="450" y1="198" x2="450" y2="216" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="308" x2="240" y2="326" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="308" x2="660" y2="326" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="240" y1="418" x2="240" y2="446" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><path d="M660,416 L660,494 L366,494" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 6"/><text x="670" y="484" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="start">jihad together from 1826</text><rect x="330" y="112" width="240" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="148" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Shah Abdur Rahim</text><text x="450" y="174" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">founded the Madrasa Rahimiya</text><rect x="330" y="222" width="240" height="84" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="258" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Shah Waliullah</text><text x="450" y="284" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">1703–1762</text><rect x="120" y="332" width="240" height="84" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="240" y="368" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Shah Abdul Aziz</text><text x="240" y="394" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">his son</text><rect x="540" y="332" width="240" height="84" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="660" y="368" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Shah Ismail Shaheed</text><text x="660" y="394" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">his grandson</text><rect x="120" y="452" width="240" height="84" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="240" y="488" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Syed Ahmad Barelvi</text><text x="240" y="514" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">studied under Shah Abdul Aziz</text><line x1="240" y1="540" x2="240" y2="574" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><rect x="30" y="580" width="340" height="56" rx="12" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="200" y="615" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Ahl-i-Hadith</text><rect x="400" y="580" width="470" height="56" rx="12" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="635" y="615" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Deobandi movement (Deoband, 1867)</text><text x="256" y="558" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">the movement later influenced</text>
