<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 758" width="900" height="758" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="758" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Syed Ahmad Barelvi and the Jihad movement</text>

<line x1="95" y1="130" x2="95" y2="623" stroke="#1e2a44" stroke-width="4"/><rect x="182" y="120" width="688" height="103" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="200" y="151.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Born at Rae Bareli</text><text x="200" y="179.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Studies under Shah Abdul Aziz in Delhi; serves in the cavalry of the Pathan leader Amir</text><text x="200" y="200.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Khan.</text><rect x="182" y="233" width="688" height="82" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="200" y="264.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Tariqa-i-Muhammadiya</text><text x="200" y="292.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A purified Islam, opposing practices he saw as un-Islamic.</text><rect x="182" y="325" width="688" height="103" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="200" y="356.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Jihad against Sikh rule in the north-west</text><text x="200" y="384.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">With Shah Ismail Shaheed; aims to restore Muslim freedom of worship and set up a</text><text x="200" y="405.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">state on Islamic lines.</text><rect x="182" y="438" width="688" height="103" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="200" y="469.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Peshawar held briefly</text><text x="200" y="497.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Then rivalries among Pathan leaders, tax disputes and Sikh military strength weaken</text><text x="200" y="518.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the movement.</text><rect x="182" y="551" width="688" height="82" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="200" y="582.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Battle of Balakot</text><text x="200" y="610.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Syed Ahmad and Shah Ismail are killed.</text><rect x="30" y="134" width="130" height="40" rx="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="95" y="161" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1786</text><line x1="160" y1="154" x2="182" y2="154" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="247" width="130" height="40" rx="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="95" y="274" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Beliefs</text><line x1="160" y1="267" x2="182" y2="267" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="339" width="130" height="40" rx="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="95" y="366" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1826</text><line x1="160" y1="359" x2="182" y2="359" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="452" width="130" height="40" rx="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="95" y="479" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1830</text><line x1="160" y1="472" x2="182" y2="472" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="565" width="130" height="40" rx="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="95" y="592" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1831</text><line x1="160" y1="585" x2="182" y2="585" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="653" width="840" height="75" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="683.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Context: Ranjit Singh’s Sikh state restricted Muslim worship in Punjab and the north-west, including</text><text x="48" y="705.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the call to prayer in some areas.</text>
</svg>