<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 671" width="900" height="671" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="671" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From topic to thesis</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Worked example 1: cars in city centres</text>
<rect x="30" y="122" width="840" height="84.84" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="48" y="156" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start" xml:space="preserve">Draft</text><text x="48" y="184.85" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“City centres and cars are a big problem today.” <tspan font-weight="700" fill="#b5602e">Vague;</tspan> <tspan font-weight="700" fill="#b5602e">takes</tspan> <tspan font-weight="700" fill="#b5602e">no</tspan> <tspan font-weight="700" fill="#b5602e">position.</tspan></text><line x1="450" y1="216" x2="450" y2="242" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="30" y="260" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Revised: position + qualification + reason</text><rect x="30" y="276" width="416.71892" height="36" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="238.35946" y="300.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">City centres should be closed to private cars,</text><text x="238.35946" y="333.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">position</text><rect x="454.71892" y="276" width="407.26352" height="36" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="658.35068" y="300.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">with exceptions for residents and deliveries,</text><text x="658.35068" y="333.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">qualification</text><rect x="30" y="358.3" width="486.81865999999997" height="36" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="273.40932999999995" y="382.6" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">because the gains in air quality and pedestrian safety</text><text x="273.40932999999995" y="415.8" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">reason</text><rect x="30" y="440.6" width="360.85790000000003" height="36" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="210.42895000000001" y="464.90000000000003" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">outweigh the inconvenience to drivers.</text><text x="210.42895000000001" y="498.1" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">reason (weighed)</text><rect x="30" y="534.9000000000001" width="201" height="105.84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="42" y="560.5000000000001" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">✓ Arguable</text><text x="42" y="586.0900000000001" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">drivers and</text><text x="42" y="605.8900000000001" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">shopkeepers might</text><text x="42" y="625.6900000000002" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">dispute it</text><rect x="243" y="534.9000000000001" width="201" height="105.84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="255" y="560.5000000000001" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">✓ Specific</text><text x="255" y="586.0900000000001" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">area, exceptions,</text><text x="255" y="605.8900000000001" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">reason</text><rect x="456" y="534.9000000000001" width="201" height="105.84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="468" y="560.5000000000001" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">✓ Focused</text><text x="468" y="586.0900000000001" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">defensible in a few</text><text x="468" y="605.8900000000001" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">paragraphs</text><rect x="669" y="534.9000000000001" width="201" height="105.84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="681" y="560.5000000000001" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">✓ Responsive</text><text x="681" y="586.0900000000001" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">takes a position on the</text><text x="681" y="605.8900000000001" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">prompt</text>
</svg>