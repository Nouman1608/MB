<rect x="30" y="96" width="269.3333333333333" height="141.56" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="80" y="127.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Announcement</text><text x="46" y="154.68" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“In this essay I will discuss</text><text x="46" y="175.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">pollution.”</text><text x="46" y="196.92000000000002" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">a</tspan> <tspan font-weight="700" fill="#b5602e">topic</tspan> <tspan font-weight="700" fill="#b5602e">and</tspan> <tspan font-weight="700" fill="#b5602e">a</tspan> <tspan font-weight="700" fill="#b5602e">plan,</tspan> <tspan font-weight="700" fill="#b5602e">not</tspan> <tspan font-weight="700" fill="#b5602e">a</tspan></text><text x="46" y="218.04000000000002" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">position</tspan></text><rect x="315.3333333333333" y="96" width="269.3333333333333" height="141.56" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="365.3333333333333" y="127.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Fact</text><text x="331.3333333333333" y="154.68" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Pollution is a problem in</text><text x="331.3333333333333" y="175.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">many cities.”</text><text x="331.3333333333333" y="196.92000000000002" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">nobody</tspan> <tspan font-weight="700" fill="#b5602e">disputes</tspan> <tspan font-weight="700" fill="#b5602e">it</tspan></text><rect x="600.6666666666666" y="96" width="269.3333333333333" height="141.56" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="650.6666666666666" y="127.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Restated prompt</text><text x="616.6666666666666" y="154.68" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Cars should or should not be</text><text x="616.6666666666666" y="175.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">banned.”</text><text x="616.6666666666666" y="196.92000000000002" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">no</tspan> <tspan font-weight="700" fill="#b5602e">stance</tspan> <tspan font-weight="700" fill="#b5602e">on</tspan> <tspan font-weight="700" fill="#b5602e">the</tspan> <tspan font-weight="700" fill="#b5602e">question</tspan></text><rect x="30" y="253.56" width="269.3333333333333" height="162.68" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="80" y="284.76" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Vague evaluation</text><text x="46" y="312.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“This speech is very</text><text x="46" y="333.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">effective.”</text><text x="46" y="354.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">say</tspan> <tspan font-weight="700" fill="#b5602e">how</tspan> <tspan font-weight="700" fill="#b5602e">and</tspan> <tspan font-weight="700" fill="#b5602e">why</tspan></text><rect x="315.3333333333333" y="253.56" width="269.3333333333333" height="162.68" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="365.3333333333333" y="284.76" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Unconnected list</text><text x="331.3333333333333" y="312.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“The writer uses imagery,</text><text x="331.3333333333333" y="333.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">repetition and rhetorical</text><text x="331.3333333333333" y="354.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">questions.”</text><text x="331.3333333333333" y="375.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">devices</tspan> <tspan font-weight="700" fill="#b5602e">without</tspan> <tspan font-weight="700" fill="#b5602e">what</tspan> <tspan font-weight="700" fill="#b5602e">they</tspan></text><text x="331.3333333333333" y="396.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">accomplish</tspan></text><rect x="600.6666666666666" y="253.56" width="269.3333333333333" height="162.68" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="650.6666666666666" y="284.76" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Overreach</text><text x="616.6666666666666" y="312.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“This policy will solve all of</text><text x="616.6666666666666" y="333.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">society’s problems.”</text><text x="616.6666666666666" y="354.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#b5602e">cannot</tspan> <tspan font-weight="700" fill="#b5602e">be</tspan> <tspan font-weight="700" fill="#b5602e">defended</tspan></text><circle cx="60" cy="126" r="13" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><line x1="54" y1="120" x2="66" y2="132" stroke="#b5602e" stroke-width="3"/><line x1="66" y1="120" x2="54" y2="132" stroke="#b5602e" stroke-width="3"/><circle cx="345.3333333333333" cy="126" r="13" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><line x1="339.3333333333333" y1="120" x2="351.3333333333333" y2="132" stroke="#b5602e" stroke-width="3"/><line x1="351.3333333333333" y1="120" x2="339.3333333333333" y2="132" stroke="#b5602e" stroke-width="3"/><circle cx="630.6666666666666" cy="126" r="13" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><line x1="624.6666666666666" y1="120" x2="636.6666666666666" y2="132" stroke="#b5602e" stroke-width="3"/><line x1="636.6666666666666" y1="120" x2="624.6666666666666" y2="132" stroke="#b5602e" stroke-width="3"/><circle cx="60" cy="283.56" r="13" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><line x1="54" y1="277.56" x2="66" y2="289.56" stroke="#b5602e" stroke-width="3"/><line x1="66" y1="277.56" x2="54" y2="289.56" stroke="#b5602e" stroke-width="3"/><circle cx="345.3333333333333" cy="283.56" r="13" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><line x1="339.3333333333333" y1="277.56" x2="351.3333333333333" y2="289.56" stroke="#b5602e" stroke-width="3"/><line x1="351.3333333333333" y1="277.56" x2="339.3333333333333" y2="289.56" stroke="#b5602e" stroke-width="3"/><circle cx="630.6666666666666" cy="283.56" r="13" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><line x1="624.6666666666666" y1="277.56" x2="636.6666666666666" y2="289.56" stroke="#b5602e" stroke-width="3"/><line x1="636.6666666666666" y1="277.56" x2="624.66