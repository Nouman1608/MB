<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 543" width="900" height="543" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="543" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Anatomy of an analysis thesis</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Worked example 2: the Gettysburg Address</text>
<rect x="30" y="128" width="744.85838" height="36" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="402.42919" y="152.3" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">By stressing that the living cannot add to what the dead have already consecrated,</text><text x="402.42919" y="185.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">the situation the choices respond to</text><rect x="30" y="210.3" width="129.62702000000002" height="36" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" /><text x="94.81351000000001" y="234.60000000000002" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Lincoln uses</text><rect x="167.62702000000002" y="210.3" width="424.59842000000003" height="36" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="379.92623000000003" y="234.60000000000002" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">humility, repetition and a turn to “us the living”</text><text x="379.92623000000003" y="267.8" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">strategies</text><rect x="600.22544" y="210.3" width="79.75675" height="36" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2" /><text x="640.103815" y="234.60000000000002" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">to</text><text x="640.103815" y="267.8" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">key word</text><rect x="30" y="292.6" width="599.375" height="36" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="329.6875" y="316.90000000000003" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">transform a memorial into a call to continue “the unfinished work”.</text><text x="329.6875" y="350.1" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">what the choices accomplish</text><rect x="30" y="386.90000000000003" width="408" height="125.75999999999999" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="48" y="420.90000000000003" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start" xml:space="preserve">Weak</text><text x="48" y="448.90000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Lincoln uses repetition, imagery and a serious</text><text x="48" y="470.02000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">tone.” Names devices; could apply to any</text><text x="48" y="491.14000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">speech.</text><rect x="462" y="386.90000000000003" width="408" height="125.75999999999999" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="480" y="420.90000000000003" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Strong</text><text x="480" y="448.90000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Links the choices to a purpose for this</text><text x="480" y="470.02000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">audience: honour the dead, call the living to the</text><text x="480" y="491.14000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">work.</text>
</svg>