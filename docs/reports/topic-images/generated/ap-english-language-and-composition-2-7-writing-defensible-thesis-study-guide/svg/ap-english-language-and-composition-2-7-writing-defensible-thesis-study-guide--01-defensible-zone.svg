<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 402" width="900" height="402" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="402" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Between obvious and impossible</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A defensible thesis needs a defence and can be given one</text>
<rect x="30" y="162" width="250" height="70" rx="12" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><rect x="290" y="162" width="320" height="70" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="3.5"/><rect x="620" y="162" width="250" height="70" rx="12" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="155" y="192" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">Needs no defence</text><text x="155" y="216" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">obvious or a bare fact</text><text x="450" y="192" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">Defensible</text><text x="450" y="216" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">arguable and supportable</text><text x="745" y="192" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">Cannot be defended</text><text x="745" y="216" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">too vast or vague</text><text x="30" y="148" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start" xml:space="preserve">← too safe</text><text x="870" y="148" font-size="16" font-weight="700" fill="#4a5568" text-anchor="end" xml:space="preserve">too big →</text><line x1="155" y1="234" x2="155" y2="266" stroke="#b5602e" stroke-width="2.5"/><rect x="35" y="268" width="240" height="96" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="155" y="321.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“Social media exists.”</text><line x1="450" y1="234" x2="450" y2="266" stroke="#2e6b62" stroke-width="2.5"/><rect x="300" y="268" width="300" height="96" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5" /><text x="450" y="299.92" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“Social media has made</text><text x="450" y="321.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">teenagers better informed but</text><text x="450" y="342.16" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">less able to concentrate.”</text><line x1="745" y1="234" x2="745" y2="266" stroke="#b5602e" stroke-width="2.5"/><rect x="625" y="268" width="240" height="96" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="745" y="310.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“This policy will solve all</text><text x="745" y="331.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">of society’s problems.”</text>
</svg>