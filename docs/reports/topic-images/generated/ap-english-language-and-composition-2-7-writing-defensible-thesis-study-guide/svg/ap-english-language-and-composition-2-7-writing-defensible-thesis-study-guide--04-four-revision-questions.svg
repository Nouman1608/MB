<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 602" width="900" height="602" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="602" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Revising a weak thesis</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Four questions, four fixes</text>
<circle cx="450" cy="352" r="90" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="450" y="348" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Working</text><text x="450" y="374" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">thesis</text><rect x="30" y="122" width="300" height="120" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5" /><text x="48" y="162.08" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">1. Could a reasonable person</text><text x="48" y="185.84" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">disagree?</text><text x="48" y="212.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">If not: make it more arguable.</text><rect x="570" y="122" width="300" height="120" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5" /><text x="588" y="163.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">2. Is it specific?</text><text x="588" y="190.35999999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">No group, place or action?</text><text x="588" y="211.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Narrow it.</text><rect x="570" y="452" width="300" height="120" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5" /><text x="588" y="503.96" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">3. Does it say why?</text><text x="588" y="530.9200000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Add the reason or consequence.</text><rect x="30" y="452" width="300" height="120" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5" /><text x="48" y="492.08" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">4. Can I defend it in the time</text><text x="48" y="515.84" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">and space I have?</text><text x="48" y="542.8000000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">If not: reduce its scope.</text><path d="M335,182 C450,142 470,142 565,182" fill="none" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><path d="M720,246 C760,322 760,382 720,448" fill="none" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><path d="M565,512 C470,552 430,552 335,512" fill="none" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><path d="M180,448 C140,382 140,322 180,246" fill="none" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/>
</svg>