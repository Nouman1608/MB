troke="#b5602e" stroke-width="4.5"/><ellipse cx="457" cy="300" rx="9" ry="52" fill="none" stroke="#f2e7b8" stroke-width="1.5"/><ellipse cx="480" cy="300" rx="9" ry="52" fill="none" stroke="#b5602e" stroke-width="4.5"/><ellipse cx="480" cy="300" rx="9" ry="52" fill="none" stroke="#f2e7b8" stroke-width="1.5"/><ellipse cx="503" cy="300" rx="9" ry="52" fill="none" stroke="#b5602e" stroke-width="4.5"/><ellipse cx="503" cy="300" rx="9" ry="52" fill="none" stroke="#f2e7b8" stroke-width="1.5"/><ellipse cx="526" cy="300" rx="9" ry="52" fill="none" stroke="#b5602e" stroke-width="4.5"/><ellipse cx="526" cy="300" rx="9" ry="52" fill="none" stroke="#f2e7b8" stroke-width="1.5"/><ellipse cx="549" cy="300" rx="9" ry="52" fill="none" stroke="#b5602e" stroke-width="4.5"/><ellipse cx="549" cy="300" rx="9" ry="52" fill="none" stroke="#f2e7b8" stroke-width="1.5"/><path d="M626,280 l22,0 q8,0 8,8 q0,8 -8,8 l-18,0 q-6,0 -6,-5 q0,-5 6,-5 l14,0" fill="none" stroke="#4a5568" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M642,298 l22,0 q8,0 8,8 q0,8 -8,8 l-18,0 q-6,0 -6,-5 q0,-5 6,-5 l14,0" fill="none" stroke="#4a5568" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M658,316 l22,0 q8,0 8,8 q0,8 -8,8 l-18,0 q-6,0 -6,-5 q0,-5 6,-5 l14,0" fill="none" stroke="#4a5568" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><polyline points="250,352 250,470 380,470" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><polyline points="549,352 549,470 470,470" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><rect x="392" y="444" width="16" height="52" rx="0" fill="#ffffff" stroke="none" stroke-width="0" /><line x1="393" y1="446" x2="393" y2="494" stroke="#1e2a44" stroke-width="3" stroke-linecap="butt"/><line x1="407" y1="458" x2="407" y2="482" stroke="#1e2a44" stroke-width="7" stroke-linecap="butt"/><rect x="426" y="462" width="48" height="16" rx="0" fill="#ffffff" stroke="none" stroke-width="0" /><circle cx="430" cy="470" r="4" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><circle cx="470" cy="470" r="4" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><line x1="430" y1="470" x2="468" y2="450" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><text x="400" y="510" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">cell</text><text x="450" y="510" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">switch</text><line x1="300" y1="245" x2="300" y2="200" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><text x="300" y="190" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">coil of insulated wire</text><line x1="600" y1="300" x2="600" y2="200" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><line x1="600" y1="200" x2="620" y2="200" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><text x="625" y="196" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">soft iron core</text><text x="680" y="360" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">iron clips</text><text x="680" y="378" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">attracted</text><rect x="30" y="550" width="270" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="587.2" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Insulation</text><text x="52" y="612" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Stops current taking a</text><text x="52" y="633.12" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">short cut between</text><text x="52" y="654.24" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">neighbouring turns.</text><rect x="315" y="550" width="270" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="337" y="587.2" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Soft iron core</text><text x="337" y="612" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Magnetised by induction,</text><text x="337" y="633.12" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">adds its own field; loses</text><text x="337" y="654.24" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">its magnetism when</text><text x="337" y="675.36" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">switched off.</text><rect x="600" y="550" width="270" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="622" y="587.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Stronger with</text><text x="622" y="612" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">more turns, a larger</text><text x="622" y="633.12" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">current, and the iron</text><text x="622" y="654.24" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">core.</text><text x="450" y="718" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Uses: scrap-metal cranes, relays, electric bells. Main advantage: it can be switched on and off.</text>
</svg>