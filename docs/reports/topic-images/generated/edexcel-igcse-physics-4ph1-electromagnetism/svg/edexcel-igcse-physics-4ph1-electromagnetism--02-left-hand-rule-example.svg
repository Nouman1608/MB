<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 790" width="900" height="790" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="790" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Left-hand rule: which way is the force?</text>

<rect x="30" y="110" width="840" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="140" font-size="17" font-weight="600" fill="#4a5568" text-anchor="middle">Seen from above</text><rect x="160" y="160" width="580" height="50" rx="0" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5" /><text x="450" y="193" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">N</text><rect x="160" y="470" width="580" height="50" rx="0" fill="#2e6b62" stroke="#1e2a44" stroke-width="2.5" /><text x="450" y="503" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">S</text><line x1="170" y1="225" x2="170" y2="455" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><line x1="260" y1="225" x2="260" y2="455" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><line x1="640" y1="225" x2="640" y2="455" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><line x1="730" y1="225" x2="730" y2="455" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><text x="450" y="252" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">field: north → south</text><line x1="130" y1="340" x2="770" y2="340" stroke="#1e2a44" stroke-width="7" stroke-linecap="round"/><line x1="278" y1="306" x2="410" y2="306" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><text x="278" y="294" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">current: west → east</text><circle cx="450" cy="340" r="26" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3.5"/><line x1="432" y1="322" x2="468" y2="358" stroke="#8a6d0d" stroke-width="3.5" stroke-linecap="round"/><line x1="432" y1="358" x2="468" y2="322" stroke="#8a6d0d" stroke-width="3.5" stroke-linecap="round"/><text x="450" y="400" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">force: vertically DOWN</text><text x="450" y="422" font-size="15" font-weight="400" fill="#8a6d0d" text-anchor="middle">(into the page, ⊗)</text><line x1="90" y1="470" x2="90" y2="434" stroke="#1e2a44" stroke-width="2" marker-end="url(#ah)"/><text x="90" y="426" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">N</text><line x1="90" y1="470" x2="90" y2="506" stroke="#1e2a44" stroke-width="2" marker-end="url(#ah)"/><text x="90" y="524" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">S</text><line x1="90" y1="470" x2="126" y2="470" stroke="#1e2a44" stroke-width="2" marker-end="url(#ah)"/><text x="134" y="476" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">E</text><line x1="90" y1="470" x2="54" y2="470" stroke="#1e2a44" stroke-width="2" marker-end="url(#ah)"/><text x="34" y="476" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">W</text><rect x="30" y="600" width="410" height="170" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="636" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Left hand</text><text x="55" y="666" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">First finger: Field → south</text><text x="55" y="694" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">seCond finger: Current → east</text><text x="55" y="722" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">thuMb: Motion (force) → down</text><rect x="460" y="600" width="410" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="485" y="636" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Change it</text><text x="485" y="666" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Reverse the current: force up</text><text x="485" y="694" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Reverse the field: force up</text><text x="485" y="722" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Reverse both: force down again</text>
</svg>