<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 581" width="900" height="581" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="581" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Ecological modernisation or green Marxism?</text>

<rect x="188" y="104" width="337" height="44" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="356.5" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Ecological modernisation</text><rect x="533" y="104" width="337" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="701.5" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Green Marxism</text><rect x="30" y="156" width="150" height="93" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="207.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Evidence for</text><rect x="188" y="156" width="337" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="202" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Falling costs of solar and wind;</text><text x="202" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">some rich countries cut emissions</text><text x="202" y="228.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">while their economies grew</text><rect x="533" y="156" width="337" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="547" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Global resource use and emissions</text><text x="547" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">kept rising for decades despite</text><text x="547" y="228.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">green policies</text><rect x="30" y="257" width="150" height="93" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="308.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Key concept</text><rect x="188" y="257" width="337" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="202" y="287.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Decoupling</tspan> growth from environmental</text><text x="202" y="308.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">harm</text><rect x="533" y="257" width="337" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="547" y="287.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Metabolic rift:</tspan> Marx saw capitalist</text><text x="547" y="308.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">farming draining soil nutrients to</text><text x="547" y="329.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">feed cities</text><rect x="30" y="358" width="150" height="72" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="399.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Weakness</text><rect x="188" y="358" width="337" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="202" y="388.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Jevons paradox; emissions offshored</text><text x="202" y="409.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to producer countries</text><rect x="533" y="358" width="337" height="72" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="547" y="388.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">State socialist societies also</text><text x="547" y="409.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">caused severe damage (the Aral Sea)</text><rect x="30" y="446" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="482" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A strong judgement</text><text x="56" y="511" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">EMT describes what is technically possible; green Marxism explains why it has been slow</text><text x="56" y="533" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">to happen.</text>
</svg>