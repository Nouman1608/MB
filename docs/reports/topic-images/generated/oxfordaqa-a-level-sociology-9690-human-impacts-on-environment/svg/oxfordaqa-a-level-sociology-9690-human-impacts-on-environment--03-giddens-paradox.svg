<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 415" width="900" height="415" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="415" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Giddens’s paradox</text>

<rect x="30" y="110" width="184.5" height="112" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="122.25" y="143.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Dangers not</text><text x="122.25" y="167.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">visible</text><text x="122.25" y="197.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">in everyday life</text><line x1="218.5" y1="166" x2="244.5" y2="166" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="248.5" y="110" width="184.5" height="112" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="340.75" y="154.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">People do not</text><text x="340.75" y="178.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">act</text><line x1="437" y1="166" x2="463" y2="166" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="467" y="110" width="184.5" height="112" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="559.25" y="142.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Waiting until</text><text x="559.25" y="166.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">dangers become</text><text x="559.25" y="190.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">visible…</text><line x1="655.5" y1="166" x2="681.5" y2="166" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="685.5" y="110" width="184.5" height="112" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="777.75" y="154.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">…will be too</text><text x="777.75" y="178.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">late</text><text x="450" y="252" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Giddens, The Politics of Climate Change (2009)</text><rect x="30" y="278" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="314" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Responses</text><text x="56" y="343" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">"The long now" and intergenerational justice try to make future people count in present</text><text x="56" y="365" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">decisions.</text>
</svg>