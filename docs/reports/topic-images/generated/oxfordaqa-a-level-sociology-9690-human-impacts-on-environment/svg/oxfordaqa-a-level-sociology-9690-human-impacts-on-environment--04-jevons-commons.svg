<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 607" width="900" height="607" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="607" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Paradoxes of consumption</text>

<text x="30" y="120" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The Jevons paradox (1865)</text><rect x="30" y="136" width="253.33333333333334" height="88" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="156.66666666666669" y="168.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">More efficient steam</text><text x="156.66666666666669" y="192.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">engines</text><line x1="287.33333333333337" y1="180" x2="319.33333333333337" y2="180" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="136" width="253.33333333333334" height="88" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="450.00000000000006" y="180.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Coal cheaper to use</text><line x1="580.6666666666667" y1="180" x2="612.6666666666667" y2="180" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="136" width="253.33333333333334" height="88" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="743.3333333333334" y="180.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Total coal use rises</text><text x="450" y="252" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">efficiency gains outweighed by consumption: a criticism of ecological modernisation</text><rect x="30" y="278" width="412" height="174" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,328 L31.25,292.25 Q31.25,279.25 44.25,279.25 L427.75,279.25 Q440.75,279.25 440.75,292.25 L440.75,328 Z" fill="#f2e7b8"/><line x1="31.25" y1="328" x2="440.75" y2="328" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="308.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Tragedy of the commons</text><text x="44" y="359.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Hardin (1968)</text><text x="44" y="386.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Shared resources are overused because each</text><text x="44" y="407.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">user gains from taking more.</text><rect x="458" y="278" width="412" height="174" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,328 L459.25,292.25 Q459.25,279.25 472.25,279.25 L855.75,279.25 Q868.75,279.25 868.75,292.25 L868.75,328 Z" fill="#b5d3cf"/><line x1="459.25" y1="328" x2="868.75" y2="328" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="308.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Governing the commons</text><text x="472" y="359.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Ostrom (1990)</text><text x="472" y="386.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Many communities manage fisheries, forests</text><text x="472" y="407.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and pastures sustainably through their own</text><text x="472" y="428.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rules.</text><rect x="30" y="470" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="506" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Risk society (Beck, 1986)</text><text x="56" y="535" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Manufactured risks created by industry and science (nuclear accidents, pollution,</text><text x="56" y="557" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">climate change) cross borders and classes.</text>
</svg>