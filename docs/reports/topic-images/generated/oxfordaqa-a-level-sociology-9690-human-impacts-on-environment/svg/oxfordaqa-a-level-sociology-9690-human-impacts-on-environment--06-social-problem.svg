<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 477" width="900" height="477" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="477" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From physical process to social problem</text>

<rect x="30" y="110" width="145.6" height="148" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="102.8" y="142.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Physical</text><text x="102.8" y="166.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">process</text><text x="102.8" y="196.3" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">IPCC: human</text><text x="102.8" y="216.3" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">warming</text><text x="102.8" y="236.3" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">"unequivocal"</text><line x1="179.6" y1="184" x2="199.6" y2="184" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="203.6" y="110" width="145.6" height="148" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="276.4" y="174.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Claims</text><text x="276.4" y="204.3" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">who makes them?</text><line x1="353.2" y1="184" x2="373.2" y2="184" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="377.2" y="110" width="145.6" height="148" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="174.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Media</text><text x="450" y="204.3" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">which channels?</text><line x1="526.8" y1="184" x2="546.8" y2="184" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="550.8" y="110" width="145.6" height="148" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="623.5999999999999" y="164.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Framing</text><text x="623.5999999999999" y="194.3" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">how is it</text><text x="623.5999999999999" y="214.3" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">presented?</text><line x1="700.4" y1="184" x2="720.4" y2="184" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="724.4" y="110" width="145.6" height="148" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="797.1999999999999" y="172.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Social</text><text x="797.1999999999999" y="196.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">problem</text><rect x="30" y="280" width="840" height="171" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="316" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Construction does not deny the science</text><circle cx="61" cy="339.39" r="4.5" fill="#8a6d0d"/><text x="74" y="345" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">It asks how a physical process becomes a social problem</text><circle cx="61" cy="369.39" r="4.5" fill="#8a6d0d"/><text x="74" y="375" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Beck:</tspan> the public must rely on experts for risks they cannot see, so trust in science</text><text x="74" y="397" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">becomes political</text><circle cx="61" cy="421.39" r="4.5" fill="#8a6d0d"/><text x="74" y="427" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Paris Agreement (2015): well below 2°C, pursuing 1.5°C</text>
</svg>