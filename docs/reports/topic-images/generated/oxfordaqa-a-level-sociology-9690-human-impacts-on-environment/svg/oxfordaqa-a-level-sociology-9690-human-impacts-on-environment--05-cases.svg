<rect width="900" height="527" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Cases of human impact</text>

<rect x="30" y="104" width="269.3333333333333" height="178" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L285.0833333333333,105.25 Q298.0833333333333,105.25 298.0833333333333,118.25 L298.0833333333333,154 Z" fill="#f2e7b8"/><line x1="31.25" y1="154" x2="298.0833333333333" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="134.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Minamata, Japan</text><text x="46" y="187.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">1950s pollution</text><text x="46" y="216.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mercury from a chemical</text><text x="46" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">company harmed a poor</text><text x="46" y="258.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fishing community.</text><rect x="315.3333333333333" y="104" width="269.3333333333333" height="178" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,154 L316.5833333333333,118.25 Q316.5833333333333,105.25 329.5833333333333,105.25 L570.4166666666666,105.25 Q583.4166666666666,105.25 583.4166666666666,118.25 L583.4166666666666,154 Z" fill="#f2e7b8"/><line x1="316.5833333333333" y1="154" x2="583.4166666666666" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="134.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Agbogbloshie, Accra</text><text x="331.3333333333333" y="187.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">e-waste</text><text x="331.3333333333333" y="216.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Informal e-waste burning</text><text x="331.3333333333333" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">exposed workers to toxic</text><text x="331.3333333333333" y="258.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fumes.</text><rect x="600.6666666666666" y="104" width="269.3333333333333" height="178" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,154 L601.9166666666666,118.25 Q601.9166666666666,105.25 614.9166666666666,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#f2e7b8"/><line x1="601.9166666666666" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="134.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Aral Sea</text><text x="616.6666666666666" y="187.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">changing landscape</text><text x="616.6666666666666" y="216.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Soviet irrigation from the</text><text x="616.6666666666666" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1960s diverted its rivers;</text><text x="616.6666666666666" y="258.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">it shrank dramatically.</text><rect x="30" y="298" width="269.3333333333333" height="199" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,348 L31.25,312.25 Q31.25,299.25 44.25,299.25 L285.0833333333333,299.25 Q298.0833333333333,299.25 298.0833333333333,312.25 L298.0833333333333,348 Z" fill="#b5d3cf"/><line x1="31.25" y1="348" x2="298.0833333333333" y2="348" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="328.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Great Green Wall</text><text x="46" y="381.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">African Union, 2007</text><text x="46" y="410.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Aims to restore degraded</text><text x="46" y="431.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">land across the Sahel.</text><rect x="315.3333333333333" y="298" width="269.3333333333333" height="199" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,348 L316.5833333333333,312.25 Q316.5833333333333,299.25 329.5833333333333,299.25 L570.4166666666666,299.25 Q583.4166666666666,299.25 583.4166666666666,312.25 L583.4166666666666,348 Z" fill="#dce9e7"/><line x1="316.5833333333333" y1="348" x2="583.4166666666666" y2="348" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="328.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Tourism</text><text x="331.3333333333333" y="381.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Urry (1990), The Tourist</text><text x="331.3333333333333" y="402.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Gaze</text><text x="331.3333333333333" y="431.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Venice day-tripper fee</text><text x="331.3333333333333" y="452.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(2024); Swedish "flight</text><text x="331.3333333333333" y="473.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">shame" from 2018.</text><rect x="600.6666666666666" y="298" width="269.3333333333333" height="199" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,348 L601.9166666666666,312.25 Q601.9166666666666,299.25 614.9166666666666,299.25 L855.75,299.25 Q868.75,299.25 868.75,312.25 L868.75,348 Z" fill="#dce9e7"/><line x1="601.9166666666666" y1="348" x2="868.75" y2="348" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="328.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Food</text><text x="616.6666666666666" y="381.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">agriculture</text><text x="616.6666666666666" y="410.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Livestock land and methane;</text><text x="616.6666666666666" y="431.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">palm oil, soya and beef</text><text x="616.6666666666666" y="452.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">drive deforestation; food</text><text x="616.6666666666666" y="473.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">waste.</text>
</svg>