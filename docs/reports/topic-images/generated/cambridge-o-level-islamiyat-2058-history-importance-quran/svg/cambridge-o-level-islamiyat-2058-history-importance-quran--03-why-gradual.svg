<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 513" width="900" height="513" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="513" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why was the Qur'an revealed gradually?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Over about twenty-three years, not all at once</text>
<rect x="30" y="124" width="412" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="236" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">SURA 25.32</text><text x="236" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">"That We may strengthen your heart</text><text x="236" y="206.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">thereby"</text><rect x="458" y="124" width="412" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="664" y="168" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">SURA 17.106</text><text x="664" y="194.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Recited "to men at intervals"</text><rect x="30" y="254" width="270.6666666666667" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="288.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Memorise and act</text><text x="50" y="317.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">People could learn and act on</text><text x="50" y="338.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">each passage</text><rect x="314.6666666666667" y="254" width="270.6666666666667" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334.6666666666667" y="288.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Answer events</text><text x="334.6666666666667" y="317.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Questions and events were</text><text x="334.6666666666667" y="338.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">answered as they arose</text><rect x="599.3333333333334" y="254" width="270.6666666666667" height="109" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="619.3333333333334" y="288.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Laws step by step</text><text x="619.3333333333334" y="317.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Rules introduced gradually</text><rect x="30" y="385" width="400" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="417" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXAMPLE</text><text x="50" y="443.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The prohibition of wine</text><text x="50" y="472.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">came in stages</text><rect x="530" y="385" width="340" height="96" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="700" y="437.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Final ban: Sura 5.90</text><line x1="438" y1="433" x2="522" y2="433" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/>
</svg>