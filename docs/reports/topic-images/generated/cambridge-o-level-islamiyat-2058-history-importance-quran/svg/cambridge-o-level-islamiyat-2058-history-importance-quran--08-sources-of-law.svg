<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 625" width="900" height="625" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="625" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Qur'an as the first source of law</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Nothing that contradicts it can be accepted</text>
<rect x="100" y="124" width="770" height="75" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="114" y="152.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Qur'an: States the principle or command</text><text x="114" y="180.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">"Establish</tspan> <tspan font-style="italic">prayer</tspan> <tspan font-style="italic">and</tspan> <tspan font-style="italic">give</tspan> <tspan font-style="italic">zakat"</tspan></text><circle cx="60" cy="161.5" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="169.42" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="130" y="211" width="740" height="75" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="144" y="239.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Hadith / Sunna: Explains and details it</text><text x="144" y="267.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Times,</tspan> <tspan font-style="italic">units</tspan> <tspan font-style="italic">and</tspan> <tspan font-style="italic">actions</tspan> <tspan font-style="italic">of</tspan> <tspan font-style="italic">prayer;</tspan> <tspan font-style="italic">rates</tspan> <tspan font-style="italic">of</tspan> <tspan font-style="italic">zakat</tspan></text><circle cx="90" cy="248.5" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="90" y="256.42" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="160" y="298" width="710" height="75" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="174" y="326.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ijma': Scholars agree on a ruling based on the first two</text><text x="174" y="354.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">The</tspan> <tspan font-style="italic">Companions'</tspan> <tspan font-style="italic">agreement</tspan> <tspan font-style="italic">to</tspan> <tspan font-style="italic">gather</tspan> <tspan font-style="italic">the</tspan> <tspan font-style="italic">Qur'an</tspan> <tspan font-style="italic">into</tspan> <tspan font-style="italic">one</tspan> <tspan font-style="italic">copy</tspan></text><circle cx="120" cy="335.5" r="22" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="120" y="343.42" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="190" y="385" width="680" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="204" y="413.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Qiyas: Extends a ruling to a new case with the same cause</text><text x="204" y="441.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Wine</tspan> <tspan font-style="italic">intoxicates,</tspan> <tspan font-style="italic">so</tspan> <tspan font-style="italic">other</tspan> <tspan font-style="italic">intoxicating</tspan> <tspan font-style="italic">drugs</tspan> <tspan font-style="italic">are</tspan> <tspan font-style="italic">forbidden</tspan></text><circle cx="150" cy="422.5" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="150" y="430.42" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="30" y="482" width="840" height="111" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="516.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Mu'adh ibn Jabal, judge in Yemen</text><text x="50" y="546.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">He would rule by the Book of God, then the Sunna, then his own reasoning, and the Prophet (pbuh)</text><text x="50" y="568.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">approved.</text>
</svg>