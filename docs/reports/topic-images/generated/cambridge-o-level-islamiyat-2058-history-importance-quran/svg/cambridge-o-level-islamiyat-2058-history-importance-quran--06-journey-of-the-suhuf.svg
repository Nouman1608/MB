<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 990" width="900" height="990" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="990" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The journey of the written sheets (suhuf)</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">From Yamama to the standard copies</text>
<text x="232.5" y="140" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">ABU BAKR (632–634): COMPILED</text><text x="667.5" y="416" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">UTHMAN: STANDARDISED</text><rect x="30" y="154" width="405" height="114" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="201.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Battle of Yamama</text><text x="50" y="230.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">many huffaz killed</text><line x1="232.5" y1="271" x2="232.5" y2="289" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="292" width="405" height="114" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="339.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Umar urges Abu Bakr</text><text x="50" y="368.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">to collect the Qur'an</text><line x1="232.5" y1="409" x2="232.5" y2="427" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="430" width="405" height="114" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="467.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Zayd ibn Thabit collects</text><text x="50" y="495.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">written pieces checked against memory, with</text><text x="50" y="516.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">witnesses</text><line x1="232.5" y1="547" x2="232.5" y2="565" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="568" width="405" height="114" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="615.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sheets kept by Abu Bakr</text><text x="50" y="644.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">then Umar, then Hafsa</text><rect x="465" y="430" width="405" height="114" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="485" y="477.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Hudhayfa ibn al-Yaman warns</text><text x="485" y="506.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Muslims disputing over recitation</text><line x1="667.5" y1="547" x2="667.5" y2="565" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="465" y="568" width="405" height="114" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="485" y="629.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Uthman borrows Hafsa's copy</text><line x1="667.5" y1="685" x2="667.5" y2="703" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="465" y="706" width="405" height="114" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="485" y="743.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Committee led by Zayd</text><text x="485" y="771.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">makes copies; where they disagreed, wrote in</text><text x="485" y="792.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the dialect of the Quraysh</text><line x1="667.5" y1="823" x2="667.5" y2="841" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="465" y="844" width="405" height="114" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="485" y="881.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Copies sent to the main centres</text><text x="485" y="909.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">one kept in Madinah; Hafsa's copy returned;</text><text x="485" y="930.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">other versions burned</text><line x1="439" y1="625" x2="461" y2="625" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/>
</svg>