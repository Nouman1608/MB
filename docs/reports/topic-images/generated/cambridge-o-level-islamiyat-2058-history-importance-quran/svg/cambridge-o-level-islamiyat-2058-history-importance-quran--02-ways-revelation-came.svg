<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 438" width="900" height="438" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="438" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How revelation came</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Ways described in the Hadiths</text>
<rect x="30" y="124" width="412" height="136" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1</text><text x="50" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Like the ringing of a bell</text><text x="50" y="213.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The hardest on him: Aisha saw sweat on his</text><text x="50" y="235.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">forehead even on a very cold day</text><rect x="458" y="124" width="412" height="136" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="167" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">2</text><text x="478" y="194.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Through Jibril in the form of a man</text><text x="478" y="224.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The angel spoke to him</text><rect x="30" y="276" width="412" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="330.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">3</text><text x="50" y="358.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">In true dreams</text><rect x="458" y="276" width="412" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="316" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">4</text><text x="478" y="343.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Directly from God</text><text x="478" y="373.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">During the Mi'raj</text>
</svg>