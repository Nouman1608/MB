<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 625" width="900" height="625" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="625" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The revelation of the Qur'an, 610–632</text>

<line x1="175" y1="110" x2="175" y2="583" stroke="#1e2a44" stroke-width="4"/><rect x="215" y="100" width="655" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="229" y="128.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Retreats to the Cave of Hira</text><text x="229" y="156.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">on Mount Nur near Makka, to reflect</text><circle cx="175" cy="137.5" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="153" y="143.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">before 610</text><rect x="215" y="185" width="655" height="96" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="229" y="213.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The first revelation: Sura 96.1–5</text><text x="229" y="241.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">"Read! in the name of your Lord, who created". The Qur'an links its revelation to</text><text x="229" y="262.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Ramadan and the Night of Power (Sura 2.185, 97.1)</text><circle cx="175" cy="233" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="153" y="239" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">610, Ramadan</text><rect x="215" y="291" width="655" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="229" y="319.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Khadija comforts him</text><text x="229" y="347.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and takes him to Waraqa ibn Nawfal: the same angel who had come to Musa</text><circle cx="175" cy="328.5" r="7" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="215" y="376" width="655" height="47" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="229" y="404.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A pause in revelation</text><circle cx="175" cy="399.5" r="7" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="215" y="433" width="655" height="75" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="229" y="461.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sura 74: "arise and warn"</text><text x="229" y="489.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">revelation resumes and continues</text><circle cx="175" cy="470.5" r="7" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="215" y="518" width="655" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="229" y="546.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Revelation ends</text><text x="229" y="574.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">shortly before his death; in Makka and then Madinah</text><circle cx="175" cy="555.5" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="153" y="561.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">632</text>
</svg>