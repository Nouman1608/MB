<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 569" width="900" height="569" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="569" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Preserved in memory and in writing</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">During the Prophet's (pbuh) lifetime</text>
<rect x="30" y="124" width="412" height="154" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MEMORISATION</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Recited and memorised</text><text x="50" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Those who learned it all were huffaz; recited in</text><text x="50" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">daily prayer</text><rect x="458" y="124" width="412" height="154" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="478" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WRITING</text><text x="478" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Scribes wrote it down</text><text x="478" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">On palm-leaf stalks, leather, flat stones and</text><text x="478" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">shoulder blades of animals. Zayd ibn Thabit,</text><text x="478" y="253.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Ubayy ibn Ka'b, Ali</text><rect x="30" y="292" width="412" height="133" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="324" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ORDER</text><text x="50" y="350.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Fixed by the Prophet (pbuh)</text><text x="50" y="379.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">He told the scribes where each new passage</text><text x="50" y="400.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">belonged</text><rect x="458" y="292" width="412" height="133" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="324" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ANNUAL REVIEW</text><text x="478" y="350.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Each Ramadan with Jibril</text><text x="478" y="379.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Twice in his final year</text><rect x="30" y="447" width="410" height="90" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="482.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">By 632</text><text x="50" y="512.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Complete in memory and in writing</text><rect x="460" y="447" width="410" height="90" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="480" y="482.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">But not yet</text><text x="480" y="512.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">gathered into a single bound copy</text>
</svg>