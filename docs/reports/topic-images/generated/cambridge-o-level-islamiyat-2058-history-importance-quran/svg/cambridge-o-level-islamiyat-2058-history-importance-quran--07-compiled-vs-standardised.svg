<rect width="900" height="619" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Abu Bakr compiled; Uthman standardised</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Keep the two stages separate</text>
<clipPath id="tc124"><rect x="30" y="124" width="840" height="383" rx="14"/></clipPath><g clip-path="url(#tc124)"><rect x="30" y="124" width="168" height="48" fill="#b5d3cf"/><rect x="198" y="124" width="336" height="48" fill="#f2e7b8"/><text x="212" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Abu Bakr (632–634)</text><rect x="534" y="124" width="336" height="48" fill="#b5d3cf"/><text x="548" y="151.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Uthman</text><rect x="30" y="172" width="168" height="89" fill="#dce9e7"/><text x="44" y="198.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Problem</text><rect x="198" y="172" width="336" height="89" fill="#ffffff"/><text x="212" y="198.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Many huffaz killed at the Battle of</text><text x="212" y="219.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Yamama; parts might be lost</text><rect x="534" y="172" width="336" height="89" fill="#ffffff"/><text x="548" y="198.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">New Muslims recited in different ways;</text><text x="548" y="219.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Hudhayfa ibn al-Yaman saw disputes in</text><text x="548" y="240.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Armenia and Azerbaijan</text><line x1="30" y1="261" x2="870" y2="261" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="261" width="168" height="89" fill="#dce9e7"/><text x="44" y="287.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Who did the work</text><rect x="198" y="261" width="336" height="89" fill="#f8faf9"/><text x="212" y="287.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Zayd ibn Thabit: young, trustworthy, had</text><text x="212" y="308.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">memorised it and written for the Prophet</text><text x="212" y="329.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(pbuh)</text><rect x="534" y="261" width="336" height="89" fill="#f8faf9"/><text x="548" y="287.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A committee led by Zayd ibn Thabit,</text><text x="548" y="308.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">with Abdullah ibn al-Zubayr, Sa'id ibn</text><text x="548" y="329.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">al-As and Abd al-Rahman ibn al-Harith</text><line x1="30" y1="350" x2="870" y2="350" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="350" width="168" height="89" fill="#dce9e7"/><text x="44" y="376.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Method</text><rect x="198" y="350" width="336" height="89" fill="#ffffff"/><text x="212" y="376.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Written pieces checked against</text><text x="212" y="397.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">memory; accepted only with witnesses</text><rect x="534" y="350" width="336" height="89" fill="#ffffff"/><text x="548" y="376.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Copied Hafsa's sheets; where they</text><text x="548" y="397.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">disagreed, wrote in the dialect of the</text><text x="548" y="418.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Quraysh</text><line x1="30" y1="439" x2="870" y2="439" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="439" width="168" height="68" fill="#dce9e7"/><text x="44" y="465.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Result</text><rect x="198" y="439" width="336" height="68" fill="#f8faf9"/><text x="212" y="465.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">One collected set of sheets (suhuf)</text><rect x="534" y="439" width="336" height="68" fill="#f8faf9"/><text x="548" y="465.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Standard copies for the main centres;</text><text x="548" y="486.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">other versions burned</text></g><line x1="198" y1="124" x2="198" y2="507" stroke="#c9d6d4" stroke-width="1.5"/><line x1="534" y1="124" x2="534" y2="507" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="124" width="840" height="383" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="529" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="562.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Uthman became known as the one who <tspan font-weight="700" fill="#1e2a44">united</tspan> <tspan font-weight="700" fill="#1e2a44">the</tspan> <tspan font-weight="700" fill="#1e2a44">Muslims</tspan> <tspan font-weight="700" fill="#1e2a44">on</tspan> <tspan font-weight="700" fill="#1e2a44">a</tspan> <tspan font-weight="700" fill="#1e2a44">single</tspan> <tspan font-weight="700" fill="#1e2a44">text</tspan>.</text>
</svg>