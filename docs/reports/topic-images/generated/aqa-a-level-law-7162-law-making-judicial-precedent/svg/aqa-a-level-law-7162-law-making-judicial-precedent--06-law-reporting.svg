<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 588" width="900" height="588" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="588" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Law reporting: from Year Books to neutral citations</text>

<rect x="30" y="100" width="184.5" height="178" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="126" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LATE 13TH C.</text><text x="44" y="152.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Year Books</text><text x="44" y="180" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Mainly for lawyers’</text><text x="44" y="200" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">training</text><line x1="220.5" y1="189" x2="242.5" y2="189" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="248.5" y="100" width="184.5" height="178" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="262.5" y="126" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THEN</text><text x="262.5" y="152.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Private reports</text><text x="262.5" y="180" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">By named reporters,</text><text x="262.5" y="200" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">of varying reliability</text><line x1="439" y1="189" x2="461" y2="189" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="467" y="100" width="184.5" height="178" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="481" y="126" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">1865</text><text x="481" y="152.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The Law Reports</text><text x="481" y="180" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Incorporated Council</text><text x="481" y="200" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">of Law Reporting;</text><text x="481" y="220" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">checked by the</text><text x="481" y="240" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">judges; most</text><text x="481" y="260" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">authoritative</text><line x1="657.5" y1="189" x2="679.5" y2="189" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="685.5" y="100" width="184.5" height="178" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="699.5" y="126" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SINCE 2001</text><text x="699.5" y="152.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Neutral citations</text><text x="699.5" y="180" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Court-based</text><text x="699.5" y="200" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">reference,</text><text x="699.5" y="220" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">independent of any</text><text x="699.5" y="240" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">publisher; judgments</text><text x="699.5" y="260" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">online</text><text x="450" y="322" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Why report cases?</text><rect x="30" y="344" width="158.4" height="132" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="109.2" y="371.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Accurate</text><text x="109.2" y="392.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">record</text><text x="109.2" y="419" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">of the ratio and</text><text x="109.2" y="439" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">reasoning</text><rect x="200.4" y="344" width="158.4" height="132" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="279.6" y="371.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Advice</text><text x="279.6" y="398" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">lawyers can</text><text x="279.6" y="418" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">predict likely</text><text x="279.6" y="438" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">outcomes for</text><text x="279.6" y="458" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">clients</text><rect x="370.8" y="344" width="158.4" height="132" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="371.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Authority</text><text x="450" y="398" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">judges can</text><text x="450" y="418" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">identify binding</text><text x="450" y="438" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">precedent</text><rect x="541.2" y="344" width="158.4" height="132" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="620.4000000000001" y="371.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Consistency</text><text x="620.4000000000001" y="398" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">and certainty in</text><text x="620.4000000000001" y="418" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">the law</text><rect x="711.6" y="344" width="158.4" height="132" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="790.8000000000001" y="371.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Accessibility</text><text x="790.8000000000001" y="398" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">supports the rule</text><text x="790.8000000000001" y="418" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">of law</text><rect x="30" y="498" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="531.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Precedent cannot work unless judges and lawyers can find exactly what earlier courts decided.</text>
</svg>