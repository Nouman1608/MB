<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 546" width="900" height="546" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="546" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">When can the Court of Appeal depart from itself?</text>

<rect x="30" y="100" width="840" height="76" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="130.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Civil Division follows its own previous decisions, except where (<tspan font-style="italic">Young</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Bristol</tspan></text><text x="450" y="154.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle"><tspan font-style="italic">Aeroplane</tspan> <tspan font-style="italic">Co</tspan>, 1944):</text><rect x="30" y="198" width="270.6666666666667" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="226" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXCEPTION 1</text><text x="46" y="252.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Two conflicting decisions</text><text x="46" y="280.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">It chooses which of its own</text><text x="46" y="301.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">decisions to follow</text><rect x="314.6666666666667" y="198" width="270.6666666666667" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330.6666666666667" y="226" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXCEPTION 2</text><text x="330.6666666666667" y="252.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Conflict with a later HL or</text><text x="330.6666666666667" y="275.03999999999996" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">SC decision</text><text x="330.6666666666667" y="303.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Its earlier decision gives way to</text><text x="330.6666666666667" y="324.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the House of Lords or Supreme</text><text x="330.6666666666667" y="345.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Court</text><rect x="599.3333333333334" y="198" width="270.6666666666667" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="615.3333333333334" y="226" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXCEPTION 3</text><text x="615.3333333333334" y="252.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Per incuriam</text><text x="615.3333333333334" y="280.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Made in error, e.g. by</text><text x="615.3333333333334" y="301.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">overlooking a relevant statute</text><text x="615.3333333333334" y="322.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">or binding authority</text><rect x="30" y="388" width="412" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="418" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">DAVIS v JOHNSON (1979)</text><text x="48" y="449.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lord Denning argued the Court of Appeal should</text><text x="48" y="470.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">be free to depart from its own decisions. <tspan font-weight="700" fill="#1e2a44">The</tspan></text><text x="48" y="491.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">House</tspan> <tspan font-weight="700" fill="#1e2a44">of</tspan> <tspan font-weight="700" fill="#1e2a44">Lords</tspan> <tspan font-weight="700" fill="#1e2a44">rejected</tspan> <tspan font-weight="700" fill="#1e2a44">this.</tspan></text><rect x="458" y="388" width="412" height="126" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="476" y="418" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">CRIMINAL DIVISION</text><text x="476" y="449.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Taylor</tspan> (1950) and <tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Gould</tspan> (1968): may</text><text x="476" y="470.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">depart where the law was misapplied and <tspan font-weight="700" fill="#1e2a44">a</tspan></text><text x="476" y="491.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">person’s</tspan> <tspan font-weight="700" fill="#1e2a44">liberty</tspan> <tspan font-weight="700" fill="#1e2a44">is</tspan> <tspan font-weight="700" fill="#1e2a44">at</tspan> <tspan font-weight="700" fill="#1e2a44">stake</tspan>.</text>
</svg>