<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 546" width="900" height="546" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="546" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A High Court judge and a Court of Appeal decision</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">She thinks the earlier decision is wrong. What can she do?</text>
<rect x="170" y="124" width="560" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="154.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">High Court is bound by the Court of Appeal</text><text x="450" y="183.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Must follow if the material facts are sufficiently similar</text><line x1="330" y1="212" x2="190" y2="232" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="570" y1="212" x2="710" y2="232" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="212" x2="450" y2="232" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><rect x="30" y="256" width="269.3333333333333" height="125" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="164.66666666666666" y="284" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">OPTION 1</text><text x="164.66666666666666" y="310.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Distinguish</text><text x="164.66666666666666" y="339.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">on the material facts: any court</text><text x="164.66666666666666" y="360.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">can distinguish</text><rect x="315.3333333333333" y="256" width="269.3333333333333" height="125" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="284" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">NOT AVAILABLE</text><text x="450" y="310.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Overrule</text><text x="450" y="339.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">only a higher court can</text><text x="450" y="360.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">overrule</text><rect x="600.6666666666666" y="256" width="269.3333333333333" height="125" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="735.3333333333333" y="284" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">OPTION 2</text><text x="735.3333333333333" y="310.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Follow, but criticise</text><text x="735.3333333333333" y="339.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">in her judgment, inviting an</text><text x="735.3333333333333" y="360.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">appeal</text><rect x="30" y="407" width="840" height="107" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="437" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LONG TERM</text><text x="48" y="469.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The <tspan font-weight="700" fill="#1e2a44">Court</tspan> <tspan font-weight="700" fill="#1e2a44">of</tspan> <tspan font-weight="700" fill="#1e2a44">Appeal</tspan> (via the <tspan font-style="italic">Young</tspan> exceptions) or the <tspan font-weight="700" fill="#1e2a44">Supreme</tspan> <tspan font-weight="700" fill="#1e2a44">Court</tspan> (Practice Statement or</text><text x="48" y="491.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">overruling) can change the rule.</text>
</svg>