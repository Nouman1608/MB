<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 859" width="900" height="859" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="859" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The hierarchy of the courts</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Who binds whom, and is each court bound by itself?</text>
<rect x="70" y="124" width="660" height="101" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="400" y="154.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Supreme Court</text><text x="400" y="183.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Binds all courts below. May depart from its own decisions (Practice Statement</text><text x="400" y="204.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">1966). From 2009, replacing the House of Lords.</text><line x1="400" y1="229" x2="400" y2="249" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="269" width="362" height="122" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="211" y="299.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Court of Appeal (Civil Division)</text><text x="211" y="328.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Binds all courts below. Bound by itself,</text><text x="211" y="349.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">subject to the <tspan font-style="italic">Young</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Bristol</tspan> <tspan font-style="italic">Aeroplane</tspan></text><text x="211" y="370.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">exceptions.</text><rect x="408" y="269" width="362" height="122" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="589" y="299.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Court of Appeal (Criminal Division)</text><text x="589" y="328.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Binds all criminal courts below. Generally</text><text x="589" y="349.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">bound by itself; extra flexibility where</text><text x="589" y="370.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">liberty is at stake.</text><line x1="400" y1="395" x2="400" y2="415" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="70" y="435" width="660" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="400" y="465.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Divisional Courts of the High Court</text><text x="400" y="494.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Bind the High Court and lower courts. Generally bound by themselves, with similar</text><text x="400" y="515.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">exceptions.</text><line x1="400" y1="540" x2="400" y2="560" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="70" y="580" width="660" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="400" y="610.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">High Court</text><text x="400" y="639.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Binds the County Court and magistrates’ courts. Not binding on other High Court</text><text x="400" y="660.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">judges, but persuasive.</text><line x1="400" y1="685" x2="400" y2="705" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="70" y="725" width="660" height="80" rx="14" fill="#f8faf9" stroke="#c9d6d4" stroke-width="2.5"/><text x="400" y="755.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Crown Court, County Court, magistrates’ courts</text><text x="400" y="784.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Create no binding precedent. Not bound by their own decisions.</text><line x1="812" y1="150" x2="812" y2="787" stroke="#2e6b62" stroke-width="5" marker-end="url(#ahT)"/><text x="848" y="468.5" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle" transform="rotate(90 848 468.5)">binding force runs downwards</text>
</svg>