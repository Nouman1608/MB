<rect width="900" height="683" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Practice Statement 1966 in use</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Own decisions normally binding, but may depart “when it appears right to do so”</text>
<line x1="80" y1="162" x2="80" y2="613" stroke="#c9d6d4" stroke-width="4"/><rect x="152" y="124" width="718" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="166" y="152.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Conway</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Rimmer</tspan></text><text x="166" y="181.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">First major use, on a technical point of evidence</text><rect x="30" y="142" width="100" height="40" rx="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="80" y="169" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1968</text><rect x="152" y="210" width="718" height="97" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="166" y="238.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">British</tspan> <tspan font-style="italic">Railways</tspan> <tspan font-style="italic">Board</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Herrington</tspan></text><text x="166" y="267.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Overruled <tspan font-style="italic">Addie</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Dumbreck</tspan> (1929): occupiers could owe a duty of care to child</text><text x="166" y="288.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">trespassers</text><rect x="30" y="238.5" width="100" height="40" rx="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="80" y="265.5" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1972</text><rect x="152" y="317" width="718" height="76" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="166" y="345.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Knuller</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">DPP</tspan>: refused to overrule</text><text x="166" y="374.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Kept <tspan font-style="italic">Shaw</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">DPP</tspan> (1962) even though some judges disagreed with it, to preserve certainty</text><rect x="30" y="335" width="100" height="40" rx="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="80" y="362" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1972</text><rect x="152" y="403" width="718" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="166" y="431.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Shivpuri</tspan></text><text x="166" y="460.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Overruled <tspan font-style="italic">Anderton</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Ryan</tspan> (1985) within a year, on attempting the impossible</text><rect x="30" y="421" width="100" height="40" rx="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="80" y="448" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1986</text><rect x="152" y="489" width="718" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="166" y="517.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">G</tspan></text><text x="166" y="546.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Overruled <tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Caldwell</tspan> (1981): subjective test replaced objective recklessness</text><rect x="30" y="507" width="100" height="40" rx="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="80" y="534" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">2003</text><rect x="152" y="575" width="718" height="76" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="166" y="603.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Austin</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Southwark</tspan> <tspan font-style="italic">LBC</tspan></text><text x="166" y="632.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Confirmed that the Practice Statement continues to apply to the Supreme Court</text><rect x="30" y="593" width="100" height="40" rx="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="80" y="620" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">2010</text>
</svg>