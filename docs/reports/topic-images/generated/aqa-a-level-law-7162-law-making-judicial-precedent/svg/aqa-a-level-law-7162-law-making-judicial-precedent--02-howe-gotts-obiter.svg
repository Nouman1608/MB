<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 569" width="900" height="569" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="569" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How obiter dicta can become law</text>

<rect x="30" y="100" width="412" height="129" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RATIO DECIDENDI</text><text x="48" y="156.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">“Reason for deciding”</text><text x="48" y="185.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The legal principle applied to the material facts.</text><text x="48" y="206.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Only</tspan> <tspan font-weight="700" fill="#1e2a44">the</tspan> <tspan font-weight="700" fill="#1e2a44">ratio</tspan> <tspan font-weight="700" fill="#1e2a44">binds.</tspan></text><rect x="458" y="100" width="412" height="129" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="476" y="130" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">OBITER DICTA</text><text x="476" y="156.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">“Things said by the way”</text><text x="476" y="185.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Other remarks, such as comments on</text><text x="476" y="206.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">hypothetical facts. Persuasive only.</text><rect x="30" y="253" width="380" height="180" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="283" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">R v HOWE (1987), HOUSE OF LORDS</text><text x="48" y="315.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64.15" y="315.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Ratio:</tspan> duress is not a defence to murder</text><text x="48" y="345.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64.15" y="345.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Obiter:</tspan> it should not be a defence to</text><text x="64.15" y="367.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">attempted murder either</text><rect x="490" y="253" width="380" height="180" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="508" y="308.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">R v GOTTS (1992), HOUSE OF LORDS</text><text x="508" y="341.1" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Followed the <tspan font-style="italic">Howe</tspan> obiter statement:</text><text x="508" y="363.1" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">duress was <tspan font-weight="700" fill="#1e2a44">not</tspan> <tspan font-weight="700" fill="#1e2a44">available</tspan> <tspan font-weight="700" fill="#1e2a44">for</tspan> <tspan font-weight="700" fill="#1e2a44">attempted</tspan></text><text x="508" y="385.1" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">murder</tspan></text><line x1="416" y1="343" x2="484" y2="343" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><text x="450" y="329" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">later</text><text x="450" y="373" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">followed</text><rect x="30" y="457" width="840" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="490.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700" fill="#1e2a44">Finding</tspan> <tspan font-weight="700" fill="#1e2a44">the</tspan> <tspan font-weight="700" fill="#1e2a44">ratio</tspan> is not always easy: judgments do not label it, and appeal judges may give</text><text x="450" y="512.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">different reasons.</text>
</svg>