<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 364" width="900" height="364" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="364" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three kinds of precedent</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Stare decisis, “stand by what has been decided”: like cases alike</text>
<rect x="30" y="124" width="269.3333333333333" height="208" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BINDING</text><text x="48" y="180.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Must follow</text><text x="48" y="209.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="209.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Made by a court above (or,</text><text x="63.2" y="230.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">for some courts, the same</text><text x="63.2" y="251.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">court)</text><text x="48" y="276.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="276.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Material facts sufficiently</text><text x="63.2" y="297.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">similar</text><rect x="315.3333333333333" y="124" width="269.3333333333333" height="208" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="333.3333333333333" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PERSUASIVE</text><text x="333.3333333333333" y="180.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">May follow, need not</text><text x="333.3333333333333" y="209.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="348.5333333333333" y="209.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lower courts</text><text x="333.3333333333333" y="234.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="348.5333333333333" y="234.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Obiter dicta</text><text x="333.3333333333333" y="259.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="348.5333333333333" y="259.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Dissenting judgments</text><text x="333.3333333333333" y="284.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="348.5333333333333" y="284.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Privy Council</text><text x="333.3333333333333" y="309.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="348.5333333333333" y="309.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Other common law countries</text><rect x="600.6666666666666" y="124" width="269.3333333333333" height="208" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="618.6666666666666" y="154" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">ORIGINAL</text><text x="618.6666666666666" y="180.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">No earlier decision</text><text x="618.6666666666666" y="209.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The judge decides the point,</text><text x="618.6666666666666" y="230.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">creating a new precedent</text>
</svg>