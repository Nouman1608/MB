<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Comprehension is half of what is tested</text>

<line x1="215" y1="140" x2="685" y2="140" stroke="#1e2a44" stroke-width="7" stroke-linecap="round"/><path d="M450,140 L420,232 L480,232 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><circle cx="450" cy="140" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="215" y1="140" x2="155" y2="200" stroke="#1e2a44" stroke-width="2.5"/><line x1="215" y1="140" x2="275" y2="200" stroke="#1e2a44" stroke-width="2.5"/><path d="M125,200 L305,200 Q287,230 215,230 Q143,230 125,200 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><line x1="685" y1="140" x2="625" y2="200" stroke="#1e2a44" stroke-width="2.5"/><line x1="685" y1="140" x2="745" y2="200" stroke="#1e2a44" stroke-width="2.5"/><path d="M595,200 L775,200 Q757,230 685,230 Q613,230 595,200 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="215" y="222" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">50%</text><text x="685" y="222" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">50%</text><rect x="30" y="252" width="370" height="158" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="284" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RECEPTIVE: PAPER 2</text><text x="50" y="311.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Listening + reading</text><text x="50" y="341.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Unseen texts on all five themes. Needs</text><text x="50" y="363.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">comprehension vocabulary you</text><text x="50" y="385.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">recognise.</text><rect x="500" y="252" width="370" height="158" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="520" y="284" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">PRODUCTIVE: PAPER 1 + ORAL</text><text x="520" y="311.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Writing + speaking</text><text x="520" y="341.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Needs the vocabulary to talk and write</text><text x="520" y="363.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">about the theme yourself.</text><rect x="30" y="432" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="466.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Fluent speaking on Identities does not automatically transfer to comprehension.</text><text x="50" y="496.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Practise unseen listening and reading on the theme too: describing personality, values, cultural</text><text x="50" y="518.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">belonging, lifestyle choices.</text>
