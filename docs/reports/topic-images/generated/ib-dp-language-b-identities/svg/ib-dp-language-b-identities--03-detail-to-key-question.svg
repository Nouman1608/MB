<rect width="900" height="469" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From a detail to the key question</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Unseen passage: a community's traditional dress across generations</text>
<rect x="30" y="124" width="226.66666666666669" height="180" rx="14" fill="#eef1f0" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="180" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">SURFACE CONTENT</text><text x="50" y="206.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Traditional dress</text><text x="50" y="230.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">has changed over</text><text x="50" y="254.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">time</text><line x1="262.6666666666667" y1="214" x2="296.6666666666667" y2="214" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="302.6666666666667" y="124" width="204.00000000000003" height="180" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="322.6666666666667" y="192" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SPECIFIC DETAIL</text><text x="322.6666666666667" y="218.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">What changed,</text><text x="322.6666666666667" y="242.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">when, why?</text><line x1="512.6666666666667" y1="214" x2="546.6666666666667" y2="214" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="552.6666666666667" y="124" width="317.33333333333337" height="180" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="572.6666666666667" y="156" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">BROADER THEME QUESTION</text><text x="572.6666666666667" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">How does the change reflect</text><text x="572.6666666666667" y="206.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">a shift in how the</text><text x="572.6666666666667" y="230.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">community's identity is</text><text x="572.6666666666667" y="254.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">expressed across</text><text x="572.6666666666667" y="278.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">generations?</text><rect x="30" y="326" width="411" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="360.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Only extracting isolated facts</text><text x="50" y="390.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A summary of what the passage says is not,</text><text x="50" y="412.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">on its own, an answer.</text><rect x="459" y="326" width="411" height="111" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="479" y="360.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Connecting detail to theme</text><text x="479" y="390.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The comprehension skill actually being</text><text x="479" y="412.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">tested. Practise it under timed conditions.</text>
</svg>