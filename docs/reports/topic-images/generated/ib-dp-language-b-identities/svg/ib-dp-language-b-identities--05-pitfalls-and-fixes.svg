<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three common pitfalls and their fixes</text>

<clipPath id="tc100"><rect x="30" y="100" width="840" height="258" rx="14"/></clipPath><g clip-path="url(#tc100)"><rect x="30" y="100" width="385" height="48" fill="#b5d3cf"/><text x="44" y="127.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Pitfall</text><rect x="415" y="100" width="454.99999999999994" height="48" fill="#f2e7b8"/><text x="429" y="127.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Fix</text><rect x="30" y="148" width="385" height="70" fill="#dce9e7"/><text x="44" y="175.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Summarising the surface content of a text</text><rect x="415" y="148" width="454.99999999999994" height="70" fill="#ffffff"/><text x="429" y="175.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Connect it back to the key question about language,</text><text x="429" y="197.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">culture and identity formation</text><line x1="30" y1="218" x2="870" y2="218" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="218" width="385" height="70" fill="#dce9e7"/><text x="44" y="245.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Assuming class speaking practice</text><text x="44" y="267.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">guarantees comprehension</text><rect x="415" y="218" width="454.99999999999994" height="70" fill="#f8faf9"/><text x="429" y="245.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Practise genuinely unseen listening and reading</text><text x="429" y="267.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">texts on Identities</text><line x1="30" y1="288" x2="870" y2="288" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="288" width="385" height="70" fill="#dce9e7"/><text x="44" y="315.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Ignoring register in the Paper 1 task</text><rect x="415" y="288" width="454.99999999999994" height="70" fill="#ffffff"/><text x="429" y="315.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Follow the text type's conventions, e.g. a blog's</text><text x="429" y="337.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">informal first-person voice versus a formal letter</text></g><line x1="415" y1="100" x2="415" y2="358" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="100" width="840" height="258" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="394.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">Treat Identities as a <tspan font-weight="700">lens</tspan> <tspan font-weight="700">applied</tspan> <tspan font-weight="700">to</tspan> <tspan font-weight="700">unfamiliar</tspan> <tspan font-weight="700">material</tspan>, not a block of content to recall.</text>
