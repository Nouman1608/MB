<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 602" width="900" height="602" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="602" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Isa (AS): what Muslims believe</text>

<rect x="30" y="104" width="270.6666666666667" height="174" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="138.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Miraculous birth</text><text x="50" y="166.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Born to Maryam though no</text><text x="50" y="187.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">man had touched her</text><text x="50" y="208.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(19:16-21); created by</text><text x="50" y="229.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“Be”, like Adam (3:59)</text><rect x="314.6666666666667" y="104" width="270.6666666666667" height="174" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="334.6666666666667" y="138.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Spoke from the cradle</text><text x="334.6666666666667" y="166.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“Indeed, I am the servant</text><text x="334.6666666666667" y="187.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">of Allah” (19:30)</text><rect x="599.3333333333334" y="104" width="270.6666666666667" height="174" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="619.3333333333334" y="138.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Miracles by Allah’s</text><text x="619.3333333333334" y="162.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">permission</text><text x="619.3333333333334" y="190.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A bird from clay, healing</text><text x="619.3333333333334" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the blind and the leper,</text><text x="619.3333333333334" y="232.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">bringing the dead to life</text><text x="619.3333333333334" y="253.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(3:49)</text><rect x="30" y="292" width="270.6666666666667" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="326.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Given the Injil</text><text x="50" y="354.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Confirming the Tawrat</text><text x="50" y="375.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(5:46)</text><rect x="314.6666666666667" y="292" width="270.6666666666667" height="150" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="334.6666666666667" y="326.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Not crucified</text><text x="334.6666666666667" y="354.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“They did not kill him, nor</text><text x="334.6666666666667" y="375.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">did they crucify him”</text><text x="334.6666666666667" y="396.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(4:157); Allah raised him</text><text x="334.6666666666667" y="417.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">up (4:158)</text><rect x="599.3333333333334" y="292" width="270.6666666666667" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="619.3333333333334" y="326.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Announced Ahmad</text><text x="619.3333333333334" y="354.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A messenger to come after</text><text x="619.3333333333334" y="375.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">him (61:6)</text><rect x="30" y="460" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="496" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Tawhid protected</text><text x="50" y="525.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Muslims honour Isa (AS) as a great prophet and servant of Allah, not as divine. Every</text><text x="50" y="547.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">miracle came by Allah’s permission.</text>
</svg>