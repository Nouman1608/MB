<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 726" width="900" height="726" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="726" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Adam (AS): the first human and first prophet</text>

<line x1="62" y1="124" x2="62" y2="564" stroke="#c9d6d4" stroke-width="4"/><rect x="108" y="104" width="762" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="139.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A khalifah announced</text><text x="128" y="167.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Allah tells the angels He will place a successor on earth (2:30).</text><circle cx="62" cy="148" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="156.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="108" y="202" width="762" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="237.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Created and taught</text><text x="128" y="265.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">From clay; taught “the names of all things” (2:31).</text><circle cx="62" cy="246" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="254.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="108" y="300" width="762" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="335.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Iblis refuses</text><text x="128" y="363.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Out of pride: “made from fire” (7:12).</text><circle cx="62" cy="344" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="352.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="108" y="398" width="762" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="433.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The tree and the descent</text><text x="128" y="461.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Shaytan made them slip (2:36); sent down to earth.</text><circle cx="62" cy="442" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="450.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="108" y="496" width="762" height="88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="128" y="531.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Repentance accepted</text><text x="128" y="559.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“Our Lord, we have wronged ourselves” (7:23); Allah accepted it (2:37).</text><circle cx="62" cy="540" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="548.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="157.28750000000002" y="602" width="229.49999999999997" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="272.0375" y="629.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Repentance and mercy</text><rect x="398.7875" y="602" width="190.39999999999998" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="493.9875" y="629.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">No inherited sin</text><rect x="601.1875" y="602" width="141.52499999999998" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="671.95" y="629.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Stewardship</text><rect x="263.375" y="654" width="249.04999999999995" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="387.9" y="681.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Pride as the first sin</text><rect x="524.425" y="654" width="112.19999999999999" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="580.525" y="681.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Equality</text>
</svg>