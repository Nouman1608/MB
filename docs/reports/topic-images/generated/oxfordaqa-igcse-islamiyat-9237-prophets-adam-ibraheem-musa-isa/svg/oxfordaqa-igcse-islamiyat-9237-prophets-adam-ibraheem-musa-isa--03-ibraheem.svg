<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 635" width="900" height="635" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="635" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Ibraheem (AS): from his life to worship today</text>

<rect x="30" y="104" width="253.33333333333334" height="153" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="138.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Reasoned against</text><text x="50" y="162.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">idols</text><text x="50" y="190.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Star, moon and sun set,</text><text x="50" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">so cannot be gods</text><text x="50" y="232.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(6:76-79)</text><line x1="289.33333333333337" y1="180.5" x2="317.33333333333337" y2="180.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="104" width="253.33333333333334" height="153" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="343.33333333333337" y="138.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Broke the idols</text><text x="343.33333333333337" y="166.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Left the largest;</text><text x="343.33333333333337" y="187.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">challenged his people</text><text x="343.33333333333337" y="208.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(21:57-63)</text><line x1="582.6666666666667" y1="180.5" x2="610.6666666666667" y2="180.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="104" width="253.33333333333334" height="153" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="636.6666666666667" y="138.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The fire made cool</text><text x="636.6666666666667" y="166.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“O fire, be coolness and</text><text x="636.6666666666667" y="187.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">safety” (21:69)</text><rect x="30" y="275" width="253.33333333333334" height="153" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="309.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Hajar and Isma’il</text><text x="50" y="333.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">(AS)</text><text x="50" y="361.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Left in the valley of</text><text x="50" y="382.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Makkah at Allah’s command</text><line x1="289.33333333333337" y1="351.5" x2="317.33333333333337" y2="351.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="275" width="253.33333333333334" height="153" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="343.33333333333337" y="309.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The dream of</text><text x="343.33333333333337" y="333.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">sacrifice</text><text x="343.33333333333337" y="361.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Both submitted; ransomed</text><text x="343.33333333333337" y="382.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“with a great sacrifice”</text><text x="343.33333333333337" y="403.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(37:102-107)</text><line x1="582.6666666666667" y1="351.5" x2="610.6666666666667" y2="351.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="275" width="253.33333333333334" height="153" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="636.6666666666667" y="309.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The Ka’aba raised</text><text x="636.6666666666667" y="337.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Father and son raised its</text><text x="636.6666666666667" y="358.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">foundations (2:127)</text><text x="450" y="466" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="middle">Recalled in worship today</text><rect x="30" y="492" width="268" height="113" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="164" y="527.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Sa’i</text><text x="164" y="555.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">remembers Hajar</text><rect x="316" y="492" width="268" height="113" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="527.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Eid-ul-Adha</text><text x="450" y="552.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">sacrifice</text><text x="450" y="580.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">remembers the ram</text><rect x="602" y="492" width="268" height="113" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="736" y="527.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">The Ka’aba</text><text x="736" y="555.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">the house he built</text>
</svg>