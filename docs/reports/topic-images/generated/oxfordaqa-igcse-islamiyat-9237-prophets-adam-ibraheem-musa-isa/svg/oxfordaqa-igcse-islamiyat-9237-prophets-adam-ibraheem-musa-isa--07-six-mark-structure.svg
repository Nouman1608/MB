<rect width="900" height="476" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A 6-mark answer: why Ibraheem (AS) is important</text>

<text x="228.5" y="124" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Reason (AO1)</text><text x="671.5" y="124" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Development (AO1)</text><rect x="30" y="140" width="397" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="168.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A model of Tawhid [1]</text><line x1="433" y1="175" x2="467" y2="175" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="140" width="397" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="489" y="168.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rejected and broke his father’s idols:</text><text x="489" y="189.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">worship Allah alone even when unpopular [1]</text><rect x="30" y="224" width="397" height="91" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="252.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Muslim worship is built on his story [1]</text><line x1="433" y1="269.5" x2="467" y2="269.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="224" width="397" height="91" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="489" y="252.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sa’i for Hajar; the Eid-ul-Adha sacrifice</text><text x="489" y="273.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">for the ram: Muslims relive his submission</text><text x="489" y="294.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">[1]</text><rect x="30" y="333" width="840" height="113" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="366" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">APPLY A SOURCE (AO2) [2]</text><text x="50" y="392.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Allah “took Ibraheem as an intimate friend” (4:125)</text><text x="50" y="421.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Complete obedience brings a person close to Allah, so Muslims follow his example.</text>
</svg>