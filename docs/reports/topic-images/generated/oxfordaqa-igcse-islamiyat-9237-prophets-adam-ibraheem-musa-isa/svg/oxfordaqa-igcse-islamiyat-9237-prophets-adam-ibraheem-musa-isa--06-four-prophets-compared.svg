<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 566" width="900" height="566" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="566" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four prophets at a glance</text>

<rect x="30" y="104" width="170" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Prophet</text><rect x="200" y="104" width="280" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="212" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Title or role</text><rect x="480" y="104" width="170" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="492" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Revealed book</text><rect x="650" y="104" width="220" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="662" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Key importance</text><rect x="30" y="150" width="170" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="175.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Adam (AS)</text><rect x="200" y="150" width="280" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="212" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">First prophet; first khalifah</text><rect x="480" y="150" width="170" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="492" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">—</text><rect x="650" y="150" width="220" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="662" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Repentance and mercy;</text><text x="662" y="196.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">stewardship</text><rect x="30" y="214" width="170" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="239.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Ibraheem (AS)</text><rect x="200" y="214" width="280" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="212" y="239.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Khalilullah, intimate friend</text><text x="212" y="260.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(4:125)</text><rect x="480" y="214" width="170" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="492" y="239.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Suhuf (87:18-19)</text><rect x="650" y="214" width="220" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="662" y="239.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Model of Tawhid and</text><text x="662" y="260.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">submission</text><rect x="30" y="278" width="170" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="303.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Musa (AS)</text><rect x="200" y="278" width="280" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="212" y="303.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Kalimullah, Allah spoke</text><text x="212" y="324.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">directly (4:164)</text><rect x="480" y="278" width="170" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="492" y="303.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Tawrat</text><rect x="650" y="278" width="220" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="662" y="303.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Standing up to</text><text x="662" y="324.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">injustice; revealed law</text><rect x="30" y="342" width="170" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="367.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Isa (AS)</text><rect x="200" y="342" width="280" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="212" y="367.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Messiah, son of Maryam</text><rect x="480" y="342" width="170" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="492" y="367.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Injil</text><rect x="650" y="342" width="220" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="662" y="367.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Servant of Allah;</text><text x="662" y="388.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">announced Ahmad</text><rect x="30" y="424" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="460" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Do not mix up the books</text><text x="50" y="489.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The Zabur was given to Dawud (AS), who is not one of the four named here. All prophets</text><text x="50" y="511.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">share one message, Tawhid (2:285).</text>
</svg>