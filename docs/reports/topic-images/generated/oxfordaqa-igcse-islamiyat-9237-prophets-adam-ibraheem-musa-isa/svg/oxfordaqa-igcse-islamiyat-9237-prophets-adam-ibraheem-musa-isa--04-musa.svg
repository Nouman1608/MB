<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 842" width="900" height="842" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="842" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Musa (AS): the prophet who spoke with Allah</text>

<line x1="62" y1="124" x2="62" y2="662" stroke="#c9d6d4" stroke-width="4"/><rect x="108" y="104" width="762" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="139.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Saved as a baby</text><text x="128" y="167.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Placed in the river (28:7); taken into Pharaoh’s household.</text><circle cx="62" cy="148" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="156.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="108" y="202" width="762" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="237.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Madyan</text><text x="128" y="265.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Fled as a young man; married and worked as a shepherd.</text><circle cx="62" cy="246" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="254.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="108" y="300" width="762" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="335.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Called at Tuwa</text><text x="128" y="363.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Allah spoke to him (20:9-14); signs of the staff and the shining hand (20:17-22).</text><circle cx="62" cy="344" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="352.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="108" y="398" width="762" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="433.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Before Pharaoh, with Harun (AS)</text><text x="128" y="461.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Pharaoh refused to free the Children of Israel.</text><circle cx="62" cy="442" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="450.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="108" y="496" width="762" height="88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="128" y="531.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The sea parted</text><text x="128" y="559.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“Indeed, with me is my Lord” (26:62); Pharaoh’s army drowned.</text><circle cx="62" cy="540" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="548.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="108" y="594" width="762" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="629.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The Tawrat</text><text x="128" y="657.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Received at the mountain as “guidance and light” (5:44).</text><circle cx="62" cy="638" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="646.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><rect x="30" y="700" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="736" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Ashura</text><text x="50" y="765.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The Prophet (pbuh) fasted on the 10th of Muharram, the day Musa (AS) was saved, linking</text><text x="50" y="787.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">this story to a Muslim practice.</text>
</svg>