<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 472" width="900" height="472" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="472" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Life, role, importance: three different questions</text>

<rect x="30" y="104" width="170" height="72" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="147" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Life</text><rect x="214" y="104" width="656" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="133.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The main events, in order. Musa (AS): saved as a baby, called at Tuwa,</text><text x="230" y="155.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">confronts Pharaoh, leads the Children of Israel out of Egypt.</text><rect x="30" y="188" width="170" height="72" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="231" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Role</text><rect x="214" y="188" width="656" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="217.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The job Allah gave the prophet. Musa (AS): messenger to Pharaoh and the</text><text x="230" y="239.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Children of Israel; receiver of the Tawrat.</text><rect x="30" y="272" width="170" height="72" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="315" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Importance</text><rect x="214" y="272" width="656" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="301.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">What Muslims learn from him today. Musa (AS): courage against tyranny,</text><text x="230" y="323.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">trust in Allah, the value of revealed law.</text><rect x="30" y="362" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="395.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A 1- or 2-mark question usually wants a fact from the life. A 4- or 6-mark “explain”</text><text x="50" y="417.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">question wants the importance, supported by an event.</text>
</svg>