<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 384" width="900" height="384" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="384" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three stages, not one</text>

<rect x="30" y="120" width="260" height="150" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><circle cx="160" cy="120" r="22" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="160" y="127.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="160" y="186" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">Revelation</text><text x="160" y="235.95" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">how it was received</text><line x1="294" y1="195" x2="316" y2="195" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="320" y="120" width="260" height="150" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="3"/><circle cx="450" cy="120" r="22" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="450" y="127.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="450" y="186" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">Preservation</text><text x="450" y="224.95" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">how it was memorised and</text><text x="450" y="246.95" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">recorded</text><line x1="584" y1="195" x2="606" y2="195" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="610" y="120" width="260" height="150" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><circle cx="740" cy="120" r="22" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="740" y="127.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="740" y="186" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">Compilation</text><text x="740" y="224.95" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">how it was assembled into a</text><text x="740" y="246.95" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">single text</text><rect x="30" y="296" width="840" height="64" rx="14" fill="#f3dccd" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="336" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Keep the three stages distinct when describing how we have the Qur'an.</text>
</svg>