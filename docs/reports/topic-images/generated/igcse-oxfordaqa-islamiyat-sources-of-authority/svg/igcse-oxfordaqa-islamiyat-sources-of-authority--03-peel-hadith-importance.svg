<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 532" width="900" height="532" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="532" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Point, evidence, explain, link</text>

<rect x="30" y="112" width="180" height="82" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="120" y="161" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Point</text><rect x="222" y="112" width="648" height="82" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="244" y="144" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The Qur'an gives general principles and commands but does not always</text><text x="244" y="166" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">explain how to put them into practice.</text><rect x="30" y="206" width="180" height="82" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="120" y="255" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Evidence</text><rect x="222" y="206" width="648" height="82" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="244" y="238" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">It commands Salah and Zakah; the Hadith and Sunnah record the exact</text><text x="244" y="260" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">method, timing and conditions the Prophet (pbuh) demonstrated.</text><rect x="30" y="300" width="180" height="82" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="120" y="349" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Explain</text><rect x="222" y="300" width="648" height="82" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="244" y="332" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Without the Hadith, many commands would stay open to interpretation:</text><text x="244" y="354" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">it is the practical explanation of the Qur'an.</text><rect x="30" y="394" width="180" height="82" rx="14" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2.5"/><text x="120" y="443" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Link</text><rect x="222" y="394" width="648" height="82" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="244" y="426" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">So the Hadith is the second source of Shariah, subordinate to but</text><text x="244" y="448" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">essential alongside the Qur'an.</text><text x="450" y="510" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">This structure works for most "explain the importance of" questions.</text>
</svg>