<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 616" width="900" height="616" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="616" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How the sources of authority relate</text>

<rect x="30" y="112" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="3.5"/><circle cx="72" cy="166.5" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="72" y="174.42" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="112" y="150" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">The Qur'an</text><text x="112" y="176" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">primary source</text><text x="112" y="202" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Directly revealed</text><rect x="70" y="235" width="760" height="109" rx="14" fill="#ffffff" stroke="#d4b02e" stroke-width="2.5"/><circle cx="112" cy="289.5" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="112" y="297.42" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="152" y="273" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Hadith and Sunnah</text><text x="152" y="299" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">records the Prophet's (pbuh) words and practice</text><text x="152" y="325" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Explain and apply the Qur'an</text><rect x="110" y="358" width="680" height="130" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><circle cx="152" cy="423" r="22" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="152" y="430.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="192" y="396" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Ijma (consensus) and Qiyas (analogy)</text><text x="192" y="422" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">secondary sources</text><text x="192" y="448" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Used by scholars to derive rulings where the Qur'an and Hadith give</text><text x="192" y="469" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">no explicit guidance</text><rect x="30" y="508" width="840" height="84" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="56" y="542" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A common scholarly account, not the only answer</text><text x="56" y="572" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The specification asks for meaning, role and importance; a reasoned different account is not penalised.</text>
</svg>