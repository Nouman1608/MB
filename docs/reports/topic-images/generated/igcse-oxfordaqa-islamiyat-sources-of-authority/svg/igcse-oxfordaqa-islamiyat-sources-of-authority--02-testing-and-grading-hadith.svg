<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="500" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Testing and categorising Hadith</text>

<rect x="30" y="112" width="410" height="124" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="56" y="150" font-size="25" font-weight="700" fill="#1e2a44" text-anchor="start">Isnad</text><text x="150" y="150" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">the chain</text><text x="56" y="186" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Checks the chain of narrators back to</text><text x="56" y="210" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">the Prophet (pbuh).</text><rect x="460" y="112" width="410" height="124" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="3"/><text x="486" y="150" font-size="25" font-weight="700" fill="#1e2a44" text-anchor="start">Matn</text><text x="566" y="150" font-size="17" font-weight="600" fill="#8a6d0d" text-anchor="start">the text</text><text x="486" y="186" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Checks the content of the text itself.</text><text x="450" y="274" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle" font-style="italic">Do not confuse the two</text><path d="M235,238 L235,292 L450,292 L450,346" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M665,238 L665,292 L450,292" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round"/><defs><linearGradient id="rel" x1="0" x2="1"><stop offset="0" stop-color="#2e6b62"/><stop offset="1" stop-color="#b5602e"/></linearGradient></defs><rect x="30" y="352" width="198" height="70" rx="12" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="129" y="395" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Sahih</text><rect x="244" y="352" width="198" height="70" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="343" y="395" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Hasan</text><rect x="458" y="352" width="198" height="70" rx="12" fill="#f2e7b8" stroke="#2e6b62" stroke-width="2.5"/><text x="557" y="395" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Daeef</text><rect x="672" y="352" width="198" height="70" rx="12" fill="#f3dccd" stroke="#b5602e" stroke-width="2.5"/><text x="771" y="395" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Maudu</text><rect x="30" y="440" width="840" height="10" rx="5" fill="url(#rel)"/><text x="30" y="476" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">more reliable</text><text x="870" y="476" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">less reliable</text>
</svg>