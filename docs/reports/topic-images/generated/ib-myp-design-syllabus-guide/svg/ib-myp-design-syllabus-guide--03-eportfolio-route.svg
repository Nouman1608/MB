<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 683" width="900" height="683" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="683" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The ePortfolio: from project to result</text>

<rect x="30" y="112" width="840" height="102" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="163" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="170.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="120" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Start from a design situation</text><text x="120" y="172" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">identify a challenge or problem, research it, develop and create a product or</text><text x="120" y="195" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">solution, and evaluate its success</text><line x1="76" y1="215" x2="76" y2="235" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="236" width="840" height="102" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="287" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="294.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="120" y="270" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Submit a complete design folder</text><text x="120" y="296" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">with a design brief and specification, assessed as product design, digital</text><text x="120" y="319" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">design, or combined digital and product design</text><line x1="76" y1="339" x2="76" y2="359" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="360" width="840" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="399.5" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="407.42" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="120" y="394" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Your teacher marks it</text><text x="120" y="420" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">against the published criteria for MYP year 5</text><line x1="76" y1="440" x2="76" y2="460" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="461" width="840" height="102" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="512" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="76" y="519.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="120" y="495" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The IB moderates a sample from every school</text><text x="120" y="521" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">and adjusts grades as necessary, so results are comparable across schools and</text><text x="120" y="544" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">countries</text><rect x="30" y="587" width="840" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="618" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Most marks sit in the documented process, not the polish of the product.</text><text x="450" y="643" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">An ePortfolio, not a written on-screen examination</text>
</svg>