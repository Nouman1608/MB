<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The MYP Design framework</text>

<rect x="30" y="112" width="410" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="144" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Key concepts</text><rect x="50" y="160" width="161.285" height="38" rx="9" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2"/><text x="130.64249999999998" y="185.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">communication</text><rect x="221.285" y="160" width="141.395" height="38" rx="9" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2"/><text x="291.9825" y="185.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">communities</text><rect x="50" y="206" width="141.395" height="38" rx="9" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2"/><text x="120.6975" y="231.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">development</text><rect x="201.395" y="206" width="101.61500000000001" height="38" rx="9" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2"/><text x="252.20250000000001" y="231.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">systems</text><rect x="460" y="112" width="410" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="144" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Related concepts, for example</text><rect x="480" y="160" width="131.45" height="38" rx="9" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="545.725" y="185.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">adaptation</text><rect x="621.45" y="160" width="131.45" height="38" rx="9" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="687.1750000000001" y="185.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">ergonomics</text><rect x="480" y="206" width="171.23000000000002" height="38" rx="9" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="565.615" y="231.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">sustainability</text><rect x="661.23" y="206" width="131.45" height="38" rx="9" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="726.955" y="231.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">innovation</text><rect x="30" y="278" width="840" height="192" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="310" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Explored through the same six global contexts as every MYP subject</text><rect x="50" y="328" width="390" height="38" rx="9" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2"/><text x="245" y="352.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">identities and relationships</text><rect x="460" y="328" width="390" height="38" rx="9" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2"/><text x="655" y="352.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">orientation in space and time</text><rect x="50" y="374" width="390" height="38" rx="9" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2"/><text x="245" y="398.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">personal and cultural expression</text><rect x="460" y="374" width="390" height="38" rx="9" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2"/><text x="655" y="398.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">scientific and technical innovation</text><rect x="50" y="420" width="390" height="38" rx="9" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2"/><text x="245" y="444.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">globalization and sustainability</text><rect x="460" y="420" width="390" height="38" rx="9" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2"/><text x="655" y="444.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">fairness and development</text><text x="450" y="506" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Assessed through four criteria</text><rect x="30" y="522" width="198" height="214" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="64" cy="556" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="64" y="563.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><text x="94" y="562" font-size="15" font-weight="600" fill="#4a5568" text-anchor="start">Criterion A</text><text x="46" y="604" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Inquiring and</text><text x="46" y="625" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">analysing</text><text x="46" y="654" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">identify the</text><text x="46" y="673" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">problem, analyse the</text><text x="46" y="692" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">need and inquire</text><text x="46" y="711" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">into the problem</text><rect x="243" y="522" width="198" height="214" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="277" cy="556" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="277" y="563.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><text x="307" y="562" font-size="15" font-weight="600" fill="#4a5568" text-anchor="start">Criterion B</text><text x="259" y="604" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Developing ideas</text><text x="259" y="633" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">write a detailed</text><text x="259" y="652" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">specification and</text><text x="259" y="671" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">present the solution</text><rect x="456" y="522" width="198" height="214" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="490" cy="556" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="490" y="563.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">C</text><text x="520" y="562" font-size="15" font-weight="600" fill="#4a5568" text-anchor="start">Criterion C</text><text x="472" y="604" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Creating the</text><text x="472" y="625" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">solution</text><text x="472" y="654" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">plan, then follow</text><text x="472" y="673" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">the plan to create a</text><text x="472" y="692" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">testable prototype</text><rect x="669" y="522" width="198" height="214" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="703" cy="556" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="703" y="563.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">D</text><text x="733" y="562" font-size="15" font-weight="600" fill="#4a5568" text-anchor="start">Criterion D</text><text x="685" y="604" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluating</text><text x="685" y="633" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">design and run</text><text x="685" y="652" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">tests, evaluate</text><text x="685" y="671" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">success and the</text><text x="685" y="690" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">impact on the client</text><rect x="30" y="754" width="840" height="76" rx="14" fill="#dce9e7" stroke="#2e