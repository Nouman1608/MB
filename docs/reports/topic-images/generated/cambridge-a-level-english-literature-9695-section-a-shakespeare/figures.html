<!-- place after: ## Shakespeare's dramatic language -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/cambridge-a-level-english-literature-9695-section-a-shakespeare--02-verse-prose-rhyme.webp" width="900" height="830" alt="Three modes of Shakespeare’s language. Blank verse, unrhymed iambic pentameter, is the usual voice of high-status characters and serious feeling. Prose is used for comedy, low-status characters, letters and disorder, so a high-status character dropping into prose has changed something. Rhyming couplets close scenes or mark quotable conclusions. Below, a shared line split between two speakers suggests intimacy, haste or conflict, and a short line leaves a pause." loading="lazy">
