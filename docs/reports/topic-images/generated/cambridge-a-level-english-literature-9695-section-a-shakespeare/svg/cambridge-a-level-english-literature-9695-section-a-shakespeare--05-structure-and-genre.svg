<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Structure and genre</text>

<text x="30" y="126" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Five-act shape (often blurred)</text><line x1="60" y1="334" x2="840" y2="334" stroke="#c9d6d4" stroke-width="3"/><path d="M60,334 C216,324 333,209 450,209 S684,304 840,324" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><circle cx="60" cy="334" r="8" fill="#2e6b62"/><text x="110" y="364" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">exposition</text><circle cx="255" cy="272" r="8" fill="#2e6b62"/><text x="255" y="364" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">complication</text><circle cx="450" cy="209" r="8" fill="#2e6b62"/><text x="450" y="364" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">crisis</text><circle cx="645" cy="272" r="8" fill="#2e6b62"/><text x="645" y="364" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">falling action</text><circle cx="840" cy="324" r="8" fill="#2e6b62"/><text x="790" y="364" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">resolution</text><line x1="559.2" y1="204" x2="559.2" y2="232" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray="5 4"/><rect x="536.2" y="174" width="46" height="30" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="593.2" y="196" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">locate a (b) passage in this arc</text><text x="30" y="408" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Genre sets expectations about endings:</text><rect x="400" y="388" width="94" height="33" rx="16.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="447" y="410.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">tragedy</text><rect x="506" y="388" width="85" height="33" rx="16.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="548.5" y="410.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">comedy</text><rect x="603" y="388" width="94" height="33" rx="16.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="650" y="410.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">history</text><text x="30" y="442" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Much critical debate concerns how far a play fulfils them.</text><text x="30" y="484" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Parallel and contrasting plots</text><text x="30" y="536" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">Henry IV, Part 1</text><rect x="300" y="514" width="230" height="32" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="415" y="535.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">the tavern</text><rect x="620" y="514" width="250" height="32" rx="16" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="745" y="535.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">the court</text><line x1="536" y1="530" x2="614" y2="530" stroke="#1e2a44" stroke-width="2.5" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="30" y="598" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">The Taming of the Shrew</text><rect x="300" y="576" width="230" height="32" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="415" y="597.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Bianca’s suitors</text><rect x="620" y="576" width="250" height="32" rx="16" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="745" y="597.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Katherina and Petruchio</text><line x1="536" y1="592" x2="614" y2="592" stroke="#1e2a44" stroke-width="2.5" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="30" y="660" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">Hamlet</text><rect x="300" y="638" width="570" height="32" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="585" y="659.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">several sons seeking to avenge fathers</text><text x="30" y="710" font-size="20" font-weight="700" fill="#1e2a44">A frame: the Induction of <tspan font-style="italic">The Taming of the Shrew</tspan></text><rect x="30" y="726" width="840" height="168" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><path d="M70.4,872 L74.4,830.4 Q84,822.4 93.6,830.4 L97.6,872 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="84" cy="814.4" r="10.4" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="124" y="760" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">Christopher Sly, a drunken tinker, tricked into believing he is a lord</text><rect x="150" y="778" width="696" height="98" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="498" y="818" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">The main story, performed for him as a play</text><text x="498" y="848" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">invites readings of the whole action as performance</text>
