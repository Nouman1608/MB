<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 877" width="900" height="877" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="877" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Making AO5 work</text>

<rect x="30" y="118" width="270.6666666666667" height="145" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="157.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SOURCE</text><text x="46" y="182.9" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Performance choices</text><text x="46" y="211.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">How productions might stage</text><text x="46" y="232.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a moment.</text><rect x="314.6666666666667" y="118" width="270.6666666666667" height="145" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330.6666666666667" y="147" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SOURCE</text><text x="330.6666666666667" y="172.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Critical approaches</text><text x="330.6666666666667" y="200.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Feminist, historicist or</text><text x="330.6666666666667" y="221.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">psychoanalytic, as ways of</text><text x="330.6666666666667" y="242.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reading.</text><rect x="599.3333333333334" y="118" width="270.6666666666667" height="145" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="615.3333333333334" y="157.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SOURCE</text><text x="615.3333333333334" y="182.9" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Audiences across time</text><text x="615.3333333333334" y="211.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A modern response against an</text><text x="615.3333333333334" y="232.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">early one.</text><line x1="450" y1="277" x2="450" y2="307" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="313" width="840" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="349" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Weigh each reading against textual evidence, then judge</text><text x="450" y="378.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">AO5 does not require a list of critics’ names.</text><text x="30" y="437" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Worked example: Katherina’s closing speech</text><rect x="30" y="453" width="410" height="112" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="486" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PLAYED SINCERELY</text><text x="50" y="512.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Completes the “taming”</text><text x="50" y="540.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The ending celebrates order.</text><rect x="460" y="453" width="410" height="112" rx="14" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="480" y="486" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">PLAYED WITH IRONY</text><text x="480" y="512.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Fluency as independence</text><text x="480" y="540.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">As some modern productions stage it.</text><text x="450" y="590" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">the text supports neither reading alone</text><rect x="30" y="601" width="410" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="641.9" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Her voice has grown?</text><text x="46" y="670.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">It is the longest speech she gives.</text><rect x="460" y="601" width="410" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="476" y="631.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Or silenced?</text><text x="476" y="659.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Delivered in public, at Petruchio’s command,</text><text x="476" y="680.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">to win his wager.</text><rect x="30" y="717" width="840" height="136" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="750" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">JUDGEMENT</text><text x="50" y="777" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The Induction tips the balance</text><text x="50" y="806.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Because the whole story is staged as a play for Sly, the speech reads as a performance of</text><text x="50" y="828.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">submission rather than a statement of belief.</text>
</svg>