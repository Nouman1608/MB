<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 830" width="900" height="830" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="830" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Verse, prose and rhyme</text>

<rect x="30" y="116" width="840" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="42" y="128" width="250" height="104" rx="10" fill="#dce9e7"/><circle cx="64" cy="176" r="5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="86" cy="176" r="8" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><circle cx="108" cy="176" r="5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="130" cy="176" r="8" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><circle cx="152" cy="176" r="5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="174" cy="176" r="8" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><circle cx="196" cy="176" r="5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="218" cy="176" r="8" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><circle cx="240" cy="176" r="5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="262" cy="176" r="8" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="58" y="210" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">five weak–strong pairs</text><text x="316" y="156" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Blank verse</text><text x="316" y="186" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Unrhymed iambic pentameter: the usual voice of high-status</text><text x="316" y="208" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">characters and serious feeling.</text><rect x="30" y="256" width="840" height="172" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="42" y="268" width="250" height="148" rx="10" fill="#f2e7b8"/><line x1="58" y1="318" x2="263.79999999999995" y2="318" stroke="#8a6d0d" stroke-width="6" stroke-linecap="round" opacity="0.7"/><line x1="58" y1="332" x2="247" y2="332" stroke="#8a6d0d" stroke-width="6" stroke-linecap="round" opacity="0.7"/><line x1="58" y1="346" x2="268" y2="346" stroke="#8a6d0d" stroke-width="6" stroke-linecap="round" opacity="0.7"/><line x1="58" y1="360" x2="173.5" y2="360" stroke="#8a6d0d" stroke-width="6" stroke-linecap="round" opacity="0.7"/><text x="316" y="296" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Prose</text><text x="316" y="326" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Comedy, low-status characters, letters, disorder felt or</text><text x="316" y="348" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">feigned. A high-status character dropping into prose has</text><text x="316" y="370" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">changed mood, company or self-control, as Hamlet’s shifts</text><text x="316" y="392" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">show.</text><rect x="30" y="440" width="840" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="42" y="452" width="250" height="104" rx="10" fill="#dce9e7"/><line x1="58" y1="488" x2="234" y2="488" stroke="#1e2a44" stroke-width="6" stroke-linecap="round" opacity="0.45"/><circle cx="254" cy="488" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="254" y="493" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">a</text><line x1="58" y1="512" x2="234" y2="512" stroke="#1e2a44" stroke-width="6" stroke-linecap="round" opacity="0.45"/><circle cx="254" cy="512" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="254" y="517" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">a</text><text x="316" y="480" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Rhyming couplets</text><text x="316" y="510" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Often close scenes or mark a sententious, quotable</text><text x="316" y="532" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">conclusion.</text><text x="30" y="600" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Lines that break the pattern</text><rect x="30" y="616" width="410" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="651.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Shared line</text><text x="50" y="680.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">One speaker completes another’s</text><text x="50" y="702.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">pentameter: intimacy, haste or conflict.</text><rect x="460" y="616" width="410" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="651.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Short line</text><text x="480" y="680.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A pause the actor must fill.</text><text x="52" y="738" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">A</text><circle cx="80" cy="733" r="5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="102" cy="733" r="8" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><circle cx="124" cy="733" r="5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="146" cy="733" r="8" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><circle cx="168" cy="733" r="5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="190" cy="733" r="8" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="204" y="778" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">B</text><circle cx="232" cy="773" r="5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="254" cy="773" r="8" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><circle cx="276" cy="773" r="5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="298" cy="773" r="8" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><circle cx="500" cy="753" r="5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="522" cy="753" r="8" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><circle cx="544" cy="753" r="5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="566" cy="753" r="8" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><rect x="588" y="738" width="162" height="30" rx="6" fill="none" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="669" y="759" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">pause</text>
</svg>