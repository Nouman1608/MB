<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 721" width="900" height="721" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="721" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The (a) essay: a thesis a reader could dispute</text>

<rect x="30" y="118" width="840" height="85" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="151" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">QUESTION</text><text x="50" y="177.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">“How far does the play present Hal as a calculating politician?”</text><rect x="90" y="221" width="780" height="85" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="110" y="254" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">WEAK OPENING</text><text x="110" y="280.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Agrees, and lists examples</text><circle cx="52" cy="263.5" r="18" fill="#b5602e"/><path d="M44.8,256.3 l14.4,14.4 m0,-14.4 l-14.4,14.4" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="90" y="320" width="780" height="154" rx="14" fill="#f2e7b8" stroke="#2e6b62" stroke-width="2.5"/><text x="110" y="353" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRONGER: A MEASURED POSITION</text><text x="110" y="383.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“Hal’s early soliloquy invites us to see every tavern scene as calculation, but the</text><text x="110" y="405.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">warmth of his exchanges with Falstaff suggests a prince who enjoys the role he</text><text x="110" y="427.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">claims merely to be playing; the play presents calculation and pleasure as hard to</text><text x="110" y="449.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">separate.”</text><circle cx="52" cy="397" r="18" fill="#2e6b62"/><path d="M43.9,397.36 l5.76,6.12 l10.799999999999999,-11.88" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="30" y="506" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">What the stronger thesis does</text><rect x="30" y="522" width="192" height="33" rx="16.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="126" y="544.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">answers “How far”</text><rect x="234" y="522" width="241" height="33" rx="16.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="354.5" y="544.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">prepares an AO5 debate</text><rect x="487" y="522" width="290" height="33" rx="16.5" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="632" y="544.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">gives the essay a direction</text><rect x="30" y="576" width="270.6666666666667" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="616.9" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Three or four moments</text><text x="46" y="645.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">From across the play,</text><text x="46" y="666.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">including the ending.</text><rect x="314.6666666666667" y="576" width="270.6666666666667" height="121" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="330.6666666666667" y="606.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">AO5 woven in</text><text x="330.6666666666667" y="634.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">In two or three paragraphs,</text><text x="330.6666666666667" y="655.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">not saved for the</text><text x="330.6666666666667" y="676.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">conclusion.</text><rect x="599.3333333333334" y="576" width="270.6666666666667" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="615.3333333333334" y="616.9" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Brief quotation</text><text x="615.3333333333334" y="645.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Precise reference from</text><text x="615.3333333333334" y="666.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">memory.</text>
</svg>