<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Soliloquy: what it does to the audience</text>

<rect x="30" y="116" width="840" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="60" y="136" width="300" height="114" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5"/><path d="M195.55,240 L199.8,195.8 Q210,187.3 220.2,195.8 L224.45,240 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="210" cy="178.8" r="11.049999999999999" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><path d="M244,146 L330,146 Q342,146 342,158 L342,174 Q342,186 330,186 L266,186 L248,202 L252,186 L244,186 Q232,186 232,174 L232,158 Q232,146 244,146 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="287" y="172" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">reasoning</text><path d="M80,302 a16,16 0 0 1 32,0 z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><path d="M126,302 a16,16 0 0 1 32,0 z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><path d="M172,302 a16,16 0 0 1 32,0 z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><path d="M218,302 a16,16 0 0 1 32,0 z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><path d="M264,302 a16,16 0 0 1 32,0 z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><path d="M310,302 a16,16 0 0 1 32,0 z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="210" y="276" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">the audience</text><text x="400" y="168" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">How does the soliloquy position us?</text><rect x="400" y="192" width="119" height="34" rx="17" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="459.5" y="215.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">confidant</text><rect x="533" y="192" width="78" height="34" rx="17" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="572" y="215.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">judge</text><rect x="625" y="192" width="130" height="34" rx="17" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="690" y="215.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">accomplice</text><text x="400" y="266" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Soliloquies give access to a character’s reasoning,</text><text x="400" y="288" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">and so shape our judgement.</text><text x="30" y="362" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">Henry IV, Part 1</text><rect x="30" y="378" width="99" height="52" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><rect x="135" y="378" width="99" height="52" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="184.5" y="410" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">soliloquy</text><rect x="240" y="378" width="99" height="52" rx="6" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray="7 5"/><text x="289.5" y="410" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">tavern</text><rect x="345" y="378" width="99" height="52" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><rect x="450" y="378" width="99" height="52" rx="6" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray="7 5"/><text x="499.5" y="410" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">tavern</text><rect x="555" y="378" width="99" height="52" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><rect x="660" y="378" width="99" height="52" rx="6" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray="7 5"/><text x="709.5" y="410" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">tavern</text><rect x="765" y="378" width="99" height="52" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M166.5,432 C166.5,454 289.5,454 289.5,438" fill="none" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/><path d="M184.5,432 C184.5,470 499.5,470 499.5,438" fill="none" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/><path d="M202.5,432 C202.5,486 709.5,486 709.5,438" fill="none" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/><text x="30" y="506" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Hal’s early soliloquy reveals that his tavern life is a calculated performance, which changes</text><text x="30" y="528" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">how every later tavern scene is watched.</text><text x="30" y="584" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">Hamlet</text><rect x="30" y="600" width="99" height="52" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="79.5" y="632" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">public</text><rect x="135" y="600" width="99" height="52" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="184.5" y="632" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">private</text><rect x="240" y="600" width="99" height="52" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="289.5" y="632" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">public</text><rect x="345" y="600" width="99" height="52" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="394.5" y="632" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">private</text><rect x="450" y="600" width="99" height="52" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="499.5" y="632" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">public</text><rect x="555" y="600" width="99" height="52" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="604.5" y="632" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">private</text><rect x="660" y="600" width="99" height="52" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="709.5" y="632" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">public</text><rect x="765" y="600" width="99" height="52" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="814.5" y="632" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">private</text><text x="30" y="682" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The soliloquies chart a mind arguing with itself; placed between public scenes, they contrast</text><text x="30" y="704" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">private thought with public action.</text>
</svg>