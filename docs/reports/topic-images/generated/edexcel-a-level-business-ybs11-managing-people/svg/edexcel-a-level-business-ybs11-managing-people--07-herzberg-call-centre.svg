<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 790" width="900" height="790" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="790" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Herzberg’s two factors in action</text>

<line x1="70" y1="170" x2="830" y2="170" stroke="#1e2a44" stroke-width="4"/><circle cx="450" cy="170" r="9" fill="#1e2a44"/><text x="70" y="150" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">dissatisfied</text><text x="450" y="150" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">neutral</text><text x="830" y="150" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="end">satisfied</text><line x1="110" y1="196" x2="430" y2="196" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><line x1="470" y1="196" x2="790" y2="196" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><rect x="30" y="216" width="410" height="130" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="254" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Hygiene factors</text><text x="48" y="285" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Pay, conditions, supervision: prevent</text><text x="48" y="308" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">dissatisfaction</text><rect x="460" y="216" width="410" height="130" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="254" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Motivators</text><text x="478" y="285" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Achievement, recognition, responsibility:</text><text x="478" y="308" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">create satisfaction</text><text x="450" y="392" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Applied: a call centre with high staff turnover</text><rect x="30" y="410" width="410" height="88" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="443.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Pay is below rival centres in the area: a</text><text x="48" y="466.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">hygiene factor is unmet</text><line x1="235" y1="500" x2="235" y2="516" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="518" width="410" height="88" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="562.7" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Staff leave</text><line x1="235" y1="608" x2="235" y2="624" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="626" width="410" height="88" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="670.7" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Match local pay to reduce turnover</text><rect x="460" y="410" width="410" height="88" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="443.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Scripted calls give little sense of</text><text x="478" y="466.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">achievement</text><line x1="665" y1="500" x2="665" y2="516" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="460" y="518" width="410" height="88" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="562.7" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Even well-paid staff may leave</text><line x1="665" y1="608" x2="665" y2="624" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="460" y="626" width="410" height="88" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="659.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Empower experienced staff to resolve</text><text x="478" y="682.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">complaints: responsibility</text><text x="235" y="760" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">Chain 1</text><text x="665" y="760" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">Chain 2, applied</text>
</svg>