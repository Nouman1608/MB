<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="640" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Maslow’s hierarchy of needs</text>

<path d="M250,120 L370,120 L415,206 L205,206 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="310" y="170" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Self-actualisation</text><path d="M205,212 L415,212 L460,298 L160,298 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="310" y="262" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Esteem</text><path d="M160,304 L460,304 L505,390 L115,390 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="310" y="354" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Social</text><path d="M115,396 L505,396 L550,482 L70,482 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="310" y="446" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Safety</text><path d="M70,488 L550,488 L595,574 L25,574 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="310" y="538" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Physiological</text><line x1="580" y1="570" x2="580" y2="140" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text transform="translate(565,360) rotate(-90)" font-size="16" fill="#4a5568" text-anchor="middle">needs run upward</text><rect x="620" y="120" width="250" height="170" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="638" y="156" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A satisfied need</text><text x="638" y="186" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">stops motivating, so the</text><text x="638" y="209" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">next level up becomes</text><text x="638" y="232" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the motivator</text><rect x="620" y="310" width="250" height="150" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="638" y="346" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Manager</text><text x="638" y="376" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">finds which level staff</text><text x="638" y="399" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">have reached and offers</text><text x="638" y="422" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the next</text><rect x="620" y="480" width="250" height="125" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="638" y="514" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Limitation</text><text x="638" y="544" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Hard to measure; order may</text><text x="638" y="565" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">differ between people</text>
</svg>