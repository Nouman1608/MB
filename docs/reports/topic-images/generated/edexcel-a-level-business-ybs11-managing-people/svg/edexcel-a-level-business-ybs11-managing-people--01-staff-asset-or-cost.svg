<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 646" width="900" height="646" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="646" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Staff: an asset or a cost?</text>

<rect x="30" y="110" width="410" height="470" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="150" font-size="23" font-weight="700" fill="#2e6b62" text-anchor="middle">Staff as an asset</text><text x="52" y="192" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">The business…</text><rect x="50" y="206" width="370" height="44" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="68" y="234" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Invests in training</text><rect x="50" y="260" width="370" height="44" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="68" y="288" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Consults employees</text><rect x="50" y="314" width="370" height="44" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="68" y="342" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Aims to keep them</text><text x="52" y="384" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Because…</text><text x="52" y="410" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Skills and loyalty raise productivity and</text><text x="52" y="433" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">quality over time</text><rect x="50" y="476" width="370" height="88" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="68" y="504" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">Fits, e.g.</text><text x="68" y="530" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A premium hotel relying on experienced</text><text x="68" y="553" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">staff</text><rect x="460" y="110" width="410" height="470" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="665" y="150" font-size="23" font-weight="700" fill="#b5602e" text-anchor="middle">Staff as a cost</text><text x="482" y="192" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">The business…</text><rect x="480" y="206" width="370" height="44" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="498" y="234" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Keeps wage spending low</text><rect x="480" y="260" width="370" height="44" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="498" y="288" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Keeps labour flexible</text><rect x="480" y="314" width="370" height="44" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="498" y="342" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Scales staff with demand</text><text x="482" y="384" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Because…</text><text x="482" y="410" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Labour is a cost to be matched to demand</text><rect x="480" y="476" width="370" height="88" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="498" y="504" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">Fits, e.g.</text><text x="498" y="530" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A warehouse with big seasonal swings</text><text x="450" y="616" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Neither view is simply right: it depends on what the business sells.</text>
</svg>