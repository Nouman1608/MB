<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 890" width="900" height="890" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="890" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Corlan Assembly: 625 operatives, two spans</text>

<rect x="30" y="110" width="410" height="560" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Span of 5: tall</text><rect x="174" y="186" width="122" height="72" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="235" y="229" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1 director</text><rect x="143" y="270" width="184" height="72" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="235" y="313" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">5 managers</text><rect x="112" y="354" width="246" height="72" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="235" y="397" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">25 supervisors</text><rect x="81" y="438" width="308" height="72" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="235" y="481" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">125 team leaders</text><rect x="50" y="522" width="370" height="72" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="235" y="565" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">625 operatives</text><rect x="460" y="110" width="410" height="560" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Span of 25: flat</text><rect x="583.3333333333334" y="186" width="163.33333333333331" height="128" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="665" y="257" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1 director</text><rect x="531.6666666666667" y="326" width="266.66666666666663" height="128" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="665" y="397" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">25 managers</text><rect x="480" y="466" width="370" height="128" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="665" y="537" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">625 operatives</text><text x="235" y="640" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">4 levels above operatives, 156 managers</text><text x="665" y="640" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">2 levels above operatives, 26 managers</text><rect x="30" y="690" width="410" height="170" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="724" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Wide span gains</text><text x="50" y="754" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• 130 fewer management posts</text><text x="50" y="778" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• Lower salary costs</text><text x="50" y="802" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• Shorter chain of command,</text><text x="50" y="826" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">   faster decisions</text><rect x="460" y="690" width="410" height="170" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="480" y="724" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Wide span needs and risks</text><text x="480" y="754" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• Each manager supervises 25</text><text x="480" y="778" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• Needs skilled, self-reliant staff</text><text x="480" y="802" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">• Fewer promotion steps may</text><text x="480" y="826" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">   demotivate staff</text>
</svg>