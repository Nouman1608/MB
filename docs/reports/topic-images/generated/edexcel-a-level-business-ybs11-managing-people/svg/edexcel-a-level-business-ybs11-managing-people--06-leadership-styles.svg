<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 755" width="900" height="755" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="755" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four leadership styles</text>

<line x1="60" y1="140" x2="840" y2="140" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="60" y="128" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">leader decides alone</text><text x="840" y="128" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">staff decide</text><rect x="30" y="165" width="198" height="420" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="165" width="198" height="56" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="129" y="201" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Autocratic</text><text x="44" y="250" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Leader decides alone</text><text x="44" y="370" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">+</text><text x="64" y="370" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fast and clear;</text><text x="64" y="391" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">suits emergencies</text><text x="64" y="412" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">or unskilled staff</text><text x="44" y="500" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">−</text><text x="64" y="500" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Can demotivate</text><text x="64" y="521" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">skilled staff</text><rect x="243" y="165" width="198" height="420" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="243" y="165" width="198" height="56" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="342" y="201" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Paternalistic</text><text x="257" y="250" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Leader decides, but</text><text x="257" y="271" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">considers staff</text><text x="257" y="292" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">welfare and explains</text><text x="257" y="313" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">decisions</text><rect x="456" y="165" width="198" height="420" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="456" y="165" width="198" height="56" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="555" y="201" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Democratic</text><text x="470" y="250" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Staff take part in</text><text x="470" y="271" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">decisions</text><text x="470" y="370" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">+</text><text x="490" y="370" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Motivating; draws</text><text x="490" y="391" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">on expertise</text><text x="470" y="500" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">−</text><text x="490" y="500" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Slower</text><rect x="669" y="165" width="198" height="420" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="669" y="165" width="198" height="56" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="768" y="201" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Laissez-faire</text><text x="683" y="250" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Leader sets broad</text><text x="683" y="271" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">aims; staff decide</text><text x="683" y="370" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">+</text><text x="703" y="370" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Suits highly</text><text x="703" y="391" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">skilled,</text><text x="703" y="412" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">self-motivated</text><text x="703" y="433" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">teams</text><text x="683" y="500" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">−</text><text x="703" y="500" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Risks drift</text><rect x="30" y="605" width="840" height="120" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="641" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">From entrepreneur to leader</text><text x="56" y="671" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A founder who checks every decision creates bottlenecks, and skilled staff leave if given</text><text x="56" y="694" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">no authority: the founder must learn to delegate.</text>
</svg>