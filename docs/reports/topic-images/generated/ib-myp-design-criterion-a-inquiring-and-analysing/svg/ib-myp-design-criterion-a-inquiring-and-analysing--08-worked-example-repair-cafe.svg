xt x="460" y="426" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">minutes</text><circle cx="354.2857142857143" cy="352" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="512.8571428571429" cy="352" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="195.71428571428572" cy="352" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="671.4285714285714" cy="352" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="407.14285714285717" cy="352" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="565.7142857142858" cy="352" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="301.42857142857144" cy="352" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="724.2857142857143" cy="352" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="460" cy="352" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><circle cx="407.14285714285717" cy="322" r="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><line x1="460" y1="260" x2="460" y2="370" stroke="#b5602e" stroke-width="3" stroke-dasharray="8 6"/><text x="460" y="252" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">mean 45 min</text><path d="M195.71428571428572,195 L195.71428571428572,205 L724.2857142857143,205 L724.2857142857143,195" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="460" y="190" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">range 50 min (20 to 70)</text><rect x="30" y="490" width="270" height="160" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="535" font-size="28" font-weight="700" fill="#b5602e" text-anchor="start">7 of 28</text><text x="50" y="568" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">items (25%) went home</text><text x="50" y="590" font-size="16" font-weight="400" fill="#1e2a44" text-anchor=