<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 725" width="900" height="725" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="725" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Analysing existing products</text>

<rect x="230" y="110" width="195" height="50" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><text x="327.5" y="140.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Does well</text><rect x="440" y="110" width="205" height="50" rx="10" fill="#f4d9c8" stroke="#1e2a44" stroke-width="2.2"/><text x="542.5" y="140.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Does badly for this client</text><rect x="660" y="110" width="195" height="50" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.2"/><text x="757.5" y="140.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Idea to adapt</text><rect x="30" y="175" width="840" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="232" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Mesh ball bag</text><text x="327.5" y="233" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">light and cheap</text><text x="542.5" y="233" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">holds nothing else</text><text x="757.5" y="222" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle">ventilation for</text><text x="757.5" y="244" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle">wet balls</text><rect x="30" y="287" width="840" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="344" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Folding cart</text><text x="327.5" y="334" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">carries the</text><text x="327.5" y="356" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">whole load</text><text x="542.5" y="334" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">small wheels stick</text><text x="542.5" y="356" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">on grass</text><text x="757.5" y="334" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle">single-trip</text><text x="757.5" y="356" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle">capacity</text><rect x="30" y="399" width="840" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="456" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Large holdall</text><text x="327.5" y="457" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">keeps bibs dry</text><text x="542.5" y="457" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">awkward at 9.6 kg</text><text x="757.5" y="457" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle">—</text><line x1="450" y1="515" x2="450" y2="540" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="545" width="840" height="120" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="582" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Conclusion</text><text x="55" y="612" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Adapt the cart’s single-trip capacity and the mesh bag’s ventilation;</text><text x="55" y="636" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">avoid small wheels on grass.</text><text x="450" y="700" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle">Three products analysed in depth beat ten listed with a photo each.</text>
</svg>