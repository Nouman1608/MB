<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="690" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: evidence for the kit carrier</text>

<rect x="30" y="110" width="480" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Set-up time, three sessions</text><line x1="90" y1="470" x2="480" y2="470" stroke="#1e2a44" stroke-width="2.5"/><line x1="90" y1="470" x2="90" y2="170" stroke="#1e2a44" stroke-width="2.5"/><text x="80" y="476" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">0</text><line x1="86" y1="470" x2="90" y2="470" stroke="#1e2a44" stroke-width="2"/><text x="80" y="376" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">5</text><line x1="86" y1="370" x2="90" y2="370" stroke="#1e2a44" stroke-width="2"/><text x="80" y="276" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">10</text><line x1="86" y1="270" x2="90" y2="270" stroke="#1e2a44" stroke-width="2"/><text x="80" y="176" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">15</text><line x1="86" y1="170" x2="90" y2="170" stroke="#1e2a44" stroke-width="2"/><text transform="translate(52 330) rotate(-90)" font-size="15" fill="#4a5568" text-anchor="middle">minutes</text><rect x="130" y="230" width="80" height="240" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="170" y="220" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">12 min</text><text x="170" y="494" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">session 1</text><text x="170" y="454" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">3 trips</text><rect x="245" y="270" width="80" height="200" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="285" y="260" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">10 min</text><text x="285" y="494" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">session 2</text><text x="285" y="454" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">3 trips</text><rect x="360" y="190" width="80" height="280" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="400" y="180" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">14 min</text><text x="400" y="494" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">session 3</text><text x="400" y="454" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">4 trips</text><line x1="100" y1="230" x2="480" y2="230" stroke="#b5602e" stroke-width="3" stroke-dasharray="9 6"/><line x1="340" y1="141" x2="380" y2="141" stroke="#b5602e" stroke-width="3" stroke-dasharray="9 6"/><text x="388" y="147" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">mean 12 min</text><rect x="530" y="110" width="340" height="93" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="550" y="152" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="start">150 m</text><text x="675" y="148" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">walk to the pitch</text><text x="550" y="184" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">measured with a trundle wheel</text><rect x="530" y="215" width="340" height="93" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="550" y="257" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="start">9.6 kg</text><text x="675" y="253" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">full kit</text><text x="550" y="289" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">weighed on bathroom scales</text><rect x="530" y="320" width="340" height="93" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="550" y="362" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="start">9 of 12</text><text x="675" y="358" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">coaches (75%)</text><text x="550" y="394" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">make more than one trip</text><rect x="530" y="425" width="340" height="93" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="550" y="467" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="start">8 of 12</text><text x="675" y="463" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">coaches (67%)</text><text x="550" y="499" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">would use a single carrier</text><rect x="30" y="550" width="840" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="586" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Justification</text><text x="55" y="614" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Coach Daniel loses a mean of 12 minutes of each session because he cannot carry</text><text x="55" y="636" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">9.6 kg of mixed kit 150 m in one trip, and 75% of coaches surveyed share the problem.</text>
</svg>