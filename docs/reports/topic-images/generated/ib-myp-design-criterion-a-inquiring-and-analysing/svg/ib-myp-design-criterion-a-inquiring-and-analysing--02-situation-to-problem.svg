<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="680" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From design situation to one problem</text>

<rect x="60" y="110" width="780" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="80" y="143" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Design situation</text><text x="80" y="172" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Volunteers at a community event struggle to organise equipment.”</text><path d="M60,200 L840,200 L560,300 L340,300 Z" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="450" y="238" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">narrow it down</text><text x="450" y="266" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">not yet a problem you can solve</text><rect x="300" y="310" width="300" height="60" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="347" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">ONE problem</text><line x1="390" y1="372" x2="250" y2="410" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="510" y1="372" x2="650" y2="410" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="415" width="410" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="452" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Client</text><text x="55" y="482" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a specific person or organisation</text><text x="55" y="504" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">you design for and can talk to</text><text x="55" y="545" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">e.g. a named coach,</text><text x="55" y="568" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">a club organiser</text><rect x="460" y="415" width="410" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="485" y="452" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Target audience</text><text x="485" y="482" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the wider group who will use</text><text x="485" y="504" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the solution</text><text x="485" y="545" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">e.g. all volunteer coaches in a</text><text x="485" y="568" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">league, all visitors to an event</text><text x="450" y="650" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle">You can have both. Name them precisely: “everyone” gives you nobody to research.</text>
</svg>