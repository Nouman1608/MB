<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="560" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The design brief sets direction</text>

<rect x="30" y="110" width="500" height="420" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="55" y="150" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">Design brief (Criterion A)</text><text x="55" y="178" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">short: one paragraph or a few headings</text><circle cx="66" cy="214" r="6" fill="#2e6b62"/><text x="84" y="220" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the client or target audience</text><circle cx="66" cy="254" r="6" fill="#2e6b62"/><text x="84" y="260" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the problem and the evidence for the need</text><circle cx="66" cy="294" r="6" fill="#2e6b62"/><text x="84" y="300" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">key findings from research and analysis</text><circle cx="66" cy="334" r="6" fill="#2e6b62"/><text x="84" y="340" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the design goal: a product, a digital</text><text x="84" y="364" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">solution or both</text><circle cx="66" cy="398" r="6" fill="#2e6b62"/><text x="84" y="404" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">known limits, e.g. budget, where it is used</text><rect x="55" y="432" width="450" height="76" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="280" y="463" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">States WHAT is needed</text><text x="280" y="491" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">and WHY</text><line x1="535" y1="310" x2="585" y2="310" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="590" y="110" width="280" height="420" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="612" y="150" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="start">Specification</text><text x="612" y="178" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(Criterion B)</text><text x="612" y="230" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="start">measurable</text><text x="612" y="258" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="start">requirements</text><text x="612" y="286" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="start">and tests</text><rect x="612" y="432" width="236" height="76" rx="10" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="730" y="463" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">keep these out</text><text x="730" y="487" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">of the brief</text>
</svg>