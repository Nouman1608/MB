<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" width="900" height="710" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="710" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Planning primary and secondary research</text>

<rect x="30" y="110" width="410" height="250" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="55" y="146" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Primary: first-hand</text><text x="55" y="178" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• interview the client</text><text x="55" y="209" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• survey the target audience</text><text x="55" y="240" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• observe the problem happen</text><text x="55" y="271" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• measure or weigh things</text><text x="55" y="302" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• test an existing product</text><rect x="460" y="110" width="410" height="250" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="485" y="146" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Secondary: already published</text><text x="485" y="178" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• books and articles</text><text x="485" y="209" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• product reviews</text><text x="485" y="240" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• published data and measurements</text><text x="485" y="271" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• safety or accessibility guidance</text><text x="485" y="302" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• public pages of websites and apps</text><text x="450" y="400" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">A research plan is a table, in priority order</text><rect x="30" y="420" width="195" height="52" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="127.5" y="451.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Research question</text><line x1="226" y1="446" x2="242" y2="446" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="245" y="420" width="195" height="52" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><text x="342.5" y="451.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Primary or secondary</text><line x1="441" y1="446" x2="457" y2="446" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="460" y="420" width="195" height="52" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><text x="557.5" y="451.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Method or source</text><line x1="656" y1="446" x2="672" y2="446" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="675" y="420" width="195" height="52" rx="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.2"/><text x="772.5" y="451.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">What it will decide</text><rect x="30" y="488" width="840" height="58" rx="10" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="50" y="524" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">What must the client carry?</text><text x="540" y="524" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">decides size and structure</text><rect x="795" y="501" width="62" height="32" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="826" y="522.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">first</text><rect x="30" y="558" width="840" height="58" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="50" y="594" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">What colours does the client like?</text><text x="540" y="594" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">matters less</text><rect x="795" y="571" width="62" height="32" rx="10" fill="#e6e8ea" stroke="#1e2a44" stroke-width="2.2"/><text x="826" y="592.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">later</text><text x="450" y="650" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle">Write the questions first, then choose a method for each.</text><text x="450" y="678" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Judge secondary sources: who wrote it, when, are they selling something?</text>
</svg>