<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="720" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Explaining and justifying the need</text>

<text x="60" y="130" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A strong justification covers:</text><rect x="60" y="150" width="780" height="62" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><circle cx="98" cy="181" r="19" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="98" y="187.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="135" y="188" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Who</text><text x="340" y="188" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">has the problem, described precisely</text><rect x="60" y="224" width="780" height="62" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><circle cx="98" cy="255" r="19" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="98" y="261.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="135" y="262" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">What, when, where</text><text x="340" y="262" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the problem and when and where it happens</text><rect x="60" y="298" width="780" height="62" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><circle cx="98" cy="329" r="19" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="98" y="335.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="135" y="336" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evidence</text><text x="340" y="336" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">observation, measurements, survey results, interviews</text><rect x="60" y="372" width="780" height="62" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><circle cx="98" cy="403" r="19" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="98" y="409.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="135" y="410" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Consequences</text><text x="340" y="410" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">time lost, injury risk, people excluded, money wasted</text><rect x="60" y="446" width="780" height="62" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><circle cx="98" cy="477" r="19" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="98" y="483.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="135" y="484" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Gap</text><text x="340" y="484" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">why existing solutions do not already solve it</text><text x="60" y="560" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Evidence turns an opinion into a justification. Give the sample size:</text><rect x="30" y="580" width="410" height="110" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="52" y="616" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Bare percentage</text><text x="52" y="646" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“75% of coaches”</text><rect x="460" y="580" width="410" height="110" rx="14" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="482" y="616" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">✓ With sample size</text><text x="482" y="646" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“9 of the 12 coaches surveyed (75%)”</text>
</svg>