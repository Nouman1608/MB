<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Section A at a glance</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Five sources, four questions, 30 marks</text>
<text x="30" y="140" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">THE FIVE SOURCES</text><rect x="30" y="154" width="154" height="96" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="107" y="194" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Source A</text><text x="107" y="222" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">pre-released</text><rect x="202" y="154" width="154" height="96" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="279" y="194" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Source B</text><text x="279" y="222" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">pre-released</text><rect x="374" y="154" width="154" height="96" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="451" y="194" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Source C</text><text x="451" y="222" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">pre-released</text><rect x="546" y="154" width="154" height="96" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="623" y="194" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Source D</text><text x="623" y="222" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle">unseen</text><rect x="718" y="154" width="154" height="96" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="795" y="194" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Source E</text><text x="795" y="222" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle">unseen</text><text x="30" y="280" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Three in an advance booklet (1 February for May/June; 1 July for October/November); two appear only in the</text><text x="30" y="301" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">exam. <tspan font-weight="700">No</tspan> <tspan font-weight="700">notes</tspan> <tspan font-weight="700">or</tspan> <tspan font-weight="700">annotations</tspan> may be taken in.</text><text x="30" y="346" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">MARKS PER QUESTION (bar widths to scale)</text><rect x="30" y="356" width="112" height="76" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="86" y="401" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Q1 · 4</text><rect x="142" y="356" width="168" height="76" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="226" y="401" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Q2 · 6</text><rect x="310" y="356" width="224" height="76" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="422" y="401" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Q3 · 8</text><rect x="534" y="356" width="336" height="76" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="702" y="401" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Q4 · 12</text><rect x="30" y="454" width="412" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="488.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">About 50 minutes</text><text x="50" y="516.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">for Section A: roughly a minute a mark</text><rect x="458" y="454" width="412" height="87" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="478" y="488.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Question 4</text><text x="478" y="516.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">leave a full fifteen to eighteen minutes</text>
</svg>