<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 995" width="900" height="995" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="995" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The League's record, 1920-1937</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Disputes and membership changes in order</text>
<line x1="110" y1="132" x2="110" y2="903" stroke="#1e2a44" stroke-width="4"/><rect x="150" y="124" width="720" height="69" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="163" y="151.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Vilna: failure</text><text x="163" y="175.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Poland kept it</text><circle cx="110" cy="158.5" r="10" fill="#b5602e" stroke="#1e2a44" stroke-width="3"/><text x="90" y="164.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1920</text><rect x="150" y="203" width="720" height="69" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="163" y="230.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Aaland Islands and Upper Silesia: settled</text><text x="163" y="254.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Aaland to Finland; Upper Silesia divided after a plebiscite</text><circle cx="110" cy="237.5" r="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="90" y="243.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1921</text><rect x="150" y="282" width="720" height="69" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="163" y="309.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Corfu: bypassed</text><text x="163" y="333.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Mussolini occupied it; the Conference of Ambassadors made Greece pay</text><circle cx="110" cy="316.5" r="10" fill="#b5602e" stroke="#1e2a44" stroke-width="3"/><text x="90" y="322.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1923</text><rect x="150" y="361" width="720" height="69" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="163" y="388.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Bulgaria: settled</text><text x="163" y="412.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Greece made to withdraw its invading troops</text><circle cx="110" cy="395.5" r="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="90" y="401.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1925</text><rect x="150" y="440" width="720" height="69" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="163" y="467.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Outside the League: Locarno (1925) and the Kellogg-Briand Pact (1928)</text><text x="163" y="491.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Kellogg-Briand renounced war but had no means of enforcement</text><circle cx="110" cy="474.5" r="6" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="150" y="519" width="720" height="45" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="163" y="546.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Germany joins</text><circle cx="110" cy="541.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="90" y="547.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1926</text><rect x="150" y="574" width="720" height="69" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="163" y="601.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Manchuria: Japan invades</text><text x="163" y="625.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The Lytton Report condemned Japan</text><circle cx="110" cy="608.5" r="10" fill="#b5602e" stroke="#1e2a44" stroke-width="3"/><text x="90" y="614.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1931</text><rect x="150" y="653" width="720" height="69" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="163" y="680.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Germany and Japan leave</text><text x="163" y="704.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Germany walks out of the Disarmament Conference (1932-34)</text><circle cx="110" cy="687.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="90" y="693.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1933</text><rect x="150" y="732" width="720" height="45" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="163" y="759.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">USSR joins</text><circle cx="110" cy="754.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="90" y="760.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1934</text><rect x="150" y="787" width="720" height="69" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="163" y="814.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Abyssinia: Italy invades</text><text x="163" y="838.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Sanctions without oil; the secret Hoare-Laval Pact</text><circle cx="110" cy="821.5" r="10" fill="#b5602e" stroke="#1e2a44" stroke-width="3"/><text x="90" y="827.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1935</text><rect x="150" y="866" width="720" height="45" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="163" y="893.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Italy leaves</text><circle cx="110" cy="888.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="90" y="894.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1937</text><rect x="221.328" y="933" width="78.16" height="30" rx="15" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="260.408" y="953.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">settled</text><rect x="309.488" y="933" width="174.88" height="30" rx="15" fill="#f6e3d8" stroke="#1e2a44" stroke-width="2"/><text x="396.928" y="953.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">failure or bypassed</text><rect x="494.368" y="933" width="184.304" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="586.52" y="953.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">membership change</text>
</svg>