<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 552" width="900" height="552" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="552" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A method for each question</text>

<rect x="30" y="100" width="176" height="96" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="118" y="136" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Q1 · 4 marks</text><text x="118" y="162" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Support a claim</text><rect x="220" y="100" width="650" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="234" y="127.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="249.2" y="127.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Detail from the source that supports it</text><text x="234" y="152.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="249.2" y="152.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">+ one precise piece of contextual knowledge</text><text x="234" y="177.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="249.2" y="177.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Provenance can help</text><rect x="30" y="208" width="176" height="96" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="118" y="244" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Q2 · 6 marks</text><text x="118" y="270" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Explain a difference</text><rect x="220" y="208" width="650" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="234" y="235.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="249.2" y="235.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">State the difference in one sentence</text><text x="234" y="260.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="249.2" y="260.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Show it with content from both sources</text><text x="234" y="285.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="249.2" y="285.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Explain why: dates, authors, audiences, purposes</text><rect x="30" y="316" width="176" height="96" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="118" y="352" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Q3 · 8 marks</text><text x="118" y="378" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">How useful</text><rect x="220" y="316" width="650" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="234" y="343.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="249.2" y="343.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">What the content shows, confirmed by knowledge</text><text x="234" y="368.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="249.2" y="368.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">How the provenance makes it useful</text><text x="234" y="393.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="249.2" y="393.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Limitations are not required</text><rect x="30" y="424" width="176" height="96" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="118" y="460" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Q4 · 12 marks</text><text x="118" y="486" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Range of sources</text><rect x="220" y="424" width="650" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="234" y="451.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="249.2" y="451.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Plan both sides</text><text x="234" y="476.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="249.2" y="476.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Use and link several sources, unseen and pre-released</text><text x="234" y="501.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="249.2" y="501.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Own knowledge, then a supported judgement</text>
</svg>