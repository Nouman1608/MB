<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Peacemaking, 1919-23</text>

<rect x="30" y="100" width="270.6666666666667" height="133" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CLEMENCEAU</text><text x="50" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Security</text><text x="50" y="187.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Weaken Germany</text><rect x="314.6666666666667" y="100" width="270.6666666666667" height="133" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="334.6666666666667" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LLOYD GEORGE</text><text x="334.6666666666667" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Punish, but allow trade</text><text x="334.6666666666667" y="187.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Punish Germany but let trade</text><text x="334.6666666666667" y="208.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">recover</text><rect x="599.3333333333334" y="100" width="270.6666666666667" height="133" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="619.3333333333334" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WILSON</text><text x="619.3333333333334" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Fourteen Points</text><text x="619.3333333333334" y="187.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Self-determination and a</text><text x="619.3333333333334" y="208.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">League of Nations</text><rect x="30" y="255" width="840" height="88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="289.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Versailles: a "Diktat"</text><text x="50" y="318.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Germany was not allowed to negotiate. Terms: war guilt, reparations, military limits, territorial losses.</text><text x="30" y="379" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">THE WIDER SETTLEMENT</text><rect x="30" y="391" width="201" height="158" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="417" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1919</text><text x="44" y="443.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Saint-Germain</text><text x="44" y="471" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Austria: union with</text><text x="44" y="491" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Germany forbidden</text><rect x="243" y="391" width="201" height="158" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="257" y="417" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1919</text><text x="257" y="443.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Neuilly</text><text x="257" y="471" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Bulgaria</text><rect x="456" y="391" width="201" height="158" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="470" y="417" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1920</text><text x="470" y="443.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Trianon</text><text x="470" y="471" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Hungary</text><rect x="669" y="391" width="201" height="158" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="683" y="417" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1920</text><text x="683" y="443.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sèvres</text><text x="683" y="471" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Ottoman Empire:</text><text x="683" y="491" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">rejected by Turkish</text><text x="683" y="511" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">nationalists under</text><text x="683" y="531" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Mustafa Kemal</text><line x1="769.5" y1="555" x2="769.5" y2="583" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="519" y="589" width="351" height="98" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="533" y="615" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1923</text><text x="533" y="641.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Treaty of Lausanne</text><text x="533" y="669" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">replaced Sèvres</text>
</svg>