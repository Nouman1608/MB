<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 465" width="900" height="465" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="465" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Building a Question 3 answer</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">How useful is a source to a historian studying a given issue?</text>
<rect x="30" y="124" width="253.33333333333334" height="176" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1 · CONTENT</text><text x="50" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">What it shows about the</text><text x="50" y="205.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">issue</text><text x="50" y="233.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">e.g. a dispute passed to the</text><text x="50" y="254.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Conference of</text><text x="50" y="275.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Ambassadors</text><line x1="289.33333333333337" y1="212" x2="317.33333333333337" y2="212" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="124" width="253.33333333333334" height="176" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="343.33333333333337" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">2 · KNOWLEDGE</text><text x="343.33333333333337" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Confirm with your own</text><text x="343.33333333333337" y="205.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">knowledge</text><text x="343.33333333333337" y="233.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">e.g. Corfu, 1923: Greece</text><text x="343.33333333333337" y="254.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">made to pay</text><line x1="582.6666666666667" y1="212" x2="610.6666666666667" y2="212" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="124" width="253.33333333333334" height="176" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="636.6666666666667" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">3 · PROVENANCE</text><text x="636.6666666666667" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Why its origin adds</text><text x="636.6666666666667" y="205.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">value</text><text x="636.6666666666667" y="233.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">e.g. written at the time,</text><text x="636.6666666666667" y="254.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">close to the League's</text><text x="636.6666666666667" y="275.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">meetings</text><rect x="30" y="322" width="412" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="354" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DO</text><text x="50" y="380.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Stay on what the source can show</text><text x="50" y="408.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Limitations are not required for Question 3</text><rect x="458" y="322" width="412" height="111" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="478" y="354" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">DON'T</text><text x="478" y="380.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Judge by type alone</text><text x="478" y="408.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">"It is a cartoon, so it is biased" earns little</text>
</svg>