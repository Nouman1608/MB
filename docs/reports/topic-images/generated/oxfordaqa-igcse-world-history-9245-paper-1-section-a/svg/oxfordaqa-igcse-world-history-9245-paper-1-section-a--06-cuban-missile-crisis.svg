<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 545" width="900" height="545" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="545" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Cuba: from revolution to the hotline</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">1959-1963</text>
<line x1="140" y1="132" x2="140" y2="505" stroke="#1e2a44" stroke-width="4"/><rect x="180" y="124" width="690" height="45" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="193" y="151.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Castro takes power</text><circle cx="140" cy="146.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="152.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1959</text><rect x="180" y="179" width="690" height="69" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="193" y="206.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Bay of Pigs</text><text x="193" y="230.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">CIA-backed invasion fails</text><circle cx="140" cy="213.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="219.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Apr 1961</text><rect x="180" y="258" width="690" height="45" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="193" y="285.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">U2 photographs reveal Soviet missile sites</text><circle cx="140" cy="280.5" r="10" fill="#b5602e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="286.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Oct 1962</text><rect x="180" y="313" width="690" height="45" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="193" y="340.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Kennedy announces a naval "quarantine"</text><circle cx="140" cy="335.5" r="6" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="180" y="368" width="690" height="90" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="193" y="395.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">After thirteen days: a deal</text><text x="193" y="419.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Khrushchev removes the missiles; the USA pledges not to invade Cuba and secretly</text><text x="193" y="440.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">agrees to remove its missiles from Turkey</text><circle cx="140" cy="413" r="6" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="180" y="468" width="690" height="45" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="193" y="495.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Hotline; Partial Test Ban Treaty</text><circle cx="140" cy="490.5" r="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="120" y="496.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1963</text>
</svg>