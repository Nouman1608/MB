<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 737" width="900" height="737" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="737" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Vietnam: escalation and withdrawal</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Domino Theory: if one state fell to communism, its neighbours would follow</text>
<line x1="140" y1="132" x2="140" y2="697" stroke="#1e2a44" stroke-width="4"/><rect x="180" y="124" width="690" height="45" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="193" y="151.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">More US advisers; Strategic Hamlets</text><circle cx="140" cy="146.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="152.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Kennedy</text><rect x="180" y="179" width="690" height="69" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="193" y="206.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Gulf of Tonkin incident</text><text x="193" y="230.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Congress gives Johnson wide powers</text><circle cx="140" cy="213.5" r="10" fill="#b5602e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="219.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1964</text><rect x="180" y="258" width="690" height="69" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="193" y="285.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Operation Rolling Thunder; ground troops</text><text x="193" y="309.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Search and destroy, napalm and Agent Orange against Viet Cong guerrilla tactics</text><circle cx="140" cy="292.5" r="10" fill="#b5602e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="298.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1965</text><rect x="180" y="337" width="690" height="69" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="193" y="364.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Tet Offensive; news of My Lai</text><text x="193" y="388.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">More Americans turn against the war</text><circle cx="140" cy="371.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="377.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1968</text><rect x="180" y="416" width="690" height="69" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="193" y="443.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Vietnamisation</text><text x="193" y="467.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Fighting handed to South Vietnamese forces; war widened into Cambodia and Laos</text><circle cx="140" cy="450.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="456.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Nixon</text><rect x="180" y="495" width="690" height="45" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="193" y="522.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Kent State University: four students killed</text><circle cx="140" cy="517.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="523.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1970</text><rect x="180" y="550" width="690" height="45" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="193" y="577.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Nixon visits China</text><circle cx="140" cy="572.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="578.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1972</text><rect x="180" y="605" width="690" height="45" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="193" y="632.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Paris Peace Accords end direct US involvement</text><circle cx="140" cy="627.5" r="10" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="120" y="633.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1973</text><rect x="180" y="660" width="690" height="45" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="193" y="687.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Saigon falls</text><circle cx="140" cy="682.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="120" y="688.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Apr 1975</text>
</svg>