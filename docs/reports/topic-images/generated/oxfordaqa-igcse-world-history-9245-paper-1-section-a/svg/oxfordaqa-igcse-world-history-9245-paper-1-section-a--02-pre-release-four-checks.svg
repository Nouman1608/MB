<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 446" width="900" height="446" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="446" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Preparing each pre-released source</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">You cannot take notes in, so prepare to understand, not to memorise</text>
<rect x="30" y="124" width="412" height="137" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="167" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1</text><text x="50" y="195.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Provenance</text><text x="50" y="225.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Who produced it, when, for whom, and why</text><rect x="458" y="124" width="412" height="137" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="478" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">2</text><text x="478" y="184.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Content</text><text x="478" y="214.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">What it says or shows; the message of a</text><text x="478" y="236.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">cartoon or poster</text><rect x="30" y="277" width="412" height="137" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="309" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">3</text><text x="50" y="337.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Context</text><text x="50" y="367.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Which events in the specification it relates to;</text><text x="50" y="389.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">what was happening at that date</text><rect x="458" y="277" width="412" height="137" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="309" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">4</text><text x="478" y="337.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Links</text><text x="478" y="367.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Other topics it could be used for: questions</text><text x="478" y="389.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">may target either part of the option</text>
</svg>