<!-- place after: ## The so-what test -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/ap-english-language-4-2-conclusions-study-guide--01-so-what-test.webp" width="900" height="628" alt="Six questions a reader might ask at the end, each matched to a conclusion strategy: why it matters (significance), what to do (a call to act or solution), what follows (implications), how it relates to the start (return to the introduction), what to remember (a compelling image), and pull it together (a summary in new words)." loading="lazy">
  <figcaption>If a reader could still ask “So what?”, the conclusion has not done its job.</figcaption>
</figure>

<!-- place after: ## Common conclusion shapes -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/ap-english-language-4-2-conclusions-study-guide--02-conclusion-shapes.webp" width="900" height="601" alt="Five small diagrams of conclusion shapes: returning to the introduction (an arrow loops back to the opening), widening the lens (a cone from a point outward), narrowing to action (a funnel to an arrow), looking forward (a line continuing as a dashed arrow) and a closing image (a framed picture)." loading="lazy">
  <figcaption>Return, widen, narrow to action, look forward, or close on an image.</figcaption>
</figure>

<!-- place after: ## Weak and strong conclusions side by side -->
<figure class="topic-figure">
  <img src="https://img.marlbridge.com/ap-english-language-4-2-conclusions-study-guide--03-weak-vs-strong-conclusion.webp" width="900" height="651" alt="The weak conclusion (“In conclusion, there are many reasons... Thank you for reading”) sits above the strong one, split into four parts: a return to the bus driver image that reframes the cause, a brief concession of cost, the benefit drawn together, and a final link to the purpose of schooling." loading="lazy">
  <figcaption>The thesis is plainly present without being repeated word for word.</figcaption>
</figure>

<!-- place after: ## Worked example 2: describing the function of a published conclusion -->
