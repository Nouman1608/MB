<rect width="900" height="679" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four explanations for illusions</text>

<text x="30" y="116" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">AMBIGUITY · FICTION</text><rect x="30" y="130" width="270" height="175" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><g transform="translate(30,130)"><rect x="70" y="18" width="130" height="122" fill="#1e2a44"/><path d="M95,18 C95,40 125,48 125,62 C125,74 105,80 105,94 C105,110 120,116 120,140 L150,140 C150,116 165,110 165,94 C165,80 145,74 145,62 C145,48 175,40 175,18 Z" fill="#f2e7b8"/></g><text x="165" y="291" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Rubin's vase</text><rect x="315" y="130" width="270" height="175" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><g transform="translate(315,130)"><rect x="70" y="60" width="80" height="80" fill="none" stroke="#1e2a44" stroke-width="3"/><rect x="140" y="20" width="80" height="80" fill="none" stroke="#1e2a44" stroke-width="3"/><line x1="70" y1="60" x2="140" y2="20" stroke="#1e2a44" stroke-width="3"/><line x1="150" y1="60" x2="220" y2="20" stroke="#1e2a44" stroke-width="3"/><line x1="70" y1="140" x2="140" y2="100" stroke="#1e2a44" stroke-width="3"/><line x1="150" y1="140" x2="220" y2="100" stroke="#1e2a44" stroke-width="3"/></g><text x="450" y="291" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Necker cube</text><rect x="600" y="130" width="270" height="175" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><g transform="translate(600,130)"><path d="M135,36 L124,55.05255888325765 A22,22 0 1 1 146,55.05255888325765 Z" fill="#1e2a44"/><path d="M80,122 L101.9838056561211,122.84397208123127 A22,22 0 1 1 91.72280409049166,103.38345187055474 Z" fill="#1e2a44"/><path d="M190,122 L178.27719590950835,103.38345187055474 A22,22 0 1 1 168.0161943438789,122.84397208123126 Z" fill="#1e2a44"/></g><text x="735" y="291" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Kanizsa triangle</text><clipPath id="tc327"><rect x="30" y="327" width="840" height="320" rx="14"/></clipPath><g clip-path="url(#tc327)"><rect x="30" y="327" width="195.34883720930233" height="48" fill="#b5d3cf"/><text x="44" y="354.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Explanation</text><rect x="225.34883720930233" y="327" width="253.95348837209303" height="48" fill="#b5d3cf"/><text x="239.34883720930233" y="354.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Illusions</text><rect x="479.3023255813954" y="327" width="390.69767441860466" height="48" fill="#b5d3cf"/><text x="493.3023255813954" y="354.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">What the brain does</text><rect x="30" y="375" width="195.34883720930233" height="68" fill="#dce9e7"/><text x="44" y="401.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Ambiguity</text><rect x="225.34883720930233" y="375" width="253.95348837209303" height="68" fill="#ffffff"/><text x="239.34883720930233" y="401.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rubin's vase, Necker cube</text><rect x="479.3023255813954" y="375" width="390.69767441860466" height="68" fill="#ffffff"/><text x="493.3023255813954" y="401.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">One image supports two interpretations, so</text><text x="493.3023255813954" y="422.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">perception switches between them</text><line x1="30" y1="443" x2="870" y2="443" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="443" width="195.34883720930233" height="47" fill="#dce9e7"/><text x="44" y="469.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Fiction</text><rect x="225.34883720930233" y="443" width="253.95348837209303" height="47" fill="#f8faf9"/><text x="239.34883720930233" y="469.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Kanizsa triangle</text><rect x="479.3023255813954" y="443" width="390.69767441860466" height="47" fill="#f8faf9"/><text x="493.3023255813954" y="469.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fills in edges that are not drawn</text><line x1="30" y1="490" x2="870" y2="490" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="490" width="195.34883720930233" height="89" fill="#dce9e7"/><text x="44" y="516.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Misinterpreted depth</text><text x="44" y="537.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">cues + size</text><text x="44" y="558.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">constancy</text><rect x="225.34883720930233" y="490" width="253.95348837209303" height="89" fill="#ffffff"/><text x="239.34883720930233" y="516.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ponzo, Müller-Lyer</text><rect x="479.3023255813954" y="490" width="390.69767441860466" height="89" fill="#ffffff"/><text x="493.3023255813954" y="516.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Reads lines as depth, so the "further" line is</text><text x="493.3023255813954" y="537.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">scaled up and looks longer</text><line x1="30" y1="579" x2="870" y2="579" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="579" width="195.34883720930233" height="68" fill="#dce9e7"/><text x="44" y="605.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Misinterpreted depth</text><text x="44" y="626.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">cues</text><rect x="225.34883720930233" y="579" width="253.95348837209303" height="68" fill="#f8faf9"/><text x="239.34883720930233" y="605.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ames Room</text><rect x="479.3023255813954" y="579" width="390.69767441860466" height="68" fill="#f8faf9"/><text x="493.3023255813954" y="605.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Assumes the distorted room is rectangular, so</text><text x="493.3023255813954" y="626.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">people in the corners look very different in size</text></g><line x1="225.34883720930233" y1="327" x2="225.34883720930233" y2="647" stroke="#c9d6d4" stroke-width="1.5"/><line x1="479.3023255813954" y1="327" x2="479.3023255813954" y2="647" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="327" width="840" height="320" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>