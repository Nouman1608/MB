<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 692" width="900" height="692" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="692" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Depth cues</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">How the brain judges distance from a flat retinal image</text>
<text x="30" y="140" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MONOCULAR (ONE EYE IS ENOUGH)</text><rect x="30" y="150" width="200" height="220" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><g transform="translate(30,150)"><rect x="16" y="16" width="168" height="62" fill="#dce9e7"/><rect x="16" y="78" width="168" height="76" fill="#b5d3cf"/><path d="M56,92 L84,92 L79.1,98.3 L60.9,98.3 Z" fill="#b5602e"/><line x1="70" y1="92" x2="70" y2="79.4" stroke="#1e2a44" stroke-width="2"/><path d="M106,132 L154,132 L145.6,142.8 L114.4,142.8 Z" fill="#b5602e"/><line x1="130" y1="132" x2="130" y2="110.4" stroke="#1e2a44" stroke-width="2"/><text x="100" y="70" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">horizon</text></g><text x="130" y="354" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Height in plane</text><rect x="243.3" y="150" width="200" height="220" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><g transform="translate(243.3,150)"><rect x="23.6" y="90.4" width="72.8" height="22.4" rx="5.6" fill="#2b5a9a"/><circle cx="40.400000000000006" cy="114.2" r="8.399999999999999" fill="#1e2a44"/><circle cx="79.6" cy="114.2" r="8.399999999999999" fill="#1e2a44"/><rect x="129.4" y="61.6" width="31.2" height="9.6" rx="2.4" fill="#2b5a9a"/><circle cx="136.6" cy="71.8" r="3.5999999999999996" fill="#1e2a44"/><circle cx="153.4" cy="71.8" r="3.5999999999999996" fill="#1e2a44"/></g><text x="343.3" y="354" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Relative size</text><rect x="456.6" y="150" width="200" height="220" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><g transform="translate(456.6,150)"><rect x="90" y="30" width="70" height="120" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><circle cx="82" cy="62" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><rect x="58" y="80" width="48" height="74" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/></g><text x="556.6" y="354" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Occlusion</text><rect x="669.9000000000001" y="150" width="200" height="220" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><g transform="translate(669.9000000000001,150)"><path d="M40,154 L96,30 L104,30 L160,154" fill="none" stroke="#1e2a44" stroke-width="4"/><line x1="37.935483870967744" y1="150" x2="162.06451612903226" y2="150" stroke="#9c8f6e" stroke-width="4"/><line x1="52.45161290322581" y1="120" x2="147.5483870967742" y2="120" stroke="#9c8f6e" stroke-width="3.6"/><line x1="64.54838709677419" y1="95" x2="135.4516129032258" y2="95" stroke="#9c8f6e" stroke-width="3.2"/><line x1="74.70967741935483" y1="74" x2="125.29032258064517" y2="74" stroke="#9c8f6e" stroke-width="2.8"/><line x1="82.93548387096774" y1="57" x2="117.06451612903226" y2="57" stroke="#9c8f6e" stroke-width="2.4"/><line x1="89.2258064516129" y1="44" x2="110.7741935483871" y2="44" stroke="#9c8f6e" stroke-width="2"/></g><text x="769.9000000000001" y="354" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Linear perspective</text><text x="30" y="408" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">BINOCULAR (BOTH EYES)</text><rect x="30" y="420" width="411" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="454.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Retinal disparity</text><text x="50" y="483.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Each eye gets a slightly different view; the</text><text x="50" y="504.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">difference is larger for near objects.</text><rect x="459" y="420" width="411" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="454.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Convergence</text><text x="479" y="483.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The eyes turn inwards to focus on something</text><text x="479" y="504.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">close; the muscle strain signals "near".</text><rect x="30" y="551" width="840" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="585.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Size constancy</text><text x="50" y="614.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A friend walking away does not seem to shrink, although the retinal image does. Usually helpful, but one</text><text x="50" y="635.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reason illusions work.</text>
</svg>