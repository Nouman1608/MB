<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 765" width="900" height="765" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="765" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Motion parallax: Gibson's direct information</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Looking out of a train window</text>
<rect x="30" y="124" width="840" height="300" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><path d="M32,294 Q150,214 280,274 Q420,194 560,264 Q700,204 868,274 L868,354 L32,354 Z" fill="#6f9a52" opacity="0.55"/><rect x="32" y="354" width="836" height="68" fill="#d8e3c6"/><rect x="50" y="338" width="12" height="70" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.5"/><rect x="98" y="338" width="12" height="70" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.5"/><rect x="146" y="338" width="12" height="70" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.5"/><rect x="194" y="338" width="12" height="70" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.5"/><rect x="242" y="338" width="12" height="70" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.5"/><rect x="290" y="338" width="12" height="70" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.5"/><rect x="338" y="338" width="12" height="70" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.5"/><rect x="386" y="338" width="12" height="70" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.5"/><rect x="434" y="338" width="12" height="70" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.5"/><rect x="482" y="338" width="12" height="70" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.5"/><rect x="530" y="338" width="12" height="70" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.5"/><rect x="578" y="338" width="12" height="70" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.5"/><rect x="626" y="338" width="12" height="70" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.5"/><rect x="674" y="338" width="12" height="70" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.5"/><rect x="722" y="338" width="12" height="70" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.5"/><rect x="770" y="338" width="12" height="70" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.5"/><rect x="818" y="338" width="12" height="70" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.5"/><line x1="32" y1="356" x2="868" y2="356" stroke="#9c8f6e" stroke-width="6"/><line x1="620" y1="386" x2="280" y2="386" stroke="#b5602e" stroke-width="9" marker-end="url(#ahR)"/><text x="450" y="414" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><line x1="520" y1="234" x2="470" y2="234" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="560" y="142" width="290" height="58" rx="10" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="575" y="166" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Distant hills</text><text x="575" y="188" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">move slowly, seem to travel with you</text><rect x="30" y="446" width="840" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="478" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">NEAR FENCE</text><text x="50" y="504.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Flashes past quickly, in the opposite direction</text><text x="50" y="534.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The brain reads the difference in speed <tspan font-weight="700" fill="#1e2a44">directly</tspan> as distance: no inference from past experience</text><text x="50" y="556.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">needed.</text><rect x="30" y="603" width="413" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="645.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">+ STRENGTH</text><text x="50" y="677.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Explains fast, accurate perception in real, moving</text><text x="50" y="698.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">environments: catching a ball, landing a plane.</text><rect x="457" y="603" width="413" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="635" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">− WEAKNESS</text><text x="477" y="666.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cannot easily explain illusions. Reply: most</text><text x="477" y="687.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">illusions are flat, still drawings with much less</text><text x="477" y="708.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">information.</text>
</svg>