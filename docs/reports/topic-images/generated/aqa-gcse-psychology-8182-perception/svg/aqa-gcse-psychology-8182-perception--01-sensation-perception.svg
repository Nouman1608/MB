<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 539" width="900" height="539" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="539" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Sensation and perception</text>

<rect x="30" y="100" width="250" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><g transform="translate(155,220)"><rect x="-6" y="0" width="12" height="34" fill="#9c8f6e"/><path d="M0,-58 L30,4 L-30,4 Z" fill="#6f9a52" stroke="#1e2a44" stroke-width="2.5"/></g><text x="155" y="310" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">the world: 3D, upright</text><line x1="288" y1="215" x2="340" y2="215" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="348" y="100" width="220" height="230" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><path d="M380,150 Q458,130 536,150 L536,280 Q458,300 380,280 Z" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><g transform="translate(458,195) scale(1,-1)"><rect x="-6" y="0" width="12" height="34" fill="#9c8f6e"/><path d="M0,-58 L30,4 L-30,4 Z" fill="#6f9a52" stroke="#1e2a44" stroke-width="2.5"/></g><text x="458" y="314" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">retina: flat, upside down</text><line x1="576" y1="215" x2="628" y2="215" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="636" y="100" width="234" height="230" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><g transform="translate(753,220)"><rect x="-6" y="0" width="12" height="34" fill="#9c8f6e"/><path d="M0,-58 L30,4 L-30,4 Z" fill="#6f9a52" stroke="#1e2a44" stroke-width="2.5"/></g><text x="753" y="310" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle">what we see: 3D, upright</text><rect x="30" y="352" width="411" height="155" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="384" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SENSATION</text><text x="50" y="410.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Detection of physical energy by the sense</text><text x="50" y="433.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">organs</text><text x="50" y="461.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">light falling on the retina; sound waves reaching</text><text x="50" y="482.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the ear</text><rect x="459" y="352" width="411" height="155" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="394.5" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">PERCEPTION</text><text x="479" y="420.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The brain organises and interprets it so it</text><text x="479" y="443.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">has meaning</text><text x="479" y="472.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">adding what sensation alone does not contain</text>
</svg>