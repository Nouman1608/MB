<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 674" width="900" height="674" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="674" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Perceptual set: seeing what we expect</text>

<text x="30" y="116" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXPECTATION: BRUNER AND MINTURN</text><rect x="30" y="130" width="400" height="190" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="100" y="215" font-size="56" font-weight="700" fill="#4a5568" text-anchor="middle">A</text><text x="230" y="215" font-size="64" font-weight="700" fill="#b5602e" text-anchor="middle" font-family="Inter, sans-serif" letter-spacing="-6">I3</text><text x="360" y="215" font-size="56" font-weight="700" fill="#4a5568" text-anchor="middle">C</text><text x="230" y="260" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">shown among letters</text><text x="230" y="296" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">reported: B</text><rect x="470" y="130" width="400" height="190" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="540" y="215" font-size="56" font-weight="700" fill="#4a5568" text-anchor="middle">12</text><text x="670" y="215" font-size="64" font-weight="700" fill="#b5602e" text-anchor="middle" font-family="Inter, sans-serif" letter-spacing="-6">I3</text><text x="800" y="215" font-size="56" font-weight="700" fill="#4a5568" text-anchor="middle">14</text><text x="670" y="260" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">shown among numbers</text><text x="670" y="296" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">reported: 13</text><text x="450" y="355.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">The same ambiguous figure: <tspan font-weight="700">context</tspan> <tspan font-weight="700">created</tspan> <tspan font-weight="700">an</tspan> <tspan font-weight="700">expectation</tspan> that shaped what was perceived.</text><rect x="30" y="386" width="413" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="414" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MOTIVATION: GILCHRIST AND NESBERG</text><text x="46" y="445.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Participants who had gone without food longer</text><text x="46" y="466.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">judged food pictures <tspan font-weight="700" fill="#1e2a44">brighter</tspan>: hunger made food</text><text x="46" y="487.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">stand out.</text><rect x="457" y="386" width="413" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="473" y="414" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EMOTION</text><text x="473" y="445.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">An anxious person may be quicker to notice</text><text x="473" y="466.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">possible threats.</text><rect x="30" y="520" width="413" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="548" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CULTURE</text><text x="46" y="579.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">People raised in a "carpentered" environment</text><text x="46" y="600.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">may be more affected by the Müller-Lyer illusion:</text><text x="46" y="621.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">support for Gregory.</text><rect x="457" y="520" width="413" height="122" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="473" y="548" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">EVALUATION</text><text x="473" y="579.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Both studies used artificial tasks: easy to</text><text x="473" y="600.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">replicate, but low ecological validity.</text>
</svg>