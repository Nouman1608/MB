<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="720" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Gases → warming → climate change</text>

<rect x="30" y="110" width="470" height="450" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="32" y="470" width="466" height="88" rx="0" fill="#f2e7b8"/><line x1="32" y1="470" x2="498" y2="470" stroke="#1e2a44" stroke-width="3"/><text x="265" y="525" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Earth’s surface</text><rect x="32" y="230" width="466" height="84" rx="0" fill="#dce9e7"/><text x="100" y="254" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">greenhouse gases</text><circle cx="105" cy="292" r="7" fill="#b5602e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="140" cy="302" r="7" fill="#b5602e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="170" cy="280" r="7" fill="#b5602e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="215" cy="296" r="7" fill="#b5602e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="265" cy="284" r="7" fill="#b5602e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="310" cy="300" r="7" fill="#b5602e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="365" cy="286" r="7" fill="#b5602e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="395" cy="302" r="7" fill="#b5602e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="440" cy="290" r="7" fill="#b5602e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="480" cy="280" r="7" fill="#b5602e" stroke="#1e2a44" stroke-width="1.5"/><circle cx="62" cy="150" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="98" y="144" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">solar radiation</text><line x1="68" y1="176" x2="80" y2="462" stroke="#8a6d0d" stroke-width="5" marker-end="url(#ahO)"/><line x1="330" y1="466" x2="330" y2="300" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="352" y1="300" x2="352" y2="462" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><line x1="410" y1="466" x2="410" y2="300" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="432" y1="300" x2="432" y2="462" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><line x1="470" y1="466" x2="470" y2="160" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="458" y="150" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">some escapes</text><text x="315" y="360" font-size="16" font-weight="600" fill="#b5602e" text-anchor="end">radiation from the surface</text><text x="315" y="381" font-size="16" font-weight="600" fill="#b5602e" text-anchor="end">is absorbed and</text><text x="315" y="402" font-size="16" font-weight="600" fill="#b5602e" text-anchor="end">re-emitted back down</text><rect x="520" y="110" width="350" height="130" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="538" y="142.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Higher concentrations of</text><text x="538" y="166.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">greenhouse gases</text><text x="538" y="198.82" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">more radiation absorbed and</text><text x="538" y="219.82" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">re-emitted</text><line x1="695" y1="244" x2="695" y2="298.5" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="520" y="304.5" width="350" height="85" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="538" y="337.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Global warming</text><text x="538" y="369.32" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">average temperatures rise</text><line x1="695" y1="393.5" x2="695" y2="448" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="520" y="454" width="350" height="106" rx="12" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><text x="538" y="486.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Climate change</text><text x="538" y="518.8199999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">long-term changes in temperature,</text><text x="538" y="539.8199999999999" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rainfall, wind and extreme weather</text><rect x="30" y="580" width="840" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="612.04" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">A greenhouse gas absorbs radiation and emits the energy as thermal (heat) energy.</text><rect x="54" y="645" width="189.6" height="30" rx="15" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><text x="148.8" y="665.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">carbon dioxide CO₂</text><rect x="290" y="645" width="171.2" height="30" rx="15" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="375.6" y="665.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">water vapour H₂O</text><rect x="510" y="645" width="125.19999999999999" height="30" rx="15" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="572.6" y="665.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">methane CH₄</text><text x="488" y="548" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Not to scale</text>
</svg>