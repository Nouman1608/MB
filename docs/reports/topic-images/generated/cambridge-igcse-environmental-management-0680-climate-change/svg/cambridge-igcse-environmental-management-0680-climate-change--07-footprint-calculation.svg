y2="130" stroke="#1e2a44" stroke-width="2"/><text x="128" y="136" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">3,000</text><path d="M140,130 L140,530 L500,530" fill="none" stroke="#1e2a44" stroke-width="2.5"/><text x="0" y="0" transform="translate(78,330) rotate(-90)" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">CO₂ from travel (kg per year)</text><rect x="170" y="170" width="120" height="360" rx="0" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><text x="230" y="356" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">car 2,700</text><rect x="350" y="314" width="120" height="216" rx="0" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><text x="410" y="428" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">car 1,620</text><rect x="350" y="274" width="120" height="40" rx="0" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="410" y="300" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">bus 300</text><text x="230" y="562" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Before</text><text x="410" y="562" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">After</text><text x="230" y="158" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2,700 kg</text><text x="410" y="262" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1,920 kg</text><line x1="290" y1="170" x2="510" y2="170" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="8 6"/><line x1="510" y1="170" x2="510" y2="270" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><text x="522" y="210.66666666666669" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">saving</text><text x="522" y="232.66666666666669" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">780 kg</text><rect x="610" y="130" width="260" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="630" y="164" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Working (kg)</text><text x="630" y="204" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Car before</text><text x="630" y="226" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">15,000 × 0.18 = 2,700</text><text x="630" y="258" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Switched</text><text x="630" y="280" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">15,000 × 40 ÷ 100 = 6,000 km</text><text x="630" y="312" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Car after</text><text x="630" y="334" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">9,000 × 0.18 = 1,620</text><text x="630" y="366" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Bus</text><text x="630" y="388" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">6,000 × 0.05 = 300</text><text x="630" y="420" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">New total</text><text x="630" y="442" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1,620 + 300 = 1,920</text><text x="630" y="474" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">Saving</text><text x="630" y="496" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">780 ÷ 2,700 × 100 = 28.9%</text><text x="450" y="590" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Invented practice figures: 40% of 15,000 km switched from car (0.18 kg/km) to bus (0.05 kg/km).</text>
</svg>