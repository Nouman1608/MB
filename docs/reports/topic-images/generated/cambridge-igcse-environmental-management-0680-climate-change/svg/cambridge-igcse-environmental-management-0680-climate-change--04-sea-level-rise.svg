<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 705" width="900" height="705" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="705" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why sea level rises</text>

<rect x="30" y="110" width="840" height="460" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="290" y="352" width="578" height="178" rx="0" fill="#b5d3cf"/><line x1="290" y1="380" x2="868" y2="380" stroke="#2e6b62" stroke-width="2.5" stroke-dasharray="10 7"/><line x1="290" y1="352" x2="868" y2="352" stroke="#2b5a9a" stroke-width="3.5"/><path d="M32,236 L250,236 L350,530 L32,530 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><path d="M40,236 Q140,136 248,236 Z" fill="#ffffff" stroke="#2b5a9a" stroke-width="3" stroke-linejoin="round"/><text x="60" y="166" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">land ice: ice sheets and glaciers</text><text x="140" y="420" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">land</text><path d="M244,232 Q310,236 330,340" fill="none" stroke="#2b5a9a" stroke-width="4.5" marker-end="url(#ah)"/><text x="860" y="404" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="end">sea level before</text><text x="860" y="342" font-size="15" font-weight="700" fill="#2b5a9a" text-anchor="end">sea level after</text><path d="M560,352 L680,352 L668,372 L572,372 Z" fill="#ffffff" stroke="#2b5a9a" stroke-width="3"/><path d="M580,352 L660,352 L655,340 L588,340 Z" fill="#ffffff" stroke="#2b5a9a" stroke-width="3"/><text x="620" y="324" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">floating sea ice</text><text x="380" y="450" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">1  Meltwater from land ice</text><text x="404" y="472" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">adds water to the ocean</text><text x="650" y="450" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">2  Warmer water expands</text><line x1="735" y1="488" x2="680" y2="488" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><line x1="755" y1="488" x2="810" y2="488" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><text x="858" y="556" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Not to scale</text><rect x="30" y="590" width="840" height="85" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="622.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Melting floating sea ice does not significantly raise sea level</text><text x="48" y="653.04" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">When explaining sea-level rise, name the land ice: ice sheets and glaciers.</text>
</svg>