<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 618" width="900" height="618" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="618" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Tackle the cause or cope with the effects</text>

<rect x="30" y="250" width="186" height="80" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="123" y="294.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Emissions</text><line x1="219" y1="290" x2="244" y2="290" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="248" y="250" width="186" height="80" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="341" y="271.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">More</text><text x="341" y="294.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">greenhouse</text><text x="341" y="317.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">gases</text><line x1="437" y1="290" x2="462" y2="290" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="466" y="250" width="186" height="80" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="559" y="294.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Global warming</text><line x1="655" y1="290" x2="680" y2="290" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="684" y="250" width="186" height="80" rx="12" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><text x="777" y="283.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Climate change</text><text x="777" y="306.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">impacts</text><rect x="30" y="110" width="400" height="90" rx="12" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="230" y="144.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Reducing carbon footprints</text><text x="230" y="176.82" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">tackles the cause</text><line x1="123" y1="202" x2="123" y2="244" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><rect x="470" y="110" width="400" height="90" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="670" y="144.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Adaptation</text><text x="670" y="176.82" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">copes with the effects</text><line x1="777" y1="202" x2="777" y2="244" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><text x="450" y="380" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Adaptation: altering behaviour, practices and infrastructure to adapt to the impacts</text><rect x="30" y="405" width="201" height="183" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="44" y="433.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Resistant crops</text><text x="44" y="464.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">varieties that</text><text x="44" y="485.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">tolerate warmer,</text><text x="44" y="506.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">drier or wetter</text><text x="44" y="527.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">conditions, such as</text><text x="44" y="548.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">drought- or</text><text x="44" y="569.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">flood-tolerant</text><rect x="243" y="405" width="201" height="183" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="257" y="433.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Better flood</text><text x="257" y="456.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">defences</text><text x="257" y="487.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sea walls,</text><text x="257" y="508.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">embankments, flood</text><text x="257" y="529.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">barriers, restored</text><text x="257" y="550.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">wetlands that store</text><text x="257" y="571.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">water</text><rect x="456" y="405" width="201" height="183" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="470" y="433.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Legislation</text><text x="470" y="464.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">limits new homes</text><text x="470" y="485.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">near coasts and on</text><text x="470" y="506.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">floodplains at risk</text><rect x="669" y="405" width="201" height="183" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="683" y="433.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Building design</text><text x="683" y="464.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">raised floors,</text><text x="683" y="485.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">flood-resistant</text><text x="683" y="506.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">materials, shading,</text><text x="683" y="527.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">insulation,</text><text x="683" y="548.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reflective roofs</text>
</svg>