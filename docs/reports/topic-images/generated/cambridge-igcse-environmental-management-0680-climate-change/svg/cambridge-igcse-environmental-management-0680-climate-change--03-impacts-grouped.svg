<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 736" width="900" height="736" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="736" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Twelve impacts in three groups</text>

<rect x="300" y="110" width="300" height="56" rx="12" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="143.16" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Climate change</text><polyline points="450,166 450,186 164,186 164,224" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="30" y="230" width="268" height="50" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="164" y="259.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Physical changes</text><rect x="30" y="294" width="268" height="45" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="320.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Warmer Earth surface</text><rect x="30" y="349" width="268" height="45" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="375.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Warmer ocean surface</text><rect x="30" y="404" width="268" height="87" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="430.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ice sheets, glaciers and</text><text x="44" y="451.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">permafrost melt: sea level</text><text x="44" y="472.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rises</text><rect x="30" y="501" width="268" height="87" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="527.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ocean acidification: harder</text><text x="44" y="548.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">for corals and shells to</text><text x="44" y="569.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">form</text><rect x="30" y="598" width="268" height="108" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="624.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">More frequent, severe</text><text x="44" y="645.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">extreme weather: flooding,</text><text x="44" y="666.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">loss of land, drought,</text><text x="44" y="687.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">wildfires</text><polyline points="450,166 450,186 450,186 450,224" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="316" y="230" width="268" height="50" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="259.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Living things</text><rect x="316" y="294" width="268" height="66" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330" y="320.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Food chains disrupted when</text><text x="330" y="341.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">timings no longer match</text><rect x="316" y="370" width="268" height="45" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330" y="396.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Change in biodiversity</text><rect x="316" y="425" width="268" height="87" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330" y="451.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Loss of habitat: sea ice,</text><text x="330" y="472.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">coral reefs, coastal</text><text x="330" y="493.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">wetlands</text><rect x="316" y="522" width="268" height="66" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330" y="548.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Forced migration of humans</text><text x="330" y="569.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and animals</text><rect x="316" y="598" width="268" height="66" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330" y="624.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">More pest outbreaks and</text><text x="330" y="645.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">invasive species</text><polyline points="450,166 450,186 736,186 736,224" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="602" y="230" width="268" height="50" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="736" y="259.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Effects on food</text><rect x="602" y="294" width="268" height="108" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="616" y="320.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Crop yields change: longer</text><text x="616" y="341.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">seasons in some cold</text><text x="616" y="362.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">regions, lower yields in</text><text x="616" y="383.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">hotter, drier ones</text><rect x="602" y="412" width="268" height="108" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="616" y="438.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Food shortages where yields</text><text x="616" y="459.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fall, extreme weather</text><text x="616" y="480.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">destroys crops and fisheries</text><text x="616" y="501.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">decline</text>
</svg>