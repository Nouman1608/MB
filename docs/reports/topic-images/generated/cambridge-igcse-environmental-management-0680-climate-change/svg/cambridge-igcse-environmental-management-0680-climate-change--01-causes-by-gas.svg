<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 832" width="900" height="832" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="832" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Six causes, two gases</text>

<rect x="30" y="110" width="520" height="98" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="138.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Combustion of fossil fuels</text><text x="44" y="170.82" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">coal, oil and gas release carbon stored for millions of</text><text x="44" y="191.82" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">years</text><rect x="30" y="220" width="520" height="98" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="248.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Deforestation</text><text x="44" y="280.82" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">less CO₂ removed by photosynthesis; burning cleared trees</text><text x="44" y="301.82" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">releases it</text><rect x="30" y="330" width="520" height="77" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="358.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Cement manufacture</text><text x="44" y="390.82" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">heating calcium carbonate (limestone) releases CO₂</text><rect x="30" y="419" width="520" height="77" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="447.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Increasing population and energy use</text><text x="44" y="479.82" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">more people using more energy, mostly from fossil fuels</text><rect x="30" y="534" width="520" height="77" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="562.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Agriculture</text><text x="44" y="594.82" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cattle digestion, manure and flooded rice fields</text><rect x="30" y="623" width="520" height="77" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="651.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Changes in land use</text><text x="44" y="683.82" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">draining wetlands</text><rect x="650" y="110" width="220" height="386" rx="14" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3"/><text x="760" y="295" font-size="40" font-weight="700" fill="#1e2a44" text-anchor="middle">CO₂</text><text x="760" y="327" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">carbon dioxide</text><rect x="650" y="534" width="220" height="166" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="760" y="611" font-size="40" font-weight="700" fill="#1e2a44" text-anchor="middle">CH₄</text><text x="760" y="641" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">methane</text><line x1="554" y1="159" x2="640" y2="159" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="554" y1="269" x2="640" y2="269" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="554" y1="368.5" x2="640" y2="368.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="554" y1="457.5" x2="640" y2="457.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="554" y1="572.5" x2="640" y2="572.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="554" y1="661.5" x2="640" y2="661.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="726" width="840" height="76" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="757.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Cement releases CO₂ in two ways: calcium carbonate → calcium oxide + carbon dioxide, and</text><text x="48" y="779.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the kiln is usually heated by burning fossil fuels.</text>
</svg>