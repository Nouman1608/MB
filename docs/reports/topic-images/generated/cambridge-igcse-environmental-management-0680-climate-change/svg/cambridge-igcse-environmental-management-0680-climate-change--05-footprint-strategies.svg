<rect width="900" height="744" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reducing carbon footprints: twelve strategies</text>

<rect x="30" y="110" width="410" height="302" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="110" width="410" height="50" rx="14" fill="#cbbf9f" stroke="#c9d6d4" stroke-width="2.5"/><rect x="31.5" y="140" width="407" height="20" rx="0" fill="#cbbf9f"/><text x="50" y="144" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Use less fossil energy</text><rect x="50" y="177" width="272.4" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="186.2" y="197.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Reduced use of fossil fuels</text><rect x="50" y="215" width="290.79999999999995" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="195.39999999999998" y="235.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Increase in energy efficiency</text><rect x="50" y="253" width="189.6" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="144.8" y="273.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Transport policies</text><rect x="50" y="291" width="244.79999999999998" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="172.39999999999998" y="311.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Fewer children per woman</text><text x="50" y="352" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">renewables, walking, cycling, public</text><text x="50" y="372" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">transport, insulation; slower population</text><text x="50" y="392" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">growth cuts future demand</text><rect x="460" y="110" width="410" height="302" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="110" width="410" height="50" rx="14" fill="#b5d3cf" stroke="#c9d6d4" stroke-width="2.5"/><rect x="461.5" y="140" width="407" height="20" rx="0" fill="#b5d3cf"/><text x="480" y="144" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Cut farm emissions</text><rect x="480" y="177" width="244.79999999999998" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="602.4" y="197.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Sustainable food choices</text><rect x="480" y="215" width="300" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="630" y="235.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Reduction in livestock farming</text><text x="480" y="276" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">less methane from livestock; less transport</text><text x="480" y="296" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">and heated greenhouses</text><rect x="30" y="432" width="410" height="282" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="432" width="410" height="50" rx="14" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><rect x="31.5" y="462" width="407" height="20" rx="0" fill="#dce9e7"/><text x="50" y="466" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Take CO₂ out of the air</text><rect x="50" y="499" width="309.2" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="204.6" y="519.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Reforestation and afforestation</text><rect x="50" y="537" width="208" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="154" y="557.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Carbon sequestration</text><text x="50" y="598" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">photosynthesis, or capturing CO₂ and storing</text><text x="50" y="618" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">it underground</text><rect x="460" y="432" width="410" height="282" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="432" width="410" height="50" rx="14" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5"/><rect x="461.5" y="462" width="407" height="20" rx="0" fill="#f2e7b8"/><text x="480" y="466" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Steer and plan</text><rect x="480" y="499" width="364.4" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="662.2" y="519.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">International agreements and policies</text><rect x="480" y="537" width="97.6" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="528.8" y="557.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Taxation</text><rect x="480" y="575" width="272.4" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="616.2" y="595.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Research and climate models</text><rect x="480" y="613" width="281.59999999999997" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="620.8" y="633.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Artificial intelligence (AI)</text><text x="480" y="674" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">targets, prices and predictions that guide</text><text x="480" y="694" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">choices</text>
</svg>