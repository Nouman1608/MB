<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How a longitudinal study works</text>

<rect x="30" y="110" width="840" height="270" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="150" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Same people, again and again</text><line x1="70" y1="332" x2="840" y2="332" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="840" y="362" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">time</text><circle cx="95" cy="190" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="83" y="202" width="24" height="30" rx="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="131" cy="190" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="119" y="202" width="24" height="30" rx="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="167" cy="190" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="155" y="202" width="24" height="30" rx="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="95" cy="256" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="83" y="268" width="24" height="30" rx="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="131" cy="256" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="119" y="268" width="24" height="30" rx="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="167" cy="256" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="155" y="268" width="24" height="30" rx="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="131" cy="332" r="7" fill="#1e2a44"/><text x="131" y="362" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Wave 1</text><circle cx="285" cy="190" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="273" y="202" width="24" height="30" rx="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="321" cy="190" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="309" y="202" width="24" height="30" rx="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="357" cy="190" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="345" y="202" width="24" height="30" rx="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="285" cy="256" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="273" y="268" width="24" height="30" rx="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="321" cy="256" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="309" y="268" width="24" height="30" rx="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><g opacity="0.35"><circle cx="357" cy="256" r="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="345" y="268" width="24" height="30" rx="9" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/></g><circle cx="321" cy="332" r="7" fill="#1e2a44"/><text x="321" y="362" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Wave 2</text><circle cx="475" cy="190" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="463" y="202" width="24" height="30" rx="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="511" cy="190" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="499" y="202" width="24" height="30" rx="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="547" cy="190" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="535" y="202" width="24" height="30" rx="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="475" cy="256" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="463" y="268" width="24" height="30" rx="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><g opacity="0.35"><circle cx="511" cy="256" r="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="499" y="268" width="24" height="30" rx="9" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/></g><g opacity="0.35"><circle cx="547" cy="256" r="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="535" y="268" width="24" height="30" rx="9" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/></g><circle cx="511" cy="332" r="7" fill="#1e2a44"/><text x="511" y="362" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Wave 3</text><circle cx="665" cy="190" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="653" y="202" width="24" height="30" rx="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="701" cy="190" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="689" y="202" width="24" height="30" rx="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="737" cy="190" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="725" y="202" width="24" height="30" rx="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><g opacity="0.35"><circle cx="665" cy="256" r="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="653" y="268" width="24" height="30" rx="9" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/></g><g opacity="0.35"><circle cx="701" cy="256" r="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="689" y="268" width="24" height="30" rx="9" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/></g><g opacity="0.35"><circle cx="737" cy="256" r="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="725" y="268" width="24" height="30" rx="9" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/></g><circle cx="701" cy="332" r="7" fill="#1e2a44"/><text x="701" y="362" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Wave 4</text><text x="845" y="150" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">faded = dropped out (attrition)</text><rect x="30" y="400" width="410" height="230" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="436" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Special strength</text><text x="50" y="464.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="464.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Shows sequence: did a cause come before its</text><text x="65.2" y="485.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">supposed effect?</text><text x="50" y="511.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="511.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Helps move from correlation towards</text><text x="65.2" y="532.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">causation</text><text x="50" y="558.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="558.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Can be quantitative or qualitative</text><rect x="460" y="400" width="410" height="230" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="480" y="436" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Problems</text><text x="480" y="464.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.2" y="464.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Cost</text><text x="480" y="490.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.2" y="490.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Attrition makes the sample less</text><text x="495.2" y="511.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">representative</text><text x="480" y="537.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.2" y="537.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Funding and the researcher’s career must</text><text x="495.2" y="558.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">last</text><text x="480" y="584.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.2" y="584.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Being studied repeatedly may change</text><text x="495.2" y="605.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">behaviour</text>
</svg>