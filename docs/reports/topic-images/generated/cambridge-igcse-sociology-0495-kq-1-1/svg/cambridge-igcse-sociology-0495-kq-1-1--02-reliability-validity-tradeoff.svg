<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" width="900" height="710" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="710" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One topic, two lenses</text>

<rect x="30" y="110" width="840" height="88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="143" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">ONE TOPIC</text><text x="450" y="170.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Why do some students leave school early?</text><rect x="30" y="220" width="410" height="454" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="258" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="middle">Positivist lens</text><rect x="48" y="278" width="374" height="96" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="62" y="305" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PATTERNS AND TRENDS</text><text x="62" y="334.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">School records: early leaving more common</text><text x="62" y="355.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">in some regions, fallen over ten years</text><rect x="48" y="384" width="374" height="96" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="62" y="411" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CORRELATION</text><text x="62" y="440.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Early leaving and low household income</text><text x="62" y="461.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rise and fall together</text><rect x="48" y="490" width="374" height="96" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="62" y="517" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">OBJECTIVITY</text><text x="62" y="546.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Standard questions keep personal views</text><text x="62" y="567.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">out</text><rect x="48" y="602" width="180" height="54" rx="12" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="138" y="626" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="middle">tends to be</text><text x="138" y="647" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Reliable</text><rect x="242" y="602" width="180" height="54" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="332" y="626" font-size="15" font-weight="400" fill="#b5602e" text-anchor="middle">may lack</text><text x="332" y="647" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Validity</text><rect x="460" y="220" width="410" height="454" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="258" font-size="22" font-weight="700" fill="#8a6d0d" text-anchor="middle">Interpretivist lens</text><rect x="478" y="278" width="374" height="96" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="492" y="305" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">MEANINGS</text><text x="492" y="334.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">What does leaving mean to them: relief,</text><text x="492" y="355.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">shame, a step into adulthood?</text><rect x="478" y="384" width="374" height="96" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="492" y="411" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">SUBJECTIVITY</text><text x="492" y="440.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The researcher reflects on their own</text><text x="492" y="461.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">interpretation</text><rect x="478" y="490" width="374" height="96" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="492" y="517" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">VALIDITY</text><text x="492" y="546.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Open conversations may reveal reasons,</text><text x="492" y="567.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">such as caring for a sick parent</text><rect x="478" y="602" width="180" height="54" rx="12" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="568" y="626" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="middle">tends to be</text><text x="568" y="647" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Valid</text><rect x="672" y="602" width="180" height="54" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="762" y="626" font-size="15" font-weight="400" fill="#b5602e" text-anchor="middle">may lack</text><text x="762" y="647" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Reliability</text>
</svg>