<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="600" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Building an “evaluate” answer</text>

<rect x="30" y="104" width="840" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">QUESTION</text><text x="50" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluate the view that interpretivist research is more useful than</text><text x="50" y="188.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">positivist research.</text><rect x="30" y="232" width="150" height="72" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="105" y="275" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">For</text><rect x="194" y="232" width="676" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="210" y="261.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Unstructured interviews let people explain in their own words: verstehen</text><text x="210" y="283.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and high validity. Example: “unmotivated” students working night shifts.</text><rect x="30" y="316" width="150" height="72" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="105" y="359" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Against</text><rect x="194" y="316" width="676" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="210" y="345.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Small samples: not representative or generalisable. Subjectivity and low</text><text x="210" y="367.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">reliability. Positivism shows patterns and trends across thousands.</text><rect x="30" y="400" width="150" height="72" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="105" y="443" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Judgement</text><rect x="194" y="400" width="676" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="210" y="429.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">It depends on the aim: interpretivism for why, positivism for how much.</text><text x="210" y="451.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Triangulation suggests combining both.</text><rect x="30" y="490" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="523.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Why it works: syllabus terms in every paragraph, each applied to an example, and a reasoned</text><text x="50" y="545.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">judgement rather than a restatement.</text>
</svg>