<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 757" width="900" height="757" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="757" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Seven tools for evaluating research</text>

<rect x="30" y="110" width="272" height="66" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="147.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Bias</text><rect x="314" y="110" width="272" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="328" y="147.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Systematic distortion</text><rect x="598" y="110" width="272" height="66" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="612" y="136.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">researcher’s values, leading</text><text x="612" y="157.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">wording, who is left out</text><rect x="30" y="186" width="272" height="66" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="223.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Interviewer effect</text><rect x="314" y="186" width="272" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="328" y="212.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Answers shift because of who</text><text x="328" y="233.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">asks</text><rect x="598" y="186" width="272" height="66" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="612" y="212.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a teacher asking students</text><text x="612" y="233.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">about cheating</text><rect x="30" y="262" width="272" height="72" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="290.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Hawthorne / observer</text><text x="44" y="314.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">effect</text><rect x="314" y="262" width="272" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="328" y="291.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">People change when they know</text><text x="328" y="312.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">they are studied</text><rect x="598" y="262" width="272" height="72" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="612" y="291.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Hawthorne works, USA,</text><text x="612" y="312.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1920s–30s</text><rect x="30" y="344" width="272" height="66" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="381.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Validity</text><rect x="314" y="344" width="272" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="328" y="370.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Does the data give a true</text><text x="328" y="391.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">picture?</text><rect x="598" y="344" width="272" height="66" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="612" y="370.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sensitive behaviour is</text><text x="612" y="391.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">under-reported</text><rect x="30" y="420" width="272" height="66" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="457.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Reliability</text><rect x="314" y="420" width="272" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="328" y="446.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Could it be repeated with</text><text x="328" y="467.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">similar results?</text><rect x="598" y="420" width="272" height="66" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="612" y="446.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">standardised methods score</text><text x="612" y="467.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">highly</text><rect x="30" y="502" width="360" height="129" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="536.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Representativeness</text><text x="50" y="564.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Does the sample share the</text><text x="50" y="585.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">characteristics of the target</text><text x="50" y="606.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">population?</text><rect x="510" y="502" width="360" height="129" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="530" y="536.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Generalisability</text><text x="530" y="564.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Can findings be applied beyond the</text><text x="530" y="585.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">people studied?</text><line x1="396" y1="566.5" x2="504" y2="566.5" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="450" y="552.5" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">needed for</text><rect x="30" y="649" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="682.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Always link the concept to a cause in the research design, e.g. “low validity because</text><text x="50" y="704.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">people under-report sensitive behaviour”.</text>
</svg>