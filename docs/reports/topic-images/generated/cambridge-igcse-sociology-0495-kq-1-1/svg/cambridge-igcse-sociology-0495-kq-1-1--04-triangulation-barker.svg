<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 828" width="900" height="828" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="828" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Triangulation in practice</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Eileen Barker, <tspan font-style="italic">The Making of a Moonie</tspan> (1984)</text>
<circle cx="450" cy="380" r="92" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="370" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Why people joined</text><text x="450" y="391" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">and left the</text><text x="450" y="412" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Unification Church</text><rect x="30" y="150" width="300" height="108" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="180" y="195.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Participant observation</text><text x="180" y="223.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">gave meaning</text><rect x="570" y="150" width="300" height="108" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="720" y="208.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">In-depth interviews</text><rect x="300" y="530" width="300" height="109" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="565.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Large questionnaire</text><text x="450" y="593.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">did her impressions hold across</text><text x="450" y="614.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">many members?</text><line x1="260" y1="262" x2="382" y2="322" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><line x1="640" y1="262" x2="518" y2="322" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><line x1="450" y1="526" x2="450" y2="478" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><rect x="30" y="670" width="410" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="705.2" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Triangulation</text><text x="50" y="733.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">More than one method or source on the same</text><text x="50" y="754.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">issue, so the weakness of one is checked by</text><text x="50" y="775.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the strength of another.</text><rect x="460" y="670" width="410" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="705.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Methodological pluralism</text><text x="480" y="733.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Several methods used to build a fuller</text><text x="480" y="754.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">picture, rather than to cross-check one</text><text x="480" y="775.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">result.</text>
</svg>