<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 512" width="900" height="512" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="512" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What each command word asks for</text>

<rect x="30" y="104" width="150" height="50" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="105" y="136" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Define</text><rect x="194" y="104" width="676" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="210" y="133.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">One accurate sentence, ideally with a brief example.</text><rect x="30" y="166" width="150" height="72" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="105" y="209" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Explain</text><rect x="194" y="166" width="676" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="210" y="195.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Identify the point, develop it with “because” or “this means that”, and</text><text x="210" y="217.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">apply it.</text><rect x="30" y="250" width="150" height="50" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="105" y="282" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Discuss</text><rect x="194" y="250" width="676" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="210" y="279.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Several developed points in paragraphs, not a list.</text><rect x="30" y="312" width="150" height="72" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="105" y="355" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Evaluate</text><rect x="194" y="312" width="676" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="210" y="341.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Argue for and against, use evaluation concepts, and end with a judgement</text><text x="210" y="363.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">linked to research aims.</text><rect x="30" y="402" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="435.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Question 1(e): explain and justify a research plan, but do not evaluate your own</text><text x="50" y="457.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">methodology.</text>
</svg>