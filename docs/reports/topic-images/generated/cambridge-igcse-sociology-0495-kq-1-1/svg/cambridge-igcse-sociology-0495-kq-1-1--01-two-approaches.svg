<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="680" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two answers to one question about people</text>

<rect x="30" y="104" width="840" height="86" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="139.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Are people like objects pushed by outside forces, or thinking beings who</text><text x="450" y="164.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">act on what situations mean to them?</text><text x="195" y="230" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Positivism</text><text x="705" y="230" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="middle">Interpretivism</text><rect x="30" y="248" width="330" height="46" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="195" y="275.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Auguste Comte; Émile Durkheim</text><rect x="540" y="248" width="330" height="46" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="705" y="275.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Max Weber</text><rect x="378" y="252" width="144" height="38" rx="19" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="277" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Linked to</text><line x1="360" y1="271" x2="378" y2="271" stroke="#1e2a44" stroke-width="2.5"/><line x1="522" y1="271" x2="540" y2="271" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="306" width="330" height="68" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="195" y="333.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Macro: society has a structure of</text><text x="195" y="355.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">social facts</text><rect x="540" y="306" width="330" height="68" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="705" y="333.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Micro: small groups and</text><text x="705" y="355.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">face-to-face interaction</text><rect x="378" y="321" width="144" height="38" rx="19" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="346" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">View</text><line x1="360" y1="340" x2="378" y2="340" stroke="#1e2a44" stroke-width="2.5"/><line x1="522" y1="340" x2="540" y2="340" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="386" width="330" height="68" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="195" y="413.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Find patterns, trends, correlation</text><text x="195" y="435.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">and causation</text><rect x="540" y="386" width="330" height="68" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="705" y="413.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Verstehen: understand action from</text><text x="705" y="435.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">the actor’s point of view</text><rect x="378" y="401" width="144" height="38" rx="19" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="426" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Aim</text><line x1="360" y1="420" x2="378" y2="420" stroke="#1e2a44" stroke-width="2.5"/><line x1="522" y1="420" x2="540" y2="420" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="466" width="330" height="68" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="195" y="493.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Scientific method: hypothesis,</text><text x="195" y="515.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">operationalise, test</text><rect x="540" y="466" width="330" height="68" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="705" y="493.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">In-depth study of words, feelings</text><text x="705" y="515.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">and reasons</text><rect x="378" y="481" width="144" height="38" rx="19" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="506" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Method</text><line x1="360" y1="500" x2="378" y2="500" stroke="#1e2a44" stroke-width="2.5"/><line x1="522" y1="500" x2="540" y2="500" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="546" width="330" height="46" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="195" y="573.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Quantitative</text><rect x="540" y="546" width="330" height="46" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="705" y="573.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Qualitative</text><rect x="378" y="550" width="144" height="38" rx="19" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="575" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Data</text><line x1="360" y1="569" x2="378" y2="569" stroke="#1e2a44" stroke-width="2.5"/><line x1="522" y1="569" x2="540" y2="569" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="604" width="330" height="46" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="195" y="631.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Reliable, but may lack validity</text><rect x="540" y="604" width="330" height="46" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="705" y="631.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Valid, but may lack reliability</text><rect x="378" y="608" width="144" height="38" rx="19" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="633" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Tends to be</text><line x1="360" y1="627" x2="378" y2="627" stroke="#1e2a44" stroke-width="2.5"/><line x1="522" y1="627" x2="540" y2="627" stroke="#1e2a44" stroke-width="2.5"/>
</svg>