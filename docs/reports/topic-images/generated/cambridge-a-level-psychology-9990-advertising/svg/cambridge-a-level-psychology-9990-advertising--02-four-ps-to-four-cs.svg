<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 564" width="900" height="564" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="564" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Lauterborn's 4 Cs</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The marketing mix rewritten from the consumer's point of view</text>
<text x="130" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">4 Ps: SELLER</text><text x="380" y="138" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">4 Cs: CONSUMER</text><text x="530" y="138" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">THE QUESTION THE ADVERTISER ASKS</text><rect x="30" y="154" width="200" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="130" y="201.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Product</text><rect x="275" y="154" width="210" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="380" y="188.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Consumer wants</text><text x="380" y="212.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">and needs</text><rect x="510" y="154" width="360" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="530" y="200.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">What does the customer actually want?</text><line x1="234" y1="196" x2="269" y2="196" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="252" width="200" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="130" y="299.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Price</text><rect x="275" y="252" width="210" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="380" y="298.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Cost</text><rect x="510" y="252" width="360" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="530" y="287.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">What is the total cost to the customer,</text><text x="530" y="309.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">including time and effort?</text><line x1="234" y1="294" x2="269" y2="294" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="350" width="200" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="130" y="397.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Place</text><rect x="275" y="350" width="210" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="380" y="396.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Convenience</text><rect x="510" y="350" width="360" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="530" y="396.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">How easily can the customer buy it?</text><line x1="234" y1="392" x2="269" y2="392" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="448" width="200" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="130" y="495.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Promotion</text><rect x="275" y="448" width="210" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="380" y="494.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Communication</text><rect x="510" y="448" width="360" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="530" y="483.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Is there a two-way conversation, not</text><text x="530" y="505.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">just a one-way message?</text><line x1="234" y1="490" x2="269" y2="490" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/>
</svg>