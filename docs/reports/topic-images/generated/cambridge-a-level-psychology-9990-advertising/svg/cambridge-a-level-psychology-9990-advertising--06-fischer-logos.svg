<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="500" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Children and logos: Fischer et al. (1991)</text>

<rect x="30" y="100" width="840" height="52" rx="14" fill="#2e6b62"/><rect x="30" y="130" width="840" height="22" fill="#2e6b62"/><text x="50" y="134" font-size="21" font-weight="700" fill="#ffffff" text-anchor="start">Logo recognition in young children</text><text x="850" y="134" font-size="16" font-weight="600" fill="#ffffff" text-anchor="end">matching task</text><rect x="30" y="152" width="280" height="164" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="180" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PROCEDURE</text><text x="46" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Children aged <tspan font-weight="700" fill="#1e2a44">3</tspan> <tspan font-weight="700" fill="#1e2a44">to</tspan> <tspan font-weight="700" fill="#1e2a44">6</tspan> matched</text><text x="46" y="232.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">logos to pictures of products.</text><rect x="310" y="152" width="280" height="164" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="326" y="180" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RESULTS</text><text x="326" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Recognition <tspan font-weight="700" fill="#1e2a44">rose</tspan> <tspan font-weight="700" fill="#1e2a44">with</tspan> <tspan font-weight="700" fill="#1e2a44">age</tspan>.</text><text x="326" y="232.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Many young children matched</text><text x="326" y="253.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Old Joe the Camel, a cartoon</text><text x="326" y="274.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">used to advertise cigarettes, to</text><text x="326" y="295.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a picture of a cigarette.</text><rect x="590" y="152" width="280" height="164" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="606" y="180" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONCLUSION</text><text x="606" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Children learn brand</text><text x="606" y="232.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">associations long before they</text><text x="606" y="253.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">understand the purpose of</text><text x="606" y="274.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">advertising.</text><rect x="30" y="338" width="413" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="370" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">+ APPLICATION</text><text x="50" y="401.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Raises concern about advertising aimed at, or</text><text x="50" y="422.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reaching, children.</text><rect x="457" y="338" width="413" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="370" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">− VALIDITY</text><text x="477" y="401.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Matching shows <tspan font-weight="700" fill="#1e2a44">recognition</tspan>, not liking or</text><text x="477" y="422.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">intention to buy; children may have guessed on</text><text x="477" y="443.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">some trials. It did <tspan font-weight="700" fill="#1e2a44">not</tspan> measure smoking.</text>
</svg>