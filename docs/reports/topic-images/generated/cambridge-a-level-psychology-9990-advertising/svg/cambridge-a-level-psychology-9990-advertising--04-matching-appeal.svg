<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 579" width="900" height="579" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="579" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Match the appeal to the person</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The interaction found in study 3, applied to two watch adverts</text>
<text x="435" y="142" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">IMAGE APPEAL</text><text x="435" y="164" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">celebrity at a glamorous party</text><text x="735" y="142" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">QUALITY CLAIM</text><text x="735" y="164" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">accuracy, water resistance</text><rect x="30" y="182" width="230" height="120" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="145" y="233.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">High self-monitor</text><text x="145" y="262.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">cares about image</text><rect x="30" y="316" width="230" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="145" y="367.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Low self-monitor</text><text x="145" y="396.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">acts on values</text><rect x="290" y="182" width="290" height="120" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="435" y="238" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">pays more</text><text x="435" y="268" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">show the celebrity advert</text><rect x="590" y="182" width="290" height="120" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="735" y="238" font-size="22" font-weight="700" fill="#4a5568" text-anchor="middle">pays less</text><text x="735" y="268" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle"></text><rect x="290" y="316" width="290" height="120" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="435" y="372" font-size="22" font-weight="700" fill="#4a5568" text-anchor="middle">pays less</text><text x="435" y="402" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle"></text><rect x="590" y="316" width="290" height="120" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="735" y="372" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">pays more</text><text x="735" y="402" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">show the accuracy advert</text><rect x="30" y="458" width="840" height="89" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="492.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Not "image adverts work better"</text><text x="450" y="522.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Neither appeal wins overall: the effect depends on the consumer's self-monitoring.</text>
</svg>