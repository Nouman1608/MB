<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 999" width="900" height="999" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="999" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Key study: Snyder and DeBono (1985)</text>

<rect x="30" y="100" width="410" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">HIGH SELF-MONITORS</text><text x="50" y="164.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Adjust their behaviour to suit the social</text><text x="50" y="186.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">situation and care about the image they</text><text x="50" y="208.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">present.</text><rect x="460" y="100" width="410" height="133" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="480" y="132" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">LOW SELF-MONITORS</text><text x="480" y="164.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Behave according to their inner attitudes and</text><text x="480" y="186.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">values.</text><rect x="30" y="255" width="840" height="52" rx="14" fill="#2e6b62"/><rect x="30" y="285" width="840" height="22" fill="#2e6b62"/><text x="50" y="289" font-size="21" font-weight="700" fill="#ffffff" text-anchor="start">Study 3: image appeal or quality claim?</text><text x="850" y="289" font-size="16" font-weight="600" fill="#ffffff" text-anchor="end">self-report measures</text><rect x="30" y="307" width="280" height="206" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="335" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AIM</text><text x="46" y="366.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">To test whether high and low</text><text x="46" y="387.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">self-monitors respond</text><text x="46" y="408.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">differently to image-based and</text><text x="46" y="429.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">quality-based adverts.</text><rect x="310" y="307" width="280" height="206" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="326" y="335" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PROCEDURE</text><text x="326" y="366.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Self-monitoring measured with</text><text x="326" y="387.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the Self-Monitoring Scale. A</text><text x="326" y="408.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">product was advertised with an</text><text x="326" y="429.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">image</tspan> <tspan font-weight="700" fill="#1e2a44">appeal</tspan> or a <tspan font-weight="700" fill="#1e2a44">quality</tspan> <tspan font-weight="700" fill="#1e2a44">claim</tspan>;</text><text x="326" y="450.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">participants said how willing</text><text x="326" y="471.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">they were to try it and how</text><text x="326" y="492.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">much they would pay.</text><rect x="590" y="307" width="280" height="206" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="606" y="335" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RESULTS</text><text x="606" y="366.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">High self-monitors would pay</text><text x="606" y="387.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">more after an <tspan font-weight="700" fill="#1e2a44">image</tspan> appeal; low</text><text x="606" y="408.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">self-monitors would pay more</text><text x="606" y="429.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">after a <tspan font-weight="700" fill="#1e2a44">quality</tspan> claim.</text><rect x="30" y="535" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="569.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Conclusion</text><text x="450" y="599.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">An advert's effectiveness depends on the <tspan font-weight="700" fill="#1e2a44">match</tspan> between the type of appeal and the consumer's</text><text x="450" y="621.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">personality.</text><clipPath id="tc668"><rect x="30" y="668" width="840" height="299" rx="14"/></clipPath><g clip-path="url(#tc668)"><rect x="30" y="668" width="182.970297029703" height="48" fill="#b5d3cf"/><text x="44" y="695.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Issue</text><rect x="212.970297029703" y="668" width="565.5445544554456" height="48" fill="#b5d3cf"/><text x="226.970297029703" y="695.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Point</text><rect x="778.5148514851486" y="668" width="91.4851485148515" height="48" fill="#b5d3cf"/><text x="792.5148514851486" y="695.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">+/−</text><rect x="30" y="716" width="182.970297029703" height="68" fill="#dce9e7"/><text x="44" y="742.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Application</text><rect x="212.970297029703" y="716" width="565.5445544554456" height="68" fill="#ffffff"/><text x="226.970297029703" y="742.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Advertisers can target image appeals at likely high self-monitors and</text><text x="226.970297029703" y="763.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">quality claims at others.</text><rect x="778.5148514851486" y="716" width="91.4851485148515" height="68" fill="#dce9e7"/><text x="792.5148514851486" y="742.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">+</tspan></text><line x1="30" y1="784" x2="870" y2="784" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="784" width="182.970297029703" height="68" fill="#dce9e7"/><text x="44" y="810.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Self-reports</text><rect x="212.970297029703" y="784" width="565.5445544554456" height="68" fill="#f8faf9"/><text x="226.970297029703" y="810.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Self-monitoring and willingness to pay were self-reported: social</text><text x="226.970297029703" y="831.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">desirability, and saying you would pay is not paying.</text><rect x="778.5148514851486" y="784" width="91.4851485148515" height="68" fill="#f6e3d8"/><text x="792.5148514851486" y="810.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">−</tspan></text><line x1="30" y1="852" x2="870" y2="852" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="852" width="182.970297029703" height="47" fill="#dce9e7"/><text x="44" y="878.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Generalisation</text><rect x="212.970297029703" y="852" width="565.5445544554456" height="47" fill="#ffffff"/><text x="226.970297029703" y="878.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Participants were students, a narrow sample in age and income.</text><rect x="778.5148514851486" y="852" width="91.4851485148515" height="47" fill="#f6e3d8"/><text x="792.5148514851486" y="878.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">−</tspan></text><line x1="30" y1="899" x2="870" y2="899" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="899" width="182.970297029703" height="68" fill="#dce9e7"/><text x="44" y="925.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Determinism</text><rect x="212.970297029703" y="899" width="565.5445544554456" height="68" fill="#f8faf9"/><text x="226.970297029703" y="925.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Personality appears to determine response, yet people can choose to</text><text x="226.970297029703" y="946.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ignore adverts.</text><rect x="778.5148514851486" y="899" width="91.4851485148515" height="68" fill="#f2e7b8"/><text x="792.5148514851486" y="925.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">±</tspan></text></g><line x1="212.970297029703" y1="668" x2="212.970297029703" y2="967" stroke="#c9d6d4" stroke-width="1.5"/><line x1="778.5148514851486" y1="668" x2="778.5148514851486" y2="967" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="668" width="840" height="299" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>