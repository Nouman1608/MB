<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 531" width="900" height="531" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="531" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Brands and slogans</text>

<rect x="30" y="100" width="410" height="136" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BRAND AWARENESS</text><text x="50" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Recognition and recall</text><text x="50" y="189.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">How well consumers recognise or recall a</text><text x="50" y="211.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">brand.</text><rect x="460" y="100" width="410" height="136" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="132" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">BRAND IMAGE</text><text x="480" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Associations and feelings</text><text x="480" y="189.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The set of associations and feelings attached</text><text x="480" y="211.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">to a brand.</text><text x="450" y="272.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">A <tspan font-weight="700">slogan</tspan> is a short phrase that communicates the brand's identity.</text><rect x="30" y="304" width="410" height="195" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="336" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FUNCTIONS OF SLOGANS</text><text x="50" y="368.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="368.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">increase awareness</text><text x="50" y="396.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="396.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">build a brand image</text><text x="50" y="424.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="424.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">differentiate the brand from rivals</text><text x="50" y="452.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="452.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">give continuity across campaigns</text><rect x="460" y="304" width="410" height="195" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="336" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GUIDELINES: KOHLI ET AL. (2007)</text><text x="480" y="368.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="496.15" y="368.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">treat it as a long-term investment</text><text x="480" y="396.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="496.15" y="396.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">use it to position the brand</text><text x="480" y="424.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="496.15" y="424.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">link it clearly to the brand name</text><text x="480" y="452.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="496.15" y="452.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">keep it consistent and repeated, so the link</text><text x="496.15" y="474.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">is learned</text>
</svg>