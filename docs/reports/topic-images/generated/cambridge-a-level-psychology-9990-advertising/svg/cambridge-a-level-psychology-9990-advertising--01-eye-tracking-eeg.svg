<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 662" width="900" height="662" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="662" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Measuring responses to adverts</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Two techniques that do not rely on what participants say</text>
<rect x="30" y="124" width="410" height="159" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EYE-TRACKING</text><text x="50" y="184.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Where the eyes go</text><text x="50" y="214.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Shows which parts of an advert are looked at,</text><text x="50" y="236.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and for how long.</text><rect x="460" y="124" width="410" height="159" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="480" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EEG</text><text x="480" y="184.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">What the brain does</text><text x="480" y="214.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Records electrical activity of the brain: an</text><text x="480" y="236.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">indication of attention and emotional</text><text x="480" y="258.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">engagement.</text><rect x="30" y="305" width="410" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="70" y="327" width="200" height="126" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="170" y="357" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">ADVERT</text><rect x="90" y="371" width="70" height="60" rx="6" fill="#ffffff" stroke="#8a6d0d" stroke-width="2"/><line x1="175" y1="381" x2="252" y2="381" stroke="#8a6d0d" stroke-width="5"/><line x1="175" y1="399" x2="240" y2="399" stroke="#8a6d0d" stroke-width="5"/><circle cx="125" cy="397" r="18" fill="#2e6b62" opacity="0.55" stroke="#2e6b62" stroke-width="2"/><circle cx="210" cy="383" r="11" fill="#2e6b62" opacity="0.55" stroke="#2e6b62" stroke-width="2"/><circle cx="140" cy="417" r="9" fill="#2e6b62" opacity="0.55" stroke="#2e6b62" stroke-width="2"/><circle cx="200" cy="405" r="7" fill="#2e6b62" opacity="0.55" stroke="#2e6b62" stroke-width="2"/><path d="M125,397 L210,383 L140,417 L200,405" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="290" y="367" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">circle size = time</text><text x="290" y="387" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">spent looking</text><rect x="460" y="305" width="410" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M490,390 L497,376 L511,404 L525,376 L539,404 L553,376 L567,404 L581,376 L595,404 L609,376 L623,404 L637,376 L651,430 L665,350 L679,430 L693,350 L707,430 L721,350 L735,430 L749,376 L763,404 L777,376 L791,404 L805,376 L819,404 L833,376 L847,404" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="665" y="460" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">brain activity over time (schematic)</text><rect x="30" y="497" width="410" height="133" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="529" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">+ STRENGTH</text><text x="50" y="561.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Both give <tspan font-weight="700" fill="#1e2a44">objective</tspan> data. Ciceri et al. (2020)</text><text x="50" y="583.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">combined such biometric measures to</text><text x="50" y="605.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">compare advertising across media.</text><rect x="460" y="497" width="410" height="133" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="529" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">− LIMITATION</text><text x="480" y="561.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">They show <tspan font-weight="700" fill="#1e2a44">physiological</tspan> <tspan font-weight="700" fill="#1e2a44">reactions</tspan>, not</text><text x="480" y="583.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">whether the viewer liked the product or will</text><text x="480" y="605.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">buy it.</text>
</svg>