<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 903" width="900" height="903" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="903" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Product placement: Auty and Lewis (2004)</text>

<rect x="250" y="100" width="400" height="61" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="135.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Children</text><line x1="380" y1="167" x2="240" y2="211" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="520" y1="167" x2="660" y2="211" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="231" width="360" height="114" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="210" y="263" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">PLACEMENT</text><text x="210" y="290.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Home Alone clip</text><text x="210" y="320.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Pepsi appears</text><rect x="510" y="231" width="360" height="114" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="690" y="263" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">CONTROL</text><text x="690" y="290.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Control clip</text><text x="690" y="320.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">no brand</text><line x1="240" y1="351" x2="240" y2="405" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="660" y1="351" x2="660" y2="405" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="250" y="413" width="400" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="447.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Later offered a choice of cola</text><line x1="450" y1="479" x2="450" y2="533" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="541" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="575.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Result</text><text x="450" y="605.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Children who saw the placement were <tspan font-weight="700" fill="#1e2a44">more</tspan> <tspan font-weight="700" fill="#1e2a44">likely</tspan> <tspan font-weight="700" fill="#1e2a44">to</tspan> <tspan font-weight="700" fill="#1e2a44">choose</tspan> <tspan font-weight="700" fill="#1e2a44">Pepsi</tspan>, and the effect was <tspan font-weight="700" fill="#1e2a44">strongest</tspan></text><text x="450" y="627.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700" fill="#1e2a44">for</tspan> <tspan font-weight="700" fill="#1e2a44">those</tspan> <tspan font-weight="700" fill="#1e2a44">who</tspan> <tspan font-weight="700" fill="#1e2a44">had</tspan> <tspan font-weight="700" fill="#1e2a44">seen</tspan> <tspan font-weight="700" fill="#1e2a44">the</tspan> <tspan font-weight="700" fill="#1e2a44">film</tspan> <tspan font-weight="700" fill="#1e2a44">before</tspan>.</text><rect x="30" y="674" width="410" height="133" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="706" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXPLANATION 1</text><text x="50" y="732.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Reminder</text><text x="50" y="761.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Supported by the effect being strongest in</text><text x="50" y="782.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">children who had already seen the film.</text><rect x="460" y="674" width="410" height="133" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="480" y="706" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXPLANATION 2</text><text x="480" y="732.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Mere exposure (Zajonc)</text><text x="480" y="761.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Repeated exposure to a stimulus increases liking</text><text x="480" y="782.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">for it, even without conscious recognition.</text><text x="450" y="841.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Ethics: research with children needs parental consent, and raises whether children can recognise placement</text><text x="450" y="862.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">as advertising.</text>
</svg>