<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" width="900" height="740" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="740" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">True, but shaped: what to look for</text>

<rect x="30" y="120" width="840" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="72" cy="162" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="72" y="169.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="108" y="170" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">A real “I”</text><line x1="90" y1="260" x2="800" y2="260" stroke="#1e2a44" stroke-width="3"/><circle cx="190" cy="260" r="13" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><circle cx="700" cy="260" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="190" y="230" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">younger self</text><text x="190" y="302" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">lives the experience</text><text x="700" y="230" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">older writer</text><text x="700" y="302" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">looks back and comments</text><line x1="640" y1="246" x2="250" y2="246" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><text x="445" y="234" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">the gap = hindsight</text><rect x="270" y="316" width="360" height="38" rx="19" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="341.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">“I was sure then that…”</text><text x="645" y="341" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">signals a change of view</text><rect x="30" y="390" width="410" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="72" cy="432" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="72" y="439.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="108" y="440" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">A purpose beyond facts</text><text x="58" y="482" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The writer wants you to feel something</text><text x="58" y="505" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">about a place, person or event:</text><rect x="58" y="530" width="170" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="143" y="556.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">admiration</text><rect x="238" y="530" width="170" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="323" y="556.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">unease</text><rect x="58" y="584" width="170" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="143" y="610.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">amusement</text><rect x="238" y="584" width="170" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="323" y="610.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">nostalgia</text><text x="58" y="670" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Ask: what should the reader feel?</text><rect x="460" y="390" width="410" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="502" cy="432" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="502" y="439.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="538" y="440" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Selection and arrangement</text><text x="488" y="482" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The writer shapes the true experience by</text><text x="488" y="505" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">deciding what to:</text><rect x="488" y="530" width="170" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="573" y="556.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">put first</text><rect x="668" y="530" width="170" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="753" y="556.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">linger on</text><rect x="488" y="584" width="170" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="573" y="610.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">leave out</text><rect x="668" y="584" width="170" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="753" y="610.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">leave to the end</text><text x="488" y="670" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">These choices are evidence of</text><text x="488" y="693" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">perspective.</text>
</svg>