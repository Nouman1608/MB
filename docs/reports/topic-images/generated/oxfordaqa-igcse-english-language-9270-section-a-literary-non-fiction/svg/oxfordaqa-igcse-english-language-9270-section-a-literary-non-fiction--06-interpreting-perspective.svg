<rect width="900" height="800" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Inferring the writer’s perspective</text>

<rect x="30" y="115" width="410" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="153" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Word choice</text><text x="52" y="181" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">“crumbling” vs “weathered”</text><rect x="460" y="115" width="410" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="482" y="153" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Praise and mockery</text><text x="482" y="181" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">what is admired, what is mocked</text><rect x="30" y="220" width="410" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="258" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Other people</text><text x="52" y="286" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">how they are described and speak</text><rect x="460" y="220" width="410" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="482" y="258" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Reflective voice</text><text x="482" y="286" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the older writer comments</text><line x1="235" y1="320" x2="400" y2="350" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="665" y1="320" x2="500" y2="350" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="200" y="352" width="500" height="92" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="388" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Infer the writer’s perspective</text><text x="450" y="420" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">“This suggests…”  “The writer may be implying…”</text><rect x="30" y="480" width="410" height="290" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="55" y="518" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">Sustained (R3)</text><rect x="140" y="542" width="190" height="56" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="577" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">one idea</text><line x1="235" y1="600" x2="113" y2="652" stroke="#2e6b62" stroke-width="3"/><rect x="58" y="654" width="110" height="42" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="113" y="681" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">evidence 1</text><line x1="235" y1="600" x2="235" y2="652" stroke="#2e6b62" stroke-width="3"/><rect x="180" y="654" width="110" height="42" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="235" y="681" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">evidence 2</text><line x1="235" y1="600" x2="357" y2="652" stroke="#2e6b62" stroke-width="3"/><rect x="302" y="654" width="110" height="42" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="357" y="681" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">evidence 3</text><text x="55" y="734" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Develop one idea across</text><text x="55" y="756" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">several pieces of evidence.</text><rect x="460" y="480" width="410" height="290" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="485" y="518" font-size="21" font-weight="700" fill="#b5602e" text-anchor="start">Not sustained</text><rect x="490" y="546" width="140" height="42" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="560" y="573" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">quotation 1</text><line x1="634" y1="567" x2="672" y2="567" stroke="#b5602e" stroke-width="2.5" marker-end="url(#ahR)"/><rect x="678" y="546" width="160" height="42" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="758" y="573" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">new guess 1</text><rect x="490" y="600" width="140" height="42" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="560" y="627" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">quotation 2</text><line x1="634" y1="621" x2="672" y2="621" stroke="#b5602e" stroke-width="2.5" marker-end="url(#ahR)"/><rect x="678" y="600" width="160" height="42" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="758" y="627" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">new guess 2</text><rect x="490" y="654" width="140" height="42" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="560" y="681" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">quotation 3</text><line x1="634" y1="675" x2="672" y2="675" stroke="#b5602e" stroke-width="2.5" marker-end="url(#ahR)"/><rect x="678" y="654" width="160" height="42" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="758" y="681" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">new guess 3</text><text x="485" y="734" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">One guess per quotation,</text><text x="485" y="756" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">never developed.</text>
</svg>