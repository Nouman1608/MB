<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 850" width="900" height="850" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="850" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four questions about structure</text>

<line x1="70" y1="130" x2="70" y2="690" stroke="#8a6d0d" stroke-width="5" marker-end="url(#ahO)"/><text x="52" y="125" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">start</text><circle cx="70" cy="200" r="9" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><rect x="105" y="140" width="765" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="130" y="180" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Opening</text><text x="260" y="180" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">How does it begin, and why?</text><rect x="130" y="202" width="100.39999999999999" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="180.2" y="228.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">a scene</text><rect x="244.39999999999998" y="202" width="146.39999999999998" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="317.59999999999997" y="228.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">a reflection</text><rect x="404.79999999999995" y="202" width="201.6" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="505.59999999999997" y="228.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">a line of dialogue</text><circle cx="70" cy="340" r="9" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><rect x="105" y="280" width="765" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="130" y="320" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Shifts</text><text x="260" y="320" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">Where does the focus move?</text><rect x="130" y="342" width="183.2" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="221.6" y="368.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">outside → inside</text><rect x="327.2" y="342" width="164.79999999999998" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="409.59999999999997" y="368.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">past → present</text><rect x="506" y="342" width="201.6" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="606.8" y="368.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">wide view → detail</text><circle cx="70" cy="480" r="9" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><rect x="105" y="420" width="765" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="130" y="460" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Pace</text><text x="260" y="460" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">Where does it slow down or speed up?</text><rect x="130" y="482" width="247.6" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="253.8" y="508.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">slow: lingers on detail</text><rect x="391.6" y="482" width="330.4" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="556.8" y="508.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">fast: long periods in a sentence</text><circle cx="70" cy="620" r="9" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><rect x="105" y="560" width="765" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="130" y="600" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Ending</text><text x="260" y="600" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">How does it close?</text><rect x="130" y="622" width="238.39999999999998" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="249.2" y="648.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">returns to the opening</text><rect x="382.4" y="622" width="146.39999999999998" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="455.59999999999997" y="648.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">a reflection</text><rect x="542.8" y="622" width="174" height="40" rx="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="629.8" y="648.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">left unresolved</text><rect x="30" y="720" width="840" height="104" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="754" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Always link the choice to its effect:</text><text x="55" y="784" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“By delaying the name of the village until the final paragraph, the writer keeps the</text><text x="55" y="808" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">reader as disorientated as she was.”</text>
</svg>