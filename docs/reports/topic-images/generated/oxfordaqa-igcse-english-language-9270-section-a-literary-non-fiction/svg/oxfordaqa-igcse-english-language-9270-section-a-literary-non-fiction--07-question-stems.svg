<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 770" width="900" height="770" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="770" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Read the stem, choose the skill</text>

<text x="45" y="132" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">If the question says…</text><text x="435" y="132" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">…then do this</text><rect x="30" y="150" width="345" height="82" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="198" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">“What do you learn…” / “List…”</text><line x1="379" y1="191" x2="417" y2="191" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="423" y="150" width="447" height="82" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="460" cy="191" r="24" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="460" y="199.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">R1</text><text x="497" y="185" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Select relevant details accurately;</text><text x="497" y="208" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">brief answers are fine.</text><rect x="30" y="250" width="345" height="82" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="298" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">“Explain…”</text><line x1="379" y1="291" x2="417" y2="291" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="423" y="250" width="447" height="82" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="443" y="298" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Give the detail and say what it shows.</text><rect x="30" y="350" width="345" height="82" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="398" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">“How does the writer…”</text><line x1="379" y1="391" x2="417" y2="391" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="423" y="350" width="447" height="82" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="460" cy="391" r="24" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="460" y="399.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">R4</text><text x="497" y="398" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Analyse methods and their effects.</text><rect x="30" y="450" width="345" height="82" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="498" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">“What impressions…”</text><line x1="379" y1="491" x2="417" y2="491" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="423" y="450" width="447" height="82" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="460" cy="491" r="24" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="460" y="499.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">R3</text><text x="497" y="485" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Interpret attitudes, supported by</text><text x="497" y="508" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">evidence.</text><rect x="30" y="550" width="345" height="82" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="598" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">“To what extent…” / “Evaluate…”</text><line x1="379" y1="591" x2="417" y2="591" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="423" y="550" width="447" height="82" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="443" y="585" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Weigh how well an effect is achieved across</text><text x="443" y="608" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the text; reach a judgement.</text><rect x="30" y="662" width="840" height="80" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="695" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Divide your time by the marks shown for each question,</text><text x="450" y="722" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">and leave enough for Section B (also 40 marks).</text>
</svg>