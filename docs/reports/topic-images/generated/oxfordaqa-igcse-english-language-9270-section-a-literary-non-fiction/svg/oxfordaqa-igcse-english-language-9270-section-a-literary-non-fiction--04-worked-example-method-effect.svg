<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 860" width="900" height="860" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="860" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Method, quotation, effect</text>

<rect x="30" y="112" width="840" height="160" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="145" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">My grandmother’s kitchen was not large, but in my memory it is enormous. There was the</text><text x="55" y="170" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">stove, black and patient, which she fed every morning before light. There was the table,</text><text x="55" y="195" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">scarred by forty years of knives. And there was my grandmother herself, who never sat down.</text><text x="55" y="220" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">I was nine. I thought she was simply busy. It took me thirty years to understand that she</text><text x="55" y="245" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">was holding the whole house together with her hands.</text><text x="450" y="312" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Question: How does the writer present her grandmother?</text><text x="42" y="352" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Method</text><text x="247" y="352" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Brief quotation</text><text x="552" y="352" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Effect on the reader</text><rect x="30" y="368" width="185" height="84" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="122" y="416" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Contrast</text><line x1="217" y1="410" x2="231" y2="410" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="235" y="368" width="285" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="249" y="404" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“not large” →</text><text x="249" y="427" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“enormous”</text><line x1="522" y1="410" x2="536" y2="410" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="540" y="368" width="330" height="84" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="554" y="404" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Her presence filled the child’s</text><text x="554" y="426" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">world.</text><rect x="30" y="466" width="185" height="84" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="122" y="514" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Personification</text><line x1="217" y1="508" x2="231" y2="508" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="235" y="466" width="285" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="249" y="502" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“black and patient”,</text><text x="249" y="525" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“fed”</text><line x1="522" y1="508" x2="536" y2="508" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="540" y="466" width="330" height="84" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="554" y="502" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Tending the house was a constant,</text><text x="554" y="524" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">living responsibility.</text><rect x="30" y="564" width="185" height="84" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="122" y="612" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Short sentences</text><line x1="217" y1="606" x2="231" y2="606" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="235" y="564" width="285" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="249" y="600" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“I was nine. I thought</text><text x="249" y="623" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">she was simply busy.”</text><line x1="522" y1="606" x2="536" y2="606" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="540" y="564" width="330" height="84" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="554" y="600" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Recreate the child’s limited</text><text x="554" y="622" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">understanding.</text><rect x="30" y="662" width="185" height="84" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="122" y="710" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Metaphor</text><line x1="217" y1="704" x2="231" y2="704" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="235" y="662" width="285" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="249" y="698" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“holding the whole house</text><text x="249" y="721" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">together with her hands”</text><line x1="522" y1="704" x2="536" y2="704" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="540" y="662" width="330" height="84" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="554" y="698" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ordinary work becomes heroic; the</text><text x="554" y="720" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reader shares the late admiration.</text><rect x="30" y="772" width="840" height="62" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="810" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Rows 3 and 4 also track the shift from child to adult perspective (R3).</text>
</svg>