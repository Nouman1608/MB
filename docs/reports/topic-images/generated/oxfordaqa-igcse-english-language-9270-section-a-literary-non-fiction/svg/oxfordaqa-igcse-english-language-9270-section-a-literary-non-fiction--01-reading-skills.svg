<rect width="900" height="660" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four reading skills tested in Section A</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">AO1 reading, applied to one unseen text</text>
<rect x="30" y="125" width="840" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="90" cy="181" r="32" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="90" y="192.52" font-size="32" font-weight="700" fill="#1e2a44" text-anchor="middle">R1</text><text x="145" y="169" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Select and use</text><text x="145" y="199" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Find the right details for the question asked, and use them, not just copy them.</text><rect x="30" y="253" width="840" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="90" cy="309" r="32" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="90" y="320.52" font-size="32" font-weight="700" fill="#1e2a44" text-anchor="middle">R2</text><text x="145" y="297" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Collate and synthesise</text><text x="145" y="327" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Gather details from different parts of the one text and draw them together.</text><rect x="30" y="381" width="840" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="90" cy="437" r="32" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="90" y="448.52" font-size="32" font-weight="700" fill="#1e2a44" text-anchor="middle">R3</text><text x="145" y="425" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Interpret ideas and perspectives</text><text x="145" y="455" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Work out the writer’s attitude and how it develops.</text><rect x="30" y="509" width="840" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="90" cy="565" r="32" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="90" y="576.52" font-size="32" font-weight="700" fill="#1e2a44" text-anchor="middle">R4</text><text x="145" y="553" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Explain and evaluate methods</text><text x="145" y="583" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Analyse words, sentences and organisation, and their effect on the reader.</text>
</svg>