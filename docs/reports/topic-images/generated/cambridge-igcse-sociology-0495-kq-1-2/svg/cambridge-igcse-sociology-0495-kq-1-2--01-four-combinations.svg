<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 674" width="900" height="674" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="674" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two distinctions, four kinds of data</text>

<text x="385" y="140" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Quantitative</text><text x="385" y="164" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">numbers</text><text x="715" y="140" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="middle">Qualitative</text><text x="715" y="164" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">words, images, descriptions</text><rect x="30" y="186" width="180" height="170" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="120" y="243" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Primary</text><text x="120" y="271" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">collected by the</text><text x="120" y="291" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">researcher for</text><text x="120" y="311" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">this study</text><rect x="230" y="186" width="310" height="170" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="385" y="251.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Results of your own</text><text x="385" y="275.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">closed-question</text><text x="385" y="299.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">questionnaire</text><rect x="560" y="186" width="310" height="170" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="715" y="263.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Transcripts of your own</text><text x="715" y="287.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">unstructured interviews</text><rect x="30" y="376" width="180" height="170" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="120" y="423" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Secondary</text><text x="120" y="451" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">already existed,</text><text x="120" y="471" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">made by someone</text><text x="120" y="491" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">else for another</text><text x="120" y="511" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">purpose</text><rect x="230" y="376" width="310" height="170" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="385" y="453.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Government census or crime</text><text x="385" y="477.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">figures</text><rect x="560" y="376" width="310" height="170" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="715" y="441.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Diaries, letters, news</text><text x="715" y="465.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">articles, social media</text><text x="715" y="489.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">posts</text><rect x="30" y="566" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="599.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“Secondary” does not mean “qualitative”, and “primary” does not mean “numbers”. Ask two</text><text x="50" y="621.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">questions: who produced it, and what form is it in?</text>
</svg>