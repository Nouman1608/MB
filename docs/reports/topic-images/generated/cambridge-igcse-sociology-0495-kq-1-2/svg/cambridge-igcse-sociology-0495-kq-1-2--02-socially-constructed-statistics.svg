<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 778" width="900" height="778" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="778" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How official statistics are socially constructed</text>

<rect x="30" y="110" width="840" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="150" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="start">Recorded crime</text><rect x="60" y="176" width="600" height="64" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="360" y="215" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">All crimes that happen</text><rect x="490" y="260" width="170" height="64" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="575" y="299" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">not reported</text><rect x="60" y="260" width="430" height="64" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="275" y="299" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Reported by victims</text><rect x="320" y="344" width="340" height="64" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="490" y="383" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">not reported or recorded</text><rect x="60" y="344" width="260" height="64" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="190" y="383" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Recorded by police</text><path d="M672,260 l14,0 l0,148 l-14,0" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><line x1="686" y1="334" x2="700" y2="334" stroke="#b5602e" stroke-width="3"/><text x="708" y="316" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">the “dark</text><text x="708" y="338" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">figure”: crime</text><text x="708" y="360" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">that stays hidden</text><text x="60" y="460" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Only the bottom layer becomes the official crime figure.</text><rect x="30" y="510" width="840" height="240" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="550" font-size="22" font-weight="700" fill="#8a6d0d" text-anchor="start">Suicide statistics</text><text x="845" y="550" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Atkinson, Discovering Suicide (1978)</text><rect x="55" y="580" width="200" height="110" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="155" y="639.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">A death</text><rect x="330" y="580" width="240" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="613.9" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Coroner interprets</text><text x="450" y="637.9" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">clues</text><text x="450" y="666.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">notes, manner of death</text><rect x="645" y="580" width="200" height="110" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="745" y="627.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Recorded as</text><text x="745" y="651.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">suicide, or not</text><line x1="260" y1="635" x2="324" y2="635" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="575" y1="635" x2="639" y2="635" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="450" y="728" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">So the figures reflect officials’ judgements as well as behaviour.</text>
</svg>