<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading the practice table</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Survey of 400 adults in one city (invented for practice)</text>
<rect x="30" y="130" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="184" y="198" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">16–29</text><rect x="200" y="160" width="454.4" height="62" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="427.2" y="198" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">71%</text><rect x="654.4" y="160" width="128" height="62" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="718.4" y="198" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">20%</text><rect x="782.4" y="160" width="57.6" height="62" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="811.1999999999999" y="198" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">9%</text><text x="184" y="282" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">30–49</text><rect x="200" y="244" width="371.2" height="62" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="385.6" y="282" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">58%</text><rect x="571.2" y="244" width="172.8" height="62" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="657.6" y="282" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">27%</text><rect x="744" y="244" width="96" height="62" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="792" y="282" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">15%</text><text x="184" y="366" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">50 and over</text><rect x="200" y="328" width="211.2" height="62" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="305.6" y="366" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">33%</text><rect x="411.2" y="328" width="192" height="62" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="507.2" y="366" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">30%</text><rect x="603.2" y="328" width="236.8" height="62" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="721.6" y="366" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">37%</text><rect x="603.2" y="328" width="236.8" height="62" fill="none" stroke="#b5602e" stroke-width="5"/><rect x="200" y="410" width="22" height="22" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="230" y="426" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Daily</text><rect x="390" y="410" width="22" height="22" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="420" y="426" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Weekly</text><rect x="580" y="410" width="22" height="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="610" y="426" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rarely or never</text><rect x="30" y="480" width="410" height="108" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="513" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">IDENTIFY</text><text x="50" y="542.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">37% of those aged 50 and over rarely or</text><text x="50" y="563.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">never read news online.</text><rect x="460" y="480" width="410" height="108" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="480" y="513" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DESCRIBE</text><text x="480" y="542.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Daily reading falls with age, from 71% of</text><text x="480" y="563.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">16–29s to 33% of those 50 and over.</text><rect x="30" y="604" width="840" height="165" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="637" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">PROBLEMS WITH THE EVIDENCE</text><text x="50" y="666.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="666.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Group sizes not given</text><text x="50" y="692.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="692.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">One city only</text><text x="50" y="718.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="718.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Self-reported behaviour</text><text x="50" y="744.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="744.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">If done online, older non-users are missed, so the gap looks smaller</text>
</svg>