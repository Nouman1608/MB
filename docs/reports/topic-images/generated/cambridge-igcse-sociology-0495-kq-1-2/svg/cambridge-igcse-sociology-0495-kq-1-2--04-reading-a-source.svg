<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 612" width="900" height="612" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="612" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four steps for reading any source</text>

<line x1="62" y1="124" x2="62" y2="502" stroke="#c9d6d4" stroke-width="4"/><rect x="108" y="104" width="762" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="140" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Read the labels first</text><text x="128" y="169.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Title, axis labels, units, dates, who produced it, sample size</text><circle cx="62" cy="149" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="157.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="108" y="206" width="762" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="242" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Find the exact figure or trend asked for</text><text x="128" y="271.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Quote it with its unit: “34%”, “rose from 12 to 19 per 1,000”</text><circle cx="62" cy="251" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="259.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="108" y="308" width="762" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="344" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Describe the pattern</text><text x="128" y="373.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Highest, lowest, rising, falling, a gap between groups</text><circle cx="62" cy="353" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="361.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="108" y="410" width="762" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="128" y="446" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Question the evidence</text><text x="128" y="475.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Sample size, how it was collected, missing groups, age of the data, unclear</text><text x="128" y="497.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">definitions, correlation not causation</text><circle cx="62" cy="466" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="474.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="129.39999999999998" y="540" width="218" height="42" rx="21" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="238.39999999999998" y="566.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">summaries of studies</text><rect x="359.4" y="540" width="107.6" height="42" rx="21" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="413.2" y="566.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">diagrams</text><rect x="479" y="540" width="89.19999999999999" height="42" rx="21" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="523.6" y="566.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">tables</text><rect x="580.2" y="540" width="89.19999999999999" height="42" rx="21" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="624.8000000000001" y="566.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">charts</text><rect x="681.4000000000001" y="540" width="89.19999999999999" height="42" rx="21" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="726.0000000000001" y="566.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">graphs</text>
</svg>