<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 775" width="900" height="775" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="775" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four types of secondary evidence</text>

<rect x="30" y="110" width="410" height="110" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="146" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Official statistics</text><text x="50" y="174.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">census, births and deaths, exam results,</text><text x="50" y="195.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">recorded crime</text><rect x="30" y="228" width="410" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="254.8" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">+ Large-scale, regular: trends</text><text x="44" y="280.8" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">+ Free; compare regions</text><rect x="30" y="307" width="410" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="333.8" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">− Only what the state counts</text><text x="44" y="359.8" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">− Definitions change</text><rect x="460" y="110" width="410" height="136" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="146" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Historical and personal</text><text x="480" y="172" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">documents</text><text x="480" y="200.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">parish registers, diaries, letters,</text><text x="480" y="221.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">photographs</text><rect x="460" y="254" width="410" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="280.8" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">+ Only evidence about the past</text><text x="474" y="306.8" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">+ No interviewer effect</text><rect x="460" y="333" width="410" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="359.8" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">− Authenticity? Credibility?</text><text x="474" y="385.8" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">− Writers not typical</text><text x="665" y="428" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">e.g. Laslett; Thomas and Znaniecki</text><rect x="30" y="458" width="410" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="494" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Digital sources</text><text x="50" y="522.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">websites, blogs, social media, forums,</text><text x="50" y="543.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">search data</text><rect x="30" y="576" width="410" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="602.8" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">+ Vast, current, cheap</text><text x="44" y="628.8" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">+ Reaches hard-to-meet groups</text><rect x="30" y="655" width="410" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="681.8" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">− Hard to verify; users not</text><text x="44" y="702.8" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">representative</text><text x="44" y="728.8" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">− Consent and privacy</text><rect x="460" y="458" width="410" height="89" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="480" y="494" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Media content</text><text x="480" y="522.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">newspapers, TV, films, advertising, music</text><rect x="460" y="555" width="410" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="581.8" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">+ Shows how groups are represented</text><text x="474" y="607.8" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">+ Easy to access; compare over time</text><rect x="460" y="634" width="410" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="660.8" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">− Reflects owners’ and editors’ agenda</text><text x="474" y="686.8" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">− Misses audience interpretation</text><text x="665" y="729" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">e.g. Glasgow University Media Group, Bad News</text>
</svg>