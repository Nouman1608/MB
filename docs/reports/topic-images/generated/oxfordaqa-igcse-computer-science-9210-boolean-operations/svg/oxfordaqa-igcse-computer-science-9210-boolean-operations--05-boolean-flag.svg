<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 538" width="900" height="538" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="538" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A Boolean flag remembers a result</text>

<rect x="30" y="110" width="400" height="314" rx="12" fill="#1e2a44"/><text x="48" y="140" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#d4b02e" text-anchor="start">found ← False</text><text x="48" y="172" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="400" fill="#e8eef0" text-anchor="start">FOR i ← 0 TO 9</text><text x="67.2" y="204" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="400" fill="#e8eef0" text-anchor="start">IF codes[i] = target THEN</text><text x="86.4" y="236" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#d4b02e" text-anchor="start">found ← True</text><text x="67.2" y="268" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="400" fill="#e8eef0" text-anchor="start">ENDIF</text><text x="48" y="300" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="400" fill="#e8eef0" text-anchor="start">ENDFOR</text><text x="48" y="332" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#d4b02e" text-anchor="start">IF NOT found THEN</text><text x="67.2" y="364" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="400" fill="#e8eef0" text-anchor="start">OUTPUT "Code not recognised"</text><text x="48" y="396" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="400" fill="#e8eef0" text-anchor="start">ENDIF</text><rect x="452" y="110" width="418" height="314" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="661" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">The flag only switches one way</text><rect x="476" y="178" width="150" height="66" rx="33" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="551" y="219" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">False</text><rect x="696" y="178" width="150" height="66" rx="33" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="771" y="219" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="middle">True</text><line x1="630" y1="211" x2="690" y2="211" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><text x="551" y="270" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">before the loop</text><text x="771" y="270" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">a match on any pass</text><rect x="476" y="290" width="370" height="54" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="661" y="323" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Never set back to False in the loop</text><text x="476" y="374" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">After the loop, NOT found is True only when</text><text x="476" y="396" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">no item matched.</text><rect x="30" y="444" width="840" height="64" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="484" font-size="17" font-weight="600" fill="#b5602e" text-anchor="middle">Resetting found to False on a mismatch would mean only the last comparison counted.</text>
</svg>