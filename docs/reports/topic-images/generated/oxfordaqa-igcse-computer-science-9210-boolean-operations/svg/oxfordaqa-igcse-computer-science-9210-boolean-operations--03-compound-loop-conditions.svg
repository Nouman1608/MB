<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 788" width="900" height="788" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="788" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two reasons to stop a loop</text>

<rect x="30" y="110" width="411" height="560" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">WHILE: test first</text><rect x="145" y="170" width="110" height="52" rx="26" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="200" y="202" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Start</text><line x1="200" y1="222" x2="200" y2="262" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><path d="M200,265 L330,330 L200,395 L70,330 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><text x="200" y="325" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">lives > 0</text><text x="200" y="347" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">AND NOT won</text><line x1="200" y1="395" x2="200" y2="442" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><text x="222" y="426" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">True</text><rect x="115" y="444" width="170" height="52" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="200" y="476" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">PlayTurn()</text><path d="M115,470 L50,470 L50,250 L194,250" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><text x="364" y="316" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">False</text><path d="M330,330 L410,330 L410,600 L262,600" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahR)"/><rect x="145" y="574" width="110" height="52" rx="26" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="200" y="606" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">End</text><text x="235" y="652" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">May play zero turns</text><rect x="459" y="110" width="411" height="560" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="664" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">REPEAT: test at the end</text><rect x="585" y="170" width="110" height="52" rx="26" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="640" y="202" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Start</text><line x1="640" y1="222" x2="640" y2="262" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="555" y="264" width="170" height="52" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="640" y="296" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">PlayTurn()</text><line x1="640" y1="316" x2="640" y2="354" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><path d="M640,355 L800,430 L640,505 L480,430 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><text x="640" y="425" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">NOT (lives > 0</text><text x="640" y="447" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">AND NOT won)</text><path d="M480,430 L480,290 L549,290" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahR)"/><text x="510" y="400" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">False</text><line x1="640" y1="505" x2="640" y2="570" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><text x="664" y="546" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">True</text><rect x="585" y="574" width="110" height="52" rx="26" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="640" y="606" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">End</text><text x="664" y="652" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Always plays at least one turn</text><rect x="30" y="694" width="840" height="64" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="734" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">The loop ends as soon as either part fails: lives reach 0, or won becomes True.</text>
</svg>