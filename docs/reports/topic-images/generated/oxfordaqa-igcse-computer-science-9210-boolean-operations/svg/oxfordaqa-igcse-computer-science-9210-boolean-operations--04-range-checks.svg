<rect width="900" height="622" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Range checks: AND inside, OR outside</text>

<rect x="30" y="110" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="152" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">mark ≥ 0 AND mark ≤ 100</text><text x="54" y="186" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Inside: both limits hold</text><text x="54" y="214" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Join the two limits with</text><text x="54" y="234" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">AND.</text><rect x="320" y="198" width="440" height="24" rx="6" fill="#b5d3cf"/><line x1="250" y1="210" x2="830" y2="210" stroke="#1e2a44" stroke-width="3"/><line x1="320" y1="192" x2="320" y2="228" stroke="#1e2a44" stroke-width="3"/><text x="320" y="184" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">0</text><line x1="760" y1="192" x2="760" y2="228" stroke="#1e2a44" stroke-width="3"/><text x="760" y="184" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">100</text><rect x="30" y="276" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="318" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">mark &lt; 0 OR mark > 100</text><text x="54" y="352" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Outside: one limit broken</text><text x="54" y="380" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Join the two limits with</text><text x="54" y="400" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">OR.</text><rect x="250" y="364" width="60" height="24" rx="6" fill="#d4b02e"/><rect x="770" y="364" width="60" height="24" rx="6" fill="#d4b02e"/><line x1="250" y1="376" x2="830" y2="376" stroke="#1e2a44" stroke-width="3"/><line x1="320" y1="358" x2="320" y2="394" stroke="#1e2a44" stroke-width="3"/><text x="320" y="350" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">0</text><line x1="760" y1="358" x2="760" y2="394" stroke="#1e2a44" stroke-width="3"/><text x="760" y="350" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">100</text><rect x="30" y="442" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="484" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">mark &lt; 0 AND mark > 100</text><text x="54" y="518" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">Never True</text><text x="54" y="546" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">A common error in</text><text x="54" y="566" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">out-of-range tests.</text><line x1="250" y1="542" x2="830" y2="542" stroke="#1e2a44" stroke-width="3"/><line x1="320" y1="524" x2="320" y2="560" stroke="#1e2a44" stroke-width="3"/><text x="320" y="516" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">0</text><line x1="760" y1="524" x2="760" y2="560" stroke="#1e2a44" stroke-width="3"/><text x="760" y="516" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">100</text><text x="540" y="520" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">no number is below 0 and above 100</text>
</svg>