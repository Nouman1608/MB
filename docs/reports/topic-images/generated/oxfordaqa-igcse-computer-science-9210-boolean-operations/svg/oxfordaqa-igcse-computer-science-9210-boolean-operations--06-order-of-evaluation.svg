<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 688" width="900" height="688" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="688" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Order of evaluation: NOT, AND, OR</text>

<rect x="30" y="110" width="840" height="56" rx="14" fill="#1e2a44"/><text x="54" y="145" font-size="17" font-weight="700" fill="#d4b02e" text-anchor="start">Applied in order:</text><text x="250" y="145" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="20" font-weight="700" fill="#ffffff" text-anchor="start">NOT  →  AND  →  OR</text><text x="846" y="145" font-size="16" font-weight="400" fill="#b5d3cf" text-anchor="end">like × before +</text><rect x="30" y="190" width="411" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="230" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">hasKey OR</text><text x="235" y="256" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">(isAdmin AND isLoggedIn)</text><line x1="235" y1="330" x2="120" y2="426" stroke="#1e2a44" stroke-width="2.5"/><line x1="235" y1="330" x2="320" y2="410" stroke="#1e2a44" stroke-width="2.5"/><line x1="320" y1="410" x2="255" y2="490" stroke="#1e2a44" stroke-width="2.5"/><line x1="320" y1="410" x2="385" y2="490" stroke="#1e2a44" stroke-width="2.5"/><rect x="173" y="290" width="124" height="60" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="235" y="316" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">OR</text><text x="235" y="340" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">True</text><rect x="258" y="380" width="124" height="60" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="320" y="406" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">AND</text><text x="320" y="430" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">False</text><rect x="62" y="418" width="116" height="52" rx="10" fill="#ffffff"/><text x="120" y="440" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">hasKey</text><text x="120" y="462" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">True</text><rect x="200" y="492" width="112" height="52" rx="10" fill="#ffffff"/><text x="250" y="512" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">isAdmin</text><text x="250" y="534" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">False</text><rect x="330" y="492" width="106" height="52" rx="10" fill="#ffffff"/><text x="385" y="512" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">isLoggedIn</text><text x="385" y="534" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">False</text><rect x="459" y="190" width="411" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="664" y="230" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">(hasKey OR isAdmin)</text><text x="664" y="256" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">AND isLoggedIn</text><line x1="664" y1="330" x2="569" y2="410" stroke="#1e2a44" stroke-width="2.5"/><line x1="664" y1="330" x2="779" y2="426" stroke="#1e2a44" stroke-width="2.5"/><line x1="569" y1="410" x2="509" y2="490" stroke="#1e2a44" stroke-width="2.5"/><line x1="569" y1="410" x2="629" y2="490" stroke="#1e2a44" stroke-width="2.5"/><rect x="602" y="290" width="124" height="60" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="664" y="316" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">AND</text><text x="664" y="340" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">False</text><rect x="507" y="380" width="124" height="60" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="569" y="406" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">OR</text><text x="569" y="430" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">True</text><rect x="721" y="418" width="116" height="52" rx="10" fill="#ffffff"/><text x="779" y="440" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">isLoggedIn</text><text x="779" y="462" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">False</text><rect x="463" y="492" width="96" height="52" rx="10" fill="#ffffff"/><text x="509" y="512" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">hasKey</text><text x="509" y="534" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">True</text><rect x="577" y="492" width="106" height="52" rx="10" fill="#ffffff"/><text x="629" y="512" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">isAdmin</text><text x="629" y="534" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">False</text><rect x="30" y="594" width="840" height="64" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="634" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Same values, different answers: always bracket a condition that mixes AND and OR.</text>
</svg>