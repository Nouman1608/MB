<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 494" width="900" height="494" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="494" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Swap empty effects for specific ones</text>

<text x="450" y="112" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">These fit any text, so they earn nothing</text><rect x="30" y="130" width="410" height="62" rx="10" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="235" y="167" font-size="16" font-weight="400" fill="#b5602e" text-anchor="middle" font-style="italic">“It makes the reader want to read on.”</text><line x1="48" y1="161" x2="422" y2="161" stroke="#b5602e" stroke-width="2" opacity="0.45"/><rect x="460" y="130" width="410" height="62" rx="10" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="665" y="167" font-size="16" font-weight="400" fill="#b5602e" text-anchor="middle" font-style="italic">“It creates a vivid image in the reader’s mind.”</text><line x1="478" y1="161" x2="852" y2="161" stroke="#b5602e" stroke-width="2" opacity="0.45"/><rect x="30" y="206" width="410" height="62" rx="10" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="235" y="243" font-size="16" font-weight="400" fill="#b5602e" text-anchor="middle" font-style="italic">“It makes the writing more interesting.”</text><line x1="48" y1="237" x2="422" y2="237" stroke="#b5602e" stroke-width="2" opacity="0.45"/><rect x="460" y="206" width="410" height="62" rx="10" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="665" y="243" font-size="16" font-weight="400" fill="#b5602e" text-anchor="middle" font-style="italic">“It helps the reader imagine the scene.”</text><line x1="478" y1="237" x2="852" y2="237" stroke="#b5602e" stroke-width="2" opacity="0.45"/><line x1="450" y1="290" x2="450" y2="330" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="470" y="318" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">replace with the specific image or feeling</text><rect x="30" y="340" width="840" height="130" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="374" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Not “a vivid image”, but:</text><text x="450" y="428" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" font-style="italic">“the reader pictures people collapsing like emptied sacks”</text>
</svg>