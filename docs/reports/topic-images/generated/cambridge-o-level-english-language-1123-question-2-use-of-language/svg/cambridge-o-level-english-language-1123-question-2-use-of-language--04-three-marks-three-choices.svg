<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 730" width="900" height="730" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="730" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three marks, three language choices</text>

<rect x="30" y="110" width="840" height="78" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">(c) How does the language in the last three sentences create a sense</text><text x="52" y="168" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">of oppressive discomfort?</text><rect x="760" y="132" width="80" height="36" rx="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="800" y="156.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">[3]</text><rect x="30" y="210" width="300" height="132" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="244" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Heat pressed down through the</text><text x="48" y="265" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">glass roof like a hand.”</text><line x1="334" y1="276" x2="360" y2="276" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="366" y="230" width="190" height="92" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="380" y="268" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">simile: “like a</text><text x="380" y="289" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">hand”</text><line x1="560" y1="276" x2="586" y2="276" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="592" y="210" width="220" height="132" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="608" y="244" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the heat feels physical</text><text x="608" y="265" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and heavy, as if</text><text x="608" y="286" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">pushing the people down</text><circle cx="842" cy="276" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="842" y="282" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="30" y="360" width="300" height="132" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="394" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Somewhere a baby wailed,</text><text x="48" y="415" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">stopped, began again.”</text><line x1="334" y1="426" x2="360" y2="426" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="366" y="380" width="190" height="92" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="380" y="418" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">broken, repetitive</text><text x="380" y="439" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">rhythm</text><line x1="560" y1="426" x2="586" y2="426" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="592" y="360" width="220" height="132" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="608" y="394" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mirrors the endless,</text><text x="608" y="415" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">wearing noise</text><circle cx="842" cy="426" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="842" y="432" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="30" y="510" width="300" height="132" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="544" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“… was swallowed by the hum of</text><text x="48" y="565" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">a thousand electric fans.”</text><line x1="334" y1="576" x2="360" y2="576" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="366" y="530" width="190" height="92" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="380" y="568" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">“swallowed”</text><line x1="560" y1="576" x2="586" y2="576" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="592" y="510" width="220" height="132" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="608" y="544" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">even official</text><text x="608" y="565" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">information is lost;</text><text x="608" y="586" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the travellers are left</text><text x="608" y="607" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">helpless</text><circle cx="842" cy="576" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="842" y="582" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="810" y="680" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">three features,</text><text x="810" y="702" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">three effects =</text><circle cx="842" cy="686" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="842" y="693" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text>
</svg>