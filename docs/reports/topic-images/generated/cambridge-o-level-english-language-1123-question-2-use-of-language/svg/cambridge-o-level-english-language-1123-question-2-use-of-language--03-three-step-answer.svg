<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 656" width="900" height="656" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="656" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The three-step answer</text>

<text x="240" y="130" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle">The step</text><text x="680" y="130" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle">In the worked answer to (b)</text><rect x="30" y="148" width="430" height="112" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="68" cy="186" r="22" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="68" y="193.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="102" y="194" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Quote precisely</text><text x="52" y="228" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the word or short phrase, not the whole</text><text x="52" y="249" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sentence</text><line x1="464" y1="204" x2="494" y2="204" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="500" y="148" width="370" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="520" y="186" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">“Sagged”</text><rect x="30" y="278" width="430" height="112" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="68" cy="316" r="22" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="68" y="323.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="102" y="324" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Explain the meaning or image</text><text x="52" y="358" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">what is being said or pictured</text><line x1="464" y1="334" x2="494" y2="334" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="500" y="278" width="370" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="520" y="316" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">bodies collapsing under their own</text><text x="520" y="339" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">weight</text><rect x="30" y="408" width="430" height="148" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="68" cy="446" r="22" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="68" y="453.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="102" y="454" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Explain the effect in context</text><text x="52" y="488" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">what it suggests about the character, place</text><text x="52" y="509" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">or situation, and how the reader responds</text><line x1="464" y1="482" x2="494" y2="482" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="500" y="408" width="370" height="148" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="520" y="446" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the people have lost all their energy</text><text x="520" y="469" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and drop wherever they are, which</text><text x="520" y="492" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">emphasises how long they have been</text><text x="520" y="515" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">waiting</text><rect x="30" y="574" width="840" height="58" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="610" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Moving words: suggests · implies · emphasises · conveys</text>
</svg>