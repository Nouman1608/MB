<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 744" width="900" height="744" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="744" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Connotation: the engine of effect</text>

<rect x="30" y="110" width="840" height="260" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Same denotation, different connotations</text><rect x="370" y="200" width="160" height="90" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><path d="M360,206 L450,164 L540,206" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /> <rect x="430" y="246" width="40" height="44" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="314" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">the same building</text><rect x="80" y="210" width="200" height="54" rx="27" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="180" y="244.92" font-size="22" font-weight="700" fill="#4a5568" text-anchor="middle">house</text><text x="180" y="290" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">dictionary meaning</text><rect x="620" y="210" width="200" height="54" rx="27" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="720" y="244.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">home</text><text x="720" y="290" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle">warmth, belonging, family</text><line x1="286" y1="237" x2="356" y2="237" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="614" y1="237" x2="546" y2="237" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="450" y="346" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Writers choose words for their connotations.</text><rect x="30" y="390" width="840" height="220" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="426" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Same action, three verbs</text><rect x="55" y="448" width="250" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="180" y="490" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">She walked into the room</text><rect x="330" y="448" width="250" height="70" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="455" y="490" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">She drifted into the room</text><rect x="605" y="448" width="250" height="70" rx="10" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="730" y="490" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">She stormed into the room</text><text x="450" y="560" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">Each verb gives a different character and mood.</text><text x="450" y="588" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Explaining that difference is the whole of the skill.</text><rect x="30" y="630" width="840" height="90" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="664" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Ask: what else does this word bring with it?</text><text x="450" y="694" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">What would be lost if a plainer word were used?</text>
</svg>