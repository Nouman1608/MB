<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 676" width="900" height="676" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="676" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two layers: meaning and effect</text>

<rect x="200" y="110" width="500" height="60" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" font-style="italic">“The streets were choked with traffic”</text><line x1="450" y1="172" x2="450" y2="204" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="210" width="840" height="120" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="55" y="246" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Layer 1: Meaning</text><text x="845" y="246" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">what the words say, in plain terms</text><text x="55" y="296" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">The streets were very crowded.</text><rect x="30" y="346" width="840" height="196" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="55" y="382" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">Layer 2: Effect</text><text x="845" y="382" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="end" font-style="italic">what the choice makes the reader see, feel or think</text><rect x="55" y="404" width="120" height="44" rx="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="432.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">“choked”</text><line x1="180" y1="426" x2="214" y2="426" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><text x="224" y="432" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">the city struggling to breathe, as if strangled by traffic</text><text x="55" y="486" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">The reader senses discomfort and something close to danger,</text><text x="55" y="514" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">not just inconvenience.</text><rect x="30" y="560" width="410" height="92" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="594" font-size="18" font-weight="700" fill="#4a5568" text-anchor="start">Meaning only</text><text x="52" y="624" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">= a comprehension answer (Question 1)</text><rect x="460" y="560" width="410" height="92" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="482" y="594" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">Effect</text><text x="482" y="624" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">= what Question 2 rewards (R4)</text>
</svg>