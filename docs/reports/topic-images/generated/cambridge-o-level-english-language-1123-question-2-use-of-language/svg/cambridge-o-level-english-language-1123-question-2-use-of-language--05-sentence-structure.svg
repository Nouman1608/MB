<rect width="900" height="708" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Sentence shapes and what they do</text>

<rect x="30" y="110" width="840" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="56" y="136" width="230" height="10" rx="5" fill="#b5d3cf"/><rect x="56" y="152" width="250" height="10" rx="5" fill="#b5d3cf"/><rect x="56" y="168" width="220" height="10" rx="5" fill="#b5d3cf"/><rect x="56" y="188" width="50" height="12" rx="6" fill="#b5602e"/><text x="350" y="156" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A very short sentence after long ones</text><text x="350" y="188" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">a sudden stop, shock or emphasis</text><rect x="30" y="238" width="840" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="56" y="282" width="36" height="12" rx="6" fill="#d4b02e"/><rect x="100" y="282" width="36" height="12" rx="6" fill="#d4b02e"/><rect x="144" y="282" width="36" height="12" rx="6" fill="#d4b02e"/><rect x="188" y="282" width="36" height="12" rx="6" fill="#d4b02e"/><rect x="232" y="282" width="36" height="12" rx="6" fill="#d4b02e"/><rect x="276" y="282" width="36" height="12" rx="6" fill="#d4b02e"/><text x="324" y="294" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">…</text><text x="350" y="284" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A long sentence built from a list</text><text x="350" y="316" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">abundance, chaos, breathlessness</text><rect x="30" y="366" width="840" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="56" y="392" width="40" height="12" rx="6" fill="#2e6b62"/><rect x="102" y="392" width="150" height="12" rx="6" fill="#b5d3cf"/><rect x="56" y="414" width="40" height="12" rx="6" fill="#2e6b62"/><rect x="102" y="414" width="120" height="12" rx="6" fill="#b5d3cf"/><rect x="56" y="436" width="40" height="12" rx="6" fill="#2e6b62"/><rect x="102" y="436" width="90" height="12" rx="6" fill="#b5d3cf"/><text x="350" y="412" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Repetition at the start of clauses</text><text x="350" y="444" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">insistence, rhythm</text><rect x="30" y="494" width="840" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="56" y="538" width="180" height="12" rx="6" fill="#b5d3cf"/><text x="252" y="554" font-size="28" font-weight="700" fill="#b5602e" text-anchor="start">?</text><text x="350" y="540" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A question</text><text x="350" y="572" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">doubt, a character’s inner voice</text><rect x="30" y="626" width="840" height="58" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="662" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Say what the shape does in this moment of the story, not just what it is.</text>
</svg>