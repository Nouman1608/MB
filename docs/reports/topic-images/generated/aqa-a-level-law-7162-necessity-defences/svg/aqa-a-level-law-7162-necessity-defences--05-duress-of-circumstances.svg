<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 672" width="900" height="672" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="672" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Duress of circumstances: a threat from the situation</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Same Graham test and same exclusions for murder and attempted murder (Pommell)</text>
<rect x="30" y="124" width="411" height="126" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DURESS BY THREATS</text><text x="46" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A person demands that a crime be</text><text x="46" y="201.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">committed</text><text x="46" y="229.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">e.g. Zac: drive to the bank or his girlfriend is shot</text><rect x="459" y="124" width="411" height="126" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="475" y="152" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">DURESS OF CIRCUMSTANCES</text><text x="475" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The situation creates the threat</text><text x="475" y="206.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Escaping a gang by driving on the pavement</text><rect x="30" y="270" width="272" height="115" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="296" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WILLER (1986)</text><text x="44" y="327" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Drove on a pavement to escape a</text><text x="44" y="347" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">gang: defence recognised</text><rect x="314" y="270" width="272" height="115" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="328" y="296" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONWAY (1988)</text><text x="328" y="327" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Drove recklessly to escape men</text><text x="328" y="347" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">he believed would kill his</text><text x="328" y="367" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">passenger</text><rect x="598" y="270" width="272" height="115" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="612" y="296" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MARTIN (COLIN) (1989)</text><text x="612" y="327" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Drove while disqualified: wife</text><text x="612" y="347" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">threatened suicide</text><rect x="30" y="397" width="272" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="423" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">POMMELL (1995)</text><text x="44" y="454" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Took a gun to stop someone</text><text x="44" y="474" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">shooting others: all crimes except</text><text x="44" y="494" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">murder, attempted murder, some</text><text x="44" y="514" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">treason</text><rect x="314" y="397" width="272" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="328" y="423" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ABDUL-HUSSAIN (1999)</text><text x="328" y="454" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Hijacked a plane to escape</text><text x="328" y="474" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">execution: peril imminent, not</text><text x="328" y="494" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">necessarily immediate</text><rect x="598" y="397" width="272" height="135" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="612" y="423" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">DPP v BELL (1992)</text><text x="612" y="454" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Drove after drinking to escape:</text><text x="612" y="474" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">covered only while the threat</text><text x="612" y="494" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">continues</text><rect x="30" y="552" width="840" height="88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="586.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Necessity and murder</text><text x="50" y="615.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Dudley</tspan> <tspan font-style="italic">and</tspan> <tspan font-style="italic">Stephens</tspan> (1884): shipwrecked sailors who killed and ate the cabin boy had no defence.</text>
</svg>