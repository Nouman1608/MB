<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 556" width="900" height="556" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="556" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How much force? Ordinary cases and householders</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">s76(6) and s76(5A); R (Collins) v Secretary of State for Justice (2016)</text>
<rect x="230" y="124" width="213.33333333333334" height="54" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="336.6666666666667" y="157" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Proportionate</text><rect x="443.33333333333337" y="124" width="213.33333333333334" height="54" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="550" y="157" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Disproportionate</text><rect x="656.6666666666667" y="124" width="213.33333333333334" height="54" fill="#f3d9c9" stroke="#1e2a44" stroke-width="2.5"/><text x="763.3333333333334" y="157" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Grossly disproportionate</text><line x1="230" y1="198" x2="866" y2="198" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="550" y="222" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">more force relative to the threat</text><rect x="30" y="244" width="186" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="123" y="288.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Ordinary case</text><rect x="236" y="244" width="201.33333333333334" height="84" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="336.6666666666667" y="288.3" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">Reasonable</text><rect x="449.33333333333337" y="244" width="201.33333333333334" height="84" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="550" y="288.3" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">Not reasonable</text><rect x="662.6666666666667" y="244" width="201.33333333333334" height="84" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="763.3333333333334" y="288.3" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">Not reasonable</text><rect x="30" y="340" width="186" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="123" y="373.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Householder v</text><text x="123" y="394.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">intruder in a dwelling</text><rect x="236" y="340" width="201.33333333333334" height="84" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="336.6666666666667" y="384.3" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">Reasonable</text><rect x="449.33333333333337" y="340" width="201.33333333333334" height="84" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="550" y="373.8" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">May or may not be: all</text><text x="550" y="394.8" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">the circumstances</text><rect x="662.6666666666667" y="340" width="201.33333333333334" height="84" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="763.3333333333334" y="384.3" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">Never reasonable</text><rect x="30" y="444" width="840" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="477.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">The householder rule applies only to an intruder <tspan font-weight="700" fill="#1e2a44">in</tspan> <tspan font-weight="700" fill="#1e2a44">a</tspan> <tspan font-weight="700" fill="#1e2a44">dwelling</tspan>; applying it elsewhere is a common</text><text x="450" y="499.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">mistake.</text>
</svg>