<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="470" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three ways duress is shut out</text>

<rect x="30" y="100" width="270.6666666666667" height="167" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="46" y="128" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">BARRIER 1</text><text x="46" y="154.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Murder</text><text x="46" y="183.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No defence: <tspan font-style="italic">Howe</tspan> (1987),</text><text x="46" y="204.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">overruling <tspan font-style="italic">Lynch</tspan>. Even a</text><text x="46" y="225.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">13-year-old under his father’s</text><text x="46" y="246.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">threats: <tspan font-style="italic">Wilson</tspan> (2007)</text><rect x="314.6666666666667" y="100" width="270.6666666666667" height="167" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="330.6666666666667" y="128" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">BARRIER 2</text><text x="330.6666666666667" y="154.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Attempted murder</text><text x="330.6666666666667" y="183.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No defence: <tspan font-style="italic">Gotts</tspan> (1992)</text><rect x="599.3333333333334" y="100" width="270.6666666666667" height="167" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="615.3333333333334" y="128" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">BARRIER 3</text><text x="615.3333333333334" y="154.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Self-induced duress</text><text x="615.3333333333334" y="183.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Voluntary association with</text><text x="615.3333333333334" y="204.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">people he foresaw, or ought to</text><text x="615.3333333333334" y="225.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">have foreseen, might threaten</text><text x="615.3333333333334" y="246.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">violence (<tspan font-style="italic">Hasan</tspan>)</text><text x="670" y="307" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Barrier 3 in practice</text><rect x="462" y="323" width="199" height="115" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="476" y="349" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">✗ SHARP (1987)</text><text x="476" y="380" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Joined a violent gang:</text><text x="476" y="400" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">defence fails</text><rect x="671" y="323" width="199" height="115" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="685" y="349" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">✓ SHEPHERD (1987)</text><text x="685" y="380" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Group not known for</text><text x="685" y="400" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">violence: may not</text><text x="685" y="420" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">defeat it</text><rect x="30" y="323" width="420" height="115" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="44" y="349" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">EVALUATION</text><text x="44" y="380" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Excluding murder protects the sanctity of life but can</text><text x="44" y="400" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">be harsh (<tspan font-style="italic">Wilson</tspan>). <tspan font-style="italic">Hasan</tspan> narrowed the defence to</text><text x="44" y="420" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">stop offenders exploiting it.</text>
</svg>