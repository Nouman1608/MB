<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="670" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Duress by threats: the Graham test</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">R v Graham (1982), approved in Howe (1987) and restated in Hasan (2005)</text>
<rect x="30" y="124" width="400" height="115" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STAGE 1: SUBJECTIVE, BUT REASONABLE</text><text x="46" y="177.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Compelled to act by a reasonably believed</text><text x="46" y="198.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">threat of death or serious injury?</text><line x1="436" y1="181.5" x2="464" y2="181.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="470" y="124" width="400" height="115" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="486" y="152" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">STAGE 2: OBJECTIVE</text><text x="486" y="177.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Would a sober person of reasonable</text><text x="486" y="198.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">firmness, sharing his characteristics, have</text><text x="486" y="219.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">done the same?</text><text x="30" y="279" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The threat must be</text><rect x="30" y="295" width="413" height="95" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="321" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SERIOUS</text><text x="44" y="352" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Death or serious injury (<tspan font-style="italic">Hasan</tspan>); not property or</text><text x="44" y="372" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">exposure</text><rect x="457" y="295" width="413" height="95" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="471" y="321" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AGAINST</text><text x="471" y="352" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Him, his family, or someone he reasonably regards as</text><text x="471" y="372" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">his responsibility (<tspan font-style="italic">Hasan</tspan>)</text><rect x="30" y="402" width="413" height="115" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="428" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NOMINATING THE OFFENCE</text><text x="44" y="459" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">To commit the particular offence: <tspan font-style="italic">Cole</tspan> (1994), debt</text><text x="44" y="479" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">threat, robbed a building society</text><rect x="457" y="402" width="413" height="115" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="471" y="428" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">IMMEDIATE</text><text x="471" y="459" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Immediate or almost immediate, no evasive action</text><text x="471" y="479" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">such as going to the police (<tspan font-style="italic">Hasan</tspan>, not <tspan font-style="italic">Hudson</tspan> <tspan font-style="italic">and</tspan></text><text x="471" y="499" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Taylor</tspan>)</text><rect x="30" y="537" width="840" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="565" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RELEVANT CHARACTERISTICS: R v BOWEN (1996)</text><text x="46" y="596.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Yes:</tspan> age, sex, pregnancy, serious physical disability, recognised mental illness. <tspan font-weight="700" fill="#1e2a44">No:</tspan> low IQ short of mental</text><text x="46" y="617.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">impairment; being unusually vulnerable to pressure.</text>
</svg>