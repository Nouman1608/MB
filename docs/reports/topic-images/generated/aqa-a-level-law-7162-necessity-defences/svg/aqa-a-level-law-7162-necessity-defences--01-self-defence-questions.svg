<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750" width="900" height="750" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="750" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Self-defence: two questions for the jury</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Common law; s3(1) Criminal Law Act 1967; s76 of the 2008 Act</text>
<rect x="30" y="124" width="520" height="146" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">QUESTION 1</text><text x="46" y="178.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Was force necessary?</text><text x="46" y="207.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">On the facts <tspan font-weight="700" fill="#1e2a44">as</tspan> <tspan font-weight="700" fill="#1e2a44">the</tspan> <tspan font-weight="700" fill="#1e2a44">defendant</tspan> <tspan font-weight="700" fill="#1e2a44">honestly</tspan> <tspan font-weight="700" fill="#1e2a44">believed</tspan> <tspan font-weight="700" fill="#1e2a44">them</tspan>, even if</text><text x="46" y="228.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mistaken and unreasonable: <tspan font-style="italic">Williams</tspan> <tspan font-style="italic">(Gladstone)</tspan> (1984);</text><text x="46" y="249.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Beckford</tspan> (1988)</text><rect x="580" y="124" width="290" height="93" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="593" y="149" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">NOT IF</text><text x="593" y="180" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Mistake from <tspan font-weight="700" fill="#1e2a44">voluntary</tspan> <tspan font-weight="700" fill="#1e2a44">intoxication</tspan>:</text><text x="593" y="200" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">O’Grady</tspan>; <tspan font-style="italic">Hatton</tspan></text><rect x="580" y="227" width="290" height="113" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="593" y="252" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STILL NECESSARY</text><text x="593" y="283" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Pre-emptive</tspan> force (<tspan font-style="italic">Beckford</tspan>; A-G’s</text><text x="593" y="303" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Ref No 2 of 1983). <tspan font-weight="700" fill="#1e2a44">No</tspan> <tspan font-weight="700" fill="#1e2a44">duty</tspan> <tspan font-weight="700" fill="#1e2a44">to</tspan> <tspan font-weight="700" fill="#1e2a44">retreat</tspan></text><text x="593" y="323" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">(<tspan font-style="italic">Bird</tspan>)</text><line x1="554" y1="197" x2="576" y2="197" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="290" y1="344" x2="290" y2="364" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="302" y="358" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">yes</text><rect x="30" y="380" width="520" height="146" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="408" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">QUESTION 2</text><text x="46" y="434.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Was the degree of force reasonable?</text><text x="46" y="463.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Objective, but in the circumstances as he believed them</text><text x="46" y="484.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(s76(3)). <tspan font-weight="700" fill="#1e2a44">Disproportionate</tspan> <tspan font-weight="700" fill="#1e2a44">force</tspan> <tspan font-weight="700" fill="#1e2a44">is</tspan> <tspan font-weight="700" fill="#1e2a44">not</tspan> <tspan font-weight="700" fill="#1e2a44">reasonable</tspan> (s76(6)).</text><text x="46" y="505.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Heat of the moment allowed for (s76(7); <tspan font-style="italic">Palmer</tspan>)</text><rect x="580" y="380" width="290" height="93" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="593" y="405" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">HOUSEHOLDER, s76(5A)</text><text x="593" y="436" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Unreasonable only if <tspan font-weight="700" fill="#1e2a44">grossly</tspan></text><text x="593" y="456" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">disproportionate (<tspan font-style="italic">Collins</tspan>, 2016)</text><rect x="580" y="483" width="290" height="73" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="593" y="508" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CHARACTERISTICS IRRELEVANT</text><text x="593" y="539" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Martin</tspan> <tspan font-style="italic">(Anthony)</tspan> (2001); <tspan font-style="italic">Oye</tspan> (2013)</text><line x1="554" y1="453" x2="576" y2="453" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="160" y1="560" x2="160" y2="580" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="470" y1="560" x2="560" y2="580" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><text x="172" y="574" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">yes</text><text x="458" y="578" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">no to either</text><rect x="30" y="596" width="410" height="122" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="626.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Complete defence</text><text x="235" y="655.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Covers any offence of force, including murder</text><rect x="460" y="596" width="410" height="122" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="665" y="626.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">No defence at all</text><text x="665" y="655.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-style="italic">Clegg</tspan> (1995): fourth shot at a car that had</text><text x="665" y="676.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">passed: murder. No partial defence for excessive</text><text x="665" y="697.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">force</text>
</svg>