<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 675" width="900" height="675" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="675" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: Zac drives through red lights</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">An armed man threatens to shoot Zac’s girlfriend unless Zac drives him to a bank</text>
<rect x="30" y="124" width="176" height="50" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="118" y="155" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Defence</text><rect x="220" y="124" width="560" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="232" y="153.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Duress by threats: a person demands the offence</text><circle cx="826" cy="149" r="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="826" y="156" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><rect x="30" y="182" width="176" height="50" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="118" y="213" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Threat</text><rect x="220" y="182" width="560" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="232" y="211.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Death of his girlfriend, someone he is responsible for (<tspan font-style="italic">Hasan</tspan>)</text><circle cx="826" cy="207" r="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="826" y="214" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><rect x="30" y="240" width="176" height="50" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="118" y="271" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Nominated</text><rect x="220" y="240" width="560" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="232" y="269.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The threat is linked to the driving offence (<tspan font-style="italic">Cole</tspan>)</text><circle cx="826" cy="265" r="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="826" y="272" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><rect x="30" y="298" width="176" height="50" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="118" y="329" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Immediacy</text><rect x="220" y="298" width="560" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="232" y="327.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Gun present; no realistic chance to go to the police (<tspan font-style="italic">Hasan</tspan>)</text><circle cx="826" cy="323" r="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="826" y="330" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><rect x="30" y="356" width="176" height="62" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="118" y="393" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Graham test</text><rect x="220" y="356" width="560" height="62" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="232" y="380.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Reasonable belief; a sober person of reasonable firmness would do</text><text x="232" y="401.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the same (<tspan font-style="italic">Graham</tspan>)</text><circle cx="826" cy="387" r="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="826" y="394" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><rect x="30" y="426" width="176" height="50" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="118" y="457" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Association</text><rect x="220" y="426" width="560" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="232" y="455.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Never met the man: no voluntary association (<tspan font-style="italic">Hasan</tspan>)</text><circle cx="826" cy="451" r="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="826" y="458" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><rect x="30" y="484" width="176" height="50" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="118" y="515" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Offence</text><rect x="220" y="484" width="560" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="232" y="513.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A driving offence, not murder (<tspan font-style="italic">Howe</tspan>)</text><circle cx="826" cy="509" r="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="826" y="516" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><rect x="30" y="552" width="840" height="91" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="586.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Conclusion</text><text x="50" y="617.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Duress is likely to succeed: acquittal.</text>
</svg>