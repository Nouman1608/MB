<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 666" width="900" height="666" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="666" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Choosing a hypothesis</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Aim: to investigate whether doodling affects recall of a telephone message</text>
<rect x="30" y="124" width="410" height="154" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NULL HYPOTHESIS</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">No difference (or no relationship)</text><text x="50" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"There will be no difference in the number of</text><text x="50" y="232.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">names recalled by participants who doodle and</text><text x="50" y="253.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">those who do not."</text><rect x="460" y="124" width="410" height="154" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="480" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ALTERNATIVE HYPOTHESIS</text><text x="480" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Predicts a difference or relationship</text><text x="480" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Two versions, below.</text><line x1="580" y1="284" x2="470" y2="328" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="760" y1="284" x2="738" y2="328" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="330" y="348" width="263" height="153" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="350" y="380" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">DIRECTIONAL</text><text x="350" y="406.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">One-tailed</text><text x="350" y="434.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"Participants who doodle will</text><text x="350" y="455.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">recall <tspan font-weight="700" fill="#1e2a44">more</tspan> names than</text><text x="350" y="476.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">those who do not."</text><rect x="607" y="348" width="263" height="153" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="627" y="380" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">NON-DIRECTIONAL</text><text x="627" y="406.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Two-tailed</text><text x="627" y="434.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"There will be <tspan font-weight="700" fill="#1e2a44">a</tspan> <tspan font-weight="700" fill="#1e2a44">difference</tspan> in</text><text x="627" y="455.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the number of names</text><text x="627" y="476.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">recalled…"</text><rect x="30" y="523" width="840" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="557.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Which one?</text><text x="50" y="587.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Use a <tspan font-weight="700" fill="#1e2a44">directional</tspan> hypothesis when previous research suggests which way the result will go. A</text><text x="50" y="609.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">good hypothesis includes <tspan font-weight="700" fill="#1e2a44">both</tspan> <tspan font-weight="700" fill="#1e2a44">operationalised</tspan> <tspan font-weight="700" fill="#1e2a44">variables</tspan>.</text>
</svg>