<rect width="900" height="597" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Which graph?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Shapes are illustrative</text>
<rect x="30" y="124" width="270" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165" y="160" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Bar chart</text><text x="165" y="184" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">separate categories</text><line x1="70" y1="374" x2="275" y2="374" stroke="#1e2a44" stroke-width="2.5"/><line x1="70" y1="374" x2="70" y2="209" stroke="#1e2a44" stroke-width="2.5"/><rect x="95" y="244" width="50" height="130" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><rect x="185" y="294" width="50" height="80" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="120" y="394" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">A</text><text x="210" y="394" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">B</text><text x="50" y="414" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Gaps</tspan> between bars, e.g. mean</text><text x="50" y="434" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">score per condition.</text><rect x="315" y="124" width="270" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="160" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Histogram</text><text x="450" y="184" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">continuous data in intervals</text><line x1="355" y1="374" x2="560" y2="374" stroke="#1e2a44" stroke-width="2.5"/><line x1="355" y1="374" x2="355" y2="209" stroke="#1e2a44" stroke-width="2.5"/><rect x="345" y="324" width="32" height="50" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="377" y="284" width="32" height="90" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="409" y="244" width="32" height="130" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="441" y="264" width="32" height="110" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="473" y="304" width="32" height="70" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="505" y="334" width="32" height="40" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="335" y="414" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">No</tspan> <tspan font-weight="700">gaps</tspan>: frequency of</text><text x="335" y="434" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">continuous data.</text><rect x="600" y="124" width="270" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="735" y="160" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Scatter graph</text><text x="735" y="184" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">two co-variables</text><line x1="640" y1="374" x2="845" y2="374" stroke="#1e2a44" stroke-width="2.5"/><line x1="640" y1="374" x2="640" y2="209" stroke="#1e2a44" stroke-width="2.5"/><circle cx="660.5" cy="350" r="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><circle cx="681" cy="326" r="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><circle cx="701.5" cy="334" r="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><circle cx="722" cy="302" r="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><circle cx="742.5" cy="294" r="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><circle cx="763" cy="286" r="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><circle cx="783.5" cy="262" r="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><circle cx="804" cy="254" r="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><circle cx="824.5" cy="230" r="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><circle cx="711.75" cy="310" r="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><circle cx="773.25" cy="278" r="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="620" y="414" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Shows the <tspan font-weight="700">relationship</tspan></text><text x="620" y="434" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">between two co-variables.</text><rect x="30" y="476" width="840" height="89" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="510.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Common mistake</text><text x="450" y="540.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">A bar chart for continuous data, or a histogram for categories.</text>
</svg>