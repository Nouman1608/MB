2.5"/><circle cx="489" cy="272" r="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="515" cy="272" r="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="541" cy="272" r="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="359" cy="298" r="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="385" cy="298" r="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="411" cy="298" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="437" cy="298" r="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="463" cy="298" r="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="489" cy="298" r="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="515" cy="298" r="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="541" cy="298" r="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="359" cy="324" r="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="385" cy="324" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="411" cy="324" r="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="437" cy="324" r="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="463" cy="324" r="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="489" cy="324" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="515" cy="324" r="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="541" cy="324" r="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="333" y="372" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Every member has an equal</text><text x="333" y="392" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">chance, e.g. drawing names</text><text x="333" y="412" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">from a full list.</text><text x="333" y="454" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="start"><tspan font-weight="700">+</tspan> More likely to be</text><text x="333" y="474" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="start">representative.</text><text x="333" y="514" font-size="15" font-weight="400" fill="#b5602e" text-anchor="start"><tspan font-weight="700">−</tspan> Needs a complete list; chosen</text><text x="333" y="534" font-size="15" font-weight="400" fill="#b5602e" text-anchor="start">people may refuse.</text><text x="335" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RANDOM</text><text x="335" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Equal chance for all</text><rect x="600" y="124" width="270" height="450" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="644" cy="220" r="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="670" cy="220" r="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="696" cy="220" r="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="722" cy="220" r="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="748" cy="220" r="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="774" cy="220" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="800" cy="220" r="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="826" cy="220" r="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="644" cy="246" r="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="670" cy="246" r="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="696" cy="246" r="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="722" cy="246" r="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="748" cy="246" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="774" cy="246" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="800" cy="246" r="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="826" cy="246" r="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="644" cy="272" r="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="670" cy="272" r="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="696" cy="272" r="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="722" cy="272" r="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="748" cy="272" r="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="774" cy="272" r="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="800" cy="272" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="826" cy="272" r="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="644" cy="298" r="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="670" cy="298" r="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="696" cy="298" r="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="722" cy="298" r="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="748" cy="298" r="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="774" cy="298" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="800" cy="298" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="826" cy="298" r="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="644" cy="324" r="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="670" cy="324" r="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="696" cy="324" r="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="722" cy="324" r="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="748" cy="324" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="774" cy="324" r="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="800" cy="324" r="9" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="826" cy="324" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="618" y="372" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">People respond to an</text><text x="618" y="392" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">advertisement, e.g. Milgram's</text><text x="618" y="412" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">newspaper advert.</text><text x="618" y="454" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="start"><tspan font-weight="700">+</tspan> Easy to reach large numbers.</text><text x="618" y="514" font-size="15" font-weight="400" fill="#b5602e" text-anchor="start"><tspan font-weight="700">−</tspan> Volunteers may be more</text><text x="618" y="534" font-size="15" font-weight="400" fill="#b5602e" text-anchor="start">motivated or curious.</text><text x="620" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">VOLUNTEER</text><text x="620" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Self-selecting</text><rect x="30" y="596" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="630.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Generalisation</text><text x="50" y="659.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The more representative the sample, the more confidently findings can be applied beyond it. Random</text><text x="50" y="680.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">allocation</tspan> to conditions is not random <tspan font-weight="700" fill="#1e2a44">sampling</tspan>.</text>
