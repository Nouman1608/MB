y="387" r="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="414" cy="414" r="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="414" cy="387" r="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="414" cy="360" r="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="480" cy="414" r="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="546" cy="414" r="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><line x1="420.59999999999997" y1="344" x2="420.59999999999997" y2="432" stroke="#b5602e" stroke-width="3" stroke-dasharray="5 4"/><text x="414" y="452" font-size="17" font-weight="400" fill="#2e6b62" text-anchor="middle">▲</text><line x1="348" y1="466" x2="546" y2="466" stroke="#1e2a44" stroke-width="2.5"/><line x1="348" y1="459" x2="348" y2="473" stroke="#1e2a44" stroke-width="2.5"/><line x1="546" y1="459" x2="546" y2="473" stroke="#1e2a44" stroke-width="2.5"/><text x="170" y="498" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">mode 4</text><text x="290" y="498" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">median 4</text><text x="430" y="498" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">mean ≈ 4.1</text><text x="580" y="498" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">range 6 − 3 = 3</text><line x1="150" y1="529" x2="810" y2="529" stroke="#1e2a44" stroke-width="2"/><line x1="150" y1="524" x2="150" y2="534" stroke="#1e2a44" stroke-width="2"/><text x="150" y="554" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">0</text><line x1="216" y1="524" x2="216" y2="534" stroke="#1e2a44" stroke-width="2"/><text x="216" y="554" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">1</text><line x1="282" y1="524" x2="282" y2="534" stroke="#1e2a44" stroke-width="2"/><text x="282" y="554" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">2</text><line x1="348" y1="524" x2="348" y2="534" stroke="#1e2a44" stroke-width="2"/><text x="348" y="554" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">3</text><line x1="414" y1="524" x2="414" y2="534" stroke="#1e2a44" stroke-width="2"/><text x="414" y="554" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">4</text><line x1="480" y1="524" x2="480" y2="534" stroke="#1e2a44" stroke-width="2"/><text x="480" y="554" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">5</text><line x1="546" y1="524" x2="546" y2="534" stroke="#1e2a44" stroke-width="2"/><text x="546" y="554" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">6</text><line x1="612" y1="524" x2="612" y2="534" stroke="#1e2a44" stroke-width="2"/><text x="612" y="554" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">7</text><line x1="678" y1="524" x2="678" y2="534" stroke="#1e2a44" stroke-width="2"/><text x="678" y="554" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">8</text><line x1="744" y1="524" x2="744" y2="534" stroke="#1e2a44" stroke-width="2"/><text x="744" y="554" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">9</text><line x1="810" y1="524" x2="810" y2="534" stroke="#1e2a44" stroke-width="2"/><text x="810" y="554" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">10</text><rect x="30" y="596" width="495.6" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="628" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SPREAD</text><text x="50" y="659.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Doodling scores are <tspan font-weight="700" fill="#1e2a44">more</tspan> <tspan font-weight="700" fill="#1e2a44">spread</tspan> <tspan font-weight="700" fill="#1e2a44">out</tspan> (range 5 vs 3). A</text><text x="50" y="680.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">larger <tspan font-weight="700" fill="#1e2a44">standard</tspan> <tspan font-weight="700" fill="#1e2a44">deviation</tspan> also means scores vary more</text><text x="50" y="701.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">around the mean.</text><rect x="539.6" y="596" width="330.4" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="559.6" y="628" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NO CALCULATIONS REQUIRED</text><text x="559.6" y="659.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Recognise and interpret the mean;</text><text x="559.6" y="680.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">you will not have to calculate it.</text>
</svg>