<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="700" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Operationalising a study</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Does caffeine improve concentration?</text>
<rect x="30" y="124" width="380" height="155" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">INDEPENDENT VARIABLE (CHANGED)</text><text x="50" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Caffeine</text><text x="50" y="212.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Drinking 200 ml of coffee or 200 ml of</text><text x="50" y="233.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">decaffeinated coffee 30 minutes before the</text><text x="50" y="254.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">test</text><rect x="490" y="124" width="380" height="155" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="510" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DEPENDENT VARIABLE (MEASURED)</text><text x="510" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Concentration</text><text x="510" y="212.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Number of target letters crossed out in a</text><text x="510" y="233.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">two-minute letter-search task</text><line x1="416" y1="201.5" x2="484" y2="201.5" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="450" y="189.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">affects?</text><text x="450" y="313.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Operational definition: exactly how a variable is manipulated or measured, so another researcher could</text><text x="450" y="334.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">repeat it. "Stress" is not operationalised; "score on a 10-item stress questionnaire, 0 to 40" is.</text><text x="450" y="379" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">CONTROLS: KEEP EVERYTHING EXCEPT THE IV CONSTANT</text><rect x="30" y="405" width="270.6666666666667" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="437" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SITUATIONAL VARIABLE</text><text x="50" y="463.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Time of day</text><text x="50" y="491.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">test everyone at the same</text><text x="50" y="512.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">time of day</text><rect x="314.6666666666667" y="405" width="270.6666666666667" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334.6666666666667" y="437" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PARTICIPANT VARIABLE</text><text x="334.6666666666667" y="463.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Earlier caffeine</text><text x="334.6666666666667" y="491.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">ask participants not to drink</text><text x="334.6666666666667" y="512.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">caffeine beforehand</text><rect x="599.3333333333334" y="405" width="270.6666666666667" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="619.3333333333334" y="437" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STANDARDISATION</text><text x="619.3333333333334" y="463.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Same procedure</text><text x="619.3333333333334" y="491.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">same instructions, materials,</text><text x="619.3333333333334" y="512.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">timing and environment</text><rect x="30" y="559" width="840" height="109" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="593.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Confounding</text><text x="50" y="622.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">If an uncontrolled variable changes <tspan font-weight="700" fill="#1e2a44">systematically</tspan> <tspan font-weight="700" fill="#1e2a44">with</tspan> <tspan font-weight="700" fill="#1e2a44">the</tspan> <tspan font-weight="700" fill="#1e2a44">IV</tspan>, you cannot tell what caused the change</text><text x="50" y="643.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">in the DV.</text>
</svg>