<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="660" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Birth rates: children per woman</text>

<rect x="30" y="110" width="840" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="100" y="175" width="277.2" height="62" fill="#f2e7b8"/><rect x="377.2" y="175" width="382.8" height="62" fill="#dce9e7"/><text x="238.6" y="200" font-size="16.5" font-weight="600" fill="#8a6d0d" text-anchor="middle">below 2.1: eventually</text><text x="238.6" y="222" font-size="16.5" font-weight="600" fill="#8a6d0d" text-anchor="middle">shrinks (without migration)</text><text x="568.6" y="212" font-size="16.5" font-weight="600" fill="#2e6b62" text-anchor="middle">above 2.1: population tends to grow</text><line x1="100" y1="250" x2="760" y2="250" stroke="#1e2a44" stroke-width="3"/><line x1="100" y1="250" x2="100" y2="258" stroke="#1e2a44" stroke-width="2.5"/><text x="100" y="278" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">0</text><line x1="232" y1="250" x2="232" y2="258" stroke="#1e2a44" stroke-width="2.5"/><text x="232" y="278" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">1</text><line x1="364" y1="250" x2="364" y2="258" stroke="#1e2a44" stroke-width="2.5"/><text x="364" y="278" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">2</text><line x1="496" y1="250" x2="496" y2="258" stroke="#1e2a44" stroke-width="2.5"/><text x="496" y="278" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">3</text><line x1="628" y1="250" x2="628" y2="258" stroke="#1e2a44" stroke-width="2.5"/><text x="628" y="278" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">4</text><line x1="760" y1="250" x2="760" y2="258" stroke="#1e2a44" stroke-width="2.5"/><text x="760" y="278" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">5</text><line x1="377.2" y1="160" x2="377.2" y2="250" stroke="#1e2a44" stroke-width="4"/><circle cx="377.2" cy="250" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="377.2" y="152" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">about 2.1 = replacement level</text><text x="774" y="256" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">children</text><text x="774" y="274" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">per woman</text><rect x="30" y="330" width="410" height="300" rx="14" fill="#fbf6e2" stroke="#8a6d0d" stroke-width="2.5"/><text x="58" y="368" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Fertility tends to be HIGH where…</text><text x="58" y="402" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="74" y="402" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">many children die young, so parents</text><text x="74" y="424" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">have more to ensure some survive</text><text x="58" y="454" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="74" y="454" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">children work on farms or support</text><text x="74" y="476" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">parents in old age</text><text x="58" y="506" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="74" y="506" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">contraception hard to obtain or not</text><text x="74" y="528" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">accepted</text><text x="58" y="558" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="74" y="558" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">girls leave education early and marry</text><text x="74" y="580" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">young</text><text x="58" y="610" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="74" y="610" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">traditions value large families</text><rect x="460" y="330" width="410" height="300" rx="14" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="488" y="368" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Fertility tends to be LOW where…</text><text x="498" y="402" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="514" y="402" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">children are expensive to raise and</text><text x="514" y="424" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">educate</text><text x="498" y="454" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="514" y="454" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">women stay longer in education and have</text><text x="514" y="476" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">careers</text><text x="498" y="506" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="514" y="506" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">contraception widely available</text><text x="498" y="536" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="514" y="536" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">people marry and start families later</text><text x="498" y="566" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="514" y="566" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">pensions and healthcare: parents do not</text><text x="514" y="588" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">rely on children in old age</text>
</svg>