<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 715" width="900" height="715" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="715" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Death rates: life expectancy</text>

<rect x="30" y="110" width="410" height="220" rx="14" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="58" y="148" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Life expectancy RISES,</text><text x="58" y="172" font-size="18" font-weight="600" fill="#2e6b62" text-anchor="start">death rate falls, with:</text><text x="58" y="208" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="74" y="208" font-size="17.5" font-weight="400" fill="#1e2a44" text-anchor="start">better healthcare and vaccination</text><text x="58" y="239" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="74" y="239" font-size="17.5" font-weight="400" fill="#1e2a44" text-anchor="start">clean water and sanitation</text><text x="58" y="270" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="74" y="270" font-size="17.5" font-weight="400" fill="#1e2a44" text-anchor="start">a reliable food supply</text><text x="58" y="301" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="74" y="301" font-size="17.5" font-weight="400" fill="#1e2a44" text-anchor="start">safer housing and working conditions</text><rect x="460" y="110" width="410" height="220" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="488" y="148" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Life expectancy FALLS,</text><text x="488" y="172" font-size="18" font-weight="600" fill="#b5602e" text-anchor="start">death rate rises, with:</text><text x="488" y="208" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="504" y="208" font-size="17.5" font-weight="400" fill="#1e2a44" text-anchor="start">famine</text><text x="488" y="239" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="504" y="239" font-size="17.5" font-weight="400" fill="#1e2a44" text-anchor="start">war</text><text x="488" y="270" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="504" y="270" font-size="17.5" font-weight="400" fill="#1e2a44" text-anchor="start">epidemics</text><text x="488" y="301" font-size="17.5" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="504" y="301" font-size="17.5" font-weight="400" fill="#1e2a44" text-anchor="start">poverty</text><rect x="30" y="350" width="840" height="340" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="120" y1="395" x2="120" y2="615" stroke="#1e2a44" stroke-width="3"/><line x1="120" y1="615" x2="680" y2="615" stroke="#1e2a44" stroke-width="3"/><text x="106" y="505" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">rate</text><text x="680" y="643" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">time →</text><path d="M120,425 C320,427 520,445 680,465 L680,585 C370,570 270,455 120,440 Z" fill="#f2e7b8" opacity="0.9"/><path d="M120,425 C320,427 520,445 680,465" fill="none" stroke="#8a6d0d" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M120,440 C270,455 370,570 680,585" fill="none" stroke="#b5602e" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" /><text x="692" y="471" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">birth rate</text><text x="692" y="585" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">death rate</text><text x="692" y="607" font-size="16" font-weight="400" fill="#b5602e" text-anchor="start">falls faster</text><rect x="388.4" y="507.8" width="223.2" height="21.6" rx="5" fill="#f2e7b8" opacity="0.92"/><text x="500" y="523" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">gap = natural increase</text><text x="450" y="674" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">When death rates fall faster than birth rates, populations grow quickly.</text><text x="840" y="378" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">schematic</text>
</svg>