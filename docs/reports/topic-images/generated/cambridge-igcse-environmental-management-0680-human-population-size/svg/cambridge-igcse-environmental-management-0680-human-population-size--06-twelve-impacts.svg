<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 775" width="900" height="775" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="775" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Twelve impacts of population growth</text>

<text x="30" y="130" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Where people live</text><rect x="30" y="144" width="266" height="96" rx="12" fill="#fbf6e2" stroke="#8a6d0d" stroke-width="2.5"/><text x="44" y="174" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Informal settlements</text><text x="44" y="197" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">scrap-built homes, often on</text><text x="44" y="216" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">steep slopes or floodplains</text><rect x="317" y="144" width="266" height="96" rx="12" fill="#fbf6e2" stroke="#8a6d0d" stroke-width="2.5"/><text x="331" y="174" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Megacities</text><text x="331" y="197" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">cities of more than</text><text x="331" y="216" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">10 million people</text><rect x="604" y="144" width="266" height="96" rx="12" fill="#fbf6e2" stroke="#8a6d0d" stroke-width="2.5"/><text x="618" y="174" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Availability of land</text><text x="618" y="197" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">farmland and natural</text><text x="618" y="216" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">habitats are built over</text><text x="30" y="272" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Resources and services</text><rect x="30" y="286" width="266" height="96" rx="12" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="316" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Resources</text><text x="44" y="339" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">more demand for food,</text><text x="44" y="358" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">timber, minerals and fuel</text><rect x="317" y="286" width="266" height="96" rx="12" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="331" y="316" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Energy usage</text><text x="331" y="339" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">more homes, transport</text><text x="331" y="358" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">and industry</text><rect x="604" y="286" width="266" height="96" rx="12" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="618" y="316" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Water supply</text><text x="618" y="339" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">demand can exceed rivers,</text><text x="618" y="358" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">reservoirs and aquifers</text><rect x="30" y="394" width="266" height="96" rx="12" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="424" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Sanitation</text><text x="44" y="447" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">sewage enters rivers</text><text x="44" y="466" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">and spreads disease</text><rect x="317" y="394" width="266" height="96" rx="12" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="331" y="424" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Management of waste</text><text x="331" y="447" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">more waste than can be</text><text x="331" y="466" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">collected: dumped or burned</text><rect x="604" y="394" width="266" height="96" rx="12" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="618" y="424" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Facilities, infrastructure</text><text x="618" y="447" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">schools, hospitals, roads and</text><text x="618" y="466" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">transport overcrowded</text><text x="30" y="522" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Environment and economy</text><rect x="30" y="536" width="266" height="96" rx="12" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="44" y="566" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Pollution (six types)</text><text x="44" y="589" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">air, land, light, noise,</text><text x="44" y="608" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">visual and water</text><rect x="317" y="536" width="266" height="96" rx="12" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="331" y="566" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Traffic congestion</text><text x="331" y="589" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">delays, accidents and</text><text x="331" y="608" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">air pollution</text><rect x="604" y="536" width="266" height="96" rx="12" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="618" y="566" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Employment</text><text x="618" y="589" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">new jobs, but unemployment if</text><text x="618" y="608" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">workers outgrow the jobs</text><text x="450" y="682" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Link impacts to the environment, for example:</text><rect x="70" y="700" width="230" height="46" rx="23" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="185" y="729.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">population growth</text><line x1="304" y1="723" x2="352" y2="723" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="358" y="700" width="180" height="46" rx="23" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="448" y="729.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">more waste</text><line x1="542" y1="723" x2="590" y2="723" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="596" y="700" width="234" height="46" rx="23" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="713" y="728.94" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">land and water pollution</text>
</svg>