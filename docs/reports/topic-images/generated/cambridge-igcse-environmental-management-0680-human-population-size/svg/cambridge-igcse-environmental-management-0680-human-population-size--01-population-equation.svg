<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="700" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three ways a population changes</text>

<rect x="350" y="205" width="200" height="185" fill="#b5d3cf"/><line x1="350" y1="205" x2="550" y2="205" stroke="#2e6b62" stroke-width="2.5"/><path d="M350,150 L350,390 L550,390 L550,150" fill="none" stroke="#1e2a44" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><circle cx="392" cy="259.4" r="6.3" fill="#2e6b62"/><path d="M383.9,290 L383.9,275.6 Q383.9,267.5 392,267.5 Q400.1,267.5 400.1,275.6 L400.1,290 Z" fill="#2e6b62"/><circle cx="421" cy="259.4" r="6.3" fill="#2e6b62"/><path d="M412.9,290 L412.9,275.6 Q412.9,267.5 421,267.5 Q429.1,267.5 429.1,275.6 L429.1,290 Z" fill="#2e6b62"/><circle cx="450" cy="259.4" r="6.3" fill="#2e6b62"/><path d="M441.9,290 L441.9,275.6 Q441.9,267.5 450,267.5 Q458.1,267.5 458.1,275.6 L458.1,290 Z" fill="#2e6b62"/><circle cx="479" cy="259.4" r="6.3" fill="#2e6b62"/><path d="M470.9,290 L470.9,275.6 Q470.9,267.5 479,267.5 Q487.1,267.5 487.1,275.6 L487.1,290 Z" fill="#2e6b62"/><circle cx="508" cy="259.4" r="6.3" fill="#2e6b62"/><path d="M499.9,290 L499.9,275.6 Q499.9,267.5 508,267.5 Q516.1,267.5 516.1,275.6 L516.1,290 Z" fill="#2e6b62"/><text x="450" y="330" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Population</text><text x="450" y="356" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">of a place</text><text x="155" y="136" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">IN: adds people</text><text x="745" y="136" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">OUT: removes people</text><rect x="40" y="160" width="230" height="88" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="58" y="195.85" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Births</text><text x="58" y="221.42499999999998" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">people are born</text><line x1="274" y1="204" x2="342" y2="204" stroke="#2e6b62" stroke-width="6" marker-end="url(#ahT)"/><rect x="40" y="290" width="230" height="88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="58" y="325.85" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Immigrants</text><text x="58" y="351.425" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">people move in</text><line x1="274" y1="334" x2="342" y2="334" stroke="#8a6d0d" stroke-width="6" marker-end="url(#ahO)"/><rect x="630" y="160" width="230" height="88" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="648" y="195.85" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Deaths</text><text x="648" y="221.42499999999998" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">people die</text><line x1="556" y1="204" x2="624" y2="204" stroke="#2e6b62" stroke-width="6" marker-end="url(#ahT)"/><rect x="630" y="290" width="230" height="88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="648" y="325.85" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Emigrants</text><text x="648" y="351.425" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="start">people move out</text><line x1="556" y1="334" x2="624" y2="334" stroke="#8a6d0d" stroke-width="6" marker-end="url(#ahO)"/><rect x="40" y="430" width="380" height="110" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="230" y="466.7" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Natural change</text><text x="230" y="497.7" font-size="20" font-weight="400" fill="#1e2a44" text-anchor="middle">births − deaths</text><rect x="480" y="430" width="380" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="670" y="466.7" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Net migration</text><text x="670" y="497.7" font-size="20" font-weight="400" fill="#1e2a44" text-anchor="middle">immigrants − emigrants</text><text x="450" y="498" font-size="40" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><line x1="230" y1="546" x2="230" y2="584" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="670" y1="546" x2="670" y2="584" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="40" y="590" width="820" height="80" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="628" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Population change = (births − deaths) + (immigrants − emigrants)</text><text x="450" y="655" font-size="16.5" font-weight="400" fill="#4a5568" text-anchor="middle">Every factor in 7.2.1 works through one of the two brackets.</text>
</svg>