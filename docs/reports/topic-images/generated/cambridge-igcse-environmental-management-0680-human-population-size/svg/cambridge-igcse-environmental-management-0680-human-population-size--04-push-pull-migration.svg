<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="650" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Migration: push and pull factors</text>

<rect x="30" y="110" width="330" height="360" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="195" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Place people leave</text><text x="195" y="170" font-size="16.5" font-weight="600" fill="#b5602e" text-anchor="middle">emigration = leaving</text><text x="56" y="210" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">PUSH factors drive people away</text><text x="56" y="242" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="72" y="242" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">unemployment</text><text x="56" y="268" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="72" y="268" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">poverty</text><text x="56" y="294" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="72" y="294" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">war</text><text x="56" y="320" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="72" y="320" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">persecution</text><text x="56" y="346" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="72" y="346" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">natural hazards</text><text x="56" y="372" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="72" y="372" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">drought</text><text x="56" y="398" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="72" y="398" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">lack of services</text><rect x="540" y="110" width="330" height="360" rx="14" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="705" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Place people go to</text><text x="705" y="170" font-size="16.5" font-weight="600" fill="#2e6b62" text-anchor="middle">immigration = arriving</text><text x="566" y="210" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">PULL factors attract people</text><text x="566" y="242" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="582" y="242" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">jobs</text><text x="566" y="268" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="582" y="268" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">higher wages</text><text x="566" y="294" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="582" y="294" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">safety</text><text x="566" y="320" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="582" y="320" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">better healthcare and</text><text x="582" y="342" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">education</text><text x="566" y="368" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="582" y="368" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">family already living there</text><line x1="368" y1="300" x2="530" y2="300" stroke="#1e2a44" stroke-width="9" marker-end="url(#ah)"/><circle cx="415" cy="244" r="7" fill="#1e2a44"/><path d="M406,278 L406,262 Q406,253 415,253 Q424,253 424,262 L424,278 Z" fill="#1e2a44"/><circle cx="449" cy="244" r="7" fill="#1e2a44"/><path d="M440,278 L440,262 Q440,253 449,253 Q458,253 458,262 L458,278 Z" fill="#1e2a44"/><circle cx="483" cy="244" r="7" fill="#1e2a44"/><path d="M474,278 L474,262 Q474,253 483,253 Q492,253 492,262 L492,278 Z" fill="#1e2a44"/><text x="450" y="340" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="middle">migrants:</text><text x="450" y="362" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">most often</text><text x="450" y="383" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">young working-</text><text x="450" y="404" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">age adults</text><rect x="30" y="490" width="400" height="98" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="524.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Origin</text><text x="48" y="550.5" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">working-age population falls</text><rect x="470" y="490" width="400" height="98" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="488" y="524.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Destination</text><text x="488" y="550.5" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">working-age population rises, and so do</text><text x="488" y="572.94" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">future births</text><text x="450" y="622" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Migration changes the structure as well as the size of both populations.</text>
</svg>