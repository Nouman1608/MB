<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: one year in a city</text>

<rect x="30" y="110" width="840" height="450" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="130" y1="480" x2="845" y2="480" stroke="#1e2a44" stroke-width="3"/><line x1="130" y1="480" x2="130" y2="160" stroke="#1e2a44" stroke-width="3"/><line x1="122" y1="480" x2="130" y2="480" stroke="#1e2a44" stroke-width="2.5"/><text x="116" y="486" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">0</text><line x1="122" y1="430" x2="130" y2="430" stroke="#1e2a44" stroke-width="2.5"/><text x="116" y="436" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">10</text><line x1="132" y1="430" x2="845" y2="430" stroke="#e3e9e8" stroke-width="1.5"/><line x1="122" y1="380" x2="130" y2="380" stroke="#1e2a44" stroke-width="2.5"/><text x="116" y="386" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">20</text><line x1="132" y1="380" x2="845" y2="380" stroke="#e3e9e8" stroke-width="1.5"/><line x1="122" y1="330" x2="130" y2="330" stroke="#1e2a44" stroke-width="2.5"/><text x="116" y="336" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">30</text><line x1="132" y1="330" x2="845" y2="330" stroke="#e3e9e8" stroke-width="1.5"/><line x1="122" y1="280" x2="130" y2="280" stroke="#1e2a44" stroke-width="2.5"/><text x="116" y="286" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">40</text><line x1="132" y1="280" x2="845" y2="280" stroke="#e3e9e8" stroke-width="1.5"/><line x1="122" y1="230" x2="130" y2="230" stroke="#1e2a44" stroke-width="2.5"/><text x="116" y="236" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">50</text><line x1="132" y1="230" x2="845" y2="230" stroke="#e3e9e8" stroke-width="1.5"/><line x1="122" y1="180" x2="130" y2="180" stroke="#1e2a44" stroke-width="2.5"/><text x="116" y="186" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">60</text><line x1="132" y1="180" x2="845" y2="180" stroke="#e3e9e8" stroke-width="1.5"/><text x="58" y="330" font-size="16" fill="#4a5568" text-anchor="middle" transform="rotate(-90 58 330)">people (thousands)</text><rect x="160" y="180" width="80" height="300" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="200" y="170" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">+60,000</text><text x="200" y="506" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Births</text><line x1="240" y1="180" x2="276" y2="180" stroke="#4a5568" stroke-width="2" stroke-dasharray="5 4"/><rect x="276" y="180" width="80" height="100" fill="#e9c2a8" stroke="#1e2a44" stroke-width="2.5"/><text x="316" y="170" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">−20,000</text><text x="316" y="506" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Deaths</text><line x1="356" y1="280" x2="392" y2="280" stroke="#4a5568" stroke-width="2" stroke-dasharray="5 4"/><rect x="392" y="280" width="80" height="200" fill="#2e6b62" stroke="#1e2a44" stroke-width="2.5"/><text x="432" y="270" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">+40,000</text><text x="432" y="506" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Natural</text><text x="432" y="526" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">change</text><line x1="472" y1="280" x2="508" y2="280" stroke="#4a5568" stroke-width="2" stroke-dasharray="5 4"/><rect x="508" y="205" width="80" height="75" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="548" y="195" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">+15,000</text><text x="548" y="506" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Immigrants</text><line x1="588" y1="205" x2="624" y2="205" stroke="#4a5568" stroke-width="2" stroke-dasharray="5 4"/><rect x="624" y="205" width="80" height="25" fill="#e9c2a8" stroke="#1e2a44" stroke-width="2.5"/><text x="664" y="195" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">−5,000</text><text x="664" y="506" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Emigrants</text><line x1="704" y1="230" x2="740" y2="230" stroke="#4a5568" stroke-width="2" stroke-dasharray="5 4"/><rect x="740" y="230" width="80" height="250" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="780" y="220" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">+50,000</text><text x="780" y="506" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Total</text><text x="780" y="526" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">change</text><text x="840" y="140" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">invented data: a city of 2,000,000</text><rect x="30" y="580" width="840" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="620" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Growth = 50,000 ÷ 2,000,000 × 100 = 2.5% in the year</text><text x="60" y="652" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Share from natural change = 40,000 ÷ 50,000 × 100 = 80%</text><text x="60" y="684" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Work out natural change and net migration first, then combine.</text>
</svg>