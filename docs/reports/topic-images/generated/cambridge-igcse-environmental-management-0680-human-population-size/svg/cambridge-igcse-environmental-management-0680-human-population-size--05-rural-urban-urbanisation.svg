"8" height="10" fill="#b5d3cf"/><rect x="773" y="256" width="8" height="10" fill="#b5d3cf"/><rect x="795" y="180" width="40" height="100" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><rect x="804" y="192" width="8" height="10" fill="#b5d3cf"/><rect x="818" y="192" width="8" height="10" fill="#b5d3cf"/><rect x="804" y="214" width="8" height="10" fill="#b5d3cf"/><rect x="818" y="214" width="8" height="10" fill="#b5d3cf"/><rect x="804" y="236" width="8" height="10" fill="#b5d3cf"/><rect x="818" y="236" width="8" height="10" fill="#b5d3cf"/><rect x="804" y="258" width="8" height="10" fill="#b5d3cf"/><rect x="818" y="258" width="8" height="10" fill="#b5d3cf"/><text x="700" y="142" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Town or city</text><line x1="330" y1="215" x2="535" y2="215" stroke="#1e2a44" stroke-width="9" marker-end="url(#ah)"/><text x="432" y="196" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">rural-urban</text><text x="432" y="248" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">migration</text><rect x="30" y="320" width="400" height="165" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="354.15" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Rural PUSH factors</text><text x="48" y="380.5" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• low farm incomes</text><text x="48" y="402.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• few jobs</text><text x="48" y="425.38" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• poor services</text><text x="48" y="447.82" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• land degraded by drought or erosion</text><rect x="470" y="320" width="400" height="165" rx="14" fill="#eef5f4" stroke="#2e6b62" stroke-width="2.5"/><text x="488" y="354.15" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Urban PULL factors</text><text x="488" y="380.5" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• factory, service and informal jobs</text><text x="488" y="402.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• schools and hospitals</text><text x="488" y="425.38" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• the perception of a better life</text><rect x="30" y="505" width="840" height="200" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="543" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Urbanisation = an increase in the PROPORTION of a country’s</text><text x="60" y="569" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">population living in urban areas. It happens through:</text><rect x="60" y="591" width="330" height="46" rx="23" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="225" y="620.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">rural-urban migration</text><text x="425" y="622" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><rect x="460" y="591" width="380" height="46" rx="23" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="650" y="620.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">natural increase in cities</text><text x="650" y="665" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">often high: migrants are young adults</text><text x="650" y="686" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">who start families there</text>
</svg>