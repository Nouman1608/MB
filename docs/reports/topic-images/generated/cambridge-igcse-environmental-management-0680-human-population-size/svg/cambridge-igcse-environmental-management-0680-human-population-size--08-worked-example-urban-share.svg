<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="700" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: is the country urbanising?</text>

<rect x="30" y="110" width="480" height="560" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="120" y1="590" x2="490" y2="590" stroke="#1e2a44" stroke-width="3"/><line x1="120" y1="590" x2="120" y2="170" stroke="#1e2a44" stroke-width="3"/><line x1="112" y1="590" x2="120" y2="590" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="596" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">0</text><line x1="112" y1="530" x2="120" y2="530" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="536" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">2</text><line x1="112" y1="470" x2="120" y2="470" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="476" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">4</text><line x1="112" y1="410" x2="120" y2="410" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="416" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">6</text><line x1="112" y1="350" x2="120" y2="350" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="356" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">8</text><line x1="112" y1="290" x2="120" y2="290" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="296" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">10</text><line x1="112" y1="230" x2="120" y2="230" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="236" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">12</text><line x1="112" y1="170" x2="120" y2="170" stroke="#1e2a44" stroke-width="2.5"/><text x="106" y="176" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">14</text><text x="58" y="380" font-size="16" fill="#4a5568" text-anchor="middle" transform="rotate(-90 58 380)">population (millions)</text><rect x="165" y="482" width="120" height="108" fill="#2e6b62" stroke="#1e2a44" stroke-width="2.5"/><rect x="165" y="320" width="120" height="162" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="225" y="534" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3.6 m</text><text x="225" y="556" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">40%</text><text x="225" y="407" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">5.4 m</text><text x="225" y="308" font-size="16.5" font-weight="600" fill="#1e2a44" text-anchor="middle">total 9.0 m</text><text x="225" y="618" font-size="16.5" font-weight="600" fill="#1e2a44" text-anchor="middle">First census</text><rect x="335" y="401" width="120" height="189" fill="#2e6b62" stroke="#1e2a44" stroke-width="2.5"/><rect x="335" y="212" width="120" height="189" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="395" y="493.5" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">6.3 m</text><text x="395" y="515.5" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">50%</text><text x="395" y="312.5" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">6.3 m</text><text x="395" y="200" font-size="16.5" font-weight="600" fill="#1e2a44" text-anchor="middle">total 12.6 m</text><text x="395" y="618" font-size="16.5" font-weight="600" fill="#1e2a44" text-anchor="middle">Second census</text><rect x="140" y="130" width="20" height="20" rx="3" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="168" y="146" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">urban</text><rect x="250" y="130" width="20" height="20" rx="3" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="278" y="146" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rural</text><text x="490" y="146" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">invented data</text><rect x="530" y="110" width="340" height="560" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="556" y="150" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Urban share</text><text x="556" y="188" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">3.6 m ÷ 9.0 m × 100</text><text x="556" y="214" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">= 40%</text><text x="556" y="262" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">6.3 m ÷ 12.6 m × 100</text><text x="556" y="288" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">= 50%</text><rect x="556" y="320" width="290" height="60" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="701" y="357" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">40% → 50%: urbanising</text><text x="556" y="418" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The rural population also grew,</text><text x="556" y="440" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">from 5.4 m to 6.3 m.</text><text x="556" y="490" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Urbanisation is about the</text><text x="556" y="512" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">proportion living in urban</text><text x="556" y="534" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">areas, not about rural areas</text><text x="556" y="556" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">emptying.</text>
</svg>