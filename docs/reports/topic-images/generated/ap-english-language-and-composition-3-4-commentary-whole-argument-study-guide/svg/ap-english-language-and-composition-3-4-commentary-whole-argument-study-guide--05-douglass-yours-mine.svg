<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 623" width="900" height="623" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="623" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">“Yours, not mine”</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Douglass, Rochester, 5 July 1852</text>
<rect x="30" y="122" width="410" height="300" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><rect x="460" y="122" width="410" height="300" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="235" y="158" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle" xml:space="preserve">YOU (the audience)</text><text x="665" y="158" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">ME (the speaker)</text><text x="235" y="202" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“This Fourth July is yours,”</text><text x="665" y="202" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“not mine.”</text><line x1="410" y1="196" x2="490" y2="196" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="4 4"/><text x="235" y="258" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“You may rejoice,”</text><text x="665" y="258" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“I must mourn.”</text><line x1="410" y1="252" x2="490" y2="252" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="4 4"/><text x="235" y="314" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">inheritance “shared by you,”</text><text x="665" y="314" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“not by me.”</text><line x1="410" y1="308" x2="490" y2="308" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="4 4"/><text x="235" y="370" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">sunlight: “life and healing”</text><text x="665" y="370" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“stripes and death”</text><line x1="410" y1="364" x2="490" y2="364" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="4 4"/><rect x="30" y="446" width="269.3333333333333" height="146.88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="48" y="480" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Relevance</text><text x="48" y="508" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">The pronoun contrast claims</text><text x="48" y="529.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">the holiday does not include</text><text x="48" y="550.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">him.</text><rect x="315.3333333333333" y="446" width="269.3333333333333" height="146.88" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="333.3333333333333" y="480" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Significance</text><text x="333.3333333333333" y="508" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">One day, opposite meanings:</text><text x="333.3333333333333" y="529.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">the nation’s ideals contradict</text><text x="333.3333333333333" y="550.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">its practice.</text><rect x="600.6666666666666" y="446" width="269.3333333333333" height="146.88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="618.6666666666666" y="480" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Driving question</text><text x="618.6666666666666" y="508" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">What, to the slave, is the</text><text x="618.6666666666666" y="529.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Fourth of July? Each</text><text x="618.6666666666666" y="550.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">sentence answers it more</text><text x="618.6666666666666" y="571.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">fully.</text>
</svg>