<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 599" width="900" height="599" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="599" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Commentary at four levels, labelled</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Worked example 1: the library argument</text>
<rect x="30" y="122" width="840" height="53.120000000000005" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="450" y="153.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">Thesis:</tspan> The library is not a luxury but the one public place where people without money can belong.</text><rect x="30" y="192" width="600" height="41.120000000000005" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="42" y="217.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Opening hours matter most to those with the fewest alternatives.</text><text x="650" y="218.56" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Topic sentence</text><rect x="30" y="241.12" width="600" height="62.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="42" y="266.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">In the autumn survey, 118 of 200 teenagers said the library was the only</text><text x="42" y="287.84000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">quiet place they could work.</text><text x="650" y="278.24" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start" xml:space="preserve">Evidence</text><rect x="30" y="311.36" width="600" height="83.36000000000001" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="42" y="336.96000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">A quiet room is not a convenience to these students; it is the condition of</text><text x="42" y="358.08000000000004" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">doing homework at all, which means that every hour the doors are shut is</text><text x="42" y="379.20000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">an hour of study taken from them.</text><text x="650" y="359.04" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Evidence-level</text><rect x="30" y="402.72" width="600" height="41.120000000000005" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="42" y="428.32000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">The library’s hours therefore decide whether some pupils can keep up.</text><text x="650" y="429.28000000000003" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Paragraph-level</text><rect x="30" y="451.84000000000003" width="600" height="41.120000000000005" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5" /><text x="42" y="477.44000000000005" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">But if teenagers have no other place, who else does the same?</text><text x="650" y="478.40000000000003" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Bridge-level</text><rect x="30" y="512.96" width="840" height="74.24000000000001" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray="7 5"/><text x="450" y="544.5600000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">Check:</tspan> read only the teal commentary. If it still gives a clear path, the commentary is working across</text><text x="450" y="565.6800000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">the argument.</text>
</svg>