<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 652" width="900" height="652" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="652" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four levels of commentary</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Where each level sits in an argument</text>
<rect x="30" y="122" width="300" height="150" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="44" y="146" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start" xml:space="preserve">¶ body</text><rect x="30" y="312" width="300" height="150" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="44" y="336" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start" xml:space="preserve">¶ body</text><rect x="30" y="502" width="300" height="90" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><text x="44" y="526" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start" xml:space="preserve">Conclusion</text><rect x="44" y="162" width="260" height="10" rx="4" fill="#c9d6d4"/><rect x="44" y="180" width="200" height="10" rx="4" fill="#d4b02e"/><rect x="44" y="198" width="250" height="10" rx="4" fill="#b5d3cf"/><rect x="44" y="216" width="230" height="10" rx="4" fill="#b5d3cf"/><rect x="44" y="234" width="240" height="10" rx="4" fill="#2e6b62"/><rect x="44" y="252" width="150" height="10" rx="4" fill="#8a6d0d"/><rect x="44" y="352" width="260" height="10" rx="4" fill="#c9d6d4"/><rect x="44" y="370" width="210" height="10" rx="4" fill="#d4b02e"/><rect x="44" y="388" width="250" height="10" rx="4" fill="#b5d3cf"/><rect x="44" y="406" width="240" height="10" rx="4" fill="#2e6b62"/><rect x="44" y="532" width="260" height="10" rx="4" fill="#b5602e"/><rect x="44" y="550" width="220" height="10" rx="4" fill="#b5602e"/><rect x="44" y="568" width="160" height="10" rx="4" fill="#c9d6d4"/><rect x="400" y="122" width="470" height="107.16" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="400" y="122" width="10" height="107.16" rx="5" fill="#b5d3cf"/><text x="412" y="148.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Evidence-level</text><text x="412" y="174.51" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">right after a quotation, fact or example: explains what it</text><text x="412" y="194.31" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">shows</text><text x="412" y="214.10999999999999" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">“...more</tspan> <tspan font-style="italic">than</tspan> <tspan font-style="italic">half</tspan> <tspan font-style="italic">of</tspan> <tspan font-style="italic">the</tspan> <tspan font-style="italic">evening</tspan> <tspan font-style="italic">users</tspan> <tspan font-style="italic">have</tspan> <tspan font-style="italic">disappeared.”</tspan></text><line x1="310" y1="206" x2="396" y2="175.57999999999998" stroke="#b5d3cf" stroke-width="2.5"/><rect x="400" y="234" width="470" height="87.36000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="400" y="234" width="10" height="87.36000000000001" rx="5" fill="#2e6b62"/><text x="412" y="260.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Paragraph-level</text><text x="412" y="286.51" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">end of a paragraph: draws the point, ties it to the claim</text><text x="412" y="306.31" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">“The</tspan> <tspan font-style="italic">loss</tspan> <tspan font-style="italic">falls</tspan> <tspan font-style="italic">on</tspan> <tspan font-style="italic">those</tspan> <tspan font-style="italic">with</tspan> <tspan font-style="italic">no</tspan> <tspan font-style="italic">alternative.”</tspan></text><line x1="310" y1="239" x2="396" y2="277.68" stroke="#2e6b62" stroke-width="2.5"/><rect x="400" y="346" width="470" height="87.36000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="400" y="346" width="10" height="87.36000000000001" rx="5" fill="#8a6d0d"/><text x="412" y="372.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Bridge-level</text><text x="412" y="398.51" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">end of one paragraph or start of the next: shows the path</text><text x="412" y="418.31" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">“...the</tspan> <tspan font-style="italic">next</tspan> <tspan font-style="italic">question</tspan> <tspan font-style="italic">is</tspan> <tspan font-style="italic">why</tspan> <tspan font-style="italic">they</tspan> <tspan font-style="italic">have</tspan> <tspan font-style="italic">no</tspan> <tspan font-style="italic">alternative.”</tspan></text><line x1="310" y1="257" x2="396" y2="389.68" stroke="#8a6d0d" stroke-width="2.5"/><rect x="400" y="478" width="470" height="107.15999999999997" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><rect x="400" y="478" width="10" height="107.15999999999997" rx="5" fill="#b5602e"/><text x="412" y="504.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Thesis-level</text><text x="412" y="530.51" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">conclusion and key turns: shows how the steps add up</text><text x="412" y="550.31" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">“Taken</tspan> <tspan font-style="italic">together,</tspan> <tspan font-style="italic">these</tspan> <tspan font-style="italic">losses</tspan> <tspan font-style="italic">show</tspan> <tspan font-style="italic">that</tspan> <tspan font-style="italic">the</tspan> <tspan font-style="italic">library</tspan> <tspan font-style="italic">is</tspan> <tspan font-style="italic">not</tspan> <tspan font-style="italic">a</tspan></text><text x="412" y="570.11" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">luxury.”</tspan></text><line x1="310" y1="542" x2="396" y2="531.5799999999999" stroke="#b5602e" stroke-width="2.5"/><rect x="44" y="608" width="30" height="10" rx="4" fill="#d4b02e"/><text x="82" y="618" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">evidence</text>
</svg>