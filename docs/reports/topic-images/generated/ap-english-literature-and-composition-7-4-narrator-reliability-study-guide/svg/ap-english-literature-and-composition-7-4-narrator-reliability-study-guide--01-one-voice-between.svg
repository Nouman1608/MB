<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 527" width="900" height="527" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="527" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why reliability matters</text>

<rect x="30" y="130" width="220" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="140" y="181.1" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Events</text><text x="140" y="212.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">what happened</text><rect x="340" y="130" width="220" height="120" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="181.1" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Narrator</text><text x="450" y="212.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">one voice, or a few</text><rect x="650" y="130" width="220" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="760" y="181.1" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Reader</text><text x="760" y="212.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">our whole view</text><line x1="256" y1="190" x2="334" y2="190" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="566" y1="190" x2="644" y2="190" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><path d="M450,256 L450,280 L235,280 L235,314" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><path d="M450,280 L665,280 L665,314" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><text x="235" y="270" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">trustworthy</text><text x="665" y="270" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">not trustworthy</text><rect x="30" y="320" width="400" height="89" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="355.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Accept its picture</text><text x="230" y="384.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">We simply take the account as given</text><rect x="470" y="320" width="400" height="89" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="670" y="355.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Read between and against its words</text><text x="670" y="384.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">We weigh what it says against what it shows</text><rect x="30" y="433" width="840" height="64" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="472" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Reliability shapes what we believe happened and how we judge the people involved</text>
</svg>