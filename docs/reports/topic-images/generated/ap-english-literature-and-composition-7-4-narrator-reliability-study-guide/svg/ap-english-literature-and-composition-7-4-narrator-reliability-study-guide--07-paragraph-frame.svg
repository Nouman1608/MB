<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 758" width="900" height="758" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="758" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A paragraph on reliability in five moves</text>

<rect x="30" y="110" width="840" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="152" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="159.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="110" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Claim</text><text x="110" y="172" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">How far can the narrator be trusted, and about what?</text><line x1="530" y1="126" x2="530" y2="178" stroke="#c9d6d4" stroke-width="2"/><text x="550" y="148" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"reliable on events, doubtful on</text><text x="550" y="169" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">motives"</text><rect x="30" y="204" width="840" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="246" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="253.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="110" y="240" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Evidence</text><text x="110" y="266" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Quote the sign</text><line x1="530" y1="220" x2="530" y2="272" stroke="#c9d6d4" stroke-width="2"/><text x="550" y="242" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">a contradiction, an over-insistent</text><text x="550" y="263" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">claim, a gap</text><rect x="30" y="298" width="840" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="340" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="347.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="110" y="334" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Source</text><text x="110" y="360" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Why might the narrator distort?</text><line x1="530" y1="314" x2="530" y2="366" stroke="#c9d6d4" stroke-width="2"/><text x="550" y="346" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">self-interest, emotion, limited vantage</text><rect x="30" y="392" width="840" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="434" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="441.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="110" y="428" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Effect</text><text x="110" y="454" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">What does the reader now do?</text><line x1="530" y1="408" x2="530" y2="460" stroke="#c9d6d4" stroke-width="2"/><text x="550" y="430" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">reads around the account, doubts a</text><text x="550" y="451" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">judgement, notices irony</text><rect x="30" y="486" width="840" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="70" cy="528" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="70" y="535.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="110" y="522" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Significance</text><text x="110" y="548" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">What does this reveal?</text><line x1="530" y1="502" x2="530" y2="554" stroke="#c9d6d4" stroke-width="2"/><text x="550" y="524" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">about the narrator, another character</text><text x="550" y="545" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">or the story's concerns</text><rect x="30" y="594" width="411" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="627" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TONE</text><text x="50" y="654.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">the attitude conveyed</text><text x="50" y="682.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A defensive tone is a clue, not proof</text><rect x="459" y="594" width="411" height="134" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="627" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">RELIABILITY</text><text x="479" y="654.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">how far we trust the account</text><text x="479" y="682.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Confirm with a second sign, such as an omission</text><text x="479" y="703.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">or contradiction</text>
</svg>