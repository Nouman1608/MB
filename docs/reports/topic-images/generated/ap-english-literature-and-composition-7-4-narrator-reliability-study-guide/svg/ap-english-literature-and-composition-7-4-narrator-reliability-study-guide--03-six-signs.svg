<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 612" width="900" height="612" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="612" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Signs of an unreliable narrator</text>

<rect x="30" y="110" width="411" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="68" cy="152" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="68" y="159.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="102" y="158" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Self-contradiction</text><text x="102" y="187" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">says one thing and shows another</text><rect x="459" y="110" width="411" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="497" cy="152" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="497" y="159.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="531" y="158" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Over-insistence</text><text x="531" y="187" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">repeated claims of calm or honesty: "I am</text><text x="531" y="208" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">perfectly sane"</text><rect x="30" y="244" width="411" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="68" cy="286" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="68" y="293.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="102" y="292" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Defensive address</text><text x="102" y="321" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">speaks as if to an accuser: "why will you</text><text x="102" y="342" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">say that I am mad?"</text><rect x="459" y="244" width="411" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="497" cy="286" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="497" y="293.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="531" y="292" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Telling and showing do not match</text><text x="531" y="321" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reported actions do not fit the description</text><text x="531" y="342" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">of them</text><rect x="30" y="378" width="411" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="68" cy="420" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="68" y="427.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="102" y="426" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Contradiction by others</text><text x="102" y="455" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">characters, documents or events give a</text><text x="102" y="476" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">different account</text><rect x="459" y="378" width="411" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="497" cy="420" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="497" y="427.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="531" y="426" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Gaps</text><text x="531" y="455" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">missing reasons, motives, key events</text><rect x="30" y="518" width="840" height="64" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="557" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">One sign is a clue; look for a second sign before you conclude</text>
</svg>