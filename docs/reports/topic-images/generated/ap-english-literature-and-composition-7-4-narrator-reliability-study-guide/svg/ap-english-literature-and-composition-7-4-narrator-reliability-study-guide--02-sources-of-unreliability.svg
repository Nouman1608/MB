<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 652" width="900" height="652" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="652" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why a narrator may be unreliable</text>

<text x="220" y="126" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">SOURCE</text><text x="665" y="126" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">TYPICAL EFFECT ON THE READER</text><rect x="30" y="142" width="380" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="173.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Self-interest</text><text x="46" y="201.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">defends or flatters themselves</text><line x1="416" y1="182" x2="474" y2="182" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="480" y="142" width="390" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="496" y="186.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The reader doubts the account of conflicts</text><rect x="30" y="234" width="380" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="265.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Bias</text><text x="46" y="293.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">loaded descriptions of other people</text><line x1="416" y1="274" x2="474" y2="274" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="480" y="234" width="390" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="496" y="278.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The reader looks for the other side</text><rect x="30" y="326" width="380" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="357.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Limited knowledge</text><text x="46" y="385.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">cannot see or understand all that happens</text><line x1="416" y1="366" x2="474" y2="366" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="480" y="326" width="390" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="496" y="359.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The reader infers more than the narrator</text><text x="496" y="381.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">knows</text><rect x="30" y="418" width="380" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="449.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Emotional or mental state</text><text x="46" y="477.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">obsession, grief, fear, instability</text><line x1="416" y1="458" x2="474" y2="458" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="480" y="418" width="390" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="496" y="451.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The reader senses distortion even when the</text><text x="496" y="473.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">narrator is sincere</text><rect x="30" y="510" width="380" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="541.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Naivety or age</text><text x="46" y="569.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a child or innocent who misreads events</text><line x1="416" y1="550" x2="474" y2="550" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="480" y="510" width="390" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="496" y="543.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Irony: the reader understands what the</text><text x="496" y="565.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">narrator does not</text><text x="450" y="626" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Unreliable does not have to mean lying: name the reason to explain the effect</text>
</svg>