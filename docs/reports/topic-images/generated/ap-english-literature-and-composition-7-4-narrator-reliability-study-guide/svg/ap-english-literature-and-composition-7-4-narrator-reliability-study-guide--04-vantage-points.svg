<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 635" width="900" height="635" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="635" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What a narrator can and cannot know</text>

<rect x="30" y="110" width="264" height="320" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="162" cy="174" r="26" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><circle cx="192" cy="144" r="7" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="206" cy="128" r="11" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="162" y="240" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">First-person narrator</text><rect x="46" y="270" width="232" height="58" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="60" y="292" font-size="14.5" font-weight="700" fill="#2e6b62" text-anchor="start">KNOWS</text><text x="60" y="315" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">their own mind</text><rect x="46" y="336" width="232" height="80" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2" stroke-dasharray="6 5"/><text x="60" y="358" font-size="14.5" font-weight="700" fill="#b5602e" text-anchor="start">CANNOT KNOW</text><text x="60" y="380" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">others' minds</text><rect x="318" y="110" width="264" height="320" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><ellipse cx="450" cy="174" rx="28" ry="16" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><circle cx="450" cy="174" r="8" fill="#2e6b62"/><text x="450" y="240" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">A witness</text><rect x="334" y="270" width="232" height="58" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="348" y="292" font-size="14.5" font-weight="700" fill="#2e6b62" text-anchor="start">KNOWS</text><text x="348" y="315" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">the scene</text><rect x="334" y="336" width="232" height="80" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2" stroke-dasharray="6 5"/><text x="348" y="358" font-size="14.5" font-weight="700" fill="#b5602e" text-anchor="start">MAY NOT KNOW</text><text x="348" y="380" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">its causes</text><rect x="606" y="110" width="264" height="320" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="738" cy="174" r="26" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M738,158 L738,174 L750,182" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><text x="738" y="240" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Telling it decades later</text><rect x="622" y="270" width="232" height="58" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="636" y="292" font-size="14.5" font-weight="700" fill="#2e6b62" text-anchor="start">TELLS</text><text x="636" y="315" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">from a distance in time</text><rect x="622" y="336" width="232" height="80" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2" stroke-dasharray="6 5"/><text x="636" y="358" font-size="14.5" font-weight="700" fill="#b5602e" text-anchor="start">MAY HAVE</text><text x="636" y="380" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">forgotten or reshaped</text><text x="636" y="401" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">what happened</text><rect x="30" y="460" width="411" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="493" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SOME NARRATORS</text><text x="50" y="524.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">provide details and information that others do</text><text x="50" y="546.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">not or cannot provide</text><rect x="459" y="460" width="411" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="493" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">MULTIPLE NARRATORS</text><text x="479" y="524.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">may provide contradictory information</text><text x="450" y="605" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Ask: what is each narrator positioned to know, and what do they have reason to say?</text>
</svg>