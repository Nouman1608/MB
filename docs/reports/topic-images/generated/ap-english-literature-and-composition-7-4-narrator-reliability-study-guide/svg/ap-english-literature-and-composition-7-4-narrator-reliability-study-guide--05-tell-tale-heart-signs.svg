<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 731" width="900" height="731" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="731" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: The Tell-Tale Heart</text>

<text x="240" y="126" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">What he claims</text><text x="680" y="126" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">What the reader sees</text><rect x="30" y="142" width="410" height="81" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="171" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">DEFENSIVE ADDRESS</text><text x="46" y="202.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">He asks: "why will you say that I am mad?"</text><line x1="446" y1="182.5" x2="494" y2="182.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="500" y="142" width="370" height="81" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="516" y="176.1" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">He expects an accusation before anyone</text><text x="516" y="198.1" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">makes one</text><rect x="30" y="235" width="410" height="103" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="264" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">OVER-INSISTENCE</text><text x="46" y="295.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"True!—nervous—very, very dreadfully</text><text x="46" y="317.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">nervous"; "not destroyed—not dulled"</text><line x1="446" y1="286.5" x2="494" y2="286.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="500" y="235" width="370" height="103" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="516" y="280.1" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Dashes and repetition: a breathless tone,</text><text x="516" y="302.1" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">not calm</text><rect x="30" y="350" width="410" height="103" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="379" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">SELF-CONTRADICTION</text><text x="46" y="410.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"Object there was none. Passion there was</text><text x="46" y="432.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">none. I loved the old man."</text><line x1="446" y1="401.5" x2="494" y2="401.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="500" y="350" width="370" height="103" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="516" y="406.1" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The story is about murdering the old man</text><rect x="30" y="465" width="410" height="103" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="494" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">TELLING AND SHOWING</text><text x="46" y="525.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">"observe how healthily—how calmly I can tell</text><text x="46" y="547.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">you"</text><line x1="446" y1="516.5" x2="494" y2="516.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="500" y="465" width="370" height="103" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="516" y="510.1" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The care of his plan reads as obsession,</text><text x="516" y="532.1" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">not sanity</text><rect x="30" y="590" width="840" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="623" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FUNCTION</text><text x="50" y="654.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The reader knows more than the narrator, which produces irony and unease. His reliability is the</text><text x="50" y="676.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">story's main subject.</text>
</svg>