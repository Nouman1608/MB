<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: two accounts of one night</text>

<rect x="30" y="110" width="840" height="250" rx="14" fill="#eef2e6" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="140" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Positions on the night</text><rect x="70" y="220" width="200" height="100" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><path d="M62,220 L170,180 L278,220 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><text x="170" y="260" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Kitchen</text><text x="170" y="286" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">Lena: hears</text><rect x="630" y="220" width="200" height="100" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><path d="M622,220 L730,180 L838,220 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><text x="730" y="260" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Barn</text><text x="730" y="286" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">Marcus: sees</text><rect x="300" y="300" width="300" height="40" rx="6" fill="#efdfa8" opacity="0.8"/><text x="450" y="326" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle">the yard</text><line x1="420" y1="210" x2="420" y2="290" stroke="#1e2a44" stroke-width="5"/><line x1="480" y1="210" x2="480" y2="290" stroke="#1e2a44" stroke-width="5"/><line x1="420" y1="222" x2="480" y2="222" stroke="#9c8f6e" stroke-width="5"/><line x1="420" y1="248" x2="480" y2="248" stroke="#9c8f6e" stroke-width="5"/><line x1="420" y1="274" x2="480" y2="274" stroke="#9c8f6e" stroke-width="5"/><text x="450" y="196" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">yard gate</text><rect x="30" y="684" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="717" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">WHAT THE READER DOES</text><text x="50" y="748.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Weighs testimony: what each could see, what each wants, and what each says about the other.</text><text x="50" y="770.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The contradiction may reveal family tensions or keep the event unknowable.</text>
