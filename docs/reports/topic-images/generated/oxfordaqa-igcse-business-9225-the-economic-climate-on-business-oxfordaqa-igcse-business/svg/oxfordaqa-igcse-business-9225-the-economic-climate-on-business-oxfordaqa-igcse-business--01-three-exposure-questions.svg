<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 756" width="900" height="756" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="756" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who feels an interest rate change most?</text>

<text x="470" y="132" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Less exposed</text><text x="735" y="132" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">More exposed</text><circle cx="58" cy="220" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="58" y="228.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="94" y="150" width="240" height="140" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="112" y="210.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">How much does it</text><text x="112" y="235.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">borrow?</text><rect x="350" y="150" width="240" height="140" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="368" y="209.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Little: owner’s savings</text><text x="368" y="232.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">or retained profit</text><rect x="606" y="150" width="264" height="140" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="624" y="220.7" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A large loan or overdraft</text><circle cx="58" cy="380" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="58" y="388.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="94" y="310" width="240" height="140" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="112" y="370.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Is the borrowing</text><text x="112" y="395.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">fixed or variable?</text><rect x="350" y="310" width="240" height="140" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="368" y="357.7" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Fixed-rate loan:</text><text x="368" y="380.7" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">repayments stay the</text><text x="368" y="403.7" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">same until it ends</text><rect x="606" y="310" width="264" height="140" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="624" y="346.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Variable-rate loan or</text><text x="624" y="369.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">overdraft: cost changes at</text><text x="624" y="392.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">once (overdrafts most</text><text x="624" y="415.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">exposed)</text><circle cx="58" cy="540" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="58" y="548.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="94" y="470" width="240" height="140" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="112" y="530.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Do its customers</text><text x="112" y="555.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">borrow to buy?</text><rect x="350" y="470" width="240" height="140" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="368" y="540.7" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">No: everyday purchases</text><rect x="606" y="470" width="264" height="140" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="624" y="517.7" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Yes: cars, furniture,</text><text x="624" y="540.7" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">houses, holidays;</text><text x="624" y="563.7" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">customers delay buying</text><rect x="30" y="640" width="840" height="86" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="680" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Use the three questions to judge the size of the effect.</text><text x="56" y="707" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The same rate rise can barely touch one business and squeeze another.</text>
</svg>