<rect width="900" height="929" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Rowanbrook: big purchases fall furthest</text>

<rect x="30" y="110" width="840" height="520" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Rowanbrook Furniture: revenue before and after</text><line x1="120" y1="560" x2="850" y2="560" stroke="#c9d6d4" stroke-width="1.5"/><text x="110" y="566" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$0</text><line x1="120" y1="440" x2="850" y2="440" stroke="#c9d6d4" stroke-width="1.5"/><text x="110" y="446" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$40,000</text><line x1="120" y1="320" x2="850" y2="320" stroke="#c9d6d4" stroke-width="1.5"/><text x="110" y="326" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$80,000</text><line x1="120" y1="200" x2="850" y2="200" stroke="#c9d6d4" stroke-width="1.5"/><text x="110" y="206" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$120,000</text><rect x="170" y="236" width="110" height="324" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><rect x="300" y="300.8" width="110" height="259.2" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="225" y="226" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">$108,000</text><text x="355" y="290.8" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">$86,400</text><text x="290" y="590" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Sofas ($900, on credit)</text><text x="290" y="614" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">120 sold → 96 sold</text><text x="290" y="192" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">sales −20%</text><rect x="560" y="506" width="110" height="54" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><rect x="690" y="508.15999999999997" width="110" height="51.84" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="615" y="496" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">$18,000</text><text x="745" y="498.15999999999997" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">$17,280</text><text x="680" y="590" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Cushions and throws ($30)</text><text x="680" y="614" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">600 sold → 576 sold</text><text x="680" y="462" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">sales −4%</text><line x1="120" y1="560" x2="850" y2="560" stroke="#1e2a44" stroke-width="2.5"/><rect x="640" y="166" width="20" height="20" rx="3" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="668" y="182" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">before</text><rect x="740" y="166" width="20" height="20" rx="3" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="768" y="182" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">after</text><rect x="30" y="650" width="410" height="120" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="684" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Total revenue</text><text x="50" y="714" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">$126,000 → $103,680</text><text x="50" y="742" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">fall $22,320 (about 17.7%)</text><rect x="460" y="650" width="410" height="120" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="684" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Of which sofas</text><text x="480" y="714" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">$108,000 − $86,400</text><text x="480" y="742" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">= $21,600</text><rect x="30" y="790" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="830" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A sofa is a large purchase that can be delayed and usually needs borrowing.</text><text x="56" y="857" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Rowanbrook could promote accessories, offer a cheaper sofa range, hold less sofa stock, or</text><text x="56" y="880" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">offer interest-free payment plans at its own cost.</text>
</svg>