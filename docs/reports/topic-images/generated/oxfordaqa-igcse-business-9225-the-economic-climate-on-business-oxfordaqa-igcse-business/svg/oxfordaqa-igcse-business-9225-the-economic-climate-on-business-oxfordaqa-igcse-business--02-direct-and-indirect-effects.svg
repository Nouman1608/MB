<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750" width="900" height="750" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="750" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How a rate rise reaches a business</text>

<rect x="320" y="110" width="260" height="80" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="152.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Interest rates rise</text><path d="M380,190 L380,215 L165,215 L165,240" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M450,190 L450,240" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><path d="M520,190 L520,215 L735,215 L735,240" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><text x="165" y="262" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">Direct: its own borrowing</text><rect x="30" y="280" width="270" height="96" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="165" y="317.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Variable loan or overdraft</text><text x="165" y="340.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">costs more at once</text><line x1="165" y1="378" x2="165" y2="398" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="400" width="270" height="96" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="165" y="448.7" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Interest costs rise</text><line x1="165" y1="498" x2="165" y2="518" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="520" width="270" height="96" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="165" y="557.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Profit falls unless prices</text><text x="165" y="580.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">rise</text><text x="450" y="262" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Indirect: households</text><rect x="315" y="280" width="270" height="96" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="317.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Mortgages, loans and</text><text x="450" y="340.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">credit cost more</text><line x1="450" y1="378" x2="450" y2="398" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="315" y="400" width="270" height="96" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="437.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Less to spend; big</text><text x="450" y="460.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">purchases delayed</text><line x1="450" y1="498" x2="450" y2="518" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="315" y="520" width="270" height="96" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="568.7" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Fewer sales</text><text x="735" y="262" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Indirect: other businesses</text><rect x="600" y="280" width="270" height="96" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="735" y="317.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Loans for machinery, vans</text><text x="735" y="340.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">or premises cost more</text><line x1="735" y1="378" x2="735" y2="398" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="600" y="400" width="270" height="96" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="735" y="448.7" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Investment put off</text><line x1="735" y1="498" x2="735" y2="518" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="600" y="520" width="270" height="96" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="735" y="557.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Equipment suppliers lose</text><text x="735" y="580.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">orders, even with no debt</text><rect x="30" y="650" width="840" height="70" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="693" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">When rates fall, each chain runs the other way.</text>
</svg>