<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="670" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Spending as incomes change</text>

<rect x="30" y="110" width="840" height="80" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="158" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">When incomes fall, households…</text><defs><linearGradient id="g6" x1="0" x2="1"><stop offset="0" stop-color="#b5602e"/><stop offset="1" stop-color="#2e6b62"/></linearGradient></defs><rect x="60" y="230" width="780" height="22" rx="11" fill="url(#g6)"/><text x="60" y="285" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">cut first</text><text x="840" y="285" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="end">changes least</text><rect x="30" y="310" width="400" height="120" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="350" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Things they enjoy but do not need</text><text x="48" y="381" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Eating out, holidays, new technology,</text><text x="48" y="404" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">premium brands</text><rect x="470" y="310" width="400" height="120" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="488" y="350" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Necessities</text><text x="488" y="381" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Such as basic food</text><text x="56" y="480" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Two more responses</text><rect x="30" y="498" width="400" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="534" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Delay large purchases</text><text x="48" y="564" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">such as a new sofa</text><rect x="470" y="498" width="400" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="488" y="534" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Trade down</text><text x="488" y="564" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">to cheaper alternatives</text><text x="450" y="640" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">When incomes rise, spending on non-essentials rises most.</text>
</svg>