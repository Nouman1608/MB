<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 790" width="900" height="790" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="790" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Rising and falling employment</text>

<text x="385" y="132" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Employment rising</text><text x="700" y="132" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">Employment falling</text><rect x="30" y="150" width="180" height="96" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="120" y="200.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Demand</text><rect x="226" y="150" width="318" height="96" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="244" y="187.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">More households earn wages, so</text><text x="244" y="210.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">spending rises</text><rect x="560" y="150" width="310" height="96" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="578" y="187.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Households lose income or fear</text><text x="578" y="210.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">losing it, so spending falls</text><rect x="30" y="262" width="180" height="96" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="120" y="312.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Recruitment</text><rect x="226" y="262" width="318" height="96" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="244" y="299.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Fewer people looking for work:</text><text x="244" y="322.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">vacancies harder to fill</text><rect x="560" y="262" width="310" height="96" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="578" y="299.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">More applicants for each</text><text x="578" y="322.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">vacancy</text><rect x="30" y="374" width="180" height="96" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="120" y="424.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Wages</text><rect x="226" y="374" width="318" height="96" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="244" y="411.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Pressure to raise pay to attract</text><text x="244" y="434.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and keep staff</text><rect x="560" y="374" width="310" height="96" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="578" y="422.7" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Less pressure on pay</text><rect x="30" y="486" width="180" height="96" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="120" y="536.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Who gains</text><rect x="226" y="486" width="318" height="96" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="244" y="523.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Restaurants, leisure,</text><text x="244" y="546.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">non-essential retail</text><rect x="560" y="486" width="310" height="96" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="578" y="511.7" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Low-price retailers, repair</text><text x="578" y="534.7" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">services, some recruitment</text><text x="578" y="557.7" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">agencies</text><rect x="30" y="610" width="840" height="150" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="646" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Local, not just national: a large factory closes</text><rect x="56" y="664" width="370" height="78" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="74" y="692.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Factory workers and families have less</text><text x="74" y="715.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">to spend</text><line x1="430" y1="703" x2="466" y2="703" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="470" y="664" width="380" height="78" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="488" y="692.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Local shops, cafés and taxi firms lose</text><text x="488" y="715.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">customers</text>
</svg>