<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="900" height="630" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="630" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Writing about the economic climate</text>

<rect x="30" y="110" width="840" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="146" font-size="18" font-weight="700" fill="#4a5568" text-anchor="start">Explain: one effect and its reason</text><text x="56" y="186" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“The overdraft rate rises, so interest costs increase, reducing profit.”</text><text x="56" y="262" font-size="18" font-weight="700" fill="#4a5568" text-anchor="start">Analyse: follow the chain through customers</text><rect x="30" y="280" width="190" height="90" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="125" y="327.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Rate rise</text><line x1="222" y1="325" x2="242" y2="325" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="245" y="280" width="190" height="90" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="340" y="315.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Higher mortgage</text><text x="340" y="339.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">payments</text><line x1="437" y1="325" x2="457" y2="325" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="460" y="280" width="190" height="90" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="555" y="327.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Less spending</text><line x1="652" y1="325" x2="672" y2="325" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="675" y="280" width="190" height="90" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="770" y="327.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Fewer sales</text><rect x="30" y="400" width="840" height="200" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="56" y="436" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Evaluate: how much does it matter for this business?</text><rect x="56" y="460" width="252" height="116" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="182" y="520.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Its level of debt</text><rect x="328" y="460" width="252" height="116" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="454" y="508.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Fixed or variable</text><text x="454" y="532.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">borrowing</text><rect x="600" y="460" width="252" height="116" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="726" y="508.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Necessities or</text><text x="726" y="532.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">luxuries</text>
</svg>