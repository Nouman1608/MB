<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 779" width="900" height="779" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="779" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Same rate rise, different effects</text>

<text x="450" y="124" font-size="19" font-weight="700" fill="#4a5568" text-anchor="middle">Interest rates rise by 2 percentage points</text><rect x="30" y="145" width="410" height="470" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="56" y="182" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Atherley Garage</text><text x="56" y="210" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">fixed-rate loan, five years</text><rect x="52" y="232" width="366" height="120" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="72" y="268" font-size="20" font-weight="600" fill="#1e2a44" text-anchor="start">$80,000 × 6%</text><text x="72" y="300" font-size="20" font-weight="600" fill="#1e2a44" text-anchor="start">= $4,800 a year</text><text x="398" y="268" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end">no change</text><text x="56" y="392" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Direct effect: protected for now</text><text x="56" y="432" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">Indirect effect:</text><text x="56" y="460" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">car owners with mortgages and loans have</text><text x="56" y="483" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">less to spend, so they may delay</text><text x="56" y="506" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">servicing or repairs</text><rect x="460" y="145" width="410" height="470" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="486" y="182" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Pellow Florist</text><text x="486" y="210" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">variable-rate loan and overdraft</text><rect x="482" y="232" width="366" height="104" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="500" y="262" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Loan $50,000</text><text x="500" y="292" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">7%: $3,500</text><text x="500" y="318" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">9%: $4,500</text><text x="830" y="318" font-size="17" font-weight="700" fill="#b5602e" text-anchor="end">+$1,000</text><rect x="482" y="348" width="366" height="104" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="500" y="378" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Overdraft $15,000</text><text x="500" y="408" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">10%: $1,500</text><text x="500" y="434" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">12%: $1,800</text><text x="830" y="434" font-size="17" font-weight="700" fill="#b5602e" text-anchor="end">+$300</text><rect x="482" y="466" width="366" height="60" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="500" y="504" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Extra interest a year</text><text x="830" y="504" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="end">$1,300</text><text x="486" y="560" font-size="17" font-weight="600" fill="#b5602e" text-anchor="start">Costs rise at once: profit falls</text><text x="486" y="583" font-size="17" font-weight="600" fill="#b5602e" text-anchor="start">unless it raises prices</text><rect x="30" y="640" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="680" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A complete answer names both effects.</text><text x="56" y="707" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The direct effect on the business’s own borrowing, and the indirect effect through its</text><text x="56" y="730" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">customers.</text>
</svg>