<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 746" width="900" height="746" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="746" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Sharia compliant alternatives to interest</text>

<rect x="30" y="110" width="840" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="152" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">No interest (riba) is charged or paid</text><rect x="30" y="200" width="410" height="164" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="238" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Murabaha</text><text x="420" y="238" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="end">buys, then sells at a mark-up</text><text x="50" y="276" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Financier buys the asset or goods and</text><text x="50" y="299" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">sells them to the business at an agreed</text><text x="50" y="322" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">higher price, paid in instalments</text><rect x="460" y="200" width="410" height="164" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="238" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Ijara</text><text x="850" y="238" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="end">owns and rents out</text><text x="480" y="276" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Financier buys an asset, such as a</text><text x="480" y="299" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">machine, and leases it to the business for</text><text x="480" y="322" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">an agreed rent</text><rect x="30" y="380" width="410" height="164" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="418" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Musharaka</text><text x="420" y="418" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="end">partners share profit and loss</text><text x="50" y="456" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Financier and business form a partnership,</text><text x="50" y="479" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">sharing profits and losses in agreed</text><text x="50" y="502" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">proportions</text><rect x="460" y="380" width="410" height="164" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="418" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Mudaraba</text><text x="850" y="418" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="end">money + skill, profit shared</text><text x="480" y="456" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">One party provides the money, the other</text><text x="480" y="479" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the skill and effort; profits are shared</text><text x="480" y="502" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">in agreed proportions</text><rect x="30" y="570" width="410" height="116" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="604" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Direct effect of a rate rise: smaller</text><text x="50" y="634" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Price, rent or profit share is agreed in</text><text x="50" y="657" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">advance or linked to results</text><rect x="460" y="570" width="410" height="116" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="480" y="604" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Indirect effect: still applies</text><text x="480" y="634" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Customers with dearer mortgages and loans</text><text x="480" y="657" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">spend less</text><text x="450" y="720" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Not free: the agreed price or profit share can be a large cost.</text>
</svg>