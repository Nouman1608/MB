<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 393" width="900" height="393" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="393" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three global influences: plus and minus</text>

<rect x="30" y="104" width="300" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Influence</text><rect x="330" y="104" width="270" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="342" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Positive</text><rect x="600" y="104" width="270" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="612" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Negative</text><rect x="30" y="150" width="300" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="175.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Cultural diversity: many</text><text x="42" y="196.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">cultures in one society</text><rect x="330" y="150" width="270" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="342" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Widens choices and</text><text x="342" y="196.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">understanding</text><rect x="600" y="150" width="270" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="612" y="175.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">May produce tension or</text><text x="612" y="196.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">feelings of threat</text><rect x="30" y="214" width="300" height="85" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="239.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Multiculturalism: cultures</text><text x="42" y="260.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">respected equally (Canada,</text><text x="42" y="281.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">1971)</text><rect x="330" y="214" width="270" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="342" y="239.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Supports minority identities</text><rect x="600" y="214" width="270" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="612" y="239.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Critics: may keep communities</text><text x="612" y="260.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">separate</text><rect x="30" y="299" width="300" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="324.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Global culture: shared media,</text><text x="42" y="345.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">music, sport, brands</text><rect x="330" y="299" width="270" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="342" y="324.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Connects people across</text><text x="342" y="345.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">countries</text><rect x="600" y="299" width="270" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="612" y="324.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">May weaken local languages</text><text x="612" y="345.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and traditions</text>
</svg>