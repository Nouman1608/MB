<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 482" width="900" height="482" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="482" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Globalisation pulls identity three ways</text>

<rect x="250" y="110" width="400" height="76" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="140.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Globalisation: trade, media,</text><text x="450" y="164.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">migration and technology</text><line x1="330" y1="190" x2="164" y2="242" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="190" x2="450" y2="242" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="570" y1="190" x2="736" y2="242" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="250" width="268" height="202" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="286" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Homogenisation</text><text x="50" y="314.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Identities become more</text><text x="50" y="335.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">alike as global brands and</text><text x="50" y="356.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">media spread</text><text x="50" y="385.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ritzer (1993):</text><text x="50" y="406.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">McDonaldization, efficiency</text><text x="50" y="427.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and standardisation</text><rect x="316" y="250" width="268" height="202" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="336" y="286" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Hybrid identities</text><text x="336" y="314.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">People combine cultures</text><text x="336" y="343.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Young people of migrant</text><text x="336" y="364.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">heritage mixing languages,</text><text x="336" y="385.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">music and fashion</text><rect x="602" y="250" width="268" height="202" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="622" y="286" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Cultural defence</text><text x="622" y="314.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Groups strengthen local or</text><text x="622" y="335.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">traditional identities</text><text x="622" y="364.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Bruce: religion stayed</text><text x="622" y="385.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">strong in communist Poland</text><text x="622" y="406.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">as a symbol of national</text><text x="622" y="427.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">identity</text>
</svg>