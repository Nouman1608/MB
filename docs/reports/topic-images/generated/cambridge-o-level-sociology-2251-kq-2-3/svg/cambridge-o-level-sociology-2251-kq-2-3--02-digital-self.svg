<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 599" width="900" height="599" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="599" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The digital self</text>

<rect x="30" y="104" width="840" height="132" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">GOFFMAN (1959)</text><text x="50" y="162.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">People manage the impression they give, like actors on a stage. Online</text><text x="50" y="186.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">profiles make this deliberate: choosing photos, editing posts, deciding what</text><text x="50" y="210.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">to reveal.</text><rect x="30" y="254" width="408" height="239" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="290.8" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">Positive impacts</text><text x="50" y="321.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="321.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Freedom to explore identities and</text><text x="66.15" y="343.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">interests</text><text x="50" y="370.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="370.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Support from people with similar</text><text x="66.15" y="392.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">experiences</text><text x="50" y="419.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="419.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Staying connected with family and</text><text x="66.15" y="441.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">diaspora abroad</text><text x="50" y="468.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="468.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Platforms for creativity and activism</text><rect x="462" y="254" width="408" height="239" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="482" y="290.8" font-size="21" font-weight="700" fill="#b5602e" text-anchor="start">Negative impacts</text><text x="482" y="321.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="498.15" y="321.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Pressure to present a perfect image</text><text x="482" y="348.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="498.15" y="348.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Cyberbullying and online harassment</text><text x="482" y="375.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="498.15" y="375.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Privacy risks; a record that cannot be</text><text x="498.15" y="397.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">erased</text><text x="482" y="424.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="498.15" y="424.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“Echo chambers” that reinforce narrow</text><text x="498.15" y="446.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">views</text><rect x="30" y="511" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="544.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Rheingold (1993) popularised “virtual community” for groups that form relationships online.</text>
</svg>