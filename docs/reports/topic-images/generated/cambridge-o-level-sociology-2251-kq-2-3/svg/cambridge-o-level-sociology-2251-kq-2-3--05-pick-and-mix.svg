<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 524" width="900" height="524" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="524" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Is identity chosen or given?</text>

<text x="235" y="134" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Postmodernists: chosen</text><text x="665" y="134" font-size="21" font-weight="700" fill="#b5602e" text-anchor="middle">Critics: still limited by…</text><rect x="30" y="154" width="410" height="66" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="191.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Consumption: what you buy, wear, watch</text><rect x="30" y="232" width="410" height="66" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="258.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Lifestyle: leisure, music, diet,</text><text x="235" y="280.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">fitness</text><rect x="30" y="310" width="410" height="66" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="336.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Digital identities: different selves on</text><text x="235" y="358.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">different platforms</text><rect x="30" y="388" width="410" height="60" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="235" y="422.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">A “pick and mix” identity</text><rect x="460" y="154" width="410" height="86" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="665" y="190.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Money: consumer identities are easier</text><text x="665" y="212.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">for the well-off</text><rect x="460" y="254" width="410" height="86" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="665" y="301.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Family expectations, religion and law</text><rect x="460" y="354" width="410" height="86" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="665" y="390.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Ascribed traits: ethnicity, age and</text><text x="665" y="412.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">gender shape how others treat us</text><text x="450" y="484" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Postmodernists claim class, religion, family and local community have lost their hold.</text>
</svg>