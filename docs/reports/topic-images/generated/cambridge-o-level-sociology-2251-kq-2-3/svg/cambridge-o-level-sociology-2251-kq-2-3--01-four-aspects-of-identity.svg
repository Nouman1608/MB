<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 562" width="900" height="562" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="562" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four key aspects of social identity</text>

<rect x="30" y="104" width="411" height="206" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AGE</text><text x="50" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Life stages are social</text><text x="50" y="191.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="191.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ariès (1960): in medieval Europe children</text><text x="65.2" y="212.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">were treated like small adults</text><text x="50" y="239.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="239.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Impact: rights, expectations, whose views</text><text x="65.2" y="260.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">count</text><rect x="459" y="104" width="411" height="206" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">GENDER</text><text x="479" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Masculine and feminine as a</text><text x="479" y="188.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">society defines them</text><text x="479" y="216.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494.2" y="216.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Connell: hegemonic masculinity, the</text><text x="494.2" y="237.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">dominant idea of a “real man”</text><text x="479" y="264.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494.2" y="264.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Impact: careers, domestic roles, dress,</text><text x="494.2" y="285.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">freedom</text><rect x="30" y="326" width="411" height="206" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="359" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">ETHNICITY</text><text x="50" y="385.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Shared language, religion,</text><text x="50" y="410.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">customs, history</text><text x="50" y="438.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="438.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">More visible when a group is a minority</text><text x="50" y="465.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="465.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Impact: pride and support, but also</text><text x="65.2" y="486.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">stereotyping</text><rect x="459" y="326" width="411" height="206" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="479" y="359" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SOCIAL CLASS</text><text x="479" y="385.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Occupation, income, education,</text><text x="479" y="410.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">lifestyle</text><text x="479" y="438.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494.2" y="438.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Bourdieu: cultural capital passes on</text><text x="494.2" y="459.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">advantage</text><text x="479" y="486.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="494.2" y="486.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Impact: accent, leisure, aspirations, life</text><text x="494.2" y="507.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">chances</text>
</svg>