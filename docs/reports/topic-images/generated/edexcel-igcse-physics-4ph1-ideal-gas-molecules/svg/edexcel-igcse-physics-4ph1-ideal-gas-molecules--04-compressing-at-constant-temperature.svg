<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Squeezing a gas at constant temperature</text>

<rect x="30" y="110" width="420" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="240" y="146" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Push the handle in slowly</text><rect x="60" y="175" width="300" height="100" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="3" /><rect x="60" y="175" width="270" height="100" rx="0" fill="#dce9e7" stroke="none" stroke-width="0" /><rect x="330" y="169" width="16" height="112" rx="0" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2.5" /><line x1="346" y1="225" x2="400" y2="225" stroke="#1e2a44" stroke-width="7" stroke-linecap="round"/><text x="195" y="301" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">150 cm³ at 100 kPa</text><circle cx="155.43827160493828" cy="206.89766803840877" r="9" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><line x1="163.11260548509904" y1="203.48232039932182" x2="177.364939833969" y2="197.13953192673173" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/><circle cx="167.82739197530864" cy="235.12565157750342" r="9" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><line x1="167.65432573760236" y1="243.52386853572534" x2="167.33291701043353" y2="259.12055717242316" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/><circle cx="303.1748456790124" cy="220.53882030178326" r="9" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><line x1="297.1816392808455" y1="226.4245213703877" x2="286.051398827107" y2="237.35510906922454" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/><circle cx="190.98063271604937" cy="253.80384087791495" r="9" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><line x1="189.38116862962207" y1="245.5575256622426" x2="186.4107353262571" y2="230.24294026170824" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/><circle cx="162.74475308641973" cy="233.58737997256515" r="9" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><line x1="160.10644317399942" y1="225.6124617406317" x2="155.20672476521887" y2="210.8018993098981" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/><circle cx="81.96720679012346" cy="250.55610425240056" r="9" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><line x1="81.02102057917129" y1="242.20956415160407" x2="79.26381761597443" y2="226.70884682155344" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/><rect x="60" y="345" width="300" height="100" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="3" /><rect x="60" y="345" width="90" height="100" rx="0" fill="#dce9e7" stroke="none" stroke-width="0" /><rect x="150" y="339" width="16" height="112" rx="0" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2.5" /><line x1="166" y1="395" x2="400" y2="395" stroke="#1e2a44" stroke-width="7" stroke-linecap="round"/><text x="105" y="471" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">50 cm³: p = ?</text><circle cx="95.87037037037037" cy="376.89766803840877" r="9" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><line x1="103.54470425053111" y1="373.4823203993218" x2="117.79703859940108" y2="367.13953192673176" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/><circle cx="98.72939814814815" cy="405.12565157750345" r="9" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><line x1="98.55633191044187" y1="413.52386853572534" x2="98.23492318327305" y2="429.1205571724232" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/><circle cx="129.96342592592592" cy="390.5388203017833" r="9" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><line x1="123.97021952775903" y1="396.4245213703877" x2="112.83997907402053" y2="407.35510906922457" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/><circle cx="104.0724537037037" cy="423.8038408779149" r="9" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><line x1="102.47298961727641" y1="415.5575256622426" x2="99.50255631391144" y2="400.2429402617082" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/><circle cx="97.55648148148148" cy="403.58737997256515" r="9" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><line x1="94.91817156906119" y1="395.61246174063166" x2="90.01845316028063" y2="380.8018993098981" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/><circle cx="78.91550925925925" cy="420.55610425240053" r="9" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><line x1="77.96932304830709" y1="412.209564151604" x2="76.21212008511023" y2="396.7088468215534" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/><line x1="250" y1="325" x2="200" y2="325" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="55" y="490" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Same speed, but the walls are hit</text><text x="55" y="510" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">more often, so pressure rises.</text><rect x="470" y="110" width="400" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="520" y1="470" x2="840" y2="470" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="520" y1="470" x2="520" y2="160" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="840" y="504" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">V</text><text x="498" y="315" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 498 315)">p</text><path d="M595.0,190.0 L602.5,215.5 L610.0,236.7 L617.5,254.6 L625.0,270.0 L632.5,283.3 L640.0,295.0 L647.5,305.3 L655.0,314.4 L662.5,322.6 L670.0,330.0 L677.5,336.7 L685.0,342.7 L692.5,348.3 L700.0,353.3 L707.5,358.0 L715.0,362.3 L722.5,366.3 L730.0,370.0 L737.5,373.4 L745.0,376.7 L752.5,379.7 L760.0,382.5 L767.5,385.2 L775.0,387.6 L782.5,390.0 L790.0,392.2 L797.5,394.3 L805.0,396.3 L812.5,398.2 L820.0,400.0 " fill="none" stroke="#2e6b62" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="670" y="300" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">p × V stays constant</text><text x="670" y="322" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">halve V: double p</text><text x="680" y="146" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">p against V: a curve</text><rect x="30" y="545" width="840" height="105.6" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="586.1" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">p₂ = p₁V₁ ÷ V₂ = 100 × 150 ÷ 50 = 300 kPa</text><text x="54" y="622.1" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">fixed mass of gas, constant temperature:   p₁V₁ = p₂V₂</text>
</svg>