<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="600" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: a bubble rising 20 m</text>

<rect x="30" y="160" width="400" height="420" rx="0" fill="#dce9e7" stroke="none" stroke-width="0" /><line x1="30" y1="160" x2="430" y2="160" stroke="#2e6b62" stroke-width="3" stroke-linecap="round"/><text x="40" y="148" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">surface: 1.0 × 10⁵ Pa</text><circle cx="260" cy="470" r="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="285" y="476" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">2.0 cm³</text><circle cx="260" cy="330" r="18" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><circle cx="260" cy="190" r="22" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="292" y="196" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">6.0 cm³</text><line x1="225" y1="450" x2="225" y2="210" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><line x1="100" y1="166" x2="100" y2="466" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><line x1="100" y1="466" x2="100" y2="166" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="112" y="320" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">20 m</text><line x1="80" y1="470" x2="245" y2="470" stroke="#2e6b62" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/><text x="230" y="560" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">fresh water, ρ = 1000 kg/m³</text><rect x="450" y="110" width="420" height="273.6" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="474" y="151.1" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">pressure at 20 m</text><text x="484" y="191.1" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">= 1.0 × 10⁵ + 20 × 1000 × 10</text><text x="484" y="231.1" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">= 3.0 × 10⁵ Pa</text><text x="474" y="271.1" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">p₁V₁ = p₂V₂</text><text x="484" y="311.1" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">3.0 × 10⁵ × 2.0 = 1.0 × 10⁵ × V₂</text><text x="484" y="351.1" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">V₂ = 6.0 cm³</text><text x="455" y="420" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Pressure falls to a third, so the</text><text x="455" y="445" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">bubble triples in volume. Use the</text><text x="455" y="470" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">TOTAL pressure: add atmospheric</text><text x="455" y="495" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">pressure to h × ρ × g.</text>
</svg>