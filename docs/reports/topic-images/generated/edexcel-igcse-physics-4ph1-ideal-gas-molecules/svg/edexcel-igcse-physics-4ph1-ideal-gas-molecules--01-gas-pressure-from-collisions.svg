<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How gas molecules make a pressure</text>

<rect x="30" y="110" width="840" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="60" y="150" width="400" height="320" rx="0" fill="#dce9e7" stroke="#1e2a44" stroke-width="3.5" /><circle cx="227.08614540466394" cy="327.2642489711934" r="9" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><line x1="234.9415543044033" y1="334.2314974250592" x2="249.53017083249068" y2="347.17067312509573" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/><circle cx="152.1690672153635" cy="293.8716049382716" r="9" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><line x1="141.67751018469295" y1="293.450616729188" x2="122.19318998487621" y2="292.6687814837471" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/><circle cx="101.88161865569273" cy="417.59933127572015" r="9" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><line x1="92.99574658310756" y1="412.0054705776288" x2="76.49341273402082" y2="401.6168721383163" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/><circle cx="202.89046639231825" cy="248.78076131687243" r="9" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><line x1="204.93919214664913" y1="238.48257104947393" x2="208.74396854754937" y2="219.35736055287668" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/><circle cx="277.8622770919067" cy="189.74922839506172" r="9" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><line x1="267.3627121972613" y1="189.8448161721572" x2="247.86352025006272" y2="190.0223363296203" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/><circle cx="149.46371742112484" cy="358.8380658436214" r="9" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><line x1="155.20209914906752" y1="367.6313004671495" x2="165.85909378667534" y2="383.961593339416" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/><circle cx="248.3614540466392" cy="306.38060699588476" r="9" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><line x1="253.05766395318204" y1="315.77185890996356" x2="261.7791966367615" y2="333.21275532182426" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/><circle cx="93.2221536351166" cy="434.7101851851852" r="9" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><line x1="103.53475750884658" y1="432.73529244290035" x2="122.68673613148798" y2="429.06763449294283" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/><circle cx="114.71248285322359" cy="294.16013374485595" r="9" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><line x1="124.8083768111276" y1="291.2751857053313" x2="143.55789416152078" y2="285.91742506049974" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/><circle cx="135.4991083676269" cy="287.06378600823047" r="9" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><line x1="125.5194138954907" y1="283.79947930652264" x2="106.98569559009493" y2="277.73719543192243" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/><circle cx="446" cy="260" r="9" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><path d="M370,220 L446,260 L370,300" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/><line x1="400" y1="284" x2="365" y2="302" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/><line x1="464" y1="260" x2="520" y2="260" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><text x="528" y="252" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">force on</text><text x="528" y="272" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">the wall</text><text x="490" y="340" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Each collision: a tiny force.</text><text x="490" y="366" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Huge numbers every second:</text><text x="490" y="392" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">a steady total force.</text><rect x="490" y="420" width="340" height="50" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2" /><text x="660" y="452" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">pressure = force ÷ area</text><text x="260" y="498" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">random motion at high speed</text><rect x="30" y="525" width="840" height="62" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="562" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">The motion is random, so every wall is hit at the same rate: the pressure is the same on all walls.</text>
</svg>