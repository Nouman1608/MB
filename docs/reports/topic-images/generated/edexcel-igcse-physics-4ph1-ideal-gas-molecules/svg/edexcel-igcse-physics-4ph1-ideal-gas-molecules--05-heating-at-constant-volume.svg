<rect width="900" height="625" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Heating a gas in a rigid container</text>

<rect x="30" y="110" width="840" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="60" y="160" width="250" height="200" rx="0" fill="#dce9e7" stroke="#1e2a44" stroke-width="3.5" /><circle cx="217.07798353909465" cy="326.32621742112485" r="9" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><line x1="214.8096710485266" y1="333.6845296219718" x2="210.59709070890023" y2="347.34996656640186" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/><circle cx="100.27240226337449" cy="215.4258573388203" r="9" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><line x1="100.7310901932094" y1="207.73953146861263" x2="101.58293920575993" y2="193.46492628108408" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/><circle cx="119.69367283950618" cy="231.70142318244172" r="9" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><line x1="122.18328437718722" y1="224.41500881106222" x2="126.80684866145202" y2="210.88309640707178" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/><circle cx="150.50846193415637" cy="279.48624828532235" r="9" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><line x1="154.75612821872772" y1="273.06383977021557" x2="162.64465131864594" y2="261.1365096707316" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/><circle cx="281.8834362139918" cy="263.1136659807956" r="9" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><line x1="279.598481627762" y1="270.466827378376" x2="275.3549945390495" y2="284.1226985453112" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/><circle cx="174.98526234567902" cy="250.9170096021948" r="9" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><line x1="168.33111848986186" y1="247.0424296835338" x2="155.97342275763003" y2="239.84678126316342" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/><circle cx="132.98060699588478" cy="311.2296124828532" r="9" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><line x1="138.6733092188348" y1="316.4145079881474" x2="149.24547049002763" y2="326.0435996408367" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/><text x="185" y="390" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">cooler</text><line x1="320" y1="260" x2="368" y2="260" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><text x="344" y="245" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">heat</text><rect x="380" y="160" width="250" height="200" rx="0" fill="#dce9e7" stroke="#1e2a44" stroke-width="3.5" /><circle cx="537.0779835390947" cy="326.32621742112485" r="9" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><line x1="532.5413585579586" y1="341.04284182281873" x2="524.1161978787059" y2="368.3737157116788" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/><circle cx="420.2724022633745" cy="215.4258573388203" r="9" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><line x1="421.1897781230443" y1="200.05320559840493" x2="422.8934761481454" y2="171.50399522334786" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/><circle cx="439.6936728395062" cy="231.70142318244172" r="9" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><line x1="444.67289591486826" y1="217.12859443968276" x2="453.92002448339787" y2="190.06476963170184" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/><circle cx="470.50846193415634" cy="279.48624828532235" r="9" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><line x1="479.00379450329905" y1="266.64143125510884" x2="494.7808407031355" y2="242.78677105614082" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/><circle cx="601.8834362139918" cy="263.1136659807956" r="9" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><line x1="597.3135270415322" y1="277.8199887759565" x2="588.8265528641073" y2="305.1317311098268" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/><circle cx="494.985262345679" cy="250.9170096021948" r="9" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><line x1="481.6769746340447" y1="243.16784976487284" x2="456.96158316958105" y2="228.77655292413203" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/><circle cx="452.9806069958848" cy="311.2296124828532" r="9" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><line x1="464.3660114417848" y1="321.5994034934416" x2="485.5103339841705" y2="340.85758679882014" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/><text x="505" y="390" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">hotter: faster molecules</text><text x="660" y="190" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">They hit the walls:</text><text x="660" y="218" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• more often, AND</text><text x="660" y="246" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">• harder (bigger</text><text x="660" y="274" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"> force each time)</text><text x="660" y="330" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">so pressure rises</text><text x="660" y="356" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">p ∝ T (in kelvin)</text><rect x="30" y="425" width="840" height="147.6" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="466.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Car tyre: 2.4 × 10⁵ Pa at 7 °C, heated to 37 °C, volume constant</text><text x="54" y="504.1" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">T₁ = 7 + 273 = 280 K        T₂ = 37 + 273 = 310 K</text><text x="54" y="542.1" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">p₂ = p₁ × T₂ ÷ T₁ = 2.4 × 10⁵ × 310 ÷ 280 = 2.7 × 10⁵ Pa (2 s.f.)</text><text x="450" y="600" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">Always convert to kelvin before using p₁ ÷ T₁ = p₂ ÷ T₂.</text>
</svg>