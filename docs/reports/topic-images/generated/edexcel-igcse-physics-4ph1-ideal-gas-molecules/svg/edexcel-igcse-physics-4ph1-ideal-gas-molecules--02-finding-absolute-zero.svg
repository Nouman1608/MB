<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 705" width="900" height="705" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="705" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Finding absolute zero from pressure data</text>

<line x1="156" y1="480" x2="860" y2="480" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="156" y1="480" x2="156" y2="130" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="183.2" y1="480" x2="183.2" y2="487" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><text x="183.2" y="508" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">−273</text><line x1="300" y1="480" x2="300" y2="487" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><text x="300" y="508" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">−200</text><line x1="460" y1="480" x2="460" y2="487" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><text x="460" y="508" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">−100</text><line x1="620" y1="480" x2="620" y2="487" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><text x="620" y="508" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">0</text><line x1="780" y1="480" x2="780" y2="487" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><text x="780" y="508" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">100</text><line x1="149" y1="380" x2="156" y2="380" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><text x="144" y="385" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="end">50</text><line x1="149" y1="280" x2="156" y2="280" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><text x="144" y="285" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="end">100</text><line x1="149" y1="180" x2="156" y2="180" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><text x="144" y="185" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="end">150</text><text x="860" y="536" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">temperature / °C</text><text x="101" y="300" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 101 300)">pressure / kPa</text><line x1="183.2" y1="480" x2="620" y2="280" stroke="#2e6b62" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/><line x1="620" y1="280" x2="780" y2="206.8" stroke="#2e6b62" stroke-width="5" stroke-linecap="round"/><circle cx="620" cy="280" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="780" cy="206.8" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="183.2" cy="480" r="8" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="608" y="266" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">100 kPa at 0 °C</text><text x="770" y="190.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">136.6 kPa at 100 °C</text><text x="173.2" y="534" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">zero pressure at −273 °C: absolute zero</text><text x="380" y="340" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">extend the line back</text><rect x="30" y="560" width="840" height="105.6" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="600.2" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">rise per °C = (136.6 − 100) ÷ 100 = 0.366 kPa per °C</text><text x="54" y="636.2" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">cooling from 0 °C to zero pressure = 100 ÷ 0.366 = 273 °C   →   −273 °C</text><text x="450" y="685" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Zero pressure: molecules have the lowest possible kinetic energy, so no lower temperature is possible.</text>
</svg>