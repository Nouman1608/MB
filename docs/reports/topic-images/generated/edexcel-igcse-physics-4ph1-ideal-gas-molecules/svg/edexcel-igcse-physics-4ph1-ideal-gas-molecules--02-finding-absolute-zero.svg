<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 705" width="900" height="705" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="705" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Finding absolute zero from pressure data</text>

<line x1="132.5" y1="480" x2="902.5" y2="480" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="132.5" y1="480" x2="132.5" y2="60" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="162.25" y1="480" x2="162.25" y2="487" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><text x="162.25" y="508" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">−273</text><line x1="290" y1="480" x2="290" y2="487" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><text x="290" y="508" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">−200</text><line x1="465" y1="480" x2="465" y2="487" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><text x="465" y="508" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">−100</text><line x1="640" y1="480" x2="640" y2="487" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><text x="640" y="508" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">0</text><line x1="815" y1="480" x2="815" y2="487" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><text x="815" y="508" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">100</text><line x1="125.5" y1="360" x2="132.5" y2="360" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><text x="120.5" y="365" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="end">50</text><line x1="125.5" y1="240" x2="132.5" y2="240" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><text x="120.5" y="245" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="end">100</text><line x1="125.5" y1="120" x2="132.5" y2="120" stroke="#1e2a44" stroke-width="2" stroke-linecap="round"/><text x="120.5" y="125" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="end">150</text><text x="902.5" y="536" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">temperature / °C</text><text x="77.5" y="264" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 77.5 264)">pressure / kPa</text><line x1="162.25" y1="480" x2="640" y2="240" stroke="#2e6b62" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/><line x1="640" y1="240" x2="815" y2="152.16000000000003" stroke="#2e6b62" stroke-width="5" stroke-linecap="round"/><circle cx="640" cy="240" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="815" cy="152.16000000000003" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="162.25" cy="480" r="8" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="628" y="226" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">100 kPa at 0 °C</text><text x="805" y="136.16000000000003" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">136.6 kPa at 100 °C</text><text x="176.25" y="464" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">zero pressure at −273 °C: absolute zero</text><text x="377.5" y="312" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">extend the line back</text><rect x="30" y="560" width="840" height="105.6" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="600.2" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">rise per °C = (136.6 − 100) ÷ 100 = 0.366 kPa per °C</text><text x="54" y="636.2" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">cooling from 0 °C to zero pressure = 100 ÷ 0.366 = 273 °C   →   −273 °C</text><text x="450" y="685" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Zero pressure: molecules have the lowest possible kinetic energy, so no lower temperature is possible.</text>
</svg>