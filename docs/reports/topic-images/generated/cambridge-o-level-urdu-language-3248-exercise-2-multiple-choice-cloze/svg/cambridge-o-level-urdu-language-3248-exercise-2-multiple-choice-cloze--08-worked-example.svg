<rect width="900" height="1030" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: four gaps</text>

<rect x="30" y="110" width="840" height="214" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="64" cy="150" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="157.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="846" y="166" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پچھلے اتوار ہم سب دادی جان کے گاؤں ______۔&#x200F;</text><rect x="660" y="194" width="190" height="72" rx="10" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2"/><text x="678" y="238" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">A</text><text x="836" y="240" font-size="24" fill="#4a5568" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;جاتے ہیں&#x200F;</text><rect x="456" y="194" width="190" height="72" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="474" y="238" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">B</text><text x="632" y="240" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;گئے&#x200F;</text><rect x="252" y="194" width="190" height="72" rx="10" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2"/><text x="270" y="238" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">C</text><text x="428" y="240" font-size="24" fill="#4a5568" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;جائیں گے&#x200F;</text><rect x="48" y="194" width="190" height="72" rx="10" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2"/><text x="66" y="238" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">D</text><text x="224" y="240" font-size="24" fill="#4a5568" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;گیا&#x200F;</text><text x="54" y="302" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">B: the time clue is past and the subject is plural; D is singular</text><rect x="30" y="336" width="840" height="214" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="64" cy="376" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="383.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="846" y="392" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;وہاں کی صبح شہر کی صبح ______ کہیں زیادہ پُرسکون تھی۔&#x200F;</text><rect x="660" y="420" width="190" height="72" rx="10" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2"/><text x="678" y="464" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">A</text><text x="836" y="466" font-size="24" fill="#4a5568" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;میں&#x200F;</text><rect x="456" y="420" width="190" height="72" rx="10" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2"/><text x="474" y="464" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">B</text><text x="632" y="466" font-size="24" fill="#4a5568" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کو&#x200F;</text><rect x="252" y="420" width="190" height="72" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="270" y="464" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">C</text><text x="428" y="466" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;سے&#x200F;</text><rect x="48" y="420" width="190" height="72" rx="10" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2"/><text x="66" y="464" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">D</text><text x="224" y="466" font-size="24" fill="#4a5568" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پر&#x200F;</text><text x="54" y="528" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">C: a comparison is made with</text><text x="303.20000000000005" y="530" font-size="22" fill="#2e6b62" text-anchor="start" font-family="Noto Nastaliq Urdu">&#x200F;سے&#x200F;</text><rect x="30" y="562" width="840" height="214" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="64" cy="602" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="609.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="846" y="618" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;دادی جان نے ہمارے لیے مزے دار پراٹھے ______۔&#x200F;</text><rect x="660" y="646" width="190" height="72" rx="10" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2"/><text x="678" y="690" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">A</text><text x="836" y="692" font-size="24" fill="#4a5568" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;بنایا&#x200F;</text><rect x="456" y="646" width="190" height="72" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="474" y="690" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">B</text><text x="632" y="692" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;بنائے&#x200F;</text><rect x="252" y="646" width="190" height="72" rx="10" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2"/><text x="270" y="690" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">C</text><text x="428" y="692" font-size="24" fill="#4a5568" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;بنائی&#x200F;</text><rect x="48" y="646" width="190" height="72" rx="10" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2"/><text x="66" y="690" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">D</text><text x="224" y="692" font-size="24" fill="#4a5568" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;بناتے&#x200F;</text><text x="54" y="754" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">B: after the ergative subject, the verb agrees with the plural object</text><text x="647.6" y="756" font-size="22" fill="#2e6b62" text-anchor="start" font-family="Noto Nastaliq Urdu">&#x200F;پراٹھے&#x200F;</text><rect x="30" y="788" width="840" height="214" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="64" cy="828" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="64" y="835.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="846" y="844" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;واپسی پر ابو نے کہا کہ یہ اس سال کا ______ دن تھا۔&#x200F;</text><rect x="660" y="872" width="190" height="72" rx="10" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2"/><text x="678" y="916" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">A</text><text x="836" y="918" font-size="21" fill="#4a5568" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;سب سے بہترین&#x200F;</text><rect x="456" y="872" width="190" height="72" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="474" y="916" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">B</text><text x="632" y="918" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;بہترین&#x200F;</text><rect x="252" y="872" width="190" height="72" rx="10" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2"/><text x="270" y="916" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">C</text><text x="428" y="918" font-size="24" fill="#4a5568" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;بہتر سے&#x200F;</text><rect x="48" y="872" width="190" height="72" rx="10" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2"/><text x="66" y="916" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">D</text><text x="224" y="918" font-size="21" fill="#4a5568" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;اچھا ترین&#x200F;</text><text x="54" y="980" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">B: this form already means "best"; A doubles it; C and D are not standard</text>
</svg>