<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="670" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Comparatives and superlatives</text>

<rect x="30" y="110" width="840" height="118" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="150" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Comparative</text><text x="846" y="164" font-size="27" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;یہ کمرہ اُس کمرے سے بڑا ہے&#x200F;</text><text x="846" y="208" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">this room is bigger than that room</text><rect x="30" y="242" width="840" height="118" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="282" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Superlative</text><text x="846" y="296" font-size="27" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;یہ شہر کا سب سے بڑا باغ ہے۔&#x200F;</text><text x="846" y="340" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">the biggest garden in the city</text><text x="54" y="178" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">adjective unchanged</text><text x="450" y="384" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Persian forms carry their own degree</text><rect x="669" y="404" width="201" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="769.5" y="456" font-size="27" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;بہتر&#x200F;</text><text x="769.5" y="488" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">better</text><rect x="456" y="404" width="201" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="556.5" y="456" font-size="27" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;بہترین&#x200F;</text><text x="556.5" y="488" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">best</text><rect x="243" y="404" width="201" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="343.5" y="456" font-size="27" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;کم تر&#x200F;</text><text x="343.5" y="488" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">lesser</text><rect x="30" y="404" width="201" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="130.5" y="456" font-size="27" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;کم ترین&#x200F;</text><text x="130.5" y="488" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">least</text><rect x="30" y="530" width="840" height="112" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="54" y="570" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">The usual trap</text><text x="54" y="602" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">best + best: a doubled superlative</text><rect x="430" y="552" width="230" height="70" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="640" y="596" font-size="26" fill="#b5602e" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;سب سے بہترین&#x200F;</text><text x="456" y="596" font-size="26" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><rect x="676" y="552" width="170" height="70" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="826" y="596" font-size="26" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;بہترین&#x200F;</text><text x="702" y="596" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text>
</svg>