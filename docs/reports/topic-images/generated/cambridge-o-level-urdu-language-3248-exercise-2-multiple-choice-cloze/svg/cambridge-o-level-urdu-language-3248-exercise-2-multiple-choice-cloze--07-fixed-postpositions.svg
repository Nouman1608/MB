<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 730" width="900" height="730" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="730" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Verbs with a fixed postposition</text>

<text x="450" y="124" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Some verbs choose their postposition</text><rect x="30" y="146" width="840" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="846" y="194" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کسی سے ملنا&#x200F;</text><text x="54" y="192" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">to meet someone</text><rect x="330" y="164" width="64" height="44" rx="22" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="362" y="194" font-size="22" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;سے&#x200F;</text><rect x="30" y="238" width="840" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="846" y="286" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کسی سے ڈرنا&#x200F;</text><text x="54" y="284" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">to fear someone</text><rect x="330" y="256" width="64" height="44" rx="22" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="362" y="286" font-size="22" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;سے&#x200F;</text><rect x="30" y="330" width="840" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="846" y="378" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کسی کو یاد کرنا&#x200F;</text><text x="54" y="376" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">to remember someone</text><rect x="330" y="348" width="64" height="44" rx="22" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="362" y="378" font-size="22" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;کو&#x200F;</text><rect x="30" y="422" width="840" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="846" y="470" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کسی پر بھروسا کرنا&#x200F;</text><text x="54" y="468" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">to trust someone</text><rect x="330" y="440" width="64" height="44" rx="22" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="362" y="470" font-size="22" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;پر&#x200F;</text><rect x="30" y="514" width="840" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="846" y="562" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کسی کا انتظار کرنا&#x200F;</text><text x="54" y="560" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">to wait for someone</text><rect x="330" y="532" width="64" height="44" rx="22" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="362" y="562" font-size="22" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;کا&#x200F;</text><rect x="30" y="616" width="840" height="86" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="652" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Favourite cloze items:</text><text x="54" y="680" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">two postpositions often both look possible, so learn each verb with its own.</text>
</svg>