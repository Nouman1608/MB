<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 791" width="900" height="791" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="791" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Let the time clue choose the tense</text>

<rect x="30" y="110" width="840" height="546.8" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,160 L31.25,124 Q31.25,111.25 44,111.25 L856,111.25 Q868.75,111.25 868.75,124 L868.75,160 Z" fill="#b5d3cf"/><text x="264" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Clue in the sentence</text><text x="296" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Form</text><line x1="280" y1="110" x2="280" y2="656.8" stroke="#c9d6d4" stroke-width="2"/><text x="854" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Example</text><line x1="470" y1="110" x2="470" y2="656.8" stroke="#c9d6d4" stroke-width="2"/><line x1="30" y1="160" x2="870" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="264" y="211.20000000000002" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;ہر روز، اکثر، عام طور پر&#x200F;</text><text x="296" y="202.65" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">habitual present</text><text x="854" y="211.20000000000002" font-size="24" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;وہ ہر روز اخبار پڑھتا ہے۔&#x200F;</text><line x1="30" y1="236" x2="870" y2="236" stroke="#c9d6d4" stroke-width="2"/><text x="264" y="287.20000000000005" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;ابھی، اس وقت&#x200F;</text><text x="296" y="278.65" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">continuous</text><text x="854" y="287.20000000000005" font-size="24" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;وہ اس وقت اخبار پڑھ رہا ہے۔&#x200F;</text><rect x="32" y="312" width="836" height="96.4" fill="#f2e7b8"/><line x1="30" y1="312" x2="870" y2="312" stroke="#c9d6d4" stroke-width="2"/><text x="264" y="362.4" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کل، پچھلے سال&#x200F;</text><text x="264" y="394.4" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">here: yesterday</text><text x="296" y="364.84999999999997" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">simple past</text><text x="854" y="373.4" font-size="24" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;اس نے کل اخبار پڑھا۔&#x200F;</text><rect x="32" y="408.4" width="836" height="96.4" fill="#f2e7b8"/><line x1="30" y1="408.4" x2="870" y2="408.4" stroke="#c9d6d4" stroke-width="2"/><text x="264" y="458.79999999999995" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کل، اگلے سال&#x200F;</text><text x="264" y="490.79999999999995" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">here: tomorrow</text><text x="296" y="461.24999999999994" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">future</text><text x="854" y="469.79999999999995" font-size="24" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;وہ کل اخبار پڑھے گا۔&#x200F;</text><line x1="30" y1="504.79999999999995" x2="870" y2="504.79999999999995" stroke="#c9d6d4" stroke-width="2"/><text x="264" y="556" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;بچپن میں، پہلے&#x200F;</text><text x="296" y="547.4499999999999" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">habitual past</text><text x="854" y="556" font-size="24" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;وہ بچپن میں کہانیاں پڑھتا تھا۔&#x200F;</text><line x1="30" y1="580.8" x2="870" y2="580.8" stroke="#c9d6d4" stroke-width="2"/><text x="264" y="631.9999999999999" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;ابھی ابھی، پہلے ہی&#x200F;</text><text x="296" y="611.9499999999999" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">perfect</text><text x="296" y="634.9499999999999" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">(completion)</text><text x="854" y="631.9999999999999" font-size="24" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;وہ اخبار پڑھ چکا ہے۔&#x200F;</text><rect x="30" y="676.8" width="840" height="86" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="846" y="728.8" font-size="30" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کل&#x200F;</text><text x="54" y="714.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">means both "yesterday" and "tomorrow":</text><text x="54" y="742.8" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">only the rest of the sentence or passage tells you which.</text>
</svg>