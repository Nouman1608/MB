<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="670" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How to approach every gap</text>

<rect x="30" y="110" width="840" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="154" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="162.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="122" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Read the whole passage first</text><text x="122" y="176" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Ignore the gaps: know who is doing what, and when.</text><rect x="30" y="208" width="840" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="252" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="260.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="122" y="246" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Name the point being tested</text><text x="122" y="274" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Do the options differ in tense, gender, postposition, or meaning?</text><rect x="30" y="306" width="840" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="350" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="76" y="358.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="122" y="344" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Find the clue</text><text x="122" y="372" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A time word, the subject's gender, a postposition, a fixed expression.</text><rect x="30" y="404" width="840" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="448" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="456.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="122" y="442" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Eliminate, then reread</text><text x="122" y="470" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Read the full sentence with your choice in place.</text><text x="450" y="520" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Clues to look for</text><rect x="30" y="538" width="201" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="130.5" y="592" font-size="27" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;نے&#x200F;</text><text x="130.5" y="626" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">agreement</text><rect x="243" y="538" width="201" height="104" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="343.5" y="592" font-size="27" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;سے&#x200F;</text><text x="343.5" y="626" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">comparison</text><rect x="456" y="538" width="201" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="556.5" y="592" font-size="27" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;کل&#x200F;</text><text x="556.5" y="626" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">tense</text><rect x="669" y="538" width="201" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="769.5" y="592" font-size="27" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;ایک / کوئی / کچھ&#x200F;</text><text x="769.5" y="626" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">indefinite</text>
</svg>