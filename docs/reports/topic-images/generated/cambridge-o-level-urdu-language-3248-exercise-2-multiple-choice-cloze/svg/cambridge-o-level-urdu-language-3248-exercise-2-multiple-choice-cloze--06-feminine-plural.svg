<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 818" width="900" height="818" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="818" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Feminine plural and respect endings</text>

<rect x="30" y="110" width="840" height="370" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,160 L31.25,124 Q31.25,111.25 44,111.25 L856,111.25 Q868.75,111.25 868.75,124 L868.75,160 Z" fill="#b5d3cf"/><text x="46" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Tense</text><text x="434" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Feminine plural</text><line x1="230" y1="110" x2="230" y2="480" stroke="#c9d6d4" stroke-width="2"/><text x="854" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Example</text><line x1="450" y1="110" x2="450" y2="480" stroke="#c9d6d4" stroke-width="2"/><line x1="30" y1="160" x2="870" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="204.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">habitual</text><text x="340" y="214.29999999999998" font-size="26" fill="#8a6d0d" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;ـتی ہیں&#x200F;</text><text x="854" y="214.29999999999998" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;لڑکیاں ہر روز کھیلتی ہیں۔&#x200F;</text><line x1="30" y1="240" x2="870" y2="240" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="284.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">continuous</text><text x="340" y="294.3" font-size="26" fill="#8a6d0d" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;رہی ہیں&#x200F;</text><text x="854" y="294.3" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;لڑکیاں کھیل رہی ہیں۔&#x200F;</text><line x1="30" y1="320" x2="870" y2="320" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="353.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">past</text><text x="46" y="376.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">(intransitive)</text><text x="340" y="374.3" font-size="26" fill="#8a6d0d" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;ـئیں&#x200F;</text><text x="854" y="374.3" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;لڑکیاں اسکول گئیں۔&#x200F;</text><line x1="30" y1="400" x2="870" y2="400" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="444.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">future</text><text x="340" y="454.3" font-size="26" fill="#8a6d0d" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;ـیں گی&#x200F;</text><text x="854" y="454.3" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;لڑکیاں کل آئیں گی۔&#x200F;</text><rect x="30" y="500" width="840" height="150" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="538" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The same endings for one respected woman</text><rect x="54" y="554" width="380" height="76" rx="10" fill="#ffffff"/><text x="418" y="604" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;امی کل آئیں گی۔&#x200F;</text><rect x="466" y="554" width="380" height="76" rx="10" fill="#ffffff"/><text x="830" y="604" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;استانی صاحبہ کلاس میں گئیں۔&#x200F;</text><text x="450" y="680" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Options differing only in their ending test gender, number or respect:</text><rect x="600" y="698" width="120" height="90" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="660" y="750" font-size="28" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;ـا&#x200F;</text><rect x="460" y="698" width="120" height="90" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="520" y="750" font-size="28" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;ـی&#x200F;</text><rect x="320" y="698" width="120" height="90" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="380" y="750" font-size="28" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;ـے&#x200F;</text><rect x="180" y="698" width="120" height="90" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="240" y="750" font-size="28" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;ـیں&#x200F;</text>
</svg>