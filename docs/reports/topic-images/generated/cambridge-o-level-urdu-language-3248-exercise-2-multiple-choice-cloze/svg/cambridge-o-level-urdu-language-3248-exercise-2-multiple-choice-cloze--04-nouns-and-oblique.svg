<rect width="900" height="742" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Nouns: plural and oblique forms</text>

<text x="235" y="130" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Masculine nouns</text><text x="665" y="130" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Feminine nouns</text><rect x="30" y="148" width="410" height="92" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="420" y="198" font-size="27" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;لڑکا&#x200F;</text><text x="235" y="192" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">←</text><text x="180" y="198" font-size="27" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;لڑکے&#x200F;</text><text x="235" y="228" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">boy → boys</text><rect x="30" y="252" width="410" height="92" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="420" y="302" font-size="27" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کمرہ&#x200F;</text><text x="235" y="296" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">←</text><text x="180" y="302" font-size="27" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کمرے&#x200F;</text><text x="235" y="332" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">room → rooms</text><rect x="460" y="148" width="410" height="92" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="850" y="198" font-size="27" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;لڑکی&#x200F;</text><text x="665" y="192" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">←</text><text x="610" y="198" font-size="27" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;لڑکیاں&#x200F;</text><text x="665" y="228" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">girl → girls</text><rect x="460" y="252" width="410" height="92" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="850" y="302" font-size="27" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کتاب&#x200F;</text><text x="665" y="296" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">←</text><text x="610" y="302" font-size="27" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کتابیں&#x200F;</text><text x="665" y="332" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">book → books</text><rect x="30" y="372" width="840" height="162" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="410" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Before a postposition: the oblique form</text><rect x="590" y="426" width="252" height="92" rx="10" fill="#dce9e7"/><text x="826" y="478" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;لڑکوں کو&#x200F;</text><text x="826" y="504" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="end" font-style="italic">to the boys</text><rect x="322" y="426" width="252" height="92" rx="10" fill="#dce9e7"/><text x="558" y="478" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کمرے میں&#x200F;</text><text x="558" y="504" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="end" font-style="italic">in the room</text><rect x="54" y="426" width="252" height="92" rx="10" fill="#dce9e7"/><text x="290" y="478" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کتابوں سے&#x200F;</text><text x="290" y="504" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="end" font-style="italic">from the books</text><rect x="30" y="552" width="840" height="162" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="590" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The possessed noun's gender and number choose the possessive</text><rect x="590" y="606" width="252" height="92" rx="10" fill="#dce9e7"/><text x="826" y="658" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;احمد کا قلم&#x200F;</text><text x="826" y="684" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="end" font-style="italic">Ahmad's pen (m.)</text><rect x="322" y="606" width="252" height="92" rx="10" fill="#f2e7b8"/><text x="558" y="658" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;احمد کی کتاب&#x200F;</text><text x="558" y="684" font-size="15" font-weight="400" fill="#8a6d0d" text-anchor="end" font-style="italic">Ahmad's book (f.)</text><rect x="54" y="606" width="252" height="92" rx="10" fill="#dce9e7"/><text x="290" y="658" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;احمد کے دوست&#x200F;</text><text x="290" y="684" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="end" font-style="italic">Ahmad's friends (pl.)</text>
</svg>