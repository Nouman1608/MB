<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 938" width="900" height="938" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="938" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who does the verb agree with?</text>

<rect x="30" y="110" width="840" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="54" y="132" width="76" height="60" rx="10" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="92" y="172" font-size="26" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;نے&#x200F;</text><text x="146" y="172" font-size="26" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><text x="54" y="226" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Verb agrees with the SUBJECT</text><rect x="450" y="126" width="404" height="90" rx="10" fill="#dce9e7"/><text x="838" y="172" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;لڑکی خط لکھتی ہے۔&#x200F;</text><text x="838" y="202" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="end" font-style="italic">feminine subject, feminine verb</text><rect x="450" y="226" width="404" height="90" rx="10" fill="#dce9e7"/><text x="838" y="272" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;لڑکے کھیل رہے ہیں۔&#x200F;</text><text x="838" y="302" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="end" font-style="italic">masculine plural subject and verb</text><rect x="30" y="354" width="840" height="230" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><rect x="54" y="376" width="76" height="60" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="92" y="416" font-size="26" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;نے&#x200F;</text><text x="146" y="416" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="54" y="470" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Verb agrees with the OBJECT</text><text x="54" y="496" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">transitive verb, perfective tense</text><rect x="450" y="370" width="404" height="90" rx="10" fill="#dce9e7"/><text x="838" y="416" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;لڑکے نے کتاب پڑھی۔&#x200F;</text><text x="838" y="446" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="end" font-style="italic">feminine object, feminine verb</text><rect x="450" y="470" width="404" height="90" rx="10" fill="#dce9e7"/><text x="838" y="516" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;لڑکی نے خط لکھا۔&#x200F;</text><text x="838" y="546" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="end" font-style="italic">masculine object, masculine verb</text><rect x="30" y="598" width="840" height="170" rx="14" fill="#ffffff" stroke="#d4b02e" stroke-width="2.5"/><rect x="54" y="620" width="76" height="60" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="92" y="660" font-size="26" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;نے&#x200F;</text><text x="146" y="660" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><rect x="184" y="620" width="76" height="60" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="222" y="660" font-size="26" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;کو&#x200F;</text><text x="276" y="660" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="54" y="714" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">Verb stays masculine singular</text><text x="54" y="740" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">the object takes the object marker</text><rect x="450" y="614" width="404" height="90" rx="10" fill="#f2e7b8"/><text x="838" y="660" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;اس نے لڑکیوں کو بلایا۔&#x200F;</text><text x="838" y="690" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="end" font-style="italic">object marked: masculine singular verb</text><rect x="30" y="782" width="840" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="820" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Respect plural: elders take plural verbs</text><rect x="54" y="834" width="380" height="62" rx="10" fill="#dce9e7"/><text x="418" y="876" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;دادی جان آ رہی ہیں۔&#x200F;</text><rect x="466" y="834" width="380" height="62" rx="10" fill="#dce9e7"/><text x="830" y="876" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;استاد صاحب کہتے ہیں۔&#x200F;</text>
</svg>