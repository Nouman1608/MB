<rect width="900" height="807" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Register: two sets of tools</text>

<rect x="30" y="110" width="840" height="553" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,160 L31.25,124 Q31.25,111.25 44,111.25 L856,111.25 Q868.75,111.25 868.75,124 L868.75,160 Z" fill="#b5d3cf"/><text x="46" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start"></text><text x="514" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Informal (friend, cousin)</text><line x1="190" y1="110" x2="190" y2="663" stroke="#c9d6d4" stroke-width="2"/><text x="854" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Formal (teacher, principal)</text><line x1="530" y1="110" x2="530" y2="663" stroke="#c9d6d4" stroke-width="2"/><line x1="30" y1="160" x2="870" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="224.55" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Greeting</text><text x="514" y="208.55" font-size="23" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پیاری سارہ،&#x200F;</text><text x="514" y="256.55" font-size="23" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;عزیز دوست احمد،&#x200F;</text><text x="854" y="208.55" font-size="23" fill="#8a6d0d" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;محترمہ پرنسپل صاحبہ،&#x200F;</text><text x="854" y="256.55" font-size="23" fill="#8a6d0d" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;جناب ...&#x200F;</text><line x1="30" y1="279.8" x2="870" y2="279.8" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="344.35" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Opening line</text><text x="514" y="328.35" font-size="23" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کیسی ہو؟&#x200F;</text><text x="514" y="376.35" font-size="23" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;امید ہے سب خیریت سے ہو گا۔&#x200F;</text><text x="854" y="328.35" font-size="23" fill="#8a6d0d" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;السلام علیکم۔&#x200F;</text><text x="854" y="376.35" font-size="23" fill="#8a6d0d" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;امید ہے آپ بخیریت ہوں گے۔&#x200F;</text><rect x="32" y="399.6" width="836" height="71.80000000000001" fill="#f2e7b8"/><line x1="30" y1="399.6" x2="870" y2="399.6" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="440.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Address</text><text x="514" y="448.15000000000003" font-size="23" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;تم&#x200F;</text><text x="854" y="448.15000000000003" font-size="23" fill="#8a6d0d" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;آپ&#x200F;</text><line x1="30" y1="471.40000000000003" x2="870" y2="471.40000000000003" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="511.95000000000005" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Verb forms</text><text x="514" y="519.95" font-size="23" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;آؤ، بتاؤ، کرنا&#x200F;</text><text x="854" y="519.95" font-size="23" fill="#8a6d0d" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;تشریف لائیے، بتائیے، فرمائیے&#x200F;</text><line x1="30" y1="543.2" x2="870" y2="543.2" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="607.75" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Closing</text><text x="514" y="591.75" font-size="23" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;تمھاری دوست، عائشہ&#x200F;</text><text x="514" y="639.75" font-size="23" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;جلد جواب دینا!&#x200F;</text><text x="854" y="591.75" font-size="23" fill="#8a6d0d" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;والسلام، آپ کا شاگرد ...&#x200F;</text><text x="854" y="639.75" font-size="23" fill="#8a6d0d" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;شکریہ کے ساتھ&#x200F;</text><rect x="30" y="683" width="840" height="96" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="721" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Choose once and hold it.</text><text x="54" y="753" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Switching address form within one email is the most common register fault.</text>
</svg>