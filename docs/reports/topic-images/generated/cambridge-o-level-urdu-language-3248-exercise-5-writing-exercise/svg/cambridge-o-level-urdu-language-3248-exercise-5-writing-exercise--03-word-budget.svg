<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 568" width="900" height="568" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="568" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Covering the prompts in 150 words</text>

<text x="450" y="124" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">About 150 words, usually three prompts</text><rect x="30" y="142" width="64" height="74" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="62" y="178" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">opening</text><rect x="100" y="142" width="224" height="74" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="212" y="178" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">prompt 1</text><text x="212" y="202" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">about 40 words</text><rect x="330" y="142" width="224" height="74" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="442" y="178" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">prompt 2</text><text x="442" y="202" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">about 40 words</text><rect x="560" y="142" width="224" height="74" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="672" y="178" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">prompt 3</text><text x="672" y="202" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">about 40 words</text><rect x="790" y="142" width="58" height="74" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="819" y="178" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">closing</text><text x="65" y="236" font-size="15" font-weight="400" fill="#8a6d0d" text-anchor="middle">short</text><text x="831" y="236" font-size="15" font-weight="400" fill="#8a6d0d" text-anchor="middle">short</text><rect x="30" y="268" width="410" height="168" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="304.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Each prompt = a paragraph</text><text x="50" y="332.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A missing prompt is a missing part of the</text><text x="50" y="354.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">message, which W1 cannot reward. The last</text><text x="50" y="376.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">prompt is the one most often rushed.</text><rect x="460" y="268" width="410" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="304.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Pictures are content</text><text x="480" y="332.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Describe, explain or give an opinion on what</text><text x="480" y="354.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">they show. Naming two or three details gives</text><text x="480" y="376.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the writing substance.</text><rect x="30" y="456" width="840" height="84" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="54" y="492" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Far over the length?</text><text x="54" y="520" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">250 words means more errors and less checking time.</text>
</svg>