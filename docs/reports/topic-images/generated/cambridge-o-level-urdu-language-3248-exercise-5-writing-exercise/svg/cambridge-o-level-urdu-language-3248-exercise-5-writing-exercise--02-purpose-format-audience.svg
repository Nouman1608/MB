<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading the brief</text>

<rect x="30" y="110" width="268" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="150" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="157.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="96" y="157" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Purpose</text><text x="278" y="162" font-size="27" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;مقصد&#x200F;</text><rect x="48" y="196" width="232" height="44" rx="8" fill="#dce9e7"/><text x="164" y="224" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">inviting, thanking, apologising</text><rect x="48" y="252" width="232" height="44" rx="8" fill="#dce9e7"/><text x="164" y="280" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">informing, requesting</text><rect x="48" y="308" width="232" height="44" rx="8" fill="#dce9e7"/><text x="164" y="336" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">describing, recommending</text><text x="164" y="386" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">Many tasks combine two.</text><rect x="316" y="110" width="268" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="352" cy="150" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="352" y="157.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="382" y="157" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Format</text><text x="564" y="162" font-size="27" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;طرزِ تحریر&#x200F;</text><rect x="334" y="196" width="232" height="44" rx="8" fill="#dce9e7"/><text x="450" y="224" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">email: subject line, greeting</text><rect x="334" y="252" width="232" height="44" rx="8" fill="#dce9e7"/><text x="450" y="280" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">letter, short article</text><rect x="334" y="308" width="232" height="44" rx="8" fill="#dce9e7"/><text x="450" y="336" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">blog: title, personal voice</text><text x="450" y="386" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">Each format has a shape.</text><rect x="602" y="110" width="268" height="330" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><circle cx="638" cy="150" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="638" y="157.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="668" y="157" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Audience</text><text x="850" y="162" font-size="27" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;مخاطب&#x200F;</text><rect x="620" y="196" width="232" height="44" rx="8" fill="#ffffff"/><text x="736" y="224" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">friend, relative</text><rect x="620" y="252" width="232" height="44" rx="8" fill="#ffffff"/><text x="736" y="280" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">teacher, principal</text><rect x="620" y="308" width="232" height="44" rx="8" fill="#ffffff"/><text x="736" y="336" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">readers of a school website</text><text x="736" y="386" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle">The audience decides the</text><text x="736" y="407" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle">register.</text><rect x="30" y="462" width="840" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="504" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Answer all three in the margin before you write a word.</text>
