<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 642" width="900" height="642" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="642" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Linking devices for 150 words</text>

<rect x="30" y="110" width="840" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="160" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">To add</text><text x="846" y="164" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;اس کے علاوہ، ساتھ ہی، یہی نہیں بلکہ&#x200F;</text><rect x="30" y="206" width="840" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="256" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">To explain</text><text x="846" y="260" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کیونکہ، اس لیے کہ، اسی وجہ سے&#x200F;</text><rect x="30" y="302" width="840" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="352" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">To contrast</text><text x="846" y="356" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;لیکن، البتہ، تاہم&#x200F;</text><rect x="30" y="398" width="840" height="84" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="448" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">To sequence</text><text x="846" y="452" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;سب سے پہلے، اس کے بعد، آخر میں&#x200F;</text><rect x="30" y="494" width="840" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="544" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">To conclude</text><text x="846" y="548" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;بس یہی کہنا تھا، امید ہے&#x200F;</text><text x="450" y="612" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Two or three different connectives, used naturally, show range in a short piece.</text>
</svg>