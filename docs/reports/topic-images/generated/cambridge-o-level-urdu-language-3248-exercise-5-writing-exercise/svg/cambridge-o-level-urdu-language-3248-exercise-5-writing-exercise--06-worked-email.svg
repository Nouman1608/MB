<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="900" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: an informal email</text>

<rect x="300" y="110" width="570" height="760" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="846" y="160" font-size="23" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;موضوع: اگلے ہفتے میلہ — ساتھ چلو گی؟&#x200F;</text><text x="846" y="222" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پیاری مریم،&#x200F;</text><text x="846" y="282" font-size="22" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کیسی ہو؟ امتحان ختم ہونے کی بہت مبارک ہو!&#x200F;</text><rect x="318" y="306" width="540" height="96" rx="8" fill="#dce9e7"/><rect x="326" y="320" width="520" height="10" rx="5" fill="#b5d3cf"/><rect x="326" y="342" width="520" height="10" rx="5" fill="#b5d3cf"/><rect x="326" y="364" width="520" height="10" rx="5" fill="#b5d3cf"/><rect x="560" y="386" width="286" height="10" rx="5" fill="#b5d3cf"/><rect x="318" y="414" width="540" height="96" rx="8" fill="#dce9e7"/><rect x="326" y="428" width="520" height="10" rx="5" fill="#b5d3cf"/><rect x="326" y="450" width="520" height="10" rx="5" fill="#b5d3cf"/><rect x="560" y="472" width="286" height="10" rx="5" fill="#b5d3cf"/><text x="846" y="498" font-size="21" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کیا تم ہفتے کی شام میرے ساتھ چلو گی؟&#x200F;</text><rect x="318" y="522" width="540" height="150" rx="8" fill="#dce9e7"/><text x="846" y="560" font-size="21" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;میں تو سب سے پہلے ...&#x200F;</text><rect x="326" y="578" width="520" height="10" rx="5" fill="#b5d3cf"/><rect x="326" y="600" width="520" height="10" rx="5" fill="#b5d3cf"/><rect x="560" y="622" width="286" height="10" rx="5" fill="#b5d3cf"/><text x="846" y="656" font-size="21" fill="#8a6d0d" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;اس کے بعد ... کیونکہ ... آخر میں ...&#x200F;</text><text x="846" y="714" font-size="23" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;جلدی جواب دینا۔&#x200F;</text><text x="846" y="774" font-size="23" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;تمھاری دوست،&#x200F;</text><text x="846" y="830" font-size="23" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;ثنا&#x200F;</text><text x="30" y="146" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Subject line</text><text x="30" y="168" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">an email format feature</text><line x1="155.2" y1="140" x2="296" y2="140" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="4 4"/><text x="30" y="214" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Informal greeting</text><text x="30" y="236" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">audience: a friend</text><line x1="203.2" y1="208" x2="296" y2="208" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="4 4"/><text x="30" y="274" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Friendly opening</text><line x1="193.6" y1="268" x2="296" y2="268" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="4 4"/><text x="30" y="352" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Prompt 1: the festival</text><text x="30" y="374" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">park, craftspeople, music, food</text><line x1="251.2" y1="346" x2="296" y2="346" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="4 4"/><text x="30" y="460" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Prompt 2: the invitation</text><text x="30" y="482" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">one address form throughout</text><line x1="270.4" y1="454" x2="296" y2="454" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="4 4"/><text x="30" y="596" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Prompt 3: plans</text><text x="30" y="618" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">sequenced with connectives</text><line x1="184" y1="590" x2="296" y2="590" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="4 4"/><text x="30" y="770" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Informal closing</text><text x="30" y="792" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">and signature</text><line x1="193.6" y1="764" x2="296" y2="764" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="4 4"/>
</svg>