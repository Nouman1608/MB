<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 774" width="900" height="774" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="774" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Same purpose, formal audience</text>

<rect x="30" y="110" width="840" height="160" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="146" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">To a friend</text><text x="54" y="170" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">informal invitation</text><text x="846" y="224" font-size="27" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کیا تم ہفتے کی شام میرے ساتھ چلو گی؟&#x200F;</text><line x1="450" y1="274" x2="450" y2="304" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="470" y="296" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">same purpose, new audience</text><rect x="30" y="310" width="840" height="216" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="346" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">To the principal</text><text x="54" y="370" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">formal invitation</text><text x="846" y="420" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;ہماری خواہش ہے کہ آپ ہفتے کی شام تشریف لا کر&#x200F;</text><text x="846" y="470" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;ہمارے اسٹال کا افتتاح فرمائیں۔&#x200F;</text><text x="846" y="512" font-size="22" fill="#8a6d0d" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;آپ کی آمد ہمارے لیے باعثِ عزت ہوگی۔&#x200F;</text><text x="450" y="566" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Content is similar; vocabulary, verb forms and tone are entirely different.</text><text x="450" y="606" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Exam technique</text><rect x="30" y="624" width="268" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="659.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Greeting and closing</text><text x="50" y="683.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">first</text><text x="50" y="711.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">so the register is fixed</text><text x="50" y="733.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">from the start</text><rect x="316" y="624" width="268" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="336" y="659.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Count paragraphs</text><text x="336" y="687.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">against prompts before you</text><text x="336" y="709.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">finish</text><rect x="602" y="624" width="268" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="622" y="659.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Protect ~25 minutes</text><text x="622" y="687.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and keep 3-4 minutes to</text><text x="622" y="709.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">check agreement and</text><text x="622" y="731.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">punctuation</text>
</svg>