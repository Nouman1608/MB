<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="670" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Exercise 5: what is assessed</text>

<rect x="30" y="110" width="268" height="116" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="164" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">14 marks</text><text x="164" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">the most on the paper</text><rect x="316" y="110" width="268" height="116" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">~150 words</text><text x="450" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">functional prose, e.g. an</text><text x="450" y="205" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">email</text><rect x="602" y="110" width="268" height="116" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="736" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">W1 to W5</text><text x="736" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">writing objectives only</text><rect x="30" y="250" width="840" height="390" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,300 L31.25,264 Q31.25,251.25 44,251.25 L856,251.25 Q868.75,251.25 868.75,264 L868.75,300 Z" fill="#b5d3cf"/><text x="46" y="282" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start"></text><text x="136" y="282" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Syllabus focus</text><line x1="120" y1="250" x2="120" y2="640" stroke="#c9d6d4" stroke-width="2"/><text x="516" y="282" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">In a 150-word email</text><line x1="500" y1="250" x2="500" y2="640" stroke="#c9d6d4" stroke-width="2"/><line x1="30" y1="300" x2="870" y2="300" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="338.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">W1</text><text x="136" y="327.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">communicate information, ideas,</text><text x="136" y="350.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">opinions clearly</text><text x="516" y="338.65" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">every prompt answered, clearly</text><line x1="30" y1="368" x2="870" y2="368" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="406.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">W2</text><text x="136" y="395.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">coherent paragraphs, a range of linking</text><text x="136" y="418.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">devices</text><text x="516" y="406.65" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">short paragraphs, varied connectives</text><line x1="30" y1="436" x2="870" y2="436" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="474.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">W3</text><text x="136" y="463.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">accurate grammar and vocabulary in</text><text x="136" y="486.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">context</text><text x="516" y="463.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">tenses, agreement, a few richer</text><text x="516" y="486.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">structures</text><line x1="30" y1="504" x2="870" y2="504" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="542.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">W4</text><text x="136" y="542.65" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">punctuation and spelling</text><text x="516" y="531.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Urdu full stop, comma and question</text><text x="516" y="554.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">mark; correct spelling</text><line x1="30" y1="572" x2="870" y2="572" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="610.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">W5</text><text x="136" y="599.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">register and style/format for purpose</text><text x="136" y="622.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">and audience</text><text x="516" y="599.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the right greeting, address forms and</text><text x="516" y="622.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">closing</text>
</svg>