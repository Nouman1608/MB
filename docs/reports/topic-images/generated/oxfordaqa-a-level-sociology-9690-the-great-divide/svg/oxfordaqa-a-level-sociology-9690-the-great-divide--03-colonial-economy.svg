<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="460" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How colonial economies were organised</text>

<rect x="30" y="110" width="186" height="130" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="123" y="163.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Mines and</text><text x="123" y="187.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">plantations</text><line x1="220" y1="175" x2="244" y2="175" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="248" y="110" width="186" height="130" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="341" y="142.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Railways to</text><text x="341" y="166.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">ports</text><text x="341" y="196.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">not linking local</text><text x="341" y="217.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">markets</text><line x1="438" y1="175" x2="462" y2="175" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="466" y="110" width="186" height="130" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="559" y="163.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Raw materials</text><text x="559" y="187.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">exported</text><line x1="656" y1="175" x2="680" y2="175" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="684" y="110" width="186" height="130" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="777" y="163.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Manufactured</text><text x="777" y="187.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">goods imported</text><rect x="30" y="260" width="412" height="174" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,310 L31.25,274.25 Q31.25,261.25 44.25,261.25 L427.75,261.25 Q440.75,261.25 440.75,274.25 L440.75,310 Z" fill="#d4b02e"/><line x1="31.25" y1="310" x2="440.75" y2="310" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="290.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Deindustrialisation</text><text x="44" y="341.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">India</text><text x="44" y="368.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Handloom textiles declined against British</text><text x="44" y="389.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">machine-made cloth and colonial trade policy.</text><rect x="458" y="260" width="412" height="174" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,310 L459.25,274.25 Q459.25,261.25 472.25,261.25 L855.75,261.25 Q868.75,261.25 868.75,274.25 L868.75,310 Z" fill="#d4b02e"/><line x1="459.25" y1="310" x2="868.75" y2="310" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="290.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Rodney (1972)</text><text x="472" y="341.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">How Europe Underdeveloped Africa</text><text x="472" y="368.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The slave trade removed young, productive</text><text x="472" y="389.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">people, encouraged warfare and raiding, and</text><text x="472" y="410.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">oriented economies to supplying captives.</text>
</svg>