<rect width="900" height="473" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Legacies of colonialism and enslavement</text>

<rect x="30" y="104" width="269.3333333333333" height="228" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L285.0833333333333,105.25 Q298.0833333333333,105.25 298.0833333333333,118.25 L298.0833333333333,154 Z" fill="#f2e7b8"/><line x1="31.25" y1="154" x2="298.0833333333333" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="134.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Economic</text><circle cx="51" cy="181.92" r="4.5" fill="#2e6b62"/><text x="64" y="187.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Narrow range of primary</text><text x="64" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">exports</text><circle cx="51" cy="231.92" r="4.5" fill="#2e6b62"/><text x="64" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Infrastructure built for</text><text x="64" y="258.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">extraction</text><circle cx="51" cy="281.92" r="4.5" fill="#2e6b62"/><text x="64" y="287.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Debt</text><rect x="315.3333333333333" y="104" width="269.3333333333333" height="228" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,154 L316.5833333333333,118.25 Q316.5833333333333,105.25 329.5833333333333,105.25 L570.4166666666666,105.25 Q583.4166666666666,105.25 583.4166666666666,118.25 L583.4166666666666,154 Z" fill="#dce9e7"/><line x1="316.5833333333333" y1="154" x2="583.4166666666666" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="134.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Political</text><circle cx="336.3333333333333" cy="181.92" r="4.5" fill="#2e6b62"/><text x="349.3333333333333" y="187.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Colonial borders cutting</text><text x="349.3333333333333" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">across ethnic and</text><text x="349.3333333333333" y="229.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">linguistic groups</text><circle cx="336.3333333333333" cy="252.92" r="4.5" fill="#2e6b62"/><text x="349.3333333333333" y="258.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Inherited authoritarian</text><text x="349.3333333333333" y="279.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">state structures</text><rect x="600.6666666666666" y="104" width="269.3333333333333" height="228" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,154 L601.9166666666666,118.25 Q601.9166666666666,105.25 614.9166666666666,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#b5d3cf"/><line x1="601.9166666666666" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="134.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Social and cultural</text><circle cx="621.6666666666666" cy="181.92" r="4.5" fill="#2e6b62"/><text x="634.6666666666666" y="187.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Racism and racial</text><text x="634.6666666666666" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">hierarchies</text><circle cx="621.6666666666666" cy="231.92" r="4.5" fill="#2e6b62"/><text x="634.6666666666666" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Colonial languages in</text><text x="634.6666666666666" y="258.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">education and government</text><circle cx="621.6666666666666" cy="281.92" r="4.5" fill="#2e6b62"/><text x="634.6666666666666" y="287.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Diasporas from forced and</text><text x="634.6666666666666" y="308.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">indentured migration</text><rect x="30" y="348" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="384" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Example: Haiti</text><text x="56" y="413" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">After the Haitian Revolution (1791–1804), France demanded a large indemnity in 1825 for</text><text x="56" y="435" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">recognising independence, a burden on Haiti’s economy for generations.</text>
</svg>