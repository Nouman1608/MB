<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 727" width="900" height="727" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="727" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why Europe industrialised: four explanations</text>

<rect x="198" y="104" width="332" height="44" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="364" y="130.74" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Core claim</text><rect x="538" y="104" width="332" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="704" y="130.74" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Extra depth for evaluation</text><rect x="30" y="156" width="160" height="90" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="195.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Modernisation</text><text x="42" y="217.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">theory</text><rect x="198" y="156" width="332" height="90" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="212" y="185.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Achievement, science, secular</text><text x="212" y="205.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">rationality and secure property rights</text><text x="212" y="225.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">enabled growth</text><rect x="538" y="156" width="332" height="90" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="552" y="185.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">McClelland (1961): "need for</text><text x="552" y="205.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">achievement"; critics: ethnocentric,</text><text x="552" y="225.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">blind to exploitation</text><rect x="30" y="254" width="160" height="96" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="285.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Protestant</text><text x="42" y="307.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">work ethic</text><text x="42" y="329.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">(Weber)</text><rect x="198" y="254" width="332" height="96" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="212" y="283.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Ascetic Protestantism encouraged</text><text x="212" y="303.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">disciplined work and reinvestment: an</text><text x="212" y="323.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">"elective affinity"</text><rect x="538" y="254" width="332" height="96" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="552" y="283.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Weber did not claim religion alone</text><text x="552" y="303.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">caused capitalism; wider thesis on</text><text x="552" y="323.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">rationalisation</text><rect x="30" y="358" width="160" height="90" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="397.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Dependency</text><text x="42" y="419.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">theory</text><rect x="198" y="358" width="332" height="90" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="212" y="387.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">The core developed by exploiting the</text><text x="212" y="407.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">periphery</text><rect x="538" y="358" width="332" height="90" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="552" y="387.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Frank (1966): "the development of</text><text x="552" y="407.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">underdevelopment"; Wallerstein adds a</text><text x="552" y="427.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">semi-periphery</text><rect x="30" y="456" width="160" height="90" rx="10" fill="#b5d3cf" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="506.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Enslavement</text><rect x="198" y="456" width="332" height="90" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="212" y="485.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Slavery and plantation profits helped</text><text x="212" y="505.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">fund industry</text><rect x="538" y="456" width="332" height="90" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="552" y="485.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Drescher (1977): abolition while still</text><text x="552" y="505.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">profitable; plantation cotton fed</text><text x="552" y="525.25" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">textile mills</text><rect x="30" y="562" width="840" height="141" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="598" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Also credited</text><circle cx="61" cy="621.39" r="4.5" fill="#8a6d0d"/><text x="74" y="627" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Sachs (2005):</tspan> geography (landlocked, tropical disease) and the poverty trap</text><circle cx="61" cy="651.39" r="4.5" fill="#8a6d0d"/><text x="74" y="657" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Acemoglu and Robinson (2012):</tspan> extractive colonial institutions persisted after</text><text x="74" y="679" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">independence</text>
</svg>