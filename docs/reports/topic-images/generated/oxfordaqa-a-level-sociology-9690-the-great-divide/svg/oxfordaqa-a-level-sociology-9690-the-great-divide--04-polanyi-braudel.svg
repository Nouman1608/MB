<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 621" width="900" height="621" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="621" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Market society and merchant capitalism</text>

<text x="30" y="114" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Polanyi (1944): the Great Transformation</text><rect x="30" y="130" width="187.5" height="151" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="123.75" y="163.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Market society</text><text x="123.75" y="193.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">economy</text><text x="123.75" y="214.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">"disembedded" from</text><text x="123.75" y="235.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">social</text><text x="123.75" y="256.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">relationships</text><line x1="221.5" y1="205.5" x2="243.5" y2="205.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="247.5" y="130" width="187.5" height="151" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="341.25" y="162.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Fictitious</text><text x="341.25" y="186.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">commodities</text><text x="341.25" y="216.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">land, labour and</text><text x="341.25" y="237.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">money treated as if</text><text x="341.25" y="258.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">produced for sale</text><line x1="439" y1="205.5" x2="461" y2="205.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="465" y="130" width="187.5" height="151" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="558.75" y="163.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Dislocation</text><text x="558.75" y="193.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">enclosure; people</text><text x="558.75" y="214.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">pushed off the land</text><text x="558.75" y="235.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">into industrial</text><text x="558.75" y="256.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">towns</text><line x1="656.5" y1="205.5" x2="678.5" y2="205.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="682.5" y="130" width="187.5" height="151" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="776.25" y="174.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Double movement</text><text x="776.25" y="204.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">protective</text><text x="776.25" y="225.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">response: factory</text><text x="776.25" y="246.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">laws, trade unions</text><text x="30" y="315" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Braudel: three layers of economic life</text><rect x="160" y="331" width="580" height="64" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="359" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Capitalism</text><text x="450" y="382" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">large merchants and financiers: long-distance trade</text><rect x="95" y="403" width="710" height="64" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="431" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Market economy</text><text x="450" y="454" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">ordinary local exchange</text><rect x="30" y="475" width="840" height="64" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="503" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Material life</text><text x="450" y="526" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">subsistence and self-provisioning</text><text x="450" y="565" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Capitalism grew over centuries through control of trade networks centred on a succession of</text><text x="450" y="586" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">dominant cities: deep roots before factories.</text>
</svg>