<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="900" height="630" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="630" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Imperialism: from trade to rule</text>

<line x1="175" y1="120" x2="175" y2="594" stroke="#1e2a44" stroke-width="4"/><rect x="197" y="110" width="673" height="76" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="175" cy="148" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="153" y="154" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="end">1492–1498</text><text x="215" y="140.64" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Exploration and trade</text><text x="215" y="168.64" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Columbus crosses the Atlantic; da Gama reaches India</text><rect x="197" y="198" width="673" height="76" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="175" cy="236" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="153" y="242" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="end">1600, 1602</text><text x="215" y="228.64" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Chartered companies</text><text x="215" y="256.64" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">English and Dutch East India Companies combine trade with armed force</text><rect x="197" y="286" width="673" height="98" rx="12" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="175" cy="335" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="153" y="341" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="end">16th–19th c.</text><text x="215" y="316.64" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Enslavement</text><text x="215" y="344.64" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">More than twelve million Africans forcibly transported to American</text><text x="215" y="366.64" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">plantations</text><rect x="197" y="396" width="673" height="98" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="175" cy="445" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="153" y="451" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="end">1858; 1884–85</text><text x="215" y="426.64" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Colonialism</text><text x="215" y="454.64" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">British Crown rules India directly; Berlin Conference sets rules for</text><text x="215" y="476.64" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">dividing Africa</text><rect x="197" y="506" width="673" height="98" rx="12" fill="#b5d3cf" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="175" cy="555" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="153" y="561" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="end">after 1945</text><text x="215" y="536.64" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Neocolonialism</text><text x="215" y="564.64" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Influence through debt, trade terms, foreign ownership and loan</text><text x="215" y="586.64" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">conditions (Bello: structural adjustment from the 1980s)</text>
</svg>