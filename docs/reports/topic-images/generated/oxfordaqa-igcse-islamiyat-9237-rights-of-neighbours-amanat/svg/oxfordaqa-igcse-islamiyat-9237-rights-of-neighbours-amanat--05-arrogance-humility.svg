<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 606" width="900" height="606" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="606" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Arrogance (kibr) and humility</text>

<rect x="30" y="104" width="840" height="85" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="137" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">THE FIRST SIN</text><text x="450" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Iblis refused to prostrate to Adam (AS): “I am better than him” (7:12)</text><rect x="30" y="207" width="408" height="217" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="243.8" font-size="21" font-weight="700" fill="#b5602e" text-anchor="start">Arrogance is…</text><text x="50" y="274.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="274.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Rejecting the truth</text><text x="50" y="301.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="301.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Looking down on people</text><text x="50" y="328.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="328.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Walking “exultantly” and turning the</text><text x="66.15" y="350.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">cheek in contempt (31:18)</text><text x="50" y="377.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="377.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">An atom’s weight keeps one from Paradise</text><text x="66.15" y="399.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">(Muslim)</text><rect x="462" y="207" width="408" height="217" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="482" y="243.8" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">Arrogance is not…</text><text x="482" y="274.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="498.15" y="274.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Liking good clothes</text><text x="482" y="301.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="498.15" y="301.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“Allah is beautiful and loves beauty”</text><text x="498.15" y="323.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">(Muslim)</text><rect x="30" y="442" width="840" height="134" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="478" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Social impact</text><text x="50" y="507.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Arrogance divides people by wealth, race or status, the opposite of the equality shown in</text><text x="50" y="529.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the rows of Salah and the white clothes of Hajj. Humility makes a Muslim approachable, open</text><text x="50" y="551.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">to correction and fair.</text>
</svg>