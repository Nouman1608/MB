<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="900" height="630" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="630" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Backbiting or slander?</text>

<rect x="250" y="110" width="400" height="70" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="137.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Saying about someone what they would</text><text x="450" y="161.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">dislike</text><line x1="360" y1="184" x2="230" y2="228" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="540" y1="184" x2="670" y2="228" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="258" y="202" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="end">if true</text><text x="642" y="202" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">if not true</text><rect x="30" y="234" width="390" height="92" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="225" y="270.8" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="middle">Backbiting (ghibah)</text><text x="225" y="301.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Wrong even when true</text><rect x="480" y="234" width="390" height="92" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="675" y="270.8" font-size="21" font-weight="700" fill="#b5602e" text-anchor="middle">Slander (buhtan)</text><text x="675" y="301.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">A lie about the person</text><rect x="30" y="344" width="840" height="112" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="380" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Qur’an 49:12</text><text x="50" y="409.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“Do not spy or backbite each other. Would one of you like to eat the flesh of his brother</text><text x="50" y="431.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">when dead? You would detest it.”</text><rect x="30" y="470" width="411" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="505.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Do</text><text x="50" y="533.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Defend the absent person; do not listen with</text><text x="50" y="554.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">approval</text><rect x="459" y="470" width="411" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="505.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Limited exceptions</text><text x="479" y="533.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Reporting wrongdoing to someone who can stop</text><text x="479" y="554.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">it; honest warning when asked about marriage</text><text x="479" y="575.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">or business</text>
</svg>