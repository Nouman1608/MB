<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 633" width="900" height="633" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="633" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The rights of neighbours</text>

<rect x="30" y="104" width="840" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">SAHIH AL-BUKHARI 6016: THE PRESCRIBED PASSAGE</text><text x="450" y="162.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">“By Allah, he does not believe!” (three times) … “One whose neighbour does</text><text x="450" y="186.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">not feel safe from his evil.”</text><rect x="30" y="230" width="270.6666666666667" height="130" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="265.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Safety from harm</text><text x="50" y="293.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No noise, rubbish,</text><text x="50" y="314.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">aggressive parking or</text><text x="50" y="335.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">threats</text><rect x="314.6666666666667" y="230" width="270.6666666666667" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="334.6666666666667" y="265.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Kindness and gifts</text><text x="334.6666666666667" y="293.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sharing food, especially on</text><text x="334.6666666666667" y="314.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Eid</text><rect x="599.3333333333334" y="230" width="270.6666666666667" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="619.3333333333334" y="265.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Help in need</text><text x="619.3333333333334" y="293.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Visiting when ill, helping</text><text x="619.3333333333334" y="314.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">in emergencies, lending</text><text x="619.3333333333334" y="335.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">small items</text><rect x="30" y="374" width="413" height="109" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="409.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Respect for privacy</text><text x="50" y="437.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Not looking into their home or spreading</text><text x="50" y="458.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">their affairs</text><rect x="457" y="374" width="413" height="109" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="477" y="409.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Patience</text><text x="477" y="437.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Bearing minor annoyances rather than</text><text x="477" y="458.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">retaliating</text><rect x="30" y="501" width="840" height="102" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="534.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Qur’an 4:36 names “the near neighbour, the neighbour farther away”. Many scholars include</text><text x="50" y="556.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">non-Muslim neighbours. Jibril (AS) advised about the neighbour so often the Prophet (pbuh)</text><text x="50" y="578.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">thought he would be made an heir.</text>
</svg>