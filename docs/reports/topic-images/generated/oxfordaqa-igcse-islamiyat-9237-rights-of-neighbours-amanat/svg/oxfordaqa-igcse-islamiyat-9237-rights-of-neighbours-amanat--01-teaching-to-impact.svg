<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="650" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Every answer has two parts</text>

<rect x="30" y="104" width="395" height="162" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PART 1</text><text x="50" y="164" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">What the source teaches</text><text x="50" y="193.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A verse or Hadith on neighbours, amanah,</text><text x="50" y="215.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">backbiting, arrogance or jealousy</text><line x1="431" y1="185" x2="469" y2="185" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="475" y="104" width="395" height="162" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="495" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">PART 2</text><text x="495" y="164" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">What difference it makes in</text><text x="495" y="190" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">society</text><text x="495" y="219.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Safer streets, trust, equality,</text><text x="495" y="241.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">contentment</text><rect x="30" y="284" width="160" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="314" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Topic</text><rect x="190" y="284" width="370" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="202" y="314" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Key source</text><rect x="560" y="284" width="310" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="572" y="314" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Social impact</text><rect x="30" y="330" width="160" height="62" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="354.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Neighbours</text><rect x="190" y="330" width="370" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="202" y="354.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">“One whose neighbour does not feel safe from</text><text x="202" y="374.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">his evil” (Bukhari 6016)</text><rect x="560" y="330" width="310" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="572" y="354.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Safe, trusting streets; barriers</text><text x="572" y="374.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">between communities broken down</text><rect x="30" y="392" width="160" height="42" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="416.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Amanat</text><rect x="190" y="392" width="370" height="42" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="202" y="416.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">“Render trusts to whom they are due” (4:58)</text><rect x="560" y="392" width="310" height="42" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="572" y="416.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">People can rely on each other</text><rect x="30" y="434" width="160" height="62" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="458.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Backbiting</text><rect x="190" y="434" width="370" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="202" y="458.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Like eating the flesh of a dead brother</text><text x="202" y="478.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(49:12)</text><rect x="560" y="434" width="310" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="572" y="458.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Trust, friendships and reputations</text><text x="572" y="478.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">protected</text><rect x="30" y="496" width="160" height="62" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="520.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Arrogance</text><rect x="190" y="496" width="370" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="202" y="520.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">An atom’s weight of arrogance keeps one from</text><text x="202" y="540.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Paradise (Muslim)</text><rect x="560" y="496" width="310" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="572" y="520.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Equality; easy to approach and fair</text><rect x="30" y="558" width="160" height="62" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="582.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Jealousy</text><rect x="190" y="558" width="370" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="202" y="582.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">“Do not envy one another” (Muslim)</text><rect x="560" y="558" width="310" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="572" y="582.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Contentment instead of hatred and</text><text x="572" y="602.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">harm</text>
</svg>