<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 485" width="900" height="485" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="485" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Jealousy (hasad) or permitted envy (ghibtah)?</text>

<rect x="30" y="104" width="840" height="62" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="140" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">You see a blessing someone else has…</text><rect x="30" y="184" width="408" height="195" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="220.8" font-size="21" font-weight="700" fill="#b5602e" text-anchor="start">Hasad: forbidden</text><text x="50" y="251.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="251.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">You want them to lose it</text><text x="50" y="278.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="278.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A quarrel with Allah’s decree</text><text x="50" y="305.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="305.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Leads to backbiting, hatred and harm</text><text x="50" y="332.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="332.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“Do not envy one another” (Muslim);</text><text x="66.15" y="354.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">113:5; 4:32</text><rect x="462" y="184" width="408" height="195" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="482" y="220.8" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="start">Ghibtah: allowed</text><text x="482" y="251.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="498.15" y="251.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">You wish for the same good without</text><text x="498.15" y="273.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">wanting them to lose it</text><text x="482" y="300.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="498.15" y="300.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The two cases: wealth spent rightly;</text><text x="498.15" y="322.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">wisdom used to judge and teach (Bukhari)</text><rect x="30" y="397" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="430.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The cure: contentment, gratitude and du’a for the other person.</text>
</svg>