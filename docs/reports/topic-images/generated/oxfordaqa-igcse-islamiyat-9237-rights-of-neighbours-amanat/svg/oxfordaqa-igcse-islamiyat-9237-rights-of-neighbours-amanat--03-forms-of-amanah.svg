<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 536" width="900" height="536" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="536" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Amanah: more than money</text>

<line x1="310" y1="176.5" x2="360.75" y2="228.175" stroke="#1e2a44" stroke-width="2.5"/><line x1="310" y1="302.5" x2="360.75" y2="272.275" stroke="#1e2a44" stroke-width="2.5"/><line x1="310" y1="382" x2="360.75" y2="300.1" stroke="#1e2a44" stroke-width="2.5"/><line x1="590" y1="163" x2="539.25" y2="223.45" stroke="#1e2a44" stroke-width="2.5"/><line x1="590" y1="242.5" x2="539.25" y2="251.275" stroke="#1e2a44" stroke-width="2.5"/><line x1="590" y1="335.5" x2="539.25" y2="283.825" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="256" r="105" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="241.75" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Amanah: anything</text><text x="450" y="263" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">placed in a</text><text x="450" y="284.25" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">person’s care</text><g transform="translate(0,0)"><rect x="30" y="104" width="280" height="145" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="134.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Goods left for</text><text x="46" y="158.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">safekeeping</text><text x="46" y="186.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Ali (RA) returned them on the</text><text x="46" y="207.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">night of the Hijrah, even to</text><text x="46" y="228.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">enemies</text><rect x="30" y="263" width="280" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="293.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Secrets</text><text x="46" y="321.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Confidential information</text><rect x="30" y="356" width="280" height="52" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="386.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Job and working time</text></g><g transform="translate(0,33)"><rect x="590" y="104" width="280" height="52" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="606" y="134.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Public office and money</text><rect x="590" y="170" width="280" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="606" y="200.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Body and abilities</text><text x="606" y="228.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Trusts from Allah</text><rect x="590" y="263" width="280" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="606" y="293.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The neighbour’s safety</text><text x="606" y="321.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Their privacy and reputation</text></g><rect x="30" y="426" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="459.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“Render trusts to whom they are due” (4:58). Signs of a hypocrite: he lies, breaks promises</text><text x="50" y="481.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and betrays a trust (Bukhari). The Prophet (pbuh) was called al-Amin, the trustworthy.</text>
</svg>