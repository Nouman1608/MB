<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 764" width="900" height="764" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="764" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Comparing the Black Death in two societies</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">"Compare and contrast the economic impact of the Black Death on two societies"</text>
<rect x="30" y="124" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Thesis</text><text x="450" y="188.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Same shock in both; England's economy <tspan font-weight="700" fill="#1e2a44">adapted</tspan> while Egypt's <tspan font-weight="700" fill="#1e2a44">declined</tspan>, because their systems of</text><text x="450" y="210.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">landholding responded differently.</text><clipPath id="tc257"><rect x="30" y="257" width="840" height="342" rx="14"/></clipPath><g clip-path="url(#tc257)"><rect x="30" y="257" width="168" height="70" fill="#b5d3cf"/><text x="44" y="284.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Point</text><rect x="198" y="257" width="336" height="70" fill="#b5d3cf"/><text x="212" y="284.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">England (Europe)</text><rect x="534" y="257" width="336" height="70" fill="#f2e7b8"/><text x="548" y="284.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Mamluk Egypt (Africa and the Middle</text><text x="548" y="306.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">East)</text><rect x="30" y="327" width="168" height="68" fill="#dce9e7"/><text x="44" y="353.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">1 Demographic</text><text x="44" y="374.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">shock</text><rect x="198" y="327" width="336" height="68" fill="#dce9e7"/><text x="212" y="353.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Very large share lost within a few years;</text><text x="212" y="374.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">recurrences</text><rect x="534" y="327" width="336" height="68" fill="#dce9e7"/><text x="548" y="353.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Very large share lost within a few years;</text><text x="548" y="374.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">recurrences</text><line x1="30" y1="395" x2="870" y2="395" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="395" width="168" height="68" fill="#dce9e7"/><text x="44" y="421.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">2 Labour and</text><text x="44" y="442.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">wages</text><rect x="198" y="395" width="336" height="68" fill="#f8faf9"/><text x="212" y="421.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Wages rose despite the Ordinance and</text><text x="212" y="442.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Statute of Labourers (1349, 1351)</text><rect x="534" y="395" width="336" height="68" fill="#f8faf9"/><text x="548" y="421.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Irrigation canals and dykes left</text><text x="548" y="442.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">unmaintained</text><line x1="30" y1="463" x2="870" y2="463" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="463" width="168" height="68" fill="#dce9e7"/><text x="44" y="489.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">3 Landholding</text><text x="44" y="510.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">and elite</text><rect x="198" y="463" width="336" height="68" fill="#ffffff"/><text x="212" y="489.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lords leased land and commuted labour</text><text x="212" y="510.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">services</text><rect x="534" y="463" width="336" height="68" fill="#ffffff"/><text x="548" y="489.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mamluk elite, living on assigned land,</text><text x="548" y="510.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">raised demands on fewer peasants</text><line x1="30" y1="531" x2="870" y2="531" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="531" width="168" height="68" fill="#dce9e7"/><text x="44" y="557.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">4 Long-term</text><text x="44" y="578.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">outcome</text><rect x="198" y="531" width="336" height="68" fill="#f8faf9"/><text x="212" y="557.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Higher living standards for many;</text><text x="212" y="578.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">decline of serfdom</text><rect x="534" y="531" width="336" height="68" fill="#f8faf9"/><text x="548" y="557.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Prolonged agricultural decline; slow</text><text x="548" y="578.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">recovery</text></g><line x1="198" y1="257" x2="198" y2="599" stroke="#c9d6d4" stroke-width="1.5"/><line x1="534" y1="257" x2="534" y2="599" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="257" width="840" height="342" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="621" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="655.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Conclusion</text><text x="50" y="685.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The plague was the same; its economic impact depended on institutions. About 45 minutes: five to</text><text x="50" y="707.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">plan, four comparative paragraphs of about eight minutes each.</text>
</svg>