<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 683" width="900" height="683" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="683" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Growth, then the Black Death</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Two engines of agricultural growth</text>
<rect x="30" y="124" width="410" height="132" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SONG CHINA, 960-1279</text><text x="50" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Champa rice</text><text x="50" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Fast-ripening; spread from the early eleventh</text><text x="50" y="231.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">century</text><line x1="235" y1="261" x2="235" y2="287" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="292" width="410" height="59" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="326.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Double cropping in the south</text><line x1="235" y1="356" x2="235" y2="382" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="387" width="410" height="108" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="421.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Rapid population growth</text><text x="50" y="449.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">China's economic centre shifts to the Yangzi</text><text x="50" y="470.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">region</text><rect x="460" y="124" width="410" height="132" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WESTERN EUROPE, c.1000-1300</text><text x="480" y="182.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">New methods and new land</text><text x="480" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Heavy plough; three-field rotation; forests and</text><text x="480" y="231.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">marshes cleared</text><line x1="665" y1="261" x2="665" y2="287" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="460" y="292" width="410" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="326.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Growth within the manorial economy</text><text x="480" y="354.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Peasants held land for labour services and dues;</text><text x="480" y="375.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">markets and money grew</text><line x1="665" y1="405" x2="665" y2="431" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="460" y="436" width="410" height="59" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="480" y="470.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Growth to around 1300</text><rect x="30" y="517" width="840" height="134" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="549" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">1346-1351</text><text x="450" y="576.6" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle">The Black Death</text><text x="450" y="605.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Black Sea (1346), then the Mediterranean, the Middle East and Europe (1347-1351): an enormous death</text><text x="450" y="626.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">toll, with consequences that differed by region</text>
</svg>