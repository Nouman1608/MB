<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 649" width="900" height="649" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="649" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How ideas travelled</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">From China and Baghdad to European universities</text>
<rect x="30" y="124" width="390" height="133" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="166.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CHINA</text><text x="50" y="193.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Papermaking</text><text x="50" y="222.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Spread west through the Islamic world</text><line x1="426" y1="190.5" x2="474" y2="190.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="480" y="124" width="390" height="133" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="500" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ABBASID BAGHDAD (FOUNDED 762)</text><text x="500" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">House of Wisdom</text><text x="500" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Greek, Persian and Indian works translated</text><text x="500" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">into Arabic</text><line x1="650" y1="263" x2="650" y2="299" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="307" width="390" height="133" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="339" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EUROPE</text><text x="50" y="365.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Universities</text><text x="50" y="394.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Bologna, Paris and Oxford, from the late</text><text x="50" y="415.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">eleventh and twelfth centuries</text><rect x="480" y="307" width="390" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="500" y="339" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SPAIN AND SICILY</text><text x="500" y="365.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Latin translations</text><text x="500" y="394.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Ibn Sina's Canon of Medicine; Ibn Rushd on</text><text x="500" y="415.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Aristotle</text><line x1="474" y1="392" x2="420" y2="392" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="484" width="840" height="133" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="516" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MEANWHILE IN SONG CHINA</text><text x="50" y="542.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Printing spread learning</text><text x="50" y="571.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Supported the civil service examination system; Neo-Confucian thinkers such as Zhu Xi reshaped the</text><text x="50" y="592.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">classical tradition</text>
</svg>