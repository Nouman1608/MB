<rect width="900" height="657" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three interpretations of medieval growth</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Drawn to a time scale, 750-1400</text>
<line x1="210" y1="150" x2="210" y2="484" stroke="#c9d6d4" stroke-width="1.5"/><text x="210" y="140" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">750</text><line x1="259.2307692307692" y1="150" x2="259.2307692307692" y2="484" stroke="#c9d6d4" stroke-width="1.5"/><text x="259.2307692307692" y="140" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">800</text><line x1="308.46153846153845" y1="150" x2="308.46153846153845" y2="484" stroke="#c9d6d4" stroke-width="1.5"/><line x1="357.6923076923077" y1="150" x2="357.6923076923077" y2="484" stroke="#c9d6d4" stroke-width="1.5"/><text x="357.6923076923077" y="140" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">900</text><line x1="406.9230769230769" y1="150" x2="406.9230769230769" y2="484" stroke="#c9d6d4" stroke-width="1.5"/><line x1="456.1538461538462" y1="150" x2="456.1538461538462" y2="484" stroke="#c9d6d4" stroke-width="1.5"/><text x="456.1538461538462" y="140" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">1000</text><line x1="505.38461538461536" y1="150" x2="505.38461538461536" y2="484" stroke="#c9d6d4" stroke-width="1.5"/><line x1="554.6153846153846" y1="150" x2="554.6153846153846" y2="484" stroke="#c9d6d4" stroke-width="1.5"/><text x="554.6153846153846" y="140" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">1100</text><line x1="603.8461538461538" y1="150" x2="603.8461538461538" y2="484" stroke="#c9d6d4" stroke-width="1.5"/><line x1="653.0769230769231" y1="150" x2="653.0769230769231" y2="484" stroke="#c9d6d4" stroke-width="1.5"/><text x="653.0769230769231" y="140" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">1200</text><line x1="702.3076923076924" y1="150" x2="702.3076923076924" y2="484" stroke="#c9d6d4" stroke-width="1.5"/><line x1="751.5384615384615" y1="150" x2="751.5384615384615" y2="484" stroke="#c9d6d4" stroke-width="1.5"/><text x="751.5384615384615" y="140" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">1300</text><line x1="800.7692307692307" y1="150" x2="800.7692307692307" y2="484" stroke="#c9d6d4" stroke-width="1.5"/><line x1="850" y1="150" x2="850" y2="484" stroke="#c9d6d4" stroke-width="1.5"/><text x="850" y="140" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">1400</text><rect x="796.8307692307692" y="154" width="6" height="330" fill="#b5602e" opacity="0.85"/><rect x="406.9230769230769" y="164" width="393.8461538461538" height="34" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="30" y="188" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Lopez</text><rect x="26" y="208" width="584.9" height="25" fill="#f4f6f6"/><text x="30" y="224" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">"Commercial revolution": growth of European trade and credit, about 950 to 1350</text><rect x="416.7692307692308" y="264" width="314.09230769230766" height="34" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="30" y="288" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Elvin</text><rect x="26" y="308" width="725.7950000000001" height="25" fill="#f4f6f6"/><text x="30" y="324" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Song China (960-1279): a medieval economic revolution in farming, transport, money and technology</text><rect x="653.0769230769231" y="364" width="98.46153846153845" height="34" rx="8" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="30" y="388" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Abu-Lughod (1989)</text><rect x="26" y="408" width="784.3850000000001" height="25" fill="#f4f6f6"/><text x="30" y="424" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">A thirteenth-century "world system" of linked trading circuits from northern Europe to China; Europe marginal</text><rect x="333.6957692307692" y="462" width="455.135" height="24" fill="#f4f6f6"/><text x="784.8307692307692" y="480" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">Black Death, 1346-1351: helped break the world system apart</text><rect x="30" y="514" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="548.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Use them to frame comparison</text><text x="50" y="578.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Was growth in your two societies driven by similar forces? Was either region more advanced? Test</text><text x="50" y="600.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the view against evidence; do not quote it as a conclusion.</text>
</svg>