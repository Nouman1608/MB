<rect width="900" height="519" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Religion and society compared</text>

<clipPath id="tc100"><rect x="30" y="100" width="840" height="276" rx="14"/></clipPath><g clip-path="url(#tc100)"><rect x="30" y="100" width="280" height="51" fill="#b5d3cf"/><text x="44" y="129.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Latin Christendom</text><rect x="310" y="100" width="280" height="51" fill="#dce9e7"/><text x="324" y="129.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Islamic societies</text><rect x="590" y="100" width="280" height="51" fill="#f2e7b8"/><text x="604" y="129.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Song China</text><rect x="30" y="151" width="280" height="89" fill="#ffffff"/><text x="44" y="177.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Church a major landowner;</text><text x="44" y="198.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">collected tithes</text><rect x="310" y="151" width="280" height="89" fill="#ffffff"/><text x="324" y="177.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Charitable endowments (waqf)</text><text x="324" y="198.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">funded mosques, schools,</text><text x="324" y="219.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">hospitals</text><rect x="590" y="151" width="280" height="89" fill="#ffffff"/><text x="604" y="177.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Buddhism and Daoism alongside</text><text x="604" y="198.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a Confucian state ideology</text><line x1="30" y1="240" x2="870" y2="240" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="240" width="280" height="68" fill="#f8faf9"/><text x="44" y="266.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ran most education; defined the</text><text x="44" y="287.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ritual calendar</text><rect x="310" y="240" width="280" height="68" fill="#f8faf9"/><text x="324" y="266.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Religious scholars (ulama)</text><text x="324" y="287.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">interpreted law</text><rect x="590" y="240" width="280" height="68" fill="#f8faf9"/><text x="604" y="266.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Neo-Confucian thinkers</text><text x="604" y="287.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reshaped the classical tradition</text><line x1="30" y1="308" x2="870" y2="308" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="308" width="280" height="68" fill="#ffffff"/><text x="44" y="334.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Monasteries: centres of</text><text x="44" y="355.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">agriculture and record-keeping</text><rect x="310" y="308" width="280" height="68" fill="#ffffff"/><rect x="590" y="308" width="280" height="68" fill="#ffffff"/></g><line x1="310" y1="100" x2="310" y2="376" stroke="#c9d6d4" stroke-width="1.5"/><line x1="590" y1="100" x2="590" y2="376" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="100" width="840" height="276" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="398" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="432.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Religion could also unsettle order</text><text x="50" y="462.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Preachers in the Peasants' Revolt (1381) asked why lords should rule over equals created by God.</text>
</svg>