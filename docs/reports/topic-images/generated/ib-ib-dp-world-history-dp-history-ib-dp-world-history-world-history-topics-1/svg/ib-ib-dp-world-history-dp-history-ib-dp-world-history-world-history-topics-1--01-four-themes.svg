<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 662" width="900" height="662" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="662" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four themes, many regions</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Choose examples that let you write across themes</text>
<rect x="30" y="124" width="412" height="133" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THEME 1</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Population and economic change</text><text x="50" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Farming methods; growth and decline; epidemic</text><text x="50" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">disease</text><rect x="458" y="124" width="412" height="133" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="166.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THEME 2</text><text x="478" y="193.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Trade and exchange</text><text x="478" y="222.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Routes, goods, institutions and money</text><rect x="30" y="273" width="412" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="305" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THEME 3</text><text x="50" y="331.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Intellectual, cultural and artistic</text><text x="50" y="360.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Learning, technology, the arts; how ideas</text><text x="50" y="381.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">travelled</text><rect x="458" y="273" width="412" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="478" y="305" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THEME 4</text><text x="478" y="331.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Religion and society</text><text x="478" y="360.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Religious institutions in social order, economic</text><text x="478" y="381.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">life and ordinary lives</text><text x="450" y="442" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Common example societies</text><rect x="70.13700000000006" y="466" width="119.166" height="31" rx="15.5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="129.72000000000006" y="487.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Song China</text><rect x="199.30300000000005" y="466" width="204.455" height="31" rx="15.5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="301.5305000000001" y="487.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">the Abbasid caliphate</text><rect x="413.75800000000004" y="466" width="254.146" height="31" rx="15.5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="540.831" y="487.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">medieval England or France</text><rect x="677.904" y="466" width="151.959" height="31" rx="15.5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="753.8835" y="487.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">the Mali empire</text><rect x="30" y="519" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="553.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Questions compare</text><text x="450" y="583.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">"The impact of trade on <tspan font-weight="700" fill="#1e2a44">two</tspan> societies", "the reasons for economic growth in <tspan font-weight="700" fill="#1e2a44">one</tspan> society": write</text><text x="450" y="605.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">across regions, not one region in isolation.</text>
</svg>