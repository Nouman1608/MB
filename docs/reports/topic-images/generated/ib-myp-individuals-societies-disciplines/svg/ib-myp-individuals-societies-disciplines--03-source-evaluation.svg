<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 567" width="900" height="567" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="567" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The source-evaluation skill</text>

<rect x="30" y="115" width="410" height="126" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="48" y="151.05" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Summarising</text><text x="48" y="178.17000000000002" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Summarises what the source says: extracting</text><text x="48" y="199.29000000000002" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">facts.</text><rect x="460" y="115" width="410" height="126" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="151.05" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">✓ Evaluating</text><text x="478" y="178.17000000000002" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Says what the source can and cannot tell you</text><text x="478" y="199.29000000000002" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">about the topic, for a specific research</text><text x="478" y="220.41000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">purpose.</text><text x="30" y="271" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Two forms the question takes</text><rect x="30" y="287" width="410" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="323" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Single source</text><rect x="60" y="343" width="350" height="60" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="235" y="380.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Source B</text><text x="52" y="437" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Explain one value or one limitation of source</text><text x="52" y="458" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">B for a student researching protests.”</text><rect x="460" y="287" width="410" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="482" y="323" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Comparative</text><rect x="490" y="343" width="160" height="60" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="570" y="380.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Source C</text><text x="665" y="379" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">vs</text><rect x="680" y="343" width="160" height="60" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="760" y="380.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Source D</text><text x="482" y="437" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Compare and contrast source C and source D in</text><text x="482" y="458" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">terms of their usefulness in studying protest</text><text x="482" y="479" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">movements.”</text>
</svg>