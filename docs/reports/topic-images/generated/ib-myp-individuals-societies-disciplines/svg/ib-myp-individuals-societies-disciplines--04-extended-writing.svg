<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 545" width="900" height="545" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="545" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Thinking critically: building an argument</text>

<rect x="30" y="115" width="840" height="100" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="450" y="151.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Sample question</text><text x="450" y="178.17000000000002" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">“To what extent do you agree that gaining support from different groups in society is the most</text><text x="450" y="199.29000000000002" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">important factor in making sure a protest movement is successful?”</text><rect x="30" y="250" width="253.33333333333334" height="130" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="156.66666666666669" y="309.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Take a position</text><text x="156.66666666666669" y="336.62" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">how far you agree</text><line x1="286.33333333333337" y1="315" x2="318.33333333333337" y2="315" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="250" width="253.33333333333334" height="130" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="450.00000000000006" y="296.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Weigh it against</text><text x="450.00000000000006" y="322.9" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">alternatives</text><text x="450.00000000000006" y="350.02" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">other factors in success</text><line x1="579.6666666666667" y1="315" x2="611.6666666666667" y2="315" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="250" width="253.33333333333334" height="130" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="743.3333333333334" y="296.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Reach a reasoned</text><text x="743.3333333333334" y="322.9" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">judgement</text><text x="743.3333333333334" y="350.02" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">justify your conclusion</text><rect x="30" y="410" width="410" height="105" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="48" y="446.05" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Narrative</text><text x="48" y="473.17" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Describes events in a narrative: cannot reach</text><text x="48" y="494.29" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">top marks however accurate.</text><rect x="460" y="410" width="410" height="105" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="446.05" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">✓ Argument</text><text x="478" y="473.17" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A structured, judgement-based argument.</text>
</svg>