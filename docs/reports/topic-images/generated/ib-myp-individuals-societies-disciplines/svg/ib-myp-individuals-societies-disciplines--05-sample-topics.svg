<rect width="900" height="688" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Topics explored in the on-screen examinations</text>

<rect x="30" y="115" width="410" height="80" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.2"/><text x="235" y="162.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">demographics and human movements</text><rect x="460" y="115" width="410" height="80" rx="12" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.2"/><text x="665" y="162.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">settlement and urban morphology</text><rect x="30" y="207" width="410" height="80" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="235" y="243.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">superpowers, empires and supra-national</text><text x="235" y="265.59000000000003" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">alliances and organizations</text><rect x="460" y="207" width="410" height="80" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.2"/><text x="665" y="254.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">significant individuals</text><rect x="30" y="299" width="410" height="80" rx="12" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.2"/><text x="235" y="346.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">warfare and peacekeeping</text><rect x="460" y="299" width="410" height="80" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="665" y="346.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">rights and social protest</text><rect x="30" y="391" width="410" height="80" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.2"/><text x="235" y="438.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">trade, aid and exchange</text><rect x="460" y="391" width="410" height="80" rx="12" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.2"/><text x="665" y="427.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">economic agents and their interests and</text><text x="665" y="449.59" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">role in the economy</text><rect x="30" y="483" width="410" height="80" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="235" y="530.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">measurements and trends</text><rect x="460" y="483" width="410" height="80" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.2"/><text x="665" y="519.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">industrialization and technological</text><text x="665" y="541.59" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">developments</text><rect x="30" y="585" width="840" height="72.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="615.2" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">The topics span history, geography and wider social science, so the three subjects draw on</text><text x="450" y="636.32" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">overlapping content.</text>
