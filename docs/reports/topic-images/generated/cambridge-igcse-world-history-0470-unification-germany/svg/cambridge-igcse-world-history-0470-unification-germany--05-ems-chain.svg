<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 699" width="900" height="699" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="699" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From the Spanish throne to war, 1870</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">How Bismarck made France the aggressor</text>
<line x1="60" y1="144" x2="60" y2="647" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="107" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1867</text><text x="122" y="180.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Luxembourg purchase blocked</text><text x="122" y="208.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Napoleon III had got nothing from 1866</text><circle cx="60" cy="177.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="186.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="239" width="766" height="107" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="269" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1870</text><text x="122" y="295.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Leopold offered the Spanish throne</text><text x="122" y="323.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">France protests at Hohenzollern encirclement; candidacy withdrawn</text><circle cx="60" cy="292.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="301.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="354" width="766" height="107" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="384" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EMS</text><text x="122" y="410.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">France demands a promise</text><text x="122" y="438.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">William I politely refuses and telegraphs Bismarck</text><circle cx="60" cy="407.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="416.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="469" width="766" height="83" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122" y="501.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Bismarck edits and publishes the telegram</text><text x="122" y="529.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The exchange seems insulting to both sides</text><circle cx="60" cy="510.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="519.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="560" width="766" height="107" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="590" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">19 JULY 1870</text><text x="122" y="616.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">France declares war</text><text x="122" y="644.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The southern states join Prussia; no power helps France</text><circle cx="60" cy="613.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="622.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text>
</svg>