<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 561" width="900" height="561" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="561" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why Germany was not unified in 1848-50</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">From the Frankfurt Parliament to Olmütz</text>
<rect x="30" y="124" width="412" height="129" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="158.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">No army or taxes</text><text x="50" y="186.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Prussia fought Denmark for it, then made the</text><text x="50" y="207.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Malmö armistice (August 1848) without its</text><text x="50" y="228.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">consent</text><rect x="458" y="124" width="412" height="129" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="168.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Argued over borders</text><text x="478" y="197.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Grossdeutsch (with Austria's German lands) or</text><text x="478" y="218.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">kleindeutsch (without, led by Prussia)?</text><rect x="30" y="269" width="412" height="116" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="307.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The princes recovered</text><text x="50" y="335.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Vienna crushed (October 1848); Prussian troops</text><text x="50" y="356.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">back in Berlin (November)</text><rect x="458" y="269" width="412" height="116" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="307.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The crown refused</text><text x="478" y="335.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Frederick William IV, April 1849: not from an</text><text x="478" y="356.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">elected assembly; risk of war with Austria</text><rect x="30" y="407" width="253.33333333333334" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="45" y="444.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">1849-50</text><text x="45" y="470.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Erfurt Union</text><text x="45" y="499.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Prussia's union of princes</text><line x1="289.33333333333337" y1="468" x2="317.33333333333337" y2="468" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="407" width="253.33333333333334" height="122" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="338.33333333333337" y="434" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NOVEMBER 1850</text><text x="338.33333333333337" y="460.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Olmütz</text><text x="338.33333333333337" y="488.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Austria, backed by Russia,</text><text x="338.33333333333337" y="509.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">forces Prussia to abandon it</text><line x1="582.6666666666667" y1="468" x2="610.6666666666667" y2="468" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="407" width="253.33333333333334" height="122" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="631.6666666666667" y="448.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The lesson</text><text x="631.6666666666667" y="476.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Austria must be defeated</text><text x="631.6666666666667" y="497.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">first</text>
</svg>