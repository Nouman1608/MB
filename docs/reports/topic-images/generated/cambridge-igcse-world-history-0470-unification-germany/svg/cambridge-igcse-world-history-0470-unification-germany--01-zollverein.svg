<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 589" width="900" height="589" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="589" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Zollverein, 1834</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Schematic, not a map: small circles are other German states</text>
<rect x="30" y="124" width="840" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="220" cy="274" r="125" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" stroke-dasharray="10 7"/><line x1="220" y1="274" x2="312" y2="274" stroke="#2e6b62" stroke-width="3"/><circle cx="312" cy="274" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><line x1="220" y1="274" x2="285.0538238691624" y2="339.0538238691624" stroke="#2e6b62" stroke-width="3"/><circle cx="285.0538238691624" cy="339.0538238691624" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><line x1="220" y1="274" x2="220" y2="366" stroke="#2e6b62" stroke-width="3"/><circle cx="220" cy="366" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><line x1="220" y1="274" x2="154.9461761308376" y2="339.0538238691624" stroke="#2e6b62" stroke-width="3"/><circle cx="154.9461761308376" cy="339.0538238691624" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><line x1="220" y1="274" x2="128" y2="274" stroke="#2e6b62" stroke-width="3"/><circle cx="128" cy="274" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><line x1="220" y1="274" x2="154.9461761308376" y2="208.9461761308376" stroke="#2e6b62" stroke-width="3"/><circle cx="154.9461761308376" cy="208.9461761308376" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><line x1="220" y1="274" x2="219.99999999999997" y2="182" stroke="#2e6b62" stroke-width="3"/><circle cx="219.99999999999997" cy="182" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><line x1="220" y1="274" x2="285.05382386916233" y2="208.9461761308376" stroke="#2e6b62" stroke-width="3"/><circle cx="285.05382386916233" cy="208.9461761308376" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="220" cy="274" r="44" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="220" y="280" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Prussia</text><text x="220" y="144" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">no tariffs inside</text><circle cx="470" cy="274" r="44" fill="#f3dccd" stroke="#b5602e" stroke-width="3"/><text x="470" y="280" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Austria</text><text x="470" y="344" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">stayed outside</text><rect x="620" y="148" width="230" height="220" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="634" y="175.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Why it mattered</text><text x="634" y="202" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="648.25" y="202" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Prussia the economic</text><text x="648.25" y="222" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">leader</text><text x="634" y="246" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="648.25" y="246" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Railways, trade and</text><text x="648.25" y="266" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">industry tied states</text><text x="648.25" y="286" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">together</text><text x="634" y="310" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="648.25" y="310" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Rhineland and Silesian</text><text x="648.25" y="330" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">coal and iron paid for an</text><text x="648.25" y="350" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">army</text><rect x="30" y="446" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="480.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Its limits</text><text x="50" y="510.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Economic co-operation did not buy political loyalty: Bavaria, Saxony and Hanover were members</text><text x="50" y="532.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">but fought for Austria in 1866.</text>
</svg>