<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 571" width="900" height="571" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="571" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How Bismarck isolated Austria</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Each power neutralised before the war of 1866</text>
<line x1="330" y1="196.5" x2="410" y2="252.15" stroke="#1e2a44" stroke-width="2.5"/><line x1="330" y1="345" x2="410" y2="296.7" stroke="#1e2a44" stroke-width="2.5"/><line x1="570" y1="196.5" x2="490" y2="252.15" stroke="#1e2a44" stroke-width="2.5"/><line x1="570" y1="355.5" x2="490" y2="299.85" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="276" r="80" fill="#f3dccd" stroke="#1e2a44" stroke-width="3"/><text x="450" y="270.8" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Austria</text><text x="450" y="295.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">isolated</text><rect x="30" y="134.5" width="300" height="124" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="162.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RUSSIA</text><text x="46" y="188.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Friendly</text><text x="46" y="217.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Prussia had helped in the Polish</text><text x="46" y="238.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">rising of 1863</text><rect x="30" y="272.5" width="300" height="145" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="300.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FRANCE</text><text x="46" y="326.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Neutral</text><text x="46" y="355.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Biarritz (1865): Napoleon III</text><text x="46" y="376.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">expected a long war and hinted at</text><text x="46" y="397.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">compensation</text><rect x="570" y="124" width="300" height="145" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="586" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ITALY</text><text x="586" y="178.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ally</text><text x="586" y="206.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">April 1866: attack Austria if war</text><text x="586" y="227.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">came within three months, for</text><text x="586" y="248.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Venetia</text><rect x="570" y="283" width="300" height="145" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="586" y="311" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THE PRETEXT</text><text x="586" y="337.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Holstein</text><text x="586" y="365.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Austria took the duchies to the</text><text x="586" y="386.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Diet; Bismarck called it a breach of</text><text x="586" y="407.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Gastein</text><rect x="30" y="450" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="484.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Then a lenient peace</text><text x="50" y="514.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Treaty of Prague (August 1866): Austria lost only Venetia, to Italy, so it would not seek revenge.</text>
</svg>