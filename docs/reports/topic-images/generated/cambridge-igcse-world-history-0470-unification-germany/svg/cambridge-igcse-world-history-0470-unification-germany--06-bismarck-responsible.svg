<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 561" width="900" height="561" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="561" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How far was Bismarck responsible?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">His methods against Prussian strength and enemy mistakes</text>
<polygon points="450,164 416,234 484,234" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><line x1="210" y1="198" x2="690" y2="130" stroke="#1e2a44" stroke-width="7" stroke-linecap="round"/><circle cx="450" cy="164" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="210" y1="198" x2="210" y2="238" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="238" width="360" height="180" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="268.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Bismarck's role</text><text x="46" y="297.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="297.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Isolated each enemy first</text><text x="46" y="322.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="322.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Chose timing and excuse</text><text x="46" y="347.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="347.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Lenient peace with Austria</text><text x="46" y="372.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="372.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Edited the Ems Telegram</text><text x="46" y="397.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="397.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Won over liberals after 1866</text><line x1="690" y1="130" x2="690" y2="170" stroke="#1e2a44" stroke-width="3"/><rect x="510" y="170" width="360" height="180" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="526" y="200.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Other factors</text><text x="526" y="229.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="541.2" y="229.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Zollverein, coal, iron, railways</text><text x="526" y="254.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="541.2" y="254.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Roon's reforms; Moltke</text><text x="526" y="279.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="541.2" y="279.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">William I's support</text><text x="526" y="304.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="541.2" y="304.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Austria weakened after 1859</text><text x="526" y="329.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="541.2" y="329.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Napoleon III's mistakes</text><rect x="30" y="440" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="474.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Plan or opportunism?</text><text x="450" y="504.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">A strong answer can argue he was an <tspan font-weight="700" fill="#1e2a44">opportunist</tspan> who used Prussian <tspan font-weight="700" fill="#1e2a44">strength</tspan> skilfully.</text>
</svg>