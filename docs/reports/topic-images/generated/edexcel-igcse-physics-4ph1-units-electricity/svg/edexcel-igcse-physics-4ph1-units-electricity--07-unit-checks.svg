<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Checking an answer with units</text>

<rect x="30" y="110" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="168" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">E = Q × V</text><text x="300" y="168" font-size="21" font-weight="600" fill="#2b5a9a" text-anchor="start">C × J/C</text><text x="610" y="168" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="start">= J</text><text x="840" y="170" font-size="28" font-weight="700" fill="#2e6b62" text-anchor="end">✓</text><rect x="30" y="220" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="278" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">E = I × V × t</text><text x="300" y="278" font-size="21" font-weight="600" fill="#2b5a9a" text-anchor="start">(C/s) × (J/C) × s</text><text x="610" y="278" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="start">= J</text><text x="840" y="280" font-size="28" font-weight="700" fill="#2e6b62" text-anchor="end">✓</text><rect x="30" y="330" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="388" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">P = I × V</text><text x="300" y="388" font-size="21" font-weight="600" fill="#2b5a9a" text-anchor="start">(C/s) × (J/C)</text><text x="610" y="388" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="start">= J/s = W</text><text x="840" y="390" font-size="28" font-weight="700" fill="#2e6b62" text-anchor="end">✓</text><rect x="30" y="440" width="840" height="96" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="60" y="498" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">"R" = V × I</text><text x="300" y="498" font-size="21" font-weight="600" fill="#2b5a9a" text-anchor="start">V × A</text><text x="610" y="498" font-size="22" font-weight="700" fill="#b5602e" text-anchor="start">= W, not Ω</text><text x="840" y="500" font-size="28" font-weight="700" fill="#b5602e" text-anchor="end">✗</text><rect x="30" y="560" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="608" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">If the unit is wrong, the equation was rearranged wrongly.</text>
