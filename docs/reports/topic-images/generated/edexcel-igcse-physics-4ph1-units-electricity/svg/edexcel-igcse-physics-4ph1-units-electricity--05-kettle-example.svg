<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" width="900" height="710" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="710" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: a kettle</text>

<rect x="30" y="110" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="200" y1="170" x2="600" y2="170" stroke="#1e2a44" stroke-width="3"/><line x1="200" y1="380" x2="600" y2="380" stroke="#1e2a44" stroke-width="3"/><line x1="200" y1="170" x2="200" y2="245" stroke="#1e2a44" stroke-width="3"/><line x1="200" y1="305" x2="200" y2="380" stroke="#1e2a44" stroke-width="3"/><line x1="600" y1="170" x2="600" y2="235" stroke="#1e2a44" stroke-width="3"/><line x1="600" y1="315" x2="600" y2="380" stroke="#1e2a44" stroke-width="3"/><circle cx="200" cy="275" r="30" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M184,275 q8,-14 16,0 q8,14 16,0" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="158" y="270" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">230 V</text><text x="158" y="292" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">mains</text><circle cx="400" cy="170" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="400" y="177" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><text x="400" y="140" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">9.0 A</text><rect x="584" y="235" width="32" height="80" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="574" y="280" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">heater</text><line x1="600" y1="205" x2="730" y2="205" stroke="#1e2a44" stroke-width="3"/><line x1="730" y1="205" x2="730" y2="255" stroke="#1e2a44" stroke-width="3"/><circle cx="730" cy="275" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="730" y="282" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">V</text><line x1="730" y1="295" x2="730" y2="345" stroke="#1e2a44" stroke-width="3"/><line x1="730" y1="345" x2="600" y2="345" stroke="#1e2a44" stroke-width="3"/><circle cx="600" cy="205" r="4" fill="#1e2a44" stroke="#1e2a44" stroke-width="1"/><circle cx="600" cy="345" r="4" fill="#1e2a44" stroke="#1e2a44" stroke-width="1"/><text x="762" y="281" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">230 V</text><text x="400" y="420" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">switched on for 2.5 minutes</text><rect x="30" y="460" width="410" height="230" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="498" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">(a) Power in kW</text><text x="60" y="536" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">P = I × V</text><text x="60" y="568" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">  = 9.0 × 230 = 2070 W</text><text x="60" y="600" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">÷ 1000 → 2.07 kW</text><rect x="50" y="628" width="370" height="46" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="659" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">≈ 2.1 kW</text><rect x="460" y="460" width="410" height="230" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="490" y="498" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">(b) Energy in kJ</text><text x="490" y="536" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">t = 2.5 × 60 = 150 s</text><text x="490" y="568" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">E = I × V × t = 9.0 × 230 × 150</text><text x="490" y="600" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">  = 310 500 J</text><rect x="480" y="628" width="370" height="46" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="665" y="659" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">≈ 3.1 × 10⁵ J = 310 kJ</text>
</svg>