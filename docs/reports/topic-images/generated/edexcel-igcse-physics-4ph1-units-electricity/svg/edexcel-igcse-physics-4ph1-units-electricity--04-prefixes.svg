<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" width="900" height="760" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="760" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Prefixes: convert to the base unit</text>

<rect x="30" y="110" width="840" height="86" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="90" y="166" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">M</text><text x="150" y="148" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">mega</text><text x="150" y="176" font-size="19" font-weight="700" fill="#2b5a9a" text-anchor="start">× 10⁶</text><text x="840" y="164" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="end">1.5 MJ = 1 500 000 J</text><rect x="30" y="210" width="840" height="86" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="90" y="266" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">k</text><text x="150" y="248" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">kilo</text><text x="150" y="276" font-size="19" font-weight="700" fill="#2b5a9a" text-anchor="start">× 10³</text><text x="840" y="264" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="end">2.2 kΩ = 2200 Ω;  3.0 kW = 3000 W</text><rect x="30" y="310" width="840" height="86" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="90" y="366" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">—</text><text x="150" y="348" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">base unit</text><text x="150" y="376" font-size="19" font-weight="700" fill="#2b5a9a" text-anchor="start">× 1</text><text x="840" y="364" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="end">A, C, J, Ω, s, V, W</text><rect x="30" y="410" width="840" height="86" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="90" y="466" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">m</text><text x="150" y="448" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">milli</text><text x="150" y="476" font-size="19" font-weight="700" fill="#2b5a9a" text-anchor="start">× 10⁻³</text><text x="840" y="464" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="end">250 mA = 0.250 A</text><rect x="30" y="510" width="840" height="86" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="90" y="566" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">μ</text><text x="150" y="548" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">micro</text><text x="150" y="576" font-size="19" font-weight="700" fill="#2b5a9a" text-anchor="start">× 10⁻⁶</text><text x="840" y="564" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="end">40 μA = 4.0 × 10⁻⁵ A</text><text x="450" y="618" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Convert to the base unit before substituting. Copy capital and small letters exactly:</text><text x="450" y="644" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">mA is a thousandth of an ampere; MΩ is a million ohms.</text><rect x="30" y="670" width="840" height="70" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="713" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Times in seconds:  5 minutes = 300 s;  2 hours = 7200 s</text>
</svg>