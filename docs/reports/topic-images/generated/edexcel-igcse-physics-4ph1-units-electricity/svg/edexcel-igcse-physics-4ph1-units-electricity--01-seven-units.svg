<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 770" width="900" height="770" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="770" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The seven units of electricity</text>

<rect x="30" y="110" width="840" height="46" rx="10" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><text x="90" y="140" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Unit</text><text x="170" y="140" font-size="17" font-weight="700" fill="#fff" text-anchor="start">Name</text><text x="330" y="140" font-size="17" font-weight="700" fill="#fff" text-anchor="start">Quantity</text><text x="580" y="140" font-size="17" font-weight="700" fill="#fff" text-anchor="start">Equation that links it</text><rect x="30" y="164" width="840" height="58" rx="8" fill="#f8faf9" stroke="#c9d6d4" stroke-width="1.5"/><rect x="60" y="173" width="60" height="40" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="90" y="201" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><text x="170" y="200" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">ampere</text><text x="330" y="200" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">current, I</text><text x="580" y="200" font-size="17" font-weight="600" fill="#2b5a9a" text-anchor="start">Q = I × t</text><rect x="30" y="230" width="840" height="58" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><rect x="60" y="239" width="60" height="40" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="90" y="267" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">C</text><text x="170" y="266" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">coulomb</text><text x="330" y="266" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">charge, Q</text><text x="580" y="266" font-size="17" font-weight="600" fill="#2b5a9a" text-anchor="start">Q = I × t</text><rect x="30" y="296" width="840" height="58" rx="8" fill="#f8faf9" stroke="#c9d6d4" stroke-width="1.5"/><rect x="60" y="305" width="60" height="40" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="90" y="333" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">J</text><text x="170" y="332" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">joule</text><text x="330" y="332" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">energy transferred, E</text><text x="580" y="332" font-size="17" font-weight="600" fill="#2b5a9a" text-anchor="start">E = I × V × t,  E = Q × V</text><rect x="30" y="362" width="840" height="58" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><rect x="60" y="371" width="60" height="40" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="90" y="399" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Ω</text><text x="170" y="398" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">ohm</text><text x="330" y="398" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">resistance, R</text><text x="580" y="398" font-size="17" font-weight="600" fill="#2b5a9a" text-anchor="start">V = I × R</text><rect x="30" y="428" width="840" height="58" rx="8" fill="#f8faf9" stroke="#c9d6d4" stroke-width="1.5"/><rect x="60" y="437" width="60" height="40" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="90" y="465" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">s</text><text x="170" y="464" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">second</text><text x="330" y="464" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">time, t</text><text x="580" y="464" font-size="17" font-weight="600" fill="#2b5a9a" text-anchor="start">Q = I × t,  E = I × V × t</text><rect x="30" y="494" width="840" height="58" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><rect x="60" y="503" width="60" height="40" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="90" y="531" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">V</text><text x="170" y="530" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">volt</text><text x="330" y="530" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">voltage (p.d.), V</text><text x="580" y="530" font-size="17" font-weight="600" fill="#2b5a9a" text-anchor="start">V = I × R,  E = Q × V</text><rect x="30" y="560" width="840" height="58" rx="8" fill="#f8faf9" stroke="#c9d6d4" stroke-width="1.5"/><rect x="60" y="569" width="60" height="40" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="90" y="597" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">W</text><text x="170" y="596" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">watt</text><text x="330" y="596" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">power, P</text><text x="580" y="596" font-size="17" font-weight="600" fill="#2b5a9a" text-anchor="start">P = I × V</text><rect x="30" y="640" width="840" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="676" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">V = 6.0 V: the first V is the quantity (voltage), the second is the unit (volt).</text><text x="60" y="708" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">W is the unit watt here, but the symbol for weight in Topic 1. Read in context.</text>
</svg>