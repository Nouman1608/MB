<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="690" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: a small current</text>

<rect x="30" y="110" width="840" height="260" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="150" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A sensor draws 20 mA from a 5.0 V supply</text><rect x="60" y="180" width="360" height="64" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="240" y="221" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">I = 20 mA = 0.020 A</text><rect x="480" y="180" width="360" height="64" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="660" y="221" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">t = 1 hour = 3600 s</text><text x="240" y="280" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">÷ 1000 for milli</text><text x="660" y="280" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">× 60 × 60</text><text x="450" y="345" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Convert first, then substitute.</text><rect x="30" y="390" width="410" height="170" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="60" y="428" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Resistance</text><text x="60" y="466" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">R = V / I = 5.0 / 0.020</text><text x="60" y="520" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">R = 250 Ω</text><rect x="460" y="390" width="410" height="170" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="490" y="428" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Charge in 1 hour</text><text x="490" y="466" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Q = I × t = 0.020 × 3600</text><text x="490" y="520" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">Q = 72 C</text><rect x="30" y="580" width="840" height="90" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="618" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">✗ Using 20 instead of 0.020: R = 5.0 / 20 = 0.25 Ω</text><text x="450" y="648" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">a thousand times too small</text>
</svg>