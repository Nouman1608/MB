<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 770" width="900" height="770" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="770" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Each unit in terms of the others</text>

<rect x="30" y="110" width="840" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="70" y="166" font-size="28" font-weight="700" fill="#2e6b62" text-anchor="start">1 A</text><text x="160" y="166" font-size="28" font-weight="700" fill="#2e6b62" text-anchor="start">= 1 C/s</text><text x="840" y="164" font-size="17" font-weight="400" fill="#4a5568" text-anchor="end">one coulomb passing a point each second</text><rect x="30" y="210" width="840" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="70" y="266" font-size="28" font-weight="700" fill="#b5602e" text-anchor="start">1 V</text><text x="160" y="266" font-size="28" font-weight="700" fill="#b5602e" text-anchor="start">= 1 J/C</text><text x="840" y="264" font-size="17" font-weight="400" fill="#4a5568" text-anchor="end">one joule transferred for each coulomb</text><rect x="30" y="310" width="840" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="70" y="366" font-size="28" font-weight="700" fill="#2b5a9a" text-anchor="start">1 Ω</text><text x="160" y="366" font-size="28" font-weight="700" fill="#2b5a9a" text-anchor="start">= 1 V/A</text><text x="840" y="364" font-size="17" font-weight="400" fill="#4a5568" text-anchor="end">one volt drives one ampere through it</text><rect x="30" y="410" width="840" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="70" y="466" font-size="28" font-weight="700" fill="#8a6d0d" text-anchor="start">1 W</text><text x="160" y="466" font-size="28" font-weight="700" fill="#8a6d0d" text-anchor="start">= 1 J/s</text><text x="840" y="464" font-size="17" font-weight="400" fill="#4a5568" text-anchor="end">one joule transferred each second</text><rect x="30" y="510" width="840" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="70" y="566" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="start">1 J</text><text x="160" y="566" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="start">= 1 A × 1 V × 1 s</text><text x="840" y="564" font-size="17" font-weight="400" fill="#4a5568" text-anchor="end">energy = current × voltage × time</text><rect x="30" y="620" width="840" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="660" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Why a watt is an ampere times a volt</text><text x="450" y="705" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1 A × 1 V = (1 C/s) × (1 J/C) = 1 J/s = 1 W</text><text x="450" y="736" font-size="15" font-weight="400" fill="#b5602e" text-anchor="middle">the coulombs cancel</text>
</svg>