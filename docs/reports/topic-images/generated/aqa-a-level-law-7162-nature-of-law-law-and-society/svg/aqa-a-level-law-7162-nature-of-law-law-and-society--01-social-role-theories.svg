<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 713" width="900" height="713" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="713" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why law takes the forms it does</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Three views of law’s role in society</text>
<rect x="30" y="124" width="840" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="158" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ROSCOE POUND: SOCIAL ENGINEERING</text><text x="50" y="190" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Balance <tspan font-weight="700">individual,</tspan> <tspan font-weight="700">public</tspan> <tspan font-weight="700">and</tspan> <tspan font-weight="700">social</tspan></text><text x="50" y="212" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">interests to satisfy as many as possible with</text><text x="50" y="234" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the least friction.</text><text x="50" y="294" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Behind the specification’s “balance required</text><text x="50" y="314" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">between competing interests”.</text><line x1="460" y1="244" x2="840" y2="244" stroke="#1e2a44" stroke-width="5" stroke-linecap="round"/><path d="M650,244 L628,324 L672,324 Z" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2.5"/><rect x="438" y="194" width="124" height="44" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="500" y="223" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">individual</text><rect x="588" y="194" width="124" height="44" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="650" y="223" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">public</text><rect x="738" y="194" width="124" height="44" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="800" y="223" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">social</text><rect x="30" y="370" width="840" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="404" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ÉMILE DURKHEIM</text><rect x="50" y="422" width="330" height="96" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="64" y="450.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Simple society</text><text x="64" y="478.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Shared beliefs; mostly <tspan font-weight="700" fill="#1e2a44">repressive</tspan> law,</text><text x="64" y="499.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">which punishes</text><rect x="520" y="422" width="330" height="96" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="534" y="450.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Complex society</text><text x="534" y="478.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Division of labour; more <tspan font-weight="700" fill="#1e2a44">restitutive</tspan> law,</text><text x="534" y="499.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">which restores</text><line x1="390" y1="470" x2="510" y2="470" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="450" y="546" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Fits the growth of contract, employment and tort law alongside criminal law</text><rect x="30" y="576" width="840" height="105" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="606" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">MARXIST CRITIQUE</text><text x="48" y="637.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Law protects those with economic power, e.g. by prioritising property rights. Use it to question whether</text><text x="48" y="658.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">law serves everyone equally.</text>
</svg>