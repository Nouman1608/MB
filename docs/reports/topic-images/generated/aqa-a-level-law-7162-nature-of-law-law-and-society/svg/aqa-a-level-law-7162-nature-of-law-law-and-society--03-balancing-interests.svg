<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 534" width="900" height="534" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="534" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Balancing competing interests</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The specification’s “eg public and private” is one pairing among several</text>
<rect x="30" y="124" width="206" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="133" y="177" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Public v private</text><rect x="250" y="124" width="620" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="264" y="151.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Club and spectators’ racing v enjoyment of a home</text><text x="264" y="178" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Kennaway</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Thompson</tspan> (1981): injunction <tspan font-weight="700" fill="#1e2a44">limiting</tspan> race meetings, not banning them.</text><text x="264" y="198" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Coventry</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Lawrence</tspan> (2014): public benefit relevant to injunction or damages</text><rect x="30" y="226" width="206" height="92" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="133" y="279" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Individual v state</text><rect x="250" y="226" width="620" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="264" y="253.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Detecting crime v liberty</text><text x="264" y="280" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Police and Criminal Evidence Act 1984: powers to stop, search, arrest and detain,</text><text x="264" y="300" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">limited by reasonable suspicion, detention time limits and legal advice</text><rect x="30" y="328" width="206" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="133" y="381" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Individual v individual</text><rect x="250" y="328" width="620" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="264" y="355.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Privacy v freedom of expression</text><text x="264" y="382" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Campbell</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">MGN</tspan> (2004): publishing details and photos of her treatment went too</text><text x="264" y="402" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">far (majority)</text><rect x="30" y="430" width="206" height="72" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="133" y="473" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Public policy v claimant</text><rect x="250" y="430" width="620" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="264" y="457.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Police not diverted into defensive practices v compensation</text><text x="264" y="484" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Hill</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">CC</tspan> <tspan font-style="italic">of</tspan> <tspan font-style="italic">West</tspan> <tspan font-style="italic">Yorkshire</tspan> (1989): no duty to a serial killer’s future victim</text>
</svg>