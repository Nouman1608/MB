<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 596" width="900" height="596" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="596" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Fault in civil law, and liability without it</text>

<rect x="30" y="100" width="270.6666666666667" height="166" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="128" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FAULT: NEGLIGENCE</text><text x="46" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Objective standard</text><text x="46" y="182.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Nettleship</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Weston</tspan> (1971): a</text><text x="46" y="203.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">learner judged as a competent</text><text x="46" y="224.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">driver, so fault can exist</text><text x="46" y="245.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">despite doing one’s best</text><rect x="314.6666666666667" y="100" width="270.6666666666667" height="166" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="330.6666666666667" y="128" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">CLAIMANT’S FAULT</text><text x="330.6666666666667" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Contributory negligence</text><text x="330.6666666666667" y="182.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Law Reform (Contributory</text><text x="330.6666666666667" y="203.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Negligence) Act 1945 reduces</text><text x="330.6666666666667" y="224.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">damages. <tspan font-style="italic">Froom</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Butcher</tspan></text><text x="330.6666666666667" y="245.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1976): no seatbelt</text><rect x="599.3333333333334" y="100" width="270.6666666666667" height="166" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="615.3333333333334" y="128" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">NO FAULT NEEDED</text><text x="615.3333333333334" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Strict civil liability</text><text x="615.3333333333334" y="182.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Vicarious liability; <tspan font-style="italic">Rylands</tspan> <tspan font-style="italic">v</tspan></text><text x="615.3333333333334" y="203.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Fletcher</tspan> (1868); Consumer</text><text x="615.3333333333334" y="224.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Protection Act 1987</text><clipPath id="tc286"><rect x="30" y="286" width="840" height="278" rx="14"/></clipPath><g clip-path="url(#tc286)"><rect x="30" y="286" width="420" height="48" fill="#dce9e7"/><text x="44" y="313.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">For fault-based liability</text><rect x="450" y="286" width="420" height="48" fill="#f2e7b8"/><text x="464" y="313.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Against relying only on fault</text><rect x="30" y="334" width="420" height="47" fill="#ffffff"/><text x="44" y="360.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fair: liability only when blameworthy</text><rect x="450" y="334" width="420" height="47" fill="#ffffff"/><text x="464" y="360.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Victims of no-fault harm go uncompensated</text><line x1="30" y1="381" x2="870" y2="381" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="381" width="420" height="68" fill="#f8faf9"/><text x="44" y="407.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Encourages care, deters carelessness</text><rect x="450" y="381" width="420" height="68" fill="#f8faf9"/><text x="464" y="407.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Proving fault is slow and costly, e.g. clinical</text><text x="464" y="428.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">negligence</text><line x1="30" y1="449" x2="870" y2="449" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="449" width="420" height="68" fill="#ffffff"/><text x="44" y="475.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Respects autonomy: choices control liability</text><rect x="450" y="449" width="420" height="68" fill="#ffffff"/><text x="464" y="475.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Objective standards impose “fault” on people doing</text><text x="464" y="496.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">their best</text><line x1="30" y1="517" x2="870" y2="517" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="517" width="420" height="47" fill="#f8faf9"/><text x="44" y="543.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Grades offences and sentences by blame</text><rect x="450" y="517" width="420" height="47" fill="#f8faf9"/><text x="464" y="543.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Strict liability can protect public health and safety</text></g><line x1="450" y1="286" x2="450" y2="564" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="286" width="840" height="278" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>