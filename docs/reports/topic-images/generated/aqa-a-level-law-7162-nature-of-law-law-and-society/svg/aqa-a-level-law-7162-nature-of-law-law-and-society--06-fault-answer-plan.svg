<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 643" width="900" height="643" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="643" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Plan: the importance of fault in criminal law</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Keep returning to the question word: importance</text>
<line x1="60" y1="144" x2="60" y2="591" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="150.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Define fault as blameworthiness</text><text x="116" y="178.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Link it to mens rea</text><circle cx="60" cy="159.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="168.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="203" width="766" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="229.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Hierarchy of fault</text><text x="116" y="257.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Intention, then recklessness, then negligence</text><circle cx="60" cy="238.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="247.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="282" width="766" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="308.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Fault grades offences and sentences</text><text x="116" y="336.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Murder v manslaughter; culpability in sentencing</text><circle cx="60" cy="317.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="326.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="361" width="766" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="387.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The exception: strict liability</text><text x="116" y="415.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Alphacell</tspan>; <tspan font-style="italic">Harrow</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Shah</tspan></text><circle cx="60" cy="396.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="405.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="440" width="766" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="466.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluate</text><text x="116" y="494.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Sweet</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Parsley</tspan> shows fault is the norm; strict liability justified for regulatory protection, but can</text><text x="116" y="515.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">be unjust</text><circle cx="60" cy="486" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="494.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="104" y="540" width="766" height="71" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="116" y="566.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Conclude</text><text x="116" y="594.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Fault is central; departures are limited and need justification</text><circle cx="60" cy="575.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="584.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text>
</svg>