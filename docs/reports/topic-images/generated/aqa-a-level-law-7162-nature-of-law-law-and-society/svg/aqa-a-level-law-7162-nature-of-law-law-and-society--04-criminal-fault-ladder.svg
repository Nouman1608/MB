<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 609" width="900" height="609" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="609" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Fault in criminal law</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Fault means blameworthiness: the defendant could and should have acted differently</text>
<rect x="30" y="124" width="520" height="64" rx="12" fill="#f3d9c9" stroke="#1e2a44" stroke-width="2.5"/><text x="48" y="152" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Intention</text><text x="48" y="175" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Highest level of fault</text><rect x="90" y="198" width="460" height="64" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="108" y="226" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Subjective recklessness</text><rect x="150" y="272" width="400" height="64" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="168" y="300" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Negligence</text><text x="168" y="323" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">e.g. gross negligence manslaughter</text><rect x="210" y="346" width="340" height="64" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="228" y="374" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Strict liability</text><text x="228" y="397" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">No fault for at least one element</text><line x1="570" y1="414" x2="570" y2="134" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="600" y="274" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 600 274)">more blameworthy</text><rect x="630" y="124" width="240" height="115" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="644" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GRADES THE OFFENCE</text><text x="644" y="181" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Intentional killing: murder.</text><text x="644" y="201" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Same death by gross</text><text x="644" y="221" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">negligence: manslaughter</text><rect x="630" y="251" width="240" height="115" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="644" y="277" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GRADES THE SENTENCE</text><text x="644" y="308" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Courts assess the offender’s</text><text x="644" y="328" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">culpability</tspan> as well as the</text><text x="644" y="348" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">harm</text><rect x="30" y="434" width="412" height="143" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="462" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">STRICT LIABILITY</text><text x="46" y="493.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Alphacell</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Woodward</tspan> (1972): river polluted</text><text x="46" y="514.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">without negligence. <tspan font-style="italic">Harrow</tspan> <tspan font-style="italic">LBC</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Shah</tspan> (1999):</text><text x="46" y="535.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">lottery ticket sold to a 13-year-old who looked</text><text x="46" y="556.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">older</text><rect x="458" y="434" width="412" height="143" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="474" y="462" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THE PRESUMPTION</text><text x="474" y="493.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Sweet</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Parsley</tspan> (1969): Parliament is presumed to</text><text x="474" y="514.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">intend mens rea unless it clearly says otherwise</text>
</svg>