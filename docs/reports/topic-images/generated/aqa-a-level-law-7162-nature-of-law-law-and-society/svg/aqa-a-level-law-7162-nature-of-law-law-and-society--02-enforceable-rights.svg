<rect width="900" height="578" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What makes a right enforceable?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A right is only as good as the means to enforce it</text>
<rect x="30" y="124" width="183" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="121.5" y="161.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Expectation</text><line x1="219" y1="157" x2="243" y2="157" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="249" y="124" width="183" height="66" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="340.5" y="151.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Right recognised</text><text x="340.5" y="172.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">in law</text><line x1="438" y1="157" x2="462" y2="157" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="468" y="124" width="183" height="66" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="559.5" y="151.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Standing to go to a</text><text x="559.5" y="172.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">court or tribunal</text><line x1="657" y1="157" x2="681" y2="157" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="687" y="124" width="183" height="66" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="778.5" y="151.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Remedy if</text><text x="778.5" y="172.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">successful</text><rect x="30" y="212" width="413" height="99" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="45" y="239" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONSUMER</text><text x="45" y="270.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Consumer Rights Act 2015: satisfactory quality, fit</text><text x="45" y="291.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">for purpose, as described; refund or repair</text><rect x="457" y="212" width="413" height="99" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="472" y="239" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EMPLOYMENT</text><text x="472" y="270.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Unfair dismissal claim to an employment tribunal</text><rect x="30" y="323" width="413" height="99" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="45" y="350" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AGAINST THE STATE</text><text x="45" y="381.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Human Rights Act 1998: Convention rights against</text><text x="45" y="402.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">public authorities</text><rect x="457" y="323" width="413" height="99" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="472" y="350" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TORT</text><text x="472" y="381.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Damages for negligence, from <tspan font-style="italic">Donoghue</tspan> <tspan font-style="italic">v</tspan></text><text x="472" y="402.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Stevenson</tspan> (1932)</text><text x="30" y="464" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">When the chain breaks: R (UNISON) v Lord Chancellor (2017)</text><rect x="30" y="480" width="250.66666666666666" height="66" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="155.33333333333331" y="507.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Employment tribunal fees</text><text x="155.33333333333331" y="528.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">introduced</text><line x1="286.66666666666663" y1="513" x2="318.66666666666663" y2="513" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="324.66666666666663" y="480" width="250.66666666666666" height="66" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="449.99999999999994" y="517.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Claims fell sharply</text><line x1="581.3333333333333" y1="513" x2="613.3333333333333" y2="513" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="619.3333333333333" y="480" width="250.66666666666666" height="66" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="744.6666666666666" y="507.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Supreme Court quashed</text><text x="744.6666666666666" y="528.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">the fees</text>
</svg>