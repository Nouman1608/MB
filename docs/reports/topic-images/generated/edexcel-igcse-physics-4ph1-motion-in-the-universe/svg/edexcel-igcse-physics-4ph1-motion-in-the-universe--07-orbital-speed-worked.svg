<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="690" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked examples: v = 2πr / T</text>

<rect x="30" y="110" width="410" height="290" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Example 1: the Moon</text><text x="54" y="190" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">r = 3.84 × 10⁸ m,  T = 27.3 days</text><text x="54" y="220" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">T = 27.3 × 86 400</text><text x="54" y="250" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">   = 2.36 × 10⁶ s</text><text x="54" y="280" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">v = 2π × 3.84 × 10⁸ / 2.36 × 10⁶</text><text x="54" y="310" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">   = 1.02 × 10³ m/s</text><text x="54" y="340" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">   (about 1 km/s)</text><rect x="460" y="110" width="410" height="290" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="484" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Example 2: Mars</text><text x="484" y="190" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">r = 2.28 × 10¹¹ m,  T = 687 days</text><text x="484" y="220" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">T = 687 × 86 400</text><text x="484" y="250" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">   = 5.94 × 10⁷ s</text><text x="484" y="280" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">v = 2π × 2.28 × 10¹¹ / 5.94 × 10⁷</text><text x="484" y="310" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">   = 2.4 × 10⁴ m/s</text><rect x="30" y="420" width="840" height="250" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="458" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Mars compared with Earth (orbiting the Sun)</text><text x="170" y="513" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">Earth</text><rect x="190" y="488" width="500" height="36" rx="4" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="700" y="513" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">3.0 × 10⁴ m/s</text><text x="170" y="573" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">Mars</text><rect x="190" y="548" width="400" height="36" rx="4" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="600" y="573" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">2.4 × 10⁴ m/s</text><text x="60" y="640" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">Further from the Sun → weaker field → Mars moves more slowly.</text>
</svg>