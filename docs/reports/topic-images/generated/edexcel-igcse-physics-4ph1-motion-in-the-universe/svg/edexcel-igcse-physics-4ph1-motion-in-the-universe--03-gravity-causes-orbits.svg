<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 770" width="900" height="770" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="770" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Gravity keeps a body in orbit</text>

<rect x="30" y="110" width="840" height="520" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="250" cy="400" r="170" fill="none" stroke="#4a5568" stroke-width="2.5" stroke-dasharray="9 7"/><circle cx="250" cy="400" r="48" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3" /><text x="250" y="398" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">larger</text><text x="250" y="417" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">body</text><line x1="250" y1="230" x2="505" y2="230" stroke="#4a5568" stroke-width="2.5" stroke-dasharray="4 7"/><text x="505" y="256" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">if gravity vanished:</text><text x="505" y="275" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">a straight line</text><line x1="250" y1="230" x2="380" y2="230" stroke="#2e6b62" stroke-width="6" marker-end="url(#ahT)"/><text x="320" y="216" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">velocity</text><line x1="250" y1="230" x2="250" y2="325" stroke="#b5602e" stroke-width="6" marker-end="url(#ahR)"/><text x="236" y="308" font-size="18" font-weight="700" fill="#b5602e" text-anchor="end">gravity</text><path d="M250,248 L268,248 L268,230" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><circle cx="250" cy="230" r="14" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" /><text x="250" y="600" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">steady speed, changing direction</text><rect x="530" y="150" width="315" height="450" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="552" y="192" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="570" y="192" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The only force is gravity,</text><text x="570" y="217" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">towards the centre of</text><text x="570" y="242" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the orbit.</text><text x="552" y="293" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="570" y="293" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">It acts at 90° to the</text><text x="570" y="318" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">motion: it changes the</text><text x="570" y="343" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">direction, not the speed.</text><text x="552" y="394" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="570" y="394" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Velocity keeps changing,</text><text x="570" y="419" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">so the body is accelerating</text><text x="570" y="444" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">towards the centre.</text><text x="552" y="495" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="570" y="495" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">There is no outward</text><text x="570" y="520" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">"centrifugal force".</text><rect x="30" y="650" width="201" height="96" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="130" y="683" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Moon orbits a planet</text><text x="130" y="712" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">pulled by the gravity</text><text x="130" y="732" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">of a planet</text><rect x="243" y="650" width="201" height="96" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="343" y="683" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Planet orbits the Sun</text><text x="343" y="712" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">pulled by the gravity</text><text x="343" y="732" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">of the Sun</text><rect x="456" y="650" width="201" height="96" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="556" y="683" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Satellite orbits the Earth</text><text x="556" y="712" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">pulled by the gravity</text><text x="556" y="732" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">of the Earth</text><rect x="669" y="650" width="201" height="96" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="769" y="683" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Comet orbits the Sun</text><text x="769" y="712" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">pulled by the gravity</text><text x="769" y="732" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">of the Sun</text>
</svg>