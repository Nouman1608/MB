<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 905" width="900" height="905" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="905" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Planet, moon and comet orbits</text>

<rect x="30" y="110" width="410" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Planet around the Sun</text><ellipse cx="235" cy="278" rx="125" ry="112" fill="none" stroke="#2e6b62" stroke-width="3"/><circle cx="235" cy="278" r="22" fill="#d4b02e" stroke="#8a6d0d" stroke-width="3" /><circle cx="360" cy="278" r="11" fill="#2b5a9a" stroke="#1e2a44" stroke-width="2.5" /><text x="235" y="420" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">nearly circular</text><rect x="460" y="110" width="410" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Moon around a planet</text><ellipse cx="665" cy="278" rx="110" ry="104" fill="none" stroke="#2e6b62" stroke-width="3"/><circle cx="665" cy="278" r="26" fill="#2b5a9a" stroke="#1e2a44" stroke-width="3" /><circle cx="775" cy="278" r="9" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5" /><text x="665" y="420" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">nearly circular</text><rect x="30" y="460" width="840" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="496" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Comet around the Sun</text><text x="60" y="520" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">highly elliptical (very elongated)</text><ellipse cx="420" cy="690" rx="320" ry="151.99157871408534" fill="none" stroke="#b5602e" stroke-width="3"/><circle cx="701.6" cy="690" r="18" fill="#d4b02e" stroke="#8a6d0d" stroke-width="3" /><text x="673.6" y="696" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">Sun</text><circle cx="740" cy="690" r="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><line x1="740" y1="684" x2="740" y2="570" stroke="#2e6b62" stroke-width="5" marker-end="url(#ahT)"/><text x="754" y="620" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">fastest</text><text x="754" y="640" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">when closest</text><text x="754" y="660" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">to the Sun</text><circle cx="100" cy="690" r="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" /><line x1="100" y1="696" x2="100" y2="724" stroke="#2e6b62" stroke-width="5" marker-end="url(#ahT)"/><text x="120" y="696" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">slowest, far</text><text x="120" y="716" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">from the Sun</text><text x="450" y="882" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Planets and moons: distance and speed nearly constant. Comets: both change greatly.</text>
</svg>