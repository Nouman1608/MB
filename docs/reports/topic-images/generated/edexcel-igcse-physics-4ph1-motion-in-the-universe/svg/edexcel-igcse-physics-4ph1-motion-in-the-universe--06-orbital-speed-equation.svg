<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="670" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Orbital speed: v = 2πr / T</text>

<rect x="30" y="110" width="840" height="540" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="230" cy="370" r="160" fill="none" stroke="#2e6b62" stroke-width="4" /><circle cx="230" cy="370" r="34" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3" /><line x1="230" y1="370" x2="390" y2="370" stroke="#1e2a44" stroke-width="3"/><text x="318" y="358" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">r</text><circle cx="390" cy="370" r="12" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" /><text x="230" y="190" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">one orbit: distance 2πr</text><text x="230" y="566" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">in one time period T</text><text x="230" y="592" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">r measured from the centre</text><rect x="450" y="150" width="390" height="110" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="645" y="200" font-size="18" font-weight="400" fill="#4a5568" text-anchor="middle">orbital speed</text><text x="645" y="240" font-size="32" font-weight="700" fill="#1e2a44" text-anchor="middle">v = 2πr / T</text><rect x="450" y="280" width="185" height="70" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="542" y="324" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">T = 2πr / v</text><rect x="655" y="280" width="185" height="70" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="747" y="324" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">r = vT / 2π</text><text x="470" y="400" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">v  orbital speed in m/s</text><text x="470" y="430" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">r  orbital radius in m</text><text x="470" y="460" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">T  time period in s</text><rect x="450" y="500" width="390" height="120" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="470" y="535" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Convert first:</text><text x="470" y="568" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">1 day = 24 × 3600 = 86 400 s</text><text x="470" y="600" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">T in days × 86 400 = T in s</text>
</svg>