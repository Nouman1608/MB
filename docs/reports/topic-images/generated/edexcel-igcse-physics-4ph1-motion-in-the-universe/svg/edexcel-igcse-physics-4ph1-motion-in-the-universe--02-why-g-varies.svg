<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why g varies</text>

<rect x="30" y="110" width="470" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="265" y="146" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">g at the surface</text><line x1="104" y1="470" x2="110" y2="470" stroke="#1e2a44" stroke-width="2"/><text x="98" y="476" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">0</text><line x1="104" y1="415" x2="110" y2="415" stroke="#1e2a44" stroke-width="2"/><text x="98" y="421" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">5</text><line x1="110" y1="415" x2="470" y2="415" stroke="#c9d6d4" stroke-width="1.2"/><line x1="104" y1="360" x2="110" y2="360" stroke="#1e2a44" stroke-width="2"/><text x="98" y="366" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">10</text><line x1="110" y1="360" x2="470" y2="360" stroke="#c9d6d4" stroke-width="1.2"/><line x1="104" y1="305" x2="110" y2="305" stroke="#1e2a44" stroke-width="2"/><text x="98" y="311" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">15</text><line x1="110" y1="305" x2="470" y2="305" stroke="#c9d6d4" stroke-width="1.2"/><line x1="104" y1="250" x2="110" y2="250" stroke="#1e2a44" stroke-width="2"/><text x="98" y="256" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">20</text><line x1="110" y1="250" x2="470" y2="250" stroke="#c9d6d4" stroke-width="1.2"/><line x1="104" y1="195" x2="110" y2="195" stroke="#1e2a44" stroke-width="2"/><text x="98" y="201" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">25</text><line x1="110" y1="195" x2="470" y2="195" stroke="#c9d6d4" stroke-width="1.2"/><line x1="110" y1="470" x2="470" y2="470" stroke="#1e2a44" stroke-width="3"/><line x1="110" y1="470" x2="110" y2="185" stroke="#1e2a44" stroke-width="3"/><text x="58" y="332.5" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 58 332.5)">g / N/kg</text><rect x="150" y="452.4" width="70" height="17.6" rx="0" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><text x="185" y="494" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Moon</text><text x="185" y="442.4" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">about 1.6</text><rect x="255" y="360" width="70" height="110" rx="0" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="290" y="494" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Earth</text><text x="290" y="350" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">about 10</text><rect x="360" y="195" width="70" height="275" rx="0" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="395" y="494" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Jupiter</text><text x="395" y="185" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">about 25</text><text x="395" y="514" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">(cloud tops)</text><rect x="520" y="110" width="350" height="420" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="695" y="146" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">g depends on</text><circle cx="590" cy="220" r="26" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" /><circle cx="800" cy="220" r="44" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3" /><line x1="630" y1="220" x2="742" y2="220" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="695" y="290" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">1. mass of the planet</text><text x="695" y="313" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">or moon: more mass,</text><text x="695" y="336" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">larger g</text><circle cx="575" cy="400" r="16" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3" /><circle cx="640" cy="400" r="4" fill="#1e2a44" stroke="#1e2a44" stroke-width="3" /><circle cx="800" cy="400" r="4" fill="#1e2a44" stroke="#1e2a44" stroke-width="3" /><line x1="591" y1="400" x2="636" y2="400" stroke="#1e2a44" stroke-width="2" stroke-dasharray="4 4"/><line x1="591" y1="400" x2="796" y2="400" stroke="#1e2a44" stroke-width="2" stroke-dasharray="4 4"/><text x="695" y="450" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">2. distance from the centre:</text><text x="695" y="473" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">further away, smaller g</text><rect x="30" y="550" width="840" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M30,800 L30,690 Q300,650 450,650 Q600,650 870,690 L870,800 Z" fill="#b5d3cf" opacity="0.6"/><path d="M330,654 L380,610 L430,651 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><text x="450" y="770" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Earth</text><circle cx="160" cy="668" r="6" fill="#1e2a44" stroke="none" stroke-width="0" /><line x1="160" y1="674" x2="160" y2="734" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><text x="180" y="626" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">surface:</text><text x="180" y="646" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">about 10 N/kg</text><circle cx="380" cy="604" r="6" fill="#1e2a44" stroke="none" stroke-width="0" /><line x1="380" y1="610" x2="380" y2="664" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><text x="445" y="590" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">mountain top:</text><text x="445" y="610" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">a little smaller</text><rect x="680" y="590" width="26" height="14" rx="2" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><line x1="668" y1="597" x2="718" y2="597" stroke="#1e2a44" stroke-width="2"/><line x1="693" y1="606" x2="693" y2="628" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><text x="728" y="596" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">distant satellite:</text><text x="728" y="616" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">much smaller,</text><text x="728" y="636" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">never zero</text><text x="450" y="790" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><rect x="30" y="815" width="840" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="858" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Same mass everywhere, but weight W = m × g changes with g</text>
</svg>