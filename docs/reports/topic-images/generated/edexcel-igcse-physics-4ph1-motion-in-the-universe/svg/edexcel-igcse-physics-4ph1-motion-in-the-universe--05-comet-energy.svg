<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 820" width="900" height="820" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="820" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why a comet speeds up near the Sun</text>

<rect x="30" y="110" width="840" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><ellipse cx="420" cy="335" rx="300" ry="142.492105044455" fill="none" stroke="#b5602e" stroke-width="3"/><circle cx="684" cy="335" r="18" fill="#d4b02e" stroke="#8a6d0d" stroke-width="3" /><line x1="268.54616862004275" y1="458.0005197478888" x2="351.83937159207386" y2="473.7655989163894" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><line x1="594.504926839165" y1="450.90528755323584" x2="658.8251395647168" y2="421.2342848976159" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><line x1="658.8251395647168" y1="248.7657151023841" x2="594.504926839165" y2="219.09471244676416" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><line x1="351.83937159207386" y1="196.23440108361058" x2="268.54616862004275" y2="211.9994802521112" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><text x="658" y="341" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">Sun</text><circle cx="120" cy="335" r="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3" /><circle cx="720" cy="335" r="8" fill="#ffffff" stroke="#1e2a44" stroke-width="3" /><text x="420" y="517.492105044455" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">moving towards the Sun: gravity does work, GPE → KE, speeds up</text><text x="420" y="172.507894955545" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">moving away: KE → GPE, slows down</text><rect x="30" y="600" width="840" height="200" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><rect x="60" y="625" width="250" height="150" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="185" y="655" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Far from the Sun</text><rect x="90" y="673" width="160" height="30" rx="4" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="256" y="695" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">GPE</text><rect x="90" y="720" width="32" height="30" rx="4" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="128" y="742" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">KE</text><rect x="590" y="625" width="250" height="150" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="715" y="655" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Closest to the Sun</text><rect x="620" y="673" width="32" height="30" rx="4" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="658" y="695" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">GPE</text><rect x="620" y="720" width="160" height="30" rx="4" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="786" y="742" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">KE</text><line x1="330" y1="700" x2="570" y2="700" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="450" y="690" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">GPE transferred to KE</text><text x="450" y="728" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">(bar lengths illustrative)</text>
</svg>