<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 575" width="900" height="575" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="575" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A café’s soft drinks: delivered or collected?</text>

<rect x="30" y="110" width="410" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="110" width="410" height="52" rx="14" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="144" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Delivered wholesaler</text><text x="52" y="202" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">40 cases × $18.00</text><text x="418" y="202" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">720</text><text x="52" y="242" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Delivery</text><text x="418" y="242" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">included</text><line x1="52" y1="290" x2="418" y2="290" stroke="#c9d6d4" stroke-width="1.5"/><text x="52" y="324" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Total</text><text x="418" y="324" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="end">$720</text><rect x="52" y="346" width="366" height="46" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="235" y="374.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Pay in 30 days (credit)</text><rect x="460" y="110" width="410" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="110" width="410" height="52" rx="14" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="144" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Cash and carry</text><text x="482" y="202" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">40 cases × $16.50</text><text x="848" y="202" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">660</text><text x="482" y="242" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Fuel and time to collect</text><text x="848" y="242" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">+ 35</text><line x1="482" y1="290" x2="848" y2="290" stroke="#c9d6d4" stroke-width="1.5"/><text x="482" y="324" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Total</text><text x="848" y="324" font-size="22" font-weight="700" fill="#8a6d0d" text-anchor="end">$695</text><rect x="482" y="346" width="366" height="46" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="665" y="374.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Pay today</text><rect x="30" y="430" width="840" height="120" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="468" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Cash and carry saves 720 − 695 = $25</text><text x="450" y="500" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">but she pays a month earlier.</text><text x="450" y="528" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">If her cash is short, the credit may be worth more than the saving.</text>
</svg>