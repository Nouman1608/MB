<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" width="900" height="570" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="570" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Nine things a wholesaler does</text>

<rect x="30" y="110" width="270" height="135" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="62" cy="146" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="152.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="90" y="153" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Breaking bulk</text><text x="50" y="190" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">lorry loads into cases or</text><text x="50" y="211" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">cartons</text><rect x="315" y="110" width="270" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="347" cy="146" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="347" y="152.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="375" y="153" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Storage</text><text x="335" y="190" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">holds stock until retailers</text><text x="335" y="211" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">need it</text><rect x="600" y="110" width="270" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="632" cy="146" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="632" y="152.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="660" y="153" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Bearing risk</text><text x="620" y="190" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">owns the goods: price</text><text x="620" y="211" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">falls, damage, theft,</text><text x="620" y="232" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">fashion</text><rect x="30" y="260" width="270" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="62" cy="296" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="302.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="90" y="303" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Assortment</text><text x="50" y="340" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">many manufacturers’ goods</text><text x="50" y="361" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">in one place</text><rect x="315" y="260" width="270" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="347" cy="296" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="347" y="302.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="375" y="303" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Transport and delivery</text><text x="335" y="340" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">saves retailers collection</text><text x="335" y="361" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">trips</text><rect x="600" y="260" width="270" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="632" cy="296" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="632" y="302.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="660" y="303" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Credit</text><text x="620" y="340" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">pay later, often 30 days</text><rect x="30" y="410" width="270" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="62" cy="446" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="452.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">7</text><text x="90" y="453" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Advice and information</text><text x="50" y="490" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">between manufacturers and</text><text x="50" y="511" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">retailers</text><rect x="315" y="410" width="270" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="347" cy="446" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="347" y="452.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">8</text><text x="375" y="453" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Packing and labelling</text><text x="335" y="490" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">some grade, pack or label</text><text x="335" y="511" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">goods</text><rect x="600" y="410" width="270" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="632" cy="446" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="632" y="452.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">9</text><text x="660" y="453" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Price stability</text><text x="620" y="490" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">stores when supply is high,</text><text x="620" y="511" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">releases when low</text>
</svg>