<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 665" width="900" height="665" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="665" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who bypasses the wholesaler?</text>

<rect x="30" y="110" width="260" height="78" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="160" y="154.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Large retailers</text><line x1="296" y1="149" x2="336" y2="149" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="345" y="110" width="525" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="365" y="143" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Supermarkets and multiple chains buy direct and run</text><text x="365" y="165" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">central warehouses</text><rect x="30" y="202" width="260" height="78" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="160" y="246.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Manufacturers</text><line x1="296" y1="241" x2="336" y2="241" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="345" y="202" width="525" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="365" y="248" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Sell direct through their own shops or websites</text><rect x="30" y="294" width="260" height="78" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="160" y="338.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Ecommerce</text><line x1="296" y1="333" x2="336" y2="333" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="345" y="294" width="525" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="365" y="327" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Small producers reach consumers without</text><text x="365" y="349" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">intermediaries</text><rect x="30" y="386" width="260" height="78" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="160" y="419.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Perishable or</text><text x="160" y="441.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">made-to-order goods</text><line x1="296" y1="425" x2="336" y2="425" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="345" y="386" width="525" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="365" y="432" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Fresh bread or custom furniture sold direct</text><rect x="30" y="490" width="840" height="150" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="526" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">The functions do not disappear</text><rect x="165" y="548" width="170" height="46" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="250" y="576.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Break bulk</text><rect x="365" y="548" width="170" height="46" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="576.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Store</text><rect x="565" y="548" width="170" height="46" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="650" y="576.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Deliver</text><text x="450" y="622" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">The large retailer or manufacturer takes on these costs itself.</text>
</svg>