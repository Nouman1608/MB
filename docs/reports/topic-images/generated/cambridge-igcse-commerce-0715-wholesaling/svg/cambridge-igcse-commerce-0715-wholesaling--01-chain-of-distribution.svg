<rect width="900" height="570" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Where the wholesaler sits</text>

<rect x="30" y="150" width="180" height="70" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="120" y="192" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Manufacturer</text><line x1="216" y1="185" x2="244" y2="185" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="250" y="150" width="180" height="70" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="340" y="192" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Wholesaler</text><line x1="436" y1="185" x2="464" y2="185" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="470" y="150" width="180" height="70" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="560" y="192" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Retailer</text><line x1="656" y1="185" x2="684" y2="185" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="690" y="150" width="180" height="70" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="780" y="192" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Consumer</text><text x="450" y="128" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">The traditional chain of distribution</text><text x="340" y="250" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="middle">buys lorry loads</text><text x="340" y="270" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="middle">sells cases or cartons</text><rect x="110" y="310" width="680" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="345" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">The wholesaler’s customers</text><rect x="140" y="370" width="620" height="50" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="401.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Mostly retailers</text><rect x="140" y="440" width="146" height="46" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="213" y="468.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Hotels</text><rect x="298" y="440" width="146" height="46" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="371" y="468.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Restaurants</text><rect x="456" y="440" width="146" height="46" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="529" y="468.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Schools</text><rect x="614" y="440" width="146" height="46" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="687" y="468.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Other businesses</text><path d="M340,284 L340,306" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="450" y="545" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Customers other than retailers buy for their own use.</text>
