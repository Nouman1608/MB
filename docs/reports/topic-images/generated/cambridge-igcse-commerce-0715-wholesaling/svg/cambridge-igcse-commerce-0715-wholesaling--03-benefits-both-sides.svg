<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="640" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What the wholesaler does for each side</text>

<rect x="345" y="260" width="210" height="80" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="307.35" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Wholesaler</text><rect x="30" y="110" width="290" height="470" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="175" y="146" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">For the manufacturer</text><rect x="44" y="168" width="262" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="58" y="196" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Fewer, larger orders</text><text x="58" y="219" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">fewer deliveries and invoices</text><rect x="44" y="248" width="262" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="58" y="276" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Storage space saved</text><text x="58" y="299" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">and paid sooner</text><rect x="44" y="328" width="262" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="58" y="356" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Continuous production</text><text x="58" y="379" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">even in quiet seasons</text><rect x="44" y="408" width="262" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="58" y="436" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Risk transferred</text><text x="58" y="459" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">of goods not selling</text><rect x="44" y="488" width="262" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="58" y="516" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Market information</text><text x="58" y="539" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">what retailers reorder</text><rect x="580" y="110" width="290" height="470" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="725" y="146" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="middle">For the retailer</text><rect x="594" y="168" width="262" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="608" y="196" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Small quantities</text><text x="608" y="219" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">less money tied up in stock</text><rect x="594" y="248" width="262" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="608" y="276" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Wide choice in one place</text><text x="608" y="299" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">saves time</text><rect x="594" y="328" width="262" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="608" y="356" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Less storage needed</text><text x="608" y="379" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">restock frequently</text><rect x="594" y="408" width="262" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="608" y="436" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Credit</text><text x="608" y="459" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">helps cash flow</text><rect x="594" y="488" width="262" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="608" y="516" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Delivery and advice</text><text x="608" y="539" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">new and popular lines</text><line x1="340" y1="300" x2="326" y2="300" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="560" y1="300" x2="574" y2="300" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="450" y="615" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">Answer for the party the question names: manufacturer or retailer.</text>
</svg>