<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 788" width="900" height="788" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="788" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Motion parallax</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Looking out of a train window</text>
<rect x="30" y="124" width="840" height="330" rx="14" fill="#e8f0ef" stroke="#1e2a44" stroke-width="2.5"/><clipPath id="win"><rect x="30" y="124" width="840" height="330" rx="14"/></clipPath><g clip-path="url(#win)"><path d="M30,304 Q160,234 300,289 Q450,219 600,284 Q740,234 870,294 L870,454 L30,454 Z" fill="#a9c48f"/><rect x="30" y="374" width="840" height="80" fill="#d8e3c6"/><rect x="55" y="339" width="14" height="90" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="109" y="339" width="14" height="90" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="163" y="339" width="14" height="90" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="217" y="339" width="14" height="90" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="271" y="339" width="14" height="90" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="325" y="339" width="14" height="90" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="379" y="339" width="14" height="90" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="433" y="339" width="14" height="90" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="487" y="339" width="14" height="90" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="541" y="339" width="14" height="90" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="595" y="339" width="14" height="90" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="649" y="339" width="14" height="90" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="703" y="339" width="14" height="90" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="757" y="339" width="14" height="90" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="811" y="339" width="14" height="90" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="865" y="339" width="14" height="90" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><line x1="30" y1="364" x2="870" y2="364" stroke="#1e2a44" stroke-width="3"/></g><line x1="520" y1="262" x2="440" y2="262" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="560" y="146" width="290" height="75" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="574" y="174.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Distant hills</text><text x="574" y="202.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">appear to move slowly: they drift</text><line x1="640" y1="394" x2="260" y2="394" stroke="#b5602e" stroke-width="10" marker-end="url(#ahR)"/><rect x="50" y="146" width="290" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="64" y="174.04" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Near fence posts</text><text x="64" y="202.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">appear to move quickly past us:</text><text x="64" y="223.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">they flash by</text><rect x="30" y="476" width="840" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="510.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">The <tspan font-weight="700" fill="#1e2a44">difference</tspan> <tspan font-weight="700" fill="#1e2a44">in</tspan> <tspan font-weight="700" fill="#1e2a44">speed</tspan> tells us <tspan font-weight="700" fill="#1e2a44">directly</tspan> how far away things are: no guessing or inference</text><text x="450" y="534.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">needed.</text><rect x="30" y="582" width="270.6666666666667" height="174" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="614" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GIBSON: BOTTOM-UP</text><text x="50" y="640.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The optic array is enough</text><text x="50" y="668.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The light reaching the eye</text><text x="50" y="689.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">contains enough information</text><text x="50" y="710.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">for accurate perception.</text><rect x="314.6666666666667" y="582" width="270.6666666666667" height="174" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334.6666666666667" y="614" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRENGTH</text><text x="334.6666666666667" y="640.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Real-world movement</text><text x="334.6666666666667" y="668.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Explains quick, accurate</text><text x="334.6666666666667" y="689.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">movement; grew out of work</text><text x="334.6666666666667" y="710.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">on how pilots judge distance</text><text x="334.6666666666667" y="731.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">when landing.</text><rect x="599.3333333333334" y="582" width="270.6666666666667" height="174" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="619.3333333333334" y="614" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMITATION</text><text x="619.3333333333334" y="640.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Illusions</text><text x="619.3333333333334" y="668.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Perception can be wrong</text><text x="619.3333333333334" y="689.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">even when the information is</text><text x="619.3333333333334" y="710.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">there. But most illusions are</text><text x="619.3333333333334" y="731.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">flat drawings.</text>
</svg>