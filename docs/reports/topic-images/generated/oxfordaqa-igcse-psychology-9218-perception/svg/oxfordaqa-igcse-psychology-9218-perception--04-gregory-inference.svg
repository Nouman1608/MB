<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 633" width="900" height="633" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="633" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Gregory: illusions as wrong inferences</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The brain uses cues and past experience to build a best guess</text>
<rect x="30" y="124" width="260" height="270" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M95,369 L148,154 M225,369 L172,154" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><line x1="125" y1="199" x2="195" y2="199" stroke="#b5602e" stroke-width="7"/><line x1="125" y1="329" x2="195" y2="329" stroke="#b5602e" stroke-width="7"/><text x="122" y="196" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">looks</text><text x="122" y="214" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">longer</text><text x="160" y="356" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">same length</text><line x1="340" y1="144" x2="340" y2="362" stroke="#c9d6d4" stroke-width="4"/><rect x="384" y="124" width="486" height="62" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="396" y="149.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">The two bars are the same length, but the upper one</text><text x="396" y="170.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">looks longer</text><circle cx="340" cy="155" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="340" y="163.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="384" y="194" width="486" height="62" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="396" y="219.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Converging lines are read as linear perspective</text><text x="396" y="240.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">(railway tracks)</text><circle cx="340" cy="225" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="340" y="233.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="384" y="264" width="486" height="41" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="396" y="289.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Past experience says the upper bar is further away</text><circle cx="340" cy="284.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="340" y="293.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="384" y="313" width="486" height="69" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="396" y="338.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Same retinal image + further away = it must be bigger</text><text x="396" y="365.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">An inference, not direct pick-up of information</text><circle cx="340" cy="347.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="340" y="356.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="30" y="432" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">MÜLLER-LYER: CORNERS</text><rect x="30" y="446" width="412" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="480.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Fins out</text><text x="50" y="510.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Like the <tspan font-weight="700" fill="#1e2a44">inside</tspan> corner of a room: further</text><text x="50" y="532.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">away, so seen as <tspan font-weight="700" fill="#1e2a44">longer</tspan></text><rect x="458" y="446" width="412" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="491.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Fins in</text><text x="478" y="521.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Like the <tspan font-weight="700" fill="#1e2a44">outside</tspan> corner of a building: nearer</text><text x="450" y="592.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">People who grew up among straight walls and corners apply size constancy to the "further" line.</text>
</svg>