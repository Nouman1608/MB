<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 743" width="900" height="743" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="743" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Direct or constructed?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Two theories of perception compared</text>
<rect x="30" y="124" width="412" height="91" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="236" y="160.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Gibson's direct theory</text><text x="236" y="190.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Bottom-up</text><rect x="458" y="124" width="412" height="91" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="664" y="160.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Gregory's constructivist theory</text><text x="664" y="190.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Top-down</text><clipPath id="tc237"><rect x="30" y="237" width="840" height="341" rx="14"/></clipPath><g clip-path="url(#tc237)"><rect x="30" y="237" width="178.1818181818182" height="48" fill="#b5d3cf"/><rect x="208.1818181818182" y="237" width="330.90909090909093" height="48" fill="#b5d3cf"/><text x="222.1818181818182" y="264.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Gibson</text><rect x="539.0909090909091" y="237" width="330.90909090909093" height="48" fill="#f2e7b8"/><text x="553.0909090909091" y="264.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Gregory</text><rect x="30" y="285" width="178.1818181818182" height="68" fill="#dce9e7"/><text x="44" y="311.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Sensory input</text><rect x="208.1818181818182" y="285" width="330.90909090909093" height="68" fill="#ffffff"/><text x="222.1818181818182" y="311.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Contains enough information (the optic</text><text x="222.1818181818182" y="332.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">array)</text><rect x="539.0909090909091" y="285" width="330.90909090909093" height="68" fill="#ffffff"/><text x="553.0909090909091" y="311.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Often incomplete</text><line x1="30" y1="353" x2="870" y2="353" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="353" width="178.1818181818182" height="68" fill="#dce9e7"/><text x="44" y="379.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">How we perceive</text><rect x="208.1818181818182" y="353" width="330.90909090909093" height="68" fill="#f8faf9"/><text x="222.1818181818182" y="379.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Pick up the information directly; no</text><text x="222.1818181818182" y="400.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">guessing</text><rect x="539.0909090909091" y="353" width="330.90909090909093" height="68" fill="#f8faf9"/><text x="553.0909090909091" y="379.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Inferences from visual cues and past</text><text x="553.0909090909091" y="400.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">experience build a best-guess model</text><line x1="30" y1="421" x2="870" y2="421" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="421" width="178.1818181818182" height="68" fill="#dce9e7"/><text x="44" y="447.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Key evidence</text><rect x="208.1818181818182" y="421" width="330.90909090909093" height="68" fill="#ffffff"/><text x="222.1818181818182" y="447.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Motion parallax; how pilots judge</text><text x="222.1818181818182" y="468.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">distance when landing</text><rect x="539.0909090909091" y="421" width="330.90909090909093" height="68" fill="#ffffff"/><text x="553.0909090909091" y="447.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Visual illusions and perceptual set</text><line x1="30" y1="489" x2="870" y2="489" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="489" width="178.1818181818182" height="89" fill="#dce9e7"/><text x="44" y="515.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Weakness</text><rect x="208.1818181818182" y="489" width="330.90909090909093" height="89" fill="#f8faf9"/><text x="222.1818181818182" y="515.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cannot easily explain illusions</text><rect x="539.0909090909091" y="489" width="330.90909090909093" height="89" fill="#f8faf9"/><text x="553.0909090909091" y="515.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Evidence from artificial images seen</text><text x="553.0909090909091" y="536.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">briefly; we would make more everyday</text><text x="553.0909090909091" y="557.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mistakes</text></g><line x1="208.1818181818182" y1="237" x2="208.1818181818182" y2="578" stroke="#c9d6d4" stroke-width="1.5"/><line x1="539.0909090909091" y1="237" x2="539.0909090909091" y2="578" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="237" width="840" height="341" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="600" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="634.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Combining them</text><text x="50" y="664.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Direct perception may dominate in clear, moving scenes, and construction when information is</text><text x="50" y="686.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">limited.</text>
</svg>