<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 718" width="900" height="718" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="718" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Perceptual set: four factors, four studies</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A readiness to perceive something in a particular way</text>
<text x="30" y="140" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">EXPECTATION: BRUNER AND MINTURN</text><g transform="translate(0,30)"><rect x="30" y="124" width="405" height="190" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="100" y="216" font-size="46" font-weight="700" fill="#4a5568" text-anchor="middle">A</text><text x="365" y="216" font-size="46" font-weight="700" fill="#4a5568" text-anchor="middle">C</text><text x="232" y="216" font-size="54" font-weight="700" fill="#b5602e" text-anchor="middle" letter-spacing="-6">13</text><text x="232" y="259" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">among letters: seen as "B"</text><rect x="465" y="124" width="405" height="190" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="535" y="216" font-size="46" font-weight="700" fill="#4a5568" text-anchor="middle">12</text><text x="800" y="216" font-size="46" font-weight="700" fill="#4a5568" text-anchor="middle">14</text><text x="667" y="216" font-size="54" font-weight="700" fill="#b5602e" text-anchor="middle" letter-spacing="-6">13</text><text x="667" y="259" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">among numbers: seen as "13"</text></g><rect x="30" y="366" width="412" height="153" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="398" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MOTIVATION</text><text x="50" y="424.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Gilchrist and Nesberg</text><text x="50" y="452.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Participants who had gone without food rated</text><text x="50" y="473.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">food pictures as brighter than those who had</text><text x="50" y="494.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">eaten.</text><rect x="458" y="366" width="412" height="153" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="398" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EMOTION</text><text x="478" y="424.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Kunst-Wilson and Zajonc</text><text x="478" y="452.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Shapes flashed too briefly to recognise were</text><text x="478" y="473.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">later preferred, though participants could not say</text><text x="478" y="494.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">which they had seen.</text><rect x="30" y="533" width="412" height="153" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="565" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CULTURE</text><text x="50" y="591.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Nisbett and Miyamoto</text><text x="50" y="619.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">East Asian cultures: holistic (context and</text><text x="50" y="640.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">background). Western cultures: analytic (the</text><text x="50" y="661.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">main object).</text><rect x="458" y="533" width="412" height="153" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="478" y="565" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">EVALUATION</text><text x="478" y="591.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Control vs realism</text><text x="478" y="619.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Lab control makes cause and effect clearer, but</text><text x="478" y="640.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">tasks are artificial; culture studies treat large</text><text x="478" y="661.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">groups as alike.</text>
</svg>