><text x="450" y="615.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">ambiguity</text><rect x="600" y="390" width="270" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="735" cy="428" r="20" fill="#1e2a44"/><circle cx="680" cy="538" r="20" fill="#1e2a44"/><circle cx="790" cy="538" r="20" fill="#1e2a44"/><polygon points="735,428 680,538 790,538" fill="#ffffff"/><text x="735" y="582" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Kanizsa triangle</text><rect x="699.525" y="596" width="70.95" height="29" rx="14.5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="735" y="615.9" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">fiction</text><rect x="30" y="662" width="412" height="108" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="696.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ambiguity</text><text x="50" y="724.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Two equally good interpretations; the brain</text><text x="50" y="745.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">switches between them.</text><rect x="458" y="662" width="412" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="696.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Fiction</text><text x="478" y="724.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The brain adds information that is not present,</text><text x="478" y="745.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">such as edges.</text>
