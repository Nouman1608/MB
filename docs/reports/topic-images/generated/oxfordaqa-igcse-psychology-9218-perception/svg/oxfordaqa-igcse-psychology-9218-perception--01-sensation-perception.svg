<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 416" width="900" height="416" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="416" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Sensation and perception</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">"The eye sees, but the brain perceives."</text>
<rect x="30" y="124" width="330" height="260" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SENSATION</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Detection of physical energy</text><text x="50" y="206.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">by the sense organs</text><text x="50" y="235.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Light reaching the retina; sound</text><text x="50" y="256.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">waves reaching the ear</text><text x="50" y="285.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The <tspan font-weight="700" fill="#1e2a44">same</tspan> for anyone with working</text><text x="50" y="306.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">senses</text><rect x="540" y="124" width="330" height="260" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="560" y="156" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">PERCEPTION</text><text x="560" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The brain's organisation and</text><text x="560" y="206.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">interpretation of that input</text><text x="560" y="235.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Turns raw input into a meaningful</text><text x="560" y="256.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">picture</text><text x="560" y="285.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Can <tspan font-weight="700" fill="#1e2a44">differ</tspan> between people looking at</text><text x="560" y="306.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the same thing</text><circle cx="450" cy="234" r="44" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><circle cx="430" cy="234" r="16" fill="#2b5a9a"/><circle cx="426" cy="234" r="7" fill="#1e2a44"/><line x1="368" y1="234" x2="398" y2="234" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="500" y1="234" x2="532" y2="234" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="450" y="308" font-size="16" font-weight="700" fill="#4a5568" text-anchor="middle">eye</text><text x="450" y="330" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">to brain</text>
</svg>