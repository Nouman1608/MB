<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 810" width="900" height="810" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="810" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: notes on a paper-recycling campaign</text>

<text x="240" y="118" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">Heading (spaces)</text><text x="445" y="118" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">Weak</text><text x="705" y="118" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Good notes</text><rect x="30" y="136" width="840" height="184" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="180" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">(a)</text><text x="330" y="190" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;مہم کا طریقہ&#x200F;</text><text x="330" y="224" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">how the campaign works</text><text x="330" y="248" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="end">2 notes</text><rect x="350" y="146" width="160" height="164" rx="10" fill="#fbf1ea"/><text x="495" y="192" font-size="25" fill="#b5602e" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پچھلے سال&#x200F;</text><text x="495" y="248" font-size="25" fill="#b5602e" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;ڈبا&#x200F;</text><text x="372" y="188" font-size="26" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><rect x="522" y="146" width="338" height="164" rx="10" fill="#dce9e7"/><text x="846" y="190" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;ہر جماعت میں کاغذ کا ڈبا&#x200F;</text><text x="846" y="218" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="end" font-style="italic">a paper box in every class</text><text x="846" y="270" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;ہر جمعے کو کاغذ کارخانے کو فروخت&#x200F;</text><text x="846" y="298" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="end" font-style="italic">paper sold to a factory every Friday</text><rect x="30" y="332" width="840" height="156" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="376" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">(b)</text><text x="330" y="386" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;مہم کا فائدہ&#x200F;</text><text x="330" y="420" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">the benefit</text><text x="330" y="444" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="end">1 note</text><rect x="350" y="342" width="160" height="136" rx="10" fill="#fbf1ea"/><text x="495" y="388" font-size="25" fill="#b5602e" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کتابیں&#x200F;</text><text x="372" y="384" font-size="26" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><rect x="522" y="342" width="338" height="136" rx="10" fill="#dce9e7"/><text x="846" y="386" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;رقم سے لائبریری کے لیے&#x200F;</text><text x="846" y="438" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;نئی کتابیں&#x200F;</text><text x="846" y="466" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="end" font-style="italic">the money buys new library books</text><rect x="30" y="500" width="840" height="156" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="544" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">(c)</text><text x="330" y="554" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;ایک مسئلہ&#x200F;</text><text x="330" y="588" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">one problem</text><text x="330" y="612" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="end">1 note</text><rect x="350" y="510" width="160" height="136" rx="10" fill="#fbf1ea"/><text x="495" y="556" font-size="25" fill="#b5602e" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;طلبہ&#x200F;</text><text x="372" y="552" font-size="26" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><rect x="522" y="510" width="338" height="136" rx="10" fill="#dce9e7"/><text x="846" y="554" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;ڈبوں میں پلاسٹک اور بچا ہوا کھانا،&#x200F;</text><text x="846" y="606" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;جس سے کاغذ خراب&#x200F;</text><text x="846" y="634" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="end" font-style="italic">plastic and leftover food spoil the paper</text><rect x="30" y="674" width="840" height="108" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="712" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Signal word</text><text x="250" y="720" font-size="27" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;تاہم&#x200F;</text><text x="268" y="712" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">(however) warned that a problem was coming.</text><text x="54" y="762" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Weak notes name a topic or the wrong thing: at most one of them would be credited.</text>
</svg>