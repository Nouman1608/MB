<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 892" width="900" height="892" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="892" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A six-step note-making method</text>

<rect x="30" y="110" width="840" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="154" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="162.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="122" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Read the headings first</text><text x="122" y="176" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Note how many points each needs: they tell you what to look for.</text><rect x="30" y="208" width="840" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="252" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="260.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="122" y="246" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Read the whole text once</text><text x="122" y="274" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Get its overall structure.</text><rect x="30" y="306" width="840" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="350" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="358.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="122" y="344" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Read again with the headings in mind</text><text x="122" y="372" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Mark each relevant point in the margin with its heading letter (a, b, c).</text><rect x="30" y="404" width="840" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="459" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="467.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="122" y="442" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Check for scattered points</text><text x="122" y="470" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Quotations, the final paragraph and sentences after a turn word often hold a point</text><text x="122" y="493" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">for another heading.</text><rect x="30" y="524" width="840" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="568" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="576.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="122" y="562" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Write the notes</text><text x="122" y="590" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">One point per bullet, specific, brief.</text><rect x="30" y="622" width="840" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="666" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="674.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="122" y="660" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Check each note</text><text x="122" y="688" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Does it answer its heading, and is it different from the other notes there?</text><rect x="30" y="734" width="840" height="130" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="784" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Turn words that often</text><text x="54" y="810" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">hold a point for</text><text x="54" y="836" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">another heading</text><text x="770" y="800" font-size="27" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;تاہم&#x200F;</text><text x="770" y="842" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">however</text><text x="600" y="800" font-size="27" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;لیکن&#x200F;</text><text x="600" y="842" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">but</text><text x="430" y="800" font-size="27" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;اس کے علاوہ&#x200F;</text><text x="430" y="842" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">besides</text>
</svg>