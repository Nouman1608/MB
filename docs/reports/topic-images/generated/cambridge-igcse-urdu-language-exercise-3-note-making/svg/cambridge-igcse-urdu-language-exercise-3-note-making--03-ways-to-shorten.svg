<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 632" width="900" height="632" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="632" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four ways to shorten a note in Urdu</text>

<rect x="30" y="110" width="410" height="236" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Drop the helper verb</text><text x="420" y="200" font-size="24" fill="#4a5568" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;یہاں پانی کم ہوتا جا رہا ہے&#x200F;</text><line x1="398" y1="220" x2="398" y2="258" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="420" y="310" font-size="27" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پانی کی کمی&#x200F;</text><text x="50" y="302" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">helper verbs go</text><rect x="460" y="110" width="410" height="236" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Use a verbal noun</text><text x="850" y="206" font-size="27" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پودوں کو پانی دینا&#x200F;</text><text x="850" y="300" font-size="27" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;مرمت&#x200F;</text><text x="480" y="198" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">infinitive</text><text x="480" y="292" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">noun form</text><rect x="30" y="366" width="410" height="236" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="402" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Keep the specific detail</text><rect x="50" y="420" width="370" height="76" rx="10" fill="#fbf1ea" stroke="#b5602e" stroke-width="2"/><text x="78" y="466" font-size="26" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><text x="400" y="472" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کچھ وقت&#x200F;</text><text x="105" y="464" font-size="16" font-weight="600" fill="#b5602e" text-anchor="start">vague</text><rect x="50" y="506" width="370" height="76" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="78" y="552" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="400" y="558" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;دس سال&#x200F;</text><text x="105" y="550" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">the point</text><rect x="460" y="366" width="410" height="236" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="402" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Keep negatives</text><rect x="480" y="420" width="370" height="76" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="830" y="472" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;ٹکٹ ضروری&#x200F;</text><text x="500" y="464" font-size="16" font-weight="600" fill="#4a5568" text-anchor="start">ticket required</text><rect x="480" y="506" width="370" height="76" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="830" y="558" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;ٹکٹ ضروری نہیں&#x200F;</text><text x="500" y="550" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">not required</text>
</svg>