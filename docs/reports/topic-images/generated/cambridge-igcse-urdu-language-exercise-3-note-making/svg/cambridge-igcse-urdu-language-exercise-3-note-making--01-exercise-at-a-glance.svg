<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" width="900" height="490" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="490" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Exercise 3 at a glance</text>

<rect x="30" y="110" width="195" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="127.5" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">9 marks</text><text x="127.5" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">brief notes under</text><text x="127.5" y="205" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">given headings</text><rect x="245" y="110" width="195" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="342.5" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">15-18 min</text><text x="342.5" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">the longest reading</text><text x="342.5" y="205" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">on the paper</text><rect x="460" y="110" width="195" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="557.5" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">R1 to R4</text><text x="557.5" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">all four reading</text><text x="557.5" y="205" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">objectives</text><rect x="675" y="110" width="195" height="130" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="772.5" y="154" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">Feeds Ex. 4</text><text x="772.5" y="184" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">same text as the</text><text x="772.5" y="205" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">summary</text><text x="450" y="290" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Three features define the task</text><rect x="30" y="312" width="268" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="348.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The headings are</text><text x="50" y="373.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">given</text><text x="50" y="401.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A true point that fits no</text><text x="50" y="423.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">heading earns nothing.</text><rect x="316" y="312" width="268" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="336" y="348.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The notes are brief</text><text x="336" y="376.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Full sentences are not</text><text x="336" y="398.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">required; a precise phrase</text><text x="336" y="420.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">is enough.</text><rect x="602" y="312" width="268" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="622" y="348.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The space is a guide</text><text x="622" y="376.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The number of bullets or</text><text x="622" y="398.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">lines = the number of</text><text x="622" y="420.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">separate points needed.</text>
</svg>