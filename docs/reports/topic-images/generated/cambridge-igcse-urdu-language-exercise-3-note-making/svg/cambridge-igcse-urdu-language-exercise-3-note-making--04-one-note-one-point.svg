<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 718" width="900" height="718" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="718" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One note, one point</text>

<rect x="30" y="110" width="840" height="340" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">1. Two points in one bullet</text><text x="54" y="174" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The heading has two bullet spaces: split the line into two notes.</text><rect x="50" y="196" width="380" height="104" rx="10" fill="#fbf1ea" stroke="#b5602e" stroke-width="2"/><text x="410" y="248" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;جھولے اور سایہ دار بنچ&#x200F;</text><text x="410" y="286" font-size="16" font-weight="600" fill="#b5602e" text-anchor="end">two points in one line</text><text x="80" y="252" font-size="26" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><line x1="436" y1="248" x2="466" y2="248" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="470" y="196" width="380" height="104" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="830" y="248" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;بچوں کے لیے جھولے&#x200F;</text><text x="830" y="286" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="end">swings for children</text><rect x="470" y="316" width="380" height="104" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="830" y="368" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;بزرگوں کے لیے سایہ دار بنچ&#x200F;</text><text x="830" y="406" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="end">shaded benches for older people</text><rect x="30" y="470" width="840" height="220" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="506" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">2. The same point twice</text><text x="54" y="534" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Two wordings of one idea are normally credited once.</text><rect x="50" y="560" width="380" height="104" rx="10" fill="#fbf1ea" stroke="#b5602e" stroke-width="2"/><text x="410" y="612" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پانی کی کمی&#x200F;</text><text x="410" y="650" font-size="16" font-weight="600" fill="#b5602e" text-anchor="end">water shortage</text><text x="450" y="620" font-size="30" font-weight="700" fill="#b5602e" text-anchor="middle">=</text><rect x="470" y="560" width="380" height="104" rx="10" fill="#fbf1ea" stroke="#b5602e" stroke-width="2"/><text x="830" y="612" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پانی کم ملتا ہے&#x200F;</text><text x="830" y="650" font-size="16" font-weight="600" fill="#b5602e" text-anchor="end">little water is available</text>
</svg>