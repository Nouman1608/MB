<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 806" width="900" height="806" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="806" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A note is a point, not a topic</text>

<rect x="30" y="110" width="840" height="547.6" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,160 L31.25,124 Q31.25,111.25 44,111.25 L856,111.25 Q868.75,111.25 868.75,124 L868.75,160 Z" fill="#b5d3cf"/><text x="414" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Text sentence</text><text x="584" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Weak note</text><line x1="430" y1="110" x2="430" y2="657.6" stroke="#c9d6d4" stroke-width="2"/><text x="854" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Good note</text><line x1="600" y1="110" x2="600" y2="657.6" stroke="#c9d6d4" stroke-width="2"/><line x1="30" y1="160" x2="870" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="414" y="210.4" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;بہت سے طلبہ صبح ناشتہ کیے بغیر&#x200F;</text><text x="414" y="260.4" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;اسکول آ جاتے ہیں۔&#x200F;</text><text x="584" y="224.4" font-size="24" fill="#b5602e" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;ناشتہ&#x200F;</text><text x="584" y="256.4" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">breakfast</text><text x="854" y="224.4" font-size="24" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;بغیر ناشتے کے اسکول آنا&#x200F;</text><text x="854" y="256.4" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">coming to school without breakfast</text><line x1="30" y1="284.4" x2="870" y2="284.4" stroke="#c9d6d4" stroke-width="2"/><text x="414" y="334.79999999999995" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;سائیکل چلانے سے فضا میں&#x200F;</text><text x="414" y="384.79999999999995" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;دھواں کم پھیلتا ہے۔&#x200F;</text><text x="584" y="348.79999999999995" font-size="24" fill="#b5602e" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;سائیکل&#x200F;</text><text x="584" y="380.79999999999995" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">bicycle</text><text x="854" y="348.79999999999995" font-size="24" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;فضائی آلودگی میں کمی&#x200F;</text><text x="854" y="380.79999999999995" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">less air pollution</text><line x1="30" y1="408.79999999999995" x2="870" y2="408.79999999999995" stroke="#c9d6d4" stroke-width="2"/><text x="414" y="459.19999999999993" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;داخلے کے لیے پہلے سے ٹکٹ&#x200F;</text><text x="414" y="509.19999999999993" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;خریدنا ضروری ہے۔&#x200F;</text><text x="584" y="473.19999999999993" font-size="24" fill="#b5602e" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;ٹکٹ&#x200F;</text><text x="584" y="505.19999999999993" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">ticket</text><text x="854" y="473.19999999999993" font-size="24" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پیشگی ٹکٹ ضروری&#x200F;</text><text x="854" y="505.19999999999993" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">ticket in advance required</text><line x1="30" y1="533.1999999999999" x2="870" y2="533.1999999999999" stroke="#c9d6d4" stroke-width="2"/><text x="414" y="583.5999999999999" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;روزانہ آدھا گھنٹہ چہل قدمی سے&#x200F;</text><text x="414" y="633.5999999999999" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;دل مضبوط ہوتا ہے۔&#x200F;</text><text x="584" y="597.5999999999999" font-size="24" fill="#b5602e" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;چہل قدمی&#x200F;</text><text x="584" y="629.5999999999999" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">walking</text><text x="854" y="597.5999999999999" font-size="24" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;دل مضبوط ہوتا ہے&#x200F;</text><text x="854" y="629.5999999999999" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">the heart gets stronger</text><rect x="30" y="681.6" width="840" height="96" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="717.6" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A weak note names a topic; a good note states the point</text><text x="54" y="749.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Under the heading "benefits of exercise", walking is the topic; the strong heart is the benefit.</text>
</svg>