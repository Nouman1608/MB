<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Put each point under the right heading</text>

<text x="215" y="128" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">The text</text><text x="705" y="128" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">The headings</text><rect x="50" y="150" width="340" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="70" y="206" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Opening</text><rect x="194" y="162" width="180" height="36" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="284" y="186" font-size="15" font-weight="600" fill="#4a5568" text-anchor="middle">background ✗</text><rect x="194" y="202" width="180" height="36" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="284" y="226" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">an advantage</text><rect x="50" y="264" width="340" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="70" y="320" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Paragraph 2</text><rect x="194" y="296" width="180" height="36" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="284" y="320" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">an advantage</text><rect x="50" y="378" width="340" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="70" y="434" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Paragraph 3</text><rect x="194" y="390" width="180" height="36" rx="8" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="284" y="414" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">a difficulty</text><rect x="194" y="430" width="180" height="36" rx="8" fill="#fbf1ea" stroke="#b5602e" stroke-width="2"/><text x="284" y="454" font-size="15" font-weight="600" fill="#b5602e" text-anchor="middle">advice ✗</text><rect x="50" y="492" width="340" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="70" y="548" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ending</text><rect x="194" y="524" width="180" height="36" rx="8" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="284" y="548" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">quotation: a difficulty</text><rect x="560" y="178" width="290" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="705" y="215.85" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Advantages</text><rect x="560" y="408" width="290" height="92" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="705" y="445.85" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Problems</text><path d="M374,220 C470,220 470,228 548,228" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><polygon points="548,221 562,228 548,235" fill="#1e2a44"/><path d="M374,314 C470,314 470,250 548,250" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><polygon points="548,243 562,250 548,257" fill="#1e2a44"/><path d="M374,408 C470,408 470,458 548,458" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><polygon points="548,451 562,458 548,465" fill="#1e2a44"/><path d="M374,542 C470,542 470,480 548,480" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><polygon points="548,473 562,480 548,487" fill="#1e2a44"/><rect x="30" y="625" width="268" height="150" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="660.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Points are scattered</text><text x="50" y="688.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">An introduction sentence</text><text x="50" y="710.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">may give an advantage; a</text><text x="50" y="732.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">quotation at the end may</text><text x="50" y="754.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">add a difficulty.</text><rect x="316" y="625" width="268" height="150" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="336" y="660.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Solutions are not</text><text x="336" y="684.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">problems</text><text x="336" y="712.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">"Ask an engineer" is</text><text x="336" y="734.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">advice, even if it sits in</text><text x="336" y="756.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the difficulties paragraph.</text><rect x="602" y="625" width="268" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="622" y="660.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Background earns</text><text x="622" y="684.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">nothing</text><text x="622" y="712.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Scene-setting facts score</text><text x="622" y="734.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">only if a heading asks for</text><text x="622" y="756.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">them.</text>
</svg>