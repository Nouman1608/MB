<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1106" width="900" height="1106" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="1106" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: strong notes</text>

<rect x="30" y="110" width="840" height="380" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="156" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">(a)</text><text x="846" y="164" font-size="26" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;چھت پر باغبانی کے فوائد&#x200F;</text><text x="100" y="156" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">benefits of rooftop gardening</text><rect x="54" y="180" width="792" height="92" rx="10" fill="#dce9e7"/><text x="830" y="226" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;بازار کے خرچ میں کمی&#x200F;</text><text x="830" y="258" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="end" font-style="italic">lower spending at the market</text><rect x="54" y="280" width="792" height="92" rx="10" fill="#dce9e7"/><text x="830" y="326" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کیمیائی کھاد سے پاک غذا&#x200F;</text><text x="830" y="358" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="end" font-style="italic">food free of chemical fertiliser</text><rect x="54" y="380" width="792" height="92" rx="10" fill="#dce9e7"/><text x="830" y="426" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;عمارت کا گرمیوں میں ٹھنڈا رہنا&#x200F;</text><text x="830" y="458" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="end" font-style="italic">the building stays cool in summer</text><rect x="30" y="504" width="840" height="280" rx="14" fill="#ffffff" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="550" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">(b)</text><text x="846" y="558" font-size="26" fill="#8a6d0d" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;مکینوں کو پیش آنے والی مشکلات&#x200F;</text><text x="100" y="550" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">difficulties the residents faced</text><rect x="54" y="574" width="792" height="92" rx="10" fill="#f2e7b8"/><text x="830" y="620" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;تیز دھوپ سے پودوں کا جھلسنا&#x200F;</text><text x="830" y="652" font-size="15" font-weight="400" fill="#8a6d0d" text-anchor="end" font-style="italic">plants scorched by strong sun</text><rect x="54" y="674" width="792" height="92" rx="10" fill="#f2e7b8"/><text x="830" y="720" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;گیلی مٹی سے چھت کو نقصان کا خدشہ&#x200F;</text><text x="830" y="752" font-size="15" font-weight="400" fill="#8a6d0d" text-anchor="end" font-style="italic">fear of damp soil damaging the roof</text><rect x="30" y="798" width="840" height="280" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="844" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">(c)</text><text x="846" y="852" font-size="26" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;ماہرین کے مشورے&#x200F;</text><text x="100" y="844" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">the experts' advice</text><rect x="54" y="868" width="792" height="92" rx="10" fill="#dce9e7"/><text x="830" y="914" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;آسان پودوں (پودینہ، ہری مرچ) سے آغاز&#x200F;</text><text x="830" y="946" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="end" font-style="italic">start with easy plants (mint, green chilli)</text><rect x="54" y="968" width="792" height="92" rx="10" fill="#dce9e7"/><text x="830" y="1014" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;گملوں کے نیچے ٹرے&#x200F;</text><text x="830" y="1046" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="end" font-style="italic">trays under the pots</text>
</svg>