<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 576" width="900" height="576" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="576" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four reading objectives in note-making</text>

<rect x="30" y="110" width="840" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="80" cy="160" r="30" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="80" y="168" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">R1</text><text x="132" y="150" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Identify and select relevant information</text><text x="132" y="180" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Find the points that belong under each heading.</text><rect x="30" y="222" width="840" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="80" cy="272" r="30" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="80" y="280" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">R2</text><text x="132" y="262" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Understand ideas, opinions and attitudes</text><text x="132" y="292" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Recognise a point stated as someone's view.</text><rect x="30" y="334" width="840" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="80" cy="384" r="30" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="80" y="392" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">R3</text><text x="132" y="374" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">See connections between ideas</text><text x="132" y="404" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A point in paragraph 4 can belong to a heading introduced in paragraph 1.</text><rect x="30" y="446" width="840" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="80" cy="496" r="30" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="80" y="504" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">R4</text><text x="132" y="486" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Understand what is implied</text><text x="132" y="516" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Supply a point the text implies rather than states, when a heading calls for it.</text>
</svg>