<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 758" width="900" height="758" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="758" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What counts as a note</text>

<rect x="30" y="110" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Specific</text><rect x="54" y="162" width="300" height="92" rx="10" fill="#fbf1ea"/><text x="338" y="210" font-size="24" fill="#b5602e" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کچھ مسائل&#x200F;</text><text x="338" y="240" font-size="15" font-weight="400" fill="#b5602e" text-anchor="end" font-style="italic">some problems</text><text x="82" y="214" font-size="26" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><line x1="360" y1="208" x2="392" y2="208" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="398" y="162" width="448" height="92" rx="10" fill="#dce9e7"/><text x="830" y="210" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پانی کی کمی&#x200F;</text><text x="830" y="240" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="end" font-style="italic">water shortage</text><text x="426" y="214" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><rect x="30" y="274" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="310" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Complete enough to make sense</text><rect x="54" y="326" width="300" height="92" rx="10" fill="#fbf1ea"/><text x="338" y="374" font-size="24" fill="#b5602e" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;دھوپ&#x200F;</text><text x="338" y="404" font-size="15" font-weight="400" fill="#b5602e" text-anchor="end" font-style="italic">sun</text><text x="82" y="378" font-size="26" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><line x1="360" y1="372" x2="392" y2="372" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="398" y="326" width="448" height="92" rx="10" fill="#dce9e7"/><text x="830" y="374" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;تیز دھوپ میں پودوں کا جھلس جانا&#x200F;</text><text x="830" y="404" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="end" font-style="italic">plants scorched in strong sun</text><text x="426" y="378" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><rect x="30" y="438" width="410" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="474.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">One point only</text><text x="50" y="502.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Two ideas in one line may earn one mark, not</text><text x="50" y="524.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">two.</text><rect x="460" y="438" width="410" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="474.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Under the right heading</text><text x="480" y="502.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A correct point under the wrong heading does</text><text x="480" y="524.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">not answer it.</text><rect x="30" y="570" width="840" height="160" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="606" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Write notes as noun phrases with the verbal noun</text><rect x="590" y="624" width="252" height="90" rx="10" fill="#ffffff"/><text x="826" y="672" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;خرچ میں کمی&#x200F;</text><text x="826" y="700" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="end" font-style="italic">lower spending</text><rect x="322" y="624" width="252" height="90" rx="10" fill="#ffffff"/><text x="558" y="672" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کیمیائی کھاد سے پاک غذا&#x200F;</text><text x="558" y="700" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="end" font-style="italic">food free of chemical fertiliser</text><rect x="54" y="624" width="252" height="90" rx="10" fill="#ffffff"/><text x="290" y="672" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;پڑوسیوں سے میل جول&#x200F;</text><text x="290" y="700" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="end" font-style="italic">mixing with neighbours</text>
</svg>