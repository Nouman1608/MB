<text x="450" y="126" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Paper 1: five compulsory exercises, 1 hour 45 minutes, 50 marks</text><rect x="30" y="146" width="160" height="88" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="110" y="182" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Ex. 1</text><text x="110" y="212" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle"></text><rect x="200" y="146" width="160" height="88" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="280" y="182" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Ex. 2</text><text x="280" y="212" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle"></text><rect x="370" y="146" width="160" height="88" rx="10" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="182" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Ex. 3</text><text x="450" y="212" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Note-making, 9</text><rect x="540" y="146" width="160" height="88" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="620" y="182" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Ex. 4</text><text x="620" y="212" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Summary</text><rect x="710" y="146" width="160" height="88" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="790" y="182" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Ex. 5</text><text x="790" y="212" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Writing, 14</text><path d="M450,236 Q450,276 535,276 Q620,276 620,240" fill="none" stroke="#8a6d0d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><polygon points="613,246 620,234 627,246" fill="#8a6d0d"/><text x="535" y="300" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle">the same longest text</text><rect x="30" y="330" width="195" height="122" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="127.5" y="374" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">9 marks</text><text x="127.5" y="404" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">brief notes under</text><text x="127.5" y="425" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">supplied headings</text><rect x="245" y="330" width="195" height="122" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="342.5" y="374" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">Longest text</text><text x="342.5" y="404" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">on the whole paper</text><rect x="460" y="330" width="195" height="122" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="557.5" y="374" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">R1 to R4</text><text x="557.5" y="404" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">all four reading</text><text x="557.5" y="425" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">objectives</text><rect x="675" y="330" width="195" height="122" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="772.5" y="374" font-size="26" font-weight="700" fill="#1e2a44" text-anchor="middle">Urdu only</text><text x="772.5" y="404" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">no dictionaries</text><rect x="30" y="476" width="840" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="518" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Time spent understanding the text in Exercise 3 is paid back in Exercise 4.</text>
