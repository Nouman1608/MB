<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 596" width="900" height="596" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="596" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From notes to summary</text>

<rect x="470" y="120" width="384" height="92" rx="10" fill="#dce9e7"/><text x="838" y="170" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;خرچ میں کمی&#x200F;</text><text x="838" y="198" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="end" font-style="italic">note: a noun phrase</text><text x="450" y="172" font-size="34" font-weight="700" fill="#1e2a44" text-anchor="middle">←</text><rect x="46" y="120" width="384" height="92" rx="10" fill="#f2e7b8"/><text x="414" y="170" font-size="22" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;گھر میں سبزیاں اگانے سے خرچ کم ہوتا ہے&#x200F;</text><text x="414" y="198" font-size="15" font-weight="400" fill="#8a6d0d" text-anchor="end" font-style="italic">summary: a sentence</text><rect x="30" y="236" width="840" height="160" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="274" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Exercise 4: the summary</text><text x="54" y="306" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A paragraph of no more than 100 words "about an aspect or aspects of the text in Exercise 3".</text><text x="54" y="334" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The aspect is often one or two of your headings.</text><text x="54" y="362" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Accurate notes mean most of the selection work is already done.</text><text x="450" y="434" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Exam technique</text><rect x="30" y="452" width="268" height="116" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="488.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">3 to 8 words</text><text x="50" y="516.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">per note: notes, not</text><text x="50" y="538.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">sentences</text><rect x="316" y="452" width="268" height="116" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="336" y="488.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Check each note</text><text x="336" y="516.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">is it really a benefit, a</text><text x="336" y="538.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">difficulty, a piece of</text><text x="336" y="560.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">advice?</text><rect x="602" y="452" width="268" height="116" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="622" y="488.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Keep moving</text><text x="622" y="516.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Exercise 3 is 9 of 50</text><text x="622" y="538.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">marks; Exercise 5 carries</text><text x="622" y="560.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">14</text>
</svg>