<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 661" width="900" height="661" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="661" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Mapping the text to the headings</text>

<rect x="30" y="110" width="840" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="153.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="162.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="122" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Read the headings first</text><text x="122" y="176" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">They tell you what kinds of information to look for.</text><rect x="30" y="207" width="840" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="250.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="259.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="122" y="245" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Read the whole text once</text><text x="122" y="273" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">For its overall subject and structure.</text><rect x="30" y="304" width="840" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="359" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="76" y="367.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="122" y="342" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Label the text</text><text x="122" y="370" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">On a second reading, write a, b or c in the margin beside each detail. Points for</text><text x="122" y="393" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">one heading are often spread across paragraphs.</text><rect x="30" y="424" width="840" height="87" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="467.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="476.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="122" y="462" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Check for overlap</text><text x="122" y="490" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Each point goes under one heading only: the one it answers more directly.</text><rect x="30" y="521" width="840" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="576" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="584.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="122" y="559" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Count</text><text x="122" y="587" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Printed bullet lines = points expected. If the text gives more, choose the</text><text x="122" y="610" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">clearest.</text>
</svg>