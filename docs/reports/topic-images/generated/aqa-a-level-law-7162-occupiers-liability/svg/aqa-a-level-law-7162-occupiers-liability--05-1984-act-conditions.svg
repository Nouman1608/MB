<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 595" width="900" height="595" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="595" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The 1984 Act: does a duty to the trespasser arise?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">All three s1(3) conditions; replaced Herrington’s “common duty of humanity”</text>
<rect x="30" y="124" width="106" height="80" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="83" y="171" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">s1(3)(a)</text><rect x="150" y="124" width="420" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="164" y="158.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Aware of the danger, or reasonable grounds to</text><text x="164" y="179.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">believe it exists</text><rect x="586" y="124" width="284" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="599" y="158" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">✗ <tspan font-style="italic">Rhind</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Astbury</tspan> <tspan font-style="italic">Water</tspan> <tspan font-style="italic">Park</tspan></text><text x="599" y="178" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">(2004): hidden container unknown</text><rect x="30" y="214" width="106" height="82" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="83" y="262" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">s1(3)(b)</text><rect x="150" y="214" width="420" height="82" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="164" y="249.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Knows or has reasonable grounds to believe</text><text x="164" y="270.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">the trespasser is or may come into the vicinity</text><rect x="586" y="214" width="284" height="82" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="599" y="239" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">✗ <tspan font-style="italic">Donoghue</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Folkestone</tspan></text><text x="599" y="259" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Properties</tspan> (2003): midnight swim in</text><text x="599" y="279" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">winter</text><rect x="30" y="306" width="106" height="102" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="83" y="364" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">s1(3)(c)</text><rect x="150" y="306" width="420" height="102" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="164" y="351.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">A risk the occupier may reasonably be</text><text x="164" y="372.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">expected to protect against</text><rect x="586" y="306" width="284" height="102" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="599" y="331" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">✗ <tspan font-style="italic">Ratcliff</tspan> (1999); <tspan font-style="italic">Tomlinson</tspan> (2003):</text><text x="599" y="351" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">obvious risks adults choose. <tspan font-style="italic">Keown</tspan></text><text x="599" y="371" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">(2006): danger from what he chose</text><text x="599" y="391" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">to do</text><line x1="450" y1="414" x2="450" y2="432" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="448" width="272" height="115" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="474" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONTENT, s1(4)</text><text x="44" y="505" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Reasonable care to see the</text><text x="44" y="525" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">trespasser is not injured by the</text><text x="44" y="545" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">danger</text><rect x="314" y="448" width="272" height="115" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="328" y="474" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WARNINGS, s1(5)</text><text x="328" y="505" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Reasonable steps to warn or</text><text x="328" y="525" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">discourage can discharge it</text><rect x="598" y="448" width="272" height="115" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="612" y="474" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">DAMAGE, s1(8)</text><text x="612" y="505" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Personal injury only: <tspan font-weight="700" fill="#1e2a44">no</tspan> <tspan font-weight="700" fill="#1e2a44">property</tspan></text><text x="612" y="525" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">damage</tspan></text>
</svg>