<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 488" width="900" height="488" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="488" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The 1957 Act: who the duty is owed to shapes it</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">s2(2): the visitor reasonably safe, not the premises perfectly safe</text>
<rect x="30" y="124" width="840" height="175" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CHILDREN, s2(3)(a): BE PREPARED FOR THEM TO BE LESS CAREFUL</text><rect x="46" y="170" width="261.3333333333333" height="113" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="59" y="195" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">✓ LIABLE</text><text x="59" y="226" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Glasgow</tspan> <tspan font-style="italic">Corporation</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Taylor</tspan></text><text x="59" y="246" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">(1922): poisonous berries an</text><text x="59" y="266" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">“allurement” to a seven-year-old</text><rect x="319.3333333333333" y="170" width="261.3333333333333" height="113" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="332.3333333333333" y="195" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">✓ LIABLE</text><text x="332.3333333333333" y="226" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Jolley</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Sutton</tspan> <tspan font-style="italic">LBC</tspan> (2000): boys</text><text x="332.3333333333333" y="246" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">jacking up an abandoned boat:</text><text x="332.3333333333333" y="266" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">type of risk foreseeable</text><rect x="592.6666666666666" y="170" width="261.3333333333333" height="113" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="605.6666666666666" y="195" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">✗ NOT LIABLE</text><text x="605.6666666666666" y="226" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Phipps</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Rochester</tspan> (1955):</text><text x="605.6666666666666" y="246" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">five-year-old in a trench: parents</text><text x="605.6666666666666" y="266" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">expected to accompany</text><rect x="30" y="317" width="412" height="139" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="345" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SPECIALISTS, s2(3)(b)</text><text x="46" y="376" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Expected to guard against risks of their calling. <tspan font-style="italic">Roles</tspan></text><text x="46" y="396" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">v</tspan> <tspan font-style="italic">Nathan</tspan> (1963): chimney sweeps who ignored</text><text x="46" y="416" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">warnings. Not a rotten floorboard for an electrician</text><rect x="458" y="317" width="412" height="139" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="474" y="345" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">WARNINGS, s2(4)(a)</text><text x="474" y="376" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Must enable the visitor to be reasonably safe.</text><text x="474" y="396" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Obvious dangers need none: <tspan font-style="italic">Staples</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">West</tspan> <tspan font-style="italic">Dorset</tspan></text><text x="474" y="416" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">(1995), algae on a sea wall; <tspan font-style="italic">Darby</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">National</tspan> <tspan font-style="italic">Trust</tspan></text><text x="474" y="436" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">(2001), a pond</text>
</svg>