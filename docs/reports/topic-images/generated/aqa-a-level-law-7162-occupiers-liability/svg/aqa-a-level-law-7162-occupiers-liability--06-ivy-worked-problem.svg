<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked problem: Ivy’s flooded quarry</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Rob, 15, swims and is injured by a submerged trolley; his phone is ruined</text>
<rect x="30" y="124" width="152" height="48" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="106" y="154" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Occupier</text><rect x="196" y="124" width="590" height="48" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="207" y="152.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ivy controls the quarry (<tspan font-style="italic">Wheat</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Lacon</tspan>)</text><circle cx="828" cy="148" r="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="828" y="155" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><rect x="30" y="179" width="152" height="48" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="106" y="209" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Status</text><rect x="196" y="179" width="590" height="48" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="207" y="207.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No permission: trespasser, so the 1984 Act</text><circle cx="828" cy="203" r="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="828" y="210" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><rect x="30" y="234" width="152" height="48" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="106" y="264" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">s1(3)(a)</text><rect x="196" y="234" width="590" height="48" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="207" y="262.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">She knew of the dumped trolley</text><circle cx="828" cy="258" r="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="828" y="265" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><rect x="30" y="289" width="152" height="48" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="106" y="319" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">s1(3)(b)</text><rect x="196" y="289" width="590" height="48" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="207" y="317.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">She knew teenagers came to swim</text><circle cx="828" cy="313" r="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="828" y="320" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><rect x="30" y="344" width="152" height="60" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="106" y="380" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">s1(3)(c)</text><rect x="196" y="344" width="590" height="60" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="207" y="367.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A hidden hazard, not an obvious risk like deep water (contrast <tspan font-style="italic">Tomlinson</tspan>);</text><text x="207" y="388.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cheap to remove</text><circle cx="828" cy="374" r="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="828" y="381" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><rect x="30" y="411" width="152" height="48" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="106" y="441" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Breach</text><rect x="196" y="411" width="590" height="48" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="207" y="439.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">One small sign may not be enough warning under s1(5)</text><circle cx="828" cy="435" r="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="828" y="442" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><rect x="30" y="466" width="152" height="48" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="106" y="496" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Damage</text><rect x="196" y="466" width="590" height="48" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="207" y="494.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Injury recoverable; <tspan font-weight="700" fill="#1e2a44">the</tspan> <tspan font-weight="700" fill="#1e2a44">phone</tspan> <tspan font-weight="700" fill="#1e2a44">is</tspan> <tspan font-weight="700" fill="#1e2a44">not</tspan> (s1(8))</text><circle cx="828" cy="490" r="20" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="828" y="495" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">part</text><rect x="30" y="521" width="152" height="48" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="106" y="551" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Defence</text><rect x="196" y="521" width="590" height="48" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="207" y="549.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Contributory negligence may reduce damages</text><circle cx="828" cy="545" r="20" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="828" y="552" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle">−</text>
