<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 689" width="900" height="689" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="689" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Occupiers’ liability in five steps</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Work through them in the order you meet them in a problem</text>
<line x1="60" y1="144" x2="60" y2="463" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="150" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STEP 1</text><text x="118" y="176.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Who is the occupier?</text><text x="118" y="204.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Control of the premises (<tspan font-style="italic">Wheat</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Lacon</tspan>, 1966): the brewery <tspan font-weight="700" fill="#1e2a44">and</tspan> the manager were both</text><text x="118" y="225.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">occupiers</text><circle cx="60" cy="184" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="192.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="254" width="766" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="280" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STEP 2</text><text x="118" y="306.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Are these premises?</text><text x="118" y="334.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Land, buildings and any fixed or movable structure, including vessels, vehicles, aircraft (s1(3)(a)):</text><text x="118" y="355.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">ladders, scaffolding, lifts</text><circle cx="60" cy="314" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="322.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="384" width="766" height="99" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="118" y="410" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STEP 3</text><text x="118" y="436.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Visitor or trespasser, at the moment of injury?</text><text x="118" y="464.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Express or implied permission, or none</text><circle cx="60" cy="433.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="442.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><line x1="330" y1="491" x2="230" y2="521" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="570" y1="491" x2="670" y2="521" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="214" y="513" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end">visitor</text><text x="686" y="513" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">trespasser</text><rect x="30" y="533" width="410" height="124" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="561" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STEP 4: 1957 ACT</text><text x="46" y="587.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Common duty of care (s2(2))</text><text x="46" y="615.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Make the visitor reasonably safe. Personal injury</text><text x="46" y="636.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">and</tspan> property damage</text><rect x="460" y="533" width="410" height="124" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="476" y="561" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">STEP 5: 1984 ACT</text><text x="476" y="587.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Duty only if s1(3) is met</text><text x="476" y="615.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Take reasonable care against injury from the</text><text x="476" y="636.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">danger. Personal injury <tspan font-weight="700" fill="#1e2a44">only</tspan> (s1(8))</text>
</svg>