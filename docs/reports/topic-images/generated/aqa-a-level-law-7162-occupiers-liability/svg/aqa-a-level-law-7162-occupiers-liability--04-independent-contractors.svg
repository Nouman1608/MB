<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 485" width="900" height="485" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="485" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Faulty work by an independent contractor: s2(4)(b)</text>

<line x1="60" y1="120" x2="60" y2="253" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="100" width="766" height="51" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="120" y="130.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Was it reasonable to entrust the work to a contractor?</text><circle cx="60" cy="125.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="134.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="161" width="766" height="51" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="120" y="191.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Did the occupier take reasonable steps to check the contractor was competent?</text><circle cx="60" cy="186.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="195.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="222" width="766" height="51" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="120" y="252.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Where the work allows, did the occupier check it had been properly done?</text><circle cx="60" cy="247.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="256.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="450" y="295" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">All yes: occupier not liable for the contractor’s faulty work</text><rect x="30" y="315" width="272" height="138" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="341" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">HASELDINE v DAW (1941)</text><text x="44" y="367.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Not liable</text><text x="44" y="395" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Lift negligently repaired by</text><text x="44" y="415" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">specialists: occupier could not</text><text x="44" y="435" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">check technical work</text><rect x="314" y="315" width="272" height="138" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="328" y="341" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">WOODWARD (1945)</text><text x="328" y="367.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Liable</text><text x="328" y="395" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Cleaner left a step icy: checking</text><text x="328" y="415" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">needed no expertise</text><rect x="598" y="315" width="272" height="138" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="612" y="341" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">BOTTOMLEY (2003)</text><text x="612" y="367.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Liable</text><text x="612" y="395" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Amateur fireworks team hired</text><text x="612" y="415" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">without checking insurance or</text><text x="612" y="435" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">competence</text>
</svg>