<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 592" width="900" height="592" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="592" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">When does a visitor become a trespasser?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Permission is limited by area, time and purpose</text>
<rect x="30" y="124" width="411" height="122" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">IMPLIED PERMISSION</text><text x="46" y="183.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Lowery</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Walker</tspan> (1911): years of crossing a field</text><text x="46" y="204.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">as a short cut without objection made the</text><text x="46" y="225.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">claimant a licensee</text><rect x="459" y="124" width="411" height="122" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="475" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LEGAL RIGHT</text><text x="475" y="183.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Entering under a legal right, such as police with a</text><text x="475" y="204.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">warrant: treated as visitors (s2(6))</text><text x="30" y="294" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Exceed</text><text x="30" y="316" font-size="17" font-weight="400" fill="#b5602e" text-anchor="start">any limit:</text><rect x="200" y="264" width="157.33333333333334" height="48" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="278.6666666666667" y="292.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Area</text><rect x="371.33333333333337" y="264" width="157.33333333333334" height="48" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450.00000000000006" y="292.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Time</text><rect x="542.6666666666667" y="264" width="157.33333333333334" height="48" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="621.3333333333334" y="292.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Purpose</text><text x="870" y="294" font-size="19" font-weight="700" fill="#b5602e" text-anchor="end">trespasser</text><text x="870" y="316" font-size="17" font-weight="400" fill="#b5602e" text-anchor="end">from then</text><rect x="30" y="330" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="364.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The Calgarth (1927), Scrutton LJ</text><text x="50" y="394.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“When you invite a person into your house to use the staircase, you do not invite him to slide down</text><text x="50" y="416.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the banisters.”</text><rect x="30" y="459" width="840" height="101" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="46" y="487" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">TOMLINSON v CONGLETON BC (2003)</text><text x="46" y="518.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A lawful visitor to a park became a <tspan font-weight="700" fill="#1e2a44">trespasser</tspan> when he dived into a lake where swimming was prohibited:</text><text x="46" y="539.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">classify at the moment of injury.</text>
</svg>