<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="640" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three ways to put it in your own words</text>

<rect x="30" y="110" width="840" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="150" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="157.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="106" y="158" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Replace key words</text><rect x="56" y="176" width="260" height="44" rx="10" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="186" y="204" font-size="17" font-weight="400" fill="#b5602e" text-anchor="middle" font-style="italic">reluctant</text><line x1="322" y1="198" x2="362" y2="198" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="370" y="176" width="476" height="44" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="608" y="204" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle">unwilling</text><rect x="30" y="250" width="840" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="290" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="297.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="106" y="298" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Unpack the phrase</text><rect x="56" y="316" width="260" height="44" rx="10" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="186" y="344" font-size="17" font-weight="400" fill="#b5602e" text-anchor="middle" font-style="italic">her voice was brittle</text><line x1="322" y1="338" x2="362" y2="338" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="370" y="316" width="476" height="44" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="608" y="344" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle">she sounded tense, as if she might break down</text><rect x="30" y="390" width="840" height="124" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="430" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="437.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="106" y="438" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Change the grammar</text><rect x="56" y="456" width="260" height="44" rx="10" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="186" y="484" font-size="17" font-weight="400" fill="#b5602e" text-anchor="middle" font-style="italic">his hesitation</text><line x1="322" y1="478" x2="362" y2="478" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><rect x="370" y="456" width="476" height="44" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="608" y="484" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle">he paused because he was unsure</text><rect x="30" y="532" width="840" height="84" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="566" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Small, everyday words (the, was, house) do not need replacing.</text><text x="450" y="594" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">The key words of the phrase do.</text>
</svg>