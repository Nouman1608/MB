<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 682" width="900" height="682" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="682" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Read the wording, then answer</text>

<text x="450" y="104" font-size="18" font-weight="600" fill="#4a5568" text-anchor="middle">Command words, from finding to reasoning</text><rect x="30" y="174" width="270" height="110" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="212" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Identify</text><text x="50" y="246" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">pick out a word, phrase or</text><text x="50" y="268" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">detail</text><rect x="315" y="149" width="270" height="135" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="335" y="187" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Give</text><text x="335" y="221" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">state it from the text</text><rect x="600" y="124" width="270" height="160" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="620" y="162" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Explain</text><text x="620" y="196" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">go beyond stating to</text><text x="620" y="218" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reasons: say why and/or</text><text x="620" y="240" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">how, with evidence</text><text x="450" y="322" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">What each wording wants</text><rect x="30" y="342" width="310" height="54" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="185" y="375" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle" font-style="italic">“in your own words”</text><line x1="346" y1="369" x2="380" y2="369" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="388" y="342" width="482" height="54" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="404" y="375" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the meaning, re-expressed; copied key words earn nothing</text><rect x="30" y="408" width="310" height="54" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="185" y="441" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle" font-style="italic">“what does the writer mean by…”</text><line x1="346" y1="435" x2="380" y2="435" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="388" y="408" width="482" height="54" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="404" y="441" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">an explanation of a phrase in context</text><rect x="30" y="474" width="310" height="54" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="185" y="507" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle" font-style="italic">“what does … suggest about…”</text><line x1="346" y1="501" x2="380" y2="501" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="388" y="474" width="482" height="54" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="404" y="507" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">an inference (R2)</text><rect x="30" y="540" width="310" height="54" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="185" y="573" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle" font-style="italic">“give two…”</text><line x1="346" y1="567" x2="380" y2="567" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="388" y="540" width="482" height="54" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="404" y="573" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">exactly two separate points</text><rect x="30" y="606" width="310" height="54" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="185" y="639" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle" font-style="italic">“quote a word or phrase”</text><line x1="346" y1="633" x2="380" y2="633" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="388" y="606" width="482" height="54" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="404" y="639" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the exact words only, short and precise</text>
</svg>