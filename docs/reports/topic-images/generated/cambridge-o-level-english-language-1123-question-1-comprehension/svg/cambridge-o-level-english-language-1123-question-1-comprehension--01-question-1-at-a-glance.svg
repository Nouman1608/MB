<rect width="900" height="656" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Question 1 at a glance</text>

<rect x="30" y="110" width="300" height="300" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="180" y="148" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">Text A</text><line x1="60" y1="172" x2="300" y2="172" stroke="#8a6d0d" stroke-width="3" opacity="0.6"/><line x1="60" y1="190" x2="300" y2="190" stroke="#8a6d0d" stroke-width="3" opacity="0.6"/><line x1="60" y1="208" x2="300" y2="208" stroke="#8a6d0d" stroke-width="3" opacity="0.6"/><line x1="60" y1="226" x2="300" y2="226" stroke="#8a6d0d" stroke-width="3" opacity="0.6"/><line x1="60" y1="244" x2="300" y2="244" stroke="#8a6d0d" stroke-width="3" opacity="0.6"/><line x1="60" y1="262" x2="220" y2="262" stroke="#8a6d0d" stroke-width="3" opacity="0.6"/><text x="180" y="300" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">a narrative text</text><text x="180" y="324" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">about 900 words</text><text x="180" y="348" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">twentieth or</text><text x="180" y="372" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">twenty-first century</text><line x1="334" y1="260" x2="380" y2="260" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="384" y="110" width="486" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="408" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Section A: 25 marks on Text A</text><rect x="408" y="166" width="280.32" height="84" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="688.3199999999999" y="166" width="157.68" height="84" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="548.16" y="202" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Question 1</text><text x="548.16" y="228" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">16 marks</text><text x="767.16" y="202" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Question 2</text><text x="767.16" y="228" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">9 marks</text><text x="408" y="290" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Question 1 is a series of short-answer</text><text x="408" y="314" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">sub-questions; none asks for an essay.</text><text x="408" y="360" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Question 2: Use of Language,</text><text x="408" y="384" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">on the same text</text><text x="450" y="458" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Question 1 tests two reading objectives</text><rect x="30" y="480" width="410" height="150" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><circle cx="80" cy="530" r="28" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="80" y="537" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">R1</text><text x="122" y="524" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Explicit meanings</text><text x="122" y="552" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">on the surface</text><text x="52" y="600" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">what happens and why</text><rect x="460" y="480" width="410" height="150" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="510" cy="530" r="28" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="510" y="537" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">R2</text><text x="552" y="524" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Implicit meanings</text><text x="552" y="552" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">and attitudes</text><text x="482" y="592" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">what characters feel and want, how they</text><text x="482" y="615" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">see each other</text>
</svg>