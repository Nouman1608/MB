<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Let the marks set the number of points</text>

<rect x="30" y="110" width="840" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="96" cy="177" r="42" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="96" y="176" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="96" y="200" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">mark</text><rect x="166" y="150" width="80" height="54" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="206" y="183" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">point</text><text x="460" y="158" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">one point</text><text x="460" y="188" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a phrase or short sentence</text><rect x="30" y="260" width="840" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="96" cy="327" r="42" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="96" y="326" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="96" y="350" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">marks</text><rect x="166" y="300" width="80" height="54" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="206" y="333" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">point</text><rect x="258" y="300" width="80" height="54" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="298" y="333" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">point</text><text x="460" y="308" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">two separate points, or a point and its</text><text x="460" y="332" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">explanation</text><text x="460" y="362" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">make the two visible: “firstly…; secondly…”</text><rect x="30" y="410" width="840" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="96" cy="477" r="42" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="96" y="476" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="96" y="500" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">marks</text><rect x="166" y="450" width="80" height="54" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="206" y="483" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">point</text><rect x="258" y="450" width="80" height="54" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="298" y="483" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">point</text><rect x="350" y="450" width="80" height="54" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="390" y="483" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">point</text><text x="460" y="458" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">three points, or an inference with</text><text x="460" y="482" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">developed support</text><rect x="30" y="566" width="840" height="60" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="603" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">Writing more does not add marks; save the time for a three-mark inference.</text>
