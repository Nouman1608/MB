<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 758" width="900" height="758" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="758" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: from detail to answer</text>

<text x="200" y="130" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">Detail in the extract</text><text x="640" y="130" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Answer that earns the marks</text><rect x="30" y="148" width="340" height="118" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="182" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“The bus was late again”</text><line x1="376" y1="207" x2="404" y2="207" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="410" y="148" width="460" height="118" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="430" y="180" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">(a) Why late?</text><rect x="752" y="160" width="52" height="30" rx="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="778" y="180.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">[1]</text><rect x="812" y="160" width="46" height="30" rx="15" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="835" y="180.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">R1</text><text x="430" y="206" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">His bus was late.</text><text x="430" y="252" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start" font-style="italic">explicit point, one phrase</text><rect x="30" y="280" width="340" height="118" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="314" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“thirty heads would turn when</text><text x="50" y="336" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">the door opened”</text><line x1="376" y1="339" x2="404" y2="339" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="410" y="280" width="460" height="118" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="430" y="312" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">(b) Own words: what he fears</text><rect x="752" y="292" width="52" height="30" rx="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="778" y="312.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">[2]</text><text x="430" y="338" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">all his classmates will look at him; he will</text><text x="430" y="359" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">feel embarrassed, singled out</text><text x="430" y="384" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start" font-style="italic">explained, not copied + the feeling</text><rect x="30" y="412" width="340" height="118" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="446" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“He let go of the railing, then</text><text x="50" y="468" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">took hold of it again.”</text><line x1="376" y1="471" x2="404" y2="471" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="410" y="412" width="460" height="118" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="430" y="444" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">(c) What it suggests</text><rect x="752" y="424" width="52" height="30" rx="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="778" y="444.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">[2]</text><rect x="812" y="424" width="46" height="30" rx="15" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="835" y="444.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">R2</text><text x="430" y="470" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">hesitant and torn: starts to move, then holds</text><text x="430" y="491" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">back</text><text x="430" y="516" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start" font-style="italic">state of mind linked to the action</text><rect x="30" y="544" width="340" height="118" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="578" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“the permission slip his mother</text><text x="50" y="600" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">had not signed seemed to grow</text><text x="50" y="622" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">heavier”</text><line x1="376" y1="603" x2="404" y2="603" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="410" y="544" width="460" height="118" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="430" y="576" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">(d) Two other reasons</text><rect x="752" y="556" width="52" height="30" rx="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="778" y="576.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">[2]</text><text x="430" y="602" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">expects trouble over the unsigned slip; dreads</text><text x="430" y="623" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the whole class’s attention</text><text x="430" y="648" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="start" font-style="italic">two points, from different parts</text><rect x="30" y="676" width="840" height="58" rx="12" fill="#f6e3d6" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="712" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">“He is nervous” alone, with no link to the action, earns one mark at most for (c).</text>
</svg>