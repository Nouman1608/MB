<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 644" width="900" height="644" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="644" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Explicit and implicit: two different jobs</text>

<rect x="30" y="110" width="840" height="210" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="320" width="840" height="300" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><line x1="30" y1="320" x2="870" y2="320" stroke="#1e2a44" stroke-width="3" stroke-dasharray="10 7"/><text x="850" y="346" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">the text’s surface</text><circle cx="76" cy="158" r="26" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="76" y="165" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">R1</text><text x="116" y="152" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Explicit: stated in the text</text><text x="116" y="176" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">find it and give it accurately</text><rect x="56" y="200" width="788" height="52" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="233" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">“What two things did Amira notice when she entered the kitchen?”</text><text x="56" y="292" font-size="17" font-weight="600" fill="#8a6d0d" text-anchor="start">Rewards precise location and economy.</text><circle cx="76" cy="368" r="26" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="76" y="375" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">R2</text><text x="116" y="362" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Implicit: the text gives clues; you draw the conclusion</text><text x="116" y="386" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“What does Amira’s reaction suggest about her relationship with her uncle?”</text><rect x="56" y="414" width="180" height="44" rx="22" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="146" y="441.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">what she does</text><path d="M146,462 L380,506" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><rect x="256" y="414" width="180" height="44" rx="22" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="346" y="441.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">what she avoids</text><path d="M346,462 L500,506" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><rect x="456" y="414" width="290" height="44" rx="22" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="601" y="441.76" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">how the narrator describes her</text><path d="M601,462 L620,506" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahT)"/><rect x="300" y="512" width="400" height="54" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="500" y="545" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">inference: she is afraid of him</text><text x="56" y="545" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">No sentence says it:</text><text x="56" y="598" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">The mark is for the conclusion; the detail makes it credible.</text>
</svg>