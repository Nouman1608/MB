<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 504" width="900" height="504" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="504" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A ladder of offences</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Maximum sentences mark seriousness</text>
<rect x="150" y="124" width="460" height="60" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="172" y="162" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Murder</text><text x="590" y="162" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="end">mandatory life</text><rect x="150" y="196" width="460" height="60" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="172" y="234" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">s18 · Robbery</text><text x="590" y="234" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="end">life</text><rect x="150" y="268" width="460" height="60" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="172" y="306" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Theft</text><text x="590" y="306" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="end">7 years</text><rect x="150" y="340" width="460" height="60" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="172" y="378" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">s47 · s20</text><text x="590" y="378" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="end">5 years</text><rect x="150" y="412" width="460" height="60" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="172" y="450" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Assault · Battery</text><text x="590" y="450" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="end">6 months (summary)</text><line x1="100" y1="472" x2="100" y2="128" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text transform="rotate(-90 86 298)" x="86" y="298" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">more serious</text><rect x="640" y="124" width="230" height="142" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="656" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Move down</text><text x="656" y="182.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">If the mens rea for the</text><text x="656" y="203.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">higher offence cannot be</text><text x="656" y="224.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">proved: s18 to s20,</text><text x="656" y="245.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">murder to manslaughter</text><rect x="640" y="314" width="230" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="656" y="344.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Attempt</text><text x="656" y="372.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Same maximum as the</text><text x="656" y="393.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">full offence (s4(1) CAA</text><text x="656" y="414.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1981)</text>
</svg>