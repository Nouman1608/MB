<rect width="900" height="677" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A method for problem questions</text>

<line x1="60" y1="120" x2="60" y2="625" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="100" width="766" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="126.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Identify</text><text x="116" y="154.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The most serious offence the facts support, and the victim</text><circle cx="60" cy="135.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="144.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="179" width="766" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="205.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">State the rule</text><text x="116" y="233.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">For each element, with its source</text><circle cx="60" cy="214.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="223.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="258" width="766" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="284.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Give authority</text><text x="116" y="312.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">For each element in dispute</text><circle cx="60" cy="293.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="302.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="337" width="766" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="363.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Apply</text><text x="116" y="391.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Use the facts’ own details</text><circle cx="60" cy="372.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="381.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="416" width="766" height="71" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="116" y="442.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Consider alternatives</text><text x="116" y="470.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Where an element is doubtful, move down the ladder</text><circle cx="60" cy="451.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="460.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="104" y="495" width="766" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="521.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Consider defences</text><text x="116" y="549.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Stating who must prove what</text><circle cx="60" cy="530.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="539.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><rect x="104" y="574" width="766" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="116" y="600.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Conclude</text><text x="116" y="628.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">On likely liability: which offence, and why the alternatives fail</text><circle cx="60" cy="609.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="618.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">7</text>
</svg>