<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 506" width="900" height="506" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="506" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: Ed punches Fran</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">He intends to hurt her but not seriously; she fractures her skull</text>
<rect x="30" y="124" width="560" height="132" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="154" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">START AT THE TOP: s18</text><text x="48" y="180.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Fails on mens rea</text><text x="48" y="208.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="208.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fracture is really serious harm (<tspan font-style="italic">DPP</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Smith</tspan>, 1961)</text><text x="48" y="233.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="233.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">s18 needs intention to cause GBH; Ed meant only to hurt</text><rect x="30" y="300" width="560" height="174" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="330" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MOVE DOWN: s20</text><text x="48" y="356.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Satisfied</text><text x="48" y="384.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="384.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Inflicting GBH (<tspan font-style="italic">Burstow</tspan>: no direct force needed, though here there</text><text x="63.2" y="405.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">was)</text><text x="48" y="430.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="430.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mens rea: foresee some harm (<tspan font-style="italic">Mowatt</tspan>, 1968). Ed intended to hurt,</text><text x="63.2" y="451.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">so he foresaw some harm</text><rect x="620" y="124" width="250" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="638" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DEFENCES</text><text x="638" y="185.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">None on the facts</text><rect x="620" y="300" width="250" height="174" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="638" y="353" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONCLUSION</text><text x="638" y="379.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Likely guilty under s20</text><text x="638" y="407.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Basic intent; maximum five</text><text x="638" y="428.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">years</text><line x1="310" y1="260" x2="310" y2="296" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="324" y="284" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">mens rea for s18 not proved</text><line x1="594" y1="387" x2="616" y2="387" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/>
</svg>