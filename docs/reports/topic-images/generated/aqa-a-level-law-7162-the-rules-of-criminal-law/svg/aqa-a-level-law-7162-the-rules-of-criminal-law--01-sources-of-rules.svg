<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 675" width="900" height="675" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="675" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Common law or statute?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The source decides how you state the rule</text>
<rect x="30" y="124" width="412" height="253" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COMMON LAW: DEFINE WITH CASES</text><text x="48" y="180.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">No statutory definition</text><text x="48" y="208.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="208.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Murder (<tspan font-style="italic">Vickers</tspan>, 1957)</text><text x="48" y="234.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="234.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Unlawful act manslaughter (<tspan font-style="italic">Church</tspan>, 1966)</text><text x="48" y="260.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="260.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Gross negligence manslaughter (<tspan font-style="italic">Adomako</tspan>,</text><text x="63.2" y="281.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1995)</text><text x="48" y="307.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="307.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Assault and battery (charged under s39 CJA</text><text x="63.2" y="328.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1988)</text><text x="48" y="354.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="354.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Insanity, automatism, intoxication, duress</text><rect x="458" y="124" width="412" height="253" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="476" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STATUTE: QUOTE THE WORDING</text><text x="476" y="180.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Then cases on its meaning</text><text x="476" y="208.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="208.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Loss of control: Coroners and Justice Act 2009</text><text x="476" y="234.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="234.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Diminished responsibility: Homicide Act 1957</text><text x="491.2" y="255.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">as amended</text><text x="476" y="281.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="281.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">s47, s20, s18: OAPA 1861</text><text x="476" y="307.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="307.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Theft and robbery: Theft Act 1968, ss1–8</text><text x="476" y="333.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="333.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Attempt: Criminal Attempts Act 1981, s1</text><rect x="30" y="399" width="840" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="427" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BOTH</text><text x="46" y="458.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Self-defence and prevention of crime: common law, s3 Criminal Law Act 1967 and s76 Criminal Justice</text><text x="46" y="479.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and Immigration Act 2008</text><rect x="30" y="522" width="412" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="552.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Judges interpret statutes</text><text x="46" y="580.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Ireland;</tspan> <tspan font-style="italic">Burstow</tspan> (1997): “inflict” needs no direct</text><text x="46" y="601.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">force. <tspan font-style="italic">Gomez</tspan> (1993): appropriation with consent.</text><rect x="458" y="522" width="412" height="121" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="552.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">No new offences</text><text x="474" y="580.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Courts no longer create offences (<tspan font-style="italic">Knuller</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">DPP</tspan>,</text><text x="474" y="601.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1973). The 1989 Draft Criminal Code was never</text><text x="474" y="622.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">enacted.</text>
</svg>