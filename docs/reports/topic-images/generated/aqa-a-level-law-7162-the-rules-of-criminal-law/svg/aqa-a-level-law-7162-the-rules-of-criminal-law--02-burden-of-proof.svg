<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 638" width="900" height="638" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="638" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who has to prove what?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Woolmington v DPP (1935): the “golden thread”</text>
<rect x="30" y="124" width="840" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">LEGAL BURDEN</text><text x="450" y="180.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Prosecution proves every element of the offence beyond reasonable doubt</text><rect x="30" y="226" width="412" height="102" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="256" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EVIDENTIAL BURDEN ONLY</text><text x="48" y="282.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Self-defence, duress, automatism,</text><text x="48" y="305.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">intoxication, loss of control</text><rect x="458" y="226" width="412" height="102" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="476" y="256" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">REVERSE BURDEN</text><text x="476" y="282.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Insanity; diminished responsibility (s2(2)</text><text x="476" y="305.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Homicide Act 1957)</text><rect x="30" y="348" width="189" height="127" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="124.5" y="372.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Defendant raises</text><text x="124.5" y="392.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">evidence</text><text x="124.5" y="419" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">For loss of control,</text><text x="124.5" y="439" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">sufficient evidence</text><text x="124.5" y="459" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">(s54(5)–(6))</text><line x1="225" y1="411.5" x2="247" y2="411.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="253" y="348" width="189" height="127" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="347.5" y="382.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Prosecution</text><text x="347.5" y="402.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">disproves</text><text x="347.5" y="429" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Beyond reasonable</text><text x="347.5" y="449" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">doubt</text><rect x="458" y="348" width="412" height="127" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="664" y="402.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Defendant proves it</text><text x="664" y="429" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">On the balance of probabilities</text><line x1="236" y1="330" x2="236" y2="346" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="664" y1="330" x2="664" y2="346" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="497" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="531.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Write precise conclusions</text><text x="450" y="560.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">“The jury must acquit unless the prosecution proves that Kim did not honestly believe force was</text><text x="450" y="581.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">necessary.”</text>
</svg>