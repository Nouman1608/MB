<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Judge decides law; jury decides fact</text>

<rect x="30" y="100" width="412" height="155" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">JUDGE: QUESTIONS OF LAW</text><text x="48" y="161.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="161.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">What an offence means</text><text x="48" y="186.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="186.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Is there enough evidence for a defence to go to</text><text x="63.2" y="207.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the jury?</text><text x="48" y="232.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="232.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">How the jury must be directed</text><rect x="458" y="100" width="412" height="155" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="476" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">JURY: QUESTIONS OF FACT</text><text x="476" y="161.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="491.2" y="161.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Applies the judge’s directions to the facts</text><clipPath id="tc277"><rect x="30" y="277" width="840" height="294" rx="14"/></clipPath><g clip-path="url(#tc277)"><rect x="30" y="277" width="178.1818181818182" height="48" fill="#b5d3cf"/><text x="44" y="304.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Rule</text><rect x="208.1818181818182" y="277" width="330.90909090909093" height="48" fill="#f2e7b8"/><text x="222.1818181818182" y="304.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Judge</text><rect x="539.0909090909091" y="277" width="330.90909090909093" height="48" fill="#b5d3cf"/><text x="553.0909090909091" y="304.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Jury</text><rect x="30" y="325" width="178.1818181818182" height="89" fill="#dce9e7"/><text x="44" y="351.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Attempt: s4(3)</text><text x="44" y="372.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">CAA 1981</text><rect x="208.1818181818182" y="325" width="330.90909090909093" height="89" fill="#ffffff"/><text x="222.1818181818182" y="351.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Is there evidence on which an act could</text><text x="222.1818181818182" y="372.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">be found more than merely</text><text x="222.1818181818182" y="393.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">preparatory?</text><rect x="539.0909090909091" y="325" width="330.90909090909093" height="89" fill="#ffffff"/><text x="553.0909090909091" y="351.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Was it more than merely preparatory?</text><line x1="30" y1="414" x2="870" y2="414" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="414" width="178.1818181818182" height="68" fill="#dce9e7"/><text x="44" y="440.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Theft: dishonesty</text><rect x="208.1818181818182" y="414" width="330.90909090909093" height="68" fill="#f8faf9"/><text x="222.1818181818182" y="440.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Directs on the <tspan font-style="italic">Ivey</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Genting</tspan> <tspan font-style="italic">Casinos</tspan></text><text x="222.1818181818182" y="461.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(2017) test</text><rect x="539.0909090909091" y="414" width="330.90909090909093" height="68" fill="#f8faf9"/><text x="553.0909090909091" y="440.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Applies the test to decide dishonesty</text><line x1="30" y1="482" x2="870" y2="482" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="482" width="178.1818181818182" height="89" fill="#dce9e7"/><text x="44" y="508.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Murder: oblique</text><text x="44" y="529.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">intent</text><rect x="208.1818181818182" y="482" width="330.90909090909093" height="89" fill="#ffffff"/><text x="222.1818181818182" y="508.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Gives the <tspan font-style="italic">Woollin</tspan> (1998) direction</text><rect x="539.0909090909091" y="482" width="330.90909090909093" height="89" fill="#ffffff"/><text x="553.0909090909091" y="508.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Did D appreciate death or serious harm</text><text x="553.0909090909091" y="529.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">was virtually certain? “Entitled to find”</text><text x="553.0909090909091" y="550.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">intention, not obliged to</text></g><line x1="208.1818181818182" y1="277" x2="208.1818181818182" y2="571" stroke="#c9d6d4" stroke-width="1.5"/><line x1="539.0909090909091" y1="277" x2="539.0909090909091" y2="571" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="277" width="840" height="294" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
