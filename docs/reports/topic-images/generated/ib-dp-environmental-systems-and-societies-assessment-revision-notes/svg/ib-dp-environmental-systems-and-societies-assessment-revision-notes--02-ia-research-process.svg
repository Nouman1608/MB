<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="640" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The individual investigation</text>

<rect x="30" y="120" width="540" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="162" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="169.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="115" y="155" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Research question</text><text x="115" y="182" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Formulate a focused question suited to the issue</text><line x1="76" y1="205" x2="76" y2="217" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="218" width="540" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="260" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="267.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="115" y="253" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Methodology</text><text x="115" y="280" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Justify and apply a method giving reliable data</text><line x1="76" y1="303" x2="76" y2="315" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="316" width="540" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="358" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="365.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="115" y="351" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Data</text><text x="115" y="378" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Process and present it (basic statistics if relevant)</text><line x1="76" y1="401" x2="76" y2="413" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="414" width="540" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="456" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="463.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="115" y="449" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Conclusions</text><text x="115" y="476" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Reach evidence-based conclusions from the data</text><line x1="76" y1="499" x2="76" y2="511" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="512" width="540" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="76" cy="554" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="76" y="561.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="115" y="547" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluation</text><text x="115" y="574" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Strengths, limitations and specific, feasible improvements</text><rect x="590" y="120" width="280" height="96" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="730" y="160" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Up to 3,000 words</text><text x="730" y="186" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">a written report</text><rect x="590" y="232" width="280" height="96" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="730" y="272" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">About 10 hours</text><text x="730" y="298" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">of teaching time</text><rect x="590" y="344" width="280" height="96" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="730" y="384" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Open-ended</text><text x="730" y="410" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">your own research question;</text><text x="730" y="428" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">fieldwork common, not required</text><rect x="590" y="456" width="280" height="152" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="730" y="490" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Integrate both strands</text><text x="730" y="518" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">link a measured</text><text x="730" y="537" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">environmental change to</text><text x="730" y="556" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">its social, economic or</text><text x="730" y="575" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">policy implications</text>
</svg>