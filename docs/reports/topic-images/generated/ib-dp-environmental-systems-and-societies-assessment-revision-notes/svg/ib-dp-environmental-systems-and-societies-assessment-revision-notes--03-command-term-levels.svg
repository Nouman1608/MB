<rect width="900" height="725" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Command terms: three levels of demand</text>

<rect x="30" y="400" width="270" height="160" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="165" y="438" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Lower</text><text x="165" y="474" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="middle">state</text><text x="165" y="502" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="middle">identify</text><text x="165" y="530" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="middle">outline</text><rect x="315" y="280" width="270" height="280" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="450" y="318" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Middle</text><text x="450" y="354" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="middle">explain</text><text x="450" y="382" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="middle">compare</text><text x="450" y="410" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="middle">suggest</text><rect x="600" y="160" width="270" height="400" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="735" y="198" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Top</text><text x="735" y="234" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="middle">evaluate</text><text x="735" y="262" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="middle">discuss</text><text x="735" y="290" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="middle">to what extent</text><line x1="60" y1="230" x2="250" y2="230" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><text x="60" y="210" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">demand rises</text><text x="735" y="390" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">a reasoned</text><text x="735" y="413" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">judgement weighing</text><text x="735" y="436" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">perspectives or</text><text x="735" y="459" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">evidence</text><rect x="30" y="585" width="840" height="120" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="622" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">ESS combines scientific and societal content, so at the top:</text><text x="55" y="652" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">weigh both strands, e.g. a policy's scientific effectiveness</text><text x="55" y="678" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">and its social/economic feasibility.</text>
</svg>