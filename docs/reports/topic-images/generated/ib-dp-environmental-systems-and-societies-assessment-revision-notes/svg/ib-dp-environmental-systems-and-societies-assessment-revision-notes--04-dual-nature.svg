<rect width="900" height="730" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why both strands appear in every paper</text>

<circle cx="340" cy="380" r="200" fill="#b5d3cf" opacity="0.55" stroke="#2e6b62" stroke-width="3"/><circle cx="560" cy="380" r="200" fill="#f2e7b8" opacity="0.75" stroke="#8a6d0d" stroke-width="3"/><circle cx="340" cy="380" r="200" fill="none" stroke="#2e6b62" stroke-width="3"/><text x="240" y="158" font-size="24" font-weight="700" fill="#2e6b62" text-anchor="middle">Sciences</text><text x="245" y="330" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">measurement</text><text x="245" y="356" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">data analysis</text><text x="245" y="382" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">experimental</text><text x="245" y="408" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">design</text><text x="660" y="158" font-size="24" font-weight="700" fill="#8a6d0d" text-anchor="middle">Individuals and societies</text><text x="655" y="330" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">policy</text><text x="655" y="356" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">ethics</text><text x="655" y="382" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">economics</text><text x="655" y="408" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle">human systems</text><text x="450" y="320" font-size="34" font-weight="700" fill="#1e2a44" text-anchor="middle">ESS</text><text x="450" y="360" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Paper 1</text><text x="450" y="386" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Paper 2</text><text x="450" y="412" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">IA</text><text x="450" y="470" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">side by side</text><rect x="30" y="600" width="840" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="638" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">ESS can count as a sciences subject, an individuals-and-societies</text><text x="55" y="664" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">subject, or both, which frees up an extra subject choice.</text><text x="55" y="692" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">So every paper is built to be defensible as either.</text>
</svg>