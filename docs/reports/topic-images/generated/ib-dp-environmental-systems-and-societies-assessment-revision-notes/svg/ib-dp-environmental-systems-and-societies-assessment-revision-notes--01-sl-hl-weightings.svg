<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">ESS assessment: SL vs HL</text>

<rect x="30" y="110" width="840" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="192" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="start">SL</text><rect x="180" y="140" width="162.5" height="84" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="261.25" y="172" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Paper 1</text><text x="261.25" y="198" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">25%</text><text x="261.25" y="252" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">1 hour</text><rect x="342.5" y="140" width="325" height="84" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="505" y="172" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Paper 2</text><text x="505" y="198" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">50%</text><text x="505" y="252" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">2 hours</text><rect x="667.5" y="140" width="162.5" height="84" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="748.75" y="172" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">IA</text><text x="748.75" y="198" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">25%</text><text x="748.75" y="252" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">10 teaching h</text><path d="M180,272 l0,12 l487.5,0 l0,-12" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="423.75" y="308" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">External (written papers) 75% · 3 h</text><path d="M671.5,272 l0,12 l158.5,0 l0,-12" fill="none" stroke="#8a6d0d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="748.75" y="308" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">Internal 25%</text><text x="60" y="412" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="start">HL</text><rect x="180" y="360" width="195" height="84" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="277.5" y="392" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Paper 1</text><text x="277.5" y="418" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">30%</text><text x="277.5" y="472" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">2 hours</text><rect x="375" y="360" width="325" height="84" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="537.5" y="392" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Paper 2</text><text x="537.5" y="418" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">50%</text><text x="537.5" y="472" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">2 h 30 min</text><rect x="700" y="360" width="130" height="84" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="765" y="392" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">IA</text><text x="765" y="418" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">20%</text><text x="765" y="472" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">10 teaching h</text><path d="M180,492 l0,12 l520,0 l0,-12" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="440" y="528" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">External (written papers) 80% · 4 h 30 min</text><path d="M704,492 l0,12 l126,0 l0,-12" fill="none" stroke="#8a6d0d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="765" y="528" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">Internal 20%</text><rect x="30" y="600" width="840" height="120" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="638" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">HL: Paper 1 is longer (2 h) and worth more (30%), so the IA drops to 20%.</text><text x="55" y="668" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The investigation and its criteria are the same at both levels:</text><text x="55" y="694" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">a written report of up to 3,000 words.</text>
