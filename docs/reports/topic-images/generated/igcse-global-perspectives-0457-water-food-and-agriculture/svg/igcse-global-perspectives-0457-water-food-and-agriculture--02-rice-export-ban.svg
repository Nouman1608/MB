<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 707" width="900" height="707" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="707" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One export ban, two perspectives</text>

<rect x="160" y="104" width="580" height="86" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="137" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">JULY 2023</text><text x="450" y="164" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">India bans exports of non-basmati white rice</text><line x1="450" y1="196" x2="240" y2="230" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="196" x2="660" y2="230" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="248" width="408" height="135" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="281" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXPORTING GOVERNMENT</text><text x="50" y="306.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Keeps rice affordable at home</text><text x="50" y="334.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Protects domestic consumers.</text><rect x="462" y="248" width="408" height="135" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="482" y="281" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">FAMILY IN A RICE-IMPORTING CITY</text><text x="482" y="306.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Supply falls; a daily staple costs</text><text x="482" y="330.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">more</text><text x="482" y="358.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Hardship is shifted abroad.</text><rect x="30" y="401" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="434.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Both want stable prices. The disagreement comes from who carries the cost, not from a</text><text x="50" y="456.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">dispute about facts.</text><text x="450" y="519" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Other perspectives in this topic</text><rect x="30" y="545" width="201" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="571.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Smallholder</text><text x="44" y="592.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">farmers</text><text x="44" y="619" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">risk losing land,</text><text x="44" y="639" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">water or a fair price</text><rect x="243" y="545" width="201" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="257" y="571.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Large farms and</text><text x="257" y="592.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">food firms</text><text x="257" y="619" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">efficiency,</text><text x="257" y="639" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">investment, feeding</text><text x="257" y="659" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">cities cheaply</text><rect x="456" y="545" width="201" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="470" y="571.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Environmental</text><text x="470" y="592.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">groups</text><text x="470" y="619" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">falling groundwater,</text><text x="470" y="639" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">lost forests,</text><text x="470" y="659" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">fertiliser pollution</text><rect x="669" y="545" width="201" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="683" y="571.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">La Via Campesina</text><text x="683" y="598" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">“food sovereignty”:</text><text x="683" y="618" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">communities decide how</text><text x="683" y="638" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">food is produced</text>
</svg>