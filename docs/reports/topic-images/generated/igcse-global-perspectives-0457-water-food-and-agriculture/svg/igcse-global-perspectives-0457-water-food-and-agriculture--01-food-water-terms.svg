<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 656" width="900" height="656" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="656" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Food security and two kinds of water scarcity</text>

<rect x="30" y="104" width="840" height="110" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FOOD SECURITY (WORLD FOOD SUMMIT, 1996)</text><text x="50" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">All people, at all times, have physical and economic access to</text><text x="50" y="188.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">sufficient, safe and nutritious food for an active and healthy life</text><rect x="30" y="232" width="410" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="270" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Physical scarcity</text><text x="54" y="296" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Not enough water to meet demand, because it</text><text x="54" y="317" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">is not there.</text><path d="M85,457 L85,377 M385,457 L385,377" stroke="#1e2a44" stroke-width="3"/><path d="M85,457 L385,457" stroke="#1e2a44" stroke-width="3"/><rect x="87" y="445" width="296" height="12" fill="#b5d3cf"/><text x="235" y="427" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">the water is not there</text><rect x="460" y="232" width="410" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="484" y="270" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Economic scarcity</text><text x="484" y="296" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The water exists, but cost or access keep</text><text x="484" y="317" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">it from people.</text><path d="M515,457 L515,377 M815,457 L815,377" stroke="#1e2a44" stroke-width="3"/><rect x="517" y="387" width="296" height="70" fill="#b5d3cf"/><path d="M515,457 L815,457" stroke="#1e2a44" stroke-width="3"/><text x="665" y="427" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">water is there…</text><text x="665" y="373" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">but people cannot afford or reach it</text><rect x="30" y="500" width="268" height="126" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="544" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">SUBSISTENCE FARMING</text><text x="50" y="568.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Food mainly for your</text><text x="50" y="590.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">own family</text><rect x="316" y="500" width="268" height="126" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="336" y="544" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COMMERCIAL FARMING</text><text x="336" y="568.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Crops or animals grown</text><text x="336" y="590.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">to sell</text><rect x="602" y="500" width="268" height="126" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="622" y="533" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">VIRTUAL WATER (TONY ALLAN)</text><text x="622" y="557.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Water used to produce a</text><text x="622" y="579.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">product, such as</text><text x="622" y="601.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">imported wheat</text>
</svg>