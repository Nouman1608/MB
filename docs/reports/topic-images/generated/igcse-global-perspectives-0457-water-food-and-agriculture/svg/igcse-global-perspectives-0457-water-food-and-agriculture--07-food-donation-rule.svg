<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 585" width="900" height="585" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="585" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Food waste actions: will the rule actually work?</text>

<rect x="30" y="104" width="268" height="192" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">GLOBAL</text><text x="50" y="161.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">SDG target 12.3</text><text x="50" y="188" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Halve food waste per person</text><text x="50" y="208" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">at retail and consumer level</text><text x="50" y="228" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">by 2030.</text><rect x="316" y="104" width="268" height="192" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="336" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NATIONAL: FRANCE, 2016</text><text x="336" y="161.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Large supermarkets must</text><text x="336" y="183.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">offer edible unsold</text><text x="336" y="205.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">food to charities</text><text x="336" y="232" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Depends on charities having</text><text x="336" y="252" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">storage, transport and</text><text x="336" y="272" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">volunteers.</text><rect x="602" y="104" width="268" height="192" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="622" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">LOCAL</text><text x="622" y="161.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Canteen waste schemes,</text><text x="622" y="183.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">community water</text><text x="622" y="205.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">storage, school gardens</text><text x="450" y="338" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Fictional city of Ostley: restaurants must donate unsold food</text><rect x="30" y="360" width="395" height="135" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="393" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">THE BARRIER</text><text x="50" y="418.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Food is ready late at night; the</text><text x="50" y="442.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">food bank opens three days a week</text><text x="50" y="470.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Looks good on paper, achieves little.</text><line x1="431" y1="427.5" x2="469" y2="427.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="475" y="360" width="395" height="135" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="495" y="393" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRONGER OPTION</text><text x="495" y="418.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Rule plus funding for refrigerated</text><text x="495" y="442.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">storage at the food bank</text><text x="495" y="470.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Costs more, but removes the main barrier.</text><rect x="139.17500000000007" y="513" width="161.075" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="219.71250000000006" y="540.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Effectiveness</text><rect x="312.25000000000006" y="513" width="141.52499999999998" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="383.01250000000005" y="540.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Feasibility</text><rect x="465.77500000000003" y="513" width="112.19999999999999" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="521.875" y="540.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Fairness</text><rect x="589.975" y="513" width="170.84999999999997" height="42" rx="21" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="675.4" y="540.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Sustainability</text>
</svg>