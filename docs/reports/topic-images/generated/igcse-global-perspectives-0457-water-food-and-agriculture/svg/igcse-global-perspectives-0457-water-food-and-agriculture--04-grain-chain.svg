<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 698" width="900" height="698" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="698" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From a war to a distant market</text>

<rect x="30" y="104" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">FEBRUARY 2022</text><text x="50" y="162.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Russia’s full-scale invasion: Ukraine’s Black Sea ports blocked</text><text x="50" y="190.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Ukraine is a major grain exporter.</text><line x1="450" y1="220" x2="450" y2="246" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="251" width="840" height="108" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="284" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">JULY 2022</text><text x="50" y="309.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Black Sea Grain Initiative, brokered by the UN and Turkey, lets grain ships</text><text x="50" y="333.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">sail</text><line x1="450" y1="364" x2="450" y2="390" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="395" width="840" height="84" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="428" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">JULY 2023</text><text x="50" y="453.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Russia withdraws from the initiative</text><text x="450" y="517" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">The general consequence chain</text><rect x="30" y="543" width="180" height="125" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="120" y="599.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">War or drought</text><text x="120" y="620.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">cuts a harvest</text><line x1="216" y1="605.5" x2="244" y2="605.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="250" y="543" width="180" height="125" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="340" y="599.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Less grain</text><text x="340" y="620.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">exported</text><line x1="436" y1="605.5" x2="464" y2="605.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="470" y="543" width="180" height="125" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="560" y="599.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">World prices</text><text x="560" y="620.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">rise</text><line x1="656" y1="605.5" x2="684" y2="605.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="690" y="543" width="180" height="125" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="780" y="567.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Poorer families</text><text x="780" y="588.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">in importing</text><text x="780" y="609.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">countries eat</text><text x="780" y="630.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">less or less</text><text x="780" y="651.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">well</text>
</svg>