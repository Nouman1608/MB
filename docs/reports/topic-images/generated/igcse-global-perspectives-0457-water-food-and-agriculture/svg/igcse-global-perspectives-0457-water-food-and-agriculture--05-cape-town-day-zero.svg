<rect width="900" height="571" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Cape Town 2018: avoiding “Day Zero”</text>

<circle cx="205" cy="270.5" r="165" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><circle cx="205" cy="270.5" r="110" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="205" cy="270.5" r="55" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="205" y="276.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Home</text><text x="205" y="359" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">City</text><text x="205" y="414" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Nation</text><path d="M231.4,271.5 C325.7,271.5 325.7,155.5 416,155.5" fill="none" stroke="#1e2a44" stroke-width="2" stroke-dasharray="5 5"/><circle cx="231.4" cy="271.5" r="4" fill="#1e2a44"/><path d="M231.4,354 C325.7,354 325.7,270.5 416,270.5" fill="none" stroke="#1e2a44" stroke-width="2" stroke-dasharray="5 5"/><circle cx="231.4" cy="354" r="4" fill="#1e2a44"/><path d="M240.6,409 C330.3,409 330.3,385.5 416,385.5" fill="none" stroke="#1e2a44" stroke-width="2" stroke-dasharray="5 5"/><circle cx="240.6" cy="409" r="4" fill="#1e2a44"/><rect x="420" y="104" width="450" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="436" y="135.2" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Household</text><text x="436" y="164.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">From February 2018, residents asked to use no</text><text x="436" y="186.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">more than 50 litres per person per day.</text><rect x="420" y="219" width="450" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="436" y="250.2" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">City</text><text x="436" y="279.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Warned of “Day Zero”, when most taps could be</text><text x="436" y="301.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">turned off.</text><rect x="420" y="334" width="450" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="436" y="365.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Nation</text><text x="436" y="394.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A multi-year drought in South Africa: low</text><text x="436" y="416.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">rainfall plus rising demand.</text><rect x="30" y="455" width="249.33333333333334" height="86" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="154.66666666666669" y="502.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Water use fell</text><line x1="285.33333333333337" y1="498" x2="319.33333333333337" y2="498" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="455" width="249.33333333333334" height="86" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450.00000000000006" y="502.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Rain returned</text><line x1="580.6666666666667" y1="498" x2="614.6666666666667" y2="498" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="455" width="249.33333333333334" height="86" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="745.3333333333334" y="490.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Day Zero was</text><text x="745.3333333333334" y="515.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">avoided</text>
</svg>