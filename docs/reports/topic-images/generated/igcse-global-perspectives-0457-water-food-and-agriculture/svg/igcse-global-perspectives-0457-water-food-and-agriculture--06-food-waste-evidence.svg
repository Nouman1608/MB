<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" width="900" height="760" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="760" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A strong estimate and a weak advert</text>

<rect x="30" y="104" width="840" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="142" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">UNEP Food Waste Index Report 2024</text><rect x="70" y="170" width="68" height="68" rx="10" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><rect x="152" y="170" width="68" height="68" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><rect x="234" y="170" width="68" height="68" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><rect x="316" y="170" width="68" height="68" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><rect x="398" y="170" width="68" height="68" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="104" y="260" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">wasted</text><text x="500" y="180" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">About a fifth of food available to</text><text x="500" y="202" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">consumers was wasted in 2022, with</text><text x="500" y="224" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">households wasting the largest share.</text><rect x="30" y="292" width="408" height="126" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="336" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRONG</text><text x="50" y="360.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">A UN body with data from many</text><text x="50" y="382.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">countries</text><rect x="462" y="292" width="408" height="126" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="482" y="325" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">LIMIT</text><text x="482" y="349.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Countries measure waste differently,</text><text x="482" y="371.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">or not at all: quote it as an</text><text x="482" y="393.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">estimate</text><rect x="30" y="436" width="840" height="164" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="469" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">FICTIONAL FERTILISER COMPANY LEAFLET</text><text x="50" y="495.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">“Farmers who use our product always get bumper harvests.”</text><text x="50" y="523.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="523.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Vested interest: profits from sales</text><text x="50" y="549.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="549.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“Always” is a generalisation</text><text x="50" y="575.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="575.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">No figures, no number of farms, no comparison group</text><rect x="30" y="618" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="654" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">More convincing</text><text x="50" y="683.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">An independent body comparing similar farms with and without the fertiliser over several</text><text x="50" y="705.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">seasons.</text>
</svg>