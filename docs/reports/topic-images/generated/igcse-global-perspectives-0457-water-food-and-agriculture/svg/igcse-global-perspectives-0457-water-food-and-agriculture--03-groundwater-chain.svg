<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 702" width="900" height="702" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="702" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Falling groundwater: who runs dry first?</text>

<rect x="30" y="180" width="840" height="270" fill="#efdfa8" stroke="#1e2a44" stroke-width="2.5"/><path d="M30,290 C200,292 400,310 870,330 L870,450 L30,450 Z" fill="#b5d3cf" opacity="0.8"/><path d="M30,290 C200,292 400,310 870,330" fill="none" stroke="#2e6b62" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 7"/><text x="860" y="280" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end">water table, falling</text><line x1="760" y1="292" x2="760" y2="330" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="190" y="140" width="26" height="160" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="203" y="130" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">poorer farmer’s shallow well</text><text x="203" y="330" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">dries first</text><rect x="520" y="140" width="26" height="250" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><rect x="522" y="320" width="22" height="68" fill="#2b5a9a" opacity="0.7"/><text x="533" y="130" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">richer farmer drills deeper</text><text x="450" y="420" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Agriculture uses about 70% of fresh water withdrawn worldwide (FAO)</text><rect x="30" y="470" width="180" height="104" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="120" y="505.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Pumping costs</text><text x="120" y="526.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">little or</text><text x="120" y="547.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">nothing</text><line x1="216" y1="522" x2="244" y2="522" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="250" y="470" width="180" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="340" y="494.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Thirsty crops</text><text x="340" y="515.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">such as rice</text><text x="340" y="536.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">spread into dry</text><text x="340" y="557.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">areas</text><line x1="436" y1="522" x2="464" y2="522" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="470" y="470" width="180" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="560" y="494.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Groundwater</text><text x="560" y="515.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">falls faster</text><text x="560" y="536.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">than rain</text><text x="560" y="557.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">refills it</text><line x1="656" y1="522" x2="684" y2="522" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="690" y="470" width="180" height="104" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="780" y="494.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Supply problem</text><text x="780" y="515.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">becomes an</text><text x="780" y="536.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">inequality</text><text x="780" y="557.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">problem</text><rect x="30" y="590" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="623.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">How serious this is depends on local conditions: you need measured well levels, not a</text><text x="50" y="645.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">general claim.</text>
</svg>