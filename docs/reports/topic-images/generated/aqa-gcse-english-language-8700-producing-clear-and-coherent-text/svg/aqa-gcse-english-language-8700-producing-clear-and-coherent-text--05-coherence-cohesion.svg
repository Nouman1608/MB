<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 755" width="900" height="755" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="755" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Coherence and cohesion</text>

<rect x="30" y="100" width="405" height="184" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="133" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">COHERENCE: THE LOGIC</text><text x="50" y="160" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Does the whole text make sense</text><text x="50" y="186" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">as a sequence?</text><text x="50" y="215.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Ideas in a logical order; the reader</text><text x="50" y="237.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">always knows why one paragraph follows</text><text x="50" y="259.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">another.</text><rect x="465" y="100" width="405" height="184" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="485" y="133" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">COHESION: THE SIGNALS</text><text x="485" y="160" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Which devices bind sentences and</text><text x="485" y="186" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">paragraphs?</text><text x="485" y="215.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The language that shows how ideas</text><text x="485" y="237.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">connect.</text><rect x="30" y="306" width="260" height="47" fill="#1e2a44"/><text x="160" y="335.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Cohesive device</text><rect x="290" y="306" width="580" height="47" fill="#1e2a44"/><text x="580" y="335.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Example or job</text><rect x="30" y="353" width="260" height="48" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="379.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Topic sentences</text><rect x="290" y="353" width="580" height="48" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="304" y="379.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Announce each paragraph’s idea</text><rect x="30" y="401" width="260" height="48" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="427.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Discourse markers</text><rect x="290" y="401" width="580" height="48" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="304" y="427.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“however”, “consequently”, “at first”, “meanwhile”</text><rect x="30" y="449" width="260" height="48" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="475.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Pronoun reference</text><rect x="290" y="449" width="580" height="48" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="304" y="475.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“this”, “they”: pointing back clearly, never ambiguously</text><rect x="30" y="497" width="260" height="48" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="523.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Lexical chains</text><rect x="290" y="497" width="580" height="48" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="304" y="523.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">storm, thunder, drenched: a thread of related words</text><rect x="30" y="545" width="260" height="48" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="571.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Deliberate repetition</text><rect x="290" y="545" width="580" height="48" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="304" y="571.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A key word or image that ties the opening to the ending</text><rect x="30" y="306" width="840" height="287" rx="4" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="615" width="840" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="648.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Cohesive but incoherent: every sentence linked with “furthermore”, ideas</text><text x="48" y="673.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">jumping randomly.</text><text x="48" y="702.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Plan the logic first, then signal it.</text>
</svg>