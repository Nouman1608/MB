<rect width="900" height="592" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Section B writing on both papers</text>

<rect x="30" y="100" width="411" height="211" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="133" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PAPER 1, SECTION B</text><text x="50" y="160" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Narrative or descriptive writing</text><text x="50" y="189.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="189.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">From a choice of scenario, prompt or</text><text x="66.15" y="211.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">image</text><text x="50" y="238.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="238.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Purposes most in play: describe, narrate</text><rect x="459" y="100" width="411" height="211" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="133" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">PAPER 2, SECTION B</text><text x="479" y="160" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A non-fiction text giving your</text><text x="479" y="186" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">viewpoint</text><text x="479" y="215.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.15" y="215.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Audience, purpose and form are specified</text><text x="479" y="242.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="495.15" y="242.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Purposes most in play: argue, explain,</text><text x="495.15" y="264.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">persuade, give and respond to</text><text x="495.15" y="286.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">information</text><text x="450" y="353" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Each Section B is marked out of 40</text><rect x="70" y="373" width="456" height="56" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="298" y="396" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">24 marks: content and organisation</text><text x="298" y="419" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">AO5</text><rect x="526" y="373" width="304" height="56" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="678" y="396" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">16 marks: technical accuracy</text><text x="678" y="419" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">AO6</text><rect x="30" y="455" width="840" height="107" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="488.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">AO5: communicate clearly, effectively and imaginatively</text><text x="48" y="517.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Select and adapt tone, style and register for form, purpose and audience; organise ideas</text><text x="48" y="539.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">with structural and grammatical features for coherence and cohesion.</text>
</svg>