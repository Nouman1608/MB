<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 839" width="900" height="839" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="839" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From a list of points to a coherent paragraph</text>

<rect x="30" y="100" width="840" height="290" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="134" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Draft: six disconnected sentences</text><text x="54" y="170" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">School uniform should be scrapped.</text><text x="846" y="170" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end">kept: topic</text><line x1="54" y1="183" x2="846" y2="183" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 4"/><text x="54" y="210" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">My cousin’s school has no uniform.</text><text x="846" y="210" font-size="16" font-weight="700" fill="#b5602e" text-anchor="end">cut: does no work</text><line x1="54" y1="223" x2="846" y2="223" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 4"/><text x="54" y="250" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Uniform is expensive.</text><text x="846" y="250" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end">kept: one idea</text><line x1="54" y1="263" x2="846" y2="263" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 4"/><text x="54" y="290" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Some people say it stops bullying.</text><text x="846" y="290" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end">kept: counter-argument</text><line x1="54" y1="303" x2="846" y2="303" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 4"/><text x="54" y="330" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Also it is uncomfortable.</text><text x="846" y="330" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="end">saved for its own paragraph</text><line x1="54" y1="343" x2="846" y2="343" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 4"/><text x="54" y="370" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">Students would be happier.</text><text x="846" y="370" font-size="16" font-weight="700" fill="#4a5568" text-anchor="end">not in the revision</text><line x1="62" y1="432" x2="62" y2="789" stroke="#c9d6d4" stroke-width="4"/><rect x="108" y="412" width="762" height="73" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="121" y="439.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Topic sentence</text><text x="121" y="467.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">School uniform should be scrapped, and cost is the strongest reason.</text><circle cx="62" cy="448.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="457.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="108" y="493" width="762" height="73" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="121" y="520.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Development of one idea</text><text x="121" y="548.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Branded items stretch a family’s budget as a child grows.</text><circle cx="62" cy="529.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="538.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="108" y="574" width="762" height="73" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="121" y="601.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Counter-argument signposted</text><text x="121" y="629.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Supporters argue that uniform prevents bullying about clothes;</text><circle cx="62" cy="610.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="619.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="108" y="655" width="762" height="73" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="121" y="682.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Rebuttal with a discourse marker</text><text x="121" y="710.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“however”, pupils will find another target, from shoes to phones.</text><circle cx="62" cy="691.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="700.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="108" y="736" width="762" height="73" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="121" y="763.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Final sentence links back to the topic</text><text x="121" y="791.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">If uniform does not protect pupils, its cost is hard to justify.</text><circle cx="62" cy="772.5" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="62" y="781.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text>
</svg>