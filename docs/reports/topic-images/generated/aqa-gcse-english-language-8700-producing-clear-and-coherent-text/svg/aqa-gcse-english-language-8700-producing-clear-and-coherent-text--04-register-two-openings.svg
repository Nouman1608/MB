<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 553" width="900" height="553" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="553" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Same purpose, two registers</text>

<defs><linearGradient id="rg" x1="0" x2="1"><stop offset="0" stop-color="#2e6b62"/><stop offset="1" stop-color="#d4b02e"/></linearGradient></defs><rect x="60" y="130" width="780" height="14" rx="7" fill="url(#rg)"/><text x="60" y="118" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">more formal</text><text x="840" y="118" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="end">less formal</text><circle cx="160" cy="137" r="12" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><circle cx="740" cy="137" r="12" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M160,150 L160,170" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M740,150 L740,170" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="30" y="170" width="405" height="150" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="203" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LETTER TO A HEAD TEACHER</text><text x="50" y="229.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">“I am writing to ask you to</text><text x="50" y="254.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">reconsider the decision to close</text><text x="50" y="279.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">the library at lunchtime.”</text><rect x="465" y="170" width="405" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="485" y="203" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">SPEECH TO FELLOW STUDENTS</text><text x="485" y="229.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">“Raise your hand if the library</text><text x="485" y="254.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">has ever saved your lunchtime.</text><text x="485" y="279.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Exactly.”</text><text x="450" y="362" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Register is not only vocabulary. It also moves with:</text><rect x="77.5" y="380" width="175" height="33" rx="16.5" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="165" y="402.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">sentence length</text><rect x="264.5" y="380" width="146" height="33" rx="16.5" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="337.5" y="402.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">contractions</text><rect x="422.5" y="380" width="263" height="33" rx="16.5" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="554" y="402.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">pronouns: “you” or “one”</text><rect x="697.5" y="380" width="88" height="33" rx="16.5" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="741.5" y="402.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">humour</text><rect x="30" y="438" width="840" height="85" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="471.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Both openings are appropriate; neither would suit the other audience.</text><text x="450" y="500.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Matching register to the reader is the clearest sign of control.</text>
</svg>