<rect x="30" y="100" width="840" height="330" rx="18" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3"/><text x="60" y="142" font-size="22" font-weight="700" fill="#8a6d0d" text-anchor="start">Controlling purpose: ARGUE</text><text x="60" y="170" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">An article arguing for a later school day</text><rect x="60" y="200" width="244" height="120" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="182" y="250.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Explain</text><text x="182" y="281.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">the research</text><line x1="182" y1="326" x2="182" y2="370" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><rect x="328" y="200" width="244" height="120" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="250.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Describe</text><text x="450" y="281.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">a tired morning</text><line x1="450" y1="326" x2="450" y2="370" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><rect x="596" y="200" width="244" height="120" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="718" y="250.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Narrate</text><text x="718" y="281.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">a short anecdote</text><line x1="718" y1="326" x2="718" y2="370" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/><rect x="60" y="374" width="780" height="36" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="450" y="398" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">each one serves the argument</text>
