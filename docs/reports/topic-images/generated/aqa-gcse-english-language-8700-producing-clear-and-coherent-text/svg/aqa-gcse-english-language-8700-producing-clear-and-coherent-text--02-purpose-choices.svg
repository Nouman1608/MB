<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 585" width="900" height="585" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="585" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Purpose shapes the writer’s choices</text>

<rect x="30" y="100" width="250" height="47" fill="#1e2a44"/><text x="155" y="129.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Purpose</text><rect x="280" y="100" width="590" height="47" fill="#1e2a44"/><text x="575" y="129.3" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Typical choices</text><rect x="30" y="147" width="250" height="70" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="184.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Describe</text><rect x="280" y="147" width="590" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="294" y="173.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Sensory detail, precise nouns and verbs, controlled focus, often</text><text x="294" y="195.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">present tense</text><rect x="30" y="217" width="250" height="70" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="254.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Narrate</text><rect x="280" y="217" width="590" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="294" y="243.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A sequence of events, a viewpoint character, pace control, a</text><text x="294" y="265.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">clear shape</text><rect x="30" y="287" width="250" height="70" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="324.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Explain</text><rect x="280" y="287" width="590" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="294" y="313.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Logical order, causal connectives (“because”, “as a result”),</text><text x="294" y="335.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">examples</text><rect x="30" y="357" width="250" height="58" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="388.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Instruct</text><rect x="280" y="357" width="590" height="58" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="294" y="388.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Imperatives, numbered or ordered steps, second person</text><rect x="30" y="415" width="250" height="70" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="441.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Give and respond to</text><text x="44" y="463.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">information</text><rect x="280" y="415" width="590" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="294" y="452.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Accurate facts, neutral or measured register, clear signposting</text><rect x="30" y="485" width="250" height="70" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2"/><text x="44" y="522.94" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Argue</text><rect x="280" y="485" width="590" height="70" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="294" y="511.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A clear position, reasons and evidence, counter-argument and</text><text x="294" y="533.94" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">rebuttal</text><rect x="30" y="100" width="840" height="455" rx="4" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>