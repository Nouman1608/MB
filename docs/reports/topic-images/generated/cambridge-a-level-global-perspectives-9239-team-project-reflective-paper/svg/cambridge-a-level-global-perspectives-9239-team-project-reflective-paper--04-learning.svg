<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reflecting on your learning</text>

<rect x="30" y="110" width="410" height="106" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="147" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The problem</text><text x="48" y="174.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">what you understand now, and how teammates’</text><text x="48" y="195.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">perspectives changed it</text><rect x="460" y="110" width="410" height="106" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="147" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Research skills</text><text x="478" y="174.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">finding local data, evaluating sources,</text><text x="478" y="195.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">interviewing, spotting a weak source</text><rect x="30" y="232" width="410" height="106" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="269" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Presentation skills</text><text x="48" y="296.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">planning to time, designing visuals, speaking</text><text x="48" y="317.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to a non-specialist audience</text><rect x="460" y="232" width="410" height="106" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="478" y="269" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Changes to personal views</text><text x="478" y="296.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">shaped by hearing a teammate argue from a</text><text x="478" y="317.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">different perspective</text><rect x="30" y="360" width="410" height="107" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="48" y="396.05" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Coverage</text><text x="48" y="424.49" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Four areas of learning listed.</text><rect x="460" y="360" width="410" height="107" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="396.05" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">✓ Depth</text><text x="478" y="424.49" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Two areas explored with examples and their</text><text x="478" y="446.93" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">significance.</text>
