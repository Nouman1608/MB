<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" width="900" height="570" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="570" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What the reflective paper is for</text>

<rect x="30" y="110" width="840" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Component 3: Team Project, 40 marks</text><rect x="60" y="166" width="585" height="46" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="352.5" y="196" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Presentation: 30</text><rect x="645" y="166" width="195" height="46" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="742.5" y="196" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Reflective paper: 10</text><text x="840" y="240" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="end">max 800 words · assessed entirely on AO2 Reflection</text><text x="450" y="300" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Its subject is the process, in two assessed strands</text><rect x="30" y="320" width="410" height="125" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="357" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Strand 1: the collaboration</text><text x="48" y="385.44" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">how effectively the team worked together,</text><text x="48" y="407.88" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and what could be improved</text><rect x="460" y="320" width="410" height="125" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.2"/><text x="478" y="357" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Strand 2: the learning</text><text x="478" y="385.44" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">about the problem, research skills or</text><text x="478" y="407.88" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">presentation skills, and changes to your</text><text x="478" y="430.32" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">personal views shaped by the collaboration</text><rect x="30" y="467" width="840" height="74.88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="498.15" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Not a summary of your research or solution. It is the only place in the qualification where</text><text x="450" y="520.59" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">teamwork itself is assessed.</text>
</svg>