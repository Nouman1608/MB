<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 643" width="900" height="643" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="643" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Evidence and specific improvements</text>

<rect x="30" y="112" width="410" height="54" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="235" y="147" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle">✗ General impression</text><rect x="460" y="112" width="410" height="54" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.5"/><text x="665" y="147" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">✓ Specific and evidenced</text><text x="450" y="204" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">Weakness</text><rect x="30" y="214" width="410" height="125.76" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="50" y="244" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Communication was sometimes a problem.”</text><rect x="460" y="214" width="410" height="125.76" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="480" y="244" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“In the third week, two of us had</text><text x="480" y="266.44" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">researched the same council report because</text><text x="480" y="288.88" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">we had not agreed who would cover local</text><text x="480" y="311.32" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">data.”</text><text x="450" y="377.76" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">Improvement</text><rect x="30" y="387.76" width="410" height="125.76" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="50" y="417.76" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Communicate better.”</text><rect x="460" y="387.76" width="410" height="125.76" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2"/><text x="480" y="417.76" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">“Before researching, we should have written</text><text x="480" y="440.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">a one-line list of who covers which</text><text x="480" y="462.64" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">sources, shared in our group chat, and</text><text x="480" y="485.08" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" font-style="italic">checked it at each meeting.”</text><rect x="30" y="539.52" width="840" height="74.88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="570.67" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Keep a short collaboration diary: meeting dates, decisions, problems and how they were</text><text x="450" y="593.11" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">handled.</text>
</svg>