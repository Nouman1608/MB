<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 754" width="900" height="754" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="754" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Evaluating the collaboration</text>

<rect x="30" y="110" width="840" height="56" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Every aspect is judged “in relation to the team’s goal”</text><rect x="30" y="180" width="840" height="56" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="215" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Agreeing the problem</text><text x="300" y="212.78" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">How was the statement chosen? Did everyone shape it?</text><rect x="30" y="244" width="840" height="70.88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="286.44" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Allocating perspectives</text><text x="300" y="273" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Distinct and workable for each member? Using people’s</text><text x="300" y="295.44" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">strengths?</text><rect x="30" y="322.88" width="840" height="56" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="357.88" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Communication</text><text x="300" y="355.65999999999997" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">How were findings and decisions shared? What went missing?</text><rect x="30" y="386.88" width="840" height="56" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="421.88" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Decision-making</text><text x="300" y="419.65999999999997" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Who decided, and how? Were quieter members heard?</text><rect x="30" y="450.88" width="840" height="56" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="485.88" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Handling disagreement</text><text x="300" y="483.65999999999997" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">What was disputed, and how was it resolved?</text><rect x="30" y="514.88" width="840" height="56" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="549.88" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Organisation</text><text x="300" y="547.66" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Were deadlines set and met? What happened when not?</text><rect x="30" y="578.88" width="840" height="56" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="613.88" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Your own role</text><text x="300" y="611.66" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">What did you contribute? Where did you help or hinder the team?</text><rect x="30" y="650.88" width="840" height="74.88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="682.03" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Test: did the team get the best out of each member, including you? A team that argued a lot</text><text x="450" y="704.47" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">may still have been effective.</text>
</svg>