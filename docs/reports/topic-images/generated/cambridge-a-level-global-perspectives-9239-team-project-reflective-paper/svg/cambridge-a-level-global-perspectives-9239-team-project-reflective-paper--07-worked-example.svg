<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 627" width="900" height="627" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="627" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Weak and strong reflective paragraphs</text>

<rect x="30" y="110" width="840" height="125.36" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="48" y="146.05" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">✗ Weak: every sentence is a general claim</text><text x="48" y="173.17000000000002" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">“Our team worked well together. We had some problems with communication but we sorted them out.</text><text x="48" y="194.29000000000002" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Everyone did their part … I learned a lot about plastic pollution and my presentation skills</text><text x="48" y="215.41000000000003" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">improved.”</text><text x="30" y="265.36" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">✓ Strong learning paragraph, move by move</text><rect x="30" y="281.36" width="840" height="68.24000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="315.48" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="321.96000000000004" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="100" y="321.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">What happened</text><text x="282" y="309.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Tomas’s interviews showed many stallholders paid by the hour for their</text><text x="282" y="330.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">pitch and had to leave quickly</text><rect x="30" y="359.6" width="840" height="56" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="387.6" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="394.08000000000004" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="100" y="393.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">What it shows</text><text x="282" y="392.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the problem was one of time and cost, not attitude, as first assumed</text><rect x="30" y="425.6" width="840" height="68.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="66" cy="459.72" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="66" y="466.20000000000005" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="100" y="465.72" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Effect on learning</text><text x="282" y="453.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">changed the writer’s own solution: collection points at the market’s</text><text x="282" y="474.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">exits instead of fines</text><rect x="30" y="503.84000000000003" width="840" height="68.24000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="537.96" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="544.44" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="100" y="543.96" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Using the learning</text><text x="282" y="531.84" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">now checks who produced a source: a waste company’s advertising figure</text><text x="282" y="552.96" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">was replaced with the council’s own data</text><text x="450" y="598.08" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Details invented for illustration.</text>
</svg>