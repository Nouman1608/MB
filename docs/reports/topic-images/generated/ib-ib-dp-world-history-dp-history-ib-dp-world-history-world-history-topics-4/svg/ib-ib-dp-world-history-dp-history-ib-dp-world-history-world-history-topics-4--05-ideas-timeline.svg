<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Printing and new science, 1450-1700</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Diamonds mark dates given in the lesson</text>
<line x1="70" y1="124" x2="70" y2="498" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 6"/><line x1="70" y1="498" x2="70" y2="508" stroke="#1e2a44" stroke-width="2.5"/><text x="70" y="530" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">1400</text><line x1="198.33333333333334" y1="124" x2="198.33333333333334" y2="498" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 6"/><line x1="198.33333333333334" y1="498" x2="198.33333333333334" y2="508" stroke="#1e2a44" stroke-width="2.5"/><text x="198.33333333333334" y="530" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">1450</text><line x1="326.6666666666667" y1="124" x2="326.6666666666667" y2="498" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 6"/><line x1="326.6666666666667" y1="498" x2="326.6666666666667" y2="508" stroke="#1e2a44" stroke-width="2.5"/><text x="326.6666666666667" y="530" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">1500</text><line x1="455" y1="124" x2="455" y2="498" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 6"/><line x1="455" y1="498" x2="455" y2="508" stroke="#1e2a44" stroke-width="2.5"/><text x="455" y="530" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">1550</text><line x1="583.3333333333334" y1="124" x2="583.3333333333334" y2="498" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 6"/><line x1="583.3333333333334" y1="498" x2="583.3333333333334" y2="508" stroke="#1e2a44" stroke-width="2.5"/><text x="583.3333333333334" y="530" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">1600</text><line x1="711.6666666666666" y1="124" x2="711.6666666666666" y2="498" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 6"/><line x1="711.6666666666666" y1="498" x2="711.6666666666666" y2="508" stroke="#1e2a44" stroke-width="2.5"/><text x="711.6666666666666" y="530" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">1650</text><line x1="840" y1="124" x2="840" y2="498" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 6"/><line x1="840" y1="498" x2="840" y2="508" stroke="#1e2a44" stroke-width="2.5"/><text x="840" y="530" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">1700</text><line x1="50" y1="498" x2="860" y2="498" stroke="#1e2a44" stroke-width="3"/><path d="M211.16666666666666,148 L221.16666666666666,161 L211.16666666666666,174 L201.16666666666666,161 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="199.16666666666666" y="142" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Gutenberg Bible, 1450s</text><text x="199.16666666666666" y="196" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Movable type at Mainz: cheaper, standard texts</text><path d="M437.03333333333336,238 L447.03333333333336,251 L437.03333333333336,264 L427.03333333333336,251 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="425.03333333333336" y="232" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Copernicus, On the Revolutions, 1543</text><text x="425.03333333333336" y="286" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The sun at the centre of the universe</text><path d="M668.0333333333333,328 L678.0333333333333,341 L668.0333333333333,354 L658.0333333333333,341 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="680.0333333333333" y="322" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">Galileo tried by the Inquisition, 1633</text><text x="680.0333333333333" y="376" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">Limits of intellectual freedom</text><path d="M806.6333333333333,418 L816.6333333333333,431 L806.6333333333333,444 L796.6333333333333,431 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="818.6333333333333" y="412" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">Newton's Principia, 1687</text><text x="818.6333333333333" y="466" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">Laws of motion and universal gravitation</text><rect x="30" y="560" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="594.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Do not overstate literacy</text><text x="50" y="624.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Printing spread ideas mainly through the literate and through reading aloud. Assess the effect on a</text><text x="50" y="646.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">society, do not just list inventions.</text>
