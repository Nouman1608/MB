<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 606" width="900" height="606" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="606" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Columbian exchange</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Crosby's term for transfers between the Americas and Afro-Eurasia</text>
<rect x="30" y="124" width="210" height="420" rx="40" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" stroke-dasharray="10 6"/><text x="135" y="158" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">The Americas</text><rect x="660" y="124" width="210" height="420" rx="40" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" stroke-dasharray="10 6"/><text x="765" y="158" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">Afro-Eurasia</text><text x="135" y="204" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Reached by</text><text x="135" y="225" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Columbus across the</text><text x="135" y="246" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Atlantic, 1492</text><text x="765" y="204" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Europe, Africa and</text><text x="765" y="225" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Asia</text><line x1="250" y1="264" x2="650" y2="264" stroke="#2e6b62" stroke-width="5" marker-end="url(#ahT)"/><text x="450" y="252" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Maize and potatoes</text><text x="450" y="290" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">spread to Europe, Africa and Asia</text><line x1="650" y1="342" x2="250" y2="342" stroke="#2e6b62" stroke-width="5" marker-end="url(#ahT)"/><text x="450" y="330" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Horses, cattle and wheat</text><text x="450" y="368" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">brought to the Americas</text><line x1="650" y1="420" x2="250" y2="420" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><text x="450" y="408" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">Smallpox</text><text x="450" y="446" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">devastated American populations</text><line x1="650" y1="498" x2="250" y2="498" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><text x="450" y="486" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">Atlantic slave trade</text><text x="450" y="524" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">forced transport of millions of Africans</text><text x="870" y="570" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Schematic, not to scale</text>
</svg>