<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Tokugawa Japan: change against a fixed order</text>

<line x1="70" y1="100" x2="70" y2="378" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 6"/><line x1="70" y1="378" x2="70" y2="388" stroke="#1e2a44" stroke-width="2.5"/><text x="70" y="410" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">1590</text><line x1="198.33333333333334" y1="100" x2="198.33333333333334" y2="378" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 6"/><line x1="198.33333333333334" y1="378" x2="198.33333333333334" y2="388" stroke="#1e2a44" stroke-width="2.5"/><text x="198.33333333333334" y="410" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">1600</text><line x1="326.6666666666667" y1="100" x2="326.6666666666667" y2="378" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 6"/><line x1="326.6666666666667" y1="378" x2="326.6666666666667" y2="388" stroke="#1e2a44" stroke-width="2.5"/><text x="326.6666666666667" y="410" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">1610</text><line x1="455" y1="100" x2="455" y2="378" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 6"/><line x1="455" y1="378" x2="455" y2="388" stroke="#1e2a44" stroke-width="2.5"/><text x="455" y="410" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">1620</text><line x1="583.3333333333334" y1="100" x2="583.3333333333334" y2="378" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 6"/><line x1="583.3333333333334" y1="378" x2="583.3333333333334" y2="388" stroke="#1e2a44" stroke-width="2.5"/><text x="583.3333333333334" y="410" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">1630</text><line x1="711.6666666666666" y1="100" x2="711.6666666666666" y2="378" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 6"/><line x1="711.6666666666666" y1="378" x2="711.6666666666666" y2="388" stroke="#1e2a44" stroke-width="2.5"/><text x="711.6666666666666" y="410" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">1640</text><line x1="840" y1="100" x2="840" y2="378" stroke="#c9d6d4" stroke-width="1.5" stroke-dasharray="4 6"/><line x1="840" y1="378" x2="840" y2="388" stroke="#1e2a44" stroke-width="2.5"/><text x="840" y="410" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">1650</text><line x1="50" y1="378" x2="860" y2="378" stroke="#1e2a44" stroke-width="3"/><path d="M198.33333333333334,124 L208.33333333333334,137 L198.33333333333334,150 L188.33333333333334,137 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><path d="M236.83333333333334,124 L246.83333333333334,137 L236.83333333333334,150 L226.83333333333334,137 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="186.33333333333334" y="118" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sekigahara, 1600; shogun, 1603</text><text x="186.33333333333334" y="172" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Tokugawa Ieyasu takes power</text><rect x="583.3333333333334" y="214" width="121.91666666666663" height="24" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="583.3333333333334" y="206" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Foreign contact restricted, 1630s</text><text x="583.3333333333334" y="260" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Japanese forbidden to travel abroad</text><path d="M724.5,300 L734.5,313 L724.5,326 L714.5,313 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="736.5" y="294" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">Dutch confined to Dejima, from 1641</text><text x="736.5" y="348" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">European trade limited to the Dutch, at Nagasaki</text><text x="450" y="453.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Christianity was first tolerated, then banned and persecuted from the early seventeenth century.</text><rect x="30" y="484" width="375" height="181" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="514" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CHANGING</text><text x="48" y="540.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Economy and culture</text><text x="48" y="569.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="63.2" y="569.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Peace brings rapid urban growth: Edo,</text><text x="63.2" y="590.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Osaka, Kyoto</text><text x="48" y="616.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="63.2" y="616.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Merchants grow rich</text><text x="48" y="642.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="63.2" y="642.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Printed books, theatre, woodblock prints</text><rect x="495" y="484" width="375" height="181" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="513" y="514" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">HELD STILL</text><text x="513" y="540.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Official status order</text><text x="513" y="569.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="528.2" y="569.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Warriors above peasants, artisans and</text><text x="528.2" y="590.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">merchants</text><text x="513" y="616.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="528.2" y="616.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The regime tried to freeze it</text><line x1="414" y1="560.5" x2="486" y2="560.5" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><line x1="486" y1="588.5" x2="414" y2="588.5" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><text x="450" y="544.5" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">tension</text>
