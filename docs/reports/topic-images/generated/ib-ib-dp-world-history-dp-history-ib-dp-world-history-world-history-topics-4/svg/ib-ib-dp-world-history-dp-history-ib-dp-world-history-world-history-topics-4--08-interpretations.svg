<rect width="900" height="526" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Debates on the extent of change</text>

<defs><linearGradient id="spg100" x1="0" x2="1"><stop offset="0" stop-color="#dce9e7"/><stop offset="1" stop-color="#f2e7b8"/></linearGradient></defs><rect x="60" y="134" width="780" height="26" rx="13" fill="url(#spg100)" stroke="#1e2a44" stroke-width="2.5"/><text x="60" y="120" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Sharp break with the Middle Ages</text><text x="840" y="120" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="end">Continuity with medieval learning</text><path d="M122.4,160 L122.4,184 L236,192 L236,214" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="122.4" cy="147" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="214" width="412" height="96" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="242.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">The "Renaissance" as a break</text><text x="44" y="270.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Popularised in the 19th century, notably by</text><text x="44" y="291.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Burckhardt's study of Renaissance Italy (1860).</text><path d="M777.6,160 L777.6,184 L664,192 L664,214" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="777.6" cy="147" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><rect x="458" y="214" width="412" height="96" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="472" y="242.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Many historians now</text><text x="472" y="270.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Stress continuity with medieval learning.</text><text x="30" y="346" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">WHAT DROVE THE REFORMATION? THREE EMPHASES</text><rect x="30" y="370" width="269.3333333333333" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="164.66666666666666" y="400.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Luther's theology</text><text x="164.66666666666666" y="429.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Luther's own ideas</text><rect x="315.3333333333333" y="370" width="269.3333333333333" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="400.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Political interests</text><text x="450" y="429.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Of princes and towns</text><rect x="600.6666666666666" y="370" width="269.3333333333333" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="735.3333333333333" y="400.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">The role of print</text><text x="735.3333333333333" y="429.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Ideas spread rapidly</text><text x="450" y="485.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Use these debates to frame your judgement on the extent of change.</text>
</svg>