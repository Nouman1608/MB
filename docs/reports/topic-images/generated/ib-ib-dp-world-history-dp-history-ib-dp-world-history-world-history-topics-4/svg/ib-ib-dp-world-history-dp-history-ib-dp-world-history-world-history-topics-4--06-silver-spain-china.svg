<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 646" width="900" height="646" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="646" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One silver flow, opposite effects</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Habsburg Spain (Europe) and Ming China (Asia and Oceania)</text>
<clipPath id="tc124"><rect x="30" y="124" width="840" height="342" rx="14"/></clipPath><g clip-path="url(#tc124)"><rect x="30" y="124" width="193.84615384615384" height="49" fill="#b5d3cf"/><text x="44" y="152.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Theme</text><rect x="223.84615384615384" y="124" width="323.0769230769231" height="49" fill="#b5d3cf"/><text x="237.84615384615384" y="152.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Habsburg Spain</text><rect x="546.9230769230769" y="124" width="323.0769230769231" height="49" fill="#f2e7b8"/><text x="560.9230769230769" y="152.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Ming China</text><rect x="30" y="173" width="193.84615384615384" height="68" fill="#dce9e7"/><text x="44" y="199.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Money and prices</text><rect x="223.84615384615384" y="173" width="323.0769230769231" height="68" fill="#ffffff"/><text x="237.84615384615384" y="199.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rising prices; dependence on</text><text x="237.84615384615384" y="220.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">imported goods</text><rect x="546.9230769230769" y="173" width="323.0769230769231" height="68" fill="#ffffff"/><text x="560.9230769230769" y="199.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Silver the main currency for trade and</text><text x="560.9230769230769" y="220.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">taxation</text><line x1="30" y1="241" x2="870" y2="241" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="241" width="193.84615384615384" height="68" fill="#dce9e7"/><text x="44" y="267.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">State finance</text><rect x="223.84615384615384" y="241" width="323.0769230769231" height="68" fill="#ffffff"/><text x="237.84615384615384" y="267.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Funded Philip II's wars, yet the crown</text><text x="237.84615384615384" y="288.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">repeatedly defaulted</text><rect x="546.9230769230769" y="241" width="323.0769230769231" height="68" fill="#ffffff"/><text x="560.9230769230769" y="267.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Single Whip reforms tied the tax</text><text x="560.9230769230769" y="288.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">system to silver</text><line x1="30" y1="309" x2="870" y2="309" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="309" width="193.84615384615384" height="68" fill="#dce9e7"/><text x="44" y="335.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Society and</text><text x="44" y="356.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">economy</text><rect x="223.84615384615384" y="309" width="323.0769230769231" height="68" fill="#ffffff"/><text x="237.84615384615384" y="335.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Wealth flowed to foreign creditors and</text><text x="237.84615384615384" y="356.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">suppliers; domestic industry struggled</text><rect x="546.9230769230769" y="309" width="323.0769230769231" height="68" fill="#ffffff"/><text x="560.9230769230769" y="335.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Commercialisation of agriculture and</text><text x="560.9230769230769" y="356.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">crafts, especially in the south</text><line x1="30" y1="377" x2="870" y2="377" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="377" width="193.84615384615384" height="89" fill="#dce9e7"/><text x="44" y="403.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Vulnerability</text><rect x="223.84615384615384" y="377" width="323.0769230769231" height="89" fill="#ffffff"/><text x="237.84615384615384" y="403.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Dependence on the treasure fleets</text><rect x="546.9230769230769" y="377" width="323.0769230769231" height="89" fill="#ffffff"/><text x="560.9230769230769" y="403.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Silver imports fell in the 17th century:</text><text x="560.9230769230769" y="424.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">how far did this deepen the late Ming</text><text x="560.9230769230769" y="445.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">crisis?</text></g><line x1="223.84615384615384" y1="124" x2="223.84615384615384" y2="466" stroke="#c9d6d4" stroke-width="1.5"/><line x1="546.9230769230769" y1="124" x2="546.9230769230769" y2="466" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="124" width="840" height="342" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="488" width="410" height="126" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="531.32" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Spain</text><text x="48" y="560.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Spent silver on war and could not keep it: it</text><text x="48" y="581.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">masked</tspan> <tspan font-weight="700" fill="#1e2a44">weakness</tspan>.</text><rect x="460" y="488" width="410" height="126" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="478" y="520.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">China</text><text x="478" y="549.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Absorbed silver into a commercial economy: it</text><text x="478" y="570.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">strengthened</tspan> <tspan font-weight="700" fill="#1e2a44">commerce</tspan>, but created</text><text x="478" y="591.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">dependence.</text>
</svg>