<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 609" width="900" height="609" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="609" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Where American silver went</text>

<rect x="30" y="100" width="250" height="170" rx="40" fill="#f2e7b8" stroke="#2e6b62" stroke-width="2.5" stroke-dasharray="10 6"/><text x="155" y="134" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">Ming China</text><rect x="325" y="100" width="250" height="170" rx="40" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" stroke-dasharray="10 6"/><text x="450" y="134" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">The Americas</text><rect x="620" y="100" width="250" height="170" rx="40" fill="#f2e7b8" stroke="#2e6b62" stroke-width="2.5" stroke-dasharray="10 6"/><text x="745" y="134" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">Europe</text><rect x="70.16" y="162" width="169.68" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="155" y="182.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">taxes paid in silver</text><rect x="68.568" y="206" width="172.864" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="155" y="226.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Single Whip, 1570s</text><rect x="692.016" y="162" width="105.968" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="745" y="182.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">prices rise</text><rect x="684.112" y="206" width="121.776" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="745" y="226.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">16th century</text><rect x="363.248" y="162" width="173.504" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="450" y="182.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Potosí (from 1545)</text><rect x="409.36" y="206" width="81.28" height="30" rx="15" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="450" y="226.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Mexico</text><path d="M420,274 L420,325 L155,325 L155,282" fill="none" stroke="#8a6d0d" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahO)"/><path d="M480,274 L480,325 L745,325 L745,282" fill="none" stroke="#8a6d0d" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahO)"/><text x="287" y="355" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">silver via the Manila galleons</text><text x="287" y="377" font-size="16" font-weight="400" fill="#8a6d0d" text-anchor="middle">(from the 1570s)</text><text x="612" y="355" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="middle">silver</text><text x="870" y="377" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Schematic, not to scale</text><rect x="30" y="403" width="410" height="174" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="433" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MING CHINA</text><text x="48" y="459.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Silver becomes the main medium for</text><text x="48" y="483.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">taxes and trade</text><text x="48" y="512.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The Single Whip reforms (1570s, associated with</text><text x="48" y="533.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Zhang Juzheng) turn taxes and labour services</text><text x="48" y="554.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">into silver payments.</text><rect x="460" y="403" width="410" height="174" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="478" y="433" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EUROPE</text><text x="478" y="459.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The "price revolution"</text><text x="478" y="488.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Prices rise over the sixteenth century.</text>
</svg>