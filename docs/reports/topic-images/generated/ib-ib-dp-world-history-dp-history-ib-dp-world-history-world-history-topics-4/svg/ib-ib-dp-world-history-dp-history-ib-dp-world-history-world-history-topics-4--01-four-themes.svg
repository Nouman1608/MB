<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 538" width="900" height="538" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="538" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Societies in transition: four themes</text>

<rect x="30" y="100" width="412" height="125" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="128" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THEME 1</text><text x="46" y="154.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Religious change</text><text x="46" y="183.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Reform movements, responses of established</text><text x="46" y="204.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">authorities, effects of division</text><rect x="458" y="100" width="412" height="125" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="128" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THEME 2</text><text x="474" y="154.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Intellectual and cultural change</text><text x="474" y="183.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Humanism, printing, the arts, new scientific</text><text x="474" y="204.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">thinking</text><rect x="30" y="241" width="412" height="125" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="269" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THEME 3</text><text x="46" y="295.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Exploration and contact</text><text x="46" y="324.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Voyages, trade, conquest; exchange of goods,</text><text x="46" y="345.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">people, plants, diseases</text><rect x="458" y="241" width="412" height="125" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="269" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THEME 4</text><text x="474" y="295.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Social and economic change</text><text x="474" y="324.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Population, trade, prices and money, social</text><text x="474" y="345.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">structures</text><rect x="30" y="388" width="840" height="118" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="423.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">"Transition": weigh change against continuity</text><rect x="164.6655" y="452" width="98.681" height="31" rx="15.5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="214.006" y="473.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">How far?</text><rect x="273.3465" y="452" width="107.504" height="31" rx="15.5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="327.0985" y="473.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">How fast?</text><rect x="390.8505" y="452" width="115.851" height="31" rx="15.5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="448.776" y="473.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">For whom?</text><rect x="516.7015" y="452" width="218.633" height="31" rx="15.5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="626.018" y="473.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">What stayed the same?</text>
</svg>