<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 704" width="900" height="704" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="704" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reformation and Catholic renewal</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Religious change in the German lands and the Catholic response</text>
<line x1="130" y1="132" x2="130" y2="601" stroke="#1e2a44" stroke-width="4"/><rect x="170" y="124" width="700" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="183" y="151.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Luther's Ninety-five Theses</text><text x="183" y="175.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Challenge the sale of indulgences; grow into a rejection of papal authority. Printing</text><text x="183" y="196.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">spreads his ideas rapidly.</text><circle cx="130" cy="169" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="110" y="175" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1517</text><rect x="170" y="224" width="700" height="69" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="183" y="251.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Excommunicated; condemned at the Diet of Worms</text><text x="183" y="275.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Protected by the Elector of Saxony</text><circle cx="130" cy="258.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="110" y="264.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1521</text><rect x="170" y="303" width="700" height="69" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="183" y="330.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Peasants' War</text><text x="183" y="354.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Religious ideas feed social revolt; Luther condemns the rebels</text><circle cx="130" cy="337.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="110" y="343.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1524-25</text><rect x="170" y="382" width="700" height="69" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="183" y="409.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Society of Jesus approved</text><text x="183" y="433.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Catholic renewal; missions overseas</text><circle cx="130" cy="416.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="110" y="422.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1540</text><rect x="170" y="461" width="700" height="69" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="183" y="488.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Council of Trent</text><text x="183" y="512.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Reaffirms Catholic doctrine; reforms clergy training</text><circle cx="130" cy="495.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="110" y="501.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1545-63</text><rect x="170" y="540" width="700" height="69" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="183" y="567.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Peace of Augsburg</text><text x="183" y="591.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Each prince chooses Lutheranism or Catholicism for his territory</text><circle cx="130" cy="574.5" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="110" y="580.5" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">1555</text><rect x="30" y="631" width="270.6666666666667" height="41" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="165.33333333333334" y="656.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Lutheran reform</text><rect x="314.6666666666667" y="631" width="270.6666666666667" height="41" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="656.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Catholic renewal</text><rect x="599.3333333333334" y="631" width="270.6666666666667" height="41" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="734.6666666666667" y="656.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Settlement</text>
</svg>