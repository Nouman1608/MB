<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 575" width="900" height="575" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="575" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Telling the large-scale retailers apart</text>

<rect x="30" y="110" width="200" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="110" width="200" height="74" rx="14" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="130" y="141" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Multiple chain</text><text x="130" y="166" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">store</text><text x="46" y="214" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Many branches under</text><text x="46" y="235" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">one name</text><text x="46" y="266" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Central buying,</text><text x="46" y="287" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">similar layout</text><line x1="46" y1="330" x2="214" y2="330" stroke="#c9d6d4" stroke-width="2"/><circle cx="58" cy="362" r="11" fill="#2e6b62"/><path d="M53.05,362.22 L56.9,366.18 L63.5,358.15" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="78" y="368" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Bulk buying</text><text x="78" y="388" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">lowers costs</text><circle cx="58" cy="440" r="11" fill="#b5602e"/><path d="M53.82,435.82 L62.18,444.18 M62.18,435.82 L53.82,444.18" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="78" y="446" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Less flexible for</text><text x="78" y="466" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">local tastes</text><rect x="243" y="110" width="200" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="243" y="110" width="200" height="74" rx="14" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5"/><text x="343" y="154" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Supermarket</text><text x="259" y="214" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Large self-service</text><text x="259" y="235" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">store</text><text x="259" y="266" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mainly food and</text><text x="259" y="287" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">household goods</text><line x1="259" y1="330" x2="427" y2="330" stroke="#c9d6d4" stroke-width="2"/><circle cx="271" cy="362" r="11" fill="#2e6b62"/><path d="M266.05,362.22 L269.9,366.18 L276.5,358.15" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="291" y="368" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Wide range, low</text><text x="291" y="388" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">prices</text><circle cx="271" cy="440" r="11" fill="#b5602e"/><path d="M266.82,435.82 L275.18,444.18 M275.18,435.82 L266.82,444.18" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="291" y="446" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Little personal</text><text x="291" y="466" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">service</text><rect x="456" y="110" width="200" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="456" y="110" width="200" height="74" rx="14" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="556" y="154" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Hypermarket</text><text x="472" y="214" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Very large, often</text><text x="472" y="235" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">out of town</text><text x="472" y="266" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Food and non-food;</text><text x="472" y="287" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">large car parks</text><line x1="472" y1="330" x2="640" y2="330" stroke="#c9d6d4" stroke-width="2"/><circle cx="484" cy="362" r="11" fill="#2e6b62"/><path d="M479.05,362.22 L482.9,366.18 L489.5,358.15" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="504" y="368" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Huge range; free</text><text x="504" y="388" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">parking</text><circle cx="484" cy="440" r="11" fill="#b5602e"/><path d="M479.82,435.82 L488.18,444.18 M488.18,435.82 L479.82,444.18" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="504" y="446" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Hard to reach</text><text x="504" y="466" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">without a car</text><rect x="669" y="110" width="200" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="669" y="110" width="200" height="74" rx="14" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5"/><text x="769" y="154" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Department store</text><text x="685" y="214" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Many departments</text><text x="685" y="235" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">under one roof</text><text x="685" y="266" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Usually in a city</text><text x="685" y="287" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">centre</text><line x1="685" y1="330" x2="853" y2="330" stroke="#c9d6d4" stroke-width="2"/><circle cx="697" cy="362" r="11" fill="#2e6b62"/><path d="M692.05,362.22 L695.9,366.18 L702.5,358.15" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="717" y="368" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">High service;</text><text x="717" y="388" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">many goods in one</text><text x="717" y="408" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">visit</text><circle cx="697" cy="440" r="11" fill="#b5602e"/><path d="M692.82,435.82 L701.18,444.18 M701.18,435.82 L692.82,444.18" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="717" y="446" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">High costs and</text><text x="717" y="466" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">prices</text><text x="450" y="548" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">A hypermarket is not just “a big supermarket”: give its out-of-town site, non-food goods and car parks.</text>
</svg>