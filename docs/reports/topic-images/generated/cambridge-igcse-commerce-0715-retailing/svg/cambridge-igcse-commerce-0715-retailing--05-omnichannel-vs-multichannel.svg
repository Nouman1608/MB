<rect width="900" height="650" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Multi-channel or omnichannel?</text>

<rect x="30" y="110" width="410" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="148" font-size="22" font-weight="700" fill="#b5602e" text-anchor="middle">Multi-channel</text><rect x="54" y="180" width="110" height="50" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="109" y="210.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Shop</text><rect x="54" y="250" width="110" height="120" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" stroke-dasharray="6 5"/><text x="109" y="290" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">own</text><text x="109" y="312" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">stock</text><text x="109" y="334" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">and prices</text><rect x="179" y="180" width="110" height="50" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="234" y="210.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Website</text><rect x="179" y="250" width="110" height="120" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" stroke-dasharray="6 5"/><text x="234" y="290" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">own</text><text x="234" y="312" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">stock</text><text x="234" y="334" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">and prices</text><rect x="304" y="180" width="110" height="50" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="359" y="210.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">App</text><rect x="304" y="250" width="110" height="120" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" stroke-dasharray="6 5"/><text x="359" y="290" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">own</text><text x="359" y="312" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">stock</text><text x="359" y="334" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">and prices</text><text x="54" y="410" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Several channels, but they may run</text><text x="54" y="431" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">separately: prices or stock can differ.</text><rect x="460" y="110" width="410" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="148" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="middle">Omnichannel</text><rect x="575" y="270" width="180" height="70" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="665" y="300.1" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Shared stock and</text><text x="665" y="321.1" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">one account</text><rect x="490" y="180" width="130" height="46" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="555" y="208.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Shop</text><line x1="555" y1="226" x2="610" y2="270" stroke="#2e6b62" stroke-width="3"/><rect x="720" y="180" width="130" height="46" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="785" y="208.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Website</text><line x1="785" y1="226" x2="720" y2="270" stroke="#2e6b62" stroke-width="3"/><rect x="490" y="370" width="130" height="46" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="555" y="398.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">App</text><line x1="555" y1="370" x2="610" y2="340" stroke="#2e6b62" stroke-width="3"/><rect x="720" y="370" width="130" height="46" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="785" y="398.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Social media</text><line x1="785" y1="370" x2="720" y2="340" stroke="#2e6b62" stroke-width="3"/><text x="484" y="455" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">All channels joined up, so the customer</text><text x="484" y="476" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">moves between them seamlessly.</text><text x="450" y="550" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">One omnichannel journey</text><rect x="30" y="570" width="180" height="54" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="120" y="602.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Check stock in app</text><line x1="214" y1="597" x2="244" y2="597" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="250" y="570" width="180" height="54" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="340" y="602.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Reserve online</text><line x1="434" y1="597" x2="464" y2="597" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="470" y="570" width="180" height="54" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="560" y="602.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Collect in store</text><line x1="654" y1="597" x2="684" y2="597" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="690" y="570" width="180" height="54" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="780" y="602.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Return by post</text>
</svg>