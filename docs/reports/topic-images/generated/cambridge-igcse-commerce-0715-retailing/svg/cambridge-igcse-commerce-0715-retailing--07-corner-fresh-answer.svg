<rect width="900" height="560" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Corner Fresh: a 4-mark answer</text>

<text x="30" y="136" font-size="18" font-weight="700" fill="#4a5568" text-anchor="start">Reason 1</text><rect x="30" y="150" width="300" height="130" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="190" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">Name it</text><text x="52" y="222" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Personal service</text><rect x="270" y="160" width="48" height="34" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="294" y="182.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">[1]</text><line x1="336" y1="215" x2="376" y2="215" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="385" y="150" width="485" height="130" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="407" y="190" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Explain by contrast with the hypermarket</text><text x="407" y="220" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Owner knows regulars, orders special items,</text><text x="407" y="241" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">gives informal credit, unlike hypermarket</text><text x="407" y="262" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">staff</text><rect x="812" y="160" width="48" height="34" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="836" y="182.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">[1]</text><text x="30" y="336" font-size="18" font-weight="700" fill="#4a5568" text-anchor="start">Reason 2</text><rect x="30" y="350" width="300" height="130" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="52" y="390" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">Name it</text><text x="52" y="422" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Flexible opening hours</text><rect x="270" y="360" width="48" height="34" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="294" y="382.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">[1]</text><line x1="336" y1="415" x2="376" y2="415" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="385" y="350" width="485" height="130" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="407" y="390" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Explain by contrast with the hypermarket</text><text x="407" y="420" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Open early and late, when the out-of-town</text><text x="407" y="441" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">hypermarket needs a car journey</text><rect x="812" y="360" width="48" height="34" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="836" y="382.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">[1]</text><text x="450" y="530" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">2 reasons × (name + explain) = 4 marks</text>
</svg>