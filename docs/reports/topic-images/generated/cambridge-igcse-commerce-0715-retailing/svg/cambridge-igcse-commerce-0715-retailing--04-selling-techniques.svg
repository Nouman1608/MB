<rect width="900" height="680" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Eleven selling techniques, by what they do</text>

<rect x="30" y="110" width="840" height="100" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="150" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Recognition</text><text x="50" y="176" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">trust, quick recognition,</text><text x="50" y="196" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">attention on the shelf</text><rect x="300" y="136" width="178" height="48" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="389" y="165.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Branding</text><rect x="490" y="136" width="178" height="48" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="579" y="165.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Logos</text><rect x="680" y="136" width="178" height="48" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="769" y="165.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Packaging</text><rect x="30" y="222" width="840" height="100" rx="12" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="262" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Price and cost</text><text x="50" y="288" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">cheaper goods, higher</text><text x="50" y="308" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">margin, fewer staff</text><rect x="300" y="248" width="178" height="48" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="389" y="277.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Own brands</text><rect x="490" y="248" width="178" height="48" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="579" y="277.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Self service</text><rect x="30" y="334" width="840" height="100" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="374" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Loyalty</text><text x="50" y="400" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">customers return; offers to</text><text x="50" y="420" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">known customers</text><rect x="300" y="360" width="178" height="48" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="389" y="389.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Loyalty programmes</text><rect x="490" y="360" width="178" height="48" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="579" y="389.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Direct mail</text><rect x="680" y="360" width="178" height="48" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="769" y="389.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Informal credit</text><rect x="30" y="446" width="840" height="100" rx="12" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="486" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Confidence</text><text x="50" y="512" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">trust for expensive items</text><text x="50" y="532" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">and wary online buyers</text><rect x="300" y="472" width="178" height="48" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="389" y="501.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">After-sales service</text><rect x="490" y="472" width="178" height="48" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="579" y="501.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Cash on delivery</text><rect x="30" y="558" width="840" height="100" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="598" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Speed and accuracy</text><text x="50" y="624" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">fast checkout, automatic</text><text x="50" y="644" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">stock records</text><rect x="300" y="584" width="178" height="48" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="389" y="613.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Barcoding</text>
</svg>