<rect width="900" height="565" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Dropshipping and click and collect</text>

<rect x="30" y="110" width="840" height="240" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="146" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Dropshipping</text><text x="846" y="146" font-size="16" font-weight="600" fill="#b5602e" text-anchor="end">retailer holds no stock</text><rect x="54" y="200" width="180" height="64" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="144" y="238.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Customer</text><rect x="360" y="200" width="180" height="64" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="238.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Retailer</text><rect x="666" y="200" width="180" height="64" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="756" y="238.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Supplier</text><line x1="238" y1="222" x2="354" y2="222" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="296" y="210" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">orders</text><line x1="544" y1="222" x2="660" y2="222" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="602" y="210" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">passes order</text><path d="M756,268 C756,330 144,330 144,272" fill="none" stroke="#2e6b62" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ahT)"/><text x="450" y="298" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">goods sent directly to the customer</text><rect x="30" y="370" width="840" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="406" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Click and collect</text><rect x="54" y="440" width="180" height="64" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="144" y="478.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Customer</text><rect x="360" y="440" width="180" height="64" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="478.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Online order</text><rect x="666" y="440" width="180" height="64" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="756" y="467.1" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Store or</text><text x="756" y="488.1" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">collection point</text><line x1="238" y1="472" x2="354" y2="472" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="544" y1="472" x2="660" y2="472" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="450" y="528" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">the customer picks up the goods</text>
