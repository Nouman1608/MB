<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 575" width="900" height="575" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="575" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why small shops survive</text>

<rect x="330" y="110" width="240" height="70" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="139.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Small-scale retailer</text><text x="450" y="163.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">e.g. a corner shop</text><path d="M450,184 C450,215 165,205 165,232" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="30" y="240" width="270" height="175" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="165" y="276" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Personal service</text><text x="48" y="310" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Knows regular customers,</text><text x="48" y="331" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">remembers what they buy,</text><text x="48" y="352" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">gives advice</text><path d="M450,184 C450,215 450,205 450,232" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="315" y="240" width="270" height="175" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="276" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Flexible opening hours</text><text x="333" y="310" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Opens early, late or on</text><text x="333" y="331" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">holidays when large stores</text><text x="333" y="352" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">are closed</text><path d="M450,184 C450,215 735,205 735,232" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="600" y="240" width="270" height="175" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="735" y="276" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Additional services</text><text x="618" y="310" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Delivery to elderly</text><text x="618" y="331" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">customers, phone credit,</text><text x="618" y="352" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">bill payment, informal</text><text x="618" y="373" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">credit</text><text x="450" y="445" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">The three syllabus examples</text><rect x="30" y="465" width="840" height="85" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="500" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">You can also add</text><rect x="240" y="480" width="280" height="54" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="380" y="512.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Convenience: close to homes</text><rect x="540" y="480" width="300" height="54" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="690" y="512.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Stocking local products</text>
</svg>