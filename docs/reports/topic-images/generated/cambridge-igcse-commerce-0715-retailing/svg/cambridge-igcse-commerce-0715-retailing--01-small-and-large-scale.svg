<rect width="900" height="480" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Small-scale and large-scale retailers</text>

<rect x="30" y="110" width="330" height="345" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="195" y="146" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="middle">Small-scale</text><rect x="46" y="170" width="298" height="64" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="62" y="197" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Itinerant retailer</text><text x="62" y="221" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">travels to customers</text><rect x="46" y="246" width="298" height="64" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="62" y="273" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Independent retailer</text><text x="62" y="297" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">one shop, owner-run</text><rect x="46" y="322" width="298" height="64" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="62" y="349" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Street market</text><text x="62" y="373" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">many stalls, set days</text><rect x="46" y="398" width="298" height="64" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="62" y="425" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Speciality shop (many)</text><text x="62" y="449" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">deep range of one product</text><rect x="540" y="110" width="330" height="345" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="705" y="146" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Large-scale</text><rect x="556" y="170" width="298" height="64" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="572" y="197" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Multiple chain store</text><text x="572" y="221" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">many branches, one name</text><rect x="556" y="246" width="298" height="64" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="572" y="273" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Supermarket</text><text x="572" y="297" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">self-service food store</text><rect x="556" y="322" width="298" height="64" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="572" y="349" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Hypermarket</text><text x="572" y="373" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">out of town, food and non-food</text><rect x="556" y="398" width="298" height="64" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="572" y="425" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Department store</text><text x="572" y="449" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">many departments, city centre</text><rect x="375" y="182" width="150" height="200" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="8 6"/><text x="450" y="214" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Either</text><rect x="390" y="242" width="120" height="54" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="264.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Vending</text><text x="450" y="284.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">machine</text><rect x="390" y="310" width="120" height="54" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="332.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Online</text><text x="450" y="352.25" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">retailer</text>
</svg>