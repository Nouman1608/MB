<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" width="900" height="760" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="760" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Seven geographic themes: pick two or three</text>

<rect x="30" y="112" width="410" height="70" rx="14" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="145" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">SL: choose 2 options</text><text x="235" y="169" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">60 hours</text><rect x="460" y="112" width="410" height="70" rx="14" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2.5"/><text x="665" y="145" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">HL: choose 3 options</text><text x="665" y="169" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">90 hours</text><rect x="30" y="206" width="410" height="94" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="238" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Freshwater</text><text x="48" y="264" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">distribution, use and management of</text><text x="48" y="284" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">freshwater</text><rect x="460" y="206" width="410" height="94" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="238" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Oceans and coastal margins</text><text x="478" y="264" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">physical processes and human pressures on</text><text x="478" y="284" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">coasts and oceans</text><rect x="30" y="312" width="410" height="94" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="344" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Extreme environments</text><text x="48" y="370" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">living in and adapting to hostile</text><text x="48" y="390" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">environments</text><rect x="460" y="312" width="410" height="94" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="344" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Geophysical hazards</text><text x="478" y="370" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">causes, impacts and management of</text><text x="478" y="390" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">earthquakes, eruptions</text><rect x="30" y="418" width="410" height="94" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="450" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Leisure, tourism and sport</text><text x="48" y="476" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">where people spend leisure time, and its</text><text x="48" y="496" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">impact</text><rect x="460" y="418" width="410" height="94" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="450" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Food and health</text><text x="478" y="476" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">food production and security, and links to</text><text x="478" y="496" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">health</text><rect x="30" y="524" width="840" height="94" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="556" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Urban environments</text><text x="48" y="582" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">growth, structure and challenges of cities</text><rect x="30" y="650" width="840" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="684" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Your teacher selects the options: confirm which ones your class studies.</text><text x="450" y="712" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Each option combines physical processes with their human and management consequences.</text>
</svg>