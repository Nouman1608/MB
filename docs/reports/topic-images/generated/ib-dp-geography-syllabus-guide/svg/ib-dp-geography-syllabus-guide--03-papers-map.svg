<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Which paper examines what</text>

<text x="220" y="126" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">What you study</text><text x="695" y="126" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">Where it is assessed</text><rect x="30" y="144" width="380" height="74" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="520" y="144" width="350" height="74" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="178" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Options</text><text x="48" y="201" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">2 at SL, 3 at HL, from the seven</text><text x="538" y="178" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Paper 1</text><text x="538" y="201" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the chosen options</text><line x1="416" y1="181" x2="512" y2="181" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/><rect x="30" y="234" width="380" height="116" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="520" y="234" width="350" height="116" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="268" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Core: global change</text><text x="48" y="291" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">population distribution; global</text><text x="48" y="312" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">climate; global resource consumption</text><text x="48" y="333" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and security</text><text x="538" y="289" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Paper 2</text><text x="538" y="312" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the shared core</text><line x1="416" y1="292" x2="512" y2="292" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/><rect x="30" y="366" width="380" height="139" rx="12" fill="#fbf6e2" stroke="#8a6d0d" stroke-width="2.5" stroke-dasharray="7 5"/><rect x="520" y="366" width="350" height="139" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="400" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">HL extension: global</text><text x="48" y="423" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">interactions</text><rect x="324.67" y="376" width="73.33" height="22" rx="11" fill="#d4b02e" stroke="#8a6d0d" stroke-width="1.5"/><text x="361.33500000000004" y="392" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">HL only</text><text x="48" y="446" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">power, places and networks; human</text><text x="48" y="467" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">development and diversity; global risks</text><text x="48" y="488" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and resilience</text><text x="538" y="432.5" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Paper 3</text><text x="538" y="455.5" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">HL only</text><line x1="416" y1="435.5" x2="512" y2="435.5" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/><rect x="30" y="521" width="380" height="95" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="520" y="521" width="350" height="95" rx="12" fill="#dce9e7" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="555" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Fieldwork</text><text x="48" y="578" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">one written report on a fieldwork</text><text x="48" y="599" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">question of your own choosing</text><text x="538" y="565.5" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Internal assessment</text><text x="538" y="588.5" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">both levels</text><line x1="416" y1="568.5" x2="512" y2="568.5" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/><rect x="30" y="640" width="840" height="90" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="674" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Across every paper: build a case-study bank</text><text x="450" y="702" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">one or two named, specific real-world examples per theme</text>
