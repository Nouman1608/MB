<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 654" width="900" height="654" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="654" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The fieldwork report: plan first</text>

<rect x="30" y="112" width="840" height="125" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="174.5" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="182.42" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="120" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Choose a topic</text><text x="120" y="172" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">from an option, the core or (at HL) the extension; changing population,</text><text x="120" y="195" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">global climate and global issues not adapted to the local scale are unlikely</text><text x="120" y="218" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">to suit</text><line x1="76" y1="238" x2="76" y2="258" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="259" width="840" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="298.5" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="306.42" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="120" y="293" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Settle a testable geographic question</text><text x="120" y="319" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">and a realistic data-collection method, well before the fieldwork trip</text><line x1="76" y1="339" x2="76" y2="359" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="360" width="840" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="399.5" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="407.42" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="120" y="394" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Collect and analyse the information</text><text x="120" y="420" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">presenting results with evaluation</text><line x1="76" y1="440" x2="76" y2="460" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="461" width="840" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="500.5" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="76" y="508.42" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="120" y="495" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluate your own method’s limitations</text><text x="120" y="521" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">assessed as its own skill, separate from presenting results</text><rect x="30" y="564" width="840" height="64" rx="14" fill="#fbeee6" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="603" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">Avoid: collecting data first and fitting a question to it afterwards</text>
</svg>