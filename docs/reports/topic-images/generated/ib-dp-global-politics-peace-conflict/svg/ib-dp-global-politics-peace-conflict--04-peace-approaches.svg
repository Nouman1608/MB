<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 515" width="900" height="515" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="515" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Making, keeping and building peace</text>

<rect x="30" y="140" width="253.33333333333334" height="170" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="156.66666666666669" y="209.4" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Peacemaking</text><text x="156.66666666666669" y="236.52" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">negotiations and treaties</text><text x="156.66666666666669" y="257.64" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">aimed at ending violence</text><line x1="286.33333333333337" y1="225" x2="318.33333333333337" y2="225" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="140" width="253.33333333333334" height="170" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.2"/><text x="450.00000000000006" y="198.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Peacekeeping</text><text x="450.00000000000006" y="226.02" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">maintaining a ceasefire or</text><text x="450.00000000000006" y="247.14000000000001" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">preventing renewed violence,</text><text x="450.00000000000006" y="268.26" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">e.g. UN missions</text><line x1="579.6666666666667" y1="225" x2="611.6666666666667" y2="225" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="140" width="253.33333333333334" height="170" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.2"/><text x="743.3333333333334" y="188.4" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Peacebuilding</text><text x="743.3333333333334" y="215.52" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">post-conflict work to</text><text x="743.3333333333334" y="236.64000000000001" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">prevent recurrence:</text><text x="743.3333333333334" y="257.76" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">institutions, transitional</text><text x="743.3333333333334" y="278.88" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">justice, reconciliation</text><text x="30" y="360" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Peacebuilding mechanisms named in the syllabus</text><rect x="30" y="375" width="410" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="48" y="424.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Truth and reconciliation commissions</text><text x="48" y="451.22" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">e.g. the Gambia, Canada, Tunisia</text><rect x="460" y="375" width="410" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.2"/><text x="478" y="424.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Justice institutions</text><text x="478" y="451.22" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">e.g. the International Criminal Court</text>
</svg>