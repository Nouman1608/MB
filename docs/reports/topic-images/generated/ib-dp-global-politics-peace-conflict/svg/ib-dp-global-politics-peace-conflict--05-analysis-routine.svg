<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A routine for any conflict question</text>

<rect x="30" y="110" width="840" height="94.16" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="84" cy="157.07999999999998" r="28" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="84" y="167.16" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="136" y="149.85" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Classify</text><text x="136" y="175.57" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">interstate, intrastate, non-state or extra-state?</text><rect x="30" y="218.16" width="840" height="94.16" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="84" cy="265.24" r="28" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="84" y="275.32" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="136" y="258.01" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Pick the concept</text><text x="136" y="283.73" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">which of power, sovereignty, legitimacy, interdependence does it foreground?</text><rect x="30" y="326.32" width="840" height="94.16" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="84" cy="373.4" r="28" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="84" y="383.47999999999996" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="136" y="366.17" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Connect causes</text><text x="136" y="391.89000000000004" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">more than one of the six, and how they interact</text><rect x="30" y="434.48" width="840" height="116.6" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="84" cy="492.78000000000003" r="28" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="84" y="502.86" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="136" y="474.33000000000004" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Use current cases</text><text x="136" y="500.05000000000007" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">a case log: one interstate, one intrastate, one resolution or peacebuilding</text><text x="136" y="522.4900000000001" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">process, with dates, actors, outcomes</text>
</svg>