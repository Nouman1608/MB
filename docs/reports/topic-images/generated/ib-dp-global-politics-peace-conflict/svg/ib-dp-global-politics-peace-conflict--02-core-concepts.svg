<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 672" width="900" height="672" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="672" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four core concepts applied to conflict</text>

<line x1="450" y1="340" x2="180" y2="190" stroke="#1e2a44" stroke-width="2.5"/><line x1="450" y1="340" x2="720" y2="190" stroke="#1e2a44" stroke-width="2.5"/><line x1="450" y1="340" x2="180" y2="490" stroke="#1e2a44" stroke-width="2.5"/><line x1="450" y1="340" x2="720" y2="490" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="115" width="300" height="150" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="180" y="164.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Power</text><text x="180" y="190.96" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">who holds military, economic,</text><text x="180" y="211.42000000000002" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">informational power; how the</text><text x="180" y="231.88" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">balance shapes dynamics and outcome</text><rect x="570" y="115" width="300" height="150" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="720" y="164.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Sovereignty</text><text x="720" y="190.96" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">conflict can challenge or reassert</text><text x="720" y="211.42000000000002" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">it, e.g. separatist or secessionist</text><text x="720" y="231.88" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">movements</text><rect x="30" y="415" width="300" height="150" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="180" y="464.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Legitimacy</text><text x="180" y="490.96" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">how combatants and outsiders claim</text><text x="180" y="511.41999999999996" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">or deny legitimacy for force;</text><text x="180" y="531.88" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">shapes responses</text><rect x="570" y="415" width="300" height="150" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="720" y="464.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Interdependence</text><text x="720" y="490.96" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">refugee flows, economic disruption,</text><text x="720" y="511.41999999999996" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">security concerns spread beyond</text><text x="720" y="531.88" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">borders</text><circle cx="450" cy="340" r="92" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="333.8" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Peace and</text><text x="450" y="360.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">conflict</text><rect x="30" y="590" width="840" height="51.120000000000005" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="620.2" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Name the concept each point illustrates: concept application, not factual recall, is what is tested.</text>
</svg>