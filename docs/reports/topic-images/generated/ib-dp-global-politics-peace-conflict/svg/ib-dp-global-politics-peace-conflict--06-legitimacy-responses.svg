<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 565" width="900" height="565" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="565" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why similar conflicts get different responses</text>

<rect x="30" y="115" width="410" height="160" rx="12" fill="#eaf3f1" stroke="#2e6b62" stroke-width="2.2"/><text x="48" y="152.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Conflict A</text><text x="48" y="180.07" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">force widely seen as defensive or authorised</text><text x="48" y="201.19" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">by an international body</text><text x="48" y="222.31" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">legitimacy broadly recognised</text><rect x="460" y="115" width="410" height="160" rx="12" fill="#fbeee6" stroke="#b5602e" stroke-width="2.2"/><text x="478" y="152.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Conflict B</text><text x="478" y="180.07" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">force widely seen as unprovoked aggression or</text><text x="478" y="201.19" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">lacking authorisation</text><text x="478" y="222.31" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">legitimacy broadly denied</text><text x="450" y="205" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">≈</text><text x="450" y="305" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">militarily similar</text><line x1="235" y1="280" x2="235" y2="330" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><line x1="665" y1="280" x2="665" y2="330" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><rect x="30" y="335" width="410" height="100" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.2"/><text x="235" y="392.6" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">More measured or supportive responses</text><rect x="460" y="335" width="410" height="100" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.2"/><text x="665" y="381.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Condemnation, sanctions or</text><text x="665" y="404.86" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">intervention</text><rect x="30" y="460" width="840" height="74.88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="491.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Legitimacy is partly perception and recognition by other actors, not the scale or intensity of</text><text x="450" y="513.59" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">the fighting.</text>
</svg>