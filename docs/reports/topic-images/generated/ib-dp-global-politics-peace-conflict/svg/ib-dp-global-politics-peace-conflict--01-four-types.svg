<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four types of conflict</text>

<rect x="30" y="110" width="410" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="148" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Interstate</text><text x="52" y="324" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">between states</text><rect x="116" y="199" width="68" height="52" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="150" y="231" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">State</text><line x1="186" y1="225" x2="314" y2="225" stroke="#b5602e" stroke-width="4" stroke-dasharray="9 6"/><rect x="316" y="199" width="68" height="52" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="350" y="231" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">State</text><rect x="460" y="110" width="410" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="482" y="148" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Intrastate</text><text x="482" y="324" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">within a state, e.g. civil war</text><rect x="530" y="160" width="270" height="130" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="6 5"/><text x="545" y="180" font-size="14" font-weight="400" fill="#4a5568" text-anchor="start">one state</text><rect x="566" y="209" width="68" height="52" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="600" y="241" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">State</text><line x1="636" y1="235" x2="702" y2="235" stroke="#b5602e" stroke-width="4" stroke-dasharray="9 6"/><circle cx="732" cy="235" r="28" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="732" y="240" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">group</text><rect x="30" y="380" width="410" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="52" y="418" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Non-state</text><text x="52" y="594" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">between non-state actors, with no state as a</text><text x="52" y="614" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">direct party</text><circle cx="150" cy="495" r="28" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="150" y="500" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">group</text><line x1="180" y1="495" x2="320" y2="495" stroke="#b5602e" stroke-width="4" stroke-dasharray="9 6"/><circle cx="350" cy="495" r="28" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="350" y="500" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">group</text><rect x="460" y="380" width="410" height="250" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="482" y="418" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Extra-state</text><text x="482" y="594" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a state against a non-state actor operating</text><text x="482" y="614" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">beyond that state’s own borders</text><rect x="490" y="440" width="130" height="100" rx="12" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="6 5"/><rect x="700" y="440" width="140" height="100" rx="12" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="6 5"/><rect x="521" y="464" width="68" height="52" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="555" y="496" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">State</text><line x1="591" y1="490" x2="738" y2="490" stroke="#b5602e" stroke-width="4" stroke-dasharray="9 6"/><circle cx="770" cy="490" r="28" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="770" y="495" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">group</text><rect x="30" y="650" width="840" height="53.760000000000005" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="682.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Classify the conflict first, then build the argument around it.</text>
