<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The three eAssessment tasks</text>

<text x="50" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start"></text><rect x="50" y="116" width="200" height="60" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="150" y="152" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">25</text><rect x="250" y="116" width="400" height="60" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="450" y="152" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">50</text><rect x="650" y="116" width="200" height="60" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="750" y="152" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">25</text><text x="450" y="204" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">marks out of 100</text><rect x="30" y="226" width="840" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="50" y="258" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Knowing and understanding · 25 marks · criterion A</text><text x="50" y="286" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">scientific knowledge applied to problems</text><rect x="30" y="324" width="840" height="84" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="356" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Investigation skills · 50 marks · criteria B and C</text><text x="50" y="384" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">formulate hypotheses, plan investigations; collect, present, interpret and evaluate data</text><text x="850" y="356" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="end">half the marks</text><rect x="30" y="422" width="840" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="50" y="454" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Applying science · 25 marks · criterion D</text><text x="50" y="482" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reflect on the impact of science and how it addresses real-life issues</text><text x="450" y="552" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">One on-screen examination, available in biology, chemistry, physics and integrated sciences</text>
