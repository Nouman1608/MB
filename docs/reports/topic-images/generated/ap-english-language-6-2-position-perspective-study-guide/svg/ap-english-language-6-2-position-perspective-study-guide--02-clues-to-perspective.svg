<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 632" width="900" height="632" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="632" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Clues to perspective</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Often signalled, not always stated</text>
<circle cx="450" cy="322" r="70" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="450" y="318" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">the</text><text x="450" y="340" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">perspective</text><rect x="30" y="122" width="250" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="42" y="159.58" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Role or background</text><text x="42" y="185.17000000000002" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“As a parent...”, “In my thirty</text><text x="42" y="204.97000000000003" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">years as a nurse...”</text><line x1="282" y1="177" x2="387" y2="271.25" stroke="#c9d6d4" stroke-width="2.5"/><rect x="620" y="122" width="250" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="632" y="159.58" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Interests</text><text x="632" y="185.17000000000002" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">what the writer stands to gain</text><text x="632" y="204.97000000000003" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">or lose</text><line x1="618" y1="177" x2="513" y2="271.25" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="267" width="250" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="42" y="304.58000000000004" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Expertise</text><text x="42" y="330.17" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">data, personal experience,</text><text x="42" y="349.97" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">professional training</text><line x1="282" y1="322" x2="387" y2="322" stroke="#c9d6d4" stroke-width="2.5"/><rect x="620" y="267" width="250" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="632" y="304.58000000000004" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Choice of evidence</text><text x="632" y="330.17" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">a teacher cites lesson time; a</text><text x="632" y="349.97" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">parent, safety</text><line x1="618" y1="322" x2="513" y2="322" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="412" width="250" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="42" y="459.48" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Vocabulary and tone</text><text x="42" y="485.07" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">the words a writer reaches for</text><line x1="282" y1="467" x2="387" y2="372.75" stroke="#c9d6d4" stroke-width="2.5"/><rect x="620" y="412" width="250" height="110" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="632" y="459.48" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">What is left out</text><text x="632" y="485.07" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">concerns that matter to others</text><line x1="618" y1="467" x2="513" y2="372.75" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="542" width="840" height="74.24000000000001" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="450" y="573.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">A perspective is not an error: everyone writes from somewhere. Noticing it explains the evidence a</text><text x="450" y="594.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">source chooses, and how far that evidence travels.</text>
</svg>