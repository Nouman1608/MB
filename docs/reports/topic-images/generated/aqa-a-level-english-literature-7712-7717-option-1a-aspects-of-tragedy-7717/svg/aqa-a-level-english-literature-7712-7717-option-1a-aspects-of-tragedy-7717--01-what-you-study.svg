<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Aspects of Tragedy: your three texts</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">“Later texts” measured against a long-established genre</text>
<rect x="30" y="110" width="840" height="92" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="146" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Text 1 · Shakespeare</text><text x="54" y="174" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">one of:</text><g font-style="italic"><rect x="330" y="138" width="98" height="38" rx="19" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="379" y="163.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Othello</text></g><g font-style="italic"><rect x="442" y="138" width="119" height="38" rx="19" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="501.5" y="163.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">King Lear</text></g><text x="30" y="242" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Texts 2 and 3 · two further texts, including one drama, from:</text><rect x="30" y="262" width="411" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="293" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">Richard II</text><text x="48" y="318" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Shakespeare</text><rect x="332" y="272" width="95" height="28" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="379.5" y="291.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">pre-1900</text><rect x="255" y="272" width="69" height="28" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="289.5" y="291.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">drama</text><rect x="459" y="262" width="411" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="293" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">Death of a Salesman</text><text x="477" y="318" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Arthur Miller</text><rect x="787" y="272" width="69" height="28" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="821.5" y="291.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">drama</text><rect x="30" y="346" width="411" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="377" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">Tess of the D’Urbervilles</text><text x="48" y="402" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Thomas Hardy</text><rect x="332" y="356" width="95" height="28" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="379.5" y="375.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">pre-1900</text><rect x="459" y="346" width="411" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="377" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">The Great Gatsby</text><text x="477" y="402" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">F. Scott Fitzgerald</text><rect x="30" y="430" width="411" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="461" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">“Lamia” and three more</text><text x="48" y="486" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">John Keats · four poems</text><rect x="332" y="440" width="95" height="28" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="379.5" y="459.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">pre-1900</text><rect x="459" y="430" width="411" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="461" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Poetry anthology (tragedy)</text><text x="477" y="486" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Various</text><rect x="30" y="522" width="269.3333333333333" height="96" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="164.66666666666666" y="560.9" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">At least one drama</text><text x="164.66666666666666" y="589.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">among the two further texts</text><rect x="315.3333333333333" y="522" width="269.3333333333333" height="96" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="550.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">At least one pre-1900</text><text x="450" y="578.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">among the two non-Shakespeare</text><text x="450" y="599.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">texts</text><rect x="600.6666666666666" y="522" width="269.3333333333333" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="735.3333333333333" y="560.9" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Closed book</text><text x="735.3333333333333" y="589.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">no set text in the exam</text>
