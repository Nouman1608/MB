<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 622" width="900" height="622" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="622" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">AQA’s aspects of tragedy</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Areas to explore, not a closed list</text>
<rect x="30" y="110" width="840" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AT THE CORE OF EVERY SET TEXT</text><text x="50" y="168.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A tragic hero or heroine “who is flawed in some way, who suffers and causes</text><text x="50" y="192.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">suffering to others”, and “an interplay between… villains and victims”.</text><rect x="30" y="234" width="270.6666666666667" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="282.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Type of tragedy</text><text x="44" y="309" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Classical and public, or</text><text x="44" y="329" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">domestic and ordinary.</text><rect x="314.6666666666667" y="234" width="270.6666666666667" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="328.6666666666667" y="261.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">The protagonist’s</text><text x="328.6666666666667" y="283.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">journey</text><text x="328.6666666666667" y="310" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Pride and folly, blindness and</text><text x="328.6666666666667" y="330" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">insight, discovery, good and</text><text x="328.6666666666667" y="350" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">evil.</text><rect x="599.3333333333334" y="234" width="270.6666666666667" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="613.3333333333334" y="282.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Villain and victim</text><text x="613.3333333333334" y="309" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">A contest of power; the villain</text><text x="613.3333333333334" y="329" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">is “partly” responsible.</text><rect x="30" y="380" width="270.6666666666667" height="94" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="418.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Fate</text><text x="44" y="445" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Is the hero’s end inevitable?</text><rect x="314.6666666666667" y="380" width="270.6666666666667" height="94" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="328.6666666666667" y="418.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Effect on the world</text><text x="328.6666666666667" y="445" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Chaos spreads beyond the hero.</text><rect x="599.3333333333334" y="380" width="270.6666666666667" height="94" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="613.3333333333334" y="407.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Violence, revenge,</text><text x="613.3333333333334" y="429.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">humour, happiness</text><text x="613.3333333333334" y="456" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Happiness defines what is lost.</text><rect x="30" y="486" width="270.6666666666667" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="523.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Structure</text><text x="44" y="550" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Complication to catastrophe;</text><text x="44" y="570" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">plots and sub-plots.</text><rect x="314.6666666666667" y="486" width="270.6666666666667" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="328.6666666666667" y="513.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Language and audience</text><text x="328.6666666666667" y="540" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">“Through pity and fear to an</text><text x="328.6666666666667" y="560" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">understanding of the human</text><text x="328.6666666666667" y="580" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">condition”.</text><rect x="599.3333333333334" y="486" width="270.6666666666667" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="613.3333333333334" y="523.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Absence</text><text x="613.3333333333334" y="550" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">A missing aspect can be as</text><text x="613.3333333333334" y="570" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">significant as its presence.</text>
</svg>