<line x1="70" y1="234" x2="830" y2="234" stroke="#1e2a44" stroke-width="4" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="60" y="276" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Classical, public figures</text><text x="840" y="276" font-size="18" font-weight="700" fill="#b5602e" text-anchor="end">Domestic, ordinary people</text><circle cx="114" cy="234" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><line x1="114" y1="223" x2="114" y2="210" stroke="#1e2a44" stroke-width="2.5"/><g transform="translate(0,122)"><rect x="30" y="0" width="240" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="150" y="25.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">King Lear</text><text x="150" y="52" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">AQA’s example of classical</text><text x="150" y="72" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">tragedy</text></g><circle cx="450" cy="234" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="450" y1="245" x2="450" y2="304" stroke="#1e2a44" stroke-width="2.5"/><g transform="translate(0,304)"><rect x="330" y="0" width="240" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="25.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Othello</text><text x="450" y="52" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">a general’s tragedy played</text><text x="450" y="72" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">out in a marriage</text></g><circle cx="786" cy="234" r="11" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><line x1="786" y1="223" x2="786" y2="210" stroke="#1e2a44" stroke-width="2.5"/><g transform="translate(0,122)"><rect x="630" y="0" width="240" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="750" y="25.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Tess</text><text x="750" y="52" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">AQA’s example of domestic</text><text x="750" y="72" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">tragedy</text></g><rect x="30" y="410" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="443.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Most of your texts sit somewhere between the two ends: ask where, and what difference it</text><text x="50" y="465.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">makes.</text>
</svg>