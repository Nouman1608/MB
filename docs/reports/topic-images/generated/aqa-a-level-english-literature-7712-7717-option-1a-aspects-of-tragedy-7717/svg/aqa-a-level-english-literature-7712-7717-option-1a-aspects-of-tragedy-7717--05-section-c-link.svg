<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 734" width="900" height="734" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="734" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Connecting two tragedies</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">“In tragedy, the victims are always more interesting than the villains.”</text>
<rect x="30" y="120" width="400" height="52" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="230" y="153" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" font-style="italic">Tess of the D’Urbervilles</text><rect x="470" y="120" width="400" height="52" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="670" y="153" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" font-style="italic">Death of a Salesman</text><rect x="30" y="184" width="840" height="69" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="210" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Shared ground</text><text x="50" y="234" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Domestic tragedy of ordinary people: the villain is less a person than a system</text><rect x="30" y="263" width="400" height="67" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="287" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">The villain</text><text x="46" y="311" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Alec: a clear villain</text><rect x="470" y="263" width="400" height="67" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="486" y="287" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">The villain</text><text x="486" y="311" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No single villain</text><line x1="434" y1="296.5" x2="466" y2="296.5" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="340" width="400" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="364" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">The system</text><text x="46" y="388" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Angel’s rejection and the social code that</text><text x="46" y="409" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">judges her</text><rect x="470" y="340" width="400" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="486" y="364" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">The system</text><text x="486" y="388" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Howard’s dismissal and the dream of success</text><line x1="434" y1="384" x2="466" y2="384" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="438" width="400" height="67" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="462" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Context</text><text x="46" y="486" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Victorian sexual morality</text><rect x="470" y="438" width="400" height="67" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="486" y="462" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Context</text><text x="486" y="486" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Post-war American capitalism</text><line x1="434" y1="471.5" x2="466" y2="471.5" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="515" width="400" height="67" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="539" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Interpretation</text><text x="46" y="563" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A feminist reading of Tess</text><rect x="470" y="515" width="400" height="67" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="486" y="539" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Interpretation</text><text x="486" y="563" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Miller’s defence of the common man as tragic</text><line x1="434" y1="548.5" x2="466" y2="548.5" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="598" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="634" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Line of argument</text><text x="50" y="663.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Argue that both texts make the victim more interesting because villainy is diffused into</text><text x="50" y="685.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">society; then weigh the counter-view that Alec is a vivid, deliberate creation.</text>
</svg>