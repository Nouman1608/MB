<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 724" width="900" height="724" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="724" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading a tragic passage</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Argument: blindness at the moment he believes he sees most clearly</text>
<rect x="30" y="110" width="300" height="137" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THE PASSAGE</text><text x="50" y="169.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Othello’s speech before</text><text x="50" y="194.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">the murder</text><text x="50" y="222.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Act 5 Scene 2</text><rect x="380" y="110" width="490" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="394" y="138.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">“put out the light”</text><text x="394" y="166.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The candle becomes Desdemona’s life: light can be relit,</text><text x="394" y="187.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">life cannot.</text><path d="M330,178.5 C355,178.5 355,158 376,158" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="380" y="216" width="490" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="394" y="244.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Blindness and insight</text><text x="394" y="272.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">He grasps that death is irreversible, but not his own</text><text x="394" y="293.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">error.</text><path d="M330,178.5 C355,178.5 355,264 376,264" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="380" y="322" width="490" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="394" y="350.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Contest of power</text><text x="394" y="378.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">He believes he acts as justice, not as a jealous</text><text x="394" y="399.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">husband: Iago has won.</text><path d="M330,178.5 C355,178.5 355,370 376,370" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="450" y="450" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Reach outward from memory</text><rect x="30" y="466" width="270.6666666666667" height="94" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="165.33333333333334" y="493.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Earlier</text><text x="165.33333333333334" y="520.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Othello’s confidence in his</text><text x="165.33333333333334" y="541.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">own judgement</text><rect x="314.6666666666667" y="466" width="270.6666666666667" height="94" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="493.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Iago’s soliloquies</text><text x="450" y="520.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">The villain’s contest of</text><text x="450" y="541.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">power</text><rect x="599.3333333333334" y="466" width="270.6666666666667" height="94" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="734.6666666666667" y="493.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Later</text><text x="734.6666666666667" y="520.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">The final speech: recognition</text><text x="734.6666666666667" y="541.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">too late</text><text x="450" y="598" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">AO5: a debate the passage supports</text><path d="M450,634 L432,704 L468,704 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><line x1="330" y1="634" x2="570" y2="634" stroke="#1e2a44" stroke-width="5" stroke-linecap="round"/><line x1="330" y1="634" x2="306" y2="668" stroke="#1e2a44" stroke-width="2"/><line x1="330" y1="634" x2="354" y2="668" stroke="#1e2a44" stroke-width="2"/><path d="M298,668 L362,668 Q330,686 298,668 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><line x1="570" y1="634" x2="546" y2="668" stroke="#1e2a44" stroke-width="2"/><line x1="570" y1="634" x2="594" y2="668" stroke="#1e2a44" stroke-width="2"/><path d="M538,668 L602,668 Q570,686 538,668 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="634" r="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="620" width="250" height="46" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="155" y="647.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Noble even here</text><rect x="620" y="620" width="250" height="46" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="745" y="647.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Self-deception</text>
</svg>