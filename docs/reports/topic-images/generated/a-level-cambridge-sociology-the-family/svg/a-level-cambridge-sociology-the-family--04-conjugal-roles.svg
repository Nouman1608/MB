<text x="450" y="132" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Conjugal roles: four areas of division between partners</text><rect x="30" y="152" width="201" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,202 L31.25,166.25 Q31.25,153.25 44.25,153.25 L216.75,153.25 Q229.75,153.25 229.75,166.25 L229.75,202 Z" fill="#b5d3cf"/><line x1="31.25" y1="202" x2="229.75" y2="202" stroke="#c9d6d4" stroke-width="2"/><text x="130.5" y="182.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Housework</text><text x="44" y="234.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Who does the</text><text x="44" y="256.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">domestic labour?</text><rect x="243" y="152" width="201" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M244.25,202 L244.25,166.25 Q244.25,153.25 257.25,153.25 L429.75,153.25 Q442.75,153.25 442.75,166.25 L442.75,202 Z" fill="#b5d3cf"/><line x1="244.25" y1="202" x2="442.75" y2="202" stroke="#c9d6d4" stroke-width="2"/><text x="343.5" y="182.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Childcare</text><text x="257" y="234.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Who looks after the</text><text x="257" y="256.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">children?</text><rect x="456" y="152" width="201" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M457.25,202 L457.25,166.25 Q457.25,153.25 470.25,153.25 L642.75,153.25 Q655.75,153.25 655.75,166.25 L655.75,202 Z" fill="#b5d3cf"/><line x1="457.25" y1="202" x2="655.75" y2="202" stroke="#c9d6d4" stroke-width="2"/><text x="556.5" y="182.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Power</text><text x="470" y="234.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Who makes the</text><text x="470" y="256.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">decisions?</text><rect x="669" y="152" width="201" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M670.25,202 L670.25,166.25 Q670.25,153.25 683.25,153.25 L855.75,153.25 Q868.75,153.25 868.75,166.25 L868.75,202 Z" fill="#b5d3cf"/><line x1="670.25" y1="202" x2="868.75" y2="202" stroke="#c9d6d4" stroke-width="2"/><text x="769.5" y="182.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Emotion work</text><text x="683" y="234.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Who manages the</text><text x="683" y="256.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">family’s emotional</text><text x="683" y="278.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">life?</text><text x="450" y="346" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Three feminist strands, three different explanations of inequality and power</text><rect x="30" y="364" width="268" height="56" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="164" y="399" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Liberal feminist</text><rect x="316" y="364" width="268" height="56" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="399" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Radical feminist</text><rect x="602" y="364" width="268" height="56" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="736" y="399" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Marxist feminist</text><rect x="30" y="446" width="840" height="70" rx="35" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="70" y="489" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Positive experience</text><text x="830" y="489" font-size="18" font-weight="700" fill="#b5602e" text-anchor="end">Negative experience</text><line x1="320" y1="482" x2="580" y2="482" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="580" y1="482" x2="320" y2="482" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="450" y="472" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">a live debate</text>
