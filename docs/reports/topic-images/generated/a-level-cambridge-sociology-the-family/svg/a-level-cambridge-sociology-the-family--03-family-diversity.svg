<text x="450" y="128" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Family and household forms</text><rect x="30" y="146" width="160" height="54" rx="27" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="110" y="180" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Nuclear</text><rect x="200" y="146" width="160" height="54" rx="27" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="280" y="180" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Extended</text><rect x="370" y="146" width="160" height="54" rx="27" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="450" y="180" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Lone-parent</text><rect x="540" y="146" width="160" height="54" rx="27" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="620" y="180" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Reconstituted</text><rect x="710" y="146" width="160" height="54" rx="27" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="790" y="180" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Single-person</text><text x="450" y="230" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">also same-sex families and families of choice, where taught locally</text><text x="450" y="268" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle">Dimensions of diversity: organisational, cultural, class</text><rect x="30" y="296" width="404" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,346 L31.25,310.25 Q31.25,297.25 44.25,297.25 L419.75,297.25 Q432.75,297.25 432.75,310.25 L432.75,346 Z" fill="#f2e7b8"/><line x1="31.25" y1="346" x2="432.75" y2="346" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="326.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">New Right</text><rect x="466" y="296" width="404" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,346 L467.25,310.25 Q467.25,297.25 480.25,297.25 L855.75,297.25 Q868.75,297.25 868.75,310.25 L868.75,346 Z" fill="#b5d3cf"/><line x1="467.25" y1="346" x2="868.75" y2="346" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="326.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Postmodernist</text><text x="232" y="392" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle">Growing diversity is a <tspan font-weight="700">social problem</tspan></text><text x="668" y="392" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle">Growing diversity shows <tspan font-weight="700">greater</tspan></text><text x="668" y="417" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700">individual choice</tspan></text><circle cx="450" cy="371" r="24" fill="#1e2a44"/><text x="450" y="378" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">vs</text><rect x="30" y="466" width="840" height="119" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="502" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Also examine</text><circle cx="61" cy="525.39" r="4.5" fill="#8a6d0d"/><text x="74" y="531" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">How far diversity has gone: is the nuclear family still dominant?</text><circle cx="61" cy="555.39" r="4.5" fill="#8a6d0d"/><text x="74" y="561" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The state and social policy actively shape family form</text>
