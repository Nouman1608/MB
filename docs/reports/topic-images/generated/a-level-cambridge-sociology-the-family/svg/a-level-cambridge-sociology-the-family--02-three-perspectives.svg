<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 494" width="900" height="494" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="494" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What does the family do, and for whom?</text>

<rect x="30" y="108" width="269.3333333333333" height="296" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,158 L31.25,122.25 Q31.25,109.25 44.25,109.25 L285.0833333333333,109.25 Q298.0833333333333,109.25 298.0833333333333,122.25 L298.0833333333333,158 Z" fill="#b5d3cf"/><line x1="31.25" y1="158" x2="298.0833333333333" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="138.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Functionalist</text><text x="44" y="190.15" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">Benefits members and</text><text x="44" y="212.15" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">society</text><circle cx="49" cy="234.54" r="4.5" fill="#2e6b62"/><text x="62" y="240.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Functions of the family</text><text x="62" y="262.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">have changed over time</text><circle cx="49" cy="286.53999999999996" r="4.5" fill="#2e6b62"/><text x="62" y="292.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Loss of functions:</tspan> schools</text><text x="62" y="314.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and the welfare state have</text><text x="62" y="336.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">taken over roles the</text><text x="62" y="358.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">family once performed</text><text x="62" y="380.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">alone</text><rect x="315.3333333333333" y="108" width="269.3333333333333" height="296" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,158 L316.5833333333333,122.25 Q316.5833333333333,109.25 329.5833333333333,109.25 L570.4166666666666,109.25 Q583.4166666666666,109.25 583.4166666666666,122.25 L583.4166666666666,158 Z" fill="#dce9e7"/><line x1="316.5833333333333" y1="158" x2="583.4166666666666" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="138.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Marxist</text><text x="329.3333333333333" y="190.15" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">Benefits capitalism</text><circle cx="334.3333333333333" cy="212.54" r="4.5" fill="#2e6b62"/><text x="347.3333333333333" y="218.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Ideological control</tspan></text><circle cx="334.3333333333333" cy="242.54" r="4.5" fill="#2e6b62"/><text x="347.3333333333333" y="248.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Reproduction of labour:</tspan></text><text x="347.3333333333333" y="270.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">raising the next</text><text x="347.3333333333333" y="292.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">generation of workers</text><circle cx="334.3333333333333" cy="316.53999999999996" r="4.5" fill="#2e6b62"/><text x="347.3333333333333" y="322.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Consumption:</tspan> the family as</text><text x="347.3333333333333" y="344.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">a unit that buys goods</text><rect x="600.6666666666666" y="108" width="269.3333333333333" height="296" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,158 L601.9166666666666,122.25 Q601.9166666666666,109.25 614.9166666666666,109.25 L855.75,109.25 Q868.75,109.25 868.75,122.25 L868.75,158 Z" fill="#f2e7b8"/><line x1="601.9166666666666" y1="158" x2="868.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="138.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Feminist</text><text x="614.6666666666666" y="190.15" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">Challenges both</text><circle cx="619.6666666666666" cy="212.54" r="4.5" fill="#2e6b62"/><text x="632.6666666666666" y="218.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Both treat the family as</text><text x="632.6666666666666" y="240.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">broadly beneficial</text><circle cx="619.6666666666666" cy="264.53999999999996" r="4.5" fill="#2e6b62"/><text x="632.6666666666666" y="270.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Both overlook inequality</text><text x="632.6666666666666" y="292.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">within the family</text><path d="M735,412 C735,454 165,454 165,414" fill="none" stroke="#b5602e" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ahR)"/><path d="M735,412 C735,444 450,444 450,414" fill="none" stroke="#b5602e" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ahR)"/><text x="600" y="468" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">feminist critique</text>
</svg>