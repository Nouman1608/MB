<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How Paper 2 is assessed</text>

<rect x="30" y="108" width="201" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="130" y="158" font-size="25" font-weight="700" fill="#2e6b62" text-anchor="middle">60 marks</text><rect x="243" y="108" width="201" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="343" y="158" font-size="25" font-weight="700" fill="#2e6b62" text-anchor="middle">1 h 30 min</text><rect x="456" y="108" width="201" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="556" y="145" font-size="25" font-weight="700" fill="#2e6b62" text-anchor="middle">50%</text><text x="556" y="174" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">of AS</text><rect x="669" y="108" width="201" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="769" y="145" font-size="25" font-weight="700" fill="#2e6b62" text-anchor="middle">25%</text><text x="769" y="174" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">of A Level</text><rect x="30" y="216" width="410" height="214" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M31.25,275.25 L31.25,231.25 Q31.25,217.25 45.25,217.25 L424.75,217.25 Q438.75,217.25 438.75,231.25 L438.75,275.25 Z" fill="#b5d3cf"/><text x="235" y="254" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Section A</text><text x="235" y="304" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Three compulsory questions</text><text x="54" y="340" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Emphasis</text><rect x="54" y="352" width="114" height="56" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="111" y="386" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">AO1</text><rect x="178" y="352" width="114" height="56" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="235" y="386" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">AO2</text><rect x="302" y="352" width="114" height="56" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="359" y="386" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">AO3</text><rect x="460" y="216" width="410" height="214" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M461.25,275.25 L461.25,231.25 Q461.25,217.25 475.25,217.25 L854.75,217.25 Q868.75,217.25 868.75,231.25 L868.75,275.25 Z" fill="#f2e7b8"/><text x="665" y="254" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Section B</text><text x="665" y="304" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">One essay (26 marks) chosen from two</text><text x="484" y="340" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Emphasis</text><rect x="484" y="352" width="114" height="56" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="541" y="386" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">AO1</text><rect x="608" y="352" width="114" height="56" rx="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="665" y="386" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">AO2</text><rect x="732" y="352" width="114" height="56" rx="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="789" y="386" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">AO3</text><rect x="30" y="448" width="22" height="18" rx="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="62" y="463" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">main emphasis</text><rect x="230" y="448" width="22" height="18" rx="4" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="262" y="463" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">less emphasis</text><rect x="30" y="486" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="522" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">AO3 in the essay</text><text x="56" y="551" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Explain the strengths and limitations of the perspectives in 3.1 and 4.1 and reach a reasoned</text><text x="56" y="573" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">conclusion, not a description of each perspective in turn.</text>
