<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From practical hours to the investigation</text>

<text x="450" y="140" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Experimental programme: 50 hours, SL and HL</text><text x="50" y="192" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start"></text><rect x="50" y="160" width="480" height="60" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="290" y="196" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">30 h</text><rect x="530" y="160" width="160" height="60" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="610" y="196" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">10 h</text><rect x="690" y="160" width="160" height="60" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="770" y="196" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">10 h</text><text x="610" y="244" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">collaborative project</text><text x="610" y="263" font-size="15" font-weight="600" fill="#b5602e" text-anchor="middle">not separately graded</text><text x="770" y="244" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">scientific</text><text x="770" y="263" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">investigation</text><text x="290" y="244" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">practical work</text><line x1="450" y1="272" x2="450" y2="310" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="462" y="298" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">builds data-handling and investigative skills for</text><rect x="30" y="316" width="840" height="72" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="350" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Individual investigation (internally assessed)</text><text x="450" y="374" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">written up as an evidence-based report capped at 3,000 words</text><rect x="30" y="414" width="840" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="453.5" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="461.42" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="120" y="448" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Draft a clear, testable research question early</text><text x="120" y="474" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">and check it against the assessment criteria before collecting data</text><line x1="76" y1="494" x2="76" y2="512" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="513" width="840" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="552" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="76" y="559.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="120" y="559" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Gather and analyse data to answer it</text><line x1="76" y1="592" x2="76" y2="610" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="611" width="840" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="76" cy="650.5" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="76" y="658.42" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="120" y="645" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Write the evidence-based report</text><text x="120" y="671" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">within the 3,000-word cap</text>
</svg>