<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 781" width="900" height="781" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="781" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Class divisions in the UK</text>

<rect x="210" y="112" width="480" height="100" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Upper class</text><text x="450" y="172" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">Aristocracy, owners of large businesses, the very</text><text x="450" y="192" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">wealthy: inherited wealth, land and capital, private</text><text x="450" y="212" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">education</text><rect x="120" y="222" width="660" height="100" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="256" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Middle class</text><text x="450" y="282" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">Professionals, managers, white collar workers: non-manual work,</text><text x="450" y="302" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">qualifications, salaries and career ladders</text><rect x="30" y="332" width="840" height="100" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="366" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Working class</text><text x="450" y="392" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">Manual workers, skilled and unskilled: wages, traditionally linked to industry, more job insecurity</text><rect x="30" y="442" width="840" height="70" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2" stroke-dasharray="8 6"/><text x="450" y="474" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle">Underclass (disputed)</text><text x="450" y="498" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">outside regular paid work for long periods; a term used by Murray</text><text x="450" y="526" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Two ideas about change between classes</text><rect x="30" y="534" width="412" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,584 L31.25,548.25 Q31.25,535.25 44.25,535.25 L427.75,535.25 Q440.75,535.25 440.75,548.25 L440.75,584 Z" fill="#b5d3cf"/><line x1="31.25" y1="584" x2="440.75" y2="584" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="564.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">↑ Embourgeoisement</text><text x="44" y="615.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Affluent manual workers take on middle-class</text><text x="44" y="636.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">lifestyles and values. Devine’s study does not</text><text x="44" y="657.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">support it.</text><rect x="458" y="534" width="412" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,584 L459.25,548.25 Q459.25,535.25 472.25,535.25 L855.75,535.25 Q868.75,535.25 868.75,548.25 L868.75,584 Z" fill="#f2e7b8"/><line x1="459.25" y1="584" x2="868.75" y2="584" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="564.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">↓ Proletarianisation</text><text x="472" y="615.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Some white collar workers lose status, pay and</text><text x="472" y="636.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">control, so their position comes closer to the</text><text x="472" y="657.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">working class.</text><rect x="30" y="697" width="840" height="60" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="733" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Class is an <tspan font-weight="700">open</tspan> system: social mobility is possible, unlike caste or slavery.</text>
</svg>