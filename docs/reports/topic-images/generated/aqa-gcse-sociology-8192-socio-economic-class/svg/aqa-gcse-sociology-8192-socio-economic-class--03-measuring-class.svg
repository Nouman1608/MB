<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 703" width="900" height="703" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="703" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How class is measured</text>

<rect x="30" y="118" width="390" height="127" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="225" y="160.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1911</text><text x="225" y="190.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Registrar General’s scale: jobs ranked from</text><text x="225" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">professional to unskilled manual</text><line x1="424" y1="181.5" x2="476" y2="181.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="480" y="118" width="390" height="127" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="675" y="150.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2001 onwards</text><text x="675" y="180.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">NS-SEC: occupations grouped by employment</text><text x="675" y="201.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">relations: security, promotion prospects,</text><text x="675" y="222.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">control over work</text><rect x="30" y="269" width="412" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,319 L31.25,283.25 Q31.25,270.25 44.25,270.25 L427.75,270.25 Q440.75,270.25 440.75,283.25 L440.75,319 Z" fill="#ffffff"/><line x1="31.25" y1="319" x2="440.75" y2="319" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="299.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Why occupation works</text><text x="44" y="351.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Practical: people know their job title</text><rect x="458" y="269" width="412" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,319 L459.25,283.25 Q459.25,270.25 472.25,270.25 L855.75,270.25 Q868.75,270.25 868.75,283.25 L868.75,319 Z" fill="#ffffff"/><line x1="459.25" y1="319" x2="868.75" y2="319" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="299.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">What it misses</text><text x="472" y="351.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Wealth from property or shares; people not in</text><text x="472" y="373.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">paid work</text><text x="450" y="427" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Objective class vs subjective class</text><rect x="30" y="445" width="412" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,495 L31.25,459.25 Q31.25,446.25 44.25,446.25 L427.75,446.25 Q440.75,446.25 440.75,459.25 L440.75,495 Z" fill="#f2e7b8"/><line x1="31.25" y1="495" x2="440.75" y2="495" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="475.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Well-paid electrician</text><text x="44" y="527.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">May see themselves as <tspan font-weight="700">working class</tspan></text><rect x="458" y="445" width="412" height="106" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,495 L459.25,459.25 Q459.25,446.25 472.25,446.25 L855.75,446.25 Q868.75,446.25 868.75,459.25 L868.75,495 Z" fill="#f2e7b8"/><line x1="459.25" y1="495" x2="868.75" y2="495" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="475.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Routine office worker</text><text x="472" y="527.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">May describe themselves as <tspan font-weight="700">middle class</tspan></text><rect x="30" y="567" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="61" cy="597.39" r="4.5" fill="#8a6d0d"/><text x="74" y="603" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Subjective class:</tspan> the class a person believes they belong to</text><circle cx="61" cy="627.39" r="4.5" fill="#8a6d0d"/><text x="74" y="633" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Class alignment:</tspan> voting for the party linked with your class; <tspan font-weight="700">dealignment:</tspan> that link</text><text x="74" y="655" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">weakening</text>
</svg>