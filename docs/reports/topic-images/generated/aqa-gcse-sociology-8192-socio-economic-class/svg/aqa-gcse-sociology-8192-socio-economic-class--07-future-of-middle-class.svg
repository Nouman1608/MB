<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 641" width="900" height="641" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="641" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Marx and Weber: what happens to the middle?</text>

<rect x="30" y="108" width="404" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,158 L31.25,122.25 Q31.25,109.25 44.25,109.25 L419.75,109.25 Q432.75,109.25 432.75,122.25 L432.75,158 Z" fill="#b5d3cf"/><line x1="31.25" y1="158" x2="432.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="138.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Marx: polarisation</text><rect x="466" y="108" width="404" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,158 L467.25,122.25 Q467.25,109.25 480.25,109.25 L855.75,109.25 Q868.75,109.25 868.75,122.25 L868.75,158 Z" fill="#f2e7b8"/><line x1="467.25" y1="158" x2="868.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="138.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Weber: middle class expands</text><rect x="80" y="190" width="304" height="60" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="232" y="228" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Bourgeoisie</text><rect x="182" y="262" width="100" height="24" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="232" y="280" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="middle">middle</text><rect x="80" y="298" width="304" height="90" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="232" y="350" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Proletariat</text><line x1="150" y1="274" x2="176" y2="274" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><line x1="314" y1="274" x2="288" y2="274" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="232" y="420" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">The gap grows; the middle is squeezed;</text><text x="232" y="441" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">revolution expected</text><rect x="560" y="190" width="216" height="40" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="668" y="216" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Owners</text><rect x="510" y="238" width="316" height="82" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="668" y="272" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Professionals, managers</text><text x="668" y="298" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">skills in demand</text><rect x="540" y="328" width="256" height="60" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="668" y="364" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Manual workers</text><line x1="500" y1="279" x2="476" y2="279" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><line x1="836" y1="279" x2="860" y2="279" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><text x="668" y="420" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Several classes; the middle grows; revolution</text><text x="668" y="441" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">not inevitable</text><rect x="30" y="506" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="542" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Both criticised</text><text x="56" y="571" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">New Right theorists accuse both Marx and Weber of bias and of ignoring the social mobility</text><text x="56" y="593" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">capitalism creates.</text>
</svg>