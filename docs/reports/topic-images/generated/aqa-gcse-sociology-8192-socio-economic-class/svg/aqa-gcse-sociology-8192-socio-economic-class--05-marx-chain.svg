<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1029" width="900" height="1029" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="1029" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Marx: how capitalism works, and where it leads</text>

<rect x="30" y="104" width="840" height="95" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="151.5" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="159.06" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="104" y="143.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Exploitation</text><text x="104" y="172.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Workers produce more value than their wages; owners keep the difference as profit</text><line x1="450" y1="203" x2="450" y2="239" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="245" width="840" height="116" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="303" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="310.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="104" y="284.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Ruling class ideology</text><text x="104" y="313.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ideas such as “the free market” make capitalism look normal and natural; political power</text><text x="104" y="334.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">comes from economic power</text><line x1="450" y1="365" x2="450" y2="401" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="407" width="840" height="95" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="454.5" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="462.06" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="104" y="446.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">False class consciousness</text><text x="104" y="475.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Workers who accept the status quo are victims of ideology</text><line x1="450" y1="506" x2="450" y2="542" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="548" width="840" height="95" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="595.5" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="603.06" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="104" y="587.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Class struggle and polarisation</text><text x="104" y="616.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Conflict drives change; the gap between bourgeoisie and proletariat grows</text><line x1="450" y1="647" x2="450" y2="683" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="689" width="840" height="95" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="67" cy="736.5" r="21" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="67" y="744.06" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="104" y="728.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Proletarian revolution</text><text x="104" y="757.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Expected to create a communist, classless society</text><rect x="30" y="802" width="840" height="201" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="838" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluation</text><circle cx="61" cy="861.39" r="4.5" fill="#8a6d0d"/><text x="74" y="867" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The middle class grew rather than disappeared; no proletarian revolution in Britain</text><circle cx="61" cy="891.39" r="4.5" fill="#8a6d0d"/><text x="74" y="897" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Some still see Marx as the best explanation, given persistent wealth gaps</text><circle cx="61" cy="921.39" r="4.5" fill="#8a6d0d"/><text x="74" y="927" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">New Right: capitalism brings benefits and social mobility</text><circle cx="61" cy="951.39" r="4.5" fill="#8a6d0d"/><text x="74" y="957" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Smaller groups: <tspan font-weight="700">petty bourgeoisie</tspan> (small business owners), <tspan font-weight="700">lumpenproletariat</tspan> (outside</text><text x="74" y="979" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">regular work)</text>
</svg>