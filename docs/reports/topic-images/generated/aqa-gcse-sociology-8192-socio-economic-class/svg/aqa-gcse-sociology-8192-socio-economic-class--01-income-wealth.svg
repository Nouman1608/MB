<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 532" width="900" height="532" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="532" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Income or wealth?</text>

<rect x="30" y="108" width="404" height="404" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,159 L31.25,122.25 Q31.25,109.25 44.25,109.25 L419.75,109.25 Q432.75,109.25 432.75,122.25 L432.75,159 Z" fill="#b5d3cf"/><line x1="31.25" y1="159" x2="432.75" y2="159" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="139.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Income: a FLOW</text><rect x="466" y="108" width="404" height="404" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,159 L467.25,122.25 Q467.25,109.25 480.25,109.25 L855.75,109.25 Q868.75,109.25 868.75,122.25 L868.75,159 Z" fill="#f2e7b8"/><line x1="467.25" y1="159" x2="868.75" y2="159" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="139.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Wealth: a STOCK</text><line x1="90" y1="236" x2="330" y2="210" stroke="#2e6b62" stroke-width="5" marker-end="url(#ahT)"/><line x1="90" y1="270" x2="330" y2="244" stroke="#2e6b62" stroke-width="5" marker-end="url(#ahT)"/><line x1="90" y1="304" x2="330" y2="278" stroke="#2e6b62" stroke-width="5" marker-end="url(#ahT)"/><text x="232" y="216" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">money over time</text><text x="232" y="346" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Wages, benefits, rent received</text><rect x="52" y="396" width="360" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="68" y="428" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">A footballer</tspan> may have a high income but</text><text x="68" y="449" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">little wealth if they spend it all</text><rect x="504" y="270" width="112" height="42" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="560" y="297" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="middle">property</text><rect x="624" y="270" width="112" height="42" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="680" y="297" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="middle">land</text><rect x="564" y="226" width="112" height="42" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="620" y="253" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="middle">shares</text><rect x="564" y="182" width="112" height="42" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="620" y="209" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="middle">savings</text><text x="668" y="346" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Assets owned: property, land, shares,</text><text x="668" y="368" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">savings</text><rect x="488" y="396" width="360" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="504" y="428" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">An aristocratic family</tspan> may own great</text><text x="504" y="449" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">wealth in land while drawing a modest</text><text x="504" y="470" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">income</text>
</svg>