<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 579" width="900" height="579" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="579" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Marx: a theory of history</text>

<rect x="30" y="130" width="195" height="150" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><circle cx="58" cy="160" r="16" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="58" y="165.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="82" y="156" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Primitive</text><text x="82" y="178" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">communism</text><text x="44" y="212" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">No private property,</text><text x="44" y="232" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">no classes</text><line x1="227" y1="205" x2="243" y2="205" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="245" y="130" width="195" height="150" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="273" cy="160" r="16" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="273" y="165.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="297" y="156" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Ancient</text><text x="297" y="178" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">society</text><text x="259" y="212" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Based on slavery</text><line x1="442" y1="205" x2="458" y2="205" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="460" y="130" width="195" height="150" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="488" cy="160" r="16" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="488" y="165.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="512" y="156" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Feudal society</text><text x="474" y="212" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Lords own land; serfs</text><text x="474" y="232" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">work it</text><line x1="657" y1="205" x2="673" y2="205" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="675" y="130" width="195" height="150" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="703" cy="160" r="16" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="703" y="165.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="727" y="156" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Capitalism</text><text x="689" y="212" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">Bourgeoisie own the</text><text x="689" y="232" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">means of production;</text><text x="689" y="252" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">proletariat sell</text><text x="689" y="272" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">their labour</text><line x1="40" y1="108" x2="860" y2="108" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><text x="450" y="100" font-size="15.5" font-weight="700" fill="#2e6b62" text-anchor="middle">Western society, epoch by epoch</text><text x="450" y="308" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">How classes first appeared</text><rect x="30" y="320" width="253.33333333333334" height="106" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="156.66666666666669" y="352.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Agriculture develops</text><text x="156.66666666666669" y="382.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Surplus wealth and private</text><text x="156.66666666666669" y="403.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">property appear</text><line x1="287.33333333333337" y1="373" x2="319.33333333333337" y2="373" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="320" width="253.33333333333334" height="106" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450.00000000000006" y="352.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">A ruling class</text><text x="450.00000000000006" y="382.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Non-producers take control</text><text x="450.00000000000006" y="403.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">of the means of production</text><line x1="580.6666666666667" y1="373" x2="612.6666666666667" y2="373" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="320" width="253.33333333333334" height="106" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="743.3333333333334" y="352.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">A subject class</text><text x="743.3333333333334" y="382.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Obliged to work for the</text><text x="743.3333333333334" y="403.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">ruling class</text><rect x="30" y="444" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="480" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Means of production</text><text x="56" y="509" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Land, capital, labour power, buildings and machinery. Stratification comes from each group’s</text><text x="56" y="531" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">relationship to them.</text>
</svg>