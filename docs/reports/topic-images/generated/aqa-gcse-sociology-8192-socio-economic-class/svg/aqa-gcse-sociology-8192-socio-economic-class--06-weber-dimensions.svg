<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 558" width="900" height="558" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="558" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Weber: class, status and party</text>

<rect x="30" y="122" width="269.3333333333333" height="253" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,172 L31.25,136.25 Q31.25,123.25 44.25,123.25 L285.0833333333333,123.25 Q298.0833333333333,123.25 298.0833333333333,136.25 L298.0833333333333,172 Z" fill="#b5d3cf"/><line x1="31.25" y1="172" x2="298.0833333333333" y2="172" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="152.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Class</text><text x="44" y="203.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Shared economic position</text><circle cx="49" cy="224.92" r="4.5" fill="#2e6b62"/><text x="62" y="230.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Defined by <tspan font-weight="700">market situation</tspan>:</text><text x="62" y="251.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">skills, pay, conditions</text><circle cx="49" cy="274.92" r="4.5" fill="#2e6b62"/><text x="62" y="280.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Shared life chances</text><circle cx="49" cy="303.92" r="4.5" fill="#2e6b62"/><text x="62" y="309.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Professionals earn more</text><text x="62" y="330.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">because their services are</text><text x="62" y="351.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">in demand</text><rect x="315.3333333333333" y="122" width="269.3333333333333" height="253" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,172 L316.5833333333333,136.25 Q316.5833333333333,123.25 329.5833333333333,123.25 L570.4166666666666,123.25 Q583.4166666666666,123.25 583.4166666666666,136.25 L583.4166666666666,172 Z" fill="#f2e7b8"/><line x1="316.5833333333333" y1="172" x2="583.4166666666666" y2="172" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="152.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Status</text><text x="329.3333333333333" y="203.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Shared prestige or esteem</text><circle cx="334.3333333333333" cy="224.92" r="4.5" fill="#2e6b62"/><text x="347.3333333333333" y="230.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">From occupation, ethnicity,</text><text x="347.3333333333333" y="251.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">religion or lifestyle</text><circle cx="334.3333333333333" cy="274.92" r="4.5" fill="#2e6b62"/><text x="347.3333333333333" y="280.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Social closure:</tspan> excluding</text><text x="347.3333333333333" y="301.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">outsiders, e.g. the caste</text><text x="347.3333333333333" y="322.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">system</text><rect x="600.6666666666666" y="122" width="269.3333333333333" height="253" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,172 L601.9166666666666,136.25 Q601.9166666666666,123.25 614.9166666666666,123.25 L855.75,123.25 Q868.75,123.25 868.75,136.25 L868.75,172 Z" fill="#dce9e7"/><line x1="601.9166666666666" y1="172" x2="868.75" y2="172" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="152.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Party</text><text x="614.6666666666666" y="203.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Groups organised for power</text><circle cx="619.6666666666666" cy="224.92" r="4.5" fill="#2e6b62"/><text x="632.6666666666666" y="230.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Political parties, pressure</text><text x="632.6666666666666" y="251.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">groups, interest groups</text><circle cx="619.6666666666666" cy="274.92" r="4.5" fill="#2e6b62"/><text x="632.6666666666666" y="280.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Can cut across class and</text><text x="632.6666666666666" y="301.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">status</text><text x="450" y="106" font-size="18" font-weight="400" fill="#4a5568" text-anchor="middle">Three separate sources of collective action</text><rect x="30" y="393" width="840" height="141" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="429" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Where Weber agrees and disagrees with Marx</text><circle cx="61" cy="452.39" r="4.5" fill="#8a6d0d"/><text x="74" y="458" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Agrees:</tspan> the major division is between owners and non-owners</text><circle cx="61" cy="482.39" r="4.5" fill="#8a6d0d"/><text x="74" y="488" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Disagrees:</tspan> non-owners are divided by skills; no polarisation, the middle class expands;</text><text x="74" y="510" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">revolution not inevitable; political power does not derive only from economic power</text>
</svg>