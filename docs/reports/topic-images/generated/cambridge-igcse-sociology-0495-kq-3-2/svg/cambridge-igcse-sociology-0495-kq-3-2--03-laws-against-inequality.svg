<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 476" width="900" height="476" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="476" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">More legal tools against inequality</text>

<rect x="30" y="104" width="410" height="191" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MINIMUM WAGE</text><text x="50" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">UK National Minimum Wage, 1999</text><text x="50" y="191.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">+ Reduces in-work poverty; helps women and</text><text x="50" y="212.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">young workers</text><text x="50" y="241.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">− May cut jobs or hours; nothing for people</text><text x="50" y="262.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">without work</text><rect x="460" y="104" width="410" height="191" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">EQUAL OPPORTUNITIES LAWS</text><text x="480" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Discrimination made unlawful</text><text x="480" y="191.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">UK Equal Pay Act 1970</text><text x="480" y="220.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">UK Equality Act 2010</text><text x="480" y="249.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">India: reservations for Scheduled Castes and</text><text x="480" y="270.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Tribes</text><rect x="30" y="313" width="840" height="133" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="346" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">OTHER GOVERNMENT MEASURES</text><text x="50" y="372.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Conditional cash transfers</text><text x="50" y="400.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Pay poor families if they meet goals such as school attendance: Mexico’s Progresa (1997) became</text><text x="50" y="421.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">an influential model. Also affirmative action, job-creation schemes, and food or fuel subsidies.</text>
</svg>