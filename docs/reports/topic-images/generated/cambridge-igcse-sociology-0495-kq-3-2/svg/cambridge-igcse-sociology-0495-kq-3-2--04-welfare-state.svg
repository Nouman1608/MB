<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 744" width="900" height="744" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="744" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What a welfare state provides</text>

<line x1="50" y1="140" x2="850" y2="140" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><circle cx="150" cy="140" r="8" fill="#1e2a44"/><text x="150" y="172" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">childhood</text><circle cx="450" cy="140" r="8" fill="#1e2a44"/><text x="450" y="172" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">working age</text><circle cx="760" cy="140" r="8" fill="#1e2a44"/><text x="760" y="172" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">old age</text><rect x="30" y="190" width="250" height="184" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="226" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Free education</text><text x="50" y="254.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">+ Qualifications open</text><text x="50" y="275.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">routes to better jobs</text><text x="50" y="302.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">− Richer families buy</text><text x="50" y="323.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">tutoring</text><rect x="310" y="190" width="280" height="184" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="330" y="226" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Unemployment</text><text x="330" y="252" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">benefits</text><text x="330" y="280.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">+ Prevent destitution between</text><text x="330" y="301.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">jobs</text><text x="330" y="328.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">− Often low; strict</text><text x="330" y="349.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">conditions</text><rect x="620" y="190" width="250" height="184" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="640" y="226" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Pensions</text><text x="640" y="254.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">+ Reduce poverty in old</text><text x="640" y="275.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">age</text><text x="640" y="302.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">− May not keep pace with</text><text x="640" y="323.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">living costs</text><text x="450" y="412" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Across the whole life course</text><rect x="30" y="426" width="270" height="163" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="462" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Free healthcare</text><text x="50" y="490.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">+ Treatment regardless of</text><text x="50" y="511.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">income</text><text x="50" y="538.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">− Waiting times; class</text><text x="50" y="559.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">health gaps remain</text><rect x="315" y="426" width="270" height="163" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="335" y="462" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Low-cost housing</text><text x="335" y="490.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">+ Secure homes help health</text><text x="335" y="511.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and schooling</text><text x="335" y="538.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">− Shortages, waiting lists</text><rect x="600" y="426" width="270" height="163" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="620" y="462" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Universal basic</text><text x="620" y="488" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">income</text><text x="620" y="516.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">+ Removes the poverty trap</text><text x="620" y="543.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">− Very expensive; fears</text><text x="620" y="564.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">over work incentives</text><rect x="30" y="607" width="410" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="642.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Universal</text><text x="50" y="670.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">available to everyone, e.g. free schooling</text><rect x="460" y="607" width="410" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="642.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Means-tested</text><text x="480" y="670.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">only below an income level, e.g. some</text><text x="480" y="691.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">housing support</text>
</svg>