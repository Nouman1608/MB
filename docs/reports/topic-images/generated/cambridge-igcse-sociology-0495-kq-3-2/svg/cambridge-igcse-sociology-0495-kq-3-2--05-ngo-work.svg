<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 528" width="900" height="528" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="528" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four kinds of NGO work</text>

<rect x="30" y="110" width="410" height="145" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="82" cy="166" r="38" fill="#dce9e7"/><circle cx="82" cy="166" r="26" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><circle cx="82" cy="166" r="15" fill="none" stroke="#8a6d0d" stroke-width="2.5"/><rect x="122" y="110" width="318" height="123" rx="14" fill="none" stroke="none" stroke-width="2.5"/><text x="138" y="142" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Reducing poverty</text><text x="138" y="170.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Oxfam: founded in Oxford in 1942</text><text x="138" y="191.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">as a famine relief committee;</text><text x="138" y="212.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">poverty and emergency programmes</text><rect x="460" y="110" width="410" height="145" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="512" cy="166" r="38" fill="#dce9e7"/><rect x="486" y="140" width="52" height="52" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M506,148 h12 v12 h12 v12 h-12 v12 h-12 v-12 h-12 v-12 h12 z" fill="#b5602e"/><rect x="552" y="110" width="318" height="123" rx="14" fill="none" stroke="none" stroke-width="2.5"/><text x="568" y="142" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Medical assistance</text><text x="568" y="170.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Vaccination, clinics, clean water</text><text x="568" y="191.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and sanitation reduce illness that</text><text x="568" y="212.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">keeps families poor</text><rect x="30" y="270" width="410" height="145" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="82" cy="326" r="38" fill="#dce9e7"/><rect x="56" y="312" width="52" height="38" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><path d="M72,312 v-10 h20 v10" fill="none" stroke="#1e2a44" stroke-width="3"/><rect x="122" y="270" width="318" height="123" rx="14" fill="none" stroke="none" stroke-width="2.5"/><text x="138" y="302" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Promoting business</text><text x="138" y="330.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Microfinance: small loans and</text><text x="138" y="351.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">training, often for women, to</text><text x="138" y="372.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">start small businesses</text><rect x="460" y="270" width="410" height="145" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="512" cy="326" r="38" fill="#dce9e7"/><path d="M482,322 L512,306 L542,322 L512,338 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><path d="M496,330 v14 q16,10 32,0 v-14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><rect x="552" y="270" width="318" height="123" rx="14" fill="none" stroke="none" stroke-width="2.5"/><text x="568" y="302" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Improving education</text><text x="568" y="330.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Save the Children (1919, Jebb and</text><text x="568" y="351.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Buxton); building schools; paying</text><text x="568" y="372.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">girls’ school fees</text><rect x="30" y="420" width="840" height="80" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="453.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Criticisms: NGOs may create dependency, answer to donors rather than local people, lack</text><text x="50" y="475.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">coordination, or let governments avoid responsibility.</text>
</svg>