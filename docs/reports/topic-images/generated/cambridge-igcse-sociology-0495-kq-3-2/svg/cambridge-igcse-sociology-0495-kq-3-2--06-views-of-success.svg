<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 577" width="900" height="577" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="577" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Have these attempts worked?</text>

<rect x="30" y="104" width="360" height="155" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">WELFARE DOES TOO MUCH</text><text x="50" y="164" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">New Right</text><text x="50" y="192.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Creates an underclass and a dependency</text><text x="50" y="213.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">culture (Murray); target only those in</text><text x="50" y="234.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">real need (Marsland)</text><rect x="510" y="104" width="360" height="155" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="530" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WELFARE DOES TOO LITTLE</text><text x="530" y="164" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Marxist</text><text x="530" y="192.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A concession that keeps workers fit to</text><text x="530" y="213.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">be exploited and prevents revolt;</text><text x="530" y="234.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">ownership of wealth unchanged</text><line x1="398" y1="181.5" x2="502" y2="181.5" stroke="#1e2a44" stroke-width="4" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="450" y="167.5" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">opposite</text><text x="450" y="211.5" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">criticisms</text><rect x="30" y="277" width="270.6666666666667" height="172" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="312.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Culture of poverty</text><text x="50" y="340.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Lewis: fatalistic values</text><text x="50" y="361.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">passed on, so cash alone</text><text x="50" y="382.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">cannot end poverty. Reply:</text><text x="50" y="403.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the values react to</text><text x="50" y="424.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">poverty.</text><rect x="314.6666666666667" y="277" width="270.6666666666667" height="172" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334.6666666666667" y="312.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Feminist</text><text x="334.6666666666667" y="340.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Equal pay laws have not</text><text x="334.6666666666667" y="361.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">closed the gap; laws cannot</text><text x="334.6666666666667" y="382.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reach unpaid care; male</text><text x="334.6666666666667" y="403.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">breadwinner assumed.</text><rect x="599.3333333333334" y="277" width="270.6666666666667" height="172" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="619.3333333333334" y="312.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Criticisms of NGOs</text><text x="619.3333333333334" y="340.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Dependency, donor-led, poor</text><text x="619.3333333333334" y="361.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">coordination. Moyo, Dead</text><text x="619.3333333333334" y="382.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Aid (2009): aid fed</text><text x="619.3333333333334" y="403.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">dependency and corruption.</text><rect x="30" y="467" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="500.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Overall: absolute deprivation has clearly fallen in many societies, but relative</text><text x="50" y="522.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">inequality, especially of wealth, often remains wide.</text>
</svg>