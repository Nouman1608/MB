<rect width="900" height="410" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Redistribution works from both ends</text>

<rect x="30" y="160" width="210" height="120" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="135" y="188.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Higher-income</text><text x="135" y="213.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">groups</text><text x="135" y="241.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">progressive taxes take</text><text x="135" y="262.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">more</text><rect x="345" y="160" width="210" height="120" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="211.5" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Government</text><text x="450" y="240.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">tax revenue</text><rect x="660" y="160" width="210" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="765" y="188.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Lower-income</text><text x="765" y="213.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">groups</text><text x="765" y="241.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">receive benefits and</text><text x="765" y="262.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">services</text><line x1="246" y1="220" x2="339" y2="220" stroke="#1e2a44" stroke-width="6" marker-end="url(#ah)"/><text x="292" y="206" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">taxes</text><line x1="561" y1="220" x2="654" y2="220" stroke="#2e6b62" stroke-width="6" marker-end="url(#ahT)"/><text x="607" y="206" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">pays out</text><text x="135" y="140" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">take more from the top</text><text x="765" y="140" font-size="16" font-weight="600" fill="#4a5568" text-anchor="middle">give to the bottom</text><text x="450" y="322" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Benefits and services, e.g.</text><rect x="152.40000000000003" y="338" width="170.84999999999997" height="42" rx="21" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="237.82500000000002" y="365.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">child benefits</text><rect x="335.25" y="338" width="219.72499999999997" height="42" rx="21" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="445.11249999999995" y="365.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">disability payments</text><rect x="566.9749999999999" y="338" width="180.62499999999997" height="42" rx="21" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="657.2874999999999" y="365.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">housing support</text>
