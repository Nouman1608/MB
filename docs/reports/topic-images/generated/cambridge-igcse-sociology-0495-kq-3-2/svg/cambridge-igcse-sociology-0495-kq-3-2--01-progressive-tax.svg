<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 639" width="900" height="639" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="639" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How a progressive tax narrows the gap</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Illustrative example with invented rates</text>
<rect x="30" y="130" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="212" y="190" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">20,000</text><text x="212" y="212" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">income</text><rect x="230" y="160" width="120" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><rect x="230" y="160" width="12" height="64" fill="#2e6b62"/><text x="362" y="190" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">pays 2,000</text><text x="362" y="214" font-size="16" font-weight="600" fill="#4a5568" text-anchor="start">= 10% of income</text><text x="212" y="290" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">100,000</text><text x="212" y="312" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">income</text><rect x="230" y="260" width="120" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><rect x="230" y="260" width="12" height="64" fill="#2e6b62"/><rect x="350" y="260" width="480" height="64" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><rect x="350" y="260" width="192" height="64" fill="#b5602e"/><text x="818" y="290" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">pays 2,000 + 32,000</text><text x="818" y="314" font-size="16" font-weight="600" fill="#4a5568" text-anchor="end">= 34% of income</text><text x="290" y="366" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">first 20,000 at 10%</text><text x="590" y="366" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">income above 20,000 at 40%</text><rect x="230" y="396" width="22" height="22" fill="#2e6b62"/><rect x="260" y="396" width="22" height="22" fill="#b5602e"/><text x="292" y="414" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">dark part = tax paid</text><rect x="30" y="480" width="410" height="131" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="516" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Progressive</text><text x="50" y="544.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The percentage paid rises as income rises,</text><text x="50" y="565.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">so the gap after tax is smaller than before</text><text x="50" y="586.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">tax.</text><rect x="460" y="480" width="410" height="131" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="480" y="516" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Regressive</text><text x="480" y="544.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Takes a larger share of poorer people’s</text><text x="480" y="565.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">income, e.g. a sales tax on everyday goods.</text>
</svg>