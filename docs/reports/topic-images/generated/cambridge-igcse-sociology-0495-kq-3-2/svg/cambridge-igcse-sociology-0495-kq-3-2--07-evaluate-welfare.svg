<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 679" width="900" height="679" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="679" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Have welfare states failed?</text>

<line x1="215" y1="143" x2="685" y2="165" stroke="#1e2a44" stroke-width="7" stroke-linecap="round"/><path d="M450,154 L420,246 L480,246 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><circle cx="450" cy="154" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><line x1="215" y1="143" x2="160" y2="198" stroke="#1e2a44" stroke-width="2.5"/><line x1="215" y1="143" x2="270" y2="198" stroke="#1e2a44" stroke-width="2.5"/><path d="M140,198 L290,198 Q275,225 215,225 Q155,225 140,198 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><line x1="685" y1="165" x2="630" y2="220" stroke="#1e2a44" stroke-width="2.5"/><line x1="685" y1="165" x2="740" y2="220" stroke="#1e2a44" stroke-width="2.5"/><path d="M610,220 L760,220 Q745,247 685,247 Q625,247 610,220 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="215" y="247" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">FAILED</text><text x="685" y="269" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">SUCCEEDED</text><rect x="30" y="282" width="405" height="237" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="318" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Yes, they have failed</text><text x="50" y="347.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="347.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Marxists: only softens capitalism;</text><text x="66.15" y="369.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">wealth concentrated</text><text x="50" y="396.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="396.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Class health gaps persist even with</text><text x="66.15" y="418.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">free healthcare</text><text x="50" y="445.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="445.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">New Right: underclass and dependency</text><text x="50" y="472.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="66.15" y="472.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Feminists: male breadwinner model</text><rect x="465" y="282" width="405" height="237" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="485" y="318" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">No, real gains</text><text x="485" y="347.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="347.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Education, pensions, healthcare extend</text><text x="501.15" y="369.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">life chances</text><text x="485" y="396.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="396.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Universal schooling enables some</text><text x="501.15" y="418.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">mobility</text><text x="485" y="445.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="445.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Benefits prevent destitution</text><text x="485" y="472.6" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="501.15" y="472.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Without welfare, inequality would</text><text x="501.15" y="494.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">probably be far greater</text><rect x="30" y="537" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="573" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement</text><text x="50" y="602.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Welfare states have reduced absolute poverty and the worst effects of inequality, but not</text><text x="50" y="624.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">relative inequality: “limited success” is fairer than “failed”.</text>
</svg>