<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="440" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Benefits of fasting</text>

<rect x="30" y="104" width="269.3333333333333" height="230" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SPIRITUAL</text><text x="50" y="164" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Closer to Allah</text><text x="50" y="192.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="192.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Taqwa, the stated purpose</text><text x="65.2" y="213.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(2:183)</text><text x="50" y="240.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="240.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Known only to Allah and</text><text x="65.2" y="261.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the faster</text><text x="50" y="288.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="288.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">More Qur’an in the month</text><text x="65.2" y="309.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">of revelation</text><rect x="315.3333333333333" y="104" width="269.3333333333333" height="230" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="335.3333333333333" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">MORAL</text><text x="335.3333333333333" y="164" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Self-discipline</text><text x="335.3333333333333" y="192.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="350.5333333333333" y="192.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Control of hunger, anger</text><text x="350.5333333333333" y="213.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and desire</text><text x="335.3333333333333" y="240.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="350.5333333333333" y="240.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Honesty: no one checks in</text><text x="350.5333333333333" y="261.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">private</text><text x="335.3333333333333" y="288.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="350.5333333333333" y="288.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Patience</text><rect x="600.6666666666666" y="104" width="269.3333333333333" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="620.6666666666666" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SOCIAL</text><text x="620.6666666666666" y="164" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Community</text><text x="620.6666666666666" y="192.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="635.8666666666667" y="192.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Empathy with the hungry</text><text x="620.6666666666666" y="219.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="635.8666666666667" y="219.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">More charity, including</text><text x="635.8666666666667" y="240.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Zakat-ul-Fitr</text><text x="620.6666666666666" y="267.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="635.8666666666667" y="267.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Shared iftar; the whole</text><text x="635.8666666666667" y="288.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ummah fasting together</text><rect x="30" y="352" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="385.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Health benefits are a side effect, not the reason Muslims fast: keep them brief.</text>
</svg>