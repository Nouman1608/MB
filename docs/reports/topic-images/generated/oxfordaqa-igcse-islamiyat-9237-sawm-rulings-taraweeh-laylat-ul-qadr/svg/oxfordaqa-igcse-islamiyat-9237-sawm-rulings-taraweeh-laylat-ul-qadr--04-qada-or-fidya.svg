<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="500" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Exemptions: qada or fidya?</text>

<rect x="30" y="104" width="408" height="237" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="140" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Qada: make up the days later</text><text x="50" y="169.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="169.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The temporarily ill</text><text x="50" y="196.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="196.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Travellers</text><text x="50" y="223.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="223.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Pregnant or breastfeeding women who fear</text><text x="66.15" y="245.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">harm (some schools also require feeding</text><text x="66.15" y="267.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the poor)</text><text x="50" y="294.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="66.15" y="294.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Women in menstruation or post-natal</text><text x="66.15" y="316.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">bleeding (must not fast)</text><rect x="462" y="104" width="408" height="237" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="482" y="140" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">Fidya: feed a poor person each</text><text x="482" y="166" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="start">day</text><text x="482" y="195.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="498.15" y="195.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The elderly</text><text x="482" y="222.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="498.15" y="222.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The chronically ill who will not recover</text><text x="482" y="249.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="498.15" y="249.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Based on 2:184</text><rect x="30" y="359" width="840" height="111" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="394.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Nothing owed</text><text x="50" y="423.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Children before puberty (many practise for part of the day) and people who are insane:</text><text x="50" y="445.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">fasting is not obligatory.</text>
</svg>