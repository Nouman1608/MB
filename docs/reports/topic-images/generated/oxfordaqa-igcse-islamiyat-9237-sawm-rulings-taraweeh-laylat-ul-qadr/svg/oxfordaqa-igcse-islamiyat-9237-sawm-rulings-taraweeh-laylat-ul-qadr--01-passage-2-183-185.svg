<rect width="900" height="454" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Qur’an 2:183-185: five ideas in three verses</text>

<rect x="30" y="104" width="170" height="50" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="136" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Command</text><rect x="214" y="104" width="656" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="133.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“Decreed upon you is fasting as it was decreed upon those before you”</text><rect x="30" y="166" width="170" height="50" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="198" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Purpose</text><rect x="214" y="166" width="656" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="195.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“That you may become righteous”: developing taqwa, awareness of Allah</text><rect x="30" y="228" width="170" height="72" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="271" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Concession</text><rect x="214" y="228" width="656" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="257.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“Whoever among you is ill or on a journey … then an equal number of</text><text x="230" y="279.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">other days”</text><rect x="30" y="312" width="170" height="50" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="344" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">The month</text><rect x="214" y="312" width="656" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="341.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“The month of Ramadhan [is that] in which was revealed the Qur’an”</text><rect x="30" y="374" width="170" height="50" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="406" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">The spirit</text><rect x="214" y="374" width="656" height="50" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="403.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“Allah intends for you ease and does not intend for you hardship”</text>
</svg>