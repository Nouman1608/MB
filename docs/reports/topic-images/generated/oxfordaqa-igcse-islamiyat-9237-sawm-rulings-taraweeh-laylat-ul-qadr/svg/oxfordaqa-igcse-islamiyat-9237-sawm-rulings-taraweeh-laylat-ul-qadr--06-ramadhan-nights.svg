<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three acts of worship in Ramadhan</text>

<rect x="40" y="170" width="24.333333333333332" height="48" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><rect x="67.33333333333333" y="170" width="24.333333333333332" height="48" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><rect x="94.66666666666666" y="170" width="24.333333333333332" height="48" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><rect x="122" y="170" width="24.333333333333332" height="48" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><rect x="149.33333333333331" y="170" width="24.333333333333332" height="48" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><rect x="176.66666666666666" y="170" width="24.333333333333332" height="48" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><rect x="204" y="170" width="24.333333333333332" height="48" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><rect x="231.33333333333331" y="170" width="24.333333333333332" height="48" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><rect x="258.66666666666663" y="170" width="24.333333333333332" height="48" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><rect x="286" y="170" width="24.333333333333332" height="48" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><rect x="313.3333333333333" y="170" width="24.333333333333332" height="48" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><rect x="340.66666666666663" y="170" width="24.333333333333332" height="48" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><rect x="368" y="170" width="24.333333333333332" height="48" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><rect x="395.3333333333333" y="170" width="24.333333333333332" height="48" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><rect x="422.66666666666663" y="170" width="24.333333333333332" height="48" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><rect x="450" y="170" width="24.333333333333332" height="48" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><rect x="477.3333333333333" y="170" width="24.333333333333332" height="48" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><rect x="504.66666666666663" y="170" width="24.333333333333332" height="48" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><rect x="532" y="170" width="24.333333333333332" height="48" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><rect x="559.3333333333333" y="170" width="24.333333333333332" height="48" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="1.5"/><rect x="586.6666666666666" y="170" width="24.333333333333332" height="48" rx="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><text x="598.8333333333333" y="200" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">21</text><rect x="614" y="170" width="24.333333333333332" height="48" rx="4" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.5"/><text x="626.1666666666666" y="200" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">22</text><rect x="641.3333333333333" y="170" width="24.333333333333332" height="48" rx="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><text x="653.4999999999999" y="200" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">23</text><rect x="668.6666666666666" y="170" width="24.333333333333332" height="48" rx="4" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.5"/><text x="680.8333333333333" y="200" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">24</text><rect x="696" y="170" width="24.333333333333332" height="48" rx="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><text x="708.1666666666666" y="200" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">25</text><rect x="723.3333333333333" y="170" width="24.333333333333332" height="48" rx="4" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.5"/><text x="735.4999999999999" y="200" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">26</text><rect x="750.6666666666666" y="170" width="24.333333333333332" height="48" rx="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><text x="762.8333333333333" y="200" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">27</text><rect x="778" y="170" width="24.333333333333332" height="48" rx="4" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.5"/><text x="790.1666666666666" y="200" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">28</text><rect x="805.3333333333333" y="170" width="24.333333333333332" height="48" rx="4" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><text x="817.4999999999999" y="200" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">29</text><rect x="832.6666666666666" y="170" width="24.333333333333332" height="48" rx="4" fill="#f2e7b8" stroke="#1e2a44" stroke-width="1.5"/><text x="844.8333333333333" y="200" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">30</text><text x="40" y="156" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Nights of Ramadhan</text><text x="313.3333333333333" y="246" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">Taraweeh after Isha, every night</text><path d="M586.6666666666666,230 L586.6666666666666,240 L857,240 L857,230" fill="none" stroke="#8a6d0d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="723.3333333333333" y="264" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">last ten: Itikaaf; odd nights: seek Laylat ul-Qadr</text><rect x="30" y="290" width="270.6666666666667" height="282" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="325.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Taraweeh</text><text x="50" y="353" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64.25" y="353" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Voluntary night prayer after</text><text x="64.25" y="373" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Isha</text><text x="50" y="398" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64.25" y="398" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">The Prophet (pbuh) led it a</text><text x="64.25" y="418" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">few nights, then prayed at</text><text x="64.25" y="438" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">home, fearing it would</text><text x="64.25" y="458" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">become obligatory</text><text x="50" y="483" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64.25" y="483" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Umar (RA) gathered people</text><text x="64.25" y="503" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">behind one reciter</text><text x="50" y="528" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="64.25" y="528" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Sunni mosques: 8 or 20</text><text x="64.25" y="548" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">rak’ahs</text><rect x="314.6666666666667" y="290" width="270.6666666666667" height="282" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="334.6666666666667" y="325.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Itikaaf</text><text x="334.6666666666667" y="353" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="348.9166666666667" y="353" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Seclusion in the mosque,</text><text x="348.9166666666667" y="373" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">usually the last ten days</text><text x="334.6666666666667" y="398" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="348.9166666666667" y="398" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Leave only for necessities</text><text x="334.6666666666667" y="423" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="348.9166666666667" y="423" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Prayer, Qur’an, dhikr; no</text><text x="348.9166666666667" y="443" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">worldly talk (2:187)</text><text x="334.6666666666667" y="468" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="348.9166666666667" y="468" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">In worship whenever Laylat</text><text x="348.9166666666667" y="488" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">ul-Qadr falls</text><rect x="599.3333333333334" y="290" width="270.6666666666667" height="282" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="619.3333333333334" y="325.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Laylat ul-Qadr</text><text x="619.3333333333334" y="353" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="633.5833333333334" y="353" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">The Qur’an first revealed;</text><text x="633.5833333333334" y="373" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">matters decreed</text><text x="619.3333333333334" y="398" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="633.5833333333334" y="398" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">“Better than a thousand</text><text x="633.5833333333334" y="418" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">months” (Surah 97)</text><text x="619.3333333333334" y="443" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="633.5833333333334" y="443" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Sought in the odd nights;</text><text x="633.5833333333334" y="463" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">many observe the 27th, but</text><text x="633.5833333333334" y="483" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">the date is not known</text>
</svg>