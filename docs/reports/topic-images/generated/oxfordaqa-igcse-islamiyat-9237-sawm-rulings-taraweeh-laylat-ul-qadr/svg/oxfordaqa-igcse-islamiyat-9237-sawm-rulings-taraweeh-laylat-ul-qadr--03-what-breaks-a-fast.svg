<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 665" width="900" height="665" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="665" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What breaks a fast, and what is owed</text>

<text x="228.5" y="124" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Act</text><text x="671.5" y="124" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Effect</text><rect x="30" y="140" width="397" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="168.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Deliberately eating or drinking</text><line x1="433" y1="175" x2="467" y2="175" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="140" width="397" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="489" y="168.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Broken; make it up (Hanafis also apply</text><text x="489" y="189.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">kaffarah)</text><rect x="30" y="224" width="397" height="91" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="252.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Deliberate sexual relations in the day</text><line x1="433" y1="269.5" x2="467" y2="269.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="224" width="397" height="91" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="489" y="252.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Broken; make it up AND kaffarah: 60</text><text x="489" y="273.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">consecutive days’ fasting, or feed 60 poor</text><text x="489" y="294.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">people</text><rect x="30" y="329" width="397" height="49" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="357.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Deliberately making oneself vomit</text><line x1="433" y1="353.5" x2="467" y2="353.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="329" width="397" height="49" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="489" y="357.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Broken; make it up</text><rect x="30" y="392" width="397" height="49" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="420.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Menstruation or post-natal bleeding begins</text><line x1="433" y1="416.5" x2="467" y2="416.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="392" width="397" height="49" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="489" y="420.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The fast ends; that day is made up later</text><rect x="30" y="455" width="397" height="49" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="483.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Smoking</text><line x1="433" y1="479.5" x2="467" y2="479.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="455" width="397" height="49" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="489" y="483.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Breaks the fast, according to the scholars</text><rect x="30" y="522" width="840" height="113" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="555" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NOT BROKEN</text><text x="50" y="581.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Eating or drinking by genuine mistake</text><text x="50" y="610.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The Prophet (pbuh) said that Allah fed him and gave him drink (Bukhari).</text>
</svg>