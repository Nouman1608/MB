<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 506" width="900" height="506" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="506" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The shape of a fasting day</text>

<rect x="40" y="280" width="820" height="60" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><rect x="171.2" y="280" width="557.5999999999999" height="60" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="306" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="middle">THE FAST</text><text x="450" y="328" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">no food, drink or sexual relations; no lying, backbiting or anger</text><text x="105.6" y="316" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">night</text><text x="794.4" y="316" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">night</text><line x1="171.2" y1="272" x2="171.2" y2="160" stroke="#1e2a44" stroke-width="2.5"/><rect x="51.19999999999999" y="110" width="240" height="84" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="171.2" y="133.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">True dawn (Fajr)</text><text x="171.2" y="160" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Suhoor eaten before: a</text><text x="171.2" y="180" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">blessed Sunnah</text><line x1="728.8" y1="272" x2="728.8" y2="160" stroke="#1e2a44" stroke-width="2.5"/><rect x="608.8" y="110" width="240" height="84" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="728.8" y="133.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Sunset (Maghrib)</text><text x="728.8" y="160" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Iftar promptly, often dates</text><text x="728.8" y="180" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">and water</text><rect x="30" y="364" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="400" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Before it starts</text><text x="50" y="429.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Niyyah, the intention, is made in the heart before dawn for an obligatory fast. Eat “until</text><text x="50" y="451.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the white thread of dawn becomes distinct … from the black thread” (2:187).</text>
</svg>