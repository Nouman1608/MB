<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Announcement, list or preview?</text>

<text x="600" y="110" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Takes a</text><text x="600" y="129.8" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">position</text><text x="695" y="110" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Says what</text><text x="695" y="129.8" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">the effect</text><text x="695" y="149.6" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">is</text><text x="790" y="110" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Can be</text><text x="790" y="129.8" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">argued</text><text x="790" y="149.6" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">with</text><rect x="30" y="160" width="520" height="91.35999999999999" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="44" y="188.4" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start" xml:space="preserve">Announcement</text><text x="44" y="214.51" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“This essay will look at fares, collection costs and cars.”</text><text x="44" y="234.31" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">describes</tspan> <tspan font-style="italic">a</tspan> <tspan font-style="italic">task;</tspan> <tspan font-style="italic">takes</tspan> <tspan font-style="italic">no</tspan> <tspan font-style="italic">position</tspan></text><circle cx="600" cy="205.68" r="20" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="600" y="212.68" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">✗</text><circle cx="695" cy="205.68" r="20" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="695" y="212.68" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">✗</text><circle cx="790" cy="205.68" r="20" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="790" y="212.68" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">✗</text><rect x="30" y="265.36" width="520" height="91.36000000000001" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="44" y="293.76" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start" xml:space="preserve">Bare list</text><text x="44" y="319.87" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Fares, collection and congestion are all relevant to free transport.”</text><text x="44" y="339.67" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">no</tspan> <tspan font-style="italic">claim,</tspan> <tspan font-style="italic">no</tspan> <tspan font-style="italic">relation</tspan> <tspan font-style="italic">between</tspan> <tspan font-style="italic">the</tspan> <tspan font-style="italic">parts</tspan></text><circle cx="600" cy="311.04" r="20" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="600" y="318.04" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">✗</text><circle cx="695" cy="311.04" r="20" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="695" y="318.04" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">✗</text><circle cx="790" cy="311.04" r="20" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="790" y="318.04" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">✗</text><rect x="30" y="370.72" width="520" height="130.95999999999998" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="44" y="399.12" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start" xml:space="preserve">Preview</text><text x="44" y="425.23" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“Free transport would repair three failures: fares shut out riders</text><text x="44" y="445.03000000000003" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">who need the service, collecting them eats revenue, and the price</text><text x="44" y="464.83000000000004" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">of a ticket sends drivers back to their cars.”</text><text x="44" y="484.63" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve"><tspan font-style="italic">a</tspan> <tspan font-style="italic">claim</tspan> <tspan font-style="italic">with</tspan> <tspan font-style="italic">reasons</tspan> <tspan font-style="italic">the</tspan> <tspan font-style="italic">reader</tspan> <tspan font-style="italic">can</tspan> <tspan font-style="italic">test</tspan></text><circle cx="600" cy="436.20000000000005" r="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="600" y="443.20000000000005" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">✓</text><circle cx="695" cy="436.20000000000005" r="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="695" y="443.20000000000005" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">✓</text><circle cx="790" cy="436.20000000000005" r="20" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="790" y="443.20000000000005" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">✓</text>
