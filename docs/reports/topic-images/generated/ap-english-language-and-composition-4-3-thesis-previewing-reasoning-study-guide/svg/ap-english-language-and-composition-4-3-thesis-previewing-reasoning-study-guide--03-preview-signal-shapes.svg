<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 672" width="900" height="672" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="672" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How a preview signals structure</text>

<rect x="30" y="96" width="412" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="48" y="128" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Parallel reasons</text><text x="48" y="152" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic" xml:space="preserve">“because A, B and C”</text><rect x="150" y="196" width="80" height="44" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2" /><text x="190" y="224" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">claim</text><line x1="234" y1="218" x2="310" y2="180" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="316" y="166" width="44" height="30" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="338" y="187" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">A</text><line x1="234" y1="218" x2="310" y2="218" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="316" y="204" width="44" height="30" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="338" y="225" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">B</text><line x1="234" y1="218" x2="310" y2="256" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="316" y="242" width="44" height="30" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="338" y="263" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">C</text><rect x="458" y="96" width="412" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="476" y="128" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">A progression</text><text x="476" y="152" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic" xml:space="preserve">“moves from... to...”</text><rect x="578" y="236" width="64" height="26" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><rect x="648" y="208" width="64" height="54" rx="4" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><rect x="718" y="180" width="64" height="82" rx="4" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2" /><line x1="578" y1="272" x2="798" y2="186" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)" stroke-dasharray="6 5"/><rect x="30" y="312" width="412" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="48" y="344" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Contrast or concession</text><text x="48" y="368" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic" xml:space="preserve">“although X, Y”</text><rect x="150" y="412" width="80" height="44" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2" stroke-dasharray="5 4"/><text x="190" y="440" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">X</text><path d="M234,434 C270,392 290,392 310,422" fill="none" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><rect x="314" y="412" width="80" height="44" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><text x="354" y="440" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Y</text><rect x="458" y="312" width="412" height="200" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="476" y="344" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">A sequence of effects</text><text x="476" y="368" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic" xml:space="preserve">“first... and finally...” (analysis)</text><line x1="578" y1="434" x2="818" y2="434" stroke="#1e2a44" stroke-width="3"/><circle cx="598" cy="434" r="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="598" y="470" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">first</text><circle cx="698" cy="434" r="10" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="698" y="470" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">then</text><circle cx="798" cy="434" r="10" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="798" y="470" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">finally</text><rect x="30" y="532" width="840" height="104.63999999999999" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="48" y="566" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">For rhetorical analysis</text><text x="48" y="594" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“By beginning with a shared memory and then moving to a statistic, the speaker first earns the</text><text x="48" y="615.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">audience’s trust and then makes the demand for change difficult to refuse.”</text>
</svg>