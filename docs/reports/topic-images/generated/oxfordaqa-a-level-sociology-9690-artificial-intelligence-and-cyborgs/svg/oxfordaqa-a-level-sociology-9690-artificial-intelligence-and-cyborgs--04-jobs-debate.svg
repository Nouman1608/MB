<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 506" width="900" height="506" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="506" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Will AI take people’s jobs?</text>

<rect x="30" y="104" width="404" height="269" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L419.75,105.25 Q432.75,105.25 432.75,118.25 L432.75,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="432.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Whole occupations</text><text x="48" y="190.4" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Frey and Osborne (2013)</text><circle cx="53" cy="215.79" r="4.5" fill="#2e6b62"/><text x="66" y="221.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Estimated 47% of US jobs at high risk</text><text x="66" y="243.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">of computerisation</text><circle cx="53" cy="267.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="273.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Treats each job as one thing that a</text><text x="66" y="295.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">machine can or cannot do</text><rect x="466" y="104" width="404" height="269" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,154 L467.25,118.25 Q467.25,105.25 480.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#f2e7b8"/><line x1="467.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Separate tasks</text><text x="484" y="190.4" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">later task-based studies</text><circle cx="489" cy="215.79" r="4.5" fill="#8a6d0d"/><text x="502" y="221.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Produced much lower estimates</text><circle cx="489" cy="245.79" r="4.5" fill="#8a6d0d"/><text x="502" y="251.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Most jobs mix tasks machines can and</text><text x="502" y="273.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">cannot do</text><circle cx="489" cy="297.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="303.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Generative AI has since extended the</text><text x="502" y="325.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">debate to office, creative and</text><text x="502" y="347.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">professional work</text><circle cx="450" cy="238.5" r="24" fill="#1e2a44"/><text x="450" y="245.5" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">vs</text><rect x="30" y="391" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="427" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Exam tip</text><text x="56" y="456" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Never give the 47% figure as fact without the task-based criticism.</text>
</svg>