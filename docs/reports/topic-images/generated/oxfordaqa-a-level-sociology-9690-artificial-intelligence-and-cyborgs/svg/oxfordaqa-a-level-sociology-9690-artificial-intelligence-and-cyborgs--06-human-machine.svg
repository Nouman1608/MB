<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 569" width="900" height="569" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="569" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Merging human and machine</text>

<rect x="30" y="104" width="274.6666666666667" height="66" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="167.33333333333334" y="142.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Medical repair</text><rect x="312.6666666666667" y="104" width="274.6666666666667" height="66" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="450" y="142.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Self-experiment</text><rect x="595.3333333333334" y="104" width="274.6666666666667" height="66" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="732.6666666666667" y="129.67000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Brain-computer</text><text x="732.6666666666667" y="154.67000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">interface</text><rect x="30" y="178" width="274.6666666666667" height="180" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="49" cy="202.92" r="4.5" fill="#2e6b62"/><text x="62" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">First fully implanted</text><text x="62" y="229.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">pacemaker (Sweden, 1958)</text><circle cx="49" cy="252.92" r="4.5" fill="#2e6b62"/><text x="62" y="258.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cochlear implants</text><circle cx="49" cy="281.92" r="4.5" fill="#2e6b62"/><text x="62" y="287.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Deep brain stimulation for</text><text x="62" y="308.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Parkinson’s</text><circle cx="49" cy="331.92" r="4.5" fill="#2e6b62"/><text x="62" y="337.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Advanced prosthetic limbs</text><rect x="312.6666666666667" y="178" width="274.6666666666667" height="180" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="331.6666666666667" cy="202.92" r="4.5" fill="#2e6b62"/><text x="344.6666666666667" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Kevin Warwick had a chip</text><text x="344.6666666666667" y="229.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">implanted in his arm in</text><text x="344.6666666666667" y="250.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1998 to open doors and</text><text x="344.6666666666667" y="271.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">switch on lights</text><rect x="595.3333333333334" y="178" width="274.6666666666667" height="180" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="614.3333333333334" cy="202.92" r="4.5" fill="#2e6b62"/><text x="627.3333333333334" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">First human implant by</text><text x="627.3333333333334" y="229.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Neuralink in 2024</text><rect x="30" y="374" width="840" height="171" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="410" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Repair or enhancement is socially defined</text><circle cx="61" cy="433.39" r="4.5" fill="#8a6d0d"/><text x="74" y="439" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Some Deaf community members oppose routine cochlear implants for children: deafness as</text><text x="74" y="461" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">a cultural identity with its own language, not a defect</text><circle cx="61" cy="485.39" r="4.5" fill="#8a6d0d"/><text x="74" y="491" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Transhumanism:</tspan> enhance human abilities through technology</text><circle cx="61" cy="515.39" r="4.5" fill="#8a6d0d"/><text x="74" y="521" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Posthumanism:</tspan> questions a fixed, separate "human" (Hayles, 1999)</text>
</svg>