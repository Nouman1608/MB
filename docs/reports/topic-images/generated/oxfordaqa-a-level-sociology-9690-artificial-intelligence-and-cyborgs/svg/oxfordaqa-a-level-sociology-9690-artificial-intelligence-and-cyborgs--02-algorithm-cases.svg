<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 689" width="900" height="689" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="689" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four cases of algorithmic harm</text>

<rect x="30" y="104" width="412" height="199" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L427.75,105.25 Q440.75,105.25 440.75,118.25 L440.75,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="440.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Criminal justice: COMPAS</text><text x="46" y="187.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">ProPublica, 2016 (US)</text><text x="46" y="216.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Black defendants who did not reoffend were</text><text x="46" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">more likely than white defendants to be</text><text x="46" y="258.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">labelled high risk. The company disputed the</text><text x="46" y="279.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">analysis.</text><rect x="458" y="104" width="412" height="199" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,154 L459.25,118.25 Q459.25,105.25 472.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#b5d3cf"/><line x1="459.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Recruitment: Amazon</text><text x="474" y="187.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Reuters, 2018</text><text x="474" y="216.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">An experimental hiring tool downgraded CVs</text><text x="474" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">containing "women’s" because it was trained</text><text x="474" y="258.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">on past hiring dominated by men.</text><rect x="30" y="319" width="412" height="199" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,369 L31.25,333.25 Q31.25,320.25 44.25,320.25 L427.75,320.25 Q440.75,320.25 440.75,333.25 L440.75,369 Z" fill="#f2e7b8"/><line x1="31.25" y1="369" x2="440.75" y2="369" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="350" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Education: A-level grades</text><text x="46" y="402.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">England, 2020</text><text x="46" y="431.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A grading algorithm was withdrawn after</text><text x="46" y="452.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">protests; critics said it disadvantaged</text><text x="46" y="473.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">students at historically lower-performing</text><text x="46" y="494.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">schools.</text><rect x="458" y="319" width="412" height="199" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,369 L459.25,333.25 Q459.25,320.25 472.25,320.25 L855.75,320.25 Q868.75,320.25 868.75,333.25 L868.75,369 Z" fill="#f2e7b8"/><line x1="459.25" y1="369" x2="868.75" y2="369" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="350" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Welfare: childcare benefits</text><text x="474" y="402.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Netherlands</text><text x="474" y="431.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Thousands of families wrongly accused of</text><text x="474" y="452.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fraud; risk profiling included nationality.</text><text x="474" y="473.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The government resigned in January 2021.</text><rect x="30" y="534" width="840" height="141" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="570" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Concepts to name</text><circle cx="61" cy="593.39" r="4.5" fill="#8a6d0d"/><text x="74" y="599" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">New Jim Code (Benjamin, 2019):</tspan> new technologies reproduce old racial hierarchies while</text><text x="74" y="621" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">appearing objective</text><circle cx="61" cy="645.39" r="4.5" fill="#8a6d0d"/><text x="74" y="651" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Black box (Pasquale, 2015):</tspan> secrecy stops people knowing or contesting decisions</text>
</svg>