<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 748" width="900" height="748" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="748" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three ways AI systems work</text>

<rect x="168" y="104" width="228.66666666666666" height="66" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="282.3333333333333" y="129.67000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Rule-based</text><text x="282.3333333333333" y="154.67000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">(symbolic) AI</text><rect x="404.66666666666663" y="104" width="228.66666666666666" height="66" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="519" y="142.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Machine learning</text><rect x="641.3333333333333" y="104" width="228.66666666666666" height="66" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="755.6666666666666" y="142.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Deep learning</text><rect x="30" y="178" width="130" height="135" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="239.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">How it</text><text x="42" y="261.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">works</text><rect x="168" y="178" width="228.66666666666666" height="135" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="182" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Follows if-then rules</text><text x="182" y="229.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">written by people, as</text><text x="182" y="250.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">in 1980s "expert</text><text x="182" y="271.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">systems".</text><rect x="404.66666666666663" y="178" width="228.66666666666666" height="135" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="418.66666666666663" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Finds patterns in large</text><text x="418.66666666666663" y="229.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sets of examples; in</text><text x="418.66666666666663" y="250.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">supervised learning the</text><text x="418.66666666666663" y="271.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">examples are labelled</text><text x="418.66666666666663" y="292.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">by humans.</text><rect x="641.3333333333333" y="178" width="228.66666666666666" height="135" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="655.3333333333333" y="208.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Many-layered neural</text><text x="655.3333333333333" y="229.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">networks; large</text><text x="655.3333333333333" y="250.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">language models predict</text><text x="655.3333333333333" y="271.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">likely next words.</text><rect x="30" y="321" width="130" height="93" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="372.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Example</text><rect x="168" y="321" width="228.66666666666666" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="182" y="351.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Encoding a specialist’s</text><text x="182" y="372.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">knowledge as rules.</text><rect x="404.66666666666663" y="321" width="228.66666666666666" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="418.66666666666663" y="351.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Emails labelled "spam"</text><text x="418.66666666666663" y="372.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">or "not spam".</text><rect x="641.3333333333333" y="321" width="228.66666666666666" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="655.3333333333333" y="351.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Image recognition,</text><text x="655.3333333333333" y="372.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">translation, chatbots</text><text x="655.3333333333333" y="393.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(from late 2022).</text><rect x="30" y="422" width="130" height="74" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="453.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Where bias</text><text x="42" y="475.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">comes from</text><rect x="168" y="422" width="228.66666666666666" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="182" y="452.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The people who wrote</text><text x="182" y="473.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the rules.</text><rect x="404.66666666666663" y="422" width="228.66666666666666" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="418.66666666666663" y="452.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The training data.</text><rect x="641.3333333333333" y="422" width="228.66666666666666" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="655.3333333333333" y="452.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The training data.</text><rect x="30" y="504" width="130" height="93" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="555.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Weakness</text><rect x="168" y="504" width="228.66666666666666" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="182" y="534.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Transparent but brittle</text><text x="182" y="555.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">when situations do not</text><text x="182" y="576.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fit the rules.</text><rect x="404.66666666666663" y="504" width="228.66666666666666" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="418.66666666666663" y="534.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Looks neutral, so</text><text x="418.66666666666663" y="555.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">decisions are harder to</text><text x="418.66666666666663" y="576.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">challenge.</text><rect x="641.3333333333333" y="504" width="228.66666666666666" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="655.3333333333333" y="534.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Looks neutral, so</text><text x="655.3333333333333" y="555.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">decisions are harder to</text><text x="655.3333333333333" y="576.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">challenge.</text><rect x="30" y="613" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="649" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">By capability</text><text x="56" y="678" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Narrow AI (one task) exists. Artificial general intelligence (human-level across tasks)</text><text x="56" y="700" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">does not exist. Superintelligence (Bostrom, 2014) is hypothetical.</text>
</svg>