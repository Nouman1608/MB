<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 809" width="900" height="809" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="809" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Predictive policing: a feedback loop</text>

<path d="M559.2,190.00000000000003 Q710,190.00000000000006 710,300.20000000000005" fill="none" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><path d="M710,459.8 Q710,570 559.2,570" fill="none" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><path d="M340.8,570 Q190.00000000000006,570 190.00000000000003,459.8" fill="none" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><path d="M189.99999999999997,300.20000000000005 Q189.99999999999994,190.00000000000006 340.79999999999995,190.00000000000003" fill="none" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><rect x="325" y="142" width="250" height="96" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="170.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Prediction</text><text x="450" y="198.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">the algorithm flags an</text><text x="450" y="219.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">area as high crime</text><rect x="585" y="332" width="250" height="96" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="710" y="360.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">More officers sent</text><text x="710" y="388.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">policing is concentrated</text><text x="710" y="409.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">there</text><rect x="325" y="522" width="250" height="96" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="550.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">More crime recorded</text><text x="450" y="578.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">because more is seen and</text><text x="450" y="599.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">logged</text><rect x="65" y="321.5" width="250" height="117" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="190" y="349.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">New data</text><text x="190" y="377.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">the record "confirms" the</text><text x="190" y="398.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">prediction and trains the</text><text x="190" y="419.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">next one</text><text x="450" y="383" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Feedback loop</text><rect x="30" y="620" width="840" height="163" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="656" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluation</text><circle cx="61" cy="679.39" r="4.5" fill="#8a6d0d"/><text x="74" y="685" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">For algorithms:</tspan> they can be audited and corrected more easily than human prejudice,</text><text x="74" y="707" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and humans are also biased</text><circle cx="61" cy="731.39" r="4.5" fill="#8a6d0d"/><text x="74" y="737" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Against:</tspan> scale, opacity and the look of objectivity make the bias harder to see and</text><text x="74" y="759" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">resist</text>
</svg>