<rect width="900" height="577" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What “automated” AI depends on</text>

<rect x="30" y="110" width="198" height="88" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="129" y="154.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Mined minerals</text><rect x="244" y="110" width="198" height="88" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="343" y="142.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Energy-hungry</text><text x="343" y="166.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">data centres</text><rect x="458" y="110" width="198" height="88" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="557" y="154.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Cheap labour</text><rect x="672" y="110" width="198" height="88" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="771" y="142.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Data taken from</text><text x="771" y="166.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">users</text><line x1="130" y1="204" x2="338" y2="260" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="343" y1="204" x2="412.55" y2="260" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="557" y1="204" x2="487.45" y2="260" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="770" y1="204" x2="562" y2="260" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="250" y="264" width="400" height="70" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="307" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">"Automated" AI service</text><rect x="30" y="356" width="412" height="195" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,406 L31.25,370.25 Q31.25,357.25 44.25,357.25 L427.75,357.25 Q440.75,357.25 440.75,370.25 L440.75,406 Z" fill="#dce9e7"/><line x1="31.25" y1="406" x2="440.75" y2="406" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="386.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Crawford (2021)</text><text x="44" y="437.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Atlas of AI</text><text x="44" y="464.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">AI is an extractive industry.</text><rect x="458" y="356" width="412" height="195" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,406 L459.25,370.25 Q459.25,357.25 472.25,357.25 L855.75,357.25 Q868.75,357.25 868.75,370.25 L868.75,406 Z" fill="#dce9e7"/><line x1="459.25" y1="406" x2="868.75" y2="406" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="386.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Gray and Suri (2019)</text><text x="472" y="437.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Ghost Work</text><text x="472" y="464.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Low-paid platform workers label data and</text><text x="472" y="485.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">check outputs; journalists report data</text><text x="472" y="506.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">labellers and moderators in countries such as</text><text x="472" y="527.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Kenya.</text>
</svg>