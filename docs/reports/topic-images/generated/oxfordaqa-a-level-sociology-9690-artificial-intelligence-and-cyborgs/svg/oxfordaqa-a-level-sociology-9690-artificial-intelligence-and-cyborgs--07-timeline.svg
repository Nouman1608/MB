<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 837" width="900" height="837" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="837" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">AI, robots and cyborgs: key dates</text>

<line x1="150" y1="120" x2="150" y2="632" stroke="#1e2a44" stroke-width="4"/><rect x="172" y="110" width="698" height="56" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="150" cy="138" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="128" y="144" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="end">1950</text><text x="190" y="144.64" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Turing proposes the "imitation game" (the Turing test)</text><rect x="172" y="176" width="698" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="150" cy="211" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="128" y="217" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="end">1956</text><text x="190" y="206.64" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">"Artificial intelligence" coined for a Dartmouth College workshop</text><text x="190" y="228.64" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">(McCarthy and colleagues)</text><rect x="172" y="256" width="698" height="56" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="150" cy="284" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="128" y="290" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="end">1958</text><text x="190" y="290.64" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">First fully implanted pacemaker (Sweden)</text><rect x="172" y="322" width="698" height="56" rx="12" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="150" cy="350" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="128" y="356" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="end">1961</text><text x="190" y="356.64" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Unimate, the first industrial robot arm, starts work at General Motors</text><rect x="172" y="388" width="698" height="56" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="150" cy="416" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="128" y="422" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="end">1980s</text><text x="190" y="422.64" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Rule-based "expert systems"</text><rect x="172" y="454" width="698" height="56" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="150" cy="482" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="128" y="488" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="end">1998</text><text x="190" y="488.64" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Kevin Warwick’s implanted chip</text><rect x="172" y="520" width="698" height="56" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="150" cy="548" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="128" y="554" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="end">late 2022</text><text x="190" y="554.64" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Chatbots built on large language models released to the public</text><rect x="172" y="586" width="698" height="56" rx="12" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="150" cy="614" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="128" y="620" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="end">2024</text><text x="190" y="620.64" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Neuralink’s first human brain implant</text><rect x="30" y="662" width="840" height="149" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="698" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Theory</text><circle cx="61" cy="721.39" r="4.5" fill="#8a6d0d"/><text x="74" y="727" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Haraway:</tspan> the cyborg</text><circle cx="61" cy="751.39" r="4.5" fill="#8a6d0d"/><text x="74" y="757" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Latour:</tspan> actor-network theory treats robots and algorithms as actants</text><circle cx="61" cy="781.39" r="4.5" fill="#8a6d0d"/><text x="74" y="787" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Turkle (Alone Together):</tspan> can robot companions such as Paro substitute for human care?</text>
</svg>