<rect width="900" height="574" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Seven sampling techniques</text>

<rect x="30" y="110" width="410" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="46" y="148" width="80" height="40" rx="0" fill="#f2e7b8"/><rect x="72" y="148" width="28" height="34" rx="0" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><line x1="46" y1="148" x2="126" y2="148" stroke="#1e2a44" stroke-width="2.5"/><rect x="64" y="132" width="44" height="6" rx="0" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.5"/><line x1="68" y1="138" x2="68" y2="148" stroke="#1e2a44" stroke-width="2"/><line x1="104" y1="138" x2="104" y2="148" stroke="#1e2a44" stroke-width="2"/><text x="142" y="150" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Pitfall trap</text><text x="142" y="174" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">ground-living invertebrates such as</text><text x="142" y="194" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">beetles</text><rect x="460" y="110" width="410" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="496" y="148" width="34" height="28" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M530,156 L554,136 M496,162 L476,180" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="572" y="150" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Pooter</text><text x="572" y="174" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">very small invertebrates on plants</text><text x="572" y="194" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">or soil</text><rect x="30" y="222" width="410" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M56,296 L90,264" fill="none" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><ellipse cx="102" cy="258" rx="20" ry="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M96,270 Q116,296 122,266" fill="none" stroke="#4a5568" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="142" y="262" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sweep net</text><text x="142" y="286" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">insects and spiders in long grass</text><rect x="460" y="222" width="410" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="488" y="244" width="56" height="56" rx="0" fill="none" stroke="#1e2a44" stroke-width="3.5"/><line x1="516" y1="244" x2="516" y2="300" stroke="#4a5568" stroke-width="1.5"/><line x1="488" y1="272" x2="544" y2="272" stroke="#4a5568" stroke-width="1.5"/><text x="572" y="262" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Quadrat</text><text x="572" y="286" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">plants and slow-moving animals</text><rect x="30" y="334" width="410" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="46" y1="384" x2="126" y2="384" stroke="#1e2a44" stroke-width="3"/><rect x="50" y="374" width="18" height="18" rx="0" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><rect x="78" y="374" width="18" height="18" rx="0" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><rect x="106" y="374" width="18" height="18" rx="0" fill="#d4b02e" stroke="#1e2a44" stroke-width="1.5"/><text x="142" y="374" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Transect</text><text x="142" y="398" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">change along a gradient</text><rect x="460" y="334" width="410" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="504" y="376" width="24" height="14" rx="3" fill="#1e2a44"/><line x1="484" y1="374" x2="548" y2="374" stroke="#1e2a44" stroke-width="2.5"/><ellipse cx="484" cy="370" rx="10" ry="3" fill="#4a5568"/><ellipse cx="548" cy="370" rx="10" ry="3" fill="#4a5568"/><path d="M516,392 L502,414 M516,392 L530,414" fill="none" stroke="#4a5568" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 4"/><text x="572" y="374" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Aerial photos and drones</text><text x="572" y="398" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">herds, nesting colonies, vegetation</text><text x="572" y="418" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">cover</text><rect x="30" y="446" width="410" height="98" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="68" y="480" width="40" height="34" rx="5" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="88" cy="497" r="9" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><line x1="88" y1="514" x2="88" y2="528" stroke="#1e2a44" stroke-width="3"/><text x="142" y="486" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Automated sampling</text><text x="142" y="510" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">shy or night-active animals; long</text><text x="142" y="530" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">periods</text><rect x="460" y="446" width="410" height="98" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="478" y="488.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Match the technique to the organism, then</text><text x="478" y="509.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">give a benefit and a limitation.</text>
</svg>