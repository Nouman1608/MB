<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 646" width="900" height="646" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="646" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Variables in a pitfall-trap investigation</text>

<rect x="30" y="120" width="300" height="120" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="159.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Independent variable</text><text x="48" y="191.82" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">what you choose: habitat type</text><text x="48" y="212.82" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(woodland or grassland)</text><rect x="570" y="120" width="300" height="120" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="588" y="159.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Dependent variable</text><text x="588" y="191.82" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">what responds and is measured:</text><text x="588" y="212.82" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">number of beetles</text><line x1="336" y1="180" x2="564" y2="180" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><text x="450" y="168" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">affects</text><rect x="30" y="280" width="840" height="150" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="9 6"/><text x="54" y="316" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Control variables: kept the same so they do not affect the result</text><rect x="54" y="354.5" width="111.975" height="31" rx="15.5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="109.9875" y="376.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">trap size</text><rect x="254" y="354.5" width="151.075" height="31" rx="15.5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="329.5375" y="376.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">time left out</text><rect x="454" y="354.5" width="131.52499999999998" height="31" rx="15.5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="519.7625" y="376.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">time of day</text><rect x="30" y="460" width="410" height="126" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="502.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Repeats</text><text x="48" y="533.54" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the same measurement taken again in the</text><text x="48" y="554.54" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">same way</text><rect x="460" y="460" width="410" height="126" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="492.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Replicates</text><text x="478" y="523.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">extra samples at different places in the</text><text x="478" y="544.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">same conditions, e.g. five traps per</text><text x="478" y="565.04" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">habitat</text><text x="450" y="620" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Hypothesis: more ground beetles will be caught in woodland than in grassland.</text>
</svg>