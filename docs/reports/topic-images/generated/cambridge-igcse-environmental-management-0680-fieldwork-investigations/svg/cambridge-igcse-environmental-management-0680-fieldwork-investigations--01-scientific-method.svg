<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="520" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Nine stages of one investigation</text>

<rect x="30" y="110" width="270" height="104" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="76" y="142.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Aims and hypotheses</text><text x="76" y="171.76" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">testable prediction naming</text><text x="76" y="191.76" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">both variables</text><circle cx="54" cy="140" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="54" y="145.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><line x1="302" y1="162" x2="312" y2="162" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="315" y="110" width="270" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="361" y="142.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Plan methods</text><text x="361" y="171.76" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">strategy, technique; pilot</text><text x="361" y="191.76" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">study</text><circle cx="339" cy="140" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="339" y="145.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><line x1="587" y1="162" x2="597" y2="162" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="600" y="110" width="270" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="646" y="132.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Measured and control</text><text x="646" y="153.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">variables</text><text x="646" y="182.26" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">record one; keep others</text><text x="646" y="202.26" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">the same</text><circle cx="624" cy="140" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="624" y="145.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><line x1="735" y1="216" x2="735" y2="245" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="600" y="248" width="270" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="646" y="270.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Independent and</text><text x="646" y="291.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">dependent</text><text x="646" y="320.26" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">chosen variable;</text><text x="646" y="340.26" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">responding variable</text><circle cx="624" cy="278" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="624" y="283.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><line x1="598" y1="300" x2="588" y2="300" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="315" y="248" width="270" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="361" y="270.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Repeats and</text><text x="361" y="291.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">replicates</text><text x="361" y="320.26" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">reduce chance; allow a</text><text x="361" y="340.26" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">mean</text><circle cx="339" cy="278" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="339" y="283.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><line x1="313" y1="300" x2="303" y2="300" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="248" width="270" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="76" y="280.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Record data</text><text x="76" y="309.76" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">table drawn first; units</text><text x="76" y="329.76" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">in headings</text><circle cx="54" cy="278" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="54" y="283.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><line x1="165" y1="354" x2="165" y2="383" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="386" width="270" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="76" y="418.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Analyse data</text><text x="76" y="447.76" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">means, percentages,</text><text x="76" y="467.76" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">suitable graph</text><circle cx="54" cy="416" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="54" y="421.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">7</text><line x1="302" y1="438" x2="312" y2="438" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="315" y="386" width="270" height="104" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="361" y="418.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Anomalies</text><text x="361" y="447.76" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">check, exclude or repeat,</text><text x="361" y="467.76" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">and say so</text><circle cx="339" cy="416" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="339" y="421.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">8</text><line x1="587" y1="438" x2="597" y2="438" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="600" y="386" width="270" height="104" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="646" y="418.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Conclusions</text><text x="646" y="447.76" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">support the hypothesis?</text><text x="646" y="467.76" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">quote figures</text><circle cx="624" cy="416" r="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="624" y="421.4" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">9</text>
</svg>