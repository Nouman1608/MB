nt-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><line x1="150" y1="367" x2="670" y2="367" stroke="#b5602e" stroke-width="3" stroke-dasharray="10 6"/><line x1="150" y1="415" x2="670" y2="415" stroke="#2e6b62" stroke-width="3"/><text x="666" y="359" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">mean 8.2</text><text x="514" y="165" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">anomaly</text><rect x="690" y="150" width="180" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="706" y="184" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">Mean with 21</text><text x="706" y="208" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">41 ÷ 5 = 8.2</text><text x="706" y="260" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">Mean without 21</text><text x="706" y="284" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">20 ÷ 4 = 5.0</text><text x="706" y="336" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">The second mean</text><text x="706" y="356" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">better represents</text><text x="706" y="376" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">the woodland. Say</text><text x="706" y="396" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">it was excluded;</text><text x="706" y="416" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">repeat that trap.</text><text x="450" y="600" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Invented data: five pitfall traps in woodland.</text>
