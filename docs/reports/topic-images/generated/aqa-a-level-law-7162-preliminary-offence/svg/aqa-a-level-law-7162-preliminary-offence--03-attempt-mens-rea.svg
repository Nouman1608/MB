<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 414" width="900" height="414" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="414" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Mens rea: intention to commit the full offence</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">R v Mohan (1976): a decision to bring about the offence, whether or not desired</text>
<rect x="30" y="124" width="410" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="166" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MURDER</text><text x="46" y="192.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Intention to kill or to cause GBH</text><rect x="460" y="124" width="410" height="125" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="476" y="152" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">ATTEMPTED MURDER</text><text x="476" y="178.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Intention to kill only</text><text x="476" y="207.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Intention to cause GBH is not enough (<tspan font-style="italic">Whybrow</tspan>,</text><text x="476" y="228.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1951)</text><rect x="30" y="267" width="272" height="115" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="293" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">OBLIQUE INTENTION</text><text x="44" y="324" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Foresight of virtual certainty may</text><text x="44" y="344" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">be evidence of intention (<tspan font-style="italic">Walker</tspan></text><text x="44" y="364" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">and</tspan> <tspan font-style="italic">Hayles</tspan>, 1990)</text><rect x="314" y="267" width="272" height="115" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="328" y="293" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RECKLESSNESS</text><text x="328" y="324" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">As to circumstances, where the</text><text x="328" y="344" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">full offence allows it: <tspan font-style="italic">Khan</tspan> (1990);</text><text x="328" y="364" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">A-G’s Ref (No 3 of 1992)</text><rect x="598" y="267" width="272" height="115" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="612" y="293" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONDITIONAL INTENTION</text><text x="612" y="324" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Charge “some or all of the</text><text x="612" y="344" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">contents” (<tspan font-style="italic">Easom</tspan>, 1971; A-G’s</text><text x="612" y="364" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Refs (Nos 1 and 2 of 1979))</text>
</svg>