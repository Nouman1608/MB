<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 731" width="900" height="731" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="731" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">More than merely preparatory: the case bank</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Has he embarked on the crime proper? (Gullefer, 1990)</text>
<rect x="30" y="124" width="410" height="44" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="235" y="153" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">STILL PREPARING: not an attempt</text><rect x="460" y="124" width="410" height="44" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="665" y="153" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">EMBARKED: attempt</text><line x1="450" y1="124" x2="450" y2="564" stroke="#1e2a44" stroke-width="3" stroke-dasharray="9 7"/><rect x="30" y="182" width="410" height="93" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="43" y="207" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">GULLEFER (1990)</text><text x="43" y="238" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Jumped onto a greyhound track to stop a race: not</text><text x="43" y="258" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">attempted theft</text><rect x="30" y="285" width="410" height="93" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="43" y="310" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">CAMPBELL (1991)</text><text x="43" y="341" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Near a post office with an imitation gun and note, not</text><text x="43" y="361" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">yet inside</text><rect x="30" y="388" width="410" height="93" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="43" y="413" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">GEDDES (1996)</text><text x="43" y="444" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">School toilets with knife, rope and tape: not moved to</text><text x="43" y="464" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">execution</text><rect x="460" y="182" width="410" height="93" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="473" y="207" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TOSTI (1997)</text><text x="473" y="238" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Hid cutting equipment, examined the padlock:</text><text x="473" y="258" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">attempted burglary</text><rect x="460" y="285" width="410" height="73" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="473" y="310" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BOYLE AND BOYLE (1987)</text><text x="473" y="341" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">By a damaged door, having tried to break in</text><rect x="460" y="368" width="410" height="93" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="473" y="393" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">JONES (1990)</text><text x="473" y="424" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Pointed a loaded shotgun: attempted murder without</text><text x="473" y="444" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">pulling the trigger</text><rect x="460" y="471" width="410" height="93" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="473" y="496" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">A-G’s REF (No 1 of 1992)</text><text x="473" y="527" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Attempted rape without trying to penetrate: last act</text><text x="473" y="547" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">not required</text><rect x="30" y="582" width="412" height="117" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="45" y="609" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">THE GEDDES QUESTION</text><text x="45" y="640" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Has he actually tried to commit the offence? Has he</text><text x="45" y="660" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">moved from planning or preparation to <tspan font-weight="700" fill="#1e2a44">execution</tspan> <tspan font-weight="700" fill="#1e2a44">or</tspan></text><text x="45" y="680" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">implementation</tspan>?</text><rect x="458" y="582" width="412" height="117" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="473" y="609" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">WHO DECIDES, s4(3)</text><text x="473" y="640" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">The <tspan font-weight="700" fill="#1e2a44">judge</tspan>: is there evidence it could be more than</text><text x="473" y="660" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">merely preparatory? The <tspan font-weight="700" fill="#1e2a44">jury</tspan>: was it?</text>
</svg>