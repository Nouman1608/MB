<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 714" width="900" height="714" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="714" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Attempt: the parts of s1(1)</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Criminal Attempts Act 1981</text>
<rect x="30" y="124" width="560" height="54" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="158" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start" font-style="italic">“With intent to commit an offence”</text><text x="610" y="158" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">MENS REA</text><rect x="30" y="186" width="560" height="54" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="220" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start" font-style="italic">“to which this section applies,”</text><text x="610" y="220" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">SCOPE, s1(4)</text><rect x="30" y="248" width="560" height="54" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="282" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start" font-style="italic">“a person does an act”</text><text x="610" y="282" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">CONDUCT</text><rect x="30" y="310" width="560" height="54" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="344" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start" font-style="italic">“which is more than merely preparatory”</text><text x="610" y="344" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="start">ACTUS REUS</text><text x="50" y="392" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">… to the commission of the offence, he is guilty of attempting to commit the offence.</text><rect x="30" y="420" width="272" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="44" y="446" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SCOPE</text><text x="44" y="477" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Offences triable on indictment,</text><text x="44" y="497" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">including either-way (theft, s47,</text><text x="44" y="517" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">s20). <tspan font-weight="700" fill="#1e2a44">No</tspan> <tspan font-weight="700" fill="#1e2a44">attempted</tspan> <tspan font-weight="700" fill="#1e2a44">assault</tspan> <tspan font-weight="700" fill="#1e2a44">or</tspan></text><text x="44" y="537" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">battery</tspan>: summary only</text><rect x="314" y="420" width="272" height="135" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="328" y="446" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">AN ACT</text><text x="328" y="477" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Normally no attempt by omission</text><rect x="598" y="420" width="272" height="135" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="612" y="446" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">SENTENCE, s4(1)</text><text x="612" y="477" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Same maximum as the full</text><text x="612" y="497" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">offence. Attempted murder:</text><text x="612" y="517" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">maximum life, <tspan font-weight="700" fill="#1e2a44">not</tspan> <tspan font-weight="700" fill="#1e2a44">mandatory</tspan></text><rect x="30" y="573" width="840" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="607.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Why punish when no harm is done?</text><text x="50" y="636.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A <tspan font-weight="700" fill="#1e2a44">dangerous</tspan> <tspan font-weight="700" fill="#1e2a44">intention</tspan> acted on; police can <tspan font-weight="700" fill="#1e2a44">intervene</tspan> <tspan font-weight="700" fill="#1e2a44">before</tspan> harm; failing by luck is <tspan font-weight="700" fill="#1e2a44">no</tspan> <tspan font-weight="700" fill="#1e2a44">less</tspan></text><text x="50" y="657.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">blameworthy</tspan>.</text>
</svg>