<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: Quinn and the crowbar</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Attempted theft from an elderly neighbour’s house</text>
<line x1="60" y1="220" x2="840" y2="220" stroke="#1e2a44" stroke-width="3"/><rect x="60" y="204" width="460" height="32" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><rect x="520" y="204" width="320" height="32" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="290" y="226" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">mere preparation (compare Geddes)</text><text x="680" y="226" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">embarked (Gullefer)</text><line x1="150" y1="204" x2="150" y2="154" stroke="#1e2a44" stroke-width="2"/><line x1="380" y1="204" x2="380" y2="154" stroke="#1e2a44" stroke-width="2"/><line x1="680" y1="204" x2="680" y2="154" stroke="#1e2a44" stroke-width="2"/><text x="150" y="148" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Buys gloves</text><text x="380" y="148" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Watches the house for a week</text><text x="680" y="148" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Crowbar against the door frame</text><line x1="60" y1="284" x2="60" y2="533" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="264" width="766" height="99" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="290" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ACTUS REUS</text><text x="118" y="316.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Crowbar against the frame: trying to commit the crime</text><text x="118" y="344.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Compare <tspan font-style="italic">Tosti</tspan>; <tspan font-style="italic">Boyle</tspan> <tspan font-style="italic">and</tspan> <tspan font-style="italic">Boyle</tspan></text><circle cx="60" cy="313.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="322.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="373" width="766" height="99" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="399" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MENS REA</text><text x="118" y="425.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Intention to steal (<tspan font-style="italic">Mohan</tspan>)</text><text x="118" y="453.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Shown by his plan</text><circle cx="60" cy="422.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="431.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="482" width="766" height="71" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="118" y="508" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">s4(3)</text><text x="118" y="534.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Judge: evidence to leave to the jury. Jury: decides</text><circle cx="60" cy="517.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="526.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="30" y="575" width="840" height="91" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="609.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Conclusion</text><text x="50" y="640.4" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Likely guilty of attempted theft.</text>
