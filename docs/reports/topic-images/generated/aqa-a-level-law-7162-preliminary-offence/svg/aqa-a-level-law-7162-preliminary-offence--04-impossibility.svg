<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 569" width="900" height="569" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="569" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Impossibility: from Anderton v Ryan to Shivpuri</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">s1(2) and s1(3): judged on the facts as he believed them</text>
<rect x="30" y="124" width="350" height="146" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="46" y="152" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">ANDERTON v RYAN (1985), HL</text><text x="46" y="178.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Not guilty</text><text x="46" y="207.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Believed a video recorder was stolen</text><text x="46" y="228.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">when it was not: no attempt to handle</text><text x="46" y="249.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">stolen goods</text><rect x="520" y="124" width="350" height="146" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="536" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">R v SHIVPURI (1987), HL</text><text x="536" y="178.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Guilty</text><text x="536" y="207.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Believed he was dealing in drugs; the</text><text x="536" y="228.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">substance was harmless vegetable</text><text x="536" y="249.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">matter</text><line x1="392" y1="197" x2="512" y2="197" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><text x="450" y="183" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">overruled</text><text x="450" y="227" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">within a year</text><text x="450" y="245" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle"></text><rect x="30" y="288" width="840" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="321.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Overruled using the <tspan font-weight="700" fill="#1e2a44">Practice</tspan> <tspan font-weight="700" fill="#1e2a44">Statement</tspan> <tspan font-weight="700" fill="#1e2a44">1966</tspan>.</text><text x="450" y="384" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">No defence that …</text><rect x="104.55349999999999" y="400" width="207.039" height="31" rx="15.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="208.07299999999998" y="421.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">the pocket was empty</text><rect x="321.5925" y="400" width="208.008" height="31" rx="15.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="425.5965" y="421.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">the “drugs” were fake</text><rect x="539.6005" y="400" width="255.846" height="31" rx="15.5" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="667.5235" y="421.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">the victim was already dead</text><rect x="30" y="449" width="840" height="88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="483.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Withdrawal</text><text x="50" y="512.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Once the attempt is complete, changing one’s mind is no defence, though it may reduce the sentence.</text>
</svg>