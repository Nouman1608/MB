<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="900" height="800" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="800" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Which paper tests which theme</text>

<rect x="40" y="120" width="420" height="120" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="152" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Theme A</text><text x="60" y="176" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Concepts of computer science</text><text x="60" y="210" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">A.1 Computer fundamentals · A.2 Networks</text><text x="60" y="230" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">A.3 Databases · A.4 Machine learning</text><rect x="40" y="256" width="420" height="92" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="288" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Case study</text><text x="60" y="312" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">published in advance; changes between</text><text x="60" y="332" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">exam cycles, so check your session’s version</text><rect x="560" y="160" width="300" height="148" rx="14" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2.5"/><text x="710" y="206" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">Paper 1</text><text x="710" y="238" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">conceptual recall and</text><text x="710" y="259" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">applied understanding</text><text x="710" y="280" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">of systems</text><line x1="464" y1="180" x2="554" y2="214" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/><line x1="464" y1="302" x2="554" y2="262" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/><rect x="40" y="384" width="420" height="140" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="416" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Theme B</text><text x="60" y="440" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Computational thinking and problem-solving</text><text x="60" y="474" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">B.1 Computational thinking · B.2 Programming</text><text x="60" y="494" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">B.3 OOP · B.4 Abstract data types</text><rect x="349.675" y="483" width="73.33" height="22" rx="11" fill="#d4b02e" stroke="#8a6d0d" stroke-width="1.5"/><text x="386.34000000000003" y="499" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">HL only</text><rect x="560" y="384" width="300" height="140" rx="14" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2.5"/><text x="710" y="424" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">Paper 2</text><text x="710" y="454" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">OOP at both levels;</text><text x="710" y="475" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">abstract data types HL only;</text><text x="710" y="496" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">code that actually runs</text><line x1="464" y1="454" x2="554" y2="454" stroke="#8a6d0d" stroke-width="3.5" marker-end="url(#ahO)"/><rect x="40" y="560" width="820" height="170" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="60" y="594" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Internal assessment: the computational solution</text><text x="840" y="594" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="end">35 h, SL and HL</text><text x="60" y="620" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A real-world problem of the student’s own choosing, solved with the B.1 process:</text><rect x="70" y="646" width="113.61500000000001" height="50" rx="9" fill="#fff" stroke="#2e6b62" stroke-width="2"/><text x="126.8075" y="677.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">specify</text><line x1="189.615" y1="671" x2="229.615" y2="671" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="235.615" y="646" width="133.505" height="50" rx="9" fill="#fff" stroke="#2e6b62" stroke-width="2"/><text x="302.3675" y="677.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">decompose</text><line x1="375.12" y1="671" x2="415.12" y2="671" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="421.12" y="646" width="123.56" height="50" rx="9" fill="#fff" stroke="#2e6b62" stroke-width="2"/><text x="482.9" y="677.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">abstract</text><line x1="550.6800000000001" y1="671" x2="590.6800000000001" y2="671" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="596.6800000000001" y="646" width="213.065" height="50" rx="9" fill="#fff" stroke="#2e6b62" stroke-width="2"/><text x="703.2125000000001" y="677.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">test and evaluate</text><text x="450" y="766" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Revise the two themes separately, alternating between them week by week.</text>
</svg>