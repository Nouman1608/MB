ont-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Limits what the researcher</text><text x="329.3333333333333" y="504.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">sees</text><rect x="600.6666666666666" y="400" width="269.3333333333333" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,450 L601.9166666666666,414.25 Q601.9166666666666,401.25 614.9166666666666,401.25 L855.75,401.25 Q868.75,401.25 868.75,414.25 L868.75,450 Z" fill="#f2e7b8"/><line x1="601.9166666666666" y1="450" x2="868.75" y2="450" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="430.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Can steer</text><text x="614.6666666666666" y="482.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Towards people who give a</text><text x="614.6666666666666" y="504.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">good impression</text><circle cx="520" cy="558" r="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="536" y="564" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">people the gatekeeper steers you towards</text>
