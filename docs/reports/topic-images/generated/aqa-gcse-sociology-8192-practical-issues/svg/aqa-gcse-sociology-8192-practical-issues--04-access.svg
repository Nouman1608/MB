<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 653" width="900" height="653" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="653" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Access: barriers and ways round them</text>

<rect x="30" y="104" width="404" height="416" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L419.75,105.25 Q432.75,105.25 432.75,118.25 L432.75,154 Z" fill="#f2e7b8"/><line x1="31.25" y1="154" x2="432.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Barriers</text><circle cx="53" cy="184.79" r="4.5" fill="#2e6b62"/><text x="66" y="190.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Closed institutions:</tspan> schools, prisons,</text><text x="66" y="212.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">hospitals (e.g. Carlen’s interviewees in</text><text x="66" y="234.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">prison or youth custody)</text><circle cx="53" cy="258.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="264.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Private settings:</tspan> family life behind</text><text x="66" y="286.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">closed doors</text><circle cx="53" cy="310.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="316.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Hidden or deviant groups</tspan> avoid</text><text x="66" y="338.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">researchers</text><circle cx="53" cy="362.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="368.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Powerful groups</tspan> can refuse and protect</text><text x="66" y="390.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">their privacy</text><circle cx="53" cy="414.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="420.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">No sampling frame</tspan>, e.g. people sleeping</text><text x="66" y="442.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">rough</text><circle cx="53" cy="466.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="472.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">The researcher’s age, sex, ethnicity,</tspan></text><text x="66" y="494.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">class and accent</tspan></text><rect x="466" y="104" width="404" height="416" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,154 L467.25,118.25 Q467.25,105.25 480.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#b5d3cf"/><line x1="467.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Ways round them</text><circle cx="489" cy="184.79" r="4.5" fill="#8a6d0d"/><text x="502" y="190.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Work through a trusted <tspan font-weight="700">gatekeeper</tspan></text><circle cx="489" cy="214.79" r="4.5" fill="#8a6d0d"/><text x="502" y="220.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Snowball sampling:</tspan> participants introduce</text><text x="502" y="242.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">others</text><circle cx="489" cy="266.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="272.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Spend time building trust first</text><circle cx="489" cy="296.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="302.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Offer <tspan font-weight="700">confidentiality</tspan> and <tspan font-weight="700">anonymity</tspan></text><circle cx="489" cy="326.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="332.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Choose a less intrusive method, such as</text><text x="502" y="354.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">an anonymous online questionnaire</text><circle cx="489" cy="378.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="384.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Use secondary sources when direct access</text><text x="502" y="406.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">is impossible</text><circle cx="450" cy="312" r="24" fill="#1e2a44"/><text x="450" y="319" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">vs</text><rect x="30" y="538" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="574" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Access is more than permission</text><text x="56" y="603" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">It also covers trust, safety and finding the people at all.</text>
</svg>