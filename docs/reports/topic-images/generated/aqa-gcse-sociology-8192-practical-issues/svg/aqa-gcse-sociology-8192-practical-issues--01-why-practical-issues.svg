<rect width="900" height="563" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why practical issues matter</text>

<rect x="30" y="112" width="840" height="70" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="450" y="145" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Sociologists choose the best method they can actually carry out</text><text x="450" y="170" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">A brilliant design that cannot be completed produces no data</text><rect x="30" y="206" width="269.3333333333333" height="151" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,257 L31.25,220.25 Q31.25,207.25 44.25,207.25 L285.0833333333333,207.25 Q298.0833333333333,207.25 298.0833333333333,220.25 L298.0833333333333,257 Z" fill="#b5d3cf"/><line x1="31.25" y1="257" x2="298.0833333333333" y2="257" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="237.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Time</text><text x="44" y="289.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Designing, gaining access,</text><text x="44" y="311.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">collecting, transcribing,</text><text x="44" y="333.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">analysing</text><rect x="315.3333333333333" y="206" width="269.3333333333333" height="151" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,257 L316.5833333333333,220.25 Q316.5833333333333,207.25 329.5833333333333,207.25 L570.4166666666666,207.25 Q583.4166666666666,207.25 583.4166666666666,220.25 L583.4166666666666,257 Z" fill="#f2e7b8"/><line x1="316.5833333333333" y1="257" x2="583.4166666666666" y2="257" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="237.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Cost</text><text x="329.3333333333333" y="289.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Researchers, travel,</text><text x="329.3333333333333" y="311.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">printing, equipment,</text><text x="329.3333333333333" y="333.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">transcription, incentives</text><rect x="600.6666666666666" y="206" width="269.3333333333333" height="151" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,257 L601.9166666666666,220.25 Q601.9166666666666,207.25 614.9166666666666,207.25 L855.75,207.25 Q868.75,207.25 868.75,220.25 L868.75,257 Z" fill="#dce9e7"/><line x1="601.9166666666666" y1="257" x2="868.75" y2="257" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="237.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Access</text><text x="614.6666666666666" y="289.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Reaching the people, places</text><text x="614.6666666666666" y="311.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">or documents needed</text><rect x="30" y="387" width="404" height="120" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="232" y="427" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Practical issues</text><text x="232" y="463" font-size="19" font-weight="600" fill="#2e6b62" text-anchor="middle">Can the research be done?</text><rect x="466" y="387" width="404" height="120" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="668" y="427" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Ethical issues</text><text x="668" y="463" font-size="19" font-weight="600" fill="#8a6d0d" text-anchor="middle">Should it be done this way?</text><text x="450" y="455" font-size="34" font-weight="700" fill="#b5602e" text-anchor="middle">≠</text><text x="450" y="537" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">Keep the two separate in answers</text>
</svg>