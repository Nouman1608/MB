<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 572" width="900" height="572" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="572" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Practical issues for a specific area</text>

<text x="450" y="96" font-size="19" font-weight="400" fill="#4a5568" text-anchor="middle">Area: young people who are members of street gangs</text><rect x="30" y="120" width="200" height="78" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="130" y="166" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Time</text><rect x="244" y="120" width="626" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="260" y="153.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Gaining trust could take months; participant observation means long</text><text x="260" y="175.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">periods with the group, often in the evenings</text><rect x="30" y="208" width="200" height="78" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="130" y="254" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Cost</text><rect x="244" y="208" width="626" height="78" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="260" y="241.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Funding for a long project and the researcher’s time; transcription</text><text x="260" y="263.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">adds expense</text><rect x="30" y="296" width="200" height="96" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="130" y="351" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Access</text><rect x="244" y="296" width="626" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="260" y="327.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">No sampling frame; distrust of outsiders and fear of police; age or</text><text x="260" y="349.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">background may block acceptance; a youth worker as gatekeeper;</text><text x="260" y="371.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">snowball sampling</text><line x1="450" y1="404" x2="450" y2="432" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="438" width="840" height="110" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="470" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement</text><text x="50" y="498" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A small number of unstructured interviews arranged through youth services: a less</text><text x="50" y="520" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">representative sample, in exchange for a workable study.</text>
</svg>