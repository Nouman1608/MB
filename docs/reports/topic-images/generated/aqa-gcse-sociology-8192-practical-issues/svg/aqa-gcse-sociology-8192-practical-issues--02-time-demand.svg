<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 743" width="900" height="743" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="743" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How much time does each method take?</text>

<text x="30" y="154" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Secondary data</text><text x="30" y="178" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Using official exam statistics</text><rect x="470" y="138" width="80" height="40" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="562" y="165" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Low</text><text x="30" y="226" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Closed-question questionnaire</text><text x="30" y="250" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Survey of attitudes to marriage across age groups</text><rect x="470" y="210" width="80" height="40" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="562" y="237" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Low</text><text x="30" y="298" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Structured interview</text><text x="30" y="322" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">A household survey on income</text><rect x="470" y="282" width="160" height="40" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="642" y="309" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Moderate</text><text x="30" y="370" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Unstructured interview</text><text x="30" y="394" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Experiences of women convicted of crimes</text><rect x="470" y="354" width="240" height="40" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="722" y="381" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">High</text><text x="30" y="442" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Participant observation</text><text x="30" y="466" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Ball’s three years at Beachside Comprehensive</text><rect x="470" y="426" width="320" height="40" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="802" y="453" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Very high</text><text x="30" y="514" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Longitudinal study</text><text x="30" y="538" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Following the same pupils from age 11 to 25</text><rect x="470" y="498" width="320" height="40" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="802" y="525" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Very high</text><text x="470" y="116" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Time demand</text><line x1="30" y1="570" x2="870" y2="570" stroke="#c9d6d4" stroke-width="2"/><rect x="30" y="586" width="840" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="622" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The trade-off</text><text x="56" y="651" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Methods with high validity, such as participant observation, usually take the most time. A</text><text x="56" y="673" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">short deadline may push a researcher to a questionnaire: more reliability and a larger</text><text x="56" y="695" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">sample, but less depth.</text>
</svg>