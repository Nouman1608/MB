<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 719" width="900" height="719" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="719" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Cost: what it buys and who pays</text>

<rect x="30" y="108" width="404" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,158 L31.25,122.25 Q31.25,109.25 44.25,109.25 L419.75,109.25 Q432.75,109.25 432.75,122.25 L432.75,158 Z" fill="#f2e7b8"/><line x1="31.25" y1="158" x2="432.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="139" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">What costs money</text><circle cx="57" cy="186.39" r="4.5" fill="#2e6b62"/><text x="70" y="192" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Paying researchers and interviewers</text><circle cx="57" cy="218.39" r="4.5" fill="#2e6b62"/><text x="70" y="224" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Travel to sites or homes</text><circle cx="57" cy="250.39" r="4.5" fill="#2e6b62"/><text x="70" y="256" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Printing and postage</text><circle cx="57" cy="282.39" r="4.5" fill="#2e6b62"/><text x="70" y="288" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Recording equipment, software, secure</text><text x="70" y="310" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">storage</text><circle cx="57" cy="336.39" r="4.5" fill="#2e6b62"/><text x="70" y="342" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Transcription services</text><circle cx="57" cy="368.39" r="4.5" fill="#2e6b62"/><text x="70" y="374" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Incentives such as vouchers</text><rect x="466" y="108" width="404" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,158 L467.25,122.25 Q467.25,109.25 480.25,109.25 L855.75,109.25 Q868.75,109.25 868.75,122.25 L868.75,158 Z" fill="#b5d3cf"/><line x1="467.25" y1="158" x2="868.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="139" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Who pays, and their influence</text><circle cx="493" cy="186.39" r="4.5" fill="#2e6b62"/><text x="506" y="192" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Universities, government departments,</text><text x="506" y="214" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">charities, businesses</text><circle cx="493" cy="242.39" r="4.5" fill="#2e6b62"/><text x="506" y="248" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Funding bodies</tspan> may influence the topic,</text><text x="506" y="270" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">timescale or method</text><circle cx="493" cy="298.39" r="4.5" fill="#2e6b62"/><text x="506" y="304" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A government department may fund</text><text x="506" y="326" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">research on a policy it wants evaluated;</text><text x="506" y="348" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">a charity on the issue it campaigns</text><text x="506" y="370" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">about</text><rect x="30" y="462" width="405" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,512 L31.25,476.25 Q31.25,463.25 44.25,463.25 L420.75,463.25 Q433.75,463.25 433.75,476.25 L433.75,512 Z" fill="#dce9e7"/><line x1="31.25" y1="512" x2="433.75" y2="512" stroke="#c9d6d4" stroke-width="2"/><text x="232.5" y="492.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Big budget</text><text x="44" y="544.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Large-scale surveys with a team: Townsend’s</text><text x="44" y="566.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">questionnaires to over 2,000 households</text><rect x="465" y="462" width="405" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M466.25,512 L466.25,476.25 Q466.25,463.25 479.25,463.25 L855.75,463.25 Q868.75,463.25 868.75,476.25 L868.75,512 Z" fill="#dce9e7"/><line x1="466.25" y1="512" x2="868.75" y2="512" stroke="#c9d6d4" stroke-width="2"/><text x="667.5" y="492.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Small budget</text><text x="479" y="544.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A few interviews, one observation setting,</text><text x="479" y="566.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">or secondary data, which are often free</text><rect x="30" y="606" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="642" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The trade-off</text><text x="56" y="671" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A cheaper method may mean a smaller or less representative sample.</text>
</svg>