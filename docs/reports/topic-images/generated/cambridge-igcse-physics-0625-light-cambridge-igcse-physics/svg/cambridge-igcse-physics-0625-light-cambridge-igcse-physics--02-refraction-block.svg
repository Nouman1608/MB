<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="640" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Refraction through a block</text>

<rect x="30" y="72" width="148.8" height="30" rx="15" fill="#8a6d0d"/><text x="42" y="93" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Extended only</text><rect x="30" y="110" width="420" height="500" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="90" y="220" width="300" height="220" rx="2" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="378" y="426" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end">plastic, n = 1.60</text><line x1="170" y1="110" x2="170" y2="340" stroke="#4a5568" stroke-width="2" stroke-dasharray="7 5"/><line x1="289.9758249835126" y1="350" x2="289.9758249835126" y2="540" stroke="#4a5568" stroke-width="2" stroke-dasharray="7 5"/><line x1="66.58400017893797" y1="133.22367269231717" x2="118.29200008946898" y2="176.61183634615858" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><line x1="118.29200008946898" y1="176.61183634615858" x2="170" y2="220" stroke="#b5602e" stroke-width="3.5"/><line x1="170" y1="220" x2="229.9879124917563" y2="330" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><line x1="229.9879124917563" y1="330" x2="289.9758249835126" y2="440" stroke="#b5602e" stroke-width="3.5"/><line x1="289.9758249835126" y1="440" x2="393.39182480457464" y2="526.7763273076828" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><line x1="170" y1="220" x2="323.2088886237956" y2="348.5575219373079" stroke="#4a5568" stroke-width="1.5" stroke-dasharray="4 5"/><path d="M127.9,184.6 A55,55 0 0 1 170.0,165.0" fill="none" stroke="#1e2a44" stroke-width="2"/><text x="108" y="158" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">i = 50°</text><path d="M203.5,281.5 A70,70 0 0 1 170.0,290.0" fill="none" stroke="#1e2a44" stroke-width="2"/><text x="184" y="312" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">r</text><text x="196" y="312" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">= 28.6°</text><text x="240" y="560" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">towards the normal going in, away coming out;</text><text x="240" y="582" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">the ray leaves parallel to the way it entered</text><rect x="460" y="130" width="410" height="282" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="480" y="166" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Worked example 1</text><text x="480" y="200" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">sin r = sin 50° / 1.60</text><text x="480" y="232" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">= 0.766 / 1.60 = 0.479</text><text x="480" y="264" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">r = 28.6°  (29°)</text><text x="480" y="296" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">speed = 3.0 × 10⁸ / 1.60</text><text x="480" y="328" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">= 1.9 × 10⁸ m/s</text><text x="480" y="360" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">sin c = 1 / 1.60 = 0.625</text><text x="480" y="392" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">c = 38.7°</text><rect x="460" y="428" width="410" height="182" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="665" y="496.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">n = sin i / sin r</text><text x="665" y="524.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">n = speed in air ÷ speed in material</text><text x="665" y="552.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">n = 1 / sin c</text>
</svg>