<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="700" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Dispersion of white light by a prism</text>

<rect x="30" y="110" width="840" height="450" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><polygon points="380,170 240,450 520,450" fill="#dce9e7" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><line x1="60" y1="300" x2="200" y2="316" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><line x1="200" y1="316" x2="300" y2="330" stroke="#1e2a44" stroke-width="5"/><text x="60" y="285" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">white light</text><polygon points="300,330 460,318 460,344" fill="#f2e7b8" stroke="none"/><line x1="460" y1="318" x2="790" y2="300" stroke="#b5602e" stroke-width="2.5"/><text x="800" y="306" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">red</text><line x1="460" y1="322.3" x2="790" y2="330" stroke="#4a5568" stroke-width="2.5"/><text x="800" y="336" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">orange</text><line x1="460" y1="326.6" x2="790" y2="360" stroke="#4a5568" stroke-width="2.5"/><text x="800" y="366" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">yellow</text><line x1="460" y1="330.9" x2="790" y2="390" stroke="#4a5568" stroke-width="2.5"/><text x="800" y="396" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">green</text><line x1="460" y1="335.2" x2="790" y2="420" stroke="#4a5568" stroke-width="2.5"/><text x="800" y="426" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">blue</text><line x1="460" y1="339.5" x2="790" y2="450" stroke="#4a5568" stroke-width="2.5"/><text x="800" y="456" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">indigo</text><line x1="460" y1="343.8" x2="790" y2="480" stroke="#2b5a9a" stroke-width="2.5"/><text x="800" y="486" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">violet</text><text x="640" y="270" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">red bends least</text><text x="640" y="530" font-size="16" font-weight="700" fill="#2b5a9a" text-anchor="middle">violet bends most</text><rect x="30" y="575" width="840" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="612" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">red → violet:  frequency increases, wavelength decreases</text><rect x="60" y="630" width="148.8" height="30" rx="15" fill="#8a6d0d"/><text x="72" y="651" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Extended only</text><text x="230" y="652" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">monochromatic light (one frequency) is refracted but not split</text>
</svg>