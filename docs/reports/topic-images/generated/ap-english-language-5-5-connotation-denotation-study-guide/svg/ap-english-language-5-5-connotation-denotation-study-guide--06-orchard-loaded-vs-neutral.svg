<rect width="900" height="574" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Loaded words, neutral words</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Worked example 2: the old orchard</text>
<text x="180" y="132" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">The writer chose</text><text x="430" y="132" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle" xml:space="preserve">Neutral version</text><text x="700" y="132" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Connotation</text><rect x="80" y="148" width="200" height="46" rx="23" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5" /><text x="180" y="178" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">swarmed</text><rect x="330" y="148" width="200" height="46" rx="23" fill="#ffffff" stroke="#c9d6d4" stroke-width="2" /><text x="430" y="178" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">arrived</text><text x="580" y="178" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">insects; an unwelcome invasion</text><rect x="80" y="204" width="200" height="46" rx="23" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5" /><text x="180" y="234" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">machines</text><rect x="330" y="204" width="200" height="46" rx="23" fill="#ffffff" stroke="#c9d6d4" stroke-width="2" /><text x="430" y="234" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">equipment</text><text x="580" y="234" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">cold and impersonal</text><rect x="80" y="260" width="200" height="46" rx="23" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5" /><text x="180" y="290" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">tearing out</text><rect x="330" y="260" width="200" height="46" rx="23" fill="#ffffff" stroke="#c9d6d4" stroke-width="2" /><text x="430" y="290" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">removing</text><text x="580" y="290" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">violence</text><rect x="80" y="316" width="200" height="46" rx="23" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5" /><text x="180" y="346" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">stood</text><rect x="330" y="316" width="200" height="46" rx="23" fill="#ffffff" stroke="#c9d6d4" stroke-width="2" /><text x="430" y="346" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">grown</text><text x="580" y="346" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">steady, dignified trees</text><rect x="80" y="372" width="200" height="46" rx="23" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5" /><text x="180" y="402" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">quiet hillside</text><rect x="330" y="372" width="200" height="46" rx="23" fill="#ffffff" stroke="#c9d6d4" stroke-width="2" /><text x="430" y="402" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">hillside</text><text x="580" y="402" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">peace, against the noise</text><rect x="80" y="428" width="200" height="46" rx="23" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5" /><text x="180" y="458" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">scar of mud</text><rect x="330" y="428" width="200" height="46" rx="23" fill="#ffffff" stroke="#c9d6d4" stroke-width="2" /><text x="430" y="458" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">cleared</text><text x="580" y="458" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">a wound</text><rect x="30" y="490" width="840" height="74.24000000000001" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="450" y="521.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Developers seem aggressive and the orchard a victim: the writer’s attitude is critical, and the reader is</text><text x="450" y="542.72" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">led to sympathise with the orchard.</text>
</svg>