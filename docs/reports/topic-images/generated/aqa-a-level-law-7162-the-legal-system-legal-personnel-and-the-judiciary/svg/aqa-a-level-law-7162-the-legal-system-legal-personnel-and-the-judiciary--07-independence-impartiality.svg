<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 508" width="900" height="508" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="508" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Independence and impartiality</text>

<rect x="30" y="100" width="412" height="81" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="236" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">INDEPENDENCE</text><text x="236" y="157.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Freedom from outside pressure</text><rect x="458" y="100" width="412" height="81" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="664" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">IMPARTIALITY</text><text x="664" y="157.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">No bias in a particular case</text><rect x="30" y="203" width="412" height="101" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="231" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">R (MILLER) v SECRETARY OF STATE (2017)</text><text x="46" y="262.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Government needed an Act of Parliament to give</text><text x="46" y="283.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">notice of withdrawal from the EU</text><rect x="30" y="316" width="412" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="344" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">R (MILLER) v THE PRIME MINISTER (2019)</text><text x="46" y="375.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Prorogation of Parliament held unlawful</text><rect x="458" y="203" width="412" height="193" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="474" y="255" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RE PINOCHET (1999)</text><text x="474" y="281.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Own earlier decision set aside</text><text x="474" y="309.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lord Hoffmann had links with Amnesty</text><text x="474" y="330.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">International, an intervener: justice must be seen</text><text x="474" y="351.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to be done</text><rect x="30" y="418" width="840" height="58" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="451.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Both Miller decisions went against the government of the day.</text>
</svg>