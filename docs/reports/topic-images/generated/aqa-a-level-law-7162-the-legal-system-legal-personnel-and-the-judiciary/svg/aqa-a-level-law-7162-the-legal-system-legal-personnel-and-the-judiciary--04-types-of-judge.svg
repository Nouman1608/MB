<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 728" width="900" height="728" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="728" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Types of judge</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Lord Chief Justice: head of the judiciary of England and Wales (CRA 2005)</text>
<rect x="150" y="124" width="720" height="58" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="170" y="149" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Justices of the Supreme Court</text><text x="170" y="171" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Final appeals on points of law of general public importance</text><rect x="150" y="190" width="720" height="58" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="170" y="215" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Lord and Lady Justices of Appeal</text><text x="170" y="237" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Court of Appeal, Civil and Criminal Divisions</text><rect x="150" y="256" width="720" height="58" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="170" y="281" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">High Court judges</text><text x="170" y="303" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">King’s Bench, Chancery, Family; most serious Crown Court cases</text><rect x="150" y="340" width="720" height="58" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="170" y="365" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Circuit judges</text><text x="170" y="387" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Crown Court and County Court</text><rect x="150" y="406" width="720" height="58" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="170" y="431" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Recorders</text><text x="170" y="453" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Part-time, Crown Court and County Court; often practising lawyers</text><rect x="150" y="472" width="720" height="58" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="170" y="497" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">District judges</text><text x="170" y="519" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">County Court, including small claims</text><rect x="150" y="538" width="720" height="58" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="170" y="563" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">District judges (magistrates’ courts)</text><text x="170" y="585" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Summary criminal cases, sitting alone</text><rect x="30" y="124" width="106" height="190" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="83" y="225" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">SUPERIOR</text><rect x="30" y="340" width="106" height="256" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="83" y="474" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">INFERIOR</text><rect x="30" y="618" width="840" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="650.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">The Lord Chief Justice presides over the Criminal Division of the Court of Appeal; the <tspan font-weight="700" fill="#1e2a44">Master</tspan> <tspan font-weight="700" fill="#1e2a44">of</tspan> <tspan font-weight="700" fill="#1e2a44">the</tspan> <tspan font-weight="700" fill="#1e2a44">Rolls</tspan></text><text x="450" y="671.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">heads the Civil Division.</text>
</svg>