<rect width="900" height="532" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Routes into the profession</text>

<text x="40" y="122" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Solicitors (standard route since September 2021)</text><rect x="30" y="136" width="184.5" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="122.25" y="170.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Degree or</text><text x="122.25" y="190.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">equivalent</text><line x1="220.5" y1="176" x2="242.5" y2="176" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="248.5" y="136" width="184.5" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="340.75" y="180.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">SQE1 and SQE2</text><line x1="439" y1="176" x2="461" y2="176" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="467" y="136" width="184.5" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="559.25" y="160.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Two years’</text><text x="559.25" y="180.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">qualifying work</text><text x="559.25" y="200.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">experience</text><line x1="657.5" y1="176" x2="679.5" y2="176" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="685.5" y="136" width="184.5" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="777.75" y="170.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Character and</text><text x="777.75" y="190.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">suitability</text><text x="40" y="262" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Barristers</text><rect x="30" y="276" width="140.8" height="60" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="100.4" y="310.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Degree</text><line x1="176.8" y1="306" x2="198.8" y2="306" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="204.8" y="276" width="140.8" height="60" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="275.20000000000005" y="300.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Vocational Bar</text><text x="275.20000000000005" y="320.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">course</text><line x1="351.6" y1="306" x2="373.6" y2="306" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="379.6" y="276" width="140.8" height="60" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="300.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Join an Inn of</text><text x="450" y="320.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Court</text><line x1="526.4000000000001" y1="306" x2="548.4000000000001" y2="306" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="554.4000000000001" y="276" width="140.8" height="60" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="624.8000000000001" y="310.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Call to the Bar</text><line x1="701.2" y1="306" x2="723.2" y2="306" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="729.2" y="276" width="140.8" height="60" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="799.6" y="310.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Pupillage</text><text x="40" y="360" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Inns: Lincoln’s Inn, Gray’s Inn, Inner Temple, Middle Temple. Senior barristers may become King’s Counsel.</text><text x="40" y="414" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Chartered legal executives</text><rect x="30" y="428" width="257.3333333333333" height="40" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="158.66666666666666" y="452.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">CILEx qualifications</text><line x1="293.3333333333333" y1="448" x2="315.3333333333333" y2="448" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="321.3333333333333" y="428" width="257.3333333333333" height="40" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="452.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Qualifying employment</text><line x1="584.6666666666666" y1="448" x2="606.6666666666666" y2="448" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="612.6666666666666" y="428" width="257.3333333333333" height="40" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="741.3333333333333" y="452.48" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Specialise from the start</text><text x="40" y="492" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">No degree needed: often described as widening access. Many later qualify as solicitors.</text>
</svg>