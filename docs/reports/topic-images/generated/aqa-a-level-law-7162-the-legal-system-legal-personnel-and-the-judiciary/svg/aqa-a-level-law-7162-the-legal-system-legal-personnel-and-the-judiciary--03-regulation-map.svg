<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" width="900" height="780" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="780" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who regulates lawyers?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Who sets the rules, who investigates misconduct, where a client complains</text>
<rect x="250" y="124" width="400" height="126" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="152" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">LEGAL SERVICES ACT 2007</text><text x="450" y="179.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Legal Services Board</text><text x="450" y="208.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Oversees front-line regulators; requires them to</text><text x="450" y="229.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">be independent of the professional bodies</text><line x1="340" y1="254" x2="164.66666666666666" y2="292" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="254" x2="450" y2="292" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="560" y1="254" x2="735.3333333333333" y2="292" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="296" width="269.3333333333333" height="147" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="324" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SOLICITORS</text><text x="46" y="350.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Solicitors Regulation</text><text x="46" y="373.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Authority</text><text x="46" y="401.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sets standards, authorises</text><text x="46" y="422.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">firms, investigates misconduct</text><rect x="315.3333333333333" y="296" width="269.3333333333333" height="147" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="331.3333333333333" y="324" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BARRISTERS</text><text x="331.3333333333333" y="350.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Bar Standards Board</text><text x="331.3333333333333" y="378.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">BSB Handbook and core</text><text x="331.3333333333333" y="399.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">duties; brings disciplinary</text><text x="331.3333333333333" y="420.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">charges</text><rect x="600.6666666666666" y="296" width="269.3333333333333" height="147" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="616.6666666666666" y="324" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LEGAL EXECUTIVES</text><text x="616.6666666666666" y="350.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">CILEx Regulation</text><text x="616.6666666666666" y="378.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The regulatory arm of CILEx</text><line x1="164.66666666666666" y1="447" x2="164.5" y2="479" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><line x1="450" y1="447" x2="449.5" y2="479" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="180.66666666666666" y="471" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">serious cases</text><rect x="30" y="483" width="269" height="119" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="46" y="512.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Solicitors Disciplinary</text><text x="46" y="533.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Tribunal</text><text x="46" y="560.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fine, suspend or strike off the</text><text x="46" y="581.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">roll</text><rect x="315" y="483" width="269" height="119" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="331" y="512.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Independent disciplinary</text><text x="331" y="533.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">tribunals</text><text x="331" y="560.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Reprimand, fine, suspend or</text><text x="331" y="581.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">disbar</text><rect x="30" y="624" width="412" height="124" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="652" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SERVICE COMPLAINTS</text><text x="46" y="678.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Legal Ombudsman</text><text x="46" y="706.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Any regulated lawyer, after the firm’s own</text><text x="46" y="727.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">procedure: apology, refund or compensation</text><rect x="458" y="624" width="412" height="124" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="474" y="652" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NEGLIGENCE</text><text x="474" y="678.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sue the lawyer</text><text x="474" y="706.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Advocates’ immunity (<tspan font-style="italic">Rondel</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Worsley</tspan>, 1969)</text><text x="474" y="727.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">removed in <tspan font-style="italic">Arthur</tspan> <tspan font-style="italic">JS</tspan> <tspan font-style="italic">Hall</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Simons</tspan> (2000)</text>
</svg>