<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 641" width="900" height="641" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="641" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How judicial independence is achieved</text>

<path d="M50,180 L450,100 L850,180 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><text x="450" y="164" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">Judicial independence</text><rect x="50" y="180" width="800" height="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><rect x="51" y="196" width="150" height="215" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="126" y="228" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Security of</text><text x="126" y="249" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">tenure</text><text x="126" y="300" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Superior judges</text><text x="126" y="319" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">removed only by</text><text x="126" y="338" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">the monarch on</text><text x="126" y="357" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">an address of</text><text x="126" y="376" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">both Houses</text><rect x="213" y="196" width="150" height="215" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="288" y="228" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Immunity from</text><text x="288" y="249" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">suit</text><text x="288" y="300" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Acts in judicial</text><text x="288" y="319" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">capacity in good</text><text x="288" y="338" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">faith: <tspan font-style="italic">Sirros</tspan> <tspan font-style="italic">v</tspan></text><text x="288" y="357" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-style="italic">Moore</tspan> (1975)</text><rect x="375" y="196" width="150" height="215" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="228" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Independence</text><text x="450" y="249" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">from the</text><text x="450" y="270" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Executive</text><text x="450" y="300" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">CRA 2005 s3;</text><text x="450" y="319" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">JAC</text><text x="450" y="338" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">appointments;</text><text x="450" y="357" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Supreme Court</text><text x="450" y="376" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">from 2009</text><rect x="537" y="196" width="150" height="215" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="612" y="228" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Financial</text><text x="612" y="249" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">security</text><text x="612" y="300" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Salaries from the</text><text x="612" y="319" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Consolidated</text><text x="612" y="338" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Fund, no annual</text><text x="612" y="357" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">vote</text><rect x="699" y="196" width="150" height="215" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="774" y="228" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Political</text><text x="774" y="249" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">neutrality</text><text x="774" y="300" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Cannot sit in the</text><text x="774" y="319" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">Commons; no</text><text x="774" y="338" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">party politics</text><rect x="50" y="411" width="800" height="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="427" width="840" height="82" rx="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="457" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">WHY: decide without pressure from ministers, Parliament, the parties or the media</text><text x="450" y="487" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Rule of law  ·  Separation of powers  ·  Article 6 ECHR fair hearing  ·  Public confidence</text><rect x="30" y="531" width="840" height="78" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="563.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700" fill="#1e2a44">Careful:</tspan> inferior judges can be removed for incapacity or misbehaviour by the Lord Chancellor with the</text><text x="450" y="584.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">agreement of the Lord Chief Justice.</text>
</svg>