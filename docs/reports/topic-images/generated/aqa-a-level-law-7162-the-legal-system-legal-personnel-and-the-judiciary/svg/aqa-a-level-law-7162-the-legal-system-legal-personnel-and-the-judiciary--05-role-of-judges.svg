<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 608" width="900" height="608" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="608" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What judges do</text>

<rect x="30" y="100" width="270.6666666666667" height="265" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="128" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CIVIL COURTS</text><text x="46" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Decide facts and law</text><text x="46" y="182.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="61.2" y="182.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Manage cases under the</text><text x="61.2" y="203.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Civil Procedure Rules</text><text x="46" y="229.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="61.2" y="229.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Almost all cases tried without</text><text x="61.2" y="250.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a jury</text><text x="46" y="276.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="61.2" y="276.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Give reasoned judgments</text><text x="46" y="302.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="61.2" y="302.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Award damages or</text><text x="61.2" y="323.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">injunctions</text><rect x="314.6666666666667" y="100" width="270.6666666666667" height="265" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="330.6666666666667" y="128" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CRIMINAL COURTS</text><text x="330.6666666666667" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Control the trial</text><text x="330.6666666666667" y="182.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="345.8666666666667" y="182.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Rule on law and admissibility</text><text x="345.8666666666667" y="203.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">of evidence</text><text x="330.6666666666667" y="229.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="345.8666666666667" y="229.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sum up and direct the jury on</text><text x="345.8666666666667" y="250.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the law</text><text x="330.6666666666667" y="276.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="345.8666666666667" y="276.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">May direct an acquittal if no</text><text x="345.8666666666667" y="297.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">case to answer; <tspan font-weight="700" fill="#1e2a44">never</tspan> to</text><text x="345.8666666666667" y="318.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">convict</text><text x="330.6666666666667" y="344.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="345.8666666666667" y="344.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Pass sentence</text><rect x="599.3333333333334" y="100" width="270.6666666666667" height="265" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="615.3333333333334" y="128" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">APPEAL COURTS</text><text x="615.3333333333334" y="154.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Shape the law</text><text x="615.3333333333334" y="182.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="630.5333333333334" y="182.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Correct errors</text><text x="615.3333333333334" y="208.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="630.5333333333334" y="208.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Interpret statutes</text><text x="615.3333333333334" y="234.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="630.5333333333334" y="234.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Develop the common law</text><text x="630.5333333333334" y="255.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">through precedent</text><clipPath id="tc387"><rect x="30" y="387" width="840" height="189" rx="14"/></clipPath><g clip-path="url(#tc387)"><rect x="30" y="387" width="262.5" height="48" fill="#b5d3cf"/><text x="44" y="414.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Civil judge</text><rect x="292.5" y="387" width="577.5" height="48" fill="#b5d3cf"/><text x="306.5" y="414.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Typical cases</text><rect x="30" y="435" width="262.5" height="47" fill="#dce9e7"/><text x="44" y="461.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">District judges</text><rect x="292.5" y="435" width="577.5" height="47" fill="#ffffff"/><text x="306.5" y="461.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Small claims and many fast-track cases</text><line x1="30" y1="482" x2="870" y2="482" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="482" width="262.5" height="47" fill="#dce9e7"/><text x="44" y="508.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Circuit judges</text><rect x="292.5" y="482" width="577.5" height="47" fill="#f8faf9"/><text x="306.5" y="508.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Larger County Court cases</text><line x1="30" y1="529" x2="870" y2="529" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="529" width="262.5" height="47" fill="#dce9e7"/><text x="44" y="555.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">High Court judges</text><rect x="292.5" y="529" width="577.5" height="47" fill="#ffffff"/><text x="306.5" y="555.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The highest-value and most complex claims</text></g><line x1="292.5" y1="387" x2="292.5" y2="576" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="387" width="840" height="189" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
</svg>