<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three branches of the legal profession</text>

<clipPath id="tc100"><rect x="30" y="100" width="840" height="538" rx="14"/></clipPath><g clip-path="url(#tc100)"><rect x="30" y="100" width="150.44776119402985" height="72" fill="#b5d3cf"/><rect x="180.44776119402985" y="100" width="229.85074626865676" height="72" fill="#b5d3cf"/><text x="194.44776119402985" y="128.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Solicitors</text><rect x="410.29850746268664" y="100" width="229.85074626865676" height="72" fill="#b5d3cf"/><text x="424.29850746268664" y="128.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Barristers</text><rect x="640.1492537313434" y="100" width="229.85074626865676" height="72" fill="#b5d3cf"/><text x="654.1492537313434" y="128.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Chartered legal</text><text x="654.1492537313434" y="151.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">executives</text><rect x="30" y="172" width="150.44776119402985" height="131" fill="#dce9e7"/><text x="44" y="198.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Typical work</text><rect x="180.44776119402985" y="172" width="229.85074626865676" height="131" fill="#ffffff"/><text x="194.44776119402985" y="198.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">First point of contact;</text><text x="194.44776119402985" y="219.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">advice, drafting,</text><text x="194.44776119402985" y="240.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">conveyancing, wills,</text><text x="194.44776119402985" y="261.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">family, commercial,</text><text x="194.44776119402985" y="282.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">litigation</text><rect x="410.29850746268664" y="172" width="229.85074626865676" height="131" fill="#ffffff"/><text x="424.29850746268664" y="198.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Specialist advocacy and</text><text x="424.29850746268664" y="219.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">written opinions; drafting</text><text x="424.29850746268664" y="240.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">court documents</text><rect x="640.1492537313434" y="172" width="229.85074626865676" height="131" fill="#ffffff"/><text x="654.1492537313434" y="198.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Specialist work in one</text><text x="654.1492537313434" y="219.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">area, such as</text><text x="654.1492537313434" y="240.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">conveyancing, family,</text><text x="654.1492537313434" y="261.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">probate or litigation</text><line x1="30" y1="303" x2="870" y2="303" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="303" width="150.44776119402985" height="68" fill="#dce9e7"/><text x="44" y="329.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Instructed by</text><rect x="180.44776119402985" y="303" width="229.85074626865676" height="68" fill="#f8faf9"/><text x="194.44776119402985" y="329.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Clients directly</text><rect x="410.29850746268664" y="303" width="229.85074626865676" height="68" fill="#f8faf9"/><text x="424.29850746268664" y="329.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Usually a solicitor; some</text><text x="424.29850746268664" y="350.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">public access work</text><rect x="640.1492537313434" y="303" width="229.85074626865676" height="68" fill="#f8faf9"/><text x="654.1492537313434" y="329.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Clients, usually within a</text><text x="654.1492537313434" y="350.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">firm</text><line x1="30" y1="371" x2="870" y2="371" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="371" width="150.44776119402985" height="110" fill="#dce9e7"/><text x="44" y="397.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Rights of</text><text x="44" y="418.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">audience</text><rect x="180.44776119402985" y="371" width="229.85074626865676" height="110" fill="#ffffff"/><text x="194.44776119402985" y="397.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Magistrates’ and county</text><text x="194.44776119402985" y="418.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">courts; higher courts with</text><text x="194.44776119402985" y="439.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a higher rights</text><text x="194.44776119402985" y="460.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">qualification</text><rect x="410.29850746268664" y="371" width="229.85074626865676" height="110" fill="#f2e7b8"/><text x="424.29850746268664" y="397.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">All courts</text><rect x="640.1492537313434" y="371" width="229.85074626865676" height="110" fill="#ffffff"/><text x="654.1492537313434" y="397.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Limited; extended with</text><text x="654.1492537313434" y="418.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">further qualification</text><line x1="30" y1="481" x2="870" y2="481" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="481" width="150.44776119402985" height="89" fill="#dce9e7"/><text x="44" y="507.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Organisation</text><rect x="180.44776119402985" y="481" width="229.85074626865676" height="89" fill="#f8faf9"/><text x="194.44776119402985" y="507.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Firms, partnerships,</text><text x="194.44776119402985" y="528.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">companies, or in-house</text><rect x="410.29850746268664" y="481" width="229.85074626865676" height="89" fill="#f8faf9"/><text x="424.29850746268664" y="507.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mostly self-employed in</text><text x="424.29850746268664" y="528.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">chambers; some</text><text x="424.29850746268664" y="549.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">employed (e.g. CPS)</text><rect x="640.1492537313434" y="481" width="229.85074626865676" height="89" fill="#f8faf9"/><text x="654.1492537313434" y="507.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Employed, often in</text><text x="654.1492537313434" y="528.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">solicitors’ firms; can</text><text x="654.1492537313434" y="549.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">become partners</text><line x1="30" y1="570" x2="870" y2="570" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="570" width="150.44776119402985" height="68" fill="#dce9e7"/><text x="44" y="596.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Professional</text><text x="44" y="617.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">body</text><rect x="180.44776119402985" y="570" width="229.85074626865676" height="68" fill="#ffffff"/><text x="194.44776119402985" y="596.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Law Society</text><rect x="410.29850746268664" y="570" width="229.85074626865676" height="68" fill="#ffffff"/><text x="424.29850746268664" y="596.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Bar Council; four Inns of</text><text x="424.29850746268664" y="617.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Court</text><rect x="640.1492537313434" y="570" width="229.85074626865676" height="68" fill="#ffffff"/><text x="654.1492537313434" y="596.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">CILEx</text></g><line x1="180.44776119402985" y1="100" x2="180.44776119402985" y2="638" stroke="#c9d6d4" stroke-width="1.5"/><line x1="410.29850746268664" y1="100" x2="410.29850746268664" y2="638" stroke="#c9d6d4" stroke-width="1.5"/><line x1="640.1492537313434" y1="100" x2="640.1492537313434" y2="638" stroke="#c9d6d4" stroke-width="1.5"/><rect x="30" y="100" width="840" height="538" rx="14" fill="none" stroke="#1e2a44" stroke-width="2.5"/>
