<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 838" width="900" height="838" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="838" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Is a duty of care owed?</text>

<rect x="30" y="100" width="840" height="129" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DONOGHUE v STEVENSON (1932)</text><text x="48" y="156.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The neighbour principle</text><text x="48" y="185.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Those so closely and directly affected that you ought reasonably to have them in contemplation. Not a</text><text x="48" y="206.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">distant hearer of a crash: <tspan font-style="italic">Bourhill</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Young</tspan> (1943).</text><rect x="230" y="285" width="440" height="52" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="315.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Established category? (Robinson, 2018)</text><rect x="30" y="383" width="300" height="87" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="180" y="417.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">YES: apply the duty</text><text x="180" y="445.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">No need for Caparo</text><rect x="380" y="383" width="490" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="625" y="417.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">NO: genuinely new duty</text><text x="625" y="445.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Caparo (1990) guides the court, by analogy with existing</text><text x="625" y="466.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">cases</text><line x1="450" y1="259" x2="450" y2="281" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="360" y1="341" x2="200" y2="379" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="560" y1="341" x2="625" y2="379" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="300" y="353" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end">yes</text><text x="602" y="353" font-size="16" font-weight="700" fill="#b5602e" text-anchor="start">no</text><rect x="380" y="507" width="490" height="41" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="392" y="532.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">1 Damage reasonably foreseeable</text><rect x="380" y="556" width="490" height="41" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="392" y="581.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">2 Sufficient proximity</text><rect x="380" y="605" width="490" height="41" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="392" y="630.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">3 Fair, just and reasonable</text><line x1="625" y1="493" x2="625" y2="505" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="672" width="840" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="702" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">POLICY AT STAGE 3: REASONS TO REFUSE A DUTY</text><text x="48" y="733.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="733.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Floodgates:</tspan> fear of unlimited claims</text><text x="48" y="758.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="758.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Defensive</tspan> <tspan font-weight="700" fill="#1e2a44">practices:</tspan> <tspan font-style="italic">Hill</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">CC</tspan> <tspan font-style="italic">of</tspan> <tspan font-style="italic">West</tspan> <tspan font-style="italic">Yorkshire</tspan> (1989), police and a serial killer’s potential victim</text><text x="48" y="783.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="783.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Public</tspan> <tspan font-weight="700" fill="#1e2a44">interest</tspan> <tspan font-weight="700" fill="#1e2a44">and</tspan> <tspan font-weight="700" fill="#1e2a44">combat:</tspan> <tspan font-style="italic">Mulcahy</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">MoD</tspan> (1996), soldiers in battle</text>
</svg>