<rect width="900" height="643" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Nervous shock: who can recover?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A recognised psychiatric illness, not ordinary grief or distress</text>
<rect x="30" y="124" width="412" height="151" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PRIMARY VICTIM</text><text x="48" y="180.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Within the range of foreseeable physical</text><text x="48" y="203.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">injury</text><text x="48" y="231.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Psychiatric harm recoverable even if not itself</text><text x="48" y="252.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">foreseeable: <tspan font-style="italic">Page</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Smith</tspan> (1996)</text><rect x="458" y="124" width="412" height="151" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="476" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SECONDARY VICTIM</text><text x="476" y="180.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Witnesses harm to another</text><text x="476" y="208.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Must pass all three <tspan font-style="italic">Alcock</tspan> (1992) controls below</text><rect x="30" y="297" width="270.6666666666667" height="144" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="46" y="327.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Close tie of love and</text><text x="46" y="350.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">affection</text><text x="46" y="378.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Kept by the Law Commission</text><text x="46" y="399.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1998)</text><rect x="314.6666666666667" y="297" width="270.6666666666667" height="144" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330.6666666666667" y="327.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Proximity in time and</text><text x="330.6666666666667" y="350.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">space</text><text x="330.6666666666667" y="378.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Event or immediate aftermath:</text><text x="330.6666666666667" y="399.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">McLoughlin</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">O’Brian</tspan> (1983),</text><text x="330.6666666666667" y="420.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">about two hours</text><rect x="599.3333333333334" y="297" width="270.6666666666667" height="144" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="615.3333333333334" y="327.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Own unaided senses</text><text x="615.3333333333334" y="355.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Perceived the event or</text><text x="615.3333333333334" y="376.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">aftermath directly</text><text x="571.3333333333334" y="463" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">reform would remove</text><text x="856" y="463" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">reform would remove</text><rect x="30" y="489" width="413" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="517" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RESCUERS AND EMPLOYEES</text><text x="46" y="548.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No special duty: <tspan font-style="italic">White</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">CC</tspan> <tspan font-style="italic">of</tspan> <tspan font-style="italic">South</tspan> <tspan font-style="italic">Yorkshire</tspan></text><text x="46" y="569.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(1998), Hillsborough police officers</text><rect x="457" y="489" width="413" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="473" y="517" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MEDICAL NEGLIGENCE</text><text x="473" y="548.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Paul</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Royal</tspan> <tspan font-style="italic">Wolverhampton</tspan> <tspan font-style="italic">NHS</tspan> <tspan font-style="italic">Trust</tspan> (2024):</text><text x="473" y="569.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">relatives witnessing a death from earlier</text><text x="473" y="590.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">negligence could not recover</text>
</svg>