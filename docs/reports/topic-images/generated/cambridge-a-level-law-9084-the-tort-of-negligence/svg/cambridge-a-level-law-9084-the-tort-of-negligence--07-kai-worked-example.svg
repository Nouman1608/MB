<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 649" width="900" height="649" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="649" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: Kai’s rewiring</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A fire injures Ben, 9; his mother Lucy arrives an hour later</text>
<line x1="60" y1="144" x2="60" y2="597" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="124" width="766" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DUTY TO BEN</text><text x="122" y="181.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Established category: electrician to occupants</text><text x="122" y="210.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Caparo is not needed (<tspan font-style="italic">Robinson</tspan>).</text><circle cx="60" cy="178.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="187.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="245" width="766" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="275" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BREACH</text><text x="122" y="302.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Judged as a reasonably competent electrician</text><text x="122" y="331.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Not as newly qualified. A minority method can satisfy <tspan font-style="italic">Bolam</tspan> if responsible and logical (<tspan font-style="italic">Bolitho</tspan>).</text><circle cx="60" cy="299.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="308.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="366" width="766" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="396" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CAUSATION AND REMOTENESS</text><text x="122" y="423.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">But for the wiring, no fire</text><text x="122" y="452.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Burn injury is a foreseeable kind of harm.</text><circle cx="60" cy="420.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="429.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="487" width="766" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122" y="517" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LUCY: SECONDARY VICTIM</text><text x="122" y="544.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Likely to satisfy Alcock</text><text x="122" y="573.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Close tie; saw the immediate aftermath within an hour (compare <tspan font-style="italic">McLoughlin</tspan>); recognised illness</text><text x="122" y="594.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(PTSD).</text><circle cx="60" cy="552" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="560.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text>
</svg>