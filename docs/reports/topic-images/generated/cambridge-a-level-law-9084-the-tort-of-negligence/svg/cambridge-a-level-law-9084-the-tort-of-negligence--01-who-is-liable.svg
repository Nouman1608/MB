<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who is liable in negligence?</text>

<rect x="30" y="100" width="270" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="315" y="100" width="270" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="600" y="100" width="270" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165" y="134" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Personal</text><circle cx="110" cy="170" r="9" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><path d="M110,179 L110,204 M97,188 L123,188 M110,204 L99,222 M110,204 L121,222" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><line x1="135" y1="195" x2="195" y2="195" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><circle cx="220" cy="170" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><path d="M220,179 L220,204 M207,188 L233,188 M220,204 L209,222 M220,204 L231,222" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="110" y="250" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">defendant</text><text x="220" y="250" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">claimant</text><text x="450" y="134" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Vicarious (outline)</text><rect x="345" y="164" width="80" height="40" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="385" y="190" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">employer</text><circle cx="385" cy="212" r="9" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><path d="M385,221 L385,246 M372,230 L398,230 M385,246 L374,264 M385,246 L396,264" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="385" y="268" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><line x1="410" y1="240" x2="490" y2="240" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><circle cx="525" cy="200" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><path d="M525,209 L525,234 M512,218 L538,218 M525,234 L514,252 M525,234 L536,252" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="525" y="175" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">claimant</text><path d="M425,184 Q485,170 511,192" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5"/><text x="735" y="134" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Joint</text><circle cx="645" cy="170" r="9" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><path d="M645,179 L645,204 M632,188 L658,188 M645,204 L634,222 M645,204 L656,222" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="695" cy="170" r="9" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><path d="M695,179 L695,204 M682,188 L708,188 M695,204 L684,222 M695,204 L706,222" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><line x1="710" y1="182" x2="785" y2="192" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><line x1="660" y1="228" x2="785" y2="208" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><circle cx="815" cy="170" r="9" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><path d="M815,179 L815,204 M802,188 L828,188 M815,204 L804,222 M815,204 L826,222" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="815" y="250" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">same damage</text><rect x="30" y="284" width="270" height="158" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="312.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The defendant’s own liability</text><text x="46" y="333.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">for their own negligence</text><rect x="315" y="284" width="270" height="158" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="331" y="312.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="346.2" y="312.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Relationship of employment</text><text x="346.2" y="333.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">or akin to it (<tspan font-style="italic">Various</tspan></text><text x="346.2" y="354.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Claimants</tspan>, 2012)</text><text x="331" y="379.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="346.2" y="379.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Tort closely connected with</text><text x="346.2" y="400.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the job (<tspan font-style="italic">Lister</tspan>, 2001;</text><text x="346.2" y="421.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Mohamud</tspan>, 2016)</text><rect x="600" y="284" width="270" height="158" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="616" y="312.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="631.2" y="312.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Each liable for the whole loss</text><text x="616" y="337.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="631.2" y="337.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Contribution between them:</text><text x="631.2" y="358.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Civil Liability (Contribution)</text><text x="631.2" y="379.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Act 1978</text><rect x="30" y="464" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="497.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle"><tspan font-weight="700" fill="#1e2a44">Why</tspan> <tspan font-weight="700" fill="#1e2a44">vicarious</tspan> <tspan font-weight="700" fill="#1e2a44">liability?</tspan> The employer profits from the activity, is better able to pay and can insure.</text>
