<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Pure economic loss and negligent misstatement</text>

<rect x="30" y="100" width="840" height="108" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="130" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">GENERAL RULE</text><text x="48" y="156.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Financial loss not resulting from physical damage is not recoverable</text><text x="48" y="185.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Spartan</tspan> <tspan font-style="italic">Steel</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Martin</tspan> (1973); <tspan font-style="italic">Murphy</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Brentwood</tspan> <tspan font-style="italic">DC</tspan> (1990)</text><line x1="450" y1="212" x2="450" y2="232" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="462" y="226" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">exception</text><rect x="30" y="252" width="840" height="134" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="284" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">HEDLEY BYRNE v HELLER (1964): A SPECIAL RELATIONSHIP</text><rect x="50" y="302" width="257.3333333333333" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="178.66666666666666" y="339.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Defendant has special skill</text><rect x="321.3333333333333" y="302" width="257.3333333333333" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="329.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Knows the claimant will</text><text x="450" y="350.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">rely on the statement</text><rect x="592.6666666666666" y="302" width="257.3333333333333" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="721.3333333333333" y="339.76" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Reliance is reasonable</text><rect x="30" y="408" width="270.6666666666667" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="436" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">NO DUTY</text><text x="46" y="467.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Caparo</tspan> (1990): auditors and</text><text x="46" y="488.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">investors in general</text><rect x="314.6666666666667" y="408" width="270.6666666666667" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330.6666666666667" y="436" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DUTY</text><text x="330.6666666666667" y="467.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Chaudhry</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Prabhakar</tspan> (1989):</text><text x="330.6666666666667" y="488.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a friend who claimed</text><text x="330.6666666666667" y="509.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">knowledge of cars</text><rect x="599.3333333333334" y="408" width="270.6666666666667" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="615.3333333333334" y="436" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DUTY</text><text x="615.3333333333334" y="467.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Smith</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Eric</tspan> <tspan font-style="italic">S</tspan> <tspan font-style="italic">Bush</tspan> (1990):</text><text x="615.3333333333334" y="488.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">surveyor’s valuation relied on</text><text x="615.3333333333334" y="509.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">by a buyer</text>
