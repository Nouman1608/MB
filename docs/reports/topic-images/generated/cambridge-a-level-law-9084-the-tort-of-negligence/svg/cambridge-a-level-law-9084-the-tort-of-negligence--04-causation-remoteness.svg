<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="670" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Causation and remoteness</text>

<rect x="30" y="100" width="840" height="154" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="48" y="130" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FACTUAL CAUSATION</text><text x="48" y="156.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">But for the breach, would the harm have occurred?</text><text x="48" y="185.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="185.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Multiple</tspan> <tspan font-weight="700" fill="#1e2a44">causes:</tspan> one of five possible causes failed (<tspan font-style="italic">Wilsher</tspan>, 1988); a material contribution was enough</text><text x="63.2" y="206.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(<tspan font-style="italic">Bonnington</tspan> <tspan font-style="italic">Castings</tspan>, 1956)</text><text x="48" y="231.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="231.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Narrow</tspan> <tspan font-weight="700" fill="#1e2a44">exception:</tspan> mesothelioma and several employers (<tspan font-style="italic">Fairchild</tspan>, 2002)</text><line x1="450" y1="262" x2="450" y2="282" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="306" width="270.6666666666667" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="334" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">NOVUS ACTUS: THIRD PARTY</text><text x="46" y="365.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Knightley</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Johns</tspan> (1982):</text><text x="46" y="386.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">negligent order to ride against</text><text x="46" y="407.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the traffic</text><rect x="314.6666666666667" y="306" width="270.6666666666667" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330.6666666666667" y="334" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">NOVUS ACTUS: CLAIMANT</text><text x="330.6666666666667" y="365.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">McKew</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Holland</tspan> (1969): steep</text><text x="330.6666666666667" y="386.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">stairs, no handrail, weakened</text><text x="330.6666666666667" y="407.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">leg</text><rect x="599.3333333333334" y="306" width="270.6666666666667" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="615.3333333333334" y="334" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">NOVUS ACTUS: NATURE</text><text x="615.3333333333334" y="365.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A natural event independent of</text><text x="615.3333333333334" y="386.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the breach</text><line x1="450" y1="436" x2="450" y2="456" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="480" width="840" height="158" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="48" y="510" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">REMOTENESS: THE WAGON MOUND (No 1) (1961)</text><text x="48" y="536.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Was the KIND of damage reasonably foreseeable?</text><text x="48" y="565.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="565.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Precise manner need not be foreseen: <tspan font-style="italic">Hughes</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Lord</tspan> <tspan font-style="italic">Advocate</tspan> (1963)</text><text x="48" y="590.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="590.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A different kind is too remote: <tspan font-style="italic">Doughty</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Turner</tspan> (1964), molten eruption</text><text x="48" y="615.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="63.2" y="615.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Thin skull: take the claimant as you find them, <tspan font-style="italic">Smith</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Leech</tspan> <tspan font-style="italic">Brain</tspan> (1962)</text>
</svg>