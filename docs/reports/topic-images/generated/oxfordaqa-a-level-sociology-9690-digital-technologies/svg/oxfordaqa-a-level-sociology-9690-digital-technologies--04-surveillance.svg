<rect width="900" height="813" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Beyond the watchtower</text>

<rect x="30" y="110" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="148" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Surveillant assemblage (Haggerty and Ericson, 2000)</text><rect x="60" y="180" width="190" height="48" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="155" y="211" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Cards</text><line x1="254" y1="204" x2="352" y2="300" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="60" y="242" width="190" height="48" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="155" y="273" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Phones</text><line x1="254" y1="266" x2="352" y2="300" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="60" y="304" width="190" height="48" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="155" y="335" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Cameras</text><line x1="254" y1="328" x2="352" y2="300" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="60" y="366" width="190" height="48" rx="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="155" y="397" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Online activity</text><line x1="254" y1="390" x2="352" y2="300" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><rect x="358" y="250" width="180" height="100" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="448" y="295" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">“Data double”</text><text x="448" y="320" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">of the individual</text><line x1="542" y1="300" x2="612" y2="300" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="618" y="180" width="230" height="240" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="733" y="210" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Social sorting</text><text x="733" y="232" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Lyon (2003)</text><text x="733" y="270" font-size="17" font-weight="600" fill="#8a6d0d" text-anchor="middle">risky or safe?</text><text x="733" y="298" font-size="17" font-weight="600" fill="#8a6d0d" text-anchor="middle">profitable or not?</text><text x="733" y="350" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">categories shape</text><text x="733" y="371" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">people’s chances</text><rect x="30" y="460" width="269.3333333333333" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,510 L31.25,474.25 Q31.25,461.25 44.25,461.25 L285.0833333333333,461.25 Q298.0833333333333,461.25 298.0833333333333,474.25 L298.0833333333333,510 Z" fill="#b5d3cf"/><line x1="31.25" y1="510" x2="298.0833333333333" y2="510" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="490.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">State</text><text x="44" y="541.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Snowden (2013): mass</text><text x="44" y="562.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">collection of communications</text><text x="44" y="583.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">data by the NSA and</text><text x="44" y="604.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">partners.</text><rect x="315.3333333333333" y="460" width="269.3333333333333" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,510 L316.5833333333333,474.25 Q316.5833333333333,461.25 329.5833333333333,461.25 L570.4166666666666,461.25 Q583.4166666666666,461.25 583.4166666666666,474.25 L583.4166666666666,510 Z" fill="#b5d3cf"/><line x1="316.5833333333333" y1="510" x2="583.4166666666666" y2="510" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="490.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Sousveillance</text><text x="329.3333333333333" y="541.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Mann: watching from below,</text><text x="329.3333333333333" y="562.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">as when citizens film</text><text x="329.3333333333333" y="583.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">police.</text><rect x="600.6666666666666" y="460" width="269.3333333333333" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,510 L601.9166666666666,474.25 Q601.9166666666666,461.25 614.9166666666666,461.25 L855.75,461.25 Q868.75,461.25 868.75,474.25 L868.75,510 Z" fill="#b5d3cf"/><line x1="601.9166666666666" y1="510" x2="868.75" y2="510" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="490.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Everyday</text><text x="614.6666666666666" y="541.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Keystroke monitoring,</text><text x="614.6666666666666" y="562.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">parents tracking phones,</text><text x="614.6666666666666" y="583.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">smart doorbells.</text><rect x="30" y="646" width="840" height="141" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="682" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluation</text><circle cx="61" cy="705.39" r="4.5" fill="#8a6d0d"/><text x="74" y="711" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Supporters:</tspan> crime prevention and safety</text><circle cx="61" cy="735.39" r="4.5" fill="#8a6d0d"/><text x="74" y="741" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Critics:</tspan> chilling effect on free expression; unequal targeting of minorities and</text><text x="74" y="763" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">poorer areas; "nothing to hide" ignores later misuse</text>
</svg>