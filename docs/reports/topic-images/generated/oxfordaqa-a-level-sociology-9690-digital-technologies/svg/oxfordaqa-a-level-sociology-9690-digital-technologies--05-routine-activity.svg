<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="680" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why the internet suits crime</text>

<rect x="45" y="110" width="250" height="100" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="170" y="168" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Motivated offender</text><line x1="170" y1="214" x2="366" y2="282" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325" y="110" width="250" height="100" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="154" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Suitable target</text><text x="450" y="184" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle">online: plentiful</text><line x1="450" y1="214" x2="450" y2="282" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="605" y="110" width="250" height="100" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="730" y="154" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">No capable guardian</text><text x="730" y="184" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="middle">online: guardians scarce</text><line x1="730" y1="214" x2="534" y2="282" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="310" y="168" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><text x="590" y="168" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><rect x="330" y="288" width="240" height="60" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="326" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Crime occurs</text><text x="450" y="378" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Yar (2006) applies routine activity theory online</text><rect x="30" y="400" width="269.3333333333333" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,450 L31.25,414.25 Q31.25,401.25 44.25,401.25 L285.0833333333333,401.25 Q298.0833333333333,401.25 298.0833333333333,414.25 L298.0833333333333,450 Z" fill="#b5d3cf"/><line x1="31.25" y1="450" x2="298.0833333333333" y2="450" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="430.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Ransomware</text><text x="44" y="481.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">WannaCry (2017) disrupted</text><text x="44" y="502.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">parts of England’s NHS.</text><rect x="315.3333333333333" y="400" width="269.3333333333333" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,450 L316.5833333333333,414.25 Q316.5833333333333,401.25 329.5833333333333,401.25 L570.4166666666666,401.25 Q583.4166666666666,401.25 583.4166666666666,414.25 L583.4166666666666,450 Z" fill="#b5d3cf"/><line x1="316.5833333333333" y1="450" x2="583.4166666666666" y2="450" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="430.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Attacks on states</text><text x="329.3333333333333" y="481.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Estonia (2007): government,</text><text x="329.3333333333333" y="502.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">bank and media sites.</text><rect x="600.6666666666666" y="400" width="269.3333333333333" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,450 L601.9166666666666,414.25 Q601.9166666666666,401.25 614.9166666666666,401.25 L855.75,401.25 Q868.75,401.25 868.75,414.25 L868.75,450 Z" fill="#b5d3cf"/><line x1="601.9166666666666" y1="450" x2="868.75" y2="450" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="430.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Hacking</text><text x="614.6666666666666" y="481.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Criminal, "ethical" (paid by</text><text x="614.6666666666666" y="502.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">firms) or hacktivism</text><text x="614.6666666666666" y="523.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(Anonymous).</text><rect x="30" y="565" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="601" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Measurement</text><text x="56" y="630" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Victims often do not report, so official figures understate cybercrime.</text>
</svg>