<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 799" width="900" height="799" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="799" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Online games stretch the magic circle</text>

<rect x="30" y="110" width="840" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="148" font-size="20" font-weight="700" fill="#4a5568" text-anchor="start">Everyday life</text><circle cx="450" cy="310" r="125" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3" stroke-dasharray="12 8"/><text x="450" y="292" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">The game’s “magic</text><text x="450" y="318" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">circle”</text><text x="450" y="352" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">its own rules</text><rect x="45" y="170" width="210" height="58" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="150" y="204.15" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Friendships</text><line x1="327.3988383912396" y1="258.444639733752" x2="262.3745059614292" y2="231.1010743017292" stroke="#2e6b62" stroke-width="3.5" marker-start="url(#ahT)" marker-end="url(#ahT)"/><rect x="645" y="170" width="210" height="58" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="750" y="204.15" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Money</text><line x1="572.6011616087604" y1="258.444639733752" x2="637.6254940385708" y2="231.1010743017292" stroke="#2e6b62" stroke-width="3.5" marker-start="url(#ahT)" marker-end="url(#ahT)"/><rect x="45" y="390" width="210" height="58" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="150" y="424.15" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Identity</text><line x1="326.9525737561588" y1="360.4809953820887" x2="262.401348946998" y2="386.96354914994953" stroke="#2e6b62" stroke-width="3.5" marker-start="url(#ahT)" marker-end="url(#ahT)"/><rect x="645" y="390" width="210" height="80" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="750" y="424.15" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Work: paid</text><text x="750" y="446.15" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">“boosting”, esports</text><line x1="573.0474262438412" y1="360.4809953820887" x2="637.5986510530021" y2="386.96354914994953" stroke="#2e6b62" stroke-width="3.5" marker-start="url(#ahT)" marker-end="url(#ahT)"/><text x="450" y="500" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Huizinga (Homo Ludens, 1938): play happens inside a magic circle separate from ordinary</text><text x="450" y="521" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">life. Online games stretch it.</text><rect x="30" y="550" width="840" height="223" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="586" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Sociological themes</text><circle cx="61" cy="609.39" r="4.5" fill="#8a6d0d"/><text x="74" y="615" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Community and identity:</tspan> guilds, clans, streams; experimenting with avatars</text><circle cx="61" cy="639.39" r="4.5" fill="#8a6d0d"/><text x="74" y="645" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Gender:</tspan> Gamergate (2014), harassment of women; a hobby space defended as male</text><text x="74" y="667" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">territory</text><circle cx="61" cy="691.39" r="4.5" fill="#8a6d0d"/><text x="74" y="697" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Commercialisation:</tspan> loot boxes examined by some regulators as possible gambling</text><circle cx="61" cy="721.39" r="4.5" fill="#8a6d0d"/><text x="74" y="727" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Moral panics:</tspan> games blamed after Columbine (1999); research on violence remains</text><text x="74" y="749" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">contested</text>
</svg>