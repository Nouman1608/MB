<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 725" width="900" height="725" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="725" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three levels of the digital divide</text>

<rect x="30" y="250" width="270" height="160" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="165" y="286" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">First level</text><text x="165" y="320" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Access to devices and</text><text x="165" y="342" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">connections</text><rect x="315" y="180" width="270" height="230" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="216" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Second level</text><text x="450" y="250" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Skills and ways of using</text><text x="450" y="272" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">the internet (Hargittai,</text><text x="450" y="294" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">2002)</text><rect x="600" y="110" width="270" height="300" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="735" y="146" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Third level</text><text x="735" y="180" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Unequal outcomes: some</text><text x="735" y="202" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">turn online activity into</text><text x="735" y="224" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">jobs, savings or health</text><text x="735" y="246" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">benefits</text><rect x="30" y="430" width="412" height="269" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,502 L31.25,444.25 Q31.25,431.25 44.25,431.25 L427.75,431.25 Q440.75,431.25 440.75,444.25 L440.75,502 Z" fill="#f2e7b8"/><line x1="31.25" y1="502" x2="440.75" y2="502" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="459.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">van Dijk (2005): four types of</text><text x="236" y="484.05" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">access</text><circle cx="49" cy="527.9200000000001" r="4.5" fill="#2e6b62"/><text x="62" y="533.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Motivational (wanting to use it)</text><circle cx="49" cy="556.9200000000001" r="4.5" fill="#2e6b62"/><text x="62" y="562.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Material</text><circle cx="49" cy="585.9200000000001" r="4.5" fill="#2e6b62"/><text x="62" y="591.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Skills</text><circle cx="49" cy="614.9200000000001" r="4.5" fill="#2e6b62"/><text x="62" y="620.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Usage</text><rect x="458" y="430" width="412" height="269" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,502 L459.25,444.25 Q459.25,431.25 472.25,431.25 L855.75,431.25 Q868.75,431.25 868.75,444.25 L868.75,502 Z" fill="#f2e7b8"/><line x1="459.25" y1="502" x2="868.75" y2="502" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="471.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Patterns and a case</text><circle cx="477" cy="527.9200000000001" r="4.5" fill="#2e6b62"/><text x="490" y="533.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Income, age, rural or urban, disability,</text><text x="490" y="554.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">gender</text><circle cx="477" cy="577.9200000000001" r="4.5" fill="#2e6b62"/><text x="490" y="583.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Many low- and middle-income countries:</text><text x="490" y="604.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">women less likely to own a phone or use</text><text x="490" y="625.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mobile internet</text><circle cx="477" cy="648.9200000000001" r="4.5" fill="#2e6b62"/><text x="490" y="654.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">COVID-19 school closures: children without</text><text x="490" y="675.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">devices, data or quiet space fell behind</text>
</svg>