<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 596" width="900" height="596" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="596" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How traditional media adapt</text>

<rect x="30" y="104" width="412" height="178" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L427.75,105.25 Q440.75,105.25 440.75,118.25 L440.75,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="440.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Convergence</text><text x="46" y="187.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Jenkins</text><text x="46" y="216.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Content flows across platforms: one story as</text><text x="46" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">print, video, podcast and social post.</text><rect x="458" y="104" width="412" height="178" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,154 L459.25,118.25 Q459.25,105.25 472.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#b5d3cf"/><line x1="459.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="135" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">The long tail</text><text x="474" y="187.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Anderson (2006)</text><text x="474" y="216.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Online shops and streaming profit from huge</text><text x="474" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">numbers of niche products because storage and</text><text x="474" y="258.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">distribution are cheap.</text><rect x="30" y="298" width="412" height="157" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,348 L31.25,312.25 Q31.25,299.25 44.25,299.25 L427.75,299.25 Q440.75,299.25 440.75,312.25 L440.75,348 Z" fill="#f2e7b8"/><line x1="31.25" y1="348" x2="440.75" y2="348" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="329" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Schedules to on demand</text><text x="46" y="381.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">iPlayer and Netflix streaming, 2007</text><text x="46" y="410.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Audiences choose when to watch, weakening</text><text x="46" y="431.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">shared national viewing moments.</text><rect x="458" y="298" width="412" height="157" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,348 L459.25,312.25 Q459.25,299.25 472.25,299.25 L855.75,299.25 Q868.75,299.25 868.75,312.25 L868.75,348 Z" fill="#f2e7b8"/><line x1="459.25" y1="348" x2="868.75" y2="348" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="329" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Business model change</text><text x="474" y="381.2" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">advertising moves to search and social</text><text x="474" y="410.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Newspapers rely more on subscriptions,</text><text x="474" y="431.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">memberships and paywalls.</text><rect x="30" y="471" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="507" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Who wins and who loses?</text><text x="56" y="536" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Some traditional brands stay powerful; local newspapers in many countries have closed,</text><text x="56" y="558" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">reducing reporting on local government.</text>
</svg>