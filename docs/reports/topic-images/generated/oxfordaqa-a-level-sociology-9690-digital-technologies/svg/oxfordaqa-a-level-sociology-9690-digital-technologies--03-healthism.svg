<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 583" width="900" height="583" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="583" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Self-tracking and healthism</text>

<rect x="30" y="110" width="184.5" height="151" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="122.25" y="142.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Fitness</text><text x="122.25" y="166.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">tracking</text><text x="122.25" y="196.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Quantified Self</text><text x="122.25" y="217.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">movement (Wolf and</text><text x="122.25" y="238.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Kelly, 2007)</text><line x1="218.5" y1="185.5" x2="244.5" y2="185.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="248.5" y="110" width="184.5" height="151" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="340.75" y="143.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Healthism</text><text x="340.75" y="173.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">health as</text><text x="340.75" y="194.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">individual</text><text x="340.75" y="215.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">responsibility</text><text x="340.75" y="236.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">(Crawford, 1980)</text><line x1="437" y1="185.5" x2="463" y2="185.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="467" y="110" width="184.5" height="151" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="559.25" y="164.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Blame</text><text x="559.25" y="194.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">ill or inactive</text><text x="559.25" y="215.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">people are blamed</text><line x1="655.5" y1="185.5" x2="681.5" y2="185.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="685.5" y="110" width="184.5" height="151" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="777.75" y="152.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Social causes</text><text x="777.75" y="176.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">ignored</text><text x="777.75" y="206.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">poverty, work</text><text x="777.75" y="227.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">conditions</text><rect x="30" y="281" width="412" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,331 L31.25,295.25 Q31.25,282.25 44.25,282.25 L427.75,282.25 Q440.75,282.25 440.75,295.25 L440.75,331 Z" fill="#dce9e7"/><line x1="31.25" y1="331" x2="440.75" y2="331" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="311.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Biopower (Foucault)</text><text x="44" y="362.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Institutions manage populations through</text><text x="44" y="383.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">knowledge about bodies; self-tracking makes</text><text x="44" y="404.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">individuals managers of their own data.</text><rect x="458" y="281" width="412" height="147" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,331 L459.25,295.25 Q459.25,282.25 472.25,282.25 L855.75,282.25 Q868.75,282.25 868.75,295.25 L868.75,331 Z" fill="#dce9e7"/><line x1="459.25" y1="331" x2="868.75" y2="331" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="311.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Gamification</text><text x="472" y="362.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Streaks in language apps; ratings and badges</text><text x="472" y="383.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">for gig drivers. Critics: turns pressure into</text><text x="472" y="404.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">"play" and hides control.</text><rect x="30" y="446" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="482" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluation</text><text x="56" y="511" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Tracking can motivate and inform, especially for long-term conditions. The questions are</text><text x="56" y="533" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">who owns the data and whether insurers or employers use it to sort people.</text>
</svg>