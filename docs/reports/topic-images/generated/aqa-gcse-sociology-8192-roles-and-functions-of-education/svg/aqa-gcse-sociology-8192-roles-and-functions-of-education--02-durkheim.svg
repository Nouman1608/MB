<rect width="900" height="603" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Durkheim: transmitting norms and values</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Moral Education (1925)</text>
<rect x="30" y="120" width="412" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,170 L31.25,134.25 Q31.25,121.25 44.25,121.25 L427.75,121.25 Q440.75,121.25 440.75,134.25 L440.75,170 Z" fill="#b5d3cf"/><line x1="31.25" y1="170" x2="440.75" y2="170" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="150.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Welding individuals into a whole</text><text x="46" y="203.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Education turns “a mass of individuals” into “a</text><text x="46" y="224.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">united whole”</text><rect x="458" y="120" width="412" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,170 L459.25,134.25 Q459.25,121.25 472.25,121.25 L855.75,121.25 Q868.75,121.25 868.75,134.25 L868.75,170 Z" fill="#dce9e7"/><line x1="459.25" y1="170" x2="868.75" y2="170" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="150.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">History</text><text x="474" y="203.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Links the individual to society, building</text><text x="474" y="224.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">commitment to the group</text><rect x="30" y="264" width="412" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,314 L31.25,278.25 Q31.25,265.25 44.25,265.25 L427.75,265.25 Q440.75,265.25 440.75,278.25 L440.75,314 Z" fill="#dce9e7"/><line x1="31.25" y1="314" x2="440.75" y2="314" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="294.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Cooperation</text><text x="46" y="347.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Children learn to cooperate with people who are</text><text x="46" y="368.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">neither kin nor friends</text><rect x="458" y="264" width="412" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,314 L459.25,278.25 Q459.25,265.25 472.25,265.25 L855.75,265.25 Q868.75,265.25 868.75,278.25 L868.75,314 Z" fill="#f2e7b8"/><line x1="459.25" y1="314" x2="868.75" y2="314" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="294.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Rules and discipline</text><text x="474" y="347.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Strictly enforced rules teach self-discipline:</text><text x="474" y="368.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">misbehaviour damages society</text><rect x="30" y="408" width="412" height="165" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,458 L31.25,422.25 Q31.25,409.25 44.25,409.25 L427.75,409.25 Q440.75,409.25 440.75,422.25 L440.75,458 Z" fill="#d4b02e"/><line x1="31.25" y1="458" x2="440.75" y2="458" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="438.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Society in miniature</text><text x="46" y="491.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Children practise living by impersonal rules;</text><text x="46" y="512.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">schools also give the specialist skills</text><text x="46" y="533.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">industrial societies need</text><rect x="458" y="408" width="412" height="165" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,458 L459.25,422.25 Q459.25,409.25 472.25,409.25 L855.75,409.25 Q868.75,409.25 868.75,422.25 L868.75,458 Z" fill="#ffffff"/><line x1="459.25" y1="458" x2="868.75" y2="458" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="438.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Evaluation</text><circle cx="479" cy="485.92" r="4.5" fill="#2e6b62"/><text x="492" y="491.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Marxists: ruling-class norms</text><circle cx="479" cy="514.9200000000001" r="4.5" fill="#2e6b62"/><text x="492" y="520.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Diverse societies: whose values are shared?</text><circle cx="479" cy="543.9200000000001" r="4.5" fill="#2e6b62"/><text x="492" y="549.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Pupils may reject them (Willis’s lads)</text>
</svg>