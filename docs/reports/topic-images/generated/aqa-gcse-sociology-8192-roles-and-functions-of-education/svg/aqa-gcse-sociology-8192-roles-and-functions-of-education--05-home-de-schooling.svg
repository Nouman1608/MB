<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 623" width="900" height="623" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="623" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Home schooling or de-schooling?</text>

<rect x="30" y="104" width="404" height="364" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L419.75,105.25 Q432.75,105.25 432.75,118.25 L432.75,154 Z" fill="#b5d3cf"/><line x1="31.25" y1="154" x2="432.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Home schooling</text><text x="48" y="190.4" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Moves education out of school, but keeps a</text><text x="48" y="211.4" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">planned education</text><circle cx="53" cy="236.79" r="4.5" fill="#2e6b62"/><text x="66" y="242.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Legal in England: “regular attendance at</text><text x="66" y="264.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">school or otherwise”</text><circle cx="53" cy="288.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="294.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Reasons: bullying, special educational</text><text x="66" y="316.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">needs, beliefs, unhappy with local</text><text x="66" y="338.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">schools</text><circle cx="53" cy="362.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="368.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Questions: less secondary socialisation</text><text x="66" y="390.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">with peers? How far can the state check?</text><circle cx="53" cy="414.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="420.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Depends on parents’ time, money and</text><text x="66" y="442.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">education: a <tspan font-weight="700">class</tspan> link</text><rect x="466" y="104" width="404" height="364" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,154 L467.25,118.25 Q467.25,105.25 480.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#f2e7b8"/><line x1="467.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="134.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">De-schooling</text><text x="484" y="190.4" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Rejects formal schooling itself</text><circle cx="489" cy="215.79" r="4.5" fill="#8a6d0d"/><text x="502" y="221.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Illich, Deschooling Society (1971):</text><text x="502" y="243.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">replace schools, do not reform them</text><circle cx="489" cy="267.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="273.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Schools teach pupils to confuse being</text><text x="502" y="295.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">taught with learning</text><circle cx="489" cy="319.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="325.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">And to depend on institutions</text><circle cx="489" cy="349.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="355.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Learning webs:</tspan> networks to share skills</text><text x="502" y="377.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and resources and learn what you choose</text><circle cx="450" cy="286" r="24" fill="#1e2a44"/><text x="450" y="293" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">vs</text><rect x="30" y="486" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="522" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The key difference</text><text x="56" y="551" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Home schooling changes where education happens; de-schooling is a critique of the institution</text><text x="56" y="573" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">of school.</text>
</svg>