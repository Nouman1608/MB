<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 543" width="900" height="543" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="543" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Durkheim and Parsons compared</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Both functionalists: school passes on shared values</text>
<rect x="30" y="120" width="404" height="238" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,170 L31.25,134.25 Q31.25,121.25 44.25,121.25 L419.75,121.25 Q432.75,121.25 432.75,134.25 L432.75,170 Z" fill="#b5d3cf"/><line x1="31.25" y1="170" x2="432.75" y2="170" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="150.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Durkheim</text><circle cx="53" cy="200.79" r="4.5" fill="#2e6b62"/><text x="66" y="206.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Emphasises <tspan font-weight="700">cohesion</tspan> and <tspan font-weight="700">moral discipline</tspan></text><circle cx="53" cy="230.79" r="4.5" fill="#2e6b62"/><text x="66" y="236.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Shared history and cooperation</text><circle cx="53" cy="260.78999999999996" r="4.5" fill="#2e6b62"/><text x="66" y="266.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">School as society in miniature</text><rect x="466" y="120" width="404" height="238" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,170 L467.25,134.25 Q467.25,121.25 480.25,121.25 L855.75,121.25 Q868.75,121.25 868.75,134.25 L868.75,170 Z" fill="#f2e7b8"/><line x1="467.25" y1="170" x2="868.75" y2="170" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="150.95" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Parsons</text><circle cx="489" cy="200.79" r="4.5" fill="#8a6d0d"/><text x="502" y="206.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Emphasises <tspan font-weight="700">meritocracy</tspan>, <tspan font-weight="700">achieved status</tspan></text><text x="502" y="228.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and <tspan font-weight="700">selection</tspan></text><circle cx="489" cy="252.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="258.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">School as a bridge from particularistic</text><text x="502" y="280.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">to universalistic standards</text><circle cx="489" cy="304.78999999999996" r="4.5" fill="#8a6d0d"/><text x="502" y="310.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“The school class as a social system”</text><text x="502" y="332.4" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">(1961)</text><circle cx="450" cy="239" r="24" fill="#1e2a44"/><text x="450" y="246" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">vs</text><rect x="30" y="376" width="840" height="141" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="412" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Criticisms from the specification</text><circle cx="61" cy="435.39" r="4.5" fill="#8a6d0d"/><text x="74" y="441" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“The values of the education system may simply be those of the ruling elite”</text><circle cx="61" cy="465.39" r="4.5" fill="#8a6d0d"/><text x="74" y="471" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“Equality of opportunity is an illusion in an unequal society where wealth and privilege</text><text x="74" y="493" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">are more important than individual merit”</text>
</svg>