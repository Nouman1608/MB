<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 793" width="900" height="793" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="793" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Types of school</text>

<rect x="30" y="112" width="410" height="74" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="50" y="142" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Primary</text><text x="50" y="168" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">usually 4 or 5 to 11; may be infant and junior</text><line x1="444" y1="149" x2="456" y2="149" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="460" y="112" width="410" height="74" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="480" y="142" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Secondary</text><text x="480" y="168" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="start">usually 11 to 16 or 18</text><text x="450" y="222" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Who funds and controls the school?</text><rect x="30" y="240" width="540" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,290 L31.25,254.25 Q31.25,241.25 44.25,241.25 L555.75,241.25 Q568.75,241.25 568.75,254.25 L568.75,290 Z" fill="#b5d3cf"/><line x1="31.25" y1="290" x2="568.75" y2="290" stroke="#c9d6d4" stroke-width="2"/><text x="300" y="271" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">State-funded: free to attend</text><rect x="590" y="240" width="280" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M591.25,290 L591.25,254.25 Q591.25,241.25 604.25,241.25 L855.75,241.25 Q868.75,241.25 868.75,254.25 L868.75,290 Z" fill="#f2e7b8"/><line x1="591.25" y1="290" x2="868.75" y2="290" stroke="#c9d6d4" stroke-width="2"/><text x="730" y="271" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Private (independent)</text><rect x="48" y="310" width="504" height="68" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="64" y="336" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Community schools</text><text x="64" y="360" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Run by local authorities</text><rect x="48" y="388" width="504" height="88" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="64" y="414" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Academies and free schools</text><text x="64" y="438" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Independent of local authority control; free schools set up by</text><text x="64" y="458" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">groups such as charities or parents</text><rect x="48" y="486" width="504" height="68" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="64" y="512" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Grammar schools</text><text x="64" y="536" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Selective: admit pupils by an entrance test</text><rect x="48" y="564" width="504" height="68" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="64" y="590" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Faith schools</text><text x="64" y="614" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">A religious character (can also be private)</text><circle cx="613" cy="308.72" r="4.5" fill="#2e6b62"/><text x="626" y="314" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Funded mainly by <tspan font-weight="700">fees</tspan></text><circle cx="613" cy="339.72" r="4.5" fill="#2e6b62"/><text x="626" y="345" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Not required to follow the</text><text x="626" y="366" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">National Curriculum</text><circle cx="613" cy="391.72" r="4.5" fill="#2e6b62"/><text x="626" y="397" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The oldest and most famous</text><text x="626" y="418" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">often called “public</text><text x="626" y="439" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">schools”</text><circle cx="613" cy="464.72" r="4.5" fill="#2e6b62"/><text x="626" y="470" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Marxists:</tspan> reproduce elite</text><text x="626" y="491" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">advantage through resources,</text><text x="626" y="512" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cultural capital and</text><text x="626" y="533" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">networks</text><rect x="30" y="680" width="840" height="89" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="716" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Common mistake</text><text x="56" y="745" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Academies are state-funded; they are not private schools.</text>
</svg>