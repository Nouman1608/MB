<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 626" width="900" height="626" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="626" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three functions, three judgements</text>

<rect x="168" y="104" width="228.66666666666666" height="44" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="282.3333333333333" y="130.74" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Serving the economy</text><rect x="404.66666666666663" y="104" width="228.66666666666666" height="44" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="519" y="130.74" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Social mobility</text><rect x="641.3333333333333" y="104" width="228.66666666666666" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="755.6666666666666" y="130.74" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Social cohesion</text><rect x="30" y="156" width="130" height="135" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="217.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">How it</text><text x="42" y="239.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">works</text><rect x="168" y="156" width="228.66666666666666" height="135" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="182" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Skills and</text><text x="182" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">qualifications; <tspan font-weight="700">role</tspan></text><text x="182" y="228.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">allocation</tspan> sorts people</text><text x="182" y="249.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">into jobs</text><rect x="404.66666666666663" y="156" width="228.66666666666666" height="135" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="418.66666666666663" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Qualifications let anyone</text><text x="418.66666666666663" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">move up:</text><text x="418.66666666666663" y="228.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">intergenerational</tspan></text><text x="418.66666666666663" y="249.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mobility; depends on</text><text x="418.66666666666663" y="270.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">meritocracy</text><rect x="641.3333333333333" y="156" width="228.66666666666666" height="135" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="655.3333333333333" y="186.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Shared norms and values</text><text x="655.3333333333333" y="207.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">bind people together</text><rect x="30" y="299" width="130" height="93" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="350.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Example</text><rect x="168" y="299" width="228.66666666666666" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="182" y="329.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Apprenticeships, T</text><text x="182" y="350.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Levels; education or</text><text x="182" y="371.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">training to 18</text><rect x="404.66666666666663" y="299" width="228.66666666666666" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="418.66666666666663" y="329.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">First in the family to go</text><text x="418.66666666666663" y="350.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to university</text><rect x="641.3333333333333" y="299" width="228.66666666666666" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="655.3333333333333" y="329.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Assemblies, uniforms,</text><text x="655.3333333333333" y="350.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">team sports; fundamental</text><text x="655.3333333333333" y="371.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">British values</text><rect x="30" y="400" width="130" height="93" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="451.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Marxist</text><rect x="168" y="400" width="228.66666666666666" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="182" y="430.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Serves capitalism:</text><text x="182" y="451.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">workers who accept their</text><text x="182" y="472.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">place</text><rect x="404.66666666666663" y="400" width="228.66666666666666" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="418.66666666666663" y="430.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A <tspan font-weight="700">myth of meritocracy</tspan>:</text><text x="418.66666666666663" y="451.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">middle-class advantages</text><text x="418.66666666666663" y="472.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reproduce class</text><rect x="641.3333333333333" y="400" width="228.66666666666666" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="655.3333333333333" y="430.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Ruling-class values:</text><text x="655.3333333333333" y="451.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cohesion means accepting</text><text x="655.3333333333333" y="472.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">inequality</text><rect x="30" y="501" width="130" height="93" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="552.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Feminist</text><rect x="168" y="501" width="228.66666666666666" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="182" y="531.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Girls and boys steered to</text><text x="182" y="552.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">different subjects and</text><text x="182" y="573.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">pay</text><rect x="404.66666666666663" y="501" width="228.66666666666666" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="418.66666666666663" y="531.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Girls outperform boys,</text><text x="418.66666666666663" y="552.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">but women meet the <tspan font-weight="700">glass</tspan></text><text x="418.66666666666663" y="573.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">ceiling</tspan></text><rect x="641.3333333333333" y="501" width="228.66666666666666" height="93" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="655.3333333333333" y="531.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Shared culture has</text><text x="655.3333333333333" y="552.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reflected men’s interests</text>
</svg>