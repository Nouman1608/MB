<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 588" width="900" height="588" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="588" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two layers of audience</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The Larkfield Courier letter</text>
<rect x="30" y="192" width="230" height="150" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="145" y="248.68" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Writer</text><text x="145" y="276.68" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Retired bus driver; daily</text><text x="145" y="297.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">library user for six years</text><rect x="335" y="192" width="230" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="450" y="248.68" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Letter</text><text x="450" y="276.68" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">published in the</text><text x="450" y="297.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Larkfield Courier</text><line x1="262" y1="267" x2="328" y2="267" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="640" y="132" width="230" height="120" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="755" y="166" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Primary</text><text x="755" y="194" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">the councillors:</text><text x="755" y="215.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">“Councillors, you will</text><text x="755" y="236.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">say...”</text><rect x="640" y="282" width="230" height="120" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5" stroke-dasharray="7 5"/><text x="755" y="316" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Secondary</text><text x="755" y="344" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Courier readers who</text><text x="755" y="365.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">might add public</text><text x="755" y="386.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">pressure</text><path d="M567,252 C600,242 605,192 632,192" fill="none" stroke="#2e6b62" stroke-width="5" marker-end="url(#ahT)"/><path d="M567,282 C600,292 605,342 632,342" fill="none" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)" stroke-dasharray="8 6"/><rect x="30" y="432" width="408" height="125.75999999999999" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="48" y="466" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Credibility</text><text x="48" y="494" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">The personal detail about being a bus driver</text><text x="48" y="515.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">builds the writer’s credibility as an ordinary</text><text x="48" y="536.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">user.</text><rect x="462" y="432" width="408" height="125.75999999999999" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="480" y="466" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Anticipated objection</text><text x="480" y="494" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">“You will say the savings are needed” shows</text><text x="480" y="515.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">the writer knows what the council will argue.</text>
</svg>