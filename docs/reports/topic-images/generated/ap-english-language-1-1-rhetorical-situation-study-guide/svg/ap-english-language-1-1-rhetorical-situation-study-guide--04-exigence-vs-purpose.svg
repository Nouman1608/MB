<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 464" width="900" height="464" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="464" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Exigence looks back, purpose looks forward</text>

<line x1="40" y1="196" x2="860" y2="196" stroke="#c9d6d4" stroke-width="3"/><rect x="30" y="126" width="250" height="140" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" /><text x="155" y="160" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">Exigence</text><text x="155" y="188.85" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">The council voted to cut</text><text x="155" y="211.29" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">library hours.</text><rect x="325" y="136" width="250" height="120" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" /><text x="450" y="170" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">The text</text><text x="450" y="198.85" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">A letter to the council</text><rect x="620" y="126" width="250" height="140" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="745" y="160" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">Purpose</text><text x="745" y="188.85" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Persuade the council to</text><text x="745" y="211.29" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">reverse it.</text><line x1="282" y1="196" x2="318" y2="196" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><line x1="577" y1="196" x2="613" y2="196" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="155" y="296" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">← what prompts the writing</text><text x="745" y="296" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">what the text should do →</text><rect x="30" y="326" width="408" height="107.28" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="48" y="360" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Message is not purpose either</text><text x="48" y="388.84999999999997" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Message: what the text <tspan font-style="italic">says</tspan>. “A library is</text><text x="48" y="411.28999999999996" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">central to a town.”</text><rect x="462" y="326" width="408" height="107.28" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="480" y="360" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve"></text><text x="480" y="388.84999999999997" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Purpose: what the writer wants it to <tspan font-style="italic">do</tspan>. “Get</text><text x="480" y="411.28999999999996" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">the cut reversed.”</text>
</svg>