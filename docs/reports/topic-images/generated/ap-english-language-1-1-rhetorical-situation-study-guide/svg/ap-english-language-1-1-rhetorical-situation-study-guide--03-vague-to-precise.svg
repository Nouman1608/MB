<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 638" width="900" height="638" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="638" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From vague to precise</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Gettysburg, described component by component</text>
<text x="225" y="128" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle" xml:space="preserve">Vague</text><text x="640" y="128" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle" xml:space="preserve">Precise: who, what, when</text><text x="30" y="199.66" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Audience</text><rect x="122" y="150" width="206" height="87.32" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="225" y="198.89" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">People.</text><line x1="330" y1="193.66" x2="390" y2="193.66" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="400" y="144" width="470" height="99.32" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="418" y="176.45" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">Citizens gathered at a cemetery dedication, and the</text><text x="418" y="198.89" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">wider public who would read the speech in</text><text x="418" y="221.32999999999998" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">newspapers.</text><text x="30" y="314.98" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Context</text><rect x="122" y="265.32" width="206" height="87.32" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="225" y="314.21" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">A long time ago.</text><line x1="330" y1="308.98" x2="390" y2="308.98" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="400" y="259.32" width="470" height="99.32" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="418" y="291.77" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">November 1863, in the middle of a civil war, on a</text><text x="418" y="314.21" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">battlefield where thousands had died four months</text><text x="418" y="336.65" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">earlier.</text><text x="30" y="419.08" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Purpose</text><rect x="122" y="380.64" width="206" height="64.88" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="225" y="418.31" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">To talk about the war.</text><line x1="330" y1="413.08" x2="390" y2="413.08" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="400" y="374.64" width="470" height="76.88" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="418" y="407.09" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">To give the dead and the war a meaning the living</text><text x="418" y="429.53" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">can commit to.</text><text x="30" y="505.52" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start" xml:space="preserve">Exigence</text><rect x="122" y="473.52" width="206" height="52" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5" stroke-dasharray="6 5"/><text x="225" y="504.74999999999994" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">The war.</text><line x1="330" y1="499.52" x2="390" y2="499.52" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="400" y="467.52" width="470" height="64" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="418" y="504.74999999999994" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start" xml:space="preserve">The formal dedication of a national cemetery.</text><rect x="30" y="551.52" width="840" height="54.440000000000055" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="450" y="583.97" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve"><tspan font-weight="700">Test:</tspan> if your description could be pasted onto a different text and still be true, it is too vague.</text>
</svg>