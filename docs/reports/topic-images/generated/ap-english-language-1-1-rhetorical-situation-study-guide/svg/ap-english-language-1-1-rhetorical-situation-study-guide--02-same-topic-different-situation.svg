<rect x="366.23681" y="101.5" width="167.52638000000002" height="33" rx="16.5" fill="#dce9e7" stroke="#1e2a44" stroke-width="2" /><text x="450" y="124.84" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Topic: libraries</text><path d="M410,136 C330,156 220,146 200,170" fill="none" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><path d="M490,136 C570,156 680,146 700,170" fill="none" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="176" width="330" height="84.80000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="195" y="210" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Council report on library</text><text x="195" y="236.4" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">funding</text><rect x="540" y="176" width="330" height="84.80000000000001" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="705" y="210" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Retired reader’s letter to the</text><text x="705" y="236.4" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">local paper</text><text x="450" y="280.8" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle" xml:space="preserve">The situation changes the choices</text><rect x="30" y="298.8" width="330" height="54" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="195" y="331.40999999999997" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">figures</text><rect x="540" y="298.8" width="330" height="54" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="705" y="331.40999999999997" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">personal experience</text><text x="450" y="331.8" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Leans on</text><rect x="30" y="366.8" width="330" height="54" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="195" y="399.40999999999997" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">neutral</text><rect x="540" y="366.8" width="330" height="54" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5" /><text x="705" y="399.40999999999997" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="middle" xml:space="preserve">direct appeal</text><text x="450" y="399.8" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle" xml:space="preserve">Phrasing</text><text x="450" y="456.8" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">Diction, evidence and structure differ because writer, audience, purpose and context differ,</text><text x="450" y="479.24" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">not because the topic does.</text>
