<rect width="900" height="450" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Explain three: provision, mechanism, life chance</text>

<text x="154.66666666666669" y="124" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Provision</text><text x="450.00000000000006" y="124" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Mechanism</text><text x="745.3333333333334" y="124" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Life chance</text><rect x="30" y="140" width="249.33333333333334" height="91" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="168.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Free education</text><line x1="285.33333333333337" y1="185.5" x2="319.33333333333337" y2="185.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="140" width="249.33333333333334" height="91" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="341.33333333333337" y="168.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Children from poor</text><text x="341.33333333333337" y="189.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">families gain</text><text x="341.33333333333337" y="210.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">qualifications</text><line x1="580.6666666666667" y1="185.5" x2="614.6666666666667" y2="185.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="140" width="249.33333333333334" height="91" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="636.6666666666667" y="168.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Better-paid work; upward</text><text x="636.6666666666667" y="189.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mobility</text><rect x="30" y="245" width="249.33333333333334" height="91" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="273.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Free healthcare</text><line x1="285.33333333333337" y1="290.5" x2="319.33333333333337" y2="290.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="245" width="249.33333333333334" height="91" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="341.33333333333337" y="273.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Treatment by need, not</text><text x="341.33333333333337" y="294.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">income; illness treated</text><text x="341.33333333333337" y="315.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">earlier</text><line x1="580.6666666666667" y1="290.5" x2="614.6666666666667" y2="290.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="245" width="249.33333333333334" height="91" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="636.6666666666667" y="273.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Higher life expectancy</text><rect x="30" y="350" width="249.33333333333334" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="378.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Unemployment benefits</text><line x1="285.33333333333337" y1="385" x2="319.33333333333337" y2="385" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="350" width="249.33333333333334" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="341.33333333333337" y="378.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Income when a job is lost</text><line x1="580.6666666666667" y1="385" x2="614.6666666666667" y2="385" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="350" width="249.33333333333334" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="636.6666666666667" y="378.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Families avoid absolute</text><text x="636.6666666666667" y="399.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">poverty and losing homes</text>
</svg>