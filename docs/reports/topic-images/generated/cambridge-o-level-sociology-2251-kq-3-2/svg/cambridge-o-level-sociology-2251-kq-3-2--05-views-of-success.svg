<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 615" width="900" height="615" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="615" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Has it worked? Sociological views</text>

<rect x="330" y="150" width="240" height="80" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="194.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">The welfare state</text><rect x="30" y="110" width="270" height="155" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="143" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">NEW RIGHT</text><text x="50" y="170" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Does too much</text><text x="50" y="198.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Murray: generous welfare</text><text x="50" y="219.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">creates a dependent</text><text x="50" y="240.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">underclass. Cut benefits.</text><rect x="600" y="110" width="270" height="176" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="620" y="143" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">MARXISTS</text><text x="620" y="170" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Does too little</text><text x="620" y="198.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Leaves ownership of wealth</text><text x="620" y="219.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">unchanged; keeps workers</text><text x="620" y="240.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">productive and calms</text><text x="620" y="261.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">discontent.</text><line x1="304" y1="190" x2="326" y2="190" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><line x1="596" y1="190" x2="574" y2="190" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><rect x="30" y="306" width="269.3333333333333" height="151" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="341.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Culture of poverty</text><text x="50" y="369.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Lewis: fatalistic values</text><text x="50" y="390.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">passed on to children;</text><text x="50" y="411.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">dependency culture</text><rect x="315.3333333333333" y="306" width="269.3333333333333" height="151" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="335.3333333333333" y="341.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Feminists</text><text x="335.3333333333333" y="369.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Equality laws cannot change</text><text x="335.3333333333333" y="390.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the dual burden or glass</text><text x="335.3333333333333" y="411.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">ceiling; Beveridge assumed</text><text x="335.3333333333333" y="432.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a male breadwinner</text><rect x="600.6666666666666" y="306" width="269.3333333333333" height="151" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="620.6666666666666" y="341.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">NGO critics</text><text x="620.6666666666666" y="369.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Donor priorities,</text><text x="620.6666666666666" y="390.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">accountability, symptoms</text><text x="620.6666666666666" y="411.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">not causes</text><rect x="30" y="473" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="509" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Answering the critics</text><text x="50" y="538.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Responses: most claimants move in and out of work; values react to blocked opportunities;</text><text x="50" y="560.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">welfare has greatly improved health, literacy and life expectancy.</text>
</svg>