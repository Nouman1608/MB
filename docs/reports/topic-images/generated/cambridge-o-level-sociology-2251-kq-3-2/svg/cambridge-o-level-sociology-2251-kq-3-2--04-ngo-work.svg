<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 614" width="900" height="614" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="614" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four kinds of NGO work</text>

<rect x="30" y="104" width="411" height="158" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">REDUCING POVERTY</text><text x="50" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">BRAC (Bangladesh, 1972)</text><text x="50" y="191.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Programmes for the very poor, including</text><text x="50" y="212.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">support to build savings and small</text><text x="50" y="233.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">enterprises</text><rect x="459" y="104" width="411" height="158" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">MEDICAL ASSISTANCE</text><text x="479" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Médecins Sans Frontières (France,</text><text x="479" y="188.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">1971)</text><text x="479" y="216.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Emergency medical care in conflict zones and</text><text x="479" y="237.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">disasters</text><rect x="30" y="278" width="411" height="154" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="311" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">PROMOTING BUSINESS</text><text x="50" y="337.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Grameen Bank (Bangladesh)</text><text x="50" y="365.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Muhammad Yunus pioneered microcredit: small</text><text x="50" y="386.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">loans without collateral, mostly to women.</text><text x="50" y="407.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Nobel Peace Prize 2006</text><rect x="459" y="278" width="411" height="154" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="479" y="311" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">IMPROVING EDUCATION</text><text x="479" y="337.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The Citizens Foundation</text><text x="479" y="362.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">(Pakistan, 1995)</text><text x="479" y="390.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Runs schools in low-income areas</text><rect x="30" y="450" width="840" height="134" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="486" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Criticisms of NGOs</text><text x="50" y="515.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">May follow foreign donors’ priorities; not elected, so may lack accountability; can</text><text x="50" y="537.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">duplicate or undermine state services; treat symptoms, not causes; some microcredit</text><text x="50" y="559.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">borrowers take on debts they cannot repay.</text>
</svg>