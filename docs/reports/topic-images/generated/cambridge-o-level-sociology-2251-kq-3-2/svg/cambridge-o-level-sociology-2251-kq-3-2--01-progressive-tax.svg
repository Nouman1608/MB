<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 584" width="900" height="584" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="584" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How a progressive tax works</text>

<rect x="30" y="110" width="840" height="348" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="148" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Income 15,000</text><rect x="60" y="160" width="195" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="157.5" y="188" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">15,000 at 10%</text><text x="157.5" y="210" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">tax 1,500</text><text x="60" y="258" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Total tax 1,500 = 10% of income</text><text x="60" y="318" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Income 60,000</text><rect x="60" y="330" width="325" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="222.5" y="358" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">25,000 at 10%</text><text x="222.5" y="380" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">tax 2,500</text><rect x="385" y="330" width="455" height="64" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="612.5" y="358" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">35,000 at 40%</text><text x="612.5" y="380" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">tax 14,000</text><text x="60" y="428" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Total tax 16,500 = 27.5% of income</text><rect x="30" y="474" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="507.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Invented rates from the lesson: 10% on the first 25,000 and 40% above it. Taxes on spending</text><text x="50" y="529.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">often take a larger share of poorer people’s income.</text>
</svg>