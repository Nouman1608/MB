<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 706" width="900" height="706" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="706" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Beveridge’s five giants and the welfare state</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Beveridge Report, 1942</text>
<text x="115" y="132" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">Giant</text><text x="400" y="132" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Provision</text><text x="740" y="132" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">Life chance improved</text><rect x="30" y="150" width="170" height="70" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="115" y="190" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle">Want</text><rect x="246" y="150" width="310" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="401" y="178.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Unemployment benefits,</text><text x="401" y="199.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">pensions, basic income</text><rect x="602" y="150" width="268" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="736" y="189.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Income security</text><line x1="204" y1="185" x2="240" y2="185" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="560" y1="185" x2="596" y2="185" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="234" width="170" height="70" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="115" y="274" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle">Disease</text><rect x="246" y="234" width="310" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="401" y="273.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Free healthcare</text><rect x="602" y="234" width="268" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="736" y="262.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Health and life expectancy</text><text x="736" y="283.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">regardless of income</text><line x1="204" y1="269" x2="240" y2="269" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="560" y1="269" x2="596" y2="269" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="318" width="170" height="70" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="115" y="358" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle">Ignorance</text><rect x="246" y="318" width="310" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="401" y="357.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Free / universal education</text><rect x="602" y="318" width="268" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="736" y="346.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Qualifications, jobs,</text><text x="736" y="367.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">social mobility</text><line x1="204" y1="353" x2="240" y2="353" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="560" y1="353" x2="596" y2="353" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="402" width="170" height="70" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="115" y="442" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle">Squalor</text><rect x="246" y="402" width="310" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="401" y="441.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Low-cost housing</text><rect x="602" y="402" width="268" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="736" y="430.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Safe, secure homes; better</text><text x="736" y="451.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">health</text><line x1="204" y1="437" x2="240" y2="437" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="560" y1="437" x2="596" y2="437" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="486" width="170" height="70" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="115" y="526" font-size="20" font-weight="700" fill="#b5602e" text-anchor="middle">Idleness</text><rect x="246" y="486" width="310" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="401" y="525.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Unemployment benefits</text><rect x="602" y="486" width="268" height="70" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="736" y="525.3" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Income between jobs</text><line x1="204" y1="521" x2="240" y2="521" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="560" y1="521" x2="596" y2="521" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="574" width="840" height="102" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="607.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Universal basic income: Finland (2017–2018) paid 2,000 unemployed people a monthly sum.</text><text x="50" y="629.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Wellbeing improved; the effect on employment was small. Critics cite cost and work</text><text x="50" y="651.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">incentives.</text>
</svg>