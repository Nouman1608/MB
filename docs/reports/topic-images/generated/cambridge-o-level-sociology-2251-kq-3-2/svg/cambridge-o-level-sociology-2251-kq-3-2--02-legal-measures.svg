<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 572" width="900" height="572" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="572" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How laws try to reduce inequality</text>

<rect x="30" y="104" width="210" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Measure</text><rect x="240" y="104" width="340" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="252" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">How it works</text><rect x="580" y="104" width="290" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="592" y="134" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Point to make</text><rect x="30" y="150" width="210" height="62" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="174.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Means-tested benefits</text><rect x="240" y="150" width="340" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="252" y="174.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Only for people below an income limit</text><rect x="580" y="150" width="290" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="592" y="174.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Targets help, but can stigmatise</text><text x="592" y="194.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">and discourage take-up</text><rect x="30" y="212" width="210" height="62" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="236.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Universal benefits</text><rect x="240" y="212" width="340" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="252" y="236.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Everyone in a category, e.g. all</text><text x="252" y="256.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">pensioners</text><rect x="580" y="212" width="290" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="592" y="236.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Avoids stigma, but more expensive</text><rect x="30" y="274" width="210" height="62" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="298.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Conditional benefits</text><rect x="240" y="274" width="340" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="252" y="298.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Brazil’s Bolsa Família (2003): paid if</text><text x="252" y="318.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">children attend school and health checks</text><rect x="580" y="274" width="290" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="592" y="298.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Ties short-term relief to</text><text x="592" y="318.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">longer-term life chances</text><rect x="30" y="336" width="210" height="62" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="360.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Minimum wage</text><rect x="240" y="336" width="340" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="252" y="360.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">A legal floor under pay, e.g. UK</text><text x="252" y="380.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">National Minimum Wage (1999)</text><rect x="580" y="336" width="290" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="592" y="360.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Jobs or hours may be cut; does not</text><text x="592" y="380.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">help informal workers</text><rect x="30" y="398" width="210" height="62" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="422.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Equal opportunities</text><text x="42" y="442.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">laws</text><rect x="240" y="398" width="340" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="252" y="422.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Outlaw discrimination, e.g. UK Equality</text><text x="252" y="442.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Act 2010</text><rect x="580" y="398" width="290" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="592" y="422.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Feminists: cannot change unpaid</text><text x="592" y="442.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">domestic work</text><rect x="30" y="460" width="210" height="82" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="484.75" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Reservations</text><rect x="240" y="460" width="340" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="252" y="484.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">India: places in education, jobs and</text><text x="252" y="504.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">legislatures for Scheduled Castes and</text><text x="252" y="524.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Tribes</text><rect x="580" y="460" width="290" height="82" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="592" y="484.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Counters inequality rooted in</text><text x="592" y="504.75" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">caste</text>
</svg>