<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 538" width="900" height="538" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="538" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Context of production and of reception</text>

<rect x="30" y="120" width="412" height="250" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="153" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CONTEXT OF PRODUCTION</text><text x="50" y="180" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">When and how it was written</text><text x="50" y="208.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="208.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The writer’s life, only where it relates to</text><text x="65.2" y="229.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the text</text><text x="50" y="255.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="255.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The historical setting</text><text x="50" y="281.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="281.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Social and cultural contexts</text><text x="50" y="307.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="65.2" y="307.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Literary context: movements and genres</text><rect x="458" y="120" width="412" height="250" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="478" y="153" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">CONTEXT OF RECEPTION</text><text x="478" y="180" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">How it has been read since</text><text x="478" y="208.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="493.2" y="208.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">How it has been reviewed, used, edited and</text><text x="493.2" y="229.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">adapted</text><text x="478" y="255.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="493.2" y="255.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">How readers and critics have arrived at</text><text x="493.2" y="276.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">alternative interpretations</text><text x="30" y="396" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Why reception is often the most useful in a comparison</text><rect x="30" y="412" width="412" height="102" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="445.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">It explains why a modern reader responds</text><text x="50" y="467.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">to an older novel differently from its</text><text x="50" y="489.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">first readers.</text><rect x="458" y="412" width="412" height="102" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="456.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">It shows how a later novel answers an</text><text x="478" y="478.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">earlier tradition.</text>
</svg>