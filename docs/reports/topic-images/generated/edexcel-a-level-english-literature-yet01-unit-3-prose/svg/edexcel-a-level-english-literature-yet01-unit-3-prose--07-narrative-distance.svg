<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 770" width="900" height="770" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="770" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How narration shapes our judgement</text>

<rect x="30" y="120" width="412" height="380" rx="14" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="156" font-size="19" font-weight="700" fill="#1e2a44" font-style="italic">Wuthering Heights</text><rect x="76" y="184" width="320" height="272" rx="16" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="236" y="210" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Lockwood</text><rect x="124" y="224.8" width="224" height="190.4" rx="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="236" y="250.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Nelly</text><rect x="176" y="269" width="120" height="102" rx="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="236" y="295" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Catherine</text><text x="236" y="342" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">her words</text><path d="M216.2,476 Q236,459.8 255.8,476 Q236,492.2 216.2,476 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="236" cy="476" r="6.3" fill="#2e6b62"/><text x="266" y="482" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">the reader, at a distance</text><rect x="458" y="120" width="412" height="380" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="156" font-size="19" font-weight="700" fill="#1e2a44" font-style="italic">Mrs Dalloway</text><circle cx="664" cy="310" r="120" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="664" y="224" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Clarissa’s mind</text><path d="M639.8,310 Q664,290.2 688.2,310 Q664,329.8 639.8,310 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="664" cy="310" r="7.700000000000001" fill="#2e6b62"/><text x="664" y="354" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">free indirect discourse</text><text x="664" y="378" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">the choice revisited from within,</text><text x="664" y="398" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">decades later</text><text x="664" y="482" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">the reader, inside</text><rect x="30" y="520" width="412" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="555.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Distance</text><text x="50" y="583.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Catherine’s declaration is filtered through a</text><text x="50" y="604.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">servant who disapproves: we weigh Nelly’s</text><text x="50" y="625.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">judgement against Catherine’s words.</text><rect x="458" y="520" width="412" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="565.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Intimacy</text><text x="478" y="594.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">We understand a choice that has both</text><text x="478" y="615.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">protected and limited her.</text><rect x="30" y="666" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="699.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">AO3: the Victorian frame narrative against a modernist interest in consciousness explains</text><text x="50" y="721.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the difference.</text>
</svg>