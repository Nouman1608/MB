<text x="30" y="118" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Unit 3 · 50 marks · open book</text><rect x="30" y="130" width="336" height="74" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="198" y="162" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Section A</text><text x="198" y="188" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">20 marks</text><rect x="366" y="130" width="504" height="74" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="618" y="162" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Section B: Prose</text><text x="618" y="188" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">30 marks · one comparative essay</text><rect x="30" y="130" width="840" height="74" fill="none" stroke="#1e2a44" stroke-width="3"/><rect x="30" y="222" width="840" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="258" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">One theme, three texts: you study two</text><rect x="70" y="278" width="70" height="100" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><rect x="70" y="278" width="12" height="100" rx="3" fill="#1e2a44" opacity="0.25"/><rect x="160" y="278" width="70" height="100" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><rect x="160" y="278" width="12" height="100" rx="3" fill="#1e2a44" opacity="0.25"/><rect x="250" y="278" width="70" height="100" rx="6" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2.5" stroke-dasharray="7 5"/><rect x="250" y="278" width="12" height="100" rx="3" fill="#1e2a44" opacity="0.08"/><text x="105" y="400" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Text A</text><text x="195" y="400" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Text B</text><text x="285" y="400" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">not studied</text><path d="M105,274 Q150,252 195,274" fill="none" stroke="#1e2a44" stroke-width="2.5" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="370" y="292" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">One comparative essay from a choice of two questions.</text><text x="370" y="342" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Compare the two texts and consider relevant</text><text x="370" y="364" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">contextual factors.</text><text x="30" y="448" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">All four objectives:</text><rect x="230" y="428" width="57" height="34" rx="17" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="258.5" y="451.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">AO1</text><rect x="297" y="428" width="57" height="34" rx="17" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="325.5" y="451.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">AO2</text><rect x="364" y="428" width="57" height="34" rx="17" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="392.5" y="451.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">AO3</text><rect x="431" y="428" width="57" height="34" rx="17" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="459.5" y="451.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">AO4</text><text x="506" y="448" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the largest single essay</text><rect x="30" y="484" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="517.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Allocate the larger share of the two hours to this section, and spend about ten minutes</text><text x="50" y="539.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">planning with your framework grid.</text>
</svg>