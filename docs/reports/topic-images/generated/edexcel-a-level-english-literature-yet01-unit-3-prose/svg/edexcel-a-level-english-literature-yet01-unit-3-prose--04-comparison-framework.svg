<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Build a comparison framework before the exam</text>

<rect x="30" y="120" width="330" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="150" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Row</text><rect x="360" y="120" width="220" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="372" y="150" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Text A</text><rect x="580" y="120" width="220" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="592" y="150" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Text B</text><rect x="30" y="166" width="330" height="46" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="42" y="196" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Narrative voice</text><rect x="360" y="166" width="220" height="46" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><line x1="374" y1="190" x2="480" y2="190" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><rect x="580" y="166" width="220" height="46" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><line x1="594" y1="190" x2="740" y2="190" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><circle cx="830" cy="189" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="212" width="330" height="46" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="42" y="242" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Structure and time</text><rect x="360" y="212" width="220" height="46" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><line x1="374" y1="236" x2="480" y2="236" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><rect x="580" y="212" width="220" height="46" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><line x1="594" y1="236" x2="740" y2="236" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><circle cx="830" cy="235" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="258" width="330" height="46" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="288" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Setting and its symbolism</text><rect x="360" y="258" width="220" height="46" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><line x1="374" y1="282" x2="480" y2="282" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><rect x="580" y="258" width="220" height="46" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><line x1="594" y1="282" x2="740" y2="282" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><rect x="30" y="304" width="330" height="46" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="334" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Central relationships</text><rect x="360" y="304" width="220" height="46" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><line x1="374" y1="328" x2="480" y2="328" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><rect x="580" y="304" width="220" height="46" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><line x1="594" y1="328" x2="740" y2="328" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><rect x="30" y="350" width="330" height="46" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="380" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Treatment of the theme’s core idea</text><rect x="360" y="350" width="220" height="46" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><line x1="374" y1="374" x2="480" y2="374" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><rect x="580" y="350" width="220" height="46" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><line x1="594" y1="374" x2="740" y2="374" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><rect x="30" y="396" width="330" height="46" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="42" y="426" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Endings</text><rect x="360" y="396" width="220" height="46" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><line x1="374" y1="420" x2="480" y2="420" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><rect x="580" y="396" width="220" height="46" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><line x1="594" y1="420" x2="740" y2="420" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><circle cx="830" cy="419" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="442" width="330" height="46" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="472" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Context of production</text><rect x="360" y="442" width="220" height="46" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><line x1="374" y1="466" x2="480" y2="466" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><rect x="580" y="442" width="220" height="46" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><line x1="594" y1="466" x2="740" y2="466" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><rect x="30" y="488" width="330" height="46" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="42" y="518" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Context of reception</text><rect x="360" y="488" width="220" height="46" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><line x1="374" y1="512" x2="480" y2="512" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><rect x="580" y="488" width="220" height="46" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><line x1="594" y1="512" x2="740" y2="512" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><circle cx="830" cy="511" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="870" y="148" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="end">chosen</text><rect x="30" y="552" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="585.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Each row is a potential paragraph. On the day, choose the three or four rows that answer</text><text x="50" y="607.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the question best (shown here as an example).</text>
