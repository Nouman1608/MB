<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One paragraph, four objectives</text>

<rect x="130" y="120" width="740" height="84" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="120" width="86" height="84" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="73" y="170" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">AO1</text><text x="152" y="156" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A point about the question</text><text x="152" y="184" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A coherent, personal argument with accurate terminology</text><rect x="130" y="214" width="740" height="84" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><rect x="30" y="214" width="86" height="84" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="73" y="264" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="middle">AO2</text><text x="152" y="250" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Analysis of a method in both novels</text><text x="152" y="278" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Narrative voice, structure, setting, symbolism, dialogue, language</text><rect x="130" y="308" width="740" height="84" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><rect x="30" y="308" width="86" height="84" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="73" y="358" font-size="22" font-weight="700" fill="#8a6d0d" text-anchor="middle">AO4</text><text x="152" y="344" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The comparison itself</text><text x="152" y="372" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Connections across the two texts</text><rect x="130" y="402" width="740" height="84" rx="12" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2.5"/><rect x="30" y="402" width="86" height="84" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="73" y="452" font-size="22" font-weight="700" fill="#8a6d0d" text-anchor="middle">AO3</text><text x="152" y="438" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Context explaining the difference</text><text x="152" y="466" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Contexts in which the texts were written and received</text><path d="M885,126 L885,480" fill="none" stroke="#1e2a44" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" /><rect x="30" y="504" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="537.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A paragraph that does all four is the goal.</text>
