<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 803" width="900" height="803" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="803" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked plan: women’s choices about marriage</text>

<rect x="30" y="118" width="840" height="132" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="151" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">THESIS</text><text x="50" y="181.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Both turn on a woman’s choice of a socially secure husband over a more passionate</text><text x="50" y="203.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">alternative, but Brontë presents it as a betrayal with destructive consequences, Woolf as a</text><text x="50" y="225.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">compromise her heroine continues to examine.</text><rect x="30" y="266" width="210" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="42" y="296" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Paragraph</text><rect x="240" y="266" width="315" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="252" y="296" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Wuthering Heights</text><rect x="555" y="266" width="315" height="46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="567" y="296" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Mrs Dalloway</text><rect x="30" y="312" width="210" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="337.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">1 The choice</text><rect x="240" y="312" width="315" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="252" y="337.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Catherine’s decision to marry</text><text x="252" y="358.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Edgar, explained to Nelly</text><rect x="555" y="312" width="315" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="567" y="337.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Clarissa’s memory of choosing</text><text x="567" y="358.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Richard over Peter</text><rect x="30" y="376" width="210" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="401.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">2 Narrative method</text><rect x="240" y="376" width="315" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="252" y="401.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Layered narrators (Lockwood, Nelly)</text><text x="252" y="422.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">keep Catherine at a distance</text><rect x="555" y="376" width="315" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="567" y="401.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Free indirect style gives access to</text><text x="567" y="422.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Clarissa’s mind</text><rect x="30" y="440" width="210" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="465.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">3 Structure and time</text><rect x="240" y="440" width="315" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="252" y="465.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Two generations and a partial</text><text x="252" y="486.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">repetition</text><rect x="555" y="440" width="315" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="567" y="465.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">One day in June 1923 with memories</text><text x="567" y="486.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">of youth</text><rect x="30" y="504" width="210" height="85" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="529.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">4 Context</text><rect x="240" y="504" width="315" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="252" y="529.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Property and marriage before</text><text x="252" y="550.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">married women could own property in</text><text x="252" y="571.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">their own right</text><rect x="555" y="504" width="315" height="85" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="567" y="529.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Post-war London and women’s</text><text x="567" y="550.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">changing roles</text><rect x="30" y="589" width="210" height="64" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="42" y="614.6" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">5 Reception</text><rect x="240" y="589" width="315" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="252" y="614.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Early reviewers’ unease at its</text><text x="252" y="635.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">passion and violence</text><rect x="555" y="589" width="315" height="64" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="567" y="614.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Later feminist readings of both</text><text x="567" y="635.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">novels</text><rect x="30" y="669" width="840" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="702" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">CONCLUSION</text><text x="50" y="732.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Marriage as social necessity and personal cost in both; they differ in whether the choice</text><text x="50" y="754.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">destroys or diminishes.</text>
</svg>