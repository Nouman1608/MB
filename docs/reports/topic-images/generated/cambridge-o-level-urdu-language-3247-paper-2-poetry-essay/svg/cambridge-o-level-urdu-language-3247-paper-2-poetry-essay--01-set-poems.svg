<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The prescribed poems for 2027</text>

<rect x="30" y="110" width="840" height="268" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="150" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Ghazals: ten</text><text x="54" y="178" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">two each by five poets</text><text x="846" y="166" font-size="30" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;غزلیں&#x200F;</text><rect x="54" y="204" width="252" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="180" y="235" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Khwaja Haider Ali Ahtish</text><text x="180" y="260" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="middle">2 ghazals</text><rect x="322" y="204" width="252" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="448" y="235" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Parveen Shakir</text><text x="448" y="260" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="middle">2 ghazals</text><rect x="590" y="204" width="252" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="716" y="235" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Momin Khan Momin</text><text x="716" y="260" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="middle">2 ghazals</text><rect x="54" y="288" width="252" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="180" y="319" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Allama Iqbal</text><text x="180" y="344" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="middle">2 ghazals</text><rect x="322" y="288" width="252" height="70" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="448" y="319" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Ahmed Faraz</text><text x="448" y="344" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="middle">2 ghazals</text><rect x="30" y="398" width="840" height="214" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="438" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Nazms: three</text><text x="846" y="458" font-size="30" fill="#8a6d0d" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;نظمیں&#x200F;</text><rect x="54" y="472" width="252" height="116" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="180" y="508" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" font-style="italic">Musadas Hali</text><text x="180" y="536" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Altaf Hussain Hali</text><text x="180" y="566" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="middle">seventeen selected stanzas</text><rect x="322" y="472" width="252" height="116" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="448" y="508" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" font-style="italic">Admee</text><text x="448" y="536" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Syed Zameer Jafree</text><rect x="590" y="472" width="252" height="116" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="716" y="508" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle" font-style="italic">Qitaat</text><text x="716" y="536" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Mirza Mahmood Sarhadi</text><text x="716" y="566" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="middle">six short pieces</text><rect x="30" y="632" width="840" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="675" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Set texts may not be taken into the exam: every quotation must be memorised.</text>
