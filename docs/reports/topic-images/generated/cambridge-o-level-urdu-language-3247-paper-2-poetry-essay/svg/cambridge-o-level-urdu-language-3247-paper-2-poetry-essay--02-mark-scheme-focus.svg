<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 768" width="900" height="768" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="768" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What the top level rewards</text>

<rect x="30" y="110" width="840" height="266" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="150" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Top level (13-15 of 15)</text><rect x="54" y="172" width="792" height="40" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="72" y="199" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">"shows a clear understanding of the text and its deeper implications"</text><rect x="54" y="220" width="792" height="40" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="72" y="247" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">"makes a developed exploration of the way the writer achieves her/his effects"</text><rect x="54" y="268" width="792" height="40" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="72" y="295" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">"supports with careful and relevant reference to the text"</text><rect x="54" y="316" width="792" height="40" rx="8" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="72" y="343" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">"fully addresses the focus of the question"</text><text x="450" y="416" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">How the focus strand falls away</text><rect x="30" y="436" width="840" height="58" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="52" y="472" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Top level</text><text x="170" y="472" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">"fully addresses the focus of the question"</text><rect x="30" y="506" width="640" height="58" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="52" y="542" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Level 3</text><text x="170" y="542" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">"partly addresses the focus of the question"</text><rect x="30" y="576" width="440" height="58" rx="10" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="52" y="612" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Level 1</text><text x="170" y="612" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">"little relevance to the question"</text><rect x="30" y="656" width="840" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="692" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">A fluent account of everything you know about a poem is not an answer</text><text x="54" y="718" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">if the question asked about one feeling or one idea.</text>
</svg>