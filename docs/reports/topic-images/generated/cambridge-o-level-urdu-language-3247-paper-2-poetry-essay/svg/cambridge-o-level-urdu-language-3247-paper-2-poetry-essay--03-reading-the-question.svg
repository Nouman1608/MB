<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 934" width="900" height="934" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="934" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Reading the question</text>

<rect x="30" y="110" width="840" height="160" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="146" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">Illustrative question</text><text x="846" y="202" font-size="28" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;شاعر نے امید اور ناامیدی کی کشمکش کو کس طرح پیش کیا ہے؟&#x200F;</text><text x="450" y="252" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Mark the focus and the method word before you plan.</text><rect x="30" y="290" width="840" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="344" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="351.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="110" y="334" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The text</text><text x="110" y="362" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Which ghazal or nazm, or "one of" a group, which lets you choose.</text><rect x="30" y="410" width="840" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="464" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="70" y="471.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="110" y="454" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The focus</text><text x="110" y="482" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The feeling, idea, character or</text><text x="110" y="503" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">attitude named.</text><rect x="470" y="422" width="384" height="84" rx="10" fill="#dce9e7"/><text x="842" y="464" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;امید اور ناامیدی کی کشمکش&#x200F;</text><text x="842" y="496" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="end" font-style="italic">the struggle between hope and despair</text><rect x="30" y="530" width="840" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="70" cy="584" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="70" y="591.92" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="110" y="574" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The method word</text><text x="110" y="602" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Discuss language and technique, not</text><text x="110" y="623" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">only meaning.</text><rect x="470" y="542" width="384" height="84" rx="10" fill="#dce9e7"/><text x="842" y="584" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کس طرح&#x200F;</text><text x="842" y="616" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="end" font-style="italic">how</text><text x="450" y="676" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">A personal response can be asked for in two ways</text><rect x="30" y="694" width="410" height="212" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="731" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Directly</text><text x="50" y="760.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">"What do you think?"</text><text x="420" y="822" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;آپ کی کیا رائے ہے&#x200F;</text><text x="420" y="876" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;آپ کیا محسوس کرتے ہیں&#x200F;</text><rect x="460" y="694" width="410" height="212" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="731" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">By implication</text><text x="480" y="760.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">"Explore the ways in which ..."</text><text x="850" y="822" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کن طریقوں سے&#x200F;</text><text x="850" y="876" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کس طرح&#x200F;</text>
</svg>