<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How a ghazal is built</text>

<rect x="800" y="128" width="40" height="28" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="790" y="152" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;قافیہ&#x200F;</text><text x="790" y="186" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">rhyme</text><rect x="540" y="128" width="40" height="28" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="530" y="152" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;ردیف&#x200F;</text><text x="530" y="186" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">refrain</text><rect x="280" y="128" width="40" height="28" rx="6" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="270" y="152" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;تخلص&#x200F;</text><text x="270" y="186" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">pen name</text><rect x="30" y="214" width="840" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="110" y="276" font-size="26" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;مطلع&#x200F;</text><text x="110" y="310" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">opening couplet</text><rect x="360" y="240" width="486" height="26" rx="6" fill="#dce9e7"/><rect x="272" y="240" width="80" height="26" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="190" y="240" width="74" height="26" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="360" y="284" width="486" height="26" rx="6" fill="#dce9e7"/><rect x="272" y="284" width="80" height="26" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="190" y="284" width="74" height="26" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="30" y="348" width="840" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="110" y="410" font-size="26" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;شعر&#x200F;</text><text x="110" y="444" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">couplet</text><rect x="190" y="374" width="656" height="26" rx="6" fill="#dce9e7"/><rect x="360" y="418" width="486" height="26" rx="6" fill="#dce9e7"/><rect x="272" y="418" width="80" height="26" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="190" y="418" width="74" height="26" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="30" y="482" width="840" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="110" y="544" font-size="26" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;شعر&#x200F;</text><text x="110" y="578" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">couplet</text><rect x="190" y="508" width="656" height="26" rx="6" fill="#dce9e7"/><rect x="360" y="552" width="486" height="26" rx="6" fill="#dce9e7"/><rect x="272" y="552" width="80" height="26" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="190" y="552" width="74" height="26" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="450" y="624" font-size="22" font-weight="400" fill="#4a5568" text-anchor="middle">⋮</text><rect x="30" y="632" width="840" height="120" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="110" y="694" font-size="26" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;مقطع&#x200F;</text><text x="110" y="728" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">closing couplet</text><rect x="190" y="658" width="656" height="26" rx="6" fill="#dce9e7"/><rect x="360" y="702" width="486" height="26" rx="6" fill="#dce9e7"/><rect x="272" y="702" width="80" height="26" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><rect x="190" y="702" width="74" height="26" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="560" y="702" width="90" height="26" rx="6" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="846" y="776" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">Lines run right to left: rhyme and refrain close each rhyming line.</text><rect x="30" y="800" width="840" height="108" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="840" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Each couplet is complete in itself</text><text x="54" y="872" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Select the couplets that serve the question's focus; do not go through the poem in order.</text>
</svg>