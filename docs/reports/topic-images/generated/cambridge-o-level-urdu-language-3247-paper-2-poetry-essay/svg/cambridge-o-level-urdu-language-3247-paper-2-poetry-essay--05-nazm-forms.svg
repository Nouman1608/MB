<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 712" width="900" height="712" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="712" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Nazm, musaddas and qita</text>

<rect x="30" y="110" width="268" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="278" y="160" font-size="28" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;نظم&#x200F;</text><text x="50" y="152" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Nazm</text><text x="50" y="184" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">one subject</text><rect x="64" y="216" width="200" height="62" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="164" y="254" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">opens</text><line x1="164" y1="280" x2="164" y2="316" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="64" y="320" width="200" height="62" rx="10" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2"/><text x="164" y="358" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">builds</text><line x1="164" y1="384" x2="164" y2="420" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="64" y="424" width="200" height="62" rx="10" fill="#f2e7b8" stroke="#2e6b62" stroke-width="2"/><text x="164" y="462" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">closes</text><text x="164" y="542" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">Follow its movement.</text><rect x="316" y="110" width="268" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="564" y="160" font-size="28" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;مسدس&#x200F;</text><text x="336" y="152" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Musaddas</text><text x="336" y="184" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">six-line stanzas</text><rect x="390" y="210" width="160" height="28" rx="6" fill="#dce9e7"/><rect x="348" y="210" width="38" height="28" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="367" y="230" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><rect x="390" y="252" width="160" height="28" rx="6" fill="#dce9e7"/><rect x="348" y="252" width="38" height="28" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="367" y="272" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><rect x="390" y="294" width="160" height="28" rx="6" fill="#dce9e7"/><rect x="348" y="294" width="38" height="28" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="367" y="314" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><rect x="390" y="336" width="160" height="28" rx="6" fill="#dce9e7"/><rect x="348" y="336" width="38" height="28" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="367" y="356" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">A</text><rect x="390" y="392" width="160" height="28" rx="6" fill="#dce9e7"/><rect x="348" y="392" width="38" height="28" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="367" y="412" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><rect x="390" y="434" width="160" height="28" rx="6" fill="#dce9e7"/><rect x="348" y="434" width="38" height="28" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="367" y="454" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">B</text><path d="M560,210 l10,0 l0,154 l-10,0" fill="none" stroke="#2e6b62" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M560,392 l10,0 l0,70 l-10,0" fill="none" stroke="#8a6d0d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="450" y="502" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Usually four rhyming lines,</text><text x="450" y="523" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">then a couplet on a new</text><text x="450" y="544" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">rhyme that often sharpens</text><text x="450" y="565" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">or turns the idea.</text><rect x="602" y="110" width="268" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="850" y="160" font-size="28" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;قطعہ&#x200F;</text><text x="622" y="152" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Qita</text><text x="622" y="184" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">connected couplets</text><rect x="636" y="210" width="200" height="62" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><rect x="652" y="222" width="168" height="14" rx="4" fill="#ffffff"/><rect x="652" y="246" width="168" height="14" rx="4" fill="#ffffff"/><line x1="736" y1="273" x2="736" y2="286" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="636" y="288" width="200" height="62" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><rect x="652" y="300" width="168" height="14" rx="4" fill="#ffffff"/><rect x="652" y="324" width="168" height="14" rx="4" fill="#ffffff"/><line x1="736" y1="351" x2="736" y2="364" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="636" y="366" width="200" height="62" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><rect x="652" y="378" width="168" height="14" rx="4" fill="#ffffff"/><rect x="652" y="402" width="168" height="14" rx="4" fill="#ffffff"/><text x="736" y="462" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">turn at the end</text><text x="736" y="502" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Together the couplets make</text><text x="736" y="523" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">one point.</text><rect x="30" y="600" width="840" height="84" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="450" y="636" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Comment on form only when it helps answer the question,</text><text x="450" y="662" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">and say what it does, not just its name.</text>
</svg>