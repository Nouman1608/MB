<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 724" width="900" height="724" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="724" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Building the poetry essay</text>

<rect x="30" y="110" width="840" height="92" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="50" y="146.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Introduction (two or three sentences)</text><text x="50" y="175.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Answer the question in your own words and name the methods you will discuss.</text><line x1="450" y1="204" x2="450" y2="228" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="232" width="840" height="286" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="268" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Three or four body paragraphs, each on one couplet or stanza</text><rect x="54" y="290" width="252" height="96" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="82" cy="320" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="82" y="325.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="108" y="327" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Point</text><text x="72" y="356" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">linked to the focus</text><rect x="322" y="290" width="252" height="96" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="350" cy="320" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="350" y="325.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="376" y="327" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Quotation</text><text x="340" y="356" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">a few memorised words</text><rect x="590" y="290" width="252" height="96" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="618" cy="320" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="618" y="325.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="644" y="327" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Meaning</text><text x="608" y="356" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">what the words say</text><rect x="54" y="400" width="252" height="96" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="82" cy="430" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="82" y="435.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="108" y="437" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Deeper meaning</text><text x="72" y="466" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">beyond the literal</text><rect x="322" y="400" width="252" height="96" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="350" cy="430" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="350" y="435.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="376" y="437" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Method</text><text x="340" y="466" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">image, contrast, repetition,</text><text x="340" y="485" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">tone, form: its effect</text><rect x="590" y="400" width="252" height="96" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><circle cx="618" cy="430" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="618" y="435.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="644" y="437" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Link</text><text x="608" y="466" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">back to the focus</text><line x1="450" y1="520" x2="450" y2="544" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="548" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="50" y="584.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Conclusion</text><text x="50" y="613.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Your personal response, grown from the analysis: which couplet or stanza is most powerful,</text><text x="50" y="636.45" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">and why.</text><text x="450" y="698" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">About 35 minutes in the exam, including a few minutes to plan.</text>
</svg>