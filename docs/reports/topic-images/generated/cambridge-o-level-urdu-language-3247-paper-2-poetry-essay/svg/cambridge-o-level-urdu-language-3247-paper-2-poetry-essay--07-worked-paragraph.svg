<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 884" width="900" height="884" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="884" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: image, word, link</text>

<rect x="30" y="110" width="840" height="150" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="144" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">Illustrative lines</text><text x="54" y="166" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(written for the guide,</text><text x="54" y="186" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">not a set poem)</text><text x="846" y="172" font-size="28" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;دیا جلا کے رکھا ہے ہوا کے رستے میں&#x200F;</text><text x="846" y="232" font-size="28" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;یہ ضد ہے دل کی کہ شاید وہ لوٹ آئے کبھی&#x200F;</text><rect x="30" y="280" width="840" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="332" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="339.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="102" y="318" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Image</text><text x="102" y="348" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Hope is a fragile lamp, deliberately placed in the wind's</text><text x="102" y="369" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">path.</text><text x="846" y="344" font-size="26" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;"ہوا کے رستے میں"&#x200F;</text><line x1="450" y1="385" x2="450" y2="397" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="398" width="840" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="450" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="457.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="102" y="436" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Deeper meaning</text><text x="102" y="466" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The wind is the lamp's enemy: the hope is always in danger, yet the poet does not let</text><text x="102" y="487" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">it go out.</text><line x1="450" y1="503" x2="450" y2="515" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="516" width="840" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="568" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="575.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="102" y="554" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Single word</text><text x="102" y="584" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">This hope is a decision of the heart, not of reason.</text><text x="846" y="580" font-size="26" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;"ضد"&#x200F;</text><line x1="450" y1="621" x2="450" y2="633" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="634" width="840" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="66" cy="686" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="693.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="102" y="672" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Single words</text><text x="102" y="702" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Weak, uncertain words stand against the stubbornness.</text><text x="846" y="698" font-size="26" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;"شاید" "کبھی"&#x200F;</text><line x1="450" y1="739" x2="450" y2="751" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="752" width="840" height="104" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="66" cy="804" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="811.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="102" y="790" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Link to focus</text><text x="102" y="820" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">One couplet holds the struggle between hope and despair.</text><text x="846" y="816" font-size="26" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کشمکش&#x200F;</text>
</svg>