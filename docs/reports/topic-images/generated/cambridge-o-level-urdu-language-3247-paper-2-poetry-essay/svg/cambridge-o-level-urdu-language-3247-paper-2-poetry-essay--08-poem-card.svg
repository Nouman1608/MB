<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 688" width="900" height="688" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="688" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Preparing each poem</text>

<rect x="30" y="110" width="840" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">One-page poem card</text><rect x="54" y="168" width="792" height="44" rx="8" fill="#dce9e7" stroke="#c9d6d4" stroke-width="1.5"/><text x="72" y="197" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Central idea</text><text x="230" y="197" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">one sentence, plus the tone</text><rect x="54" y="220" width="792" height="44" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="72" y="249" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Phrases</text><text x="230" y="249" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">four to six memorised, each with its technique</text><rect x="54" y="272" width="792" height="44" rx="8" fill="#dce9e7" stroke="#c9d6d4" stroke-width="1.5"/><text x="72" y="301" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Ghazal</text><text x="230" y="301" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">which couplets suit which likely focus</text><rect x="54" y="324" width="792" height="44" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="1.5"/><text x="72" y="353" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Nazm</text><text x="230" y="353" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">how it opens, develops and ends</text><rect x="54" y="376" width="792" height="44" rx="8" fill="#dce9e7" stroke="#c9d6d4" stroke-width="1.5"/><text x="72" y="405" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Judgement</text><text x="230" y="405" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">one personal view you could defend</text><text x="450" y="480" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Using memorised quotation</text><rect x="30" y="500" width="268" height="160" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="536.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Short phrases</text><text x="50" y="564.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Two to five words: easier</text><text x="50" y="586.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">to recall exactly and to</text><text x="50" y="608.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">weave into your sentences.</text><rect x="316" y="500" width="268" height="160" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="336" y="536.15" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Memory fails?</text><text x="336" y="564.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Refer closely to the detail</text><text x="336" y="586.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">instead of inventing a</text><text x="336" y="608.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">quotation: close reference</text><text x="336" y="630.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">is credited.</text><rect x="602" y="500" width="268" height="160" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="622" y="536.15" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Garbled quotation</text><text x="622" y="564.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Not credited: it weakens</text><text x="622" y="586.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">"careful" reference.</text>
</svg>