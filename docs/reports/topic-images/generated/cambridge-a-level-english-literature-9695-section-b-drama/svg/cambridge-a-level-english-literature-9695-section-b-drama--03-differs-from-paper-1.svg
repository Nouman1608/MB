<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How this differs from Paper 1 drama</text>

<rect x="30" y="118" width="840" height="150" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Still applies from Paper 1 drama</text><rect x="50" y="176" width="300" height="33" rx="16.5" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="200" y="198.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">stage directions as evidence</text><rect x="362" y="176" width="173" height="33" rx="16.5" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="448.5" y="198.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">dialogue rhythm</text><rect x="547" y="176" width="163" height="33" rx="16.5" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="628.5" y="198.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">dramatic irony</text><rect x="722" y="176" width="114" height="33" rx="16.5" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="779" y="198.62" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">structure</text><text x="50" y="246" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The close-reading skills carry over.</text><text x="450" y="314" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Two things change</text><line x1="300" y1="286" x2="230" y2="324" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="600" y1="286" x2="670" y2="324" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="334" width="410" height="138" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="367" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">CHANGE 1</text><text x="50" y="394.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">AO5</text><text x="50" y="425.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Your argument must engage with and</text><text x="50" y="447.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">evaluate other interpretations.</text><rect x="460" y="334" width="410" height="138" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="367" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">CHANGE 2</text><text x="480" y="394.8" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Modern theatrical methods</text><text x="480" y="425.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Knowing the conventions the plays use or</text><text x="480" y="447.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">resist is part of AO1 and AO2.</text>
