<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 712" width="900" height="712" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="712" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The (a) essay: turn the question into a claim</text>

<rect x="30" y="118" width="840" height="85" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="151" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">QUESTION</text><text x="50" y="177.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Discuss the dramatic presentation of friendship in Sweat.</text><rect x="90" y="221" width="780" height="85" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="110" y="254" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">WEAK THESIS</text><text x="110" y="280.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Friendship is important and is tested.</text><circle cx="52" cy="263.5" r="18" fill="#b5602e"/><path d="M44.8,256.3 l14.4,14.4 m0,-14.4 l-14.4,14.4" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="90" y="320" width="780" height="154" rx="14" fill="#f2e7b8" stroke="#2e6b62" stroke-width="2.5"/><text x="110" y="353" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRONGER: AN ARGUMENT ABOUT METHOD</text><text x="110" y="383.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“Nottage stages friendship in a single shared bar, so that when Cynthia’s promotion</text><text x="110" y="405.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">to management divides her from Tracey, the audience watches the space itself split;</text><text x="110" y="427.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">because the play has already shown the outcome in 2008, every earlier scene of</text><text x="110" y="449.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">loyalty is shadowed by what we know is coming.”</text><circle cx="52" cy="397" r="18" fill="#2e6b62"/><path d="M43.9,397.36 l5.76,6.12 l10.799999999999999,-11.88" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="30" y="492" width="270.6666666666667" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165.33333333333334" y="532.9" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Names a staging choice</text><text x="165.33333333333334" y="561.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">the single shared bar</text><rect x="314.6666666666667" y="492" width="270.6666666666667" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="532.9" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Uses the structure</text><text x="450" y="561.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">the outcome shown in 2008</text><rect x="599.3333333333334" y="492" width="270.6666666666667" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="734.6666666666667" y="522.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Gives a line to argue</text><text x="734.6666666666667" y="550.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">loyalty shadowed by what is</text><text x="734.6666666666667" y="571.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">coming</text><rect x="30" y="608" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="641.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Then: moments from across the play including the ending, theatrical method in every</text><text x="50" y="663.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">paragraph, and AO5 woven through two or three paragraphs.</text>
</svg>