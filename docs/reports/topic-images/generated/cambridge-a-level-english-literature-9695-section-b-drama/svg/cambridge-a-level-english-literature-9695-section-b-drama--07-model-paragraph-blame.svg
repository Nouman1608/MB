<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 763" width="900" height="763" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="763" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Model paragraph: blame within the Tyrone family</text>

<rect x="30" y="118" width="840" height="136" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="151" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRUCTURE (AO2)</text><text x="50" y="178" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Blame circulates and never settles</text><text x="50" y="207.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Long confessional speeches are shared among all four Tyrones; each explains, but does not</text><text x="50" y="229.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">excuse, the harm done.</text><text x="30" y="284" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><rect x="30" y="288" width="410" height="133" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="331.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">READING 1</text><text x="50" y="357.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Mary as centre and victim</text><text x="50" y="386.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The men’s failures orbit her addiction.</text><rect x="460" y="288" width="410" height="133" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="321" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">READING 2: FEMINIST</text><text x="480" y="347.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The house as her prison</text><text x="480" y="375.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The house she insists has never been a real</text><text x="480" y="396.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">home.</text><rect x="30" y="455" width="840" height="136" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="50" y="488" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TESTED AGAINST THE TEXT (AO5)</text><text x="50" y="515" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The structure resists any single centre</text><text x="50" y="544.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The final act gives the longest confessions to the men, and Mary enters only at the end,</text><text x="50" y="566.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">lost in the past.</text><rect x="30" y="625" width="840" height="114" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="658" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">JUDGEMENT (AO3)</text><text x="50" y="685" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Everyone is both cause and casualty</text><text x="50" y="714.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">So the ending offers recognition rather than resolution.</text><line x1="450" y1="258" x2="450" y2="284" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="450" y1="425" x2="450" y2="451" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="450" y1="595" x2="450" y2="621" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/>
</svg>