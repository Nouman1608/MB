<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 826" width="900" height="826" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="826" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Modern theatrical methods in the set plays</text>

<rect x="30" y="116" width="412" height="276" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="42" y="128" width="388" height="96" rx="10" fill="#dce9e7"/><rect x="126" y="154" width="140" height="62" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M126,154 L196,134 L266,154" fill="none" stroke="#1e2a44" stroke-width="2.5"/><path d="M276,154 q20,-10 40,0 t40,0 t30,0" fill="none" stroke="#4a5568" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M276,174 q20,-10 40,0 t40,0 t30,0" fill="none" stroke="#4a5568" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><path d="M276,194 q20,-10 40,0 t40,0 t30,0" fill="none" stroke="#4a5568" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><path d="M139.2,212 L141.2,191.2 Q146,187.2 150.8,191.2 L152.8,212 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="146" cy="183.2" r="5.2" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><path d="M165.2,212 L167.2,191.2 Q172,187.2 176.8,191.2 L178.8,212 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="172" cy="183.2" r="5.2" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><path d="M191.2,212 L193.2,191.2 Q198,187.2 202.8,191.2 L204.8,212 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="198" cy="183.2" r="5.2" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><path d="M217.2,212 L219.2,191.2 Q224,187.2 228.8,191.2 L230.8,212 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="224" cy="183.2" r="5.2" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="48" y="256" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NATURALISM</text><text x="48" y="280" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">Long Day’s Journey Into Night</text><text x="48" y="308" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Life as it is lived. Long stage directions</text><text x="48" y="329" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">describe appearance and inner states. Where</text><text x="48" y="350" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">it strains, the fog and foghorn work</text><text x="48" y="371" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">symbolically too.</text><rect x="458" y="116" width="412" height="276" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="470" y="128" width="388" height="96" rx="10" fill="#f2e7b8"/><rect x="516" y="146" width="56" height="32" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="544" y="167" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">2008</text><rect x="596" y="164" width="56" height="32" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="624" y="185" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">2000</text><rect x="676" y="164" width="56" height="32" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="704" y="185" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">2000</text><rect x="756" y="164" width="56" height="32" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="784" y="185" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">2000</text><text x="664" y="216" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">outcome first (schematic)</text><text x="476" y="256" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">TIME AND STRUCTURE</text><text x="476" y="280" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">Sweat</text><text x="476" y="308" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Moves between 2000 and 2008, so consequences</text><text x="476" y="329" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">come before causes: structural dramatic</text><text x="476" y="350" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">irony.</text><rect x="30" y="408" width="412" height="276" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="42" y="420" width="388" height="96" rx="10" fill="#f6e3d6"/><path d="M107.5,504 L110,478 Q116,473 122,478 L124.5,504 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="116" cy="468" r="6.5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><path d="M147.5,504 L150,478 Q156,473 162,478 L164.5,504 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="156" cy="468" r="6.5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><path d="M187.5,504 L190,478 Q196,473 202,478 L204.5,504 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="196" cy="468" r="6.5" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><path d="M227.5,504 L230,478 Q236,473 242,478 L244.5,504 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="236" cy="468" r="6.5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><path d="M267.5,504 L270,478 Q276,473 282,478 L284.5,504 Z" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="276" cy="468" r="6.5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><ellipse cx="346" cy="474" rx="26" ry="10" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><path d="M320,474 L320,498 Q346,510 372,498 L372,474" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><text x="388" y="454" font-size="26" font-weight="700" fill="#b5602e" text-anchor="start">♪</text><text x="48" y="548" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">RITUAL AND MUSIC</text><text x="48" y="572" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">Kongi’s Harvest</text><text x="48" y="600" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Song, dance, ritual and crowd scenes as</text><text x="48" y="621" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">dramatic language; satire through</text><text x="48" y="642" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">exaggeration and contrast between the regime</text><text x="48" y="663" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and traditional authority.</text><rect x="458" y="408" width="412" height="276" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="470" y="420" width="388" height="96" rx="10" fill="#dce9e7"/><rect x="534" y="430" width="260" height="76" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><rect x="594" y="444" width="140" height="50" fill="#efdfa8" stroke="#1e2a44" stroke-width="2" stroke-dasharray="6 4"/><path d="M627.88,490 L629.68,471.28 Q634,467.68 638.32,471.28 L640.12,490 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="634" cy="464.08" r="4.68" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><path d="M687.88,490 L689.68,471.28 Q694,467.68 698.32,471.28 L700.12,490 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="694" cy="464.08" r="4.68" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><path d="M554.86,502 L556.96,480.16 Q562,475.96 567.04,480.16 L569.14,502 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="562" cy="471.76" r="5.46" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><path d="M758.86,502 L760.96,480.16 Q766,475.96 771.04,480.16 L773.14,502 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="766" cy="471.76" r="5.46" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="664" y="440" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="476" y="548" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">METATHEATRE</text><text x="476" y="572" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">Our Country’s Good</text><text x="476" y="600" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Convicts and officers rehearse a play.</text><text x="476" y="621" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Doubling roles across convicts and officers</text><text x="476" y="642" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">sharpens questions of class and power.</text><rect x="30" y="700" width="840" height="102" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="733.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Setting and space: a single bar, a family living room, a palace courtyard. The set defines</text><text x="50" y="755.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">who can meet whom: who enters, who is excluded, and which objects carry meaning across the</text><text x="50" y="777.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">play.</text>
</svg>