<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Building AO5 for modern plays</text>

<rect x="30" y="104" width="270.6666666666667" height="245" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="133" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SOURCE 1</text><text x="46" y="159.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Production choices</text><text x="46" y="187.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="187.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Casting, design, doubling,</text><text x="61.2" y="208.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">cuts.</text><text x="46" y="234.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="61.2" y="234.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">How a staging changes a</text><text x="61.2" y="255.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">scene’s meaning.</text><rect x="314.6666666666667" y="104" width="270.6666666666667" height="245" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="330.6666666666667" y="133" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">SOURCE 2</text><text x="330.6666666666667" y="159.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Critical approaches</text><text x="330.6666666666667" y="187.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="345.8666666666667" y="187.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Marxist or economic: Sweat</text><text x="330.6666666666667" y="213.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="345.8666666666667" y="213.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Postcolonial: Kongi’s</text><text x="345.8666666666667" y="234.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Harvest</text><text x="330.6666666666667" y="260.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="345.8666666666667" y="260.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Feminist: Mary Tyrone</text><text x="330.6666666666667" y="286.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="345.8666666666667" y="286.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Does Our Country’s Good</text><text x="345.8666666666667" y="307.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">celebrate theatre too</text><text x="345.8666666666667" y="328.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">optimistically?</text><rect x="599.3333333333334" y="104" width="270.6666666666667" height="245" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="615.3333333333334" y="133" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SOURCE 3</text><text x="615.3333333333334" y="159.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Audience positions</text><text x="615.3333333333334" y="187.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="630.5333333333334" y="187.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The first audience and</text><text x="630.5333333333334" y="208.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">audiences now.</text><text x="615.3333333333334" y="234.8" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">•</text><text x="630.5333333333334" y="234.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Audiences in different</text><text x="630.5333333333334" y="255.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">countries.</text><line x1="450" y1="359" x2="450" y2="389" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="399" width="840" height="90" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="435" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Weigh the reading, do not just list it</text><text x="450" y="464.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Alternative readings mentioned but not weighed are a common mistake.</text>
