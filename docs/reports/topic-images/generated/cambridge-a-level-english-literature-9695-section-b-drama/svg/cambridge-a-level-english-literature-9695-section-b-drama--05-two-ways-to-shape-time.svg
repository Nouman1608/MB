<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 638" width="900" height="638" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="638" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two ways to shape stage time</text>

<text x="30" y="126" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Long Day’s Journey Into Night</tspan>: one day in August 1912</text><rect x="30" y="146" width="210" height="70" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="135" y="188" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Act 1</text><rect x="240" y="146" width="210" height="70" fill="#e8edee" stroke="#1e2a44" stroke-width="2.5"/><text x="345" y="188" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Act 2</text><rect x="450" y="146" width="210" height="70" fill="#d3dcde" stroke="#1e2a44" stroke-width="2.5"/><text x="555" y="188" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Act 3</text><rect x="660" y="146" width="210" height="70" fill="#b9c6c9" stroke="#1e2a44" stroke-width="2.5"/><text x="765" y="188" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Act 4</text><line x1="30" y1="242" x2="870" y2="242" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="30" y="268" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">morning</text><text x="870" y="268" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">midnight</text><text x="450" y="268" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">one family, one house; the fog thickens</text><text x="30" y="316" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Sweat</tspan>: moves between 2000 and 2008</text><rect x="30" y="346" width="840" height="56" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="48" y="381" font-size="18" font-weight="700" fill="#4a5568" text-anchor="start">2008</text><rect x="30" y="416" width="840" height="56" rx="8" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="48" y="451" font-size="18" font-weight="700" fill="#4a5568" text-anchor="start">2000</text><rect x="150" y="354" width="70" height="40" rx="6" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="270" y="424" width="70" height="40" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><line x1="220" y1="382" x2="270" y2="444" stroke="#1e2a44" stroke-width="2" stroke-dasharray="5 4"/><rect x="390" y="424" width="70" height="40" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><line x1="340" y1="452" x2="390" y2="444" stroke="#1e2a44" stroke-width="2" stroke-dasharray="5 4"/><rect x="510" y="424" width="70" height="40" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><line x1="460" y1="452" x2="510" y2="444" stroke="#1e2a44" stroke-width="2" stroke-dasharray="5 4"/><rect x="630" y="424" width="70" height="40" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><line x1="580" y1="452" x2="630" y2="444" stroke="#1e2a44" stroke-width="2" stroke-dasharray="5 4"/><rect x="750" y="424" width="70" height="40" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><line x1="700" y1="452" x2="750" y2="444" stroke="#1e2a44" stroke-width="2" stroke-dasharray="5 4"/><path d="M255,374 C420,374 520,374 760,420" fill="none" stroke="#8a6d0d" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#ahO)"/><text x="530" y="368" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">what we already know shadows each earlier scene</text><text x="870" y="498" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">order of scenes shown schematically</text><rect x="30" y="512" width="840" height="102" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="545.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Seeing consequences before causes means every earlier scene is watched with structural</text><text x="50" y="567.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">dramatic irony. Ask what the play gains by revealing outcomes first, and how the final</text><text x="50" y="589.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">scenes reshape the opening.</text>
</svg>