<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="460" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Pakistan’s three seaports</text>

<rect x="30" y="110" width="270" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M50,200 q20,-14 40,0 q20,-14 40,0 q20,-14 40,0 q20,-14 40,0 q20,-14 40,0 q20,-14 40,0" fill="none" stroke="#2b5a9a" stroke-width="3"/><path d="M120,186 L210,186 L198,170 L132,170 Z" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="146" y="152" width="22" height="18" fill="#b5602e" stroke="#1e2a44" stroke-width="1.5"/><rect x="170" y="152" width="22" height="18" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.5"/><text x="50" y="246" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Keamari</text><text x="50" y="272" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Karachi Port</text><text x="50" y="306" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The original port, on</text><text x="50" y="327" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Karachi’s natural harbour</text><rect x="315" y="110" width="270" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M335,200 q20,-14 40,0 q20,-14 40,0 q20,-14 40,0 q20,-14 40,0 q20,-14 40,0 q20,-14 40,0" fill="none" stroke="#2b5a9a" stroke-width="3"/><path d="M405,186 L495,186 L483,170 L417,170 Z" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="431" y="152" width="22" height="18" fill="#b5602e" stroke="#1e2a44" stroke-width="1.5"/><rect x="455" y="152" width="22" height="18" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.5"/><text x="335" y="246" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Port Qasim</text><text x="335" y="272" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">east of Karachi</text><text x="335" y="306" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Built later to relieve</text><text x="335" y="327" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">congestion and handle bulk</text><text x="335" y="348" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cargo: coal, oil, LNG</text><rect x="600" y="110" width="270" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M620,200 q20,-14 40,0 q20,-14 40,0 q20,-14 40,0 q20,-14 40,0 q20,-14 40,0 q20,-14 40,0" fill="none" stroke="#2b5a9a" stroke-width="3"/><path d="M690,186 L780,186 L768,170 L702,170 Z" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><rect x="716" y="152" width="22" height="18" fill="#b5602e" stroke="#1e2a44" stroke-width="1.5"/><rect x="740" y="152" width="22" height="18" fill="#b5d3cf" stroke="#1e2a44" stroke-width="1.5"/><text x="620" y="246" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Gwadar</text><text x="620" y="272" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Balochistan</text><text x="620" y="306" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Deep-water port near the</text><text x="620" y="327" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Strait of Hormuz, developed</text><text x="620" y="348" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">with Chinese support as the</text><text x="620" y="369" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">end point of CPEC; still</text><text x="620" y="390" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">lacks road, rail, water and</text><text x="620" y="411" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">power links</text>
</svg>