<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 724" width="900" height="724" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="724" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Road, rail or air?</text>

<rect x="30" y="120" width="300" height="160" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="52" y="154" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">If the load is…</text><text x="52" y="186" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Perishable, or needs to</text><text x="52" y="210" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">reach a village?</text><line x1="334" y1="200" x2="380" y2="200" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="386" y="120" width="484" height="160" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="3" /><rect x="386" y="120" width="110" height="160" rx="12" fill="#b5602e"/><text x="441" y="208" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">Road</text><text x="512" y="152" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">Best for</text><text x="512" y="174" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Door-to-door; reaches villages; suits</text><text x="512" y="194" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">perishables such as mangoes</text><text x="512" y="228" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Drawbacks</text><text x="512" y="250" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Accidents, congestion, overloaded trucks,</text><text x="512" y="270" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">fuel imports</text><rect x="30" y="310" width="300" height="160" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="52" y="344" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">If the load is…</text><text x="52" y="376" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Bulky, heavy and travelling</text><text x="52" y="400" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">far?</text><line x1="334" y1="390" x2="380" y2="390" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="386" y="310" width="484" height="160" rx="12" fill="#ffffff" stroke="#2b5a9a" stroke-width="3" /><rect x="386" y="310" width="110" height="160" rx="12" fill="#2b5a9a"/><text x="441" y="398" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">Rail</text><text x="512" y="342" font-size="15" font-weight="700" fill="#2b5a9a" text-anchor="start">Best for</text><text x="512" y="364" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cheapest for bulky goods over long</text><text x="512" y="384" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">distance: coal, oil, containers, wheat</text><text x="512" y="418" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Drawbacks</text><text x="512" y="440" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Old track and rolling stock, losses, fixed</text><text x="512" y="460" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">routes</text><rect x="30" y="500" width="300" height="160" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="52" y="534" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">If the load is…</text><text x="52" y="566" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Small, valuable or urgent?</text><line x1="334" y1="580" x2="380" y2="580" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="386" y="500" width="484" height="160" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="3" /><rect x="386" y="500" width="110" height="160" rx="12" fill="#2e6b62"/><text x="441" y="588" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">Air</text><text x="512" y="532" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">Best for</text><text x="512" y="554" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fastest; small, high-value or urgent</text><text x="512" y="574" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">goods; links remote northern towns</text><text x="512" y="608" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Drawbacks</text><text x="512" y="630" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Expensive; small loads; weather</text><text x="512" y="650" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">cancellations</text><text x="450" y="700" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Rail is cheapest for bulk, yet road carries most freight: old track and slow services push firms to trucks.</text>
</svg>