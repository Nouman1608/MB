<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 670" width="900" height="670" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="670" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Routes across Pakistan’s borders</text>

<rect x="330" y="327" width="240" height="90" rx="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3" /><text x="450" y="381" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">Pakistan</text><line x1="310" y1="242" x2="330" y2="372" stroke="#c9d6d4" stroke-width="5"/><rect x="30" y="120" width="280" height="244" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="158" font-size="22" font-weight="700" fill="#2b5a9a" text-anchor="start">China</text><text x="50" y="194" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">ROAD</text><text x="50" y="218" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Karakoram Highway over the</text><text x="50" y="239" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Khunjerab Pass (about 4,700</text><text x="50" y="260" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">m); usually closed in winter</text><text x="50" y="303" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RAIL</text><text x="50" y="327" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No rail link</text><line x1="590" y1="242" x2="570" y2="372" stroke="#c9d6d4" stroke-width="5"/><rect x="590" y="120" width="280" height="244" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="610" y="158" font-size="22" font-weight="700" fill="#2b5a9a" text-anchor="start">Afghanistan</text><text x="610" y="194" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">ROAD</text><text x="610" y="218" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Torkham via the Khyber Pass;</text><text x="610" y="239" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Chaman on the Quetta–Kandahar</text><text x="610" y="260" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">road</text><text x="610" y="303" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RAIL</text><text x="610" y="327" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Line to Chaman via the Khojak</text><text x="610" y="348" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Tunnel, ending at the border</text><line x1="310" y1="502" x2="330" y2="372" stroke="#c9d6d4" stroke-width="5"/><rect x="30" y="380" width="280" height="244" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="418" font-size="22" font-weight="700" fill="#2b5a9a" text-anchor="start">Iran</text><text x="50" y="454" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">ROAD</text><text x="50" y="478" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Taftan on the Quetta–Zahedan</text><text x="50" y="499" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">road</text><text x="50" y="542" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RAIL</text><text x="50" y="566" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Quetta–Taftan–Zahedan line</text><line x1="590" y1="502" x2="570" y2="372" stroke="#c9d6d4" stroke-width="5"/><rect x="590" y="380" width="280" height="244" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="610" y="418" font-size="22" font-weight="700" fill="#2b5a9a" text-anchor="start">India</text><text x="610" y="454" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">ROAD</text><text x="610" y="478" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Wagah near Lahore</text><text x="610" y="521" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RAIL</text><text x="610" y="545" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Wagah–Attari line; services</text><text x="610" y="566" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">suspended since 2019</text><text x="450" y="650" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Schematic only: the boxes do not show where each neighbour lies.</text>
</svg>