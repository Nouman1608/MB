<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 668" width="900" height="668" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="668" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four patterns in Pakistan’s transport network</text>

<rect x="30" y="110" width="410" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="50" y="130" width="150" height="150" rx="8" fill="#eef3e6" stroke="#c9d6d4" stroke-width="1.5" /><path d="M60,150 L190,144" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M68,140 L76,270" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M60,178 L190,174" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M96,140 L102,270" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M60,206 L190,204" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M124,140 L128,270" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M60,234 L190,234" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M152,140 L154,270" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M60,262 L190,264" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M180,140 L180,270" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M60,260 L190,150" fill="none" stroke="#1e2a44" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 5"/><text x="220" y="160" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Dense grid</text><text x="220" y="190" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Indus Plain of central</text><text x="220" y="211" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and northern Punjab:</text><text x="220" y="232" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">close grid linking</text><text x="220" y="253" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Lahore, Faisalabad,</text><text x="220" y="274" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Gujranwala, Sialkot,</text><text x="220" y="295" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Multan</text><text x="50" y="310" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><rect x="460" y="110" width="410" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="480" y="130" width="150" height="150" rx="8" fill="#eef3e6" stroke="#c9d6d4" stroke-width="1.5" /><path d="M555,135 Q540,205 560,275" fill="none" stroke="#2b5a9a" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" /><path d="M530,138 Q518,205 536,272" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M582,138 Q568,205 586,272" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M542,205 L572,205" fill="none" stroke="#b5602e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><rect x="598" y="140" width="26" height="130" fill="#efdfa8"/><text x="650" y="160" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Linear corridors</text><text x="650" y="190" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Sindh: N-5, N-55 and rail</text><text x="650" y="211" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">lines run north–south</text><text x="650" y="232" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">along both banks of the</text><text x="650" y="253" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Indus; few links across</text><text x="650" y="274" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the Thar</text><text x="480" y="310" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><rect x="30" y="356" width="410" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="50" y="376" width="150" height="150" rx="8" fill="#eef3e6" stroke="#c9d6d4" stroke-width="1.5" /><rect x="50" y="376" width="150" height="150" rx="8" fill="#efdfa8" opacity="0.6"/><path d="M70,396 L120,496" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M70,396 L190,406" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M60,511 L190,506" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><circle cx="70" cy="396" r="6" fill="#1e2a44"/><text x="220" y="406" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Sparse</text><text x="220" y="436" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Most of Balochistan: a</text><text x="220" y="457" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">few long roads, e.g.</text><text x="220" y="478" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Quetta–Karachi,</text><text x="220" y="499" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Quetta–Taftan, Makran</text><text x="220" y="520" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Coastal Highway</text><text x="50" y="556" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><rect x="460" y="356" width="410" height="230" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="480" y="376" width="150" height="150" rx="8" fill="#eef3e6" stroke="#c9d6d4" stroke-width="1.5" /><path d="M480,526 L480,406 L520,446 L510,496 L550,526 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><path d="M630,526 L630,386 L570,436 L585,486 L575,526 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2"/><path d="M540,381 Q550,451 560,521" fill="none" stroke="#2b5a9a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><path d="M532,381 Q540,451 550,521" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="650" y="406" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Valley-bound</text><text x="650" y="436" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Northern mountains:</text><text x="650" y="457" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">routes follow narrow</text><text x="650" y="478" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">valleys such as the Indus</text><text x="650" y="499" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and Hunza</text><text x="480" y="556" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start"></text><text x="450" y="628" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Schematic sketches, not maps. Air: airports spread widely, the only quick link to remote towns</text><text x="450" y="648" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">such as Gilgit, Skardu, Chitral and Turbat.</text>
</svg>