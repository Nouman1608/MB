<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 556" width="900" height="556" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="556" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How a dry port works</text>

<rect x="30" y="120" width="195" height="170" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><circle cx="62" cy="152" r="18" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="62" y="158.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="90" y="158" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Inland</text><text x="90" y="180" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">factory</text><text x="46" y="214" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">e.g. a Sialkot</text><text x="46" y="234" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sports-goods firm</text><line x1="227" y1="205" x2="243" y2="205" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="245" y="120" width="195" height="170" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" /><circle cx="277" cy="152" r="18" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="277" y="158.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="305" y="158" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Dry port</text><text x="261" y="214" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">customs clearance;</text><text x="261" y="234" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">goods packed into</text><text x="261" y="254" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sealed containers</text><line x1="442" y1="205" x2="458" y2="205" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="460" y="120" width="195" height="170" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><circle cx="492" cy="152" r="18" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="492" y="158.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="520" y="158" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Rail or road</text><text x="476" y="214" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sealed container</text><text x="476" y="234" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">moves to the coast</text><line x1="657" y1="205" x2="673" y2="205" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="675" y="120" width="195" height="170" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><circle cx="707" cy="152" r="18" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="707" y="158.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="735" y="158" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Seaport</text><text x="691" y="214" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">loaded straight onto</text><text x="691" y="234" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the ship</text><text x="450" y="330" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Examples: Lahore, Faisalabad, Sialkot, Multan, Peshawar, Quetta, and Sost (trade with China)</text><rect x="30" y="356" width="840" height="180" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="392" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Why build them? Industry is concentrated inland, far from Karachi.</text><circle cx="60" cy="420.39" r="5" fill="#8a6d0d"/><text x="76" y="426" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Clearing customs near the factory saves time and reduces theft</text><circle cx="60" cy="450.49" r="5" fill="#8a6d0d"/><text x="76" y="456.1" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Less congestion at the seaports</text><circle cx="60" cy="480.59000000000003" r="5" fill="#8a6d0d"/><text x="76" y="486.20000000000005" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Exporters such as Sialkot’s sports-goods firms can ship directly</text>
</svg>