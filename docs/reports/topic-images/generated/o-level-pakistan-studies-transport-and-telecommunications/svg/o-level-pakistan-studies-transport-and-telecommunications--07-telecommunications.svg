<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 828" width="900" height="828" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="828" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Telecommunications and development</text>

<rect x="30" y="112" width="410" height="90" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="235" y="152" font-size="24" font-weight="700" fill="#2e6b62" text-anchor="middle">about 193 million</text><text x="235" y="180" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">mobile subscriptions, end of 2024</text><rect x="460" y="112" width="410" height="90" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5" /><text x="665" y="152" font-size="24" font-weight="700" fill="#2e6b62" text-anchor="middle">about 142 million</text><text x="665" y="180" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">broadband subscriptions, Sept 2024</text><text x="450" y="226" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Source: Pakistan Telecommunication Authority (approximate)</text><rect x="30" y="244" width="410" height="122" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="46" y="272" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Education</text><text x="46" y="298" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">AIOU radio and TV (since 1974); Virtual</text><text x="46" y="320.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">University online (2002); TV lessons in 2020</text><rect x="460" y="244" width="410" height="122" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="476" y="272" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Industry and trade</text><text x="476" y="298" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Faisalabad and Sialkot exporters email</text><text x="476" y="320.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">buyers, share designs, track shipments</text><rect x="30" y="378" width="410" height="122" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="46" y="406" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Services</text><text x="46" y="432" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Mobile banking (Easypaisa, JazzCash),</text><text x="46" y="454.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">e-commerce, freelancing; farmers check</text><text x="46" y="476.2" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">prices</text><rect x="460" y="378" width="410" height="122" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5" /><text x="476" y="406" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Broadcasting</text><text x="476" y="432" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Radio and TV spread news, health campaigns</text><text x="476" y="454.1" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">and flood warnings</text><rect x="30" y="522" width="840" height="172" rx="14" fill="#f6e4d8" stroke="#b5602e" stroke-width="2.5"/><text x="54" y="558" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Problems in some areas</text><circle cx="60" cy="586.72" r="5" fill="#b5602e"/><text x="76" y="592" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">High cost of masts and fibre in mountains</text><text x="76" y="612.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">and deserts</text><circle cx="60" cy="634.32" r="5" fill="#b5602e"/><text x="76" y="639.6" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Scattered, low-income people: little revenue</text><circle cx="60" cy="661.12" r="5" fill="#b5602e"/><text x="76" y="666.4" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Power cuts; low literacy</text><circle cx="470" cy="586.72" r="5" fill="#b5602e"/><text x="486" y="592" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Flood and earthquake damage</text><circle cx="470" cy="613.52" r="5" fill="#b5602e"/><text x="486" y="618.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Security-related shutdowns</text><rect x="30" y="712" width="840" height="96" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="748" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">The Universal Service Fund pays operators to extend coverage to unserved areas.</text><text x="450" y="778" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Wider access to education, banking and markets, but urban–rural and male–female gaps remain.</text>
</svg>