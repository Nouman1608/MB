<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Segregated and joint conjugal roles</text>

<rect x="30" y="108" width="412" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,159 L31.25,122.25 Q31.25,109.25 44.25,109.25 L427.75,109.25 Q440.75,109.25 440.75,122.25 L440.75,159 Z" fill="#f2e7b8"/><line x1="31.25" y1="159" x2="440.75" y2="159" stroke="#c9d6d4" stroke-width="2"/><text x="236" y="139.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Segregated roles</text><line x1="196" y1="278" x2="108" y2="238" stroke="#1e2a44" stroke-width="2.5"/><line x1="196" y1="278" x2="92" y2="294" stroke="#1e2a44" stroke-width="2.5"/><line x1="196" y1="278" x2="120" y2="338" stroke="#1e2a44" stroke-width="2.5"/><line x1="276" y1="278" x2="364" y2="238" stroke="#1e2a44" stroke-width="2.5"/><line x1="276" y1="278" x2="380" y2="294" stroke="#1e2a44" stroke-width="2.5"/><line x1="276" y1="278" x2="352" y2="338" stroke="#1e2a44" stroke-width="2.5"/><line x1="108" y1="238" x2="92" y2="294" stroke="#1e2a44" stroke-width="2"/><line x1="92" y1="294" x2="120" y2="338" stroke="#1e2a44" stroke-width="2"/><line x1="108" y1="238" x2="120" y2="338" stroke="#1e2a44" stroke-width="2"/><line x1="364" y1="238" x2="380" y2="294" stroke="#1e2a44" stroke-width="2"/><line x1="380" y1="294" x2="352" y2="338" stroke="#1e2a44" stroke-width="2"/><line x1="364" y1="238" x2="352" y2="338" stroke="#1e2a44" stroke-width="2"/><line x1="196" y1="278" x2="276" y2="278" stroke="#4a5568" stroke-width="2" stroke-dasharray="5 5"/><circle cx="108" cy="238" r="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="92" cy="294" r="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="120" cy="338" r="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="364" cy="238" r="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="380" cy="294" r="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="352" cy="338" r="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="196" cy="278" r="17" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><circle cx="276" cy="278" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="236" y="393" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle" font-style="italic">close-knit network: each keeps own ties</text><circle cx="57" cy="432.39" r="4.5" fill="#2e6b62"/><text x="70" y="438" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Clearly separated: husband is</text><text x="70" y="460" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">breadwinner</tspan>, wife is <tspan font-weight="700">homemaker</tspan></text><circle cx="57" cy="484.39" r="4.5" fill="#2e6b62"/><text x="70" y="490" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Each has their own tasks</text><circle cx="57" cy="514.39" r="4.5" fill="#2e6b62"/><text x="70" y="520" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Each has their own friends and leisure</text><rect x="458" y="108" width="412" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M459.25,159 L459.25,122.25 Q459.25,109.25 472.25,109.25 L855.75,109.25 Q868.75,109.25 868.75,122.25 L868.75,159 Z" fill="#b5d3cf"/><line x1="459.25" y1="159" x2="868.75" y2="159" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="139.9" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Joint (integrated) roles</text><line x1="624" y1="278" x2="503" y2="223" stroke="#4a5568" stroke-width="1.8" stroke-dasharray="5 5"/><line x1="624" y1="278" x2="481" y2="300" stroke="#4a5568" stroke-width="1.8" stroke-dasharray="5 5"/><line x1="624" y1="278" x2="519.5" y2="360.5" stroke="#4a5568" stroke-width="1.8" stroke-dasharray="5 5"/><line x1="704" y1="278" x2="825" y2="223" stroke="#4a5568" stroke-width="1.8" stroke-dasharray="5 5"/><line x1="704" y1="278" x2="847" y2="300" stroke="#4a5568" stroke-width="1.8" stroke-dasharray="5 5"/><line x1="704" y1="278" x2="808.5" y2="360.5" stroke="#4a5568" stroke-width="1.8" stroke-dasharray="5 5"/><line x1="624" y1="278" x2="704" y2="278" stroke="#2e6b62" stroke-width="7"/><circle cx="503" cy="223" r="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="481" cy="300" r="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="519.5" cy="360.5" r="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="825" cy="223" r="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="847" cy="300" r="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="808.5" cy="360.5" r="10" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><circle cx="624" cy="278" r="17" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><circle cx="704" cy="278" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="664" y="393" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle" font-style="italic">looser network: couple rely on each other</text><circle cx="485" cy="432.39" r="4.5" fill="#2e6b62"/><text x="498" y="438" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Shared: partners do <tspan font-weight="700">similar tasks</tspan></text><circle cx="485" cy="462.39" r="4.5" fill="#2e6b62"/><text x="498" y="468" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Take <tspan font-weight="700">decisions together</tspan></text><circle cx="485" cy="492.39" r="4.5" fill="#2e6b62"/><text x="498" y="498" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Spend <tspan font-weight="700">leisure time together</tspan></text><circle cx="80" cy="612" r="11" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="98" y="618" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">husband</text><circle cx="200" cy="612" r="11" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="218" y="618" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">wife</text><circle cx="290" cy="612" r="9" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="306" y="618" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">friends and relatives</text><text x="870" y="618" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">Bott, Family and Social Network (1957)</text>
