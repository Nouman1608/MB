<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 678" width="900" height="678" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="678" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Five issues: does it look joint?</text>

<rect x="238" y="104" width="312" height="44" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="394" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Looks more joint</text><rect x="558" y="104" width="312" height="44" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="714" y="131.17000000000002" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">But…</text><rect x="30" y="156" width="200" height="74" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="198.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Decision making</text><rect x="238" y="156" width="312" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="252" y="187.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Couples make some decisions</text><text x="252" y="209.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">together</text><rect x="558" y="156" width="312" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="572" y="187.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Husbands dominate important</text><text x="572" y="209.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">decisions (Edgell)</text><rect x="30" y="238" width="200" height="74" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="280.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Money management</text><rect x="238" y="238" width="312" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="252" y="269.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Money pooled in a joint account</text><rect x="558" y="238" width="312" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="572" y="269.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Men often have more say over</text><text x="572" y="291.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">spending (Pahl)</text><rect x="30" y="320" width="200" height="118" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="373.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Dual career</text><text x="42" y="395.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">families</text><rect x="238" y="320" width="312" height="118" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="252" y="351.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Both partners pursue careers</text><text x="252" y="373.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">(Rapoports); more joint roles</text><rect x="558" y="320" width="312" height="118" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="572" y="351.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Role conflict, work life balance,</text><text x="572" y="373.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">childcare costs; women’s careers</text><text x="572" y="395.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">more often interrupted (glass</text><text x="572" y="417.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">ceiling)</text><rect x="30" y="446" width="200" height="96" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="499.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Child rearing</text><rect x="238" y="446" width="312" height="96" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="252" y="477.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Fathers spend more time with</text><text x="252" y="499.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">children</text><rect x="558" y="446" width="312" height="96" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="572" y="477.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Mothers carry routine care;</text><text x="572" y="499.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">fathers more often play and</text><text x="572" y="521.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">outings</text><rect x="30" y="550" width="200" height="96" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="42" y="603.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Leisure activities</text><rect x="238" y="550" width="312" height="96" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="252" y="581.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">More joint leisure: television,</text><text x="252" y="603.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">family meals, holidays</text><rect x="558" y="550" width="312" height="96" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="572" y="581.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Women have less free time, more</text><text x="572" y="603.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">often interrupted by domestic</text><text x="572" y="625.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">tasks</text>
</svg>