<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 744" width="900" height="744" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="744" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The power behind the chores</text>

<rect x="30" y="108" width="840" height="290" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,158 L31.25,122.25 Q31.25,109.25 44.25,109.25 L855.75,109.25 Q868.75,109.25 868.75,122.25 L868.75,158 Z" fill="#b5d3cf"/><line x1="31.25" y1="158" x2="868.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="139" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Decision making: Edgell, Middle-Class Couples (1980)</text><rect x="60" y="184" width="370" height="150" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="245" y="216" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Husbands decided</text><text x="245" y="242" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">decisions seen as very important</text><text x="245" y="276" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">moving house</text><text x="245" y="300" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">major finance</text><rect x="470" y="184" width="370" height="150" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="655" y="216" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Wives decided</text><text x="655" y="242" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">decisions seen as less important</text><text x="655" y="276" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">interior decoration, food,</text><text x="655" y="300" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">children’s clothes</text><text x="450" y="386" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Even joint decisions may involve unequal power.</text><rect x="30" y="418" width="840" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,468 L31.25,432.25 Q31.25,419.25 44.25,419.25 L855.75,419.25 Q868.75,419.25 868.75,432.25 L868.75,468 Z" fill="#f2e7b8"/><line x1="31.25" y1="468" x2="868.75" y2="468" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="449" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Money management: Pahl (1989)</text><text x="245" y="502" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Allowance system</text><circle cx="140" cy="564" r="26" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="140" y="570" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">H</text><circle cx="350" cy="564" r="26" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="350" y="570" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">W</text><line x1="172" y1="564" x2="318" y2="564" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="245" y="552" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">set sum</text><text x="245" y="622" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">One partner, usually the husband, gives</text><text x="245" y="643" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">the other a set sum for housekeeping</text><text x="655" y="502" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Pooling</text><circle cx="560" cy="544" r="22" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="560" y="550" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">H</text><circle cx="750" cy="544" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="750" y="550" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">W</text><rect x="605" y="568" width="100" height="44" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="655" y="596" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">joint a/c</text><line x1="578" y1="560" x2="610" y2="574" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="732" y1="560" x2="700" y2="574" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="655" y="644" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Even pooling did not guarantee equality:</text><text x="655" y="665" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">men often had more say over spending</text><line x1="450" y1="484" x2="450" y2="684" stroke="#c9d6d4" stroke-width="2"/>
</svg>