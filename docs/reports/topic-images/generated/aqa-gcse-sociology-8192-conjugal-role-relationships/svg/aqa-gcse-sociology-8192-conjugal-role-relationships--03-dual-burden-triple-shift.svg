<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 738" width="900" height="738" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="738" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One load, two loads, three loads</text>

<rect x="80" y="420" width="210" height="100" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="185" y="466" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Housework and</text><text x="185" y="488" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">childcare</text><text x="185" y="554" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Male breadwinner model</text><text x="185" y="578" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">wife’s load</text><rect x="345" y="420" width="210" height="100" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="466" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Housework and</text><text x="450" y="488" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">childcare</text><rect x="345" y="320" width="210" height="100" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="376" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Paid work</text><text x="450" y="554" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Dual burden</text><text x="450" y="578" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">(double shift)</text><rect x="610" y="420" width="210" height="100" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="715" y="466" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Housework and</text><text x="715" y="488" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">childcare</text><rect x="610" y="320" width="210" height="100" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="715" y="376" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Paid work</text><rect x="610" y="220" width="210" height="100" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="715" y="276" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Emotion work</text><text x="715" y="554" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Triple shift</text><text x="715" y="578" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Duncombe and Marsden</text><line x1="50" y1="520" x2="850" y2="520" stroke="#1e2a44" stroke-width="3"/><text x="80" y="150" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">Emotion work: keeping the</text><text x="80" y="171" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">peace, remembering</text><text x="80" y="192" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="start">birthdays</text><line x1="320" y1="160" x2="600" y2="200" stroke="#8a6d0d" stroke-width="2.5" marker-end="url(#ahO)"/><rect x="30" y="602" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="61" cy="632.39" r="4.5" fill="#8a6d0d"/><text x="74" y="638" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Studies repeatedly find women still do more housework and childcare, <tspan font-weight="700">even when both</tspan></text><text x="74" y="660" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">partners work full time</tspan></text><circle cx="61" cy="684.39" r="4.5" fill="#8a6d0d"/><text x="74" y="690" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Do not confuse <tspan font-weight="700">dual career</tspan> (a family type) with <tspan font-weight="700">dual burden</tspan> (a woman’s double load)</text>
</svg>