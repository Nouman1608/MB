<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 645" width="900" height="645" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="645" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who gains from women’s domestic work?</text>

<rect x="250" y="112" width="400" height="90" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="150" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Women’s unpaid</text><text x="450" y="178" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">domestic work</text><text x="450" y="236" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Agreement: it is exploited</text><line x1="290" y1="206" x2="200" y2="266" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="610" y1="206" x2="700" y2="266" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="274" width="400" height="218" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,324 L31.25,288.25 Q31.25,275.25 44.25,275.25 L415.75,275.25 Q428.75,275.25 428.75,288.25 L428.75,324 Z" fill="#f2e7b8"/><line x1="31.25" y1="324" x2="428.75" y2="324" stroke="#c9d6d4" stroke-width="2"/><text x="230" y="305" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Feminists: men gain</text><circle cx="49" cy="350.53999999999996" r="4.5" fill="#2e6b62"/><text x="62" y="356.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Roles remain unequal and benefit men</text><circle cx="49" cy="380.53999999999996" r="4.5" fill="#2e6b62"/><text x="62" y="386.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Oakley on the conventional family</text><circle cx="49" cy="410.53999999999996" r="4.5" fill="#2e6b62"/><text x="62" y="416.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Delphy and Leonard: men exploit women’s</text><text x="62" y="438.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">work</text><circle cx="49" cy="462.53999999999996" r="4.5" fill="#2e6b62"/><text x="62" y="468.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Dual burden and triple shift</text><rect x="470" y="274" width="400" height="218" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M471.25,324 L471.25,288.25 Q471.25,275.25 484.25,275.25 L855.75,275.25 Q868.75,275.25 868.75,288.25 L868.75,324 Z" fill="#b5d3cf"/><line x1="471.25" y1="324" x2="868.75" y2="324" stroke="#c9d6d4" stroke-width="2"/><text x="670" y="305" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Marxists: capitalism gains</text><circle cx="489" cy="350.53999999999996" r="4.5" fill="#2e6b62"/><text x="502" y="356.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Reproduces and maintains the workforce at</text><text x="502" y="378.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">no cost to capitalism</text><circle cx="489" cy="402.53999999999996" r="4.5" fill="#2e6b62"/><text x="502" y="408.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Men’s frustration at work may be taken out</text><text x="502" y="430.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">at home, where they have power</text><rect x="30" y="510" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="546" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Functionalists disagree</text><text x="56" y="575" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Parsons saw clear instrumental and expressive roles as functional; Willmott and Young saw a</text><text x="56" y="597" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">move towards more equal, symmetrical roles.</text>
</svg>