<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 901" width="900" height="901" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="901" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Oakley: the idea of the conventional family</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Nuclear families of legally married couples, voluntarily choosing parenthood</text>
<rect x="30" y="120" width="840" height="118" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="179" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="186.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="104" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The power of the idea</text><text x="104" y="189.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Government, media and advertising present it as normal and natural, with a husband who</text><text x="104" y="211.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">earns and a wife who cares, though many people do not live in one.</text><line x1="450" y1="242" x2="450" y2="278" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="284" width="840" height="118" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="343" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="350.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="104" y="323.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Origins and explanations</text><text x="104" y="353.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The idea has social origins: industrialisation separated paid work from the home and</text><text x="104" y="375.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">pushed married women out of the labour market, creating the housewife role.</text><line x1="450" y1="406" x2="450" y2="442" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="448" width="840" height="118" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="507" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="514.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="104" y="487.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The strains of being conventional</text><text x="104" y="517.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Women can feel isolated and undervalued as housewives; both partners feel pressure to</text><text x="104" y="539.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">perform their roles.</text><line x1="450" y1="570" x2="450" y2="606" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="612" width="840" height="96" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="67" cy="660" r="21" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="67" y="667.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="104" y="651.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Social control</text><text x="104" y="681.26" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The idea pressures people to conform and makes other ways of living seem deviant.</text><rect x="30" y="726" width="840" height="149" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="762" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Conventional families (1982)</text><circle cx="61" cy="785.39" r="4.5" fill="#8a6d0d"/><text x="74" y="791" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Predates civil partnerships and same-sex marriage</text><circle cx="61" cy="815.39" r="4.5" fill="#8a6d0d"/><text x="74" y="821" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Oakley concluded official stereotypes were coming to seem “increasingly archaic”</text><circle cx="61" cy="845.39" r="4.5" fill="#8a6d0d"/><text x="74" y="851" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Earlier, The Sociology of Housework (1974): few husbands did a large share of housework</text>
</svg>