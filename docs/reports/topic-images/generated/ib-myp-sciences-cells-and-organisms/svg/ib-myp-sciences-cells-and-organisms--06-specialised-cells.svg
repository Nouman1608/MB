<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 840" width="900" height="840" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="840" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Specialised cells: structure fits job</text>

<rect x="30" y="110" width="410" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="90" cy="180" r="38" fill="#d9776a" stroke="#1e2a44" stroke-width="2.5"/><circle cx="90" cy="180" r="17" fill="#eaa79c"/><path d="M55,245 q0,-14 18,-14 q17,0 17,7 q0,-7 17,-7 q18,0 18,14 q0,14 -18,14 q-17,0 -17,-7 q0,7 -17,7 q-18,0 -18,-14 Z" fill="#d9776a" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="150" y="222" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">side</text><text x="190" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Red blood cell</text><text x="190" y="176" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">No nucleus: more room for</text><text x="190" y="198" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">haemoglobin. Biconcave disc:</text><text x="190" y="220" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">large surface area for oxygen</text><text x="190" y="242" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">to diffuse in and out.</text><rect x="460" y="110" width="410" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="492" cy="194" r="16" fill="#c9b6dd" stroke="#1e2a44" stroke-width="2.5"/><path d="M480,182 l-8,-14 M482,208 l-10,14 M492,178 l2,-16" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M508,194 L585,194" fill="none" stroke="#1e2a44" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><path d="M585,194 l14,-16 M585,194 l18,0 M585,194 l14,16" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="548" y="220" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">axon</text><text x="620" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Nerve cell (neurone)</text><text x="620" y="176" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Long axon: carries electrical</text><text x="620" y="198" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">impulses over long distances.</text><text x="620" y="220" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Branched endings: connect</text><text x="620" y="242" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">with many other cells.</text><rect x="30" y="292" width="410" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><ellipse cx="70" cy="376" rx="24" ry="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><rect x="93" y="370" width="28" height="12" rx="4" fill="#e8b48f" stroke="#1e2a44" stroke-width="2"/><path d="M121,376 q10,-12 20,0 q10,12 20,0 q8,-10 14,0" fill="none" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="70" y="417" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">head</text><text x="148" y="417" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">tail</text><text x="190" y="328" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Sperm cell</text><text x="190" y="358" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Tail: swims to the egg. Many</text><text x="190" y="380" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">mitochondria: release energy</text><text x="190" y="402" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">for swimming. Enzymes in the</text><text x="190" y="424" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">head: digest a way into the egg.</text><rect x="460" y="292" width="410" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="495" y="352" width="80" height="85" rx="6" fill="#fbf6e2" stroke="#1e2a44" stroke-width="2.5"/><circle cx="535" cy="404" r="13" fill="#c9b6dd" stroke="#1e2a44" stroke-width="2.5"/><circle cx="540" cy="400" r="3.9" fill="#9a84b8"/><path d="M500,352 q5,-12 0,-24" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M510,352 q5,-12 0,-24" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M520,352 q5,-12 0,-24" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M530,352 q5,-12 0,-24" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M540,352 q5,-12 0,-24" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M550,352 q5,-12 0,-24" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M560,352 q5,-12 0,-24" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M570,352 q5,-12 0,-24" fill="none" stroke="#1e2a44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><line x1="500" y1="318" x2="580" y2="318" stroke="#2e6b62" stroke-width="2.5" marker-end="url(#ahT)"/><text x="620" y="328" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Ciliated cell (airways)</text><text x="620" y="358" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Tiny hairs called cilia sweep</text><text x="620" y="380" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">mucus and trapped dust away</text><text x="620" y="402" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">from the lungs.</text><rect x="30" y="474" width="410" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M55,574 L55,619 L115,619 L115,574 L160,574 L160,560 L100,560 L100,574 Z" fill="#fbf6e2" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><circle cx="75" cy="599" r="10" fill="#c9b6dd" stroke="#1e2a44" stroke-width="2.5"/><circle cx="80" cy="595" r="3" fill="#9a84b8"/><text x="135" y="550" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">root hair</text><text x="190" y="510" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Root hair cell</text><text x="190" y="540" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Long, thin extension: large</text><text x="190" y="562" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">surface area to absorb water</text><text x="190" y="584" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">and mineral ions. No</text><text x="190" y="606" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">chloroplasts: underground.</text><rect x="460" y="474" width="410" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="510" y="496" width="62" height="128" rx="8" fill="#fbf6e2" stroke="#1e2a44" stroke-width="2.5"/><g transform="translate(522,512) rotate(0) scale(0.55)"><ellipse cx="0" cy="0" rx="18" ry="10" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><line x1="-10" y1="-3" x2="10" y2="-3" stroke="#d8e3c6" stroke-width="1.6"/><line x1="-10" y1="3" x2="10" y2="3" stroke="#d8e3c6" stroke-width="1.6"/></g><g transform="translate(558,516) rotate(0) scale(0.55)"><ellipse cx="0" cy="0" rx="18" ry="10" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><line x1="-10" y1="-3" x2="10" y2="-3" stroke="#d8e3c6" stroke-width="1.6"/><line x1="-10" y1="3" x2="10" y2="3" stroke="#d8e3c6" stroke-width="1.6"/></g><g transform="translate(522,542) rotate(0) scale(0.55)"><ellipse cx="0" cy="0" rx="18" ry="10" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><line x1="-10" y1="-3" x2="10" y2="-3" stroke="#d8e3c6" stroke-width="1.6"/><line x1="-10" y1="3" x2="10" y2="3" stroke="#d8e3c6" stroke-width="1.6"/></g><g transform="translate(558,548) rotate(0) scale(0.55)"><ellipse cx="0" cy="0" rx="18" ry="10" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><line x1="-10" y1="-3" x2="10" y2="-3" stroke="#d8e3c6" stroke-width="1.6"/><line x1="-10" y1="3" x2="10" y2="3" stroke="#d8e3c6" stroke-width="1.6"/></g><g transform="translate(522,574) rotate(0) scale(0.55)"><ellipse cx="0" cy="0" rx="18" ry="10" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><line x1="-10" y1="-3" x2="10" y2="-3" stroke="#d8e3c6" stroke-width="1.6"/><line x1="-10" y1="3" x2="10" y2="3" stroke="#d8e3c6" stroke-width="1.6"/></g><g transform="translate(558,578) rotate(0) scale(0.55)"><ellipse cx="0" cy="0" rx="18" ry="10" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><line x1="-10" y1="-3" x2="10" y2="-3" stroke="#d8e3c6" stroke-width="1.6"/><line x1="-10" y1="3" x2="10" y2="3" stroke="#d8e3c6" stroke-width="1.6"/></g><g transform="translate(522,606) rotate(0) scale(0.55)"><ellipse cx="0" cy="0" rx="18" ry="10" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><line x1="-10" y1="-3" x2="10" y2="-3" stroke="#d8e3c6" stroke-width="1.6"/><line x1="-10" y1="3" x2="10" y2="3" stroke="#d8e3c6" stroke-width="1.6"/></g><g transform="translate(558,608) rotate(0) scale(0.55)"><ellipse cx="0" cy="0" rx="18" ry="10" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><line x1="-10" y1="-3" x2="10" y2="-3" stroke="#d8e3c6" stroke-width="1.6"/><line x1="-10" y1="3" x2="10" y2="3" stroke="#d8e3c6" stroke-width="1.6"/></g><g transform="translate(540,530) rotate(0) scale(0.55)"><ellipse cx="0" cy="0" rx="18" ry="10" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><line x1="-10" y1="-3" x2="10" y2="-3" stroke="#d8e3c6" stroke-width="1.6"/><line x1="-10" y1="3" x2="10" y2="3" stroke="#d8e3c6" stroke-width="1.6"/></g><g transform="translate(540,592) rotate(0) scale(0.55)"><ellipse cx="0" cy="0" rx="18" ry="10" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><line x1="-10" y1="-3" x2="10" y2="-3" stroke="#d8e3c6" stroke-width="1.6"/><line x1="-10" y1="3" x2="10" y2="3" stroke="#d8e3c6" stroke-width="1.6"/></g><text x="620" y="510" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Palisade cell (leaf)</text><text x="620" y="540" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Many chloroplasts, near the</text><text x="620" y="562" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">upper surface: absorbs as</text><text x="620" y="584" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">much light as possible for</text><text x="620" y="606" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">photosynthesis.</text><rect x="30" y="656" width="410" height="168" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M110,696 C60,701 60,781 110,786 C92,766 92,716 110,696 Z" fill="#a9c48f" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M110,696 C160,701 160,781 110,786 C128,766 128,716 110,696 Z" fill="#a9c48f" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><text x="110" y="811" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">stoma</text><text x="190" y="692" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Guard cells (leaf)</text><text x="190" y="722" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A pair of cells around a pore</text><text x="190" y="744" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">(stoma). They change shape</text><text x="190" y="766" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">to open and close it, controlling</text><text x="190" y="788" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">gas exchange and water loss.</text><rect x="460" y="656" width="410" height="168" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="484" y="694" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Answer pattern</text><rect x="484" y="716" width="104" height="44" rx="10" fill="#fff" stroke="#8a6d0d" stroke-width="2"/><text x="536" y="744" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">feature</text><line x1="590" y1="738" x2="610" y2="738" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="613" y="716" width="104" height="44" rx="10" fill="#fff" stroke="#8a6d0d" stroke-width="2"/><text x="665" y="744" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">effect</text><line x1="719" y1="738" x2="739" y2="738" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="742" y="716" width="104" height="44" rx="10" fill="#fff" stroke="#8a6d0d" stroke-width="2"/><text x="794" y="744" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">function</text><text x="484" y="796" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Never give a feature without how it helps.</text>
</svg>