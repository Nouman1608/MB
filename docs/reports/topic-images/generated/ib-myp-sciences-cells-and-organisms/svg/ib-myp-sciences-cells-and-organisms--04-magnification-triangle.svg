<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="560" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The magnification equation</text>

<rect x="30" y="110" width="360" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M210,150 L350,410 L70,410 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><line x1="132" y1="290" x2="288" y2="290" stroke="#1e2a44" stroke-width="3"/><line x1="210" y1="290" x2="210" y2="410" stroke="#1e2a44" stroke-width="3"/><text x="210" y="245" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">image</text><text x="210" y="267" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">size</text><text x="148" y="350" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">actual</text><text x="148" y="372" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">size</text><text x="272" y="350" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">magni-</text><text x="272" y="372" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">fication</text><text x="210" y="455" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Cover the one you want:</text><text x="95" y="480" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">M = I ÷ A</text><text x="210" y="480" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">A = I ÷ M</text><text x="325" y="480" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">I = A × M</text><text x="210" y="510" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">Same unit for I and A first!</text><rect x="410" y="110" width="460" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="435" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Cheek cell: find the magnification</text><text x="435" y="178" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">actual size = 60 µm</text><text x="435" y="201" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">image (drawing) = 30 mm</text><circle cx="452" cy="266" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="452" y="272.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="480" y="240" width="370" height="58" rx="12" fill="#dce9e7"/><text x="495" y="265" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Convert the image to µm:</text><text x="495" y="288" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">30 mm × 1000 = 30 000 µm</text><circle cx="452" cy="341" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="452" y="347.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="480" y="315" width="370" height="58" rx="12" fill="#dce9e7"/><text x="495" y="340" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Divide image by actual:</text><text x="495" y="363" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">30 000 ÷ 60 = 500</text><circle cx="452" cy="416" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="452" y="422.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="480" y="390" width="370" height="58" rx="12" fill="#f2e7b8"/><text x="495" y="415" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Write it with a × and no unit:</text><text x="495" y="438" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">×500</text><text x="640" y="500" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">not “500 µm”</text>
</svg>