<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="500" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Using a scale bar</text>

<rect x="30" y="110" width="840" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="60" y="140" width="460" height="300" rx="8" fill="#e9eee4" stroke="#1e2a44" stroke-width="2.5"/><rect x="140" y="190" width="210" height="110" rx="6" fill="#a9c48f" stroke="#1e2a44" stroke-width="3"/><rect x="150" y="200" width="190" height="90" rx="4" fill="#fbf6e2" stroke="#1e2a44" stroke-width="1.5"/><rect x="185" y="215" width="130" height="60" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><g transform="translate(165,245) rotate(90) scale(0.7)"><ellipse cx="0" cy="0" rx="18" ry="10" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><line x1="-10" y1="-3" x2="10" y2="-3" stroke="#d8e3c6" stroke-width="1.6"/><line x1="-10" y1="3" x2="10" y2="3" stroke="#d8e3c6" stroke-width="1.6"/></g><g transform="translate(330,245) rotate(90) scale(0.7)"><ellipse cx="0" cy="0" rx="18" ry="10" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><line x1="-10" y1="-3" x2="10" y2="-3" stroke="#d8e3c6" stroke-width="1.6"/><line x1="-10" y1="3" x2="10" y2="3" stroke="#d8e3c6" stroke-width="1.6"/></g><circle cx="170" cy="215" r="10" fill="#c9b6dd" stroke="#1e2a44" stroke-width="2.5"/><circle cx="175" cy="211" r="3" fill="#9a84b8"/><line x1="140" y1="330" x2="350" y2="330" stroke="#b5602e" stroke-width="2.5" marker-start="url(#ahR)" marker-end="url(#ahR)"/><text x="245" y="356" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">measures 42 mm</text><rect x="370" y="400" width="125" height="10" fill="#1e2a44"/><text x="432" y="392" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">50 µm</text><text x="432" y="432" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">bar measures 25 mm</text><text x="545" y="160" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">(a) Magnification</text><text x="545" y="192" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">bar image = 25 mm = 25 000 µm</text><text x="545" y="217" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">M = 25 000 ÷ 50 = ×500</text><text x="545" y="275" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">(b) Actual length of cell</text><text x="545" y="307" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">cell image = 42 mm = 42 000 µm</text><text x="545" y="332" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A = 42 000 ÷ 500 = 84 µm</text><rect x="545" y="372" width="300" height="74" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="560" y="402" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">A scale bar stays correct if the</text><text x="560" y="424" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">picture is resized; “×500” does not.</text>
</svg>