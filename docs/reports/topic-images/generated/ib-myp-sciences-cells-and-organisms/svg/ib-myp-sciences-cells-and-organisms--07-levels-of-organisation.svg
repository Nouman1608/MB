<rect width="900" height="760" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Levels of organisation</text>

<rect x="30" y="110" width="840" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><ellipse cx="120" cy="166" rx="60" ry="16" fill="#e7a99c" stroke="#1e2a44" stroke-width="2.5"/><ellipse cx="120" cy="166" rx="9" ry="6" fill="#9a84b8"/><text x="220" y="156" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Cell</text><text x="220" y="186" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the basic unit</text><text x="850" y="174" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="end">a muscle cell</text><rect x="30" y="234" width="840" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><ellipse cx="88" cy="264" rx="32" ry="11" fill="#e7a99c" stroke="#1e2a44" stroke-width="2"/><ellipse cx="152" cy="264" rx="32" ry="11" fill="#e7a99c" stroke="#1e2a44" stroke-width="2"/><ellipse cx="106" cy="290" rx="32" ry="11" fill="#e7a99c" stroke="#1e2a44" stroke-width="2"/><ellipse cx="170" cy="290" rx="32" ry="11" fill="#e7a99c" stroke="#1e2a44" stroke-width="2"/><ellipse cx="88" cy="316" rx="32" ry="11" fill="#e7a99c" stroke="#1e2a44" stroke-width="2"/><ellipse cx="152" cy="316" rx="32" ry="11" fill="#e7a99c" stroke="#1e2a44" stroke-width="2"/><text x="220" y="280" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Tissue</text><text x="220" y="310" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">similar cells working together</text><text x="850" y="298" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="end">muscle tissue</text><rect x="30" y="358" width="840" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><path d="M80,374 C80,404 70,434 110,452 C150,464 180,434 170,404 C162,380 130,376 100,374 Z" fill="#e7a99c" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M80,374 L80,362" fill="none" stroke="#1e2a44" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" /><text x="220" y="404" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Organ</text><text x="220" y="434" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">different tissues doing a job</text><text x="850" y="422" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="end"></text><text x="850" y="408" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="end">stomach:</text><text x="850" y="432" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="end">muscle, glandular, lining tissues</text><rect x="30" y="482" width="840" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M100,488 L100,513" fill="none" stroke="#1e2a44" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><path d="M100,513 q30,-6 34,14 q0,18 -30,16 z" fill="#e7a99c" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M70,508 q30,-10 26,12 q-14,8 -26,-12 z" fill="#9c5b3a" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M102,543 q-30,4 -20,18 q20,10 40,0 q18,-10 -6,-16 q-30,-2 -24,14 q12,16 44,10" fill="none" stroke="#d0806e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><text x="220" y="528" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Organ system</text><text x="220" y="558" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">organs working together</text><text x="850" y="546" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="end"></text><text x="850" y="532" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="end">digestive system:</text><text x="850" y="556" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="end">stomach, intestines, liver, pancreas</text><rect x="30" y="606" width="840" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="120" cy="628" r="13" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><path d="M120,641 L120,680 M94,654 L146,654 M120,680 L104,708 M120,680 L136,708" fill="none" stroke="#1e2a44" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="220" y="652" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Organism</text><text x="220" y="682" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">a whole living thing</text><text x="850" y="670" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="end">a human</text><circle cx="450" cy="228" r="15" fill="#1e2a44"/><path d="M443,224 L450,232 L457,224" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><circle cx="450" cy="352" r="15" fill="#1e2a44"/><path d="M443,348 L450,356 L457,348" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><circle cx="450" cy="476" r="15" fill="#1e2a44"/><path d="M443,472 L450,480 L457,472" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><circle cx="450" cy="600" r="15" fill="#1e2a44"/><path d="M443,596 L450,604 L457,596" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="450" y="748" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Plants too: a leaf is an organ. Single-celled organisms have no tissues or organs.</text>
</svg>