<rect width="900" height="700" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Units for tiny things</text>

<rect x="30" y="110" width="840" height="180" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="80" y="160" width="140" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="150" y="212" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">mm</text><rect x="380" y="160" width="140" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="212" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">µm</text><rect x="680" y="160" width="140" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="750" y="212" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">nm</text><line x1="225" y1="185" x2="375" y2="185" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><text x="300" y="175" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">× 1000</text><line x1="525" y1="185" x2="675" y2="185" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><text x="600" y="175" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">× 1000</text><line x1="375" y1="220" x2="225" y2="220" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><text x="300" y="248" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">÷ 1000</text><line x1="675" y1="220" x2="525" y2="220" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><text x="600" y="248" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">÷ 1000</text><text x="450" y="278" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">smaller unit → bigger number</text><rect x="30" y="310" width="840" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="350" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Sizes on a ×10 scale (each step is ten times bigger)</text><line x1="70" y1="530" x2="830" y2="530" stroke="#1e2a44" stroke-width="3"/><line x1="90" y1="522" x2="90" y2="538" stroke="#1e2a44" stroke-width="2.5"/><text x="90" y="562" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">1 nm</text><line x1="210" y1="522" x2="210" y2="538" stroke="#1e2a44" stroke-width="2.5"/><text x="210" y="562" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">10 nm</text><line x1="330" y1="522" x2="330" y2="538" stroke="#1e2a44" stroke-width="2.5"/><text x="330" y="562" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">100 nm</text><line x1="450" y1="522" x2="450" y2="538" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="562" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">1 µm</text><line x1="570" y1="522" x2="570" y2="538" stroke="#1e2a44" stroke-width="2.5"/><text x="570" y="562" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">10 µm</text><line x1="690" y1="522" x2="690" y2="538" stroke="#1e2a44" stroke-width="2.5"/><text x="690" y="562" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">100 µm</text><line x1="810" y1="522" x2="810" y2="538" stroke="#1e2a44" stroke-width="2.5"/><text x="810" y="562" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">1 mm</text><line x1="84.00000000000003" y1="520" x2="84.00000000000003" y2="438" stroke="#4a5568" stroke-width="1.8"/><rect x="78.00000000000004" y="521" width="11.999999999999957" height="18" rx="9" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="66" y="430" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">electron microscope</text><text x="66" y="410" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">resolution under 1 nm</text><line x1="366.32359947967774" y1="520" x2="366.32359947967774" y2="478" stroke="#4a5568" stroke-width="1.8"/><rect x="361.32359947967774" y="521" width="10" height="18" rx="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="320" y="470" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">light microscope</text><text x="320" y="450" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">resolution about 200 nm</text><line x1="491.9382002601611" y1="540" x2="491.9382002601611" y2="580" stroke="#4a5568" stroke-width="1.8"/><rect x="450" y="521" width="83.87640052032225" height="18" rx="9" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="491.9382002601611" y="600" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">bacterium 1–5 µm</text><line x1="450.2" y1="520" x2="450.2" y2="418" stroke="#4a5568" stroke-width="1.8"/><rect x="445.2" y="521" width="10" height="18" rx="9" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><text x="450.2" y="410" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">mitochondrion</text><text x="450.2" y="390" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">about 1 µm</text><line x1="598.6272752831798" y1="520" x2="598.6272752831798" y2="478" stroke="#4a5568" stroke-width="1.8"/><rect x="570" y="521" width="57.25455056635951" height="18" rx="9" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="598.6272752831798" y="470" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">animal cell</text><text x="598.6272752831798" y="450" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">10–30 µm</text><text x="450" y="650" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Anything smaller than the resolution limit cannot be seen as separate detail.</text>
