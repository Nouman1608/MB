<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="700" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Units for tiny things</text>

<rect x="30" y="110" width="840" height="180" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="80" y="160" width="140" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="150" y="212" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">mm</text><rect x="380" y="160" width="140" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="212" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">µm</text><rect x="680" y="160" width="140" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="750" y="212" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">nm</text><line x1="225" y1="185" x2="375" y2="185" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><text x="300" y="175" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">× 1000</text><line x1="525" y1="185" x2="675" y2="185" stroke="#2e6b62" stroke-width="3.5" marker-end="url(#ahT)"/><text x="600" y="175" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">× 1000</text><line x1="375" y1="220" x2="225" y2="220" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><text x="300" y="248" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">÷ 1000</text><line x1="675" y1="220" x2="525" y2="220" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><text x="600" y="248" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">÷ 1000</text><text x="450" y="278" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">smaller unit → bigger number</text><rect x="30" y="310" width="840" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="350" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Sizes on a ×10 scale (each step is ten times bigger)</text><line x1="70" y1="520" x2="830" y2="520" stroke="#1e2a44" stroke-width="3"/><line x1="90" y1="512" x2="90" y2="528" stroke="#1e2a44" stroke-width="2.5"/><text x="90" y="552" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">1 nm</text><line x1="210" y1="512" x2="210" y2="528" stroke="#1e2a44" stroke-width="2.5"/><text x="210" y="552" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">10 nm</text><line x1="330" y1="512" x2="330" y2="528" stroke="#1e2a44" stroke-width="2.5"/><text x="330" y="552" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">100 nm</text><line x1="450" y1="512" x2="450" y2="528" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="552" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">1 µm</text><line x1="570" y1="512" x2="570" y2="528" stroke="#1e2a44" stroke-width="2.5"/><text x="570" y="552" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">10 µm</text><line x1="690" y1="512" x2="690" y2="528" stroke="#1e2a44" stroke-width="2.5"/><text x="690" y="552" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">100 µm</text><line x1="810" y1="512" x2="810" y2="528" stroke="#1e2a44" stroke-width="2.5"/><text x="810" y="552" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">1 mm</text><rect x="71.99999999999996" y="470" width="18.000000000000043" height="16" rx="8" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="80.99999999999997" y="458" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">electron microscope</text><text x="80.99999999999997" y="438" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">resolution under 1 nm</text><rect x="360.12359947967775" y="470" width="12" height="16" rx="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="366.12359947967775" y="458" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">light microscope</text><text x="366.12359947967775" y="438" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">resolution about 200 nm</text><rect x="444" y="405" width="12" height="16" rx="8" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><text x="450" y="393" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">mitochondrion</text><text x="450" y="373" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">about 1 µm</text><rect x="450" y="590" width="83.87640052032225" height="16" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="491.9382002601611" y="578" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">bacterium 1–5 µm</text><rect x="570" y="470" width="57.25455056635951" height="16" rx="8" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="598.6272752831798" y="458" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">animal cell</text><text x="598.6272752831798" y="438" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">10–30 µm</text><text x="450" y="650" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Anything smaller than the resolution limit cannot be seen as separate detail.</text>
</svg>