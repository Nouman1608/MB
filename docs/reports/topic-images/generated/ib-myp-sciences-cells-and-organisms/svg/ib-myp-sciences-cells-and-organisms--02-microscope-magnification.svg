<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The light microscope</text>

<rect x="30" y="110" width="430" height="680" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="90" y="720" width="250" height="38" rx="10" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3"/><path d="M300,720 L300,470 Q300,300 240,280" fill="none" stroke="#1e2a44" stroke-width="26" stroke-linejoin="round" stroke-linecap="round" /><path d="M300,720 L300,470 Q300,300 240,280" fill="none" stroke="#cbbf9f" stroke-width="19" stroke-linejoin="round" stroke-linecap="round" /><rect x="185" y="215" width="50" height="205" fill="#fff" stroke="#1e2a44" stroke-width="3"/><rect x="192" y="160" width="36" height="55" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><path d="M160,420 L260,420 L250,445 L170,445 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3"/><rect x="200" y="445" width="20" height="55" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><path d="M175,445 L163,485 L177,489 L188,447 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><path d="M245,445 L257,485 L243,489 L232,447 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><rect x="110" y="530" width="210" height="18" fill="#1e2a44"/><rect x="160" y="520" width="100" height="10" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><circle cx="300" cy="450" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><circle cx="210" cy="660" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><line x1="210" y1="640" x2="210" y2="550" stroke="#d4b02e" stroke-width="3" stroke-dasharray="6 5"/><rect x="185" y="680" width="50" height="40" fill="#cbbf9f" stroke="#1e2a44" stroke-width="2.5"/><line x1="260" y1="150" x2="228" y2="185" stroke="#1e2a44" stroke-width="1.8"/><circle cx="228" cy="185" r="3.5" fill="#1e2a44"/><text x="266" y="155" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">eyepiece lens ×10</text><line x1="130" y1="485" x2="205" y2="485" stroke="#1e2a44" stroke-width="1.8"/><circle cx="205" cy="485" r="3.5" fill="#1e2a44"/><text x="124" y="490" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">objective</text><text x="124" y="506" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">lens ×40</text><line x1="130" y1="590" x2="175" y2="525" stroke="#1e2a44" stroke-width="1.8"/><circle cx="175" cy="525" r="3.5" fill="#1e2a44"/><text x="124" y="595" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">slide on</text><text x="124" y="611" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">the stage</text><line x1="130" y1="660" x2="190" y2="660" stroke="#1e2a44" stroke-width="1.8"/><circle cx="190" cy="660" r="3.5" fill="#1e2a44"/><text x="124" y="665" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">light source</text><line x1="340" y1="400" x2="306" y2="440" stroke="#1e2a44" stroke-width="1.8"/><circle cx="306" cy="440" r="3.5" fill="#1e2a44"/><text x="346" y="405" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">focusing</text><text x="346" y="421" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">knob</text><rect x="480" y="110" width="390" height="300" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="675" y="150" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Total magnification</text><text x="675" y="192" font-size="18" font-weight="400" fill="#4a5568" text-anchor="middle">eyepiece × objective</text><text x="675" y="260" font-size="34" font-weight="700" fill="#1e2a44" text-anchor="middle">×10 × ×40</text><text x="675" y="330" font-size="40" font-weight="700" fill="#8a6d0d" text-anchor="middle">= ×400</text><text x="675" y="380" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">A light microscope: up to about ×1500</text><rect x="480" y="430" width="390" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="675" y="470" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Magnification ≠ resolution</text><text x="505" y="502" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Resolution: seeing two close</text><text x="505" y="524" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">points as separate.</text><circle cx="580" cy="620" r="70" fill="#fff" stroke="#1e2a44" stroke-width="2.5"/><ellipse cx="580" cy="620" rx="58" ry="34" fill="#b5d3cf" opacity="0.55"/><ellipse cx="580" cy="620" rx="38" ry="22" fill="#2e6b62" opacity="0.45"/><text x="580" y="718" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">low resolution:</text><text x="580" y="738" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">one blur</text><circle cx="770" cy="620" r="70" fill="#fff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="745" cy="620" r="13" fill="#2e6b62"/><circle cx="795" cy="620" r="13" fill="#2e6b62"/><text x="770" y="718" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">high resolution:</text><text x="770" y="738" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">two points</text><text x="675" y="772" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">Enlarging a blur adds no detail.</text>
</svg>