<rect width="900" height="640" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Phases of the Moon</text>

<rect x="30" y="110" width="660" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="450" cy="330" r="30" fill="#a9c48f" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="336" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">Earth</text><circle cx="450" cy="330" r="150" fill="none" stroke="#4a5568" stroke-width="2" stroke-dasharray="6 6"/><line x1="70" y1="200" x2="160" y2="200" stroke="#d4b02e" stroke-width="3" marker-end="url(#ahO)"/><line x1="70" y1="250" x2="160" y2="250" stroke="#d4b02e" stroke-width="3" marker-end="url(#ahO)"/><line x1="70" y1="300" x2="160" y2="300" stroke="#d4b02e" stroke-width="3" marker-end="url(#ahO)"/><line x1="70" y1="350" x2="160" y2="350" stroke="#d4b02e" stroke-width="3" marker-end="url(#ahO)"/><text x="70" y="180" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">sunlight</text><circle cx="300" cy="330" r="22" fill="#4a5568" stroke="#1e2a44" stroke-width="2"/><path d="M300.0,352.0 A22,22 0 0 1 300.0,308.0 Z" fill="#fff6c8"/><circle cx="300" cy="330" r="22" fill="none" stroke="#1e2a44" stroke-width="2"/><text paint-order="stroke" stroke="#ffffff" stroke-width="6" x="290" y="380" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">new Moon</text><circle cx="450" cy="180" r="22" fill="#4a5568" stroke="#1e2a44" stroke-width="2"/><path d="M450.0,202.0 A22,22 0 0 1 450.0,158.0 Z" fill="#fff6c8"/><circle cx="450" cy="180" r="22" fill="none" stroke="#1e2a44" stroke-width="2"/><text paint-order="stroke" stroke="#ffffff" stroke-width="6" x="450" y="140" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">first quarter</text><circle cx="600" cy="330" r="22" fill="#4a5568" stroke="#1e2a44" stroke-width="2"/><path d="M600.0,352.0 A22,22 0 0 1 600.0,308.0 Z" fill="#fff6c8"/><circle cx="600" cy="330" r="22" fill="none" stroke="#1e2a44" stroke-width="2"/><text paint-order="stroke" stroke="#ffffff" stroke-width="6" x="600" y="380" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">full Moon</text><circle cx="450" cy="480" r="22" fill="#4a5568" stroke="#1e2a44" stroke-width="2"/><path d="M450.0,502.0 A22,22 0 0 1 450.0,458.0 Z" fill="#fff6c8"/><circle cx="450" cy="480" r="22" fill="none" stroke="#1e2a44" stroke-width="2"/><text paint-order="stroke" stroke="#ffffff" stroke-width="6" x="450" y="530" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">half the disc</text><path d="M351.7,216.3 L332.2,225.0 L342.7,235.6 Z" fill="#1e2a44"/><path d="M561.7,229.4 L552.6,210.0 L542.1,220.8 Z" fill="#1e2a44"/><path d="M547.3,444.6 L566.9,436.0 L556.5,425.3 Z" fill="#1e2a44"/><path d="M337.5,429.7 L346.4,449.1 L357.0,438.4 Z" fill="#1e2a44"/><rect x="700" y="110" width="170" height="470" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="780" y="160" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">seen from Earth</text><circle cx="780" cy="210" r="26" fill="#4a5568" stroke="#1e2a44" stroke-width="2"/><text x="780" y="260" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">new</text><circle cx="780" cy="300" r="26" fill="#4a5568" stroke="#1e2a44" stroke-width="2"/><path d="M780,274 A26,26 0 0 1 780,326 Z" fill="#fff6c8"/><circle cx="780" cy="300" r="26" fill="none" stroke="#1e2a44" stroke-width="2"/><text x="780" y="350" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">half (increasing)</text><circle cx="780" cy="390" r="26" fill="#fff6c8" stroke="#1e2a44" stroke-width="2"/><text x="780" y="440" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">full</text><circle cx="780" cy="480" r="26" fill="#4a5568" stroke="#1e2a44" stroke-width="2"/><path d="M780,454 A26,26 0 0 0 780,506 Z" fill="#fff6c8"/><circle cx="780" cy="480" r="26" fill="none" stroke="#1e2a44" stroke-width="2"/><text x="780" y="530" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">half (decreasing)</text><rect x="30" y="590" width="840" height="40" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="615.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">One half of the Moon is always lit; we see different amounts of it over about one month.</text>
</svg>