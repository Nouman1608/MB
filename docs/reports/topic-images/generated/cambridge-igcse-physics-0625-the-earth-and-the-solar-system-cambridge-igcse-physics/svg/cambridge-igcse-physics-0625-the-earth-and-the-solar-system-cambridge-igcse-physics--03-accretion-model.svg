"600" fill="#1e2a44" text-anchor="start">Near the Sun it was hot: light gases could not stay, so small rocky planets formed.</text><text x="48" y="559.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">Further out it was cold: gases and ices were plentiful, large cores attracted</text><text x="48" y="587.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">huge amounts of gas and became gas giants.</text>
