<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="900" height="630" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="630" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three motions, three cycles</text>

<rect x="30" y="110" width="840" height="350" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="450" cy="300" r="50" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="306" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Sun</text><ellipse cx="450" cy="300" rx="320" ry="80" fill="none" stroke="#4a5568" stroke-width="2" stroke-dasharray="7 6"/><circle cx="130" cy="300" r="52" fill="#4a5568" stroke="#1e2a44" stroke-width="2"/><path d="M130.0,248.0 A52,52 0 0 1 130.0,352.0 Z" fill="#fff6c8"/><circle cx="130" cy="300" r="52" fill="none" stroke="#1e2a44" stroke-width="2"/><line x1="159.30483463669552" y1="369.037864008933" x2="100.69516536330447" y2="230.962135991067" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><path d="M97.6,223.6 L98.3,240.7 L109.3,236.0 Z" fill="#1e2a44"/><text x="92.7415097208581" y="222.3596117238048" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">N</text><circle cx="770" cy="300" r="52" fill="#4a5568" stroke="#1e2a44" stroke-width="2"/><path d="M770.0,352.0 A52,52 0 0 1 770.0,248.0 Z" fill="#fff6c8"/><circle cx="770" cy="300" r="52" fill="none" stroke="#1e2a44" stroke-width="2"/><line x1="799.3048346366955" y1="369.037864008933" x2="740.6951653633045" y2="230.962135991067" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><path d="M737.6,223.6 L738.3,240.7 L749.3,236.0 Z" fill="#1e2a44"/><text x="732.7415097208581" y="222.3596117238048" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="end">N</text><text x="130" y="410" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">north tilted away:</text><text x="130" y="432" font-size="16" font-weight="700" fill="#2b5a9a" text-anchor="middle">northern winter</text><text x="770" y="410" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">north tilted towards:</text><text x="770" y="432" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">northern summer</text><text x="450" y="200" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">axis keeps pointing the same way in space</text><rect x="30" y="480" width="840" height="38" rx="8" fill="#f2e7b8"/><text x="45" y="505" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Earth rotates on its axis</text><text x="345" y="505" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">about 24 hours</text><text x="490" y="505" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">day and night; Sun rises east, sets west</text><rect x="30" y="524" width="840" height="38" rx="8" fill="#dce9e7"/><text x="45" y="549" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Earth orbits the Sun (axis tilted)</text><text x="345" y="549" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">about 365 days</text><text x="490" y="549" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the seasons</text><rect x="30" y="568" width="840" height="38" rx="8" fill="#f2e7b8"/><text x="45" y="593" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Moon orbits the Earth</text><text x="345" y="593" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">about one month</text><text x="490" y="593" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">phases of the Moon</text>
</svg>