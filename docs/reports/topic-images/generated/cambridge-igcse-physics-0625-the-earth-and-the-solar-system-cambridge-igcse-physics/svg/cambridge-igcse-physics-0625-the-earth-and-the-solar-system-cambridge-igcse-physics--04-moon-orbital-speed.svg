<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="600" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Average orbital speed: v = 2πr / T</text>

<rect x="30" y="72" width="148.8" height="30" rx="15" fill="#8a6d0d"/><text x="42" y="93" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">Extended only</text><rect x="30" y="110" width="400" height="450" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="230" cy="330" r="26" fill="#a9c48f" stroke="#1e2a44" stroke-width="2.5"/><text x="230" y="378" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Earth</text><circle cx="230" cy="330" r="160" fill="none" stroke="#4a5568" stroke-width="2.5"/><circle cx="352.37474996551816" cy="226.92517004196944" r="14" fill="#d9dee3" stroke="#1e2a44" stroke-width="2"/><line x1="230" y1="330" x2="70" y2="330" stroke="#1e2a44" stroke-width="2.5" marker-start="url(#ah)" marker-end="url(#ah)"/><text x="150" y="320" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle" font-style="italic">r</text><text x="230" y="525" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">one orbit: distance 2πr in time T</text><rect x="440" y="130" width="430" height="250" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="460" y="166" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="start">Worked example 1</text><text x="460" y="200" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">r = 3.8 × 10⁸ m, T = 27.3 days</text><text x="460" y="232" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">T = 27.3 × 24 × 3600</text><text x="490" y="264" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">= 2.36 × 10⁶ s</text><text x="460" y="296" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">v = 2πr / T</text><text x="460" y="328" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">= (2π × 3.8 × 10⁸) / 2.36 × 10⁶</text><text x="460" y="360" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">= 1.0 × 10³ m/s (about 1 km/s)</text><rect x="440" y="396" width="430" height="164" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="655" y="470.3" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Convert T to seconds first:</text><text x="655" y="498.3" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">1 day = 86 400 s</text>
</svg>