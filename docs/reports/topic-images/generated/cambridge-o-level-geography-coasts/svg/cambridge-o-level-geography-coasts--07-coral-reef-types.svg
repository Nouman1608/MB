<rect width="900" height="900" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three types of coral reef</text>

<rect x="30" y="110" width="840" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="150" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Fringing reef</text><text x="60" y="176" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">attached to the shore</text><rect x="330" y="190" width="520" height="90" fill="#b5d3cf"/><line x1="330" y1="190" x2="850" y2="190" stroke="#2e6b62" stroke-width="2.5"/><path d="M560,280 L568,188 Q625,178 682,188 L690,280 Z" fill="#b5602e" opacity="0.85" stroke="#1e2a44" stroke-width="2.5"/><path d="M400,280 Q520,70 640,280 Z" fill="#a9c48f" stroke="#1e2a44" stroke-width="3"/><text x="500" y="230" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">island</text><text x="655" y="172" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">reef</text><rect x="30" y="316" width="840" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="356" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Barrier reef</text><text x="60" y="382" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">separated from the shore by a lagoon</text><rect x="330" y="396" width="520" height="90" fill="#b5d3cf"/><line x1="330" y1="396" x2="850" y2="396" stroke="#2e6b62" stroke-width="2.5"/><path d="M380,486 Q480,276 580,486 Z" fill="#a9c48f" stroke="#1e2a44" stroke-width="3"/><text x="480" y="436" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">island</text><text x="720" y="378" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">reef</text><rect x="600" y="396" width="80" height="90" fill="#dce9e7"/><path d="M680,486 L688,394 Q720,384 752,394 L760,486 Z" fill="#b5602e" opacity="0.85" stroke="#1e2a44" stroke-width="2.5"/><text x="640" y="474" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">lagoon</text><rect x="30" y="522" width="840" height="190" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="60" y="562" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Atoll</text><text x="60" y="588" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a ring of coral around a lagoon</text><rect x="330" y="602" width="520" height="90" fill="#b5d3cf"/><line x1="330" y1="602" x2="850" y2="602" stroke="#2e6b62" stroke-width="2.5"/><path d="M420,692 L428,600 Q460,590 492,600 L500,692 Z" fill="#b5602e" opacity="0.85" stroke="#1e2a44" stroke-width="2.5"/><rect x="500" y="602" width="180" height="90" fill="#dce9e7"/><path d="M680,692 L688,600 Q720,590 752,600 L760,692 Z" fill="#b5602e" opacity="0.85" stroke="#1e2a44" stroke-width="2.5"/><text x="590" y="634" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">lagoon</text><path d="M520,692 Q590,670 660,692 Z" fill="#a9c48f" opacity="0.5" stroke="#1e2a44" stroke-width="2" stroke-dasharray="6 5"/><text x="450" y="764" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Conditions coral needs</text><rect x="30" y="784" width="200" height="92" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="130" y="822" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Warm</text><text x="130" y="850" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">above about 18 °C</text><rect x="243" y="784" width="200" height="92" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="343" y="822" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Shallow, clear</text><text x="343" y="850" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">sunlight for algae</text><rect x="456" y="784" width="200" height="92" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="556" y="822" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Salty</text><text x="556" y="850" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">not near river mouths</text><rect x="669" y="784" width="201" height="92" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="769.5" y="822" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Oxygenated</text><text x="769.5" y="850" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">from wave action</text>
</svg>