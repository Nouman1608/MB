<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" width="900" height="760" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="760" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four ways the sea erodes the coast</text>

<rect x="30" y="110" width="410" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="150" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Hydraulic action</text><rect x="50" y="230" width="250" height="70" fill="#b5d3cf"/><path d="M280,170 L410,170 L410,300 L300,300 L292,260 L285,220 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><path d="M292,250 l40,-6 l12,8 l28,-4" fill="none" stroke="#b5602e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><line x1="120" y1="255" x2="270" y2="255" stroke="#2e6b62" stroke-width="8" marker-end="url(#ahT)"/><text x="330" y="222" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">air forced</text><text x="330" y="240" font-size="15" font-weight="600" fill="#b5602e" text-anchor="start">into crack</text><text x="54" y="338" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Force of the water; air compressed</text><text x="54" y="361" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">in cracks blasts rock apart.</text><rect x="460" y="110" width="410" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="484" y="150" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Abrasion</text><rect x="480" y="230" width="250" height="70" fill="#b5d3cf"/><path d="M710,170 L840,170 L840,300 L730,300 L722,260 L715,220 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><circle cx="590" cy="260" r="11" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="635" cy="248" r="11" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="675" cy="270" r="11" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2.5"/><line x1="530" y1="260" x2="572" y2="260" stroke="#2e6b62" stroke-width="5" marker-end="url(#ahT)"/><line x1="688" y1="268" x2="712" y2="268" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="484" y="338" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Waves hurl sand and pebbles at</text><text x="484" y="361" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the cliff and wear it away.</text><rect x="30" y="430" width="410" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="470" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Attrition</text><rect x="50" y="490" width="370" height="130" rx="10" fill="#dce9e7"/><path d="M90,525 l40,-10 l22,30 l-12,34 l-44,4 l-16,-30 z" fill="#9c8f6e" stroke="#1e2a44" stroke-width="3"/><path d="M190,520 l36,6 l8,36 l-30,22 l-30,-16 z" fill="#9c8f6e" stroke="#1e2a44" stroke-width="3"/><text x="170" y="555" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">⟷</text><line x1="255" y1="555" x2="305" y2="555" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><circle cx="335" cy="542" r="15" fill="#9c8f6e" stroke="#1e2a44" stroke-width="3"/><circle cx="375" cy="570" r="13" fill="#9c8f6e" stroke="#1e2a44" stroke-width="3"/><text x="54" y="658" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Rocks knock together and become</text><text x="54" y="681" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">smaller and more rounded.</text><rect x="460" y="430" width="410" height="300" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="484" y="470" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Solution</text><rect x="480" y="550" width="250" height="70" fill="#b5d3cf"/><path d="M710,490 L840,490 L840,620 L722,620 L710,550 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><text x="775" y="530" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">chalk /</text><text x="775" y="548" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">limestone</text><circle cx="685" cy="570" r="5" fill="#8a6d0d"/><circle cx="660" cy="590" r="4.5" fill="#8a6d0d"/><circle cx="635" cy="575" r="4" fill="#8a6d0d"/><circle cx="610" cy="598" r="3.5" fill="#8a6d0d"/><circle cx="590" cy="580" r="3" fill="#8a6d0d"/><text x="484" y="658" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Sea water dissolves soluble</text><text x="484" y="681" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">rock such as chalk and limestone.</text>
</svg>