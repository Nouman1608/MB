<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 820" width="900" height="820" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="820" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Crack, cave, arch, stack, stump</text>

<rect x="30" y="110" width="840" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="50" y="210" width="300" height="26" fill="#b5d3cf"/><path d="M110,210 L118,132 L292,132 L300,210 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><path d="M205,210 l-6,-14 l8,-10 l-4,-14" fill="none" stroke="#b5602e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><line x1="50" y1="210" x2="350" y2="210" stroke="#2e6b62" stroke-width="2.5"/><circle cx="395" cy="174" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="395" y="182.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="440" y="156" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Crack</text><text x="440" y="186" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Hydraulic action and abrasion attack a</text><text x="440" y="208" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">weakness (a joint or fault) at the</text><text x="440" y="230" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">base of the headland.</text><rect x="30" y="250" width="840" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="50" y="350" width="300" height="26" fill="#b5d3cf"/><path d="M110,350 L118,272 L292,272 L300,350 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><path d="M180,350 Q205,300 230,350 Z" fill="#1e2a44" opacity="0.75"/><line x1="50" y1="350" x2="350" y2="350" stroke="#2e6b62" stroke-width="2.5"/><circle cx="395" cy="314" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="395" y="322.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="440" y="296" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Cave</text><text x="440" y="326" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The crack is widened and deepened into</text><text x="440" y="348" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">a cave.</text><rect x="30" y="390" width="840" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="50" y="490" width="300" height="26" fill="#b5d3cf"/><path d="M110,490 L118,412 L292,412 L300,490 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><path d="M165,490 L165,460 Q205,420 245,460 L245,490 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><line x1="50" y1="490" x2="350" y2="490" stroke="#2e6b62" stroke-width="2.5"/><circle cx="395" cy="454" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="395" y="462.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="440" y="436" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Arch</text><text x="440" y="466" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Caves on both sides of the headland</text><text x="440" y="488" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">erode right through it.</text><rect x="30" y="530" width="840" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="50" y="630" width="300" height="26" fill="#b5d3cf"/><path d="M110,630 L118,552 L187,552 L195,630 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><path d="M240,630 L248,558 L292,558 L300,630 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><circle cx="215" cy="624" r="7" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><circle cx="228" cy="625" r="5" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2"/><line x1="50" y1="630" x2="350" y2="630" stroke="#2e6b62" stroke-width="2.5"/><circle cx="395" cy="594" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="395" y="602.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="440" y="576" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Stack</text><text x="440" y="606" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The arch roof is weakened by</text><text x="440" y="628" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">weathering and collapses, leaving a</text><text x="440" y="650" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">stack.</text><rect x="30" y="670" width="840" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="50" y="770" width="300" height="26" fill="#b5d3cf"/><path d="M110,770 L118,692 L187,692 L195,770 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><path d="M245,770 L250,754 L290,754 L295,770 Z" fill="#cbbf9f" stroke="#1e2a44" stroke-width="3"/><line x1="50" y1="748" x2="350" y2="748" stroke="#2e6b62" stroke-width="2.5" stroke-dasharray="8 6"/><text x="345" y="742" font-size="14" font-weight="400" fill="#2e6b62" text-anchor="end">high tide</text><line x1="50" y1="770" x2="350" y2="770" stroke="#2e6b62" stroke-width="2.5"/><circle cx="395" cy="734" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="395" y="742.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="440" y="716" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="start">Stump</text><text x="440" y="746" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The stack is undercut and collapses</text><text x="440" y="768" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">into a stump, covered at high tide.</text>
</svg>