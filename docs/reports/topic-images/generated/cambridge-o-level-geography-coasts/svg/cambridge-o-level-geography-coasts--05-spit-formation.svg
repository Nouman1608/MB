<rect width="900" height="700" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How a spit forms</text>

<rect x="30" y="110" width="840" height="560" fill="#b5d3cf"/><path d="M445,330 Q450,265 500,230 Q620,185 870,175 L870,300 Q800,330 445,330 Z" fill="#dce9e7"/><path d="M30,110 L870,110 L870,175 Q620,185 500,230 Q450,265 445,330 L30,330 Z" fill="#d8e3c6" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><path d="M830,110 Q826,145 812,178" fill="none" stroke="#2b5a9a" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" /><path d="M470,300 Q520,250 620,232 Q720,222 760,262 Q700,296 470,304 Z" fill="#a9c48f" stroke="#6f9a52" stroke-width="2.5"/><path d="M500,292 l6,-12 m0,12 l6,-10" fill="none" stroke="#6f9a52" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M540,288.8 l6,-12 m0,12 l6,-10" fill="none" stroke="#6f9a52" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M580,285.6 l6,-12 m0,12 l6,-10" fill="none" stroke="#6f9a52" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M620,282.4 l6,-12 m0,12 l6,-10" fill="none" stroke="#6f9a52" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M660,279.2 l6,-12 m0,12 l6,-10" fill="none" stroke="#6f9a52" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M700,276 l6,-12 m0,12 l6,-10" fill="none" stroke="#6f9a52" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M440,322 L735,316 Q795,312 800,262" fill="none" stroke="#1e2a44" stroke-width="34" stroke-linejoin="round" stroke-linecap="round" /><path d="M440,322 L735,316 Q795,312 800,262" fill="none" stroke="#efdfa8" stroke-width="27" stroke-linejoin="round" stroke-linecap="round" /><line x1="90" y1="372" x2="130" y2="344" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><line x1="130" y1="344" x2="130" y2="372" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><line x1="175" y1="372" x2="215" y2="344" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><line x1="215" y1="344" x2="215" y2="372" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><line x1="260" y1="372" x2="300" y2="344" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><line x1="300" y1="344" x2="300" y2="372" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><line x1="345" y1="372" x2="385" y2="344" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><line x1="385" y1="344" x2="385" y2="372" stroke="#b5602e" stroke-width="3" marker-end="url(#ahR)"/><text x="180" y="220" font-size="22" font-weight="700" fill="#4a5568" text-anchor="start">LAND</text><text x="812" y="145" font-size="16" font-weight="600" fill="#2b5a9a" text-anchor="end">river</text><line x1="70" y1="410" x2="420" y2="410" stroke="#8a6d0d" stroke-width="5" marker-end="url(#ahO)"/><text x="70" y="440" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">longshore drift carries sediment</text><text x="70" y="462" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">along the coast</text><text x="420" y="280" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">coast changes</text><text x="420" y="299" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="end">direction here</text><text x="600" y="365" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">SPIT: sand and shingle deposited</text><text x="600" y="386" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">out into open water</text><text x="810" y="240" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">hook</text><text x="612" y="268" font-size="17" font-weight="700" fill="#3d5f2a" text-anchor="middle">salt marsh</text><text x="705" y="224" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">sheltered water: mud settles</text><line x1="150" y1="620" x2="260" y2="510" stroke="#1e2a44" stroke-width="5" marker-end="url(#ah)"/><text x="130" y="648" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">prevailing wind and waves</text><line x1="860" y1="610" x2="815" y2="300" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)" stroke-dasharray="10 7"/><text x="860" y="640" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">a change in wind or wave</text><text x="860" y="660" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">direction curves the end</text>
</svg>