<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 860" width="900" height="860" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="860" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Constructive and destructive waves</text>

<rect x="30" y="110" width="840" height="290" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M32,325 L414.2857142857143,325 L50,375 L32,375 Z" fill="#b5d3cf"/><path d="M50,375 L560,305 L560,388 L50,388 Z" fill="#efdfa8" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><path d="M60,325 q30,-20 60,0 q30,-20 60,0 q30,-20 60,0" fill="#b5d3cf" stroke="#2e6b62" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><line x1="374.6572511015379" y1="310.4392008292007" x2="503.4497564501111" y2="292.7617981342985" stroke="#2e6b62" stroke-width="10" marker-end="url(#ahT)"/><line x1="434.0999458778025" y1="270.28039958539966" x2="374.6572511015379" y2="278.4392008292007" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><text x="60" y="150" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">Constructive wave</text><text x="60" y="178" font-size="18" font-weight="600" fill="#2e6b62" text-anchor="start">swash stronger than backwash</text><text x="600" y="220" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">• Low height</text><text x="600" y="250" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">• Fewer per minute</text><text x="600" y="280" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">• Deposit material</text><text x="600" y="310" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">• Gentle, wide beach</text><rect x="30" y="420" width="840" height="290" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M32,635 L204.54545454545453,635 L50,685 L32,685 Z" fill="#b5d3cf"/><path d="M50,685 L560,520 L560,698 L50,698 Z" fill="#efdfa8" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round"/><path d="M70,635 C70,585 105,550 145,563 C122,573 122,599 150,609 L158,635 Z" fill="#b5d3cf" stroke="#2e6b62" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><line x1="218.81712232377072" y1="610.38269571878" x2="275.9037934370354" y2="591.9134785939003" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><line x1="342.5049097358442" y1="538.366058614874" x2="218.81712232377072" y2="578.38269571878" stroke="#b5602e" stroke-width="10" marker-end="url(#ahR)"/><text x="60" y="460" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="start">Destructive wave</text><text x="60" y="488" font-size="18" font-weight="600" fill="#b5602e" text-anchor="start">backwash stronger than swash</text><text x="600" y="530" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">• High height</text><text x="600" y="560" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">• More per minute</text><text x="600" y="590" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">• Remove material</text><text x="600" y="620" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">   and erode cliffs</text><text x="600" y="650" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">• Steep, narrow beach</text><line x1="80" y1="790" x2="140" y2="790" stroke="#2e6b62" stroke-width="8" marker-end="url(#ahT)"/><text x="155" y="797" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">swash (up the beach)</text><line x1="430" y1="790" x2="490" y2="790" stroke="#b5602e" stroke-width="8" marker-end="url(#ahR)"/><text x="505" y="797" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">backwash (back to the sea)</text><text x="450" y="832" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Arrow thickness shows which flow is stronger</text>
</svg>