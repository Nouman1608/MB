<rect width="900" height="780" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who gets protected? Managing a coastline</text>

<rect x="30" y="110" width="840" height="170" fill="#d8e3c6"/><rect x="30" y="280" width="840" height="50" fill="#efdfa8"/><rect x="30" y="330" width="840" height="270" fill="#b5d3cf"/><line x1="300" y1="110" x2="300" y2="330" stroke="#4a5568" stroke-width="2" stroke-dasharray="4 6"/><line x1="630" y1="110" x2="630" y2="330" stroke="#4a5568" stroke-width="2" stroke-dasharray="4 6"/><path d="M40,210 Q160,200 290,215" fill="none" stroke="#4a5568" stroke-width="2" stroke-dasharray="8 6"/><path d="M40,250 Q160,240 290,255" fill="none" stroke="#4a5568" stroke-width="2" stroke-dasharray="8 6"/><path d="M40,290 Q160,280 290,295" fill="none" stroke="#4a5568" stroke-width="2" stroke-dasharray="8 6"/><text x="165" y="150" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Farmland</text><text x="165" y="172" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">(low value)</text><text x="165" y="300" font-size="14" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">former cliff lines</text><rect x="330" y="165" width="34" height="28" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M327,165 L347,151 L367,165 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="400" y="195" width="34" height="28" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M397,195 L417,181 L437,195 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="460" y="160" width="34" height="28" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M457,160 L477,146 L497,160 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="525" y="205" width="34" height="28" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M522,205 L542,191 L562,205 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="575" y="165" width="34" height="28" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M572,165 L592,151 L612,165 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="370" y="240" width="34" height="28" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M367,240 L387,226 L407,240 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="500" y="250" width="34" height="28" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><path d="M497,250 L517,236 L537,250 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="465" y="134" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Town</text><line x1="310" y1="283" x2="620" y2="283" stroke="#1e2a44" stroke-width="9"/><path d="M330,290 L300,290 L330,340 Z" fill="#e2c97a" opacity="0.9"/><line x1="330" y1="285" x2="330" y2="370" stroke="#1e2a44" stroke-width="6"/><path d="M410,290 L380,290 L410,340 Z" fill="#e2c97a" opacity="0.9"/><line x1="410" y1="285" x2="410" y2="370" stroke="#1e2a44" stroke-width="6"/><path d="M490,290 L460,290 L490,340 Z" fill="#e2c97a" opacity="0.9"/><line x1="490" y1="285" x2="490" y2="370" stroke="#1e2a44" stroke-width="6"/><path d="M570,290 L540,290 L570,340 Z" fill="#e2c97a" opacity="0.9"/><line x1="570" y1="285" x2="570" y2="370" stroke="#1e2a44" stroke-width="6"/><rect x="380" y="425" width="170" height="16" rx="4" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2.5"/><rect x="660" y="160" width="150" height="80" rx="6" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="735" y="195" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Gas</text><text x="735" y="217" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">terminal</text><circle cx="660" cy="334" r="13" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="690" cy="342" r="13" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="720" cy="334" r="13" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="750" cy="342" r="13" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="780" cy="334" r="13" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="810" cy="342" r="13" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2.5"/><circle cx="840" cy="334" r="13" fill="#9c8f6e" stroke="#1e2a44" stroke-width="2.5"/><line x1="60" y1="390" x2="260" y2="390" stroke="#8a6d0d" stroke-width="5" marker-end="url(#ahO)"/><text x="60" y="418" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">longshore drift</text><line x1="150" y1="505" x2="150" y2="435" stroke="#1e2a44" stroke-width="2.5"/><line x1="150" y1="380" x2="150" y2="310" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="60" y="530" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Managed retreat</text><text x="60" y="552" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">let it erode</text><line x1="330" y1="505" x2="330" y2="360" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="290" y="530" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Groynes</text><text x="290" y="552" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">trap sand</text><line x1="465" y1="505" x2="465" y2="448" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="420" y="530" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Offshore</text><text x="420" y="552" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">breakwater</text><line x1="600" y1="505" x2="600" y2="290" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="565" y="530" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Sea wall</text><line x1="760" y1="505" x2="760" y2="355" stroke="#1e2a44" stroke-width="2.5" marker-end="url(#ah)"/><text x="700" y="530" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Rock armour</text><rect x="30" y="640" width="840" height="120" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="60" y="680" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Cost–benefit: defend high-value places, let low-value land retreat.</text><text x="60" y="712" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">But groynes starve beaches further along the coast of sand,</text><text x="60" y="736" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">so erosion can speed up downdrift.</text>
</svg>