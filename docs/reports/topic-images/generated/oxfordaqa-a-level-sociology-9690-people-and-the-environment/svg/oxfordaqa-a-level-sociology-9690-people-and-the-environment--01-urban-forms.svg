<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 568" width="900" height="568" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="568" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Social life in cities</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">urbanisation: a growing share of people living in towns and cities</text>
<rect x="30" y="120" width="269.3333333333333" height="232" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,190 L31.25,134.25 Q31.25,121.25 44.25,121.25 L285.0833333333333,121.25 Q298.0833333333333,121.25 298.0833333333333,134.25 L298.0833333333333,190 Z" fill="#f2e7b8"/><line x1="31.25" y1="190" x2="298.0833333333333" y2="190" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="148.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">‘Slums’ and informal</text><text x="164.66666666666666" y="172.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">housing</text><text x="46" y="223.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">UN-Habitat: lacking durable</text><text x="46" y="244.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">housing, space, water,</text><text x="46" y="265.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sanitation or secure tenure.</text><text x="46" y="286.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Davis (2006):</tspan> growth</text><text x="46" y="307.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">followed debt and structural</text><text x="46" y="328.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">adjustment.</text><rect x="315.3333333333333" y="120" width="269.3333333333333" height="232" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,190 L316.5833333333333,134.25 Q316.5833333333333,121.25 329.5833333333333,121.25 L570.4166666666666,121.25 Q583.4166666666666,121.25 583.4166666666666,134.25 L583.4166666666666,190 Z" fill="#dce9e7"/><line x1="316.5833333333333" y1="190" x2="583.4166666666666" y2="190" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="160.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Suburbia</text><text x="331.3333333333333" y="223.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lower-density housing on</text><text x="331.3333333333333" y="244.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">city edges, often linked to</text><text x="331.3333333333333" y="265.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">car use and commuting.</text><rect x="600.6666666666666" y="120" width="269.3333333333333" height="232" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,190 L601.9166666666666,134.25 Q601.9166666666666,121.25 614.9166666666666,121.25 L855.75,121.25 Q868.75,121.25 868.75,134.25 L868.75,190 Z" fill="#f2e7b8"/><line x1="601.9166666666666" y1="190" x2="868.75" y2="190" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="160.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Segregation</text><text x="616.6666666666666" y="223.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Separation of groups by</text><text x="616.6666666666666" y="244.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">class, ethnicity or religion</text><text x="616.6666666666666" y="265.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">across city space.</text><rect x="30" y="368" width="269.3333333333333" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,418 L31.25,382.25 Q31.25,369.25 44.25,369.25 L285.0833333333333,369.25 Q298.0833333333333,369.25 298.0833333333333,382.25 L298.0833333333333,418 Z" fill="#f2e7b8"/><line x1="31.25" y1="418" x2="298.0833333333333" y2="418" stroke="#c9d6d4" stroke-width="2"/><text x="164.66666666666666" y="398.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Gated communities</text><text x="46" y="451.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Walled estates with</text><text x="46" y="472.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">controlled entry. <tspan font-weight="700">Davis</tspan></text><text x="46" y="493.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">(1990):</tspan> "fortress" Los</text><text x="46" y="514.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Angeles.</text><rect x="315.3333333333333" y="368" width="269.3333333333333" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M316.5833333333333,418 L316.5833333333333,382.25 Q316.5833333333333,369.25 329.5833333333333,369.25 L570.4166666666666,369.25 Q583.4166666666666,369.25 583.4166666666666,382.25 L583.4166666666666,418 Z" fill="#b5d3cf"/><line x1="316.5833333333333" y1="418" x2="583.4166666666666" y2="418" stroke="#c9d6d4" stroke-width="2"/><text x="450" y="398.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Megacities</text><text x="331.3333333333333" y="451.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Urban areas of over 10</text><text x="331.3333333333333" y="472.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">million people, such as</text><text x="331.3333333333333" y="493.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Lagos, Karachi or Dhaka.</text><rect x="600.6666666666666" y="368" width="269.3333333333333" height="170" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M601.9166666666666,418 L601.9166666666666,382.25 Q601.9166666666666,369.25 614.9166666666666,369.25 L855.75,369.25 Q868.75,369.25 868.75,382.25 L868.75,418 Z" fill="#b5d3cf"/><line x1="601.9166666666666" y1="418" x2="868.75" y2="418" stroke="#c9d6d4" stroke-width="2"/><text x="735.3333333333333" y="398.1" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Non-places</text><text x="616.6666666666666" y="451.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Augé:</tspan> airports, motorways,</text><text x="616.6666666666666" y="472.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">hotel chains, malls: passed</text><text x="616.6666666666666" y="493.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">through anonymously, without</text><text x="616.6666666666666" y="514.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">shared history.</text>
</svg>