<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 496" width="900" height="496" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="496" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Environmental and climate justice</text>

<rect x="30" y="104" width="375" height="184" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,154 L31.25,118.25 Q31.25,105.25 44.25,105.25 L390.75,105.25 Q403.75,105.25 403.75,118.25 L403.75,154 Z" fill="#f2e7b8"/><line x1="31.25" y1="154" x2="403.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="217.5" y="134.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Who causes most harm</text><circle cx="49" cy="179.92" r="4.5" fill="#2e6b62"/><text x="62" y="185.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Richer countries and richer people</text><circle cx="49" cy="208.92" r="4.5" fill="#2e6b62"/><text x="62" y="214.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Far more emissions per head</text><rect x="495" y="104" width="375" height="184" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M496.25,154 L496.25,118.25 Q496.25,105.25 509.25,105.25 L855.75,105.25 Q868.75,105.25 868.75,118.25 L868.75,154 Z" fill="#b5d3cf"/><line x1="496.25" y1="154" x2="868.75" y2="154" stroke="#c9d6d4" stroke-width="2"/><text x="682.5" y="134.55" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Who suffers first and worst</text><circle cx="514" cy="179.92" r="4.5" fill="#2e6b62"/><text x="527" y="185.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Poorer countries and poorer people</text><circle cx="514" cy="208.92" r="4.5" fill="#2e6b62"/><text x="527" y="214.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Least access to acting sustainably</text><circle cx="514" cy="237.92" r="4.5" fill="#2e6b62"/><text x="527" y="243.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Within countries: poorer areas more</text><text x="527" y="264.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">exposed to heat, flooding, pollution</text><line x1="411" y1="196" x2="489" y2="196" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><text x="450" y="182" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">costs</text><text x="450" y="316" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">Example: Pakistan’s 2022 floods hit a country with low historical emissions</text><rect x="30" y="340" width="253.33333333333334" height="130" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="156.66666666666669" y="373.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Bullard</text><text x="156.66666666666669" y="403.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Houston, 1979: waste sites</text><text x="156.66666666666669" y="424.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">placed mainly in Black</text><text x="156.66666666666669" y="445.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">neighbourhoods</text><line x1="287.33333333333337" y1="405" x2="319.33333333333337" y2="405" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="323.33333333333337" y="340" width="253.33333333333334" height="130" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="450.00000000000006" y="372.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Dumping in Dixie</text><text x="450.00000000000006" y="396.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">(1990)</text><text x="450.00000000000006" y="426.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">linked race, class and</text><text x="450.00000000000006" y="447.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">environmental harm</text><line x1="580.6666666666667" y1="405" x2="612.6666666666667" y2="405" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="616.6666666666667" y="340" width="253.33333333333334" height="130" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="743.3333333333334" y="373.8" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Climate justice</text><text x="743.3333333333334" y="403.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">who caused it, who pays,</text><text x="743.3333333333334" y="424.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">who suffers; loss and</text><text x="743.3333333333334" y="445.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">damage fund (COP27, 2022)</text>
</svg>