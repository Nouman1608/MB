<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Hannigan (1995): six factors for a successful claim</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">the social construction of environmental problems</text>
<rect x="30" y="104" width="270.6666666666667" height="90" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="62" cy="149" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="155.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="90" y="155" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Scientific authority</text><rect x="314.6666666666667" y="104" width="270.6666666666667" height="90" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="346.6666666666667" cy="149" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="346.6666666666667" y="155.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="374.6666666666667" y="134" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Popularisers linking</text><text x="374.6666666666667" y="155" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">science and</text><text x="374.6666666666667" y="176" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">campaigning</text><rect x="599.3333333333334" y="104" width="270.6666666666667" height="90" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="631.3333333333334" cy="149" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="631.3333333333334" y="155.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="659.3333333333334" y="134" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Media attention</text><text x="659.3333333333334" y="155" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">framing the issue as</text><text x="659.3333333333334" y="176" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">new and important</text><rect x="30" y="208" width="270.6666666666667" height="90" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="62" cy="253" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="259.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="90" y="248.5" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Dramatic symbols and</text><text x="90" y="269.5" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">images</text><rect x="314.6666666666667" y="208" width="270.6666666666667" height="90" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="346.6666666666667" cy="253" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="346.6666666666667" y="259.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="374.6666666666667" y="248.5" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Visible economic</text><text x="374.6666666666667" y="269.5" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">incentives for action</text><rect x="599.3333333333334" y="208" width="270.6666666666667" height="90" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><circle cx="631.3333333333334" cy="253" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="631.3333333333334" y="259.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><text x="659.3333333333334" y="248.5" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">An institutional</text><text x="659.3333333333334" y="269.5" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">sponsor</text><line x1="450" y1="318" x2="450" y2="358" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="170" y="366" width="560" height="60" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="404" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">A real problem becomes a public issue</text><rect x="30" y="446" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="482" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Common error</text><text x="56" y="511" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Hannigan does not say problems are "not real"; he argues they are real but need</text><text x="56" y="533" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">claims-making. Realists warn the approach can seem to excuse scepticism.</text>
</svg>