<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 503" width="900" height="503" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="503" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Columbian Exchange</text>

<rect x="30" y="120" width="270" height="200" rx="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="165" y="228" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">Afro-Eurasia</text><rect x="600" y="120" width="270" height="200" rx="16" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="735" y="228" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">The Americas</text><line x1="310" y1="180" x2="590" y2="180" stroke="#b5602e" stroke-width="5" marker-end="url(#ahR)"/><text x="450" y="166" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">horses, cattle, smallpox</text><line x1="590" y1="260" x2="310" y2="260" stroke="#2e6b62" stroke-width="5" marker-end="url(#ahT)"/><text x="450" y="290" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">maize, potatoes, turkeys</text><text x="450" y="226" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">after 1492</text><rect x="30" y="344" width="840" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="380" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Crosby (1972)</text><text x="56" y="409" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Named the transfer of plants, animals and diseases between the Americas and</text><text x="56" y="431" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Afro-Eurasia. Bryant (1979): the "zoological connection" between human behaviour and</text><text x="56" y="453" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">animals.</text>
</svg>