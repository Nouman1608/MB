<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 586" width="900" height="586" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="586" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Marxist starting point</text>

<rect x="30" y="112" width="400" height="120" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="230" y="146" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Bourgeoisie</text><text x="230" y="176" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">own the means of production: factories, land,</text><text x="230" y="197" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">companies</text><rect x="470" y="112" width="400" height="120" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="670" y="146" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Proletariat</text><text x="670" y="176" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">must sell their labour to survive</text><line x1="434" y1="172" x2="466" y2="172" stroke="#b5602e" stroke-width="4"/><text x="450" y="256" font-size="17" font-weight="600" fill="#b5602e" text-anchor="middle">An unequal, exploitative relationship: owners profit from work they do not do</text><text x="450" y="300" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">So capitalism needs two things from its institutions</text><rect x="30" y="318" width="400" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,368 L31.25,332.25 Q31.25,319.25 44.25,319.25 L415.75,319.25 Q428.75,319.25 428.75,332.25 L428.75,368 Z" fill="#b5d3cf"/><line x1="31.25" y1="368" x2="428.75" y2="368" stroke="#c9d6d4" stroke-width="2"/><text x="230" y="349" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1. Workers</text><text x="44" y="400.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A supply of workers with the right skills</text><text x="44" y="422.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and attitudes</text><rect x="470" y="318" width="400" height="128" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M471.25,368 L471.25,332.25 Q471.25,319.25 484.25,319.25 L855.75,319.25 Q868.75,319.25 868.75,332.25 L868.75,368 Z" fill="#b5d3cf"/><line x1="471.25" y1="368" x2="868.75" y2="368" stroke="#c9d6d4" stroke-width="2"/><text x="670" y="349" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2. Acceptance</text><text x="484" y="400.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Workers who accept their position rather</text><text x="484" y="422.15" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">than challenge it</text><line x1="240" y1="452" x2="400" y2="486" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="660" y1="452" x2="500" y2="486" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="250" y="492" width="400" height="70" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="526" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Education supplies both</text><text x="450" y="550" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">it serves capitalism, not “society”</text>
</svg>