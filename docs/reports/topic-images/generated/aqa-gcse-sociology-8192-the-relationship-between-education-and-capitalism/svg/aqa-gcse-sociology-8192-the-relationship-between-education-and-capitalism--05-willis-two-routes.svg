<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 699" width="900" height="699" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="699" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Willis: a different route to the same place</text>

<rect x="30" y="112" width="380" height="90" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="220" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Bowles and Gintis</text><text x="220" y="176" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">school trains obedience</text><rect x="490" y="112" width="380" height="90" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="680" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Willis</text><text x="680" y="176" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">the lads resist school</text><line x1="220" y1="206" x2="220" y2="246" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="680" y1="206" x2="680" y2="246" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="250" width="380" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="220" y="286" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Docile, obedient workers who accept</text><text x="220" y="308" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">authority</text><rect x="490" y="250" width="380" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="680" y="280" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Neither obedient nor docile: avoid</text><text x="680" y="302" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">lessons, resist teachers</text><line x1="260" y1="354" x2="410" y2="410" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="640" y1="354" x2="490" y2="410" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="230" y="414" width="440" height="108" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="450" y="450" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Workers capitalism needs</text><text x="450" y="478" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">Willis: male-dominated, unskilled or semi-skilled</text><text x="450" y="498" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">manual work</text><rect x="30" y="542" width="840" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="578" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Willis is a Marxist who disagrees</text><text x="56" y="607" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">He rejects a direct link between the economy and how schools operate: education is not a</text><text x="56" y="629" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">particularly successful agency of socialisation and can have unintended consequences. He</text><text x="56" y="651" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">challenges how the correspondence works, not whether schooling serves capitalism.</text>
</svg>