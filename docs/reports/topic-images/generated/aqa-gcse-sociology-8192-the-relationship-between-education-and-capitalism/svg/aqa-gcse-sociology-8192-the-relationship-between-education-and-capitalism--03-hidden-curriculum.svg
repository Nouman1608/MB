<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 735" width="900" height="735" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="735" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">What the hidden curriculum rewards</text>

<rect x="30" y="108" width="404" height="290" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,158 L31.25,122.25 Q31.25,109.25 44.25,109.25 L419.75,109.25 Q432.75,109.25 432.75,122.25 L432.75,158 Z" fill="#b5d3cf"/><line x1="31.25" y1="158" x2="432.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="232" y="139" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Rewarded with higher grades</text><rect x="466" y="108" width="404" height="290" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M467.25,158 L467.25,122.25 Q467.25,109.25 480.25,109.25 L855.75,109.25 Q868.75,109.25 868.75,122.25 L868.75,158 Z" fill="#f2e7b8"/><line x1="467.25" y1="158" x2="868.75" y2="158" stroke="#c9d6d4" stroke-width="2"/><text x="668" y="139" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Not what was rewarded</text><rect x="90" y="190" width="284" height="44" rx="22" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="232" y="219" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Perseverance</text><rect x="90" y="248" width="284" height="44" rx="22" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="232" y="277" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Dependability</text><rect x="90" y="306" width="284" height="44" rx="22" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="232" y="335" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Punctuality</text><rect x="526" y="190" width="284" height="44" rx="22" fill="#ffffff" stroke="#1e2a44" stroke-width="2" stroke-dasharray="6 5"/><text x="668" y="219" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle">Creativity</text><rect x="526" y="248" width="284" height="44" rx="22" fill="#ffffff" stroke="#1e2a44" stroke-width="2" stroke-dasharray="6 5"/><text x="668" y="277" font-size="18" font-weight="700" fill="#4a5568" text-anchor="middle">Independence</text><text x="668" y="330" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle">Schools reward the personality of a</text><text x="668" y="351" font-size="16" font-weight="600" fill="#8a6d0d" text-anchor="middle">good subordinate worker</text><text x="450" y="430" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Why “too divided to challenge management” matters</text><rect x="30" y="450" width="187.5" height="132" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="123.75" y="482.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Ranking,</text><text x="123.75" y="506.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">setting,</text><text x="123.75" y="530.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">competition</text><text x="123.75" y="560.3" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">at school</text><line x1="221.5" y1="516" x2="243.5" y2="516" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="247.5" y="450" width="187.5" height="132" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="341.25" y="484.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Pupils see each</text><text x="341.25" y="508.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">other as rivals</text><text x="341.25" y="538.3" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">individuals, not a</text><text x="341.25" y="558.3" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">group</text><line x1="439" y1="516" x2="461" y2="516" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="465" y="450" width="187.5" height="132" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="558.75" y="484.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Less collective</text><text x="558.75" y="508.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">action</text><text x="558.75" y="538.3" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">e.g. trade unions</text><text x="558.75" y="558.3" font-size="15.5" font-weight="400" fill="#1e2a44" text-anchor="middle">demanding pay</text><line x1="656.5" y1="516" x2="678.5" y2="516" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="682.5" y="450" width="187.5" height="132" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="776.25" y="492.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Owners’</text><text x="776.25" y="516.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">authority</text><text x="776.25" y="540.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">protected</text><rect x="30" y="600" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="636" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The hidden curriculum</text><text x="56" y="665" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Lessons learned from how school is organised, not from timetabled subjects: lining up, asking</text><text x="56" y="687" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">permission to leave the room, bells and timetables, accepting detentions.</text>
</svg>