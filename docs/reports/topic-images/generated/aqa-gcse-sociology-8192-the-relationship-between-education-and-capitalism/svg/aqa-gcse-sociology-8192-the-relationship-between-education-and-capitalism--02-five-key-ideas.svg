<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 826" width="900" height="826" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="826" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Bowles and Gintis: five key ideas</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Schooling in Capitalist America (1976)</text>
<rect x="30" y="120" width="840" height="95" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="167.5" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="175.06" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="104" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Reproduction of labour power</text><text x="104" y="188.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Education produces the next generation of workers in the form capitalism needs</text><line x1="450" y1="219" x2="450" y2="255" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="261" width="840" height="95" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="308.5" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="316.06" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="104" y="300.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The correspondence principle</text><text x="104" y="329.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Social relationships at school mirror those at work: school is a rehearsal for work</text><line x1="450" y1="360" x2="450" y2="396" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="402" width="840" height="95" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="449.5" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="457.06" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="104" y="441.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The kind of worker produced</text><text x="104" y="470.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Hardworking, docile, obedient, highly motivated, and too divided to challenge management</text><line x1="450" y1="501" x2="450" y2="537" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="543" width="840" height="95" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="67" cy="590.5" r="21" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="67" y="598.06" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="104" y="582.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Rejection of meritocracy</text><text x="104" y="611.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Class background is the most important factor influencing attainment</text><line x1="450" y1="642" x2="450" y2="678" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="684" width="840" height="116" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="67" cy="742" r="21" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="67" y="749.56" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><text x="104" y="723.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Legitimation: the myth of meritocracy</text><text x="104" y="752.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Schools claim to reward ability, so those who do badly blame themselves; inequality looks</text><text x="104" y="773.48" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">fair</text>
</svg>