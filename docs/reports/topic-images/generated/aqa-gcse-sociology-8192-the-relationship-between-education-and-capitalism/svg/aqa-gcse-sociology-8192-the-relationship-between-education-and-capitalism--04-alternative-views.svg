<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 769" width="900" height="769" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="769" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Who accepts the correspondence principle?</text>

<defs><linearGradient id="gacc" x1="0" x2="1"><stop offset="0" stop-color="#d4b02e"/><stop offset="1" stop-color="#dce9e7"/></linearGradient></defs><rect x="30" y="120" width="840" height="34" rx="17" fill="url(#gacc)" stroke="#1e2a44" stroke-width="2.5"/><text x="40" y="110" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">accepts the principle</text><text x="860" y="110" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="end">challenges it</text><rect x="30" y="176" width="240" height="70" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="48" y="209" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Bowles and Gintis</text><text x="48" y="231" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Marxist</text><rect x="282" y="176" width="588" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="298" y="215.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">School directly produces docile, obedient workers</text><rect x="30" y="256" width="240" height="70" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="48" y="289" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Willis</text><text x="48" y="311" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Marxist</text><rect x="282" y="256" width="588" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="298" y="285.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Outcome yes, mechanism no: resistance, not obedience, led the lads to</text><text x="298" y="306.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">manual work; no direct link</text><rect x="30" y="336" width="240" height="70" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="48" y="369" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Functionalists</text><text x="48" y="391" font-size="15.5" font-weight="400" fill="#4a5568" text-anchor="start">Durkheim, Parsons</text><rect x="282" y="336" width="588" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="298" y="365.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Schools do prepare pupils for work, but selection is fair and benefits</text><text x="298" y="386.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">everyone</text><rect x="30" y="416" width="240" height="70" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="48" y="458" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Feminists</text><rect x="282" y="416" width="588" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="298" y="445.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A correspondence with patriarchy too: gendered curriculum steers girls</text><text x="298" y="466.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to caring work; the glass ceiling</text><rect x="30" y="496" width="240" height="70" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="48" y="538" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Interactionists</text><rect x="282" y="496" width="588" height="70" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="298" y="525.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Pupils are not empty vessels: they interpret, negotiate and reject</text><text x="298" y="546.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">school expectations</text><rect x="30" y="582" width="840" height="163" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="618" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Change since the 1970s</text><circle cx="61" cy="641.39" r="4.5" fill="#8a6d0d"/><text x="74" y="647" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Based on 1970s American schools; many jobs now value creativity, teamwork and</text><text x="74" y="669" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">self-motivation</text><circle cx="61" cy="693.39" r="4.5" fill="#8a6d0d"/><text x="74" y="699" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700">Vocationalism:</tspan> functionalists see it as meeting economic needs; Marxists say it channels</text><text x="74" y="721" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">working-class pupils into lower-paid work</text>
</svg>