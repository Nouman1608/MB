<rect width="900" height="636" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Planning a 12-mark answer</text>

<text x="450" y="96" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">“Discuss how far sociologists would agree that schools mainly serve the interests of capitalism”</text><rect x="30" y="120" width="200" height="60" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="130" y="157" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Introduction</text><rect x="244" y="120" width="626" height="60" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="260" y="154.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Define capitalism and the correspondence principle</text><line x1="130" y1="180" x2="130" y2="192" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="192" width="200" height="60" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="130" y="229" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">For (Marxist)</text><rect x="244" y="192" width="626" height="60" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="260" y="216.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Bowles and Gintis: labour power; two or three correspondences; myth of</text><text x="260" y="237.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">meritocracy</text><line x1="130" y1="252" x2="130" y2="264" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="264" width="200" height="60" rx="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="130" y="301" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Partly for</text><rect x="244" y="264" width="626" height="60" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="260" y="298.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Willis: resistance, yet the outcome still suited manual work</text><line x1="130" y1="324" x2="130" y2="336" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="336" width="200" height="60" rx="12" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="130" y="373" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Against</text><rect x="244" y="336" width="626" height="60" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="260" y="370.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Functionalists: Durkheim and Parsons: skills, consensus, fair selection</text><line x1="130" y1="396" x2="130" y2="408" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="408" width="200" height="60" rx="12" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="130" y="445" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Widening</text><rect x="244" y="408" width="626" height="60" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="260" y="442.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Feminists: schools also serve patriarchy through the gendered curriculum</text><line x1="130" y1="468" x2="130" y2="480" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="480" width="200" height="60" rx="12" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="130" y="517" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Evaluation</text><rect x="244" y="480" width="626" height="60" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="260" y="514.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">1970s American evidence; modern jobs value creativity; pupils are active</text><line x1="130" y1="540" x2="130" y2="552" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="552" width="200" height="60" rx="12" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="130" y="589" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Judgement</text><rect x="244" y="552" width="626" height="60" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="260" y="586.7" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Capitalism is one of several interests served, not the only one</text>
</svg>