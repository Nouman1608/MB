<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 636" width="900" height="636" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="636" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Arabia before Islam</text>

<rect x="30" y="110" width="414" height="202" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="52" y="148" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Religious</text><circle cx="58" cy="178" r="5" fill="#1e2a44"/><text x="72" y="184" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Most Arabs worshipped many idols, kept in</text><text x="72" y="206" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and around the Ka'ba</text><circle cx="58" cy="232" r="5" fill="#1e2a44"/><text x="72" y="238" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Also recognised a high god</text><circle cx="58" cy="264" r="5" fill="#1e2a44"/><text x="72" y="270" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Jewish and Christian communities; a few</text><text x="72" y="292" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">hanifs</text><rect x="456" y="110" width="414" height="202" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="478" y="148" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Political</text><circle cx="484" cy="178" r="5" fill="#1e2a44"/><text x="498" y="184" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">No central state</text><circle cx="484" cy="210" r="5" fill="#1e2a44"/><text x="498" y="216" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Tribes and clans ruled themselves</text><circle cx="484" cy="242" r="5" fill="#1e2a44"/><text x="498" y="248" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The Quraysh controlled Makka and its</text><text x="498" y="270" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">trade</text><rect x="30" y="326" width="414" height="202" rx="14" fill="#f3dccd" stroke="#b5602e" stroke-width="2.5"/><text x="52" y="364" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Moral and social</text><circle cx="58" cy="394" r="5" fill="#1e2a44"/><text x="72" y="400" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Blood feuds, drinking, gambling and</text><text x="72" y="422" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">lending at interest</text><circle cx="58" cy="448" r="5" fill="#1e2a44"/><text x="72" y="454" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Some infant daughters buried alive</text><circle cx="58" cy="480" r="5" fill="#1e2a44"/><text x="72" y="486" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Women and slaves had few rights</text><rect x="456" y="326" width="414" height="202" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="364" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="start">Valued too</text><circle cx="484" cy="394" r="5" fill="#1e2a44"/><text x="498" y="400" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Hospitality</text><circle cx="484" cy="426" r="5" fill="#1e2a44"/><text x="498" y="432" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Courage</text><circle cx="484" cy="458" r="5" fill="#1e2a44"/><text x="498" y="464" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Poetry</text><rect x="30" y="548" width="840" height="64" rx="14" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><text x="450" y="588" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Muslims call this period Jahiliya, the age of ignorance.</text>
</svg>