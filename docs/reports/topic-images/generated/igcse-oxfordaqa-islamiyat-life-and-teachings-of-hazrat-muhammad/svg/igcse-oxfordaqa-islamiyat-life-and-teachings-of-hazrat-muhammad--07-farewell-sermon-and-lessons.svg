<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="610" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Farewell Sermon and lessons for today</text>

<rect x="30" y="110" width="840" height="60" rx="14" fill="#1e2a44" stroke="#1e2a44" stroke-width="0"/><text x="450" y="148" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">Key teachings of the Farewell Sermon</text><rect x="30" y="186" width="272" height="90" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="166" y="225.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Sanctity of life, property</text><text x="166" y="247.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">and honour</text><rect x="314" y="186" width="272" height="90" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="450" y="214.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Equality: no Arab superior</text><text x="450" y="236.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">to a non-Arab except by</text><text x="450" y="258.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">piety</text><rect x="598" y="186" width="272" height="90" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="734" y="236.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">The rights of women</text><rect x="172" y="290" width="272" height="90" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="308" y="329.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">An end to interest and</text><text x="308" y="351.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">blood feuds</text><rect x="456" y="290" width="272" height="90" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="592" y="340.95" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Hold fast to the Qur'an</text><rect x="30" y="418" width="840" height="60" rx="14" fill="#2e6b62" stroke="#2e6b62" stroke-width="0"/><text x="450" y="456" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">Lessons from his life</text><rect x="30" y="494" width="201" height="92" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="130" y="532" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Kindness to parents</text><text x="130" y="560" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">(17.23)</text><rect x="243" y="494" width="201" height="92" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="343" y="532" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Justice</text><text x="343" y="560" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">even against oneself</text><rect x="456" y="494" width="201" height="92" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="556" y="532" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Honesty</text><text x="556" y="560" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">in trade and speech</text><rect x="669" y="494" width="201" height="92" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="769" y="532" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Patience</text><text x="769" y="560" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="middle">in hardship, as at Ta'if</text>
</svg>