<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 564" width="900" height="564" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="564" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The first revelation</text>

<rect x="30" y="112" width="230" height="92" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="145" y="164.65" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Cave of Hira</text><rect x="270" y="112" width="600" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="290" y="164" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">From about forty, he withdrew here to reflect.</text><line x1="145" y1="206" x2="145" y2="220" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="224" width="230" height="92" rx="14" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2.5"/><text x="145" y="276.65" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">610 CE, Ramadan</text><rect x="270" y="224" width="600" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="290" y="265" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Jibril (AS) commands "Read!" (Iqra) and, after pressing him three</text><text x="290" y="287" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">times, recites the first verses of Sura 96.</text><line x1="145" y1="318" x2="145" y2="332" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="336" width="230" height="92" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="145" y="388.65" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Home</text><rect x="270" y="336" width="600" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="290" y="377" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Shaken, he asks Khadija to cover him. She reassures him and</text><text x="290" y="399" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">becomes the first to accept Islam.</text><line x1="145" y1="430" x2="145" y2="444" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="448" width="230" height="92" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="145" y="500.65" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Waraqa ibn Nawfal</text><rect x="270" y="448" width="600" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="290" y="489" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The same angel who came to Musa (AS) has come to him; his people</text><text x="290" y="511" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">will drive him out.</text>
</svg>