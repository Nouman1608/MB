<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 654" width="900" height="654" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="654" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Opposition in Makkah</text>

<rect x="30" y="110" width="330" height="520" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Why they opposed him</text><circle cx="60" cy="180" r="5" fill="#b5602e"/><text x="74" y="186" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Attacked the idols that</text><text x="74" y="208" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Makkah's pilgrimage trade</text><text x="74" y="230" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">depended on</text><circle cx="60" cy="264" r="5" fill="#b5602e"/><text x="74" y="270" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Threatened leaders' power: all</text><text x="74" y="292" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">equal before Allah</text><circle cx="60" cy="326" r="5" fill="#b5602e"/><text x="74" y="332" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Challenged ancestral religion</text><text x="74" y="354" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">and tribal custom</text><circle cx="60" cy="388" r="5" fill="#b5602e"/><text x="74" y="394" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Resurrection and judgement were</text><text x="74" y="416" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">mocked</text><rect x="390" y="110" width="480" height="76" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="410" y="156" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Mockery</text><rect x="390" y="198" width="480" height="76" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="410" y="228" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Persecution</text><text x="410" y="255" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">weaker Muslims tortured; some migrate to Abyssinia</text><rect x="390" y="286" width="480" height="76" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="410" y="316" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Boycott of Banu Hashim</text><text x="410" y="343" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">about three years confined to a valley</text><rect x="390" y="374" width="480" height="76" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="410" y="404" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Year of Sorrow</text><text x="410" y="431" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Khadija and Abu Talib die</text><rect x="390" y="462" width="480" height="76" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="410" y="492" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Ta'if</text><text x="410" y="519" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">rejected and stoned; he prays for its people</text><rect x="390" y="550" width="480" height="76" rx="12" fill="#f3dccd" stroke="#b5602e" stroke-width="2.5"/><text x="410" y="580" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Plot to kill him</text><text x="410" y="607" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a young man from each clan</text><path d="M376,130 L376,600" fill="none" stroke="#b5602e" stroke-width="4" stroke-linejoin="round" marker-end="url(#ahR)"/><rect x="46" y="470" width="298" height="144" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="62" y="500" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">At Ta'if he prayed for its</text><text x="62" y="523" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">people rather than for</text><text x="62" y="546" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">their punishment: a lesson</text><text x="62" y="569" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="start">in patience.</text>
</svg>