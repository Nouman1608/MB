<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 614" width="900" height="614" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="614" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Early life: from orphan to al-Amin</text>

<line x1="210" y1="132" x2="210" y2="566" stroke="#1e2a44" stroke-width="4"/><text x="188" y="138" font-size="17" font-weight="700" fill="#4a5568" text-anchor="end">before birth</text><circle cx="210" cy="132" r="9" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="234" y="107" width="636" height="50" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="252" y="138" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Father Abdullah dies</text><text x="188" y="200" font-size="17" font-weight="700" fill="#4a5568" text-anchor="end">c. 570</text><circle cx="210" cy="194" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><rect x="234" y="169" width="636" height="50" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="252" y="200" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Born in Makka, the Year of the Elephant, into Banu Hashim of Quraysh</text><text x="188" y="262" font-size="17" font-weight="700" fill="#4a5568" text-anchor="end">infancy</text><circle cx="210" cy="256" r="9" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="234" y="231" width="636" height="50" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="252" y="262" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Nursed in the desert by Halima Sa'diya of the Banu Sa'd</text><text x="188" y="324" font-size="17" font-weight="700" fill="#4a5568" text-anchor="end">about 6</text><circle cx="210" cy="318" r="9" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="234" y="293" width="636" height="50" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="252" y="324" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Mother Amina dies; grandfather Abdul Muttalib cares for him</text><text x="188" y="386" font-size="17" font-weight="700" fill="#4a5568" text-anchor="end">two years later</text><circle cx="210" cy="380" r="9" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="234" y="355" width="636" height="50" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="252" y="386" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Abdul Muttalib dies; uncle Abu Talib raises him</text><text x="188" y="448" font-size="17" font-weight="700" fill="#4a5568" text-anchor="end">youth</text><circle cx="210" cy="442" r="9" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><rect x="234" y="417" width="636" height="50" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="252" y="448" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Syria journey with Abu Talib: the monk Bahira advises protecting him</text><text x="188" y="510" font-size="17" font-weight="700" fill="#4a5568" text-anchor="end">young man</text><circle cx="210" cy="504" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><rect x="234" y="479" width="636" height="50" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="252" y="510" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Shepherd and trader; known as al-Amin and al-Sadiq; Hilf al-Fudul</text><text x="188" y="572" font-size="17" font-weight="700" fill="#4a5568" text-anchor="end">about 25</text><circle cx="210" cy="566" r="9" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><rect x="234" y="541" width="636" height="50" rx="10" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="252" y="572" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Marries Hazrat Khadija (RA) after managing her trade</text>
</svg>