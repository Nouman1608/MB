<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Battles, treaties and events, 624–632</text>

<rect x="640" y="348" width="95" height="18" rx="4" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2"/><text x="652" y="390" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">Aam ul Wufood 630–631</text><line x1="50" y1="300" x2="850" y2="300" stroke="#1e2a44" stroke-width="4"/><line x1="70" y1="292" x2="70" y2="308" stroke="#1e2a44" stroke-width="2.5"/><line x1="165" y1="292" x2="165" y2="308" stroke="#1e2a44" stroke-width="2.5"/><line x1="260" y1="292" x2="260" y2="308" stroke="#1e2a44" stroke-width="2.5"/><line x1="355" y1="292" x2="355" y2="308" stroke="#1e2a44" stroke-width="2.5"/><line x1="450" y1="292" x2="450" y2="308" stroke="#1e2a44" stroke-width="2.5"/><line x1="545" y1="292" x2="545" y2="308" stroke="#1e2a44" stroke-width="2.5"/><line x1="640" y1="292" x2="640" y2="308" stroke="#1e2a44" stroke-width="2.5"/><line x1="735" y1="292" x2="735" y2="308" stroke="#1e2a44" stroke-width="2.5"/><line x1="830" y1="292" x2="830" y2="308" stroke="#1e2a44" stroke-width="2.5"/><line x1="70" y1="292" x2="70" y2="162" stroke="#2e6b62" stroke-width="2.5"/><circle cx="70" cy="300" r="7" fill="#2e6b62"/><text x="78" y="132" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Badr</text><text x="78" y="154" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">victory</text><line x1="165" y1="292" x2="165" y2="234" stroke="#b5602e" stroke-width="2.5"/><circle cx="165" cy="300" r="7" fill="#b5602e"/><text x="173" y="204" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Uhud</text><text x="173" y="226" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">losses; Hamza martyred</text><line x1="355" y1="292" x2="355" y2="162" stroke="#2e6b62" stroke-width="2.5"/><circle cx="355" cy="300" r="7" fill="#2e6b62"/><text x="363" y="132" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Trench</text><text x="363" y="154" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">siege fails</text><line x1="450" y1="292" x2="450" y2="234" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="450" cy="300" r="7" fill="#8a6d0d"/><text x="458" y="204" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="start">Hudaibiyah</text><text x="458" y="226" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">ten-year truce</text><line x1="450" y1="308" x2="450" y2="424" stroke="#2e6b62" stroke-width="2.5"/><circle cx="450" cy="300" r="7" fill="#2e6b62"/><text x="458" y="450" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Khaibar</text><text x="458" y="472" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">oasis taken</text><line x1="640" y1="292" x2="640" y2="162" stroke="#2e6b62" stroke-width="2.5"/><circle cx="640" cy="300" r="7" fill="#2e6b62"/><text x="648" y="132" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Makkah</text><text x="648" y="154" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">conquest; amnesty</text><line x1="640" y1="308" x2="640" y2="424" stroke="#2e6b62" stroke-width="2.5"/><circle cx="640" cy="300" r="7" fill="#2e6b62"/><text x="648" y="450" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Hunayn</text><text x="648" y="472" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">retreat, then victory</text><line x1="830" y1="292" x2="830" y2="234" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="830" cy="300" r="7" fill="#8a6d0d"/><text x="822" y="204" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="end">Farewell</text><text x="822" y="226" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="end">Pilgrimage and Sermon</text><text x="70" y="332" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle" stroke="#f4f6f6" stroke-width="7" paint-order="stroke">624</text><text x="165" y="332" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle" stroke="#f4f6f6" stroke-width="7" paint-order="stroke">625</text><text x="260" y="332" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle" stroke="#f4f6f6" stroke-width="7" paint-order="stroke">626</text><text x="355" y="332" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle" stroke="#f4f6f6" stroke-width="7" paint-order="stroke">627</text><text x="450" y="284" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle" stroke="#f4f6f6" stroke-width="7" paint-order="stroke">628</text><text x="545" y="332" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle" stroke="#f4f6f6" stroke-width="7" paint-order="stroke">629</text><text x="640" y="284" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle" stroke="#f4f6f6" stroke-width="7" paint-order="stroke">630</text><text x="735" y="332" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle" stroke="#f4f6f6" stroke-width="7" paint-order="stroke">631</text><text x="830" y="332" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle" stroke="#f4f6f6" stroke-width="7" paint-order="stroke">632</text><rect x="30" y="520" width="840" height="64" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="560" font-size="18" font-weight="400" fill="#4a5568" text-anchor="middle">He died in Madinah later in 632.</text>
