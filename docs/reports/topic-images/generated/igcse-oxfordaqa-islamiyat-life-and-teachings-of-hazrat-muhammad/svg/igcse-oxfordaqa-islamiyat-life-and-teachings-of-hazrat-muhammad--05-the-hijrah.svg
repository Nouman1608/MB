<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 712" width="900" height="712" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="712" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Hijrah to Madinah</text>

<circle cx="60" cy="165" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="172.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="94" y="112" width="776" height="106" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="114" y="144" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Pledges of Aqaba</text><text x="114" y="172" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Men from Yathrib promise to worship one God and protect the Prophet (pbuh); Muslims begin to</text><text x="114" y="192" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">migrate.</text><circle cx="60" cy="283" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="290.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="94" y="230" width="776" height="106" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="114" y="262" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Night of the plot</text><text x="114" y="290" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Hazrat Ali (RA) sleeps in the Prophet's bed; the Prophet leaves with Hazrat Abu Bakr (RA),</text><text x="114" y="310" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">who has prepared camels.</text><circle cx="60" cy="391" r="20" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="398.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="94" y="348" width="776" height="86" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="114" y="380" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Cave of Thawr</text><text x="114" y="408" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">They hide before travelling on to Madinah.</text><circle cx="60" cy="489" r="20" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="496.2" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="94" y="446" width="776" height="86" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="114" y="478" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Madinah, 622 CE</text><text x="114" y="506" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">First year of the Islamic calendar.</text><text x="450" y="570" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">On arrival in Madinah</text><rect x="30" y="588" width="160" height="100" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="110" y="633.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Mosque built at</text><text x="110" y="653.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Quba</text><rect x="200" y="588" width="160" height="100" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="280" y="623.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Stays with Abu</text><text x="280" y="643.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Ayyub Ansari</text><text x="280" y="663.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">(RA)</text><rect x="370" y="588" width="160" height="100" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="633.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">The Prophet's</text><text x="450" y="653.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Mosque built</text><rect x="540" y="588" width="160" height="100" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="620" y="623.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Each Muhajir</text><text x="620" y="643.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">paired with an</text><text x="620" y="663.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Ansari</text><rect x="710" y="588" width="160" height="100" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="790" y="623.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Charter of</text><text x="790" y="643.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">Madinah: one</text><text x="790" y="663.6" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">community</text>
</svg>