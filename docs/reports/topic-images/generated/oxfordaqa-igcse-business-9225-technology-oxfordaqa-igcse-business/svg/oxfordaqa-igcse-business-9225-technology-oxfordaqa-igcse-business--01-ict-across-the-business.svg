<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" width="900" height="710" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="710" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How ICT changes each part of a business</text>

<text x="130" y="130" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">Area</text><text x="430" y="130" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">How ICT changes the activity</text><text x="735" y="130" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Likely effect</text><rect x="30" y="146" width="200" height="94" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="130" y="195.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Operations</text><line x1="232" y1="193" x2="258" y2="193" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="262" y="146" width="336" height="94" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="280" y="184.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Computerised stock systems record</text><text x="280" y="205.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">each sale and reorder automatically</text><line x1="600" y1="193" x2="626" y2="193" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="630" y="146" width="240" height="94" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="648" y="184.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Fewer stock-outs; less</text><text x="648" y="205.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">money tied up in stock</text><rect x="30" y="256" width="200" height="94" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="130" y="305.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Marketing</text><line x1="232" y1="303" x2="258" y2="303" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="262" y="256" width="336" height="94" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="280" y="294.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Websites and social media target</text><text x="280" y="315.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">chosen groups and show who responds</text><line x1="600" y1="303" x2="626" y2="303" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="630" y="256" width="240" height="94" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="648" y="294.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Cheaper, better-targeted</text><text x="648" y="315.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">promotion</text><rect x="30" y="366" width="200" height="94" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="130" y="415.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Human resources</text><line x1="232" y1="413" x2="258" y2="413" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="262" y="366" width="336" height="94" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="280" y="404.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Jobs advertised online; video</text><text x="280" y="425.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">training; some staff work from home</text><line x1="600" y1="413" x2="626" y2="413" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="630" y="366" width="240" height="94" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="648" y="404.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Wider pool of applicants;</text><text x="648" y="425.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">lower office costs</text><rect x="30" y="476" width="200" height="94" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="130" y="525.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Finance</text><line x1="232" y1="523" x2="258" y2="523" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="262" y="476" width="336" height="94" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="280" y="514.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Online banking and card or app</text><text x="280" y="535.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">payments</text><line x1="600" y1="523" x2="626" y2="523" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="630" y="476" width="240" height="94" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="648" y="514.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Faster payments, less</text><text x="648" y="535.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cash handling</text><rect x="30" y="586" width="200" height="94" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="130" y="623.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Customer</text><text x="130" y="648.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">service</text><line x1="232" y1="633" x2="258" y2="633" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="262" y="586" width="336" height="94" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="280" y="624.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Online order tracking, live chat,</text><text x="280" y="645.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">email replies</text><line x1="600" y1="633" x2="626" y2="633" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="630" y="586" width="240" height="94" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="648" y="624.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Customers helped outside</text><text x="648" y="645.2" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">opening hours</text>
</svg>