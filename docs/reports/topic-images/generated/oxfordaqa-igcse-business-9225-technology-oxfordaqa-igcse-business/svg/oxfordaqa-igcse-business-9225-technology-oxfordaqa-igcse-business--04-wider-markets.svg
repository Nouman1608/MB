<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" width="900" height="710" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="710" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How e-commerce widens a market</text>

<rect x="30" y="110" width="270" height="330" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165" y="146" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Location</text><circle cx="165" cy="250" r="44" fill="none" stroke="#4a5568" stroke-width="2" stroke-dasharray="6 5"/><rect x="152" y="238" width="26" height="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><circle cx="90" cy="190" r="8" fill="#2e6b62"/><circle cx="240" cy="200" r="8" fill="#2e6b62"/><circle cx="70" cy="290" r="8" fill="#2e6b62"/><circle cx="255" cy="300" r="8" fill="#2e6b62"/><circle cx="120" cy="330" r="8" fill="#2e6b62"/><circle cx="215" cy="175" r="8" fill="#2e6b62"/><text x="50" y="372" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Anyone with a delivery</text><text x="50" y="393" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">address can buy</text><rect x="315" y="110" width="270" height="330" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="146" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Time</text><circle cx="450" cy="250" r="62" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><line x1="450" y1="250" x2="450" y2="206" stroke="#1e2a44" stroke-width="4"/><line x1="450" y1="250" x2="484" y2="262" stroke="#1e2a44" stroke-width="4"/><text x="450" y="342" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">24 hours a day</text><text x="335" y="372" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The website takes orders</text><text x="335" y="393" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">while the business is closed</text><rect x="600" y="110" width="270" height="330" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="735" y="146" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Niche markets</text><rect x="604" y="154" width="72" height="52" rx="8" fill="#dce9e7" stroke="#c9d6d4" stroke-width="1.5"/><circle cx="640" cy="180" r="8" fill="#2e6b62"/><rect x="699" y="154" width="72" height="52" rx="8" fill="#dce9e7" stroke="#c9d6d4" stroke-width="1.5"/><circle cx="735" cy="180" r="8" fill="#2e6b62"/><rect x="794" y="154" width="72" height="52" rx="8" fill="#dce9e7" stroke="#c9d6d4" stroke-width="1.5"/><circle cx="830" cy="180" r="8" fill="#2e6b62"/><rect x="604" y="224" width="72" height="52" rx="8" fill="#dce9e7" stroke="#c9d6d4" stroke-width="1.5"/><circle cx="640" cy="250" r="8" fill="#2e6b62"/><rect x="699" y="224" width="72" height="52" rx="8" fill="#dce9e7" stroke="#c9d6d4" stroke-width="1.5"/><circle cx="735" cy="250" r="8" fill="#2e6b62"/><rect x="794" y="224" width="72" height="52" rx="8" fill="#dce9e7" stroke="#c9d6d4" stroke-width="1.5"/><circle cx="830" cy="250" r="8" fill="#2e6b62"/><line x1="735" y1="286" x2="735" y2="316" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="735" y="342" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">enough buyers in total</text><text x="620" y="372" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A few buyers in each town</text><text x="620" y="393" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">add up across a country</text><rect x="30" y="460" width="840" height="220" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="56" y="496" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">But e-commerce brings costs and risks</text><rect x="56" y="516" width="384" height="68" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="72" y="544" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Website, secure payments, packaging,</text><text x="72" y="565" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">delivery and returns</text><rect x="460" y="516" width="384" height="68" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="476" y="544" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Customers compare prices instantly:</text><text x="476" y="565" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">stronger competition</text><rect x="56" y="596" width="384" height="68" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="72" y="624" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Systems can be attacked or fail; lost data</text><text x="72" y="645" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">damages reputation</text><rect x="460" y="596" width="384" height="68" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2"/><text x="476" y="636" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Delivery abroad can be slower and cost more</text>
</svg>