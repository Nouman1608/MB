<rect width="900" height="600" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two forms of e-commerce</text>

<rect x="30" y="110" width="840" height="220" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="148" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Business to consumer (B2C)</text><rect x="56" y="174" width="220" height="110" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="166" y="231.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">A business</text><line x1="280" y1="229" x2="590" y2="229" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="435" y="214" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">website, app or online marketplace</text><rect x="594" y="174" width="250" height="110" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="719" y="231.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Households</text><text x="56" y="312" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Sells to individual customers</text><rect x="30" y="350" width="840" height="220" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="388" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="start">Business to business (B2B)</text><rect x="56" y="414" width="220" height="110" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="166" y="471.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">A wholesaler</text><line x1="280" y1="469" x2="590" y2="469" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><text x="435" y="454" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">online ordering portal</text><rect x="594" y="414" width="250" height="110" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="719" y="471.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Shop customers</text><text x="56" y="552" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">e.g. shops reorder stock through the wholesaler’s portal</text>
</svg>