<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="680" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Analysing e-commerce: two chains</text>

<text x="450" y="126" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="middle" font-style="italic">Saffron Lane sells spice blends from one market stall</text><text x="56" y="166" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Chain 1: place</text><rect x="30" y="182" width="255" height="150" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="212" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Current limit</text><text x="48" y="239" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Only people who visit the</text><text x="48" y="260" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">stall in one town can buy</text><line x1="287" y1="257" x2="313" y2="257" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="315" y="182" width="255" height="150" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="333" y="212" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Link to e-commerce</text><text x="333" y="239" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A website delivering</text><text x="333" y="260" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">nationwide reaches distant</text><text x="333" y="281" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">cooks</text><line x1="572" y1="257" x2="598" y2="257" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="600" y="182" width="255" height="150" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="618" y="212" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Effect (product detail)</text><text x="618" y="239" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Light blends that do not</text><text x="618" y="260" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">go off are cheap to</text><text x="618" y="281" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">deliver, so sales revenue</text><text x="618" y="302" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rises</text><text x="56" y="376" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Chain 2: time</text><rect x="30" y="392" width="255" height="150" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="422" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Current limit</text><text x="48" y="449" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sales only happen on</text><text x="48" y="470" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">market days</text><line x1="287" y1="467" x2="313" y2="467" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="315" y="392" width="255" height="150" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="333" y="422" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Link to e-commerce</text><text x="333" y="449" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The website takes orders</text><text x="333" y="470" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">while the stall is closed</text><line x1="572" y1="467" x2="598" y2="467" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="600" y="392" width="255" height="150" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="618" y="422" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Effect</text><text x="618" y="449" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Sales are no longer</text><text x="618" y="470" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">limited to market days</text><rect x="30" y="580" width="840" height="70" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="622" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Each point is followed through to an effect, using details of the product.</text>
</svg>