<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 779" width="900" height="779" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="779" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Matching the method to the message</text>

<text x="155" y="130" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">If the message is…</text><text x="445" y="130" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Use</text><text x="730" y="130" font-size="17" font-weight="700" fill="#4a5568" text-anchor="middle">Why</text><rect x="30" y="146" width="250" height="80" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="175.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Same information for</text><text x="48" y="198.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">many people</text><line x1="282" y1="186" x2="312" y2="186" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="316" y="146" width="258" height="80" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="445" y="176.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Email or website</text><text x="445" y="200.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">update</text><rect x="590" y="146" width="280" height="80" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="608" y="177.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Cheap, fast, reaches everyone</text><text x="608" y="198.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">at once</text><rect x="30" y="242" width="250" height="80" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="271.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Needs discussion and</text><text x="48" y="294.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">quick decisions</text><line x1="282" y1="282" x2="312" y2="282" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="316" y="242" width="258" height="80" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="445" y="284.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Video conferencing</text><rect x="590" y="242" width="280" height="80" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="608" y="273.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">See each other, share</text><text x="608" y="294.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">documents, respond at once</text><rect x="30" y="338" width="250" height="80" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="378.7" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Needs a written record</text><line x1="282" y1="378" x2="312" y2="378" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="316" y="338" width="258" height="80" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="445" y="380.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Email</text><rect x="590" y="338" width="280" height="80" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="608" y="369.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Both sides keep a copy of</text><text x="608" y="390.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">what was agreed</text><rect x="30" y="434" width="250" height="80" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="474.7" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Short and urgent</text><line x1="282" y1="474" x2="312" y2="474" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="316" y="434" width="258" height="80" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="445" y="476.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Messaging app or text</text><rect x="590" y="434" width="280" height="80" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="608" y="475.7" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Read quickly on a phone</text><rect x="30" y="530" width="250" height="80" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="559.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">For the public or local</text><text x="48" y="582.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">community</text><line x1="282" y1="570" x2="312" y2="570" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="316" y="530" width="258" height="80" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="445" y="560.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Website or social</text><text x="445" y="584.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">media</text><rect x="590" y="530" width="280" height="80" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="608" y="571.7" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Anyone can see it at any time</text><rect x="30" y="640" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="680" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Fast and cheap, but not perfect</text><text x="56" y="707" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Needs reliable equipment and internet; messages can be misunderstood without tone of voice;</text><text x="56" y="730" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">some stakeholders, such as older customers, may prefer face-to-face contact.</text>
</svg>