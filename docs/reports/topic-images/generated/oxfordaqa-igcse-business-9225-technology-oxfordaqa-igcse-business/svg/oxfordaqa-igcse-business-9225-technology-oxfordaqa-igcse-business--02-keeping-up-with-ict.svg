<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="520" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Changing ICT: keeping up</text>

<rect x="30" y="110" width="840" height="90" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="146" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">ICT keeps changing</text><text x="450" y="178" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">so a business must keep investing in equipment and software and training staff</text><line x1="80" y1="270" x2="820" y2="270" stroke="#1e2a44" stroke-width="4"/><line x1="450" y1="270" x2="90" y2="270" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="450" y1="270" x2="810" y2="270" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><circle cx="450" cy="270" r="13" fill="#2e6b62" stroke="#1e2a44" stroke-width="3"/><text x="80" y="250" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Too slow</text><text x="820" y="250" font-size="19" font-weight="700" fill="#b5602e" text-anchor="end">Too fast</text><text x="450" y="310" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">keep up</text><rect x="30" y="340" width="400" height="150" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="380" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Does not keep up</text><text x="48" y="413" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">May lose customers to rivals who offer</text><text x="48" y="436" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">faster ordering or better online service</text><rect x="470" y="340" width="400" height="150" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="488" y="380" font-size="20" font-weight="700" fill="#b5602e" text-anchor="start">Adopts new ICT too quickly</text><text x="488" y="413" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">May spend money on systems its customers</text><text x="488" y="436" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">do not yet use</text>
</svg>