<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 799" width="900" height="799" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="799" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Corrigan Wholesale: phone or online orders?</text>

<rect x="30" y="110" width="470" height="520" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="146" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Monthly cost of handling 1,200 orders</text><line x1="120" y1="560" x2="480" y2="560" stroke="#c9d6d4" stroke-width="1.5"/><text x="110" y="566" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$0</text><line x1="120" y1="467.5" x2="480" y2="467.5" stroke="#c9d6d4" stroke-width="1.5"/><text x="110" y="473.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$1,000</text><line x1="120" y1="375" x2="480" y2="375" stroke="#c9d6d4" stroke-width="1.5"/><text x="110" y="381" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$2,000</text><line x1="120" y1="282.5" x2="480" y2="282.5" stroke="#c9d6d4" stroke-width="1.5"/><text x="110" y="288.5" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$3,000</text><line x1="120" y1="190" x2="480" y2="190" stroke="#c9d6d4" stroke-width="1.5"/><text x="110" y="196" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$4,000</text><rect x="160" y="227" width="120" height="333" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><rect x="330" y="504.5" width="120" height="55.5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><rect x="330" y="402.75" width="120" height="101.75" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="390" y="538.25" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">staff $600</text><text x="390" y="459.625" font-size="15" font-weight="600" fill="#1e2a44" text-anchor="middle">portal $1,100</text><text x="220" y="217" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">$3,600</text><text x="390" y="392.75" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">$1,700</text><line x1="120" y1="560" x2="480" y2="560" stroke="#1e2a44" stroke-width="2.5"/><text x="220" y="588" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Phone orders</text><text x="390" y="588" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Online portal</text><rect x="520" y="110" width="350" height="125" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="540" y="142" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Phone: 12 minutes an order</text><text x="540" y="172" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">1,200 × 12 = 14,400 min = 240 h</text><text x="540" y="197" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">240 × $15 = $3,600</text><rect x="520" y="250" width="350" height="125" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="540" y="282" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Online: 2 minutes an order</text><text x="540" y="312" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">1,200 × 2 = 2,400 min = 40 h</text><text x="540" y="337" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">40 × $15 = $600</text><rect x="520" y="390" width="350" height="100" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="540" y="422" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Staff cost saved</text><text x="540" y="452" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">$3,600 − $600 = $3,000</text><rect x="520" y="505" width="350" height="125" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="540" y="537" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Net saving after portal</text><text x="540" y="567" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">$3,000 − $1,100</text><text x="540" y="592" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">= $1,900 a month</text><rect x="30" y="660" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="700" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">The saving only happens if shopkeepers use the portal.</text><text x="56" y="727" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Corrigan may need to train customers, keep a phone line for those who will not switch, and</text><text x="56" y="750" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">redeploy the staff time released.</text>
</svg>