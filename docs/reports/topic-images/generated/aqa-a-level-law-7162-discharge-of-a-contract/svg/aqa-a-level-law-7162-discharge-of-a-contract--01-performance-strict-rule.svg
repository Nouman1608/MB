<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 538" width="900" height="538" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="538" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Performance: complete and exact</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">The traditional rule, and how far substantial performance softens it</text>
<rect x="30" y="124" width="412" height="154" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRICT RULE</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Cutter v Powell (1795)</text><text x="50" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Sailor died before the voyage from Jamaica to</text><text x="50" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Liverpool ended: an entire contract, so his</text><text x="50" y="253.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">widow recovered nothing</text><rect x="458" y="124" width="412" height="154" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="478" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STRICT RULE</text><text x="478" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Re Moore and Landauer (1921)</text><text x="478" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Some tins packed 24 to a case, not 30; same</text><text x="478" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">total and value, yet the whole consignment could</text><text x="478" y="253.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">be rejected</text><text x="40" y="318" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Hoenig v Isaacs (1952): substantial performance</text><rect x="40" y="330" width="820" height="50" rx="8" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><rect x="798.7733333333333" y="330" width="61.22666666666667" height="50" rx="8" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="419.38666666666666" y="361" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">price paid, less the cost of putting right the defects</text><text x="860" y="404" font-size="15" font-weight="600" fill="#b5602e" text-anchor="end">defects about £56 on a £750 contract (bar to scale)</text><text x="40" y="440" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Bolton v Mahadeva (1972): not substantial</text><rect x="40" y="452" width="820" height="50" rx="8" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-dasharray="8 6"/><text x="450" y="483" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">nothing payable: heating gave out fumes and heated poorly</text>
</svg>