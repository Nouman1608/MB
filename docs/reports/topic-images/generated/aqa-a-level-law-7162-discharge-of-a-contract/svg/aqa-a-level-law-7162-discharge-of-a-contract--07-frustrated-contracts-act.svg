<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 337" width="900" height="337" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="337" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">After frustration: the 1943 Act</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">At common law the contract ends automatically from the moment of frustration</text>
<rect x="30" y="124" width="412" height="181" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SECTION 1(2): MONEY</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Paid: recoverable. Payable: no longer</text><text x="50" y="206.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">payable</text><text x="50" y="236.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The court may let the payee keep or recover</text><text x="50" y="258.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">a sum for expenses, up to the amount paid or</text><text x="50" y="280.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">payable before frustration</text><rect x="458" y="124" width="412" height="181" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="478" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SECTION 1(3): OTHER BENEFITS</text><text x="478" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">A valuable benefit other than money</text><text x="478" y="212.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The recipient may be ordered to pay a just</text><text x="478" y="234.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">sum for it (<tspan font-style="italic">BP</tspan> <tspan font-style="italic">Exploration</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Hunt</tspan> <tspan font-style="italic">(No</tspan> <tspan font-style="italic">2)</tspan>)</text>
</svg>