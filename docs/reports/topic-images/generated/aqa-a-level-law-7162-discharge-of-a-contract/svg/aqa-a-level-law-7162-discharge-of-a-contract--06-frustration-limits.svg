<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 572" width="900" height="572" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="572" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Not frustrated: the doctrine is narrow</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Parties are expected to allocate risk themselves</text>
<text x="40" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Davis Contractors: labour shortages, more time and cost</text><rect x="40" y="154" width="273.3333333333333" height="34" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="50" y="177" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">planned: 8 months</text><rect x="40" y="196" width="751.6666666666666" height="34" rx="6" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="50" y="219" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">actual: 22 months, still not frustrated</text><rect x="30" y="256" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="288" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">HARDER OR DEARER</text><text x="50" y="314.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Tsakiroglou v Noblee Thorl (1962)</text><text x="50" y="342.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Suez Canal closed; longer route round the Cape</text><rect x="457" y="256" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="288" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PURPOSE NOT WHOLLY DEFEATED</text><text x="477" y="314.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Herne Bay Steam Boat v Hutton (1903)</text><text x="477" y="342.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Review cancelled but the fleet could still be</text><text x="477" y="363.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">seen; contrast <tspan font-style="italic">Krell</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Henry</tspan></text><rect x="30" y="406" width="413" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="438" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SELF-INDUCED</text><text x="50" y="464.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Maritime National Fish (1935); The Super</text><text x="50" y="487.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Servant Two (1990)</text><text x="50" y="515.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The party chose which contract to perform</text><rect x="457" y="406" width="413" height="134" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="438" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PROVIDED FOR</text><text x="477" y="464.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Foreseen risks and express clauses</text><text x="477" y="492.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">A force majeure clause governs instead</text>
</svg>