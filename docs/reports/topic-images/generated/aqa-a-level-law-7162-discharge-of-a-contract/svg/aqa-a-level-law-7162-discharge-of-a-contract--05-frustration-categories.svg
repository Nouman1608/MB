<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 481" width="900" height="481" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="481" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">When is a contract frustrated?</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">After formation, without fault: performance impossible, illegal or radically different</text>
<rect x="30" y="124" width="272" height="143" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DESTRUCTION</text><text x="46" y="177.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Taylor v Caldwell (1863)</text><text x="46" y="204.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Music hall burned down before</text><text x="46" y="225.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the first concert</text><rect x="314" y="124" width="272" height="143" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DEATH OR INCAPACITY</text><text x="330" y="177.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Robinson v Davison (1871)</text><text x="330" y="204.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Pianist too ill to perform. Also</text><text x="330" y="225.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Condor</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Baron</tspan> <tspan font-style="italic">Knights</tspan> (1966):</text><text x="330" y="246.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">drummer</text><rect x="598" y="124" width="272" height="143" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="614" y="152" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SUPERVENING ILLEGALITY</text><text x="614" y="177.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Metropolitan Water Board v</text><text x="614" y="198.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Dick Kerr (1918)</text><text x="614" y="225.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Wartime order stopped work</text><text x="614" y="246.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">on a reservoir</text><rect x="30" y="285" width="272" height="164" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="313" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PURPOSE DEFEATED</text><text x="46" y="338.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Krell v Henry (1903)</text><text x="46" y="365.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Room hired to watch the</text><text x="46" y="386.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">coronation procession, which</text><text x="46" y="407.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">was cancelled</text><rect x="314" y="285" width="272" height="164" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330" y="313" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LONG INTERRUPTION</text><text x="330" y="338.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Jackson v Union Marine</text><text x="330" y="359.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Insurance (1874)</text><text x="330" y="386.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Ship stranded for months:</text><text x="330" y="407.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">voyage commercially different</text><rect x="598" y="285" width="272" height="164" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="614" y="313" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">THE TEST</text><text x="614" y="338.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Davis Contractors v</text><text x="614" y="359.26" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Fareham UDC (1956)</text><text x="614" y="386.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">“A thing radically different from</text><text x="614" y="407.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">that which was undertaken by</text><text x="614" y="428.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the contract”</text>
</svg>