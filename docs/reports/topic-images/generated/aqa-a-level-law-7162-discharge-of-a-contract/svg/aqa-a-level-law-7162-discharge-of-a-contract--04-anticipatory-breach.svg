<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 477" width="900" height="477" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="477" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Anticipatory breach: accept or affirm?</text>

<line x1="50" y1="176" x2="850" y2="176" stroke="#1e2a44" stroke-width="4"/><circle cx="80" cy="176" r="12" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="80" y="152" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">contract made</text><circle cx="360" cy="176" r="12" fill="#f2e7b8" stroke="#b5602e" stroke-width="3"/><text x="360" y="152" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">repudiation</text><circle cx="780" cy="176" r="12" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="780" y="152" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">performance due</text><text x="450" y="104" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">e.g. Hochster v De la Tour: a courier told in May he would not be needed from 1 June</text><rect x="30" y="246" width="405" height="199" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="278" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">OPTION 1: ACCEPT</text><text x="50" y="304.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">End the contract and sue at once</text><text x="50" y="332.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="332.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Damages assessed by reference to the date</text><text x="65.2" y="353.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">performance was due</text><text x="50" y="378.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="378.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The duty to mitigate begins</text><text x="50" y="403.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="65.2" y="403.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Hochster</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">De</tspan> <tspan font-style="italic">la</tspan> <tspan font-style="italic">Tour</tspan>; <tspan font-style="italic">Frost</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Knight</tspan> (1872)</text><rect x="465" y="246" width="405" height="199" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="485" y="278" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">OPTION 2: AFFIRM</text><text x="485" y="304.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Wait for the date of performance</text><text x="485" y="332.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="500.2" y="332.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">White</tspan> <tspan font-style="italic">and</tspan> <tspan font-style="italic">Carter</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">McGregor</tspan> (1962):</text><text x="500.2" y="353.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">displayed the adverts, recovered the full price</text><text x="485" y="378.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">•</text><text x="500.2" y="378.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">Risk:</tspan> the contract stays alive for both. <tspan font-style="italic">Avery</tspan></text><text x="500.2" y="399.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">v</tspan> <tspan font-style="italic">Bowden</tspan> (1855): Crimean War frustrated it;</text><text x="500.2" y="420.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">claim lost</text><line x1="340" y1="196" x2="232" y2="240" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><line x1="380" y1="196" x2="668" y2="240" stroke="#8a6d0d" stroke-width="3" marker-end="url(#ahO)"/>
</svg>