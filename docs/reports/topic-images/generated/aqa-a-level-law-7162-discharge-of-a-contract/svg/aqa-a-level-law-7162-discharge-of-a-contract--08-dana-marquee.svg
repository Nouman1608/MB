<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 787" width="900" height="787" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="787" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: Dana’s marquee</text>

<rect x="30" y="100" width="840" height="133" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">FACTS</text><text x="50" y="164.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Dana hires a marquee for her wedding on 20 June for £4,000, paying a £1,000 deposit. In April the</text><text x="50" y="186.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">company says it has double-booked and will not supply. Dana affirms. On 18 June storms make the</text><text x="50" y="208.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">venue unsafe and the local authority bans all events there.</text><line x1="60" y1="275" x2="60" y2="735" stroke="#c9d6d4" stroke-width="4"/><rect x="104" y="255" width="766" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="288.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Anticipatory breach</text><text x="122" y="318.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Hochster</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">De</tspan> <tspan font-style="italic">la</tspan> <tspan font-style="italic">Tour</tspan>: she could have accepted, ended the contract and sued at once.</text><circle cx="60" cy="298" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="306.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="104" y="353" width="766" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="386.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">She affirmed</text><text x="122" y="416.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The contract stayed alive for both sides (<tspan font-style="italic">White</tspan> <tspan font-style="italic">and</tspan> <tspan font-style="italic">Carter</tspan>).</text><circle cx="60" cy="396" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="404.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="104" y="451" width="766" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="484.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Ban on events: likely frustration</text><text x="122" y="514.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">After formation, without fault, illegal or impossible (<tspan font-style="italic">Taylor</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Caldwell</tspan>; <tspan font-style="italic">Dick</tspan> <tspan font-style="italic">Kerr</tspan>).</text><circle cx="60" cy="494" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="502.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="104" y="549" width="766" height="86" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="122" y="582.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Breach claim lost</text><text x="122" y="612.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">As in <tspan font-style="italic">Avery</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Bowden</tspan>: she affirmed, then the contract was frustrated.</text><circle cx="60" cy="592" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="60" y="600.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="104" y="647" width="766" height="108" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="122" y="680.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">1943 Act s1(2)</text><text x="122" y="710.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">She recovers the £1,000 deposit, subject to the company’s allowed expenses up to that</text><text x="122" y="732.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">sum.</text><circle cx="60" cy="701" r="24" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="60" y="709.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text>
</svg>