<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 437" width="900" height="437" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="437" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Other ways round the strict rule</text>

<rect x="30" y="100" width="413" height="155" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SEVERABLE CONTRACTS</text><text x="50" y="158.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Payment for each completed stage</text><text x="50" y="186.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Contracts paid by instalment or by delivery</text><rect x="457" y="100" width="413" height="155" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ACCEPTED PARTIAL PERFORMANCE</text><text x="477" y="158.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Payment if there was a genuine choice to</text><text x="477" y="181.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">accept</text><text x="477" y="209.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Sumpter</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Hedges</tspan> (1898): no real choice over</text><text x="477" y="230.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">half-built buildings on his land, so no payment</text><rect x="30" y="273" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="305" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">PREVENTED PERFORMANCE</text><text x="50" y="331.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A reasonable sum: quantum meruit</text><text x="50" y="359.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Planché</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Colburn</tspan> (1831): author paid for work</text><text x="50" y="380.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">after the publisher abandoned the series</text><rect x="457" y="273" width="413" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="305" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TENDER OF PERFORMANCE</text><text x="477" y="331.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">A wrongly refused offer to perform counts</text><text x="477" y="359.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Startup</tspan> <tspan font-style="italic">v</tspan> <tspan font-style="italic">Macdonald</tspan> (1843): oil delivered late on</text><text x="477" y="380.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a Saturday evening, but within the agreed time</text>
</svg>