<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 612" width="900" height="612" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="612" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Discharge by breach: the innocent party’s choice</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A breach does not automatically end the contract</text>
<rect x="30" y="124" width="412" height="133" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ACTUAL BREACH</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">When performance is due</text><text x="50" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Fails to perform, performs defectively or makes</text><text x="50" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">performance impossible</text><rect x="458" y="124" width="412" height="133" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="478" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ANTICIPATORY BREACH</text><text x="478" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Before performance is due</text><text x="478" y="211.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Shows, expressly or by conduct, that they will</text><text x="478" y="232.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">not perform</text><text x="450" y="293" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Then ask: how serious is the breach?</text><rect x="30" y="317" width="405" height="129" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="349" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">REPUDIATORY BREACH</text><text x="50" y="375.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Breach of a condition, a serious breach</text><text x="50" y="398.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">of an innominate term, or a refusal to</text><text x="50" y="421.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">perform at all</text><rect x="465" y="317" width="405" height="129" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="485" y="372" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MINOR BREACH</text><text x="485" y="398.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Any other breach</text><line x1="180" y1="450" x2="120" y2="490" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="285" y1="450" x2="345" y2="490" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="668" y1="450" x2="668" y2="490" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="496" width="190" height="88" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="125" y="530.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Terminate</text><text x="125" y="559.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">and claim damages</text><rect x="245" y="496" width="190" height="88" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="340" y="530.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Affirm</text><text x="340" y="559.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">and continue</text><rect x="465" y="496" width="405" height="84" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="667.5" y="542.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Damages only</text>
</svg>