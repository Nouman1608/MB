<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 755" width="900" height="755" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="755" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: Ravi</text>

<rect x="30" y="110" width="840" height="102" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="143.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Ravi owes money to a gang. They tell him to set fire to a rival’s shop that night or they will break his</text><text x="50" y="165.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">legs; they wait outside his flat. He drinks heavily "for courage". At the shop he punches a</text><text x="50" y="187.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">passer-by he wrongly thinks is about to attack him.</text><rect x="30" y="240" width="840" height="44" rx="12" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="54" y="269" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Arson (criminal damage by fire)</text><rect x="30" y="296" width="108" height="78" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="84" y="341" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="middle">Duress</text><rect x="150" y="296" width="560" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="170" y="328.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Threat of serious injury; nominated crime (<tspan font-style="italic">Cole</tspan> satisfied); gang</text><text x="170" y="349.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">outside: immediacy arguable.</text><rect x="722" y="296" width="148" height="78" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="796" y="341" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">arguable</text><rect x="30" y="384" width="108" height="99" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="84" y="439.5" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">But</text><rect x="150" y="384" width="560" height="99" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="170" y="416.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">He owed money to a gang: if he knew or ought to have known they</text><text x="170" y="437.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">might use violence, voluntary association removes the defence</text><text x="170" y="458.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(<tspan font-style="italic">Hasan</tspan>).</text><rect x="722" y="384" width="148" height="99" rx="12" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="796" y="439.5" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">may fail</text><rect x="30" y="493" width="108" height="78" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="84" y="538" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">Drink</text><rect x="150" y="493" width="560" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="170" y="525.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Dutch courage: no defence (<tspan font-style="italic">Gallagher</tspan>); criminal damage is basic</text><text x="170" y="546.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">intent anyway (<tspan font-style="italic">Majewski</tspan>).</text><rect x="722" y="493" width="148" height="78" rx="12" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="796" y="538" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">no defence</text><rect x="30" y="591" width="840" height="44" rx="12" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="54" y="620" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Assault on the passer-by</text><rect x="30" y="647" width="108" height="78" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="84" y="692" font-size="17" font-weight="700" fill="#b5602e" text-anchor="middle">Mistake</text><rect x="150" y="647" width="560" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="170" y="679.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A drunken belief in the need for self-defence is not available</text><text x="170" y="700.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">(<tspan font-style="italic">O’Grady</tspan>; <tspan font-style="italic">Hatton</tspan>).</text><rect x="722" y="647" width="148" height="78" rx="12" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="796" y="692" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">no defence</text>
</svg>