<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 593" width="900" height="593" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="593" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The Graham test</text>

<rect x="30" y="110" width="397" height="133" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">STAGE 1: SUBJECTIVE</text><text x="50" y="169.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Was D compelled to act because they</text><text x="50" y="193.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">reasonably believed they faced death or</text><text x="50" y="217.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">serious injury?</text><line x1="433" y1="176.5" x2="467" y2="176.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="473" y="110" width="397" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="493" y="143" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">STAGE 2: OBJECTIVE</text><text x="493" y="169.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Would a sober person of reasonable</text><text x="493" y="193.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">firmness, sharing D’s characteristics,</text><text x="493" y="217.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">have responded the same way?</text><text x="450" y="273" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle"><tspan font-style="italic">R v Bowen</tspan> [1996]: which characteristics count in stage 2?</text><rect x="30" y="293" width="520" height="270" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="329" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="start">Count</text><rect x="54" y="347" width="230" height="50" rx="25" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="169" y="378" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Age</text><rect x="299" y="347" width="230" height="50" rx="25" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="414" y="378" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Sex</text><rect x="54" y="411" width="230" height="50" rx="25" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="169" y="442" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Pregnancy</text><rect x="299" y="411" width="230" height="50" rx="25" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="414" y="442" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Serious physical disability</text><rect x="54" y="475" width="475" height="50" rx="25" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="291.5" y="506" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Recognised psychiatric illness</text><rect x="570" y="293" width="300" height="270" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="594" y="329" font-size="18" font-weight="700" fill="#b5602e" text-anchor="start">Do not count</text><rect x="594" y="347" width="252" height="72" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="720" y="377" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Low IQ short of mental</text><text x="720" y="398" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">impairment</text><rect x="594" y="437" width="252" height="72" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="720" y="467" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Being unusually timid or</text><text x="720" y="488" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">vulnerable</text>
</svg>