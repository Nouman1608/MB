<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 781" width="900" height="781" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="781" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Intoxication: when can it help?</text>

<rect x="260" y="112" width="380" height="56" rx="28" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="146" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Was the intoxication voluntary?</text><path d="M300,168 L210,222" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><text x="232" y="190" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">yes</text><path d="M600,168 L690,222" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><text x="664" y="192" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">no: involuntary</text><rect x="30" y="224" width="400" height="56" rx="28" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="230" y="258" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Specific or basic intent offence?</text><path d="M140,280 L110,330" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><text x="94" y="310" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">specific</text><path d="M320,280 L350,330" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><text x="368" y="310" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">basic</text><rect x="30" y="336" width="210" height="240" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="44" y="364" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Intent formed?</text><text x="44" y="388" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">If D was too intoxicated</text><text x="44" y="408" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">to form it: acquitted of it,</text><text x="44" y="428" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">usually convicted of a</text><text x="44" y="448" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">basic intent fallback. A</text><text x="44" y="468" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">drunken intent is still an</text><text x="44" y="488" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">intent (<tspan font-style="italic">Sheehan and</tspan></text><text x="44" y="508" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Moore</tspan>).</text><rect x="256" y="336" width="190" height="240" rx="12" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="270" y="364" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">No defence</text><text x="270" y="388" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Voluntary intoxication</text><text x="270" y="408" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">is reckless conduct</text><text x="270" y="428" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">supplying the <tspan font-style="italic">mens</tspan></text><text x="270" y="448" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">rea</tspan>: <tspan font-style="italic">DPP v Majewski</tspan></text><text x="270" y="468" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">[1977]; <tspan font-style="italic">Lipman</tspan> [1970];</text><text x="270" y="488" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Heard</tspan> [2007].</text><rect x="540" y="224" width="300" height="56" rx="28" fill="#1e2a44" stroke="#1e2a44" stroke-width="2.5"/><text x="690" y="258" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Was intent formed?</text><path d="M620,280 L590,330" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><text x="586" y="310" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">no</text><path d="M760,280 L790,330" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah)"/><text x="800" y="310" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">yes</text><rect x="466" y="336" width="200" height="240" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="480" y="364" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Defence</text><text x="480" y="388" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">to both specific and</text><text x="480" y="408" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">basic intent offences:</text><text x="480" y="428" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">no reckless choice to</text><text x="480" y="448" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">become intoxicated.</text><rect x="682" y="336" width="188" height="240" rx="12" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="696" y="364" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">No defence</text><text x="696" y="388" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">"a drugged intent is</text><text x="696" y="408" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">still an intent": <tspan font-style="italic">R v</tspan></text><text x="696" y="428" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">Kingston</tspan> [1994].</text><rect x="30" y="600" width="411" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="633" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SPECIFIC INTENT</text><text x="50" y="657.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Murder; s 18 OAPA; theft; robbery; s 9(1)(a)</text><text x="50" y="678.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">burglary</text><rect x="459" y="600" width="411" height="103" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="633" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">BASIC INTENT</text><text x="479" y="657.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Manslaughter; s 20 and s 47 OAPA; assault;</text><text x="479" y="678.8" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">criminal damage</text><text x="450" y="729" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Involuntary: drink spiked, a prescribed drug, or a non-dangerous drug with an unexpected effect.</text><text x="450" y="753" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Sedatives: <tspan font-style="italic">R v Hardie</tspan> [1985], was taking Valium reckless? Knowing it is alcohol makes it voluntary: <tspan font-style="italic">R v Allen</tspan> [1988].</text>
</svg>