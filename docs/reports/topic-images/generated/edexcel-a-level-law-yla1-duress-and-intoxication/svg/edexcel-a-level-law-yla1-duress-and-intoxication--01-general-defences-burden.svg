<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 481" width="900" height="481" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="481" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How general defences work</text>

<rect x="30" y="120" width="390" height="80" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="66" cy="160" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="66" y="166.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="96" y="154" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">D raises evidence of the defence</text><rect x="480" y="120" width="390" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><circle cx="516" cy="160" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="516" y="166.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="546" y="154" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Prosecution must disprove it</text><text x="546" y="178" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">beyond reasonable doubt</text><line x1="424" y1="160" x2="476" y2="160" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="230" width="411" height="137" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="263" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">DURESS</text><text x="50" y="291" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">A complete defence</text><text x="50" y="320.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">If it succeeds, the defendant is acquitted.</text><rect x="459" y="230" width="411" height="137" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="479" y="263" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">INTOXICATION</text><text x="479" y="291" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Not really a defence</text><text x="479" y="320.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">A way of arguing that the defendant lacked</text><text x="479" y="342.6" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">the <tspan font-style="italic">mens rea</tspan>.</text><rect x="30" y="387" width="840" height="64" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="425" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">A general defence can apply to many offences: establish the offence first, then the defence.</text>
</svg>