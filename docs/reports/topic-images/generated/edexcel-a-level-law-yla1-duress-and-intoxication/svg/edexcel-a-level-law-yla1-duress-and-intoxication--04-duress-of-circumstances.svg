<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 594" width="900" height="594" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="594" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Duress of circumstances</text>

<rect x="30" y="110" width="840" height="88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="145.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Same test, but the threat comes from the situation</text><text x="50" y="173.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">rather than from a demand that D commit a particular crime</text><rect x="30" y="214" width="411" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="247.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R v Willer</tspan> (1986)</text><text x="50" y="274" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">drove on the pavement to escape a gang: should</text><text x="50" y="294" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">have been left to the jury</text><rect x="459" y="214" width="411" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="247.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R v Conway</tspan> [1988]</text><text x="479" y="274" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">sped away from men he feared were attackers</text><text x="479" y="294" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">(they were police officers)</text><rect x="30" y="332" width="411" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="365.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R v Martin</tspan> [1989]</text><text x="50" y="392" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">disqualified driver drove his stepson to work: wife</text><text x="50" y="412" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">threatened suicide</text><rect x="459" y="332" width="411" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="365.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">DPP v Bell</tspan> [1992]</text><text x="479" y="392" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">drunk man drove off to escape an attack, only as far</text><text x="479" y="412" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">as necessary</text><rect x="30" y="450" width="411" height="104" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="483.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R v Pommell</tspan> [1995]</text><text x="50" y="510" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">kept a gun overnight; must stop the offence once</text><text x="50" y="530" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">the danger has passed</text><rect x="459" y="450" width="411" height="104" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="479" y="483.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start"><tspan font-style="italic">R v Abdul-Hussain</tspan> [1999]</text><text x="479" y="510" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">hijacked a plane to escape feared execution; wrong</text><text x="479" y="530" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">to withdraw the defence</text>
</svg>