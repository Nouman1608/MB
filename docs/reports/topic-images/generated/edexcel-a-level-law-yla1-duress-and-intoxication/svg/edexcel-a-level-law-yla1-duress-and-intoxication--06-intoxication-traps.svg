<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 339" width="900" height="339" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="339" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Intoxication: three special rules</text>

<rect x="30" y="110" width="268" height="199" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="143" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">DUTCH COURAGE</text><text x="50" y="169.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Intent formed sober, then</text><text x="50" y="193.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">drinks to act</text><text x="50" y="221.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">No defence, even to a</text><text x="50" y="242.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">specific intent offence:</text><text x="50" y="263.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Attorney General for Northern</tspan></text><text x="50" y="284.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Ireland v Gallagher</tspan> [1963].</text><rect x="316" y="110" width="268" height="199" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="336" y="143" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">INTOXICATED MISTAKES</text><text x="336" y="169.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Drunkenly believes</text><text x="336" y="193.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">self-defence is needed</text><text x="336" y="221.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Cannot rely on the mistake: <tspan font-style="italic">R</tspan></text><text x="336" y="242.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">v O’Grady</tspan> [1987]; <tspan font-style="italic">R v Hatton</tspan></text><text x="336" y="263.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">[2005].</text><rect x="602" y="110" width="268" height="199" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="622" y="143" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">EXCEPTION</text><text x="622" y="169.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Criminal damage</text><text x="622" y="197.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">s 5(2) Criminal Damage Act</text><text x="622" y="218.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">1971 allows an honest belief,</text><text x="622" y="239.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">even a drunken one: <tspan font-style="italic">Jaggard</tspan></text><text x="622" y="260.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">v Dickinson</tspan> [1981].</text>
</svg>