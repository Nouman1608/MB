<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 804" width="900" height="804" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="804" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Duress of threats: seven steps</text>

<text x="450" y="128" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="middle">Lord Bingham set out the limits in <tspan font-style="italic">R v Hasan</tspan> [2005]: work through in order</text><circle cx="54" cy="196" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="54" y="202.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="86" y="150" width="784" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="100" y="177.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Threat of death or serious injury</text><text x="100" y="204" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Valderrama-Vega</tspan> [1985]: other threats can be taken together if this one was a cause. <tspan font-style="italic">Quayle</tspan> [2005]: pain</text><text x="100" y="224" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">from illness is not a threat.</text><line x1="54" y1="214" x2="54" y2="262" stroke="#c9d6d4" stroke-width="3"/><circle cx="54" cy="288" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="54" y="294.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="86" y="252" width="784" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="100" y="279.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Against D, immediate family, or someone D reasonably feels responsible for</text><text x="100" y="306" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Hasan</tspan></text><line x1="54" y1="306" x2="54" y2="344" stroke="#c9d6d4" stroke-width="3"/><circle cx="54" cy="370" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="54" y="376.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="86" y="334" width="784" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="100" y="361.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Directed at a particular crime</text><text x="100" y="388" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">R v Cole</tspan> [1994]: moneylenders never told him to rob, so duress failed.</text><line x1="54" y1="388" x2="54" y2="426" stroke="#c9d6d4" stroke-width="3"/><circle cx="54" cy="462" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="54" y="468.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="86" y="416" width="784" height="92" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="100" y="443.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Immediacy and no chance to escape</text><text x="100" y="470" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Reasonable belief the threat will be carried out immediately or almost immediately; no evasive action, such</text><text x="100" y="490" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">as the police (<tspan font-style="italic">Hasan</tspan>, disapproving <tspan font-style="italic">Hudson and Taylor</tspan> [1971]).</text><line x1="54" y1="480" x2="54" y2="528" stroke="#c9d6d4" stroke-width="3"/><circle cx="54" cy="554" r="18" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="54" y="560.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">5</text><rect x="86" y="518" width="784" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="100" y="545.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">The <tspan font-style="italic">Graham</tspan> test</text><text x="100" y="572" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Subjective then objective: <tspan font-style="italic">R v Graham</tspan> [1982], approved in <tspan font-style="italic">R v Howe</tspan> [1987].</text><line x1="54" y1="572" x2="54" y2="610" stroke="#c9d6d4" stroke-width="3"/><circle cx="54" cy="646" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="54" y="652.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">6</text><rect x="86" y="600" width="784" height="92" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="100" y="627.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">No voluntary association with criminals</text><text x="100" y="654" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Knew or ought reasonably to have known of violent pressure (<tspan font-style="italic">Hasan</tspan>). <tspan font-style="italic">Sharp</tspan> [1987]: violent gang, no</text><text x="100" y="674" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">defence; <tspan font-style="italic">Shepherd</tspan> [1987]: non-violent gang, defence available.</text><line x1="54" y1="664" x2="54" y2="712" stroke="#c9d6d4" stroke-width="3"/><circle cx="54" cy="738" r="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="54" y="744.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">7</text><rect x="86" y="702" width="784" height="72" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="100" y="729.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Not for murder or attempted murder</text><text x="100" y="756" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start"><tspan font-style="italic">Howe</tspan> [1987]; <tspan font-style="italic">Gotts</tspan> [1992]; <tspan font-style="italic">Wilson</tspan> [2007]: a 13-year-old helping his father.</text>
</svg>