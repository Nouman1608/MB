<rect width="900" height="562" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">ICD features of dependence</text>

<line x1="310" y1="142" x2="407" y2="212.7" stroke="#1e2a44" stroke-width="2.5"/><line x1="310" y1="232.5" x2="407" y2="239.85" stroke="#1e2a44" stroke-width="2.5"/><line x1="310" y1="333.5" x2="407" y2="270.15" stroke="#1e2a44" stroke-width="2.5"/><line x1="590" y1="150" x2="493" y2="215.1" stroke="#1e2a44" stroke-width="2.5"/><line x1="590" y1="253.5" x2="493" y2="246.15" stroke="#1e2a44" stroke-width="2.5"/><line x1="590" y1="346.5" x2="493" y2="274.05" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="243" r="86" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="250.35" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">Dependence</text><rect x="30" y="102.5" width="280" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="170" y="132.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Strong desire</text><text x="170" y="161.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">to take the substance</text><rect x="30" y="195.5" width="280" height="74" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="170" y="237.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Difficulty controlling use</text><rect x="30" y="283.5" width="280" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="170" y="313.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Withdrawal</text><text x="170" y="342.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">a physiological state when use</text><text x="170" y="363.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">stops</text><rect x="590" y="100" width="280" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="730" y="130.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Tolerance</text><text x="730" y="158.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">needing more for the same</text><text x="730" y="179.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">effect</text><rect x="590" y="214" width="280" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="730" y="244.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Neglect of other pleasures</text><text x="730" y="272.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">and interests</text><rect x="590" y="307" width="280" height="79" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="730" y="337.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Persistent use</text><text x="730" y="365.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">despite clear evidence of harm</text><rect x="30" y="408" width="272" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="436" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SUBSTANCE MISUSE</text><text x="46" y="467.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Harmful or unintended use,</text><text x="46" y="488.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">such as drinking too much on</text><text x="46" y="509.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">one occasion</text><rect x="314" y="408" width="272" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330" y="436" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SUBSTANCE ABUSE</text><text x="330" y="467.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A repeated pattern of harmful</text><text x="330" y="488.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">use, without necessarily being</text><text x="330" y="509.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">dependent</text><rect x="598" y="408" width="272" height="122" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="614" y="436" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ADDICTION / DEPENDENCE</text><text x="614" y="467.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A compulsion to use despite</text><text x="614" y="488.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">harm, with physical and</text><text x="614" y="509.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">psychological features</text>
</svg>