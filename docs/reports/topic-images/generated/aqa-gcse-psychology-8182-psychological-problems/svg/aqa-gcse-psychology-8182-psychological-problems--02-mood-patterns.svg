<rect width="900" height="724" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Sadness, unipolar and bipolar depression</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Schematic mood over time</text>
<rect x="30" y="124" width="840" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="160" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Sadness</text><text x="50" y="186" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">a normal, short-lived response</text><text x="50" y="206" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">to events such as a loss</text><line x1="300" y1="189" x2="850" y2="189" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="6 5"/><text x="300" y="181" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">usual mood</text><path d="M300,189 L430,189 C460,189 470,229 500,229 C530,229 540,189 570,189 L850,189" fill="none" stroke="#2e6b62" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="30" y="266" width="840" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="302" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Unipolar depression</text><text x="50" y="328" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">persistent low mood, no mania</text><line x1="300" y1="331" x2="850" y2="331" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="6 5"/><text x="300" y="323" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">usual mood</text><path d="M300,331 L360,331 C390,331 400,376 430,376 L850,376" fill="none" stroke="#2e6b62" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" /><rect x="30" y="408" width="840" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="444" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Bipolar depression</text><text x="50" y="470" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">depression alternating with</text><text x="50" y="490" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">mania</text><line x1="300" y1="473" x2="850" y2="473" stroke="#c9d6d4" stroke-width="2" stroke-dasharray="6 5"/><text x="300" y="465" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">usual mood</text><path d="M300,473 C340,473 350,518 390,518 C440,518 450,443 500,443 C550,443 560,518 610,518 C660,518 670,443 720,443 C770,443 780,473 850,473" fill="none" stroke="#2e6b62" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" /><text x="500" y="430" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">mania</text><rect x="30" y="560" width="840" height="132" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="592" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ICD DIAGNOSIS</text><text x="50" y="618.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Mild, moderate or severe, by the number and severity of symptoms</text><text x="50" y="646.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">low mood · loss of interest and enjoyment · reduced energy · changes in sleep and appetite · decreased</text><text x="50" y="667.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">self-confidence</text>
</svg>