<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 613" width="900" height="613" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="613" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why recorded rates of mental health problems change</text>

<rect x="30" y="100" width="270.6666666666667" height="176" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="142.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">INCREASED RECOGNITION</text><text x="50" y="168.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">More problems identified</text><text x="50" y="191.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">and diagnosed</text><text x="50" y="220.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Better understanding of</text><text x="50" y="241.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">mental health</text><rect x="314.6666666666667" y="100" width="270.6666666666667" height="176" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="334.6666666666667" y="154" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">LESS STIGMA</text><text x="334.6666666666667" y="180.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">More people seek help</text><text x="334.6666666666667" y="208.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">As attitudes change, more</text><text x="334.6666666666667" y="229.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">cases are recorded</text><rect x="599.3333333333334" y="100" width="270.6666666666667" height="176" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="619.3333333333334" y="132" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">MODERN LIVING</text><text x="619.3333333333334" y="158.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">More people may be</text><text x="619.3333333333334" y="181.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">affected</text><text x="619.3333333333334" y="209.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Social isolation, pressure at</text><text x="619.3333333333334" y="230.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">work or school, financial</text><text x="619.3333333333334" y="251.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">insecurity</text><path d="M175,298 L175,324 L590,324 M590,298 L590,324" fill="none" stroke="#1e2a44" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><line x1="305" y1="324" x2="305" y2="356" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><path d="M740,298 L740,356" fill="none" stroke="#8a6d0d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ahO)"/><rect x="30" y="362" width="550" height="88" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="305" y="396.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">More recorded cases</text><text x="305" y="425.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">without necessarily more people being unwell</text><rect x="610" y="362" width="260" height="88" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="740" y="410.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">A real increase</text><rect x="30" y="472" width="840" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="506.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Good mental health is more than the absence of illness</text><text x="50" y="535.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Coping with the normal stresses of life, working productively, forming positive relationships, contributing</text><text x="50" y="556.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to the community. Beliefs about mental health problems vary between cultures.</text>
</svg>