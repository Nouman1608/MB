<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 703" width="900" height="703" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="703" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Kaij (1960): a twin study of alcohol abuse</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Male twin pairs in Sweden; at least one twin registered for alcohol abuse</text>
<rect x="30" y="124" width="400" height="220" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="180" cy="194" r="22" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><rect x="154" y="220" width="52" height="56" rx="18" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><circle cx="280" cy="194" r="22" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><rect x="254" y="220" width="52" height="56" rx="18" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="230" y="310" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Identical (monozygotic)</text><text x="230" y="332" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">share all their genes</text><rect x="470" y="124" width="400" height="220" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="620" cy="194" r="22" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><rect x="594" y="220" width="52" height="56" rx="18" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><circle cx="720" cy="194" r="22" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><rect x="694" y="220" width="52" height="56" rx="18" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="670" y="310" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Non-identical (dizygotic)</text><text x="670" y="332" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">share about half their genes</text><text x="30" y="382" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">CONCORDANCE FOR ALCOHOL ABUSE (illustrative heights, no figures given)</text><rect x="150" y="406" width="460" height="44" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="140" y="434" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Identical</text><text x="622" y="434" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">higher</text><rect x="150" y="462" width="240" height="44" rx="6" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="140" y="490" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Non-identical</text><text x="402" y="490" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">lower</text><rect x="30" y="528" width="272" height="143" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="46" y="556" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">+ SUPPORTS</text><text x="46" y="587.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A genetic contribution to</text><text x="46" y="608.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">addiction.</text><rect x="314" y="528" width="272" height="143" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="330" y="556" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">− NOT 100%</text><text x="330" y="587.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Concordance was not 100%,</text><text x="330" y="608.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">so environment must matter</text><text x="330" y="629.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">too.</text><rect x="598" y="528" width="272" height="143" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="614" y="556" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">− OTHER ISSUES</text><text x="614" y="587.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Identical twins may share a</text><text x="614" y="608.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">more similar environment; older</text><text x="614" y="629.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">ways of judging twin type were</text><text x="614" y="650.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">less reliable.</text>
</svg>