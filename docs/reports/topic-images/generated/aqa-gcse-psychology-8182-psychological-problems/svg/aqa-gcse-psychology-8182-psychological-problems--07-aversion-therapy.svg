<rect width="900" height="492" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Aversion therapy: classical conditioning</text>

<text x="30" y="116" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">DURING THERAPY</text><rect x="30" y="130" width="220" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="140" y="167.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Alcohol</text><text x="270" y="172" font-size="30" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><rect x="290" y="130" width="260" height="84" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="420" y="164.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Drug that causes</text><text x="420" y="188.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">nausea</text><line x1="560" y1="163" x2="610" y2="163" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620" y="130" width="250" height="66" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="745" y="167.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Feeling ill</text><text x="30" y="236" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">AFTER CONDITIONING</text><rect x="30" y="250" width="220" height="66" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="140" y="287.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Alcohol</text><line x1="260" y1="283" x2="610" y2="283" stroke="#b5602e" stroke-width="3.5" marker-end="url(#ahR)"/><text x="435" y="272" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">learned association</text><rect x="620" y="250" width="250" height="66" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="745" y="287.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Feeling ill</text><rect x="30" y="338" width="413" height="122" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="366" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">AVERSION THERAPY − WEAKNESSES</text><text x="46" y="397.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Unpleasant, raising ethical concerns; the effect</text><text x="46" y="418.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">may fade outside the clinic.</text><rect x="457" y="338" width="413" height="122" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="473" y="366" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">SELF-MANAGEMENT: TWELVE-STEP, SELF-HELP</text><text x="473" y="397.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">+ Free, widely available, a new supportive peer</text><text x="473" y="418.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">group. − High drop-out; depends on motivation;</text><text x="473" y="439.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">hard to evaluate.</text>
</svg>