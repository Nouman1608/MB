<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 766" width="900" height="766" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="766" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Wiles (2013): a randomised controlled trial of CBT</text>

<rect x="250" y="100" width="400" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="134.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Patients in UK GP practices</text><text x="450" y="163.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">depression had not responded to</text><text x="450" y="184.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">antidepressants</text><line x1="380" y1="213" x2="230" y2="271" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="520" y1="213" x2="670" y2="271" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="367.744" y="239" width="164.512" height="30" rx="15" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="450" y="259.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">random allocation</text><rect x="30" y="293" width="350" height="112" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="205" y="325" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">CONTROL</text><text x="205" y="351.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Usual care</text><text x="205" y="380.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">including medication</text><rect x="520" y="293" width="350" height="112" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="695" y="339" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">EXPERIMENTAL</text><text x="695" y="365.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Usual care + CBT</text><text x="450" y="440.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Symptoms measured with the <tspan font-weight="700">Beck</tspan> <tspan font-weight="700">Depression</tspan> <tspan font-weight="700">Inventory</tspan></text><rect x="30" y="471" width="840" height="111" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="505.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Finding</text><text x="450" y="535.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">The CBT group showed a greater reduction in symptoms at <tspan font-weight="700" fill="#1e2a44">six</tspan> <tspan font-weight="700" fill="#1e2a44">months</tspan>, and the benefit was still</text><text x="450" y="557.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">present at <tspan font-weight="700" fill="#1e2a44">twelve</tspan> <tspan font-weight="700" fill="#1e2a44">months</tspan>.</text><rect x="30" y="604" width="413" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="636" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">+ STRENGTH</text><text x="50" y="667.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Random allocation and a large sample make</text><text x="50" y="688.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">results trustworthy; supports combining</text><text x="50" y="709.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">treatments.</text><rect x="457" y="604" width="413" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="636" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">− WEAKNESS</text><text x="477" y="667.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Patients knew which treatment they received;</text><text x="477" y="688.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">volunteers may have been more motivated than</text><text x="477" y="709.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">typical patients.</text>
</svg>