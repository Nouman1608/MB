<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 574" width="900" height="574" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="574" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A depressive attributional style</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">How a person explains a negative event, such as failing a test</text>
<rect x="30" y="124" width="270.6666666666667" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="165.33333333333334" y="168.5" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">INTERNAL</text><text x="165.33333333333334" y="196.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">"It's my fault"</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="156" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">STABLE</text><text x="450" y="183.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">"It will always be like</text><text x="450" y="208.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">this"</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="734.6666666666667" y="168.5" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">GLOBAL</text><text x="734.6666666666667" y="196.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">"It ruins everything"</text><rect x="30" y="256" width="395" height="155" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="288" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">NEGATIVE SCHEMAS</text><text x="50" y="314.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Mental frameworks, often from early</text><text x="50" y="337.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">experiences</text><text x="50" y="365.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">lead people to see themselves, the world and</text><text x="50" y="386.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the future negatively</text><line x1="431" y1="333.5" x2="469" y2="333.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="475" y="256" width="395" height="155" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="495" y="289" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TREATMENT</text><text x="495" y="315.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">CBT</text><text x="495" y="343.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Identify negative, irrational thoughts, challenge</text><text x="495" y="364.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">them, and replace unhelpful behaviour with</text><text x="495" y="385.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">positive activity</text><rect x="30" y="433" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="467.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluation</text><text x="50" y="496.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Leads directly to an effective therapy. But depression may cause negative thinking rather than the</text><text x="50" y="517.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reverse, and the explanation can seem to blame the individual while overlooking life circumstances.</text>
</svg>