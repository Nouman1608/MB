<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 583" width="900" height="583" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="583" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Turning a general point into application</text>

<rect x="30" y="104" width="395" height="156" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="173" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">GENERAL: EARNS LITTLE</text><text x="50" y="198.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">“Questionnaires are cheap.”</text><line x1="431" y1="182" x2="469" y2="182" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="475" y="104" width="395" height="156" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="495" y="137" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">APPLIED</text><text x="495" y="162.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">“A questionnaire about income may</text><text x="495" y="186.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">suffer from social desirability,</text><text x="495" y="210.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">because people under-report or</text><text x="495" y="234.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">exaggerate earnings.”</text><text x="450" y="298" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Every evaluation point should name three things</text><rect x="30" y="324" width="272" height="131" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="166" y="360" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="middle">The topic</text><text x="166" y="388.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">e.g. income</text><rect x="314" y="324" width="272" height="131" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="360" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="middle">The group studied</text><text x="450" y="388.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">e.g. people reporting their</text><text x="450" y="409.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">earnings</text><rect x="598" y="324" width="272" height="131" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="734" y="360" font-size="20" font-weight="700" fill="#8a6d0d" text-anchor="middle">The issue it raises</text><text x="734" y="388.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">practical, ethical or</text><text x="734" y="409.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">theoretical, e.g. social</text><text x="734" y="430.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">desirability</text><rect x="30" y="473" width="840" height="80" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="506.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Selected extended responses need an example from your own society or one you know about:</text><text x="50" y="528.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">prepare one for each topic.</text>
</svg>