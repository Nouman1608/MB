<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 508" width="900" height="508" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="508" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Two ways to research social mobility</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Comparing a person’s class with their parents’</text>
<rect x="30" y="110" width="410" height="370" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="460" y="110" width="410" height="370" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="148" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="middle">Retrospective questions</text><text x="665" y="148" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Longitudinal cohort study</text><rect x="60" y="172" width="350" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="235" y="205.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">“What was your father’s or mother’s</text><text x="235" y="227.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">job when you were 14?”</text><line x1="380" y1="310" x2="100" y2="310" stroke="#8a6d0d" stroke-width="4" marker-end="url(#ahO)"/><text x="240" y="298" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">looking back from today</text><text x="80" y="390" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">+ Cheaper</text><text x="80" y="422" font-size="17" font-weight="600" fill="#b5602e" text-anchor="start">− Relies on memory</text><text x="665" y="180" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">e.g. National Child Development Study,</text><text x="665" y="200" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">people born in 1958</text><line x1="490" y1="310" x2="845" y2="310" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><text x="665" y="336" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">following the same people forward</text><g opacity="1"><circle cx="515" cy="246" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="505" y="256" width="20" height="22" rx="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/></g><g opacity="1"><circle cx="539" cy="246" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="529" y="256" width="20" height="22" rx="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/></g><g opacity="1"><circle cx="563" cy="246" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="553" y="256" width="20" height="22" rx="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/></g><g opacity="1"><circle cx="587" cy="246" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="577" y="256" width="20" height="22" rx="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/></g><g opacity="1"><circle cx="635" cy="246" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="625" y="256" width="20" height="22" rx="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/></g><g opacity="1"><circle cx="659" cy="246" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="649" y="256" width="20" height="22" rx="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/></g><g opacity="1"><circle cx="683" cy="246" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="673" y="256" width="20" height="22" rx="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/></g><g opacity="0.25"><circle cx="707" cy="246" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="697" y="256" width="20" height="22" rx="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/></g><g opacity="1"><circle cx="755" cy="246" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="745" y="256" width="20" height="22" rx="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/></g><g opacity="1"><circle cx="779" cy="246" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="769" y="256" width="20" height="22" rx="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/></g><g opacity="0.25"><circle cx="803" cy="246" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="793" y="256" width="20" height="22" rx="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/></g><g opacity="0.25"><circle cx="827" cy="246" r="8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><rect x="817" y="256" width="20" height="22" rx="7" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/></g><text x="490" y="390" font-size="17" font-weight="600" fill="#2e6b62" text-anchor="start">+ More valid</text><text x="490" y="422" font-size="17" font-weight="600" fill="#b5602e" text-anchor="start">− Expensive; loses participants,</text><text x="507" y="446" font-size="17" font-weight="600" fill="#b5602e" text-anchor="start">which can damage representativeness</text>
</svg>