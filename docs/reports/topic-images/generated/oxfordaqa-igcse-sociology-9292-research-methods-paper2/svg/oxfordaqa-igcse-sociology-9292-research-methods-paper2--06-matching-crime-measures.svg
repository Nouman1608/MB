<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 713" width="900" height="713" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="713" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Matching the measure to the crime</text>

<text x="150" y="128" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Type of crime</text><text x="450" y="128" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Best measure</text><text x="740" y="128" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">Why</text><rect x="30" y="144" width="257.3333333333333" height="62" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="42" y="179.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Burglary, vehicle crime</text><line x1="293.3333333333333" y1="175" x2="315.3333333333333" y2="175" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="321.3333333333333" y="144" width="257.3333333333333" height="62" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="333.3333333333333" y="168.8" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Police statistics +</text><text x="333.3333333333333" y="189.8" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">victim surveys</text><line x1="584.6666666666666" y1="175" x2="606.6666666666666" y2="175" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="612.6666666666666" y="144" width="257.3333333333333" height="62" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="624.6666666666666" y="168.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Victims usually report for</text><text x="624.6666666666666" y="189.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">insurance</text><rect x="30" y="216" width="257.3333333333333" height="83" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="42" y="262.1" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Domestic abuse</text><line x1="293.3333333333333" y1="257.5" x2="315.3333333333333" y2="257.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="321.3333333333333" y="216" width="257.3333333333333" height="83" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="333.3333333333333" y="240.8" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Victim surveys,</text><text x="333.3333333333333" y="261.8" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">confidential</text><text x="333.3333333333333" y="282.8" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">self-completion</text><line x1="584.6666666666666" y1="257.5" x2="606.6666666666666" y2="257.5" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="612.6666666666666" y="216" width="257.3333333333333" height="83" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="624.6666666666666" y="251.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Privacy reduces fear and</text><text x="624.6666666666666" y="272.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">embarrassment</text><rect x="30" y="309" width="257.3333333333333" height="64" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="42" y="334.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Drug use, “victimless”</text><text x="42" y="356.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">crime</text><line x1="293.3333333333333" y1="341" x2="315.3333333333333" y2="341" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="321.3333333333333" y="309" width="257.3333333333333" height="64" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="333.3333333333333" y="345.3" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Self-report studies</text><line x1="584.6666666666666" y1="341" x2="606.6666666666666" y2="341" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="612.6666666666666" y="309" width="257.3333333333333" height="64" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="624.6666666666666" y="334.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">No victim to report the</text><text x="624.6666666666666" y="355.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">offence</text><rect x="30" y="383" width="257.3333333333333" height="62" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="42" y="418.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Corporate, white-collar</text><line x1="293.3333333333333" y1="414" x2="315.3333333333333" y2="414" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="321.3333333333333" y="383" width="257.3333333333333" height="62" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="333.3333333333333" y="407.8" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Court and regulatory</text><text x="333.3333333333333" y="428.8" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">records</text><line x1="584.6666666666666" y1="414" x2="606.6666666666666" y2="414" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="612.6666666666666" y="383" width="257.3333333333333" height="62" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="624.6666666666666" y="407.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Victims may not know they</text><text x="624.6666666666666" y="428.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">were harmed</text><rect x="30" y="455" width="257.3333333333333" height="62" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="42" y="490.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Cybercrime</text><line x1="293.3333333333333" y1="486" x2="315.3333333333333" y2="486" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="321.3333333333333" y="455" width="257.3333333333333" height="62" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="333.3333333333333" y="479.8" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Victim surveys; bank and</text><text x="333.3333333333333" y="500.8" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">platform data</text><line x1="584.6666666666666" y1="486" x2="606.6666666666666" y2="486" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="612.6666666666666" y="455" width="257.3333333333333" height="62" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="624.6666666666666" y="479.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Many victims never contact</text><text x="624.6666666666666" y="500.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the police</text><rect x="30" y="527" width="257.3333333333333" height="62" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="42" y="562.6" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">State crime</text><line x1="293.3333333333333" y1="558" x2="315.3333333333333" y2="558" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="321.3333333333333" y="527" width="257.3333333333333" height="62" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="333.3333333333333" y="551.8" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">Documents, journalism,</text><text x="333.3333333333333" y="572.8" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="start">testimony</text><line x1="584.6666666666666" y1="558" x2="606.6666666666666" y2="558" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="612.6666666666666" y="527" width="257.3333333333333" height="62" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="624.6666666666666" y="551.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">The state controls official</text><text x="624.6666666666666" y="572.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">records</text><rect x="30" y="605" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="638.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Every measure is socially constructed to some degree. Triangulating several measures gives</text><text x="50" y="660.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">the most valid picture.</text>
</svg>