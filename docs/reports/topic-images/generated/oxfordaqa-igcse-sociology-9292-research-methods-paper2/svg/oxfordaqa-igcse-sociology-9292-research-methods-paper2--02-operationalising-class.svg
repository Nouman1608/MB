<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 648" width="900" height="648" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="648" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three ways to operationalise social class</text>

<rect x="30" y="104" width="840" height="61" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="139.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Social class must be operationalised before it can be counted</text><rect x="30" y="183" width="270.6666666666667" height="359" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="216" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">MEASURE</text><text x="50" y="242.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Occupational scale</text><text x="50" y="270.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Groups people by job, e.g.</text><text x="50" y="291.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">UK NS-SEC (replaced the</text><text x="50" y="312.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Registrar General’s scale</text><text x="50" y="333.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">from 2001): employ or</text><text x="50" y="354.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">supervise others?</text><text x="50" y="383.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">− Struggles with</text><text x="50" y="404.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">unemployed, retired,</text><text x="50" y="425.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">students, unpaid carers and</text><text x="50" y="446.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">two-earner households</text><text x="50" y="475.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">− May misclassify the very</text><text x="50" y="496.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">rich, whose wealth comes</text><text x="50" y="517.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">from ownership</text><rect x="314.6666666666667" y="183" width="270.6666666666667" height="359" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="334.6666666666667" y="216" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">MEASURE</text><text x="334.6666666666667" y="242.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Income and wealth</text><text x="334.6666666666667" y="270.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Measured directly</text><text x="334.6666666666667" y="299.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">− People may refuse or give</text><text x="334.6666666666667" y="320.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">inaccurate figures</text><text x="334.6666666666667" y="349.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">− Wealth in property,</text><text x="334.6666666666667" y="370.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">shares or overseas is hard</text><text x="334.6666666666667" y="391.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to see</text><rect x="599.3333333333334" y="183" width="270.6666666666667" height="359" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="619.3333333333334" y="216" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">MEASURE</text><text x="619.3333333333334" y="242.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Subjective class</text><text x="619.3333333333334" y="270.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">People say which class they</text><text x="619.3333333333334" y="291.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">think they belong to</text><text x="619.3333333333334" y="320.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">+ Captures identity</text><text x="619.3333333333334" y="349.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">− Not objective position</text><rect x="30" y="560" width="840" height="58" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="593.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Each choice affects validity: the measure may not capture the concept.</text>
</svg>