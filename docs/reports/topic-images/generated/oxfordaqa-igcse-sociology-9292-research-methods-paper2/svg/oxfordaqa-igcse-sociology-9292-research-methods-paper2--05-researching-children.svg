<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 509" width="900" height="509" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="509" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Researching children: ethics and practical choices</text>

<rect x="30" y="104" width="272" height="130" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="139.2" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Informed consent</text><text x="50" y="167.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">From both the child and a</text><text x="50" y="188.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">parent or guardian</text><rect x="314" y="104" width="272" height="130" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="334" y="139.2" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Power imbalance</text><text x="334" y="167.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Children may give the</text><text x="334" y="188.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">answers they think are</text><text x="334" y="209.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">wanted</text><rect x="598" y="104" width="272" height="130" rx="14" fill="#f2e7b8" stroke="#b5602e" stroke-width="2.5"/><text x="618" y="139.2" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Participant wellbeing</text><text x="618" y="167.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Questions about home life</text><text x="618" y="188.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">may reveal harm the</text><text x="618" y="209.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">researcher must act on</text><line x1="450" y1="254" x2="450" y2="286" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="306" width="840" height="61" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="341.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Practical alternatives</text><rect x="111.86250000000007" y="385" width="415.22499999999997" height="42" rx="21" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="319.475" y="412.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">observation in schools or play settings</text><rect x="539.0875000000001" y="385" width="249.04999999999995" height="42" rx="21" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="663.6125000000001" y="412.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">short group interviews</text><rect x="257.05" y="437" width="385.9" height="42" rx="21" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="464.12" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">simple activities in their own words</text>
</svg>