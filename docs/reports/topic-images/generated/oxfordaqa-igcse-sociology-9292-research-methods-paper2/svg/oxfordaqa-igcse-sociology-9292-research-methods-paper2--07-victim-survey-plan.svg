<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 608" width="900" height="608" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="608" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Planning an extended response</text>

<rect x="30" y="104" width="840" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="137" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">QUESTION</text><text x="50" y="163.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Evaluate the usefulness of victim surveys for studying patterns of</text><text x="50" y="188.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">victimisation by gender.</text><rect x="30" y="232" width="170" height="72" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="275" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Strengths</text><rect x="214" y="232" width="656" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="261.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Reveal crime not reported to police, e.g. domestic abuse; large samples</text><text x="230" y="283.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">compare men’s and women’s risk; repeated surveys show trends.</text><rect x="30" y="316" width="170" height="94" rx="14" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="370" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Limitations</text><rect x="214" y="316" width="656" height="94" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="345.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Disclosure depends on trust and privacy; miss people without a fixed</text><text x="230" y="367.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">address; rely on memory; some victims do not define experiences as</text><text x="230" y="389.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">crime.</text><rect x="30" y="422" width="170" height="72" rx="14" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="465" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Methods fix</text><rect x="214" y="422" width="656" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="451.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Confidential self-completion section; trained interviewers; triangulate</text><text x="230" y="473.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">with police data and qualitative interviews.</text><rect x="30" y="506" width="170" height="72" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="115" y="549" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Judgement</text><rect x="214" y="506" width="656" height="72" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="230" y="535.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">More useful than police statistics for hidden, gendered crimes, but</text><text x="230" y="557.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">still an underestimate.</text>
</svg>