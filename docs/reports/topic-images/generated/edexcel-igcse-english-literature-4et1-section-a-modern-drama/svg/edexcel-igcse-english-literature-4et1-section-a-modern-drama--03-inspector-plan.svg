<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 799" width="900" height="799" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="799" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Planning a character essay</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">How does Priestley present the Inspector as a powerful figure?</text>
<rect x="30" y="140" width="840" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="173" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">OVERVIEW: ANSWER THE QUESTION FIRST</text><text x="50" y="199.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">His power comes not from rank but from moral authority and control of the</text><text x="50" y="224.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">drama itself.</text><line x1="62" y1="310" x2="62" y2="753" stroke="#c9d6d4" stroke-width="4"/><rect x="108" y="290" width="522" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="324.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Entrance</text><text x="128" y="352.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The doorbell interrupts Birling’s confident speech: a</text><text x="128" y="373.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">challenge to his views before the Inspector has spoken.</text><circle cx="62" cy="344" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="352.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><rect x="108" y="408" width="522" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="442.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Control of structure</text><text x="128" y="470.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">One character at a time, so each act reveals a new link to</text><text x="128" y="491.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the victim; he is the engine of the play.</text><circle cx="62" cy="462" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="470.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><rect x="108" y="526" width="522" height="108" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="560.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Language and stage directions</text><text x="128" y="588.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Direct speech that takes charge, against the family’s</text><text x="128" y="609.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">attempts to evade.</text><circle cx="62" cy="580" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="588.64" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><rect x="108" y="644" width="522" height="129" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="128" y="678.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Exit and ending</text><text x="128" y="706.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">His final speech, departure and the telephone call twist</text><text x="128" y="727.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">leave his status ambiguous and his message with the</text><text x="128" y="748.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">audience.</text><circle cx="62" cy="708.5" r="24" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="62" y="717.14" font-size="24" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><line x1="634" y1="344" x2="652" y2="344" stroke="#2e6b62" stroke-width="2.5"/><rect x="656" y="316" width="214" height="56" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="763" y="348.3" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">structure: timing</text><line x1="634" y1="462" x2="652" y2="462" stroke="#2e6b62" stroke-width="2.5"/><rect x="656" y="434" width="214" height="56" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="763" y="466.3" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">structure</text><line x1="634" y1="580" x2="652" y2="580" stroke="#2e6b62" stroke-width="2.5"/><rect x="656" y="552" width="214" height="62" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="763" y="576.8" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">language, stage</text><text x="763" y="597.8" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">directions</text><line x1="634" y1="708.5" x2="652" y2="708.5" stroke="#2e6b62" stroke-width="2.5"/><rect x="656" y="680.5" width="214" height="56" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="763" y="712.8" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">structure: ending</text><text x="763" y="282" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">AO2 method</text>
</svg>