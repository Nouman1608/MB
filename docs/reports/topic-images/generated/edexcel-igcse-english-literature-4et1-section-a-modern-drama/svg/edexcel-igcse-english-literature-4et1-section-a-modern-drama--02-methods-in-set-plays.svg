<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 840" width="900" height="840" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="840" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">A signature method in each set play</text>

<rect x="30" y="108" width="840" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="86" cy="170" r="26" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><line x1="118" y1="170" x2="140" y2="170" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><circle cx="172" cy="170" r="22" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><line x1="200" y1="170" x2="210" y2="170" stroke="#1e2a44" stroke-width="2.5"/><line x1="191.79898987322332" y1="189.79898987322332" x2="198.8700576850888" y2="196.8700576850888" stroke="#1e2a44" stroke-width="2.5"/><line x1="172" y1="198" x2="172" y2="208" stroke="#1e2a44" stroke-width="2.5"/><line x1="152.20101012677668" y1="189.79898987322332" x2="145.1299423149112" y2="196.8700576850888" stroke="#1e2a44" stroke-width="2.5"/><line x1="144" y1="170" x2="134" y2="170" stroke="#1e2a44" stroke-width="2.5"/><line x1="152.20101012677668" y1="150.20101012677668" x2="145.12994231491118" y2="143.1299423149112" stroke="#1e2a44" stroke-width="2.5"/><line x1="172" y1="142" x2="172" y2="132" stroke="#1e2a44" stroke-width="2.5"/><line x1="191.79898987322332" y1="150.20101012677668" x2="198.8700576850888" y2="143.12994231491118" stroke="#1e2a44" stroke-width="2.5"/><text x="86" y="220" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">soft</text><text x="172" y="224" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">harder</text><text x="240" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">An Inspector Calls</text><text x="240" y="174" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Lighting changes from soft and intimate to brighter and harder when the</text><text x="240" y="195" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Inspector arrives; the doorbell interrupts Birling; dramatic irony for an</text><text x="240" y="216" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">audience after 1945.</text><rect x="30" y="252" width="840" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M87,362 L92,310 Q104,300 116,310 L121,362 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="104" cy="290" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><line x1="130" y1="322" x2="194" y2="322" stroke="#2e6b62" stroke-width="3" marker-end="url(#ahT)"/><path d="M204,292 a14,14 0 0 1 0,60" fill="none" stroke="#4a5568" stroke-width="3"/><text x="162" y="310" font-size="15" font-weight="600" fill="#2e6b62" text-anchor="middle">to us</text><text x="240" y="290" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">A View from the Bridge</text><text x="240" y="318" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Alfieri speaks directly to the audience as a narrator and chorus-like</text><text x="240" y="339" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">figure, framing Eddie’s story as a tragedy whose ending is foreseen.</text><rect x="30" y="396" width="840" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="58" y="402" width="156" height="118" rx="8" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><line x1="136" y1="414" x2="136" y2="510" stroke="#1e2a44" stroke-width="2" stroke-dasharray="6 5"/><path d="M85.8,512 L88.8,480.8 Q96,474.8 103.2,480.8 L106.2,512 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="96" cy="468.8" r="7.8" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><path d="M162.4,512 L166.4,470.4 Q176,462.4 185.6,470.4 L189.6,512 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="176" cy="454.4" r="10.4" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="96" y="426" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">past</text><text x="176" y="426" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">present</text><text x="240" y="434" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">Kindertransport</text><text x="240" y="462" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">The child Eva and the adult Evelyn share the stage, so past and present</text><text x="240" y="483" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">overlap and cause and consequence sit side by side.</text><rect x="30" y="540" width="840" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M60,556 L104,556 L126,578 L126,648 L60,648 Z" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><path d="M104,556 L104,578 L126,578" fill="#c9d6d4" stroke="#1e2a44" stroke-width="2"/><line x1="72" y1="586" x2="92.64" y2="586" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><line x1="72" y1="600" x2="110.64" y2="600" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><line x1="72" y1="614" x2="103.5" y2="614" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><line x1="72" y1="628" x2="110.64" y2="628" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><line x1="72" y1="642" x2="110.64" y2="642" stroke="#c9d6d4" stroke-width="5" stroke-linecap="round"/><path d="M159,652 L164,600 Q176,590 188,600 L193,652 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5" stroke-linejoin="round"/><circle cx="176" cy="580" r="13" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><path d="M148,592 q-8,10 0,20 M204,592 q8,10 0,20" fill="none" stroke="#b5602e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="240" y="578" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">The Curious Incident of the Dog in the Night-time</text><text x="240" y="606" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Narration from Christopher’s writing and highly physical staging let the</text><text x="240" y="627" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">audience experience the world from his perspective.</text><rect x="30" y="684" width="840" height="132" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><ellipse cx="109" cy="724" rx="38" ry="12" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><path d="M71,724 L79,788 Q109,800 139,788 L147,724" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><line x1="124" y1="710" x2="154" y2="698" stroke="#1e2a44" stroke-width="4" stroke-linecap="round"/><circle cx="182" cy="776" r="8" fill="#1e2a44"/><line x1="189" y1="776" x2="189" y2="736" stroke="#1e2a44" stroke-width="3"/><path d="M189,736 q10,6 14,18" fill="none" stroke="#1e2a44" stroke-width="3"/><text x="240" y="722" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start" font-style="italic">Death and the King’s Horseman</text><text x="240" y="750" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Music, drumming, dance and ritual language are central to meaning.</text>
</svg>