<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 605" width="900" height="605" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="605" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Open-book technique</text>

<rect x="30" y="112" width="840" height="96" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="88" cy="160" r="30" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><path d="M88,160 L88,130 A30,30 0 1 1 88,190 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><line x1="88" y1="160" x2="88" y2="138" stroke="#1e2a44" stroke-width="3"/><text x="140" y="154" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">About 45 minutes per essay, including planning</text><text x="140" y="182" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Two equal essays in 90 minutes</text><rect x="30" y="228" width="410" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="263.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Know where things are</text><text x="50" y="291.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Find key scenes, speeches and stage</text><text x="50" y="312.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">directions fast from act and scene</text><text x="50" y="333.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">divisions.</text><rect x="460" y="228" width="410" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="273.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Use the book, do not copy it</text><text x="480" y="302.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Quote a few words; long quotations waste</text><text x="480" y="323.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">time and hide your point.</text><rect x="30" y="374" width="410" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="409.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Plan first</text><text x="50" y="437.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Decide three or four moments before opening</text><text x="50" y="458.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the text, then look up the evidence.</text><rect x="460" y="374" width="410" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="480" y="409.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Watch the clock</text><text x="480" y="437.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Searching can swallow time: a quick check</text><text x="480" y="458.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">per point.</text><circle cx="408" cy="260" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="408" y="266.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><circle cx="838" cy="260" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="838" y="266.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><circle cx="408" cy="406" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="408" y="412.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><circle cx="838" cy="406" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="838" y="412.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><rect x="30" y="501" width="840" height="80" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="534.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Your copy of the prescribed edition must be completely unmarked. Keep notes in a separate</text><text x="50" y="556.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">study copy.</text>
</svg>