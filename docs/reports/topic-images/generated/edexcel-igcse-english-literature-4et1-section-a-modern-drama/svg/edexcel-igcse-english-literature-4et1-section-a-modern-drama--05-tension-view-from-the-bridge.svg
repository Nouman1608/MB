<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 611" width="900" height="611" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="611" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How tension is created on stage</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">A View from the Bridge, end of Act One</text>
<rect x="30" y="140" width="264" height="158" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="162" y="173" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">STAGING</text><text x="162" y="199.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Marco lifts the</text><text x="162" y="224.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">chair</text><text x="162" y="252.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">A silent physical action</text><text x="162" y="273.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">replaces words.</text><rect x="318" y="140" width="264" height="158" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="185.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">POWER</text><text x="450" y="211.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Eddie and Marco</text><text x="450" y="240.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Power shifts between the</text><text x="450" y="261.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">two men.</text><rect x="606" y="140" width="264" height="158" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="738" y="185.5" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">FRAMING</text><text x="738" y="211.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Alfieri</text><text x="738" y="240.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">He has already told us the</text><text x="738" y="261.3" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">story will end badly.</text><line x1="162" y1="304" x2="330" y2="370" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="304" x2="450" y2="370" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="738" y1="304" x2="570" y2="370" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="200" y="378" width="500" height="65" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="415.6" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">The audience watches with dread</text><text x="450" y="483" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">The same method for any question</text><rect x="30" y="499" width="249.33333333333334" height="86" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="154.66666666666669" y="546.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Claim</text><line x1="285.33333333333337" y1="542" x2="319.33333333333337" y2="542" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="325.33333333333337" y="499" width="249.33333333333334" height="86" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450.00000000000006" y="546.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Method</text><line x1="580.6666666666667" y1="542" x2="614.6666666666667" y2="542" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="620.6666666666667" y="499" width="249.33333333333334" height="86" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="745.3333333333334" y="534.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Effect on the</text><text x="745.3333333333334" y="559.2" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">audience</text>
</svg>