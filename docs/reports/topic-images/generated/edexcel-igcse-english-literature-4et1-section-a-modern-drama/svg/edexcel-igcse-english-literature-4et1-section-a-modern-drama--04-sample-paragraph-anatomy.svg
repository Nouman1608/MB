<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 708" width="900" height="708" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="708" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Inside a strong drama paragraph</text>

<rect x="150" y="116" width="720" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="170" y="149" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">CLAIM</text><text x="170" y="179.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Priestley establishes the Inspector’s power through the timing of his</text><text x="170" y="201.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">entrance.</text><rect x="150" y="236" width="720" height="110" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="170" y="269" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">METHOD: STRUCTURE</text><text x="170" y="299.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The doorbell rings just as Birling is telling the young men that a man should</text><text x="170" y="321.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">look after himself and his own.</text><rect x="150" y="356" width="720" height="110" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="170" y="389" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">METHOD: STAGE DIRECTION</text><text x="170" y="419.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The lighting changes from a soft, intimate glow to something “brighter and</text><text x="170" y="441.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">harder”.</text><rect x="150" y="476" width="720" height="88" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="170" y="509" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">EFFECT ON THE AUDIENCE</text><text x="170" y="539.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Comfortable illusions are about to be exposed.</text><rect x="150" y="574" width="720" height="110" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="170" y="607" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">LINK BACK</text><text x="170" y="637.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">The Inspector is powerful from the start because the play itself seems to be</text><text x="170" y="659.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">on his side.</text><line x1="90" y1="146" x2="90" y2="654" stroke="#c9d6d4" stroke-width="4"/><rect x="50" y="154" width="80" height="32" rx="16" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="90" y="175.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">AO1</text><rect x="50" y="274" width="80" height="32" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="90" y="295.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">AO2</text><rect x="50" y="394" width="80" height="32" rx="16" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="90" y="415.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">AO2</text><rect x="50" y="503" width="80" height="32" rx="16" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="90" y="524.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">AO2</text><rect x="50" y="612" width="80" height="32" rx="16" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="90" y="633.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">AO1</text>
</svg>