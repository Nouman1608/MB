<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 716" width="900" height="716" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="716" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Write about a play as a play</text>

<line x1="330" y1="168" x2="375.2" y2="279.15" stroke="#1e2a44" stroke-width="2.5"/><line x1="330" y1="282" x2="375.2" y2="319.05" stroke="#1e2a44" stroke-width="2.5"/><line x1="330" y1="396" x2="375.2" y2="358.95" stroke="#1e2a44" stroke-width="2.5"/><line x1="330" y1="510" x2="375.2" y2="398.85" stroke="#1e2a44" stroke-width="2.5"/><line x1="570" y1="168" x2="524.8" y2="279.15" stroke="#1e2a44" stroke-width="2.5"/><line x1="570" y1="282" x2="524.8" y2="319.05" stroke="#1e2a44" stroke-width="2.5"/><line x1="570" y1="396" x2="524.8" y2="358.95" stroke="#1e2a44" stroke-width="2.5"/><line x1="570" y1="510" x2="524.8" y2="398.85" stroke="#1e2a44" stroke-width="2.5"/><circle cx="450" cy="339" r="88" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="450" y="332.875" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">The</text><text x="450" y="359.125" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">audience</text><g transform="translate(0,0)"><rect x="30" y="118" width="300" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="148.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Stage directions</text><text x="46" y="176.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">lighting, sound, movement,</text><text x="46" y="197.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">pauses, tone</text><rect x="30" y="232" width="300" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="262.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Entrances and exits</text><text x="46" y="290.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">who arrives or leaves at a key</text><text x="46" y="311.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">moment</text><rect x="30" y="346" width="300" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="376.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Dramatic irony</text><text x="46" y="404.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">what the audience knows that a</text><text x="46" y="425.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">character does not</text><rect x="30" y="460" width="300" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="46" y="490.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Narrators and framing</text><text x="46" y="518.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">who speaks to the audience</text><text x="46" y="539.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">directly</text></g><g transform="translate(0,0)"><rect x="570" y="118" width="300" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="586" y="148.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Structure</text><text x="586" y="176.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">act endings, cliffhangers, time</text><text x="586" y="197.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">shifts, a circular shape</text><rect x="570" y="232" width="300" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="586" y="262.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Dialogue</text><text x="586" y="290.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">who interrupts, who has long</text><text x="586" y="311.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">speeches, who goes silent</text><rect x="570" y="346" width="300" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="586" y="376.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Staging and setting</text><text x="586" y="404.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">what the set suggests; does it</text><text x="586" y="425.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">change?</text><rect x="570" y="460" width="300" height="100" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="586" y="490.4" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Characters as devices</text><text x="586" y="518.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">carrying the message or testing</text><text x="586" y="539.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the others</text></g><rect x="30" y="582" width="408" height="110" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="50" y="615" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">TREATS IT LIKE A NOVEL</text><text x="50" y="645.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Characters as real people; quotes only</text><text x="50" y="667.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">dialogue.</text><rect x="462" y="582" width="408" height="110" rx="14" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="482" y="615" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">TREATS IT AS A PLAY</text><text x="482" y="645.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">“An audience would feel…”, “on stage, this</text><text x="482" y="667.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">would…”</text>
</svg>