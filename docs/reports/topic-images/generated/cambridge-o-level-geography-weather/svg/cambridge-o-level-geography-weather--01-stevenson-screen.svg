ine x1="368" y1="338" x2="532" y2="344" stroke="#4a5568" stroke-width="1.6"/><line x1="368" y1="352" x2="532" y2="358" stroke="#4a5568" stroke-width="1.6"/><line x1="380" y1="370" x2="380" y2="470" stroke="#9c8f6e" stroke-width="6"/><line x1="520" y1="370" x2="520" y2="470" stroke="#9c8f6e" stroke-width="6"/><line x1="320" y1="370" x2="320" y2="470" stroke="#2e6b62" stroke-width="2"/><path d="M314,380 L320,370 L326,380 M314,460 L320,470 L326,460" fill="none" stroke="#2e6b62" stroke-width="2"/><rect x="205" y="410.75" width="111" height="20.25" rx="5" fill="#ffffff" opacity="0.92"/><text x="310" y="425" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="end">about 1.2 m</text><g opacity="0.55"><rect x="700" y="430" width="48" height="38.400000000000006" fill="#ffffff" stroke="#1e2a44" stroke-width="2.2"/><path d="M695.2,430 L724,409.2 L752.8,430 Z" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/></g><line x1="680" y1="390" x2="770" y2="480" stroke="#b5602e" stroke-width="4"/><line x1="770" y1="390" x2="680" y2="480" stroke="#b5602e" stroke-width="4"/><rect x="156.1" y="446.6" width="7.800000000000001" height="23.400000000000002" fill="#9c8f6e" stroke="#1e2a44" stroke-width="1.8"/><circle cx="160" cy="431" r="20.8" fill="#6f9a52" stroke="#1e2a44" stroke-width="2"/><line x1="120" y1="380" x2="200" y2="475" stroke="#b5602e" stroke-width="4"/><line x1="200" y1="380" x2="120" y2="475" stroke="#b5602e" stroke-width="4"/><line x1="480" y1="220" x2="600" y2="160" stroke="#1e2a44" stroke-width="1.8"/><circle cx="480" cy="220" r="4" fill="#1e2a44" stroke="#1e2a44" stroke-width="1"/><rect x="600" y="141.275" width="114.3" height="20.925" rx="5" fill="#ffffff" opacity="0.92"/><text x="606" y="156" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">Double roof</text><rect x="600" y="161.75" width="259.5" height="20.25" rx="5" fill="#ffffff" opacity="0.92"/><text x="606" y="176" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">less heating from overhead Sun</text><line x1="530" y1="280" x2="600" y2="225" stroke="#1e2a44" stroke-width="1.8"/><circle cx="530" cy="280" r="4" fill="#1e2a44" stroke="#1e2a44" stroke-width="1"/><rect x="600" y="206.275" width="132.89999999999998" height="20.925" rx="5" fill="#ffffff" opacity="0.92"/><text x="606" y="221" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">Painted white</text><rect x="600" y="226.75" width="243.00000000000003" height="20.25" rx="5" fill="#ffffff" opacity="0.92"/><text x="606" y="241" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">reflects the Sun’s radiation</text><line x1="530" y1="340" x2="600" y2="290" stroke="#1e2a44" stroke-width="1.8"/><circle cx="530" cy="340" r="4" fill="#1e2a44" stroke="#1e2a44" stroke-width="1"/><rect x="600" y="271.275" width="132.89999999999998" height="20.925" rx="5" fill="#ffffff" opacity="0.92"/><text x="606" y="286" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">Louvred sides</text><rect x="600" y="291.75" width="210.00000000000003" height="20.25" rx="5" fill="#ffffff" opacity="0.92"/><text x="606" y="306" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">air in; sun and rain out</text><line x1="420" y1="490" x2="480" y2="510" stroke="#1e2a44" stroke-width="1.8"/><circle cx="420" cy="490" r="4" fill="#1e2a44" stroke="#1e2a44" stroke-width="1"/><rect x="480" y="491.275" width="198" height="20.925" rx="5" fill="#ffffff" opacity="0.92"/><text x="486" y="506" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">On grass in the open</text><rect x="480" y="511.75" width="317.25" height="20.25" rx="5" fill="#ffffff" opacity="0.92"/><text x="486" y="526" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">not tarmac; away from walls and trees</text><rect x="54" y="221.275" width="272.4" height="20.925" rx="5" fill="#ffffff" opacity="0.92"/><text x="60" y="236" font-size="15.5" font-weight="700" fill="#1e2a44" text-anchor="start">Door opens away from the Sun</text><rect x="54" y="241.75" width="292.5" height="20.25" rx="5" fill="#ffffff" opacity="0.92"/><text x="60" y="256" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">(north in the northern hemisphere)</text><rect x="30" y="570" width="840" height="120" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="606" font-size="16.5" font-weight="700" fill="#1e2a44" text-anchor="start">Purpose: air temperature and humidity in the shade, so readings can be fairly compared.</text><text x="55" y="636" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Inside: maximum-minimum thermometer, wet-and-dry bulb thermometer.</text><text x="55" y="662" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Outside (must be exposed): rain gauge, anemometer, wind vane, sunshine recorder.</text>
