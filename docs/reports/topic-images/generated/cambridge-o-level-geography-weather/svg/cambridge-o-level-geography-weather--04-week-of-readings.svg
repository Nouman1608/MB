<rect x="30" y="110" width="840" height="450" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="120" y1="470" x2="568" y2="470" stroke="#1e2a44" stroke-width="2.5"/><line x1="120" y1="470" x2="120" y2="140" stroke="#1e2a44" stroke-width="2.5"/><line x1="568" y1="470" x2="568" y2="140" stroke="#1e2a44" stroke-width="2.5"/><text x="110" y="475" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">0</text><text x="110" y="405" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">10</text><line x1="120" y1="400" x2="568" y2="400" stroke="#c9d6d4" stroke-width="1"/><text x="110" y="335" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">20</text><line x1="120" y1="330" x2="568" y2="330" stroke="#c9d6d4" stroke-width="1"/><text x="110" y="265" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">30</text><line x1="120" y1="260" x2="568" y2="260" stroke="#c9d6d4" stroke-width="1"/><text x="110" y="195" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">40</text><line x1="120" y1="190" x2="568" y2="190" stroke="#c9d6d4" stroke-width="1"/><text x="578" y="475" font-size="15" font-weight="400" fill="#2b5a9a" text-anchor="start">0</text><text x="578" y="405" font-size="15" font-weight="400" fill="#2b5a9a" text-anchor="start">10</text><text x="578" y="335" font-size="15" font-weight="400" fill="#2b5a9a" text-anchor="start">20</text><text x="578" y="265" font-size="15" font-weight="400" fill="#2b5a9a" text-anchor="start">30</text><text x="578" y="195" font-size="15" font-weight="400" fill="#2b5a9a" text-anchor="start">40</text><text x="80" y="150" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">°C</text><text x="596" y="150" font-size="15" font-weight="700" fill="#2b5a9a" text-anchor="middle">mm</text><text x="152" y="494" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Mon</text><rect x="200" y="386" width="32" height="84" fill="#b5d3cf" stroke="#2e6b62" stroke-width="1.5"/><text x="216" y="494" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Tue</text><rect x="264" y="295" width="32" height="175" fill="#b5d3cf" stroke="#2e6b62" stroke-width="1.5"/><text x="280" y="494" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Wed</text><rect x="328" y="449" width="32" height="21" fill="#b5d3cf" stroke="#2e6b62" stroke-width="1.5"/><text x="344" y="494" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Thu</text><text x="408" y="494" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Fri</text><text x="472" y="494" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Sat</text><rect x="520" y="428" width="32" height="42" fill="#b5d3cf" stroke="#2e6b62" stroke-width="1.5"/><text x="536" y="494" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">Sun</text><polyline points="152,253 216,239 280,267 344,281 408,260 472,246 536,232" fill="none" stroke="#b5602e" stroke-width="4"/><polyline points="152,316 216,309 280,323 344,337 408,330 472,316 536,302" fill="none" stroke="#8a6d0d" stroke-width="4"/><circle cx="152" cy="253" r="5" fill="#b5602e" stroke="#1e2a44" stroke-width="1.4"/><circle cx="152" cy="316" r="5" fill="#8a6d0d" stroke="#1e2a44" stroke-width="1.4"/><circle cx="216" cy="239" r="5" fill="#b5602e" stroke="#1e2a44" stroke-width="1.4"/><circle cx="216" cy="309" r="5" fill="#8a6d0d" stroke="#1e2a44" stroke-width="1.4"/><circle cx="280" cy="267" r="5" fill="#b5602e" stroke="#1e2a44" stroke-width="1.4"/><circle cx="280" cy="323" r="5" fill="#8a6d0d" stroke="#1e2a44" stroke-width="1.4"/><circle cx="344" cy="281" r="5" fill="#b5602e" stroke="#1e2a44" stroke-width="1.4"/><circle cx="344" cy="337" r="5" fill="#8a6d0d" stroke="#1e2a44" stroke-width="1.4"/><circle cx="408" cy="260" r="5" fill="#b5602e" stroke="#1e2a44" stroke-width="1.4"/><circle cx="408" cy="330" r="5" fill="#8a6d0d" stroke="#1e2a44" stroke-width="1.4"/><circle cx="472" cy="246" r="5" fill="#b5602e" stroke="#1e2a44" stroke-width="1.4"/><circle cx="472" cy="316" r="5" fill="#8a6d0d" stroke="#1e2a44" stroke-width="1.4"/><circle cx="536" cy="232" r="5" fill="#b5602e" stroke="#1e2a44" stroke-width="1.4"/><circle cx="536" cy="302" r="5" fill="#8a6d0d" stroke="#1e2a44" stroke-width="1.4"/><text x="128" y="160" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">max</text><text x="128" y="330" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">min</text><text x="128" y="458" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">rainfall (bars)</text><rect x="650" y="130" width="205" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="156" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Daily range (Tue)</text><text x="664" y="184" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">33 − 23 = 10 °C</text><rect x="650" y="214" width="205" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="240" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Mean temp (Wed)</text><text x="664" y="268" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">(29 + 21) ÷ 2 = 25 °C</text><rect x="650" y="298" width="205" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="324" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Total rain = 46 mm</text><text x="664" y="352" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">0+12+25+3+0+0+6</text><rect x="650" y="382" width="205" height="74" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="664" y="408" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Mean daily rain</text><text x="664" y="436" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">46 ÷ 7 = 6.6 mm</text><rect x="650" y="466" width="205" height="74" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="664" y="492" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">Week’s range</text><text x="664" y="520" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">34 − 19 = 15 °C</text><text x="450" y="590" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">The mean of 6.6 mm hides three completely dry days. Always give the unit.</text>
