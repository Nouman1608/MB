<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="620" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Three instruments to get exactly right</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Schematic, not to scale</text>
<rect x="30" y="110" width="270" height="490" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165" y="146" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Max-min thermometer</text><path d="M110,190 L110,430 Q110,470 150,470 Q190,470 190,430 L190,190" fill="none" stroke="#1e2a44" stroke-width="16" stroke-linejoin="round" stroke-linecap="round" /><path d="M110,190 L110,430 Q110,470 150,470 Q190,470 190,430 L190,190" fill="none" stroke="#ffffff" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" /><path d="M110,330 L110,430 Q110,470 150,470 Q190,470 190,430 L190,270" fill="none" stroke="#b5602e" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" /><rect x="103" y="314" width="14" height="10" fill="#2b5a9a"/><rect x="183" y="254" width="14" height="10" fill="#2b5a9a"/><rect x="198" y="247.75" width="102" height="20.25" rx="5" fill="#ffffff" opacity="0.92"/><text x="204" y="262" font-size="15" font-weight="700" fill="#2b5a9a" text-anchor="start">max marker</text><rect x="36" y="297.75" width="39" height="20.25" rx="5" fill="#ffffff" opacity="0.92"/><text x="42" y="312" font-size="15" font-weight="700" fill="#2b5a9a" text-anchor="start">min</text><rect x="36" y="315.75" width="61.50000000000001" height="20.25" rx="5" fill="#ffffff" opacity="0.92"/><text x="42" y="330" font-size="15" font-weight="400" fill="#2b5a9a" text-anchor="start">marker</text><text x="48" y="505" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Markers stay at the highest</text><text x="48" y="524" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">and lowest temperatures; read</text><text x="48" y="543" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">the end nearest the liquid;</text><text x="48" y="562" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">reset with a magnet.</text><rect x="315" y="110" width="270" height="490" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="146" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Wet-and-dry bulb</text><rect x="393" y="180" width="14" height="190" rx="7" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="397" y="220" width="6" height="150" fill="#b5602e"/><circle cx="400" cy="380" r="12" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="493" y="180" width="14" height="190" rx="7" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="497" y="260" width="6" height="110" fill="#b5602e"/><circle cx="500" cy="380" r="12" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="486" y="370" width="28" height="26" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="400" y="420" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">dry</text><text x="500" y="420" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">wet (muslin)</text><text x="333" y="440" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">Evaporation cools the wet</text><text x="333" y="459" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">bulb. The difference gives</text><text x="333" y="478" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">relative humidity (from a</text><text x="333" y="497" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">table).</text><rect x="333" y="520" width="234" height="66" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="345" y="544" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">28 / 28 °C: no difference,</text><text x="345" y="563" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">saturated, 100% RH</text><text x="345" y="580" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">28 / 20 °C: much drier air</text><rect x="600" y="110" width="270" height="490" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="735" y="146" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Wind vane</text><line x1="735" y1="406" x2="735" y2="450" stroke="#1e2a44" stroke-width="4"/><line x1="685" y1="330" x2="785" y2="330" stroke="#4a5568" stroke-width="2"/><line x1="735" y1="280" x2="735" y2="380" stroke="#4a5568" stroke-width="2"/><text x="735" y="272" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">N</text><text x="735" y="398" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">S</text><text x="796" y="336" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">E</text><text x="668" y="336" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="end">W</text><line x1="775" y1="277" x2="703.2666639242833" y2="327.6915574935065" stroke="#b5602e" stroke-width="5"/><polygon points="686.9333443028669,339.2337700259741 698.5517789935677,317.55401044848065 711.2482127792821,335.5206620320388" fill="#b5602e" stroke="#1e2a44" stroke-width="1.5"/><polygon points="766.3433406006493,264.7500102839377 783.6566593993507,289.2499897160623 764.056675853651,303.10064475502344 746.7433570549496,278.6006653228988" fill="#b5602e" stroke="#1e2a44" stroke-width="1.5"/><line x1="650" y1="400" x2="712" y2="352" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)" stroke-dasharray="8 5"/><rect x="620" y="407.75" width="156" height="20.25" rx="5" fill="#ffffff" opacity="0.92"/><text x="626" y="422" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">wind from the SW</text><text x="618" y="470" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">The arrow points INTO the</text><text x="618" y="489" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">wind: towards where it comes</text><text x="618" y="508" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">from. A south-westerly blows</text><text x="618" y="527" font-size="15" font-weight="400" fill="#1e2a44" text-anchor="start">from the south-west.</text>
</svg>