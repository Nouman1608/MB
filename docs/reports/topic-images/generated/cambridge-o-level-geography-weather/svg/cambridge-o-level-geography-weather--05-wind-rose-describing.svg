<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="650" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Wind roses and describing weather graphs</text>

<rect x="30" y="110" width="440" height="520" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="250" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">A wind rose</text><text x="250" y="170" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">illustrative shape, no real data</text><circle cx="250" cy="380" r="60" fill="none" stroke="#c9d6d4" stroke-width="2"/><circle cx="250" cy="380" r="120" fill="none" stroke="#c9d6d4" stroke-width="2"/><path d="M262,380 L262,320 L238,320 L238,380 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="250" y="304" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">N</text><path d="M258.4852813742386,388.4852813742386 L286.7695526217005,360.2010101267767 L269.7989898732233,343.2304473782995 L241.51471862576142,371.5147186257614 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="307.9827560572969" y="328.0172439427031" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">NE</text><path d="M250,392 L280,392 L280,368 L250,368 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="332" y="386" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">E</text><path d="M241.51471862576142,388.4852813742386 L273.3345237791561,420.3050865276332 L290.30508652763325,403.33452377915603 L258.4852813742386,371.5147186257614 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="307.9827560572969" y="443.9827560572969" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">SE</text><path d="M238,380 L238,450 L262,450 L262,380 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="250" y="478" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">S</text><path d="M241.51471862576142,371.5147186257614 L128.3776336359138,484.651803615609 L145.34819638439097,501.6223663640862 L258.4852813742386,388.4852813742386 Z" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="121.30656582404836" y="514.6934341759517" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">SW</text><path d="M250,368 L140,368 L140,392 L250,392 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="118" y="386" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">W</text><path d="M258.4852813742386,371.5147186257614 L219.59440840897847,332.62384566050133 L202.6238456605013,349.5944084089785 L241.51471862576142,388.4852813742386 Z" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="192.0172439427031" y="328.0172439427031" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">NW</text><circle cx="250" cy="380" r="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><rect x="113.5" y="557.75" width="273" height="20.25" rx="5" fill="#ffffff" opacity="0.92"/><text x="250" y="572" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">longest arm = prevailing wind</text><rect x="136.75" y="579.75" width="226.50000000000003" height="20.25" rx="5" fill="#ffffff" opacity="0.92"/><text x="250" y="594" font-size="15" font-weight="400" fill="#8a6d0d" text-anchor="middle">(here from the south-west)</text><text x="490" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Describing any graph</text><rect x="490" y="166" width="380" height="98" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="522" cy="215" r="17" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="522" y="221.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="552" y="206" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Overall pattern first</text><text x="552" y="232" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">“temperature rises through the week”</text><rect x="490" y="278" width="380" height="98" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="522" cy="327" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="522" y="333.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="552" y="318" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Highest and lowest</text><text x="552" y="344" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">with units and when they occurred</text><rect x="490" y="390" width="380" height="98" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="522" cy="439" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="522" y="445.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="552" y="430" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Use data for change</text><text x="552" y="456" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">“25 mm on Wednesday to 0 mm on</text><text x="552" y="475" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Friday”</text><rect x="490" y="502" width="380" height="98" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><circle cx="522" cy="551" r="17" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="522" y="557.12" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="552" y="542" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Point out anomalies</text><text x="552" y="568" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">such as a single very wet day</text>
</svg>