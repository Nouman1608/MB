<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 683" width="900" height="683" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="683" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Fagen et al. (2014): teaching the trunk wash</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Positive reinforcement training of juvenile working elephants in Nepal</text>
<rect x="30" y="124" width="516.2962962962963" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">STEP A</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Bridge signal paired with food</text><text x="50" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the signal becomes a <tspan font-weight="700" fill="#1e2a44">secondary</tspan> <tspan font-weight="700" fill="#1e2a44">reinforcer</tspan> that marks the</text><text x="50" y="232.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">exact moment of a correct response</text><rect x="566.2962962962963" y="124" width="303.7037037037037" height="133" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="586.2962962962963" y="156" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">PRIMARY REINFORCER</text><text x="586.2962962962963" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Food</text><text x="586.2962962962963" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">meets a biological need</text><text x="450" y="293" font-size="15" font-weight="700" fill="#4a5568" text-anchor="middle">STEP B: EACH STEP SHAPED, THEN THE STEPS CHAINED</text><rect x="30" y="319" width="183" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="121.5" y="358.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Raise the trunk</text><line x1="219" y1="354" x2="243" y2="354" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="249" y="319" width="183" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="340.5" y="347.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Hold it up while</text><text x="340.5" y="370.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">liquid is put in</text><line x1="438" y1="354" x2="462" y2="354" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="468" y="319" width="183" height="70" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="559.5" y="358.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Lower the trunk</text><line x1="657" y1="354" x2="681" y2="354" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="687" y="319" width="183" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="778.5" y="358.54" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Full trunk wash</text><rect x="30" y="411" width="840" height="88" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="445.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Shaping a step</text><text x="50" y="474.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Reinforce lifting the trunk a little, then only lifting it fully, then only holding it up while liquid is introduced.</text><rect x="30" y="521" width="413" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="553" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">RESULT</text><text x="50" y="584.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Most elephants learned the full trunk wash</text><text x="50" y="605.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">through positive reinforcement alone: a humane</text><text x="50" y="626.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">alternative to punishment and dominance.</text><rect x="457" y="521" width="413" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="553" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">EVALUATION</text><text x="477" y="584.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Behavioural checklist gives quantitative records;</text><text x="477" y="605.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">but a tiny sample in one setting, and not every</text><text x="477" y="626.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">elephant reached the full behaviour.</text>
</svg>