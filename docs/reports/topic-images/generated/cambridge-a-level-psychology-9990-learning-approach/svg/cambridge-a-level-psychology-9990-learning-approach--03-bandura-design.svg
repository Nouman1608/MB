<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" width="900" height="780" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="780" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Bandura et al. (1961): design</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">72 children (36 boys, 36 girls), aged about 3 to 5, matched on existing aggression</text>
<rect x="250" y="124" width="400" height="62" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="160.38" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">72 children</text><line x1="380" y1="192" x2="200" y2="234" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="520" y1="192" x2="680" y2="234" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><rect x="30" y="254" width="340" height="113" rx="14" fill="#f4f6f6" stroke="#c9d6d4" stroke-width="2.5"/><text x="200" y="286" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">CONTROL</text><text x="200" y="313.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">24 children</text><text x="200" y="342.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">no model</text><rect x="420" y="254" width="450" height="113" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="645" y="286" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">MODEL CONDITIONS</text><text x="645" y="313.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">The other 48</text><text x="645" y="342.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">split by two factors</text><line x1="645" y1="373" x2="645" y2="425" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="560" y="449" font-size="15" font-weight="700" fill="#b5602e" text-anchor="middle">AGGRESSIVE MODEL</text><text x="760" y="449" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">NON-AGGRESSIVE MODEL</text><text x="450" y="507" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Same-sex model</text><text x="450" y="587" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Opposite-sex model</text><rect x="470" y="463" width="180" height="70" rx="12" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="560" y="494" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">aggressive,</text><text x="560" y="515" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">same sex</text><rect x="670" y="463" width="180" height="70" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="760" y="494" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">non-aggressive,</text><text x="760" y="515" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">same sex</text><rect x="470" y="543" width="180" height="70" rx="12" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="560" y="574" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">aggressive,</text><text x="560" y="595" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">opposite sex</text><rect x="670" y="543" width="180" height="70" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="760" y="574" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">non-aggressive,</text><text x="760" y="595" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">opposite sex</text><rect x="30" y="639" width="840" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="673.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Matched groups</text><text x="50" y="702.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Existing aggression was rated by an experimenter and a nursery teacher whose ratings agreed closely:</text><text x="50" y="723.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start"><tspan font-weight="700" fill="#1e2a44">high</tspan> <tspan font-weight="700" fill="#1e2a44">inter-rater</tspan> <tspan font-weight="700" fill="#1e2a44">reliability</tspan>.</text>
</svg>