<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 656" width="900" height="656" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="656" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Four learning processes, three studies</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Each core study illustrates a different process</text>
<rect x="30" y="124" width="270.6666666666667" height="178" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="156" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">SOCIAL LEARNING</text><text x="50" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Observe a model and</text><text x="50" y="206.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">imitate</text><text x="50" y="235.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">attention, retention,</text><text x="50" y="256.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reproduction, motivation;</text><text x="50" y="277.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">similar models imitated more</text><rect x="314.6666666666667" y="124" width="270.6666666666667" height="178" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="334.6666666666667" y="156" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">OPERANT CONDITIONING</text><text x="334.6666666666667" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Learn from</text><text x="334.6666666666667" y="206.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">consequences</text><text x="334.6666666666667" y="235.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reinforcement, primary and</text><text x="334.6666666666667" y="256.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">secondary reinforcers,</text><text x="334.6666666666667" y="277.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">shaping, chaining</text><rect x="599.3333333333334" y="124" width="270.6666666666667" height="178" rx="14" fill="#f6e3d8" stroke="#b5602e" stroke-width="2.5"/><text x="619.3333333333334" y="156" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">CLASSICAL + EVALUATIVE</text><text x="619.3333333333334" y="182.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Learn by association</text><text x="619.3333333333334" y="211.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a stimulus paired with an</text><text x="619.3333333333334" y="232.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">outcome; evaluative learning</text><text x="619.3333333333334" y="253.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">changes liking or disliking</text><line x1="165" y1="308" x2="165" y2="364" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="450" y1="308" x2="450" y2="364" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><line x1="735" y1="308" x2="735" y2="364" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="372" width="270.6666666666667" height="152" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="165.33333333333334" y="428.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Bandura et al. (1961)</text><text x="165.33333333333334" y="456.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">children imitate an aggressive</text><text x="165.33333333333334" y="477.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">adult model</text><rect x="314.6666666666667" y="372" width="270.6666666666667" height="152" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="428.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Fagen et al. (2014)</text><text x="450" y="456.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">elephants trained with</text><text x="450" y="477.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">positive reinforcement</text><rect x="599.3333333333334" y="372" width="270.6666666666667" height="152" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="734.6666666666667" y="406.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Saavedra and Silverman</text><text x="734.6666666666667" y="429.04" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">(2002)</text><text x="734.6666666666667" y="457.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">a boy's button phobia treated</text><text x="734.6666666666667" y="478.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">with exposure, then disgust</text><text x="734.6666666666667" y="499.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">imagery</text><rect x="30" y="546" width="840" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="578.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">All three measure <tspan font-weight="700" fill="#1e2a44">directly</tspan> <tspan font-weight="700" fill="#1e2a44">observable</tspan> <tspan font-weight="700" fill="#1e2a44">behaviour</tspan>: imitative acts, completed training steps, and approach</text><text x="450" y="599.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">to buttons with distress ratings.</text>
</svg>