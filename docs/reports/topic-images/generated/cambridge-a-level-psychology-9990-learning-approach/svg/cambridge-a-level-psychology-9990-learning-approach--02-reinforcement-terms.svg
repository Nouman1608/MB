<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="660" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Getting the operant terms right</text>

<rect x="30" y="100" width="410" height="113" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">POSITIVE REINFORCEMENT</text><text x="235" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Adds something pleasant</text><text x="235" y="188.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">after a behaviour</text><rect x="460" y="100" width="410" height="113" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="665" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">NEGATIVE REINFORCEMENT</text><text x="665" y="159.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Removes something unpleasant</text><text x="665" y="188.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">after a behaviour</text><text x="450" y="248.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Both make the behaviour <tspan font-weight="700">more</tspan> likely.</text><rect x="30" y="279" width="410" height="134" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="235" y="321.5" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">PRIMARY REINFORCER</text><text x="235" y="349.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Meets a biological need</text><text x="235" y="378.3" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">e.g. food</text><rect x="460" y="279" width="410" height="134" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="665" y="311" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="middle">SECONDARY REINFORCER</text><text x="665" y="338.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Gains value by pairing</text><text x="665" y="367.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">e.g. a sound that has repeatedly come just</text><text x="665" y="388.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">before food</text><rect x="30" y="435" width="410" height="113" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="467" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">SHAPING</text><text x="235" y="494.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Closer and closer approximations</text><text x="235" y="523.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">reinforce each step nearer the target behaviour</text><rect x="460" y="435" width="410" height="113" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="467" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="middle">BEHAVIOURAL CHAINING</text><text x="665" y="494.6" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Link learned steps</text><text x="665" y="523.8" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">into one sequence</text><rect x="30" y="570" width="840" height="58" rx="14" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="450" y="603.6" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Common mistake: secondary reinforcement is <tspan font-weight="700" fill="#1e2a44">not</tspan> negative reinforcement.</text>
</svg>