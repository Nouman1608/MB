<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 779" width="900" height="779" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="779" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Saavedra and Silverman (2002): button phobia</text>
<text x="450" y="92" text-anchor="middle" font-size="21" fill="#4a5568">Case study of a nine-year-old boy; disgust as well as fear</text>
<rect x="30" y="124" width="840" height="340" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><line x1="120" y1="404" x2="840" y2="404" stroke="#1e2a44" stroke-width="3"/><line x1="120" y1="404" x2="120" y2="154" stroke="#1e2a44" stroke-width="3"/><text x="480" y="438" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">treatment sessions</text><text x="98" y="279" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 98 279)">distress rating</text><text x="840" y="146" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">illustrative: no data in the lesson</text><rect x="121" y="154" width="359" height="250" fill="#dce9e7" opacity="0.5"/><rect x="480" y="154" width="359" height="250" fill="#f2e7b8" opacity="0.6"/><line x1="480" y1="154" x2="480" y2="404" stroke="#1e2a44" stroke-width="2" stroke-dasharray="7 6"/><text x="300" y="180" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Phase 1: exposure +</text><text x="300" y="200" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">contingency management</text><text x="660" y="180" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Phase 2: disgust imagery</text><text x="660" y="200" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">(evaluative learning) + exposure</text><path d="M130,199 C250,204 380,224 480,229 C540,239 580,329 680,349 L830,359" fill="none" stroke="#b5602e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><text x="300" y="245" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">only a little lower</text><text x="700" y="393" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">marked drop, kept at follow-up</text><rect x="30" y="486" width="413" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="518" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">BACKGROUND</text><text x="50" y="549.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Phobia began at about five when a bowl of</text><text x="50" y="570.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">buttons fell on him; plastic buttons were most</text><text x="50" y="591.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">distressing.</text><rect x="457" y="486" width="413" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="518" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">METHOD</text><text x="477" y="549.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Interviews, rating scales, observation;</text><text x="477" y="570.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">child-friendly distress ratings while approaching</text><text x="477" y="591.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">a hierarchy of buttons.</text><rect x="30" y="638" width="413" height="109" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="670" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">+ STRENGTH</text><text x="50" y="701.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Detailed, idiographic data; suggests a new</text><text x="50" y="722.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">direction for treatment.</text><rect x="457" y="638" width="413" height="109" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="670" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">− WEAKNESSES</text><text x="477" y="701.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">One child; treatments in sequence, so phase 2</text><text x="477" y="722.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">gains may partly be a delayed effect of phase 1.</text>
</svg>