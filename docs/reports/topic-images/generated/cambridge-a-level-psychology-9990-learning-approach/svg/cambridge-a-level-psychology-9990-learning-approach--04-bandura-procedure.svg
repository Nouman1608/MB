<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 674" width="900" height="674" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="674" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Bandura et al. (1961): three rooms</text>

<rect x="30" y="100" width="292.3076923076923" height="238" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ROOM 1</text><text x="50" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Watch the model</text><text x="50" y="187.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Child plays with stickers and</text><text x="50" y="208.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">potato prints; the adult model</text><text x="50" y="229.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">assembles toys quietly or attacks</text><text x="50" y="250.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">the Bobo doll: sits on it and</text><text x="50" y="271.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">punches its nose, hits it with a</text><text x="50" y="292.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mallet, tosses it in the air, kicks</text><text x="50" y="313.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">it, says "Pow".</text><line x1="328.3076923076923" y1="219" x2="356.3076923076923" y2="219" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="362.3076923076923" y="100" width="210.46153846153845" height="238" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="382.3076923076923" y="132" font-size="15" font-weight="700" fill="#8a6d0d" text-anchor="start">ROOM 2</text><text x="382.3076923076923" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Mild frustration</text><text x="382.3076923076923" y="187.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Shown attractive toys,</text><text x="382.3076923076923" y="208.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">then told they are</text><text x="382.3076923076923" y="229.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reserved for other</text><text x="382.3076923076923" y="250.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">children.</text><line x1="578.7692307692307" y1="219" x2="606.7692307692307" y2="219" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="612.7692307692307" y="100" width="257.2307692307693" height="238" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="632.7692307692307" y="132" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">ROOM 3</text><text x="632.7692307692307" y="158.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">20 minutes, observed</text><text x="632.7692307692307" y="187.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Aggressive toys (smaller</text><text x="632.7692307692307" y="208.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Bobo doll, mallet) and</text><text x="632.7692307692307" y="229.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">non-aggressive toys;</text><text x="632.7692307692307" y="250.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">watched through a one-way</text><text x="632.7692307692307" y="271.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">mirror; behaviour recorded</text><text x="632.7692307692307" y="292.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">every five seconds.</text><rect x="30" y="360" width="840" height="130" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="50" y="394.82" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Results</text><text x="50" y="423.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Aggressive-model children showed much more imitative physical and verbal aggression. Boys showed</text><text x="50" y="444.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">more imitative physical aggression than girls. Same-sex models tended to be imitated more, especially</text><text x="50" y="465.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">boys with the male model. <tspan font-weight="700" fill="#1e2a44">No</tspan> <tspan font-weight="700" fill="#1e2a44">reinforcement</tspan> <tspan font-weight="700" fill="#1e2a44">was</tspan> <tspan font-weight="700" fill="#1e2a44">given</tspan>: aggression was learned by observation.</text><rect x="30" y="512" width="413" height="130" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="544" font-size="15" font-weight="700" fill="#2e6b62" text-anchor="start">+ RELIABLE</text><text x="50" y="575.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Standardised model behaviour, matched groups,</text><text x="50" y="596.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">timed observation with more than one observer.</text><rect x="457" y="512" width="413" height="130" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="477" y="544" font-size="15" font-weight="700" fill="#b5602e" text-anchor="start">− VALIDITY AND ETHICS</text><text x="477" y="575.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">A doll designed to be hit, a stranger as model, an</text><text x="477" y="596.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">artificial setting; children frustrated and exposed</text><text x="477" y="617.8" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">to aggression.</text>
</svg>