<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 782" width="900" height="782" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="782" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">About 200 words in about 30 minutes</text>

<rect x="60" y="115" width="78" height="84" fill="#dce9e7" stroke="#1e2a44" stroke-width="3"/><text x="99" y="152" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3 min</text><text x="99" y="180" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Plan</text><rect x="138" y="115" width="572" height="84" fill="#b5d3cf" stroke="#1e2a44" stroke-width="3"/><text x="424" y="152" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">22 min</text><text x="424" y="180" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Write</text><rect x="710" y="115" width="130" height="84" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="775" y="152" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">5 min</text><text x="775" y="180" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">Check</text><text x="60" y="226" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">2 hours for 60 marks is about two minutes a mark: roughly 30 minutes for 16 marks</text><text x="450" y="260" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">A four-paragraph shape for about 200 words</text><rect x="30" y="278" width="840" height="79" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><circle cx="70" cy="317.5" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="70" y="324.7" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="110" y="323.5" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Introduce the subject; show format and purpose</text><text x="850" y="323.5" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">about 30 words</text><rect x="30" y="367" width="840" height="124.5" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="70" cy="429.25" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="70" y="436.45" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="110" y="435.25" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">First main point, developed</text><text x="850" y="435.25" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">about 60-70</text><rect x="30" y="501.5" width="840" height="124.5" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><circle cx="70" cy="563.75" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="70" y="570.95" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="110" y="569.75" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Second main point or the other side, developed</text><text x="850" y="569.75" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">about 60-70</text><rect x="30" y="636" width="840" height="85.5" rx="12" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><circle cx="70" cy="678.75" r="20" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="70" y="685.95" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="110" y="684.75" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">Conclusion: opinion, recommendation or final thought</text><text x="850" y="684.75" font-size="16" font-weight="400" fill="#4a5568" text-anchor="end">about 30-40</text><text x="450" y="753.5" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Far shorter usually means undeveloped points; far longer eats checking time.</text>
</svg>