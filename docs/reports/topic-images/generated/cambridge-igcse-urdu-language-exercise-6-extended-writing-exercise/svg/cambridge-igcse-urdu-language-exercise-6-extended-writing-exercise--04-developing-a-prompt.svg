<rect width="900" height="742" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From prompt to developed point</text>

<text x="450" y="128" font-size="20" font-weight="700" fill="#2e6b62" text-anchor="middle">Point  →  reason  →  example or consequence</text><rect x="30" y="150" width="840" height="96" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="186" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Prompt</text><text x="846" y="206" font-size="27" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کچھ پروگرام بہت لمبے تھے۔&#x200F;</text><text x="54" y="214" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">Some programmes were very long.</text><line x1="450" y1="250" x2="450" y2="274" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="278" width="840" height="96" rx="14" fill="#fbf1ea" stroke="#b5602e" stroke-width="2.5"/><text x="54" y="314" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">Undeveloped</text><text x="846" y="334" font-size="27" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کچھ پروگرام لمبے تھے۔&#x200F;</text><text x="54" y="342" font-size="15" font-weight="400" fill="#b5602e" text-anchor="start" font-style="italic">just restates the prompt</text><line x1="450" y1="378" x2="450" y2="402" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="30" y="406" width="840" height="276" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="442" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Developed</text><text x="846" y="492" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;تقریری مقابلہ تقریباً تین گھنٹے جاری رہا، جس کی وجہ سے&#x200F;</text><text x="846" y="550" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;چھوٹی جماعتوں کے بچے بے چین ہو گئے اور بہت سے لوگ&#x200F;</text><text x="846" y="608" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;انعامات کے اعلان سے پہلے ہی چلے گئے۔&#x200F;</text><text x="54" y="660" font-size="16" font-weight="400" fill="#2e6b62" text-anchor="start" font-style="italic">a specific event + a consequence with</text><text x="500" y="664" font-size="24" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;جس کی وجہ سے&#x200F;</text><text x="450" y="716" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">One sentence that shows W1, W2 and W3 together.</text>
</svg>