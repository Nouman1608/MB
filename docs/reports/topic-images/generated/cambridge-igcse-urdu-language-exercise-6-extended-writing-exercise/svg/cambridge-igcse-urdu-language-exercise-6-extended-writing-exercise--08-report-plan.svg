<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1070" width="900" height="1070" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="1070" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: a report on cultural week</text>

<rect x="30" y="110" width="268" height="100" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="50" y="145.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Purpose</text><text x="50" y="173.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">inform and recommend</text><rect x="316" y="110" width="268" height="100" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="336" y="145.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Format</text><text x="336" y="173.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">report: title, purpose,</text><text x="336" y="195.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">recommendations</text><rect x="602" y="110" width="268" height="100" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="622" y="145.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Audience</text><text x="622" y="173.6" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">the principal: formal</text><rect x="30" y="230" width="840" height="646" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="288" font-size="30" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;ثقافتی ہفتے کی رپورٹ&#x200F;</text><text x="450" y="322" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">title</text><rect x="46" y="342" width="808" height="160" rx="10" fill="#f2e7b8"/><circle cx="80" cy="376" r="18" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="80" y="382.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="110" y="374" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Title + purpose of the report</text><text x="110" y="398" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">what, when, aim of the week</text><text x="838" y="440" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;یہ رپورٹ اسکول میں پچھلے مہینے منائے گئے&#x200F;</text><text x="838" y="490" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;ثقافتی ہفتے کے بارے میں ہے۔&#x200F;</text><rect x="46" y="514" width="808" height="74" rx="10" fill="#dce9e7"/><circle cx="80" cy="548" r="18" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="80" y="554.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="110" y="546" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">What worked: the food fair</text><text x="110" y="570" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">each class, one province's dish; money to the library</text><rect x="46" y="600" width="808" height="74" rx="10" fill="#dce9e7"/><circle cx="80" cy="634" r="18" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="80" y="640.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="110" y="632" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">What did not: programmes too long</text><text x="110" y="656" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">speech contest; younger pupils restless</text><rect x="46" y="686" width="808" height="160" rx="10" fill="#f2e7b8"/><circle cx="80" cy="720" r="18" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="80" y="726.48" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="110" y="718" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Recommendations</text><text x="110" y="742" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">invite parents; a time limit for each programme</text><text x="838" y="784" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;سفارشات: میری تجویز ہے کہ اگلے سال&#x200F;</text><text x="838" y="834" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;والدین کو بھی مدعو کیا جائے&#x200F;</text><text x="450" y="926" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">The prompt is raised in register, not copied</text><rect x="30" y="946" width="400" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="50" y="974" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">prompt</text><text x="410" y="1014" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;والدین کو بھی بلانا چاہیے&#x200F;</text><line x1="438" y1="994" x2="462" y2="994" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><rect x="470" y="946" width="400" height="96" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2"/><text x="490" y="974" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="start">report</text><text x="850" y="1014" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;والدین کو بھی مدعو کیا جائے&#x200F;</text>
</svg>