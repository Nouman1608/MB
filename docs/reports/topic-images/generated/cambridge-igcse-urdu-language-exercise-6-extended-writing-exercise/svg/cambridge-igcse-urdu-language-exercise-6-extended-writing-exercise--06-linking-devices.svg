<rect x="30" y="110" width="840" height="595" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,160 L31.25,124 Q31.25,111.25 44,111.25 L856,111.25 Q868.75,111.25 868.75,124 L868.75,160 Z" fill="#b5d3cf"/><text x="46" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Function</text><text x="854" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Urdu</text><line x1="250" y1="110" x2="250" y2="705" stroke="#c9d6d4" stroke-width="2"/><line x1="30" y1="160" x2="870" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="219.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Adding</text><text x="854" y="221" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;اس کے علاوہ، مزید یہ کہ، نیز&#x200F;</text><text x="854" y="255" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">besides, moreover, also</text><line x1="30" y1="269" x2="870" y2="269" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="328.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Contrasting</text><text x="854" y="330" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;لیکن، تاہم، دوسری طرف، اس کے باوجود&#x200F;</text><text x="854" y="364" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">but, however, on the other hand, despite this</text><line x1="30" y1="378" x2="870" y2="378" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="437.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Cause and result</text><text x="854" y="439" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کیونکہ، اس لیے، اس کی وجہ سے، چنانچہ&#x200F;</text><text x="854" y="473" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">because, so, because of this, consequently</text><line x1="30" y1="487" x2="870" y2="487" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="546.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Sequencing</text><text x="854" y="548" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;سب سے پہلے، پھر، آخر میں&#x200F;</text><text x="854" y="582" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">first of all, then, finally</text><line x1="30" y1="596" x2="870" y2="596" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="655.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Concluding</text><text x="854" y="657" font-size="25" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;مختصر یہ کہ، ان تمام باتوں کو دیکھتے ہوئے&#x200F;</text><text x="854" y="691" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">in short, considering all of this</text>
