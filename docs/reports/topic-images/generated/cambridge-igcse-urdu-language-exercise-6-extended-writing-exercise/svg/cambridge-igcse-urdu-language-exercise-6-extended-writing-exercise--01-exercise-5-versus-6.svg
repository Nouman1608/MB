<rect width="900" height="662" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Exercise 6 compared with Exercise 5</text>

<rect x="30" y="110" width="410" height="380" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="150" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">Exercise 5</text><text x="54" y="200" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">MARKS</text><text x="54" y="228" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="start">8</text><text x="54" y="270" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">LENGTH</text><text x="54" y="298" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="start">about 120 words</text><text x="54" y="340" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">KIND OF WRITING</text><text x="54" y="368" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="start">functional, e.g. an email</text><text x="54" y="410" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">STIMULUS</text><text x="54" y="438" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="start">prompts and/or pictures</text><rect x="460" y="110" width="410" height="380" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="665" y="150" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">Exercise 6</text><text x="484" y="200" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">MARKS</text><text x="484" y="228" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="start">16: just over a quarter of 60</text><text x="484" y="270" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">LENGTH</text><text x="484" y="298" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="start">about 200 words</text><text x="484" y="340" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">KIND OF WRITING</text><text x="484" y="368" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="start">continuous prose</text><text x="484" y="410" font-size="15" font-weight="700" fill="#4a5568" text-anchor="start">STIMULUS</text><text x="484" y="438" font-size="19" font-weight="600" fill="#1e2a44" text-anchor="start">short prompts</text><rect x="30" y="510" width="840" height="124" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="548" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">The real difference is development</text><text x="54" y="580" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Ideas explained, supported and linked across paragraphs (W2), not just stated.</text><text x="54" y="612" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="start">Both: purpose, format and audience set; W1-W5 assessed; no dictionaries.</text>
</svg>