<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1042" width="900" height="1042" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="1042" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Structures for range, marks for accuracy</text>

<rect x="30" y="110" width="840" height="630" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,160 L31.25,124 Q31.25,111.25 44,111.25 L856,111.25 Q868.75,111.25 868.75,124 L868.75,160 Z" fill="#b5d3cf"/><text x="46" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Structure (W3)</text><text x="854" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Example</text><line x1="200" y1="110" x2="200" y2="740" stroke="#c9d6d4" stroke-width="2"/><line x1="30" y1="160" x2="870" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="217.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Condition</text><text x="854" y="218.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;اگر ہر جماعت مدد کرے تو کام جلدی ہو جائے گا۔&#x200F;</text><text x="854" y="252" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">if every class helps, the work will be done quickly</text><line x1="30" y1="266" x2="870" y2="266" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="312.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Relative</text><text x="46" y="335.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">clause</text><text x="854" y="324.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;جو طلبہ رضاکار بنے، انھیں سرٹیفکیٹ دیے گئے۔&#x200F;</text><text x="854" y="358" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">the pupils who volunteered were given certificates</text><line x1="30" y1="372" x2="870" y2="372" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="418.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Passive</text><text x="46" y="441.15" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">(reports)</text><text x="854" y="430.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;تقریب کا اہتمام لائبریری میں کیا گیا۔&#x200F;</text><text x="854" y="464" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">the event was arranged in the library</text><line x1="30" y1="478" x2="870" y2="478" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="560.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Suggestion</text><text x="854" y="536.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;میری تجویز ہے کہ اگلے سال والدین کو&#x200F;</text><text x="854" y="586.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;بھی مدعو کیا جائے۔&#x200F;</text><text x="854" y="620" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">I suggest that parents are also invited next year</text><line x1="30" y1="634" x2="870" y2="634" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="691.65" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Comparison</text><text x="854" y="692.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;یہ پروگرام پچھلے سال کے مقابلے میں زیادہ کامیاب رہا۔&#x200F;</text><text x="854" y="726" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end" font-style="italic">this programme was more successful than last year's</text><rect x="30" y="764" width="840" height="250" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="800" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Punctuation and spelling (W4)</text><rect x="54" y="820" width="116" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="112" y="870" font-size="32" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;۔&#x200F;</text><text x="112" y="900" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">full stop</text><rect x="182" y="820" width="116" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="240" y="870" font-size="32" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;،&#x200F;</text><text x="240" y="900" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">comma</text><rect x="310" y="820" width="116" height="96" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="368" y="870" font-size="32" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;؟&#x200F;</text><text x="368" y="900" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">question</text><text x="470" y="834" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">Spelling: sound-alike letters</text><rect x="470" y="848" width="376" height="62" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="800" y="890" font-size="26" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;ضروری&#x200F;</text><text x="826" y="888" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="660" y="886" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">not</text><text x="610" y="890" font-size="26" fill="#b5602e" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;ظروری&#x200F;</text><text x="500" y="888" font-size="26" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><rect x="470" y="920" width="376" height="62" rx="10" fill="#ffffff" stroke="#c9d6d4" stroke-width="2"/><text x="800" y="962" font-size="26" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;ذریعے&#x200F;</text><text x="826" y="960" font-size="26" font-weight="700" fill="#2e6b62" text-anchor="middle">✓</text><text x="660" y="958" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">not</text><text x="610" y="962" font-size="26" fill="#b5602e" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;زریعے&#x200F;</text><text x="500" y="960" font-size="26" font-weight="700" fill="#b5602e" text-anchor="middle">✗</text><text x="54" y="962" font-size="16" font-weight="700" fill="#8a6d0d" text-anchor="start">Two h letters:</text><rect x="320" y="924" width="100" height="74" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="370" y="964" font-size="24" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;پہلے&#x200F;</text><rect x="208" y="924" width="100" height="74" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="258" y="964" font-size="24" fill="#1e2a44" text-anchor="middle" font-family="Noto Nastaliq Urdu">&#x200F;پھر&#x200F;</text>
</svg>