<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 764" width="900" height="764" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="764" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Formats to prepare</text>

<rect x="30" y="110" width="840" height="500" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,160 L31.25,124 Q31.25,111.25 44,111.25 L856,111.25 Q868.75,111.25 868.75,124 L868.75,160 Z" fill="#b5d3cf"/><text x="46" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Format</text><text x="294" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Urdu name</text><line x1="180" y1="110" x2="180" y2="610" stroke="#c9d6d4" stroke-width="2"/><text x="326" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Conventions worth showing</text><line x1="310" y1="110" x2="310" y2="610" stroke="#c9d6d4" stroke-width="2"/><text x="686" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Usual register</text><line x1="670" y1="110" x2="670" y2="610" stroke="#c9d6d4" stroke-width="2"/><line x1="30" y1="160" x2="870" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="209.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Article</text><text x="294" y="223.2" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;مضمون&#x200F;</text><text x="326" y="198.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a headline, an opening that draws the</text><text x="326" y="220.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reader in, a closing thought</text><text x="686" y="198.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">neutral to</text><text x="686" y="220.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">semi-formal</text><line x1="30" y1="250" x2="870" y2="250" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="299.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Blog post</text><text x="294" y="313.2" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;بلاگ&#x200F;</text><text x="326" y="288.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">first person, a personal and lively</text><text x="326" y="310.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">tone, perhaps a question to readers</text><text x="686" y="299.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">informal to neutral</text><line x1="30" y1="340" x2="870" y2="340" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="389.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Report</text><text x="294" y="403.2" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;رپورٹ&#x200F;</text><text x="326" y="367.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">a title, an opening that states the</text><text x="326" y="389.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">purpose, factual paragraphs,</text><text x="326" y="411.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">recommendations</text><text x="686" y="378.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">formal, often</text><text x="686" y="400.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">impersonal</text><line x1="30" y1="430" x2="870" y2="430" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="479.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Review</text><text x="294" y="493.2" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;تبصرہ&#x200F;</text><text x="326" y="457.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">what is reviewed, description,</text><text x="326" y="479.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">strengths and weaknesses, a</text><text x="326" y="501.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">recommendation</text><text x="686" y="479.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">neutral, opinion-led</text><line x1="30" y1="520" x2="870" y2="520" stroke="#c9d6d4" stroke-width="2"/><text x="46" y="569.2" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="start">Letter</text><text x="294" y="583.2" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;خط&#x200F;</text><text x="326" y="558.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">greeting and closing suited to the</text><text x="326" y="580.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">reader</text><text x="686" y="569.2" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">set by the reader</text><rect x="30" y="632" width="840" height="104" rx="14" fill="#f2e7b8" stroke="#d4b02e" stroke-width="2.5"/><text x="54" y="670" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Make the format visible: it is part of W5</text><text x="54" y="704" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">Useful words:</text><text x="330" y="710" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;سرخی&#x200F;</text><text x="345" y="704" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">headline</text><text x="640" y="710" font-size="26" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;سفارشات&#x200F;</text><text x="655" y="704" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">recommendations</text>
</svg>