<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 850" width="900" height="850" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="850" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">The rubric verb tells you the purpose</text>

<rect x="30" y="110" width="840" height="520" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M31.25,160 L31.25,124 Q31.25,111.25 44,111.25 L856,111.25 Q868.75,111.25 868.75,124 L868.75,160 Z" fill="#b5d3cf"/><text x="244" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Rubric verb</text><text x="276" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Meaning</text><line x1="260" y1="110" x2="260" y2="630" stroke="#c9d6d4" stroke-width="2"/><text x="854" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">Language that shows you did it</text><line x1="450" y1="110" x2="450" y2="630" stroke="#c9d6d4" stroke-width="2"/><line x1="30" y1="160" x2="870" y2="160" stroke="#c9d6d4" stroke-width="2"/><text x="244" y="218.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;بیان کیجیے&#x200F;</text><text x="276" y="195.15" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">describe, give</text><text x="276" y="218.15" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">an account</text><text x="466" y="195.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">past tense narration, descriptive</text><text x="466" y="218.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">adjectives</text><line x1="30" y1="244" x2="870" y2="244" stroke="#c9d6d4" stroke-width="2"/><text x="244" y="302.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;وضاحت کیجیے&#x200F;</text><text x="276" y="290.65" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">explain</text><text x="854" y="302.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;کیونکہ، اس کی وجہ یہ ہے کہ&#x200F;</text><line x1="30" y1="328" x2="870" y2="328" stroke="#c9d6d4" stroke-width="2"/><text x="244" y="386.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;اپنی رائے دیجیے&#x200F;</text><text x="276" y="363.15" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">give your</text><text x="276" y="386.15" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">opinion</text><text x="854" y="386.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;میرے خیال میں، میری رائے یہ ہے کہ&#x200F;</text><line x1="30" y1="412" x2="870" y2="412" stroke="#c9d6d4" stroke-width="2"/><text x="244" y="470.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;مشورہ دیجیے /&#x200F;</text><text x="244" y="520.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;تجویز دیجیے&#x200F;</text><text x="276" y="483.65" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">advise / suggest</text><text x="854" y="495.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;چاہیے، بہتر ہوگا کہ&#x200F;</text><line x1="30" y1="546" x2="870" y2="546" stroke="#c9d6d4" stroke-width="2"/><text x="244" y="604.8" font-size="24" fill="#1e2a44" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;قائل کیجیے&#x200F;</text><text x="276" y="592.65" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">persuade</text><text x="466" y="581.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">direct questions to the reader, strong</text><text x="466" y="604.15" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">conclusions</text><rect x="30" y="652" width="840" height="170" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="688" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Audience sets the register: formal choices for a head teacher</text><text x="250" y="758" font-size="27" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;مدعو کرنا&#x200F;</text><text x="262" y="752" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">rather than</text><text x="440" y="758" font-size="27" fill="#4a5568" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;بلانا&#x200F;</text><text x="650" y="758" font-size="27" fill="#2e6b62" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;تقریب&#x200F;</text><text x="662" y="752" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">rather than</text><text x="840" y="758" font-size="27" fill="#4a5568" text-anchor="end" font-family="Noto Nastaliq Urdu">&#x200F;فنکشن&#x200F;</text><text x="54" y="802" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Even for teenagers, it is written Urdu: no slang, no English word where an everyday Urdu word exists.</text>
</svg>