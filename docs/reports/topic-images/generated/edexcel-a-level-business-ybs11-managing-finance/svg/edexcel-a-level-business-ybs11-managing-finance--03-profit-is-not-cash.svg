<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 710" width="900" height="710" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="710" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why profit and cash differ</text>

<text x="475" y="132" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">Effect on profit</text><text x="735" y="132" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Effect on cash</text><rect x="30" y="150" width="300" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="180" y="194.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Sales on credit</text><rect x="350" y="150" width="250" height="84" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="475" y="192.7" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">count as revenue now</text><rect x="620" y="150" width="250" height="84" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="745" y="192.7" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">cash arrives later</text><rect x="30" y="250" width="300" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="180" y="294.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Inventory</text><rect x="350" y="250" width="250" height="84" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="475" y="281.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">in cost of sales only</text><text x="475" y="304.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">when sold</text><rect x="620" y="250" width="250" height="84" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="745" y="281.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">paid for before it is</text><text x="745" y="304.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">sold</text><rect x="30" y="350" width="300" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="180" y="394.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">A loan</text><rect x="350" y="350" width="250" height="84" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="475" y="392.7" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">not revenue</text><rect x="620" y="350" width="250" height="84" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="745" y="392.7" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">brings cash in</text><rect x="30" y="450" width="300" height="84" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="180" y="494.7" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Buying equipment</text><rect x="350" y="450" width="250" height="84" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="475" y="481.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">cost spread over several</text><text x="475" y="504.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">years</text><rect x="620" y="450" width="250" height="84" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="745" y="492.7" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">uses cash now</text><rect x="30" y="560" width="410" height="120" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="235" y="608.2" font-size="19" font-weight="700" fill="#b5602e" text-anchor="middle">Profitable, but out of cash</text><text x="235" y="639.2" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">can fail</text><rect x="460" y="560" width="410" height="120" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="665" y="608.2" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="middle">Unprofitable, but borrowing</text><text x="665" y="639.2" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">can survive for a while</text>
</svg>