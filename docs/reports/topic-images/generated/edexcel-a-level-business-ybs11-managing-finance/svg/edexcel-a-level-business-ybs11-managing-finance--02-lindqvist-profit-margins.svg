" font-weight="700" fill="#1e2a44" text-anchor="middle">Year 1</text><rect x="350" y="446.8" width="150" height="23.2" fill="#2e6b62" stroke="#1e2a44" stroke-width="2"/><text x="425" y="464.4" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">profit 80</text><rect x="350" y="439.55" width="150" height="7.25" fill="#efdfa8" stroke="#1e2a44" stroke-width="2"/><rect x="350" y="378.65" width="150" height="60.9" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="425" y="415.1" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">overheads 210</text><rect x="350" y="209" width="150" height="169.65" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="425" y="299.825" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">cost of sales 585</text><text x="425" y="199" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">revenue 900</text><text x="425" y="496" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Year 2</text><line x1="120" y1="470" x2="520" y2="470" stroke="#1e2a44" stroke-width="2.5"/><text x="275" y="516" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">unlabelled thin band = interest (20, then 25)</text><text x="560" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Margins</text><text x="560" y="188" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Gross</text><rect x="560" y="198" width="240" height="26" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="806" y="217" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Y1 40.0%</text><rect x="560" y="230" width="210" height="26" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="776" y="249" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Y2 35.0%</text><text x="560" y="304" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Operating</text><rect x="560" y="314" width="90" height="26" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="656" y="333" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Y1 15.0%</text><rect x="560" y="346" width="70.19999999999999" height="26" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="636.2" y="365" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Y2 11.7%</text><text x="560" y="420" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start">Profit for the year</text><rect x="560" y="430" width="75" height="26" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="641" y="449" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Y1 12.5%</text><rect x="560" y="462" width="53.400000000000006" height="26" fill="#d4b02e" stroke="#1e2a44" stroke-width="2"/><text x="619.4" y="481" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="start">Y2 8.9%</text><rect x="30" y="550" width="270" height="140" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="48" y="584" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Revenue</text><text x="48" y="614" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">800 → 900</text><text x="48" y="640" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">+12.5%</text><rect x="315" y="550" width="270" height="140" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="333" y="584" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Cost of sales</text><text x="333" y="614" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">480 → 585</text><text x="333" y="640" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">about +21.9%</text><rect x="600" y="550" width="270" height="140" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="618" y="584" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Overheads</text><text x="618" y="614" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">200 → 210</text><text x="618" y="640" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">only +10</text><rect x="30" y="710" width="840" height="109" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="750" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Gross profit fell from 320 to 315 although revenue rose.</text><text x="56" y="777" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">The falling gross margin points to the cost of each item sold, such as dearer timber or</text><text x="56" y="800" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">discounts given, rather than to overheads.</text>
