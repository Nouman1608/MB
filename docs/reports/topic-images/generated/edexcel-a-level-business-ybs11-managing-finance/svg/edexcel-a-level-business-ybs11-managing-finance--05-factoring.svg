<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 746" width="900" height="746" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="746" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Factoring $60,000 of invoices</text>

<rect x="30" y="110" width="840" height="80" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="158" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">Invoices worth $60,000</text><text x="60" y="236" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Now</text><text x="646" y="236" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">When customers pay</text><rect x="60" y="250" width="576" height="70" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="348" y="292" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">80% paid now: $48,000</text><rect x="636" y="250" width="122.39999999999999" height="70" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="697.2" y="292" font-size="15" font-weight="700" fill="#1e2a44" text-anchor="middle">$10,200</text><rect x="758.4000000000001" y="250" width="21.6" height="70" fill="#b5602e" stroke="#1e2a44" stroke-width="2.5"/><line x1="769.2" y1="322" x2="769.2" y2="352" stroke="#b5602e" stroke-width="2"/><text x="769.2" y="372" font-size="15" font-weight="700" fill="#b5602e" text-anchor="end">fee $1,800</text><rect x="30" y="400" width="270" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="434" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Paid now</text><text x="50" y="464" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">80% × 60,000 = $48,000</text><rect x="315" y="400" width="270" height="110" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="335" y="434" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Fee</text><text x="335" y="464" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">3% × 60,000 = $1,800</text><rect x="600" y="400" width="270" height="110" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="620" y="434" font-size="17" font-weight="700" fill="#4a5568" text-anchor="start">Paid later</text><text x="620" y="464" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">12,000 − 1,800 = $10,200</text><rect x="30" y="530" width="840" height="80" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="578" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Total received: $48,000 + $10,200 = $58,200</text><rect x="30" y="630" width="840" height="86" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="670" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Lindqvist gives up $1,800 of profit to get $48,000 straight away.</text><text x="56" y="697" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">Worth it if the cash prevents a missed payment. Factoring is not free money.</text>
</svg>