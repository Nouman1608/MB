<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 946" width="900" height="946" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="946" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Lindqvist: improving liquidity with JIT</text>

<rect x="30" y="110" width="840" height="530" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="56" y="146" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Lindqvist: current assets against current liabilities</text><line x1="120" y1="560" x2="850" y2="560" stroke="#c9d6d4" stroke-width="1.5"/><text x="110" y="566" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$0</text><line x1="120" y1="470" x2="850" y2="470" stroke="#c9d6d4" stroke-width="1.5"/><text x="110" y="476" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$20,000</text><line x1="120" y1="380" x2="850" y2="380" stroke="#c9d6d4" stroke-width="1.5"/><text x="110" y="386" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$40,000</text><line x1="120" y1="290" x2="850" y2="290" stroke="#c9d6d4" stroke-width="1.5"/><text x="110" y="296" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$60,000</text><line x1="120" y1="200" x2="850" y2="200" stroke="#c9d6d4" stroke-width="1.5"/><text x="110" y="206" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">$80,000</text><rect x="160" y="537.5" width="110" height="22.5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="215" y="554.75" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">cash 5</text><rect x="160" y="402.5" width="110" height="135" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="215" y="476" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">receivables 30</text><rect x="160" y="222.5" width="110" height="180" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="215" y="318.5" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">inventory 40</text><text x="215" y="212.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">$75,000</text><text x="215" y="584" font-size="15" font-weight="600" fill="#4a5568" text-anchor="middle">assets</text><rect x="280" y="402.5" width="110" height="157.5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="335" y="487.25" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">payables 35</text><rect x="280" y="335" width="110" height="67.5" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><text x="335" y="374.75" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">overdraft 15</text><text x="335" y="325" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">$50,000</text><text x="335" y="584" font-size="15" font-weight="600" fill="#4a5568" text-anchor="middle">liabilities</text><rect x="520" y="537.5" width="110" height="22.5" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2"/><text x="575" y="554.75" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">cash 5</text><rect x="520" y="402.5" width="110" height="135" fill="#dce9e7" stroke="#1e2a44" stroke-width="2"/><text x="575" y="476" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">receivables 30</text><rect x="520" y="290" width="110" height="112.5" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2"/><text x="575" y="352.25" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">inventory 25</text><text x="575" y="280" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">$60,000</text><text x="575" y="584" font-size="15" font-weight="600" fill="#4a5568" text-anchor="middle">assets</text><rect x="640" y="402.5" width="110" height="157.5" fill="#ffffff" stroke="#1e2a44" stroke-width="2"/><text x="695" y="487.25" font-size="14" font-weight="700" fill="#1e2a44" text-anchor="middle">payables 35</text><text x="695" y="392.5" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">$35,000</text><text x="695" y="584" font-size="15" font-weight="600" fill="#4a5568" text-anchor="middle">liabilities</text><text x="275" y="614" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Before</text><text x="635" y="614" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">After JIT, overdraft repaid</text><line x1="120" y1="560" x2="850" y2="560" stroke="#1e2a44" stroke-width="2.5"/><rect x="30" y="660" width="410" height="150" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="694" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">Before</text><text x="50" y="726" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Current ratio = 75 ÷ 50 = 1.5</text><text x="50" y="753" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Acid test = (75 − 40) ÷ 50 = 0.7</text><text x="50" y="780" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Working capital = $25,000</text><rect x="460" y="660" width="410" height="150" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="480" y="694" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">After</text><text x="480" y="726" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Current ratio = 60 ÷ 35 = 1.71</text><text x="480" y="753" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Acid test = (60 − 25) ÷ 35 = 1.0</text><text x="480" y="780" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">No overdraft interest</text><rect x="30" y="830" width="840" height="86" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="56" y="870" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Both ratios improve.</text><text x="56" y="897" font-size="17" font-weight="400" fill="#4a5568" text-anchor="start">But with less buffer inventory, a late delivery could halt production.</text>
</svg>