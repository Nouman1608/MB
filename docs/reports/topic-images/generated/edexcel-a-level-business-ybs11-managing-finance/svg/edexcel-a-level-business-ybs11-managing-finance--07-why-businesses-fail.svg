<rect width="900" height="850" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Why businesses fail</text>

<rect x="30" y="110" width="410" height="540" rx="12" fill="#ffffff" stroke="#8a6d0d" stroke-width="2.5"/><text x="235" y="148" font-size="21" font-weight="700" fill="#8a6d0d" text-anchor="middle">Internal causes</text><text x="235" y="172" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">within the firm’s control</text><rect x="50" y="192" width="370" height="62" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="68" y="229" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Poor cash-flow management</text><rect x="50" y="266" width="370" height="62" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="68" y="303" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Overestimating sales</text><rect x="50" y="340" width="370" height="62" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="68" y="366" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Overtrading: growing faster than cash</text><text x="68" y="389" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">allows</text><rect x="50" y="414" width="370" height="62" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="68" y="451" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Poor inventory control</text><rect x="50" y="488" width="370" height="62" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="68" y="525" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Poor marketing</text><rect x="50" y="562" width="370" height="62" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2"/><text x="68" y="599" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Poor quality</text><rect x="460" y="110" width="410" height="540" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="665" y="148" font-size="21" font-weight="700" fill="#b5602e" text-anchor="middle">External causes</text><text x="665" y="172" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">outside its control</text><rect x="480" y="192" width="370" height="46" rx="10" fill="#fbf3ee" stroke="#b5602e" stroke-width="2"/><text x="498" y="222" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Market conditions</text><rect x="480" y="248" width="370" height="46" rx="10" fill="#fbf3ee" stroke="#b5602e" stroke-width="2"/><text x="498" y="278" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Competition</text><rect x="480" y="304" width="370" height="46" rx="10" fill="#fbf3ee" stroke="#b5602e" stroke-width="2"/><text x="498" y="334" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Economic factors, e.g. recession</text><rect x="480" y="360" width="370" height="46" rx="10" fill="#fbf3ee" stroke="#b5602e" stroke-width="2"/><text x="498" y="390" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Exchange rates</text><rect x="480" y="416" width="370" height="46" rx="10" fill="#fbf3ee" stroke="#b5602e" stroke-width="2"/><text x="498" y="446" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Interest rates</text><rect x="480" y="472" width="370" height="46" rx="10" fill="#fbf3ee" stroke="#b5602e" stroke-width="2"/><text x="498" y="502" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Government regulations</text><rect x="480" y="528" width="370" height="46" rx="10" fill="#fbf3ee" stroke="#b5602e" stroke-width="2"/><text x="498" y="558" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Supplier problems</text><rect x="480" y="584" width="370" height="46" rx="10" fill="#fbf3ee" stroke="#b5602e" stroke-width="2"/><text x="498" y="614" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Natural phenomena, e.g. floods</text><rect x="30" y="670" width="840" height="150" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="56" y="706" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Failure usually comes from a combination</text><rect x="56" y="726" width="300" height="74" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="74" y="752.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Heavy borrowing to fund</text><text x="74" y="775.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">overtrading</text><text x="388" y="770" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><rect x="420" y="726" width="220" height="74" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="438" y="763.7" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Interest rates rise</text><line x1="644" y1="763" x2="680" y2="763" stroke="#1e2a44" stroke-width="3.5" marker-end="url(#ah)"/><text x="760" y="770" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">most damage</text>
</svg>