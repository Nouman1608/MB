<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" width="900" height="740" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="740" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">From revenue to profit for the year</text>

<rect x="30" y="110" width="840" height="70" rx="10" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="54" y="153" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Revenue</text><rect x="70" y="194" width="800" height="70" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="94" y="237" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">− Cost of sales</text><text x="846" y="237" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">direct cost of goods sold: materials, goods for resale</text><rect x="30" y="278" width="840" height="70" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="321" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">= Gross profit</text><text x="846" y="321" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">gross profit margin = gross profit ÷ revenue × 100</text><rect x="70" y="362" width="800" height="70" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="94" y="405" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">− Other operating expenses</text><text x="846" y="405" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">overheads: rent, salaries, marketing, utilities</text><rect x="30" y="446" width="840" height="70" rx="10" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="489" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">= Operating profit</text><text x="846" y="489" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">operating profit margin = operating profit ÷ revenue × 100</text><rect x="70" y="530" width="800" height="70" rx="10" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="94" y="573" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">− Interest (and tax, where given)</text><rect x="30" y="614" width="840" height="70" rx="10" fill="#d4b02e" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="657" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">= Profit for the year</text><text x="846" y="657" font-size="15" font-weight="400" fill="#4a5568" text-anchor="end">margin = profit for the year ÷ revenue × 100</text><text x="450" y="712" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">Reading down the statement of comprehensive income shows where profit is lost.</text>
</svg>