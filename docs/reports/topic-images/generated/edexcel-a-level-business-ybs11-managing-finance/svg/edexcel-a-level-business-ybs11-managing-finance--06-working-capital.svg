<rect width="900" height="695" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Working capital: enough, not too much</text>

<path d="M424,330 L450,280 L476,330 Z" fill="#1e2a44"/><line x1="140" y1="276" x2="760" y2="276" stroke="#1e2a44" stroke-width="7" stroke-linecap="round"/><rect x="380" y="110" width="140" height="70" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="142" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Working</text><text x="450" y="164" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">capital</text><line x1="450" y1="184" x2="450" y2="268" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="534" y="152" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">= current assets − current liabilities</text><rect x="30" y="350" width="400" height="120" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="48" y="392" font-size="21" font-weight="700" fill="#b5602e" text-anchor="start">Too little</text><text x="48" y="426" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">Cannot pay suppliers and staff on time</text><rect x="470" y="350" width="400" height="120" rx="12" fill="#ffffff" stroke="#b5602e" stroke-width="2.5"/><text x="488" y="392" font-size="21" font-weight="700" fill="#b5602e" text-anchor="start">Too much</text><text x="488" y="426" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">Tied up in inventory or receivables,</text><text x="488" y="450" font-size="18" font-weight="400" fill="#4a5568" text-anchor="start">earning nothing</text><rect x="30" y="495" width="840" height="170" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="56" y="531" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Managing it</text><rect x="56" y="550" width="252" height="90" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="182" y="584.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Keep inventory low but</text><text x="182" y="607.2" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">sufficient</text><rect x="328" y="550" width="252" height="90" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="454" y="595.7" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Collect debts promptly</text><rect x="600" y="550" width="252" height="90" rx="12" fill="#ffffff" stroke="#2e6b62" stroke-width="2.5"/><text x="726" y="595.7" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">Time payments carefully</text>
</svg>