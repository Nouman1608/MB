<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 735" width="900" height="735" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="735" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">One lamp, three exchange rates</text>

<rect x="300" y="110" width="300" height="50" rx="14" fill="#f2e7b8" stroke="#1e2a44" stroke-width="2.5"/><text x="450" y="142" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Lamp price: A$100</text><rect x="120" y="272" width="150" height="288" rx="6" fill="#dce9e7" stroke="#1e2a44" stroke-width="2.5"/><text x="195" y="258" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">80 euros</text><text x="195" y="306" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">100 × 0.80</text><text x="195" y="590" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">A$1 = 0.80 euros</text><text x="195" y="618" font-size="16" font-weight="700" fill="#2e6b62" text-anchor="middle">Currency falls</text><text x="195" y="640" font-size="15" font-weight="400" fill="#2e6b62" text-anchor="middle">exports more competitive</text><rect x="365" y="236" width="150" height="324" rx="6" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5"/><text x="440" y="222" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">90 euros</text><text x="440" y="270" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">100 × 0.90</text><text x="440" y="590" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">A$1 = 0.90 euros</text><text x="440" y="618" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Starting rate</text><rect x="610" y="200" width="150" height="360" rx="6" fill="#f3d9c8" stroke="#1e2a44" stroke-width="2.5"/><text x="685" y="186" font-size="21" font-weight="700" fill="#1e2a44" text-anchor="middle">100 euros</text><text x="685" y="234" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="middle">100 × 1.00</text><text x="685" y="590" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">A$1 = 1.00 euros</text><text x="685" y="618" font-size="16" font-weight="700" fill="#b5602e" text-anchor="middle">Currency rises</text><text x="685" y="640" font-size="15" font-weight="400" fill="#b5602e" text-anchor="middle">dearer abroad; exports</text><text x="685" y="660" font-size="15" font-weight="400" fill="#b5602e" text-anchor="middle">may fall</text><line x1="80" y1="560" x2="820" y2="560" stroke="#1e2a44" stroke-width="3"/><text x="450" y="712" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" font-style="italic">What a European buyer pays. For an importer in Country A the effect is reversed.</text>
</svg>