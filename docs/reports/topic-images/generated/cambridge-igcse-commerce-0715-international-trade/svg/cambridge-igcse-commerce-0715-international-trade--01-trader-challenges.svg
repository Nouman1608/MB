<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 745" width="900" height="745" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="745" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Eleven challenges for exporters and importers</text>

<rect x="30" y="110" width="270" height="520" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="110" width="270" height="50" rx="14" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="165" y="143" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Getting goods there</text><text x="48" y="196" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Distance</text><text x="48" y="220" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Longer delivery, higher cost,</text><text x="48" y="240" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">risk of damage</text><text x="48" y="281" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Transport</text><text x="48" y="305" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Choosing sea, air, road or</text><text x="48" y="325" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">rail; delays at ports</text><text x="48" y="366" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Documentation</text><text x="48" y="390" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Extra documents, e.g.</text><text x="48" y="410" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">certificate of origin, bill of</text><text x="48" y="430" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">lading</text><rect x="315" y="110" width="270" height="520" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="315" y="110" width="270" height="50" rx="14" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="143" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Money and payment</text><text x="333" y="196" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Methods of payment</text><text x="333" y="220" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Different systems; arranging</text><text x="333" y="240" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">secure payment</text><text x="333" y="281" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Non-payment</text><text x="333" y="305" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Hard to check a distant buyer</text><text x="333" y="325" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">or recover money</text><text x="333" y="366" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">Currencies</text><text x="333" y="390" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Different money, so one must</text><text x="333" y="410" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">be exchanged</text><text x="333" y="451" font-size="17" font-weight="700" fill="#8a6d0d" text-anchor="start">Foreign exchange rates</text><text x="333" y="475" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Rates change before payment</text><text x="333" y="536" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Customs duties</text><text x="333" y="560" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Taxes on imports raise cost</text><text x="333" y="580" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">and price</text><rect x="600" y="110" width="270" height="520" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="600" y="110" width="270" height="50" rx="14" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="735" y="143" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Doing business abroad</text><text x="618" y="196" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Language</text><text x="618" y="220" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Misunderstood orders and</text><text x="618" y="240" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">labels; translation costs</text><text x="618" y="281" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Competition</text><text x="618" y="305" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Against local firms and other</text><text x="618" y="325" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">exporters</text><text x="618" y="366" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">Different legal systems</text><text x="618" y="390" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">Different rules on safety,</text><text x="618" y="410" font-size="15" font-weight="400" fill="#4a5568" text-anchor="start">labels and contracts</text><rect x="30" y="650" width="840" height="75" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="450" y="680" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">Currencies = different money.  Exchange rates = changing values.</text><text x="450" y="708" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">They are two separate challenges.</text>
</svg>