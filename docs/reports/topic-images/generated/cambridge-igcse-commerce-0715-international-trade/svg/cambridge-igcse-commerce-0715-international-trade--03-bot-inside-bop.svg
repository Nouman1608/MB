<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 555" width="900" height="555" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="555" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Balance of Trade and Balance of Payments</text>

<rect x="30" y="110" width="840" height="340" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="3"/><text x="54" y="148" font-size="23" font-weight="700" fill="#2e6b62" text-anchor="start">Balance of Payments</text><text x="54" y="176" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">All of a country’s transactions with the rest of the world</text><rect x="54" y="205" width="250" height="165" rx="12" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="3.5"/><text x="74" y="242" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Trade in goods</text><text x="74" y="272" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">visible exports and</text><text x="74" y="293" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">imports</text><rect x="74" y="315" width="210" height="42" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="179" y="341.95" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">Balance of Trade</text><rect x="326" y="205" width="250" height="165" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="346" y="242" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Trade in services</text><text x="346" y="272" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">invisible: tourism,</text><text x="346" y="293" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">banking, insurance,</text><text x="346" y="314" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">shipping</text><rect x="598" y="205" width="250" height="165" rx="12" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="618" y="242" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="start">Financial flows</text><text x="618" y="272" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">such as investment</text><text x="450" y="420" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Balance of Trade = exports of goods − imports of goods</text><rect x="30" y="470" width="410" height="60" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="235" y="506.3" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">Surplus: exports &gt; imports</text><rect x="460" y="470" width="410" height="60" rx="14" fill="#f3d9c8" stroke="#b5602e" stroke-width="2.5"/><text x="665" y="506.3" font-size="18" font-weight="700" fill="#b5602e" text-anchor="middle">Deficit: imports &gt; exports</text>
</svg>