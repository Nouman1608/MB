<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 715" width="900" height="715" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="715" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Inside and outside a trading bloc</text>

<rect x="30" y="110" width="560" height="300" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="3" stroke-dasharray="10 7"/><text x="310" y="142" font-size="21" font-weight="700" fill="#2e6b62" text-anchor="middle">Trading bloc</text><line x1="150" y1="230" x2="440" y2="230" stroke="#2e6b62" stroke-width="4"/><line x1="150" y1="230" x2="295" y2="350" stroke="#2e6b62" stroke-width="4"/><line x1="440" y1="230" x2="295" y2="350" stroke="#2e6b62" stroke-width="4"/><circle cx="150" cy="230" r="42" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="150" y="236" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Member</text><circle cx="440" cy="230" r="42" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="440" y="236" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Member</text><circle cx="295" cy="350" r="42" fill="#ffffff" stroke="#1e2a44" stroke-width="3"/><text x="295" y="356" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">Member</text><text x="295" y="212" font-size="16" font-weight="600" fill="#2e6b62" text-anchor="middle">free or easier trade</text><rect x="600" y="110" width="22" height="300" fill="#b5602e" stroke="#1e2a44" stroke-width="2"/><rect x="700" y="230" width="170" height="60" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="785" y="266.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">Non-member</text><line x1="695" y1="260" x2="630" y2="260" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><text x="745" y="140" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">Often a common external</text><text x="745" y="161" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">tariff on imports from</text><text x="745" y="182" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">non-members</text><text x="745" y="330" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">Agreed rules on standards;</text><text x="745" y="350" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">in some blocs free movement</text><text x="745" y="370" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">or a shared currency</text><rect x="30" y="435" width="410" height="255" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="54" y="472" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Advantages of joining</text><circle cx="66" cy="506.05" r="12" fill="#2e6b62"/><path d="M60.6,506.29 L64.8,510.61 L72,501.85" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="86" y="512" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Larger market, no tariffs inside the</text><text x="86" y="534" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">bloc</text><circle cx="66" cy="566.05" r="12" fill="#2e6b62"/><path d="M60.6,566.29 L64.8,570.6099999999999 L72,561.8499999999999" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="86" y="572" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Cheaper imports from members</text><circle cx="66" cy="604.05" r="12" fill="#2e6b62"/><path d="M60.6,604.29 L64.8,608.6099999999999 L72,599.8499999999999" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="86" y="610" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Attracts investment</text><circle cx="66" cy="642.05" r="12" fill="#2e6b62"/><path d="M60.6,642.29 L64.8,646.6099999999999 L72,637.8499999999999" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="86" y="648" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Political cooperation</text><rect x="460" y="435" width="410" height="255" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="484" y="472" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Disadvantages of joining</text><circle cx="496" cy="506.05" r="12" fill="#b5602e"/><path d="M491.44,501.49 L500.56,510.61 M500.56,501.49 L491.44,510.61" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="516" y="512" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">More competition for local firms</text><circle cx="496" cy="544.05" r="12" fill="#b5602e"/><path d="M491.44,539.49 L500.56,548.6099999999999 M500.56,539.49 L491.44,548.6099999999999" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="516" y="550" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Must follow bloc rules; less control</text><text x="516" y="572" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">of trade policy</text><circle cx="496" cy="604.05" r="12" fill="#b5602e"/><path d="M491.44,599.49 L500.56,608.6099999999999 M500.56,599.49 L491.44,608.6099999999999" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="516" y="610" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Imports from non-members may cost</text><text x="516" y="632" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">more</text><circle cx="496" cy="664.05" r="12" fill="#b5602e"/><path d="M491.44,659.49 L500.56,668.6099999999999 M500.56,659.49 L491.44,668.6099999999999" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="516" y="670" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Membership fees in some blocs</text>
</svg>