<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 705" width="900" height="705" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="705" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">How commercial activities show up</text>

<rect x="30" y="110" width="440" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="156" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A hotel welcomes foreign tourists</text><line x1="478" y1="149" x2="528" y2="149" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><rect x="540" y="110" width="330" height="78" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="560" y="156" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Service exports</text><rect x="30" y="202" width="440" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="248" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A supermarket imports more foreign food</text><line x1="478" y1="241" x2="528" y2="241" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><rect x="540" y="202" width="330" height="78" rx="12" fill="#f3d9c8" stroke="#b5602e" stroke-width="2.5"/><text x="560" y="235" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">Visible imports (Balance of</text><text x="560" y="257" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">Trade worsens)</text><rect x="30" y="294" width="440" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="340" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">An insurer covers ships for overseas clients</text><line x1="478" y1="333" x2="528" y2="333" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><rect x="540" y="294" width="330" height="78" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="560" y="340" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Invisible exports</text><rect x="30" y="386" width="440" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="419" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A manufacturer starts exporting through</text><text x="50" y="441" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">ecommerce</text><line x1="478" y1="425" x2="528" y2="425" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><rect x="540" y="386" width="330" height="78" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="560" y="432" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Visible exports</text><rect x="30" y="478" width="440" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="524" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">A foreign MNC builds a factory</text><line x1="478" y1="517" x2="528" y2="517" stroke="#2e6b62" stroke-width="4" marker-end="url(#ahT)"/><rect x="540" y="478" width="330" height="78" rx="12" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="560" y="524" font-size="17" font-weight="700" fill="#2e6b62" text-anchor="start">Investment inflow</text><rect x="30" y="570" width="440" height="78" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="50" y="616" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">… and later sends profits home</text><line x1="478" y1="609" x2="528" y2="609" stroke="#b5602e" stroke-width="4" marker-end="url(#ahR)"/><rect x="540" y="570" width="330" height="78" rx="12" fill="#f3d9c8" stroke="#b5602e" stroke-width="2.5"/><text x="560" y="616" font-size="17" font-weight="700" fill="#b5602e" text-anchor="start">Money flows out</text><text x="450" y="680" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">Teal: money flows into the country.  Rust: money flows out.</text>
</svg>