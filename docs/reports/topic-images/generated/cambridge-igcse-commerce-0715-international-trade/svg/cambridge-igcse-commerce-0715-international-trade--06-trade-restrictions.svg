<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 635" width="900" height="635" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="635" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Tariff, quota and embargo</text>

<rect x="30" y="110" width="270" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="30" y="110" width="270" height="92" rx="14" fill="#f2e7b8" stroke="#c9d6d4" stroke-width="2.5"/><text x="165" y="145" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">Tariff</text><text x="165" y="175" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">A tax on imports</text><circle cx="54" cy="239.4" r="5" fill="#1e2a44"/><text x="78" y="245" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Raises the price of</text><text x="78" y="266" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">imports</text><circle cx="54" cy="295.4" r="5" fill="#1e2a44"/><text x="78" y="301" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Importers sell or earn</text><text x="78" y="322" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">less</text><circle cx="54" cy="351.4" r="5" fill="#1e2a44"/><text x="78" y="357" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Local producers</text><text x="78" y="378" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">protected</text><rect x="315" y="110" width="270" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="315" y="110" width="270" height="92" rx="14" fill="#dce9e7" stroke="#c9d6d4" stroke-width="2.5"/><text x="450" y="145" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">Quota</text><text x="450" y="175" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">A limit on the quantity</text><text x="450" y="196" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">imported</text><circle cx="339" cy="239.4" r="5" fill="#1e2a44"/><text x="363" y="245" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Shortages of the good</text><circle cx="339" cy="274.4" r="5" fill="#1e2a44"/><text x="363" y="280" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Prices rise</text><circle cx="339" cy="309.4" r="5" fill="#1e2a44"/><text x="363" y="315" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Importers find other</text><text x="363" y="336" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">sources</text><rect x="600" y="110" width="270" height="330" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><rect x="600" y="110" width="270" height="92" rx="14" fill="#f3d9c8" stroke="#c9d6d4" stroke-width="2.5"/><text x="735" y="145" font-size="23" font-weight="700" fill="#1e2a44" text-anchor="middle">Embargo</text><text x="735" y="175" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">A ban on trade in a good or</text><text x="735" y="196" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="middle">with a country</text><circle cx="624" cy="239.4" r="5" fill="#1e2a44"/><text x="648" y="245" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Trade stops completely</text><circle cx="624" cy="274.4" r="5" fill="#1e2a44"/><text x="648" y="280" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Firms lose suppliers or</text><text x="648" y="301" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">markets</text><circle cx="624" cy="330.4" r="5" fill="#1e2a44"/><text x="648" y="336" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Supply chains</text><text x="648" y="357" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">reorganised</text><rect x="30" y="460" width="840" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="495" font-size="19" font-weight="700" fill="#8a6d0d" text-anchor="start">Tariff calculation (invented figures)</text><rect x="54" y="520" width="170" height="54" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="139" y="553.65" font-size="19" font-weight="700" fill="#1e2a44" text-anchor="middle">Shoe: $50</text><text x="250" y="556" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">+</text><rect x="276" y="520" width="280" height="54" rx="14" fill="#ffffff" stroke="#1e2a44" stroke-width="2.5"/><text x="416" y="553.3" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">20% tariff: 0.20 × 50 = $10</text><text x="582" y="556" font-size="28" font-weight="700" fill="#1e2a44" text-anchor="middle">=</text><rect x="606" y="520" width="150" height="54" rx="14" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5"/><text x="681" y="554.7" font-size="22" font-weight="700" fill="#1e2a44" text-anchor="middle">$60</text><text x="54" y="598" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start" font-style="italic">before transport and profit are added</text>
</svg>