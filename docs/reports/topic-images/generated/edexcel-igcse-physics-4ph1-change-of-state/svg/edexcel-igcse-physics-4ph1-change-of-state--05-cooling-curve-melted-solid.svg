<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="610" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Cooling a melted solid</text>

<line x1="130" y1="560" x2="850" y2="560" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="130" y1="560" x2="130" y2="160" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="850" y="594" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">time / s</text><text x="108" y="360" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 108 360)">temperature / °C</text><line x1="130" y1="300" x2="830" y2="300" stroke="#c9d6d4" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/><text x="830" y="290" font-size="16" font-weight="600" fill="#4a5568" text-anchor="end">melting point</text><path d="M135,190 Q210,290 330,300 L600,300 Q690,310 830,450" fill="none" stroke="#2e6b62" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><text x="250" y="175" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="start">liquid cools</text><text x="465" y="230" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">solidifying (freezing)</text><text x="465" y="254" font-size="16" font-weight="400" fill="#8a6d0d" text-anchor="middle">temperature stays constant</text><text x="465" y="274" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">liquid + solid</text><text x="730" y="440" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="end">solid cools</text><rect x="160" y="340" width="390" height="132" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="180" y="372" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">While it solidifies the substance</text><text x="180" y="393.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">releases energy as its particles settle</text><text x="180" y="414.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">into fixed positions. This keeps the</text><text x="180" y="435.36" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">temperature constant.</text>
</svg>