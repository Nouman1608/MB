<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="700" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Analysing the aluminium block results</text>

<rect x="30" y="110" width="450" height="357.6" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="54" y="151.1" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">Given: m = 1.00 kg, V = 12.0 V,</text><text x="54" y="187.1" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">I = 4.0 A, t = 300 s</text><text x="54" y="223.1" font-size="18" font-weight="400" fill="#1e2a44" text-anchor="start">20.0 °C → 34.4 °C</text><text x="54" y="259.1" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">E = I × V × t</text><text x="76" y="295.1" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">= 4.0 × 12.0 × 300 = 14 400 J</text><text x="54" y="331.1" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">ΔT = 34.4 − 20.0 = 14.4 °C</text><text x="54" y="367.1" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">c = E ÷ (m × ΔT)</text><text x="76" y="403.1" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">= 14 400 ÷ (1.00 × 14.4)</text><text x="76" y="439.1" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">= 1000 J/kg °C</text><rect x="500" y="110" width="370" height="400" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="685" y="148" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Measured vs accepted</text><text x="685" y="172" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">c in J/kg °C</text><line x1="530" y1="470" x2="860" y2="470" stroke="#1e2a44" stroke-width="3" stroke-linecap="round"/><rect x="570" y="220" width="90" height="250" rx="0" fill="#d4b02e" stroke="#1e2a44" stroke-width="2.5" /><text x="615" y="208" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">1000</text><text x="615" y="498" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">measured</text><rect x="720" y="245" width="90" height="225" rx="0" fill="#b5d3cf" stroke="#1e2a44" stroke-width="2.5" /><text x="765" y="233" font-size="18" font-weight="700" fill="#1e2a44" text-anchor="middle">900</text><text x="765" y="498" font-size="16" font-weight="600" fill="#1e2a44" text-anchor="middle">accepted (about)</text><rect x="30" y="525" width="840" height="150" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="55" y="560" font-size="19" font-weight="700" fill="#b5602e" text-anchor="start">Why too high?</text><text x="220" y="560" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Some energy heated the surroundings, not the block, so ΔT was</text><text x="220" y="584" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">smaller than it should have been, and c = E ÷ (m × ΔT) came out larger.</text><text x="55" y="624" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">Improve:</text><text x="220" y="624" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">better insulation and a lid; record the highest temperature</text><text x="220" y="648" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">after switching off, as energy takes time to spread through the block.</text>
</svg>