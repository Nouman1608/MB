<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 735" width="900" height="735" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="735" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Heating: where does the energy go?</text>

<rect x="200" y="110" width="500" height="96" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="150" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">Heating transfers energy into</text><text x="450" y="180" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="middle">the thermal store of the system</text><line x1="380" y1="210" x2="250" y2="268" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><line x1="520" y1="210" x2="650" y2="268" stroke="#1e2a44" stroke-width="4" marker-end="url(#ah)"/><rect x="30" y="275" width="410" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="235" y="315" font-size="22" font-weight="700" fill="#2e6b62" text-anchor="middle">1. Raise the temperature</text><circle cx="190" cy="360" r="13" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><path d="M171,351 q-5,9 0,18 M209,351 q5,9 0,18" fill="none" stroke="#b5602e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><circle cx="190" cy="390" r="13" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><path d="M171,381 q-5,9 0,18 M209,381 q5,9 0,18" fill="none" stroke="#b5602e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><circle cx="190" cy="420" r="13" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><path d="M171,411 q-5,9 0,18 M209,411 q5,9 0,18" fill="none" stroke="#b5602e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><circle cx="220" cy="360" r="13" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><path d="M201,351 q-5,9 0,18 M239,351 q5,9 0,18" fill="none" stroke="#b5602e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><circle cx="220" cy="390" r="13" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><path d="M201,381 q-5,9 0,18 M239,381 q5,9 0,18" fill="none" stroke="#b5602e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><circle cx="220" cy="420" r="13" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><path d="M201,411 q-5,9 0,18 M239,411 q5,9 0,18" fill="none" stroke="#b5602e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><circle cx="250" cy="360" r="13" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><path d="M231,351 q-5,9 0,18 M269,351 q5,9 0,18" fill="none" stroke="#b5602e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><circle cx="250" cy="390" r="13" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><path d="M231,381 q-5,9 0,18 M269,381 q5,9 0,18" fill="none" stroke="#b5602e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><circle cx="250" cy="420" r="13" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><path d="M231,411 q-5,9 0,18 M269,411 q5,9 0,18" fill="none" stroke="#b5602e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><circle cx="280" cy="360" r="13" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><path d="M261,351 q-5,9 0,18 M299,351 q5,9 0,18" fill="none" stroke="#b5602e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><circle cx="280" cy="390" r="13" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><path d="M261,381 q-5,9 0,18 M299,381 q5,9 0,18" fill="none" stroke="#b5602e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><circle cx="280" cy="420" r="13" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><path d="M261,411 q-5,9 0,18 M299,411 q5,9 0,18" fill="none" stroke="#b5602e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="235" y="466" font-size="16" font-weight="600" fill="#b5602e" text-anchor="middle">vibrate more</text><text x="55" y="505" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Particles move faster (vibrate more in</text><text x="55" y="527.44" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">a solid), so their average kinetic</text><text x="55" y="549.88" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">energy increases.</text><rect x="55" y="580" width="360" height="38" rx="8" fill="#dce9e7" stroke="#2e6b62" stroke-width="2" /><text x="235" y="605" font-size="18" font-weight="700" fill="#2e6b62" text-anchor="middle">temperature rises</text><rect x="460" y="275" width="410" height="360" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><text x="665" y="315" font-size="22" font-weight="700" fill="#8a6d0d" text-anchor="middle">2. Change the state</text><circle cx="545" cy="360" r="13" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><circle cx="545" cy="390" r="13" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><circle cx="545" cy="420" r="13" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><circle cx="575" cy="360" r="13" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><circle cx="575" cy="390" r="13" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><circle cx="575" cy="420" r="13" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><circle cx="605" cy="360" r="13" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><circle cx="605" cy="390" r="13" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><circle cx="605" cy="420" r="13" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><circle cx="635" cy="360" r="13" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><circle cx="635" cy="390" r="13" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><circle cx="635" cy="420" r="13" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><line x1="650" y1="390" x2="690" y2="390" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><circle cx="702" cy="418" r="13" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><circle cx="732" cy="420" r="13" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><circle cx="762" cy="416" r="13" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><circle cx="792" cy="420" r="13" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><circle cx="712" cy="390" r="13" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><circle cx="744" cy="388" r="13" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><circle cx="778" cy="394" r="13" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><circle cx="700" cy="362" r="13" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><circle cx="734" cy="360" r="13" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><circle cx="790" cy="366" r="13" fill="#b5d3cf" stroke="#2e6b62" stroke-width="2.5"/><text x="590" y="466" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">fixed</text><text x="750" y="466" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle">free to move</text><text x="485" y="505" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">Energy overcomes the forces of</text><text x="485" y="527.44" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">attraction between particles, so they</text><text x="485" y="549.88" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="start">move further apart or more freely.</text><rect x="485" y="580" width="360" height="38" rx="8" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2" /><text x="665" y="605" font-size="18" font-weight="700" fill="#8a6d0d" text-anchor="middle">temperature does NOT rise</text><text x="450" y="678" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="middle">Either way the energy stored in the system increases.</text><text x="450" y="706" font-size="17" font-weight="400" fill="#4a5568" text-anchor="middle">Which one happens depends on whether it is at its melting or boiling point.</text>
</svg>