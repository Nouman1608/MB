<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 645" width="900" height="645" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="645" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Worked example: heating water in a kettle</text>

<rect x="30" y="110" width="300" height="420" rx="14" fill="#ffffff" stroke="#c9d6d4" stroke-width="2.5"/><path d="M90,330 L100,215 Q160,195 220,215 L230,330 Z" fill="#dce9e7" stroke="#1e2a44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" /><path d="M228,240 Q275,245 265,300 L232,305" fill="none" stroke="#1e2a44" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" /><path d="M100,230 L62,200" fill="none" stroke="#1e2a44" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" /><rect x="80" y="330" width="160" height="20" rx="4" fill="#1e2a44" stroke="#1e2a44" stroke-width="0" /><text x="160" y="290" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="middle">0.75 kg</text><text x="160" y="312" font-size="15" font-weight="400" fill="#4a5568" text-anchor="middle">water</text><text x="60" y="395" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">P = 2.2 kW = 2200 W</text><text x="60" y="427" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">m = 0.75 kg</text><text x="60" y="459" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">15 °C → 100 °C</text><text x="60" y="491" font-size="18" font-weight="600" fill="#1e2a44" text-anchor="start">c = 4200 J/kg °C</text><rect x="350" y="110" width="520" height="384.6" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="374" y="151.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Energy needed</text><text x="374" y="190.1" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">ΔT = 100 − 15 = 85 °C</text><text x="374" y="229.1" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">ΔQ = m × c × ΔT</text><text x="422" y="268.1" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">= 0.75 × 4200 × 85</text><text x="422" y="307.1" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">= 267 750 J</text><text x="374" y="346.1" font-size="20" font-weight="700" fill="#1e2a44" text-anchor="start">Minimum time</text><text x="374" y="385.1" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">time = energy ÷ power</text><text x="422" y="424.1" font-size="19" font-weight="400" fill="#1e2a44" text-anchor="start">= 267 750 ÷ 2200</text><text x="422" y="463.1" font-size="19" font-weight="700" fill="#2e6b62" text-anchor="start">= 122 s (3 s.f.)</text><rect x="30" y="550" width="840" height="70" rx="14" fill="#dce9e7" stroke="#2e6b62" stroke-width="2.5"/><text x="450" y="580" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">The real time is longer: some energy heats the kettle itself</text><text x="450" y="604" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle">and the surrounding air.</text>
</svg>