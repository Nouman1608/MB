<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2a44"/></marker>
 <marker id="ahT" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e6b62"/></marker>
 <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5602e"/></marker>
 <marker id="ahO" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a6d0d"/></marker>
</defs>
<rect width="900" height="650" fill="#f4f6f6"/>
<text x="450" y="56" text-anchor="middle" font-size="31" font-weight="700" fill="#1e2a44">Heating ice to steam: temperature-time graph</text>

<line x1="130" y1="600" x2="850" y2="600" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><line x1="130" y1="600" x2="130" y2="160" stroke="#1e2a44" stroke-width="3" marker-end="url(#ah)"/><text x="850" y="634" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="end">time / s</text><text x="108" y="380" font-size="17" font-weight="600" fill="#1e2a44" text-anchor="middle" transform="rotate(-90 108 380)">temperature / °C</text><line x1="130" y1="500" x2="830" y2="500" stroke="#c9d6d4" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/><line x1="130" y1="200" x2="830" y2="200" stroke="#c9d6d4" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/><text x="120" y="506" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="end">0</text><text x="120" y="206" font-size="17" font-weight="400" fill="#1e2a44" text-anchor="end">100</text><polyline points="130,554 200,500 340,500 520,200 820,200" fill="none" stroke="#2e6b62" stroke-width="5" stroke-linejoin="round"/><circle cx="160" cy="455" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="160" y="460.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">1</text><text x="185" y="461" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">ice warms</text><circle cx="270" cy="540" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="270" y="545.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">2</text><text x="295" y="536" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">melting at 0 °C</text><text x="295" y="557" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">ice + water</text><circle cx="400" cy="320" r="16" fill="#f2e7b8" stroke="#1e2a44" stroke-width="3"/><text x="400" y="325.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">3</text><text x="375" y="326" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="end">water warms</text><circle cx="580" cy="240" r="16" fill="#d4b02e" stroke="#1e2a44" stroke-width="3"/><text x="580" y="245.76" font-size="16" font-weight="700" fill="#1e2a44" text-anchor="middle">4</text><text x="605" y="236" font-size="17" font-weight="700" fill="#1e2a44" text-anchor="start">boiling at 100 °C</text><text x="605" y="257" font-size="16" font-weight="400" fill="#4a5568" text-anchor="start">water + steam</text><text x="670" y="160" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="middle">longer than melting: separating particles</text><text x="670" y="180" font-size="15" font-weight="600" fill="#8a6d0d" text-anchor="middle">completely needs more energy</text><rect x="460" y="380" width="380" height="112" rx="14" fill="#f2e7b8" stroke="#8a6d0d" stroke-width="2.5"/><text x="480" y="412" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">Flat sections: energy is still supplied</text><text x="480" y="433.12" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">but overcomes forces between particles,</text><text x="480" y="454.24" font-size="16" font-weight="400" fill="#1e2a44" text-anchor="start">so the temperature does not rise.</text>
</svg>