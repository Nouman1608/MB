<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940"><defs><marker id="ta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#168C8C"/></marker><marker id="ra" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#C44949"/></marker></defs><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#10233F">Ethanoyl chloride + ammonia: addition–elimination</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="500" fill="#5B6D80">AQA example • tetrahedral intermediate • second NH₃ accepts H⁺</text><rect x="52" y="132" width="1424" height="650" rx="20" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="82" y="150" width="430" height="510" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><path d="M87 150H507" stroke="#168C8C" stroke-width="9" stroke-linecap="round"/><text x="108" y="198" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#10233F">1  Addition</text><rect x="549" y="150" width="430" height="510" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><path d="M554 150H974" stroke="#C9A227" stroke-width="9" stroke-linecap="round"/><text x="575" y="198" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#10233F">2  Elimination</text><rect x="1016" y="150" width="430" height="510" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><path d="M1021 150H1441" stroke="#C44949" stroke-width="9" stroke-linecap="round"/><text x="1042" y="198" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#10233F">3  Deprotonation</text><text x="108" y="254" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#20314B">CH₃–C(=O)–Cl  +  :NH₃</text><text x="108" y="304" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#168C8C">N lone pair attacks carbonyl C</text><circle cx="327" cy="349" r="4" fill="#168C8C"/><circle cx="339" cy="349" r="4" fill="#168C8C"/><path d="M337 358 C329 400 301 415 274 396" fill="none" stroke="#168C8C" stroke-width="4" marker-end="url(#ta)"/><path d="M270 381 C246 408 226 408 206 388" fill="none" stroke="#C44949" stroke-width="4" marker-end="url(#ra)"/><text x="108" y="464" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#C44949">C=O π pair → O</text><text x="108" y="514" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">Tetrahedral intermediate</text><text x="108" y="550" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#20314B">CH₃–C(O⁻)(Cl)(NH₃⁺)</text><text x="108" y="608" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#5B6D80">O⁻ and N⁺ charges are shown.</text><text x="575" y="254" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#168C8C">O⁻ reforms the carbonyl</text><text x="575" y="304" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#20314B">CH₃–C(O⁻)(Cl)(NH₃⁺)</text><circle cx="624" cy="366" r="4" fill="#168C8C"/><circle cx="636" cy="366" r="4" fill="#168C8C"/><path d="M634 375 C673 425 726 426 759 383" fill="none" stroke="#168C8C" stroke-width="4" marker-end="url(#ta)"/><path d="M773 392 C816 421 858 416 891 383" fill="none" stroke="#C44949" stroke-width="4" marker-end="url(#ra)"/><text x="575" y="470" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#168C8C">O lone pair → C=O</text><text x="575" y="510" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#C44949">C–Cl pair → Cl⁻</text><text x="575" y="562" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#20314B">CH₃CONH₃⁺  +  Cl⁻</text><text x="575" y="608" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#5B6D80">Protonated amide and chloride.</text><text x="1042" y="254" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#168C8C">Second ammonia removes H⁺</text><text x="1042" y="304" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#20314B">CH₃CONH₃⁺  +  :NH₃</text><circle cx="1099" cy="365" r="4" fill="#168C8C"/><circle cx="1111" cy="365" r="4" fill="#168C8C"/><path d="M1107 374 C1146 424 1195 422 1229 381" fill="none" stroke="#168C8C" stroke-width="4" marker-end="url(#ta)"/><path d="M1260 414 C1229 437 1194 438 1164 414" fill="none" stroke="#C44949" stroke-width="4" marker-end="url(#ra)"/><text x="1042" y="470" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#C44949">N–H pair returns to N</text><text x="1042" y="520" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#20314B">CH₃CONH₂  +  NH₄⁺</text><text x="1042" y="560" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#20314B">NH₄⁺ + Cl⁻ → NH₄Cl</text><text x="1042" y="608" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">Overall: CH₃COCl + 2NH₃</text><text x="1042" y="632" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">→ CH₃CONH₂ + NH₄Cl</text><rect x="112" y="700" width="1304" height="48" rx="12" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/><text x="764" y="730" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">Addition forms the tetrahedral intermediate; elimination expels chloride; base removes the extra proton.</text><text x="764" y="862" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".06">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE  •  STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="887" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
