<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1040" viewBox="0 0 1800 2080" role="img" aria-labelledby="title desc"><title id="title">Relative atomic mass of chlorine (Edexcel International GCSE Chemistry)</title><desc id="desc">No tier label: calculating relative atomic mass from isotopic abundances is 4CH1 statement 1.17, on both papers. A grid of 100 chlorine atoms: 75 of chlorine-35 and 25 of chlorine-37. Working: 75 × 35 = 2625; 25 × 37 = 925; total = 3550; ÷ 100 atoms gives Ar = 35.5. Most atoms are 35, so Ar is nearer 35: a number line from 34 to 38 marks 35.5, and the plain average of 36 is marked wrong.</desc><rect width="1800" height="2080" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="92" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle">Relative atomic mass of chlorine</text>
