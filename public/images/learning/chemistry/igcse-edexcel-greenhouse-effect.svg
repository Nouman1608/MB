<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1110" viewBox="0 0 1800 2220" role="img" aria-labelledby="title desc"><title id="title">How greenhouse gases warm the Earth (Edexcel International GCSE Chemistry)</title><desc id="desc">No Paper 2 label: 4CH1 statement 2.13 is on both papers. The mechanism is marked not required by Edexcel: 4CH1 statement 2.13 asks only that carbon dioxide is a greenhouse gas and that increasing amounts may contribute to climate change. 1: the Earth's surface gives out thermal energy. 2: carbon dioxide and methane molecules in the atmosphere absorb it. 3: some is re-emitted back down. 4: less escapes to space, so the Earth warms.</desc><rect width="1800" height="2220" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="92" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle">How greenhouse gases warm the Earth</text>
