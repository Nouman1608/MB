<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#C44949"/></marker><marker id="tealarrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#168C8C"/></marker><marker id="goldarrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#C9A227"/></marker></defs><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#10233F">Ligand denticity: count the donor atoms that bind</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="500" fill="#5B6D80">AQA examples • schematic coordination links, not to scale</text><rect x="52" y="132" width="1424" height="650" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="82" y="178" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#10233F">Which atoms bind? Trace donor sites to the same metal centre</text><rect x="82" y="212" width="674" height="226" rx="12" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="772" y="212" width="674" height="226" rx="12" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="82" y="462" width="674" height="226" rx="12" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="772" y="462" width="674" height="226" rx="12" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="108" y="252" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233F">Ethane-1,2-diamine (en) • bidentate</text><text x="128" y="306" text-anchor="start" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#20314B">H₂N</text><text x="190" y="306" text-anchor="start" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#20314B">—CH₂—CH₂—</text><text x="400" y="306" text-anchor="start" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#20314B">NH₂</text><circle cx="157" cy="298" r="27" fill="none" stroke="#168C8C" stroke-width="3"/><circle cx="412" cy="298" r="27" fill="none" stroke="#168C8C" stroke-width="3"/><circle cx="290" cy="355" r="32" fill="#E8F1F4" stroke="#315F86" stroke-width="3"/><text x="290" y="362" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#10233F">M</text><path d="M177 320L266 343M390 320L314 343" stroke="#168C8C" stroke-width="3" marker-end="url(#tealarrow)"/><text x="108" y="414" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#5B6D80">Two donor N atoms → two coordinate bonds</text><text x="798" y="252" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">Ethanedioate (oxalate), C₂O₄²⁻ • bidentate</text><text x="814" y="310" text-anchor="start" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#20314B">⁻O–C(=O)–C(=O)–O⁻</text><circle cx="824" cy="302" r="26" fill="none" stroke="#168C8C" stroke-width="3"/><circle cx="997" cy="302" r="26" fill="none" stroke="#168C8C" stroke-width="3"/><circle cx="918" cy="355" r="32" fill="#E8F1F4" stroke="#315F86" stroke-width="3"/><text x="918" y="362" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#10233F">M</text><path d="M838 323L894 344M983 323L942 344" stroke="#168C8C" stroke-width="3" marker-end="url(#tealarrow)"/><text x="1060" y="326" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#5B6D80">one O donor from</text><text x="1060" y="346" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#5B6D80">each carboxylate end</text><text x="798" y="414" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#5B6D80">Two O donor atoms bind one metal centre.</text><text x="108" y="502" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233F">EDTA⁴⁻ • six donor atoms</text><circle cx="405" cy="575" r="34" fill="#E8F1F4" stroke="#315F86" stroke-width="3"/><text x="405" y="582" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#10233F">M</text><circle cx="181" cy="552" r="24" fill="#FFFFFF" stroke="#168C8C" stroke-width="3"/><text x="181" y="559" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#168C8C">N</text><path d="M181 576L376 568" stroke="#168C8C" stroke-width="2.5"/><circle cx="238" cy="537" r="24" fill="#FFFFFF" stroke="#168C8C" stroke-width="3"/><text x="238" y="544" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#168C8C">O</text><path d="M238 561L376 568" stroke="#168C8C" stroke-width="2.5"/><circle cx="310" cy="537" r="24" fill="#FFFFFF" stroke="#168C8C" stroke-width="3"/><text x="310" y="544" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#168C8C">O</text><path d="M310 561L376 568" stroke="#168C8C" stroke-width="2.5"/><circle cx="460" cy="537" r="24" fill="#FFFFFF" stroke="#168C8C" stroke-width="3"/><text x="460" y="544" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#168C8C">O</text><path d="M460 561L434 568" stroke="#168C8C" stroke-width="2.5"/><circle cx="532" cy="537" r="24" fill="#FFFFFF" stroke="#168C8C" stroke-width="3"/><text x="532" y="544" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#168C8C">O</text><path d="M532 561L434 568" stroke="#168C8C" stroke-width="2.5"/><circle cx="594" cy="552" r="24" fill="#FFFFFF" stroke="#168C8C" stroke-width="3"/><text x="594" y="559" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#168C8C">N</text><path d="M594 576L434 568" stroke="#168C8C" stroke-width="2.5"/><text x="108" y="632" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">2 N + 4 carboxylate O donor atoms can bind one metal.</text><text x="108" y="659" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">Donor atoms—not the number of ligand molecules—set denticity.</text><text x="798" y="502" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233F">Haemoglobin • axial ligand competition</text><ellipse cx="1106" cy="582" rx="118" ry="50" fill="#E8F1F4" stroke="#315F86" stroke-width="3"/><circle cx="1106" cy="582" r="32" fill="#FFFFFF" stroke="#C9A227" stroke-width="4"/><text x="1106" y="589" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233F">Fe²⁺</text><text x="1106" y="654" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#5B6D80">multidentate haem ligand</text><path d="M1106 548V526M1106 616V636" stroke="#168C8C" stroke-width="3" marker-end="url(#tealarrow)"/><text x="1172" y="540" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#168C8C">O₂ binds</text><text x="1172" y="632" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#C44949">CO can replace O₂</text><text x="764" y="862" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".06">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE  •  STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="887" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
