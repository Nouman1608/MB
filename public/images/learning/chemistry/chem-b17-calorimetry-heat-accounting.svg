<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="title desc"><title id="title">Calorimetry worked example: temperature change, signs and molar enthalpy</title><desc id="desc">An insulated cup contains measured solution with a thermometer and stirrer. Worked example: 50.0 g solution warms 11 K, so q_solution = +2.30 kJ; q_reaction ≈ −2.30 kJ. 0.120 g Mg is 0.00494 mol, giving ΔH ≈ −466 kJ mol⁻¹. Heat loss and cup heat capacity are omitted.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#10233F">Calorimetry worked example: temperature change, signs and molar enthalpy</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#5B6D80">Marlbridge • Chemistry teaching diagram</text><rect x="45" y="150" width="1438" height="625" rx="18" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="67" y="190" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#10233F">Temperature change gives solution heat; reverse the sign for reaction heat</text><rect x="85" y="230" width="570" height="430" rx="18" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="107" y="270" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#10233F">Simple insulated-cup setup</text><path d="M245 330H495L465 560Q370 595 275 560Z" fill="#E8F1F4" stroke="#315F86" stroke-width="4"/><path d="M265 450Q370 425 475 450L465 560Q370 585 275 560Z" fill="#CDE8E3"/><path d="M370 280L370 490" fill="none" stroke="#10233F" stroke-width="5" /><circle cx="370" cy="492" r="8" fill="#C44949"/><path d="M430 300L430 475" fill="none" stroke="#7A5B3A" stroke-width="4"/><path d="M418 475H442" fill="none" stroke="#7A5B3A" stroke-width="5" stroke-linecap="round"/><text x="458" y="310" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#5B6D80">stirrer</text><path d="M300 318L440 318" fill="none" stroke="#C9A227" stroke-width="8" /><text x="370" y="288" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#C9A227">lid</text><text x="370" y="625" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#20314B">known solution mass • measured T before/after</text><text x="370" y="645" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#5B6D80">stir gently; reduce heat exchange</text><rect x="700" y="230" width="735" height="390" rx="18" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="722" y="270" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#10233F">Calculate and interpret</text><text x="1065" y="318" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">q_solution = 50.0 g × 4.18 J g⁻¹ K⁻¹ × 11 K</text><text x="1065" y="354" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#10233F">= +2.30 kJ</text><text x="1065" y="398" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#C44949">q_reaction ≈ −q_solution = −2.30 kJ</text><text x="1065" y="442" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#20314B">n(Mg) = 0.120 g ÷ 24.3 g mol⁻¹ = 0.00494 mol</text><text x="1065" y="488" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#397D64">ΔH ≈ −466 kJ mol⁻¹</text><text x="1065" y="524" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#20314B">Mg is limiting; HCl is in excess.</text><text x="1065" y="562" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#5B6D80">Heat loss lowers ΔT; cup heat capacity is omitted.</text><text x="760" y="710" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#5B6D80">Use the supplied c and consistent units; apply corrections when specified.</text><text x="764" y="862" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".06">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE  •  STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="887" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>