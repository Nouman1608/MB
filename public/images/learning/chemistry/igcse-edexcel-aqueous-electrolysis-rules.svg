<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1270" viewBox="0 0 1800 2540" role="img" aria-labelledby="title desc"><title id="title">Aqueous electrolysis: which ion is discharged (Edexcel International GCSE Chemistry: Paper 2 only)</title><desc id="desc">The whole figure is marked Paper 2 only (4CH1 1.58C). At the cathode, a reactivity ladder Na, Mg, Zn, Fe, H, Cu, Ag: for metals above hydrogen the metal ion stays dissolved and hydrogen gas forms (for example sodium chloride solution); for copper and silver, below hydrogen, the metal forms (for example copper sulfate solution). At the anode, a concentrated halide solution gives chlorine from Cl- ions, while a dilute halide or no halide gives oxygen from OH- in water: the halide wins only if concentrated.</desc><rect width="1800" height="2540" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><g transform="translate(0 110)">
<text x="900" y="112" font-size="68" font-weight="700" fill="#1E2B47" text-anchor="middle">Which ion wins in water?</text>
<text x="900" y="186" font-size="44" fill="#4B5B72" text-anchor="middle" xml:space="preserve"><tspan>Aqueous solutions also contain H</tspan><tspan dy="-16.7" font-size="29.9">+</tspan><tspan dy="16.7"> and OH</tspan><tspan dy="-16.7" font-size="29.9">−</tspan><tspan dy="16.7"> from water</tspan></text>
<text x="81" y="313" font-size="56" font-weight="700" fill="#2F6B63">At the cathode (−)</text>
<rect x="198" y="371" width="283" height="103" rx="18" fill="#FFFFFF" stroke="#1E2B47" stroke-width="5"/>
<text x="340" y="442" font-size="56" font-weight="700" fill="#1E2B47" text-anchor="middle">Na</text>
<rect x="198" y="491" width="283" height="103" rx="18" fill="#FFFFFF" stroke="#1E2B47" stroke-width="5"/>
<text x="340" y="562" font-size="56" font-weight="700" fill="#1E2B47" text-anchor="middle">Mg</text>
<rect x="198" y="611" width="283" height="103" rx="18" fill="#FFFFFF" stroke="#1E2B47" stroke-width="5"/>
<text x="340" y="682" font-size="56" font-weight="700" fill="#1E2B47" text-anchor="middle">Zn</text>
<rect x="198" y="731" width="283" height="103" rx="18" fill="#FFFFFF" stroke="#1E2B47" stroke-width="5"/>
<text x="340" y="802" font-size="56" font-weight="700" fill="#1E2B47" text-anchor="middle">Fe</text>
<rect x="198" y="851" width="283" height="103" rx="18" fill="#F2E6B7" stroke="#8A6A0C" stroke-width="6"/>
<text x="340" y="922" font-size="56" font-weight="700" fill="#8A6A0C" text-anchor="middle">H</text>
<rect x="198" y="972" width="283" height="103" rx="18" fill="#FFFFFF" stroke="#1E2B47" stroke-width="5"/>
<text x="340" y="1043" font-size="56" font-weight="700" fill="#1E2B47" text-anchor="middle">Cu</text>
<rect x="198" y="1091" width="283" height="103" rx="18" fill="#FFFFFF" stroke="#1E2B47" stroke-width="5"/>
<text x="340" y="1162" font-size="56" font-weight="700" fill="#1E2B47" text-anchor="middle">Ag</text>
<line x1="123" y1="1176" x2="123" y2="437" stroke="#1E2B47" stroke-width="8" stroke-linecap="round"/><polygon points="123,383 151,439 95,439" fill="#1E2B47"/>
<text x="58" y="778" font-size="44" fill="#4B5B72" text-anchor="middle" transform="rotate(-90 58 778)">more reactive</text>
<path d="M520 371 H553 V836 H520" fill="none" stroke="#1E2B47" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M520 970 H553 V1197 H520" fill="none" stroke="#1E2B47" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="601" y="528" font-size="46" fill="#1E2B47">metal ion stays dissolved</text>
<text x="601" y="605" font-size="56" font-weight="700" fill="#2F6B63" xml:space="preserve"><tspan>H</tspan><tspan dy="15.7" font-size="38.1">2</tspan><tspan dy="-15.7"> gas forms</tspan></text>
<text x="601" y="690" font-size="44" fill="#4B5B72">e.g. sodium chloride solution</text>
<text x="601" y="921" font-size="44" font-weight="700" fill="#8A6A0C" xml:space="preserve"><tspan>H</tspan><tspan dy="-16.7" font-size="29.9">+</tspan><tspan dy="16.7"> from water: dividing line</tspan></text>
<text x="601" y="1027" font-size="46" fill="#1E2B47">metal ion is discharged</text>
<text x="601" y="1106" font-size="56" font-weight="700" fill="#2F6B63">metal forms</text>
<text x="601" y="1185" font-size="44" fill="#4B5B72">e.g. copper sulfate solution</text>
<text x="81" y="1397" font-size="56" font-weight="700" fill="#2F6B63">At the anode (+)</text>
<text x="419" y="1510" font-size="46" font-weight="700" fill="#1E2B47" text-anchor="middle">concentrated halide</text>
<text x="1379" y="1510" font-size="46" font-weight="700" fill="#1E2B47" text-anchor="middle">dilute halide, or none</text>
