<text x="419" y="2153" font-size="44" fill="#4B5B72" text-anchor="middle" xml:space="preserve"><tspan>from Cl</tspan><tspan dy="-16.7" font-size="29.9">−</tspan><tspan dy="16.7"> ions</tspan></text>
<text x="1379" y="2090" font-size="56" font-weight="700" fill="#1E2B47" text-anchor="middle" xml:space="preserve"><tspan>O</tspan><tspan dy="15.7" font-size="38.1">2</tspan><tspan dy="-15.7"> forms</tspan></text>
