<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1040" viewBox="0 0 1800 2080" role="img" aria-labelledby="title desc"><title id="title">Plastic waste (OxfordAQA International GCSE Chemistry)</title><desc id="desc">No tier label: OxfordAQA International GCSE Chemistry is not tiered; 9202 statement 3.10.2e says many polymers are not biodegradable, causing problems in landfill sites and in litter. Landfill: 100 years later the plastic is still there, because it does not break down. Oceans: plastic collects in the sea and harms marine life. Burning, marked not required by OxfordAQA (9202 does not cover burning polymers): it can give off toxic gases, so burning is no easy fix. PET, also marked not required by OxfordAQA (condensation polymers are not in 9202): one fix is to break it back to its monomers, a diacid and a diol, then make new PET.</desc><rect width="1800" height="2080" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="92" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle">Plastic waste</text>
<text x="900" y="172" font-size="42" fill="#4B5B72" text-anchor="middle">Stable plastics are hard to get rid of</text>
