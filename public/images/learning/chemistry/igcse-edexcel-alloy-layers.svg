<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1290" viewBox="0 0 1800 2580" role="img" aria-labelledby="title desc"><title id="title">Why alloys are harder (Edexcel International GCSE Chemistry: Paper 2 only)</title><desc id="desc">Marked Paper 2 only: 4CH1 statement 2.27C, explain why alloys are harder than pure metals, is in bold. Pure metal: same-size atoms in neat layers; pushed, the layers slide, so the metal is soft. Alloy: bigger atoms of a different size sit among the metal atoms and jam the layers, so a push cannot make them slide and the alloy is harder.</desc><rect width="1800" height="2580" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="92" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle">Why alloys are harder</text>
<text x="900" y="172" font-size="42" fill="#4B5B72" text-anchor="middle">Different-sized atoms block the layers</text>
