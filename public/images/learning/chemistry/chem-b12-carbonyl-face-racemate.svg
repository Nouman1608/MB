<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="870" viewBox="0 0 1528 870" role="img" aria-labelledby="title desc"><title id="title">Two-face attack gives a racemate</title><desc id="desc">In achiral conditions, cyanide attacks planar ethanal from either face with equal probability, forming a pair of enantiomeric cyanohydrins.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#172b3c"/></marker><marker id="tealArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#288a83"/></marker></defs><style>text{font-family:Arial,"Liberation Sans",sans-serif}</style><rect width="100%" height="100%" fill="#fbfcfa"/><text x="44" y="58" font-size="34" fill="#172b3c" font-weight="700">Two-face attack gives a racemate</text><rect x="40" y="95" width="1448" height="690" rx="26" fill="#f2f7f6"/><rect x="65" y="145" width="360" height="150" rx="20" fill="white" stroke="#c9d8dc" stroke-width="2"/><rect x="65" y="145" width="360" height="10" rx="5" fill="#288a83"/><text x="87" y="190" font-size="25" fill="#172b3c" font-weight="700">Planar carbonyl</text><text x="87" y="227" font-size="21" fill="#203545" font-weight="400">Ethanal C=O is trigonal</text><text x="87" y="253.25" font-size="21" fill="#203545" font-weight="400">planar; either face is</text><text x="87" y="279.5" font-size="21" fill="#203545" font-weight="400">accessible.</text><line x1="435" y1="220" x2="565" y2="220" stroke="#172b3c" stroke-width="4"  marker-end="url(#arrow)"/><polygon points="700,160 810,220 700,280 590,220" fill="white" stroke="#172b3c" stroke-width="4"/><text x="650" y="225" font-size="28" fill="#172b3c">C=O</text><line x1="700" y1="130" x2="700" y2="175" stroke="#c45637" stroke-width="5"  marker-end="url(#arrow)"/><line x1="700" y1="310" x2="700" y2="265" stroke="#288a83" stroke-width="5"  marker-end="url(#arrow)"/><text x="590" y="120" font-size="23" fill="#c45637" font-weight="700">CN⁻ face A</text><text x="590" y="350" font-size="23" fill="#288a83" font-weight="700">CN⁻ face B</text><line x1="835" y1="220" x2="955" y2="220" stroke="#172b3c" stroke-width="4"  marker-end="url(#arrow)"/><rect x="975" y="140" width="460" height="170" rx="20" fill="white" stroke="#c9d8dc" stroke-width="2"/><rect x="975" y="140" width="460" height="10" rx="5" fill="#e5b94c"/><text x="997" y="185" font-size="25" fill="#172b3c" font-weight="700">Two tetrahedral products</text><text x="997" y="222" font-size="21" fill="#203545" font-weight="400">The new carbon has CH₃, H, OH</text><text x="997" y="248.25" font-size="21" fill="#203545" font-weight="400">and CN: four different groups.</text><text x="1035" y="390" font-size="34" fill="#172b3c" font-weight="700">50%</text><text x="1070" y="535" font-size="22" fill="#172b3c" font-weight="700">C*</text><line x1="1085" y1="520" x2="1045" y2="485" stroke="#172b3c" stroke-width="3"/><text x="1005" y="480" font-size="20" fill="#172b3c" font-weight="700">CH₃</text><line x1="1100" y1="520" x2="1115" y2="485" stroke="#172b3c" stroke-width="3"/><text x="1115" y="480" font-size="20" fill="#172b3c" font-weight="700">H</text><line x1="1085" y1="540" x2="1045" y2="570" stroke="#172b3c" stroke-width="3"/><text x="1015" y="590" font-size="20" fill="#172b3c" font-weight="700">CN</text><polygon points="1100,540 1120,555 1130,570 1118,575" fill="#288a83"/><text x="1130" y="590" font-size="20" fill="#288a83" font-weight="700">OH</text><text x="1235" y="390" font-size="34" fill="#172b3c" font-weight="700">50%</text><text x="1270" y="535" font-size="22" fill="#172b3c" font-weight="700">C*</text><line x1="1285" y1="520" x2="1245" y2="485" stroke="#172b3c" stroke-width="3"/><text x="1205" y="480" font-size="20" fill="#172b3c" font-weight="700">CH₃</text><line x1="1300" y1="520" x2="1315" y2="485" stroke="#172b3c" stroke-width="3"/><text x="1315" y="480" font-size="20" fill="#172b3c" font-weight="700">H</text><line x1="1285" y1="540" x2="1245" y2="570" stroke="#172b3c" stroke-width="3"/><text x="1215" y="590" font-size="20" fill="#172b3c" font-weight="700">CN</text><line x1="1300" y1="540" x2="1340" y2="570" stroke="#c45637" stroke-width="3" stroke-dasharray="6 5"/><text x="1340" y="590" font-size="20" fill="#c45637" font-weight="700">OH</text><rect x="230" y="610" width="1068" height="105" rx="20" fill="white" stroke="#c9d8dc" stroke-width="2"/><rect x="230" y="610" width="1068" height="10" rx="5" fill="#172b3c"/><text x="252" y="655" font-size="25" fill="#172b3c" font-weight="700">Outcome</text><text x="252" y="692" font-size="21" fill="#203545" font-weight="400">Equal amounts of mirror-image products form: a racemic mixture with no</text><text x="252" y="718.25" font-size="21" fill="#203545" font-weight="400">net optical rotation.</text><text x="764" y="810" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".06">MARLBRIDGE STUDY RESOURCES</text><text x="764" y="760" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#a43f3f">Equal 50:50 only for achiral conditions and equivalent faces.</text><line x1="40" y1="816" x2="1488" y2="816" stroke="#C9A227" stroke-width="2"/><text x="44" y="848" font-size="16" fill="#607783" font-weight="600">MARLBRIDGE  •  Schematic; not to scale</text><image href="data:image/svg+xml;base64," x="1310" y="823" width="178" height="43" preserveAspectRatio="xMidYMid meet"/></svg>
