<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#C44949"/></marker></defs><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#10233F">Polyatomic ions: build neutral ionic formulas</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="500" fill="#5B6D80">AQA A-level bonding • preserve each compound ion as a unit when balancing charge</text><rect x="52" y="132" width="1424" height="650" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="82" y="178" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233F">Keep each compound ion together; use the smallest whole-number ion ratio that gives net charge 0.</text><rect x="86" y="212" width="608" height="440" rx="12" fill="#E8F1F4" stroke="#D3DCE2" stroke-width="2"/><text x="116" y="257" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#10233F">Compound ions to recognise</text><text x="126" y="302" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#20314B">sulfate</text><text x="400" y="302" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#168C8C">SO₄²⁻</text><text x="626" y="302" text-anchor="end" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#5B6D80">−2</text><path d="M116 320L650 320" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="126" y="364" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#20314B">hydroxide</text><text x="400" y="364" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#168C8C">OH⁻</text><text x="626" y="364" text-anchor="end" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#5B6D80">−1</text><path d="M116 382L650 382" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="126" y="426" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#20314B">nitrate</text><text x="400" y="426" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#168C8C">NO₃⁻</text><text x="626" y="426" text-anchor="end" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#5B6D80">−1</text><path d="M116 444L650 444" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="126" y="488" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#20314B">carbonate</text><text x="400" y="488" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#168C8C">CO₃²⁻</text><text x="626" y="488" text-anchor="end" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#5B6D80">−2</text><path d="M116 506L650 506" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="126" y="550" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#20314B">ammonium</text><text x="400" y="550" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#168C8C">NH₄⁺</text><text x="626" y="550" text-anchor="end" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#5B6D80">+1</text><rect x="734" y="212" width="704" height="440" rx="12" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="766" y="257" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#10233F">Balance total charge to zero</text><text x="770" y="306" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="500" fill="#20314B">Al³⁺ + SO₄²⁻</text><text x="1080" y="306" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#315F86">Al₂(SO₄)₃</text><text x="1080" y="331" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">2(+3) + 3(−2) = 0</text><path d="M766 348L1404 348" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="770" y="381" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="500" fill="#20314B">Mg²⁺ + OH⁻</text><text x="1080" y="381" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#315F86">Mg(OH)₂</text><text x="1080" y="406" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">(+2) + 2(−1) = 0</text><path d="M766 423L1404 423" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="770" y="456" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="500" fill="#20314B">Ca²⁺ + NO₃⁻</text><text x="1080" y="456" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#315F86">Ca(NO₃)₂</text><text x="1080" y="481" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">(+2) + 2(−1) = 0</text><path d="M766 498L1404 498" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="770" y="531" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="500" fill="#20314B">NH₄⁺ + CO₃²⁻</text><text x="1080" y="531" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#315F86">(NH₄)₂CO₃</text><text x="1080" y="556" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">2(+1) + (−2) = 0</text><rect x="86" y="686" width="1352" height="60" rx="8" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/><text x="762" y="724" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">Use parentheses only when more than one copy of a polyatomic ion is needed: Mg(OH)₂, Ca(NO₃)₂, (NH₄)₂CO₃.</text><text x="764" y="862" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".06">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE  •  STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="887" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
