<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1120" viewBox="0 0 1800 2240" role="img" aria-labelledby="title desc"><title id="title">Three ways to write ethanol (OxfordAQA International GCSE Chemistry)</title><desc id="desc">Ethanol written three ways, each with more detail: molecular formula C2H6O counts the atoms; structural formula CH3CH2OH shows the arrangement; the displayed formula shows every atom and every bond, with labels that hydrogen makes 1 bond, oxygen 2 bonds and carbon 4 bonds, and each line is 1 bond. No tier labels.</desc><rect width="1800" height="2240" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="110" font-size="66" font-weight="700" fill="#1E2B47" text-anchor="middle">Three ways to write ethanol</text>
<text x="900" y="178" font-size="44" fill="#4B5B72" text-anchor="middle">Each shows more detail than the last</text>
<rect x="81" y="250" width="1638" height="239" rx="28" fill="#FFFFFF" stroke="#1E2B47" stroke-width="6"/>
<text x="141" y="350" font-size="52" font-weight="700" fill="#1E2B47">Molecular formula</text>
<text x="141" y="430" font-size="44" fill="#4B5B72">counts the atoms</text>
<text x="1538" y="424" font-size="96" font-weight="700" fill="#1E2B47" text-anchor="end" xml:space="preserve"><tspan>C</tspan><tspan dy="26.9" font-size="65.3">2</tspan><tspan dy="-26.9">H</tspan><tspan dy="26.9" font-size="65.3">6</tspan><tspan dy="-26.9">O</tspan></text>
<polygon points="868,508 932,508 900,548" fill="#1E2B47"/>
<rect x="81" y="570" width="1638" height="239" rx="28" fill="#FFFFFF" stroke="#1E2B47" stroke-width="6"/>
<text x="141" y="670" font-size="52" font-weight="700" fill="#1E2B47">Structural formula</text>
<text x="141" y="750" font-size="44" fill="#4B5B72">shows the arrangement</text>
<text x="1652" y="744" font-size="96" font-weight="700" fill="#1E2B47" text-anchor="end" xml:space="preserve"><tspan>CH</tspan><tspan dy="26.9" font-size="65.3">3</tspan><tspan dy="-26.9">CH</tspan><tspan dy="26.9" font-size="65.3">2</tspan><tspan dy="-26.9">OH</tspan></text>
