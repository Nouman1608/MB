<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1010" viewBox="0 0 1800 2020" role="img" aria-labelledby="title desc"><title id="title">Covalent bonding: sharing pairs</title><desc id="desc">No tier label: all four molecules are on both Edexcel International GCSE papers (4CH1 1.46 lists hydrogen halides, water, carbon dioxide and methane) and OxfordAQA International GCSE Chemistry is not tiered (9202 3.2.1g). Dot-and-cross diagrams of outer shells; each shared pair sits where the shells overlap. HCl: one shared pair; Cl has 8, H has 2. H2O: two shared pairs; O has 8, each H has 2. CH4: four shared pairs; C has 8, each H has 2. CO2: two shared pairs with each oxygen (double bonds); C has 8, each O has 8. Dots are electrons from one atom, crosses from the other.</desc><rect width="1800" height="2020" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="92" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle">Covalent bonding: sharing pairs</text>
<text x="900" y="172" font-size="42" fill="#4B5B72" text-anchor="middle">Each shared pair sits where the shells overlap</text>
