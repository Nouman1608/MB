<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="title desc"><title id="title">Alcohol dehydration and cyclohexene purification</title><desc id="desc">AQA A-level Chemistry • butan-2-ol mechanism and cyclohexene practical</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#C44949"/></marker></defs><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#10233F">Alcohol dehydration and cyclohexene purification</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">AQA A-level Chemistry • butan-2-ol mechanism and cyclohexene practical</text><rect x="52" y="132" width="690" height="606" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="774" y="132" width="702" height="606" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="397" y="182" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">Butan-2-ol acid-catalysed elimination</text><text x="1125" y="182" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#315F86">Cyclohexene purification</text><rect x="88" y="222" width="618" height="84" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="118" y="257" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#20314B">1  Protonate OH → good leaving group</text><text x="118" y="286" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">CH₃CH(OH)CH₂CH₃ + H⁺ → protonated alcohol</text><rect x="88" y="324" width="618" height="84" rx="16" fill="#F4F1E8" stroke="#F4F1E8" stroke-width="2"/><text x="118" y="359" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#20314B">2  Water leaves → secondary carbocation</text><text x="118" y="388" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">CH₃C⁺HCH₂CH₃ + H₂O</text><rect x="88" y="426" width="618" height="84" rx="16" fill="#E7F3F1" stroke="#E7F3F1" stroke-width="2"/><text x="118" y="461" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#20314B">3  Lose β-H → C=C; regenerate H⁺</text><text x="118" y="490" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#168C8C">but-1-ene or E/Z-but-2-ene</text><text x="118" y="574" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#5B6D80">One secondary carbocation gives three alkene stereoisomers.</text><rect x="824" y="232" width="576" height="130" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="852" y="272" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#20314B">Reaction flask → still head → condenser</text><text x="852" y="312" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">Distil cyclohexene as it forms.</text><line x1="882" y1="343" x2="1326" y2="343" stroke="#168C8C" stroke-width="5"/><rect x="824" y="388" width="576" height="130" rx="16" fill="#F4F1E8" stroke="#F4F1E8" stroke-width="2"/><text x="852" y="428" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#20314B">Separating funnel: wash with Na₂CO₃</text><text x="852" y="468" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#C44949">Vent CO₂ frequently; vent away from people.</text><rect x="824" y="544" width="576" height="118" rx="16" fill="#E7F3F1" stroke="#E7F3F1" stroke-width="2"/><text x="852" y="584" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">Separate layers; retain organic cyclohexene</text><text x="852" y="618" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#5B6D80">layer (upper/lower depends on solvent pair).</text><text letter-spacing="5" opacity=".08" x="764" y="849" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE STUDY RESOURCES</text><line x1="52" y1="866" x2="1476" y2="866" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="875" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
