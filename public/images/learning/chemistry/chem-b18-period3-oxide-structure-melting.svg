<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="title desc"><title id="title">Period 3 oxides: structure explains the melting-point pattern</title><desc id="desc">AQA course-level structural models compare giant ionic Na2O, MgO and Al2O3; a giant covalent SiO2 network; and simple molecular P4O10 and SO3. The diagram names the interactions overcome on melting and ranks the listed melting points MgO &gt; Al2O3 &gt; SiO2 &gt; Na2O &gt; P4O10 &gt; SO3. Schematics are not to scale; sulfur trioxide solid forms vary by phase.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#10233F">Period 3 oxides: structure explains the melting-point pattern</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#5B6D80">Marlbridge • Chemistry teaching diagram</text><rect x="45" y="145" width="460" height="410" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="63" y="179" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233F">Giant ionic lattices</text><text x="275" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#10233F">Na₂O</text><text x="275" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6D80">two formula units: 4 Na⁺ : 2 O²⁻</text><circle cx="170" cy="325" r="25" fill="#315F86" opacity=".15" stroke="#315F86" stroke-width="3"/><text x="170" y="331" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#315F86">Na⁺</text><circle cx="265" cy="325" r="25" fill="#C44949" opacity=".15" stroke="#C44949" stroke-width="3"/><text x="265" y="331" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#C44949">O²⁻</text><circle cx="360" cy="325" r="25" fill="#315F86" opacity=".15" stroke="#315F86" stroke-width="3"/><text x="360" y="331" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#315F86">Na⁺</text><circle cx="170" cy="385" r="25" fill="#315F86" opacity=".15" stroke="#315F86" stroke-width="3"/><text x="170" y="391" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#315F86">Na⁺</text><circle cx="265" cy="385" r="25" fill="#C44949" opacity=".15" stroke="#C44949" stroke-width="3"/><text x="265" y="391" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#C44949">O²⁻</text><circle cx="360" cy="385" r="25" fill="#315F86" opacity=".15" stroke="#315F86" stroke-width="3"/><text x="360" y="391" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#315F86">Na⁺</text><text x="275" y="450" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">MgO: Mg²⁺ : O²⁻ = 1 : 1</text><text x="275" y="477" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20314B">higher charge density → stronger attraction</text><text x="275" y="510" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">Al₂O₃: 2 Al³⁺ : 3 O²⁻</text><text x="275" y="535" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20314B">ionic lattice with some covalent character</text><rect x="530" y="145" width="455" height="410" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="548" y="179" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233F">Giant covalent network</text><text x="757" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#10233F">SiO₂</text><circle cx="600" cy="285" r="22" fill="#C44949" opacity=".14" stroke="#C44949" stroke-width="3"/><text x="600" y="291" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#C44949">O</text><circle cx="670" cy="350" r="22" fill="#315F86" opacity=".14" stroke="#315F86" stroke-width="3"/><text x="670" y="356" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#315F86">Si</text><circle cx="600" cy="415" r="22" fill="#C44949" opacity=".14" stroke="#C44949" stroke-width="3"/><text x="600" y="421" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#C44949">O</text><circle cx="685" cy="445" r="22" fill="#C44949" opacity=".14" stroke="#C44949" stroke-width="3"/><text x="685" y="451" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#C44949">O</text><circle cx="770" cy="350" r="22" fill="#C44949" opacity=".14" stroke="#C44949" stroke-width="3"/><text x="770" y="356" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#C44949">O</text><circle cx="940" cy="285" r="22" fill="#C44949" opacity=".14" stroke="#C44949" stroke-width="3"/><text x="940" y="291" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#C44949">O</text><circle cx="940" cy="415" r="22" fill="#C44949" opacity=".14" stroke="#C44949" stroke-width="3"/><text x="940" y="421" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#C44949">O</text><circle cx="860" cy="445" r="22" fill="#C44949" opacity=".14" stroke="#C44949" stroke-width="3"/><text x="860" y="451" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#C44949">O</text><circle cx="895" cy="350" r="22" fill="#315F86" opacity=".14" stroke="#315F86" stroke-width="3"/><text x="895" y="356" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#315F86">Si</text><path d="M620 299L655 335" fill="none" stroke="#168C8C" stroke-width="4" /><path d="M620 401L655 365" fill="none" stroke="#168C8C" stroke-width="4" /><path d="M680 372L683 423" fill="none" stroke="#168C8C" stroke-width="4" /><path d="M692 350L748 350" fill="none" stroke="#168C8C" stroke-width="4" /><path d="M792 350L873 350" fill="none" stroke="#168C8C" stroke-width="4" /><path d="M910 335L920 300" fill="none" stroke="#168C8C" stroke-width="4" /><path d="M910 365L920 400" fill="none" stroke="#168C8C" stroke-width="4" /><path d="M880 372L867 423" fill="none" stroke="#168C8C" stroke-width="4" /><text x="757" y="495" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#20314B">Each Si has 4 O neighbours; each O bridges 2 Si.</text><text x="757" y="525" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#10233F">Melting disrupts many strong covalent bonds.</text><rect x="1010" y="145" width="473" height="410" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="1028" y="179" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233F">Simple molecular substances</text><text x="1246" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#10233F">P₄O₁₀  •  SO₃</text><rect x="1070" y="270" width="140" height="95" rx="16" fill="#E8F1F4" stroke="#315F86" stroke-width="2"/><text x="1140" y="310" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#315F86">P₄O₁₀</text><text x="1140" y="342" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">one molecule</text><rect x="1280" y="270" width="140" height="95" rx="16" fill="#F7EAF0" stroke="#725C8E" stroke-width="2"/><text x="1350" y="310" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#725C8E">SO₃</text><text x="1350" y="342" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">one molecule</text><path d="M1210 315L1280 315" fill="none" stroke="#C9A227" stroke-width="3" stroke-dasharray="5 7"/><text x="1246" y="405" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#C9A227">weak intermolecular attractions</text><text x="1246" y="455" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#20314B">Melting separates molecules; covalent bonds</text><text x="1246" y="482" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#20314B">within each molecule remain intact.</text><text x="1246" y="525" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#C44949">SO₃ solid structure depends on its phase.</text><rect x="45" y="585" width="1438" height="205" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="63" y="619" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233F">Melting-point order for the listed oxides</text><text x="764" y="650" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6D80">lower</text><path d="M330 678L1195 678" fill="none" stroke="#C9A227" stroke-width="5" marker-end="url(#arr)"/><text x="1205" y="650" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6D80">higher</text><rect x="288" y="700" width="124" height="52" rx="12" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="350" y="733" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">SO₃</text><rect x="448" y="700" width="124" height="52" rx="12" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="510" y="733" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">P₄O₁₀</text><rect x="618" y="700" width="124" height="52" rx="12" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="680" y="733" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">Na₂O</text><rect x="788" y="700" width="124" height="52" rx="12" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="850" y="733" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">SiO₂</text><rect x="958" y="700" width="124" height="52" rx="12" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="1020" y="733" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">Al₂O₃</text><rect x="1128" y="700" width="124" height="52" rx="12" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="1190" y="733" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">MgO</text><text x="764" y="770" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#20314B">Trend explained by the interactions that must be overcome on melting.</text><text x="760" y="825" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">Schematic bonding models • not measured unit cells or molecular geometries.</text><text x="764" y="862" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".06">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE  •  STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="887" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>