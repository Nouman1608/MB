<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="title desc"><title id="title">Electronegativity, bond polarity and molecular dipoles</title><desc id="desc">OxfordAQA A-level polarity definitions; reusable to close the AQA objective.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#C44949"/></marker><marker id="arrblue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#315F86"/></marker></defs><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#10233F">Electronegativity, bond polarity and molecular dipoles</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">OxfordAQA A-level polarity definitions; reusable to close the AQA objective.</text><rect x="52" y="132" width="1424" height="606" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="82" y="174" width="424" height="510" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="552" y="174" width="424" height="510" rx="16" fill="#E7F3F1" stroke="#D3DCE2" stroke-width="2"/><rect x="1022" y="174" width="424" height="510" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="112" y="213" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#315F86">1  Electronegativity</text><text x="112" y="251" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#20314B">An atom’s relative pull on the</text><text x="112" y="276" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#20314B">shared bonding electron pair.</text><text x="252" y="326" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#10233F">C — Cl</text><text x="180" y="361" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#5B6D80">C 2.55</text><text x="324" y="361" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#5B6D80">Cl 3.16</text><text x="252" y="405" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#168C8C">ΔEN = 0.61</text><text x="252" y="451" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">difference between atoms</text><text x="582" y="213" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#168C8C">2  Bond polarity</text><text x="582" y="251" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#20314B">Unequal sharing creates partial</text><text x="582" y="276" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#20314B">charges and a bond dipole.</text><text x="630" y="341" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#10233F">Cδ+</text><text x="858" y="341" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#10233F">Clδ−</text><line x1="670" y1="335" x2="817" y2="335" stroke="#20314B" stroke-width="4"/><path d="M703 308 C735 274 776 274 807 308" fill="none" stroke="#C44949" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="756" y="289" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#C44949">bond dipole μ</text><text x="756" y="401" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">Dipole arrow points toward δ−.</text><text x="756" y="435" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">δ+  ⟶  δ−</text><text x="1052" y="213" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#725C8E">3  Molecular dipole</text><text x="1052" y="251" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#20314B">Add all bond-dipole vectors</text><text x="1052" y="276" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#20314B">according to molecular shape.</text><text x="1234" y="326" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">H₂O: bent</text><line x1="1234" y1="383" x2="1200" y2="418" stroke="#20314B" stroke-width="2"/><line x1="1234" y1="383" x2="1268" y2="418" stroke="#20314B" stroke-width="2"/><text x="1234" y="382" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#C44949">Oδ−</text><text x="1196" y="435" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#315F86">Hδ+</text><text x="1272" y="435" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#315F86">Hδ+</text><path d="M1204 414 L1224 391" fill="none" stroke="#315F86" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrblue)"/><path d="M1264 414 L1244 391" fill="none" stroke="#315F86" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrblue)"/><path d="M1234 428 L1234 400" fill="none" stroke="#C44949" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="1234" y="464" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#168C8C">net μ ≠ 0</text><text x="1234" y="500" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">CO₂: linear</text><text x="1234" y="527" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">equal C=O vectors cancel</text><path d="M1234 562 L1190 562" fill="none" stroke="#315F86" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrblue)"/><path d="M1234 562 L1278 562" fill="none" stroke="#315F86" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrblue)"/><text x="1234" y="592" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#168C8C">net μ = 0</text><text x="764" y="711" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">Electronegativity is an atom property; polarity describes a bond or whole molecule.</text><text x="764" y="733" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">Symmetry can cancel polar bonds, leaving no permanent molecular dipole.</text><text letter-spacing="5" opacity=".08" x="764" y="849" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE STUDY RESOURCES</text><line x1="52" y1="866" x2="1476" y2="866" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="875" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
