<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="870" viewBox="0 0 1528 870" role="img" aria-labelledby="title desc"><title id="title">Acid-catalysed hydration of propene</title><desc id="desc">Propene forms mainly propan-2-ol because protonation gives the more stable secondary carbocation. Water attacks the carbocation, then deprotonation regenerates H+.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#172b3c"/></marker><marker id="tealArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#288a83"/></marker></defs><style>text{font-family:Arial,"Liberation Sans",sans-serif}</style><rect width="100%" height="100%" fill="#fbfcfa"/><text x="44" y="58" font-size="34" fill="#172b3c" font-weight="700">Acid-catalysed hydration of propene</text><rect x="40" y="95" width="1448" height="690" rx="26" fill="#f2f7f6"/><rect x="75" y="140" width="350" height="150" rx="20" fill="white" stroke="#c9d8dc" stroke-width="2"/><rect x="75" y="140" width="350" height="10" rx="5" fill="#288a83"/><text x="97" y="185" font-size="25" fill="#172b3c" font-weight="700">1  Protonation</text><text x="97" y="222" font-size="21" fill="#203545" font-weight="400">π bond takes H⁺; the</text><text x="97" y="248.25" font-size="21" fill="#203545" font-weight="400">more stable secondary</text><text x="97" y="274.5" font-size="21" fill="#203545" font-weight="400">carbocation is</text><text x="97" y="300.75" font-size="21" fill="#203545" font-weight="400">favoured.</text><rect x="590" y="140" width="350" height="150" rx="20" fill="white" stroke="#c9d8dc" stroke-width="2"/><rect x="590" y="140" width="350" height="10" rx="5" fill="#e5b94c"/><text x="612" y="185" font-size="25" fill="#172b3c" font-weight="700">2  Water attack</text><text x="612" y="222" font-size="21" fill="#203545" font-weight="400">A lone pair on H₂O</text><text x="612" y="248.25" font-size="21" fill="#203545" font-weight="400">attacks C⁺; an oxonium</text><text x="612" y="274.5" font-size="21" fill="#203545" font-weight="400">ion forms.</text><rect x="1105" y="140" width="330" height="150" rx="20" fill="white" stroke="#c9d8dc" stroke-width="2"/><rect x="1105" y="140" width="330" height="10" rx="5" fill="#c45637"/><text x="1127" y="185" font-size="25" fill="#172b3c" font-weight="700">3  Deprotonation</text><text x="1127" y="222" font-size="21" fill="#203545" font-weight="400">O–H electrons return</text><text x="1127" y="248.25" font-size="21" fill="#203545" font-weight="400">to O; H⁺ catalyst is</text><text x="1127" y="274.5" font-size="21" fill="#203545" font-weight="400">regenerated.</text><line x1="435" y1="215" x2="570" y2="215" stroke="#172b3c" stroke-width="4"  marker-end="url(#arrow)"/><line x1="950" y1="215" x2="1085" y2="215" stroke="#172b3c" stroke-width="4"  marker-end="url(#arrow)"/><text x="95" y="390" font-size="34" fill="#172b3c" font-weight="700">CH₃–CH=CH₂  +  H⁺</text><text x="605" y="390" font-size="34" fill="#172b3c" font-weight="700">→  CH₃–C⁺H–CH₃</text><text x="1010" y="390" font-size="32" fill="#172b3c" font-weight="700">→  CH₃–CH(OH₂⁺)–CH₃</text><line x1="330" y1="410" x2="560" y2="410" stroke="#288a83" stroke-width="5"  marker-end="url(#arrow)"/><text x="505" y="520" font-size="34" fill="#288a83" font-weight="700">→  CH₃–CH(OH)–CH₃  +  H⁺</text><rect x="240" y="610" width="1048" height="105" rx="20" fill="white" stroke="#c9d8dc" stroke-width="2"/><rect x="240" y="610" width="1048" height="10" rx="5" fill="#172b3c"/><text x="262" y="655" font-size="25" fill="#172b3c" font-weight="700">Product ratio</text><text x="262" y="692" font-size="21" fill="#203545" font-weight="400">Propan-2-ol is the major product; propan-1-ol is minor. The figure</text><text x="262" y="718.25" font-size="21" fill="#203545" font-weight="400">shows the major route.</text><line x1="40" y1="816" x2="1488" y2="816" stroke="#d9e3e4"/><text x="44" y="848" font-size="16" fill="#607783" font-weight="600">MARLBRIDGE  •  Schematic; not to scale</text></svg>
