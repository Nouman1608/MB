<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="title desc"><title id="title">Identify aqueous ions with three separate test tubes</title><desc id="desc">Three clean aliquots are tested separately: tube A receives sodium hydroxide dropwise then in excess; tube B receives aqueous ammonia dropwise then in excess; tube C receives sodium carbonate while watching for bubbles. A comparison table records the source outcomes for Fe2+, Cu2+, Fe3+ and Al3+. Iron(II) hydroxide turns brown at the surface on standing in air.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#10233F">Identify aqueous ions with three separate test tubes</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#5B6D80">Marlbridge • Chemistry teaching diagram</text><rect x="48" y="120" width="1432" height="258" rx="18" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="764" y="154" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#10233F">Start with three clean aliquots of the unknown solution</text><path d="M134 216V309Q134 328 152 328H208Q226 328 226 309V216" fill="#FFFFFF" stroke="#315F86" stroke-width="4"/><path d="M140 273H220V308Q220 321 205 321H155Q140 321 140 308Z" fill="#DCEBF3" opacity=".8"/><path d="M127 212H233" stroke="#10233F" stroke-width="6" stroke-linecap="round"/><circle cx="100" cy="245" r="24" fill="#10233F"/><text x="100" y="252" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">A</text><text x="180" y="363" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">dilute NaOH</text><text x="180" y="391" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#5B6D80">dropwise → excess</text><path d="M554 216V309Q554 328 572 328H628Q646 328 646 309V216" fill="#FFFFFF" stroke="#315F86" stroke-width="4"/><path d="M560 273H640V308Q640 321 625 321H575Q560 321 560 308Z" fill="#E4F1E9" opacity=".8"/><path d="M547 212H653" stroke="#10233F" stroke-width="6" stroke-linecap="round"/><circle cx="520" cy="245" r="24" fill="#10233F"/><text x="520" y="252" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">B</text><text x="600" y="363" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">dilute NH₃</text><text x="600" y="391" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#5B6D80">dropwise → excess</text><path d="M974 216V309Q974 328 992 328H1048Q1066 328 1066 309V216" fill="#FFFFFF" stroke="#315F86" stroke-width="4"/><path d="M980 273H1060V308Q1060 321 1045 321H995Q980 321 980 308Z" fill="#F7EFD9" opacity=".8"/><path d="M967 212H1073" stroke="#10233F" stroke-width="6" stroke-linecap="round"/><circle cx="940" cy="245" r="24" fill="#10233F"/><text x="940" y="252" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">C</text><text x="1020" y="363" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">Na₂CO₃</text><text x="1020" y="391" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#5B6D80">watch for gas</text><rect x="50" y="442" width="250" height="48" rx="8" fill="#10233F" stroke="#10233F" stroke-width="2"/><text x="175" y="473" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Ion</text><rect x="300" y="442" width="400" height="48" rx="8" fill="#10233F" stroke="#10233F" stroke-width="2"/><text x="500" y="473" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">A • NaOH(aq)</text><rect x="700" y="442" width="400" height="48" rx="8" fill="#10233F" stroke="#10233F" stroke-width="2"/><text x="900" y="473" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">B • NH₃(aq)</text><rect x="1100" y="442" width="382" height="48" rx="8" fill="#10233F" stroke="#10233F" stroke-width="2"/><text x="1291" y="473" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">C • Na₂CO₃(aq)</text><rect x="50" y="490" width="250" height="68" rx="4" fill="#E8F1F4" stroke="#D3DCE2" stroke-width="2"/><text x="68" y="519" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">Fe²⁺</text><rect x="300" y="490" width="400" height="68" rx="4" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="500" y="519" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20314B">green ppt; no change in excess</text><rect x="700" y="490" width="400" height="68" rx="4" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="900" y="519" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20314B">green ppt; remains</text><rect x="1100" y="490" width="382" height="68" rx="4" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="1291" y="519" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20314B">green FeCO₃ ppt; no gas</text><rect x="50" y="558" width="250" height="68" rx="4" fill="#E8F1F4" stroke="#D3DCE2" stroke-width="2"/><text x="68" y="587" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">Cu²⁺</text><rect x="300" y="558" width="400" height="68" rx="4" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="500" y="587" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20314B">blue ppt; remains</text><rect x="700" y="558" width="400" height="68" rx="4" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="900" y="587" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20314B">blue ppt → deep blue solution</text><rect x="1100" y="558" width="382" height="68" rx="4" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="1291" y="587" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20314B">blue-green CuCO₃ ppt; no gas</text><rect x="50" y="626" width="250" height="68" rx="4" fill="#E8F1F4" stroke="#D3DCE2" stroke-width="2"/><text x="68" y="655" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">Fe³⁺</text><rect x="300" y="626" width="400" height="68" rx="4" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="500" y="655" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20314B">orange-brown ppt; remains</text><rect x="700" y="626" width="400" height="68" rx="4" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="900" y="655" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20314B">orange-brown ppt; remains</text><rect x="1100" y="626" width="382" height="68" rx="4" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="1291" y="655" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20314B">orange-brown ppt + CO₂ bubbles</text><rect x="50" y="694" width="250" height="68" rx="4" fill="#E8F1F4" stroke="#D3DCE2" stroke-width="2"/><text x="68" y="723" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">Al³⁺</text><rect x="300" y="694" width="400" height="68" rx="4" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="500" y="723" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20314B">white ppt → dissolves in excess</text><rect x="700" y="694" width="400" height="68" rx="4" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="900" y="723" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20314B">white ppt; remains</text><rect x="1100" y="694" width="382" height="68" rx="4" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="1291" y="723" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20314B">white ppt + CO₂ bubbles</text><rect x="50" y="790" width="1432" height="48" rx="10" fill="#FFF9E8" stroke="#C9A227" stroke-width="2"/><text x="766" y="820" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#10233F">ppt = precipitate • Leave tube A to stand: Fe²⁺ green precipitate browns at its surface in air.</text><text x="764" y="862" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".06">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE  •  STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="887" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>