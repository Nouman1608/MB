<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1120" viewBox="0 0 768 1120" role="img" aria-labelledby="title desc"><title id="title">Protein structure: primary to tertiary</title><desc id="desc">Amino-acid sequence is primary structure; hydrogen-bonded helix and sheet are secondary; tertiary folding includes side-chain interactions such as an S–S link between cysteines.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#172b3c"/></marker><marker id="tealArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#288a83"/></marker></defs><style>text{font-family:Arial,"Liberation Sans",sans-serif}</style><rect width="100%" height="100%" fill="#fbfcfa"/><text x="44" y="58" font-size="30" fill="#172b3c" font-weight="700">Protein structure: primary to tertiary</text><rect x="28" y="90" width="712" height="940" rx="24" fill="#f2f7f6"/><rect x="55" y="120" width="658" height="220" rx="20" fill="white" stroke="#c9d8dc" stroke-width="2"/><rect x="55" y="120" width="658" height="10" rx="5" fill="#288a83"/><text x="77" y="165" font-size="25" fill="#172b3c" font-weight="700">1  Primary</text><text x="77" y="202" font-size="21" fill="#203545" font-weight="400">Amino-acid order along a covalent peptide</text><text x="77" y="228.25" font-size="21" fill="#203545" font-weight="400">backbone.</text><text x="80" y="285" font-size="26" fill="#172b3c" font-weight="700">N → Gly – Ala – Ser – Cys → C</text><rect x="55" y="380" width="658" height="230" rx="20" fill="white" stroke="#c9d8dc" stroke-width="2"/><rect x="55" y="380" width="658" height="10" rx="5" fill="#e5b94c"/><text x="77" y="425" font-size="25" fill="#172b3c" font-weight="700">2  Secondary</text><text x="77" y="462" font-size="21" fill="#203545" font-weight="400">A helix coil or side-by-side sheet; peptide</text><text x="77" y="488.25" font-size="21" fill="#203545" font-weight="400">C=O···H–N hydrogen bonds stabilize both.</text><path d="M95 530 C120 450 155 450 180 530 C205 600 240 600 265 530 C290 450 325 450 350 530" fill="none" stroke="#288a83" stroke-width="7"/><line x1="405" y1="505" x2="635" y2="505" stroke="#c45637" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/><rect x="55" y="650" width="658" height="260" rx="20" fill="white" stroke="#c9d8dc" stroke-width="2"/><rect x="55" y="650" width="658" height="10" rx="5" fill="#c45637"/><text x="77" y="695" font-size="25" fill="#172b3c" font-weight="700">3  Tertiary</text><text x="77" y="732" font-size="21" fill="#203545" font-weight="400">Whole-chain 3D fold; side-chain</text><text x="77" y="758.25" font-size="21" fill="#203545" font-weight="400">interactions include a covalent disulfide</text><text x="77" y="784.5" font-size="21" fill="#203545" font-weight="400">link between cysteines.</text><path d="M100 795 Q180 700 270 800 T450 795 T650 800" fill="none" stroke="#172b3c" stroke-width="8"/><line x1="260" y1="765" x2="460" y2="825" stroke="#c45637" stroke-width="4"  marker-end="url(#arrow)"/><text x="350" y="850" font-size="24" fill="#c45637" font-weight="700">S–S</text><line x1="40" y1="1066" x2="728" y2="1066" stroke="#d9e3e4"/><text x="44" y="1098" font-size="16" fill="#607783" font-weight="600">MARLBRIDGE  •  Schematic; not to scale</text></svg>
