<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1170" viewBox="0 0 1800 2340" role="img" aria-labelledby="title desc"><title id="title">Electrolysis of molten lead(II) bromide (OxfordAQA International GCSE Chemistry)</title><desc id="desc">A crucible of molten lead(II) bromide with two graphite electrodes joined to a power supply. Pb2+ ions move to the cathode (negative), where lead forms as a silvery molten metal; Br- ions move to the anode (positive), where bromine forms as red-brown fumes. Gold arrows show electrons flowing from the supply to the cathode and back from the anode. Two boxes give the half-equations, Pb2+ + 2e- → Pb (reduction) and 2Br- → Br2 + 2e- (oxidation). No tier labels.</desc><rect width="1800" height="2340" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="113" font-size="66" font-weight="700" fill="#1E2B47" text-anchor="middle">Electrolysis of molten lead(II) bromide</text>
<text x="900" y="187" font-size="44" fill="#4B5B72" text-anchor="middle">Ions move; electrons carry charge in the wires</text>
