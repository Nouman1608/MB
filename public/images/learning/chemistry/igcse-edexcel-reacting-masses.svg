<svg xmlns="http://www.w3.org/2000/svg" width="900" height="990" viewBox="0 0 1800 1980" role="img" aria-labelledby="title desc"><title id="title">Worked example: heating calcium carbonate (Edexcel International GCSE Chemistry)</title><desc id="desc">Steps 1 and 2, moles from masses and reacting amounts, are 4CH1 statements 1.28 and 1.29, on both papers. Step 3, gas volume from the molar volume, is 1.35C and is marked Paper 2 only. Worked example: heating 50 g of calcium carbonate, CaCO3 → CaO + CO2. 1 Mass to moles: 50 g ÷ 100 = 0.5 mol CaCO3, shown as half of a 1 mol bar. 2 Use the equation ratio: 1 : 1, so 0.5 mol CaCO3 gives 0.5 mol CO2. 3 Moles to gas volume: 0.5 × 24 = 12 dm3 of CO2.</desc><rect width="1800" height="1980" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="92" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle" xml:space="preserve"><tspan>Worked example: heating CaCO</tspan><tspan dy="17.9" font-size="43.5">3</tspan></text>
<text x="900" y="174" font-size="38" fill="#4B5B72" text-anchor="middle" xml:space="preserve"><tspan>CaCO</tspan><tspan dy="10.6" font-size="25.8">3</tspan><tspan dy="-10.6"> → CaO + CO</tspan><tspan dy="10.6" font-size="25.8">2</tspan><tspan dy="-10.6"> from 50 g of CaCO</tspan><tspan dy="10.6" font-size="25.8">3</tspan></text>
