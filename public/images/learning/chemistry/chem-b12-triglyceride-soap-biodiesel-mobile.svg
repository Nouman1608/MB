<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1120" viewBox="0 0 768 1120" role="img" aria-labelledby="title desc"><title id="title">One triglyceride makes soap or biodiesel</title><desc id="desc">A triglyceride has three ester links. Alkaline hydrolysis makes three carboxylate soap molecules plus glycerol; methanol transesterification makes three methyl esters plus glycerol.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#172b3c"/></marker><marker id="tealArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#288a83"/></marker></defs><style>text{font-family:Arial,"Liberation Sans",sans-serif}</style><rect width="100%" height="100%" fill="#fbfcfa"/><text x="44" y="58" font-size="30" fill="#172b3c" font-weight="700">One triglyceride makes soap or biodiesel</text><rect x="28" y="90" width="712" height="940" rx="24" fill="#f2f7f6"/><rect x="55" y="120" width="658" height="180" rx="20" fill="white" stroke="#c9d8dc" stroke-width="2"/><rect x="55" y="120" width="658" height="10" rx="5" fill="#288a83"/><text x="77" y="165" font-size="25" fill="#172b3c" font-weight="700">Starting fat</text><text x="77" y="202" font-size="21" fill="#203545" font-weight="400">One glycerol backbone, three fatty-acid</text><text x="77" y="228.25" font-size="21" fill="#203545" font-weight="400">ester links.</text><text x="110" y="375" font-size="27" fill="#172b3c" font-weight="700">CH₂–O–C(O)–R</text><text x="110" y="425" font-size="27" fill="#172b3c" font-weight="700">CH –O–C(O)–R</text><text x="110" y="475" font-size="27" fill="#172b3c" font-weight="700">CH₂–O–C(O)–R</text><rect x="55" y="540" width="310" height="250" rx="20" fill="white" stroke="#c9d8dc" stroke-width="2"/><rect x="55" y="540" width="310" height="10" rx="5" fill="#e5b94c"/><text x="77" y="585" font-size="25" fill="#172b3c" font-weight="700">NaOH route</text><text x="77" y="622" font-size="21" fill="#203545" font-weight="400">1 fat + 3 NaOH → 3</text><text x="77" y="648.25" font-size="21" fill="#203545" font-weight="400">RCOO⁻Na⁺ + glycerol</text><text x="77" y="674.5" font-size="21" fill="#203545" font-weight="400">(soap)</text><rect x="400" y="540" width="313" height="250" rx="20" fill="white" stroke="#c9d8dc" stroke-width="2"/><rect x="400" y="540" width="313" height="10" rx="5" fill="#c45637"/><text x="422" y="585" font-size="25" fill="#172b3c" font-weight="700">Methanol route</text><text x="422" y="622" font-size="21" fill="#203545" font-weight="400">1 fat + 3 CH₃OH → 3</text><text x="422" y="648.25" font-size="21" fill="#203545" font-weight="400">RCOOCH₃ + glycerol</text><text x="422" y="674.5" font-size="21" fill="#203545" font-weight="400">(biodiesel)</text><text x="75" y="875" font-size="24" fill="#172b3c" font-weight="700">Three ester links produce three acid-chain products</text><line x1="40" y1="1066" x2="728" y2="1066" stroke="#d9e3e4"/><text x="44" y="1098" font-size="16" fill="#607783" font-weight="600">MARLBRIDGE  •  Schematic; not to scale</text></svg>
