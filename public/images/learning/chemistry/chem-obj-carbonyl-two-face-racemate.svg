<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="title desc"><title id="title">Carbonyl addition from either face can form enantiomers</title><desc id="desc">A-level Chemistry • planar carbonyl and two-face attack</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#C44949"/></marker></defs><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#10233F">Carbonyl addition from either face can form enantiomers</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">A-level Chemistry • planar carbonyl and two-face attack</text><rect x="52" y="132" width="450" height="606" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="538" y="132" width="450" height="606" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="1024" y="132" width="452" height="606" rx="16" fill="#F4F1E8" stroke="#F4F1E8" stroke-width="2"/><text x="277" y="182" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">Planar carbonyl</text><text x="763" y="182" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#315F86">Attack from either face</text><text x="1250" y="182" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#725C8E">Products if C* is chiral</text><text x="277" y="320" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#20314B">R</text><text x="277" y="414" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#10233F">C</text><text x="277" y="510" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#20314B">R′</text><text x="174" y="414" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#C44949">O</text><line x1="194" y1="404" x2="250" y2="404" stroke="#20314B" stroke-width="4"/><line x1="300" y1="404" x2="356" y2="404" stroke="#20314B" stroke-width="4"/><line x1="277" y1="436" x2="277" y2="480" stroke="#20314B" stroke-width="4"/><text x="277" y="580" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6D80">Trigonal planar carbon</text><text x="762" y="310" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#315F86">top face</text><text x="762" y="516" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#725C8E">bottom face</text><path d="M700 270 Q760 300 810 360" fill="none" stroke="#315F86" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M825 555 Q768 512 710 455" fill="none" stroke="#725C8E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="762" y="420" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#20314B">C=O π bond opens</text><rect x="1060" y="244" width="380" height="142" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="1250" y="282" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#315F86">tetrahedral product A</text><text x="1250" y="324" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">C bonded to four groups</text><rect x="1060" y="420" width="380" height="142" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="1250" y="458" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#725C8E">mirror image B</text><text x="1250" y="500" text-anchor="middle" font-family="Arial,sans-serif" font-