<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="870" viewBox="0 0 1528 870" role="img" aria-labelledby="title desc"><title id="title">Stereospecific enzyme binding and inhibition</title><desc id="desc">An active site has fixed three-dimensional binding groups. One substrate enantiomer can align all three; its mirror image cannot. An inhibitor can occupy the active site and block substrate binding.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#172b3c"/></marker><marker id="tealArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#288a83"/></marker></defs><style>text{font-family:Arial,"Liberation Sans",sans-serif}</style><rect width="100%" height="100%" fill="#fbfcfa"/><text x="44" y="58" font-size="34" fill="#172b3c" font-weight="700">Stereospecific enzyme binding and inhibition</text><rect x="40" y="95" width="1448" height="690" rx="26" fill="#f2f7f6"/><rect x="70" y="140" width="420" height="520" rx="20" fill="white" stroke="#c9d8dc" stroke-width="2"/><rect x="70" y="140" width="420" height="10" rx="5" fill="#288a83"/><text x="92" y="185" font-size="25" fill="#172b3c" font-weight="700">Matching enantiomer</text><text x="92" y="222" font-size="21" fill="#203545" font-weight="400">Three groups align with</text><text x="92" y="248.25" font-size="21" fill="#203545" font-weight="400">three complementary</text><text x="92" y="274.5" font-size="21" fill="#203545" font-weight="400">active-site contacts.</text><text x="92" y="300.75" font-size="21" fill="#203545" font-weight="400">Binding is possible.</text><path d="M150 420 Q270 300 410 420 L410 485 Q270 365 150 485Z" fill="#dcefe9" stroke="#288a83" stroke-width="4"/><circle cx="215" cy="380" r="14" fill="#c45637"/><circle cx="280" cy="350" r="14" fill="#e5b94c"/><circle cx="345" cy="385" r="14" fill="#172b3c"/><rect x="555" y="140" width="420" height="520" rx="20" fill="white" stroke="#c9d8dc" stroke-width="2"/><rect x="555" y="140" width="420" height="10" rx="5" fill="#c45637"/><text x="577" y="185" font-size="25" fill="#172b3c" font-weight="700">Mirror image</text><text x="577" y="222" font-size="21" fill="#203545" font-weight="400">The same groups point the</text><text x="577" y="248.25" font-size="21" fill="#203545" font-weight="400">wrong way in space; all</text><text x="577" y="274.5" font-size="21" fill="#203545" font-weight="400">three contacts cannot align</text><text x="577" y="300.75" font-size="21" fill="#203545" font-weight="400">together.</text><path d="M635 420 Q755 300 895 420 L895 485 Q755 365 635 485Z" fill="#dcefe9" stroke="#288a83" stroke-width="4"/><circle cx="700" cy="340" r="14" fill="#c45637"/><circle cx="765" cy="410" r="14" fill="#e5b94c"/><circle cx="830" cy="340" r="14" fill="#172b3c"/><line x1="700" y1="300" x2="730" y2="340" stroke="#c45637" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow)"/><rect x="1040" y="140" width="420" height="520" rx="20" fill="white" stroke="#c9d8dc" stroke-width="2"/><rect x="1040" y="140" width="420" height="10" rx="5" fill="#e5b94c"/><text x="1062" y="185" font-size="25" fill="#172b3c" font-weight="700">Inhibitor occupies site</text><text x="1062" y="222" font-size="21" fill="#203545" font-weight="400">The inhibitor fits the</text><text x="1062" y="248.25" font-size="21" fill="#203545" font-weight="400">active site, leaving the</text><text x="1062" y="274.5" font-size="21" fill="#203545" font-weight="400">substrate unable to bind</text><text x="1062" y="300.75" font-size="21" fill="#203545" font-weight="400">there.</text><path d="M1120 420 Q1240 300 1380 420 L1380 485 Q1240 365 1120 485Z" fill="#dcefe9" stroke="#288a83" stroke-width="4"/><rect x="1225" y="350" width="85" height="54" rx="20" fill="#e5b94c" stroke="#172b3c" stroke-width="3"/><text x="1230" y="340" font-size="20" fill="#c45637" font-weight="700">blocks</text><line x1="40" y1="816" x2="1488" y2="816" stroke="#d9e3e4"/><text x="44" y="848" font-size="16" fill="#607783" font-weight="600">MARLBRIDGE  •  Schematic; not to scale</text></svg>
