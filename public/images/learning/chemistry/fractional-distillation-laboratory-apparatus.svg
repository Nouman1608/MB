<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="871" viewBox="0 0 1528 871" role="img" aria-labelledby="title desc"><title id="title">Fractional distillation: add a fractionating column</title><desc id="desc">A packed fractionating column between flask and condenser allows repeated vaporisation and condensation. The vapour becomes richer in the more volatile component, and fractions are collected while head temperature is monitored.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#1c2d4b"/></marker><marker id="red" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#b75e53"/></marker><marker id="blue" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#357ea2"/></marker></defs><rect width="100%" height="100%" fill="#f5f8f7"/><g font-family="Arial, sans-serif"><text x="24" y="58" font-size="38" font-weight="700" text-anchor="start" fill="#1c2d4b">Fractional distillation: add a fractionating column</text><text x="24" y="104" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Laboratory separation of miscible liquids • schematic apparatus</text><g transform="translate(24,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Separate two miscible volatile liquids</text><path d="M120,300 V335 C50,370 85,450 150,450 C215,450 250,370 180,335 V300" fill="white" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M95,405 Q150,395 205,405 Q205,451 150,449 Q95,451 95,405 Z" fill="#e2efec" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="125" y="155" width="50" height="145" rx="0" fill="white" stroke="#1c2d4b" stroke-width="2"/><circle cx="137" cy="180" r="9" fill="white" stroke="#cad7d5" stroke-width="1"/><circle cx="161" cy="202" r="9" fill="white" stroke="#cad7d5" stroke-width="1"/><circle cx="137" cy="225" r="9" fill="white" stroke="#cad7d5" stroke-width="1"/><circle cx="161" cy="247" r="9" fill="white" stroke="#cad7d5" stroke-width="1"/><circle cx="137" cy="270" r="9" fill="white" stroke="#cad7d5" stroke-width="1"/><path d="M125,155 V120 H230 L550,280 V315 M175,155 V145 H222 L570,300 V325" fill="none" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M282,135 L535,265 L515,307 L262,177 Z" fill="#e2efec" stroke="#1c2d4b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M270,159 L560,292 M282,135 l15,-30 M515,307 l-7,35" fill="none" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M141,75 V140" fill="none" stroke="#b75e53" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="141" cy="145" r="7" fill="#b75e53" stroke="#1c2d4b" stroke-width="2"/><path d="M540,330 V430 H650 V330" fill="white" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M545,400 H645 V425 H545 Z" fill="#e2efec" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M405,100 L405,200" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="365" y="90" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Condenser</text><path d="M290.984375,72.65 L297,105" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="190" y="80" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">Water out</text><path d="M125,260 L125,240" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="250" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">Column</text><path d="M462.984375,387.65 L508,342" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="375" y="395" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">Water in</text><text x="200" y="470" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">Gentle heat; supports omitted</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">The fractionating column sits between the heated mixture and</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">the condenser. The thermometer bulb is at the vapour exit.</text><text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Cooling water enters the lower condenser port; the receiver</text><text x="35" y="593" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">remains open.</text></g><g transform="translate(784,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Repeated vaporisation and condensation</text><rect x="55" y="105" width="610" height="100" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2"/><text x="360.0" y="137" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">Column: repeated equilibrium stages</text><text x="360.0" y="170" font-size="20" font-weight="400" text-anchor="middle" fill="#1c2d4b">Rising vapour becomes richer in the more volatile liquid</text><path d="M360,220 L360,270" fill="none" stroke="#1c2d4b" stroke-width="4" marker-end="url(#arr)"/><rect x="55" y="285" width="610" height="100" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2"/><text x="360.0" y="317" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">Condenser: vapour becomes collected liquid</text><text x="360.0" y="350" font-size="20" font-weight="400" text-anchor="middle" fill="#1c2d4b">Collect fractions as the head temperature changes</text><text x="360" y="460" font-size="26" font-weight="700" text-anchor="middle" fill="#1c2d4b">A fraction need not be a pure substance</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">A fractionating column improves separation compared with</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">simple distillation. It cannot guarantee complete purity; for</text><text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">example ethanol and water form an azeotrope, which limits</text><text x="35" y="593" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">ordinary distillation.</text></g><text x="24" y="849" font-size="19" font-weight="400" text-anchor="start" fill="#1c2d4b">MARLBRIDGE  •  Schematic; structures and particles are not to scale.</text></g><image href="data:image/svg+xml;base64," x="1310" y="816" width="178" height="43" preserveAspectRatio="xMidYMid meet"/></svg>
