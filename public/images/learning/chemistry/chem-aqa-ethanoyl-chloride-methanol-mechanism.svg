<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1528 940" role="img" aria-labelledby="title desc">
  <title id="title">Ethanoyl chloride and methanol: nucleophilic addition–elimination</title>
  <desc id="desc">Three steps show methanol oxygen attacking the carbonyl, a tetrahedral O-minus and O-plus intermediate, chloride leaving as the carbonyl reforms, and deprotonation to methyl ethanoate and hydrogen chloride.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#147d82"/></marker>
    <marker id="thin-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#334155"/></marker>
    <style>
      text{font-family:Arial,"Liberation Sans",sans-serif;fill:#172b4d}
      .title{font-size:34px;font-weight:700}.subtitle{font-size:19px;fill:#475569}
      .card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.head{font-size:23px;font-weight:700;fill:#0f766e}
      .body{font-size:19px}.chem{font-size:25px;font-weight:600}.small{font-size:16px;fill:#475569}
      .tag{font-size:15px;font-weight:700;fill:#0f766e;letter-spacing:1px}
    </style>
  </defs>
  <rect width="1528" height="940" rx="24" fill="#f4f8fb"/>
  <text class="title" x="54" y="62">Ethanoyl chloride + methanol</text>
  <text class="subtitle" x="55" y="96">Nucleophilic addition–elimination, followed by loss of H⁺</text>
  <text class="tag" x="1472" y="60" text-anchor="end">AQA A-LEVEL CHEMISTRY</text>

  <rect class="card" x="48" y="132" width="456" height="604" rx="18"/>
  <rect class="card" x="536" y="132" width="456" height="604" rx="18"/>
  <rect class="card" x="1024" y="132" width="456" height="604" rx="18"/>

  <circle cx="82" cy="175" r="22" fill="#d9f1ed"/><text x="82" y="183" text-anchor="middle" font-size="23" font-weight="700">1</text>
  <text class="head" x="118" y="183">Addition</text>
  <text class="body" x="74" y="231">Methanol oxygen attacks the carbonyl carbon.</text>
  <text class="small" x="74" y="264">The C=O π pair moves onto oxygen.</text>
  <text class="chem" x="276" y="334" text-anchor="middle">CH₃–C(=O)–Cl</text>
  <text class="small" x="276" y="367" text-anchor="middle">+</text>
  <text class="chem" x="276" y="405" text-anchor="middle">H–O:–CH₃</text>
  <path d="M276 390 C245 374 246 350 276 342" fill="none" stroke="#147d82" stroke-width="4" marker-end="url(#arrow)"/>
  <text class="small" x="397" y="365" text-anchor="middle">O lone pair → C</text>
  <path d="M298 321 C307 300 320 300 329 321" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#thin-arrow)"/>
  <text class="small" x="404" y="326" text-anchor="middle">C=O π pair → O</text>
  <text class="small" x="276" y="458" text-anchor="middle">Tetrahedral intermediate</text>
  <text class="chem" x="276" y="506" text-anchor="middle">CH₃–C(O⁻)(Cl)(O⁺H–CH₃)</text>
  <text class="body" x="276" y="565" text-anchor="middle">O⁻ and O⁺ charges balance.</text>
  <text class="small" x="276" y="603" text-anchor="middle">The methanol oxygen is bonded to H, CH₃ and C.</text>
  <rect x="75" y="653" width="402" height="48" rx="10" fill="#e8f4f2"/>
  <text class="small" x="276" y="684" text-anchor="middle">Four groups surround the carbonyl carbon.</text>

  <circle cx="570" cy="175" r="22" fill="#d9f1ed"/><text x="570" y="183" text-anchor="middle" font-size="23" font-weight="700">2</text>
  <text class="head" x="606" y="183">Elimination</text>
  <text class="body" x="562" y="231">The carbonyl reforms and chloride leaves.</text>
  <text class="small" x="562" y="270">O⁻ lone pair → C to reform C=O</text>
  <text class="small" x="562" y="300">C–Cl bond pair → Cl⁻</text>
  <text class="chem" x="764" y="388" text-anchor="middle">CH₃–C(O⁻)(Cl)(O⁺H–CH₃)</text>
  <path d="M765 418 L765 477" fill="none" stroke="#147d82" stroke-width="4" marker-end="url(#arrow)"/>
  <text class="small" x="788" y="455">O⁻ → C=O; C–Cl → Cl⁻</text>
  <text class="chem" x="764" y="531" text-anchor="middle">CH₃–C(=O)–O⁺H–CH₃ + Cl⁻</text>
  <text class="body" x="764" y="589" text-anchor="middle">Protonated ester + chloride ion</text>
  <rect x="563" y="653" width="402" height="48" rx="10" fill="#e8f4f2"/>
  <text class="small" x="764" y="684" text-anchor="middle">The carbonyl returns before deprotonation.</text>

  <circle cx="1058" cy="175" r="22" fill="#d9f1ed"/><text x="1058" y="183" text-anchor="middle" font-size="23" font-weight="700">3</text>
  <text class="head" x="1094" y="183">Deprotonation</text>
  <text class="body" x="1050" y="231">Chloride removes H⁺ from the ester oxygen.</text>
  <text class="small" x="1050" y="270">O–H bond pair returns to oxygen.</text>
  <text class="chem" x="1252" y="365" text-anchor="middle">CH₃–C(=O)–O⁺H–CH₃</text>
  <text class="chem" x="1252" y="405" text-anchor="middle">+ Cl⁻</text>
  <path d="M1260 433 C1315 470 1314 498 1250 512" fill="none" stroke="#147d82" stroke-width="4" marker-end="url(#arrow)"/>
  <text class="small" x="1358" y="480" text-anchor="middle">Cl⁻ takes H⁺</text>
  <text class="chem" x="1252" y="560" text-anchor="middle">CH₃–C(=O)–O–CH₃</text>
  <text class="chem" x="1252" y="601" text-anchor="middle">+ HCl</text>
  <rect x="1051" y="653" width="402" height="48" rx="10" fill="#e8f4f2"/>
  <text class="small" x="1252" y="684" text-anchor="middle">Product: methyl ethanoate</text>

  <rect x="48" y="764" width="1432" height="98" rx="16" fill="#17324f"/>
  <text x="764" y="806" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">Overall: CH₃COCl + CH₃OH → CH₃COOCH₃ + HCl</text>
  <text x="764" y="838" text-anchor="middle" font-size="17" fill="#d8e6ef">Arrow tails begin at an electron pair or bond; arrowheads show where that pair moves.</text>
  <text x="1480" y="914" text-anchor="end" font-size="15" font-weight="700" fill="#47647b">MARLBRIDGE • STUDY RESOURCES</text>
</svg>
