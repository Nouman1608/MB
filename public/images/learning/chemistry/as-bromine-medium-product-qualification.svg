<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="871" viewBox="0 0 1528 871" role="img" aria-labelledby="title desc"><title id="title">Decolourisation does not fix the product independently of solvent</title><desc id="desc">Balanced dibromide and bromohydrin net equations distinguish a non-nucleophilic medium from water capture, preserving the AS aqueous-bromine observation while qualifying source product claims.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#1c2d4b"/></marker><marker id="red" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#b75e53"/></marker><marker id="blue" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#357ea2"/></marker></defs><rect width="100%" height="100%" fill="#f5f8f7"/><g font-family="Arial, sans-serif"><text x="24" y="58" font-size="38" font-weight="700" text-anchor="start" fill="#1c2d4b">Decolourisation does not fix the product independently of solvent</text><text x="24" y="104" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Bromide capture versus water capture of bromonium</text><g transform="translate(24,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Non-nucleophilic medium: Br⁻ capture</text><text x="360" y="130" font-size="27" font-weight="700" text-anchor="middle" fill="#1c2d4b">CH₂=CH₂ + Br₂ → BrCH₂CH₂Br</text><text x="360" y="200" font-size="22" font-weight="700" text-anchor="middle" fill="#1c2d4b">bromonium intermediate; bromide opens bridge</text><path d="M160,235 L560,235" fill="none" stroke="#1c2d4b" stroke-width="4" marker-end="url(#arr)"/><text x="360" y="335" font-size="28" font-weight="700" text-anchor="middle" fill="#1c2d4b">1,2-dibromoethane</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">This is the medium assumed in the complete mechanism</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">figure. It isolates the dibromide addition pathway without</text><text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">claiming that all bromine-containing solutions have the same</text><text x="35" y="593" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">product distribution.</text></g><g transform="translate(784,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Water can capture the intermediate too</text><text x="360" y="130" font-size="27" font-weight="700" text-anchor="middle" fill="#1c2d4b">CH₂=CH₂ + Br₂ + H₂O → HOCH₂CH₂Br + HBr</text><text x="360" y="200" font-size="22" font-weight="700" text-anchor="middle" fill="#1c2d4b">water capture, then proton loss</text><path d="M160,235 L560,235" fill="none" stroke="#1c2d4b" stroke-width="4" marker-end="url(#arr)"/><text x="360" y="335" font-size="28" font-weight="700" text-anchor="middle" fill="#1c2d4b">2-bromoethanol: a bromohydrin</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">This balanced equation illustrates a possible aqueous pathway,</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">not a claim of a pure single product in every bromine-water</text><text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">test. Bromine decolourisation is the AS observation;</text><text x="35" y="593" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">solvent-dependent product detail is explanatory context.</text></g><text x="24" y="849" font-size="19" font-weight="400" text-anchor="start" fill="#1c2d4b">MARLBRIDGE  •  Schematic; structures and particles are not to scale.</text></g></svg>
