<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="title desc">
<title id="title">Disappearing-cross method: control the optical path</title><desc id="desc">A conical flask with fixed solution depth sits above the same black cross. A vertical line of sight from above passes through the solution to the cross. The diagram lists fixed volume, flask, cross, view and lighting; reciprocal endpoint time is a relative-rate proxy for a small repeatable conversion, not an exact instantaneous rate.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#18324b}.title{font-size:34px;font-weight:700}.head{font-size:24px;font-weight:700}.label{font-size:20px}.small{font-size:17px}.outline{stroke:#23445c;stroke-width:4;fill:none}</style>
<rect width="1528" height="940" fill="#f3f6f6"/><text x="52" y="58" class="title">Disappearing cross: keep the viewing path fixed</text><text x="54" y="94" class="small" fill="#5b6d80">AQA Required practical 3 • schematic side view and fair-comparison checklist</text>
<rect x="52" y="130" width="750" height="660" rx="16" fill="#fff" stroke="#d3dce2" stroke-width="2"/><rect x="826" y="130" width="650" height="660" rx="16" fill="#fff" stroke="#d3dce2" stroke-width="2"/><text x="82" y="174" class="head">Same flask, cross and view</text><text x="1150" y="174" class="head" text-anchor="middle">Control the endpoint comparison</text>
<!-- eye and fixed vertical view path -->
<path d="M280 235 Q320 197 360 235 Q320 273 280 235Z" fill="#e8f1f4" stroke="#397fa6" stroke-width="3"/><circle cx="320" cy="235" r="11" fill="#397fa6"/><text x="385" y="242" class="small">view straight down</text>
<path d="M320 258V704" stroke="#c44949" stroke-width="3" stroke-dasharray="10 8"/><path d="M310 690L320 708L330 690" fill="#c44949"/><text x="410" y="428" class="small" fill="#a43f3f">same optical path</text>
<!-- conical flask, contents and calibrated depth -->
<path d="M270 298V380L171 615Q151 662 204 668H436Q489 662 469 615L370 380V298" class="outline"/><path d="M270 298H370M270 316H370" class="outline"/>
<path d="M214 513H426L469 615Q489 662 436 668H204Q151 662 171 615Z" fill="#e5c55d" opacity=".42" stroke="none"/><path d="M214 513H426" stroke="#c49a24" stroke-width="3"/><text x="72" y="500" class="small">solution surface</text><text x="320" y="570" class="small" text-anchor="middle">cloudiness increases</text>
<path d="M525 515V650" stroke="#397fa6" stroke-width="3"/><path d="M515 525L525 513L535 525M515 640L525 652L535 640" fill="none" stroke="#397fa6" stroke-width="3"/><text x="545" y="585" class="small">fixed liquid</text><text x="545" y="609" class="small">depth, h</text>
<path d="M275 715H365M320 695V735" stroke="#101820" stroke-width="8"/><text x="320" y="760" class="small" text-anchor="middle">same cross on paper under the flask</text>
<text x="870" y="242" class="label">Hold fixed between runs</text><circle cx="880" cy="285" r="6" fill="#168c8c"/><text x="902" y="292" class="label">same flask and solution volume</text><circle cx="880" cy="340" r="6" fill="#168c8c"/><text x="902" y="347" class="label">same cross size and position</text><circle cx="880" cy="395" r="6" fill="#168c8c"/><text x="902" y="402" class="label">same view direction and lighting</text><circle cx="880" cy="450" r="6" fill="#168c8c"/><text x="902" y="457" class="label">same temperature and endpoint rule</text>
<rect x="870" y="510" width="560" height="180" rx="12" fill="#fff6de" stroke="#c9a227" stroke-width="2"/><text x="900" y="552" class="head">Use 1/t as a relative-rate proxy</text><text x="900" y="590" class="small">The cross disappearing is a finite obscuration threshold.</text><text x="900" y="622" class="small">It approximates initial rate only for a small, repeatable</text><text x="900" y="654" class="small">conversion when the rate changes little before the endpoint.</text>
<text x="764" y="816" class="small" text-anchor="middle">A constant path length and viewing threshold make runs comparable; they do not turn 1/t into an exact instantaneous rate.</text><text x="764" y="842" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".06">MARLBRIDGE STUDY RESOURCES</text><path d="M52 852H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="888" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1310" y="858" width="166" height="40" preserveAspectRatio="xMidYMid meet"/></svg>
