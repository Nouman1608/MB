<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1528 940" role="img" aria-labelledby="title desc">
  <title id="title">Vacuum filtration of recrystallised crystals</title>
  <desc id="desc">A Büchner funnel lined with wetted filter paper sits in a rubber adapter on a side-arm flask. Crystals stay on the paper while the liquid filtrate is pulled into the flask and vacuum tubing connects the side arm to a pump.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#147d82"/></marker>
    <style>
      text{font-family:Arial,"Liberation Sans",sans-serif;fill:#172b4d}
      .title{font-size:34px;font-weight:700}.subtitle{font-size:19px;fill:#475569}
      .label{font-size:18px;font-weight:700}.small{font-size:16px;fill:#475569}
      .line{stroke:#334155;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .leader{stroke:#64748b;stroke-width:2;fill:none}.teal{fill:#147d82}
    </style>
  </defs>
  <rect width="1528" height="940" rx="24" fill="#f4f8fb"/>
  <text class="title" x="54" y="62">Collecting recrystallised crystals</text>
  <text class="subtitle" x="55" y="96">Vacuum filtration draws the liquid through quickly and leaves a solid cake on the paper.</text>
  <text x="1472" y="60" text-anchor="end" font-size="15" font-weight="700" fill="#0f766e">AQA REQUIRED PRACTICAL 10</text>

  <rect x="40" y="132" width="850" height="670" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Funnel body and filter bed -->
  <rect x="310" y="205" width="360" height="170" fill="#e9f2f5" stroke="#334155" stroke-width="4"/>
  <ellipse cx="490" cy="205" rx="180" ry="23" fill="#fff" stroke="#334155" stroke-width="4"/>
  <path d="M315 354 Q490 372 665 354" fill="none" stroke="#147d82" stroke-width="8"/>
  <path d="M321 344 Q490 360 659 344" fill="none" stroke="#475569" stroke-width="4" stroke-dasharray="5 12"/>
  <path d="M350 225 L630 225 L628 333 Q490 352 352 333 Z" fill="#edf8fb" stroke="#147d82" stroke-width="2"/>
  <path d="M380 316 Q490 331 600 316 L598 340 Q490 356 382 340 Z" fill="#d7a64a" stroke="#9a6611" stroke-width="2"/>
  <circle cx="421" cy="326" r="5" fill="#fff2c6"/><circle cx="457" cy="334" r="5" fill="#fff2c6"/><circle cx="496" cy="331" r="5" fill="#fff2c6"/><circle cx="535" cy="329" r="5" fill="#fff2c6"/><circle cx="569" cy="325" r="5" fill="#fff2c6"/>
  <text class="small" x="490" y="275" text-anchor="middle">cooled crystal suspension</text>
  <path d="M490 357 L490 393" stroke="#147d82" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M421 360 L442 496 L538 496 L559 360 Z" fill="#e9f2f5" stroke="#334155" stroke-width="4" stroke-linejoin="round"/>

  <!-- Adapter and flask -->
  <path d="M414 474 Q490 498 566 474 L552 515 Q490 532 428 515 Z" fill="#c9d7e2" stroke="#334155" stroke-width="4"/>
  <path d="M431 499 L431 557 C431 575 397 597 376 640 C352 690 374 745 415 761 L565 761 C606 745 628 690 604 640 C583 597 549 575 549 557 L549 499" fill="#f8fbfd" stroke="#334155" stroke-width="4" stroke-linejoin="round"/>
  <path d="M383 687 Q490 671 598 687 L598 724 Q490 770 382 724 Z" fill="#bfe7e5" opacity=".9"/>
  <path d="M549 605 L676 605 L676 629 L747 629" fill="none" stroke="#334155" stroke-width="18" stroke-linejoin="round"/>
  <path d="M549 605 L676 605 L676 629 L747 629" fill="none" stroke="#9ddad4" stroke-width="9" stroke-linejoin="round"/>
  <rect x="744" y="590" width="96" height="80" rx="12" fill="#e5eef3" stroke="#334155" stroke-width="3"/>
  <text class="small" x="792" y="621" text-anchor="middle">vacuum</text>
  <text class="small" x="792" y="644" text-anchor="middle">source</text>

  <!-- Labels -->
  <text class="label" x="67" y="229">Büchner funnel</text>
  <path class="leader" d="M227 223 L295 223"/>
  <text class="label" x="67" y="292">crystals retained</text>
  <text class="small" x="67" y="316">on filter paper</text>
  <path class="leader" d="M245 300 L391 340"/>
  <text class="label" x="680" y="242">wetted filter paper</text>
  <path class="leader" d="M677 251 L623 352"/>
  <text class="label" x="670" y="401">perforated plate</text>
  <path class="leader" d="M669 409 L571 356"/>
  <text class="label" x="77" y="520">rubber adapter</text>
  <path class="leader" d="M220 514 L418 490"/>
  <text class="label" x="77" y="696">filtrate collected</text>
  <text class="small" x="77" y="720">in the flask</text>
  <path class="leader" d="M224 700 L377 700"/>
  <text class="label" x="656" y="563">side-arm flask</text>
  <path class="leader" d="M651 570 L579 607"/>
  <text class="small" x="666" y="713">vacuum tubing</text>
  <path class="leader" d="M661 705 L632 629"/>

  <rect x="918" y="132" width="570" height="670" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="957" y="183" font-size="25" font-weight="700" fill="#0f766e">Safe, effective sequence</text>
  <circle cx="974" cy="239" r="18" fill="#d9f1ed"/><text x="974" y="245" text-anchor="middle" font-size="18" font-weight="700">1</text>
  <text class="label" x="1008" y="237">Seat the paper</text>
  <text class="small" x="1008" y="264">Fit paper flat over the holes and wet it</text>
  <text class="small" x="1008" y="286">with a little of the cold solvent.</text>
  <circle cx="974" cy="342" r="18" fill="#d9f1ed"/><text x="974" y="348" text-anchor="middle" font-size="18" font-weight="700">2</text>
  <text class="label" x="1008" y="340">Start suction, then pour</text>
  <text class="small" x="1008" y="367">Check the funnel seals to the flask.</text>
  <text class="small" x="1008" y="389">Transfer the cooled crystal mixture.</text>
  <circle cx="974" cy="445" r="18" fill="#d9f1ed"/><text x="974" y="451" text-anchor="middle" font-size="18" font-weight="700">3</text>
  <text class="label" x="1008" y="443">Wash the crystal cake</text>
  <text class="small" x="1008" y="470">Rinse with a small amount of cold solvent</text>
  <text class="small" x="1008" y="492">to remove solution without dissolving</text>
  <text class="small" x="1008" y="514">much product.</text>
  <circle cx="974" cy="569" r="18" fill="#d9f1ed"/><text x="974" y="575" text-anchor="middle" font-size="18" font-weight="700">4</text>
  <text class="label" x="1008" y="567">Draw air through briefly</text>
  <text class="small" x="1008" y="594">Keep suction on to remove more solvent,</text>
  <text class="small" x="1008" y="616">then switch off the vacuum source.</text>
  <rect x="957" y="660" width="493" height="99" rx="12" fill="#fff4dc"/>
  <text x="980" y="693" font-size="17" font-weight="700" fill="#8a5b10">Keep hot gravity filtration separate</text>
  <text class="small" x="980" y="720">Use it only to remove insoluble impurities from a hot</text>
  <text class="small" x="980" y="742">solution; vacuum filtration is for cooled crystals.</text>

  <text x="1478" y="914" text-anchor="end" font-size="15" font-weight="700" fill="#47647b">MARLBRIDGE • STUDY RESOURCES</text>
<g aria-label="Marlbridge watermark" opacity="0.72"><text x="764" y="912" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#31516e">MARLBRIDGE STUDY RESOURCES</text></g>
<image href="data:image/svg+xml;base64," x="1300" y="18" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
