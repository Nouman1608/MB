<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="871" viewBox="0 0 1528 871" role="img" aria-labelledby="title desc"><title id="title">Separation: residue, filtrate, crystals or distillate</title><desc id="desc">Filtration separates insoluble solid residue from liquid filtrate. Crystallisation recovers a solute, simple distillation recovers a solvent, and fractional distillation separates suitable miscible liquids.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#1c2d4b"/></marker><marker id="red" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#b75e53"/></marker><marker id="blue" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#357ea2"/></marker></defs><rect width="100%" height="100%" fill="#f5f8f7"/><g font-family="Arial, sans-serif"><text x="24" y="58" font-size="38" font-weight="700" text-anchor="start" fill="#1c2d4b">Separation: residue, filtrate, crystals or distillate</text><text x="24" y="104" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Choose the method from the components and the product wanted</text><g transform="translate(24,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Filtration: an insoluble solid from liquid</text><path d="M160,160 H400 L300,300 V350 H260 V300 Z" fill="white" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M185,180 H375 L280,275 Z" fill="#e2efec" stroke="#73aaa5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M210,335 V435 H450 V335" fill="none" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="213" y="380" width="234" height="52" rx="0" fill="#d7e9e8" stroke="none" stroke-width="0"/><circle cx="250" cy="220" r="6" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><circle cx="275" cy="235" r="6" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><circle cx="300" cy="220" r="6" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><path d="M422,167.3 L345,210" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="430" y="175" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Filter paper</text><path d="M422,262.3 L280,235" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="430" y="270" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Residue</text><path d="M502,407.3 L400,400" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="510" y="415" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Filtrate</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">The insoluble solid remains as residue on the filter paper.</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Liquid and dissolved substances pass through as filtrate.</text><text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Filtration cannot remove dissolved salt from water.</text></g><g transform="translate(784,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Choose by the property and the product wanted</text><rect x="55" y="95" width="610" height="95" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2"/><text x="360.0" y="127" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">To recover a dissolved solid</text><text x="360.0" y="160" font-size="20" font-weight="400" text-anchor="middle" fill="#1c2d4b">Concentrate the solution, cool and crystallise</text><rect x="55" y="235" width="610" height="105" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2"/><text x="360.0" y="267" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">To recover the solvent</text><text x="360.0" y="300" font-size="20" font-weight="400" text-anchor="middle" fill="#1c2d4b">Use simple distillation: evaporate, then condense the vapour</text><rect x="55" y="375" width="610" height="95" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2"/><text x="360.0" y="407" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">To separate miscible liquids</text><text x="360.0" y="440" font-size="20" font-weight="400" text-anchor="middle" fill="#1c2d4b">Use fractional distillation with different boiling points</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Crystallisation recovers solute crystals; distillation collects a</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">condensed liquid. Choose the technique from solubility and</text><text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">boiling-point differences, not from whether a mixture looks</text><text x="35" y="593" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">clear.</text></g><text x="24" y="849" font-size="19" font-weight="400" text-anchor="start" fill="#1c2d4b">MARLBRIDGE  •  Schematic; structures and particles are not to scale.</text></g><image href="data:image/svg+xml;base64," x="1310" y="816" width="178" height="43" preserveAspectRatio="xMidYMid meet"/></svg>
