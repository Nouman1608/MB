<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="title desc"><title id="title">Cisplatin: a cis geometry links adjacent guanines</title><desc id="desc">The left panel compares square-planar cis-[Pt(NH3)2Cl2], with adjacent chloride leaving groups, to trans-[Pt(NH3)2Cl2], with chlorides opposite. The center shows a common cisplatin adduct: platinum remains coordinated to two NH3 ligands and binds the N7 atoms of two adjacent guanines on the same DNA strand after ligand replacement. The duplex is shown as distorted; the right panel shows that replication can be obstructed and that healthy cells may also be affected. It is a schematic, not an atomic-scale structure or a claim that every lesion prevents replication.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#10233F">Cisplatin: a cis geometry links adjacent guanines</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#5B6D80">Marlbridge • Chemistry teaching diagram</text><rect x="46" y="128" width="415" height="542" rx="18" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="480" y="128" width="660" height="542" rx="18" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="1158" y="128" width="324" height="542" rx="18" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="253" y="165" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">1  Compare the isomers</text><path d="M152 348L152 305" fill="none" stroke="#315F86" stroke-width="3"  stroke-linecap="round"/><rect x="127" y="268" width="50" height="30" rx="8" fill="#E5F1F3" stroke="#168C8C" stroke-width="2"/><text x="152" y="289" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#168C8C">NH₃</text><path d="M152 348L193 348" fill="none" stroke="#315F86" stroke-width="3"  stroke-linecap="round"/><rect x="192" y="333" width="50" height="30" rx="8" fill="#E5F1F3" stroke="#168C8C" stroke-width="2"/><text x="217" y="354" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#168C8C">NH₃</text><path d="M152 348L111 348" fill="none" stroke="#315F86" stroke-width="3"  stroke-linecap="round"/><rect x="62" y="333" width="50" height="30" rx="8" fill="#F8E8E6" stroke="#C44949" stroke-width="2"/><text x="87" y="354" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#C44949">Cl</text><path d="M152 348L152 391" fill="none" stroke="#315F86" stroke-width="3"  stroke-linecap="round"/><rect x="127" y="398" width="50" height="30" rx="8" fill="#F8E8E6" stroke="#C44949" stroke-width="2"/><text x="152" y="419" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#C44949">Cl</text><rect x="123" y="327" width="58" height="42" rx="10" fill="#10233F" stroke="#10233F" stroke-width="2"/><text x="152" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Pt²⁺</text><path d="M355 348L355 305" fill="none" stroke="#315F86" stroke-width="3"  stroke-linecap="round"/><rect x="330" y="268" width="50" height="30" rx="8" fill="#E5F1F3" stroke="#168C8C" stroke-width="2"/><text x="355" y="289" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#168C8C">NH₃</text><path d="M355 348L355 391" fill="none" stroke="#315F86" stroke-width="3"  stroke-linecap="round"/><rect x="330" y="398" width="50" height="30" rx="8" fill="#E5F1F3" stroke="#168C8C" stroke-width="2"/><text x="355" y="419" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#168C8C">NH₃</text><path d="M355 348L314 348" fill="none" stroke="#315F86" stroke-width="3"  stroke-linecap="round"/><rect x="265" y="333" width="50" height="30" rx="8" fill="#F8E8E6" stroke="#C44949" stroke-width="2"/><text x="290" y="354" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#C44949">Cl</text><path d="M355 348L396 348" fill="none" stroke="#315F86" stroke-width="3"  stroke-linecap="round"/><rect x="395" y="333" width="50" height="30" rx="8" fill="#F8E8E6" stroke="#C44949" stroke-width="2"/><text x="420" y="354" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#C44949">Cl</text><rect x="326" y="327" width="58" height="42" rx="10" fill="#10233F" stroke="#10233F" stroke-width="2"/><text x="355" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Pt²⁺</text><text x="150" y="510" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">cis: Cl ligands adjacent</text><text x="357" y="510" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">trans: Cl ligands opposite</text><text x="253" y="557" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">Both are square planar; the cis arrangement</text><text x="253" y="580" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">can bind two nearby DNA donor atoms.</text><rect x="68" y="605" width="370" height="42" rx="10" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/><text x="253" y="632" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">cis-[Pt(NH₃)₂Cl₂] = cisplatin</text><text x="810" y="165" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">2  A common DNA adduct</text><text x="810" y="194" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#5B6D80">Two adjacent guanines on one strand</text><path d="M540 265 C620 248 694 278 770 260 S930 245 1080 266" fill="none" stroke="#315F86" stroke-width="5"/><path d="M540 493 C620 510 694 480 770 498 S930 513 1080 492" fill="none" stroke="#168C8C" stroke-width="5"/><rect x="587" y="244" width="66" height="43" rx="8" fill="#F0EBF5" stroke="#725C8E" stroke-width="2"/><text x="620" y="273" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#725C8E">A</text><path d="M620 288L620 460" fill="none" stroke="#D3DCE2" stroke-width="3" stroke-dasharray="5 5" stroke-linecap="round"/><rect x="587" y="469" width="66" height="43" rx="8" fill="#F0EBF5" stroke="#725C8E" stroke-width="2"/><text x="620" y="498" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#725C8E">T</text><rect x="697" y="244" width="66" height="43" rx="8" fill="#E7F1EA" stroke="#397D64" stroke-width="2"/><text x="730" y="273" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#397D64">G</text><path d="M730 288L730 460" fill="none" stroke="#D3DCE2" stroke-width="3" stroke-dasharray="5 5" stroke-linecap="round"/><rect x="697" y="469" width="66" height="43" rx="8" fill="#E7F1EA" stroke="#397D64" stroke-width="2"/><text x="730" y="498" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#397D64">C</text><rect x="812" y="244" width="66" height="43" rx="8" fill="#E7F1EA" stroke="#397D64" stroke-width="2"/><text x="845" y="273" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#397D64">G</text><path d="M845 288L845 460" fill="none" stroke="#D3DCE2" stroke-width="3" stroke-dasharray="5 5" stroke-linecap="round"/><rect x="812" y="469" width="66" height="43" rx="8" fill="#E7F1EA" stroke="#397D64" stroke-width="2"/><text x="845" y="498" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#397D64">C</text><rect x="927" y="244" width="66" height="43" rx="8" fill="#F0EBF5" stroke="#725C8E" stroke-width="2"/><text x="960" y="273" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#725C8E">T</text><path d="M960 288L960 460" fill="none" stroke="#D3DCE2" stroke-width="3" stroke-dasharray="5 5" stroke-linecap="round"/><rect x="927" y="469" width="66" height="43" rx="8" fill="#F0EBF5" stroke="#725C8E" stroke-width="2"/><text x="960" y="498" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#725C8E">A</text><text x="810" y="529" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">DNA sugar–phosphate backbones (schematic)</text><path d="M730 295L767 334" fill="none" stroke="#C44949" stroke-width="4"  stroke-linecap="round"/><path d="M845 295L808 334" fill="none" stroke="#C44949" stroke-width="4"  stroke-linecap="round"/><rect x="750" y="319" width="76" height="48" rx="10" fill="#10233F" stroke="#10233F" stroke-width="2"/><text x="788" y="349" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Pt</text><path d="M766 367L748 391" fill="none" stroke="#168C8C" stroke-width="3"  stroke-linecap="round"/><path d="M810 367L846 391" fill="none" stroke="#168C8C" stroke-width="3"  stroke-linecap="round"/><rect x="719" y="389" width="58" height="28" rx="7" fill="#E5F1F3" stroke="#168C8C" stroke-width="2"/><text x="748" y="409" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#168C8C">NH₃</text><rect x="817" y="389" width="58" height="28" rx="7" fill="#E5F1F3" stroke="#168C8C" stroke-width="2"/><text x="846" y="409" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#168C8C">NH₃</text><text x="730" y="236" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#C44949">N7</text><text x="845" y="236" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#C44949">N7</text><text x="810" y="556" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">Pt coordinates to guanine N7 atoms</text><text x="810" y="579" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20314B">after chloride ligand replacement; two NH₃ ligands remain cis.</text><rect x="516" y="594" width="588" height="54" rx="10" fill="#E8F1F4" stroke="#315F86" stroke-width="2"/><text x="810" y="618" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">A common 1,2-intrastrand G–G crosslink</text><text x="810" y="639" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">Schematic; not to scale.</text><text x="1320" y="165" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">3  Cell-level effect</text><rect x="1190" y="207" width="260" height="116" rx="12" fill="#F8E8E6" stroke="#C44949" stroke-width="2"/><text x="1320" y="238" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#C44949">DNA distortion</text><text x="1320" y="267" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20314B">can hinder strand opening</text><text x="1320" y="291" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20314B">and replication machinery</text><path d="M1320 330L1320 369" fill="none" stroke="#C9A227" stroke-width="4" marker-end="url(#arr)"/><rect x="1190" y="378" width="260" height="94" rx="12" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/><text x="1320" y="410" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">Replication may stall</text><text x="1320" y="439" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20314B">repair or bypass can occur</text><text x="1320" y="517" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20314B">Cisplatin can also damage DNA</text><text x="1320" y="541" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20314B">in healthy cells, contributing</text><text x="1320" y="565" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20314B">to adverse effects.</text><rect x="1180" y="589" width="280" height="55" rx="9" fill="#E8F1F4" stroke="#315F86" stroke-width="2"/><text x="1320" y="612" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#10233F">Response depends on cell and lesion.</text><text x="1320" y="631" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">Not every adduct blocks every copy event.</text><rect x="46" y="700" width="1436" height="112" rx="14" fill="#FFF9E8" stroke="#C9A227" stroke-width="2"/><text x="764" y="735" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">How to read this model</text><text x="764" y="765" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#20314B">Cisplatin forms several DNA adducts; this figure focuses on a common adjacent-guanine, same-strand example.</text><text x="764" y="791" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#5B6D80">A distorted lesion can impede replication, but cellular repair, bypass and outcome vary.</text><text x="764" y="862" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".06">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE  •  STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="887" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
