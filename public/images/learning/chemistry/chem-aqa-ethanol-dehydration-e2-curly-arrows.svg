<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940">
<style>
text{font-family:Arial,Inter,sans-serif;fill:#14243b} .title{font-size:38px;font-weight:700} .sub{font-size:20px;fill:#52637a} .head{font-size:24px;font-weight:700} .chem{font-size:29px;font-weight:600} .label{font-size:19px} .small{font-size:16px;fill:#52637a} .panel{fill:#fff;stroke:#d9e2ec;stroke-width:2} .bond{stroke:#14243b;stroke-width:4} .teal{stroke:#287a78;stroke-width:5;fill:none;marker-end:url(#arrow)} .coral{stroke:#bd5d4e;stroke-width:5;fill:none;marker-end:url(#arrow2)} .watermark{font-size:18px;letter-spacing:7px;fill:#e9eceb;font-weight:700}
</style>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0 L0 8 L11 4 z" fill="#287a78"/></marker><marker id="arrow2" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0 L0 8 L11 4 z" fill="#bd5d4e"/></marker></defs>
<rect width="1528" height="940" fill="#f7f9fc"/>
<text x="64" y="68" class="title">Primary alcohol dehydration: concerted elimination</text>
<text x="66" y="106" class="sub">Ethanol is protonated first; the primary ethyl carbocation is not formed in this E2-like pathway.</text>
<rect x="64" y="145" width="1400" height="690" rx="22" class="panel"/>
<rect x="88" y="170" width="1352" height="250" rx="18" fill="#edf4fb" stroke="#9db9d5" stroke-width="2"/>
<text x="120" y="214" class="head">1. Protonate the hydroxyl group</text>
<text x="178" y="302" class="chem">CH₃</text><line x1="247" y1="292" x2="305" y2="292" class="bond"/><text x="310" y="302" class="chem">CH₂</text><line x1="397" y1="292" x2="465" y2="292" class="bond"/><text x="470" y="302" class="chem">O</text><line x1="501" y1="292" x2="548" y2="292" class="bond"/><text x="554" y="302" class="chem">H</text>
<text x="655" y="302" class="chem">+</text><text x="705" y="302" class="chem">H</text><line x1="735" y1="292" x2="790" y2="292" class="bond"/><text x="800" y="302" class="chem">A</text>
<circle cx="488" cy="252" r="4" fill="#14243b"/><circle cx="500" cy="252" r="4" fill="#14243b"/>
<path d="M496 246 C 545 208, 632 216, 710 278" class="teal"/>
<path d="M763 286 C 780 254, 800 254, 816 276" class="coral"/>
<text x="160" y="350" class="small">O lone pair → acid H</text><text x="600" y="350" class="small">H—A bond pair → A</text>
<text x="970" y="302" class="chem">→</text><text x="1050" y="302" class="chem">CH₃CH₂OH₂⁺ + A⁻</text>
<rect x="88" y="445" width="1352" height="345" rx="18" fill="#e4f4ee" stroke="#66a58d" stroke-width="2"/>
<text x="120" y="490" class="head">2. Remove a β-hydrogen as water leaves (one concerted step)</text>
<text x="205" y="627" class="chem">A⁻</text><circle cx="255" cy="592" r="4" fill="#14243b"/><circle cx="267" cy="592" r="4" fill="#14243b"/>
<text x="510" y="612" class="chem">H</text><text x="634" y="610" class="chem">Cβ</text><text x="843" y="610" class="chem">Cα</text><text x="1093" y="610" class="chem">O⁺</text>
<line x1="562" y1="600" x2="625" y2="600" class="bond"/><line x1="705" y1="600" x2="827" y2="600" class="bond"/><line x1="910" y1="600" x2="1080" y2="600" class="bond"/>
<line x1="663" y1="574" x2="663" y2="542" class="bond"/><text x="650" y="535" class="small">H</text><line x1="664" y1="620" x2="664" y2="672" class="bond"/><text x="630" y="700" class="label">Hβ</text>
<line x1="870" y1="574" x2="870" y2="542" class="bond"/><text x="857" y="535" class="small">H</text><line x1="870" y1="620" x2="870" y2="672" class="bond"/><text x="857" y="700" class="small">H</text>
<line x1="1114" y1="574" x2="1114" y2="542" class="bond"/><text x="1100" y="535" class="small">H</text><line x1="1114" y1="620" x2="1114" y2="672" class="bond"/><text x="1100" y="700" class="small">H</text>
<!-- Three curly arrows show the simultaneous E2 electron-pair movements. -->
<path d="M270 588 C 382 520, 535 520, 653 662" class="teal"/>
<path d="M670 646 C 700 625, 738 606, 768 600" class="coral"/>
<path d="M1014 598 C 1050 568, 1080 566, 1110 590" class="teal"/>
<text x="145" y="746" class="small">1  A⁻ lone pair → β-H</text>
<text x="520" y="746" class="small">2  C—H pair → Cβ—Cα (forms C=C)</text>
<text x="1010" y="746" class="small">3  Cα—O pair → O (water leaves)</text>
<text x="760" y="778" text-anchor="middle" class="label">Products: CH₂=CH₂ + H₂O + H—A. No free primary carbocation forms.</text>
<text x="64" y="880" class="watermark">MARLBRIDGE STUDY RESOURCES</text>
<text x="64" y="918" class="small">MARLBRIDGE • AQA A-level Chemistry • mechanistic model</text>
<image href="data:image/svg+xml;base64," x="1320" y="887" width="170" height="42" preserveAspectRatio="xMidYMid meet"/>
</svg>