<svg xmlns="http://www.w3.org/2000/svg" width="900" height="940" viewBox="0 0 1800 1880" role="img" aria-labelledby="title desc"><title id="title">Iron displaces copper</title><desc id="desc">No tier label: displacement reactions and oxidation and reduction as loss and gain of electrons are on both Edexcel International GCSE papers (4CH1 2.16, 2.20) and OxfordAQA International GCSE Chemistry is not tiered (9202 3.3.1.1b and 3.3.1.1h, displacement of copper by iron; 3.8.4b). A grey iron nail in blue copper(II) sulfate solution becomes coated pink-brown with copper, and the solution turns pale green iron(II) sulfate. Particles: iron atoms lose two electrons to become Fe2+ (oxidised); copper ions gain the two electrons to become copper atoms (reduced). Fe + CuSO4 → FeSO4 + Cu.</desc><rect width="1800" height="1880" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="92" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle">Iron displaces copper</text>
<text x="900" y="172" font-size="42" fill="#4B5B72" text-anchor="middle">More reactive metal pushes the other out of solution</text>
<rect x="130" y="450" width="506" height="410" fill="#7EB6DC"/>
