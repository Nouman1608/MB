<text x="400" y="1528" font-size="46" font-weight="700" fill="#1E2B47" text-anchor="middle">iron loses electrons</text>
<text x="400" y="1596" font-size="40" fill="#4B5B72" text-anchor="middle">(oxidised)</text>
<text x="1300" y="1528" font-size="46" font-weight="700" fill="#1E2B47" text-anchor="middle">copper ions gain electrons</text>
<text x="1300" y="1596" font-size="40" fill="#4B5B72" text-anchor="middle">(reduced)</text>
<text x="900" y="1740" font-size="48" font-weight="700" fill="#1E2B47" text-anchor="middle" xml:space="preserve"><tspan>Fe + CuSO</tspan><tspan dy="13.4" font-size="32.6">4</tspan><tspan dy="-13.4"> → FeSO</tspan><tspan dy="13.4" font-size="32.6">4</tspan><tspan dy="-13.4"> + Cu</tspan></text></g></svg>
