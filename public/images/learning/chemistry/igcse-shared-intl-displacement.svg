<text x="1420" y="948" font-size="42" fill="#1E2B47" text-anchor="middle">pale green iron(II) sulfate</text>
<text x="1420" y="1010" font-size="42" font-weight="700" fill="#B9632F" text-anchor="middle">pink-brown copper coat</text>
<rect x="60" y="1060" width="1680" height="760" rx="24" fill="#FFFFFF" stroke="#1E2B47" stroke-width="5"/>
<text x="900" y="1146" font-size="48" font-weight="700" fill="#1E2B47" text-anchor="middle">What happens to the particles</text>
<circle cx="220" cy="1360" r="86" fill="#C9D0DC" stroke="#1E2B47" stroke-width="6"/>
<text x="220" y="1376" font-size="44" font-weight="700" fill="#1E2B47" text-anchor="middle">Fe</text>
