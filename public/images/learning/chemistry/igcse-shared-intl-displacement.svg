<polygon points="1414.2,277.9 1433.8,282.1 1353.8,652.1 1333.4,698.9 1334.2,647.9" fill="#D98656" stroke="#1E2B47" stroke-width="4" stroke-linejoin="round"/>
<polygon points="1392.7,266.2 1455.3,279.8 1451.1,299.4 1388.5,285.8" fill="#9AA6B6" stroke="#1E2B47" stroke-width="4" stroke-linejoin="round"/>
