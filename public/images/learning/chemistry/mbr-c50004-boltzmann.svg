<svg role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940"><title id="title">Activation energy and the Boltzmann distribution</title><desc id="desc">Only collisions with energy ≥ Ea can react (orientation must also be suitable); Higher temperature: broader distribution, larger fraction ≥ Ea; Catalyst: lower Ea pathway; the energy distribution does not move; More successful collisions per second → faster reaction</desc><defs><clipPath id="tail"><rect x="882.3" y="140" width="447.70000000000005" height="510"/></clipPath></defs><rect width="100%" height="100%" fill="#f4f7f6"/><text x="38" y="65" font-family="Arial" font-size="32" font-weight="700" fill="#1c2d4b">Activation energy and the Boltzmann distribution</text><path d="M120 140 V650 H1330" fill="none" stroke="#1c2d4b" stroke-width="4"/><text x="120" y="120" font-family="Arial" font-size="20">Number of particles</text><text x="1130" y="692" font-family="Arial" font-size="20">Kinetic energy →</text><path d="M 120 650 C 140 240, 210 150, 300 160 C 420 170, 510 630, 1330 650 L1330 650 L882.3 650 Z" clip-path="url(#tail)" fill="#b75e53" opacity=".23"/><path d="M 120 650 C 140 240, 210 150, 300 160 C 420 170, 510 630, 1330 650" fill="none" stroke="#397fa6" stroke-width="6"/><path d="M 120 650 C 160 360, 300 120, 420 160 C 550 200, 620 620, 1330 650" fill="none" stroke="#65a6a2" stroke-width="4" stroke-dasharray="12 8"/><path d="M882.3 190 V650" stroke="#b75e53" stroke-width="4" stroke-dasharray="10 8"/><path d="M640.3 245 V650" stroke="#d5b32d" stroke-width="4" stroke-dasharray="10 8"/><text x="890.3" y="178" font-family="Arial" font-size="22" fill="#b75e53">Ea (no catalyst)</text><text x="648.3" y="234" font-family="Arial" font-size="22" fill="#8b7412">Ea (catalyst)</text><text x="894.3" y="605" font-family="Arial" font-size="18">shaded tail: E ≥ Ea</text><text x="38" y="760" font-family="Arial" font-size="19" fill="#1c2d4b">Dashed teal: higher temperature. The catalyst lowers Ea but leaves the distribution unchanged.</text><text x="38" y="802" font-family="Arial" font-size="18" font-weight="700" fill="#1c2d4b">E ≥ Ea is necessary; a suitable collision orientation is also required.</text><text x="720" y="860" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".06">MARLBRIDGE STUDY RESOURCES</text><path d="M38 872H1402" stroke="#C9A227" stroke-width="2"/><text x="40" y="912" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1235" y="878" width="165" height="40" preserveAspectRatio="xMidYMid meet"/></svg>