<svg xmlns="http://www.w3.org/2000/svg" width="900" height="945" viewBox="0 0 1800 1890" role="img" aria-labelledby="title desc"><title id="title">Ionic bonding: electrons move</title><desc id="desc">No tier label: both examples are on both Edexcel International GCSE papers (4CH1 1.40, dot-and-cross diagrams for Groups 1, 2, 3 with 5, 6, 7) and OxfordAQA International GCSE Chemistry is not tiered (9202 3.2.1c and 3.2.1f). Outer shells only; dots are the metal's electrons and crosses the non-metal's. Sodium chloride: sodium (1 outer electron) gives it to chlorine (7), giving Na+ with none left and Cl- with 8 outer electrons. Magnesium oxide: magnesium (2) gives both to oxygen (6), giving Mg2+ with none left and O2- with 8.</desc><rect width="1800" height="1890" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="92" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle">Ionic bonding: electrons move</text>
