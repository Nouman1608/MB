<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1140" viewBox="0 0 1800 2280" role="img" aria-labelledby="title desc"><title id="title">Alkene and repeat unit (OxfordAQA International GCSE Chemistry)</title><desc id="desc">No tier label: OxfordAQA International GCSE Chemistry is not tiered; 9202 statement 3.10.2a covers poly(ethene) and poly(propene) and representing the formation of a polymer from a given alkene monomer. Ethene: opening the C=C gives the repeat unit, two carbons joined by a single bond with bonds sticking out through square brackets and n outside; closing it again gives back the monomer. Propene: the same, with a CH3 group on the second carbon. Wrong: a repeat unit that keeps the C=C double bond is crossed out, because the C=C never stays.</desc><rect width="1800" height="2280" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="92" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle">Alkene ⇄ repeat unit</text>
