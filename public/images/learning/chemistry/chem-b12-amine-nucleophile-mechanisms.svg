<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="870" viewBox="0 0 1528 870" role="img" aria-labelledby="title desc"><title id="title">Two nucleophilic mechanisms of amines</title><desc id="desc">Ethylamine substitutes bromomethane through an N-positive intermediate; methylamine adds to ethanoyl chloride, then chloride leaves and a base removes a proton.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#172b3c"/></marker><marker id="tealArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#288a83"/></marker></defs><style>text{font-family:Arial,"Liberation Sans",sans-serif}</style><rect width="100%" height="100%" fill="#fbfcfa"/><text x="44" y="58" font-size="34" fill="#172b3c" font-weight="700">Two nucleophilic mechanisms of amines</text><rect x="40" y="95" width="1448" height="690" rx="26" fill="#f2f7f6"/><rect x="70" y="130" width="660" height="590" rx="20" fill="white" stroke="#c9d8dc" stroke-width="2"/><rect x="70" y="130" width="660" height="10" rx="5" fill="#288a83"/><text x="92" y="175" font-size="25" fill="#172b3c" font-weight="700">A  Substitution</text><text x="92" y="212" font-size="21" fill="#203545" font-weight="400">CH₃CH₂NH₂ + CH₃Br → [CH₃CH₂N⁺H₂CH₃] + Br⁻</text><text x="92" y="238.25" font-size="21" fill="#203545" font-weight="400">N lone pair → CH₃ carbon; C–Br bond → Br.</text><text x="92" y="264.5" font-size="21" fill="#203545" font-weight="400">A second amine removes H⁺ → CH₃CH₂NHCH₃ +</text><text x="92" y="290.75" font-size="21" fill="#203545" font-weight="400">CH₃CH₂NH₃⁺Br⁻.</text><rect x="798" y="130" width="660" height="590" rx="20" fill="white" stroke="#c9d8dc" stroke-width="2"/><rect x="798" y="130" width="660" height="10" rx="5" fill="#e5b94c"/><text x="820" y="175" font-size="25" fill="#172b3c" font-weight="700">B  Addition–elimination</text><text x="820" y="212" font-size="21" fill="#203545" font-weight="400">CH₃NH₂ + CH₃COCl → CH₃CONHCH₃</text><text x="820" y="238.25" font-size="21" fill="#203545" font-weight="400">N lone pair → carbonyl C; C=O electrons → O.</text><text x="820" y="264.5" font-size="21" fill="#203545" font-weight="400">O⁻ reforms C=O; C–Cl electrons → Cl. Base</text><text x="820" y="290.75" font-size="21" fill="#203545" font-weight="400">removes H⁺ from N⁺.</text><text x="115" y="540" font-size="22" fill="#288a83" font-weight="700">Electron-pair movement (curly-arrow direction)</text><text x="135" y="610" font-size="31" fill="#172b3c" font-weight="700">N:</text><text x="330" y="610" font-size="31" fill="#172b3c" font-weight="700">CH₃</text><text x="585" y="610" font-size="31" fill="#172b3c" font-weight="700">Br</text><line x1="185" y1="585" x2="325" y2="585" stroke="#288a83" stroke-width="4"  marker-end="url(#arrow)"/><line x1="460" y1="610" x2="565" y2="610" stroke="#c45637" stroke-width="4"  marker-end="url(#arrow)"/><text x="430" y="615" font-size="22" fill="#172b3c" font-weight="700">C</text><text x="855" y="610" font-size="28" fill="#172b3c" font-weight="700">N:</text><text x="1080" y="610" font-size="30" fill="#172b3c" font-weight="700">C</text><text x="1285" y="560" font-size="28" fill="#c45637" font-weight="700">O</text><line x1="915" y1="585" x2="1070" y2="585" stroke="#288a83" stroke-width="4"  marker-end="url(#arrow)"/><line x1="1120" y1="590" x2="1265" y2="555" stroke="#c45637" stroke-width="4"  marker-end="url(#arrow)"/><text x="980" y="650" font-size="20" fill="#288a83" font-weight="700">addition</text><text x="1200" y="650" font-size="19" fill="#c45637" font-weight="700">C=O π pair → O</text><text x="105" y="770" font-size="23" fill="#172b3c" font-weight="700">Substitution: one bond forms as C–Br breaks</text><text x="835" y="770" font-size="23" fill="#172b3c" font-weight="700">Acylation: addition first, then elimination</text><line x1="40" y1="816" x2="1488" y2="816" stroke="#d9e3e4"/><text x="44" y="848" font-size="16" fill="#607783" font-weight="600">MARLBRIDGE  •  Schematic; not to scale</text></svg>
