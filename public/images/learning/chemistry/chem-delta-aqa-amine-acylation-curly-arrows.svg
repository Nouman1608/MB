<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="title desc"><title id="title">Methylamine acylation by ethanoyl chloride: full curly-arrow mechanism</title><desc id="desc">AQA A-level Chemistry 3.3.11.3; structural electron-pair arrows and balanced net stoichiometry.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#C44949"/></marker><marker id="arrblue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#315F86"/></marker></defs><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#10233F">Methylamine acylation by ethanoyl chloride: full curly-arrow mechanism</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">AQA A-level Chemistry 3.3.11.3; structural electron-pair arrows and balanced net stoichiometry.</text><rect x="52" y="132" width="1424" height="606" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="88" y="174" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#10233F">One primary amine adds to the carbonyl; collapse expels chloride; a second amine accepts the proton.</text><rect x="90" y="230" width="300" height="356" rx="14" fill="#E7F3F1" stroke="#D3DCE2" stroke-width="2"/><text x="106" y="261" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#315F86">1  N attacks carbonyl</text><rect x="440" y="230" width="300" height="356" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="456" y="261" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#315F86">2  Tetrahedral intermediate</text><rect x="790" y="230" width="300" height="356" rx="14" fill="#E7F3F1" stroke="#D3DCE2" stroke-width="2"/><text x="806" y="261" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#C44949">3  Elimination</text><rect x="1140" y="230" width="300" height="356" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="1156" y="261" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#315F86">4  Deprotonation</text><text x="106" y="304" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">CH₃</text><line x1="143" y1="298" x2="188" y2="298" stroke="#20314B" stroke-width="3"/><text x="212" y="304" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">C</text><line x1="212" y1="281" x2="212" y2="251" stroke="#20314B" stroke-width="3"/><line x1="220" y1="281" x2="220" y2="251" stroke="#20314B" stroke-width="3"/><text x="216" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#C44949">O</text><line x1="230" y1="299" x2="264" y2="299" stroke="#20314B" stroke-width="3"/><text x="279" y="304" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">Cl</text><text x="181" y="354" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">+  CH₃—NH₂</text><path d="M232 365 C245 340 230 322 219 310" fill="none" stroke="#168C8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M216 279 C216 267 216 258 216 250" fill="none" stroke="#725C8E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="240" y="408" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#20314B">N: → C; C=O π → O</text><text x="590" y="306" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#C44949">O⁻</text><line x1="590" y1="316" x2="590" y2="350" stroke="#20314B" stroke-width="3"/><text x="590" y="371" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">C</text><line x1="571" y1="368" x2="542" y2="368" stroke="#20314B" stroke-width="3"/><text x="530" y="374" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">CH₃</text><line x1="608" y1="368" x2="638" y2="368" stroke="#20314B" stroke-width="3"/><text x="656" y="374" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">Cl</text><line x1="590" y1="385" x2="590" y2="417" stroke="#20314B" stroke-width="3"/><text x="590" y="441" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#725C8E">N⁺H₂—CH₃</text><text x="590" y="490" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#5B6D80">C has four single bonds</text><text x="824" y="301" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#C44949">O⁻</text><path d="M829 325 C847 339 852 355 841 363" fill="none" stroke="#168C8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="841" y="385" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">C</text><line x1="841" y1="394" x2="841" y2="426" stroke="#20314B" stroke-width="3"/><text x="841" y="444" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#725C8E">N⁺H₂CH₃</text><line x1="823" y1="382" x2="801" y2="382" stroke="#20314B" stroke-width="3"/><text x="792" y="388" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#10233F">CH₃</text><line x1="859" y1="382" x2="881" y2="382" stroke="#20314B" stroke-width="3"/><text x="895" y="388" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">Cl</text><path d="M875 373 C897 357 916 356 925 371" fill="none" stroke="#C44949" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="944" y="388" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#C44949">Cl⁻</text><text x="841" y="490" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#20314B">Re-form C=O; C—Cl pair → Cl⁻</text><text x="1163" y="315" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#10233F">CH₃—C(=O)—NH₂⁺—CH₃</text><text x="1163" y="366" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#168C8C">+ :NH₂CH₃</text><path d="M1199 380 C1213 357 1227 352 1238 356" fill="none" stroke="#168C8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M1235 355 C1218 338 1207 329 1192 327" fill="none" stroke="#725C8E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="1290" y="418" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">→ CH₃CONHCH₃</text><text x="1290" y="448" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">+ CH₃NH₃⁺ + Cl⁻</text><text x="1290" y="493" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#5B6D80">amide + salt</text><path d="M395 407 L429 407" fill="none" stroke="#315F86" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrblue)"/><path d="M745 407 L779 407" fill="none" stroke="#C44949" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrblue)"/><path d="M1095 407 L1129 407" fill="none" stroke="#315F86" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrblue)"/><text x="764" y="646" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">Net: CH₃COCl + 2 CH₃NH₂ → CH₃CONHCH₃ + CH₃NH₃Cl</text><text x="764" y="686" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">Arrow tails begin at an electron pair or bond; arrowheads point to where that pair moves.</text><text letter-spacing="5" opacity=".08" x="764" y="849" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE STUDY RESOURCES</text><line x1="52" y1="866" x2="1476" y2="866" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="875" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
