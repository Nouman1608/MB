<svg xmlns="http://www.w3.org/2000/svg" width="900" height="950" viewBox="0 0 1800 1900" role="img" aria-labelledby="title desc"><title id="title">Exothermic reaction profile (Edexcel International GCSE Chemistry: Paper 2 only)</title><desc id="desc">Marked Paper 2 only: reaction profile diagrams showing ΔH and activation energy are 4CH1 statement 3.14C, and energy level diagrams 3.5C, both in bold; the terms exothermic and endothermic (3.1) are on both papers. Sketch reaction pathway diagram, not to scale: energy against progress of reaction. The reactants start higher; the curve rises by the activation energy, Ea, to a peak, then falls to the products, which end lower. ΔH is negative, shown by a downward arrow. Energy is released, so the surroundings get hotter.</desc><rect width="1800" height="1900" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="92" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle">Exothermic: products end lower</text>
<text x="900" y="174" font-size="42" fill="#4B5B72" text-anchor="middle">Reaction pathway diagram</text>
