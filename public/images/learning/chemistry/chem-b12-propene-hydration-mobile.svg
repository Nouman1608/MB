<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1120" viewBox="0 0 768 1120" role="img" aria-labelledby="title desc"><title id="title">Acid-catalysed hydration of propene</title><desc id="desc">Propene forms mainly propan-2-ol because protonation gives the more stable secondary carbocation. Water attacks the carbocation, then deprotonation regenerates H+.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#172b3c"/></marker><marker id="tealArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#288a83"/></marker></defs><style>text{font-family:Arial,"Liberation Sans",sans-serif}</style><rect width="100%" height="100%" fill="#fbfcfa"/><text x="44" y="58" font-size="30" fill="#172b3c" font-weight="700">Acid-catalysed hydration of propene</text><rect x="28" y="90" width="712" height="940" rx="24" fill="#f2f7f6"/><rect x="60" y="130" width="648" height="170" rx="20" fill="white" stroke="#c9d8dc" stroke-width="2"/><rect x="60" y="130" width="648" height="10" rx="5" fill="#288a83"/><text x="82" y="175" font-size="25" fill="#172b3c" font-weight="700">1  Protonation</text><text x="82" y="212" font-size="21" fill="#203545" font-weight="400">The π bond takes H⁺. The major route gives</text><text x="82" y="238.25" font-size="21" fill="#203545" font-weight="400">a secondary carbocation.</text><line x1="380" y1="310" x2="380" y2="360" stroke="#172b3c" stroke-width="4"  marker-end="url(#arrow)"/><rect x="60" y="370" width="648" height="165" rx="20" fill="white" stroke="#c9d8dc" stroke-width="2"/><rect x="60" y="370" width="648" height="10" rx="5" fill="#e5b94c"/><text x="82" y="415" font-size="25" fill="#172b3c" font-weight="700">2  Water attack</text><text x="82" y="452" font-size="21" fill="#203545" font-weight="400">A water lone pair attacks C⁺, making an</text><text x="82" y="478.25" font-size="21" fill="#203545" font-weight="400">oxonium ion.</text><line x1="380" y1="550" x2="380" y2="600" stroke="#172b3c" stroke-width="4"  marker-end="url(#arrow)"/><rect x="60" y="610" width="648" height="165" rx="20" fill="white" stroke="#c9d8dc" stroke-width="2"/><rect x="60" y="610" width="648" height="10" rx="5" fill="#c45637"/><text x="82" y="655" font-size="25" fill="#172b3c" font-weight="700">3  Deprotonation</text><text x="82" y="692" font-size="21" fill="#203545" font-weight="400">O–H electrons return to O; H⁺ is</text><text x="82" y="718.25" font-size="21" fill="#203545" font-weight="400">regenerated.</text><text x="90" y="850" font-size="29" fill="#172b3c" font-weight="700">CH₃–CH=CH₂ + H⁺</text><text x="90" y="900" font-size="29" fill="#172b3c" font-weight="700">→ CH₃–C⁺H–CH₃</text><text x="90" y="950" font-size="27" fill="#172b3c" font-weight="700">→ CH₃–CH(OH₂⁺)–CH₃</text><text x="90" y="1000" font-size="27" fill="#288a83" font-weight="700">→ CH₃–CH(OH)–CH₃ + H⁺</text><line x1="40" y1="1066" x2="728" y2="1066" stroke="#d9e3e4"/><text x="44" y="1098" font-size="16" fill="#607783" font-weight="600">MARLBRIDGE  •  Schematic; not to scale</text></svg>
