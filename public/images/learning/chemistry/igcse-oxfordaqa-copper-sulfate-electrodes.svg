<text x="1188" y="1156" font-size="40" fill="#4B5B72" text-anchor="middle">rod unchanged</text>
<text x="600" y="1228" font-size="44" font-weight="700" fill="#1E2B47" text-anchor="middle" xml:space="preserve"><tspan>Cu</tspan><tspan dy="-16.7" font-size="29.9">2+</tspan><tspan dy="16.7"> + 2e</tspan><tspan dy="-16.7" font-size="29.9">−</tspan><tspan dy="16.7"> → Cu</tspan></text>
<text x="1236" y="1228" font-size="44" font-weight="700" fill="#1E2B47" text-anchor="middle" xml:space="preserve"><tspan>4OH</tspan><tspan dy="-16.7" font-size="29.9">−</tspan><tspan dy="16.7"> → O</tspan><tspan dy="12.3" font-size="29.9">2</tspan><tspan dy="-12.3"> + 2H</tspan><tspan dy="12.3" font-size="29.9">2</tspan><tspan dy="-12.3">O + 4e</tspan><tspan dy="-16.7" font-size="29.9">−</tspan></text>
