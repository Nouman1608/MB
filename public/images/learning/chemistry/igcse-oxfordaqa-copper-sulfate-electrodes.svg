<text x="600" y="2228" font-size="44" font-weight="700" fill="#1E2B47" text-anchor="middle" xml:space="preserve"><tspan>Cu</tspan><tspan dy="-16.7" font-size="29.9">2+</tspan><tspan dy="16.7"> + 2e</tspan><tspan dy="-16.7" font-size="29.9">−</tspan><tspan dy="16.7"> → Cu</tspan></text>
