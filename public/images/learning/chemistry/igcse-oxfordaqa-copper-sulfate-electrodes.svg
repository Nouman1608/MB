<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 1800 2400" role="img" aria-labelledby="title desc"><title id="title">Copper sulfate: graphite or copper electrodes? (OxfordAQA International GCSE Chemistry)</title><desc id="desc">No tier labels: OxfordAQA International GCSE Chemistry is not tiered. 9202 covers the required practical on the electrolysis of copper sulfate solution (3.3.2) and obtaining copper by electrolysis, knowing the electrode material and the half equations at both electrodes (3.3.1.1g). Electrolysis of copper sulfate solution. Graphite electrodes: copper deposits on the cathode (−), which gets coated, Cu2+ + 2e- → Cu; oxygen bubbles at the anode (+), which is unchanged, 4OH- → O2 + 2H2O + 4e-. Copper electrodes: copper deposits on the cathode, which gets bigger, Cu2+ + 2e- → Cu; the copper anode dissolves and gets smaller, Cu → Cu2+ + 2e-, and Cu2+ ions move across to the cathode.</desc><rect width="1800" height="2400" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="92" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle">Copper sulfate: graphite or copper?</text>
<text x="900" y="172" font-size="42" fill="#4B5B72" text-anchor="middle">Same cathode result, different anode</text>
<text x="80" y="376" font-size="52" font-weight="700" fill="#2F6B63">Graphite electrodes</text>
<text x="852" y="316" font-size="56" font-weight="700" fill="#1E2B47" text-anchor="middle">−</text>
<text x="948" y="296" font-size="56" font-weight="700" fill="#1E2B47" text-anchor="middle">+</text>
