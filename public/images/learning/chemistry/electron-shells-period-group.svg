<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="871" viewBox="0 0 1528 871" role="img" aria-labelledby="title desc"><title id="title">Period and group: count the correct electrons</title><desc id="desc">Chlorine has configuration 2,8,7, placing it in Period 3 and Group VII. Helium and neon have full outer shells and are in Group VIII despite helium having only two electrons.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#1c2d4b"/></marker><marker id="red" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#b75e53"/></marker><marker id="blue" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#357ea2"/></marker></defs><rect width="100%" height="100%" fill="#f5f8f7"/><g font-family="Arial, sans-serif"><text x="24" y="58" font-size="38" font-weight="700" text-anchor="start" fill="#1c2d4b">Period and group: count the correct electrons</text><text x="24" y="104" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Main-group atoms in the first 20 elements</text><g transform="translate(24,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Chlorine: read two different counts</text><circle cx="205" cy="270" r="24" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><text x="205" y="277" font-size="21" font-weight="700" text-anchor="middle" fill="#1c2d4b">Cl</text><circle cx="205" cy="270" r="54" fill="none" stroke="#73aaa5" stroke-width="2"/><circle cx="205.0" cy="216.0" r="5" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="205.0" cy="324.0" r="5" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="205" cy="270" r="88" fill="none" stroke="#73aaa5" stroke-width="2"/><circle cx="205.0" cy="182.0" r="5" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="267.2253967444162" cy="207.77460325558383" r="5" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="293.0" cy="270.0" r="5" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="267.2253967444162" cy="332.2253967444162" r="5" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="205.0" cy="358.0" r="5" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="142.77460325558383" cy="332.2253967444162" r="5" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="117.0" cy="270.0" r="5" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="142.7746032555838" cy="207.77460325558383" r="5" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="205" cy="270" r="122" fill="none" stroke="#73aaa5" stroke-width="2"/><circle cx="205.0" cy="148.0" r="5" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="300.38344086109964" cy="193.9342441732345" r="5" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="323.9412052861825" cy="297.14755394267036" r="5" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="257.9338161723421" cy="379.91820188409514" r="5" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="152.0661838276579" cy="379.91820188409514" r="5" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="86.05879471381752" cy="297.14755394267036" r="5" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="109.61655913890036" cy="193.93424417323453" r="5" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><rect x="400" y="150" width="260" height="100" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2"/><text x="530.0" y="182" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">3 occupied shells</text><text x="530.0" y="215" font-size="20" font-weight="400" text-anchor="middle" fill="#1c2d4b">Period 3</text><rect x="400" y="310" width="260" height="100" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2"/><text x="530.0" y="342" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">7 outer electrons</text><text x="530.0" y="375" font-size="20" font-weight="400" text-anchor="middle" fill="#1c2d4b">Group VII / 17</text><text x="205" y="440" font-size="30" font-weight="700" text-anchor="middle" fill="#1c2d4b">2,8,7</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">For main-group elements in Groups I–VII, the outer-electron</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">count gives the Roman-numeral group. Modern Group 17</text><text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">corresponds to Group VII here. Period counts occupied shells.</text></g><g transform="translate(784,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Noble gases: the full-shell exception</text><circle cx="190" cy="265" r="24" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><text x="190" y="272" font-size="21" font-weight="700" text-anchor="middle" fill="#1c2d4b">He</text><circle cx="190" cy="265" r="54" fill="none" stroke="#73aaa5" stroke-width="2"/><circle cx="190.0" cy="211.0" r="5" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="190.0" cy="319.0" r="5" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="520" cy="265" r="24" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><text x="520" y="272" font-size="21" font-weight="700" text-anchor="middle" fill="#1c2d4b">Ne</text><circle cx="520" cy="265" r="54" fill="none" stroke="#73aaa5" stroke-width="2"/><circle cx="520.0" cy="211.0" r="5" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="520.0" cy="319.0" r="5" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="520" cy="265" r="88" fill="none" stroke="#73aaa5" stroke-width="2"/><circle cx="520.0" cy="177.0" r="5" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="582.2253967444162" cy="202.77460325558383" r="5" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="608.0" cy="265.0" r="5" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="582.2253967444162" cy="327.2253967444162" r="5" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="520.0" cy="353.0" r="5" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="457.7746032555838" cy="327.2253967444162" r="5" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="432.0" cy="265.0" r="5" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="457.7746032555838" cy="202.77460325558383" r="5" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><text x="190" y="400" font-size="27" font-weight="700" text-anchor="middle" fill="#1c2d4b">He: 2</text><text x="520" y="400" font-size="27" font-weight="700" text-anchor="middle" fill="#1c2d4b">Ne: 2,8</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Helium and neon are both in Group VIII (modern Group 18),</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">because their outer shells are full. Helium has 2 outer</text><text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">electrons, not 8. He is in Period 1; Ne is in Period 2.</text></g><text x="24" y="849" font-size="19" font-weight="400" text-anchor="start" fill="#1c2d4b">MARLBRIDGE  •  Schematic; structures and particles are not to scale.</text></g><image href="data:image/svg+xml;base64," x="1310" y="816" width="178" height="43" preserveAspectRatio="xMidYMid meet"/></svg>
