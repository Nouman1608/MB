<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1185" viewBox="0 0 1800 2370" role="img" aria-labelledby="title desc"><title id="title">Paper chromatography method</title><desc id="desc">Start: a paper strip with a pencil line and a spot of mixture stands in a little solvent, with the line above the solvent. Later: the solvent has risen to the solvent front and the mixture has separated into yellow, blue and orange spots. Bottom strip, marked not required by Edexcel or OxfordAQA: colourless spots are invisible until a locating agent is sprayed, then the spots appear. No tier labels.</desc><rect width="1800" height="2370" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="112" font-size="66" font-weight="700" fill="#1E2B47" text-anchor="middle">Colours travel up the paper</text>
