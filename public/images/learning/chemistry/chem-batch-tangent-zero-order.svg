<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Concentration–time tangents and zero-order slope</title><desc id="desc">A curved reactant concentration trace has a steep initial tangent and a shallower later tangent. A zero-order trace is a straight line with constant negative gradient, whose magnitude is k.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#18324b}.title{font-size:36px;font-weight:700}.head{font-size:27px;font-weight:700}.label{font-size:22px}.small{font-size:19px}.axis{stroke:#18324b;stroke-width:3}</style><rect width="1600" height="900" fill="#fff"/><text x="800" y="58" class="title" text-anchor="middle">Read concentration–time graphs with tangents</text>
<rect x="45" y="100" width="740" height="690" rx="20" fill="#f1f7f8" stroke="#c8d6df" stroke-width="2"/><rect x="815" y="100" width="740" height="690" rx="20" fill="#f7f5ee" stroke="#c8d6df" stroke-width="2"/><text x="415" y="150" class="head" text-anchor="middle">Curved trace: rate changes with time</text><text x="1185" y="150" class="head" text-anchor="middle">Zero order: constant rate</text>
<path d="M140 690V220M140 690H710" class="axis"/><text x="82" y="225" class="label">[A]</text><text x="700" y="735" class="label">time</text><path d="M150 260 C300 430 460 570 690 630" fill="none" stroke="#298078" stroke-width="6"/><path d="M140 249 L300 430" fill="none" stroke="#c15c4b" stroke-width="4"/><path d="M390 492 L570 597" fill="none" stroke="#477cac" stroke-width="4"/><circle cx="150" cy="260" r="7" fill="#c15c4b"/><circle cx="472" cy="540" r="7" fill="#477cac"/><text x="205" y="270" class="label" fill="#a84439">t = 0 tangent</text><text x="455" y="520" class="label" fill="#315e8a">later tangent</text><text x="205" y="770" class="small">Initial rate = slope magnitude at t = 0</text>
<path d="M910 690V220M910 690H1480" class="axis"/><text x="852" y="225" class="label">[A]</text><text x="1470" y="735" class="label">time</text><path d="M930 300L1450 630" fill="none" stroke="#298078" stroke-width="6"/><path d="M930 300L1450 630" fill="none" stroke="#c15c4b" stroke-width="3" stroke-dasharray="11 8"/><text x="980" y="225" class="label" fill="#a84439">same gradient at every time</text><text x="980" y="265" class="label">gradient = −k</text><text x="980" y="305" class="label">k = positive slope magnitude</text><text x="800" y="818" class="small" text-anchor="middle">Conceptual sketches • reactant concentration falls as it is consumed</text><text x="800" y="842" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".06">MARLBRIDGE STUDY RESOURCES</text><path d="M52 852H1548" stroke="#C9A227" stroke-width="2"/><text x="54" y="886" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1380" y="858" width="168" height="41" preserveAspectRatio="xMidYMid meet"/></svg>
