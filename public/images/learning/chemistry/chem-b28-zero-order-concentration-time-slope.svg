<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#C44949"/></marker><marker id="tealarrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#168C8C"/></marker><marker id="goldarrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#C9A227"/></marker></defs><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#10233F">Zero-order reaction: read k from the graph</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="500" fill="#5B6D80">AQA worked example • concentration–time gradient is −k</text><rect x="52" y="132" width="1424" height="650" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="82" y="178" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#10233F">Zero-order reactant X • concentration falls at a constant rate</text><rect x="82" y="210" width="890" height="490" rx="12" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="1000" y="210" width="444" height="490" rx="12" fill="#E8F1F4" stroke="#D3DCE2" stroke-width="2"/><path d="M180 610V278M180 610H874" stroke="#10233F" stroke-width="3"/><text x="120" y="442" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">[X] / mol dm⁻³</text><text x="523" y="652" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">Time / s</text><path d="M174 610h12" stroke="#10233F" stroke-width="2"/><text x="161" y="616" text-anchor="end" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">0</text><path d="M174 478h12" stroke="#10233F" stroke-width="2"/><text x="161" y="484" text-anchor="end" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">0.32</text><path d="M174 346h12" stroke="#10233F" stroke-width="2"/><text x="161" y="352" text-anchor="end" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">0.64</text><path d="M174 280h12" stroke="#10233F" stroke-width="2"/><text x="161" y="286" text-anchor="end" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">0.80</text><path d="M180 604v12" stroke="#10233F" stroke-width="2"/><text x="180" y="636" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">0</text><path d="M411 604v12" stroke="#10233F" stroke-width="2"/><text x="411" y="636" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">100</text><path d="M642 604v12" stroke="#10233F" stroke-width="2"/><text x="642" y="636" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">200</text><path d="M874 604v12" stroke="#10233F" stroke-width="2"/><text x="874" y="636" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">300</text><path d="M180 280L874 460" fill="none" stroke="#168C8C" stroke-width="6"/><circle cx="180" cy="280" r="7" fill="#C9A227"/><circle cx="874" cy="460" r="7" fill="#C9A227"/><text x="214" y="320" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#20314B">(0 s, 0.80 mol dm⁻³)</text><text x="622" y="446" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#20314B">(300 s, 0.44 mol dm⁻³)</text><text x="1032" y="260" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#10233F">Zero order in X</text><text x="1032" y="312" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#20314B">Rate = k, so rate is constant</text><text x="1032" y="342" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#20314B">while X is consumed.</text><rect x="1032" y="382" width="376" height="120" rx="10" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="1056" y="421" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#315F86">gradient = Δ[X] / Δt</text><text x="1056" y="457" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">= (0.44 − 0.80) / 300</text><text x="1056" y="484" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#20314B">= −1.2 × 10⁻³ mol dm⁻³ s⁻¹</text><rect x="1032" y="525" width="376" height="96" rx="10" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/><text x="1056" y="565" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">k = −gradient</text><text x="1056" y="595" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#20314B">= 1.2 × 10⁻³ mol dm⁻³ s⁻¹</text><text x="1032" y="654" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#5B6D80">Straight line is the diagnostic</text><text x="1032" y="676" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#5B6D80">concentration–time pattern here.</text><text x="764" y="862" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".06">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE  •  STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="887" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
