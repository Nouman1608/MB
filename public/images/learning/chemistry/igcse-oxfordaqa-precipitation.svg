<text x="900" y="1920" font-size="48" font-weight="700" fill="#1E2B47" text-anchor="middle" xml:space="preserve"><tspan>AgNO</tspan><tspan dy="13.4" font-size="32.6">3</tspan><tspan dy="-13.4">(aq) + NaCl(aq) → AgCl(s) + NaNO</tspan><tspan dy="13.4" font-size="32.6">3</tspan><tspan dy="-13.4">(aq)</tspan></text>
<text x="900" y="2004" font-size="40" fill="#4B5B72" text-anchor="middle">Example: silver chloride is an insoluble chloride</text></g></svg>
