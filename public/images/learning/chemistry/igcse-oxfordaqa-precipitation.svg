<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1040" viewBox="0 0 1800 2080" role="img" aria-labelledby="title desc"><title id="title">Making an insoluble salt (OxfordAQA International GCSE Chemistry)</title><desc id="desc">No tier label: OxfordAQA International GCSE Chemistry is not tiered; insoluble salts made by mixing solutions are 9202 statement 3.5.2c. Mix two solutions: clear AgNO3(aq) and clear NaCl(aq) give a white solid, AgCl(s), in NaNO3(aq). Then separate the solid: 1 filter, 2 wash with water, 3 dry. No evaporation is needed because the salt never dissolved. AgNO3(aq) + NaCl(aq) → AgCl(s) + NaNO3(aq); silver chloride is an insoluble chloride.</desc><rect width="1800" height="2080" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="92" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle">Making an insoluble salt</text>
