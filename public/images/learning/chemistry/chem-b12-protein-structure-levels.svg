<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="870" viewBox="0 0 1528 870" role="img" aria-labelledby="title desc"><title id="title">Protein structure: primary to tertiary</title><desc id="desc">Amino-acid sequence is primary structure; hydrogen-bonded helix and sheet are secondary; tertiary folding includes side-chain interactions such as an S–S link between cysteines.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#172b3c"/></marker><marker id="tealArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#288a83"/></marker></defs><style>text{font-family:Arial,"Liberation Sans",sans-serif}</style><rect width="100%" height="100%" fill="#fbfcfa"/><text x="44" y="58" font-size="34" fill="#172b3c" font-weight="700">Protein structure: primary to tertiary</text><rect x="40" y="95" width="1448" height="690" rx="26" fill="#f2f7f6"/><rect x="65" y="135" width="420" height="560" rx="20" fill="white" stroke="#c9d8dc" stroke-width="2"/><rect x="65" y="135" width="420" height="10" rx="5" fill="#288a83"/><text x="87" y="180" font-size="25" fill="#172b3c" font-weight="700">1  Primary sequence</text><text x="87" y="217" font-size="21" fill="#203545" font-weight="400">N-terminus → Gly – Ala – Ser</text><text x="87" y="243.25" font-size="21" fill="#203545" font-weight="400">– Cys – … → C-terminus</text><text x="87" y="269.5" font-size="21" fill="#203545" font-weight="400">Peptide links make the</text><text x="87" y="295.75" font-size="21" fill="#203545" font-weight="400">covalent backbone.</text><text x="105" y="390" font-size="33" fill="#172b3c" font-weight="700">N</text><line x1="140" y1="380" x2="185" y2="380" stroke="#288a83" stroke-width="4"  marker-end="url(#arrow)"/><text x="195" y="390" font-size="25" fill="#203545" font-weight="400">Gly</text><line x1="245" y1="380" x2="290" y2="380" stroke="#288a83" stroke-width="4"  marker-end="url(#arrow)"/><text x="300" y="390" font-size="25" fill="#203545" font-weight="400">Ala</text><line x1="355" y1="380" x2="400" y2="380" stroke="#288a83" stroke-width="4"  marker-end="url(#arrow)"/><text x="410" y="390" font-size="25" fill="#203545" font-weight="400">Ser</text><rect x="555" y="135" width="420" height="560" rx="20" fill="white" stroke="#c9d8dc" stroke-width="2"/><rect x="555" y="135" width="420" height="10" rx="5" fill="#e5b94c"/><text x="577" y="180" font-size="25" fill="#172b3c" font-weight="700">2  Secondary</text><text x="577" y="217" font-size="21" fill="#203545" font-weight="400">α-helix: coil held by</text><text x="577" y="243.25" font-size="21" fill="#203545" font-weight="400">peptide C=O···H–N hydrogen</text><text x="577" y="269.5" font-size="21" fill="#203545" font-weight="400">bonds.</text><text x="577" y="295.75" font-size="21" fill="#203545" font-weight="400">β-sheet: neighbouring chain</text><text x="577" y="322" font-size="21" fill="#203545" font-weight="400">sections joined by hydrogen</text><text x="577" y="348.25" font-size="21" fill="#203545" font-weight="400">bonds.</text><path d="M630 370 C650 300 710 300 730 370 C750 440 810 440 830 370 C850 300 910 300 930 370" fill="none" stroke="#288a83" stroke-width="7"/><line x1="670" y1="470" x2="890" y2="470" stroke="#c45637" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/><text x="710" y="510" font-size="24" fill="#172b3c" font-weight="700">C=O ··· H–N</text><rect x="1045" y="135" width="420" height="560" rx="20" fill="white" stroke="#c9d8dc" stroke-width="2"/><rect x="1045" y="135" width="420" height="10" rx="5" fill="#c45637"/><text x="1067" y="180" font-size="25" fill="#172b3c" font-weight="700">3  Tertiary</text><text x="1067" y="217" font-size="21" fill="#203545" font-weight="400">The whole chain folds in 3D.</text><text x="1067" y="243.25" font-size="21" fill="#203545" font-weight="400">A covalent S–S bond can join</text><text x="1067" y="269.5" font-size="21" fill="#203545" font-weight="400">two cysteine side chains.</text><path d="M1110 360 C1160 300 1210 430 1260 350 S1360 320 1400 410 S1300 480 1240 430 S1150 500 1110 430" fill="none" stroke="#172b3c" stroke-width="8"/><line x1="1190" y1="360" x2="1320" y2="430" stroke="#c45637" stroke-width="4"  marker-end="url(#arrow)"/><text x="1185" y="520" font-size="24" fill="#c45637" font-weight="700">Cys–S–S–Cys</text><line x1="40" y1="816" x2="1488" y2="816" stroke="#d9e3e4"/><text x="44" y="848" font-size="16" fill="#607783" font-weight="600">MARLBRIDGE  •  Schematic; not to scale</text></svg>
