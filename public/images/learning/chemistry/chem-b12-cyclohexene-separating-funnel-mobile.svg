<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1120" viewBox="0 0 768 1120" role="img" aria-labelledby="title desc"><title id="title">Separating-funnel workup of cyclohexene</title><desc id="desc">After carbonate washing, the less-dense organic cyclohexene layer is on top. Vent carbon dioxide pressure and run off the lower aqueous layer.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#172b3c"/></marker><marker id="tealArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#288a83"/></marker></defs><style>text{font-family:Arial,"Liberation Sans",sans-serif}</style><rect width="100%" height="100%" fill="#fbfcfa"/><text x="44" y="58" font-size="30" fill="#172b3c" font-weight="700">Separating-funnel workup of cyclohexene</text><rect x="28" y="90" width="712" height="940" rx="24" fill="#f2f7f6"/><path d="M290 210 L478 210 L458 265 L435 345 L420 485 L348 485 L333 345 L310 265Z" fill="white" stroke="#172b3c" stroke-width="5"/><path d="M319 300 L449 300 L420 415 L348 415Z" fill="#dcefe9"/><path d="M330 350 L438 350 L420 415 L348 415Z" fill="#d9e6f5"/><line x1="319" y1="300" x2="449" y2="300" stroke="#288a83" stroke-width="4"/><text x="65" y="160" font-size="25" fill="#c45637" font-weight="700">VENT frequently: CO₂</text><text x="65" y="550" font-size="25" fill="#288a83" font-weight="700">TOP: keep organic layer</text><text x="65" y="590" font-size="23" fill="#203545" font-weight="400">Cyclohexene</text><text x="65" y="670" font-size="25" fill="#172b3c" font-weight="700">LOWER: drain aqueous wash</text><text x="65" y="710" font-size="23" fill="#203545" font-weight="400">Then discard</text><line x1="270" y1="575" x2="330" y2="380" stroke="#288a83" stroke-width="3"  marker-end="url(#arrow)"/><line x1="280" y1="680" x2="350" y2="420" stroke="#172b3c" stroke-width="3"  marker-end="url(#arrow)"/><rect x="60" y="790" width="648" height="150" rx="20" fill="white" stroke="#c9d8dc" stroke-width="2"/><rect x="60" y="790" width="648" height="10" rx="5" fill="#e5b94c"/><text x="82" y="835" font-size="25" fill="#172b3c" font-weight="700">Order</text><text x="82" y="872" font-size="21" fill="#203545" font-weight="400">Shake gently, vent, settle, drain lower</text><text x="82" y="898.25" font-size="21" fill="#203545" font-weight="400">layer.</text><line x1="40" y1="1066" x2="728" y2="1066" stroke="#d9e3e4"/><text x="44" y="1098" font-size="16" fill="#607783" font-weight="600">MARLBRIDGE  •  Schematic; not to scale</text></svg>
