<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#C44949"/></marker><marker id="goldarrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#C9A227"/></marker><marker id="tealarrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#168C8C"/></marker></defs><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#10233F">Acyl chloride + ethylamine: addition–elimination</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="500" fill="#5B6D80">Five curved-arrow moves • a second amine molecule acts as a base</text><rect x="52" y="132" width="1424" height="650" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="82" y="176" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233F">Pentanoyl chloride + ethylamine • addition–elimination, then acid–base neutralisation</text><rect x="82" y="212" width="442" height="492" rx="12" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="568" y="212" width="442" height="492" rx="12" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="1054" y="212" width="442" height="492" rx="12" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="106" y="254" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">1  N attacks C=O</text><text x="106" y="302" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#20314B">C₄H₉–C(=O)–Cl  +  :NH₂Et</text><text x="106" y="418" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#168C8C">N lone pair → carbonyl C</text><text x="106" y="449" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#C44949">C=O π pair → O</text><path d="M398 355 C357 330 295 330 248 355" fill="none" stroke="#C44949" stroke-width="4" marker-end="url(#arrow)"/><path d="M257 383 C263 363 279 363 286 383" fill="none" stroke="#C44949" stroke-width="3" marker-end="url(#arrow)"/><text x="592" y="254" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233F">2  Tetrahedral intermediate</text><text x="592" y="311" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#20314B">C₄H₉–C(O⁻)(Cl)–N⁺H₂Et</text><path d="M744 357 C732 337 708 337 696 357" fill="none" stroke="#168C8C" stroke-width="4" marker-end="url(#tealarrow)"/><path d="M772 392 C790 415 814 417 831 403" fill="none" stroke="#C44949" stroke-width="4" marker-end="url(#arrow)"/><text x="592" y="439" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#168C8C">O⁻ lone pair → C=O</text><text x="592" y="469" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#C44949">C–Cl bond pair → Cl⁻</text><text x="592" y="515" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">Carbonyl reforms; chloride leaves.</text><path d="M896 330H1026" fill="none" stroke="#C9A227" stroke-width="4" marker-end="url(#goldarrow)"/><text x="1078" y="254" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">3  A second amine removes H⁺</text><text x="1078" y="311" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">C₄H₉–C(=O)–N⁺H₂Et + :NH₂Et</text><path d="M1386 360 C1354 337 1306 337 1277 360" fill="none" stroke="#168C8C" stroke-width="4" marker-end="url(#tealarrow)"/><path d="M1272 393 C1264 410 1248 416 1234 404" fill="none" stroke="#C44949" stroke-width="4" marker-end="url(#arrow)"/><text x="1078" y="437" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#168C8C">EtNH₂ lone pair → N–H proton</text><text x="1078" y="466" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#C44949">N–H bond pair → amide N</text><text x="1078" y="493" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">Net products</text><text x="1078" y="521" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#168C8C">N-ethylpentanamide</text><text x="1078" y="547" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">+ EtNH₃⁺  +  Cl⁻</text><rect x="104" y="558" width="1288" height="94" rx="8" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/><text x="748" y="591" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">Overall: C₄H₉COCl + 2C₂H₅NH₂ → C₄H₉CONHC₂H₅ + C₂H₅NH₃⁺Cl⁻</text><text x="748" y="625" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#20314B">One ethylamine is the nucleophile; a second acts as a base and captures the acid by-product.</text><text x="764" y="862" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".06">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE  •  STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="887" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
