<svg xmlns="http://www.w3.org/2000/svg" width="900" height="920" viewBox="0 0 1800 1840" role="img" aria-labelledby="title desc"><title id="title">Redox by electron transfer</title><desc id="desc">No tier label: oxidation and reduction as loss and gain of electrons are on both Edexcel International GCSE papers (4CH1 2.20) and OxfordAQA International GCSE Chemistry is not tiered (9202 3.8.4b). Zn + CuSO4(aq) → ZnSO4(aq) + Cu. Oxidation: a zinc atom loses 2 electrons to become Zn2+. The 2 electrons pass to a Cu2+ ion. Reduction: Cu2+ gains 2 electrons to become a copper atom. Electrons are not lost overall: one loses, the other gains.</desc><rect width="1800" height="1840" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="92" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle">Redox by electron transfer</text>
<text x="900" y="174" font-size="40" fill="#4B5B72" text-anchor="middle" xml:space="preserve"><tspan>Zn + CuSO</tspan><tspan dy="11.2" font-size="27.2">4</tspan><tspan dy="-11.2">(aq) → ZnSO</tspan><tspan dy="11.2" font-size="27.2">4</tspan><tspan dy="-11.2">(aq) + Cu</tspan></text>
<circle cx="300" cy="580" r="116" fill="#E3E8F0" stroke="#3A4558" stroke-width="6"/>
<text x="300" y="595.84" font-size="44" font-weight="700" fill="#3A4558" text-anchor="middle">Zn</text>
<line x1="440" y1="580" x2="658" y2="580" stroke="#8A6A0C" stroke-width="8" stroke-linecap="round"/><polygon points="722,580 656,613 656,547" fill="#8A6A0C"/>
<circle cx="860" cy="580" r="116" fill="#E3E8F0" stroke="#3A4558" stroke-width="6"/>
<text x="860" y="595.84" font-size="44" font-weight="700" fill="#3A4558" text-anchor="middle" xml:space="preserve"><tspan>Zn</tspan><tspan dy="-16.7" font-size="29.9">2+</tspan></text>
<text x="1072" y="560" font-size="52" font-weight="700" fill="#8A6A0C">OXIDATION</text>
<text x="1072" y="636" font-size="42" fill="#1E2B47" xml:space="preserve"><tspan>Zn loses 2 e</tspan><tspan dy="-16" font-size="28.6">−</tspan></text>
<line x1="580" y1="648" x2="580" y2="1254" stroke="#1E2B47" stroke-width="8" stroke-linecap="round"/><polygon points="580,1318 547,1252 613,1252" fill="#1E2B47"/>
<circle cx="460" cy="980" r="54" fill="#F2E6B7" stroke="#8A6A0C" stroke-width="6"/>
<text x="460" y="992.96" font-size="36" font-weight="700" fill="#8A6A0C" text-anchor="middle" xml:space="preserve"><tspan>e</tspan><tspan dy="-13.7" font-size="24.5">−</tspan></text>
<circle cx="700" cy="980" r="54" fill="#F2E6B7" stroke="#8A6A0C" stroke-width="6"/>
<text x="700" y="992.96" font-size="36" font-weight="700" fill="#8A6A0C" text-anchor="middle" xml:space="preserve"><tspan>e</tspan><tspan dy="-13.7" font-size="24.5">−</tspan></text>
<text x="784" y="994" font-size="42" fill="#4B5B72">2 electrons</text>
<circle cx="300" cy="1380" r="116" fill="#D2E5EC" stroke="#2B6E8C" stroke-width="6"/>
<text x="300" y="1395.84" font-size="44" font-weight="700" fill="#2B6E8C" text-anchor="middle" xml:space="preserve"><tspan>Cu</tspan><tspan dy="-16.7" font-size="29.9">2+</tspan></text>
<line x1="440" y1="1380" x2="658" y2="1380" stroke="#2F6B63" stroke-width="8" stroke-linecap="round"/><polygon points="722,1380 656,1413 656,1347" fill="#2F6B63"/>
<circle cx="860" cy="1380" r="116" fill="#F2D4C2" stroke="#B9632F" stroke-width="6"/>
<text x="860" y="1395.84" font-size="44" font-weight="700" fill="#B9632F" text-anchor="middle">Cu</text>
<text x="1072" y="1360" font-size="52" font-weight="700" fill="#2F6B63">REDUCTION</text>
<text x="1072" y="1436" font-size="42" fill="#1E2B47" xml:space="preserve"><tspan>Cu</tspan><tspan dy="-16" font-size="28.6">2+</tspan><tspan dy="16"> gains 2 e</tspan><tspan dy="-16" font-size="28.6">−</tspan></text>
<text x="900" y="1676" font-size="44" fill="#4B5B72" text-anchor="middle">Electrons are not lost overall:</text>
<text x="900" y="1740" font-size="44" fill="#4B5B72" text-anchor="middle">one loses, the other gains</text></g></svg>
