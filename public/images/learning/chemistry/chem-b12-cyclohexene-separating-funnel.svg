<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="870" viewBox="0 0 1528 870" role="img" aria-labelledby="title desc"><title id="title">Separating-funnel workup of cyclohexene</title><desc id="desc">After carbonate washing, the less-dense organic cyclohexene layer is on top. Vent carbon dioxide pressure and run off the lower aqueous layer.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#172b3c"/></marker><marker id="tealArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#288a83"/></marker></defs><style>text{font-family:Arial,"Liberation Sans",sans-serif}</style><rect width="100%" height="100%" fill="#fbfcfa"/><text x="44" y="58" font-size="34" fill="#172b3c" font-weight="700">Separating-funnel workup of cyclohexene</text><rect x="40" y="95" width="1448" height="690" rx="26" fill="#f2f7f6"/><path d="M650 160 L870 160 L850 205 L830 270 L800 370 L800 460 L720 460 L720 370 L690 270 L670 205Z" fill="white" stroke="#172b3c" stroke-width="5"/><path d="M684 240 L836 240 L800 365 L800 365 L720 365Z" fill="#dcefe9"/><path d="M702 285 L818 285 L800 365 L720 365Z" fill="#d9e6f5"/><line x1="684" y1="240" x2="836" y2="240" stroke="#288a83" stroke-width="4"/><text x="80" y="220" font-size="30" fill="#288a83" font-weight="700">TOP: organic cyclohexene</text><text x="80" y="265" font-size="24" fill="#203545" font-weight="400">Keep this layer; it is less</text><text x="80" y="295" font-size="24" fill="#203545" font-weight="400">dense than the aqueous wash.</text><line x1="440" y1="258" x2="655" y2="258" stroke="#288a83" stroke-width="4"  marker-end="url(#arrow)"/><text x="1000" y="350" font-size="29" fill="#172b3c" font-weight="700">LOWER: aqueous Na₂CO₃ wash</text><text x="1000" y="395" font-size="24" fill="#203545" font-weight="400">Contains water and neutralised</text><text x="1000" y="425" font-size="24" fill="#203545" font-weight="400">acid; run off and discard.</text><line x1="995" y1="390" x2="840" y2="355" stroke="#172b3c" stroke-width="4"  marker-end="url(#arrow)"/><line x1="760" y1="150" x2="760" y2="110" stroke="#c45637" stroke-width="4"  marker-end="url(#arrow)"/><text x="840" y="145" font-size="25" fill="#c45637" font-weight="700">VENT often</text><text x="1000" y="535" font-size="23" fill="#203545" font-weight="400">CO₂ forms during</text><text x="1000" y="563.75" font-size="23" fill="#203545" font-weight="400">neutralisation. Point away</text><text x="1000" y="592.5" font-size="23" fill="#203545" font-weight="400">from people.</text><line x1="1000" y1="500" x2="805" y2="175" stroke="#c45637" stroke-width="3"  marker-end="url(#arrow)"/><text x="815" y="480" font-size="21" fill="#172b3c" font-weight="700">Stopcock</text><rect x="180" y="610" width="1168" height="105" rx="20" fill="white" stroke="#c9d8dc" stroke-width="2"/><rect x="180" y="610" width="1168" height="10" rx="5" fill="#e5b94c"/><text x="202" y="655" font-size="25" fill="#172b3c" font-weight="700">Sequence</text><text x="202" y="692" font-size="21" fill="#203545" font-weight="400">Shake gently → invert and vent frequently → allow layers to settle → drain</text><text x="202" y="718.25" font-size="21" fill="#203545" font-weight="400">lower aqueous layer.</text><line x1="40" y1="816" x2="1488" y2="816" stroke="#d9e3e4"/><text x="44" y="848" font-size="16" fill="#607783" font-weight="600">MARLBRIDGE  •  Schematic; not to scale</text></svg>
