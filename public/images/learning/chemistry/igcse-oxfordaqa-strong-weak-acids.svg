<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1090" viewBox="0 0 1800 2180" role="img" aria-labelledby="title desc"><title id="title">Strong and weak acids (OxfordAQA International GCSE Chemistry)</title><desc id="desc">No tier label: OxfordAQA International GCSE Chemistry is not tiered, and weak acids are in the 9202 specification (3.10.3.2b: carboxylic acids do not ionise completely in water, so are weak acids). Ten particles of each acid. Strong, hydrochloric acid: all ten split into H+ and Cl- ions, HCl(aq) → H+(aq) + Cl-(aq). Weak, ethanoic acid: only two of ten split into H+ and A- ions and eight stay as whole HA molecules, CH3COOH(aq) ⇌ H+(aq) + CH3COO-(aq). Strength is how much an acid splits, not how concentrated it is.</desc><rect width="1800" height="2180" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="92" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle">Strong and weak acids</text>
