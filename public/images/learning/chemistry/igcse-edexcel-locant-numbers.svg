<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1150" viewBox="0 0 1800 2300" role="img" aria-labelledby="title desc"><title id="title">The number shows where (Edexcel International GCSE Chemistry: Paper 2 only)</title><desc id="desc">Marked Paper 2 only: alcohols are 4CH1 statement 4.30C, in bold. 4.30C names propanol (propan-1-ol only) and butanol (butan-1-ol only), so the propan-2-ol and butan-2-ol panels are marked not required by Edexcel. Displayed formulae with the carbons numbered: propan-1-ol, –OH on an end carbon; propan-2-ol, –OH on the middle carbon; butan-1-ol, –OH on an end carbon; butan-2-ol, –OH on carbon 2.</desc><rect width="1800" height="2300" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="92" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle">The number shows where</text>
<text x="900" y="172" font-size="42" fill="#4B5B72" text-anchor="middle">Count the carbons along the chain</text>
