<svg xmlns="http://www.w3.org/2000/svg" width="900" height="880" viewBox="0 0 1800 1760" role="img" aria-labelledby="title desc"><title id="title">Heating curve (Edexcel International GCSE Chemistry)</title><desc id="desc">No tier label: the interconversions between states of matter and the changes in particle arrangement, movement and energy are 4CH1 statement 1.2, on both papers. Sketch graph, not experimental data: temperature against time with steady heating. A, solid: temperature rises. B, melting: flat at the melting point. C, liquid: temperature rises. D, boiling: flat at the boiling point. E, gas: temperature rises. On the flat parts the energy goes into overcoming forces between particles. Particle boxes show A solid (regular rows), B melting (some particles breaking away), C liquid (close but random), D boiling (particles escaping upwards) and E gas (far apart, moving fast).</desc><rect width="1800" height="1760" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="92" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle">Heating curve</text>
