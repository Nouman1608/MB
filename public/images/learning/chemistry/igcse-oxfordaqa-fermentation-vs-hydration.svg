<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1010" viewBox="0 0 1800 2020" role="img" aria-labelledby="title desc"><title id="title">Fermentation or steam and ethene? (OxfordAQA International GCSE Chemistry)</title><desc id="desc">No tier label: OxfordAQA International GCSE Chemistry is not tiered, and 9202 statement 3.10.1.1f asks students to compare the two ways of making ethanol. Fermentation: renewable raw material from plants, slow, gives a dilute solution that must be distilled to purify it, mild conditions of 20–35 °C (the range in 9202 3.10.1.1g). Steam and ethene: non-renewable raw material from crude oil, fast, gives pure ethanol in a continuous process, needs high temperature and pressure (about 300 °C and 6000 kPa). No route wins outright.</desc><rect width="1800" height="2020" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="92" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle">Which route is better?</text>
<text x="900" y="174" font-size="42" fill="#4B5B72" text-anchor="middle">No winner: each has trade-offs</text>
<rect x="120" y="240" width="760" height="100" rx="50" fill="#2F6B63"/>
<text x="500" y="308" font-size="50" font-weight="700" fill="#FFFFFF" text-anchor="middle">Fermentation</text>
