<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="1515" viewBox="0 0 1528 1515" role="img" aria-labelledby="title desc"><title id="title">Bromine + ethene: follow all five electron-pair arrows</title><desc id="desc">An original four-panel full-pair mechanism includes three concerted arrows forming cyclic bromonium and Br−, two arrows opening the bridge, correct Br lone-pair counts and neutral 1,2-dibromoethane under a non-nucleophilic-medium assumption.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#1c2d4b"/></marker><marker id="red" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#b75e53"/></marker><marker id="blue" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#357ea2"/></marker></defs><rect width="100%" height="100%" fill="#f5f8f7"/><g font-family="Arial, sans-serif"><text x="24" y="58" font-size="38" font-weight="700" text-anchor="start" fill="#1c2d4b">Bromine + ethene: follow all five electron-pair arrows</text><text x="24" y="104" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Bridge formation, charge accounting, ring opening and product</text><g transform="translate(24,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">1. Form the bridge as Br–Br breaks</text><text x="220" y="309" font-size="29" font-weight="700" text-anchor="middle" fill="#1c2d4b">CH₂</text><text x="440" y="309" font-size="29" font-weight="700" text-anchor="middle" fill="#1c2d4b">CH₂</text><path d="M270.0,295.0 L390.0,295.0" fill="none" stroke="#1c2d4b" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M270.0,305.0 L390.0,305.0" fill="none" stroke="#1c2d4b" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="330" y="149" font-size="29" font-weight="700" text-anchor="middle" fill="#1c2d4b">Br</text><text x="570" y="149" font-size="29" font-weight="700" text-anchor="middle" fill="#1c2d4b">Br</text><path d="M360.0,140.0 L540.0,140.0" fill="none" stroke="#1c2d4b" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="293" cy="108" r="3" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="303" cy="108" r="3" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="325" cy="90" r="3" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="335" cy="90" r="3" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="325" cy="185" r="3" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="335" cy="185" r="3" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><text x="330" y="235" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">δ+</text><text x="570" y="235" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">δ−</text><path d="M330,305 C240,260 240,175 305,155" fill="none" stroke="#357ea2" stroke-width="4" marker-end="url(#blue)"/><path d="M450,140 C450,75 570,65 570,105" fill="none" stroke="#b75e53" stroke-width="4" marker-end="url(#red)"/><path d="M298,108 C390,65 495,205 457,275" fill="none" stroke="#357ea2" stroke-width="4" marker-end="url(#blue)"/><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Three full curly arrows act together: π pair → near Br; Br–Br</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">pair → departing Br; a near-Br lone pair → the other C. The</text><text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">induced δ charges are partial charges in the approaching Br₂</text><text x="35" y="593" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">molecule.</text></g><g transform="translate(784,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">2. Check the intermediate and charge</text><text x="220" y="319" font-size="29" font-weight="700" text-anchor="middle" fill="#1c2d4b">CH₂</text><text x="440" y="319" font-size="29" font-weight="700" text-anchor="middle" fill="#1c2d4b">CH₂</text><path d="M270.0,310.0 L390.0,310.0" fill="none" stroke="#1c2d4b" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="330" y="164" font-size="29" font-weight="700" text-anchor="middle" fill="#1c2d4b">Br⁺</text><path d="M245.0,280.0 L310.0,180.0" fill="none" stroke="#1c2d4b" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M415.0,280.0 L350.0,180.0" fill="none" stroke="#1c2d4b" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="287" cy="135" r="3" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="297" cy="135" r="3" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="363" cy="135" r="3" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="373" cy="135" r="3" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><text x="585" y="324" font-size="29" font-weight="700" text-anchor="middle" fill="#1c2d4b">Br⁻</text><circle cx="580" cy="265" r="3" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="590" cy="265" r="3" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="625" cy="315" r="3" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="635" cy="315" r="3" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="580" cy="365" r="3" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="590" cy="365" r="3" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="535" cy="315" r="3" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="545" cy="315" r="3" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><text x="360" y="435" font-size="28" font-weight="700" text-anchor="middle" fill="#1c2d4b">bromonium (+1) + bromide (−1)</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">The bridged Br has two C–Br bonds and two lone pairs, giving</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">formal charge +1. The C–C σ bond stays. Bromide has four</text><text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">lone pairs. A free open carbocation is not the intermediate in</text><text x="35" y="593" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">this bridged pathway.</text></g><g transform="translate(24,816)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">3. Br⁻ opens the bridge from the back</text><text x="260" y="309" font-size="29" font-weight="700" text-anchor="middle" fill="#1c2d4b">CH₂</text><text x="470" y="309" font-size="29" font-weight="700" text-anchor="middle" fill="#1c2d4b">CH₂</text><path d="M305.0,300.0 L425.0,300.0" fill="none" stroke="#1c2d4b" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="365" y="149" font-size="29" font-weight="700" text-anchor="middle" fill="#1c2d4b">Br⁺</text><path d="M280.0,270.0 L345.0,165.0" fill="none" stroke="#1c2d4b" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M450.0,270.0 L385.0,165.0" fill="none" stroke="#1c2d4b" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="325" cy="110" r="3" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="335" cy="110" r="3" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="400" cy="110" r="3" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="410" cy="110" r="3" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><text x="100" y="399" font-size="29" font-weight="700" text-anchor="middle" fill="#1c2d4b">Br⁻</text><circle cx="120" cy="350" r="3" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="130" cy="350" r="3" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><path d="M125,350 C125,280 180,265 225,290" fill="none" stroke="#357ea2" stroke-width="4" marker-end="url(#blue)"/><path d="M310,218 C265,180 290,105 335,128" fill="none" stroke="#b75e53" stroke-width="4" marker-end="url(#red)"/><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">A bromide lone pair forms a C–Br bond while the bond from</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">that C to the bridge Br returns its pair to Br. The two arrows are</text><text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">concerted. Opposite-face attack gives anti addition; this 2D</text><text x="35" y="593" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">projection does not itself show front/back depth.</text></g><g transform="translate(784,816)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">4. Product: 1,2-dibromoethane</text><text x="85" y="244" font-size="29" font-weight="700" text-anchor="middle" fill="#1c2d4b">Br</text><path d="M108.0,235.0 L226.0,235.0" fill="none" stroke="#1c2d4b" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="265" y="244" font-size="29" font-weight="700" text-anchor="middle" fill="#1c2d4b">CH₂</text><path d="M304.0,235.0 L406.0,235.0" fill="none" stroke="#1c2d4b" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="445" y="244" font-size="29" font-weight="700" text-anchor="middle" fill="#1c2d4b">CH₂</text><path d="M484.0,235.0 L602.0,235.0" fill="none" stroke="#1c2d4b" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><text x="625" y="244" font-size="29" font-weight="700" text-anchor="middle" fill="#1c2d4b">Br</text><text x="360" y="370" font-size="29" font-weight="700" text-anchor="middle" fill="#1c2d4b">CH₂=CH₂ + Br₂ → BrCH₂CH₂Br</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Net charge returns to zero. Both bromines are retained and</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">C=C becomes C–C. Ethene’s product is achiral, so anti</text><text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">addition does not create a cis/trans pair here. This dibromide</text><text x="35" y="593" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">route assumes a non-nucleophilic medium, not bromine water.</text></g><text x="24" y="1493" font-size="19" font-weight="400" text-anchor="start" fill="#1c2d4b">MARLBRIDGE  •  Schematic; structures and particles are not to scale.</text></g></svg>
