<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1110" viewBox="0 0 1800 2220" role="img" aria-labelledby="title desc"><title id="title">Structural isomers (Edexcel International GCSE Chemistry)</title><desc id="desc">No tier label: isomerism and drawing the possible structures for a molecular formula are 4CH1 statements 4.3 and 4.5, with alkanes (4.21) and alkenes (4.26) up to four or five carbons, all on both papers. Displayed formulae. Both C4H10: butane, CH3CH2CH2CH3, and methylpropane, CH3CH(CH3)CH3. Both C4H8: but-1-ene, CH2=CHCH2CH3, and but-2-ene, CH3CH=CHCH3. Same atoms, joined differently.</desc><rect width="1800" height="2220" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="92" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle">Structural isomers</text>
