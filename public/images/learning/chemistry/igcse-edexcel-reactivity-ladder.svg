<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1089" viewBox="0 0 1800 2178" role="img" aria-labelledby="title desc"><title id="title">The reactivity series (Edexcel International GCSE Chemistry)</title><desc id="desc">No tier label: the reactivity series from reactions with water and dilute acid is 4CH1 statements 2.15 and 2.17, on both papers. Lithium is added between sodium and calcium to match the order in 2.17. Most to least reactive: potassium, sodium, lithium, calcium (all react with cold water, steam and dilute HCl); magnesium (no reaction with cold water, reacts with steam and acid); aluminium (an oxide layer hides its reactions); carbon (not a metal); zinc (none with cold water, slowly with steam, reacts with acid); iron (none with cold water, slowly with steam and acid); hydrogen (not a metal); copper, silver and gold (no reaction with any).</desc><rect width="1800" height="2178" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="92" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle">The reactivity series</text>
