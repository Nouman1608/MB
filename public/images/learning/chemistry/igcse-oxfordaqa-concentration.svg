<text x="900" y="1140" font-size="44" font-weight="700" fill="#2F6B63" text-anchor="middle" xml:space="preserve"><tspan>4 × 0.5 mol = 2 mol in 1 dm</tspan><tspan dy="-16.7" font-size="29.9">3</tspan></text>
