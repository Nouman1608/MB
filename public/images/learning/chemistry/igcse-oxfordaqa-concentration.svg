<text x="120" y="1824" font-size="40" fill="#4B5B72" xml:space="preserve"><tspan>Also: g/dm</tspan><tspan dy="-15.2" font-size="27.2">3</tspan><tspan dy="15.2"> = grams in 1 dm</tspan><tspan dy="-15.2" font-size="27.2">3</tspan></text></g></svg>
