<svg xmlns="http://www.w3.org/2000/svg" width="900" height="980" viewBox="0 0 1800 1960" role="img" aria-labelledby="title desc"><title id="title">Concentration: moles in 1 dm3 (OxfordAQA International GCSE Chemistry)</title><desc id="desc">No tier label: OxfordAQA International GCSE Chemistry is not tiered; 9202 statements 3.6.4a and 3.6.4c cover concentrations in mol/dm3 and in g/dm3. Four beakers each hold 250 cm3 of the same solution with five particles of 0.1 mol, so 0.5 mol each. 4 × 250 cm3 = 1000 cm3 = 1 dm3, and 4 × 0.5 mol = 2 mol in 1 dm3, so the concentration is 2 mol/dm3. Working: cm3 ÷ 1000 = dm3, 250 ÷ 1000 = 0.25 dm3; mol ÷ dm3, 0.5 ÷ 0.25 = 2 mol/dm3. Also: g/dm3 is the grams in 1 dm3.</desc><rect width="1800" height="1960" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="92" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle" xml:space="preserve"><tspan>Concentration: moles in 1 dm</tspan><tspan dy="-24.3" font-size="43.5">3</tspan></text>
