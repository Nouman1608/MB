<svg xmlns="http://www.w3.org/2000/svg" width="900" height="920" viewBox="0 0 1800 1840" role="img" aria-labelledby="title desc"><title id="title">Naming an ester (OxfordAQA International GCSE Chemistry)</title><desc id="desc">No tier label: OxfordAQA International GCSE Chemistry is not tiered; 9202 statement 3.10.3.3a gives the structure of ethyl ethanoate, made from ethanol and ethanoic acid, and it is the one ester students must name. Displayed formulae: ethanol (teal) + ethanoic acid (gold) give the ester ethyl ethanoate + water. In the ester, the CH3CO– part from the acid is gold and the –OCH2CH3 part from the alcohol is teal. The name joins ethyl (from the alcohol) and ethanoate (from the acid), written ethyl ethanoate.</desc><rect width="1800" height="1840" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="92" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle">Naming an ester</text>
