<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">Phenol activation and directing positions</title>
  <desc id="desc">A phenol ring diagram labels the carbon bonded to hydroxyl as position 1, the two ortho positions as 2 and 6, and the para position as 4. An electron-donation pathway links the oxygen lone pair to increased electron density and faster electrophilic substitution. Fused aromatic rings require their own numbering and site analysis.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#137c80"/></marker></defs>
  <rect width="1500" height="900" rx="28" fill="#f7fafc"/>
  <text x="70" y="88" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#17324d">Phenol activates its ring and directs substitution</text>
  <text x="72" y="136" font-family="Arial,sans-serif" font-size="25" fill="#526b80">The oxygen effect is general; the position labels below apply to a single phenol ring.</text>
  <g stroke="#17324d" stroke-width="7" fill="none" stroke-linejoin="round">
    <path d="M360 300 L475 366 L475 498 L360 564 L245 498 L245 366 Z"/>
    <path d="M278 373 L354 329 M444 376 L444 466 M278 491 L351 533" stroke-width="5"/>
  </g>
  <line x1="360" y1="300" x2="360" y2="228" stroke="#17324d" stroke-width="7"/>
  <text x="327" y="208" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#17324d">OH</text>
  <text x="331" y="270" font-family="Arial,sans-serif" font-size="22" fill="#526b80">1</text>
  <circle cx="475" cy="366" r="28" fill="#d8f1ef" stroke="#137c80" stroke-width="3"/><text x="466" y="375" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#075a5c">2</text>
  <circle cx="360" cy="564" r="28" fill="#d8f1ef" stroke="#137c80" stroke-width="3"/><text x="351" y="573" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#075a5c">4</text>
  <circle cx="245" cy="366" r="28" fill="#d8f1ef" stroke="#137c80" stroke-width="3"/><text x="236" y="375" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#075a5c">6</text>
  <text x="120" y="642" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#075a5c">2 / 6: ortho</text>
  <text x="314" y="642" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#075a5c">4: para</text>
  <rect x="650" y="220" width="760" height="156" rx="22" fill="#eaf4fb" stroke="#bfd4e4" stroke-width="3"/>
  <text x="700" y="272" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#17324d">Lone pair on oxygen</text>
  <text x="700" y="320" font-family="Arial,sans-serif" font-size="23" fill="#526b80">donates into the aromatic π system</text>
  <line x1="830" y1="410" x2="1200" y2="410" stroke="#137c80" stroke-width="6" marker-end="url(#arrow)"/>
  <rect x="650" y="450" width="760" height="156" rx="22" fill="#e8f6f2" stroke="#b8ded5" stroke-width="3"/>
  <text x="700" y="502" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#075a5c">Greater electron density at 2, 4 and 6</text>
  <text x="700" y="550" font-family="Arial,sans-serif" font-size="23" fill="#315b61">electrophilic substitution is faster than in benzene</text>
  <rect x="650" y="660" width="760" height="130" rx="22" fill="#fff4df" stroke="#ead3a6" stroke-width="3"/>
  <text x="700" y="710" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#6b4d18">Scope note</text>
  <text x="700" y="752" font-family="Arial,sans-serif" font-size="21" fill="#6b4d18">Fused rings (for example naphthols) need their own numbering</text>
  <text x="700" y="781" font-family="Arial,sans-serif" font-size="21" fill="#6b4d18">and site analysis; they do not inherit phenol's 2,4,6 labels.</text>
  <text x="70" y="850" font-family="Arial,sans-serif" font-size="20" fill="#65798a">MARLBRIDGE • Schematic; resonance is represented as electron donation, not a single fixed structure.</text>
</svg>
