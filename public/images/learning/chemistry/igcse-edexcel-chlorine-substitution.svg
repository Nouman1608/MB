<svg xmlns="http://www.w3.org/2000/svg" width="900" height="950" viewBox="0 0 1800 1900" role="img" aria-labelledby="title desc"><title id="title">Chlorine and methane: substitution (Edexcel International GCSE Chemistry)</title><desc id="desc">No tier label: the reaction of alkanes with halogens in ultraviolet radiation, limited to mono-substitution, is 4CH1 statement 4.22, on both papers. Displayed formulae: methane + chlorine, in UV light, give chloromethane + hydrogen chloride. One hydrogen atom of methane (gold) swaps with one chlorine atom (gold): the C–H bond is replaced by C–Cl, and the hydrogen leaves as HCl.</desc><rect width="1800" height="1900" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="92" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle">Chlorine and methane: substitution</text>
