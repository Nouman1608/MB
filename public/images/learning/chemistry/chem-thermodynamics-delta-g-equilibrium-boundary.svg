<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">Gibbs energy and the equilibrium boundary as temperature changes</title>
  <desc id="desc">A straight-line schematic for fixed enthalpy and entropy shows positive Gibbs energy below the zero crossing, zero Gibbs energy at the equilibrium boundary, and negative Gibbs energy above it. The graph represents a standard-state or fixed-composition model; actual direction in a non-standard mixture also depends on composition.</desc>
  <rect width="1500" height="900" rx="28" fill="#f8fafc"/>
  <text x="70" y="88" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#17324d">ΔG = ΔH − TΔS: the zero crossing is an equilibrium boundary</text>
  <text x="72" y="136" font-family="Arial,sans-serif" font-size="25" fill="#526b80">Illustrative fixed-ΔH, fixed-ΔS case with ΔH &gt; 0 and ΔS &gt; 0.</text>
  <line x1="230" y1="700" x2="1270" y2="700" stroke="#17324d" stroke-width="5"/>
  <line x1="320" y1="760" x2="320" y2="245" stroke="#17324d" stroke-width="5"/>
  <line x1="320" y1="500" x2="1265" y2="500" stroke="#9bb0c0" stroke-width="3" stroke-dasharray="12 10"/>
  <text x="155" y="270" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#17324d">ΔG</text>
  <text x="1220" y="755" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#17324d">T (K)</text>
  <text x="255" y="509" font-family="Arial,sans-serif" font-size="19" fill="#526b80">0</text>
  <path d="M390 305 L1125 500 L1260 536" fill="none" stroke="#137c80" stroke-width="8" stroke-linecap="round"/>
  <circle cx="1125" cy="500" r="12" fill="#d45b45" stroke="#fff" stroke-width="4"/>
  <line x1="1125" y1="500" x2="1125" y2="700" stroke="#d45b45" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="390" y="270" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#8d4238">ΔG &gt; 0: no forward thermodynamic drive</text>
  <text x="1150" y="575" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#075a5c">ΔG &lt; 0:</text>
  <text x="1150" y="606" font-family="Arial,sans-serif" font-size="21" fill="#075a5c">forward drive</text>
  <text x="1020" y="745" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#8d4238">T = ΔH / ΔS</text>
  <text x="1155" y="472" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#8d4238">ΔG = 0</text>
  <text x="1155" y="442" font-family="Arial,sans-serif" font-size="18" fill="#526b80">equilibrium boundary</text>
  <rect x="125" y="785" width="1250" height="64" rx="16" fill="#fff4df" stroke="#ead3a6" stroke-width="2"/>
  <text x="160" y="825" font-family="Arial,sans-serif" font-size="20" fill="#6b4d18">Standard ΔG° gives a standard-state result; actual direction in a non-standard mixture also depends on composition (reaction quotient).</text>
  <text x="72" y="882" font-family="Arial,sans-serif" font-size="18" fill="#65798a">MARLBRIDGE • Schematic; straight-line model assumes ΔH and ΔS are constant over the temperature range.</text>
</svg>
