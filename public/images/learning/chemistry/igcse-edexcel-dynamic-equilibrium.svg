<svg xmlns="http://www.w3.org/2000/svg" width="900" height="990" viewBox="0 0 1800 1980" role="img" aria-labelledby="title desc"><title id="title">Dynamic equilibrium (Edexcel International GCSE Chemistry: Paper 2 only)</title><desc id="desc">Marked Paper 2 only: dynamic equilibrium in a sealed container, with forward and reverse reactions at the same rate and constant concentrations, is 4CH1 statements 3.19C and 3.20C, in bold. Graph of rate against time: the forward rate starts high and falls; the reverse rate starts at zero and rises; from the equilibrium point both are equal and constant. Particle boxes: at the start all 12 particles are A; at equilibrium there are 4 A and 8 B. The numbers stay fixed while both reactions go on.</desc><rect width="1800" height="1980" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="92" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle">Dynamic equilibrium</text>
<text x="900" y="172" font-size="42" fill="#4B5B72" text-anchor="middle">Both reactions go on at equal rates</text>
<rect x="60" y="233" width="285" height="58" rx="29" fill="#8A6A0C"/><text x="202.5" y="274.96" font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="middle">Paper 2 only</text>
