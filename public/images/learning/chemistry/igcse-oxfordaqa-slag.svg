<svg xmlns="http://www.w3.org/2000/svg" width="900" height="910" viewBox="0 0 1800 1820" role="img" aria-labelledby="title desc"><title id="title">Slag removes the sand (OxfordAQA International GCSE Chemistry)</title><desc id="desc">No tier label: OxfordAQA International GCSE Chemistry is not tiered. Step 4: limestone breaks down on heating, CaCO3 → CaO (lime) + CO2 (9202 3.3.1.2a, thermal decomposition of carbonates; limestone is a blast-furnace raw material, 3.3.1.1d). Step 5: lime reacts with the sand impurity, CaO + SiO2 → CaSiO3 (slag). The bottom diagram, slag floating on molten iron and being drawn off, is marked not required by OxfordAQA, because 3.3.1.1d says details of the blast furnace are not required.</desc><rect width="1800" height="1820" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="92" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle">Slag removes the sand</text>
<text x="900" y="172" font-size="42" fill="#4B5B72" text-anchor="middle">Impurities leave the furnace</text>
