<text x="980" y="1588" font-size="34" font-weight="700" fill="#1E2B47" text-anchor="middle">H</text>
<circle cx="816" cy="1828" r="36" fill="#FFFFFF" stroke="#1E2B47" stroke-width="5"/>
<text x="816" y="1840" font-size="34" font-weight="700" fill="#1E2B47" text-anchor="middle">H</text>
<circle cx="980" cy="1828" r="36" fill="#FFFFFF" stroke="#1E2B47" stroke-width="5"/>
<text x="980" y="1840" font-size="34" font-weight="700" fill="#1E2B47" text-anchor="middle">H</text>
<text x="1500" y="1702" font-size="70" font-weight="700" fill="#2F6B63" text-anchor="middle" xml:space="preserve"><tspan>C</tspan><tspan dy="19.6" font-size="47.6">2</tspan><tspan dy="-19.6">H</tspan><tspan dy="19.6" font-size="47.6">6</tspan></text>
<text x="1500" y="1786" font-size="42" fill="#4B5B72" text-anchor="middle">molecular formula</text></g></svg>
