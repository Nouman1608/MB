<svg xmlns="http://www.w3.org/2000/svg" width="900" height="980" viewBox="0 0 1800 1960" role="img" aria-labelledby="title desc"><title id="title">From masses to a formula (Edexcel International GCSE Chemistry)</title><desc id="desc">No tier label: empirical and molecular formulae are 4CH1 statements 1.32 and 1.33, on both papers. Example: 2.4 g carbon and 0.6 g hydrogen. 1: mass ÷ Ar gives moles, C 2.4 ÷ 12 = 0.2 mol and H 0.6 ÷ 1 = 0.6 mol. 2: divide by the smallest to get the simplest ratio, 1 C to 3 H, so the empirical formula is CH3. 3: compare Mr (30) with 15, the mass of CH3 (12 + 3); 30 ÷ 15 = 2, so multiply by 2 to give the molecular formula C2H6, shown as a displayed formula.</desc><rect width="1800" height="1960" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="92" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle">From masses to a formula</text>
<text x="900" y="174" font-size="42" fill="#4B5B72" text-anchor="middle">Example: 2.4 g carbon and 0.6 g hydrogen</text>
<rect x="60" y="320" width="1680" height="500" rx="24" fill="#FFFFFF" stroke="#1E2B47" stroke-width="5"/>
<rect x="60" y="860" width="1680" height="500" rx="24" fill="#FFFFFF" stroke="#1E2B47" stroke-width="5"/>
<rect x="60" y="1400" width="1680" height="500" rx="24" fill="#FFFFFF" stroke="#1E2B47" stroke-width="5"/>
<text x="124" y="404" font-size="46" font-weight="700" fill="#1E2B47" xml:space="preserve"><tspan>1 Mass ÷ A</tspan><tspan dy="12.9" font-size="31.3">r</tspan><tspan dy="-12.9"> = moles</tspan></text>
<rect x="120" y="460" width="266" height="74" fill="#B5D4CF" stroke="#1E2B47" stroke-width="5"/>
<text x="420" y="512" font-size="44" font-weight="700" fill="#1E2B47">C: 2.4 ÷ 12 = 0.2 mol</text>
<rect x="120" y="630" width="800" height="74" fill="#F2E6B7" stroke="#1E2B47" stroke-width="5"/>
<text x="954" y="682" font-size="44" font-weight="700" fill="#1E2B47">H: 0.6 ÷ 1 = 0.6 mol</text>
<text x="124" y="944" font-size="46" font-weight="700" fill="#1E2B47">2 ÷ smallest = simplest ratio</text>
<circle cx="240" cy="1116" r="56" fill="#B5D4CF" stroke="#1E2B47" stroke-width="5"/>
<text x="240" y="1130" font-size="40" font-weight="700" fill="#1E2B47" text-anchor="middle">C</text>
<text x="240" y="1246" font-size="46" font-weight="700" fill="#1E2B47" text-anchor="middle">1</text>
<circle cx="520" cy="1116" r="36" fill="#FFFFFF" stroke="#1E2B47" stroke-width="5"/>
<text x="520" y="1128" font-size="34" font-weight="700" fill="#1E2B47" text-anchor="middle">H</text>
<circle cx="624" cy="1116" r="36" fill="#FFFFFF" stroke="#1E2B47" stroke-width="5"/>
<text x="624" y="1128" font-size="34" font-weight="700" fill="#1E2B47" text-anchor="middle">H</text>
<circle cx="728" cy="1116" r="36" fill="#FFFFFF" stroke="#1E2B47" stroke-width="5"/>
<text x="728" y="1128" font-size="34" font-weight="700" fill="#1E2B47" text-anchor="middle">H</text>
<text x="624" y="1246" font-size="46" font-weight="700" fill="#1E2B47" text-anchor="middle">3</text>
<text x="1280" y="1106" font-size="96" font-weight="700" fill="#2F6B63" text-anchor="middle" xml:space="preserve"><tspan>CH</tspan><tspan dy="26.9" font-size="65.3">3</tspan></text>
<text x="1280" y="1198" font-size="42" fill="#4B5B72" text-anchor="middle">empirical formula</text>
<text x="124" y="1484" font-size="46" font-weight="700" fill="#1E2B47" xml:space="preserve"><tspan>3 Compare M</tspan><tspan dy="12.9" font-size="31.3">r</tspan><tspan dy="-12.9"> (30) with 15</tspan></text>
<text x="124" y="1618" font-size="50" font-weight="700" fill="#1E2B47">12 + 3 = 15</text>
<text x="124" y="1718" font-size="50" font-weight="700" fill="#8A6A0C">30 ÷ 15 = 2</text>
<text x="124" y="1808" font-size="44" fill="#4B5B72">so × 2</text>
