<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
<title id="title">Geometric and optical isomerism in complexes</title><desc id="desc">Schematic comparisons show cis and trans octahedral dichlorotetraamminecobalt complexes, the two non-superimposable mirror-image tris(ethane-1,2-diamine) forms, and cisplatin versus the trans square-planar isomer.</desc>
<defs><marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#298078"/></marker><marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#8665a8"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18324b}.title{font-size:36px;font-weight:700}.head{font-size:26px;font-weight:700}.label{font-size:21px}.small{font-size:18px}.bond{stroke:#18324b;stroke-width:4;fill:none}</style><rect width="1600" height="1050" fill="#fff"/><text x="800" y="55" class="title" text-anchor="middle">Complex-ion isomerism: compare ligand positions in 3D</text>
<rect x="35" y="90" width="745" height="405" rx="18" fill="#f2f7fb" stroke="#c8d6df" stroke-width="2"/><rect x="820" y="90" width="745" height="405" rx="18" fill="#f4f8f2" stroke="#c8d6df" stroke-width="2"/><rect x="35" y="520" width="745" height="450" rx="18" fill="#fff7ef" stroke="#c8d6df" stroke-width="2"/><rect x="820" y="520" width="745" height="450" rx="18" fill="#f7f4fb" stroke="#c8d6df" stroke-width="2"/>
<text x="405" y="135" class="head" text-anchor="middle">Octahedral [Co(NH₃)₄Cl₂]⁺</text><text x="405" y="177" class="label" text-anchor="middle">cis: Cl ligands adjacent, 90°</text><path d="M405 320L260 320M405 320L550 320M405 320L405 235M405 320L405 405M405 320L335 265M405 320L475 375" class="bond"/><circle cx="405" cy="320" r="31" fill="#f2cb65" stroke="#18324b" stroke-width="3"/><text x="405" y="328" class="label" text-anchor="middle">Co</text><text x="245" y="328" class="label">Cl</text><text x="550" y="328" class="label">NH₃</text><text x="405" y="224" class="label" text-anchor="middle">NH₃</text><text x="405" y="433" class="label" text-anchor="middle">Cl</text><text x="315" y="258" class="small">NH₃</text><text x="478" y="390" class="small">NH₃</text>
<text x="1190" y="177" class="label" text-anchor="middle">trans: Cl ligands opposite, 180°</text><path d="M1190 320L1045 320M1190 320L1335 320M1190 320L1190 235M1190 320L1190 405M1190 320L1120 265M1190 320L1260 375" class="bond"/><circle cx="1190" cy="320" r="31" fill="#f2cb65" stroke="#18324b" stroke-width="3"/><text x="1190" y="328" class="label" text-anchor="middle">Co</text><text x="1028" y="328" class="label">Cl</text><text x="1332" y="328" class="label">Cl</text><text x="1190" y="224" class="label" text-anchor="middle">NH₃</text><text x="1190" y="433" class="label" text-anchor="middle">NH₃</text><text x="1100" y="258" class="small">NH₃</text><text x="1263" y="390" class="small">NH₃</text>
<text x="405" y="568" class="head" text-anchor="middle">Optical isomers: [Ni(en)₃]²⁺</text><text x="405" y="610" class="label" text-anchor="middle">Opposite-handed arrangements (schematic)</text><path d="M250 705C190 720 185 785 240 815C290 842 355 810 335 760C320 718 270 720 250 755C235 783 260 800 283 785" fill="none" stroke="#298078" stroke-width="7" marker-end="url(#arrowTeal)"/><circle cx="290" cy="770" r="31" fill="#f2cb65" stroke="#18324b" stroke-width="3"/><text x="290" y="778" class="label" text-anchor="middle">Ni</text><text x="290" y="900" class="label" text-anchor="middle">Δ (right-handed) schematic</text><path d="M650 705C710 720 715 785 660 815C610 842 545 810 565 760C580 718 630 720 650 755C665 783 640 800 617 785" fill="none" stroke="#8665a8" stroke-width="7" marker-end="url(#arrowPurple)"/><circle cx="610" cy="770" r="31" fill="#f2cb65" stroke="#18324b" stroke-width="3"/><text x="610" y="778" class="label" text-anchor="middle">Ni</text><text x="610" y="900" class="label" text-anchor="middle">Λ (left-handed) mirror form</text><text x="405" y="940" class="small" text-anchor="middle">The pair are non-superimposable mirror images; ligand wraps are schematic.</text>
<text x="1190" y="568" class="head" text-anchor="middle">Square-planar [Pt(NH₃)₂Cl₂]</text><text x="1190" y="610" class="label" text-anchor="middle">cisplatin (cis) and transplatin (trans)</text><rect x="910" y="665" width="295" height="235" rx="14" fill="#fff" stroke="#d8c8a4" stroke-width="2"/><rect x="1215" y="665" width="300" height="235" rx="14" fill="#fff" stroke="#d8c8a4" stroke-width="2"/><text x="1058" y="700" class="label" text-anchor="middle">cis (cisplatin)</text><text x="1365" y="700" class="label" text-anchor="middle">trans</text><path d="M1058 785V735M1058 785H1005M1058 785V835M1058 785H1112M1365 785V735M1365 785H1310M1365 785V835M1365 785H1420" class="bond"/><circle cx="1058" cy="785" r="27" fill="#f2cb65" stroke="#18324b" stroke-width="3"/><circle cx="1365" cy="785" r="27" fill="#f2cb65" stroke="#18324b" stroke-width="3"/><text x="1058" y="793" class="small" text-anchor="middle">Pt</text><text x="1365" y="793" class="small" text-anchor="middle">Pt</text><text x="1058" y="730" class="small" text-anchor="middle">Cl</text><text x="995" y="793" class="small" text-anchor="end">Cl</text><text x="1058" y="860" class="small" text-anchor="middle">NH₃</text><text x="1122" y="793" class="small">NH₃</text><text x="1365" y="730" class="small" text-anchor="middle">Cl</text><text x="1300" y="793" class="small" text-anchor="end">Cl</text><text x="1365" y="860" class="small" text-anchor="middle">NH₃</text><text x="1430" y="793" class="small">NH₃</text><text x="1190" y="940" class="small" text-anchor="middle">cis: Cl–Pt–Cl = 90° • trans: Cl–Pt–Cl = 180° • Marlbridge Chemistry</text><text x="800" y="985" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".06">MARLBRIDGE STUDY RESOURCES</text><path d="M52 995H1548" stroke="#C9A227" stroke-width="2"/><text x="54" y="1030" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1380" y="1000" width="168" height="41" preserveAspectRatio="xMidYMid meet"/></svg>
