<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="title desc">
<title id="title">Two-stage alkylation of dimethylamine</title><desc id="desc">Curved arrows show dimethylamine attacking carbon 1 of 1-chlorobutane to form a protonated tertiary amine. A second dimethylamine removes the proton, and the nitrogen–hydrogen bond pair returns to nitrogen, producing neutral N,N-dimethylbutan-1-amine and dimethylammonium chloride.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#C44949"/></marker><marker id="flow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#168C8C"/></marker><style>.bg{fill:#F3F6F6}.panel{fill:#fff;stroke:#D3DCE2;stroke-width:2}.title{font:700 31px Arial,sans-serif;fill:#10233F}.sub{font:500 17px Arial,sans-serif;fill:#5B6D80}.heading{font:700 22px Arial,sans-serif;fill:#10233F}.mol{font:700 27px Arial,sans-serif;fill:#20314B}.label{font:500 16px Arial,sans-serif;fill:#5B6D80}.ann{font:700 16px Arial,sans-serif;fill:#A43B3B}.product{fill:#E5F4F2;stroke:#168C8C;stroke-width:2}.salt{fill:#FFF7DD;stroke:#C9A227;stroke-width:2}.curve{fill:none;stroke:#C44949;stroke-width:4;marker-end:url(#arrow)}.down{fill:none;stroke:#168C8C;stroke-width:4;marker-end:url(#flow)}.wm{font:700 18px Arial,sans-serif;letter-spacing:7px;fill:#DCE4E6}</style></defs>
<rect class="bg" width="1528" height="940"/><text x="52" y="58" class="title">Alkylation of dimethylamine: two substitution steps</text><text x="54" y="94" class="sub">Worked example • dimethylamine + 1-chlorobutane • two SN2 reactions</text>
<rect x="52" y="132" width="1424" height="340" rx="20" class="panel"/><text x="82" y="178" class="heading">1  Form the protonated tertiary amine</text>
<text x="105" y="245" class="mol">(CH₃)₂N:</text><text x="360" y="245" class="mol">+</text><text x="460" y="245" class="mol">CH₃—CH₂—CH₂—CH₂—Cl</text>
<text x="707" y="215" text-anchor="middle" class="ann">C1</text>
<path d="M230 238 C310 302 580 314 707 242" class="curve"/><path d="M740 245 C755 300 780 300 779 248" class="curve"/>
<rect x="294" y="315" width="255" height="30" rx="8" fill="#fff"/><text x="421" y="337" text-anchor="middle" class="ann">N lone pair → C1</text><rect x="842" y="315" width="300" height="30" rx="8" fill="#fff"/><text x="992" y="337" text-anchor="middle" class="ann">C1—Cl bond pair → Cl⁻</text>
<path d="M764 360L764 382" class="down"/><rect x="112" y="397" width="1304" height="55" rx="12" class="product"/><text x="137" y="432" class="mol">[(CH₃)₂N(H)—CH₂CH₂CH₂CH₃]⁺  Cl⁻</text><text x="945" y="432" class="label">butyl-dimethylammonium chloride</text>
<rect x="52" y="492" width="1424" height="340" rx="20" class="panel"/><text x="82" y="538" class="heading">2  A second amine removes H⁺; the N—H pair returns to N</text>
<text x="105" y="612" class="mol">[Bu—N(H)(CH₃)₂]⁺  Cl⁻</text><text x="680" y="612" class="mol">+</text><text x="800" y="612" class="mol">(CH₃)₂N:</text>

<path d="M895 606 C820 662 420 666 216 612" class="curve"/><path d="M216 612 C205 662 185 662 183 612" class="curve"/>
<rect x="528" y="670" width="235" height="30" rx="8" fill="#fff"/><text x="645" y="692" text-anchor="middle" class="ann">base lone pair → H</text><rect x="150" y="670" width="320" height="30" rx="8" fill="#fff"/><text x="310" y="692" text-anchor="middle" class="ann">N—H bond pair → N</text>
<path d="M764 710L764 730" class="down"/><rect x="112" y="742" width="1304" height="72" rx="12" class="salt"/><text x="137" y="778" class="mol">(CH₃)₂N—CH₂CH₂CH₂CH₃  +  [(CH₃)₂NH₂]⁺ Cl⁻</text><text x="137" y="803" class="label">N,N-dimethylbutan-1-amine (neutral) + dimethylammonium chloride</text>
<text x="54" y="866" class="label">Atom/charge check: step 1 forms N⁺ and Cl⁻; step 2 transfers H⁺ to the second amine.</text><path d="M52 884H1476" stroke="#D5A817" stroke-width="3"/><text x="365" y="916" class="wm">MARLBRIDGE STUDY RESOURCES</text><image href="data:image/svg+xml;base64," x="1320" y="875" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
