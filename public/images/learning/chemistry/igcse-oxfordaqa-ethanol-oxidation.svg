<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 1800 1800" role="img" aria-labelledby="title desc"><title id="title">Ethanol to ethanoic acid (OxfordAQA International GCSE Chemistry)</title><desc id="desc">No tier label: OxfordAQA International GCSE Chemistry is not tiered. 9202 statement 3.10.3.1c: ethanol can be oxidised to ethanoic acid by chemical oxidising agents or by microbial action. Displayed formulae: ethanol, CH3CH2OH, gains an oxygen atom and loses two hydrogen atoms on its second carbon (shown in gold) to become ethanoic acid, CH3COOH, written as ethanol + 2[O] → ethanoic acid + H2O. In the lab, a chemical oxidising agent such as acidified potassium manganate(VII) oxidises the ethanol; by bacteria, wine or cider becomes vinegar.</desc><rect width="1800" height="1800" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="92" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle">Ethanol to ethanoic acid</text>
<text x="900" y="174" font-size="42" fill="#4B5B72" text-anchor="middle">Oxidation: gains O, loses H</text>
