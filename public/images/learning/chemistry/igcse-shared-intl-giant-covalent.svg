<svg xmlns="http://www.w3.org/2000/svg" width="900" height="980" viewBox="0 0 1800 1960" role="img" aria-labelledby="title desc"><title id="title">Diamond and silicon dioxide</title><desc id="desc">No tier label: giant covalent structures are on both Edexcel International GCSE papers (4CH1 1.49 high melting points, 1.50 diamond) and OxfordAQA International GCSE Chemistry is not tiered (9202 3.2.1g and 3.2.2f name diamond and silicon dioxide; 3.2.3b diamond). Flat sketches of 3D networks. Diamond: each carbon forms 4 covalent bonds in a rigid 3D network, so it is very hard with a very high melting point; used in cutting tools. Silicon dioxide, SiO2: each Si bonds to 4 O and each O to 2 Si; like diamond it is hard with a very high melting point.</desc><rect width="1800" height="1960" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="92" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle">Diamond and silicon dioxide</text>
<text x="900" y="172" font-size="42" fill="#4B5B72" text-anchor="middle">Giant 3D networks of covalent bonds</text>
