<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="871" viewBox="0 0 1528 871" role="img" aria-labelledby="title desc"><title id="title">Paper chromatography: baseline, solvent front and Rf</title><desc id="desc">A chromatogram has spots above a pencil baseline and a marked solvent front. A spot travelling five centimetres while the front travels eight has Rf equal to 0.625. One spot alone does not establish purity.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#1c2d4b"/></marker><marker id="red" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#b75e53"/></marker><marker id="blue" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#357ea2"/></marker></defs><rect width="100%" height="100%" fill="#f5f8f7"/><g font-family="Arial, sans-serif"><text x="24" y="58" font-size="38" font-weight="700" text-anchor="start" fill="#1c2d4b">Paper chromatography: baseline, solvent front and Rf</text><text x="24" y="104" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">A constructed chromatogram with a worked distance ratio</text><g transform="translate(24,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Measure from the same baseline</text><rect x="120" y="90" width="440" height="350" rx="0" fill="#f9fbfa" stroke="#1c2d4b" stroke-width="2"/><path d="M120,380 H560" fill="none" stroke="#1c2d4b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M120,140 H560" fill="none" stroke="#357ea2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/><circle cx="340" cy="230" r="14" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><circle cx="340" cy="300" r="14" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><path d="M510,130 L510,140" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="410" y="120" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Solvent front</text><path d="M510,397 L510,380" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="400" y="425" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Pencil baseline</text><text x="180" y="415" font-size="21" font-weight="700" text-anchor="start" fill="#1c2d4b">Origin</text><path d="M610,380 L610,140" fill="none" stroke="#1c2d4b" stroke-width="4" marker-end="url(#arr)"/><text x="625" y="275" font-size="21" font-weight="700" text-anchor="start" fill="#1c2d4b">8 cm</text><path d="M65,380 L65,230" fill="none" stroke="#1c2d4b" stroke-width="4" marker-end="url(#arr)"/><text x="35" y="305" font-size="20" font-weight="700" text-anchor="start" fill="#1c2d4b">5 cm</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">The sample starts on a pencil baseline above the solvent level.</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Mark the solvent front before it dries. This example has two</text><text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">separated sample spots.</text></g><g transform="translate(784,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Interpret a chromatogram carefully</text><rect x="55" y="110" width="610" height="100" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2"/><text x="360.0" y="142" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">Rf = distance travelled by substance</text><text x="360.0" y="175" font-size="20" font-weight="400" text-anchor="middle" fill="#1c2d4b">÷ distance travelled by solvent front</text><rect x="55" y="285" width="610" height="100" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2"/><text x="360.0" y="317" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">Rf for the upper spot = 5 ÷ 8 = 0.625</text><text x="360.0" y="350" font-size="20" font-weight="400" text-anchor="middle" fill="#1c2d4b">Distances are both measured from the baseline</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Compare Rf values only under the same conditions. Two spots</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">show at least two separated components. A single spot does</text><text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">not by itself prove purity: components can travel together.</text></g><text x="24" y="849" font-size="19" font-weight="400" text-anchor="start" fill="#1c2d4b">MARLBRIDGE  •  Schematic; structures and particles are not to scale.</text></g><image href="data:image/svg+xml;base64," x="1310" y="816" width="178" height="43" preserveAspectRatio="xMidYMid meet"/></svg>
