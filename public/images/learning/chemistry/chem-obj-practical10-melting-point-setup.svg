<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="title desc"><title id="title">Melting-point range apparatus</title><desc id="desc">A sealed-end capillary containing a small sample of dry crystals is secured beside a thermometer bulb and immersed in a gently heated bath. Record temperatures when melting begins and when the sample is completely liquid.</desc><defs><style>text{font-family:Arial,sans-serif;fill:#172b4d}.title{font-size:38px;font-weight:700}.label{font-size:23px;font-weight:600}.small{font-size:19px}.line{stroke:#31516e;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.glass{stroke:#31516e;stroke-width:7;fill:#eef6fb}.liquid{fill:#f6c85f;opacity:.66}.brand{font-size:17px;font-weight:700;letter-spacing:3px;fill:#31516e}</style></defs><rect width="1528" height="940" rx="32" fill="#fff"/><text x="72" y="87" class="title">Determining a melting range</text><text x="72" y="130" class="small">Use a small, dry sample and heat slowly near its expected melting point.</text><path d="M210 760h690l-55 50H265z" fill="#dbe6ee" stroke="#31516e" stroke-width="5"/><rect x="278" y="370" width="545" height="390" rx="24" class="glass"/><path d="M288 500h525v249H288z" class="liquid"/><text x="360" y="700" class="label">oil or suitable bath liquid</text><rect x="492" y="205" width="62" height="432" rx="30" fill="#fff" stroke="#31516e" stroke-width="6"/><circle cx="523" cy="636" r="27" fill="#e8796b" stroke="#31516e" stroke-width="5"/><path d="M523 630V266" stroke="#d45555" stroke-width="8"/><text x="574" y="247" class="label">Thermometer</text><path d="M563 258l-18 22" class="line"/><rect x="610" y="420" width="18" height="258" rx="8" fill="#fff" stroke="#31516e" stroke-width="5"/><path d="M619 439v210" stroke="#9bc7dc" stroke-width="8"/><rect x="612" y="633" width="14" height="32" rx="4" fill="#55a56d"/><path d="M637 428l100-68" class="line"/><text x="660" y="285" class="label">Capillary tube</text><text x="660" y="315" class="small">sealed end; sample at tip</text><path d="M620 633l-88-13" class="line"/><text x="92" y="596" class="label">Sample beside</text><text x="92" y="627" class="label">thermometer bulb</text><text x="943" y="275" class="label">Record two temperatures</text><circle cx="961" cy="350" r="17" fill="#40916c"/><text x="995" y="358" class="small">first visible liquid forms</text><circle cx="961" cy="421" r="17" fill="#40916c"/><text x="995" y="429" class="small">sample is completely liquid</text><text x="943" y="510" class="small">The interval is the melting range.</text><text x="943" y="548" class="small">A pure sample usually melts sharply;</text><text x="943" y="581" class="small">impurities often lower and broaden it.</text><rect x="920" y="650" width="496" height="112" rx="18" fill="#edf4f8" stroke="#9cb8c9" stroke-width="3"/><text x="950" y="695" class="small">Do not heat rapidly near the transition:</text><text x="950" y="729" class="small">a slow rise makes the range easier to judge.</text><text x="764" y="895" text-anchor="middle" class="brand">MARLBRIDGE STUDY RESOURCES</text><image href="data:image/svg+xml;base64," x="1300" y="18" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>