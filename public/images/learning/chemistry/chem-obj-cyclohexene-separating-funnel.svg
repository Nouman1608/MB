<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="title desc"><title id="title">Vent carbon dioxide and identify layers during washing</title><desc id="desc">AQA A-level Chemistry • separating funnel and carbonate wash</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#C44949"/></marker></defs><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#10233F">Vent carbon dioxide and identify layers during washing</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">AQA A-level Chemistry • separating funnel and carbonate wash</text><rect x="52" y="132" width="1424" height="606" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="88" y="184" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#10233F">Wash and separate the crude cyclohexene safely</text><rect x="90" y="230" width="560" height="400" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="370" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#315F86">Separating funnel</text><path d="M260 300H480L450 440L390 500V560H350V500L290 440Z" fill="#F8FBFB" stroke="#315F86" stroke-width="4"/><line x1="292" y1="420" x2="448" y2="420" stroke="#168C8C" stroke-width="3"/><line x1="299" y1="455" x2="441" y2="455" stroke="#725C8E" stroke-width="3"/><text x="370" y="396" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#168C8C">upper cyclohexene layer</text><text x="370" y="445" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#725C8E">aqueous wash</text><line x1="370" y1="560" x2="370" y2="588" stroke="#20314B" stroke-width="3"/><text x="370" y="612" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">stopcock: drain lower layer first</text><rect x="710" y="230" width="650" height="400" rx="16" fill="#F4F1E8" stroke="#F4F1E8" stroke-width="2"/><text x="1035" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#725C8E">Neutralise residual acid</text><text x="758" y="328" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#20314B">Cyclohexene distillate + Na₂CO₃(aq)</text><text x="758" y="374" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">Acid + carbonate → CO₂(g) + salt + H₂O</text><rect x="758" y="410" width="552" height="86" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="1034" y="446" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#C44949">Invert, point away, vent CO₂ frequently</text><text x="1034" y="474" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#C44949">Discard the lower aqueous layer.</text><text x="758" y="556" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6D80">*Layer position depends on the actual densities; test a drop of water.</text><text x="758" y="590" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6D80">Do not assume which layer is product without checking.</text><text letter-spacing="5" opacity=".08" x="764" y="849" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE STUDY RESOURCES</text><line x1="52" y1="866" x2="1476" y2="866" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="875" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
