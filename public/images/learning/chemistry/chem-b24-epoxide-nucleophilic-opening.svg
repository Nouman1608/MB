"320" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#5B6D80" text-anchor="middle">lone pair on O</text><path d="M576 270 C516 208 432 205 370 260" fill="none" stroke="#C44949" stroke-width="4" marker-end="url(#a)"/><text x="475" y="211" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#C44949" text-anchor="middle">O lone pair → C</text><path d="M354 286 C350 327 333 352 311 365" fill="none" stroke="#C44949" stroke-width="4" marker-end="url(#a)"/><text x="424" y="354" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#C44949" text-anchor="middle">C–O pair → O</text><text x="842" y="290" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#C9A227" text-anchor="middle">→</text><text x="965" y="289" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#20314B" text-anchor="middle">RO(H)⁺–CH₂–CH₂–O⁻</text><text x="965" y="326" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80" text-anchor="middle">charged ring-open intermediate</text><rect x="1154" y="218" width="280" height="150" rx="14" fill="#fff" stroke="#D3DCE2" stroke-width="2"/><text x="1178" y="253" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F" text-anchor="start">Bond changes</text><text x="1178" y="285" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#168C8C" text-anchor="start">C–Nu forms</text><text x="1178" y="315" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#C44949" text-anchor="start">ring C–O breaks</text><text x="1178" y="345" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20314B" text-anchor="start">strain is relieved</text><text x="82" y="493" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#10233F" text-anchor="start">Step 2 • Proton transfer</text><rect x="110" y="536" width="486" height="116" rx="14" fill="#fff" stroke="#D3DCE2" stroke-width="2"/><text x="353" y="580" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#20314B" text-anchor="middle">RO(H)⁺–CH₂–CH₂–O⁻</text><text x="353" y="618" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#5B6D80" text-anchor="middle">oxonium + alkoxide</text><path d="M626 591H846" fill="none" stroke="#C9A227" stroke-width="4" marker-end="url(#g)"/><text x="736" y="570" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#C9A227" text-anchor="middle">H⁺ transfer</text><rect x="880" y="536" width="486" height="116" rx="14" fill="#fff" stroke="#D3DCE2" stroke-width="2"/><text x="1123" y="580" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#168C8C" text-anchor="middle">RO–CH₂–CH₂–OH</text><text x="1123" y="618" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#5B6D80" text-anchor="middle">ring-opened addition product</text><rect x="110" y="680" width="1256" height="60" rx="8" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/><text x="738" y="706" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#10233F" text-anchor="middle">Formal neutral-nucleophile outline; for water, R = H. Dilute acid speeds the industrial water reaction.</text><text x="738" y="729" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20314B" text-anchor="middle">The acid-catalysed route has protonation steps; this sketch does not replace that catalytic cycle.</text><text x="764" y="862" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".06">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F" text-anchor="start">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="887" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
