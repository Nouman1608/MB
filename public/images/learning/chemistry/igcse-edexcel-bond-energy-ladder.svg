<svg xmlns="http://www.w3.org/2000/svg" width="900" height="930" viewBox="0 0 1800 1860" role="img" aria-labelledby="title desc"><title id="title">The energy ladder for H2 + Cl2 (Edexcel International GCSE Chemistry: Paper 2 only)</title><desc id="desc">Marked Paper 2 only: energy level diagrams (3.5C), bond breaking and making (3.6C) and bond-energy calculations (3.7C) are bold statements in 4CH1. Energy level ladder, drawn to scale, energies in kJ/mol. From H2 + Cl2, breaking bonds takes in +678 to reach 2H + 2Cl; making bonds gives out −862 to reach 2HCl. ΔH = −184: the products end lower than the reactants, so the reaction is exothermic.</desc><rect width="1800" height="1860" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="92" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle" xml:space="preserve"><tspan>The energy ladder for H</tspan><tspan dy="17.9" font-size="43.5">2</tspan><tspan dy="-17.9"> + Cl</tspan><tspan dy="17.9" font-size="43.5">2</tspan></text>
<text x="900" y="174" font-size="42" fill="#4B5B72" text-anchor="middle">Up to break bonds, down as bonds make</text>
<rect x="60" y="231" width="285" height="58" rx="29" fill="#8A6A0C"/><text x="202.5" y="272.96" font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="middle">Paper 2 only</text>
<rect x="60" y="340" width="1680" height="1400" rx="22" fill="#FFFFFF" stroke="#C6D3D0" stroke-width="4"/>
<line x1="200" y1="1600" x2="200" y2="434" stroke="#1E2B47" stroke-width="7" stroke-linecap="round"/><polygon points="200,380 230.8,436 169.2,436" fill="#1E2B47"/>
<text x="112" y="1000" font-size="44" font-weight="700" fill="#1E2B47" text-anchor="middle" transform="rotate(-90 112 1000)">Energy</text>
<line x1="296" y1="1200" x2="604" y2="1200" stroke="#1E2B47" stroke-width="12" stroke-linecap="round"/>
<text x="450" y="1284" font-size="46" font-weight="700" fill="#1E2B47" text-anchor="middle" xml:space="preserve"><tspan>H</tspan><tspan dy="12.9" font-size="31.3">2</tspan><tspan dy="-12.9"> + Cl</tspan><tspan dy="12.9" font-size="31.3">2</tspan></text>
<line x1="796" y1="520" x2="1104" y2="520" stroke="#1E2B47" stroke-width="12" stroke-linecap="round"/>
<text x="950" y="488" font-size="46" font-weight="700" fill="#1E2B47" text-anchor="middle">2H + 2Cl</text>
<line x1="1296" y1="1384" x2="1604" y2="1384" stroke="#1E2B47" stroke-width="12" stroke-linecap="round"/>
<text x="1450" y="1462" font-size="46" font-weight="700" fill="#1E2B47" text-anchor="middle">2HCl</text>
<line x1="604" y1="1200" x2="1604" y2="1200" stroke="#4B5B72" stroke-width="3" stroke-dasharray="12 10"/>
<line x1="690" y1="1190" x2="690" y2="606" stroke="#2F6B63" stroke-width="10" stroke-linecap="round"/><polygon points="690,524 727.8,608 652.2,608" fill="#2F6B63"/>
<text x="726" y="836" font-size="44" font-weight="700" fill="#2F6B63">Break bonds</text>
<text x="726" y="904" font-size="44" font-weight="700" fill="#2F6B63">+678 (in)</text>
<line x1="1190" y1="536" x2="1190" y2="1300" stroke="#B9632F" stroke-width="10" stroke-linecap="round"/><polygon points="1190,1382 1152.2,1298 1227.8,1298" fill="#B9632F"/>
<text x="1226" y="868" font-size="44" font-weight="700" fill="#B9632F">Make bonds</text>
<text x="1226" y="936" font-size="44" font-weight="700" fill="#B9632F">−862 (out)</text>
<line x1="1580" y1="1204" x2="1580" y2="1326" stroke="#1E2B47" stroke-width="8" stroke-linecap="round"/><polygon points="1580,1380 1552,1324 1608,1324" fill="#1E2B47"/>
<text x="1262" y="1158" font-size="46" font-weight="700" fill="#1E2B47">ΔH = −184</text>
<text x="900" y="1676" font-size="44" font-weight="700" fill="#1E2B47" text-anchor="middle">Products end lower than reactants: exothermic</text>
<text x="900" y="1806" font-size="40" fill="#4B5B72" text-anchor="middle">Energies in kJ/mol; vertical scale drawn to scale</text></g></svg>
