<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1275" viewBox="0 0 1800 2550" role="img" aria-labelledby="title desc"><title id="title">A homologous series: the alkanes</title><desc id="desc">Methane, ethane, propane and butane drawn as displayed formulae, each one CH2 bigger than the last, following the general formula CnH2n+2 (CH4, C2H6, C3H8, C4H10). An arrow shows boiling point rising down the series. Chips list what the members share: the same functional group, the same general formula, a trend in physical properties and similar chemical properties. No tier labels.</desc><rect width="1800" height="2550" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="105" font-size="66" font-weight="700" fill="#1E2B47" text-anchor="middle">A homologous series: alkanes</text>
