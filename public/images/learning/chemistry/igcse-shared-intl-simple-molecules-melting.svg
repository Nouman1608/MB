<svg xmlns="http://www.w3.org/2000/svg" width="900" height="995" viewBox="0 0 1800 1990" role="img" aria-labelledby="title desc"><title id="title">Why simple molecules melt easily</title><desc id="desc">No tier label: simple molecular substances having low melting and boiling points because only weak intermolecular forces are overcome is on both Edexcel International GCSE papers (4CH1 1.47) and OxfordAQA International GCSE Chemistry is not tiered (9202 3.2.2c, 3.2.2d). Solid: carbon dioxide molecules, O=C=O, held in rows by weak forces between molecules (dashed). Heat breaks the weak forces. Liquid: the molecules move apart and tumble, but the strong covalent double bonds inside each molecule stay.</desc><rect width="1800" height="1990" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="92" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle">Why simple molecules melt easily</text>
<text x="900" y="172" font-size="42" fill="#4B5B72" text-anchor="middle">Melting separates molecules, not atoms</text>
