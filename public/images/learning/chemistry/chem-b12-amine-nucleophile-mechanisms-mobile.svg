<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1120" viewBox="0 0 768 1120" role="img" aria-labelledby="title desc"><title id="title">Two nucleophilic mechanisms of amines</title><desc id="desc">Ethylamine substitutes bromomethane through an N-positive intermediate; methylamine adds to ethanoyl chloride, then chloride leaves and a base removes a proton.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#172b3c"/></marker><marker id="tealArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#288a83"/></marker></defs><style>text{font-family:Arial,"Liberation Sans",sans-serif}</style><rect width="100%" height="100%" fill="#fbfcfa"/><text x="44" y="58" font-size="30" fill="#172b3c" font-weight="700">Two nucleophilic mechanisms of amines</text><rect x="28" y="90" width="712" height="940" rx="24" fill="#f2f7f6"/><rect x="55" y="125" width="658" height="380" rx="20" fill="white" stroke="#c9d8dc" stroke-width="2"/><rect x="55" y="125" width="658" height="10" rx="5" fill="#288a83"/><text x="77" y="170" font-size="25" fill="#172b3c" font-weight="700">A  Substitution</text><text x="77" y="207" font-size="21" fill="#203545" font-weight="400">Ethylamine N lone pair → CH₃Br carbon; C–Br</text><text x="77" y="233.25" font-size="21" fill="#203545" font-weight="400">→ Br⁻. The N⁺ intermediate loses H⁺ to a</text><text x="77" y="259.5" font-size="21" fill="#203545" font-weight="400">second ethylamine.</text><text x="85" y="340" font-size="25" fill="#172b3c" font-weight="700">CH₃CH₂NH₂ + CH₃Br</text><text x="85" y="390" font-size="24" fill="#172b3c" font-weight="700">→ [CH₃CH₂N⁺H₂CH₃] + Br⁻</text><text x="85" y="440" font-size="24" fill="#288a83" font-weight="700">→ CH₃CH₂NHCH₃ + salt</text><rect x="55" y="550" width="658" height="400" rx="20" fill="white" stroke="#c9d8dc" stroke-width="2"/><rect x="55" y="550" width="658" height="10" rx="5" fill="#e5b94c"/><text x="77" y="595" font-size="25" fill="#172b3c" font-weight="700">B  Addition–elimination</text><text x="77" y="632" font-size="21" fill="#203545" font-weight="400">Methylamine attacks carbonyl C; C=O opens</text><text x="77" y="658.25" font-size="21" fill="#203545" font-weight="400">to O⁻. O⁻ reforms C=O as Cl⁻ leaves; base</text><text x="77" y="684.5" font-size="21" fill="#203545" font-weight="400">removes N–H proton.</text><text x="85" y="770" font-size="25" fill="#172b3c" font-weight="700">CH₃NH₂ + CH₃COCl</text><text x="85" y="820" font-size="23" fill="#172b3c" font-weight="700">→ tetrahedral O⁻ / N⁺ intermediate</text><text x="85" y="870" font-size="24" fill="#288a83" font-weight="700">→ CH₃CONHCH₃ + HCl salt</text><text x="110" y="940" font-size="22" fill="#288a83" font-weight="700">N: → C</text><line x1="215" y1="933" x2="320" y2="933" stroke="#288a83" stroke-width="4"  marker-end="url(#arrow)"/><text x="390" y="940" font-size="22" fill="#c45637" font-weight="700">C–Cl → Cl⁻</text><line x1="40" y1="1066" x2="728" y2="1066" stroke="#d9e3e4"/><text x="44" y="1098" font-size="16" fill="#607783" font-weight="600">MARLBRIDGE  •  Schematic; not to scale</text></svg>
