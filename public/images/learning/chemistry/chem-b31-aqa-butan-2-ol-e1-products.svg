<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940"><defs><marker id="redarrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#C44949"/></marker><marker id="tealarrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#168C8C"/></marker><marker id="goldarrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#C9A227"/></marker></defs><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#10233F">Butan-2-ol dehydration: E1 steps and three alkene products</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="500" fill="#5B6D80">AQA worked example 5 • C2 carbocation • β-H loss at C1 or C3</text><rect x="52" y="132" width="1424" height="650" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="82" y="176" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">Secondary alcohol example • 2-butanol + concentrated phosphoric acid</text><rect x="82" y="208" width="418" height="258" rx="12" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="555" y="208" width="418" height="258" rx="12" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="1028" y="208" width="418" height="258" rx="12" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="106" y="246" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">1  Protonate the –OH group</text><text x="106" y="291" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">CH₃–CH(OH)–CH₂CH₃ + H–A</text><circle cx="207" cy="268" r="3.5" fill="#168C8C"/><circle cx="219" cy="268" r="3.5" fill="#168C8C"/><path d="M215 274C248 245 289 245 326 277" fill="none" stroke="#168C8C" stroke-width="3" marker-end="url(#tealarrow)"/><path d="M337 282C346 292 355 298 365 304" fill="none" stroke="#C44949" stroke-width="3" marker-end="url(#redarrow)"/><text x="106" y="377" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#168C8C">O lone pair → H; H–A pair → A⁻</text><text x="106" y="414" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#20314B">CH₃–CH(OH₂⁺)–CH₂CH₃ + A⁻</text><text x="106" y="444" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">Water becomes a good leaving group.</text><text x="579" y="246" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">2  Water leaves first</text><text x="579" y="296" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#20314B">CH₃–CH(OH₂⁺)–CH₂CH₃</text><path d="M670 289C654 272 660 259 675 267" fill="none" stroke="#C44949" stroke-width="3.5" marker-end="url(#redarrow)"/><text x="579" y="361" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#C44949">C–O bond pair → O</text><text x="579" y="401" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#168C8C">CH₃–C⁺H–CH₂CH₃ + H₂O</text><text x="579" y="434" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">The worked substrate forms a secondary C2 cation.</text><text x="1052" y="246" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">3  Remove either β-hydrogen</text><text x="1052" y="293" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#20314B">CH₃–C⁺H–CH₂CH₃</text><path d="M1080 319C1112 298 1144 298 1178 319" fill="none" stroke="#168C8C" stroke-width="3" marker-end="url(#tealarrow)"/><path d="M1098 331C1140 350 1171 350 1204 330" fill="none" stroke="#C44949" stroke-width="3" marker-end="url(#redarrow)"/><text x="1052" y="378" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#C44949">A⁻ removes β-H; C–H pair forms C=C.</text><text x="1052" y="416" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">C1 loss → but-1-ene</text><text x="1052" y="442" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">C3 loss → E/Z-but-2-ene</text><rect x="82" y="486" width="418" height="238" rx="12" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="555" y="486" width="418" height="238" rx="12" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="1028" y="486" width="418" height="238" rx="12" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="106" y="524" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">Product 1 • but-1-ene</text><text x="291" y="618" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#20314B">CH₂=CH–CH₂–CH₃</text><text x="106" y="682" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#5B6D80">Terminal alkene: no E/Z pair.</text><text x="579" y="524" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">Product 2 • (E)-but-2-ene</text><path d="M674 609H839M674 619H839M696 609L678 571M820 619L840 656" stroke="#315F86" stroke-width="3"/><text x="661" y="570" text-anchor="end" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#20314B">CH₃</text><text x="851" y="670" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#20314B">CH₃</text><text x="684" y="657" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#5B6D80">H</text><text x="831" y="571" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#5B6D80">H</text><text x="764" y="700" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#168C8C">Methyl groups on opposite sides</text><text x="1052" y="524" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">Product 3 • (Z)-but-2-ene</text><path d="M1147 609H1312M1147 619H1312M1169 609L1152 571M1293 609L1310 571" stroke="#315F86" stroke-width="3"/><text x="1134" y="570" text-anchor="end" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#20314B">CH₃</text><text x="1320" y="570" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#20314B">CH₃</text><text x="1157" y="657" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#5B6D80">H</text><text x="1302" y="657" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#5B6D80">H</text><text x="1236" y="700" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#725C8E">Methyl groups on same side</text><text x="764" y="756" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#C44949">This curved-arrow sequence is scoped to the source’s secondary butan-2-ol example; it does not establish a free carbocation for the separate primary-ethanol equation.</text><text x="764" y="862" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".06">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE  •  STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="