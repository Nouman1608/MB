<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="title desc"><title id="title">Three amino acids form two peptide links</title><desc id="desc">Alanine, glycine and serine join from the N-terminus to the C-terminus. Two condensation steps remove two water molecules and form two peptide links, each with the sequence –C(=O)–NH–.</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#10233F">Three amino acids form two peptide links</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#5B6D80">Marlbridge • Chemistry teaching diagram</text><rect x="52" y="132" width="1424" height="250" rx="18" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="78" y="170" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#10233F">1  Three amino-acid residues</text><rect x="92" y="204" width="392" height="136" rx="12" fill="#E8F1F4" stroke="#168C8C" stroke-width="2"/><text x="110" y="232" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#168C8C">ALANINE</text><rect x="110" y="260" width="83" height="46" rx="8" fill="#FFFFFF" stroke="#168C8C" stroke-width="2"/><text x="151" y="289" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#168C8C">H₂N</text><text x="208" y="289" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#20314B">–</text><rect x="224" y="260" width="142" height="46" rx="8" fill="#FFFFFF" stroke="#168C8C" stroke-width="2"/><text x="295" y="289" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#20314B">CH(CH₃)</text><text x="382" y="289" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#20314B">–</text><rect x="398" y="260" width="72" height="46" rx="8" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/><text x="434" y="289" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#20314B">COOH</text><rect x="550" y="204" width="392" height="136" rx="12" fill="#E8F1F4" stroke="#315F86" stroke-width="2"/><text x="568" y="232" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#315F86">GLYCINE</text><rect x="568" y="260" width="83" height="46" rx="8" fill="#FFFFFF" stroke="#315F86" stroke-width="2"/><text x="609" y="289" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#315F86">H₂N</text><text x="666" y="289" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#20314B">–</text><rect x="682" y="260" width="142" height="46" rx="8" fill="#FFFFFF" stroke="#315F86" stroke-width="2"/><text x="753" y="289" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#20314B">CH₂</text><text x="840" y="289" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#20314B">–</text><rect x="856" y="260" width="72" height="46" rx="8" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/><text x="892" y="289" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#20314B">COOH</text><rect x="1008" y="204" width="392" height="136" rx="12" fill="#E8F1F4" stroke="#725C8E" stroke-width="2"/><text x="1026" y="232" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#725C8E">SERINE</text><rect x="1026" y="260" width="83" height="46" rx="8" fill="#FFFFFF" stroke="#725C8E" stroke-width="2"/><text x="1067" y="289" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#725C8E">H₂N</text><text x="1124" y="289" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#20314B">–</text><rect x="1140" y="260" width="142" height="46" rx="8" fill="#FFFFFF" stroke="#725C8E" stroke-width="2"/><text x="1211" y="289" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#20314B">CH(CH₂OH)</text><text x="1298" y="289" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#20314B">–</text><rect x="1314" y="260" width="72" height="46" rx="8" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/><text x="1350" y="289" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#20314B">COOH</text><text x="514" y="286" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#C9A227">+</text><text x="972" y="286" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#C9A227">+</text><rect x="52" y="410" width="1424" height="162" rx="16" fill="#EAF3F1" stroke="#168C8C" stroke-width="2"/><text x="78" y="448" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#10233F">2  Condensation joins each pair</text><rect x="96" y="472" width="430" height="68" rx="10" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="311" y="500" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#20314B">–COOH  +  H₂N–</text><text x="311" y="525" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">carboxyl group + amino group</text><text x="608" y="512" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#C9A227">→</text><rect x="686" y="472" width="322" height="68" rx="10" fill="#FFFFFF" stroke="#168C8C" stroke-width="2"/><text x="847" y="500" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#168C8C">–C(=O)–NH–  +  H₂O</text><text x="847" y="525" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">one peptide link + one water</text><text x="1114" y="500" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">Repeat this step once</text><text x="1114" y="526" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#20314B">for three residues → two links</text><rect x="52" y="598" width="1424" height="210" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="78" y="638" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#10233F">3  The tripeptide product</text><text x="90" y="688" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#5B6D80">N-terminus</text><text x="1438" y="688" text-anchor="end" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#5B6D80">C-terminus</text><text x="98" y="724" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#20314B">H₂N–CH(CH₃)–C(=O)–NH–CH₂–C(=O)–NH–CH(CH₂OH)–COOH</text><path d="M248 738L358 738" fill="none" stroke="#C9A227" stroke-width="4"  stroke-linecap="round"/><path d="M408 738L518 738" fill="none" stroke="#C9A227" stroke-width="4"  stroke-linecap="round"/><text x="303" y="762" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#C44949">peptide link 1</text><text x="463" y="762" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#C44949">peptide link 2</text><text x="764" y="838" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">Each link is –C(=O)–NH–  •  three residues form two links and release two H₂O</text><text x="764" y="862" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".06">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE  •  STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="887" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>