<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940"><defs><marker id="redarrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#C44949"/></marker><marker id="tealarrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#168C8C"/></marker><marker id="goldarrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#C9A227"/></marker></defs><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#10233F">Empirical formula: metal-oxide practicals</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="500" fill="#5B6D80">AQA practical methods • weigh, react, cool, and check constant mass</text><rect x="52" y="132" width="1424" height="650" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="82" y="178" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#10233F">Empirical formula of a metal oxide • two experimental routes</text><rect x="82" y="212" width="666" height="398" rx="12" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="780" y="212" width="666" height="398" rx="12" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="108" y="254" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">A  Make the oxide in air</text><text x="806" y="254" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233F">B  Reduce a weighed oxide in hydrogen</text><path d="M225 328h250l-26 112H251z" fill="#E8F1F4" stroke="#315F86" stroke-width="4"/><ellipse cx="350" cy="426" rx="36" ry="7" fill="#A7B6C2" stroke="#315F86" stroke-width="2"/><path d="M214 321h268M260 312h180" stroke="#315F86" stroke-width="5" stroke-linecap="round"/><path d="M260 312h180" stroke="#315F86" stroke-width="5"/><path d="M400 308v-23" stroke="#168C8C" stroke-width="3" marker-end="url(#tealarrow)"/><path d="M365 460c-26 17-26 30 0 42m50-42c-26 17-26 30 0 42" fill="none" stroke="#C44949" stroke-width="4"/><text x="108" y="540" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#20314B">Heat a weighed metal with the lid</text><text x="108" y="565" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#20314B">slightly raised so oxygen enters while</text><text x="108" y="590" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#20314B">little solid escapes. Cool and weigh.</text><text x="806" y="302" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#168C8C">H₂ in</text><rect x="850" y="310" width="500" height="92" rx="14" fill="#E8F1F4" stroke="#315F86" stroke-width="4"/><path d="M794 356h56M1350 356h54" stroke="#168C8C" stroke-width="4" marker-end="url(#tealarrow)"/><path d="M1030 310v92M1108 310v92" stroke="#315F86" stroke-width="2" stroke-dasharray="7 7"/><path d="M1034 371c-6 10-6 18 0 26h72c6-8 6-16 0-26" fill="#E5D2AE" stroke="#C9A227" stroke-width="3"/><text x="1070" y="367" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#20314B">weighed oxide</text><path d="M1027 458h84" stroke="#C44949" stroke-width="4"/><path d="M1042 458c2-25 10-36 28-40 18 4 26 15 28 40" fill="none" stroke="#C44949" stroke-width="3"/><text x="806" y="524" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#20314B">Heat the boat until the oxide is reduced.</text><text x="806" y="552" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">Cool while H₂ still flows; then weigh the metal.</text><rect x="112" y="632" width="1304" height="94" rx="10" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/><text x="140" y="668" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">Both routes:</text><text x="270" y="668" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">heat → cool → weigh → repeat until consecutive readings agree (constant mass).</text><text x="140" y="701" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#C44949">For Pb-oxide work the source specifies a fume cupboard: lead compounds are toxic.</text><text x="88" y="762" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#5B6D80">Interpretation check: incomplete reduction leaves final mass too high, so calculated oxygen mass is too low.</text><text x="764" y="862" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".06">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE  •  STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="887" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
