ont-size="16" font-weight="600" fill="#20314B">6 C, open chain, one C=C</text><text x="1237" y="657" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#168C8C">C₆H₁₂</text><text x="764" y="742" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">Same molecular formula does not prove the same structure: hex-1-ene and cyclohexane are constitutional isomers.</text><text x="764" y="862" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".06">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE  •  STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="887" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
