<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1290" viewBox="0 0 1800 2580" role="img" aria-labelledby="title desc"><title id="title">Aqueous electrolysis: two worked cases (OCR GCSE Chemistry)</title><desc id="desc">Two cells with inert carbon electrodes and a gas tube over each electrode. Concentrated sodium chloride (ions Na+, Cl-, H+, OH-) gives hydrogen at the cathode, which burns with a squeaky pop, and chlorine at the anode, which bleaches damp litmus. Dilute sulfuric acid (ions H+, SO4 2-, OH-) gives hydrogen at the cathode and oxygen, which relights a glowing splint, at the anode, in a 2 : 1 volume ratio. The half-equations under each cell are marked Higher tier only.</desc><rect width="1800" height="2580" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="112" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle">Aqueous electrolysis: two worked cases</text>
<text x="900" y="178" font-size="42" fill="#4B5B72" text-anchor="middle">Inert carbon electrodes; gas collected over each</text>
