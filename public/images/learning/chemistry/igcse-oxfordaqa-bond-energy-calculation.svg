<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1050" viewBox="0 0 1800 2100" role="img" aria-labelledby="title desc"><title id="title">Bond energy calculation (OxfordAQA International GCSE Chemistry)</title><desc id="desc">No tier label: OxfordAQA International GCSE Chemistry is not tiered; 9202 statements 3.9.2e and 3.9.2f cover energy to break and make bonds and calculating the energy transferred from bond dissociation energies. H2 + Cl2 → 2HCl, with bond energies in kJ/mol: H–H 436, Cl–Cl 242, H–Cl 431. Break bonds, energy in: 436 + 242 = 678, giving separate H and Cl atoms. Make bonds, energy out: 2 × 431 = 862, giving two H–Cl molecules. ΔH = 678 − 862 = −184 kJ/mol; negative, because more energy is released than taken in, so the reaction is exothermic.</desc><rect width="1800" height="2100" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="92" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle">Bonds break, then new bonds make</text>
<text x="900" y="174" font-size="38" fill="#4B5B72" text-anchor="middle" xml:space="preserve"><tspan>H</tspan><tspan dy="10.6" font-size="25.8">2</tspan><tspan dy="-10.6"> + Cl</tspan><tspan dy="10.6" font-size="25.8">2</tspan><tspan dy="-10.6"> → 2HCl</tspan></text>
<circle cx="360" cy="436" r="52" fill="#FFFFFF" stroke="#1E2B47" stroke-width="6"/>
<text x="360" y="450" font-size="40" font-weight="700" fill="#1E2B47" text-anchor="middle">H</text>
<circle cx="450" cy="436" r="52" fill="#FFFFFF" stroke="#1E2B47" stroke-width="6"/>
<text x="450" y="450" font-size="40" font-weight="700" fill="#1E2B47" text-anchor="middle">H</text>
<text x="404" y="566" font-size="42" font-weight="700" fill="#1E2B47" text-anchor="middle">H–H</text>
<text x="404" y="622" font-size="42" fill="#1E2B47" text-anchor="middle">436</text>
<text x="660" y="456" font-size="60" font-weight="700" fill="#1E2B47" text-anchor="middle">+</text>
<line x1="950" y1="436" x2="970" y2="436" stroke="#1E2B47" stroke-width="12"/>
<circle cx="880" cy="436" r="76" fill="#F2E6B7" stroke="#8A6A0C" stroke-width="6"/>
<text x="880" y="450" font-size="40" font-weight="700" fill="#1E2B47" text-anchor="middle">Cl</text>
<circle cx="1040" cy="436" r="76" fill="#F2E6B7" stroke="#8A6A0C" stroke-width="6"/>
<text x="1040" y="450" font-size="40" font-weight="700" fill="#1E2B47" text-anchor="middle">Cl</text>
<line x1="952" y1="436" x2="968" y2="436" stroke="#1E2B47" stroke-width="12"/>
<text x="960" y="590" font-size="42" font-weight="700" fill="#1E2B47" text-anchor="middle">Cl–Cl</text>
<text x="960" y="646" font-size="42" fill="#1E2B47" text-anchor="middle">242</text>
<text x="1450" y="426" font-size="40" fill="#4B5B72" text-anchor="middle">bond energies</text>
<text x="1450" y="484" font-size="40" fill="#4B5B72" text-anchor="middle">kJ/mol</text>
<line x1="320" y1="710" x2="320" y2="832" stroke="#2F6B63" stroke-width="12" stroke-linecap="round"/><polygon points="320,914 273.8,830 366.2,830" fill="#2F6B63"/>
<text x="380" y="776" font-size="46" font-weight="700" fill="#2F6B63">Break bonds: energy in</text>
<text x="380" y="852" font-size="46" fill="#1E2B47">436 + 242 = 678</text>
<text x="680" y="948" font-size="40" fill="#4B5B72" text-anchor="middle">separate atoms</text>
<circle cx="360" cy="1060" r="52" fill="#FFFFFF" stroke="#1E2B47" stroke-width="6"/>
<text x="360" y="1074" font-size="40" font-weight="700" fill="#1E2B47" text-anchor="middle">H</text>
<circle cx="520" cy="1060" r="52" fill="#FFFFFF" stroke="#1E2B47" stroke-width="6"/>
<text x="520" y="1074" font-size="40" font-weight="700" fill="#1E2B47" text-anchor="middle">H</text>
<circle cx="800" cy="1060" r="76" fill="#F2E6B7" stroke="#8A6A0C" stroke-width="6"/>
<text x="800" y="1074" font-size="40" font-weight="700" fill="#1E2B47" text-anchor="middle">Cl</text>
<circle cx="1000" cy="1060" r="76" fill="#F2E6B7" stroke="#8A6A0C" stroke-width="6"/>
<text x="1000" y="1074" font-size="40" font-weight="700" fill="#1E2B47" text-anchor="middle">Cl</text>
<line x1="320" y1="1196" x2="320" y2="1312" stroke="#B9632F" stroke-width="12" stroke-linecap="round"/><polygon points="320,1394 273.8,1310 366.2,1310" fill="#B9632F"/>
<text x="380" y="1256" font-size="46" font-weight="700" fill="#B9632F">Make bonds: energy out</text>
<text x="380" y="1332" font-size="46" fill="#1E2B47">2 × 431 = 862</text>
<line x1="404" y1="1540" x2="430" y2="1540" stroke="#1E2B47" stroke-width="12"/>
<circle cx="360" cy="1540" r="52" fill="#FFFFFF" stroke="#1E2B47" stroke-width="6"/>
<text x="360" y="1554" font-size="40" font-weight="700" fill="#1E2B47" text-anchor="middle">H</text>
<circle cx="500" cy="1540" r="76" fill="#F2E6B7" stroke="#8A6A0C" stroke-width="6"/>
<text x="500" y="1554" font-size="40" font-weight="700" fill="#1E2B47" text-anchor="middle">Cl</text>
<line x1="406" y1="1540" x2="428" y2="1540" stroke="#1E2B47" stroke-width="12"/>
<text x="730" y="1556" font-size="60" font-weight="700" fill="#1E2B47" text-anchor="middle">+</text>
<circle cx="960" cy="1540" r="52" fill="#FFFFFF" stroke="#1E2B47" stroke-width="6"/>
<text x="960" y="1554" font-size="40" font-weight="700" fill="#1E2B47" text-anchor="middle">H</text>
<circle cx="1100" cy="1540" r="76" fill="#F2E6B7" stroke="#8A6A0C" stroke-width="6"/>
<text x="1100" y="1554" font-size="40" font-weight="700" fill="#1E2B47" text-anchor="middle">Cl</text>
<line x1="1006" y1="1540" x2="1028" y2="1540" stroke="#1E2B47" stroke-width="12"/>
<text x="430" y="1690" font-size="42" font-weight="700" fill="#1E2B47" text-anchor="middle">H–Cl</text>
<text x="1030" y="1690" font-size="42" font-weight="700" fill="#1E2B47" text-anchor="middle">H–Cl</text>
<text x="1480" y="1524" font-size="42" fill="#1E2B47" text-anchor="middle">431 each</text>
<rect x="60" y="1780" width="1680" height="260" rx="24" fill="#FFFFFF" stroke="#1E2B47" stroke-width="5"/>
<text x="900" y="1892" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle">ΔH = 678 − 862 = −184 kJ/mol</text>
<text x="900" y="1986" font-size="42" fill="#1E2B47" text-anchor="middle">Negative: more energy released, so exothermic</text></g></svg>
