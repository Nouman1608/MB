<svg xmlns="http://www.w3.org/2000/svg" width="900" height="960" viewBox="0 0 1800 1920" role="img" aria-labelledby="title desc"><title id="title">Making an ester (Edexcel International GCSE Chemistry: Paper 2 only)</title><desc id="desc">Marked Paper 2 only: esters are 4CH1 statements 4.38C–4.43C, in bold (4.39C: ethyl ethanoate is made from ethanol and ethanoic acid with an acid catalyst). Ethanoic acid, CH3COOH, reacts with ethanol, C2H5OH, with an acid catalyst to give ethyl ethanoate, CH3COOC2H5, and water. The OH from the acid and the H from the alcohol (gold) are lost as water. In the name, ethyl comes from the alcohol and ethanoate from the acid.</desc><rect width="1800" height="1920" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="92" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle">Making an ester</text>
<text x="900" y="174" font-size="42" fill="#4B5B72" text-anchor="middle">Acid + alcohol: ester + water</text>
