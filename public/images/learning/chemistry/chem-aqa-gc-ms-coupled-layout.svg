<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1528 940" role="img" aria-labelledby="title desc">
  <title id="title">Gas chromatography coupled to mass spectrometry</title>
  <desc id="desc">A vaporised mixture enters a heated GC capillary column and separates into components with different retention times. The outlet connects to a mass spectrometer, where molecules are ionised, ions separated by mass-to-charge ratio and detected as a spectrum. Co-elution can produce a mixed spectrum.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#147d82"/></marker>
    <style>
      text{font-family:Arial,"Liberation Sans",sans-serif;fill:#172b4d}.title{font-size:34px;font-weight:700}.sub{font-size:19px;fill:#475569}
      .head{font-size:22px;font-weight:700;fill:#0f766e}.body{font-size:17px}.small{font-size:15px;fill:#475569}
      .panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}
    </style>
  </defs>
  <rect width="1528" height="940" rx="24" fill="#f4f8fb"/>
  <text class="title" x="54" y="62">GC–MS: separate first, then analyse</text>
  <text class="sub" x="55" y="96">The GC outlet feeds the mass spectrometer, so components arrive according to their retention times.</text>
  <text x="1472" y="60" text-anchor="end" font-size="15" font-weight="700" fill="#0f766e">AQA A-LEVEL CHEMISTRY</text>

  <rect class="panel" x="44" y="132" width="1440" height="465" rx="18"/>
  <!-- 1 inlet -->
  <circle cx="87" cy="178" r="20" fill="#d9f1ed"/><text x="87" y="184" text-anchor="middle" font-size="19" font-weight="700">1</text>
  <text class="head" x="121" y="185">Inject and vaporise</text>
  <rect x="77" y="241" width="184" height="237" rx="15" fill="#eef5f8" stroke="#64748b" stroke-width="3"/>
  <rect x="101" y="272" width="136" height="48" rx="8" fill="#fff" stroke="#64748b" stroke-width="2"/>
  <text class="small" x="169" y="302" text-anchor="middle">sample inlet</text>
  <path d="M169 226 L169 270" stroke="#334155" stroke-width="3"/>
  <path d="M155 229 L183 229 L169 248 Z" fill="#d3e3eb" stroke="#334155" stroke-width="2"/>
  <path d="M109 365 Q169 337 229 365 L229 430 Q169 452 109 430 Z" fill="#d9edf4" stroke="#147d82" stroke-width="2"/>
  <text class="small" x="169" y="394" text-anchor="middle">heated</text>
  <text class="small" x="169" y="415" text-anchor="middle">vaporiser</text>
  <text class="small" x="169" y="509" text-anchor="middle">carrier gas + vapour</text>

  <!-- 2 GC oven and capillary -->
  <circle cx="327" cy="178" r="20" fill="#d9f1ed"/><text x="327" y="184" text-anchor="middle" font-size="19" font-weight="700">2</text>
  <text class="head" x="361" y="185">Separate in the GC column</text>
  <rect x="323" y="241" width="412" height="237" rx="15" fill="#fff4dc" stroke="#b7791f" stroke-width="3"/>
  <text class="small" x="529" y="268" text-anchor="middle">temperature-controlled oven</text>
  <path d="M262 296 L301 296 L301 350 L352 350" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M354 350 C382 304 410 304 438 350 C466 396 494 396 522 350 C550 304 578 304 606 350 C634 396 662 396 690 350" fill="none" stroke="#376c99" stroke-width="8" stroke-linecap="round"/>
  <circle cx="391" cy="333" r="10" fill="#d79532"/><circle cx="473" cy="377" r="10" fill="#267bb3"/><circle cx="555" cy="333" r="10" fill="#b15874"/>
  <path d="M690 350 L758 350" stroke="#147d82" stroke-width="4" marker-end="url(#arrow)"/>
  <text class="small" x="529" y="433" text-anchor="middle">components separate by retention</text>
  <text class="small" x="529" y="455" text-anchor="middle">then leave the column one after another when resolved</text>

  <!-- 3 transfer and ionisation -->
  <circle cx="799" cy="178" r="20" fill="#d9f1ed"/><text x="799" y="184" text-anchor="middle" font-size="19" font-weight="700">3</text>
  <text class="head" x="833" y="185">Transfer to MS</text>
  <rect x="800" y="241" width="247" height="237" rx="15" fill="#eef5f8" stroke="#64748b" stroke-width="3"/>
  <path d="M758 350 L800 350" stroke="#147d82" stroke-width="4" marker-end="url(#arrow)"/>
  <text class="small" x="923" y="279" text-anchor="middle">GC outlet</text>
  <rect x="838" y="312" width="171" height="91" rx="13" fill="#fff" stroke="#334155" stroke-width="2"/>
  <text class="body" x="923" y="345" text-anchor="middle">ion source</text>
  <text class="small" x="923" y="373" text-anchor="middle">molecules become ions</text>
  <path d="M862 427 L984 427" stroke="#8c67a5" stroke-width="3" stroke-dasharray="8 6"/>
  <text class="small" x="923" y="456" text-anchor="middle">sample enters under vacuum</text>

  <!-- 4 analyser/detector -->
  <circle cx="1100" cy="178" r="20" fill="#d9f1ed"/><text x="1100" y="184" text-anchor="middle" font-size="19" font-weight="700">4</text>
  <text class="head" x="1134" y="185">Measure m/z</text>
  <rect x="1097" y="241" width="347" height="237" rx="15" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M1047 350 L1097 350" stroke="#147d82" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1151 322 Q1197 350 1151 378 M1198 322 Q1244 350 1198 378" fill="none" stroke="#8c67a5" stroke-width="5"/>
  <text class="small" x="1180" y="412" text-anchor="middle">mass analyser sorts ions by m/z</text>
  <path d="M1254 350 L1304 350" stroke="#147d82" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="1307" y="305" width="102" height="90" rx="12" fill="#d9f1ed" stroke="#147d82" stroke-width="2"/>
  <text class="body" x="1358" y="344" text-anchor="middle">detector</text>
  <text class="small" x="1358" y="371" text-anchor="middle">signal</text>
  <text class="small" x="1270" y="455" text-anchor="middle">signal becomes a mass spectrum</text>

  <!-- chromatogram plus mass spectrum -->
  <rect class="panel" x="44" y="622" width="692" height="232" rx="16"/>
  <text x="78" y="663" font-size="22" font-weight="700" fill="#0f766e">GC chromatogram: when components leave</text>
  <path d="M111 799 L111 693 L691 693" fill="none" stroke="#334155" stroke-width="2"/>
  <path d="M125 797 L224 797 Q237 797 244 758 Q250 721 258 758 Q266 797 281 797 L403 797 Q417 797 425 740 Q433 709 441 740 Q449 797 464 797 L576 797 Q590 797 597 763 Q605 735 614 763 Q623 797 639 797" fill="none" stroke="#267bb3" stroke-width="4"/>
  <text class="small" x="399" y="829" text-anchor="middle">retention time</text>

  <rect class="panel" x="758" y="622" width="726" height="232" rx="16"/>
  <text x="792" y="663" font-size="22" font-weight="700" fill="#0f766e">Mass spectrum: ion abundance by m/z</text>
  <path d="M817 799 L817 693 L1441 693" fill="none" stroke="#334155" stroke-width="2"/>
  <path d="M846 797 L846 771 M894 797 L894 748 M949 797 L949 711 M1003 797 L1003 765 M1061 797 L1061 730 M1122 797 L1122 760 M1182 797 L1182 703 M1244 797 L1244 754 M1302 797 L1302 735 M1372 797 L1372 773" stroke="#8c67a5" stroke-width="8"/>
  <text class="small" x="1129" y="829" text-anchor="middle">mass-to-charge ratio, m/z</text>

  <rect x="44" y="872" width="1440" height="38" rx="10" fill="#fff4dc"/>
  <text class="small" x="764" y="897" text-anchor="middle">Co-elution can give a mixed spectrum. Accurate m/z narrows candidate formulas within measurement uncertainty; it does not establish connectivity by itself.</text>
  <text x="1478" y="930" text-anchor="end" font-size="13" font-weight="700" fill="#47647b">MARLBRIDGE • STUDY RESOURCES</text>
</svg>
