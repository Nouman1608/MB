<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#C44949"/></marker><marker id="goldarrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#C9A227"/></marker><marker id="tealarrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#168C8C"/></marker></defs><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#10233F">Tertiary alcohol dehydration: E1 curly arrows</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="500" fill="#5B6D80">Acid catalyst • protonation → water loss → β-elimination</text><rect x="52" y="132" width="1424" height="650" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="82" y="176" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">2-methylpentan-2-ol • acid-catalysed E1 dehydration</text><rect x="82" y="214" width="442" height="454" rx="12" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="568" y="214" width="442" height="454" rx="12" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="1054" y="214" width="442" height="454" rx="12" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="106" y="256" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">1  Protonate –OH</text><text x="106" y="304" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">(CH₃)₂C(OH)CH₂CH₂CH₃ + H–A</text><path d="M242 338 C260 315 281 315 303 338" fill="none" stroke="#168C8C" stroke-width="4" marker-end="url(#tealarrow)"/><text x="108" y="376" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#168C8C">O lone pair → H</text><path d="M382 338 C395 360 402 367 419 376" fill="none" stroke="#C44949" stroke-width="4" marker-end="url(#arrow)"/><text x="108" y="418" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#C44949">H–A bond pair → A⁻</text><text x="108" y="470" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#20314B">(CH₃)₂C(OH₂⁺)CH₂CH₂CH₃</text><text x="108" y="520" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#5B6D80">Water is now a leaving group.</text><text x="592" y="256" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">2  Water leaves</text><text x="592" y="312" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#20314B">(CH₃)₂C(OH₂⁺)CH₂CH₂CH₃</text><path d="M758 338 C780 363 804 378 834 383" fill="none" stroke="#C44949" stroke-width="4" marker-end="url(#arrow)"/><text x="592" y="412" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#C44949">C–O bond pair → O</text><text x="592" y="466" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#168C8C">(CH₃)₂C⁺CH₂CH₂CH₃ + H₂O</text><text x="592" y="520" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">The tertiary carbocation forms</text><text x="592" y="544" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">before the alkene.</text><text x="1078" y="256" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">3  Remove a neighbouring H</text><text x="1078" y="302" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#168C8C">A⁻ removes a β-H</text><text x="1078" y="345" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#C44949">Cβ–H pair → Cα=Cβ</text><path d="M1110 374 C1150 347 1208 347 1248 374" fill="none" stroke="#168C8C" stroke-width="4" marker-end="url(#tealarrow)"/><text x="1078" y="420" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">Two non-equivalent β sites:</text><text x="1078" y="456" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">methyl → 2-methylpent-1-ene</text><text x="1078" y="488" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">C3 → 2-methylpent-2-ene</text><text x="1078" y="536" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#397D64">H–A is regenerated: acid catalyst.</text><rect x="104" y="694" width="1288" height="56" rx="8" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/><text x="748" y="730" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">Start each curly arrow at a lone pair or bond. Neither product has E/Z: one alkene carbon has two identical groups.</text><text x="764" y="862" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".06">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE  •  STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="887" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
