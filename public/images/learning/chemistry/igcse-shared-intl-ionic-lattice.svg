<svg xmlns="http://www.w3.org/2000/svg" width="900" height="924" viewBox="0 0 1800 1848" role="img" aria-labelledby="title desc"><title id="title">A giant ionic lattice</title><desc id="desc">No tier label: ionic bonding as electrostatic attraction and the high melting points of giant ionic lattices are on both Edexcel International GCSE papers (4CH1 1.41, 1.42) and OxfordAQA International GCSE Chemistry is not tiered (9202 3.2.1f, 3.2.2a). A grid of alternating positive and negative ions, five rows of six. One positive ion is highlighted with gold lines to its four neighbouring negative ions. Each ion is attracted to all its neighbours; many strong attractions give a high melting point.</desc><rect width="1800" height="1848" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="92" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle">A giant ionic lattice</text>
