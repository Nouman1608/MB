<svg xmlns="http://www.w3.org/2000/svg" width="900" height="950" viewBox="0 0 1800 1900" role="img" aria-labelledby="title desc"><title id="title">Ionic formulae: charges must cancel (Edexcel International GCSE Chemistry)</title><desc id="desc">No tier label: the charges of ions and writing formulae from them are 4CH1 statements 1.38 and 1.39, on both papers. One Mg2+ ion and two Cl- ions: 1 × (+2) = +2 and 2 × (−1) = −2, so the formula is MgCl2. Two Al3+ ions and three O2- ions: 2 × (+3) = +6 and 3 × (−2) = −6, so the formula is Al2O3.</desc><rect width="1800" height="1900" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="92" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle">Ionic formulae: charges must cancel</text>
<text x="900" y="174" font-size="42" fill="#4B5B72" text-anchor="middle">Total + charge = total − charge</text>
<rect x="60" y="340" width="1680" height="720" rx="24" fill="#FFFFFF" stroke="#1E2B47" stroke-width="5"/>
<circle cx="732" cy="490" r="80" fill="#DDEBE8" stroke="#2F6B63" stroke-width="5"/>
<text x="732" y="503.68" font-size="38" font-weight="700" fill="#2F6B63" text-anchor="middle" xml:space="preserve"><tspan>Mg</tspan><tspan dy="-14.4" font-size="25.8">2+</tspan></text>
<circle cx="900" cy="490" r="80" fill="#F2E6B7" stroke="#8A6A0C" stroke-width="5"/>
<text x="900" y="503.68" font-size="38" font-weight="700" fill="#8A6A0C" text-anchor="middle" xml:space="preserve"><tspan>Cl</tspan><tspan dy="-14.4" font-size="25.8">−</tspan></text>
<circle cx="1066" cy="490" r="80" fill="#F2E6B7" stroke="#8A6A0C" stroke-width="5"/>
<text x="1066" y="503.68" font-size="38" font-weight="700" fill="#8A6A0C" text-anchor="middle" xml:space="preserve"><tspan>Cl</tspan><tspan dy="-14.4" font-size="25.8">−</tspan></text>
<text x="900" y="716" font-size="44" font-weight="700" fill="#2F6B63" text-anchor="middle">1 × (+2) = +2</text>
<text x="900" y="806" font-size="44" font-weight="700" fill="#8A6A0C" text-anchor="middle">2 × (−1) = −2</text>
<line x1="600" y1="864" x2="1200" y2="864" stroke="#1E2B47" stroke-width="5" stroke-linecap="round"/>
<text x="900" y="998" font-size="96" font-weight="700" fill="#1E2B47" text-anchor="middle" xml:space="preserve"><tspan>MgCl</tspan><tspan dy="26.9" font-size="65.3">2</tspan></text>
<rect x="60" y="1120" width="1680" height="720" rx="24" fill="#FFFFFF" stroke="#1E2B47" stroke-width="5"/>
<circle cx="564" cy="1270" r="80" fill="#DDEBE8" stroke="#2F6B63" stroke-width="5"/>
<text x="564" y="1283.68" font-size="38" font-weight="700" fill="#2F6B63" text-anchor="middle" xml:space="preserve"><tspan>Al</tspan><tspan dy="-14.4" font-size="25.8">3+</tspan></text>
<circle cx="732" cy="1270" r="80" fill="#DDEBE8" stroke="#2F6B63" stroke-width="5"/>
<text x="732" y="1283.68" font-size="38" font-weight="700" fill="#2F6B63" text-anchor="middle" xml:space="preserve"><tspan>Al</tspan><tspan dy="-14.4" font-size="25.8">3+</tspan></text>
<circle cx="900" cy="1270" r="80" fill="#F2E6B7" stroke="#8A6A0C" stroke-width="5"/>
<text x="900" y="1283.68" font-size="38" font-weight="700" fill="#8A6A0C" text-anchor="middle" xml:space="preserve"><tspan>O</tspan><tspan dy="-14.4" font-size="25.8">2−</tspan></text>
<circle cx="1066" cy="1270" r="80" fill="#F2E6B7" stroke="#8A6A0C" stroke-width="5"/>
<text x="1066" y="1283.68" font-size="38" font-weight="700" fill="#8A6A0C" text-anchor="middle" xml:space="preserve"><tspan>O</tspan><tspan dy="-14.4" font-size="25.8">2−</tspan></text>
<circle cx="1232" cy="1270" r="80" fill="#F2E6B7" stroke="#8A6A0C" stroke-width="5"/>
<text x="1232" y="1283.68" font-size="38" font-weight="700" fill="#8A6A0C" text-anchor="middle" xml:space="preserve"><tspan>O</tspan><tspan dy="-14.4" font-size="25.8">2−</tspan></text>
<text x="900" y="1496" font-size="44" font-weight="700" fill="#2F6B63" text-anchor="middle">2 × (+3) = +6</text>
<text x="900" y="1586" font-size="44" font-weight="700" fill="#8A6A0C" text-anchor="middle">3 × (−2) = −6</text>
<line x1="600" y1="1644" x2="1200" y2="1644" stroke="#1E2B47" stroke-width="5" stroke-linecap="round"/>
<text x="900" y="1778" font-size="96" font-weight="700" fill="#1E2B47" text-anchor="middle" xml:space="preserve"><tspan>Al</tspan><tspan dy="26.9" font-size="65.3">2</tspan><tspan dy="-26.9">O</tspan><tspan dy="26.9" font-size="65.3">3</tspan></text></g></svg>
