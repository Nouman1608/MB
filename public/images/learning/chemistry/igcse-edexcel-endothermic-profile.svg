<text x="980" y="1562" font-size="44" font-weight="700" fill="#1E2B47" text-anchor="middle">Progress of reaction</text>
<line x1="644" y1="744" x2="870" y2="744" stroke="#4B5B72" stroke-width="3" stroke-dasharray="12 10"/>
<line x1="584" y1="1224" x2="1600" y2="1224" stroke="#4B5B72" stroke-width="3" stroke-dasharray="12 10"/>
