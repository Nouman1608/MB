<svg xmlns="http://www.w3.org/2000/svg" width="900" height="950" viewBox="0 0 1800 1900" role="img" aria-labelledby="title desc"><title id="title">Endothermic reaction profile (Edexcel International GCSE Chemistry: Paper 2 only)</title><desc id="desc">Marked Paper 2 only: reaction profile diagrams showing ΔH and activation energy are 4CH1 statement 3.14C, and energy level diagrams 3.5C, both in bold; the terms exothermic and endothermic (3.1) are on both papers. Sketch reaction pathway diagram, not to scale: energy against progress of reaction. The reactants start lower; the curve rises by the activation energy, Ea, to a peak, then falls a little to the products, which end higher. ΔH is positive, shown by an upward arrow. Energy is absorbed, so the surroundings get colder.</desc><rect width="1800" height="1900" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="92" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle">Endothermic: products end higher</text>
<text x="900" y="174" font-size="42" fill="#4B5B72" text-anchor="middle">Reaction pathway diagram</text>
<rect x="60" y="231" width="285" height="58" rx="29" fill="#8A6A0C"/><text x="202.5" y="272.96" font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="middle">Paper 2 only</text>
