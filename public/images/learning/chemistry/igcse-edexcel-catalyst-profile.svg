<svg xmlns="http://www.w3.org/2000/svg" width="900" height="860" viewBox="0 0 1800 1720" role="img" aria-labelledby="title desc"><title id="title">How a catalyst helps (Edexcel International GCSE Chemistry)</title><desc id="desc">A catalyst providing an alternative pathway with lower activation energy is 4CH1 statement 3.13, on both papers; drawing reaction profile diagrams with activation energy is 3.14C, in bold, so the diagram is labelled Profile diagram: Paper 2 only. Sketch reaction profile, not to scale: energy against progress of reaction. Without a catalyst the curve rises by the activation energy, Ea, to a high peak; with a catalyst (dashed) it takes an alternative pathway with a lower peak, so the activation energy is smaller. Reactants and products are at the same energies on both paths.</desc><rect width="1800" height="1720" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="92" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle">How a catalyst helps</text>
<text x="900" y="172" font-size="42" fill="#4B5B72" text-anchor="middle">Lower activation energy, alternative pathway</text>
<rect x="60" y="235" width="593" height="54" rx="27" fill="#8A6A0C"/><text x="356.5" y="274.24" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">Profile diagram: Paper 2 only</text>
