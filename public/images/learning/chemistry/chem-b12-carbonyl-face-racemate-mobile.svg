<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1120" viewBox="0 0 768 1120" role="img" aria-labelledby="title desc"><title id="title">Two-face attack gives a racemate</title><desc id="desc">In achiral conditions, cyanide attacks planar ethanal from either face with equal probability, forming a pair of enantiomeric cyanohydrins.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#172b3c"/></marker><marker id="tealArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#288a83"/></marker></defs><style>text{font-family:Arial,"Liberation Sans",sans-serif}</style><rect width="100%" height="100%" fill="#fbfcfa"/><text x="44" y="58" font-size="30" fill="#172b3c" font-weight="700">Two-face attack gives a racemate</text><rect x="28" y="90" width="712" height="940" rx="24" fill="#f2f7f6"/><rect x="60" y="125" width="648" height="145" rx="20" fill="white" stroke="#c9d8dc" stroke-width="2"/><rect x="60" y="125" width="648" height="10" rx="5" fill="#288a83"/><text x="82" y="170" font-size="25" fill="#172b3c" font-weight="700">Planar ethanal</text><text x="82" y="207" font-size="21" fill="#203545" font-weight="400">The carbonyl carbon is trigonal planar.</text><text x="150" y="335" font-size="28" fill="#172b3c" font-weight="700">CN⁻ attacks either face</text><line x1="380" y1="365" x2="300" y2="425" stroke="#c45637" stroke-width="5"  marker-end="url(#arrow)"/><line x1="380" y1="365" x2="460" y2="425" stroke="#288a83" stroke-width="5"  marker-end="url(#arrow)"/><rect x="60" y="470" width="300" height="190" rx="20" fill="white" stroke="#c9d8dc" stroke-width="2"/><rect x="60" y="470" width="300" height="10" rx="5" fill="#288a83"/><text x="82" y="515" font-size="25" fill="#172b3c" font-weight="700">Product A</text><text x="82" y="552" font-size="21" fill="#203545" font-weight="400">OH projects forward</text><text x="82" y="578.25" font-size="21" fill="#203545" font-weight="400">(wedge); C* also</text><text x="82" y="604.5" font-size="21" fill="#203545" font-weight="400">bonds to CH₃, H and</text><text x="82" y="630.75" font-size="21" fill="#203545" font-weight="400">CN.</text><rect x="408" y="470" width="300" height="190" rx="20" fill="white" stroke="#c9d8dc" stroke-width="2"/><rect x="408" y="470" width="300" height="10" rx="5" fill="#c45637"/><text x="430" y="515" font-size="25" fill="#172b3c" font-weight="700">Product B</text><text x="430" y="552" font-size="21" fill="#203545" font-weight="400">OH projects behind</text><text x="430" y="578.25" font-size="21" fill="#203545" font-weight="400">(dash); C* also</text><text x="430" y="604.5" font-size="21" fill="#203545" font-weight="400">bonds to CH₃, H and</text><text x="430" y="630.75" font-size="21" fill="#203545" font-weight="400">CN.</text><text x="90" y="725" font-size="25" fill="#172b3c" font-weight="700">Each product: CH₃, H, OH, CN</text><rect x="60" y="790" width="648" height="150" rx="20" fill="white" stroke="#c9d8dc" stroke-width="2"/><rect x="60" y="790" width="648" height="10" rx="5" fill="#e5b94c"/><text x="82" y="835" font-size="25" fill="#172b3c" font-weight="700">Equal face attack</text><text x="82" y="872" font-size="21" fill="#203545" font-weight="400">In an achiral setting: 50:50 enantiomers, a</text><text x="82" y="898.25" font-size="21" fill="#203545" font-weight="400">racemate.</text><line x1="40" y1="1066" x2="728" y2="1066" stroke="#d9e3e4"/><text x="44" y="1098" font-size="16" fill="#607783" font-weight="600">MARLBRIDGE  •  Schematic; not to scale</text></svg>
