<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="870" viewBox="0 0 1528 870" role="img" aria-labelledby="title desc"><title id="title">One triglyceride makes soap or biodiesel</title><desc id="desc">A triglyceride has three ester links. Alkaline hydrolysis makes three carboxylate soap molecules plus glycerol; methanol transesterification makes three methyl esters plus glycerol.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#172b3c"/></marker><marker id="tealArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#288a83"/></marker></defs><style>text{font-family:Arial,"Liberation Sans",sans-serif}</style><rect width="100%" height="100%" fill="#fbfcfa"/><text x="44" y="58" font-size="34" fill="#172b3c" font-weight="700">One triglyceride makes soap or biodiesel</text><rect x="40" y="95" width="1448" height="690" rx="26" fill="#f2f7f6"/><rect x="65" y="130" width="400" height="570" rx="20" fill="white" stroke="#c9d8dc" stroke-width="2"/><rect x="65" y="130" width="400" height="10" rx="5" fill="#288a83"/><text x="87" y="175" font-size="25" fill="#172b3c" font-weight="700">Starting fat</text><text x="87" y="212" font-size="21" fill="#203545" font-weight="400">One glycerol backbone</text><text x="87" y="238.25" font-size="21" fill="#203545" font-weight="400">carries three fatty-acid</text><text x="87" y="264.5" font-size="21" fill="#203545" font-weight="400">ester chains.</text><text x="87" y="290.75" font-size="21" fill="#203545" font-weight="400">(C₁₁H₂₃COO)₃C₃H₅</text><text x="110" y="360" font-size="27" fill="#172b3c" font-weight="700">CH₂–O–C(O)–R</text><text x="110" y="415" font-size="27" fill="#172b3c" font-weight="700">CH –O–C(O)–R</text><text x="110" y="470" font-size="27" fill="#172b3c" font-weight="700">CH₂–O–C(O)–R</text><line x1="480" y1="410" x2="590" y2="410" stroke="#172b3c" stroke-width="4"  marker-end="url(#arrow)"/><rect x="615" y="120" width="400" height="270" rx="20" fill="white" stroke="#c9d8dc" stroke-width="2"/><rect x="615" y="120" width="400" height="10" rx="5" fill="#e5b94c"/><text x="637" y="165" font-size="25" fill="#172b3c" font-weight="700">NaOH: saponification</text><text x="637" y="202" font-size="21" fill="#203545" font-weight="400">Break all three ester</text><text x="637" y="228.25" font-size="21" fill="#203545" font-weight="400">links: 1 fat + 3 NaOH → 3</text><text x="637" y="254.5" font-size="21" fill="#203545" font-weight="400">RCOO⁻Na⁺ + glycerol.</text><text x="675" y="340" font-size="28" fill="#288a83" font-weight="700">3 soap salts</text><line x1="1030" y1="250" x2="1135" y2="250" stroke="#172b3c" stroke-width="4"  marker-end="url(#arrow)"/><rect x="1160" y="120" width="300" height="270" rx="20" fill="white" stroke="#c9d8dc" stroke-width="2"/><rect x="1160" y="120" width="300" height="10" rx="5" fill="#288a83"/><text x="1182" y="165" font-size="25" fill="#172b3c" font-weight="700">Soap</text><text x="1182" y="202" font-size="21" fill="#203545" font-weight="400">Carboxylate salts</text><text x="1182" y="228.25" font-size="21" fill="#203545" font-weight="400">(RCOO⁻Na⁺).</text><line x1="480" y1="520" x2="590" y2="520" stroke="#172b3c" stroke-width="4"  marker-end="url(#arrow)"/><rect x="615" y="430" width="400" height="270" rx="20" fill="white" stroke="#c9d8dc" stroke-width="2"/><rect x="615" y="430" width="400" height="10" rx="5" fill="#c45637"/><text x="637" y="475" font-size="25" fill="#172b3c" font-weight="700">Methanol: transesterification</text><text x="637" y="512" font-size="21" fill="#203545" font-weight="400">Exchange glycerol links: 1</text><text x="637" y="538.25" font-size="21" fill="#203545" font-weight="400">fat + 3 CH₃OH → 3 RCOOCH₃</text><text x="637" y="564.5" font-size="21" fill="#203545" font-weight="400">+ glycerol.</text><text x="675" y="650" font-size="28" fill="#c45637" font-weight="700">3 methyl esters</text><line x1="1030" y1="560" x2="1135" y2="560" stroke="#172b3c" stroke-width="4"  marker-end="url(#arrow)"/><rect x="1160" y="430" width="300" height="270" rx="20" fill="white" stroke="#c9d8dc" stroke-width="2"/><rect x="1160" y="430" width="300" height="10" rx="5" fill="#e5b94c"/><text x="1182" y="475" font-size="25" fill="#172b3c" font-weight="700">Biodiesel</text><text x="1182" y="512" font-size="21" fill="#203545" font-weight="400">Methyl esters of</text><text x="1182" y="538.25" font-size="21" fill="#203545" font-weight="400">long-chain acids.</text><line x1="40" y1="816" x2="1488" y2="816" stroke="#d9e3e4"/><text x="44" y="848" font-size="16" fill="#607783" font-weight="600">MARLBRIDGE  •  Schematic; not to scale</text></svg>
