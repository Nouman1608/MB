<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1120" viewBox="0 0 768 1120" role="img" aria-labelledby="title desc"><title id="title">Stereospecific enzyme binding and inhibition</title><desc id="desc">An active site has fixed three-dimensional binding groups. One substrate enantiomer can align all three; its mirror image cannot. An inhibitor can occupy the active site and block substrate binding.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#172b3c"/></marker><marker id="tealArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#288a83"/></marker></defs><style>text{font-family:Arial,"Liberation Sans",sans-serif}</style><rect width="100%" height="100%" fill="#fbfcfa"/><text x="44" y="58" font-size="30" fill="#172b3c" font-weight="700">Stereospecific enzyme binding and inhibition</text><rect x="28" y="90" width="712" height="940" rx="24" fill="#f2f7f6"/><rect x="55" y="125" width="658" height="220" rx="20" fill="white" stroke="#c9d8dc" stroke-width="2"/><rect x="55" y="125" width="658" height="10" rx="5" fill="#288a83"/><text x="77" y="170" font-size="25" fill="#172b3c" font-weight="700">1  One enantiomer fits</text><text x="77" y="207" font-size="21" fill="#203545" font-weight="400">Its three groups align with fixed</text><text x="77" y="233.25" font-size="21" fill="#203545" font-weight="400">complementary binding positions.</text><path d="M100 285 Q180 220 260 285 L260 320 Q180 255 100 320Z" fill="#dcefe9" stroke="#288a83" stroke-width="4"/><circle cx="130" cy="260" r="10" fill="#c45637"/><circle cx="180" cy="245" r="10" fill="#e5b94c"/><circle cx="230" cy="260" r="10" fill="#172b3c"/><rect x="55" y="395" width="658" height="220" rx="20" fill="white" stroke="#c9d8dc" stroke-width="2"/><rect x="55" y="395" width="658" height="10" rx="5" fill="#c45637"/><text x="77" y="440" font-size="25" fill="#172b3c" font-weight="700">2  Mirror image mismatches</text><text x="77" y="477" font-size="21" fill="#203545" font-weight="400">The groups point differently; the same</text><text x="77" y="503.25" font-size="21" fill="#203545" font-weight="400">three contacts cannot form together.</text><path d="M100 555 Q180 490 260 555 L260 590 Q180 525 100 590Z" fill="#dcefe9" stroke="#288a83" stroke-width="4"/><line x1="300" y1="520" x2="380" y2="555" stroke="#c45637" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow)"/><rect x="55" y="665" width="658" height="220" rx="20" fill="white" stroke="#c9d8dc" stroke-width="2"/><rect x="55" y="665" width="658" height="10" rx="5" fill="#e5b94c"/><text x="77" y="710" font-size="25" fill="#172b3c" font-weight="700">3  Inhibitor blocks</text><text x="77" y="747" font-size="21" fill="#203545" font-weight="400">A fitting drug occupies the active site,</text><text x="77" y="773.25" font-size="21" fill="#203545" font-weight="400">preventing substrate binding.</text><path d="M100 820 Q180 755 260 820 L260 855 Q180 790 100 855Z" fill="#dcefe9" stroke="#288a83" stroke-width="4"/><rect x="160" y="780" width="70" height="42" rx="15" fill="#e5b94c" stroke="#172b3c" stroke-width="3"/><line x1="40" y1="1066" x2="728" y2="1066" stroke="#d9e3e4"/><text x="44" y="1098" font-size="16" fill="#607783" font-weight="600">MARLBRIDGE  •  Schematic; not to scale</text></svg>
