<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1212" viewBox="0 0 1800 2424" role="img" aria-labelledby="title desc"><title id="title">Metallic bonding (OxfordAQA International GCSE Chemistry)</title><desc id="desc">No tier label: OxfordAQA International GCSE Chemistry is not tiered (9202 3.2.1i and 3.2.1j delocalised electrons and electrostatic attraction, 3.2.2g conduction, 3.3.1a layers sliding). Rows of positive metal ions sit in a sea of free (delocalised) electrons; metallic bonding is the attraction between the ions and the electron sea. Conducts: free electrons drift through the metal. Malleable: layers of ions slide over each other, and the bonding still holds after they move.</desc><rect width="1800" height="2424" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="92" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle">Metallic bonding</text>
