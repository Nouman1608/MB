<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="title desc"><title id="title">Ethylamine alkylation by bromomethane: structural curly-arrow mechanism</title><desc id="desc">AQA A-level Chemistry 3.3.11.3; nucleophilic substitution and acid-base proton transfer.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#C44949"/></marker><marker id="arrblue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#315F86"/></marker></defs><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#10233F">Ethylamine alkylation by bromomethane: structural curly-arrow mechanism</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">AQA A-level Chemistry 3.3.11.3; nucleophilic substitution and acid-base proton transfer.</text><rect x="52" y="132" width="1424" height="606" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="88" y="174" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#10233F">Ethylamine attacks bromomethane; a second ethylamine removes H⁺ from the ammonium intermediate.</text><rect x="82" y="210" width="668" height="470" rx="14" fill="#E7F3F1" stroke="#D3DCE2" stroke-width="2"/><rect x="778" y="210" width="668" height="470" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="112" y="248" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#315F86">1  SN2 substitution</text><text x="112" y="282" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">CH₃CH₂—NH₂:  +  CH₃—Br</text><text x="112" y="328" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">N lone pair → δ⁺ carbon</text><text x="112" y="355" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">C—Br pair → Br⁻</text><text x="138" y="418" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">CH₃CH₂—</text><text x="255" y="418" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#725C8E">N:</text><text x="399" y="418" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">CH₃—</text><text x="489" y="418" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">C</text><text x="565" y="418" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#C44949">Br</text><line x1="203" y1="410" x2="239" y2="410" stroke="#20314B" stroke-width="3"/><line x1="445" y1="410" x2="477" y2="410" stroke="#20314B" stroke-width="3"/><line x1="499" y1="410" x2="543" y2="410" stroke="#20314B" stroke-width="3"/><text x="489" y="390" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#C44949">δ⁺</text><text x="568" y="390" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#315F86">δ⁻</text><path d="M278 398 C325 335 426 336 479 397" fill="none" stroke="#168C8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M540 398 C552 373 565 376 573 397" fill="none" stroke="#C44949" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="112" y="477" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#725C8E">[CH₃CH₂—NH₂—CH₃]⁺   +   Br⁻</text><text x="112" y="518" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">N now has four bonds: ethyl, methyl and two H atoms.</text><text x="808" y="248" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#315F86">2  Proton transfer</text><text x="808" y="282" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">CH₃CH₂NH₂:  +  [CH₃CH₂N⁺H₂CH₃]</text><text x="808" y="328" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">base N lone pair → H on N⁺</text><text x="808" y="355" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">N—H pair → ammonium N</text><text x="824" y="418" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#168C8C">CH₃CH₂—NH₂:</text><text x="1080" y="418" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#725C8E">CH₃CH₂—N⁺H₂—CH₃</text><text x="1246" y="393" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#C44949">H</text><path d="M944 397 C1005 350 1144 350 1238 390" fill="none" stroke="#168C8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M1239 398 C1228 419 1209 422 1196 408" fill="none" stroke="#725C8E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="808" y="477" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">CH₃CH₂NHCH₃   +   [CH₃CH₂NH₃]⁺ Br⁻</text><text x="808" y="518" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">Secondary amine + ethylammonium bromide.</text><text x="764" y="646" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">Arrows start at an electron pair or bond and end where that pair moves.</text><text letter-spacing="5" opacity=".08" x="764" y="849" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE STUDY RESOURCES</text><line x1="52" y1="866" x2="1476" y2="866" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="875" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
