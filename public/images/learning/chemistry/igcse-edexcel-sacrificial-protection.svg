<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1000" viewBox="0 0 1800 2000" role="img" aria-labelledby="title desc"><title id="title">Barrier or sacrificial protection? (Edexcel International GCSE Chemistry)</title><desc id="desc">No tier label: preventing rusting by barrier methods, galvanising and sacrificial protection is 4CH1 statement 2.19, on both papers. Painted steel: water and oxygen reach the steel at a scratch in the paint, so it rusts at the scratch. Zinc-coated (galvanised) steel: at a scratch the zinc corrodes instead, forming Zn2+ ions, and electrons flow through the metal to the steel, so the steel stays safe; zinc is above iron in the reactivity series.</desc><rect width="1800" height="2000" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="92" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle">Barrier or sacrificial protection?</text>
<text x="900" y="172" font-size="42" fill="#4B5B72" text-anchor="middle">Both coatings are scratched</text>
<rect x="60" y="340" width="1680" height="660" rx="24" fill="#FFFFFF" stroke="#1E2B47" stroke-width="5"/>
<text x="120" y="420" font-size="48" font-weight="700" fill="#1E2B47">Painted steel</text>
<rect x="120" y="540" width="1560" height="122" fill="#D2E5EC"/>
<rect x="120" y="660" width="700" height="62" fill="#9DB4E0" stroke="#1E2B47" stroke-width="4"/>
<rect x="960" y="660" width="720" height="62" fill="#9DB4E0" stroke="#1E2B47" stroke-width="4"/>
<rect x="120" y="720" width="1560" height="140" fill="#8C95A3" stroke="#1E2B47" stroke-width="4"/>
<text x="344" y="706" font-size="40" font-weight="700" fill="#1E2B47">paint</text>
<text x="400" y="822" font-size="44" font-weight="700" fill="#FFFFFF">steel</text>
<text x="1160" y="610" font-size="40" fill="#1E2B47" xml:space="preserve"><tspan>water and O</tspan><tspan dy="11.2" font-size="27.2">2</tspan></text>
<ellipse cx="858" cy="726" rx="26" ry="15" fill="#B9632F" stroke="#7A3E1A" stroke-width="3"/>
<ellipse cx="906" cy="722" rx="26" ry="15" fill="#B9632F" stroke="#7A3E1A" stroke-width="3"/>
<ellipse cx="878" cy="740" rx="26" ry="15" fill="#B9632F" stroke="#7A3E1A" stroke-width="3"/>
<ellipse cx="930" cy="716" rx="26" ry="15" fill="#B9632F" stroke="#7A3E1A" stroke-width="3"/>
<line x1="890" y1="516" x2="890" y2="636" stroke="#B9632F" stroke-width="8" stroke-linecap="round"/><polygon points="890,700 853.7,634 926.3,634" fill="#B9632F"/>
<text x="900" y="946" font-size="50" font-weight="700" fill="#B9632F" text-anchor="middle">Rusts at the scratch</text>
<rect x="60" y="1080" width="1680" height="860" rx="24" fill="#FFFFFF" stroke="#1E2B47" stroke-width="5"/>
<text x="120" y="1160" font-size="48" font-weight="700" fill="#1E2B47">Zinc-coated (galvanised) steel</text>
<rect x="120" y="1320" width="1560" height="122" fill="#D2E5EC"/>
<rect x="820" y="1440" width="140" height="80" fill="#D2E5EC"/>
<rect x="120" y="1440" width="700" height="80" fill="#B6C3D3" stroke="#1E2B47" stroke-width="4"/>
<rect x="960" y="1440" width="720" height="80" fill="#B6C3D3" stroke="#1E2B47" stroke-width="4"/>
<rect x="120" y="1520" width="1560" height="140" fill="#8C95A3" stroke="#1E2B47" stroke-width="4"/>
<text x="1300" y="1494" font-size="40" font-weight="700" fill="#1E2B47" text-anchor="middle">zinc</text>
<text x="1300" y="1622" font-size="44" font-weight="700" fill="#FFFFFF" text-anchor="middle">steel</text>
<circle cx="746" cy="1374" r="64" fill="#DDEBE8" stroke="#2F6B63" stroke-width="5"/>
<text x="746" y="1386.96" font-size="36" font-weight="700" fill="#2F6B63" text-anchor="middle" xml:space="preserve"><tspan>Zn</tspan><tspan dy="-13.7" font-size="24.5">2+</tspan></text>
<circle cx="1036" cy="1374" r="64" fill="#DDEBE8" stroke="#2F6B63" stroke-width="5"/>
<text x="1036" y="1386.96" font-size="36" font-weight="700" fill="#2F6B63" text-anchor="middle" xml:space="preserve"><tspan>Zn</tspan><tspan dy="-13.7" font-size="24.5">2+</tspan></text>
<line x1="196" y1="1480" x2="710" y2="1480" stroke="#8A6A0C" stroke-width="6" stroke-linecap="round"/><polygon points="778,1480 708,1515 708,1445" fill="#8A6A0C"/>
<circle cx="300" cy="1480" r="22" fill="#D6B22F" stroke="#8A6A0C" stroke-width="3"/>
<circle cx="460" cy="1480" r="22" fill="#D6B22F" stroke="#8A6A0C" stroke-width="3"/>
<circle cx="620" cy="1480" r="22" fill="#D6B22F" stroke="#8A6A0C" stroke-width="3"/>
<text x="900" y="1712" font-size="42" font-weight="700" fill="#8A6A0C" text-anchor="middle" xml:space="preserve"><tspan>electrons (e</tspan><tspan dy="-16" font-size="28.6">−</tspan><tspan dy="16">) flow through the metal</tspan></text>
<text x="900" y="1800" font-size="50" font-weight="700" fill="#2F6B63" text-anchor="middle">Steel stays safe: zinc corrodes instead</text>
<text x="900" y="1876" font-size="40" fill="#4B5B72" text-anchor="middle">Zn is above Fe in the series</text></g></svg>
