<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1030" viewBox="0 0 1800 2060" role="img" aria-labelledby="title desc"><title id="title">Making iron, step by step (OxfordAQA International GCSE Chemistry)</title><desc id="desc">No tier label: OxfordAQA International GCSE Chemistry is not tiered. 9202 statement 3.3.1.1d: details of the blast furnace are not required, but students should know the raw materials and explain the simple chemistry, including equations. Step 1: coke burns and gives heat, C + O2 → CO2. Step 2: more coke makes carbon monoxide, C + CO2 → 2CO. Step 3: carbon monoxide takes oxygen from the ore, Fe2O3 + 3CO → 2Fe + 3CO2. Particle diagrams show carbon, oxygen and iron atoms.</desc><rect width="1800" height="2060" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="92" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle">Making iron, step by step</text>
<text x="900" y="172" font-size="42" fill="#4B5B72" text-anchor="middle">Carbon monoxide does the reducing</text>
