<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1080" viewBox="0 0 1800 2160" role="img" aria-labelledby="title desc"><title id="title">Extracting aluminium (Edexcel International GCSE Chemistry: Paper 2 only)</title><desc id="desc">Marked Paper 2 only: electrolysis for aluminium is 4CH1 statement 2.23C and half-equations are 1.59C, both in bold. The cryolite note and the burning-anode box are marked not required by Edexcel, because 2.24C says detailed knowledge of the extraction of a specific metal is not required. A cell of molten cryolite with dissolved aluminium oxide; cryolite lowers the melting point. Carbon anodes (+) dip in from above; the tank lining is the cathode (−). Electrons flow from the power supply to the cathode and back from the anodes. Al3+ ions move down to the cathode, where molten aluminium collects at the bottom; O2- ions move to the anodes. Cathode (−), reduction: Al3+ + 3e- → Al. Anode (+), oxidation: 2O2- → O2 + 4e-. Anodes burn away, O2 + C → CO2, so they are replaced often.</desc><rect width="1800" height="2160" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="92" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle">Extracting aluminium</text>
<text x="900" y="172" font-size="42" fill="#4B5B72" text-anchor="middle">Electrolysis of molten aluminium oxide</text>
