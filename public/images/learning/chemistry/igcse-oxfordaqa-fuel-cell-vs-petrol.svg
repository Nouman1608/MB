<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1180" viewBox="0 0 1800 2360" role="img" aria-labelledby="title desc"><title id="title">Fuel cell or petrol engine? (OxfordAQA International GCSE Chemistry)</title><desc id="desc">No tier label: OxfordAQA International GCSE Chemistry is not tiered. 9202 statement 3.9.3b: hydrogen-oxygen fuel cells give water as the only waste product, and students compare the benefits and disadvantages of hydrogen fuel in terms of storage and use and products of combustion. Fuel cell: water only (advantage), higher efficiency (advantage), hydrogen hard and costly to store (disadvantage), few refuelling stations (disadvantage). Petrol engine: gives carbon dioxide, water, carbon monoxide and oxides of nitrogen (disadvantage), more energy lost as heat (disadvantage), easy to store (advantage), stations everywhere (advantage). Bars are illustrative, not data. Making the hydrogen has an environmental cost too.</desc><rect width="1800" height="2360" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="92" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle">Fuel cell or petrol engine?</text>
