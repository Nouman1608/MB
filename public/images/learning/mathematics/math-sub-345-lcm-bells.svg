<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img"><title>Use the LCM to predict when events coincide</title><desc>Marlbridge Mathematics • ## Worked example</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="60" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#10233F">Use the LCM to predict when events coincide</text><text x="54" y="96" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#5B6D80">Two bells ring every 84 s and 120 s; both ring together at 09:00.</text><rect x="70" y="150" width="1388" height="570" rx="16" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2"/><rect x="110" y="264" width="1300" height="76" rx="16" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="148" y="313" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#C9A227">01</text><text x="215" y="313" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#20314B">Choose LCM: coincidence means a common multiple</text><rect x="110" y="366" width="1300" height="76" rx="16" fill="#F4F1E8" stroke="#F4F1E8" stroke-width="2"/><text x="148" y="415" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#C9A227">02</text><text x="215" y="415" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#20314B">84 = 2² × 3 × 7; 120 = 2³ × 3 × 5</text><rect x="110" y="468" width="1300" height="76" rx="16" fill="#E7F3F1" stroke="#E7F3F1" stroke-width="2"/><text x="148" y="517" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#C9A227">03</text><text x="215" y="517" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#20314B">LCM = 2³ × 3 × 5 × 7 = 840 seconds</text><rect x="110" y="570" width="1300" height="76" rx="16" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="148" y="619" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#C9A227">04</text><text x="215" y="619" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#10233F">840 seconds = 14 minutes → next together at 09:14</text><rect x="110" y="695" width="1300" height="44" rx="16" fill="#FAF3DF" stroke="#FAF3DF" stroke-width="2"/><text x="142" y="724" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">HCF answers largest equal group; LCM answers next simultaneous event.</text><text x="764" y="850" text-anchor="middle" letter-spacing="5" opacity=".075" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE STUDY RESOURCES</text><line x1="52" y1="866" x2="1476" y2="866" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
