<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img"><title>Find a shortest route to a straight coastline using a perpendicular</title><desc>Marlbridge • OxfordAQA International GCSE Mathematics 9260 • Shortest route to a line (G13)</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#10233F">Find a shortest route to a straight coastline using a perpendicular</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">Marlbridge • OxfordAQA International GCSE Mathematics 9260 • Shortest route to a line (G13)</text><rect x="52" y="128" width="910" height="660" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="986" y="128" width="490" height="660" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="88" y="174" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">The perpendicular gives the shortest route from ship to coast</text><text x="88" y="211" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#5B6D80">North is up • coast runs west to east • not drawn to scale</text><line x1="115" y1="660" x2="846" y2="660" stroke="#315F86" stroke-width="5" /><text x="130" y="697" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#5B6D80">WEST</text><text x="802" y="697" text-anchor="end" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#5B6D80">EAST</text><line x1="250" y1="660" x2="250" y2="287" stroke="#10233F" stroke-width="3" /><path d="M 250 287 L 240 307 L 260 307 Z" fill="#10233F"/><text x="250" y="273" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">N</text><line x1="250" y1="660" x2="514" y2="344" stroke="#725C8E" stroke-width="5" /><line x1="514" y1="344" x2="514" y2="660" stroke="#168C8C" stroke-width="5" /><line x1="496" y1="642" x2="514" y2="642" stroke="#10233F" stroke-width="2" /><line x1="496" y1="642" x2="496" y2="660" stroke="#10233F" stroke-width="2" /><circle cx="250" cy="660" r="8" fill="#10233F"/><circle cx="514" cy="344" r="8" fill="#C44949"/><circle cx="514" cy="660" r="8" fill="#168C8C"/><text x="236" y="691" text-anchor="end" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">H • port</text><text x="530" y="338" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#C44949">S • ship</text><text x="528" y="691" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#168C8C">F • closest point</text><text x="350" y="496" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#725C8E">HS = 8 km</text><text x="540" y="500" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#168C8C">SF ⟂ coast</text><text x="546" y="525" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">shortest distance</text><path d="M 250 582 A 78 78 0 0 1 300.1 600.3" fill="none" stroke="#C9A227" stroke-width="4"/><text x="286" y="570" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#C9A227">040°</text><text x="690" y="313" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#725C8E">Bearing 040°</text><text x="690" y="339" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">measured clockwise</text><text x="486" y="743" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#5B6D80">HS is the slanted 8 km route; SF is perpendicular to the coast.</text><text x="1026" y="177" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233F">Scale drawing</text><rect x="1024" y="215" width="414" height="112" rx="12" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="1050" y="253" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#315F86">1 cm represents 2 km</text><text x="1050" y="294" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#20314B">8 km → HS = 4 cm</text><rect x="1024" y="343" width="414" height="142" rx="12" fill="#F4F1E8" stroke="#F4F1E8" stroke-width="2"/><text x="1050" y="381" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#725C8E">Construct the right angle</text><text x="1050" y="418" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#20314B">Drop a perpendicular from S</text><text x="1050" y="452" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#20314B">to the west–east coast line.</text><rect x="1024" y="501" width="414" height="191" rx="12" fill="#E7F3F1" stroke="#E7F3F1" stroke-width="2"/><text x="1050" y="540" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#168C8C">Measure then convert</text><text x="1050" y="578" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#10233F">SF ≈ 3.06 cm</text><text x="1050" y="614" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">3.06 × 2 = 6.12 km</text><text x="1050" y="651" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#168C8C">Check: 8 cos 40° ≈ 6.13 km</text><text x="1050" y="678" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">Report 6.1 km (3 s.f.).</text><text letter-spacing="5" opacity=".075" x="764" y="849" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE STUDY RESOURCES</text><line x1="52" y1="866" x2="1476" y2="866" stroke="#C9A227" stroke-width="2" /><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
