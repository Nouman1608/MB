<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img"><title>Differentiate an implicit equation</title><desc>Marlbridge instructional diagram. Differentiate both sides with respect to x; terms containing y use chain rule Source anchored to ## 1. Differentiating implicitly.</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#10233F">Differentiate an implicit equation</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">Marlbridge • Mathematics • row 409</text><rect x="52" y="136" width="1424" height="630" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="90" y="188" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#315F86">Differentiate both sides with respect to x; terms containing y use chain rule</text><rect x="104" y="245" width="1320" height="78" rx="16" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="145" y="294" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#C9A227">01</text><text x="210" y="294" text-anchor="start" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#20314B">x² + y² = 25</text><text x="762" y="346" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#168C8C">↓</text><rect x="104" y="353" width="1320" height="78" rx="16" fill="#F4F1E8" stroke="#F4F1E8" stroke-width="2"/><text x="145" y="402" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#C9A227">02</text><text x="210" y="402" text-anchor="start" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#20314B">2x + 2y(dy/dx) = 0</text><text x="762" y="454" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#168C8C">↓</text><rect x="104" y="461" width="1320" height="78" rx="16" fill="#E7F3F1" stroke="#E7F3F1" stroke-width="2"/><text x="145" y="510" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#C9A227">03</text><text x="210" y="510" text-anchor="start" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#20314B">dy/dx = −x/y</text><text x="762" y="562" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#168C8C">↓</text><rect x="104" y="569" width="1320" height="78" rx="16" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="145" y="618" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#C9A227">04</text><text x="210" y="618" text-anchor="start" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#10233F">At (3,4): gradient = −3/4</text><rect x="104" y="690" width="1320" height="54" rx="16" fill="#FAF3DF" stroke="#E9DCA9" stroke-width="2"/><text x="140" y="725" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">Keep dy/dx on every derivative of y.</text><text letter-spacing="5" opacity=".075" x="764" y="850" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE STUDY RESOURCES</text><line x1="52" y1="866" x2="1476" y2="866" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
