<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img"><title>Choose a reliable route through algebra skills</title><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#10233F">Choose a reliable route through algebra skills</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">Marlbridge • Edexcel International GCSE Mathematics A 4MA1 • Algebra</text><rect x="52" y="128" width="1424" height="680" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="82" y="178" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">Build the foundation first; the later methods reuse earlier skills.</text><rect x="85" y="230" width="410" height="420" rx="14" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="290" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233F">1. Read the index</text><text x="125" y="330" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#315F86">Negative power</text><text x="125" y="365" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#20314B">x⁻ⁿ = 1 / xⁿ</text><path d="M125 385L455 385" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="125" y="430" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#315F86">Zero power</text><text x="125" y="465" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#20314B">x⁰ = 1  (x ≠ 0)</text><path d="M125 485L455 485" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="125" y="530" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#315F86">Fractional power</text><text x="125" y="565" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#168C8C">x¹⁄ⁿ = ⁿ√x</text><path d="M495 435L550 435" fill="none" stroke="#C9A227" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="550" y="230" width="410" height="420" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="755" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#315F86">2. Work quadratics</text><text x="590" y="330" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6D80">Expand 3 brackets</text><text x="590" y="365" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">First two → simplify</text><text x="590" y="398" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">→ multiply by third</text><path d="M590 420L920 420" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="590" y="465" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#168C8C">Factorise if roots are clean</text><text x="590" y="515" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#725C8E">Complete the square if</text><text x="590" y="543" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#725C8E">finding a turning point</text><path d="M960 435L1015 435" fill="none" stroke="#C9A227" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="1015" y="230" width="420" height="420" rx="14" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="1225" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233F">3. Algebraic fractions</text><text x="1055" y="345" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#315F86">Factorise each part</text><text x="1055" y="395" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#20314B">Cancel common factors</text><text x="1055" y="445" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">Find a common denominator</text><path d="M1055 475L1395 475" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1225" y="530" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#C44949">A gap in factorising</text><text x="1225" y="560" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#C44949">will surface here.</text><text x="760" y="705" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6D80">Move to algebraic fractions after factorising is secure.</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
