<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img"><title>Follow a function from input to output and back</title><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#10233F">Follow a function from input to output and back</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">Marlbridge • Cambridge O Level Mathematics • Functions</text><rect x="52" y="128" width="1424" height="680" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="82" y="178" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">A function maps an allowed input to an output; domain restrictions matter.</text><rect x="85" y="230" width="760" height="410" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="465" y="272" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#315F86">Composite functions act inside first</text><rect x="145" y="335" width="140" height="90" rx="14" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="215" y="372" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233F">Input x</text><text x="215" y="402" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#5B6D80">x = 2</text><path d="M285 380L355 380" fill="none" stroke="#C9A227" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="355" y="335" width="180" height="90" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="445" y="372" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#315F86">f(x) = 3x − 5</text><text x="445" y="402" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#5B6D80">2 → 1</text><path d="M535 380L600 380" fill="none" stroke="#C9A227" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="600" y="335" width="155" height="90" rx="14" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="677" y="372" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#168C8C">g(u) = u²</text><text x="677" y="402" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#5B6D80">1 → 1</text><text x="465" y="474" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">gf(2) = g(f(2)) = g(1) = 1</text><path d="M145 510L785 510" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="465" y="550" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#315F86">Domain: allowed inputs     •     Range: outputs reached</text><text x="465" y="598" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#5B6D80">Inverse: swap input/output, then rearrange for the new output.</text><rect x="895" y="230" width="545" height="410" rx="14" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="1167" y="272" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">Check before applying a rule</text><text x="940" y="340" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#C44949">Exclude x = 2 if a denominator is x − 2.</text><text x="940" y="390" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#C44949">Exclude x &lt; 0 if a term is √x.</text><path d="M940 425L1390 425" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="940" y="478" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#725C8E">f⁻¹(x) is not 1 / f(x).</text><text x="940" y="528" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#168C8C">gf(x) means f first, then g.</text><text x="940" y="585" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#5B6D80">Composite domain/range extensions</text><text x="940" y="610" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#5B6D80">are outside this syllabus checklist.</text><text x="760" y="705" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6D80">Read composite notation right to left for the order in which the functions act.</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
