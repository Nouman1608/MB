<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img"><title>Motion in a plane under a time-dependent force</title><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#10233F">Motion in a plane under a time-dependent force</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">Marlbridge • OCR A Level Mathematics A H240 • Mechanics • vector force, integration and planar motion</text><rect x="52" y="128" width="1424" height="670" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="84" y="178" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">A time-varying vector force creates a curved path; integrate each component separately.</text><rect x="85" y="220" width="790" height="440" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="480" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#315F86">m=2.5 kg • F=(4t i + 15j) N • r(0)=0</text><path d="M175.0 320L175.0 565" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="175.0" y="584" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">0</text><path d="M295.0 320L295.0 565" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="295.0" y="584" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">2</text><path d="M415.0 320L415.0 565" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="415.0" y="584" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">4</text><path d="M535.0 320L535.0 565" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="535.0" y="584" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">6</text><path d="M655.0 320L655.0 565" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="655.0" y="584" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">8</text><path d="M775.0 320L775.0 565" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="775.0" y="584" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">10</text><path d="M175 565.0L835 565.0" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round"/><text x="163" y="569.0" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">-2</text><path d="M175 544.5833333333334L835 544.5833333333334" fill="none" stroke="#10233F" stroke-width="2" stroke-linecap="round"/><text x="163" y="548.5833333333334" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">0</text><path d="M175 493.54166666666663L835 493.54166666666663" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round"/><text x="163" y="497.54166666666663" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">5</text><path d="M175 442.5L835 442.5" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round"/><text x="163" y="446.5" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">10</text><path d="M175 391.4583333333333L835 391.4583333333333" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round"/><text x="163" y="395.4583333333333" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">15</text><path d="M175 340.4166666666667L835 340.4166666666667" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round"/><text x="163" y="344.4166666666667" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">20</text><path d="M175.0 544.6 L176.8 545.2 L178.6 545.7 L180.4 546.2 L182.2 546.6 L184.1 547.0 L185.9 547.3 L187.7 547.5 L189.6 547.7 L191.5 547.9 L193.4 548.0 L195.4 548.0 L197.3 548.0 L199.3 547.9 L201.4 547.8 L203.5 547.6 L205.6 547.3 L207.7 547.0 L209.9 546.7 L212.2 546.3 L214.5 545.8 L216.8 545.3 L219.2 544.7 L221.7 544.1 L224.2 543.4 L226.8 542.7 L229.4 541.9 L232.1 541.0 L234.9 540.1 L237.7 539.2 L240.7 538.2 L243.7 537.1 L246.8 536.0 L249.9 534.8 L253.2 533.5 L256.5 532.3 L260.0 530.9 L263.5 529.5 L267.1 528.1 L270.8 526.5 L274.6 525.0 L278.6 523.4 L282.6 521.7 L286.7 520.0 L291.0 518.2 L295.4 516.3 L299.8 514.4 L304.5 512.5 L309.2 510.5 L314.0 508.4 L319.0 506.3 L324.1 504.1 L329.3 501.9 L334.7 499.6 L340.2 497.3 L345.9 494.9 L351.7 492.4 L357.6 489.9 L363.7 487.4 L369.9 484.8 L376.3 482.1 L382.9 479.4 L389.6 476.6 L396.4 473.8 L403.4 470.9 L410.6 467.9 L418.0 464.9 L425.5 461.9 L433.2 458.8 L441.1 455.6 L449.2 452.4 L457.4 449.1 L465.8 445.8 L474.5 442.4 L483.3 439.0 L492.2 435.5 L501.4 431.9 L510.8 428.3 L520.4 424.7 L530.2 421.0 L540.2 417.2 L550.4 413.4 L560.8 409.5 L571.4 405.5 L582.2 401.6 L593.3 397.5 L604.6 393.4 L616.1 389.3 L627.8 385.0 L639.7 380.8 L651.9 376.5 L664.3 372.1 L677.0 367.6 L689.9 363.2 L703.0 358.6 L716.4 354.0 L730.0 349.4 L743.9 344.7 L758.0 339.9 L772.4 335.1 L787.0 330.2" fill="none" stroke="#168C8C" stroke-width="4"/><circle cx="251.0" cy="534.375" r="6" fill="#315F86"/><text x="259.0" y="524.375" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#315F86">t=1</text><circle cx="423.0" cy="462.91666666666663" r="6" fill="#315F86"/><text x="431.0" y="452.91666666666663" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#315F86">t=2</text><circle cx="787.0" cy="330.2083333333333" r="6" fill="#C44949"/><text x="795.0" y="320.2083333333333" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#C44949">t=3</text><text x="500" y="620" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#10233F">Horizontal position x (m)</text><text x="145" y="300" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#10233F">Vertical y (m)</text><rect x="900" y="220" width="525" height="440" rx="14" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="1162" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">Integrate force → motion</text><text x="945" y="320" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#315F86">a=F/m=1.6t i+6j</text><text x="945" y="360" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#168C8C">v=(0.8t²+1)i+(6t−2)j</text><text x="945" y="400" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#725C8E">r=(0.2667t³+t)i+(3t²−2t)j</text><path d="M945 425L1380 425" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round"/><text x="945" y="470" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">At t=3: r=10.2i+21j m</text><text x="945" y="510" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">v=8.2i+16j m s⁻¹</text><text x="945" y="550" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#168C8C">|v|=√(8.2²+16²)=18.0 m s⁻¹</text><text x="1162" y="610" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#5B6D80">Start at the origin; use both components.</text><text x="760" y="710" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#5B6D80">The path plots (x(t),y(t)) from the initial position toward the t=3 position.</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
