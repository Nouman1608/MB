<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">AQA moments: find the resultant moment about a pivot</title><desc id="desc">A labelled beam locates three downward forces and evaluates the source worked example to a 15 N m clockwise resultant.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial,sans-serif" fill="#20314B"><text x="62" y="78" font-size="38" font-weight="700" fill="#0B1F3A">AQA moments: find the resultant moment about a pivot</text><text x="64" y="124" font-size="22">Marlbridge Mathematics • teaching diagram</text><rect x="60" y="165" width="1480" height="755" rx="18" fill="white" stroke="#CCD6D7" stroke-width="2"/><text x="110" y="225" font-size="22" font-weight="400" fill="#20314B" text-anchor="start">Take moments about pivot P; clockwise and anticlockwise effects oppose.</text><rect x="100" y="275" width="1320" height="450" rx="16" fill="#FBFCFC" stroke="#CCD6D7" stroke-width="2"/><text x="135" y="325" font-size="21" font-weight="700" fill="#0B1F3A" text-anchor="start">Light horizontal rod AB, length 4 m</text><path d="M220 505L1280 505" fill="none" stroke="#20314B" stroke-width="8"/><path d="M615 505 L665 585 L715 505 Z" fill="#E7EFED" stroke="#20314B" stroke-width="3"/><circle cx="665" cy="505" r="9" fill="#C9A227"/><path d="M220 490L220 520" fill="none" stroke="#20314B" stroke-width="3"/><text x="220" y="555" font-size="17" font-weight="700" fill="#0B1F3A" text-anchor="middle">A</text><path d="M618 490L618 520" fill="none" stroke="#20314B" stroke-width="3"/><text x="618" y="555" font-size="17" font-weight="700" fill="#0B1F3A" text-anchor="middle">P</text><path d="M1015 490L1015 520" fill="none" stroke="#20314B" stroke-width="3"/><text x="1015" y="555" font-size="17" font-weight="700" fill="#0B1F3A" text-anchor="middle">C</text><path d="M1280 490L1280 520" fill="none" stroke="#20314B" stroke-width="3"/><text x="1280" y="555" font-size="17" font-weight="700" fill="#0B1F3A" text-anchor="middle">B</text><path d="M220 400V468" stroke="#B4473B" stroke-width="4"/><path d="M212 468L228 468L220 483Z" fill="#B4473B"/><text x="220" y="388" font-size="17" font-weight="700" fill="#B4473B" text-anchor="middle">30 N</text><path d="M1015 400V468" stroke="#B4473B" stroke-width="4"/><path d="M1007 468L1023 468L1015 483Z" fill="#B4473B"/><text x="1015" y="388" font-size="17" font-weight="700" fill="#B4473B" text-anchor="middle">10 N</text><path d="M1280 400V468" stroke="#B4473B" stroke-width="4"/><path d="M1272 468L1288 468L1280 483Z" fill="#B4473B"/><text x="1280" y="388" font-size="17" font-weight="700" fill="#B4473B" text-anchor="middle">18 N</text><text x="420" y="610" font-size="16" font-weight="700" fill="#596B7E" text-anchor="middle">AP = 1.5 m</text><text x="815" y="610" font-size="16" font-weight="700" fill="#596B7E" text-anchor="middle">PC = 1.5 m</text><text x="1145" y="610" font-size="16" font-weight="700" fill="#596B7E" text-anchor="middle">PB = 2.5 m</text><rect x="100" y="770" width="1320" height="100" rx="16" fill="#E7EFED" stroke="#2D7A78" stroke-width="2"/><text x="140" y="815" font-size="19" font-weight="700" fill="#20314B" text-anchor="start">About P:  anticlockwise = 30×1.5 = 45 N m</text><text x="760" y="815" font-size="19" font-weight="700" fill="#20314B" text-anchor="start">clockwise = 10×1.5 + 18×2.5 = 60 N m</text><text x="140" y="850" font-size="18" font-weight="700" fill="#2D7A78" text-anchor="start">Resultant = 15 N m clockwise</text><path d="M60 972H1540" stroke="#CCD6D7" stroke-width="2"/><text x="64" y="1015" font-size="17">Marlbridge • Mathematics study resource • check assumptions and context</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>
