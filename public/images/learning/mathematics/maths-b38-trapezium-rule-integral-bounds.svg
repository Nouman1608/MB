ext-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#315F86">0.405</text><circle cx="345" cy="473.9873176376159" r="6" fill="#315F86" stroke="white" stroke-width="2"/><text x="345" y="463.9873176376159" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#315F86">0.693</text><circle cx="422.5" cy="409.275687756495" r="6" fill="#315F86" stroke="white" stroke-width="2"/><text x="422.5" y="399.275687756495" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#315F86">0.916</text><circle cx="500" cy="356.4024362862482" r="6" fill="#315F86" stroke="white" stroke-width="2"/><text x="500" y="346.4024362862482" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#315F86">1.099</text><text x="484.5" y="385.0" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#315F86">y = ln x</text><text x="476.75" y="715" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">x</text><rect x="900" y="225" width="500" height="430" rx="14" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="1150" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233F">Step width h = 0.5</text><text x="950" y="331" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#315F86">Trapezium estimate = h/2 ×</text><text x="950" y="365" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#315F86">[y₀ + y₄ + 2(y₁ + y₂ + y₃)]</text><text x="950" y="407" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#168C8C">≈ 1.2821</text><path d="M950 437L1350 437" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round"/><text x="950" y="481" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6D80">Increasing ln x gives rectangle bounds:</text><text x="950" y="523" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#315F86">Lower (left ends) = 1.0075</text><text x="950" y="563" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#725C8E">Upper (right ends) = 1.5568</text><text x="1150" y="610" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">Exact integral = 3 ln 3 − 2 ≈ 1.2958</text><text x="1150" y="710" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#5B6D80">Concave down: the trapezium estimate is slightly low.</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
