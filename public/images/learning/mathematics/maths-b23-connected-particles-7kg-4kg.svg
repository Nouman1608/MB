<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="title desc"><defs><marker id="arrN" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#10233F"/></marker><marker id="arrT" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#168C8C"/></marker><marker id="arrG" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#C9A227"/></marker><marker id="arrB" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#315F86"/></marker></defs><title id="title">Connected particles: one tension, equal acceleration magnitudes</title><desc id="desc">A 7 kg mass descends and a 4 kg mass rises on a light inextensible string over a smooth fixed pulley. Both have acceleration magnitude a and the string tension is T. Equations 7g−T=7a and T−4g=4a give a=3g/11=2.67 m s⁻² and T=56g/11=49.9 N for g=9.8 m s⁻².</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#10233F">Connected particles: one tension, equal acceleration magnitudes</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#5B6D80">Marlbridge • Edexcel International A Level Mathematics</text><rect x="52" y="132" width="1424" height="680" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="82" y="178" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">Source Example 4 • before the 7 kg particle reaches the ground</text><path d="M245 365 A40 40 0 0 1 325 365" fill="none" stroke="#10233F" stroke-width="7"/><path d="M245 365L245 560" fill="none" stroke="#168C8C" stroke-width="4"  stroke-linecap="round"/><path d="M325 365L325 515" fill="none" stroke="#168C8C" stroke-width="4"  stroke-linecap="round"/><rect x="210" y="560" width="70" height="70" rx="8" fill="#E8F1F4" stroke="#168C8C" stroke-width="2"/><text x="245" y="604" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">7 kg</text><rect x="290" y="515" width="70" height="70" rx="8" fill="#F3EFF8" stroke="#725C8E" stroke-width="2"/><text x="325" y="559" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">4 kg</text><path d="M245 492L245 545" fill="none" stroke="#168C8C" stroke-width="4" marker-end="url(#arrT)"/><path d="M325 490L325 425" fill="none" stroke="#725C8E" stroke-width="4" marker-end="url(#arrB)"/><text x="155" y="530" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#168C8C">a down</text><text x="337" y="445" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#725C8E">a up</text><text x="228" y="405" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#315F86">T</text><text x="340" y="405" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#315F86">T</text><rect x="470" y="220" width="420" height="410" rx="14" fill="#E8F1F4" stroke="#D3DCE2" stroke-width="2"/><text x="680" y="266" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233F">One equation per mass</text><text x="510" y="327" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#168C8C">7 kg moving down:</text><text x="510" y="369" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#20314B">7g − T = 7a</text><path d="M510 395L850 395" fill="none" stroke="#D3DCE2" stroke-width="2"  stroke-linecap="round"/><text x="510" y="447" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#725C8E">4 kg moving up:</text><text x="510" y="489" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#20314B">T − 4g = 4a</text><path d="M510 515L850 515" fill="none" stroke="#D3DCE2" stroke-width="2"  stroke-linecap="round"/><text x="680" y="566" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6D80">Add to eliminate T:</text><text x="680" y="604" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#10233F">3g = 11a</text><rect x="945" y="250" width="445" height="335" rx="14" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/><text x="1167" y="294" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#C9A227">Shared string constraints</text><text x="980" y="352" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">Same tension on both sides</text><text x="980" y="397" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">Same acceleration magnitude</text><path d="M980 425L1350 425" fill="none" stroke="#D3DCE2" stroke-width="2"  stroke-linecap="round"/><text x="980" y="474" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#168C8C">a = 3(9.8)/11 = 2.67 m s⁻²</text><text x="980" y="520" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#315F86">T = 56(9.8)/11 = 49.9 N</text><text x="1167" y="563" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#5B6D80">Assumptions: light string, smooth pulley.</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE  •  STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
