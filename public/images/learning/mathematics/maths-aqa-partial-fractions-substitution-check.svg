<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">AQA partial fractions: solve coefficients by strategic substitution</title><desc id="desc">The source expression is decomposed by clearing denominators, substituting x=3 and x=−2, and recombining to verify coefficients A=5 and B=3.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial,sans-serif" fill="#20314B"><text x="62" y="78" font-size="38" font-weight="700" fill="#0B1F3A">AQA partial fractions: solve coefficients by strategic substitution</text><text x="64" y="124" font-size="22">Marlbridge Mathematics • teaching diagram</text><rect x="60" y="165" width="1480" height="755" rx="18" fill="white" stroke="#CCD6D7" stroke-width="2"/><text x="110" y="225" font-size="22" font-weight="400" fill="#20314B" text-anchor="start">Decompose first, then use values that eliminate one unknown at a time.</text><rect x="105" y="275" width="680" height="445" rx="16" fill="#FBFCFC" stroke="#CCD6D7" stroke-width="2"/><text x="145" y="330" font-size="24" font-weight="700" fill="#0B1F3A" text-anchor="start">(8x + 1)/((x − 3)(x + 2))</text><text x="145" y="395" font-size="20" font-weight="700" fill="#2D7A78" text-anchor="start">Assume:  A/(x − 3) + B/(x + 2)</text><text x="145" y="465" font-size="18" font-weight="400" fill="#20314B" text-anchor="start">Multiply by (x−3)(x+2):</text><text x="145" y="510" font-size="20" font-weight="700" fill="#20314B" text-anchor="start">8x + 1 = A(x + 2) + B(x − 3)</text><text x="145" y="575" font-size="18" font-weight="700" fill="#2D7A78" text-anchor="start">Set x = 3  →  25 = 5A  →  A = 5</text><text x="145" y="630" font-size="18" font-weight="700" fill="#2D7A78" text-anchor="start">Set x = −2 → −15 = −5B → B = 3</text><rect x="845" y="275" width="570" height="445" rx="16" fill="#E7EFED" stroke="#2D7A78" stroke-width="2"/><text x="1130" y="335" font-size="22" font-weight="700" fill="#0B1F3A" text-anchor="middle">Reassemble and verify</text><text x="1130" y="405" font-size="22" font-weight="700" fill="#2D7A78" text-anchor="middle">5/(x − 3) + 3/(x + 2)</text><text x="1130" y="490" font-size="19" font-weight="700" fill="#20314B" text-anchor="middle">= [5(x+2)+3(x−3)]</text><text x="1130" y="530" font-size="19" font-weight="700" fill="#20314B" text-anchor="middle">/ [(x−3)(x+2)]</text><text x="1130" y="600" font-size="18" font-weight="700" fill="#2D7A78" text-anchor="middle">= (8x + 1)/denominator</text><rect x="105" y="770" width="1310" height="95" rx="16" fill="#FFF4D6" stroke="#E0C76C" stroke-width="2"/><text x="135" y="820" font-size="18" font-weight="700" fill="#0B1F3A" text-anchor="start">Check the original denominator and state excluded values: x ≠ 3, −2.</text><path d="M60 972H1540" stroke="#CCD6D7" stroke-width="2"/><text x="64" y="1015" font-size="17">Marlbridge • Mathematics study resource • check assumptions and context</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>
