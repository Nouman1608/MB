93670886" font-size="16" font-weight="700" fill="#B9544D" text-anchor="middle">≈ −2.43</text><circle cx="654.3706346448171" cy="639.1139240506329" r="8" fill="#B9544D" stroke="#B9544D" stroke-width="1"/><path d="M654.3706346448171 639.1139240506329 L654.3706346448171 696.0759493670886" fill="none" stroke="#B9544D" stroke-width="2" stroke-dasharray="5 5"/><text x="654.3706346448171" y="720.0759493670886" font-size="16" font-weight="700" fill="#B9544D" text-anchor="middle">≈ 1.40</text><rect x="815" y="280" width="640" height="520" rx="16" fill="#F5F8FB" stroke="#397DA4" stroke-width="2"/><text x="855" y="330" font-size="22" font-weight="700" fill="#0B1F3A" text-anchor="start">f(x) = eˣ + x² − 6</text><text x="855" y="382" font-size="16" font-weight="700" fill="#397DA4" text-anchor="start">Interval</text><text x="1060" y="382" font-size="16" font-weight="700" fill="#397DA4" text-anchor="start">f(left)</text><text x="1205" y="382" font-size="16" font-weight="700" fill="#397DA4" text-anchor="start">f(right)</text><path d="M850 398 L1415 398" fill="none" stroke="#CCD6D7" stroke-width="2"/><text x="870" y="444" font-size="18" font-weight="600" fill="#20314B" text-anchor="start">[−3, −2]</text><text x="1060" y="444" font-size="18" font-weight="700" fill="#2D7A78" text-anchor="start">+3.050</text><text x="1205" y="444" font-size="18" font-weight="700" fill="#B9544D" text-anchor="start">−1.865</text><text x="870" y="494" font-size="18" font-weight="600" fill="#20314B" text-anchor="start">[1, 2]</text><text x="1060" y="494" font-size="18" font-weight="700" fill="#B9544D" text-anchor="start">−2.282</text><text x="1205" y="494" font-size="18" font-weight="700" fill="#2D7A78" text-anchor="start">+5.389</text><path d="M850 530 L1415 530" fill="none" stroke="#CCD6D7" stroke-width="2"/><text x="855" y="574" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="start">f′′(x) = eˣ + 2 &gt; 0</text><text x="855" y="615" font-size="18" font-weight="600" fill="#20314B" text-anchor="start">Strictly convex: at most two roots.</text><text x="855" y="658" font-size="18" font-weight="700" fill="#2D7A78" text-anchor="start">Opposite signs in both intervals → exactly two.</text><text x="855" y="713" font-size="19" font-weight="700" fill="#0B1F3A" text-anchor="start">Roots lie in (−3,−2) and (1,2).</text><rect x="120" y="820" width="1330" height="48" rx="14" fill="#FFF4D6" stroke="#E0C76C" stroke-width="2"/><text x="155" y="851" font-size="18" font-weight="700" fill="#0B1F3A" text-anchor="start">State both endpoint values, their signs, and why the intervals each contain a root.</text><path d="M60 972 L1540 972" fill="none" stroke="#CCD6D7" stroke-width="2"/><text x="64" y="1015" font-size="17" font-weight="500" fill="#20314B" text-anchor="start">Marlbridge • Mathematics study resource • check assumptions and context</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>