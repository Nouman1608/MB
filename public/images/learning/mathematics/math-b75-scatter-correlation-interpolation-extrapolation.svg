<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img"><title>Scatter graphs: correlation and prediction limits</title><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#10233F">Scatter graphs: correlation and prediction limits</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">Marlbridge • OCR A Level Mathematics A H240 • Statistics • scatter graphs, correlation and predictions</text><rect x="52" y="128" width="1424" height="670" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="84" y="178" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233F">Describe the relationship in context; predictions outside the data range may fail.</text><rect x="85" y="220" width="835" height="440" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="500" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#315F86">Car age and value (£1000s)</text><path d="M170.0 320L170.0 565" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="170.0" y="584" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">0</text><path d="M287.5 320L287.5 565" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="287.5" y="584" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">2</text><path d="M405.0 320L405.0 565" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="405.0" y="584" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">4</text><path d="M522.5 320L522.5 565" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="522.5" y="584" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">6</text><path d="M640.0 320L640.0 565" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="640.0" y="584" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">8</text><path d="M757.5 320L757.5 565" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="757.5" y="584" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">10</text><path d="M875.0 320L875.0 565" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="875.0" y="584" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">12</text><path d="M170 565.0L875 565.0" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round"/><text x="158" y="569.0" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">-2</text><path d="M170 537.7777777777778L875 537.7777777777778" fill="none" stroke="#10233F" stroke-width="2" stroke-linecap="round"/><text x="158" y="541.7777777777778" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">0</text><path d="M170 483.33333333333337L875 483.33333333333337" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round"/><text x="158" y="487.33333333333337" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">4</text><path d="M170 428.8888888888889L875 428.8888888888889" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round"/><text x="158" y="432.8888888888889" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">8</text><path d="M170 374.44444444444446L875 374.44444444444446" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round"/><text x="158" y="378.44444444444446" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">12</text><path d="M170 320.0L875 320.0" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round"/><text x="158" y="324.0" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">16</text><circle cx="228.75" cy="344.5" r="6" fill="#315F86"/><circle cx="287.5" cy="363.55555555555554" r="6" fill="#315F86"/><circle cx="346.25" cy="375.80555555555554" r="6" fill="#315F86"/><circle cx="405.0" cy="400.30555555555554" r="6" fill="#315F86"/><circle cx="463.75" cy="409.83333333333337" r="6" fill="#315F86"/><circle cx="522.5" cy="434.33333333333337" r="6" fill="#315F86"/><circle cx="581.25" cy="441.1388888888889" r="6" fill="#315F86"/><circle cx="640.0" cy="467.0" r="6" fill="#315F86"/><path d="M170.0 328.1666666666667L875.0 540.5" fill="none" stroke="#168C8C" stroke-width="3" stroke-linecap="round"/><circle cx="434.375" cy="407.79166666666663" r="7" fill="#725C8E"/><path d="M434.375 537.7777777777778L434.375 407.79166666666663" fill="none" stroke="#725C8E" stroke-width="2" stroke-linecap="round"/><text x="444.375" y="395.79166666666663" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#725C8E">interpolate: ≈9.55</text><circle cx="875.0" cy="540.5" r="7" fill="#C44949"/><text x="865.0" y="526.5" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#C44949">−0.2?</text><text x="510" y="620" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#10233F">Age of car (years)</text><text x="145" y="300" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#10233F">Value (£1000s)</text><rect x="950" y="220" width="475" height="440" rx="14" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="1187" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">Interpret, don’t overclaim</text><text x="995" y="325" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#315F86">Strong negative correlation</text><text x="995" y="365" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">Older cars tend to be worth less.</text><path d="M995 395L1380 395" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round"/><text x="995" y="445" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#168C8C">Line of best fit: y≈15.4−1.3x</text><text x="995" y="485" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#725C8E">At age 4.5: ≈£9,550</text><path d="M995 515L1380 515" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round"/><text x="995" y="560" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#C44949">At age 12: predicts −£200</text><text x="1187" y="610" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#5B6D80">Outside range; impossible, unreliable.</text><text x="760" y="710" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#5B6D80">Correlation shows association, not cause; interpolation stays within observed ages, extrapolation goes beyond them.</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
