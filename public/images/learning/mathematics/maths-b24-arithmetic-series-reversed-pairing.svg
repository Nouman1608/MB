<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="title desc"><defs><marker id="arrN" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#10233F"/></marker><marker id="arrT" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#168C8C"/></marker><marker id="arrG" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#C9A227"/></marker></defs><title id="title">Arithmetic-series sum: pair terms from opposite ends</title><desc id="desc">For the source example, u3=16 and u9=40 give a+2d=16 and a+8d=40, so d=4 and a=8. Thus u20=84. Pairing the sequence forward and backward gives 2S20=20(8+84)=1840, so S20=920.</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#10233F">Arithmetic-series sum: pair terms from opposite ends</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#5B6D80">Marlbridge • Edexcel International A Level Mathematics</text><rect x="52" y="132" width="1424" height="680" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="82" y="178" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">Source example • u₃ = 16 and u₉ = 40</text><rect x="105" y="225" width="600" height="178" rx="12" fill="#E8F1F4" stroke="#D3DCE2" stroke-width="2"/><text x="405" y="267" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">Find the first term and common difference</text><text x="155" y="318" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#168C8C">a + 2d = 16</text><text x="430" y="318" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#315F86">a + 8d = 40</text><text x="155" y="365" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="600" fill="#20314B">Subtract: 6d = 24 → d = 4, a = 8</text><rect x="105" y="432" width="600" height="214" rx="12" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/><text x="405" y="475" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">First and last terms of S₂₀</text><text x="155" y="530" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#168C8C">u₁ = 8</text><text x="430" y="530" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#315F86">u₂₀ = 8 + 19(4) = 84</text><path d="M155 555L650 555" fill="none" stroke="#D3DCE2" stroke-width="2"  stroke-linecap="round"/><text x="405" y="603" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#C9A227">Each opposite-end pair totals 8 + 84 = 92.</text><rect x="790" y="225" width="575" height="420" rx="12" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="1077" y="267" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">Write the terms forwards and backwards</text><rect x="835" y="315" width="72" height="54" rx="7" fill="#EAF5F1" stroke="#168C8C" stroke-width="2"/><text x="871" y="350" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#20314B">8</text><rect x="835" y="426" width="72" height="54" rx="7" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/><text x="871" y="461" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#20314B">84</text><path d="M871 373L871 415" fill="none" stroke="#C9A227" stroke-width="2"  stroke-linecap="round"/><text x="871" y="407" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#C9A227">92</text><rect x="917" y="315" width="72" height="54" rx="7" fill="#EAF5F1" stroke="#168C8C" stroke-width="2"/><text x="953" y="350" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#20314B">12</text><rect x="917" y="426" width="72" height="54" rx="7" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/><text x="953" y="461" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#20314B">80</text><path d="M953 373L953 415" fill="none" stroke="#C9A227" stroke-width="2"  stroke-linecap="round"/><text x="953" y="407" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#C9A227">92</text><rect x="999" y="315" width="72" height="54" rx="7" fill="#EAF5F1" stroke="#168C8C" stroke-width="2"/><text x="1035" y="350" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#20314B">16</text><rect x="999" y="426" width="72" height="54" rx="7" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/><text x="1035" y="461" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#20314B">76</text><path d="M1035 373L1035 415" fill="none" stroke="#C9A227" stroke-width="2"  stroke-linecap="round"/><text x="1035" y="407" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#C9A227">92</text><rect x="1081" y="315" width="72" height="54" rx="7" fill="#E8F1F4" stroke="#315F86" stroke-width="2"/><text x="1117" y="350" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#20314B">…</text><rect x="1081" y="426" width="72" height="54" rx="7" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/><text x="1117" y="461" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#20314B">…</text><path d="M1117 373L1117 415" fill="none" stroke="#C9A227" stroke-width="2"  stroke-linecap="round"/><text x="1117" y="407" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#C9A227">92</text><rect x="1163" y="315" width="72" height="54" rx="7" fill="#E8F1F4" stroke="#315F86" stroke-width="2"/><text x="1199" y="350" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#20314B">80</text><rect x="1163" y="426" width="72" height="54" rx="7" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/><text x="1199" y="461" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#20314B">12</text><path d="M1199 373L1199 415" fill="none" stroke="#C9A227" stroke-width="2"  stroke-linecap="round"/><text x="1199" y="407" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#C9A227">92</text><rect x="1245" y="315" width="72" height="54" rx="7" fill="#E8F1F4" stroke="#315F86" stroke-width="2"/><text x="1281" y="350" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#20314B">84</text><rect x="1245" y="426" width="72" height="54" rx="7" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/><text x="1281" y="461" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#20314B">8</text><path d="M1281 373L1281 415" fill="none" stroke="#C9A227" stroke-width="2"  stroke-linecap="round"/><text x="1281" y="407" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#C9A227">92</text><text x="1077" y="535" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6D80">Every vertical pair sums to 92; there are 20 pairs.</text><text x="1077" y="580" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">2S₂₀ = 20 × 92 = 1840</text><text x="1077" y="618" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#168C8C">S₂₀ = 920</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE  •  STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
