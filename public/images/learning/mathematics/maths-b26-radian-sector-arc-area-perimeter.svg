<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="title desc"><defs><marker id="aN" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#10233F"/></marker><marker id="aT" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#168C8C"/></marker><marker id="aR" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#C44949"/></marker><marker id="aG" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#C9A227"/></marker></defs><title id="title">Radian sector: arc length, area and perimeter</title><desc id="desc">A sector of radius 9 cm and angle 1.2 radians has arc length s=rθ=10.8 cm and area A=½r²θ=48.6 cm². Its perimeter includes both radii: 9+9+10.8=28.8 cm.</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#10233F">Radian sector: arc length, area and perimeter</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#5B6D80">Marlbridge • Edexcel International Mathematics</text><rect x="52" y="132" width="1424" height="680" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="82" y="178" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">Worked example 6 • radius 9 cm, central angle 1.2 radians</text><path d="M370 510L600 510 A230 230 0 0 0 453.3 295.6Z" fill="#F9EDC6" stroke="#C9A227" stroke-width="4"/><path d="M370 510L453.3422835296349 295.63101022753796" fill="none" stroke="#315F86" stroke-width="4" stroke-linecap="round"/><path d="M445 510 A75 75 0 0 0 397.2 440.1" fill="none" stroke="#C44949" stroke-width="3"/><circle cx="370" cy="510" r="7" fill="#10233F"/><text x="354" y="540" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">O</text><text x="487" y="479" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#C44949">θ = 1.2 rad</text><text x="470" y="541" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#315F86">r = 9 cm</text><text x="432" y="344" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#C9A227">arc s = 10.8 cm</text><rect x="790" y="225" width="585" height="390" rx="14" fill="#E8F1F4" stroke="#D3DCE2" stroke-width="2"/><text x="1082" y="269" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233F">Use θ in radians</text><text x="840" y="328" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6D80">Arc length</text><text x="840" y="365" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#168C8C">s = rθ = 9 × 1.2 = 10.8 cm</text><path d="M840 393L1330 393" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round"/><text x="840" y="440" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6D80">Sector area</text><text x="840" y="477" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#315F86">A = ½r²θ = ½ × 81 × 1.2</text><text x="840" y="511" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#315F86">= 48.6 cm²</text><path d="M840 532L1330 532" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round"/><text x="840" y="579" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#C44949">Perimeter = 2r + s = 28.8 cm</text><text x="1082" y="664" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#5B6D80">Sector perimeter includes both straight radii.</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE  •  STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
