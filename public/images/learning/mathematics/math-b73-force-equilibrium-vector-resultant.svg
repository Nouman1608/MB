<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img"><title>Vector equilibrium: the third force cancels the resultant</title><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#10233F">Vector equilibrium: the third force cancels the resultant</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">Marlbridge • OCR A Level Mathematics A H240 • Vectors • resultant forces and equilibrium</text><rect x="52" y="128" width="1424" height="670" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="84" y="178" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233F">For equilibrium, the vector sum of all forces must be zero.</text><rect x="85" y="220" width="790" height="440" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="480" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#315F86">Forces on a particle (N)</text><path d="M190.0 320L190.0 565" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round"/><text x="190.0" y="584" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">-10</text><path d="M369.1666666666667 320L369.1666666666667 565" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round"/><text x="369.1666666666667" y="584" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">-5</text><path d="M548.3333333333334 320L548.3333333333334 565" fill="none" stroke="#10233F" stroke-width="2" stroke-linecap="round"/><text x="548.3333333333334" y="584" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">0</text><path d="M727.5 320L727.5 565" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round"/><text x="727.5" y="584" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">5</text><path d="M190 553.3333333333334L835 553.3333333333334" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round"/><text x="178" y="557.3333333333334" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">-10</text><path d="M190 495.0L835 495.0" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round"/><text x="178" y="499.0" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">-5</text><path d="M190 436.66666666666663L835 436.66666666666663" fill="none" stroke="#10233F" stroke-width="2" stroke-linecap="round"/><text x="178" y="440.66666666666663" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">0</text><path d="M190 378.33333333333337L835 378.33333333333337" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round"/><text x="178" y="382.33333333333337" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">5</text><path d="M190 320.0L835 320.0" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round"/><text x="178" y="324.0" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">10</text><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="context-stroke"/></marker></defs><path d="M548.3 436.7L763.3 413.3" fill="none" stroke="#315F86" stroke-width="4" marker-end="url(#arr)"/><text x="659.4166666666666" y="403.66666666666663" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#315F86">F₁=(6,2)</text><path d="M763.3 413.3L440.8 331.7" fill="none" stroke="#168C8C" stroke-width="4" marker-end="url(#arr)"/><text x="630.75" y="350.8333333333333" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#168C8C">F₂=(−9,7)</text><path d="M548.3 436.7L440.8 331.7" fill="none" stroke="#725C8E" stroke-width="3" marker-end="url(#arr)" stroke-dasharray="7 5"/><text x="243.75" y="325.83333333333337" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#725C8E">R=(−3,9)</text><path d="M548.3 436.7L655.8 541.7" fill="none" stroke="#C44949" stroke-width="4" marker-end="url(#arr)"/><text x="673.75" y="532.3333333333334" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#C44949">F₃=(3,−9)</text><text x="500" y="620" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#10233F">x-component (N)</text><text x="160" y="300" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#10233F">y (N)</text><rect x="900" y="220" width="525" height="440" rx="14" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="1162" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">Balance the resultant</text><text x="945" y="325" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#315F86">F₁+F₂=(−3i+9j) N</text><text x="945" y="370" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#168C8C">F₃=−(F₁+F₂)=3i−9j N</text><path d="M945 400L1380 400" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round"/><text x="945" y="455" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">|F₃|=√(3²+9²)</text><text x="945" y="495" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#725C8E">=3√10≈9.49 N</text><text x="945" y="540" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#C44949">Direction=360°−tan⁻¹(9/3)</text><text x="945" y="575" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#C44949">=288.4° from +x</text><text x="1162" y="620" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">F₁+F₂+F₃=0.</text><text x="760" y="710" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#5B6D80">Draw vectors from a common origin for comparison; the head-to-tail diagram verifies F₁+F₂=R.</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
