<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">AQA kinematics: read acceleration and distance from a velocity–time graph</title><desc id="desc">The source cyclist graph has 5 s acceleration to 8 m/s, 20 s at constant speed, and 4 s deceleration; areas 20+160+16=196 m.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial,sans-serif" fill="#20314B"><text x="62" y="78" font-size="38" font-weight="700" fill="#0B1F3A">AQA kinematics: read acceleration and distance from a velocity–time graph</text><text x="64" y="124" font-size="22">Marlbridge teaching diagram • examples are schematic</text><rect x="60" y="165" width="1480" height="755" rx="18" fill="white" stroke="#CCD6D7" stroke-width="2"/><text x="100" y="220" font-size="22" font-weight="400" fill="#20314B" text-anchor="start">On a velocity–time graph, gradient is acceleration and signed area is displacement.</text><rect x="100" y="270" width="850" height="500" rx="16" fill="#FBFCFC" stroke="#CCD6D7" stroke-width="2"/><text x="130" y="315" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="start">Cyclist: accelerate, cruise, then decelerate</text><path d="M190 690L916 690" fill="none" stroke="#8997A6" stroke-width="2"/><path d="M190 695L190 385" fill="none" stroke="#8997A6" stroke-width="2"/><path d="M190 690L310 402" fill="none" stroke="#2D7A78" stroke-width="5"/><path d="M310 402L790 402" fill="none" stroke="#2D7A78" stroke-width="5"/><path d="M790 402L886 690" fill="none" stroke="#2D7A78" stroke-width="5"/><text x="190" y="718" font-size="14" font-weight="700" fill="#0B1F3A" text-anchor="middle">0</text><text x="310" y="718" font-size="14" font-weight="700" fill="#0B1F3A" text-anchor="middle">5</text><text x="790" y="718" font-size="14" font-weight="700" fill="#0B1F3A" text-anchor="middle">25</text><text x="886" y="718" font-size="14" font-weight="700" fill="#0B1F3A" text-anchor="middle">29</text><text x="310" y="387" font-size="15" font-weight="700" fill="#2D7A78" text-anchor="start">8 m s⁻¹</text><text x="250.0" y="625" font-size="15" font-weight="700" fill="#0B1F3A" text-anchor="middle">20 m</text><text x="550" y="625" font-size="15" font-weight="700" fill="#0B1F3A" text-anchor="middle">160 m</text><text x="838" y="640" font-size="14" font-weight="700" fill="#0B1F3A" text-anchor="middle">16 m</text><text x="520" y="750" font-size="16" font-weight="700" fill="#596B7E" text-anchor="middle">time t (s)</text><rect x="1000" y="270" width="440" height="500" rx="16" fill="#E7EFED" stroke="#2D7A78" stroke-width="2"/><text x="1030" y="320" font-size="21" font-weight="700" fill="#0B1F3A" text-anchor="start">Use area = distance</text><text x="1030" y="380" font-size="18" font-weight="400" fill="#20314B" text-anchor="start">196 = ½(5)(8) + 8T</text><text x="1030" y="420" font-size="18" font-weight="400" fill="#20314B" text-anchor="start">+ ½(4)(8)</text><text x="1030" y="475" font-size="18" font-weight="700" fill="#20314B" text-anchor="start">196 = 20 + 8T + 16</text><text x="1030" y="520" font-size="19" font-weight="700" fill="#2D7A78" text-anchor="start">T = 20 s</text><text x="1030" y="585" font-size="18" font-weight="700" fill="#20314B" text-anchor="start">Acceleration = gradient</text><text x="1030" y="630" font-size="17" font-weight="400" fill="#20314B" text-anchor="start">first: 8/5 = 1.6 m s⁻²</text><text x="1030" y="670" font-size="17" font-weight="400" fill="#20314B" text-anchor="start">last: (0−8)/4 = −2 m s⁻²</text><text x="1030" y="725" font-size="16" font-weight="700" fill="#20314B" text-anchor="start">Distance = 196 m</text><rect x="100" y="800" width="1340" height="70" rx="16" fill="#FFF4D6" stroke="#E0C76C" stroke-width="2"/><text x="125" y="845" font-size="17" font-weight="700" fill="#0B1F3A" text-anchor="start">The two triangular areas and cruise rectangle sum to displacement here because velocity stays non-negative.</text><path d="M60 972H1540" stroke="#CCD6D7" stroke-width="2"/><text x="64" y="1015" font-size="17">Marlbridge • study diagram • check assumptions and context</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>
