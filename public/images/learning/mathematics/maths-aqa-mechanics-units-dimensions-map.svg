<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">AQA mechanics: derive units from SI base quantities</title><desc id="desc">A units map derives velocity, acceleration, force and moment units from metre, kilogram and second, with a conversion and mass-weight distinction.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial,sans-serif" fill="#20314B"><text x="62" y="78" font-size="38" font-weight="700" fill="#0B1F3A">AQA mechanics: derive units from SI base quantities</text><text x="64" y="124" font-size="22">Marlbridge Mathematics • teaching diagram</text><rect x="60" y="165" width="1480" height="755" rx="18" fill="white" stroke="#CCD6D7" stroke-width="2"/><text x="105" y="220" font-size="22" font-weight="700" fill="#0B1F3A" text-anchor="start">Build derived units from the SI base units before substituting into mechanics formulae.</text><rect x="150" y="280" width="340" height="120" rx="16" fill="#E7EFED" stroke="#2D7A78" stroke-width="2"/><text x="320" y="320" font-size="17" font-weight="700" fill="#2D7A78" text-anchor="middle">LENGTH</text><text x="320" y="360" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="middle">metre (m)</text><rect x="595" y="280" width="340" height="120" rx="16" fill="#E7EFED" stroke="#2D7A78" stroke-width="2"/><text x="765" y="320" font-size="17" font-weight="700" fill="#2D7A78" text-anchor="middle">MASS</text><text x="765" y="360" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="middle">kilogram (kg)</text><rect x="1040" y="280" width="340" height="120" rx="16" fill="#E7EFED" stroke="#2D7A78" stroke-width="2"/><text x="1210" y="320" font-size="17" font-weight="700" fill="#2D7A78" text-anchor="middle">TIME</text><text x="1210" y="360" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="middle">second (s)</text><path d="M320 400V455 M765 400V455 M1210 400V455" fill="none" stroke="#596B7E" stroke-width="2"/><rect x="105" y="455" width="290" height="175" rx="16" fill="#FBFCFC" stroke="#397DA4" stroke-width="2"/><text x="250" y="495" font-size="17" font-weight="700" fill="#397DA4" text-anchor="middle">VELOCITY</text><text x="250" y="540" font-size="16" font-weight="600" fill="#20314B" text-anchor="middle">displacement ÷ time</text><text x="250" y="590" font-size="18" font-weight="700" fill="#0B1F3A" text-anchor="middle">m s⁻¹</text><rect x="470" y="455" width="290" height="175" rx="16" fill="#FBFCFC" stroke="#397DA4" stroke-width="2"/><text x="615" y="495" font-size="17" font-weight="700" fill="#397DA4" text-anchor="middle">ACCELERATION</text><text x="615" y="540" font-size="16" font-weight="600" fill="#20314B" text-anchor="middle">velocity ÷ time</text><text x="615" y="590" font-size="18" font-weight="700" fill="#0B1F3A" text-anchor="middle">m s⁻²</text><rect x="835" y="455" width="290" height="175" rx="16" fill="#FBFCFC" stroke="#397DA4" stroke-width="2"/><text x="980" y="495" font-size="17" font-weight="700" fill="#397DA4" text-anchor="middle">FORCE</text><text x="980" y="540" font-size="16" font-weight="600" fill="#20314B" text-anchor="middle">F = ma</text><text x="980" y="590" font-size="18" font-weight="700" fill="#0B1F3A" text-anchor="middle">N = kg m s⁻²</text><rect x="1200" y="455" width="290" height="175" rx="16" fill="#FBFCFC" stroke="#397DA4" stroke-width="2"/><text x="1345" y="495" font-size="17" font-weight="700" fill="#397DA4" text-anchor="middle">MOMENT</text><text x="1345" y="540" font-size="16" font-weight="600" fill="#20314B" text-anchor="middle">force × distance</text><text x="1345" y="590" font-size="18" font-weight="700" fill="#0B1F3A" text-anchor="middle">N m = kg m² s⁻²</text><rect x="105" y="685" width="665" height="165" rx="16" fill="#FFF4D6" stroke="#E0C76C" stroke-width="2"/><text x="135" y="730" font-size="19" font-weight="700" fill="#9A7414" text-anchor="start">Convert before you substitute</text><text x="135" y="775" font-size="19" font-weight="700" fill="#0B1F3A" text-anchor="start">90 km h⁻¹ = 25 m s⁻¹</text><text x="135" y="815" font-size="16" font-weight="500" fill="#20314B" text-anchor="start">Convert km→m and h→s; do not mix units.</text><rect x="815" y="685" width="665" height="165" rx="16" fill="#F7F1ED" stroke="#D9B0A8" stroke-width="2"/><text x="845" y="730" font-size="19" font-weight="700" fill="#9B4038" text-anchor="start">Mass and weight are different</text><text x="845" y="775" font-size="16" font-weight="700" fill="#0B1F3A" text-anchor="start">mass m: measured in kg     weight W=mg: measured in N</text><text x="845" y="815" font-size="16" font-weight="500" fill="#20314B" text-anchor="start">A newton is kg m s⁻²; a moment uses N m.</text><path d="M60 972H1540" stroke="#CCD6D7" stroke-width="2"/><text x="64" y="1015" font-size="17">Marlbridge • Mathematics study resource • check assumptions and context</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>
