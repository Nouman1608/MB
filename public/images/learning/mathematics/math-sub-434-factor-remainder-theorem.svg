<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img"><title>Evaluate the polynomial at the divisor root</title><desc>Algebra • factor and remainder theorems</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#10233F">Evaluate the polynomial at the divisor root</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">Algebra • factor and remainder theorems</text><rect x="52" y="126" width="995" height="630" rx="18" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="1070" y="126" width="406" height="630" rx="18" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="120" y="190" width="840" height="490" rx="14" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="160" y="248" text-anchor="start" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#10233F">g(x)=3x³+4x²−17x−6</text><text x="160" y="315" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#315F86">Test divisor 3x+1 at its root x=−1/3</text><rect x="160" y="350" width="760" height="82" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="190" y="402" text-anchor="start" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#168C8C">g(−1/3)=0  ⇒  (3x+1) is a factor</text><text x="160" y="492" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">Second example: f(x)=2x³+px²+qx−6</text><text x="160" y="545" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="600" fill="#20314B">f(3/2)=0   and   f(−1)=−5</text><text x="160" y="595" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#725C8E">9p+6q=−3;  p−q=3  →  p=1, q=−2</text><rect x="1090" y="150" width="366" height="90" rx="12" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="1110" y="179" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#315F86">ROOT OF ax+b</text><text x="1110" y="210" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">x=−b/a</text><rect x="1090" y="258" width="366" height="90" rx="12" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="1110" y="287" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#315F86">REMAINDER</text><text x="1110" y="318" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">Remainder is f(−b/a)</text><rect x="1090" y="366" width="366" height="90" rx="12" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="1110" y="395" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#315F86">FACTOR TEST</text><text x="1110" y="426" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">f(−b/a)=0 ⇔ ax+b is a factor</text><rect x="1090" y="474" width="366" height="90" rx="12" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="1110" y="503" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#315F86">PARAMETERS</text><text x="1110" y="534" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">f(3/2)=0 gives 9p+6q=−3</text><rect x="1090" y="582" width="366" height="90" rx="12" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="1110" y="611" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#315F86">SECOND CONDITION</text><text x="1110" y="642" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">f(−1)=−5 gives p−q=3</text><rect x="52" y="773" width="1424" height="64" rx="12" fill="#F4F1E8" stroke="#F4F1E8" stroke-width="2"/><text x="72" y="813" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">The simultaneous conditions solve to p=1 and q=−2.</text><text letter-spacing="5" opacity=".08" x="764" y="864" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE STUDY RESOURCES</text><line x1="52" y1="879" x2="1476" y2="879" stroke="#C9A227" stroke-width="2" stroke-linecap="round"/><text x="54" y="916" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
