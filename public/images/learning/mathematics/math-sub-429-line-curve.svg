f" font-size="17" font-weight="600" fill="#20314B">x²−5x+9 = 2x−1</text><rect x="1090" y="258" width="366" height="90" rx="12" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="1110" y="287" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#315F86">QUADRATIC</text><text x="1110" y="318" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">x²−7x+10 = 0</text><rect x="1090" y="366" width="366" height="90" rx="12" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="1110" y="395" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#315F86">FACTORISE</text><text x="1110" y="426" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">(x−2)(x−5)=0</text><rect x="1090" y="474" width="366" height="90" rx="12" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="1110" y="503" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#315F86">X-VALUES</text><text x="1110" y="534" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">x=2 or x=5</text><rect x="1090" y="582" width="366" height="90" rx="12" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="1110" y="611" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#315F86">COORDINATES</text><text x="1110" y="642" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">Use the line: (2,3) and (5,9)</text><rect x="52" y="773" width="1424" height="64" rx="12" fill="#F4F1E8" stroke="#F4F1E8" stroke-width="2"/><text x="72" y="813" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">Substitute into the simpler equation to recover each y-coordinate.</text><text letter-spacing="5" opacity=".08" x="764" y="864" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE STUDY RESOURCES</text><line x1="52" y1="879" x2="1476" y2="879" stroke="#C9A227" stroke-width="2" stroke-linecap="round"/><text x="54" y="916" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
