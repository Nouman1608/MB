harray="7 6" stroke-linecap="round"/><rect x="1050" y="188" width="368" height="232" rx="12" fill="#E8F1F4" stroke="#D3DCE2" stroke-width="2"/><text x="1080" y="232" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233F">Coordinate check</text><text x="1080" y="276" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#20314B">A(−3, 1) + (5, −2) = A′(2, −1)</text><text x="1080" y="316" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#20314B">B(−1, 1) + (5, −2) = B′(4, −1)</text><text x="1080" y="356" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#20314B">C(−1, 4) + (5, −2) = C′(4, 2)</text><text x="1080" y="398" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#168C8C">Same vector; size and orientation stay fixed.</text><text x="430" y="804" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#168C8C">Object</text><text x="703" y="804" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#315F86">Image</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE  •  STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
