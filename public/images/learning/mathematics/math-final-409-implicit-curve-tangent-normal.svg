="15" font-weight="700" fill="#20314B">15x + 7y = 36</text><text x="1126" y="489" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">m_normal = 7/15</text><rect x="1100" y="530" width="352" height="154" rx="14" fill="#E7F3F1" stroke="#E7F3F1" stroke-width="2"/><text x="1126" y="569" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#168C8C">Normal line</text><text x="1126" y="611" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#20314B">7x − 15y + 38 = 0</text><text x="1126" y="650" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">Both pass through P.</text><text letter-spacing="5" opacity=".075" x="764" y="849" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE STUDY RESOURCES</text><line x1="52" y1="866" x2="1476" y2="866" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
