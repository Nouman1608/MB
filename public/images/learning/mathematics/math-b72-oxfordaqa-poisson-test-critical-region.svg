<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img"><title>Read a one-tailed Poisson test from its discrete tail</title><desc>Marlbridge • OxfordAQA International A-level Mathematics 9660 • Worked example 4: one-tailed</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#10233F">Read a one-tailed Poisson test from its discrete tail</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">Marlbridge • OxfordAQA International A-level Mathematics 9660 • Worked example 4: one-tailed</text><rect x="52" y="128" width="1000" height="660" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="1076" y="128" width="400" height="660" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="88" y="174" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">A discrete upper-tail test may miss the stated significance level</text><text x="88" y="211" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6D80">Worked example 4 • complaints over four days: X ~ Po(10)</text><line x1="129.5" y1="680" x2="920" y2="680" stroke="#10233F" stroke-width="3" /><rect x="135" y="679.8865001755938" width="20" height="0.11349982440621212" rx="2" fill="#315F86" fill-opacity=".72"/><text x="145" y="702" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">0</text><rect x="166" y="678.8650017559379" width="20" height="1.1349982440621211" rx="2" fill="#315F86" fill-opacity=".72"/><rect x="197" y="674.3250087796894" width="20" height="5.674991220310606" rx="2" fill="#315F86" fill-opacity=".72"/><text x="207" y="702" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">2</text><rect