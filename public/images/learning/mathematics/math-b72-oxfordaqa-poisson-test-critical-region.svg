x="2" fill="#315F86" fill-opacity=".72"/><text x="579" y="702" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">14</text><rect x="600" y="593.2048259232897" width="20" height="86.79517407671032" rx="2" fill="#C9A227" fill-opacity=".72"/><rect x="631" y="625.7530162020561" width="20" height="54.24698379794395" rx="2" fill="#C44949" fill-opacity=".8"/><text x="641" y="702" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">16</text><rect x="662" y="648.0900095306212" width="20" height="31.909990469378798" rx="2" fill="#C44949" fill-opacity=".8"/><rect x="693" y="662.2722275170117" width="20" height="17.72777248298822" rx="2" fill="#C44949" fill-opacity=".8"/><text x="703" y="702" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">18</text><rect x="724" y="670.6695934300062" width="20" height="9.330406569993801" rx="2" fill="#C44949" fill-opacity=".8"/><rect x="755" y="675.3347967150031" width="20" height="4.665203284996901" rx="2" fill="#C44949" fill-opacity=".8"/><text x="765" y="702" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">20</text><rect x="786" y="677.778474626192" width="20" height="2.221525373808048" rx="2" fill="#C44949" fill-opacity=".8"/><rect x="817" y="678.9902157391782" width="20" height="1.00978426082184" rx="2" fill="#C44949" fill-opacity=".8"/><text x="827" y="702" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">22</text><rect x="848" y="679.5609633648601" width="20" height="0.4390366351399304" rx="2" fill="#C44949" fill-opacity=".8"/><rect x="879" y="679.8170680686917" width="20" height="0.18293193130830432" rx="2" fill="#C44949" fill-opacity=".8"/><text x="889" y="702" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">24</text><line x1="610" y1="680" x2="610" y2="405" stroke="#C9A227" stroke-width="3" stroke-dasharray="6 5"/><line x1="631" y1="680" x2="631" y2="405" stroke="#C44949" stroke-width="3" stroke-dasharray="6 5"/><text x="610" y="380" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#C9A227">observed 15</text><text x="734" y="380" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#C44949">critical: X ≥ 16</text><text x="155" y="300" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#315F86">Poisson probability mass function</text><rect x="1100" y="164" width="352" height="150" rx="14" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="1126" y="203" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#315F86">Scale to four days</text><text x="1126" y="245" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">H₀ mean: 2.5 × 4 = 10</text><text x="1126" y="282" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">X ~ Po(10)</text><rect x="1100" y="332" width="352" height="184" rx="14" fill="#F4F1E8" stroke="#F4F1E8" stroke-width="2"/><text x="1126" y="371" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#725C8E">Observed count: 15</text><text x="1126" y="413" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">P(X ≥ 15) = 0.0835</text><text x="1126" y="450" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#C44949">0.0835 &gt; 0.05</text><text x="1126" y="487" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">Do not reject H₀.</text><rect x="1100" y="534" width="352" height="156" rx="14" fill="#E7F3F1" stroke="#E7F3F1" stroke-width="2"/><text x="1126" y="573" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#168C8C">Critical region at 5%</text><text x="1126" y="615" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">P(X ≥ 16) = 0.0487</text><text x="1126" y="652" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#10233F">Only counts 16+ reject H₀.</text><text letter-spacing="5" opacity=".075" x="764" y="849" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE STUDY RESOURCES</text><line x1="52" y1="866" x2="1476" y2="866" stroke="#C9A227" stroke-width="2" /><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
