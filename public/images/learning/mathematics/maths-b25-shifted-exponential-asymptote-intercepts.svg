<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="title desc"><defs><marker id="arrG" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#C9A227"/></marker></defs><title id="title">Shifted exponential: asymptote, intercepts and range</title><desc id="desc">For y=e^(3x+2)−4, the horizontal asymptote is y=−4 and the range is y&gt;−4. The curve is increasing. Its y-intercept is e²−4≈3.389, and its x-intercept is (ln 4−2)/3≈−0.205.</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#10233F">Shifted exponential: asymptote, intercepts and range</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#5B6D80">Marlbridge • Pearson Edexcel International Advanced Level Mathematics</text><rect x="52" y="132" width="1424" height="680" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="82" y="178" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">Worked example 1 • y = e^(3x + 2) − 4</text><path d="M185 670L185 290" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="185" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">-1.5</text><path d="M266.25 670L266.25 290" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="266.25" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">-1.25</text><path d="M347.5 670L347.5 290" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="347.5" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">-1</text><path d="M428.75 670L428.75 290" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="428.75" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">-0.75</text><path d="M510 670L510 290" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="510" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">-0.5</text><path d="M591.25 670L591.25 290" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="591.25" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">-0.25</text><path d="M672.5 670L672.5 290" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="672.5" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">0</text><path d="M753.75 670L753.75 290" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="753.75" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">0.25</text><path d="M185 651L753.75 651" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="173" y="656" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">-4</text><path d="M185 613L753.75 613" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="173" y="618" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">-2</text><path d="M185 575L753.75 575" fill="none" stroke="#10233F" stroke-width="2"  stroke-linecap="round"/><text x="173" y="580" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">0</text><path d="M185 537L753.75 537" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="173" y="542" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">2</text><path d="M185 499L753.75 499" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="173" y="504" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">4</text><path d="M185 461L753.75 461" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="173" y="466" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">6</text><path d="M185 423L753.75 423" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="173" y="428" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">8</text><path d="M185 385L753.75 385" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="173" y="390" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">10</text><path d="M185 347L753.75 347" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="173" y="352" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">12</text><path d="M185 309L753.75 309" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="173" y="314" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">14</text><path d="M672.5 670L672.5 290" fill="none" stroke="#10233F" stroke-width="2"  stroke-linecap="round"/><path d="M185 651L753.75 651" fill="none" stroke="#C44949" stroke-width="3" stroke-dasharray="10 7" stroke-linecap="round"/><path d="M185.0 649.4 L189.7 649.4 L194.5 649.3 L199.2 649.2 L204.0 649.1 L208.7 649.1 L213.4 649.0 L218.2 648.9 L222.9 648.8 L227.7 648.7 L232.4 648.6 L237.1 648.5 L241.9 648.4 L246.6 648.2 L251.4 648.1 L256.1 648.0 L260.8 647.9 L265.6 647.7 L270.3 647.6 L275.1 647.4 L279.8 647.3 L284.5 647.1 L289.3 646.9 L294.0 646.7 L298.8 646.5 L303.5 646.3 L308.2 646.1 L313.0 645.9 L317.7 645.7 L322.4 645.5 L327.2 645.2 L331.9 644.9 L336.7 644.7 L341.4 644.4 L346.1 644.1 L350.9 643.8 L355.6 643.5 L360.4 643.1 L365.1 642.8 L369.8 642.4 L374.6 642.0 L379.3 641.6 L384.1 641.2 L388.8 640.8 L393.5 640.3 L398.3 639.8 L403.0 639.3 L407.8 638.8 L412.5 638.3 L417.2 637.7 L422.0 637.1 L426.7 636.5 L431.5 635.8 L436.2 635.1 L440.9 634.4 L445.7 633.7 L450.4 632.9 L455.2 632.1 L459.9 631.3 L464.6 630.4 L469.4 629.5 L474.1 628.5 L478.9 627.5 L483.6 626.5 L488.3 625.4 L493.1 624.2 L497.8 623.0 L502.6 621.8 L507.3 620.4 L512.0 619.1 L516.8 617.7 L521.5 616.2 L526.3 614.6 L531.0 613.0 L535.7 611.3 L540.5 609.5 L545.2 607.6 L549.9 605.7 L554.7 603.7 L559.4 601.6 L564.2 599.4 L568.9 597.0 L573.6 594.6 L578.4 592.1 L583.1 589.5 L587.9 586.7 L592.6 583.8 L597.3 580.8 L602.1 577.7 L606.8 574.4 L611.6 571.0 L616.3 567.4 L621.0 563.7 L625.8 559.8 L630.5 555.7 L635.3 551.4 L640.0 547.0 L644.7 542.3 L649.5 537.5 L654.2 532.4 L659.0 527.1 L663.7 521.6 L668.4 515.8 L673.2 509.7 L677.9 503.4 L682.7 496.8 L687.4 489.9 L692.1 482.7 L696.9 475.2 L701.6 467.3 L706.4 459.1 L711.1 450.5 L715.8 441.6 L720.6 432.2 L725.3 422.4 L730.1 412.2 L734.8 401.5 L739.5 390.3 L744.3 378.7 L749.0 366.5 L753.8 353.8" fill="none" stroke="#315F86" stroke-width="5"/><circle cx="606.0152224546548" cy="575" r="7" fill="#168C8C"/><text x="606.0152224546548" y="559" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#168C8C">x-int ≈ −0.205</text><circle cx="672.5" cy="510.6079341203176" r="7" fill="#725C8E"/><text x="692.5" y="505.6079341203176" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#725C8E">y-int ≈ 3.389</text><text x="802.5" y="642" text-anchor="end" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#C44949">y = −4 asymptote</text><text x="763.5" y="404" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#315F86">increasing</text><rect x="920" y="230" width="430" height="340" rx="14" fill="#E8F1F4" stroke="#D3DCE2" stroke-width="2"/><text x="1135" y="274" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233F">Read the transformation</text><text x="960" y="330" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#C44949">−4 shifts the asymptote</text><text x="960" y="370" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">from y=0 down to y=−4</text><path d="M960 396L1310 396" fill="none" stroke="#D3DCE2" stroke-width="2"  stroke-linecap="round"/><text x="960" y="446" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">Range: y &gt; −4</text><text x="960" y="486" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#725C8E">At x=0: y=e²−4≈3.389</text><text x="960" y="526" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#168C8C">Set y=0: x=(ln 4−2)/3≈−0.205</text><text x="1135" y="636" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#5B6D80">The curve approaches but never crosses its asymptote.</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE  •  STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
