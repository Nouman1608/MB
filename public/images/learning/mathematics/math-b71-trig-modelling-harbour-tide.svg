0.3 L875.0 387.4" fill="none" stroke="#168C8C" stroke-width="4"/><circle cx="269.7843685318076" cy="350.625" r="6" fill="#C44949"/><text x="269.7843685318076" y="338.625" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#C44949">maximum 10 m</text><circle cx="624.7843685318076" cy="534.375" r="6" fill="#725C8E"/><text x="624.7843685318076" y="522.375" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#725C8E">minimum 4 m</text><circle cx="388.11749999999995" cy="396.5625" r="6" fill="#315F86"/><text x="388.11749999999995" y="384.5625" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#315F86">8.5 m</text><circle cx="861.4508333333334" cy="396.5625" r="6" fill="#315F86"/><text x="861.4508333333334" y="384.5625" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#315F86">8.5 m</text><path d="M388.11749999999995 396.5625L861.4508333333334 396.5625" fill="none" stroke="#315F86" stroke-width="2" stroke-linecap="round"/><text x="500" y="620" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#10233F">Time after midnight t (hours)</text><text x="143" y="300" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#10233F">Depth d (m)</text><rect x="950" y="220" width="475" height="440" rx="14" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="1187" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">Amplitude–phase form</text><text x="995" y="325" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#315F86">R = √(2.4²+1.8²) = 3 m</text><text x="995" y="365" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">α = tan⁻¹(1.8/2.4) = 0.6435</text><text x="995" y="405" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#168C8C">d = 7 + 3 sin(πt/6+α)</text><path d="M995 430L1380 430" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round"/><text x="995" y="475" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#725C8E">Mean 7 m • amplitude 3 m</text><text x="995" y="515" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#725C8E">Period = 2π ÷ (π/6) = 12 h</text><text x="1187" y="575" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#C44949">d=8.5 m at t≈3.77, 11.77 h</text><text x="1187" y="615" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#5B6D80">Respect the stated 0≤t&lt;12 interval.</text><text x="760" y="710" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#5B6D80">A phase shift changes the timing; the amplitude and vertical shift determine the highest and lowest depths.</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
