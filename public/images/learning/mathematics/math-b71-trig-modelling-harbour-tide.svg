<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img"><title>Trigonometric model: read a harbour tide cycle</title><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#10233F">Trigonometric model: read a harbour tide cycle</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">Marlbridge • OCR A Level Mathematics A H240 • Trigonometry • sinusoidal models and the R-form</text><rect x="52" y="128" width="1424" height="670" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="84" y="178" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">Combine sine and cosine into one sinusoid to read the mean, amplitude and period.</text><rect x="85" y="220" width="835" height="440" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="500" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#315F86">Harbour depth d=7+2.4 sin(πt/6)+1.8 cos(πt/6)</text><path d="M165.0 320L165.0 565" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="165.0" y="585" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">0</text><path d="M283.3333333333333 320L283.3333333333333 565" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="283.3333333333333" y="585" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">2</text><path d="M401.66666666666663 320L401.66666666666663 565" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="401.66666666666663" y="585" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">4</text><path d="M520.0 320L520.0 565" fill