 590.0 L468.8888888888889 695.0" fill="none" stroke="#B9544D" stroke-width="2" stroke-dasharray="5 5"/><text x="468.8888888888889" y="718.0" font-size="16" font-weight="700" fill="#B9544D" text-anchor="middle">80°</text><circle cx="757.7777777777778" cy="590.0" r="8" fill="#B9544D" stroke="#B9544D" stroke-width="1"/><path d="M757.7777777777778 590.0 L757.7777777777778 695.0" fill="none" stroke="#B9544D" stroke-width="2" stroke-dasharray="5 5"/><text x="757.7777777777778" y="718.0" font-size="16" font-weight="700" fill="#B9544D" text-anchor="middle">160°</text><path d="M 180.0 590.0 L 830.0 590.0" fill="none" stroke="#C9A227" stroke-width="3" stroke-dasharray="8 8"/><rect x="885" y="292" width="555" height="470" rx="16" fill="#F5F8FB" stroke="#397DA4" stroke-width="2"/><text x="925" y="342" font-size="18" font-weight="700" fill="#397DA4" text-anchor="start">SOLVE THE EQUATION</text><text x="925" y="390" font-size="23" font-weight="700" fill="#0B1F3A" text-anchor="start">2 cos 3x = −1</text><text x="925" y="435" font-size="21" font-weight="600" fill="#20314B" text-anchor="start">cos 3x = −½</text><text x="925" y="485" font-size="19" font-weight="600" fill="#20314B" text-anchor="start">0° ≤ 3x ≤ 540°</text><text x="925" y="535" font-size="20" font-weight="700" fill="#2D7A78" text-anchor="start">3x = 120°, 240°, 480°</text><path d="M925 562 L1395 562" fill="none" stroke="#CCD6D7" stroke-width="2"/><text x="925" y="615" font-size="19" font-weight="700" fill="#0B1F3A" text-anchor="start">Divide each angle by 3:</text><text x="925" y="660" font-size="25" font-weight="700" fill="#2D7A78" text-anchor="start">x = 40°, 80°, 160°</text><text x="925" y="710" font-size="18" font-weight="600" fill="#20314B" text-anchor="start">Check each lies in [0°, 180°].</text><rect x="120" y="810" width="1330" height="58" rx="14" fill="#FFF4D6" stroke="#E0C76C" stroke-width="2"/><text x="155" y="847" font-size="19" font-weight="700" fill="#0B1F3A" text-anchor="start">Three roots appear because 3x spans one and a half cosine cycles.</text><path d="M60 972 L1540 972" fill="none" stroke="#CCD6D7" stroke-width="2"/><text x="64" y="1015" font-size="17" font-weight="500" fill="#20314B" text-anchor="start">Marlbridge • Mathematics study resource • check assumptions and context</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>