<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img"><title>Cobweb diagram: iterate toward a fixed point</title><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#10233F">Cobweb diagram: iterate toward a fixed point</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">Marlbridge • OCR A Level Mathematics A H240 • Numerical methods • cobweb diagrams and fixed-point iteration</text><rect x="52" y="128" width="1424" height="670" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="84" y="178" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233F">Each iteration alternates vertical to y=g(x) and horizontal to y=x.</text><rect x="85" y="220" width="850" height="440" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="510" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#315F86">x³ + 2x − 9 = 0; use xₙ₊₁ = ∛(9 − 2xₙ)</text><path d="M206.76470588235279 320L206.76470588235279 565" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="206.76470588235279" y="585" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">1.4</text><path d="M165 550.5882352941177L875 550.5882352941177" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="155" y="554.5882352941177" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">1.4</text><path d="M373.82352941176464 320L373.82352941176464 565" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="373.82352941176464" y="585" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">1.6</text><path d="M165 492.94117647058823L875 492.94117647058823" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="155" y="496.94117647058823" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">1.6</text><path d="M540.8823529411764 320L540.8823529411764 565" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="540.8823529411764" y="585" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">1.8</text><path d="M165 435.29411764705884L875 435.29411764705884" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="155" y="439.29411764705884" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">1.8</text><path d="M707.9411764705882 320L707.9411764705882 565" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="707.9411764705882" y="585" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">2.0</text><path d="M165 377.64705882352945L875 377.64705882352945" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="155" y="381.64705882352945" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">2.0</text><path d="M875.0 320L875.0 565" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="875.0" y="585" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">2.2</text><path d="M165 320.0L875 320.0" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="155" y="324.0" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">2.2</text><path d="M165.0 565.0L875.0 320.0" fill="none" stroke="#10233F" stroke-width="3" stroke-linecap="round"/><text x="791.470588235294" y="336.82352941176475" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#10233F">y=x</text><path d="M165.0 421.8 L172.1 422.3 L179.2 422.7 L186.3 423.2 L193.4 423.7 L200.5 424.2 L207.6 424.7 L214.7 425.1 L221.8 425.6 L228.9 426.1 L236.0 426.6 L243.1 427.1 L250.2 427.6 L257.3 428.1 L264.4 428.6 L271.5 429.1 L278.6 429.5 L285.7 430.0 L292.8 430.5 L299.9 431.0 L307.0 431.5 L314.1 432.0 L321.2 432.5 L328.3 433.0 L335.4 433.5 L342.5 434.0 L349.6 434.5 L356.7 435.0 L363.8 435.5 L370.9 436.0 L378.0 436.5 L385.1 437.0 L392.2 437.6 L399.3 438.1 L406.4 438.6 L413.5 439.1 L420.6 439.6 L427.7 440.1 L434.8 440.6 L441.9 441.1 L449.0 441.7 L456.1 442.2 L463.2 442.7 L470.3 443.2 L477.4 443.7 L484.5 444.3 L491.6 444.8 L498.7 445.3 L505.8 445.8 L512.9 446.4 L520.0 446.9 L527.1 447.4 L534.2 447.9 L541.3 448.5 L548.4 449.0 L555.5 449.5 L562.6 450.1 L569.7 450.6 L576.8 451.1 L583.9 451.7 L591.0 452.2 L598.1 452.7 L605.2 453.3 L612.3 453.8 L619.4 454.4 L626.5 454.9 L633.6 455.5 L640.7 456.0 L647.8 456.6 L654.9 457.1 L662.0 457.7 L669.1 458.2 L676.2 458.8 L683.3 459.3 L690.4 459.9 L697.5 460.4 L704.6 461.0 L711.7 461.5 L718.8 462.1 L725.9 462.7 L733.0 463.2 L740.1 463.8 L747.2 464.4 L754.3 464.9 L761.4 465.5 L768.5 466.1 L775.6 466.6 L782.7 467.2 L789.8 467.8 L796.9 468.3 L804.0 468.9 L811.1 469.5 L818.2 470.1 L825.3 470.7 L832.4 471.2 L839.5 471.8 L846.6 472.4 L853.7 473.0 L860.8 473.6 L867.9 474.2 L875.0 474.8" fill="none" stroke="#168C8C" stroke-width="4"/><text x="273.58823529411757" y="414.19802815235994" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#168C8C">y=g(x)</text><path d="M290.3 521.8 L290.3 430.4 L555.2 430.4 L555.2 449.5 L499.7 449.5 L499.7 445.4 L511.6 445.4 L511.6 446.2 L509.1 446.2 L509.1 446.1 L509.6 446.1" fill="none" stroke="#C9A227" stroke-width="3"/><circle cx="290.2941176470587" cy="521.7647058823529" r="3.5" fill="#C9A227"/><circle cx="290.2941176470587" cy="430.3652941176471" r="3.5" fill="#C9A227"/><circle cx="555.165882352941" cy="430.3652941176471" r="3.5" fill="#C9A227"/><circle cx="555.165882352941" cy="449.5041176470589" r="3.5" fill="#C9A227"/><circle cx="499.7023529411763" cy="449.5041176470589" r="3.5" fill="#C9A227"/><circle cx="499.7023529411763" cy="445.3823529411765" r="3.5" fill="#C9A227"/><circle cx="511.6470588235292" cy="445.3823529411765" r="3.5" fill="#C9A227"/><circle cx="511.6470588235292" cy="446.2470588235294" r="3.5" fill="#C9A227"/><circle cx="509.14117647058816" cy="446.2470588235294" r="3.5" fill="#C9A227"/><circle cx="509.14117647058816" cy="446.07411764705887" r="3.5" fill="#C9A227"/><circle cx="509.64235294117634" cy="446.07411764705887" r="3.5" fill="#C9A227"/><circle cx="509.5588235294116" cy="446.1029411764706" r="7" fill="#C44949"/><text x="519.5588235294116" y="434.1029411764706" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#C44949">α≈1.7625</text><text x="510" y="610" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#10233F">x</text><text x="120" y="305" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#10233F">y</text><rect x="965" y="220" width="460" height="440" rx="14" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="1195" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">How to read the cobweb</text><text x="1010" y="330" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#315F86">Start x₁ = 1.5 on y=x.</text><text x="1010" y="375" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">Vertical: x₂ = g(x₁) = 1.8171</text><text x="1010" y="415" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">Horizontal: move to y=x at x₂.</text><path d="M1010 440L1380 440" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round"/><text x="1010" y="490" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#5B6D80">The next vertical step gives</text><text x="1010" y="525" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#168C8C">x₃ = g(x₂) = 1.7507.</text><text x="1195" y="600" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#725C8E">Steps spiral inward to α.</text><text x="760" y="710" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#5B6D80">Here g is decreasing, so the cobweb alternates across the fixed point; |g′(α)|≈0.215&lt;1 gives convergence.</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
