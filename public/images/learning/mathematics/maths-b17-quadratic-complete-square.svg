<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="ti de"><title id="ti">Quadratics: completing the square and discriminant</title><desc id="de">Completing square for x squared minus six x plus five gives (x minus three) squared minus four, vertex (3,-4), roots 1 and 5. Discriminant sign classifies real roots.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial,sans-serif"><text x="62" y="78" font-size="38" font-weight="700" fill="#0B1F3A" text-anchor="start">Quadratics: completing the square and discriminant</text><text x="64" y="124" font-size="21" font-weight="500" fill="#20314B" text-anchor="start">Pearson Edexcel International A Level Mathematics • Pure Mathematics</text><rect x="60" y="165" width="1480" height="755" rx="16" fill="#FFFFFF" stroke="#CCD6D7" stroke-width="2"/><text x="110" y="220" font-size="22" font-weight="700" fill="#0B1F3A" text-anchor="start">Completing the square reveals the vertex; the discriminant counts real roots.</text><rect x="130" y="300" width="620" height="465" rx="16" fill="#F5F8FB" stroke="#397DA4" stroke-width="2"/><text x="165" y="350" font-size="20" font-weight="700" fill="#397DA4" text-anchor="start">COMPLETE THE SQUARE</text><text x="180" y="425" font-size="27" font-weight="700" fill="#0B1F3A" text-anchor="start">x² − 6x + 5</text><text x="180" y="480" font-size="27" font-weight="700" fill="#2D7A78" text-anchor="start">= (x − 3)² − 4</text><text x="180" y="555" font-size="22" font-weight="700" fill="#0B1F3A" text-anchor="start">vertex: (3, −4)</text><text x="180" y="615" font-size="22" font-weight="600" fill="#20314B" text-anchor="start">roots: x = 1 and x = 5</text><path d="M180 680L680 680" fill="none" stroke="#CCD6D7" stroke-width="2"/><text x="180" y="720" font-size="18" font-weight="600" fill="#667888" text-anchor="start">axis of symmetry: x = 3</text><rect x="850" y="300" width="590" height="465" rx="16" fill="#F5F8FB" stroke="#397DA4" stroke-width="2"/><text x="885" y="350" font-size="20" font-weight="700" fill="#397DA4" text-anchor="start">DISCRIMINANT  Δ = b² − 4ac</text><text x="900" y="440" font-size="24" font-weight="700" fill="#2D7A78" text-anchor="start">Δ &gt; 0</text><text x="1040" y="440" font-size="21" font-weight="600" fill="#0B1F3A" text-anchor="start">two real roots</text><text x="900" y="515" font-size="24" font-weight="700" fill="#C9A227" text-anchor="start">Δ = 0</text><text x="1040" y="515" font-size="21" font-weight="600" fill="#0B1F3A" text-anchor="start">one repeated root</text><text x="900" y="590" font-size="24" font-weight="700" fill="#B9544D" text-anchor="start">Δ &lt; 0</text><text x="1040" y="590" font-size="21" font-weight="600" fill="#0B1F3A" text-anchor="start">no real roots</text><path d="M890 635L1390 635" fill="none" stroke="#CCD6D7" stroke-width="2"/><text x="900" y="695" font-size="18" font-weight="600" fill="#20314B" text-anchor="start">Surds: rationalise by using the conjugate.</text><path d="M60 972L1540 972" fill="none" stroke="#CCD6D7" stroke-width="2"/><text x="64" y="1015" font-size="17" font-weight="500" fill="#20314B" text-anchor="start">Marlbridge • Mathematics study resource • check assumptions and context</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>