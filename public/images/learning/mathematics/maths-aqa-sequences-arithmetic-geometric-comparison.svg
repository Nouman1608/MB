<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">AQA sequences and series: compare arithmetic and geometric models</title><desc id="desc">A side-by-side comparison gives the nth-term and sum rules, checks source-aligned arithmetic and geometric examples, and states the convergence condition for an infinite geometric series.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial,sans-serif" fill="#20314B"><text x="62" y="78" font-size="38" font-weight="700" fill="#0B1F3A">AQA sequences and series: compare arithmetic and geometric models</text><text x="64" y="124" font-size="22">Marlbridge Mathematics • teaching diagram</text><rect x="60" y="165" width="1480" height="755" rx="18" fill="white" stroke="#CCD6D7" stroke-width="2"/><text x="105" y="220" font-size="21" font-weight="700" fill="#0B1F3A" text-anchor="start">Identify the constant difference or ratio first; the matching sum formula depends on that structure.</text><rect x="100" y="275" width="680" height="475" rx="16" fill="#F5F8FB" stroke="#397DA4" stroke-width="2"/><text x="440" y="325" font-size="21" font-weight="700" fill="#397DA4" text-anchor="middle">ARITHMETIC</text><text x="145" y="385" font-size="17" font-weight="700" fill="#20314B" text-anchor="start">Constant difference d</text><text x="145" y="440" font-size="23" font-weight="700" fill="#0B1F3A" text-anchor="start">uₙ = a + (n−1)d</text><text x="145" y="495" font-size="21" font-weight="700" fill="#0B1F3A" text-anchor="start">Sₙ = n/2 [2a + (n−1)d]</text><text x="145" y="570" font-size="18" font-weight="600" fill="#20314B" text-anchor="start">5, 8, 11, …   a=5, d=3</text><text x="145" y="620" font-size="19" font-weight="700" fill="#397DA4" text-anchor="start">u₁₀ = 32     S₁₀ = 185</text><path d="M160 675H700" fill="none" stroke="#397DA4" stroke-width="5"/><text x="160" y="715" font-size="14" font-weight="700" fill="#397DA4" text-anchor="middle">5</text><text x="214" y="715" font-size="14" font-weight="700" fill="#397DA4" text-anchor="middle">8</text><text x="268" y="715" font-size="14" font-weight="700" fill="#397DA4" text-anchor="middle">11</text><text x="322" y="715" font-size="14" font-weight="700" fill="#397DA4" text-anchor="middle">14</text><text x="376" y="715" font-size="14" font-weight="700" fill="#397DA4" text-anchor="middle">17</text><text x="430" y="715" font-size="14" font-weight="700" fill="#397DA4" text-anchor="middle">20</text><text x="484" y="715" font-size="14" font-weight="700" fill="#397DA4" text-anchor="middle">23</text><text x="538" y="715" font-size="14" font-weight="700" fill="#397DA4" text-anchor="middle">26</text><text x="592" y="715" font-size="14" font-weight="700" fill="#397DA4" text-anchor="middle">29</text><text x="646" y="715" font-size="14" font-weight="700" fill="#397DA4" text-anchor="middle">32</text><rect x="820" y="275" width="680" height="475" rx="16" fill="#FBFCFC" stroke="#2D7A78" stroke-width="2"/><text x="1160" y="325" font-size="21" font-weight="700" fill="#2D7A78" text-anchor="middle">GEOMETRIC</text><text x="865" y="385" font-size="17" font-weight="700" fill="#20314B" text-anchor="start">Constant ratio r</text><text x="865" y="440" font-size="23" font-weight="700" fill="#0B1F3A" text-anchor="start">uₙ = arⁿ⁻¹</text><text x="865" y="495" font-size="19" font-weight="700" fill="#0B1F3A" text-anchor="start">Sₙ = a(1−rⁿ)/(1−r), r≠1</text><text x="865" y="570" font-size="17" font-weight="600" fill="#20314B" text-anchor="start">48, 24, 12, …   a=48, r=½</text><text x="865" y="620" font-size="18" font-weight="700" fill="#2D7A78" text-anchor="start">S∞ = a/(1−r) = 96   (|r|&lt;1)</text><path d="M880 675H1420" fill="none" stroke="#2D7A78" stroke-width="5"/><text x="880" y="715" font-size="15" font-weight="700" fill="#2D7A78" text-anchor="middle">48</text><text x="1000" y="715" font-size="15" font-weight="700" fill="#2D7A78" text-anchor="middle">24</text><text x="1120" y="715" font-size="15" font-weight="700" fill="#2D7A78" text-anchor="middle">12</text><text x="1240" y="715" font-size="15" font-weight="700" fill="#2D7A78" text-anchor="middle">6</text><text x="1360" y="715" font-size="15" font-weight="700" fill="#2D7A78" text-anchor="middle">3</text><rect x="100" y="785" width="1400" height="72" rx="16" fill="#FFF4D6" stroke="#E0C76C" stroke-width="2"/><text x="130" y="832" font-size="16" font-weight="700" fill="#0B1F3A" text-anchor="start">Arithmetic adds a fixed amount; geometric multiplies by a fixed factor. The infinite sum exists only when |r| &lt; 1.</text><path d="M60 972H1540" stroke="#CCD6D7" stroke-width="2"/><text x="64" y="1015" font-size="17">Marlbridge • Mathematics study resource • check assumptions and context</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>
