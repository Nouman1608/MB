<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img"><title>Plot y = 1.5x − 3 and identify its intercepts</title><desc>Marlbridge • OxfordAQA International GCSE Mathematics 9260 • A11 (Core): plotting straight-line graphs</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#10233F">Plot y = 1.5x − 3 and identify its intercepts</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">Marlbridge • OxfordAQA International GCSE Mathematics 9260 • A11 (Core): plotting straight-line graphs</text><rect x="52" y="128" width="1000" height="660" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="1076" y="128" width="400" height="660" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="88" y="174" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">Build a straight line from a table, then read its intercepts</text><text x="88" y="211" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6D80">Core example • y = 1.5x − 3</text><line x1="244.8" y1="510" x2="1013.2" y2="510" stroke="#10233F" stroke-width="3" /><line x1="516" y1="780" x2="516" y2="330" stroke="#10233F" stroke-width="3" /><line x1="290" y1="505" x2="290" y2="515" stroke="#10233F" stroke-width="2" /><text x="290" y="534" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">-2</text><line x1="403" y1="505" x2="403" y2="515" stroke="#10233F" stroke-width="2" /><text x="403" y="534" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">-1</text><line x1="516" y1="505" x2="516" y2="515" stroke="#10233F" stroke-width="2" /><text x="516" y="534" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">0</text><line x1="629" y1="505" x2="629" y2="515" stroke="#10233F" stroke-width="2" /><text x="629" y="534" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">1</text><line x1="742" y1="505" x2="742" y2="515" stroke="#10233F" stroke-width="2" /><text x="742" y="534" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">2</text><line x1="855" y1="505" x2="855" y2="515" stroke="#10233F" stroke-width="2" /><text x="855" y="534" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">3</text><line x1="968" y1="505" x2="968" y2="515" stroke="#10233F" stroke-width="2" /><text x="968" y="534" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">4</text><line x1="261.75" y1="780" x2="996.25" y2="780" stroke="#D3DCE2" stroke-width="1" stroke-dasharray="4 6"/><text x="504" y="784" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">-6</text><line x1="261.75" y1="690" x2="996.25" y2="690" stroke="#D3DCE2" stroke-width="1" stroke-dasharray="4 6"/><text x="504" y="694" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">-4</text><line x1="261.75" y1="600" x2="996.25" y2="600" stroke="#D3DCE2" stroke-width="1" stroke-dasharray="4 6"/><text x="504" y="604" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">-2</text><line x1="261.75" y1="510" x2="996.25" y2="510" stroke="#D3DCE2" stroke-width="1" stroke-dasharray="4 6"/><text x="504" y="514" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">0</text><line x1="261.75" y1="420" x2="996.25" y2="420" stroke="#D3DCE2" stroke-width="1" stroke-dasharray="4 6"/><text x="504" y="424" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">2</text><line x1="261.75" y1="330" x2="996.25" y2="330" stroke="#D3DCE2" stroke-width="1" stroke-dasharray="4 6"/><text x="504" y="334" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">4</text><path d="M 290 780 L 968 375" fill="none" stroke="#315F86" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="290" cy="780" r="6" fill="#168C8C" stroke="#FFFFFF" stroke-width="3"/><circle cx="403" cy="712.5" r="6" fill="#168C8C" stroke="#FFFFFF" stroke-width="3"/><circle cx="516" cy="645" r="6" fill="#168C8C" stroke="#FFFFFF" stroke-width="3"/><circle cx="629" cy="577.5" r="6" fill="#168C8C" stroke="#FFFFFF" stroke-width="3"/><circle cx="742" cy="510" r="6" fill="#168C8C" stroke="#FFFFFF" stroke-width="3"/><circle cx="855" cy="442.5" r="6" fill="#168C8C" stroke="#FFFFFF" stroke-width="3"/><circle cx="968" cy="375" r="6" fill="#168C8C" stroke="#FFFFFF" stroke-width="3"/><circle cx="516" cy="645" r="9" fill="#C44949" stroke="#FFFFFF" stroke-width="3"/><circle cx="742" cy="510" r="9" fill="#C9A227" stroke="#FFFFFF" stroke-width="3"/><line x1="516" y1="645" x2="516" y2="510" stroke="#C44949" stroke-width="2" stroke-dasharray="6 6"/><line x1="516" y1="510" x2="742" y2="510" stroke="#C9A227" stroke-width="2" stroke-dasharray="6 6"/><text x="531" y="667" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#C44949">y-intercept (0, −3)</text><text x="754" y="497" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#C9A227">x-intercept (2, 0)</text><text x="542" y="738" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">x</text><text x="453" y="220" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">y</text><rect x="1102" y="164" width="348" height="149" rx="14" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="1128" y="204" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#315F86">Gradient m = 1.5 = 3/2</text><text x="1128" y="244" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">For each 1 right, rise 1.5</text><text x="1128" y="280" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">c = −3: where x=0</text><rect x="1102" y="331" width="348" height="170" rx="14" fill="#F4F1E8" stroke="#F4F1E8" stroke-width="2"/><text x="1128" y="371" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#725C8E">Check with three plotted points</text><text x="1128" y="411" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">(0, −3)  (2, 0)  (4, 3)</text><text x="1128" y="447" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">Each satisfies y = 1.5x − 3.</text><text x="1128" y="480" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">Join them with one straight line.</text><rect x="1102" y="519" width="348" height="157" rx="14" fill="#E7F3F1" stroke="#E7F3F1" stroke-width="2"/><text x="1128" y="559" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#168C8C">Parallel lines</text><text x="1128" y="599" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">Same gradient, different intercept:</text><text x="1128" y="633" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">y = 1.5x + 1 stays parallel.</text><text x="1128" y="660" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">Slope controls direction and steepness.</text><text letter-spacing="5" opacity=".075" x="764" y="849" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE STUDY RESOURCES</text><line x1="52" y1="866" x2="1476" y2="866" stroke="#C9A227" stroke-width="2" /><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
