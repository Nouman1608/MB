<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="ti de"><title id="ti">Poisson approximation to a binomial distribution</title><desc id="de">Paired probability bars for Binomial 20, 0.1 and Poisson mean 2, k from zero to six. At k=2 probabilities are about 0.2852 and 0.2707.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial,sans-serif"><text x="62" y="78" font-size="38" font-weight="700" fill="#0B1F3A" text-anchor="start">Poisson approximation to a binomial distribution</text><text x="64" y="124" font-size="21" font-weight="500" fill="#20314B" text-anchor="start">Pearson Edexcel International A Level Mathematics • Statistics</text><rect x="60" y="165" width="1480" height="755" rx="15" fill="#FFFFFF" stroke="#CCD6D7" stroke-width="2"/><text x="105" y="220" font-size="22" font-weight="700" fill="#0B1F3A" text-anchor="start">For large n and small p, use λ = np; compare probabilities to judge the approximation.</text><text x="145" y="330" font-size="18" font-weight="700" fill="#397DA4" text-anchor="start">P(X=k)</text><text x="150" y="790" font-size="18" font-weight="600" fill="#667888" text-anchor="start">k</text><rect x="166" y="646.64" width="40" height="103.36" rx="2" fill="#DCE8EF" stroke="#397DA4" stroke-width="1"/><rect x="214" y="634.995" width="40" height="115.00500000000001" rx="2" fill="#D9ECE7" stroke="#2D7A78" stroke-width="1"/><text x="210" y="785" font-size="16" font-weight="600" fill="#20314B" text-anchor="middle">0</text><rect x="346" y="520.33" width="40" height="229.67" rx="2" fill="#DCE8EF" stroke="#397DA4" stroke-width="1"/><rect x="394" y="519.905" width="40" height="230.095" rx="2" fill="#D9ECE7" stroke="#2D7A78" stroke-width="1"/><text x="390" y="785" font-size="16" font-weight="600" fill="#20314B" text-anchor="middle">1</text><rect x="526" y="507.58" width="40" height="242.42000000000002" rx="2" fill="#DCE8EF" stroke="#397DA4" stroke-width="1"/><rect