x="12" fill="#FFFFFF" stroke="#CCD6D7" stroke-width="1"/><text x="1070" y="330" font-size="18" font-weight="700" fill="#397DA4" text-anchor="start">Binomial B(20, 0.1)</text><text x="1070" y="370" font-size="18" font-weight="700" fill="#2D7A78" text-anchor="start">Poisson λ = np = 2</text><text x="190" y="850" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="start">At k = 2:  Binomial ≈ 0.2852   •   Poisson ≈ 0.2707</text><text x="190" y="895" font-size="17" font-weight="600" fill="#667888" text-anchor="start">Blue: exact binomial     Teal: Poisson approximation</text><path d="M60 972L1540 972" fill="none" stroke="#CCD6D7" stroke-width="2"/><text x="64" y="1015" font-size="17" font-weight="500" fill="#20314B" text-anchor="start">Marlbridge • Mathematics study resource • check assumptions and context</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>