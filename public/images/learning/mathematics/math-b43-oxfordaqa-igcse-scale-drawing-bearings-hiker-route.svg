 fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<path d="M550 236V667.5" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<path d="M650 236V667.5" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<path d="M750 236V667.5" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<path d="M130 250H800" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<path d="M130 350H800" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<path d="M130 450H800" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<path d="M130 550H800" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<path d="M130 650H800" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<path d="M300 524V422" fill="none" stroke="#5B6D80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />,<text x="300" y="415" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#10233F">N</text>,<circle cx="300" cy="480" r="7" fill="#10233F"/>,<text x="312" y="502" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#10233F">C • camp</text>,<path d="M639.8654201387437 365.51815184723773V263.51815184723773" fill="none" stroke="#5B6D80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />,<text x="639.8654201387437" y="256.51815184723773" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#10233F">N</text>,<circle cx="639.8654201387437" cy="321.51815184723773" r="7" fill="#10233F"/>,<text x="651.8654201387437" y="343.51815184723773" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#10233F">L • lake</text>,<path d="M780.4904201387437 609.087796661611V507.08779666161104" fill="none" stroke="#5B6D80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />,<text x="780.4904201387437" y="500.08779666161104" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#10233F">N</text>,<circle cx="780.4904201387437" cy="565.087796661611" r="7" fill="#10233F"/>,<text x="792.4904201387437" y="587.087796661611" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#10233F">H • hut</text>,<path d="M300 480L639.8654201387437 321.51815184723773" fill="none" stroke="#315F86" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />,<path d="M639.8654201387437 321.51815184723773L780.4904201387437 565.087796661611" fill="none" stroke="#168C8C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />,<path d="M780.4904201387437 565.087796661611L300 480" fill="none" stroke="#D88329" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6"/>,<path d="M300 402A78 78 0 0 1 370.6920073888587 447.03577558422546" fill="none" stroke="#C9A227" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />,<path d="M639.8654201387437 259.51815184723773A62 62 0 0 1 670.8654201387437 375.21172688187295" fill="none" stroke="#725C8E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />,<text x="342" y="392" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#C9A227">065°</text>,<text x="687.8654201387437" y="279.51815184723773" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#725C8E">150°</text>,<text x="463.93271006937186" y="385.75907592361887" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#315F86">6 km • 4 cm</text>,<text x="720.1779201387437" y="461.3029742544244" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#168C8C">4.5 km • 3 cm</text>,<text x="532.2452100693719" y="542.5438983308055" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#D88329">CH ≈ 7.8 km</text>,<rect x="928" y="178" width="494" height="430" rx="14" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/>,<text x="1175" y="219" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">READ THE BEARING AT H</text>,<text x="1175" y="267" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#20314B">Stand at H; face north.</text>,<text x="1175" y="303" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#20314B">Turn clockwise to face C.</text>,<text x="1175" y="351" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">Bearing of C from H</text>,<text x="1175" y="386" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#D88329">≈ 280°</text>,<path d="M1000 414H1350" fill="none" stroke="#C9A227" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />,<text x="1175" y="454" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#315F86">Measured CH ≈ 5.2 cm</text>,<text x="1175" y="490" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#168C8C">× 1.5 km/cm ≈ 7.8 km</text>,<text x="1175" y="548" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#5B6D80">Check: 7.81 km and 280.0°</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="sta