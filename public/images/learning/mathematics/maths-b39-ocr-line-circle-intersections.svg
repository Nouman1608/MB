<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">When do lines and circles intersect?</title><desc id="desc">For y equals x plus k and x squared plus y squared equals 18, the discriminant is 144 minus 4k squared. Two intersections occur for negative six less than k less than six, tangency at k plus or minus six, and no intersection outside. Two-circle conditions compare centre distance with sum and difference of radii.</desc>
<defs><style>.bg{fill:#F3F6F6}.panel{fill:#fff;stroke:#d2dce1;stroke-width:3}.h1{font:700 40px Arial;fill:#10233f}.h2{font:700 25px Arial;fill:#10233f}.body{font:21px Arial;fill:#243d57}.small{font:18px Arial;fill:#526a80}.eq{font:700 22px Arial;fill:#16807f}.grid{stroke:#e2e8eb;stroke-width:1}.axis{stroke:#526a80;stroke-width:2}.circle{fill:#deeff1;fill-opacity:.55;stroke:#317b91;stroke-width:4}.line{stroke:#c59b20;stroke-width:4}.line2{stroke:#d06b62;stroke-width:3;stroke-dasharray:10 7}.dot{fill:#193b5a}.gold{fill:#fff7dc;stroke:#c89d1c;stroke-width:2}</style><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#16807f"/></marker></defs>
<rect class="bg" width="1600" height="1000"/><text x="54" y="60" class="h1">Circle intersections: algebra tells the geometry</text><text x="56" y="98" class="small">OCR A Level Mathematics A • circle properties and intersections</text>
<rect x="48" y="132" width="900" height="690" rx="18" class="panel"/><text x="80" y="180" class="h2">1  Substitute the line into the circle</text><text x="80" y="218" class="body">Circle: x² + y² = 18   •   line family: y = x + k</text>
<!-- graph axes --> <path class="grid" d="M160 300H820M160 380H820M160 460H820M160 540H820M160 620H820M240 270V670M320 270V670M400 270V670M480 270V670M560 270V670M640 270V670M720 270V670M800 270V670"/><path class="axis" d="M160 500H830M490 670V270"/><circle cx="490" cy="500" r="169" class="circle"/>
<path class="line" d="M321 669L659 331"/><circle cx="370" cy="620" r="7" class="dot"/><circle cx="610" cy="380" r="7" class="dot"/><text x="620" y="350" class="small">k = 0: two points</text>
<text x="80" y="712" class="eq">2x² + 2kx + k² − 18 = 0</text><text x="80" y="746" class="body">Δ = 144 − 4k²</text><text x="80" y="782" class="small">Δ &gt; 0: two intersections • Δ = 0: tangent • Δ &lt; 0: none</text>
<rect x="990" y="132" width="562" height="324" rx="18" class="panel"/><text x="1022" y="180" class="h2">For y = x + k</text><rect x="1022" y="202" width="495" height="70" rx="12" class="gold"/><text x="1046" y="245" class="eq">2 points when −6 &lt; k &lt; 6</text><text x="1022" y="310" class="body">Tangent when k = ±6</text><text x="1022" y="350" class="body">No intersection when |k| &gt; 6</text><text x="1022" y="412" class="small">At k=0, the points are (−3,−3) and (3,3).</text>
<rect x="990" y="484" width="562" height="338" rx="18" class="panel"/><text x="1022" y="532" class="h2">2  Compare two circle radii</text><text x="1022" y="572" class="body">Centres (0,0) and (6,2); radii 4 and 3</text><text x="1022" y="606" class="small">d = √40 ≈ 6.32</text><circle cx="1175" cy="690" r="76" fill="#dfeef0" fill-opacity=".5" stroke="#317b91" stroke-width="4"/><circle cx="1289" cy="652" r="57" fill="#f7eac1" fill-opacity=".6" stroke="#c59b20" stroke-width="4"/><path d="M1175 690L1289 652" stroke="#526a80" stroke-width="2"/><text x="1022" y="785" class="eq">|4−3| &lt; d &lt; 4+3 → two crossings</text>
<text x="56" y="880" class="small">General rule: two points if |r₁−r₂| &lt; d &lt; r₁+r₂; equality means tangency; outside this interval they do not meet.</text><text x="56" y="930" class="small">MARLBRIDGE • MATHS • schematic geometry, not to scale</text><text x="800" y="980" text-anchor="middle" style="font:700 22px Georgia;letter-spacing:9px;fill:#dce4e6">MARLBRIDGE STUDY RESOURCES</text><text x="1370" y="930" style="font:700 23px Georgia;fill:#10233f">M<tspan fill="#c9a227">B</tspan> MARLBRIDGE</text><path d="M55 948H1545" stroke="#c9a227" stroke-width="3"/></svg>
