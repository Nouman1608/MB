<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">Vectors: combine components and follow the triangle rule</title><desc id="desc">Vectors a=(4,-3) and b=(-2,5) are placed head-to-tail. The resultant is (2,2); subtraction and scaling results are also shown.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial,sans-serif"><text x="62.0" y="78.0" font-size="38" font-weight="700" fill="#0B1F3A" text-anchor="start">Vectors: combine components and follow the triangle rule</text><text x="64.0" y="124.0" font-size="21" font-weight="500" fill="#20314B" text-anchor="start">Cambridge O Level Mathematics 4024 • Vectors in two dimensions</text><rect x="60" y="165" width="1480" height="755" rx="18" fill="#FFFFFF" stroke="#CCD6D7" stroke-width="2"/><text x="100.0" y="220.0" font-size="21" font-weight="700" fill="#0B1F3A" text-anchor="start">Place b at the head of a; the resultant a + b runs from the first tail to the last head.</text><path d="M145.0 285.0L145.0 790.0" fill="none" stroke="#E6ECEC" stroke-width="1"/><text x="145.0" y="584.5" font-size="14" font-weight="500" fill="#667888" text-anchor="middle">-4</text><path d="M215.0 285.0L215.0 790.0" fill="none" stroke="#E6ECEC" stroke-width="1"/><text x="215.0" y="584.5" font-size="14" font-weight="500" fill="#667888" text-anchor="middle">-3</text><path d="M285.0 285.0L285.0 790.0" fill="none" stroke="#E6ECEC" stroke-width="1"/><text x="285.0" y="584.5" font-size="14" font-weight="500" fill="#667888" text-anchor="middle">-2</text><path d="M355.0 285.0L355.0 790.0" fill="none" stroke="#E6ECEC" stroke-width="1"/><text x="355.0" y="584.5" font-size="14" font-weight="500" fill="#667888" text-anchor="middle">-1</text><path d="M425.0 285.0L425.0 790.0" fill="none" stroke="#E6ECEC" stroke-width="1"/><text x="425.0" y="584.5" font-size="14" font-weight="500" fill="#667888" text-anchor="middle">0</text><path d="M495.0 285.0L495.0 790.0" fill="none" stroke="#E6ECEC" stroke-width="1"/><text x="495.0" y="584.5" font-size="14" font-weight="500" fill="#667888" text-anchor="middle">1</text><path d="M565.0 285.0L565.0 790.0" fill="none" stroke="#E6ECEC" stroke-width="1"/><text x="565.0" y="584.5" font-size="14" font-weight="500" fill="#667888" text-anchor="middle">2</text><path d="M635.0 285.0L635.0 790.0" fill="none" stroke="#E6ECEC" stroke-width="1"/><text x="635.0" y="584.5" font-size="14" font-weight="500" fill="#667888" text-anchor="middle">3</text><path d="M705.0 285.0L705.0 790.0" fill="none" stroke="#E6ECEC" stroke-width="1"/><text x="705.0" y="584.5" font-size="14" font-weight="500" fill="#667888" text-anchor="middle">4</text><path d="M775.0 285.0L775.0 790.0" fill="none" stroke="#E6ECEC" stroke-width="1"/><text x="775.0" y="584.5" font-size="14" font-weight="500" fill="#667888" text-anchor="middle">5</text><path d="M845.0 285.0L845.0 790.0" fill="none" stroke="#E6ECEC" stroke-width="1"/><text x="845.0" y="584.5" font-size="14" font-weight="500" fill="#667888" text-anchor="middle">6</text><path d="M145.0 790.0L845.0 790.0" fill="none" stroke="#E6ECEC" stroke-width="1"/><text x="413.0" y="795.0" font-size="14" font-weight="500" fill="#667888" text-anchor="end">-5</text><path d="M145.0 744.1L845.0 744.1" fill="none" stroke="#E6ECEC" stroke-width="1"/><text x="413.0" y="749.1" font-size="14" font-weight="500" fill="#667888" text-anchor="end">-4</text><path d="M145.0 698.2L845.0 698.2" fill="none" stroke="#E6ECEC" stroke-width="1"/><text x="413.0" y="703.2" font-size="14" font-weight="500" fill="#667888" text-anchor="end">-3</text><path d="M145.0 652.3L845.0 652.3" fill="none" stroke="#E6ECEC" stroke-width="1"/><text x="413.0" y="657.3" font-size="14" font-weight="500" fill="#667888" text-anchor="end">-2</text><path d="M145.0 606.4L845.0 606.4" fill="none" stroke="#E6ECEC" stroke-width="1"/><text x="413.0" y="611.4" font-size="14" font-weight="500" fill="#667888" text-anchor="end">-1</text><path d="M145.0 560.5L845.0 560.5" fill="none" stroke="#E6ECEC" stroke-width="1"/><text x="413.0" y="565.5" font-size="14" font-weight="500" fill="#667888" text-anchor="end">0</text><path d="M145.0 514.5L845.0 514.5" fill="none" stroke="#E6ECEC" stroke-width="1"/><text x="413.0" y="519.5" font-size="14" font-weight="500" fill="#667888" text-anchor="end">1</text><path d="M145.0 468.6L845.0 468.6" fill="none" stroke="#E6ECEC" stroke-width="1"/><text x="413.0" y="473.6" font-size="14" font-weight="500" fill="#667888" text-anchor="end">2</text><path d="M145.0 422.7L845.0 422.7" fill="none" stroke="#E6ECEC" stroke-width="1"/><text x="413.0" y="427.7" font-size="14" font-weight="500" fill="#667888" text-anchor="end">3</text><path d="M145.0 376.8L845.0 376.8" fill="none" stroke="#E6ECEC" stroke-width="1"/><text x="413.0" y="381.8" font-size="14" font-weight="500" fill="#667888" text-anchor="end">4</text><path d="M145.0 330.9L845.0 330.9" fill="none" stroke="#E6ECEC" stroke-width="1"/><text x="413.0" y="335.9" font-size="14" font-weight="500" fill="#667888" text-anchor="end">5</text><path d="M145.0 285.0L845.0 285.0" fill="none" stroke="#E6ECEC" stroke-width="1"/><text x="413.0" y="290.0" font-size="14" font-weight="500" fill="#667888" text-anchor="end">6</text><path d="M425.0 285.0L425.0 790.0" fill="none" stroke="#0B1F3A" stroke-width="2"/><path d="M145.0 560.5L845.0 560.5" fill="none" stroke="#0B1F3A" stroke-width="2"/><path d="M425.0 560.5L705.0 698.2" fill="none" stroke="#397DA4" stroke-width="6"/><polygon points="705.0,698.2 692.0,699.0 697.8,687.4" fill="#397DA4" stroke="#397DA4" stroke-width="1"/><path d="M705.0 698.2L565.0 468.6" fill="none" stroke="#2D7A78" stroke-width="6"/><polygon points="565.0,468.6 576.4,474.9 565.3,481.6" fill="#2D7A78" stroke="#2D7A78" stroke-width="1"/><path d="M425.0 560.5L565.0 468.6" fill="none" stroke="#C9A227" stroke-width="5" stroke-dasharray="8 5"/><polygon points="565.0,468.6 559.2,480.2 552.0,469.4" fill="#C9A227" stroke="#C9A227" stroke-width="1"/><circle cx="425.0" cy="560.5" r="7" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="1"/><text x="435.0" y="548.5" font-size="17" font-weight="700" fill="#0B1F3A" text-anchor="start">O</text><circle cx="705.0" cy="698.2" r="7" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="1"/><text x="715.0" y="686.2" font-size="17" font-weight="700" fill="#0B1F3A" text-anchor="start">A</text><circle cx="565.0" cy="468.6" r="7" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="1"/><text x="575.0" y="456.6" font-size="17" font-weight="700" fill="#0B1F3A" text-anchor="start">C</text><text x="390.0" y="780.0" font-size="18" font-weight="700" fill="#397DA4" text-anchor="start">a = (4, −3)</text><text x="610.0" y="640.0" font-size="18" font-weight="700" fill="#2D7A78" text-anchor="start">b = (−2, 5)</text><text x="260.0" y="495.0" font-size="20" font-weight="700" fill="#C9A227" text-anchor="start">a + b = (2, 2)</text><rect x="920" y="285" width="520" height="505" rx="16" fill="#F5F8FB" stroke="#397DA4" stroke-width="2"/><text x="960.0" y="340.0" font-size="18" font-weight="700" fill="#397DA4" text-anchor="start">COMPONENT-WISE RESULTS</text><text x="970.0" y="405.0" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="start">a = (4, −3),  b = (−2, 5)</text><path d="M960.0 432.0L1400.0 432.0" fill="none" stroke="#CCD6D7" stroke-width="2"/><text x="970.0" y="485.0" font-size="23" font-weight="700" fill="#2D7A78" text-anchor="start">a + b = (2, 2)</text><text x="970.0" y="545.0" font-size="22" font-weight="600" fill="#20314B" text-anchor="start">a − b = (6, −8)</text><text x="970.0" y="605.0" font-size="22" font-weight="600" fill="#20314B" text-anchor="start">3a − 2b = (16, −19)</text><path d="M960.0 650.0L1400.0 650.0" fill="none" stroke="#CCD6D7" stroke-width="2"/><text x="970.0" y="702.0" font-size="18" font-weight="700" fill="#0B1F3A" text-anchor="start">Subtracting a negative adds:</text><text x="970.0" y="742.0" font-size="20" font-weight="700" fill="#2D7A78" text-anchor="start">12 − (−4) = 16</text><rect x="120" y="835" width="1330" height="54" rx="14" fill="#FFF4D6" stroke="#E0C76C" stroke-width="2"/><text x="155.0" y="870.0" font-size="18" font-weight="700" fill="#0B1F3A" text-anchor="start">Triangle rule: AB + BC = AC. Keep each arrow’s direction and place vectors head-to-tail.</text><path d="M60.0 972.0L1540.0 972.0" fill="none" stroke="#CCD6D7" stroke-width="2"/><text x="64.0" y="1015.0" font-size="17" font-weight="500" fill="#20314B" text-anchor="start">Marlbridge • Mathematics study resource • check assumptions and context</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>