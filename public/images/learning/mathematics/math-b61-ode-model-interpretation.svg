<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img"><title>Interpret a differential-equation model: value, limit, rate, domain</title><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#10233F">Interpret a differential-equation model: value, limit, rate, domain</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">Marlbridge • OCR A Level Mathematics A H240 • Differential equations: separable equations and their interpretation</text><rect x="52" y="128" width="1424" height="670" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="84" y="178" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">Boat speed satisfies dv/dt = 6 − 2v with v(0)=0; solution v = 3 − 3e^(−2t).</text><rect x="90" y="220" width="820" height="430" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="500" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#315F86">Speed approaches a limiting value</text><path d="M160 550L830 550" fill="none" stroke="#10233F" stroke-width="2" stroke-linecap="round"/><path d="M160 320L160 550" fill="none" stroke="#10233F" stroke-width="2" stroke-linecap="round"/><path d="M160 347.05882352941177L830 347.05882352941177" fill="none" stroke="#C9A227" stroke-width="2" stroke-linecap="round"/><path d="M160.0 550.0L165.6 530.7L171.2 513.2L176.8 497.4L182.3 483.1L187.9 470.1L193.5 458.4L199.1 447.8L204.7 438.2L210.2 429.6L215.8 421.7L221.4 414.6L227.0 408.2L232.6 402.4L238.2 397.1L243.8 392.3L249.3 388.0L254.9 384.1L260.5 380.6L266.1 377.4L271.7 374.5L277.2 371.9L282.8 369.5L288.4 367.4L294.0 365.5L299.6 363.7L305.2 362.1L310.8 360.7L316.3 359.4L321.9 358.2L327.5 357.2L333.1 356.2L338.7 355.3L344.2 354.5L349.8 353.8L355.4 353.2L3