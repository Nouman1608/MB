ll="#C9A227">limit v=3 m/s</text><circle cx="160.0" cy="550.0" r="7" fill="#315F86"/><text x="172.0" y="538.0" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#315F86">starts from rest</text><text x="500" y="610" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#10233F">Time, t (s)</text><text x="160" y="300" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#10233F">Speed v (m s⁻¹)</text><rect x="940" y="220" width="480" height="430" rx="14" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="1180" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233F">Interpret in context</text><text x="985" y="325" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#315F86">Initial value</text><text x="985" y="355" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#20314B">v(0)=0: boat starts at rest.</text><path d="M985 380L1375 380" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round"/><text x="985" y="425" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#168C8C">Long-term behaviour</text><text x="985" y="455" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#20314B">e^(−2t) → 0, so v → 3 m/s.</text><path d="M985 480L1375 480" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round"/><text x="985" y="525" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#725C8E">Rate and assumptions</text><text x="985" y="555" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">dv/dt = 6−2v → 0 near 3.</text><text x="985" y="585" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#315F86">Domain here: t ≥ 0.</text><text x="985" y="612" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#C44949">Assume conditions stay constant.</text><text x="760" y="710" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6D80">Describe what the equation predicts, check the allowed time domain, and state an assumption.</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
