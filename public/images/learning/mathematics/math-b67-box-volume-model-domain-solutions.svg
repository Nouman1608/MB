8 415.2 L726.0 421.3 L731.2 427.8 L736.5 434.5 L741.7 441.5 L747.0 448.9 L752.2 456.6 L757.5 464.7 L762.7 473.1 L768.0 481.8 L773.2 490.9 L778.4 500.4 L783.7 510.2 L788.9 520.4 L794.2 530.9 L799.4 541.8 L804.7 553.1" fill="none" stroke="#168C8C" stroke-width="4"/><path d="M170.0 457.57142857142856L810.0 457.57142857142856" fill="none" stroke="#C9A227" stroke-width="2" stroke-linecap="round"/><circle cx="383.3333333333333" cy="457.57142857142856" r="7" fill="#C44949"/><text x="383.3333333333333" y="444.57142857142856" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#C44949">x=4</text><circle cx="752.8375056146938" cy="457.57142857142856" r="7" fill="#C44949"/><text x="752.8375056146938" y="444.57142857142856" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#C44949">x=10.93</text><text x="500" y="620" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#10233F">Base side x (cm)</text><text x="150" y="300" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#10233F">V (cm³)</text><rect x="925" y="220" width="500" height="440" rx="14" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="1175" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">Model and domain</text><text x="970" y="325" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#315F86">V = x²(12−x)</text><text x="970" y="365" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#20314B">Physical domain: 0 &lt; x &lt; 12</text><path d="M970 395L1380 395" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round"/><text x="970" y="445" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6D80">V=128 gives:</text><text x="970" y="485" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#168C8C">(x−4)(x²−8x−32)=0</text><text x="970" y="530" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">x=4, 4±4√3</text><text x="1175" y="585" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#C44949">Reject −2.93 cm; keep 4 and 10.93.</text><text x="1175" y="620" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#725C8E">Two valid box designs.</text><text x="760" y="710" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#5B6D80">At x=4, height is 8 cm. At x≈10.93, height is about 1.07 cm; both give volume 128 cm³.</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
