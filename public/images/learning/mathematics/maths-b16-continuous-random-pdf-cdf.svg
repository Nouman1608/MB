<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">Continuous random variables: pdf and cdf</title><desc id="desc">Piecewise density rises from zero to one-third by x=2, then remains constant to x=4. Its cumulative distribution reaches one at x=4; P(1&lt;X&lt;3)=7/12.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial,sans-serif"><text x="62.0" y="78.0" font-size="38" font-weight="700" fill="#0B1F3A" text-anchor="start">Continuous random variables: pdf and cdf</text><text x="64.0" y="124.0" font-size="21" font-weight="500" fill="#20314B" text-anchor="start">Pearson Edexcel International A Level Mathematics • Statistics</text><rect x="60" y="165" width="1480" height="755" rx="18" fill="#FFFFFF" stroke="#CCD6D7" stroke-width="2"/><text x="100.0" y="215.0" font-size="21" font-weight="700" fill="#0B1F3A" text-anchor="start">A pdf’s total area is 1. The cdf accumulates that area from the left.</text><path d="M160.0 285.0L160.0 530.0" fill="none" stroke="#E6ECEC" stroke-width="1"/><text x="160.0" y="554.0" font-size="14" font-weight="500" fill="#667888" text-anchor="middle">0</text><path d="M335.0 285.0L335.0 530.0" fill="none" stroke="#E6ECEC" stroke-width="1"/><text x="335.0" y="554.0" font-size="14" font-weight="500" fill="#667888" text-anchor="middle">1</text><path d="M510.0 285.0L510.0 530.0" fill="none" stroke="#E6ECEC" stroke-width="1"/><text x="510.0" y="554.0" font-size="14" font-weight="500" fill="#667888" text-anchor="middle">2</text><path d="M685.0 285.0L685.0 530.0" fill="none" stroke="#E6ECEC" stroke-width="1"/><text x="685.0" y="554.0" font-size="14" font-weight="500" fill="#667888" text-anchor="middle">3</text><path d="M860.0 285.0L860.0 530.0" fill="none" stroke="#E6ECEC" stroke-width="1"/><text x="860.0" y="554.0" font-size="14" font-weight="500" fill="#667888" text-anchor="middle">4</text><path d="M160.0 530.0L860.0 530.0" fill="none" stroke="#E6ECEC" stroke-width="1"/><text x="148.0" y="535.0" font-size="14" font-weight="500" fill="#667888" text-anchor="end">0</text><path d="M160.0 285.0L160.0 530.0" fill="none" stroke="#0B1F3A" stroke-width="2"/><path d="M160.0 530.0L860.0 530.0" fill="none" stroke="#0B1F3A" stroke-width="2"/><path d="M 160.0 530.0 L 510.0 348.51851851851853 L 860.0 348.51851851851853" fill="none" stroke="#397DA4" stroke-width="5"/><path d="M 335.0 530.0 L 335.0 439.25925925925924 L 510.0 348.51851851851853 L 685.0 348.51851851851853 L 685.0 530.0 Z" fill="#F7EBC7" stroke="#D3A72D" stroke-width="0"/><path d="M 160.0 530.0 L 510.0 348.51851851851853 L 860.0 348.51851851851853" fill="none" stroke="#397DA4" stroke-width="5"/><text x="175.0" y="270.0" font-size="17" font-weight="700" fill="#397DA4" text-anchor="start">pdf  f(x)</text><text x="470.0" y="315.0" font-size="17" font-weight="700" fill="#397DA4" text-anchor="start">x/6</text><text x="610.0" y="335.0" font-size="17" font-weight="700" fill="#397DA4" text-anchor="start">1/3</text><path d="M160.0 615.0L160.0 835.0" fill="none" stroke="#E6ECEC" stroke-width="1"/><text x="160.0" y="859.0" font-size="14" font-weight="500" fill="#667888" text-anchor="middle">0</text><path d="M335.0 615.0L335.0 835.0" fill="none" stroke="#E6ECEC" stroke-width="1"/><text x="335.0" y="859.0" font-size="14" font-weight="500" fill="#667888" text-anchor="middle">1</text><path d="M510.0 615.0L510.0 835.0" fill="none" stroke="#E6ECEC" stroke-width="1"/><text x="510.0" y="859.0" font-size="14" font-weight="500" fill="#667888" text-anchor="middle">2</text><path d="M685.0 615.0L685.0 835.0" fill="none" stroke="#E6ECEC" stroke-width="1"/><text x="685.0" y="859.0" font-size="14" font-weight="500" fill="#667888" text-anchor="middle">3</text><path d="M860.0 615.0L860.0 835.0" fill="none" stroke="#E6ECEC" stroke-width="1"/><text x="860.0" y="859.0" font-size="14" font-weight="500" fill="#667888" text-anchor="middle">4</text><path d="M160.0 835.0L860.0 835.0