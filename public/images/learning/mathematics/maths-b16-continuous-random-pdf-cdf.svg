ke-width="2"/><text x="960.0" y="340.0" font-size="18" font-weight="700" fill="#397DA4" text-anchor="start">PIECEWISE PDF</text><text x="970.0" y="398.0" font-size="19" font-weight="600" fill="#0B1F3A" text-anchor="start">f(x) = x/6     0 ≤ x &lt; 2</text><text x="970.0" y="438.0" font-size="19" font-weight="600" fill="#0B1F3A" text-anchor="start">f(x) = 1/3     2 ≤ x ≤ 4</text><text x="970.0" y="478.0" font-size="19" font-weight="600" fill="#0B1F3A" text-anchor="start">f(x) = 0       otherwise</text><path d="M960.0 505.0L1400.0 505.0" fill="none" stroke="#CCD6D7" stroke-width="2"/><text x="970.0" y="550.0" font-size="18" font-weight="700" fill="#0B1F3A" text-anchor="start">CDF adds the earlier area:</text><text x="970.0" y="590.0" font-size="17" font-weight="600" fill="#20314B" text-anchor="start">F(x) = x²/12       0 ≤ x &lt; 2</text><text x="970.0" y="628.0" font-size="17" font-weight="600" fill="#20314B" text-anchor="start">F(x) = (x−1)/3     2 ≤ x ≤ 4</text><path d="M960.0 658.0L1400.0 658.0" fill="none" stroke="#CCD6D7" stroke-width="2"/><text x="970.0" y="705.0" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="start">P(1 &lt; X &lt; 3)</text><text x="970.0" y="750.0" font-size="22" font-weight="700" fill="#2D7A78" text-anchor="start">= F(3) − F(1) = 7/12</text><text x="970.0" y="790.0" font-size="17" font-weight="600" fill="#397DA4" text-anchor="start">Total pdf area = 1</text><path d="M60.0 972.0L1540.0 972.0" fill="none" stroke="#CCD6D7" stroke-width="2"/><text x="64.0" y="1015.0" font-size="17" font-weight="500" fill="#20314B" text-anchor="start">Marlbridge • Mathematics study resource • check assumptions and context</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>