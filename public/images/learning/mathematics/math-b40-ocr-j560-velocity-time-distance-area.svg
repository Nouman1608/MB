<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="ti de"><title id="ti">Velocity–time graph: gradients and distance from area</title><desc id="de">Piecewise train velocity-time graph with acceleration labels and shaded area equal to 637.5 metres.</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#10233F">Velocity–time graph: gradients and distance from area</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#5B6D80">Marlbridge • OCR GCSE Mathematics J560 • Interpreting graphs (7.04b–7.04c)</text><rect x="52" y="128" width="1424" height="560" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/>,<path d="M128 184V664H1178" fill="none" stroke="#20314B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />,<text x="653" y="706" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#20314B">Time (s)</text>,<text x="82" y="424" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#20314B">Velocity (m/s)</text>,<path d="M128 184V664" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<text x="128" y="688" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">0</text>,<path d="M318.9090909090909 184V664" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<text x="318.9090909090909" y="688" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">10</text>,<path d="M509.8181818181818 184V664" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<text x="509.8181818181818" y="688" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">20</text>,<path d="M700.7272727272726 184V664" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<text x="700.7272727272726" y="688" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">30</text>,<path d="M891.6363636363636 184V664" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<text x="891.6363636363636" y="688" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">40</text>,<path d="M1082.5454545454545 184V664" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<text x="1082.5454545454545" y="688" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">50</text>,<path d="M128 664H1178" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<text x="112" y="669" text-anchor="end" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">0</text>,<path d="M128 530.6666666666666H1178" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<text x="112" y="535.6666666666666" text-anchor="end" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">5</text>,<path d="M128 397.3333333333333H1178" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<text x="112" y="402.3333333333333" text-anchor="end" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">10</text>,<path d="M128 264H1178" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<text x="112" y="269" text-anchor="end" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">15</text>,<path d="M128,664L318.9090909090909,264L891.6363636363636,264L1178,664Z" fill="#168C8C22" stroke="#168C8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />,<path d="M128,664L318.9090909090909,264L891.6363636363636,264L1178,664" fill="none" stroke="#168C8C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />,<circle cx="128" cy="664" r="7" fill="#C44949"/>,<text x="136" y="652" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#10233F">(0, 0)</text>,<circle cx="318.9090909090909" cy="264" r="7" fill="#C44949"/>,<text x="326.9090909090909" y="252" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#10233F">(10, 15)</text>,<circle cx="891.6363636363636" cy="264" r="7" fill="#C44949"/>,<text x="899.6363636363636" y="252" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#10233F">(40, 15)</text>,<circle cx="1178" cy="664" r="7" fill="#C44949"/>,<text x="1168" y="652" text-anchor="end" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#10233F">(55, 0)</text>,<text x="223.45454545454544" y="477.33333333333337" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#725C8E">a = 1.5 m/s²</text>,<text x="605.2727272727273" y="246" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#315F86">constant v = 15 m/s</text>,<text x="1034.8181818181818" y="450.6666666666667" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#725C8E">a = −1 m/s²</text>,<rect x="1210" y="178" width="235" height="498" rx="14" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/>,<text x="1327" y="218" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">DISTANCE</text>,<text x="1327" y="255" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#20314B">Area under a</text>,<text x="1327" y="280" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#20314B">velocity–time graph</text>,<text x="1327" y="326" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#315F86">= trapezium</text>,<text x="1327" y="374" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#20314B">½ × (30 + 55) × 15</text>,<path d="M1250 402H1404" fill="none" stroke="#C9A227" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />,<text x="1327" y="448" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#168C8C">= 637.5 m</text>,<text x="1327" y="494" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#5B6D80">Same area by parts:</text>,<text x="1327" y="525" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#20314B">75 + 450 + 112.5</text>,<text x="1327" y="553" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#20314B">= 637.5 m</text>,<text x="1327" y="612" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#C44949">Area units: (m/s) × s = m</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE  •  STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
