h="2"/><circle cx="220.0" cy="445.0" r="6" fill="#C44949"/><text x="220.0" y="467.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#C44949">x=-1</text><circle cx="820.0" cy="358.75" r="6" fill="#C44949"/><text x="820.0" y="380.75" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#C44949">x=2</text><rect x="890" y="220" width="535" height="440" rx="14" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="1157" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">Solve • test • integrate</text><text x="935" y="325" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#315F86">Intersections: 2x²−2x−4=0</text><text x="935" y="360" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#168C8C">x=−1, 2</text><path d="M935 385L1380 385" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round"/><text x="935" y="430" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">At x=0: line 4 &gt; parabola 0</text><text x="935" y="478" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">A = ∫₋₁² [(x+4)−(2x²−x)] dx</text><text x="935" y="515" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#315F86">= [−2x³/3 + x² + 4x]₋₁²</text><text x="1157" y="570" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#168C8C">A = 9 square units</text><text x="1157" y="615" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#5B6D80">Check: upper − lower stays positive.</text><text x="760" y="710" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6D80">If the curves cross inside the interval, split the integral and reverse the subtraction after each crossing.</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
