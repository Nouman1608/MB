<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img"><title>Area between curves: choose top minus bottom</title><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#10233F">Area between curves: choose top minus bottom</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">Marlbridge • OCR A Level Mathematics A H240 • Integration • area between two curves</text><rect x="52" y="128" width="1424" height="670" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="84" y="178" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233F">Area is the integral of upper minus lower; first find where the curves meet.</text><rect x="85" y="220" width="755" height="440" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="462" y="258" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#315F86">Worked example: y = x + 4 and y = 2x² − x</text><path d="M220.0 445.0L820.0 358.75" fill="none" stroke="#315F86" stroke-width="4" stroke-linecap="round"/><text x="810.0" y="346.75" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#315F86">line</text><path d="M220.0 445.0 L227.5 450.3 L235.0 455.5 L242.5 460.4 L250.0 465.3 L257.5 469.9 L265.0 474.4 L272.5 478.8 L280.0 482.9 L287.5 487.0 L295.0 490.8 L302.5 494.5 L310.0 498.0 L317.5 501.4 L325.0 504.6 L332.5 507.7 L340.0 510.6 L347.5 513.3 L355.0 515.8 L362.5 518.2 L370.0 520.5 L377.5 522.5 L385.0 524.5 L392.5 526.2 L400.0 527.8 L407.5 529.2 L415.0 530.5 L422.5 531.6 L430.0 532.5 L437.5 533.3 L445.0 533.9 L452.5 534.4 L460.0 534.7 L467.5 534.8 L475.0 534.8 L482.5 534.6 L490.0 534.3 L497.5 533.8 L505.0 533.1 L512.5 532.2 L520.0 531.2 L527.5 530.1 L535.0 528.8 L542.5 527.3 L550.0 5