<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img"><title>Visualise why the third component identifies skew lines</title><desc>Marlbridge • OxfordAQA International Mathematics • Intersection, parallel and skew lines</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#10233F">Visualise why the third component identifies skew lines</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">Marlbridge • OxfordAQA International Mathematics • Intersection, parallel and skew lines</text><rect x="52" y="128" width="1000" height="660" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="1076" y="128" width="400" height="660" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="88" y="174" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">In 3D, matching two coordinates is not enough</text><text x="88" y="211" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6D80">Worked example 9 • test the third component</text><path d="M 274.0 730.0 L 279.2 723.7 L 284.4 717.4 L 289.6 711.1 L 294.8 704.8 L 300.0 698.5 L 305.2 692.2 L 310.4 685.9 L 315.6 679.6 L 320.8 673.3 L 326.0 667.0 L 331.2 660.7 L 336.4 654.4 L 341.6 648.1 L 346.8 641.8 L 352.0 635.5 L 357.2 629.2 L 362.4 622.9 L 367.6 616.6 L 372.8 610.3 L 378.0 604.0 L 383.2 597.7 L 388.4 591.4 L 393.6 585.1 L 398.8 578.8 L 404.0 572.5 L 409.2 566.2 L 414.4 559.9 L 419.6 553.6 L 424.8 547.3 L 430.0 541.0 L 435.2 534.7 L 440.4 528.4 L 445.6 522.1 L 450.8 515.8 L 456.0 509.5" fill="none" stroke="#C44949" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M 378.0 250.0 L 372.8 262.9 L 367.6 275.8 L 362.4 288.7 L 357.2 301.6 L 352.0 314.5 L 346.8 327.4 L 341.6 340.3 L 336.4 353.2 L 331.2 366.1 L 326.0 379.0 L 320.8 391.9 L 315.6 404.8 L 310.4 417.7 L 305.2 430.6 L 300.0 443.5 L 294.8 456.4 L 289.6 469.3 L 284.4 482.2 L 279.2 495.1 L 274.0 508.0 L 268.8 520.9 L 263.6 533.8 L 258.4 546.7 L 253.2 559.6 L 248.0 572.5 L 242.8 585.4 L 237.6 598.3 L 232.4 611.2 L 227.2 624.1 L 222.0 637.0 L 216.8 649.9 L 211.6 662.8 L 206.4 675.7 L 201.2 688.6 L 196.0 701.5" fill="none" stroke="#168C8C" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><line x1="430" y1="475" x2="586" y2="556" stroke="#10233F" stroke-width="2" /><line x1="430" y1="475" x2="274" y2="556" stroke="#10233F" stroke-width="2" /><line x1="430" y1="475" x2="430" y2="283" stroke="#10233F" stroke-width="2" /><text x="594" y="568" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">x</text><text x="262" y="570" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">y</text><text x="438" y="279" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">z</text><circle cx="326" cy="667" r="9" fill="#C44949" stroke="#FFFFFF" stroke-width="3"/><circle cx="326" cy="379" r="9" fill="#168C8C" stroke="#FFFFFF" stroke-width="3"/><line x1="326" y1="667" x2="326" y2="379" stroke="#725C8E" stroke-width="3" stroke-dasharray="6 5"/><text x="311" y="691" text-anchor="end" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#C44949">l₁: (−1, 1, −4)</text><text x="311" y="367" text-anchor="end" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#168C8C">l₃: (−1, 1, 2)</text><text x="520" y="748" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#5B6D80">Isometric projection: the two candidate points share x=−1 and y=1 but have different z.</text><rect x="1102" y="164" width="348" height="150" rx="14" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="1128" y="204" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#315F86">Compare directions</text><text x="1128" y="244" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">(2, 1, 3) and (1, 2, −1)</text><text x="1128" y="281" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">Not scalar multiples → not parallel</text><rect x="1102" y="326" width="348" height="175" rx="14" fill="#F4F1E8" stroke="#F4F1E8" stroke-width="2"/><text x="1128" y="366" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#725C8E">Solve x and y equations</text><text x="1128" y="406" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">1 + 2s = u</text><text x="1128" y="441" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">2 + s = 3 + 2u</text><text x="1128" y="477" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">s = −1, u = −1</text><rect x="1102" y="517" width="348" height="174" rx="14" fill="#E7F3F1" stroke="#E7F3F1" stroke-width="2"/><text x="1128" y="557" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#168C8C">Check z (the deciding test)</text><text x="1128" y="597" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">l₁: −1 + 3(−1) = −4</text><text x="1128" y="632" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">l₃: 1 − (−1) = 2</text><text x="1128" y="670" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#C44949">Different z → skew lines</text><text letter-spacing="5" opacity=".075" x="764" y="849" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE STUDY RESOURCES</text><line x1="52" y1="866" x2="1476" y2="866" stroke="#C9A227" stroke-width="2" /><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
