<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">Minor segment: subtract the triangle from the sector</title><desc id="desc">Radius 10 cm, central angle pi/3, chord 10 cm: minor-segment area 50pi/3−25sqrt(3) cm² and perimeter 10pi/3+10 cm.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial,sans-serif"><text x="62" y="78" font-size="38" font-weight="700" fill="#0B1F3A" text-anchor="start">Minor segment: subtract the triangle from the sector</text><text x="64" y="124" font-size="22" font-weight="500" fill="#20314B" text-anchor="start">Cambridge International AS &amp; A Level Mathematics 9709 • Circular measure</text><rect x="60" y="165" width="1480" height="755" rx="18" fill="#FFFFFF" stroke="#CCD6D7" stroke-width="2"/><text x="105" y="220" font-size="22" font-weight="700" fill="#0B1F3A" text-anchor="start">The minor segment is the sector minus triangle OAB.</text><circle cx="420" cy="535" r="220" fill="#FAFCFC" stroke="#CCD6D7" stroke-width="4"/><path d="M 310.0 344.5 A 220 220 0 0 1 530.0 344.5" fill="none" stroke="#397DA4" stroke-width="10"/><path d="M420 535 L310.0 344.4744111674235" fill="none" stroke="#C9A227" stroke-width="5"/><path d="M420 535 L530.0 344.4744111674235" fill="none" stroke="#C9A227" stroke-width="5"/><path d="M310.0 344.4744111674235 L530.0 344.4744111674235" fill="none" stroke="#2D7A78" stroke-width="5"/><circle cx="420" cy="535" r="7" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="1"/><circle cx="310.0" cy="344.4744111674235" r="7" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="1"/><circle cx="530.0" cy="344.4744111674235" r="7" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="1"/><text x="390" y="565" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="start">O</text><text x="278.0" y="334.4744111674235" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="start">A</text><text x="544.0" y="334.4744111674235" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="start">B</text><text x="420" y="433" font-size="20" font-weight="700" fill="#397DA4" text-anchor="middle">60° = π/3</text><text x="340" y="497" font-size="18" font-weight="700" fill="#C9A227" text-anchor="start">10 cm</text><text x="458" y="497" font-size="18" font-weight="700" fill="#C9A227" text-anchor="start">10 cm</text><text x="420" y="330" font-size="18" font-weight="700" fill="#397DA4" text-anchor="middle">arc = 10π/3</text><text x="420" y="625" font-size="18" font-weight="700" fill="#2D7A78" text-anchor="middle">AB = 10 cm</text><rect x="800" y="280" width="640" height="465" rx="16" fill="#F5F8FB" stroke="#397DA4" stroke-width="2"/><text x="840" y="330" font-size="18" font-weight="700" fill="#397DA4" text-anchor="start">EXACT MINOR-SEGMENT MEASURES</text><text x="845" y="390" font-size="20" font-weight="600" fill="#0B1F3A" text-anchor="start">Sector area = ½(10²)(π/3)</text><text x="845" y="430" font-size="22" font-weight="700" fill="#397DA4" text-anchor="start">= 50π/3 cm²</text><text x="845" y="495" font-size="19" font-weight="600" fill="#20314B" text-anchor="start">Triangle OAB is equilateral:</text><text x="845" y="535" font-size="20" font-weight="700" fill="#2D7A78" text-anchor="start">area = (√3/4)(10²) = 25√3</text><path d="M845 565 L1390 565" fill="none" stroke="#CCD6D7" stroke-width="2"/><text x="845" y="615" font-size="19" font-weight="700" fill="#0B1F3A" text-anchor="start">Segment area = sector − triangle</text><text x="845" y="660" font-size="24" font-weight="700" fill="#2D7A78" text-anchor="start">= 50π/3 − 25√3 cm²</text><text x="845" y="710" font-size="18" font-weight="600" fill="#20314B" text-anchor="start">Perimeter = arc + chord = 10π/3 + 10 cm</text><rect x="120" y="810" width="1330" height="58" rx="14" fill="#FFF4D6" stroke="#E0C76C" stroke-width="2"/><text x="155" y="847" font-size="19" font-weight="700" fill="#0B1F3A" text-anchor="start">Subtract the isosceles triangle from the sector; add its chord only for perimeter.</text><path d="M60 972 L1540 972" fill="none" stroke="#CCD6D7" stroke-width="2"/><text x="64" y="1015" font-size="17" font-weight="500" fill="#20314B" text-anchor="start">Marlbridge • Mathematics study resource • check assumptions and context</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>