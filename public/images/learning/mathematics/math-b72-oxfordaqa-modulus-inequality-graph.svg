"14" font-weight="700" fill="#315F86">y = |x + 5|</text><text x="740" y="315" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#C44949">y = 2|x − 1|</text><text x="490" y="670" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#168C8C">Strict inequality: open endpoints</text><rect x="1100" y="164" width="352" height="152" rx="14" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="1126" y="203" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#315F86">Find intersections</text><text x="1126" y="245" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">|x + 5| = 2|x − 1|</text><text x="1126" y="283" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">x = −1 or x = 7</text><rect x="1100" y="334" width="352" height="176" rx="14" fill="#F4F1E8" stroke="#F4F1E8" stroke-width="2"/><text x="1126" y="373" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#725C8E">Compare between them</text><text x="1126" y="415" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">At x = 0: 5 is not &lt; 2.</text><text x="1126" y="454" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">So the solution is outside</text><text x="1126" y="483" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">the crossing points.</text><rect x="1100" y="528" width="352" height="158" rx="14" fill="#E7F3F1" stroke="#E7F3F1" stroke-width="2"/><text x="1126" y="567" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#168C8C">Answer</text><text x="1126" y="610" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">x &lt; −1 or x &gt; 7</text><text x="1126" y="650" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#20314B">Open circles: strict &lt;</text><text letter-spacing="5" opacity=".075" x="764" y="849" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE STUDY RESOURCES</text><line x1="52" y1="866" x2="1476" y2="866" stroke="#C9A227" stroke-width="2" /><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
