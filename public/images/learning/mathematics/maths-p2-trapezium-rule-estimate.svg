<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">Trapezium rule: estimate an integral with equal-width strips</title><desc id="desc">Four-interval trapezium estimate of integral 0 to 1 e^(x squared) dx using source lesson ordinates; result 1.49 and convexity implies over-estimate.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial,sans-serif" fill="#20314B"><text x="62" y="78" font-size="38" font-weight="700" fill="#0B1F3A">Trapezium rule: estimate an integral with equal-width strips</text><text x="64" y="124" font-size="22">Marlbridge teaching diagram • examples are schematic</text><rect x="60" y="165" width="1480" height="755" rx="18" fill="white" stroke="#CCD6D7" stroke-width="2"/><text x="100" y="225" font-size="21" font-weight="400" fill="#20314B" text-anchor="start">With n strips there are n + 1 ordinates; endpoints count once, interior values twice.</text><rect x="100" y="270" width="740" height="475" rx="14" fill="#FBFCFC" stroke="#CCD6D7" stroke-width="2"/><text x="130" y="315" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="start">Estimate ∫₀¹ eˣ² dx using n = 4</text><path d="M180 650H790M180 650V365" stroke="#68798A" stroke-width="2"/><path d="M200 620 C250 612 290 604 330 600 S420 570 460 565 S550 520 590 500 S680 415 720 385" fill="none" stroke="#2D7A78" stroke-width="4"/><path d="M200 650L200 620L330 600L330 650Z" fill="#D7EAE6" fill-opacity=".55" stroke="#A3C9C2" stroke-width="1"/><circle cx="200" cy="620" r="5" fill="#C9A227"/><path d="M330 650L330 600L460 565L460 650Z" fill="#D7EAE6" fill-opacity=".55" stroke="#A3C9C2" stroke-width="1"/><circle cx="330" cy="600" r="5" fill="#C9A227"/><path d="M460 650L460 565L590 500L590 650Z" fill="#D7EAE6" fill-opacity=".55" stroke="#A3C9C2" stroke-width="1"/><circle cx="460" cy="565" r="5" fill="#C9A227"/><path d="M590 650L590 500L720 385L720 650Z" fill="#D7EAE6" fill-opacity=".55" stroke="#A3C9C2" stroke-width="1"/><circle cx="590" cy="500" r="5" fill="#C9A227"/><circle cx="720" cy="385" r="5" fill="#C9A227"/><text x="200" y="680" font-size="15" font-weight="400" fill="#596B7E" text-anchor="middle">0</text><text x="330" y="680" font-size="15" font-weight="400" fill="#596B7E" text-anchor="middle">.25</text><text x="460" y="680" font-size="15" font-weight="400" fill="#596B7E" text-anchor="middle">.5</text><text x="590" y="680" font-size="15" font-weight="400" fill="#596B7E" text-anchor="middle">.75</text><text x="720" y="680" font-size="15" font-weight="400" fill="#596B7E" text-anchor="middle">1</text><text x="490" y="730" font-size="16" font-weight="400" fill="#596B7E" text-anchor="middle">Four trapezia approximate area under eˣ²</text><rect x="900" y="270" width="540" height="475" rx="14" fill="#FBFCFC" stroke="#CCD6D7" stroke-width="2"/><text x="930" y="320" font-size="21" font-weight="700" fill="#0B1F3A" text-anchor="start">Table of ordinates</text><text x="930" y="375" font-size="17" font-weight="700" fill="#2D7A78" text-anchor="start">x:  0    .25    .50    .75    1</text><text x="930" y="425" font-size="15" font-weight="400" fill="#20314B" text-anchor="start">y:  1  1.0645 1.2840 1.7551 2.7183</text><text x="930" y="495" font-size="18" font-weight="700" fill="#20314B" text-anchor="start">h = (1 − 0)/4 = 0.25</text><text x="930" y="545" font-size="17" font-weight="400" fill="#20314B" text-anchor="start">Estimate = ½h{y₀ + 2Σyᵢ + yₙ}</text><text x="930" y="595" font-size="18" font-weight="400" fill="#20314B" text-anchor="start">= 0.125 × 11.9255</text><text x="930" y="645" font-size="21" font-weight="700" fill="#2D7A78" text-anchor="start">≈ 1.49 (3 s.f.)</text><text x="930" y="705" font-size="17" font-weight="400" fill="#20314B" text-anchor="start">Convex curve → over-estimate.</text><rect x="100" y="795" width="1340" height="75" rx="14" fill="#FFF4D6" stroke="#E0C76C" stroke-width="2"/><text x="125" y="842" font-size="17" font-weight="700" fill="#0B1F3A" text-anchor="start">Round only at the end; carry the table values to at least 4 decimal places.</text><path d="M60 972H1540" stroke="#CCD6D7" stroke-width="2"/><text x="64" y="1015" font-size="17">Marlbridge • study diagram • check assumptions and context</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>
