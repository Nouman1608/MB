<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img"><title>Narrow a root interval by bisection</title><desc>Marlbridge • OCR GCSE Mathematics J560 • Interval bisection</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#10233F">Narrow a root interval by bisection</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">Marlbridge • OCR GCSE Mathematics J560 • Interval bisection</text><rect x="52" y="128" width="1000" height="660" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="1076" y="128" width="400" height="660" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="88" y="174" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">Bisection keeps the half-interval with opposite endpoint signs</text><text x="88" y="211" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6D80">Example 10 • f(x) = x³ − 3x − 5</text><text x="115" y="305" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#5B6D80">Step 1</text><line x1="160" y1="300" x2="470" y2="300" stroke="#D3DCE2" stroke-width="4"/><line x1="160" y1="300" x2="315" y2="300" stroke="#315F86" stroke-width="10"/><circle cx="160" cy="300" r="6" fill="#10233F"/><circle cx="470" cy="300" r="6" fill="#10233F"/><circle cx="315" cy="300" r="8" fill="#C9A227" stroke="white" stroke-width="2"/><text x="315" y="286" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#10233F">m=2.5</text><text x="700" y="305" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#20314B">f(m) = 3.125</text><text x="982" y="305" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#315F86">keep 2 to 2.5</text><text x="115" y="381" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#5B6D80">Step 2</text><line x1="160" y1="376" x2="315" y2="376" stroke="#D3DCE2" stroke-width="4"/><line x1="237.5" y1="376" x2="315" y2="376" stroke="#168C8C" stroke-width="10"/><circle cx="160" cy="376" r="6" fill="#10233F"/><circle cx="315" cy="376" r="6" fill="#10233F"/><circle cx="237.5" cy="376" r="8" fill="#C9A227" stroke="white" stroke-width="2"/><text x="237.5" y="362" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#10233F">m=2.25</text><text x="700" y="381" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#20314B">f(m) = −0.359</text><text x="982" y="381" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#168C8C">keep 2.25 to 2.5</text><text x="115" y="457" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#5B6D80">Step 3</text><line x1="237.5" y1="452" x2="315" y2="452" stroke="#D3DCE2" stroke-width="4"/><line x1="237.5" y1="452" x2="276.25" y2="452" stroke="#725C8E" stroke-width="10"/><circle cx="237.5" cy="452" r="6" fill="#10233F"/><circle cx="315" cy="452" r="6" fill="#10233F"/><circle cx="276.25" cy="452" r="8" fill="#C9A227" stroke="white" stroke-width="2"/><text x="276.25" y="438" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#10233F">m=2.375</text><text x="700" y="457" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#20314B">f(m) = 1.271</text><text x="982" y="457" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#725C8E">keep 2.25 to 2.375</text><text x="115" y="533" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#5B6D80">Step 4</text><line x1="237.5" y1="528" x2="276.25" y2="528" stroke="#D3DCE2" stroke-width="4"/><line x1="237.5" y1="528" x2="256.875" y2="528" stroke="#C9A227" stroke-width="10"/><circle cx="237.5" cy="528" r="6" fill="#10233F"/><circle cx="276.25" cy="528" r="6" fill="#10233F"/><circle cx="256.875" cy="528" r="8" fill="#C9A227" stroke="white" stroke-width="2"/><text x="256.875" y="514" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#10233F">m=2.3125</text><text x="700" y="533" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#20314B">f(m) = 0.429</text><text x="982" y="533" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#C9A227">keep 2.25 to 2.3125</text><text x="115" y="609" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#5B6D80">Step 5</text><line x1="237.5" y1="604" x2="256.875" y2="604" stroke="#D3DCE2" stroke-width="4"/><line x1="237.5" y1="604" x2="247.1875" y2="604" stroke="#C44949" stroke-width="10"/><circle cx="237.5" cy="604" r="6" fill="#10233F"/><circle cx="256.875" cy="604" r="6" fill="#10233F"/><circle cx="247.1875" cy="604" r="8" fill="#C9A227" stroke="white" stroke-width="2"/><text x="247.1875" y="590" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#10233F">m=2.28125</text><text x="700" y="609" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#20314B">f(m) = 0.028</text><text x="982" y="609" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#C44949">keep 2.25 to 2.28125</text><rect x="112" y="684" width="844" height="62" rx="12" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="138" y="723" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">Final bracket [2.25, 2.28125] • both ends round to 2.3 (1 d.p.)</text><rect x="1100" y="164" width="352" height="154" rx="14" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="1126" y="203" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#315F86">Start with opposite signs</text><text x="1126" y="245" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#20314B">f(2)=−3; f(3)=13</text><text x="1126" y="284" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">A root lies in [2,3].</text><rect x="1100" y="334" width="352" height="174" rx="14" fill="#F4F1E8" stroke="#F4F1E8" stroke-width="2"/><text x="1126" y="373" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#725C8E">At each midpoint</text><text x="1126" y="415" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">Evaluate f(m), then keep</text><text x="1126" y="451" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">the half whose endpoints</text><text x="1126" y="487" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">still have opposite signs.</text><rect x="1100" y="524" width="352" height="162" rx="14" fill="#E7F3F1" stroke="#E7F3F1" stroke-width="2"/><text x="1126" y="563" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#168C8C">Why it works</text><text x="1126" y="605" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">Continuity keeps a root</text><text x="1126" y="641" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">inside each retained bracket.</text><text x="1126" y="670" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#10233F">Width halves each step.</text><text letter-spacing="5" opacity=".075" x="764" y="849" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE STUDY RESOURCES</text><line x1="52" y1="866" x2="1476" y2="866" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
