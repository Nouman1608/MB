<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="t d"><title id="t">A probability tree without replacement</title><desc id="d">Marlbridge mathematics lesson diagram.</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#10233F">A probability tree without replacement</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#5B6D80">Marlbridge • Mathematics</text><rect x="52" y="132" width="1424" height="680" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="82" y="178" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">Two counters from 5 red and 3 blue • do not replace the first</text><circle cx="155" cy="460" r="10" fill="#10233F" stroke="none" stroke-width="1"/><path d="M155 460L455 330" fill="none" stroke="#C44949" stroke-width="4" stroke-linecap="round"/><path d="M155 460L455 590" fill="none" stroke="#315F86" stroke-width="4" stroke-linecap="round"/><text x="245" y="370" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#C44949">R  5/8</text><text x="245" y="560" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#315F86">B  3/8</text><circle cx="455" cy="330" r="8" fill="#C44949" stroke="none" stroke-width="1"/><circle cx="455" cy="590" r="8" fill="#315F86" stroke="none" stroke-width="1"/><path d="M455 330L800 250" fill="none" stroke="#C44949" stroke-width="4" stroke-linecap="round"/><text x="570" y="282.0" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#C44949">R  4/7</text><circle cx="800" cy="250" r="7" fill="#C44949" stroke="none" stroke-width="1"/><path d="M455 330L800 415" fill="none" stroke="#315F86" stroke-width="4" stroke-linecap="round"/><text x="570" y="364.5" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#315F86">B  3/7</text><circle cx="800" cy="415" r="7" fill="#315F86" stroke="none" stroke-width="1"/><path d="M455 590L800 515" fill="none" stroke="#C44949" stroke-width="4" stroke-linecap="round"/><text x="570" y="544.5" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#C44949">R  5/7</text><circle cx="800" cy="515" r="7" fill="#C44949" stroke="none" stroke-width="1"/><path d="M455 590L800 680" fill="none" stroke="#315F86" stroke-width="4" stroke-linecap="round"/><text x="570" y="627.0" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#315F86">B  2/7</text><circle cx="800" cy="680" r="7" fill="#315F86" stroke="none" stroke-width="1"/><text x="830" y="256" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#C44949">RR</text><text x="830" y="421" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#725C8E">RB</text><text x="830" y="521" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#725C8E">BR</text><text x="830" y="686" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#315F86">BB</text><rect x="930" y="230" width="450" height="410" rx="14" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="1155" y="276" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233F">Multiply along each route</text><text x="975" y="337" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#C44949">Both red: 5/8 × 4/7 = 20/56</text><text x="975" y="382" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#315F86">Both blue: 3/8 × 2/7 = 6/56</text><path d="M975 408L1335 408" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round"/><text x="975" y="460" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#10233F">Same colour:</text><text x="975" y="503" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#168C8C">20/56 + 6/56 = 26/56</text><text x="1155" y="561" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#C9A227">= 13/28</text><text x="1155" y="604" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6D80">The second draw has 7 counters.</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
