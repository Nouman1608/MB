<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">Circular measure: radians link arc length and sector area</title><desc id="desc">Schematic sector with radius 8 cm and angle 1.75 radians: arc length 14 cm, perimeter 30 cm, area 56 square cm.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial,sans-serif" fill="#20314B"><text x="62" y="78" font-size="40" font-weight="700" fill="#0B1F3A">Circular measure: radians link arc length and sector area</text><text x="64" y="124" font-size="22">Marlbridge teaching diagram • examples are schematic</text><rect x="60" y="165" width="1480" height="755" rx="18" fill="white" stroke="#CCD6D7" stroke-width="2"/><text x="100" y="225" font-size="22">Use radians in s = rθ and A = ½r²θ; include both radii in the sector perimeter.</text>
<path d="M375 570L375 390A180 180 0 0 1 531 480Z" fill="#E7EFED" stroke="#2D7A78" stroke-width="3"/><path d="M375 570V365M375 570L555 465" stroke="#397DA4" stroke-width="5"/><circle cx="375" cy="570" r="7" fill="#0B1F3A"/><text x="350" y="455" font-size="22" font-weight="700">r</text><text x="466" y="500" font-size="22" font-weight="700">r</text><text x="410" y="540" font-size="18" font-weight="700" fill="#2D7A78">θ = 1.75 rad</text><text x="375" y="790" text-anchor="middle" font-size="16" fill="#596B7E">Schematic sector • θ in radians</text>
<rect x="670" y="290" width="690" height="490" rx="14" fill="#FBFCFC" stroke="#CCD6D7" stroke-width="2"/><text x="710" y="345" font-size="23" font-weight="700" fill="#0B1F3A">Worked example • radius 8 cm</text><text x="710" y="405" font-size="20">Perimeter = 30 cm</text><text x="710" y="465" font-size="20" font-weight="700" fill="#2D7A78">2r + rθ = 30</text><text x="710" y="515" font-size="19">16 + 8θ = 30  →  θ = 1.75 rad</text><path d="M710 550H1310" stroke="#CCD6D7" stroke-width="2"/><text x="710" y="610" font-size="19" font-weight="700" fill="#0B1F3A">Arc length: s = rθ = 8 × 1.75 = 14 cm</text><text x="710" y="690" font-size="19" font-weight="700" fill="#0B1F3A">Sector area: A = ½r²θ</text><text x="710" y="740" font-size="19">½ × 64 × 1.75 = 56 cm²</text><rect x="670" y="810" width="690" height="50" rx="10" fill="#FFF4D6" stroke="#E0C76C" stroke-width="2"/><text x="695" y="843" font-size="17" font-weight="700" fill="#0B1F3A">Degree given? Convert first: radians = degrees × π/180.</text><path d="M60 972H1540" stroke="#CCD6D7" stroke-width="2"/><text x="64" y="1015" font-size="17">Marlbridge • study diagram • check assumptions and context</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>
