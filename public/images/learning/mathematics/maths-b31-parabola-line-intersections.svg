0 388.0 L730.3 379.8 L735.5 371.5 L740.8 363.1 L746.0 354.5" fill="none" stroke="#315F86" stroke-width="5"/><path d="M200 739L830 415" fill="none" stroke="#168C8C" stroke-width="5" stroke-linecap="round"/><circle cx="410" cy="631" r="8" fill="#C9A227" stroke="white" stroke-width="2"/><text x="422" y="617" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#C9A227">(2, −3)</text><circle cx="620" cy="523" r="8" fill="#C9A227" stroke="white" stroke-width="2"/><text x="632" y="509" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#C9A227">(4, 1)</text><text x="842" y="555" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">x</text><text x="95" y="470" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">y</text><rect x="950" y="235" width="440" height="385" rx="14" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="1170" y="280" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233F">Subtract the line equation</text><text x="995" y="340" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#315F86">x² − 4x + 1 = 2x − 7</text><text x="995" y="382" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#20314B">x² − 6x + 8 = 0</text><text x="995" y="424" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#168C8C">(x − 2)(x − 4) = 0</text><text x="995" y="479" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#C9A227">x = 2 or x = 4</text><text x="995" y="522" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#5B6D80">Substitute in y = 2x − 7:</text><text x="995" y="560" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">(2, −3) and (4, 1)</text><text x="1170" y="592" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#5B6D80">The graph shows both crossings.</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
