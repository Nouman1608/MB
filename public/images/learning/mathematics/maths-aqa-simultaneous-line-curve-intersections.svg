5" y="317" font-size="15" font-weight="700" fill="#2D7A78" text-anchor="start">y = x + 3</text><rect x="920" y="285" width="540" height="490" rx="16" fill="#FBFCFC" stroke="#2D7A78" stroke-width="2"/><text x="955" y="335" font-size="20" font-weight="700" fill="#2D7A78" text-anchor="start">Exact algebra</text><text x="955" y="395" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="start">x² − 2x = x + 3</text><text x="955" y="445" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="start">x² − 3x − 3 = 0</text><text x="955" y="500" font-size="21" font-weight="700" fill="#397DA4" text-anchor="start">x = (3 ± √21)/2</text><text x="955" y="555" font-size="21" font-weight="700" fill="#397DA4" text-anchor="start">y = (9 ± √21)/2</text><path d="M955 590H1420" fill="none" stroke="#CCD6D7" stroke-width="2"/><text x="955" y="635" font-size="16" font-weight="700" fill="#20314B" text-anchor="start">(−0.791, 2.21) and (3.79, 6.79)</text><text x="955" y="690" font-size="16" font-weight="700" fill="#9A7414" text-anchor="start">Match the same ± sign in x and y.</text><text x="955" y="730" font-size="15" font-weight="600" fill="#20314B" text-anchor="start">Both points lie on both graphs.</text><rect x="115" y="815" width="1345" height="55" rx="16" fill="#FFF4D6" stroke="#E0C76C" stroke-width="2"/><text x="140" y="850" font-size="16" font-weight="700" fill="#0B1F3A" text-anchor="start">Graph estimates locate intersections; substitution and exact roots justify the solutions.</text><path d="M60 972H1540" stroke="#CCD6D7" stroke-width="2"/><text x="64" y="1015" font-size="17">Marlbridge • Mathematics study resource • check assumptions and context</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>
