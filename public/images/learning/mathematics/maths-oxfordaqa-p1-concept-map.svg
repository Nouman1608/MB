<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">OxfordAQA Unit P1: topic links and syllabus boundary</title><desc id="desc">The concept map shows P1.1 algebra as the foundation, then the other P1 strands; it explicitly separates circle geometry and trigonometry as Unit PSM1 content.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial,sans-serif" fill="#20314B"><text x="62" y="78" font-size="38" font-weight="700" fill="#0B1F3A">OxfordAQA Unit P1: topic links and syllabus boundary</text><text x="64" y="124" font-size="22">Marlbridge teaching diagram • examples are schematic</text><rect x="60" y="165" width="1480" height="755" rx="18" fill="white" stroke="#CCD6D7" stroke-width="2"/><text x="100" y="220" font-size="23" font-weight="400" fill="#20314B" text-anchor="start">Unit P1 links five pure-maths strands; separate Unit PSM1 content clearly.</text><rect x="590" y="305" width="420" height="120" rx="16" fill="#FFF4D6" stroke="#C9A227" stroke-width="2"/><text x="800" y="350" font-size="22" font-weight="700" fill="#0B1F3A" text-anchor="middle">P1.1 Algebra &amp; functions</text><text x="800" y="392" font-size="17" font-weight="400" fill="#40556B" text-anchor="middle">foundation used throughout P1</text><rect x="100" y="510" width="420" height="120" rx="16" fill="#E7EFED" stroke="#2D7A78" stroke-width="2"/><text x="310" y="558" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="middle">P1.2 Coordinate geometry</text><text x="310" y="598" font-size="17" font-weight="400" fill="#40556B" text-anchor="middle">lines • intersections</text><rect x="590" y="510" width="420" height="120" rx="16" fill="#E7EFED" stroke="#2D7A78" stroke-width="2"/><text x="800" y="558" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="middle">P1.3 Differentiation</text><text x="800" y="598" font-size="17" font-weight="400" fill="#40556B" text-anchor="middle">gradient • rates • tangents</text><rect x="1080" y="510" width="420" height="120" rx="16" fill="#E7EFED" stroke="#2D7A78" stroke-width="2"/><text x="1290" y="558" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="middle">P1.4 Integration</text><text x="1290" y="598" font-size="17" font-weight="400" fill="#40556B" text-anchor="middle">reverse rates • area</text><rect x="590" y="640" width="420" height="120" rx="16" fill="#E7EFED" stroke="#2D7A78" stroke-width="2"/><text x="800" y="688" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="middle">P1.5 Sequences &amp; series</text><text x="800" y="728" font-size="17" font-weight="400" fill="#40556B" text-anchor="middle">AP/GP • sums</text><path d="M800 425L310 500" fill="none" stroke="#B4C3CC" stroke-width="2"/><path d="M800 425L800 500" fill="none" stroke="#B4C3CC" stroke-width="2"/><path d="M800 425L1290 500" fill="none" stroke="#B4C3CC" stroke-width="2"/><path d="M800 425L800 680" fill="none" stroke="#B4C3CC" stroke-width="2"/><rect x="100" y="780" width="1340" height="100" rx="16" fill="#FCE8E6" stroke="#D6A19B" stroke-width="2"/><text x="130" y="820" font-size="20" font-weight="700" fill="#8F3B32" text-anchor="start">Not Unit P1:</text><text x="130" y="858" font-size="17" font-weight="400" fill="#20314B" text-anchor="start">Circle geometry and trigonometry belong to Unit PSM1 (PP1.1/PP1.2), even though all P1 candidates also sit PSM1.</text><path d="M60 972H1540" stroke="#CCD6D7" stroke-width="2"/><text x="64" y="1015" font-size="17">Marlbridge • study diagram • check assumptions and context</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>
