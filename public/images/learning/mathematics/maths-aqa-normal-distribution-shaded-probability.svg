13" font-weight="500" fill="#596B7E" text-anchor="middle">244</text><text x="530.0" y="731" font-size="13" font-weight="500" fill="#596B7E" text-anchor="middle">250</text><text x="666.6666666666666" y="731" font-size="13" font-weight="500" fill="#596B7E" text-anchor="middle">254</text><text x="803.3333333333334" y="731" font-size="13" font-weight="500" fill="#596B7E" text-anchor="middle">258</text><text x="940.0" y="731" font-size="13" font-weight="500" fill="#596B7E" text-anchor="middle">262</text><text x="530.0" y="763" font-size="15" font-weight="600" fill="#20314B" text-anchor="middle">mass x (g)</text><text x="530.0" y="586.315" font-size="14" font-weight="700" fill="#2D7A78" text-anchor="middle">μ=250</text><text x="325.0" y="624.96" font-size="14" font-weight="700" fill="#9A7414" text-anchor="middle">244</text><text x="155" y="347" font-size="17" font-weight="700" fill="#0B1F3A" text-anchor="start">X ~ N(250, 4²)</text><rect x="995" y="285" width="455" height="450" rx="16" fill="#FBFCFC" stroke="#397DA4" stroke-width="2"/><text x="1030" y="335" font-size="20" font-weight="700" fill="#397DA4" text-anchor="start">Read the shaded area</text><text x="1030" y="395" font-size="18" font-weight="700" fill="#0B1F3A" text-anchor="start">z = (244−250)/4 = −1.5</text><text x="1030" y="455" font-size="19" font-weight="700" fill="#2D7A78" text-anchor="start">P(X &lt; 244) = 0.0668</text><text x="1030" y="515" font-size="17" font-weight="700" fill="#20314B" text-anchor="start">σ = 4 (not variance 16)</text><path d="M1030 550H1415" fill="none" stroke="#CCD6D7" stroke-width="2"/><text x="1030" y="600" font-size="16" font-weight="700" fill="#0B1F3A" text-anchor="start">Continuous variable:</text><text x="1030" y="638" font-size="17" font-weight="700" fill="#9A7414" text-anchor="start">P(X = a) = 0</text><text x="1030" y="690" font-size="16" font-weight="600" fill="#20314B" text-anchor="start">area = probability</text><rect x="120" y="790" width="1330" height="70" rx="16" fill="#FFF4D6" stroke="#E0C76C" stroke-width="2"/><text x="150" y="835" font-size="17" font-weight="700" fill="#0B1F3A" text-anchor="start">The curve is symmetric about μ, total area is 1, and σ—not σ²—is the standard deviation.</text><path d="M60 972H1540" stroke="#CCD6D7" stroke-width="2"/><text x="64" y="1015" font-size="17">Marlbridge • Mathematics study resource • check assumptions and context</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>
