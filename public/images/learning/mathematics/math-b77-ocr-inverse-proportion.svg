"700" fill="#315F86">Find the constant</text><text x="1126" y="245" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#20314B">k = xy = 8 × 5 = 40</text><text x="1126" y="284" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">So y = 40/x.</text><rect x="1100" y="334" width="352" height="178" rx="14" fill="#F4F1E8" stroke="#F4F1E8" stroke-width="2"/><text x="1126" y="373" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#725C8E">Use the model</text><text x="1126" y="415" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">x=10 → y=40/10=4</text><text x="1126" y="453" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">y=1.6 → x=40/1.6=25</text><text x="1126" y="489" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">Every point has xy=40.</text><rect x="1100" y="530" width="352" height="154" rx="14" fill="#E7F3F1" stroke="#E7F3F1" stroke-width="2"/><text x="1126" y="569" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#168C8C">Graph shape</text><text x="1126" y="611" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">The curve approaches both</text><text x="1126" y="650" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">axes but never touches them.</text><text letter-spacing="5" opacity=".075" x="764" y="849" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE STUDY RESOURCES</text><line x1="52" y1="866" x2="1476" y2="866" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
