<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">AQA hypothesis testing: follow a one-tailed binomial test</title><desc id="desc">A four-step test flow reproduces the guide example with X~B(25,0.2), upper-tail p-value 0.0468 and a 5% decision, while interpreting the inference carefully.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial,sans-serif" fill="#20314B"><text x="62" y="78" font-size="38" font-weight="700" fill="#0B1F3A">AQA hypothesis testing: follow a one-tailed binomial test</text><text x="64" y="124" font-size="22">Marlbridge Mathematics • teaching diagram</text><rect x="60" y="165" width="1480" height="755" rx="18" fill="white" stroke="#CCD6D7" stroke-width="2"/><text x="105" y="220" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="start">State hypotheses, use the alternative to choose the tail, then compare the p-value with α.</text><rect x="110" y="285" width="290" height="135" rx="16" fill="#E7EFED" stroke="#2D7A78" stroke-width="2"/><text x="255" y="330" font-size="16" font-weight="700" fill="#2D7A78" text-anchor="middle">1  PARAMETER</text><text x="255" y="378" font-size="15" font-weight="700" fill="#0B1F3A" text-anchor="middle">p = population warranty proportion</text><rect x="430" y="285" width="290" height="135" rx="16" fill="#E7EFED" stroke="#2D7A78" stroke-width="2"/><text x="575" y="330" font-size="16" font-weight="700" fill="#2D7A78" text-anchor="middle">2  HYPOTHESES</text><text x="575" y="378" font-size="15" font-weight="700" fill="#0B1F3A" text-anchor="middle">H₀: p=0.20   •   H₁: p&gt;0.20</text><rect x="750" y="285" width="290" height="135" rx="16" fill="#E7EFED" stroke="#2D7A78" stroke-width="2"/><text x="895" y="330" font-size="16" font-weight="700" fill="#2D7A78" text-anchor="middle">3  NULL MODEL</text><text x="895" y="378" font-size="15" font-weight="700" fill="#0B1F3A" text-anchor="middle">X ~ B(25, 0.20)</text><rect x="1070" y="285" width="290" height="135" rx="16" fill="#E7EFED" stroke="#2D7A78" stroke-width="2"/><text x="1215" y="330" font-size="16" font-weight="700" fill="#2D7A78" text-anchor="middle">4  EVIDENCE</text><text x="1215" y="378" font-size="15" font-weight="700" fill="#0B1F3A" text-anchor="middle">observe x=9; upper tail</text><path d="M400 352H424" fill="none" stroke="#397DA4" stroke-width="4"/><path d="M418 344L428 352L418 360Z" fill="#397DA4"/><path d="M720 352H744" fill="none" stroke="#397DA4" stroke-width="4"/><path d="M738 344L748 352L738 360Z" fill="#397DA4"/><path d="M1040 352H1064" fill="none" stroke="#397DA4" stroke-width="4"/><path d="M1058 344L1068 352L1058 360Z" fill="#397DA4"/><rect x="110" y="480" width="660" height="260" rx="16" fill="#FBFCFC" stroke="#397DA4" stroke-width="2"/><text x="145" y="530" font-size="18" font-weight="700" fill="#397DA4" text-anchor="start">P-VALUE</text><text x="145" y="585" font-size="22" font-weight="700" fill="#0B1F3A" text-anchor="start">P(X ≥ 9 | H₀) = 0.0468</text><path d="M170 660H700" fill="none" stroke="#596B7E" stroke-width="3"/><path d="M170 650V670 M700 650V670" fill="none" stroke="#596B7E" stroke-width="2"/><path d="M170 660H418" fill="none" stroke="#9A7414" stroke-width="8"/><path d="M418 646V674" fill="none" stroke="#397DA4" stroke-width="3"/><path d="M435 645V675" fill="none" stroke="#0B1F3A" stroke-width="3" stroke-dasharray="5 4"/><text x="170" y="705" font-size="13" font-weight="500" fill="#596B7E" text-anchor="start">0</text><text x="418" y="705" font-size="14" font-weight="700" fill="#397DA4" text-anchor="middle">0.0468</text><text x="435" y="640" font-size="12" font-weight="700" fill="#0B1F3A" text-anchor="middle">α=.05</text><text x="700" y="705" font-size="13" font-weight="500" fill="#596B7E" text-anchor="end">0.10</text><rect x="820" y="480" width="650" height="260" rx="16" fill="#FFF4D6" stroke="#E0C76C" stroke-width="2"/><text x="855" y="530" font-size="18" font-weight="700" fill="#9A7414" text-anchor="start">DECISION AT α = 0.05</text><text x="855" y="585" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="start">0.0468 &lt; 0.05  →  reject H₀</text><text x="855" y="635" font-size="16" font-weight="600" fill="#20314B" text-anchor="start">Sufficient evidence at 5% to suggest</text><text x="855" y="670" font-size="16" font-weight="600" fill="#20314B" text-anchor="start">the proportion has increased.</text><text x="855" y="715" font-size="14" font-weight="600" fill="#9A7414" text-anchor="start">Inference is not proof that H₁ is true.</text><rect x="110" y="785" width="1360" height="80" rx="16" fill="#F7F1ED" stroke="#D9B0A8" stroke-width="2"/><text x="140" y="825" font-size="17" font-weight="700" fill="#9B4038" text-anchor="start">A p-value is calculated assuming H₀ is true; it is not the probability that H₀ is true.</text><text x="140" y="850" font-size="15" font-weight="600" fill="#0B1F3A" text-anchor="start">For H₁: p &gt; 0.2, use P(X ≥ observed), including outcomes more extreme than x=9.</text><path d="M60 972H1540" stroke="#CCD6D7" stroke-width="2"/><text x="64" y="1015" font-size="17">Marlbridge • Mathematics study resource • check assumptions and context</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>
