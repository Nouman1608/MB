<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">Mechanics: two tensions holding a particle in equilibrium</title><desc id="desc">A particle of weight 20 N is held by two strings at 30 and 60 degrees to the horizontal. Force vectors and resolved equations give tension A equal to 10 N and tension B equal to 10 root 3 N, about 17.3 N.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial, sans-serif" fill="#20314B"><text x="62" y="78" font-size="40" font-weight="700" fill="#0B1F3A">Mechanics: two tensions holding a particle in equilibrium</text><text x="64" y="124" font-size="22">Marlbridge teaching diagram • examples are schematic</text><rect x="60" y="165" width="1480" height="755" rx="18" fill="white" stroke="#CCD6D7" stroke-width="2"/><text x="100" y="225" font-size="22">At equilibrium, resolve the forces into perpendicular directions and set each resultant to zero.</text><defs><marker id="force" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#397DA4"/></marker><marker id="weight" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#B6534B"/></marker></defs><circle cx="520" cy="500" r="19" fill="#C9A227" stroke="#0B1F3A" stroke-width="3"/><path d="M520 500 L260 350 M520 500 L650 275" stroke="#8694A1" stroke-width="3" stroke-dasharray="8 6"/><path d="M520 500 L260 350" stroke="#397DA4" stroke-width="6" marker-end="url(#force)"/><path d="M520 500 L650 275" stroke="#2D7A78" stroke-width="6" marker-end="url(#force)"/><path d="M520 500 V755" stroke="#B6534B" stroke-width="6" marker-end="url(#weight)"/><text x="280" y="350" font-size="22" font-weight="700" fill="#397DA4">A = 10 N</text><text x="642" y="285" font-size="22" font-weight="700" fill="#2D7A78">B = 10√3 N</text><text x="545" y="735" font-size="22" font-weight="700" fill="#B6534B">20 N</text><path d="M520 500 H690" fill="none" stroke="#8694A1" stroke-width="2" stroke-dasharray="7 6"/><text x="465" y="480" font-size="18" font-weight="700">30°</text><text x="575" y="455" font-size="18" font-weight="700">60°</text><text x="180" y="305" font-size="18">String A: 30° to horizontal</text><text x="650" y="245" font-size="18">String B: 60° to horizontal</text><text x="355" y="785" font-size="16" fill="#526273">Force directions shown; lengths not to scale.</text><rect x="825" y="285" width="630" height="490" rx="18" fill="#FBFCFC" stroke="#CCD6D7" stroke-width="2"/><text x="865" y="335" font-size="24" font-weight="700" fill="#0B1F3A">Resolve horizontally</text><text x="865" y="385" font-size="23">A cos 30° = B cos 60°</text><text x="865" y="430" font-size="20">B = √3 A</text><text x="865" y="500" font-size="24" font-weight="700" fill="#0B1F3A">Resolve vertically</text><text x="865" y="550" font-size="23">A sin 30° + B sin 60° = 20</text><text x="865" y="595" font-size="20">½A + (√3 A)(√3/2) = 20</text><text x="865" y="640" font-size="20">2A = 20 → A = 10 N</text><text x="865" y="685" font-size="20">B = 10√3 ≈ 17.3 N</text><text x="865" y="735" font-size="17">Horizontal and vertical resultants both equal zero.</text><line x1="60" y1="972" x2="1540" y2="972" stroke="#CCD6D7" stroke-width="2"/><text x="64" y="1017" font-size="18">Marlbridge • study diagram • check assumptions and context</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>
