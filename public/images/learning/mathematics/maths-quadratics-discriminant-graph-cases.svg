<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">Quadratics: connect the discriminant to graph intersections</title><desc id="desc">Three schematic quadratic graphs show that positive, zero, and negative discriminants correspond respectively to two, one repeated, and no real roots.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial,sans-serif" fill="#20314B"><text x="62" y="78" font-size="38" font-weight="700" fill="#0B1F3A">Quadratics: connect the discriminant to graph intersections</text><text x="64" y="124" font-size="22">Marlbridge teaching diagram • examples are schematic</text><rect x="60" y="165" width="1480" height="755" rx="18" fill="white" stroke="#CCD6D7" stroke-width="2"/><text x="100" y="220" font-size="23" font-weight="400" fill="#20314B" text-anchor="start">For y = ax² + bx + c, Δ = b² − 4ac predicts real-root intersections.</text><rect x="100" y="275" width="440" height="430" rx="16" fill="#FBFCFC" stroke="#CCD6D7" stroke-width="2"/><text x="125" y="320" font-size="22" font-weight="700" fill="#0B1F3A" text-anchor="start">Δ &gt; 0</text><text x="125" y="360" font-size="19" font-weight="700" fill="#2D7A78" text-anchor="start">y = x² − 1</text><path d="M155 590L485 590" fill="none" stroke="#8997A6" stroke-width="2"/><path d="M320 410L320 665" fill="none" stroke="#8997A6" stroke-width="2"/><polyline points="182.5,448.2 187.1,459.3 191.7,470.0 196.2,480.3 200.8,490.2 205.4,499.8 210.0,509.0 214.6,517.8 219.2,526.2 223.8,534.3 228.3,542.0 232.9,549.3 237.5,556.2 242.1,562.8 246.7,569.0 251.2,574.8 255.8,580.2 260.4,585.3 265.0,590.0 269.6,594.3 274.2,598.2 278.8,601.8 283.3,605.0 287.9,607.8 292.5,610.2 297.1,612.3 301.7,614.0 306.2,615.3 310.8,616.2 315.4,616.8 320.0,617.0 324.6,616.8 329.2,616.2 333.8,615.3 338.3,614.0 342.9,612.3 347.5,610.2 352.1,607.8 356.7,605.0 361.2,601.8 365.8,598.2 370.4,594.3 375.0,590.0 379.6,585.3 384.2,580.2 388.8,574.8 393.3,569.0 397.9,562.8 402.5,556.2 407.1,549.3 411.7,542.0 416.2,534.3 420.8,526.2 425.4,517.8 430.0,509.0 434.6,499.8 439.2,490.2 443.8,480.3 448.3,470.0 452.9,459.3 457.5,448.2" fill="none" stroke="#2D7A78" stroke-width="4"/><circle cx="265" cy="590" r="7" fill="#C9A227"/><circle cx="375" cy="590" r="7" fill="#C9A227"/><text x="320" y="675" font-size="17" font-weight="700" fill="#0B1F3A" text-anchor="middle">two distinct roots</text><rect x="580" y="275" width="440" height="430" rx="16" fill="#FBFCFC" stroke="#CCD6D7" stroke-width="2"/><text x="605" y="320" font-size="22" font-weight="700" fill="#0B1F3A" text-anchor="start">Δ = 0</text><text x="605" y="360" font-size="19" font-weight="700" fill="#2D7A78" text-anchor="start">y = x²</text><path d="M635 590L965 590" fill="none" stroke="#8997A6" stroke-width="2"/><path d="M800 410L800 665" fill="none" stroke="#8997A6" stroke-width="2"/><polyline points="662.5,421.2 667.1,432.3 671.7,443.0 676.2,453.3 680.8,463.2 685.4,472.8 690.0,482.0 694.6,490.8 699.2,499.2 703.8,507.3 708.3,515.0 712.9,522.3 717.5,529.2 722.1,535.8 726.7,542.0 731.2,547.8 735.8,553.2 740.4,558.3 745.0,563.0 749.6,567.3 754.2,571.2 758.8,574.8 763.3,578.0 767.9,580.8 772.5,583.2 777.1,585.3 781.7,587.0 786.2,588.3 790.8,589.2 795.4,589.8 800.0,590.0 804.6,589.8 809.2,589.2 813.8,588.3 818.3,587.0 822.9,585.3 827.5,583.2 832.1,580.8 836.7,578.0 841.2,574.8 845.8,571.2 850.4,567.3 855.0,563.0 859.6,558.3 864.2,553.2 868.8,547.8 873.3,542.0 877.9,535.8 882.5,529.2 887.1,522.3 891.7,515.0 896.2,507.3 900.8,499.2 905.4,490.8 910.0,482.0 914.6,472.8 919.2,463.2 923.8,453.3 928.3,443.0 932.9,432.3 937.5,421.2" fill="none" stroke="#2D7A78" stroke-width="4"/><circle cx="800" cy="590" r="7" fill="#C9A227"/><text x="800" y="675" font-size="17" font-weight="700" fill="#0B1F3A" text-anchor="middle">one repeated root (x = 0)</text><rect x="1060" y="275" width="440" height="430" rx="16" fill="#FBFCFC" stroke="#CCD6D7" stroke-width="2"/><text x="1085" y="320" font-size="22" font-weight="700" fill="#0B1F3A" text-anchor="start">Δ &lt; 0</text><text x="1085" y="360" font-size="19" font-weight="700" fill="#2D7A78" text-anchor="start">y = x² + 1</text><path d="M1115 590L1445 590" fill="none" stroke="#8997A6" stroke-width="2"/><path d="M1280 410L1280 665" fill="none" stroke="#8997A6" stroke-width="2"/><polyline points="1142.5,394.2 1147.1,405.3 1151.7,416.0 1156.2,426.3 1160.8,436.2 1165.4,445.8 1170.0,455.0 1174.6,463.8 1179.2,472.2 1183.8,480.3 1188.3,488.0 1192.9,495.3 1197.5,502.2 1202.1,508.8 1206.7,515.0 1211.2,520.8 1215.8,526.2 1220.4,531.3 1225.0,536.0 1229.6,540.3 1234.2,544.2 1238.8,547.8 1243.3,551.0 1247.9,553.8 1252.5,556.2 1257.1,558.3 1261.7,560.0 1266.2,561.3 1270.8,562.2 1275.4,562.8 1280.0,563.0 1284.6,562.8 1289.2,562.2 1293.8,561.3 1298.3,560.0 1302.9,558.3 1307.5,556.2 1312.1,553.8 1316.7,551.0 1321.2,547.8 1325.8,544.2 1330.4,540.3 1335.0,536.0 1339.6,531.3 1344.2,526.2 1348.8,520.8 1353.3,515.0 1357.9,508.8 1362.5,502.2 1367.1,495.3 1371.7,488.0 1376.2,480.3 1380.8,472.2 1385.4,463.8 1390.0,455.0 1394.6,445.8 1399.2,436.2 1403.8,426.3 1408.3,416.0 1412.9,405.3 1417.5,394.2" fill="none" stroke="#2D7A78" stroke-width="4"/><text x="1280" y="675" font-size="17" font-weight="700" fill="#0B1F3A" text-anchor="middle">no real roots</text><rect x="100" y="755" width="1340" height="125" rx="16" fill="#E7EFED" stroke="#2D7A78" stroke-width="2"/><text x="130" y="800" font-size="21" font-weight="700" fill="#0B1F3A" text-anchor="start">Δ = b² − 4ac</text><text x="130" y="845" font-size="19" font-weight="700" fill="#2D7A78" text-anchor="start">positive → two crossings     •     zero → tangent / repeated root     •     negative → no x-axis meeting</text><text x="130" y="870" font-size="16" font-weight="400" fill="#40556B" text-anchor="start">For “real roots”, include Δ = 0: require Δ ≥ 0.</text><path d="M60 972H1540" stroke="#CCD6D7" stroke-width="2"/><text x="64" y="1015" font-size="17">Marlbridge • study diagram • check assumptions and context</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>
