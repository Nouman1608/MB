<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img"><title>Find expected frequency from a probability and trial count</title><desc>Marlbridge • OxfordAQA International GCSE Mathematics 9260 • S10: expected frequency</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#10233F">Find expected frequency from a probability and trial count</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">Marlbridge • OxfordAQA International GCSE Mathematics 9260 • S10: expected frequency</text><rect x="52" y="128" width="924" height="660" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="1024" y="128" width="452" height="660" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="88" y="174" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">Expected frequency is probability × number of trials</text><text x="88" y="212" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#5B6D80">Spinner: P(shaded) = 3/8 • number of spins = 240</text><rect x="128" y="318" width="92" height="120" rx="8" fill="#168C8C" stroke="#168C8C" stroke-width="2"/><text x="174" y="371" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">shaded</text><text x="174" y="405" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">30 spins</text><rect x="228" y="318" width="92" height="120" rx="8" fill="#168C8C" stroke="#168C8C" stroke-width="2"/><text x="274" y="371" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">shaded</text><text x="274" y="405" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">30 spins</text><rect x="328" y="318" width="92" height="120" rx="8" fill="#168C8C" stroke="#168C8C" stroke-width="2"/><text x="374" y="371" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">shaded</text><text x="374" y="405" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">30 spins</text><rect x="428" y="318" width="92" height="120" rx="8" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="474" y="371" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#5B6D80">not shaded</text><text x="474" y="405" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">30 spins</text><rect x="528" y="318" width="92" height="120" rx="8" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="574" y="371" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#5B6D80">not shaded</text><text x="574" y="405" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">30 spins</text><rect x="628" y="318" width="92" height="120" rx="8" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="674" y="371" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#5B6D80">not shaded</text><text x="674" y="405" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">30 spins</text><rect x="728" y="318" width="92" height="120" rx="8" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="774" y="371" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#5B6D80">not shaded</text><text x="774" y="405" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">30 spins</text><rect x="828" y="318" width="92" height="120" rx="8" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="874" y="371" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#5B6D80">not shaded</text><text x="874" y="405" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">30 spins</text><text x="490" y="480" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6D80">8 equal groups × 30 spins = 240 spins</text><text x="266" y="556" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#168C8C">3 shaded groups × 30 = 90 expected shaded results</text><rect x="116" y="606" width="768" height="103" rx="12" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="146" y="648" text-anchor="start" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#10233F">Expected shaded count = (3/8) × 240 = 90</text><text x="146" y="684" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#20314B">This is a long-run average prediction; an actual 240-spin result may differ.</text><text x="1060" y="177" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">Read the scale as groups</text><rect x="1058" y="215" width="384" height="116" rx="12" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="1084" y="254" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#315F86">3 of 8 equal outcomes are shaded</text><text x="1084" y="291" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">P(shaded) = 3/8 = 0.375</text><rect x="1058" y="348" width="384" height="144" rx="12" fill="#F4F1E8" stroke="#F4F1E8" stroke-width="2"/><text x="1084" y="389" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#725C8E">Repeat the experiment 240 times</text><text x="1084" y="428" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#20314B">240 ÷ 8 = 30 trials per group</text><text x="1084" y="462" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#725C8E">3 × 30 = 90 expected</text><rect x="1058" y="509" width="384" height="160" rx="12" fill="#F9EEEE" stroke="#F9EEEE" stroke-width="2"/><text x="1084" y="550" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#C44949">Expected does not mean exact</text><text x="1084" y="589" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">Random results vary from run to run.</text><text x="1084" y="624" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#5B6D80">Across many runs, the average tends</text><text x="1084" y="649" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#5B6D80">toward the probability model.</text><text letter-spacing="5" opacity=".075" x="764" y="849" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE STUDY RESOURCES</text><line x1="52" y1="866" x2="1476" y2="866" stroke="#C9A227" stroke-width="2" /><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
