<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img"><title>Parametric sec and tan: select the allowed branch</title><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#10233F">Parametric sec and tan: select the allowed branch</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">Marlbridge • OCR A Level Mathematics A H240 • Parametric equations • eliminating a parameter and restrictions</text><rect x="52" y="128" width="1424" height="670" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="84" y="178" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233F">Use the identity sec²θ=1+tan²θ, then apply the parameter restriction.</text><rect x="85" y="220" width="770" height="440" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="470" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#315F86">x=tan θ, y=3 sec θ;  −π/2&lt;θ&lt;π/2</text><path d="M190.0 600L790.0 600" fill="none" stroke="#10233F" stroke-width="2" stroke-linecap="round"/><path d="M490.0 600L490.0 250" fill="none" stroke="#10233F" stroke-width="2" stroke-linecap="round"/><path d="M190.0 600L190.0 607" fill="none" stroke="#5B6D80" stroke-width="1" stroke-linecap="round"/><text x="190.0" y="623" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">-3</text><path d="M290.0 600L290.0 607" fill="none" stroke="#5B6D80" stroke-width="1" stroke-linecap="round"/><text x="290.0" y="623" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">-2</text><path d="M390.0 600L390.0 607" fill="none" stroke="#5B6D80" stroke-width="1" stroke-linecap="round"/><text x="390.0" y="623" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">-1</text><path d="M490.0 600L490.0 607" fill="none" stroke="#5B6D80" stroke-width="1" stroke-linecap="round"/><text x="490.0" y="623" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">0</text><path d="M590.0 600L590.0 607" fill="none" stroke="#5B6D80" stroke-width="1" stroke-linecap="round"/><text x="590.0" y="623" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">1</text><path d="M690.0 600L690.0 607" fill="none" stroke="#5B6D80" stroke-width="1" stroke-linecap="round"/><text x="690.0" y="623" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">2</text><path d="M790.0 600L790.0 607" fill="none" stroke="#5B6D80" stroke-width="1" stroke-linecap="round"/><text x="790.0" y="623" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">3</text><path d="M490.0 600L790.0 600" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="478.0" y="604" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">0</text><path d="M490.0 495L790.0 495" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="478.0" y="499" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">3</text><path d="M490.0 390L790.0 390" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="478.0" y="394" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">6</text><path d="M490.0 285L790.0 285" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="478.0" y="289" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">9</text><path d="M190.0 268.0 L196.0 273.9 L202.0 279.9 L208.0 285.8 L214.0 291.8 L220.0 297.7 L226.0 303.6 L232.0 309.5 L238.0 315.3 L244.0 321.2 L250.0 327.0 L256.0 332.8 L262.0 338.6 L268.0 344.3 L274.0 350.1 L280.0 355.8 L286.0 361.4 L292.0 367.1 L298.0 372.7 L304.0 378.3 L310.0 383.8 L316.0 389.3 L322.0 394.7 L328.0 400.1 L334.0 405.4 L340.0 410.7 L346.0 415.9 L352.0 421.1 L358.0 426.1 L364.0 431.1 L370.0 436.0 L376.0 440.8 L382.0 445.5 L388.0 450.0 L394.0 454.4 L400.0 458.7 L406.0 462.9 L412.0 466.8 L418.0 470.6 L424.0 474.2 L430.0 477.6 L436.0 480.7 L442.0 483.5 L448.0 486.1 L454.0 488.4 L460.0 490.4 L466.0 492.0 L472.0 493.3 L478.0 494.2 L484.0 494.8 L490.0 495.0 L496.0 494.8 L502.0 494.2 L508.0 493.3 L514.0 492.0 L520.0 490.4 L526.0 488.4 L532.0 486.1 L538.0 483.5 L544.0 480.7 L550.0 477.6 L556.0 474.2 L562.0 470.6 L568.0 466.8 L574.0 462.9 L580.0 458.7 L586.0 454.4 L592.0 450.0 L598.0 445.5 L604.0 440.8 L610.0 436.0 L616.0 431.1 L622.0 426.1 L628.0 421.1 L634.0 415.9 L640.0 410.7 L646.0 405.4 L652.0 400.1 L658.0 394.7 L664.0 389.3 L670.0 383.8 L676.0 378.3 L682.0 372.7 L688.0 367.1 L694.0 361.4 L700.0 355.8 L706.0 350.1 L712.0 344.3 L718.0 338.6 L724.0 332.8 L730.0 327.0 L736.0 321.2 L742.0 315.3 L748.0 309.5 L754.0 303.6 L760.0 297.7 L766.0 291.8 L772.0 285.8 L778.0 279.9 L784.0 273.9 L790.0 268.0" fill="none" stroke="#168C8C" stroke-width="4"/><circle cx="490.0" cy="495" r="7" fill="#C44949"/><text x="502.0" y="485" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#C44949">minimum (0,3)</text><text x="810" y="620" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#10233F">x</text><text x="160" y="300" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#10233F">y</text><rect x="895" y="220" width="530" height="440" rx="14" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="1160" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">Eliminate the parameter</text><text x="945" y="330" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#315F86">y² = 9 sec²θ</text><text x="945" y="370" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#315F86">= 9(1 + tan²θ)</text><path d="M945 400L1375 400" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round"/><text x="945" y="450" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#168C8C">= 9(1 + x²)</text><text x="945" y="500" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#20314B">So y = ±3√(1+x²)</text><text x="945" y="545" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#5B6D80">But sec θ &gt; 0 on the given range.</text><text x="1160" y="600" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#725C8E">Keep only y=3√(1+x²).</text><text x="760" y="710" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6D80">The Cartesian equation describes two branches; the allowed θ-range selects only the upper branch.</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
