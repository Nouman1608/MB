serif" font-size="14" font-weight="600" fill="#5B6D80">Sample-mean distribution shown; individual parent distribution is not drawn to scale.</text><rect x="1102" y="164" width="348" height="150" rx="14" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="1128" y="204" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#315F86">Why the normal model applies</text><text x="1128" y="244" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">Parent is strongly skewed, but</text><text x="1128" y="278" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">n = 64 is large: use the CLT.</text><rect x="1102" y="328" width="348" height="164" rx="14" fill="#F4F1E8" stroke="#F4F1E8" stroke-width="2"/><text x="1128" y="368" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#725C8E">Sampling mean and standard error</text><text x="1128" y="408" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#20314B">μX̄ = 4 min</text><text x="1128" y="445" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">σX̄ = 4/√64 = 0.5 min</text><text x="1128" y="477" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">X̄ ≈ N(4, 0.5²)</text><rect x="1102" y="510" width="348" height="167" rx="14" fill="#E7F3F1" stroke="#E7F3F1" stroke-width="2"/><text x="1128" y="550" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#168C8C">Threshold at 4.9 minutes</text><text x="1128" y="590" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">z = (4.9−4)/0.5 = 1.8</text><text x="1128" y="628" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">P(X̄ &gt; 4.9) = 0.0359</text><text x="1128" y="658" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">Shaded area is the upper tail.</text><text letter-spacing="5" opacity=".075" x="764" y="849" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE STUDY RESOURCES</text><line x1="52" y1="866" x2="1476" y2="866" stroke="#C9A227" stroke-width="2" /><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
