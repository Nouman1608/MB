<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">AQA GCSE accuracy: subtract lengths with bounds</title><desc id="desc">Uses the source plank and cut-piece measurements to calculate the remainder bounds, showing why least uses LB minus UB and greatest uses UB minus LB.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial,sans-serif"><text x="62" y="78" font-size="38" font-weight="700" fill="#0B1F3A">AQA GCSE accuracy: subtract lengths with bounds</text><text x="64" y="124" font-size="22" fill="#20314B">Marlbridge Mathematics • AQA GCSE teaching diagram</text><rect x="60" y="165" width="1480" height="755" rx="18" fill="white" stroke="#CCD6D7" stroke-width="2"/><text x="105" y="220" font-size="21" font-weight="700" fill="#0B1F3A" text-anchor="start">Subtracting a measured piece uses opposite bounds for the greatest and least remainder.</text><rect x="110" y="285" width="660" height="410" rx="16" fill="#F5F8FB" stroke="#397DA4" stroke-width="2"/><text x="150" y="335" font-size="18" font-weight="700" fill="#397DA4" text-anchor="start">PUT BOTH LENGTHS IN METRES</text><text x="160" y="395" font-size="22" font-weight="700" fill="#0B1F3A" text-anchor="start">Plank P: 2.35 ≤ P &lt; 2.45</text><text x="160" y="445" font-size="21" font-weight="700" fill="#0B1F3A" text-anchor="start">Piece Q: 0.845 ≤ Q &lt; 0.855</text><path d="M150 480 L720 480" fill="none" stroke="#CCD6D7" stroke-width="2"/><text x="160" y="525" font-size="18" font-weight="600" fill="#20314B" text-anchor="start">Least: LB(P) − UB(Q)</text><text x="180" y="565" font-size="20" font-weight="700" fill="#2D7A78" text-anchor="start">2.35 − 0.855 = 1.495 m</text><text x="160" y="615" font-size="18" font-weight="600" fill="#20314B" text-anchor="start">Greatest: UB(P) − LB(Q)</text><text x="180" y="655" font-size="20" font-weight="700" fill="#B4473B" text-anchor="start">2.45 − 0.845 = 1.605 m</text><rect x="820" y="285" width="620" height="410" rx="16" fill="#FBFCFC" stroke="#2D7A78" stroke-width="2"/><text x="860" y="335" font-size="18" font-weight="700" fill="#2D7A78" text-anchor="start">POSSIBLE LENGTHS LEFT</text><path d="M900 500 L1370 500" fill="none" stroke="#0B1F3A" stroke-width="3"/><path d="M920 500 L1350 500" fill="none" stroke="#9A7414" stroke-width="8"/><circle cx="920" cy="500" r="11" fill="white" stroke="#2D7A78" stroke-width="4"/><circle cx="1350" cy="500" r="11" fill="white" stroke="#B4473B" stroke-width="4"/><text x="920" y="550" font-size="19" font-weight="700" fill="#2D7A78" text-anchor="middle">1.495</text><text x="1350" y="550" font-size="19" font-weight="700" fill="#B4473B" text-anchor="middle">1.605</text><text x="1115" y="465" font-size="17" font-weight="700" fill="#9A7414" text-anchor="middle">between the bounds</text><text x="860" y="615" font-size="16" font-weight="600" fill="#20314B" text-anchor="start">Neither endpoint is attained because the</text><text x="860" y="645" font-size="16" font-weight="600" fill="#20314B" text-anchor="start">upper measurement bounds are excluded.</text><rect x="130" y="765" width="1310" height="105" rx="16" fill="#FFF4D6" stroke="#E0C76C" stroke-width="2"/><text x="165" y="805" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="start">Remainder interval: 1.495 m &lt; L &lt; 1.605 m</text><text x="165" y="842" font-size="17" font-weight="600" fill="#20314B" text-anchor="start">85 cm = 0.85 m, so its bound interval is 0.845 ≤ Q &lt; 0.855 m.</text><path d="M60 972H1540" stroke="#CCD6D7" stroke-width="2"/><text x="64" y="1015" font-size="17" fill="#20314B">Marlbridge • Mathematics study resource • check assumptions and context</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>
