700" fill="#315F86">I = k/d²; at d=2, I=18</text><text x="990" y="375" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#168C8C">18 = k/4  →  k = 72</text><path d="M990 410L1380 410" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round"/><text x="990" y="460" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">At d=3: I = 72/9 = 8</text><text x="990" y="505" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">At I=2: d²=36, d=6</text><text x="1185" y="570" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#725C8E">Check: I d² = 72 each time.</text><text x="1185" y="610" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#C44949">Use positive d for distance.</text><text x="760" y="710" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6D80">For inverse-square proportionality, doubling distance makes intensity one quarter as large.</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
