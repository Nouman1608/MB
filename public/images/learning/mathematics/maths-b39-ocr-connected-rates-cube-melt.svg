<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Connected rates for a melting ice cube</title><desc id="desc">A cube melts at three cubic centimetres per minute. At edge length six centimetres, differentiate volume and surface area with respect to edge, then use the chain rule to obtain surface area decrease of two square centimetres per minute.</desc>
<defs><style>.bg{fill:#f3f6f6}.panel{fill:#fff;stroke:#d3dde2;stroke-width:3}.h1{font:700 40px Arial;fill:#10233f}.h2{font:700 25px Arial;fill:#10233f}.body{font:21px Arial;fill:#263f58}.small{font:18px Arial;fill:#5b6d80}.eq{font:700 23px Arial;fill:#16807f}.cube{fill:#d9eef2;stroke:#327b91;stroke-width:4}.cube2{fill:#b6dce5;stroke:#327b91;stroke-width:4}.gold{fill:#fff7dc;stroke:#c9a227;stroke-width:2}.flow{stroke:#16807f;stroke-width:4;fill:none;marker-end:url(#arr)}</style><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#16807f"/></marker></defs>
<rect class="bg" width="1600" height="1000"/><text x="54" y="60" class="h1">Connected rates: follow the chain of changing quantities</text><text x="56" y="98" class="small">OCR A Level Mathematics A • connected rates of change • worked example 8</text>
<rect x="48" y="132" width="650" height="660" rx="18" class="panel"/><text x="80" y="180" class="h2">A cube of ice is melting</text><text x="80" y="220" class="body">Edge length x = 6 cm at this instant</text>
<polygon points="220,360 390,300 540,365 370,430" class="cube"/><polygon points="220,360 370,430 370,620 220,550" class="cube2"/><polygon points="370,430 540,365 540,555 370,620" class="cube"/><path d="M386 431V619" stroke="#327b91" stroke-width="3"/><text x="430" y="530" class="eq">x</text><path d="M355 650C330 676 320 696 320 712" stroke="#327b91" stroke-width="3" fill="none"/><path d="M405 650C430 676 440 696 440 712" stroke="#327b91" stroke-width="3" fill="none"/><text x="230" y="748" class="small">Volume decreases: dV/dt = −3 cm³ min⁻¹</text>
<rect x="740" y="132" width="812" height="660" rx="18" class="panel"/><text x="772" y="180" class="h2">Differentiate, then connect the rates</text><rect x="772" y="212" width="748" height="104" rx="14" class="gold"/><text x="800" y="254" class="eq">V = x³</text><text x="1020" y="254" class="eq">S = 6x²</text><text x="800" y="292" class="small">dV/dx = 3x²   •   dS/dx = 12x</text>
<text x="790" y="374" class="body">Chain rule:   dV/dt = (dV/dx)(dx/dt)</text><text x="790" y="420" class="body">−3 = 3(6)²(dx/dt)   →   dx/dt = −1/36 cm min⁻¹</text><path d="M1110 445V493" class="flow"/><text x="790" y="536" class="body">Now use the surface-area rate:</text><text x="790" y="582" class="body">dS/dt = (dS/dx)(dx/dt)</text><text x="790" y="628" class="eq">= 12(6)(−1/36) = −2 cm² min⁻¹</text><rect x="790" y="676" width="700" height="76" rx="13" fill="#e4f3f1" stroke="#16807f" stroke-width="2"/><text x="820" y="723" class="h2">Surface area decreases at 2 cm² per minute.</text>
<text x="56" y="858" class="small">The negative signs indicate decrease. Keep units with each rate: volume per time, edge per time, surface area per time.</text><text x="56" y="917" class="small">MARLBRIDGE • MATHS • values and method follow the source lesson.</text><text x="1370" y="917" style="font:700 23px Georgia;fill:#10233f">M<tspan fill="#c9a227">B</tspan> MARLBRIDGE</text><path d="M55 941H1545" stroke="#c9a227" stroke-width="3"/><text x="800" y="978" text-anchor="middle" style="font:700 22px Georgia;letter-spacing:9px;fill:#dce4e6">MARLBRIDGE STUDY RESOURCES</text></svg>
