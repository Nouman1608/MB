ll="#C44949" stroke="#FFFFFF" stroke-width="3"/><text x="249" y="607" text-anchor="end" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#C44949">(-3, -2)</text><circle cx="773" cy="406" r="10" fill="#C44949" stroke="#FFFFFF" stroke-width="3"/><text x="787" y="390" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#C44949">(3, 1)</text><text x="525" y="738" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">Curve: (x − y)² + y² = 5     Line: x = 2y + 1</text><rect x="1102" y="164" width="348" height="146" rx="14" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="1128" y="204" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#315F86">Start with the linear equation</text><text x="1128" y="244" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#20314B">x − 2y = 1</text><text x="1128" y="281" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">x = 2y + 1</text><rect x="1102" y="324" width="348" height="166" rx="14" fill="#F4F1E8" stroke="#F4F1E8" stroke-width="2"/><text x="1128" y="364" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#725C8E">Substitute into the quadratic</text><text x="1128" y="404" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">(y+1)² − 2(y+1)y</text><text x="1128" y="440" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">+ 2y² = 5</text><text x="1128" y="474" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">y² + y − 2 = 0</text><rect x="1102" y="504" width="348" height="172" rx="14" fill="#E7F3F1" stroke="#E7F3F1" stroke-width="2"/><text x="1128" y="544" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#168C8C">Two intersections</text><text x="1128" y="584" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#20314B">(y+2)(y−1)=0</text><text x="1128" y="622" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">(x,y) = (−3,−2)</text><text x="1128" y="654" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">or (3,1)</text><text letter-spacing="5" opacity=".075" x="764" y="849" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE STUDY RESOURCES</text><line x1="52" y1="866" x2="1476" y2="866" stroke="#C9A227" stroke-width="2" /><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
