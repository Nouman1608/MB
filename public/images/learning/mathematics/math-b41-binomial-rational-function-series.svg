<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="t"><title id="t">Expand a rational function using partial fractions</title><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#10233F">Expand a rational function using partial fractions</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">Marlbridge • OxfordAQA A-level Mathematics</text><rect x="52" y="128" width="1424" height="680" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="82" y="176" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#10233F">f(x) = (13 + 6x − x²) / ((1 + 3x)(2 − x)²)</text><rect x="90" y="230" width="410" height="145" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="295" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#315F86">1. Split the denominator</text><text x="295" y="316" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#20314B">A/(1 + 3x) + B/(2 − x) + C/(2 − x)²</text><rect x="90" y="410" width="410" height="145" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="295" y="450" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#315F86">2. Solve constants</text><text x="295" y="492" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#20314B">A = 2   •   B = 1   •   C = 3</text><path d="M510 300H620" fill="none" stroke="#C9A227" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="565" y="283" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#C9A227">expand each</text><path d="M510 482H620" fill="none" stroke="#C9A227" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="620" y="225" width="400" height="360" rx="14" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="820" y="266" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233F">3. Expand to x³</text><text x="660" y="320" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#315F86">2/(1 + 3x) = 2 − 6x + 18x² − 54x³</text><text x="660" y="374" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">1/(2 − x) = 1/2 + x/4 + x²/8 + x³/16</text><text x="660" y="428" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#168C8C">3/(2 − x)² = 3/4 + 3x/4</text><text x="660" y="458" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#168C8C">+ 9x²/16 + 3x³/8</text><path d="M660 482H980" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="820" y="530" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#5B6D80">Add like powers</text><path d="M1020 405H1090" fill="none" stroke="#C9A227" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="1090" y="225" width="330" height="360" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="1255" y="268" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233F">Result</text><text x="1120" y="326" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#20314B">f(x) = 13/4</text><text x="1120" y="368" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#315F86">− 5x + 299x²/16</text><text x="1120" y="410" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#315F86">− 857x³/16 + …</text><path d="M1120 448H1390" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1255" y="493" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#5B6D80">Valid when</text><text x="1255" y="536" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#168C8C">|x| &lt; 1/3</text><text x="755" y="685" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6D80">The narrowest component range controls the sum: |3x| &lt; 1.</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
