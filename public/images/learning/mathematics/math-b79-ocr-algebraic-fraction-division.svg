<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img"><title>Simplify division of algebraic fractions</title><desc>Marlbridge • OCR GCSE Mathematics J560 • Multiplying and dividing</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#10233F">Simplify division of algebraic fractions</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">Marlbridge • OCR GCSE Mathematics J560 • Multiplying and dividing</text><rect x="52" y="128" width="1000" height="660" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="1076" y="128" width="400" height="660" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="88" y="174" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">Factor first; invert the divisor; cancel factors</text><text x="88" y="211" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6D80">Example 19 • simplify an algebraic fraction division.</text><rect x="115" y="255" width="870" height="105" rx="14" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="550" y="319" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#10233F">(x² + 5x)/(x² − 4) ÷ (x + 5)/(x + 2)</text><text x="550" y="416" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#315F86">Factor each polynomial</text><rect x="150" y="442" width="800" height="86" rx="12" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="550" y="496" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#20314B">x(x + 5) / [(x − 2)(x + 2)] × (x + 2)/(x + 5)</text><text x="550" y="585" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#725C8E">Cancel common factors only</text><text x="550" y="620" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#C44949">Cancel (x + 2) and (x + 5)</text><text x="550" y="661" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#168C8C">x/(x − 2)</text><rect x="1100" y="164" width="352" height="154" rx="14" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="1126" y="203" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#315F86">Division rule</text><text x="1126" y="245" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">Keep the first fraction.</text><text x="1126" y="284" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">Flip the second; multiply.</text><rect x="1100" y="334" width="352" height="178" rx="14" fill="#F4F1E8" stroke="#F4F1E8" stroke-width="2"/><text x="1126" y="373" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#725C8E">Factor completely</text><text x="1126" y="415" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">x²+5x = x(x+5)</text><text x="1126" y="453" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#20314B">x²−4 = (x−2)(x+2)</text><text x="1126" y="489" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#10233F">Then cancel x+2 and x+5.</text><rect x="1100" y="530" width="352" height="154" rx="14" fill="#E7F3F1" stroke="#E7F3F1" stroke-width="2"/><text x="1126" y="569" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#168C8C">Check the caution</text><text x="1126" y="611" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">Cancel factors, not terms.</text><text x="1126" y="650" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">Final: x/(x−2)</text><text letter-spacing="5" opacity=".075" x="764" y="849" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE STUDY RESOURCES</text><line x1="52" y1="866" x2="1476" y2="866" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
