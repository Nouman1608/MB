<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img"><title>Transformations and vectors: describe fully, prove from shared vectors</title><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#10233F">Transformations and vectors: describe fully, prove from shared vectors</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">Marlbridge • Cambridge IGCSE Mathematics 0580 • Transformations and vectors</text><rect x="52" y="128" width="1424" height="670" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="84" y="178" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">A correct transformation name is only part of a complete answer; vector proofs need a common basis.</text><rect x="80" y="220" width="650" height="430" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="405" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#315F86">Transformation description checklist</text><rect x="110" y="292" width="185" height="54" rx="10" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="202" y="327" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#315F86">Reflection</text><text x="330" y="327" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#5B6D80">→</text><text x="365" y="327" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#20314B">mirror line</text><rect x="110" y="367" width="185" height="54" rx="10" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="202" y="402" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#168C8C">Rotation</text><text x="330" y="402" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#5B6D80">→</text><text x="365" y="402" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#20314B">centre • angle • direction</text><rect x="110" y="442" width="185" height="54" rx="10" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="202" y="477" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#725C8E">Enlargement</text><text x="330" y="477" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#5B6D80">→</text><text x="365" y="477" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#20314B">centre • scale factor</text><rect x="110" y="517" width="185" height="54" rx="10" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="202" y="552" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#C9A227">Translation</text><text x="330" y="552" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#5B6D80">→</text><text x="365" y="552" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#20314B">column vector</text><text x="405" y="630" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#C44949">Extension: negative scale factor → opposite side, inverted</text><rect x="780" y="220" width="645" height="430" rx="14" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="1102" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">Vector proof: one shared basis</text><text x="830" y="320" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#20314B">OA = a, OB = b; M and N are midpoints.</text><text x="830" y="365" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#315F86">OM = ½a       •       ON = ½b</text><text x="830" y="410" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#168C8C">MN = ON − OM = ½(b − a)</text><text x="830" y="455" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#725C8E">AB = OB − OA = b − a</text><path d="M830 480L1375 480" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round"/><text x="1102" y="530" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#10233F">MN = ½AB → parallel</text><text x="1102" y="575" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6D80">Same direction, half the length.</text><text x="1102" y="615" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#C44949">Express vectors in terms of a and b first.</text><text x="760" y="710" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6D80">For vector proofs, compare expressions only after writing both in the same starting vectors.</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
