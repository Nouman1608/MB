<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img"><title>Use ASA to prove opposite sides equal</title><desc>Marlbridge • OCR GCSE Mathematics J560 • Proof 2: ASA</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#10233F">Use ASA to prove opposite sides equal</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">Marlbridge • OCR GCSE Mathematics J560 • Proof 2: ASA</text><rect x="52" y="128" width="1000" height="660" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="1076" y="128" width="400" height="660" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="88" y="174" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">Prove triangle ABC is congruent to triangle CDA</text><text x="88" y="211" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6D80">ABCD is a parallelogram; diagonal AC is common.</text><polygon points="220,300 660,300 770,570 330,570" fill="#315F8610" stroke="#315F86" stroke-width="5"/><line x1="220" y1="300" x2="770" y2="570" stroke="#725C8E" stroke-width="5"/><circle cx="220" cy="300" r="6" fill="#10233F"/><text x="202" y="286" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">A</text><circle cx="660" cy="300" r="6" fill="#10233F"/><text x="675" y="288" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">B</text><circle cx="770" cy="570" r="6" fill="#10233F"/><text x="784" y="594" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">C</text><circle cx="330" cy="570" r="6" fill="#10233F"/><text x="312" y="594" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">D</text><path d="M 256 300 Q 265 325 285 332" fill="none" stroke="#C9A227" stroke-width="4"/><path d="M 728 570 Q 719 545 698 538" fill="none" stroke="#C9A227" stroke-width="4"/><path d="M 735 547 Q 715 532 704 520" fill="none" stroke="#168C8C" stroke-width="4"/><path d="M 252 324 Q 272 340 283 350" fill="none" stroke="#168C8C" stroke-width="4"/><text x="405" y="366" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#315F86">△ ABC</text><text x="576" y="514" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#168C8C">△ CDA</text><text x="440" y="435" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#725C8E">AC = CA</text><rect x="1100" y="164" width="352" height="154" rx="14" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="1126" y="203" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#315F86">Angle pair 1</text><text x="1126" y="245" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#20314B">∠BAC = ∠DCA</text><text x="1126" y="284" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#10233F">Alternate angles (AB ∥ DC)</text><rect x="1100" y="334" width="352" height="178" rx="14" fill="#F4F1E8" stroke="#F4F1E8" stroke-width="2"/><text x="1126" y="373" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#725C8E">Included side</text><text x="1126" y="415" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#20314B">AC = CA</text><text x="1126" y="453" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">Common side</text><text x="1126" y="489" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#168C8C">Angle pair 2: ∠BCA = ∠DAC</text><rect x="1100" y="530" width="352" height="154" rx="14" fill="#E7F3F1" stroke="#E7F3F1" stroke-width="2"/><text x="1126" y="569" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#168C8C">Conclusion</text><text x="1126" y="611" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#20314B">△ABC ≡ △CDA (ASA)</text><text x="1126" y="650" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">Therefore AB = CD.</text><text letter-spacing="5" opacity=".075" x="764" y="849" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE STUDY RESOURCES</text><line x1="52" y1="866" x2="1476" y2="866" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
