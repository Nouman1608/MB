<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="ti de"><title id="ti">Dijkstra's algorithm: shortest path from A to E</title><desc id="de">Positive weighted graph with shortest route A-C-B-D-E of total length 10, and successive settled distances 0,2,3,8,10.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial,sans-serif"><text x="62" y="78" font-size="38" font-weight="700" fill="#0B1F3A" text-anchor="start">Dijkstra's algorithm: shortest path from A to E</text><text x="64" y="124" font-size="21" font-weight="500" fill="#20314B" text-anchor="start">Pearson Edexcel International A Level Mathematics • Decision Mathematics</text><rect x="60" y="165" width="1480" height="755" rx="15" fill="#FFFFFF" stroke="#CCD6D7" stroke-width="2"/><text x="105" y="220" font-size="22" font-weight="700" fill="#0B1F3A" text-anchor="start">At each step, settle the smallest temporary distance and update its neighbours.</text><path d="M220 520L500 330" fill="none" stroke="#9FB3BD" stroke-width="3"/><rect x="336.0" y="406.0" width="48" height="30" rx="7" fill="#FFFFFF" stroke="#CCD6D7" stroke-width="1"/><text x="360.0" y="429.0" font-size="16" font-weight="700" fill="#20314B" text-anchor="middle">4</text><path d="M220 520L500 710" fill="none" stroke="#9FB3BD" stroke-width="3"/><rect x="336.0" y="596.0" width="48" height="30" rx="7" fill="#FFFFFF" stroke="#CCD6D7" stroke-width="1"/><text x="360.0" y="619.0" font-size="16" font-weight="700" fill="#20314B" text-anchor="middle">2</text><path d="M500 710L500 330" fill="none" stroke="#9FB3BD" stroke-width="3"/><rect x="476.0" y="501.0" width="48" height="30" rx="7" fill="#FFFFFF" stroke="#CCD6D7" stroke-width="1"/><text x="500.0" y="524.0" font-size="16" font-weight="700" fill="#20314B" text-anchor="middle">1</text><path d="M500 330L800 330" fill="none" stroke="#9FB3BD" stroke-width="3"/><rect x="626.0" y="311.0" width="48" height="30" rx="7" fill="#FFFFFF" stroke="#CCD6D7" stroke-width="1"/><text x="650.0" y="334.0" font-size="16" font-weight="700" fill="#20314B" text-anchor="middle">5</text><path d="M500 710L800 330" fill="none" stroke="#9FB3BD" stroke-width="3"/><rect x="626.0" y="501.0" width="48" height="30" rx="7" fill="#FFFFFF" stroke="#CCD6D7" stroke-width="1"/><text x="650.0" y="524.0" font-size="16" font-weight="700" fill="#20314B" text-anchor="middle">8</text><path d="M500 710L1070 520" fill="none" stroke="#9FB3BD" stroke-width="3"/><rect x="761.0" y="596.0" width="48" height="30" rx="7" fill="#FFFFFF" stroke="#CCD6D7" stroke-width="1"/><text x="785.0" y="619.0" font-size="16" font-weight="700" fill="#20314B" text-anchor="middle">10</text><path d="M800 330L1070 520" fill="none" stroke="#9FB3BD" stroke-width="3"/><rect x="911.0" y="406.0" width="48" height="30" rx="7" fill="#FFFFFF" stroke="#CCD6D7" stroke-width="1"/><text x="935.0" y="429.0" font-size="16" font-weight="700" fill="#20314B" text-anchor="middle">2</text><path d="M220 520L500 710" fill="none" stroke="#2D7A78" stroke-width="6"/><path d="M500 710L500 330" fill="none" stroke="#2D7A78" stroke-width="6"/><path d="M500 330L800 330" fill="none" stroke="#2D7A78" stroke-width="6"/><path d="M800 330L1070 520" fill="none" stroke="#2D7A78" stroke-width="6"/><rect x="336.0" y="406.0" width="48" height="30" rx="7" fill="#FFFFFF" stroke="#CCD6D7" stroke-width="1"/><text x="360.0" y="429.0" font-size="16" font-weight="700" fill="#20314B" text-anchor="middle">4</text><rect x="336.0" y="596.0" width="48" height="30" rx="7" fill="#FFFFFF" stroke="#CCD6D7" stroke-width="1"/><text x="360.0" y="619.0" font-size="16" font-weight="700" fill="#20314B" text-anchor="middle">2</text><rect x="476.0" y="501.0" width="48" height="30" rx="7" fill="#FFFFFF" stroke="#CCD6D7" stroke-width="1"/><text x="500.0" y="524.0" font-size="16" font-weight="700" fill="#20314B" text-anchor="middle">1</text><rect x="626.0" y="311.0" width="48" height="30" rx="7" fill="#FFFFFF" stroke="#CCD