<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="ti de"><title id="ti">Equilibrium: resolve the three forces at the joint</title><desc id="de">A particle of mass 3 kilograms is suspended by two strings at 35 and 50 degrees from vertical. Arrows show two tensions and weight, with component balance equations.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#315F86"/></marker><marker id="arrR" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#C44949"/></marker></defs><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#10233F">Equilibrium: resolve the three forces at the joint</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#5B6D80">Marlbridge • OxfordAQA International A-level Mathematics 9660 • Statics and forces (M2.3)</text><rect x="52" y="128" width="1424" height="592" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/>,<path d="M260 204H1260" fill="none" stroke="#20314B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />,<text x="760" y="176" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#315F86">Horizontal ceiling • massless strings • equilibrium at the particle</text>,<path d="M760 438L420 192" fill="none" stroke="#315F86" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />,<path d="M760 438L1056 192" fill="none" stroke="#168C8C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />,<path d="M760 438L760 646" fill="none" stroke="#C44949" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />,<circle cx="760" cy="438" r="18" fill="#FFFFFF" stroke="#10233F" stroke-width="4"/>,<text x="760" y="444" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">3 kg</text>,<path d="M740 422L505 261" fill="none" stroke="#315F86" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />,<path d="M740 422L505 261" stroke="#315F86" stroke-width="4" marker-end="url(#arr)"/>,<path d="M780 422L971 261" stroke="#168C8C" stroke-width="4" marker-end="url(#arr)"/>,<path d="M760 459L760 638" stroke="#C44949" stroke-width="4" marker-end="url(#arrR)"/>,<text x="430" y="354" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#315F86">T₁ = 22.6 N</text>,<text x="1085" y="326" text-anchor="end" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#168C8C">T₂ = 16.9 N</text>,<text x="788" y="604" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#C44949">W = mg = 3 × 9.8 = 29.4 N</text>,<path d="M760 322A116 116 0 0 0 694 343" fill="none" stroke="#C9A227" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />,<path d="M760 322A116 116 0 0 1 849 364" fill="none" stroke="#C9A227" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />,<text x="707" y="306" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#C9A227">35°</text>,<text x="826" y="306" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#C9A227">50°</text>,<path d="M760 322V438" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/>,<rect x="1100" y="254" width="330" height="390" rx="14" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/>,<text x="1265" y="294" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">RESOLVE AT THE JOINT</text>,<text x="1265" y="338" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">Horizontal:</text>,<text x="1265" y="369" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">T₁ sin 35° = T₂ sin 50°</text>,<text x="1265" y="416" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">Vertical:</text>,<text x="1265" y="447" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">T₁ cos 35° + T₂ cos 50°</text>,<text x="1265" y="476" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">= 29.4 N</text>,<path d="M1145 501H1385" fill="none" stroke="#C9A227" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />,<text x="1265" y="542" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#315F86">ΣFₓ = 0</text>,<text x="1265" y="573" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#168C8C">ΣFᵧ = 0</text>,<text x="1265" y="612" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">Tension arrows act away from joint.</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE  •  STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
