<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">Momentum in a direct impact</title><desc id="desc">Before impact A travels right at 5 m/s, B left at 4 m/s. After A travels right at 1 m/s, conservation of momentum gives B velocity +2 m/s.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial,sans-serif"><text x="62" y="78" font-size="38" font-weight="700" fill="#0B1F3A" text-anchor="start">Momentum in a direct impact</text><text x="64" y="124" font-size="22" font-weight="500" fill="#20314B" text-anchor="start">Cambridge International AS &amp; A Level Mathematics 9709 • Mechanics</text><rect x="60" y="165" width="1480" height="755" rx="18" fill="#FFFFFF" stroke="#CCD6D7" stroke-width="2"/><text x="105" y="220" font-size="22" font-weight="700" fill="#0B1F3A" text-anchor="start">Choose A’s original direction as positive; momentum is conserved in one dimension.</text><text x="200" y="300" font-size="18" font-weight="700" fill="#397DA4" text-anchor="start">BEFORE IMPACT</text><text x="875" y="300" font-size="18" font-weight="700" fill="#2D7A78" text-anchor="start">AFTER IMPACT</text><path d="M160 510 L720 510" fill="none" stroke="#CCD6D7" stroke-width="3"/><path d="M830 510 L1400 510" fill="none" stroke="#CCD6D7" stroke-width="3"/><rect x="240" y="382" width="170" height="85" rx="14" fill="#E6F0F5" stroke="#397DA4" stroke-width="2"/><text x="325" y="416" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="middle">A • 3 kg</text><text x="325" y="447" font-size="20" font-weight="700" fill="#397DA4" text-anchor="middle">5 m s⁻¹</text><path d="M410 424 L585 424" fill="none" stroke="#397DA4" stroke-width="7"/><polygon points="585.0,424.0 568.0,414.0 568.0,434.0" fill="#397DA4" stroke="#397DA4" stroke-width="1" opacity="1"/><rect x="500" y="553" width="170" height="85" rx="14" fill="#E5F1EF" stroke="#2D7A78" stroke-width="2"/><text x="585" y="587" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="middle">B • 2 kg</text><text x="585" y="618" font-size="20" font-weight="700" fill="#2D7A78" text-anchor="middle">4 m s⁻¹</text><path d="M500 594 L330 594" fill="none" stroke="#2D7A78" stroke-width="7"/><polygon points="330.0,594.0 347.0,584.0 347.0,604.0" fill="#2D7A78" stroke="#2D7A78" stroke-width="1" opacity="1"/><rect x="930" y="382" width="170" height="85" rx="14" fill="#E6F0F5" stroke="#397DA4" stroke-width="2"/><text x="1015" y="416" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="middle">A • 3 kg</text><text x="1015" y="447" font-size="20" font-weight="700" fill="#397DA4" text-anchor="middle">1 m s⁻¹</text><path d="M1100 424 L1220 424" fill="none" stroke="#397DA4" stroke-width="7"/><polygon points="1220.0,424.0 1203.0,414.0 1203.0,434.0" fill="#397DA4" stroke="#397DA4" stroke-width="1" opacity="1"/><rect x="930" y="553" width="170" height="85" rx="14" fill="#E5F1EF" stroke="#2D7A78" stroke-width="2"/><text x="1015" y="587" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="middle">B • 2 kg</text><text x="1015" y="618" font-size="20" font-weight="700" fill="#2D7A78" text-anchor="middle">2 m s⁻¹</text><path d="M1100 594 L1300 594" fill="none" stroke="#2D7A78" stroke-width="7"/><polygon points="1300.0,594.0 1283.0,584.0 1283.0,604.0" fill="#2D7A78" stroke="#2D7A78" stroke-width="1" opacity="1"/><rect x="180" y="700" width="1240" height="130" rx="16" fill="#F5F8FB" stroke="#397DA4" stroke-width="2"/><text x="225" y="745" font-size="19" font-weight="700" fill="#397DA4" text-anchor="start">Initial momentum</text><text x="225" y="788" font-size="22" font-weight="700" fill="#0B1F3A" text-anchor="start">3(5) + 2(−4) = 7 kg m s⁻¹</text><text x="820" y="745" font-size="19" font-weight="700" fill="#2D7A78" text-anchor="start">Final momentum</text><text x="820" y="788" font-size="22" font-weight="700" fill="#0B1F3A" text-anchor="start">3(1) + 2v = 7  →  v = 2 m s⁻¹</text><rect x="120" y="850" width="1330" height="50" rx="14" fill="#FFF4D6" stroke="#E0C76C" stroke-width="2"/><text x="155" y="883" font-size="18" font-weight="700" fill="#0B1F3A" text-anchor="start">B’s velocity is +2 m s⁻¹: after impact it travels in A’s original direction.</text><path d="M60 972 L1540 972" fill="none" stroke="#CCD6D7" stroke-width="2"/><text x="64" y="1015" font-size="17" font-weight="500" fill="#20314B" text-anchor="start">Marlbridge • Mathematics study resource • check assumptions and context</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>