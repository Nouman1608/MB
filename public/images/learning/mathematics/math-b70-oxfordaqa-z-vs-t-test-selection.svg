<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img"><title>Choose between z-tests and t-tests</title><desc>Marlbridge • OxfordAQA International A-level Mathematics 9660 • Choosing the right test</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#10233F">Choose between z-tests and t-tests</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">Marlbridge • OxfordAQA International A-level Mathematics 9660 • Choosing the right test</text><rect x="52" y="128" width="1000" height="660" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="1076" y="128" width="400" height="660" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="88" y="174" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">Choose the test from population shape, σ and sample size</text><text x="88" y="211" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6D80">Start with what the question tells you—not the observed result</text><rect x="340" y="250" width="420" height="74" rx="14" fill="#E8F1F4" stroke="#315F86" stroke-width="2"/><text x="550" y="281" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">Is population σ known?</text><text x="550" y="307" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#5B6D80">(and population normal, or n large)</text><line x1="550" y1="324" x2="550" y2="358" stroke="#10233F" stroke-width="3" /><line x1="355" y1="358" x2="745" y2="358" stroke="#10233F" stroke-width="3" /><line x1="355" y1="358" x2="355" y2="383" stroke="#10233F" stroke-width="3" /><line x1="745" y1="358" x2="745" y2="383" stroke="#10233F" stroke-width="3" /><text x="328" y="377" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#315F86">YES</text><text x="772" y="377" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#725C8E">NO</text><rect x="120" y="390" width="470" height="120" rx="14" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="145" y="430" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#315F86">Use a z-test</text><text x="145" y="466" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">z = (x̄ − μ₀)/(σ/√n)</text><text x="145" y="494" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">Compare with N(0, 1).</text><rect x="600" y="390" width="400" height="120" rx="14" fill="#F4F1E8" stroke="#F4F1E8" stroke-width="2"/><text x="625" y="430" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#725C8E">Is n large?</text><text x="625" y="466" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">YES → approximate z using s</text><text x="625" y="494" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#20314B">NO + normal population → t-test</text><line x1="800" y1="510" x2="800" y2="530" stroke="#10233F" stroke-width="3" /><line x1="700" y1="530" x2="900" y2="530" stroke="#10233F" stroke-width="3" /><line x1="700" y1="530" x2="700" y2="544" stroke="#10233F" stroke-width="3" /><line x1="900" y1="530" x2="900" y2="544" stroke="#10233F" stroke-width="3" /><text x="700" y="562" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#168C8C">LARGE n</text><text x="900" y="562" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#C44949">SMALL n</text><rect x="600" y="570" width="200" height="82" rx="12" fill="#E7F3F1" stroke="#E7F3F1" stroke-width="2"/><text x="700" y="601" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#168C8C">z with s</text><text x="700" y="629" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#20314B">normal approx.</text><rect x="800" y="570" width="200" height="82" rx="12" fill="#F9EEEE" stroke="#F9EEEE" stroke-width="2"/><text x="900" y="601" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#C44949">t-test</text><text x="900" y="629" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#20314B">df = n − 1</text><rect x="120" y="548" width="470" height="116" rx="12" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="145" y="584" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#20314B">If σ is unknown and n is small</text><text x="145" y="620" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">the source requires a normal population.</text><text x="145" y="647" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">Use t = (x̄−μ₀)/(s/√n), df=n−1.</text><rect x="1100" y="164" width="352" height="154" rx="14" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="1126" y="203" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#315F86">Test statistic</text><text x="1126" y="245" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">Standardise the sample mean</text><text x="1126" y="281" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">using its standard error.</text><rect x="1100" y="338" width="352" height="164" rx="14" fill="#F4F1E8" stroke="#F4F1E8" stroke-width="2"/><text x="1126" y="377" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#725C8E">Tail comes from H₁</text><text x="1126" y="419" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">“greater” → upper tail</text><text x="1126" y="455" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">“different” → two tails</text><text x="1126" y="486" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#10233F">Choose H₁ before data.</text><rect x="1100" y="522" width="352" height="152" rx="14" fill="#E7F3F1" stroke="#E7F3F1" stroke-width="2"/><text x="1126" y="561" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#168C8C">Decision wording</text><text x="1126" y="603" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">Reject / do not reject H₀.</text><text x="1126" y="640" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">Do not claim H₀ is proved.</text><text letter-spacing="5" opacity=".075" x="764" y="849" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE STUDY RESOURCES</text><line x1="52" y1="866" x2="1476" y2="866" stroke="#C9A227" stroke-width="2" /><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
