<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="title desc"><defs><marker id="arrN" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#10233F"/></marker><marker id="arrT" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#168C8C"/></marker><marker id="arrG" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#C9A227"/></marker><marker id="arrB" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#315F86"/></marker></defs><title id="title">Parametric equations trace an ellipse</title><desc id="desc">For x=2 sin t+1 and y=3 cos t−2, the identity sin²t+cos²t=1 gives ((x−1)/2)²+((y+2)/3)²=1, an ellipse centred at (1,−2), with horizontal semi-axis 2 and vertical semi-axis 3.</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#10233F">Parametric equations trace an ellipse</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#5B6D80">Marlbridge • Edexcel International A Level Mathematics</text><rect x="52" y="132" width="1424" height="680" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="82" y="178" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">Worked example 2 • x = 2 sin t + 1, y = 3 cos t − 2</text><path d="M185 475L725 475" fill="none" stroke="#D3DCE2" stroke-width="2"  stroke-linecap="round"/><path d="M455 790L455 185" fill="none" stroke="#D3DCE2" stroke-width="2"  stroke-linecap="round"/><ellipse cx="455" cy="475" rx="160" ry="245" fill="#E8F1F4" stroke="#315F86" stroke-width="5"/><path d="M455 475L571.9833327563033 307.85580421453466" fill="none" stroke="#C9A227" stroke-width="3" stroke-dasharray="8 6" stroke-linecap="round"/><circle cx="571.9833327563033" cy="307.85580421453466" r="9" fill="#C44949"/><text x="585.9833327563033" y="299.85580421453466" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#C44949">point for parameter t</text><text x="455" y="483" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">(1, −2)</text><text x="615" y="503" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#315F86">x = 3</text><text x="295" y="503" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#315F86">x = −1</text><text x="468" y="235" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#315F86">y = 1</text><text x="468" y="720" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#315F86">y = −5</text><rect x="850" y="225" width="510" height="360" rx="14" fill="#E8F1F4" stroke="#D3DCE2" stroke-width="2"/><text x="1105" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233F">Eliminate the parameter</text><text x="890" y="328" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#168C8C">sin t = (x − 1)/2</text><text x="890" y="373" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#725C8E">cos t = (y + 2)/3</text><path d="M890 398L1320 398" fill="none" stroke="#D3DCE2" stroke-width="2"  stroke-linecap="round"/><text x="890" y="445" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#20314B">sin²t + cos²t = 1</text><text x="890" y="493" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">((x − 1)/2)² + ((y + 2)/3)² = 1</text><path d="M890 520L1320 520" fill="none" stroke="#D3DCE2" stroke-width="2"  stroke-linecap="round"/><text x="1105" y="562" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#315F86">Centre (1, −2), semi-axes 2 and 3</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE  •  STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
