"white" stroke-width="3"/><text x="160" y="270" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#315F86">start: 85°C</text><circle cx="285" cy="430" r="7" fill="#725C8E" stroke="white" stroke-width="3"/><text x="295" y="420" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#725C8E">5 min: 60°C</text><circle cx="671.1" cy="610" r="7" fill="#C44949" stroke="white" stroke-width="3"/><text x="681.1" y="600" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#C44949">30°C at 19.3 min</text><text x="650" y="292" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#315F86">T(t) = 20 + 65e⁻ᵏᵗ</text><text x="650" y="323" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">k = (1/5) ln(65/40) ≈ 0.0971</text><rect x="1100" y="164" width="352" height="150" rx="14" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="1126" y="203" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#315F86">Temperature difference</text><text x="1126" y="245" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">T − 20 = 65e⁻ᵏᵗ</text><text x="1126" y="282" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">Room temperature is 20°C.</text><rect x="1100" y="332" width="352" height="176" rx="14" fill="#F4F1E8" stroke="#F4F1E8" stroke-width="2"/><text x="1126" y="371" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#725C8E">Use measured point</text><text x="1126" y="413" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">40 = 65e⁻⁵ᵏ</text><text x="1126" y="450" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">k = (1/5)ln(65/40)</text><text x="1126" y="483" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">≈ 0.0971 per minute</text><rect x="1100" y="526" width="352" height="160" rx="14" fill="#E7F3F1" stroke="#E7F3F1" stroke-width="2"/><text x="1126" y="565" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#168C8C">Solve for 30°C</text><text x="1126" y="607" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">10 = 65e⁻ᵏᵗ</text><text x="1126" y="646" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">t = ln(6.5)/k ≈ 19.3 min</text><text letter-spacing="5" opacity=".075" x="764" y="849" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE STUDY RESOURCES</text><line x1="52" y1="866" x2="1476" y2="866" stroke="#C9A227" stroke-width="2" /><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
