<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="title desc"><title id="title">Unequal class widths: histogram height is density</title><desc id="desc">A histogram of 71 phone calls has class boundaries 0, 2, 5, 10, 20 and 40 minutes. Bar heights are frequency densities 3, 5, 4, 1.8 and 0.6; bar areas give frequencies 6, 15, 20, 18 and 12.</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#10233F">Unequal class widths: histogram height is density</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#5B6D80">Marlbridge • Cambridge O Level Mathematics (4024)</text><rect x="52" y="132" width="490" height="670" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="562" y="132" width="914" height="670" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="78" y="174" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">Worked example • 71 phone calls</text><rect x="76" y="206" width="442" height="46" rx="6" fill="#10233F" stroke="#10233F" stroke-width="2"/><text x="94" y="235" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Class (min)</text><text x="265" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">f</text><text x="350" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">width</text><text x="467" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">f ÷ width</text><rect x="76" y="252" width="442" height="64" rx="0" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="94" y="291" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">0–2</text><text x="265" y="291" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">6</text><text x="350" y="291" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">2</text><text x="467" y="291" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#168C8C">3</text><rect x="76" y="316" width="442" height="64" rx="0" fill="#F6F8F9" stroke="#D3DCE2" stroke-width="2"/><text x="94" y="355" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">2–5</text><text x="265" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">15</text><text x="350" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">3</text><text x="467" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#C44949">5</text><rect x="76" y="380" width="442" height="64" rx="0" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="94" y="419" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">5–10</text><text x="265" y="419" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">20</text><text x="350" y="419" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">5</text><text x="467" y="419" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#168C8C">4</text><rect x="76" y="444" width="442" height="64" rx="0" fill="#F6F8F9" stroke="#D3DCE2" stroke-width="2"/><text x="94" y="483" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">10–20</text><text x="265" y="483" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">18</text><text x="350" y="483" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">10</text><text x="467" y="483" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#168C8C">1.8</text><rect x="76" y="508" width="442" height="64" rx="0" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="94" y="547" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">20–40</text><text x="265" y="547" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">12</text><text x="350" y="547" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">20</text><text x="467" y="547" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#168C8C">0.6</text><text x="86" y="610" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">Frequency density = frequency ÷ class width</text><text x="86" y="644" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">Bar area = width × density = frequency</text><text x="86" y="690" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#C44949">Tallest density: 2–5 min (5 calls/min)</text><text x="86" y="720" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#315F86">Largest frequency: 5–10 min (20 calls)</text><text x="86" y="762" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">Bars touch: the time classes are continuous.</text><path d="M636 724L1438 724" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="618" y="729" text-anchor="end" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80