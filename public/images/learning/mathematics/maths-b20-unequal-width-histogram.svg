nt-weight="700" fill="#20314B">3</text><text x="656.05" y="752" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">0</text><text x="656.05" y="773" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#20314B">f=6</text><rect x="676.1" y="275.9230769230769" width="60.150000000000006" height="448.0769230769231" fill="#315F86" fill-opacity=".42" stroke="#315F86" stroke-width="3"/><text x="706.1750000000001" y="265.9230769230769" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#20314B">5</text><text x="706.1750000000001" y="752" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">2</text><text x="706.1750000000001" y="773" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#20314B">f=15</text><rect x="736.25" y="365.53846153846155" width="100.25" height="358.46153846153845" fill="#725C8E" fill-opacity=".42" stroke="#725C8E" stroke-width="3"/><text x="786.375" y="355.53846153846155" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#20314B">4</text><text x="786.375" y="752" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">5</text><text x="786.375" y="773" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#20314B">f=20</text><rect x="836.5" y="562.6923076923076" width="200.5" height="161.30769230769232" fill="#C9A227" fill-opacity=".42" stroke="#C9A227" stroke-width="3"/><text x="936.75" y="552.6923076923076" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#20314B">1.8</text><text x="936.75" y="752" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">10</text><text x="936.75" y="773" text-anchor="middle" font-family="Arial,sans-serif" fo