<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img"><title>Locate a perpendicular foot using a scalar-product condition</title><desc>Marlbridge • OxfordAQA A-level Mathematics 9660 • Worked example 4: foot of the perpendicular</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#10233F">Locate a perpendicular foot using a scalar-product condition</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">Marlbridge • OxfordAQA A-level Mathematics 9660 • Worked example 4: foot of the perpendicular</text><rect x="52" y="128" width="1000" height="660" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="1076" y="128" width="400" height="660" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="88" y="174" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">Find the foot by making the point-to-line vector perpendicular</text><text x="88" y="211" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6D80">Worked example 4 • three-dimensional vector geometry</text><line x1="446" y1="300" x2="560" y2="375" stroke="#10233F" stroke-width="2" /><line x1="446" y1="300" x2="332" y2="375" stroke="#10233F" stroke-width="2" /><line x1="446" y1="300" x2="446" y2="240" stroke="#10233F" stroke-width="2" /><text x="568" y="387" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#10233F">x</text><text x="322" y="388" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#10233F">y</text><text x="454" y="234" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#10233F">z</text><line x1="408" y1="215" x2="408" y2="695" stroke="#315F86" stroke-width="5" /><line x1="446" y1="730" x2="408" y2="535" stroke="#C44949" stroke-width="5" /><line x1="408" y1="375" x2="408" y2="535" stroke="#168C8C" stroke-width="3" stroke-dasharray="6 5"/><circle cx="408" cy="375" r="8" fill="#315F86" stroke="#FFFFFF" stroke-width="3"/><circle cx="408" cy="535" r="10" fill="#C9A227" stroke="#FFFFFF" stroke-width="3"/><circle cx="446" cy="730" r="10" fill="#C44949" stroke="#FFFFFF" stroke-width="3"/><text x="390" y="361" text-anchor="end" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#315F86">A (1, 2, 0)</text><text x="394" y="521" text-anchor="end" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#C9A227">X (5, 6, 2)</text><text x="458" y="754" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#C44949">P (7, 7, −4)</text><text x="780" y="750" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#5B6D80">Oblique 3D projection; perpendicularity is checked algebraically.</text><rect x="1102" y="164" width="348" height="151" rx="14" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="1128" y="204" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#315F86">Point on the line</text><text x="1128" y="244" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">X = (1+2t, 2+2t, t)</text><text x="1128" y="281" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">PX = (2t−6, 2t−5, t+4)</text><rect x="1102" y="329" width="348" height="174" rx="14" fill="#F4F1E8" stroke="#F4F1E8" stroke-width="2"/><text x="1128" y="369" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#725C8E">Set PX · d = 0</text><text x="1128" y="409" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">d = (2, 2, 1)</text><text x="1128" y="445" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">9t − 18 = 0 → t = 2</text><text x="1128" y="479" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">So X = (5, 6, 2)</text><rect x="1102" y="517" width="348" height="160" rx="14" fill="#E7F3F1" stroke="#E7F3F1" stroke-width="2"/><text x="1128" y="557" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#168C8C">Check perpendicularity</text><text x="1128" y="597" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">PX = (−2, −1, 6)</text><text x="1128" y="637" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">(−2,−1,6) · (2,2,1) = 0</text><text x="1128" y="664" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">Projection is not to scale.</text><text letter-spacing="5" opacity=".075" x="764" y="849" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE STUDY RESOURCES</text><line x1="52" y1="866" x2="1476" y2="866" stroke="#C9A227" stroke-width="2" /><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
