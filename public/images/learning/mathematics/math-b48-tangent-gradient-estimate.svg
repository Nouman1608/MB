r="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#168C8C">tangent</text><text x="374" y="504" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#725C8E">(1, 0)</text><text x="604" y="321" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#725C8E">(3, 8)</text><text x="820" y="290" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">Choose two clear points on the tangent:</text><text x="820" y="350" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#315F86">(1, 0) and (3, 8)</text><path d="M820 380L1370 380" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="820" y="440" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#20314B">Gradient ≈ (8 − 0) ÷ (3 − 1)</text><text x="820" y="490" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#168C8C">= 8 ÷ 2 = 4</text><path d="M820 525L1370 525" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="820" y="580" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#5B6D80">The tangent touches the curve locally at P.</text><text x="820" y="615" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#C44949">Use points on the tangent, not on the curve.</text><text x="760" y="705" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6D80">A tangent is a local straight-line estimate of the curve’s gradient at one point.</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
