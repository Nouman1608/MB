<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">Differentiation: locate and classify stationary points</title><desc id="desc">Cubic y=2x3+3x2−36x+10 has local maximum (−3,91) and minimum (2,−34), classified by second derivative.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial,sans-serif" fill="#20314B"><text x="62" y="78" font-size="38" font-weight="700" fill="#0B1F3A">Differentiation: locate and classify stationary points</text><text x="64" y="124" font-size="22">Marlbridge teaching diagram • examples are schematic</text><rect x="60" y="165" width="1480" height="755" rx="18" fill="white" stroke="#CCD6D7" stroke-width="2"/><text x="100" y="225" font-size="22" font-weight="400" fill="#20314B" text-anchor="start">A stationary point satisfies dy/dx = 0; use d²y/dx² to classify it.</text><rect x="100" y="270" width="820" height="500" rx="14" fill="#FBFCFC" stroke="#CCD6D7" stroke-width="2"/><text x="130" y="315" font-size="21" font-weight="700" fill="#0B1F3A" text-anchor="start">y = 2x³ + 3x² − 36x + 10</text><path d="M160 640H870M500 340V715" stroke="#68798A" stroke-width="2"/><path d="M180 625 C245 540 245 430 290 458 C355 500 430 600 500 620 C565 650 615 715 640 708 C730 690 790 575 850 548" fill="none" stroke="#2D7A78" stroke-width="5"/><circle cx="290" cy="458" r="8" fill="#C9A227"/><circle cx="640" cy="708" r="8" fill="#C9A227"/><circle cx="500" cy="620" r="6" fill="#397DA4"/><text x="280" y="435" font-size="17" font-weight="700" fill="#0B1F3A" text-anchor="middle">(−3, 91) maximum</text><text x="650" y="745" font-size="17" font-weight="700" fill="#0B1F3A" text-anchor="middle">(2, −34) minimum</text><text x="515" y="610" font-size="15" font-weight="400" fill="#397DA4" text-anchor="start">y-intercept (0,10)</text><text x="500" y="680" font-size="14" font-weight="400" fill="#596B7E" text-anchor="middle">0</text><rect x="970" y="270" width="470" height="500" rx="14" fill="#E7EFED" stroke="#2D7A78" stroke-width="2"/><text x="1000" y="320" font-size="22" font-weight="700" fill="#0B1F3A" text-anchor="start">Differentiate and test</text><text x="1000" y="380" font-size="18" font-weight="700" fill="#2D7A78" text-anchor="start">dy/dx = 6(x + 3)(x − 2)</text><text x="1000" y="425" font-size="17" font-weight="400" fill="#20314B" text-anchor="start">Stationary x-values: −3 and 2</text><text x="1000" y="495" font-size="17" font-weight="400" fill="#20314B" text-anchor="start">At x = −3: d²y/dx² = −30</text><text x="1000" y="530" font-size="17" font-weight="700" fill="#20314B" text-anchor="start">Negative → local maximum</text><text x="1000" y="595" font-size="17" font-weight="400" fill="#20314B" text-anchor="start">At x = 2: d²y/dx² = 30</text><text x="1000" y="630" font-size="17" font-weight="700" fill="#20314B" text-anchor="start">Positive → local minimum</text><text x="1000" y="710" font-size="17" font-weight="700" fill="#0B1F3A" text-anchor="start">Always report the coordinates.</text><rect x="100" y="810" width="1340" height="60" rx="14" fill="#FFF4D6" stroke="#E0C76C" stroke-width="2"/><text x="125" y="849" font-size="17" font-weight="700" fill="#0B1F3A" text-anchor="start">Sketch is schematic; coordinates and classification are exact.</text><path d="M60 972H1540" stroke="#CCD6D7" stroke-width="2"/><text x="64" y="1015" font-size="17">Marlbridge • study diagram • check assumptions and context</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>
