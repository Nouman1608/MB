<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">Surds: simplify products and rationalise</title><desc id="desc">Exact surd calculations: square factors simplify square roots and multiplying by root five rationalises 15 over root five to 3 root five.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial,sans-serif"><text x="62.0" y="78.0" font-size="38" font-weight="700" fill="#0B1F3A" text-anchor="start">Surds: simplify products and rationalise</text><text x="64.0" y="124.0" font-size="21" font-weight="500" fill="#20314B" text-anchor="start">AQA GCSE Mathematics 8300 • Higher tier exact calculation</text><rect x="60" y="165" width="1480" height="755" rx="18" fill="#FFFFFF" stroke="#CCD6D7" stroke-width="2"/><text x="100.0" y="215.0" font-size="21" font-weight="700" fill="#0B1F3A" text-anchor="start">Keep exact values exact: take out square factors, then rationalise denominators.</text><rect x="130" y="285" width="1340" height="150" rx="16" fill="#F5F8FB" stroke="#397DA4" stroke-width="2"/><text x="180.0" y="333.0" font-size="18" font-weight="700" fill="#397DA4" text-anchor="start">1   Multiply under one radical</text><text x="180.0" y="385.0" font-size="25" font-weight="700" fill="#0B1F3A" text-anchor="start">√20 × √15 = √300 = √(100 × 3) = 10√3</text><text x="180.0" y="418.0" font-size="16" font-weight="500" fill="#667888" text-anchor="start">The largest square factor of 300 is 100.</text><rect x="130" y="470" width="1340" height="150" rx="16" fill="#F4F8F7" stroke="#2D7A78" stroke-width="2"/><text x="180.0" y="518.0" font-size="18" font-weight="700" fill="#2D7A78" text-anchor="start">2   Simplify a single surd</text><text x="180.0" y="570.0" font-size="25" font-weight="700" fill="#0B1F3A" text-anchor="start">√98 = √(49 × 2) = 7√2</text><text x="180.0" y="603.0" font-size="16" font-weight="500" fill="#667888" text-anchor="start">√98 is not 9.8: the exact form is irrational.</text><rect x="130" y="655" width="1340" height="150" rx="16" fill="#FFF9E9" stroke="#C9A227" stroke-width="2"/><text x="180.0" y="703.0" font-size="18" font-weight="700" fill="#C9A227" text-anchor="start">3   Rationalise the denominator</text><text x="180.0" y="755.0" font-size="24" font-weight="700" fill="#0B1F3A" text-anchor="start">15/√5 × √5/√5 = 15√5/5 = 3√5</text><text x="180.0" y="788.0" font-size="16" font-weight="500" fill="#667888" text-anchor="start">Multiply numerator and denominator by the same surd.</text><rect x="120" y="835" width="1330" height="54" rx="14" fill="#EAF2F3" stroke="#CCD6D7" stroke-width="2"/><text x="155.0" y="870.0" font-size="18" font-weight="700" fill="#0B1F3A" text-anchor="start">Check by reversing the steps: (10√3)² = 300 and (3√5)² = 45.</text><path d="M60.0 972.0L1540.0 972.0" fill="none" stroke="#CCD6D7" stroke-width="2"/><text x="64.0" y="1015.0" font-size="17" font-weight="500" fill="#20314B" text-anchor="start">Marlbridge • Mathematics study resource • check assumptions and context</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>