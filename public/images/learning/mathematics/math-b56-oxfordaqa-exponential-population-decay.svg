ly="Arial,sans-serif" font-size="16" font-weight="700" fill="#168C8C">At year 10</text><text x="1100" y="414" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">18,000 × 0.976¹⁰ ≈ 14,118</text><text x="1100" y="442" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">still above 14,000</text><rect x="1076" y="472" width="376" height="120" rx="12" fill="#F9EEEE" stroke="#F9EEEE" stroke-width="2"/><text x="1100" y="512" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#C44949">At year 11</text><text x="1100" y="550" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">18,000 × 0.976¹¹ ≈ 13,779</text><text x="1100" y="578" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">now below 14,000</text><text x="1264" y="664" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#5B6D80">A fixed percentage change repeats</text><text x="1264" y="687" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#5B6D80">the same multiplier, not same amount.</text><text letter-spacing="5" opacity=".075" x="764" y="849" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE STUDY RESOURCES</text><line x1="52" y1="866" x2="1476" y2="866" stroke="#C9A227" stroke-width="2" /><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
