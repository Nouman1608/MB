<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">AQA overarching themes: the modelling and problem-solving cycle</title><desc id="desc">A five-stage cycle connects defining, modelling, solving, checking and refining, returning to the model when evidence fails.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial,sans-serif" fill="#20314B"><text x="62" y="78" font-size="38" font-weight="700" fill="#0B1F3A">AQA overarching themes: the modelling and problem-solving cycle</text><text x="64" y="124" font-size="22">Marlbridge Mathematics • teaching diagram</text><rect x="60" y="165" width="1480" height="755" rx="18" fill="white" stroke="#CCD6D7" stroke-width="2"/><text x="110" y="225" font-size="22" font-weight="400" fill="#20314B" text-anchor="start">A mathematical solution is a loop: assumptions and evidence can send you back to the model.</text><rect x="220" y="330" width="330" height="150" rx="16" fill="#FBFCFC" stroke="#9DB9D5" stroke-width="2"/><text x="385" y="368" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="middle">1  DEFINE</text><text x="385" y="412" font-size="17" font-weight="700" fill="#2D7A78" text-anchor="middle">What is asked?</text><text x="385" y="450" font-size="15" font-weight="400" fill="#596B7E" text-anchor="middle">identify quantities</text><rect x="660" y="270" width="330" height="150" rx="16" fill="#FBFCFC" stroke="#9DB9D5" stroke-width="2"/><text x="825" y="308" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="middle">2  MODEL</text><text x="825" y="352" font-size="17" font-weight="700" fill="#2D7A78" text-anchor="middle">state assumptions</text><text x="825" y="390" font-size="15" font-weight="400" fill="#596B7E" text-anchor="middle">choose variables</text><rect x="1080" y="360" width="330" height="150" rx="16" fill="#FBFCFC" stroke="#9DB9D5" stroke-width="2"/><text x="1245" y="398" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="middle">3  SOLVE</text><text x="1245" y="442" font-size="17" font-weight="700" fill="#2D7A78" text-anchor="middle">use mathematics</text><text x="1245" y="480" font-size="15" font-weight="400" fill="#596B7E" text-anchor="middle">show reasoning</text><rect x="1030" y="650" width="330" height="150" rx="16" fill="#FBFCFC" stroke="#9DB9D5" stroke-width="2"/><text x="1195" y="688" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="middle">4  CHECK</text><text x="1195" y="732" font-size="17" font-weight="700" fill="#2D7A78" text-anchor="middle">units • bounds • sense</text><text x="1195" y="770" font-size="15" font-weight="400" fill="#596B7E" text-anchor="middle">test against context</text><rect x="530" y="700" width="330" height="150" rx="16" fill="#FBFCFC" stroke="#9DB9D5" stroke-width="2"/><text x="695" y="738" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="middle">5  REFINE</text><text x="695" y="782" font-size="17" font-weight="700" fill="#2D7A78" text-anchor="middle">revise if needed</text><text x="695" y="820" font-size="15" font-weight="400" fill="#596B7E" text-anchor="middle">explain limitations</text><path d="M550 355 Q615 305 660 335 M990 340 Q1060 315 1080 360 M1240 510 Q1260 605 1180 650 M1030 730 Q820 830 700 775 M530 760 Q300 715 300 480" fill="none" stroke="#2D7A78" stroke-width="4" marker-end="url(#loop)"/><defs><marker id="loop" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0L0,6L9,3z" fill="#2D7A78"/></marker></defs><text x="800" y="540" font-size="18" font-weight="700" fill="#9A7414" text-anchor="middle">Evidence</text><text x="800" y="575" font-size="16" font-weight="400" fill="#596B7E" text-anchor="middle">supports?</text><rect x="100" y="865" width="1340" height="42" rx="16" fill="#FFF4D6" stroke="#E0C76C" stroke-width="2"/><text x="125" y="894" font-size="16" font-weight="700" fill="#0B1F3A" text-anchor="start">A model is useful only within the conditions and data that support it.</text><path d="M60 972H1540" stroke="#CCD6D7" stroke-width="2"/><text x="64" y="1015" font-size="17">Marlbridge • Mathematics study resource • check assumptions and context</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>
