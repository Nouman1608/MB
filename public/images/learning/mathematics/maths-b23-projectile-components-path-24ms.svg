<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="title desc"><defs><marker id="arrN" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#10233F"/></marker><marker id="arrT" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#168C8C"/></marker><marker id="arrG" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#C9A227"/></marker><marker id="arrB" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#315F86"/></marker></defs><title id="title">Projectile motion: horizontal and vertical parts</title><desc id="desc">A ball is projected from level ground at 24.5 m s⁻¹ with sin α=0.6 and cos α=0.8. Thus uₓ=19.6 and uᵧ=14.7 m s⁻¹. With g=9.8 m s⁻², flight time is 3 s, range is 58.8 m and maximum height is about 11.0 m.</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#10233F">Projectile motion: horizontal and vertical parts</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#5B6D80">Marlbridge • Edexcel International A Level Mathematics</text><rect x="52" y="132" width="1424" height="680" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="82" y="178" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">Source Worked Example 3 • level-ground launch</text><path d="M190 700L190 460" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="190" y="722" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">0</text><path d="M252.5 700L252.5 460" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="252.5" y="722" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">5</text><path d="M315 700L315 460" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="315" y="722" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">10</text><path d="M377.5 700L377.5 460" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="377.5" y="722" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">15</text><path d="M440 700L440 460" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="440" y="722" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">20</text><path d="M502.5 700L502.5 460" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="502.5" y="722" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">25</text><path d="M565 700L565 460" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="565" y="722" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">30</text><path d="M627.5 700L627.5 460" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="627.5" y="722" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">35</text><path d="M690 700L690 460" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="690" y="722" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">40</text><path d="M752.5 700L752.5 460" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="752.5" y="722" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">45</text><path d="M815 700L815 460" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="815" y="722" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">50</text><path d="M877.5 700L877.5 460" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="877.5" y="722" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">55</text><path d="M940 700L940 460" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="940" y="722" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">60</text><path d="M1002.5 700L1002.5 460" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="1002.5" y="722" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">65</text><path d="M190 700L1002.5 700" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="174" y="705" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">0</text><path d="M190 660L1002.5 660" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="174" y="665" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">2</text><path d="M190 620L1002.5 620" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="174" y="625" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">4</text><path d="M190 580L1002.5 580" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="174" y="585" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">6</text><path d="M190 540L1002.5 540" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="174" y="545" text-anchor="end" font-family="Arial,sans-serif