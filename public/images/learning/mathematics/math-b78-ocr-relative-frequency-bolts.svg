<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940"><title>Estimate faulty bolts using relative frequency</title><desc>Marlbridge • OCR GCSE Mathematics J560 • 11.01c: Relative frequency as an estimate of probability</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#10233F">Estimate faulty bolts using relative frequency</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">Marlbridge • OCR GCSE Mathematics J560 • 11.01c: Relative frequency as an estimate of probability</text><rect x="52" y="128" width="1000" height="660" rx="14" fill="#FFF" stroke="#D3DCE2" stroke-width="2"/><rect x="1076" y="128" width="400" height="660" rx="14" fill="#FFF" stroke="#D3DCE2" stroke-width="2"/><text x="88" y="174" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">Use an experimental proportion to estimate a larger delivery</text><text x="88" y="211" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6D80">Worked example 8 • 18 faulty bolts among 500 tested</text><rect x="110" y="280" width="280" height="210" rx="14" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="250" y="322" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#315F86">TEST SAMPLE</text><text x="250" y="375" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#10233F">500 bolts</text><text x="250" y="422" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#C44949">18 faulty</text><text x="250" y="465" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#20314B">18 ÷ 500 = 0.036</text><rect x="430" y="280" width="250" height="210" rx="14" fill="#F4F1E8" stroke="#F4F1E8" stroke-width="2"/><text x="555" y="322" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#725C8E">ESTIMATED RATE</text><rect x="472" y="360" width="166" height="44" rx="8" fill="#FFF" stroke="#D3DCE2" stroke-width="2"/><rect x="472" y="360" width="5.976" height="44" rx="8" fill="#C44949" stroke="#C44949" stroke-width="2"/><text x="555" y="437" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#10233F">0.036 = 3.6%</text><text x="555" y="474" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#5B6D80">per bolt</text><rect x="720" y="280" width="278" height="210" rx="14" fill="#E7F3F1" stroke="#E7F3F1" stroke-width="2"/><text x="859" y="322" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#168C8C">DELIVERY</text><text x="859" y="375" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#10233F">3000 bolts</text><text x="859" y="422" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#20314B">3000 × 0.036</text><text x="859" y="465" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#C44949">= 108 expected</text><line x1="394" y1="380" x2="422" y2="380" stroke="#315F86" stroke-width="3" /><text x="408" y="362" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="600" fill="#315F86">proportion</text><line x1="686" y1="380" x2="712" y2="380" stroke="#168C8C" stroke-width="3" /><text x="699" y="362" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="600" fill="#168C8C">scale up</text><rect x="110" y="560" width="888" height="116" rx="14" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="140" y="603" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#315F86">Relative frequency estimates probability from observed results.</text><text x="140" y="645" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#10233F">Expected count = estimate × new sample size = 0.036 × 3000 = 108.</text><rect x="1100" y="164" width="352" height="154" rx="14" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="1126" y="203" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#315F86">Estimate probability</text><text x="1126" y="245" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#20314B">18 ÷ 500 = 0.036</text><text x="1126" y="284" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">Use as an estimate.</text><rect x="1100" y="344" width="352" height="154" rx="14" fill="#F4F1E8" stroke="#F4F1E8" stroke-width="2"/><text x="1126" y="383" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#725C8E">Scale to 3000</text><text x="1126" y="425" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#20314B">0.036 × 3000</text><text x="1126" y="464" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">= 108 expected</text><rect x="1100" y="524" width="352" height="154" rx="14" fill="#E7F3F1" stroke="#E7F3F1" stroke-width="2"/><text x="1126" y="563" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#168C8C">Interpret carefully</text><text x="1126" y="605" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">Expected does not mean</text><text x="1126" y="644" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">exactly 108 every time.</text><text letter-spacing="5" opacity=".075" x="764" y="849" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE STUDY RESOURCES</text><line x1="52" y1="866" x2="1476" y2="866" stroke="#C9A227" stroke-width="2" /><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
