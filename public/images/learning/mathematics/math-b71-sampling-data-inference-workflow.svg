<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img"><title>Sampling and data: from population to inference</title><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#10233F">Sampling and data: from population to inference</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">Marlbridge • OCR A Level Mathematics A H240 • Statistics • sampling, inference and single-variable data</text><rect x="52" y="128" width="1424" height="670" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="84" y="178" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233F">Sampling gives evidence about a population, not certainty about every member.</text><rect x="85" y="220" width="650" height="430" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="410" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#315F86">From population to cautious inference</text><rect x="150" y="310" width="520" height="74" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="410" y="338" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#315F86">POPULATION</text><text x="410" y="365" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#10233F">900 season-ticket holders</text><text x="410" y="402" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#C9A227">↓</text><rect x="150" y="410" width="520" height="74" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="410" y="438" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#168C8C">SAMPLE</text><text x="410" y="465" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#10233F">Ask 60; 21 say yes</text><text x="410" y="502" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#C9A227">↓</text><rect x="150" y="510" width="520" height="74" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="410" y="538" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#725C8E">ESTIMATE</text><text x="410" y="565" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#10233F">21/60 × 900 = 315</text><text x="410" y="622" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#C44949">A second sample of 15/60 estimates 225.</text><rect x="785" y="220" width="640" height="430" rx="14" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="1105" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">Follow the data cycle</text><rect x="835" y="310" width="230" height="92" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="950" y="345" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#315F86">1  SELECT</text><text x="950" y="375" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">frame • method</text><rect x="1140" y="310" width="230" height="92" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="1255" y="345" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#168C8C">2  SUMMARISE</text><text x="1255" y="375" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">tables • graphs</text><rect x="1140" y="470" width="230" height="92" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="1255" y="505" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#725C8E">3  INTERPRET</text><text x="1255" y="535" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#20314B">mean • median • spread</text><rect x="835" y="470" width="230" height="92" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="950" y="505" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#C44949">4  CHECK</text><text x="950" y="535" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">outliers • errors</text><path d="M1065 355L1140 355" fill="none" stroke="#C9A227" stroke-width="3" stroke-linecap="round"/><path d="M1255 402L1255 470" fill="none" stroke="#C9A227" stroke-width="3" stroke-linecap="round"/><path d="M1140 516L1065 516" fill="none" stroke="#C9A227" stroke-width="3" stroke-linecap="round"/><path d="M950 470L950 402" fill="none" stroke="#C9A227" stroke-width="3" stroke-linecap="round"/><text x="1105" y="615" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#5B6D80">Different samples may produce different estimates.</text><text x="760" y="710" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#5B6D80">Use a suitable sampling method, interpret diagrams and summary statistics, and check possible outliers or data errors.</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
