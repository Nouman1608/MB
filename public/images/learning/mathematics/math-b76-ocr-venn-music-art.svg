<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img"><title>Complete a two-set Venn diagram</title><desc>Marlbridge • OCR GCSE Mathematics J560 • Drawing a two-circle Venn diagram</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#10233F">Complete a two-set Venn diagram</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">Marlbridge • OCR GCSE Mathematics J560 • Drawing a two-circle Venn diagram</text><rect x="52" y="128" width="1000" height="660" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="1076" y="128" width="400" height="660" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="88" y="174" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">Fill the overlap first, then complete each region</text><text x="88" y="211" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6D80">Example 8 • 40 learners, music and art</text><rect x="160" y="260" width="720" height="400" rx="8" fill="#E8F1F4" stroke="#D3DCE2" stroke-width="2"/><text x="190" y="295" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">All 40 learners</text><circle cx="450" cy="450" r="155" fill="#315F8622" stroke="#315F86" stroke-width="4"/><circle cx="620" cy="450" r="155" fill="#168C8C22" stroke="#168C8C" stroke-width="4"/><text x="367" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#315F86">Music</text><text x="705" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#168C8C">Art</text><text x="402" y="458" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#10233F">15</text><text x="535" y="458" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#725C8E">9</text><text x="670" y="458" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#10233F">8</text><text x="820" y="575" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#10233F">8</text><text x="402" y="493" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#5B6D80">music only</text><text x="535" y="493" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#5B6D80">both</text><text x="670" y="493" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#5B6D80">art only</text><text x="820" y="610" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#5B6D80">neither</text><rect x="1100" y="164" width="352" height="154" rx="14" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="1126" y="203" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#315F86">Start with the overlap</text><text x="1126" y="245" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#20314B">Both = 9</text><text x="1126" y="284" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">Music only = 24−9=15</text><rect x="1100" y="334" width="352" height="178" rx="14" fill="#F4F1E8" stroke="#F4F1E8" stroke-width="2"/><text x="1126" y="373" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#725C8E">Complete remaining regions</text><text x="1126" y="415" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">Art only = 17−9=8</text><text x="1126" y="453" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#20314B">Neither = 40−(15+9+8)</text><text x="1126" y="489" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">= 8</text><rect x="1100" y="530" width="352" height="154" rx="14" fill="#E7F3F1" stroke="#E7F3F1" stroke-width="2"/><text x="1126" y="569" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#168C8C">Probability: art only</text><text x="1126" y="611" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">8 of 40 learners</text><text x="1126" y="650" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">P = 8/40 = 1/5</text><text letter-spacing="5" opacity=".075" x="764" y="849" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE STUDY RESOURCES</text><line x1="52" y1="866" x2="1476" y2="866" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
