<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img"><title>Find the perimeter of a composite window</title><desc>Marlbridge • OCR GCSE Mathematics J560 • 10.02c Perimeter of composite shapes</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#10233F">Find the perimeter of a composite window</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">Marlbridge • OCR GCSE Mathematics J560 • 10.02c Perimeter of composite shapes</text><rect x="52" y="128" width="1000" height="660" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="1076" y="128" width="400" height="660" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="88" y="174" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">Count only the exposed edges of a composite shape</text><text x="88" y="211" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6D80">Worked example 15 • rectangular window with semicircular top</text><path d="M 400 550 L 400 380 A 135 135 0 0 1 670 380 L 670 550 Z" fill="#E8F1F4" stroke="#315F86" stroke-width="5"/><line x1="400" y1="572" x2="670" y2="572" stroke="#10233F" stroke-width="2"/><line x1="400" y1="562" x2="400" y2="582" stroke="#10233F" stroke-width="2"/><line x1="670" y1="562" x2="670" y2="582" stroke="#10233F" stroke-width="2"/><text x="535" y="594" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">1.2 m bottom edge</text><line x1="376" y1="380" x2="376" y2="550" stroke="#10233F" stroke-width="2"/><line x1="366" y1="380" x2="386" y2="380" stroke="#10233F" stroke-width="2"/><line x1="366" y1="550" x2="386" y2="550" stroke="#10233F" stroke-width="2"/><text x="359" y="473" text-anchor="end" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">1.5 m</text><text x="535" y="356" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#725C8E">semicircle: diameter 1.2 m</text><line x1="535" y1="380" x2="535" y2="250" stroke="#725C8E" stroke-width="2" stroke-dasharray="6 5"/><text x="550" y="320" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#725C8E">radius 0.6 m</text><line x1="400" y1="550" x2="670" y2="550" stroke="#C44949" stroke-width="7"/><line x1="400" y1="380" x2="400" y2="550" stroke="#168C8C" stroke-width="7"/><line x1="670" y1="380" x2="670" y2="550" stroke="#168C8C" stroke-width="7"/><rect x="88" y="600" width="280" height="145" rx="12" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="108" y="635" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#315F86">Exposed straight lengths</text><text x="108" y="674" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">1.2 + 2 × 1.5</text><text x="108" y="708" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">= 4.2 m</text><rect x="390" y="600" width="280" height="145" rx="12" fill="#F4F1E8" stroke="#F4F1E8" stroke-width="2"/><text x="410" y="635" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#725C8E">Curved edge only</text><text x="410" y="674" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">½π(1.2) = 1.885… m</text><rect x="692" y="600" width="300" height="145" rx="12" fill="#E7F3F1" stroke="#E7F3F1" stroke-width="2"/><text x="712" y="635" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#168C8C">Outside perimeter</text><text x="712" y="674" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">4.2 + 1.885…</text><text x="712" y="708" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">= 6.08 m (3 s.f.)</text><rect x="1100" y="164" width="352" height="154" rx="14" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="1126" y="203" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#315F86">Leave out the join</text><text x="1126" y="245" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">The rectangle top is inside</text><text x="1126" y="282" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">the composite shape.</text><rect x="1100" y="334" width="352" height="164" rx="14" fill="#F4F1E8" stroke="#F4F1E8" stroke-width="2"/><text x="1126" y="373" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#725C8E">Add only outside edges</text><text x="1126" y="415" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">1.2 + 1.5 + 1.5 metres</text><text x="1126" y="455" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">plus the semicircle arc.</text><rect x="1100" y="518" width="352" height="150" rx="14" fill="#E7F3F1" stroke="#E7F3F1" stroke-width="2"/><text x="1126" y="557" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#168C8C">Keep units consistent</text><text x="1126" y="601" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">All lengths are metres.</text><text x="1126" y="640" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">Perimeter is a length.</text><text letter-spacing="5" opacity=".075" x="764" y="849" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE STUDY RESOURCES</text><line x1="52" y1="866" x2="1476" y2="866" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
