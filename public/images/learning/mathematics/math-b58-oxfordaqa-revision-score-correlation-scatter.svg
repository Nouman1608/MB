<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img"><title>Interpret strong positive correlation and a line of best fit</title><desc>Marlbridge • OxfordAQA International GCSE Mathematics 9260 • Worked example 5</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#10233F">Interpret strong positive correlation and a line of best fit</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">Marlbridge • OxfordAQA International GCSE Mathematics 9260 • Worked example 5</text><rect x="52" y="128" width="1002" height="660" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="1078" y="128" width="398" height="660" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="88" y="174" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">Plot the data, then place one straight line through the trend</text><text x="88" y="211" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6D80">Revision hours and test score • n = 10 pupils</text><line x1="160" y1="690" x2="898" y2="690" stroke="#10233F" stroke-width="3" /><line x1="160" y1="690" x2="160" y2="330" stroke="#10233F" stroke-width="3" /><line x1="160" y1="685" x2="160" y2="695" stroke="#10233F" stroke-width="2" /><text x="160" y="715" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">0</text><line x1="324" y1="685" x2="324" y2="695" stroke="#10233F" stroke-width="2" /><text x="324" y="715" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">2</text><line x1="488" y1="685" x2="488" y2="695" stroke="#10233F" stroke-width="2" /><text x="488" y="715" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">4</text><line x1="652" y1="685" x2="652" y2="695" stroke="#10233F" stroke-width="2" /><text x="652" y="715" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">6</text><line x1="816" y1="685" x2="816" y2="695" stroke="#10233F" stroke-width="2" /><text x="816" y="715" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">8</text><line x1="160" y1="690" x2="898" y2="690" stroke="#D3DCE2" stroke-width="1" stroke-dasharray="4 6"/><text x="146" y="695" text-anchor="end" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">30</text><line x1="160" y1="630" x2="898" y2="630" stroke="#D3DCE2" stroke-width="1" stroke-dasharray="4 6"/><text x="146" y="635" text-anchor="end" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">40</text><line x1="160" y1="570" x2="898" y2="570" stroke="#D3DCE2" stroke-width="1" stroke-dasharray="4 6"/><text x="146" y="575" text-anchor="end" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">50</text><line x1="160" y1="510" x2="898" y2="510" stroke="#D3DCE2" stroke-width="1" stroke-dasharray="4 6"/><text x="146" y="515" text-anchor="end" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">60</text><line x1="160" y1="450" x2="898" y2="450" stroke="#D3DCE2" stroke-width="1" stroke-dasharray="4 6"/><text x="146" y="455" text-anchor="end" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">70</text><line x1="160" y1="390" x2="898" y2="390" stroke="#D3DCE2" stroke-width="1" stroke-dasharray="4 6"/><text x="146" y="395" text-anchor="end" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">80</text><line x1="160" y1="330" x2="898" y2="330" stroke="#D3DCE2" stroke-width="1" stroke-dasharray="4 6"/><text x="146" y="335" text-anchor="end" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">90</text><text x="536" y="752" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">Revision hours (x)</text><text x="104" y="450" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">Test score</text><circle cx="242" cy="642" r="7" fill="#315F86" stroke="white" stroke-width="2"/><circle cx="324" cy="600" r="7" fill="#315F86" stroke="white" stroke-width="2"/><circle cx="324" cy="624" r="7" fill="#315F86" stroke="white" stroke-width="2"/><circle cx="406" cy="558" r="7" fill="#315F86" stroke="white" stroke-width="2"/><circle cx="488" cy="540" r="7" fill="#315F86" stroke="white" stroke-width="2"/><circle cx="570" cy="510" r="7" fill="#315F86" stroke="white" stroke-width="2"/><circle cx="570" cy="474" r="7" fill="#315F86" stroke="white" stroke-width="2"/><circle cx="652" cy="462" r="7" fill="#315F86" stroke="white" stroke-width="2"/><circle cx="734" cy="420" r="7" fill="#315F86" stroke="white" stroke-width="2"/><circle cx="816" cy="396" r="7" fill="#315F86" stroke="white" stroke-width="2"/><line x1="242" y1="642" x2="816" y2="390" stroke="#C44949" stroke-width="4" /><circle cx="512.5999999999999" cy="522.6" r="9" fill="#C9A227" stroke="white" stroke-width="3"/><text x="526.5999999999999" y="508.6" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#C9A227">mean (4.3, 57.9)</text><text x="708" y="310" text-anchor="end" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#C44949">Example best-fit: y = 6x + 32</text><text x="572" y="784" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#5B6D80">Strong positive association; correlation alone does not prove cause.</text><text x="1102" y="177" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">What the graph supports</text><rect x="1100" y="215" width="354" height="124" rx="12" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="1124" y="255" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#315F86">Points rise left to right</text><text x="1124" y="293" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">Strong positive correlation</text><text x="1124" y="320" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">as revision hours increase.</text><rect x="1100" y="357" width="354" height="154" rx="12" fill="#F4F1E8" stroke="#F4F1E8" stroke-width="2"/><text x="1124" y="396" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#C9A227">Mean point</text><text x="1124" y="435" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">(4.3, 57.9)</text><text x="1124" y="469" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">The line passes very near it.</text><text x="1124" y="495" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">Roughly equal points above/below.</text><rect x="1100" y="529" width="354" height="174" rx="12" fill="#F9EEEE" stroke="#F9EEEE" stroke-width="2"/><text x="1124" y="568" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#C44949">Read the line with care</text><text x="1124" y="607" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#20314B">Gradient ≈ 6 marks/hour</text><text x="1124" y="642" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">At 12 hours the line predicts 104,</text><text x="1124" y="669" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">impossible on a /100 test: extrapolation.</text><text x="1124" y="692" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#C44949">Association is not proof of cause.</text><text letter-spacing="5" opacity=".075" x="764" y="849" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE STUDY RESOURCES</text><line x1="52" y1="866" x2="1476" y2="866" stroke="#C9A227" stroke-width="2" /><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
