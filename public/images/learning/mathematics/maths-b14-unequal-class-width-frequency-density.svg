<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">AQA GCSE statistics: histogram frequency density</title><desc id="desc">Draws the source plant-height histogram for unequal intervals and shows frequencies represented by bar areas, not heights.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial,sans-serif"><text x="62" y="78" font-size="38" font-weight="700" fill="#0B1F3A">AQA GCSE statistics: histogram frequency density</text><text x="64" y="124" font-size="22" fill="#20314B">Marlbridge Mathematics • AQA GCSE teaching diagram</text><rect x="60" y="165" width="1480" height="755" rx="18" fill="white" stroke="#CCD6D7" stroke-width="2"/><text x="105" y="220" font-size="21" font-weight="700" fill="#0B1F3A" text-anchor="start">For unequal class widths, the histogram bar height is frequency density.</text><path d="M180 720 L1080 720" fill="none" stroke="#0B1F3A" stroke-width="3"/><path d="M180 320 L180 720" fill="none" stroke="#0B1F3A" stroke-width="3"/><path d="M180 720.0 L1080 720.0" fill="none" stroke="#CCD6D7" stroke-width="1"/><text x="165" y="725.0" font-size="14" font-weight="500" fill="#20314B" text-anchor="end">0</text><path d="M180 640.0 L1080 640.0" fill="none" stroke="#CCD6D7" stroke-width="1"/><text x="165" y="645.0" font-size="14" font-weight="500" fill="#20314B" text-anchor="end">1</text><path d="M180 560.0 L1080 560.0" fill="none" stroke="#CCD6D7" stroke-width="1"/><text x="165" y="565.0" font-size="14" font-weight="500" fill="#20314B" text-anchor="end">2</text><path d="M180 480.0 L1080 480.0" fill="none" stroke="#CCD6D7" stroke-width="1"/><text x="165" y="485.0" font-size="14" font-weight="500" fill="#20314B" text-anchor="end">3</text><path d="M180 400.0 L1080 400.0" fill="none" stroke="#CCD6D7" stroke-width="1"/><text x="165" y="405.0" font-size="14" font-weight="500" fill="#20314B" text-anchor="end">4</text><path d="M180 320.0 L1080 320.0" fill="none" stroke="#CCD6D7" stroke-width="1"/><text x="165" y="325.0" font-size="14" font-weight="500" fill="#20314B" text-anchor="end">5</text><text x="125" y="305" font-size="16" font-weight="700" fill="#0B1F3A" text-anchor="start">Frequency density</text><rect x="180.0" y="624.0" width="180.0" height="96.0" fill="#2D7A78" fill-opacity=".72" stroke="#0B1F3A" stroke-width="2"/><text x="270.0" y="614.0" font-size="14" font-weight="700" fill="#0B1F3A" text-anchor="middle">1.2</text><text x="270.0" y="745" font-size="13" font-weight="600" fill="#20314B" text-anchor="middle">0–10</text><rect x="360.0" y="432.0" width="90.0" height="288.0" fill="#2D7A78" fill-opacity=".72" stroke="#0B1F3A" stroke-width="2"/><text x="405.0" y="422.0" font-size="14" font-weight="700" fill="#0B1F3A" text-anchor="middle">3.6</text><text x="405.0" y="745" font-size="13" font-weight="600" fill="#20314B" text-anchor="middle">10–15</text><rect x="450.0" y="368.0" width="90.0" height="352.0" fill="#2D7A78" fill-opacity=".72" stroke="#0B1F3A" stroke-width="2"/><text x="495.0" y="358.0" font-size="14" font-weight="700" fill="#0B1F3A" text-anchor="middle">4.4</text><text x="495.0" y="745" font-size="13" font-weight="600" fill="#20314B" text-anchor="middle">15–20</text><rect x="540.0" y="592.0" width="180.0" height="128.0" fill="#2D7A78" fill-opacity=".72" stroke="#0B1F3A" stroke-width="2"/><text x="630.0" y="582.0" font-size="14" font-weight="700" fill="#0B1F3A" text-anchor="middle">1.6</text><text x="630.0" y="745" font-size="13" font-weight="600" fill="#20314B" text-anchor="middle">20–30</text><rect x="720.0" y="688.0" width="360.0" height="32.0" fill="#2D7A78" fill-opacity=".72" stroke="#0B1F3A" stroke-width="2"/><text x="900.0" y="678.0" font-size="14" font-weight="700" fill="#0B1F3A" text-anchor="middle">0.4</text><text x="900.0" y="745" font-size="13" font-weight="600" fill="#20314B" text-anchor="middle">30–50</text><text x="630.0" y="780" font-size="16" font-weight="700" fill="#0B1F3A" text-anchor="middle">Plant height h (cm)</text><rect x="1150" y="285" width="330" height="430" rx="16" fill="#F5F8FB" stroke="#397DA4" stroke-width="2"/><text x="1185" y="335" font-size="16" font-weight="700" fill="#397DA4" text-anchor="start">DENSITY = f ÷ width</text><text x="1190" y="400" font-size="15" font-weight="600" fill="#20314B" text-anchor="start">0–10: 12 ÷ 10 = 1.2</text><text x="1190" y="445" font-size="15" font-weight="600" fill="#20314B" text-anchor="start">10–15: 18 ÷ 5 = 3.6</text><text x="1190" y="490" font-size="15" font-weight="600" fill="#20314B" text-anchor="start">15–20: 22 ÷ 5 = 4.4</text><text x="1190" y="535" font-size="15" font-weight="600" fill="#20314B" text-anchor="start">20–30: 16 ÷ 10 = 1.6</text><text x="1190" y="580" font-size="15" font-weight="600" fill="#20314B" text-anchor="start">30–50: 8 ÷ 20 = 0.4</text><path d="M1185 610 L1440 610" fill="none" stroke="#CCD6D7" stroke-width="2"/><text x="1190" y="660" font-size="17" font-weight="700" fill="#0B1F3A" text-anchor="start">Bar areas sum to 76.</text><rect x="180" y="825" width="1300" height="55" rx="16" fill="#FFF4D6" stroke="#E0C76C" stroke-width="2"/><text x="830" y="863" font-size="18" font-weight="700" fill="#0B1F3A" text-anchor="middle">Do not use frequency as bar height when class widths differ.</text><path d="M60 972H1540" stroke="#CCD6D7" stroke-width="2"/><text x="64" y="1015" font-size="17" fill="#20314B">Marlbridge • Mathematics study resource • check assumptions and context</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>
