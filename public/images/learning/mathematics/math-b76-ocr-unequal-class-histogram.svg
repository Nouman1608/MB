<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img"><title>Read a histogram with unequal class widths</title><desc>Marlbridge • OCR GCSE Mathematics J560 • Histograms (12.02b, Higher tier only)</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#10233F">Read a histogram with unequal class widths</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">Marlbridge • OCR GCSE Mathematics J560 • Histograms (12.02b, Higher tier only)</text><rect x="52" y="128" width="1000" height="660" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="1076" y="128" width="400" height="660" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="88" y="174" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">For unequal classes, frequency is bar area</text><text x="88" y="211" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6D80">Example 5 • ages of 170 museum visitors</text><line x1="140" y1="700" x2="900" y2="700" stroke="#10233F" stroke-width="3"/><line x1="140" y1="700" x2="140" y2="322" stroke="#10233F" stroke-width="3"/><line x1="140" y1="695" x2="140" y2="705" stroke="#10233F" stroke-width="2"/><text x="140" y="722" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">0</text><line x1="216" y1="695" x2="216" y2="705" stroke="#10233F" stroke-width="2"/><text x="216" y="722" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">10</text><line x1="292" y1="695" x2="292" y2="705" stroke="#10233F" stroke-width="2"/><text x="292" y="722" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">20</text><line x1="368" y1="695" x2="368" y2="705" stroke="#10233F" stroke-width="2"/><text x="368" y="722" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">30</text><line x1="444" y1="695" x2="444" y2="705" stroke="#10233F" stroke-width="2"/><text x="444" y="722" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">40</text><line x1="520" y1="695" x2="520" y2="705" stroke="#10233F" stroke-width="2"/><text x="520" y="722" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">50</text><line x1="596" y1="695" x2="596" y2="705" stroke="#10233F" stroke-width="2"/><text x="596" y="722" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">60</text><line x1="672" y1="695" x2="672" y2="705" stroke="#10233F" stroke-width="2"/><text x="672" y="722" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">70</text><line x1="748" y1="695" x2="748" y2="705" stroke="#10233F" stroke-width="2"/><text x="748" y="722" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">80</text><line x1="824" y1="695" x2="824" y2="705" stroke="#10233F" stroke-width="2"/><text x="824" y="722" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">90</text><line x1="900" y1="695" x2="900" y2="705" stroke="#10233F" stroke-width="2"/><text x="900" y="722" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">100</text><line x1="135" y1="700" x2="145" y2="700" stroke="#10233F" stroke-width="2"/><text x="130" y="704" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">0</text><line x1="135" y1="610" x2="145" y2="610" stroke="#10233F" stroke-width="2"/><text x="130" y="614" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">1</text><line x1="135" y1="520" x2="145" y2="520" stroke="#10233F" stroke-width="2"/><text x="130" y="524" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">2</text><line x1="135" y1="430" x2="145" y2="430" stroke="#10233F" stroke-width="2"/><text x="130" y="434" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">3</text><line x1="135" y1="340" x2="145" y2="340" stroke="#10233F" stroke-width="2"/><text x="130" y="344" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">4</text><text x="550" y="750" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">Age (years)</text><text x="100" y="278" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#10233F">Frequency density</text><rect x="140" y="520" width="76" height="180" fill="#315F86" fill-opacity=".78" stroke="white" stroke-width="2"/><text x="178" y="510" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#10233F">2</text><text x="178" y="546" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#10233F">f=20</text><rect x="216" y="430" width="152" height="270" fill="#168C8C" fill-opacity=".78" stroke="white" stroke-width="2"/><text x="292" y="420" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#10233F">3</text><text x="292" y="456" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#10233F">f=60</text><rect x="368" y="376" width="76" height="324" fill="#C44949" fill-opacity=".78" stroke="white" stroke-width="2"/><text x="406" y="366" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#10233F">3.6</text><text x="406" y="402" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#10233F">f=36</text><rect x="444" y="565" width="152" height="135" fill="#725C8E" fill-opacity=".78" stroke="white" stroke-width="2"/><text x="520" y="555" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#10233F">1.5</text><text x="520" y="591" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#10233F">f=30</text><rect x="596" y="646" width="304" height="54" fill="#C9A227" fill-opacity=".78" stroke="white" stroke-width="2"/><text x="748" y="636" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#10233F">0.6</text><text x="748" y="672" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#10233F">f=24</text><rect x="1100" y="164" width="352" height="154" rx="14" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="1126" y="203" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#315F86">Density = frequency ÷ width</text><text x="1126" y="245" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">Bar area = frequency.</text><text x="1126" y="284" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">Bars touch: continuous ages.</text><rect x="1100" y="334" width="352" height="178" rx="14" fill="#F4F1E8" stroke="#F4F1E8" stroke-width="2"/><text x="1126" y="373" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#725C8E">Unequal-width classes</text><text x="1126" y="415" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">10–30: width 20, density 3</text><text x="1126" y="453" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#20314B">30–40: width 10, density 3.6</text><text x="1126" y="489" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">Area gives 60 and 36.</text><rect x="1100" y="530" width="352" height="154" rx="14" fill="#E7F3F1" stroke="#E7F3F1" stroke-width="2"/><text x="1126" y="569" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#168C8C">Estimate ages 25–40</text><text x="1126" y="611" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">5×3 + 10×3.6</text><text x="1126" y="650" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">= 51 visitors</text><text letter-spacing="5" opacity=".075" x="764" y="849" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE STUDY RESOURCES</text><line x1="52" y1="866" x2="1476" y2="866" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
