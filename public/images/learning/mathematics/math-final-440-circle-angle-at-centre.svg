<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img"><title>Apply the angle-at-centre theorem</title><desc>Marlbridge • The eight circle theorems (G8, Extension only)</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#10233F">Apply the angle-at-centre theorem</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">Marlbridge • The eight circle theorems (G8, Extension only)</text><rect x="52" y="128" width="1000" height="660" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="1076" y="128" width="400" height="660" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="88" y="174" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">The angle at the centre is twice the angle at the circumference</text><text x="88" y="211" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6D80">Worked example 2 • angle PRQ = 53°.</text><circle cx="500" cy="470" r="190" fill="#315F8610" stroke="#315F86" stroke-width="4"/><line x1="500" y1="470" x2="335.45517328095667" y2="565" stroke="#168C8C" stroke-width="3"/><line x1="500" y1="470" x2="454.0348398360631" y2="285.64381200756065" stroke="#168C8C" stroke-width="3"/><line x1="500" y1="470" x2="664.5448267190433" y2="565.0000000000001" stroke="#168C8C" stroke-width="3"/><line x1="335.45517328095667" y1="565" x2="664.5448267190433" y2="565.0000000000001" stroke="#725C8E" stroke-width="3"/><line x1="454.0348398360631" y1="285.64381200756065" x2="664.5448267190433" y2="565.0000000000001" stroke="#725C8E" stroke-width="3"/><circle cx="500" cy="470" r="7" fill="#10233F"/><text x="485" y="492" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">O</text><text x="319.45517328095667" y="585" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">P</text><text x="466.0348398360631" y="277.64381200756065" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">Q</text><text x="676.5448267190433" y="580.0000000000001" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">R</text><text x="750" y="360" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#725C8E">∠PRQ = 53°</text><text x="550" y="505" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#168C8C">∠POQ = 106°</text><rect x="1100" y="164" width="352" height="154" rx="14" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="1126" y="203" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#315F86">Double the angle</text><text x="1126" y="245" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#20314B">∠POQ = 2 × 53°</text><text x="1126" y="284" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">= 106°</text><rect x="1100" y="334" width="352" height="178" rx="14" fill="#F4F1E8" stroke="#F4F1E8" stroke-width="2"/><text x="1126" y="373" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#725C8E">Radii are equal</text><text x="1126" y="415" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#20314B">OP = OQ</text><text x="1126" y="453" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#20314B">Triangle OPQ is isosceles.</text><text x="1126" y="489" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">Base angles are equal.</text><rect x="1100" y="530" width="352" height="154" rx="14" fill="#E7F3F1" stroke="#E7F3F1" stroke-width="2"/><text x="1126" y="569" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#168C8C">Find angle OPQ</text><text x="1126" y="611" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#20314B">(180°−106°) ÷ 2</text><text x="1126" y="650" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">= 37°</text><text letter-spacing="5" opacity=".075" x="764" y="849" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE STUDY RESOURCES</text><line x1="52" y1="866" x2="1476" y2="866" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
