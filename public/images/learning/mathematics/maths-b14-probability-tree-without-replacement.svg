<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">AQA GCSE probability: tree diagram without replacement</title><desc id="desc">Builds the 5-red, 3-blue source tree, checks outcome probabilities sum to one, and derives the conditional probability that both are red given the same colour.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial,sans-serif"><text x="62" y="78" font-size="38" font-weight="700" fill="#0B1F3A">AQA GCSE probability: tree diagram without replacement</text><text x="64" y="124" font-size="22" fill="#20314B">Marlbridge Mathematics • AQA GCSE teaching diagram</text><rect x="60" y="165" width="1480" height="755" rx="18" fill="white" stroke="#CCD6D7" stroke-width="2"/><text x="105" y="220" font-size="21" font-weight="700" fill="#0B1F3A" text-anchor="start">After the first pick, update the counts: seven counters remain.</text><rect x="100" y="280" width="930" height="500" rx="16" fill="#FBFCFC" stroke="#397DA4" stroke-width="2"/><text x="145" y="325" font-size="17" font-weight="700" fill="#397DA4" text-anchor="start">FIRST PICK</text><text x="500" y="325" font-size="17" font-weight="700" fill="#2D7A78" text-anchor="start">SECOND PICK</text><path d="M220 525 L455 405" fill="none" stroke="#B4473B" stroke-width="3"/><circle cx="455" cy="405" r="7" fill="#B4473B"/><text x="470" y="411" font-size="19" font-weight="700" fill="#B4473B" text-anchor="start">R  5/8</text><path d="M555 405 L700 340" fill="none" stroke="#B4473B" stroke-width="3"/><circle cx="700" cy="340" r="6" fill="#B4473B"/><text x="715" y="345" font-size="17" font-weight="700" fill="#B4473B" text-anchor="start">R  4/7</text><path d="M810 340 L855 340" fill="none" stroke="#B4473B" stroke-width="2"/><text x="865" y="345" font-size="16" font-weight="700" fill="#0B1F3A" text-anchor="start">RR  20/56</text><path d="M555 405 L700 470" fill="none" stroke="#397DA4" stroke-width="3"/><circle cx="700" cy="470" r="6" fill="#397DA4"/><text x="715" y="475" font-size="17" font-weight="700" fill="#397DA4" text-anchor="start">B  3/7</text><path d="M810 470 L855 470" fill="none" stroke="#397DA4" stroke-width="2"/><text x="865" y="475" font-size="16" font-weight="700" fill="#0B1F3A" text-anchor="start">RB  15/56</text><path d="M220 525 L455 645" fill="none" stroke="#397DA4" stroke-width="3"/><circle cx="455" cy="645" r="7" fill="#397DA4"/><text x="470" y="651" font-size="19" font-weight="700" fill="#397DA4" text-anchor="start">B  3/8</text><path d="M555 645 L700 580" fill="none" stroke="#B4473B" stroke-width="3"/><circle cx="700" cy="580" r="6" fill="#B4473B"/><text x="715" y="585" font-size="17" font-weight="700" fill="#B4473B" text-anchor="start">R  5/7</text><path d="M810 580 L855 580" fill="none" stroke="#B4473B" stroke-width="2"/><text x="865" y="585" font-size="16" font-weight="700" fill="#0B1F3A" text-anchor="start">BR  15/56</text><path d="M555 645 L700 710" fill="none" stroke="#397DA4" stroke-width="3"/><circle cx="700" cy="710" r="6" fill="#397DA4"/><text x="715" y="715" font-size="17" font-weight="700" fill="#397DA4" text-anchor="start">B  2/7</text><path d="M810 710 L855 710" fill="none" stroke="#397DA4" stroke-width="2"/><text x="865" y="715" font-size="16" font-weight="700" fill="#0B1F3A" text-anchor="start">BB   6/56</text><rect x="1080" y="280" width="380" height="500" rx="16" fill="#F5F8FB" stroke="#2D7A78" stroke-width="2"/><text x="1120" y="330" font-size="17" font-weight="700" fill="#2D7A78" text-anchor="start">CHECK + CONDITION</text><text x="1120" y="395" font-size="17" font-weight="600" fill="#20314B" text-anchor="start">All outcomes:</text><text x="1120" y="435" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="start">20+15+15+6</text><text x="1120" y="475" font-size="21" font-weight="700" fill="#2D7A78" text-anchor="start">= 56/56 = 1</text><path d="M1115 510 L1425 510" fill="none" stroke="#CCD6D7" stroke-width="2"/><text x="1120" y="565" font-size="18" font-weight="700" fill="#0B1F3A" text-anchor="start">P(same colour)</text><text x="1120" y="605" font-size="18" font-weight="600" fill="#20314B" text-anchor="start">= (20+6)/56</text><text x="1120" y="645" font-size="21" font-weight="700" fill="#2D7A78" text-anchor="start">= 13/28</text><text x="1120" y="700" font-size="17" font-weight="700" fill="#0B1F3A" text-anchor="start">P(RR | same)</text><text x="1120" y="740" font-size="19" font-weight="700" fill="#2D7A78" text-anchor="start">= 20/26 = 10/13</text><rect x="130" y="825" width="1320" height="58" rx="16" fill="#FFF4D6" stroke="#E0C76C" stroke-width="2"/><text x="790" y="863" font-size="18" font-weight="700" fill="#0B1F3A" text-anchor="middle">Multiply along a branch; add separate branches for outcomes in the event.</text><path d="M60 972H1540" stroke="#CCD6D7" stroke-width="2"/><text x="64" y="1015" font-size="17" fill="#20314B">Marlbridge • Mathematics study resource • check assumptions and context</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>
