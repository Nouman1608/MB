<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img"><title>Solve a linear equation by reading the intersection of two lines</title><desc>Marlbridge • OxfordAQA International GCSE Mathematics 9260 • Worked example 5</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#10233F">Solve a linear equation by reading the intersection of two lines</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">Marlbridge • OxfordAQA International GCSE Mathematics 9260 • Worked example 5</text><rect x="52" y="128" width="986" height="660" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="1062" y="128" width="414" height="660" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="88" y="174" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">The solution is the x-coordinate where the two lines cross</text><text x="88" y="211" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6D80">Solve 4 − x = 2x − 3 approximately from a graph</text><line x1="230" y1="530" x2="859" y2="530" stroke="#10233F" stroke-width="3" /><line x1="230" y1="762" x2="230" y2="228.39999999999998" stroke="#10233F" stroke-width="3" /><line x1="230" y1="525" x2="230" y2="535" stroke="#10233F" stroke-width="2" /><text x="230" y="555" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">0</text><line x1="378" y1="525" x2="378" y2="535" stroke="#10233F" stroke-width="2" /><text x="378" y="555" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">1</text><line x1="526" y1="525" x2="526" y2="535" stroke="#10233F" stroke-width="2" /><text x="526" y="555" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">2</text><line x1="674" y1="525" x2="674" y2="535" stroke="#10233F" stroke-width="2" /><text x="674" y="555" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">3</text><line x1="822" y1="525" x2="822" y2="535" stroke="#10233F" stroke-width="2" /><text x="822" y="555" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">4</text><line x1="230" y1="704" x2="829.4" y2="704" stroke="#D3DCE2" stroke-width="1" stroke-dasharray="4 6"/><text x="215" y="709" text-anchor="end" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">-3</text><line x1="230" y1="588" x2="829.4" y2="588" stroke="#D3DCE2" stroke-width="1" stroke-dasharray="4 6"/><text x="215" y="593" text-anchor="end" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">-1</text><line x1="230" y1="472" x2="829.4" y2="472" stroke="#D3DCE2" stroke-width="1" stroke-dasharray="4 6"/><text x="215" y="477" text-anchor="end" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">1</text><line x1="230" y1="356" x2="829.4" y2="356" stroke="#D3DCE2" stroke-width="1" stroke-dasharray="4 6"/><text x="215" y="361" text-anchor="end" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">3</text><line x1="230" y1="240" x2="829.4" y2="240" stroke="#D3DCE2" stroke-width="1" stroke-dasharray="4 6"/><text x="215" y="245" text-anchor="end" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">5</text><text x="516" y="721" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">x</text><text x="197" y="325" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">y</text><path d="M 230 298 L 822 530" fill="none" stroke="#315F86" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M 230 704 L 822 240" fill="none" stroke="#168C8C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="575.3333333333334" cy="433.33333333333337" r="9" fill="#C44949" stroke="white" stroke-width="3"/><line x1="575.3333333333334" y1="433.33333333333337" x2="575.3333333333334" y2="530" stroke="#C44949" stroke-width="2" stroke-dasharray="7 6"/><line x1="230" y1="433.33333333333337" x2="575.3333333333334" y2="433.33333333333337" stroke="#C44949" stroke-width="2" stroke-dasharray="7 6"/><text x="690" y="305" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#315F86">y = 4 − x</text><text x="690" y="406" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#168C8C">y = 2x − 3</text><text x="587.3333333333334" y="419.33333333333337" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#C44949">crossing</text><rect x="126" y="645" width="776" height="75" rx="10" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="514" y="676" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233F">Read the x-coordinate, not the y-coordinate: x ≈ 2.3</text><text x="514" y="705" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#5B6D80">Algebra check: 3x = 7 → x = 7/3 ≈ 2.33</text><text x="1086" y="177" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">Draw both sides</text><rect x="1084" y="215" width="370" height="126" rx="12" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="1110" y="255" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#315F86">First line: y = 4 − x</text><text x="1110" y="294" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#168C8C">Second line: y = 2x − 3</text><text x="1110" y="323" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">Plot each from its table or rule.</text><rect x="1084" y="360" width="370" height="139" rx="12" fill="#F4F1E8" stroke="#F4F1E8" stroke-width="2"/><text x="1110" y="399" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#725C8E">Bracket the crossing</text><text x="1110" y="438" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">At x=2: 2 is above 1</text><text x="1110" y="473" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">At x=3: 1 is below 3</text><rect x="1084" y="518" width="370" height="160" rx="12" fill="#E7F3F1" stroke="#E7F3F1" stroke-width="2"/><text x="1110" y="557" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#168C8C">Read from the horizontal scale</text><text x="1110" y="596" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">Crossing lies between 2 and 3,</text><text x="1110" y="630" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">about one third from 2.</text><text x="1110" y="659" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">Use ≈ because the graph is scaled.</text><text letter-spacing="5" opacity=".075" x="764" y="849" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE STUDY RESOURCES</text><line x1="52" y1="866" x2="1476" y2="866" stroke="#C9A227" stroke-width="2" /><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
