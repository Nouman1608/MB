<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img"><title>Compare exponential growth with a fixed yearly increase</title><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#10233F">Compare exponential growth with a fixed yearly increase</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">Marlbridge • Cambridge IGCSE Mathematics 0580 • Extended</text><rect x="52" y="128" width="1424" height="680" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="82" y="178" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">Town population starts at 25,000 and grows by 2.4% each year.</text><path d="M170.0 610L170.0 250" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="632" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">0</text><path d="M280.0 610L280.0 250" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="280.0" y="632" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">2</text><path d="M390.0 610L390.0 250" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="390.0" y="632" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">4</text><path d="M500.0 610L500.0 250" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="632" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">6</text><path d="M610.0 610L610.0 250" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="610.0" y="632" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">8</text><path d="M170.0 610L610.0 610" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="158.0" y="614" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">25</text><path d="M170.0 550L610.0 550" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="158.0" y="554" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">26</text><path d="M170.0 490L610.0 490" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="158.0" y="494" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">27</text><path d="M170.0 430L610.0 430" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="158.0" y="434" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">28</text><path d="M170.0 370L610.0 370" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="158.0" y="374" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">29</text><path d="M170.0 310L610.0 310" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="158.0" y="314" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">30</text><path d="M170.0 250L610.0 250" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="158.0" y="254" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">31</text><path d="M170.0 610L610.0 610" fill="none" stroke="#10233F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M170.0 610L170.0 250" fill="none" stroke="#10233F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M170.00 610.00 L280.00 537.14 L390.00 460.73 L500.00 380.62 L610.00 296.61" fill="none" stroke="#168C8C" stroke-width="4"/><circle cx="170.0" cy="610.0" r="5" fill="#168C8C"/><circle cx="280.0" cy="537.1" r="5" fill="#168C8C"/><circle cx="390.0" cy="460.7" r="5" fill="#168C8C"/><circle cx="500.0" cy="380.6" r="5" fill="#168C8C"/><circle cx="610.0" cy="296.6" r="5" fill="#168C8C"/><path d="M170.00 610.00 L280.00 538.00 L390.00 466.00 L500.00 394.00 L610.00 322.00" fill="none" stroke="#C9A227" stroke-width="4"/><circle cx="170.0" cy="610.0" r="5" fill="#C9A227"/><circle cx="280.0" cy="538.0" r="5" fill="#C9A227"/><circle cx="390.0" cy="466.0" r="5" fill="#C9A227"/><circle cx="500.0" cy="394.0" r="5" fill="#C9A227"/><circle cx="610.0" cy="322.0" r="5" fill="#C9A227"/><text x="605.0" y="284.6140000000001" text-anchor="end" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#168C8C">30.223k</text><text x="605.0" y="343.99999999999994" text-anchor="end" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#C9A227">29.800k</text><text x="480" y="735" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#10233F">Years</text><text x="170" y="238" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#10233F">Population (thousands)</text><rect x="920" y="225" width="500" height="425" rx="14" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="1170" y="268" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">Exponential model</text><text x="970" y="330" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#315F86">Multiplier = 1 + 2.4/100</text><text x="970" y="370" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#315F86">= 1.024 each year</text><text x="970" y="425" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#168C8C">25,000 × 1.024⁸ ≈ 30,223</text><path d="M970 455L1370 455" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="970" y="510" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6D80">Linear comparison:</text><text x="970" y="550" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#C9A227">25,000 + 8 × 600 = 29,800</text><text x="1170" y="610" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">Each yearly % uses the current</text><text x="1170" y="635" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">population, not the starting one.</text><path d="M420 765L480 765" fill="none" stroke="#168C8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="495" y="770" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#168C8C">Exponential</text><path d="M620 765L680 765" fill="none" stroke="#C9A227" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="695" y="770" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#C9A227">Linear</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
