<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">AQA inequalities: solve a rational inequality with a sign chart</title><desc id="desc">The source example 5/(x−2)&gt;3 reduces to (11−3x)/(x−2)&gt;0; critical values 2 and 11/3 yield solution 2&lt;x&lt;11/3.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial,sans-serif" fill="#20314B"><text x="62" y="78" font-size="38" font-weight="700" fill="#0B1F3A">AQA inequalities: solve a rational inequality with a sign chart</text><text x="64" y="124" font-size="22">Marlbridge teaching diagram • examples are schematic</text><rect x="60" y="165" width="1480" height="755" rx="18" fill="white" stroke="#CCD6D7" stroke-width="2"/><text x="100" y="220" font-size="22" font-weight="400" fill="#20314B" text-anchor="start">For rational inequalities, mark numerator zeros and denominator exclusions before testing signs.</text><rect x="100" y="270" width="850" height="500" rx="16" fill="#FBFCFC" stroke="#CCD6D7" stroke-width="2"/><text x="130" y="315" font-size="21" font-weight="700" fill="#0B1F3A" text-anchor="start">Solve 5/(x−2) &gt; 3</text><text x="130" y="365" font-size="20" font-weight="700" fill="#2D7A78" text-anchor="start">(11−3x)/(x−2) &gt; 0</text><path d="M190 500L870 500" fill="none" stroke="#596B7E" stroke-width="3"/><path d="M280 488L280 512" fill="none" stroke="#596B7E" stroke-width="2"/><path d="M790 488L790 512" fill="none" stroke="#596B7E" stroke-width="2"/><circle cx="280" cy="500" r="9" fill="white" stroke="#B4473B" stroke-width="3"/><circle cx="790" cy="500" r="9" fill="white" stroke="#B4473B" stroke-width="3"/><text x="280" y="550" font-size="17" font-weight="700" fill="#B4473B" text-anchor="middle">x = 2</text><text x="790" y="550" font-size="17" font-weight="700" fill="#B4473B" text-anchor="middle">x = 11/3</text><text x="380" y="470" font-size="22" font-weight="700" fill="#B4473B" text-anchor="middle">−</text><text x="670" y="470" font-size="22" font-weight="700" fill="#2D7A78" text-anchor="middle">+</text><text x="835" y="470" font-size="22" font-weight="700" fill="#B4473B" text-anchor="middle">−</text><text x="550" y="620" font-size="16" font-weight="400" fill="#596B7E" text-anchor="middle">fraction is positive</text><text x="420" y="680" font-size="18" font-weight="700" fill="#2D7A78" text-anchor="middle">solution interval (2, 11/3)</text><rect x="1000" y="270" width="440" height="500" rx="16" fill="#FBFCFC" stroke="#CCD6D7" stroke-width="2"/><text x="1030" y="320" font-size="21" font-weight="700" fill="#0B1F3A" text-anchor="start">Critical values</text><text x="1030" y="380" font-size="18" font-weight="700" fill="#B4473B" text-anchor="start">x = 2: undefined</text><text x="1030" y="425" font-size="17" font-weight="700" fill="#B4473B" text-anchor="start">x = 11/3: numerator = 0</text><text x="1030" y="490" font-size="17" font-weight="400" fill="#20314B" text-anchor="start">Sign of (11−3x)/(x−2):</text><text x="1030" y="540" font-size="17" font-weight="400" fill="#20314B" text-anchor="start">(−∞, 2): negative</text><text x="1030" y="580" font-size="17" font-weight="700" fill="#2D7A78" text-anchor="start">(2, 11/3): positive</text><text x="1030" y="620" font-size="17" font-weight="400" fill="#20314B" text-anchor="start">(11/3, ∞): negative</text><text x="1030" y="685" font-size="16" font-weight="700" fill="#20314B" text-anchor="start">Strict &gt; excludes both ends.</text><rect x="100" y="800" width="1340" height="70" rx="16" fill="#FFF4D6" stroke="#E0C76C" stroke-width="2"/><text x="125" y="845" font-size="17" font-weight="700" fill="#0B1F3A" text-anchor="start">Never multiply an inequality by (x−2) until its sign is known; x=2 is excluded from the domain.</text><path d="M60 972H1540" stroke="#CCD6D7" stroke-width="2"/><text x="64" y="1015" font-size="17">Marlbridge • study diagram • check assumptions and context</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>
