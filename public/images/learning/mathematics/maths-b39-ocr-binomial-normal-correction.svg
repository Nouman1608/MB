<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">A binomial-to-normal approximation needs a continuity correction</title><desc id="desc">For X distributed binomial with n 240 and p 0.35, mean 84 and variance 54.6. A normal approximation has standard deviation 7.39. For probability X at most 90, exact binomial probability 0.811 compares with 0.792 without continuity correction and 0.810 with upper boundary 90.5.</desc>
<defs><style>.bg{fill:#f3f6f6}.panel{fill:#fff;stroke:#d3dde2;stroke-width:3}.h1{font:700 40px Arial;fill:#10233f}.h2{font:700 25px Arial;fill:#10233f}.body{font:21px Arial;fill:#263f58}.small{font:18px Arial;fill:#5b6d80}.eq{font:700 23px Arial;fill:#16807f}.gold{fill:#fff7dc;stroke:#c9a227;stroke-width:2}.curve{stroke:#317b91;stroke-width:5;fill:none}.shade{fill:#76b9b4;fill-opacity:.44;stroke:none}.axis{stroke:#526a80;stroke-width:2}.bar{fill:#d6e8eb;stroke:#317b91;stroke-width:1}</style></defs>
<rect class="bg" width="1600" height="1000"/><text x="54" y="60" class="h1">Approximating a binomial with a normal model</text><text x="56" y="98" class="small">OCR A Level Mathematics A • model choice, limitations and continuity correction</text>
<rect x="48" y="132" width="1504" height="165" rx="18" class="panel"/><text x="82" y="181" class="h2">Start with the discrete model</text><text x="82" y="226" class="eq">X ~ B(240, 0.35)</text><text x="430" y="226" class="body">μ = np = 84</text><text x="670" y="226" class="body">σ² = npq = 54.6</text><text x="990" y="226" class="body">σ = √54.6 ≈ 7.39</text><path d="M1290 216H1435" stroke="#16807f" stroke-width="4"/><text x="1310" y="196" class="small">approximate</text><text x="1320" y="255" class="eq">Y ~ N(84,54.6)</text>
<rect x="48" y="326" width="910" height="466" rx="18" class="panel"/><text x="82" y="374" class="h2">Why the half-step matters</text><text x="82" y="411" class="body">P(X ≤ 90) includes the whole bar at 90.</text>
<path d="M140 696H870M195 700V468" class="axis"/><path d="M220 694 C300 672 350 590 410 508 C470 452 530 440 585 470 C655 510 710 616 770 680 C800 694 830 696 850 696" class="curve"/>
<path d="M220 694 C300 672 350 590 410 508 C470 452 530 440 585 470 C655 510 710 616 770 680 L770 696 L220 696Z" class="shade"/>
<path d="M750 455V704" stroke="#c9a227" stroke-width="4" stroke-dasharray="9 7"/><text x="720" y="444" class="eq">90.5</text><text x="215" y="731" class="small">Normal curve shaded to 90.5</text>
<g><rect x="694" y="632" width="13" height="62" class="bar"/><rect x="708" y="613" width="13" height="81" class="bar"/><rect x="722" y="595" width="13" height="99" class="bar"/><rect x="736" y="578" width="13" height="116" class="bar"/></g><text x="500" y="761" class="small">All integer counts through X = 90 are included</text>
<rect x="1000" y="326" width="552" height="466" rx="18" class="panel"/><text x="1034" y="374" class="h2">Compare the probabilities</text><text x="1034" y="426" class="body">Exact binomial:</text><text x="1370" y="426" class="eq">0.811</text><text x="1034" y="478" class="body">Normal, cut at 90:</text><text x="1370" y="478" class="body">0.792</text><rect x="1034" y="510" width="478" height="92" rx="14" class="gold"/><text x="1060" y="550" class="eq">Normal, cut at 90.5: 0.810</text><text x="1060" y="582" class="small">Closer to the exact discrete probability</text><text x="1034" y="650" class="small">Continuity correction for X ≤ 90:</text><text x="1034" y="686" class="body">P(X ≤ 90) ≈ P(Y &lt; 90.5)</text><text x="1034" y="738" class="small">Normal curve is continuous; binomial X counts integers.</text>
<text x="56" y="856" class="small">Check context first: fixed independent trials with constant p suit binomial; a large n can permit a normal approximation. Skew or dependence can make a model unsuitable.</text><text x="56" y="915" class="small">MARLBRIDGE • MATHS • values follow the source lesson; diagram illustrates the approximation.</text><text x="1370" y="915" style="font:700 23px Georgia;fill:#10233f">M<tspan fill="#c9a227">B</tspan> MARLBRIDGE</text><path d="M55 941H1545" stroke="#c9a227" stroke-width="3"/><text x="800" y="978" text-anchor="middle" style="font:700 22px Georgia;letter-spacing:9px;fill:#dce4e6">MARLBRIDGE STUDY RESOURCES</text></svg>
