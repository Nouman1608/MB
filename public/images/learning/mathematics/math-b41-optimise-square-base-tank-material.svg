<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="t"><title id="t">Optimise the material used by a fixed-volume tank</title><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#10233F">Optimise the material used by a fixed-volume tank</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">Marlbridge • OxfordAQA A-level Mathematics</text><rect x="52" y="128" width="1424" height="680" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="82" y="176" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#10233F">Open tank: square base x metres, height h metres, fixed volume 32 m³.</text><rect x="100" y="230" width="500" height="365" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="350" y="271" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#315F86">Use the volume constraint</text><path d="M245 505L505 505L580 460L320 460Z" fill="#168C8C18" stroke="#168C8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M245 505V390L505 390V505" fill="#168C8C18" stroke="#168C8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M505 505V390L580 345V460" fill="#168C8C10" stroke="#168C8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M245 390L320 345L580 345" fill="none" stroke="#168C8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M320 345V460" fill="none" stroke="#168C8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="375" y="530" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">x × x × h = 32   ⇒   h = 32/x²</text><text x="350" y="569" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#315F86">Material area: A = x² + 4xh</text><path d="M620 412H690" fill="none" stroke="#C9A227" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="690" y="230" width="350" height="365" rx="14" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="865" y="271" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">Reduce to one variable</text><text x="730" y="350" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#315F86">A(x) = x² + 128/x</text><text x="730" y="402" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">A′(x) = 2x − 128/x²</text><text x="730" y="448" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">A′(x)=0 ⇒ x³=64</text><text x="730" y="493" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#168C8C">x=4 m, then h=2 m</text><path d="M730 518H1000" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="865" y="562" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">A = 16 + 4×4×2</text><path d="M1040 412H1090" fill="none" stroke="#C9A227" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="1090" y="230" width="320" height="365" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="1250" y="271" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">Verify the minimum</text><text x="1125" y="352" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#315F86">A″(x)=2+256/x³</text><text x="1125" y="397" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#168C8C">A″(4)=6 &gt; 0</text><path d="M1125 430H1375" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1250" y="477" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#5B6D80">Minimum area</text><text x="1250" y="524" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#10233F">48 m²</text><text x="1250" y="562" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#20314B">Base 4 m × 4 m</text><text x="755" y="682" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6D80">Keep x positive (a length) and report both dimensions and the requested minimum area.</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
