y="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">5</text>,<path d="M697 156V726" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<text x="697" y="744" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">6</text>,<path d="M726.5 156V726" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<text x="726.5" y="744" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">7</text>,<path d="M756 156V726" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<text x="756" y="744" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">8</text>,<path d="M785.5 156V726" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<text x="785.5" y="744" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">9</text>,<path d="M150 707.5H890" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<text x="138" y="711.5" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">-9</text>,<path d="M150 619H890" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<text x="138" y="623" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">-6</text>,<path d="M150 530.5H890" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<text x="138" y="534.5" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">-3</text>,<text x="138" y="446" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">0</text>,<path d="M150 353.5H890" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<text x="138" y="357.5" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">3</text>,<path d="M150 265H890" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<text x="138" y="269" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">6</text>,<path d="M150 176.5H890" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<text x="138" y="180.5" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">9</text>,<circle cx="520" cy="442" r="150.42107565098715" fill="#315F8610" stroke="#315F86" stroke-width="4"/>,<path d="M520 442L667.5 471.5" fill="none" stroke="#D88329" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />,<path d="M620.3 707.5L726.5 176.5" fill="none" stroke="#168C8C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />,<circle cx="520" cy="442" r="7" fill="#10233F"/><circle cx="667.5" cy="471.5" r="8" fill="#C44949"/>,<text x="510" y="428" text-anchor="end" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#10233F">O(0,0)</text>,<text x="679.5" y="459.5" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#C44949">P(5,−1)</text>,<text x="701.425" y="301.875" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#168C8C">tangent: y = 5x − 26</text>,<text x="581.95" y="454.39" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#D88329">radius: OP</text>,<path d="M649.5 467.5L652.5 449.5L671.5 452.5" fill="none" stroke="#725C8E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />,<rect x="1000" y="144" width="476" height="548" rx="14" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/>,<text x="1238" y="184" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">WORK FROM THE RADIUS</text>,<text x="1238" y="234" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">Check P lies on circle:</text>,<text x="1238" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#20314B">5² + (−1)² = 26 ✓</text>,<text x="1238" y="321" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">Radius gradient</text>,<text x="1238" y="354" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#D88329">(−1 − 0) / (5 − 0) = −1/5</text>,<text x="1238" y="400" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">Perpendicular gradient</text>,<text x="1238" y="433" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#168C8C">negative reciprocal = 5</text>,<text x="1238" y="483" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">Through P(5, −1):</text>,<text x="1238" y="516" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">y + 1 = 5(x − 5)</text>,<text x="1238" y="555" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">y = 5x − 26</text>,<text x="1238" y="636" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#725C8E">Tangent ⟂ radius at P.</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE  •  STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
