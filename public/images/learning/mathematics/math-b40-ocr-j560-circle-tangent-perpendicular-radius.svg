<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="ti de"><title id="ti">Circle tangent: use the radius gradient</title><desc id="de">A coordinate plot shows circle x squared plus y squared equals 26, radius to point 5 negative 1, and tangent line y equals five x minus 26.</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#10233F">Circle tangent: use the radius gradient</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#5B6D80">Marlbridge • OCR GCSE Mathematics J560 • Straight-line graphs (7.02b)</text><rect x="52" y="124" width="900" height="658" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/>,<path d="M520 156V726M150 442H890" fill="none" stroke="#20314B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />,<text x="520" y="160" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#315F86">Circle x² + y² = 26 • point of contact P(5, −1)</text>,<path d="M343 156V726" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<text x="343" y="744" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">-6</text>,<path d="M372.5 156V726" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<text x="372.5" y="744" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">-5</text>,<path d="M402 156V726" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<text x="402" y="744" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">-4</text>,<path d="M431.5 156V726" fill="none" stroke="#D3DCE2" stroke-width="1" strok