<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img"><title>Compare a mapped route with its direct distance</title><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#10233F">Compare a mapped route with its direct distance</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">Marlbridge • IB MYP Mathematics • source-specific teaching diagram</text><rect x="52" y="128" width="900" height="660" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="978" y="128" width="498" height="660" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="88" y="173" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">Map scale 1 : 50 000</text><text x="88" y="208" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">Each 1 cm on the map represents 0.5 km on the ground.</text><path d="M 175 622 L 427 622 L 427 286" fill="none" stroke="#168C8C" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /><path d="M 175 622 L 427 286" fill="none" stroke="#725C8E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="12 9"/><circle cx="175" cy="622" r="10" fill="#10233F"/><circle cx="427" cy="286" r="10" fill="#10233F"/><path d="M 400 622 L 400 595 L 427 595" fill="none" stroke="#C9A227" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="154" y="666" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233F">A</text><text x="436" y="644" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233F">B</text><text x="436" y="280" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233F">C</text><text x="301" y="656" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#168C8C">3 cm east</text><text x="475" y="454" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#168C8C">4 cm north</text><text x="275" y="423" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#725C8E">direct 5 cm</text><text x="223" y="560" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#5B6D80">3–4–5 right triangle</text><text x="88" y="733" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#168C8C">Route: 3 + 4 = 7 cm → 3.5 km</text><text x="1018" y="180" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">Compare travel times at 5 km/h</text><rect x="1018" y="222" width="418" height="120" rx="12" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="1044" y="265" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#315F86">Along the two map legs</text><text x="1044" y="306" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#168C8C">3.5 km ÷ 5 = 0.7 h = 42 min</text><rect x="1018" y="362" width="418" height="120" rx="12" fill="#F4F1E8" stroke="#F4F1E8" stroke-width="2"/><text x="1044" y="405" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#725C8E">Direct line (if terrain allows)</text><text x="1044" y="446" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#725C8E">2.5 km ÷ 5 = 0.5 h = 30 min</text><text x="1018" y="535" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">The direct route saves 12 minutes.</text><line x1="1018" y1="565" x2="1436" y2="565" stroke="#D3DCE2" stroke-width="2" /><text x="1018" y="615" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#315F86">Model check</text><text x="1018" y="650" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#20314B">Straight-line distance is only valid</text><text x="1018" y="678" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#20314B">if the ground permits a direct walk.</text><text x="1018" y="735" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#5B6D80">Map scale: 1 cm = 50 000 cm = 0.5 km</text><text letter-spacing="5" opacity=".075" x="764" y="849" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE STUDY RESOURCES</text><line x1="52" y1="866" x2="1476" y2="866" stroke="#C9A227" stroke-width="2" /><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
