<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img"><title>Calculate satellite speed and period from a circular orbit</title><desc>Marlbridge • OxfordAQA International Mathematics • Worked example 4</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#10233F">Calculate satellite speed and period from a circular orbit</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">Marlbridge • OxfordAQA International Mathematics • Worked example 4</text><rect x="52" y="128" width="1000" height="660" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="1076" y="128" width="400" height="660" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="88" y="174" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">Gravity keeps a satellite moving on a circular orbit</text><text x="88" y="211" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6D80">Worked example 4 • Earth radius and orbital radius are different</text><circle cx="366" cy="466" r="102" fill="#E8F1F4" stroke="#315F86" stroke-width="4"/><circle cx="366" cy="466" r="220" fill="none" stroke="#168C8C" stroke-width="3" stroke-dasharray="9 7"/><circle cx="586" cy="466" r="15" fill="#C9A227" stroke="#10233F" stroke-width="2"/><circle cx="366" cy="466" r="7" fill="#10233F" stroke="#FFFFFF" stroke-width="3"/><line x1="366" y1="466" x2="586" y2="466" stroke="#5B6D80" stroke-width="2" stroke-dasharray="6 6"/><text x="476" y="451" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">r = 1.0 × 10⁷ m</text><line x1="366" y1="466" x2="468" y2="466" stroke="#C44949" stroke-width="4" /><text x="415" y="490" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#C44949">R = 6.4 × 10⁶ m</text><line x1="586" y1="466" x2="586" y2="369" stroke="#168C8C" stroke-width="5" /><polygon points="586,369 578,385 594,385" fill="#168C8C"/><text x="600" y="374" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#168C8C">v</text><line x1="568" y1="466" x2="500" y2="466" stroke="#C44949" stroke-width="5" /><polygon points="500,466 516,458 516,474" fill="#C44949"/><text x="533" y="495" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#C44949">gravity → centre</text><text x="366" y="598" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#315F86">Earth</text><text x="366" y="707" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#5B6D80">Orbit is circular; gravity is the only force in the model.</text><rect x="1102" y="164" width="348" height="154" rx="14" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="1128" y="204" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#315F86">Gravity supplies centripetal force</text><text x="1128" y="244" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">ma = mgR²/r²</text><text x="1128" y="282" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">a = g(R/r)²</text><text x="1128" y="307" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">Satellite mass cancels.</text><rect x="1102" y="330" width="348" height="157" rx="14" fill="#F4F1E8" stroke="#F4F1E8" stroke-width="2"/><text x="1128" y="370" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#725C8E">Find orbital acceleration</text><text x="1128" y="410" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#20314B">9.8 × 0.4096</text><text x="1128" y="451" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">a = 4.014 m s⁻²</text><text x="1128" y="476" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">where R/r = 0.64</text><rect x="1102" y="499" width="348" height="186" rx="14" fill="#E7F3F1" stroke="#E7F3F1" stroke-width="2"/><text x="1128" y="539" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#168C8C">Speed and period</text><text x="1128" y="579" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">v = √(ar) ≈ 6,340 m/s</text><text x="1128" y="619" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">T = 2πr/v ≈ 9,920 s</text><text x="1128" y="657" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">≈ 2.75 hours per orbit</text><text letter-spacing="5" opacity=".075" x="764" y="849" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE STUDY RESOURCES</text><line x1="52" y1="866" x2="1476" y2="866" stroke="#C9A227" stroke-width="2" /><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
