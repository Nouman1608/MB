<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">9709 Statistics 2: test a claim and conclude in context</title><desc id="desc">Five-step right-tailed Poisson hypothesis test using mean 4.5 and observed 9, then accurate Type I and Type II error definitions.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial,sans-serif" fill="#20314B"><text x="62" y="78" font-size="40" font-weight="700" fill="#0B1F3A">9709 Statistics 2: test a claim and conclude in context</text><text x="64" y="124" font-size="22">Marlbridge teaching diagram • examples are schematic</text><rect x="60" y="165" width="1480" height="755" rx="18" fill="white" stroke="#CCD6D7" stroke-width="2"/><text x="100" y="225" font-size="22">A significance test asks whether the observed result is unusual if H₀ is true.</text>
<rect x="90" y="315" width="265" height="235" rx="14" fill="#E7EFED" stroke="#2D7A78" stroke-width="2"/><text x="110" y="365" font-size="19" font-weight="700">1  STATE</text><text x="110" y="430" font-size="17" font-weight="700" fill="#2D7A78">H₀: λ = 4.5</text><text x="110" y="485" font-size="16">H₁: λ &gt; 4.5</text>
<path d="M355 430H380M373 422L385 430L373 438" stroke="#397DA4" stroke-width="3" fill="none"/><rect x="385" y="315" width="265" height="235" rx="14" fill="#FBFCFC" stroke="#CCD6D7" stroke-width="2"/><text x="405" y="365" font-size="19" font-weight="700">2  MODEL</text><text x="405" y="430" font-size="17" font-weight="700" fill="#2D7A78">X ~ Po(4.5)</text><text x="405" y="485" font-size="16">Observed X = 9</text>
<path d="M650 430H675M668 422L680 430L668 438" stroke="#397DA4" stroke-width="3" fill="none"/><rect x="680" y="315" width="265" height="235" rx="14" fill="#FBFCFC" stroke="#CCD6D7" stroke-width="2"/><text x="700" y="365" font-size="19" font-weight="700">3  TAIL</text><text x="700" y="430" font-size="17" font-weight="700" fill="#2D7A78">P(X ≥ 9) = 0.0403</text><text x="700" y="485" font-size="16">Right-tailed • α = 0.05</text>
<path d="M945 430H970M963 422L975 430L963 438" stroke="#397DA4" stroke-width="3" fill="none"/><rect x="975" y="315" width="265" height="235" rx="14" fill="#FBFCFC" stroke="#CCD6D7" stroke-width="2"/><text x="995" y="365" font-size="19" font-weight="700">4  DECIDE</text><text x="995" y="430" font-size="17" font-weight="700" fill="#2D7A78">0.0403 &lt; 0.05</text><text x="995" y="485" font-size="16">Reject H₀</text>
<path d="M1240 430H1265M1258 422L1270 430L1258 438" stroke="#397DA4" stroke-width="3" fill="none"/><rect x="1270" y="315" width="245" height="235" rx="14" fill="#E7EFED" stroke="#2D7A78" stroke-width="2"/><text x="1290" y="365" font-size="19" font-weight="700">5  CONCLUDE</text><text x="1290" y="430" font-size="16" font-weight="700" fill="#2D7A78">Evidence at 5% level</text><text x="1290" y="485" font-size="15">Mean weekly sales rose</text>
<rect x="100" y="620" width="620" height="190" rx="14" fill="#FBE8E5" stroke="#D56A5B" stroke-width="2"/><text x="130" y="665" font-size="22" font-weight="700" fill="#0B1F3A">Type I error</text><text x="130" y="710" font-size="18">Reject H₀ when H₀ is true.</text><text x="130" y="755" font-size="17">Here P(Type I) = 0.0403 under H₀.</text><rect x="810" y="620" width="620" height="190" rx="14" fill="#FFF4D6" stroke="#E0C76C" stroke-width="2"/><text x="840" y="665" font-size="22" font-weight="700" fill="#0B1F3A">Type II error</text><text x="840" y="710" font-size="17">Do not reject H₀ when a stated alternative is true.</text><text x="840" y="755" font-size="17">Specify the alternative to calculate its probability.</text><text x="105" y="860" font-size="18" font-weight="700" fill="#0B1F3A">Conclusion: evidence at the 5% level that mean weekly umbrella sales increased.</text><path d="M60 972H1540" stroke="#CCD6D7" stroke-width="2"/><text x="64" y="1015" font-size="17">Marlbridge • study diagram • check assumptions and context</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>
