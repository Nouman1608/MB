<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img"><title>Use prime factor trees to find the HCF and LCM</title><desc>Marlbridge • OxfordAQA International GCSE Mathematics 9260 • N4: Primes, factors and multiples</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#10233F">Use prime factor trees to find the HCF and LCM</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">Marlbridge • OxfordAQA International GCSE Mathematics 9260 • N4: Primes, factors and multiples</text><rect x="52" y="128" width="1424" height="660" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="88" y="174" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">Prime factor trees reveal the powers shared by both numbers</text><text x="88" y="211" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6D80">540 and 756 • split into factors until every leaf is prime</text><rect x="84" y="244" width="660" height="368" rx="14" fill="#E8F1F4" stroke="#D3DCE2" stroke-width="2"/><text x="414" y="278" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#315F86">540</text><line x1="414" y1="304" x2="260" y2="316" stroke="#D3DCE2" stroke-width="3" /><line x1="414" y1="304" x2="568" y2="316" stroke="#D3DCE2" stroke-width="3" /><rect x="213" y="316" width="94" height="48" rx="12" fill="#FFFFFF" stroke="#315F86" stroke-width="2"/><text x="260" y="347" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">54</text><rect x="521" y="316" width="94" height="48" rx="12" fill="#FFFFFF" stroke="#315F86" stroke-width="2"/><text x="568" y="347" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">10</text><line x1="260" y1="364" x2="178" y2="406" stroke="#D3DCE2" stroke-width="3" /><line x1="260" y1="364" x2="342" y2="406" stroke="#D3DCE2" stroke-width="3" /><rect x="131" y="406" width="94" height="48" rx="12" fill="#FFFFFF" stroke="#315F86" stroke-width="2"/><text x="178" y="437" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">6</text><rect x="295" y="406" width="94" height="48" rx="12" fill="#FFFFFF" stroke="#315F86" stroke-width="2"/><text x="342" y="437" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">9</text><line x1="178" y1="454" x2="130" y2="496" stroke="#D3DCE2" stroke-width="3" /><line x1="178" y1="454" x2="226" y2="496" stroke="#D3DCE2" stroke-width="3" /><rect x="103" y="496" width="54" height="48" rx="10" fill="#F4F1E8" stroke="#C9A227" stroke-width="2"/><text x="130" y="527" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">2</text><rect x="199" y="496" width="54" height="48" rx="10" fill="#F4F1E8" stroke="#C9A227" stroke-width="2"/><text x="226" y="527" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">3</text><line x1="342" y1="454" x2="306" y2="496" stroke="#D3DCE2" stroke-width="3" /><line x1="342" y1="454" x2="378" y2="496" stroke="#D3DCE2" stroke-width="3" /><rect x="279" y="496" width="54" height="48" rx="10" fill="#F4F1E8" stroke="#C9A227" stroke-width="2"/><text x="306" y="527" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">3</text><rect x="351" y="496" width="54" height="48" rx="10" fill="#F4F1E8" stroke="#C9A227" stroke-width="2"/><text x="378" y="527" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">3</text><line x1="568" y1="364" x2="520" y2="406" stroke="#D3DCE2" stroke-width="3" /><line x1="568" y1="364" x2="616" y2="406" stroke="#D3DCE2" stroke-width="3" /><rect x="493" y="406" width="54" height="48" rx="10" fill="#F4F1E8" stroke="#C9A227" stroke-width="2"/><text x="520" y="437" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">2</text><rect x="589" y="406" width="54" height="48" rx="10" fill="#F4F1E8" stroke="#C9A227" stroke-width="2"/><text x="616" y="437" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">5</text><text x="414" y="584" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">540 = 2² × 3³ × 5</text><rect x="784" y="244" width="660" height="368" rx="14" fill="#F4F1E8" stroke="#D3DCE2" stroke-width="2"/><text x="1114" y="278" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#725C8E">756</text><line x1="1114" y1="304" x2="960" y2="316" stroke="#D3DCE2" stroke-width="3" /><line x1="1114" y1="304" x2="1268" y2="316" stroke="#D3DCE2" stroke-width="3" /><rect x="913" y="316" width="94" height="48" rx="12" fill="#FFFFFF" stroke="#725C8E" stroke-width="2"/><text x="960" y="347" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">108</text><rect x="1221" y="316" width="94" height="48" rx="12" fill="#F4F1E8" stroke="#C9A227" stroke-width="2"/><text x="1268" y="347" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">7</text><line x1="960" y1="364" x2="878" y2="406" stroke="#D3DCE2" stroke-width="3" /><line x1="960" y1="364" x2="1042" y2="406" stroke="#D3DCE2" stroke-width="3" /><rect x="831" y="406" width="94" height="48" rx="12" fill="#FFFFFF" stroke="#725C8E" stroke-width="2"/><text x="878" y="437" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">12</text><rect x="995" y="406" width="94" height="48" rx="12" fill="#FFFFFF" stroke="#725C8E" stroke-width="2"/><text x="1042" y="437" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">9</text><line x1="878" y1="454" x2="830" y2="496" stroke="#D3DCE2" stroke-width="3" /><line x1="878" y1="454" x2="926" y2="496" stroke="#D3DCE2" stroke-width="3" /><rect x="803" y="496" width="54" height="48" rx="10" fill="#F4F1E8" stroke="#C9A227" stroke-width="2"/><text x="830" y="527" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">3</text><rect x="879" y="496" width="94" height="48" rx="12" fill="#FFFFFF" stroke="#725C8E" stroke-width="2"/><text x="926" y="527" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">4</text><line x1="926" y1="544" x2="900" y2="496" stroke="#D3DCE2" stroke-width="3" /><line x1="926" y1="544" x2="950" y2="496" stroke="#D3DCE2" stroke-width="3" /><rect x="873" y="496" width="54" height="48" rx="10" fill="#F4F1E8" stroke="#C9A227" stroke-width="2"/><text x="900" y="527" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">2</text><rect x="923" y="496" width="54" height="48" rx="10" fill="#F4F1E8" stroke="#C9A227" stroke-width="2"/><text x="950" y="527" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">2</text><line x1="1042" y1="454" x2="1006" y2="496" stroke="#D3DCE2" stroke-width="3" /><line x1="1042" y1="454" x2="1078" y2="496" stroke="#D3DCE2" stroke-width="3" /><rect x="979" y="496" width="54" height="48" rx="10" fill="#F4F1E8" stroke="#C9A227" stroke-width="2"/><text x="1006" y="527" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">3</text><rect x="1051" y="496" width="54" height="48" rx="10" fill="#F4F1E8" stroke="#C9A227" stroke-width="2"/><text x="1078" y="527" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">3</text><text x="1114" y="584" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">756 = 2² × 3³ × 7</text><rect x="84" y="635" width="660" height="104" rx="12" fill="#E7F3F1" stroke="#E7F3F1" stroke-width="2"/><text x="112" y="673" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#168C8C">HCF: take the lower common powers</text><text x="112" y="710" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">2² × 3³ = 108</text><rect x="784" y="635" width="660" height="104" rx="12" fill="#F9EEEE" stroke="#F9EEEE" stroke-width="2"/><text x="812" y="673" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#C44949">LCM: take each prime’s highest power</text><text x="812" y="710" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">2² × 3³ × 5 × 7 = 3,780</text><text x="764" y="770" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#5B6D80">Check: 108 × 3,780 = 540 × 756 = 408,240</text><text letter-spacing="5" opacity=".075" x="764" y="849" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE STUDY RESOURCES</text><line x1="52" y1="866" x2="1476" y2="866" stroke="#C9A227" stroke-width="2" /><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
