ial,sans-serif" font-size="19" font-weight="700" fill="#10233F">So F = 360/d²</text><path d="M885 450L1350 450" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round"/><text x="885" y="500" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">At d = 6: F = 360/36 = 10 N</text><text x="885" y="544" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#20314B">At F = 250: d² = 360/250 = 1.44</text><text x="885" y="586" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#168C8C">d = 1.2 m (positive distance)</text><text x="1115" y="710" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#5B6D80">Doubling distance divides force by 4.</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
