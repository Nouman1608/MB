<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="title desc"><defs><marker id="aN" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#10233F"/></marker><marker id="aT" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#168C8C"/></marker><marker id="aR" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#C44949"/></marker><marker id="aG" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#C9A227"/></marker></defs><title id="title">Work–energy on a rough slope</title><desc id="desc">A 12 kg crate is pulled from rest 15 m up a rough plane inclined at 20 degrees by a 90 N force parallel to the slope against 25 N resistance. Driving work is 1350 J, resistance work 375 J and gain in potential energy 603.3 J. Remaining kinetic energy is 371.7 J, giving v=7.87 m s⁻¹.</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#10233F">Work–energy on a rough slope</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#5B6D80">Marlbridge • Edexcel International Mathematics</text><rect x="52" y="132" width="1424" height="680" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="82" y="178" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">Source Worked Example 1 • crate moves 15 m up a 20° slope</text><path d="M175 680L725 480L725 680Z" fill="#F0F3F5" stroke="#D3DCE2" stroke-width="2"/><path d="M175 680L725 480" fill="none" stroke="#315F86" stroke-width="5" stroke-linecap="round"/><g transform="rotate(-20 507 530)"><rect x="450" y="500" width="115" height="58" rx="7" fill="#E8F1F4" stroke="#315F86" stroke-width="2"/><text x="507" y="536" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">12 kg</text></g><path d="M533 496L620 465" fill="none" stroke="#168C8C" stroke-width="5" marker-end="url(#aT)"/><path d="M533 558L458 583" fill="none" stroke="#C44949" stroke-width="5" marker-end="url(#aR)"/><path d="M507 525L507 623" fill="none" stroke="#10233F" stroke-width="4" marker-end="url(#aN)"/><text x="622" y="458" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#168C8C">90 N up slope</text><text x="370" y="600" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#C44949">25 N resistance</text><text x="535" y="653" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">weight 12g</text><text x="360" y="717" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#C9A227">20°</text><text x="485" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#315F86">travel distance = 15 m</text><rect x="850" y="215" width="535" height="430" rx="14" fill="#E8F1F4" stroke="#D3DCE2" stroke-width="2"/><text x="1117" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233F">Energy accounting</text><text x="900" y="320" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#168C8C">Work by pull: 90 × 15 = +1350 J</text><text x="900" y="361" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#C44949">Work against resistance: 25 × 15 = 375 J</text><text x="900" y="402" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#315F86">Gain in PE: 12 × 9.8 × 15 sin 20° = 603.3 J</text><path d="M900 431L1335 431" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round"/><text x="1117" y="477" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">Net work → kinetic energy + PE gain</text><text x="1117" y="519" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="600" fill="#20314B">1350 − 375 = KE + 603.3</text><text x="1117" y="559" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="600" fill="#20314B">KE = 371.7 J = ½(12)v²</text><text x="1117" y="601" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#C9A227">v = 7.87 m s⁻¹</text><text x="1117" y="687" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#5B6D80">Starts from rest; resistance does negative work.</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE  •  STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
