<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="t d"><title id="t">Find coefficients in a vector combination</title><desc id="d">Marlbridge mathematics lesson diagram.</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#10233F">Find coefficients in a vector combination</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#5B6D80">Marlbridge • Mathematics</text><rect x="52" y="132" width="1424" height="680" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="82" y="178" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">a = (2,1), b = (−1,3); find m,n when ma + nb = (1,11).</text><path d="M273 690L273 282" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="273" y="708" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">-1</text><path d="M325 690L325 282" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="325" y="708" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">0</text><path d="M377 690L377 282" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="377" y="708" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">1</text><path d="M429 690L429 282" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="429" y="708" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">2</text><path d="M481 690L481 282" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="481" y="708" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">3</text><path d="M533 690L533 282" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="533" y="708" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">4</text><path d="M585 690L585 282" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="585" y="708" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">5</text><path d="M273 690L585 690" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="263" y="694" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">0</text><path d="M273 622L585 622" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="263" y="626" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">2</text><path d="M273 554L585 554" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="263" y="558" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">4</text><path d="M273 486L585 486" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="263" y="490" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">6</text><path d="M273 418L585 418" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="263" y="422" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">8</text><path d="M273 350L585 350" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="263" y="354" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">10</text><path d="M273 282L585 282" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="263" y="286" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">12</text><path d="M273 690L585 690" fill="none" stroke="#10233F" stroke-width="2" stroke-linecap="round"/><path d="M325 690L325 282" fill="none" stroke="#10233F" stroke-width="2" stroke-linecap="round"/><path d="M325 690L533 622" fill="none" stroke="#315F86" stroke-width="6" stroke-linecap="round"/><polygon points="533,622 523.9293812247295,632.6641396762097 519.381642736446,618.7534101826368" fill="#315F86"/><path d="M533 622L377 316" fill="none" stroke="#168C8C" stroke-width="6" stroke-linecap="round"/><polygon points="377,316 388.9401968240225,323.3096990227781 375.90156939950083,329.9568424156715" fill="#168C8C"/><path d="M325 690L377 316" fill="none" stroke="#C9A227" stroke-width="2" stroke-dasharray="8 6" stroke-linecap="round"/><circle cx="325" cy="690" r="7" fill="#10233F" stroke="white" stroke-width="2"/><text x="335" y="680" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#10233F">O</text><circle cx="533" cy="622" r="7" fill="#315F86" stroke="white" stroke-width="2"/><text x="543" y="612" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#315F86">2a = (4,2)</text><circle cx="377" cy="316" r="7" fill="#168C8C" stroke="white" stroke-width="2"/><text x="387" y="306" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#168C8C">(1,11)</text><text x="470" y="610" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#315F86">2a</text><text x="440" y="385" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#168C8C">3b</text><text x="405" y="710" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">x</text><text x="251" y="274" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">y</text><rect x="770" y="220" width="630" height="435" rx="14" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="1085" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233F">Compare components</text><text x="820" y="325" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#315F86">m(2,1) + n(−1,3) = (1,11)</text><text x="820" y="375" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="600" fill="#20314B">2m − n = 1</text><text x="820" y="415" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="600" fill="#20314B">m + 3n = 11</text><path d="M820 444L1350 444" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round"/><text x="820" y="492" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#5B6D80">From the first: n = 2m − 1</text><text x="820" y="532" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#168C8C">m + 3(2m − 1) = 11 → m = 2</text><text x="820" y="572" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#168C8C">Then n = 2(2) − 1 = 3</text><text x="1085" y="622" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">Check: 2a + 3b = (4,2) + (−3,9) = (1,11)</text><text x="1085" y="713" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#5B6D80">The diagram shows the component sum head-to-tail.</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
