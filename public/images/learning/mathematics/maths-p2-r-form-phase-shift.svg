<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">P2 trigonometry: the R-form as a phase-shifted sine</title><desc id="desc">R-form illustration from source example: √7 sinθ−3cosθ=4sin(θ−48.59°), with amplitude 4 and roots 78.6° and 198.6° for value 2.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial,sans-serif" fill="#20314B"><text x="62" y="78" font-size="38" font-weight="700" fill="#0B1F3A">P2 trigonometry: the R-form as a phase-shifted sine</text><text x="64" y="124" font-size="22">Marlbridge teaching diagram • examples are schematic</text><rect x="60" y="165" width="1480" height="755" rx="18" fill="white" stroke="#CCD6D7" stroke-width="2"/><text x="100" y="220" font-size="23" font-weight="400" fill="#20314B" text-anchor="start">Combine √7 sin θ − 3 cos θ into one shifted sine wave.</text><rect x="100" y="270" width="850" height="485" rx="16" fill="#FBFCFC" stroke="#CCD6D7" stroke-width="2"/><text x="130" y="315" font-size="21" font-weight="700" fill="#0B1F3A" text-anchor="start">√7 sin θ − 3 cos θ = 4 sin(θ − 48.59°)</text><path d="M190 610L850 610" fill="none" stroke="#8997A6" stroke-width="2"/><path d="M190 365L190 700" fill="none" stroke="#8997A6" stroke-width="2"/><polyline points="190.0,631.0 193.3,627.5 196.6,623.9 199.9,620.2 203.2,616.3 206.5,612.3 209.8,608.2 213.1,604.0 216.4,599.7 219.7,595.3 223.0,590.8 226.3,586.2 229.6,581.6 232.9,576.9 236.2,572.0 239.5,567.2 242.8,562.3 246.1,557.3 249.4,552.3 252.7,547.2 256.0,542.1 259.3,537.0 262.6,531.8 265.9,526.7 269.2,521.5 272.5,516.4 275.8,511.2 279.1,506.0 282.4,500.9 285.7,495.8 289.0,490.7 292.3,485.7 295.6,480.7 298.9,475.7 302.2,470.8 305.5,466.0 308.8,461.2 312.1,456.5 315.4,451.9 318.7,447.3 322.0,442.9 325.3,438.5 328.6,434.2 331.9,430.1 335.2,426.0 338.5,422.1 341.8,418.3 345.1,414.6 348.4,411.0 351.7,407.6 355.0,404.3 358.3,401.2 361.6,398.2 364.9,395.3 368.2,392.6 371