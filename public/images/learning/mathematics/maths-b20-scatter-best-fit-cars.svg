<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="title desc"><title id="title">Scatter diagram: negative correlation and a balanced fit</title><desc id="desc">Nine car observations show age from 1 to 9 years and value from $18.5k to $7.2k. A straight best-fit line falls from about (1,18.1) to (9,6.7) through the mean point (5,12.4), illustrating strong negative correlation.</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#10233F">Scatter diagram: negative correlation and a balanced fit</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#5B6D80">Marlbridge • Cambridge O Level Mathematics (4024)</text><rect x="52" y="132" width="960" height="666" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="1032" y="132" width="444" height="666" rx="16" fill="#E8F1F4" stroke="#D3DCE2" stroke-width="2"/><path d="M126 704L960 704" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="110" y="709" text-anchor="end" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">6</text><path d="M126 634.8571428571429L960 634.8571428571429" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="110" y="639.8571428571429" text-anchor="end" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">8</text><path d="M126 565.7142857142858L960 565.7142857142858" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="110" y="570.7142857142858" text-anchor="end" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">10</text><path d="M126 496.57142857142856L960 496.57142857142856" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="110" y="501.57142857142856" text-anchor="end" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">12</text><path d="M126 427.42857142857144L960 427.42857142857144" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="110" y="432.42857142857144" text-anchor="end" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">14</text><path d="M126 358.28571428571433L960 358.28571428571433" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="110" y="363.28571428571433" text-anchor="end" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">16</text><path d="M126 289.14285714285717L960 289.14285714285717" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="110" y="294.14285714285717" text-anchor="end" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">18</text><path d="M126 220L960 220" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="110" y="225" text-anchor="end" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">20</text><path d="M126 704L126 220" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="126" y="728" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">1</text><path d="M230.25 704L230.25 220" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="230.25" y="728" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">2</text><path d="M334.5 704L334.5 220" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="334.5" y="728" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">3</text><path d="M438.75 704L438.75 220" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="438.75" y="728" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">4</text><path d="M543 704L543 220" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="543" y="728" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">5</text><path d="M647.25 704L647.25 220" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="647.25" y="728" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">6</text><path d="M751.5 704L751.5 220" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="751.5" y="728" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">7</text><path d="M855.75 704L855.75 220" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="855.75" y="728" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">8</text><path d="M960 704L960 220" fill="none" stroke="#D3DCE2" stroke-width="1"  stroke-linecap="round"/><text x="960" y="728" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">9</text><path d="M126 704L960 704" fill="none" stroke="#10233F" stroke-width="3"  stroke-linecap="round"/><path d="M126 704L126 220" fill="none" stroke="#10233F" stroke-width="3"  stroke-linecap="round"/><text x="543" y="763" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">Age of car (years)</text><text x="83" y="464" transform="rotate(-90 83 464)" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">Value ($ thousand)</text><path d="M119 264.8571428571429L133 278.8571428571429M133 264.8571428571429L119 278.8571428571429" stroke="#168C8C" stroke-width="3" stroke-linecap="round"/><path d="M223.25 320.17142857142863L237.25 334.17142857142863M237.25 320.17142857142863L223.25 334.17142857142863" stroke="#168C8C" stroke-width="3" stroke-linecap="round"/><path d="M327.5 382.40000000000003L341.5 396.40000000000003M341.5 382.40000000000003L327.5 396.40000000000003" stroke="#168C8C" stroke-width="3" stroke-linecap="round"/><path d="M431.75 448.0857142857143L445.75 462.0857142857143M445.75 448.0857142857143L431.75 462.0857142857143" stroke="#168C8C" stroke-width="3" stroke-linecap="round"/><path d="M536 468.8285714285714L550 482.8285714285714M550 468.8285714285714L536 482.8285714285714" stroke="#168C8C" stroke-width="3" stroke-linecap="round"/><path d="M640.25 544.8857142857142L654.25 558.8857142857142M654.25 544.8857142857142L640.25 558.8857142857142" stroke="#168C8C" stroke-width="3" stroke-linecap="round"/><path d="M744.5 562.1714285714286L758.5 576.1714285714286M758.5 562.1714285714286L744.5 576.1714285714286" stroke="#168C8C" stroke-width="3" stroke-linecap="round"/><path d="M848.75 634.7714285714286L862.75 648.7714285714286M862.75 634.7714285714286L848.75 648.7714285714286" stroke="#168C8C" stroke-width="3" stroke-linecap="round"/><path d="M953 655.5142857142857L967 669.5142857142857M967 655.5142857142857L953 669.5142857142857" stroke="#168C8C" stroke-width="3" stroke-linecap="round"/><path d="M126 285.68571428571425L960 679.8" fill="none" stroke="#C44949" stroke-width="4"  stroke-linecap="round"/><circle cx="543" cy="482.74285714285713" r="10" fill="#FFF6DE" stroke="#C9A227" stroke-width="4"/><text x="561" y="468.74285714285713" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#10233F">mean (5, 12.4)</text><rect x="186" y="178" width="296" height="38" rx="8" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="334" y="203" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#20314B">× observed car   — line of best fit</text><text x="1060" y="178" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233F">Interpret the pattern</text><text x="1060" y="222" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#C44949">Strong negative correlation</text><text x="1060" y="254" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#20314B">Older cars tend to be worth less.</text><path d="M1060 282L1448 282" fill="none" stroke="#D3DCE2" stroke-width="2"  stroke-linecap="round"/><text x="1060" y="322" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">Fit by inspection</text><text x="1060" y="352" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20314B">The line follows the overall trend.</text><text x="1060" y="378" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20314B">Points are balanced above and below.</text><text x="1060" y="404" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20314B">It need not pass through every point.</text><rect x="1058" y="440" width="388" height="136" rx="10" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="1080" y="478" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">Check the centre</text><text x="1080" y="509" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20314B">Mean age = 5 years</text><text x="1080" y="536" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20314B">Mean value = $12.4k</text><text x="1080" y="561" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#168C8C">The fit passes through (5, 12.4).</text><rect x="1058" y="604" width="388" height="144" rx="10" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/><text x="1080" y="641" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">Use with care</text><text x="1080" y="672" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20314B">Estimate inside the data range.</text><text x="1080" y="699" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">Age 12 is extrapolation; the straight</text><text x="1080" y="722" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">pattern may not continue.</text><text x="764" y="862" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".06">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE  •  STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="887" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
