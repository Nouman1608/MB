<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img"><title>Draw a pie chart by converting each count to an angle</title><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#10233F">Draw a pie chart by converting each count to an angle</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">Marlbridge • Cambridge IGCSE Mathematics 0580 • Statistical charts and diagrams</text><rect x="52" y="128" width="1424" height="670" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="84" y="178" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">72 people: convert each frequency using 360° ÷ 72 = 5° per person.</text><path d="M390 430 L390.00 245.00 A185 185 0 0 1 531.72 548.92 Z" fill="#315F86" stroke="#FFFFFF" stroke-width="3"/><text x="499" y="379" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">130°</text><path d="M390 430 L531.72 548.92 A185 185 0 0 1 271.08 571.72 Z" fill="#168C8C" stroke="#FFFFFF" stroke-width="3"/><text x="400" y="550" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">90°</text><path d="M390 430 L271.08 571.72 A185 185 0 0 1 207.81 397.88 Z" fill="#C9A227" stroke="#FFFFFF" stroke-width="3"/><text x="277" y="471" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">60°</text><path d="M390 430 L207.81 397.88 A185 185 0 0 1 229.79 337.50 Z" fill="#725C8E" stroke="#FFFFFF" stroke-width="3"/><text x="277" y="389" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">20°</text><path d="M390 430 L229.79 337.50 A185 185 0 0 1 390.00 245.00 Z" fill="#9AB3C6" stroke="#FFFFFF" stroke-width="3"/><text x="330" y="326" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">60°</text><text x="390" y="660" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">Sector angles add to 360°</text><rect x="760" y="220" width="660" height="430" rx="14" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="1090" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233F">Frequency → sector angle</text><text x="815" y="315" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">Beach</text><text x="1050" y="315" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">26</text><text x="1285" y="315" text-anchor="end" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#168C8C">26 × 5 = 130°</text><text x="815" y="361" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">City</text><text x="1050" y="361" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">18</text><text x="1285" y="361" text-anchor="end" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#168C8C">18 × 5 = 90°</text><text x="815" y="407" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">Mountains</text><text x="1050" y="407" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">12</text><text x="1285" y="407" text-anchor="end" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#168C8C">12 × 5 = 60°</text><text x="815" y="453" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">Cruise</text><text x="1050" y="453" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">4</text><text x="1285" y="453" text-anchor="end" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#168C8C">4 × 5 = 20°</text><text x="815" y="499" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">Other</text><text x="1050" y="499" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">12</text><text x="1285" y="499" text-anchor="end" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#168C8C">12 × 5 = 60°</text><path d="M815 548L1375 548" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round"/><text x="815" y="590" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">Total</text><text x="1050" y="590" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">72</text><text x="1285" y="590" text-anchor="end" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">130+90+60+20+60 = 360°</text><text x="1090" y="625" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#5B6D80">Label every sector with its category.</text><text x="760" y="735" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6D80">Measure each angle from the previous radius; the frequency sum and angle sum must both match.</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
