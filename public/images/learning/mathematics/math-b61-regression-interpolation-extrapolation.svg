<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img"><title>Regression: interpolate inside the data range, question extrapolation</title><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#10233F">Regression: interpolate inside the data range, question extrapolation</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">Marlbridge • OCR A Level Mathematics A H240 • Bivariate data: scatter diagrams, correlation and regression</text><rect x="52" y="128" width="1424" height="670" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="84" y="178" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">Weekly training hours x were observed from 2 to 10; regression line: y = 78 − 2.4x.</text><rect x="85" y="220" width="845" height="430" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="507" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#315F86">Predicted resting heart rate (beats/min)</text><rect x="216.3" y="310" width="185.3" height="250" fill="#168C8C" fill-opacity=".12"/><path d="M170.0 310L170.0 560" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="170.0" y="580" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">0</text><path d="M285.8333333333333 310L285.8333333333333 560" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="285.8333333333333" y="580" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">5</text><path d="M401.66666666666663 310L401.66666666666663 560" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="401.66666666666663" y="580" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">10</text><path d="M517.5 310L517.5 560" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="517.5" y="580" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">15</text><path d="M633.3333333333333 310L633.3333333333333 560" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="633.3333333333333" y="580" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">20</text><path d="M749.1666666666667 310L749.1666666666667 560" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="749.1666666666667" y="580" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">25</text><path d="M865.0 310L865.0 560" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="865.0" y="580" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">30</text><path d="M170 560.0L865 560.0" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="158" y="564.0" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">0</text><path d="M170 501.1764705882353L865 501.1764705882353" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="158" y="505.1764705882353" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">20</text><path d="M170 442.3529411764706L865 442.3529411764706" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="158" y="446.3529411764706" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">40</text><path d="M170 383.52941176470586L865 383.52941176470586" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="158" y="387.52941176470586" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">60</text><path d="M170 324.7058823529412L865 324.7058823529412" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round"/><text x="158" y="328.7058823529412" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">80</text><path d="M170 560L865 560" fill="none" stroke="#10233F" stroke-width="2" stroke-linecap="round"/><path d="M170 310L170 560" fill="none" stroke="#10233F" stroke-width="2" stroke-linecap="round"/><path d="M170.0 330.5882352941177L865.0 542.3529411764706" fill="none" stroke="#315F86" stroke-width="4" stroke-linecap="round"/><circle cx="285.8" cy="365.9" r="8" fill="#168C8C"/><circle cx="865.0" cy="542.4" r="8" fill="#C44949"/><text x="297.8333333333333" y="353.88235294117646" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#168C8C">(5, 66) inside</text><text x="853.0" y="528.3529411764706" text-anchor="end" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#C44949">(30, 6)</text><text x="309.0" y="546" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#168C8C">observed x: 2–10</text><text x="507" y="610" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#10233F">Weekly training hours, x</text><rect x="965" y="220" width="455" height="430" rx="14" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="1192" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">Use the line with context</text><text x="1010" y="325" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#315F86">At x = 5:</text><text x="1010" y="360" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#168C8C">y = 78 − 2.4(5) = 66</text><text x="1010" y="395" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#20314B">Interpolation: inside 2–10</text><path d="M1010 425L1375 425" fill="none" stroke="#D3DCE2" stroke-width="2" stroke-linecap="round"/><text x="1010" y="480" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#C44949">At x = 30:</text><text x="1010" y="515" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#C44949">y = 78 − 2.4(30) = 6</text><text x="1010" y="550" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">Extrapolation: outside range;</text><text x="1010" y="578" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">prediction is not credible.</text><text x="1192" y="615" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#5B6D80">Do not rearrange y-on-x to predict x.</text><text x="760" y="710" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#5B6D80">A line may calculate a value outside the data range; that does not make the prediction trustworthy.</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
