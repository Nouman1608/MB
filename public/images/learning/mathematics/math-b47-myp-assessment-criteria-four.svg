<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img"><title>Understand the four MYP mathematics criteria</title><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#10233F">Understand the four MYP mathematics criteria</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#5B6D80">Marlbridge • IB MYP Mathematics • source-specific teaching diagram</text><rect x="52" y="128" width="1424" height="660" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="88" y="176" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">Four equally weighted criteria assess different parts of mathematical work</text><rect x="82" y="220" width="315" height="300" rx="14" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><circle cx="239" cy="278" r="32" fill="#315F86"/><text x="239" y="287" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">A</text><text x="239" y="344" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">Knowing and</text><text x="239" y="371" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">understanding</text><text x="239" y="422" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#20314B">Select and apply mathematics</text><text x="239" y="449" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#20314B">to solve familiar and</text><text x="239" y="476" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#20314B">unfamiliar problems.</text><rect x="423" y="220" width="315" height="300" rx="14" fill="#F4F1E8" stroke="#F4F1E8" stroke-width="2"/><circle cx="580" cy="278" r="32" fill="#725C8E"/><text x="580" y="287" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">B</text><text x="580" y="344" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">Investigating</text><text x="580" y="371" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">patterns</text><text x="580" y="422" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#20314B">Explore patterns with</text><text x="580" y="449" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#20314B">inquiry, risk-taking and</text><text x="580" y="476" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#20314B">critical thinking.</text><rect x="764" y="220" width="315" height="300" rx="14" fill="#E7F3F1" stroke="#E7F3F1" stroke-width="2"/><circle cx="921" cy="278" r="32" fill="#168C8C"/><text x="921" y="287" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">C</text><text x="921" y="344" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">Communicating</text><text x="921" y="422" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#20314B">Use mathematical language</text><text x="921" y="449" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#20314B">and representations clearly,</text><text x="921" y="476" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#20314B">orally and in writing.</text><rect x="1105" y="220" width="315" height="300" rx="14" fill="#F9EEEE" stroke="#F9EEEE" stroke-width="2"/><circle cx="1262" cy="278" r="32" fill="#C44949"/><text x="1262" y="287" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">D</text><text x="1262" y="344" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">Applying in real-life</text><text x="1262" y="371" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">contexts</text><text x="1262" y="422" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#20314B">Transfer mathematics, draw</text><text x="1262" y="449" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#20314B">valid conclusions, reflect</text><text x="1262" y="476" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#20314B">on the result.</text><text x="760" y="568" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">Each criterion carries equal weight</text><line x1="220" y1="606" x2="1308" y2="606" stroke="#C9A227" stroke-width="3" /><text x="220" y="641" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#315F86">A</text><text x="583" y="641" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#725C8E">B</text><text x="945" y="641" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#168C8C">C</text><text x="1308" y="641" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#C44949">D</text><rect x="82" y="670" width="1362" height="76" rx="12" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="763" y="717" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">Each criterion: 0–8 points  •  Four-criterion total: 0–32  •  Criterion C is assessed across all three eAssessment tasks</text><text letter-spacing="5" opacity=".075" x="764" y="849