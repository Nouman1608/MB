<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="ti de"><title id="ti">Circle geometry: the diameter test</title><desc id="de">A coordinate circle shows diameter AB and a point P on the circumference. The two chords meet at a marked right angle; exact source coordinates and gradient checks are stated alongside.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#315F86"/></marker><marker id="arrR" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#C44949"/></marker></defs><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#10233F">Circle geometry: the diameter test</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#5B6D80">Marlbridge • OxfordAQA International A-level Mathematics 9660 • Circle properties (PP1.1)</text><rect x="52" y="128" width="890" height="642" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/>,<path d="M178 682H782M480 176V728" fill="none" stroke="#20314B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />,<text x="485" y="164" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#315F86">Coordinate geometry • schematic scale is equal on both axes</text>,<path d="M204 176V728" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<text x="204" y="748" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">-6</text>,<path d="M296 176V728" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<text x="296" y="748" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">-4</text>,<path d="M388 176V728" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<text x="388" y="748" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">-2</text>,<path d="M480 176V728" fill="none" stroke="#20314B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />,<text x="480" y="748" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">0</text>,<path d="M572 176V728" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<text x="572" y="748" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">2</text>,<path d="M664 176V728" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<text x="664" y="748" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">4</text>,<path d="M756 176V728" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<text x="756" y="748" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">6</text>,<path d="M178 728H782" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<text x="166" y="732" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">-1</text>,<path d="M178 636H782" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<text x="166" y="640" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">1</text>,<path d="M178 544H782" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<text x="166" y="548" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">3</text>,<path d="M178 452H782" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<text x="166" y="456" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">5</text>,<path d="M178 360H782" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<text x="166" y="364" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">7</text>,<path d="M178 268H782" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<text x="166" y="272" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">9</text>,<path d="M178 176H782" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<text x="166" y="180" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">11</text>,<circle cx="572" cy="452" r="205.71825392998068" fill="#315F860D" stroke="#315F86" stroke-width="4"/>,<path d="M388 544L756 360" fill="none" stroke="#D88329" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />,<path d="M388 544L664 268L756 360" fill="none" stroke="#168C8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />,<circle cx="388" cy="544" r="7" fill="#D88329"/>,<circle cx="756" cy="360" r="7" fill="#D88329"/>,<circle cx="664" cy="268" r="7" fill="#C44949"/>,<circle cx="572" cy="452" r="7" fill="#10233F"/>,<text x="376" y="569" text-anchor="end" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#D88329">A(−2, 3)</text>,<text x="768" y="382" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#D88329">B(6, 7)</text>,<text x="676" y="256" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#C44949">P(4, 9)</text>,<text x="584" y="475" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#10233F">C(2, 5)</text>,<path d="M655 277L664 286L673 277" fill="none" stroke="#725C8E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />,<rect x="976" y="152" width="462" height="560" rx="14" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/>,<text x="1207" y="193" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">THE DIAMETER TEST</text>,<text x="1207" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">Centre = midpoint of AB</text>,<text x="1207" y="273" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#315F86">C = (2, 5)</text>,<text x="1207" y="319" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#20314B">r² = (−2−2)² + (3−5)²</text>,<text x="1207" y="348" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#20314B">= 16 + 4 = 20</text>,<path d="M1036 376H1378" fill="none" stroke="#C9A227" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />,<text x="1207" y="415" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#20314B">P check: (4−2)² + (9−5)²</text>,<text x="1207" y="444" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#168C8C">= 4 + 16 = 20 ✓</text>,<text x="1207" y="490" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#D88329">Gradient AP = 1</text>,<text x="1207" y="521" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#168C8C">Gradient BP = −1</text>,<text x="1207" y="566" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#725C8E">Product = −1</text>,<text x="1207" y="610" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">∠APB = 90°</text>,<text x="1207" y="660" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">The right angle lies on the circle.</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE  •  STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
