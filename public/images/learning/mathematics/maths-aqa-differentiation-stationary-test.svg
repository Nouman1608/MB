start">The derivative gives candidate x-values; f″ confirms the nature. Coordinates use the original f(x).</text><path d="M60 972H1540" stroke="#CCD6D7" stroke-width="2"/><text x="64" y="1015" font-size="17">Marlbridge • study diagram • check assumptions and context</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>
