<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Integration as the limit of a sum</title><desc id="desc">For y equals 2x plus 1 between zero and three, three right-end rectangles have total area 15. With n equal strips of width 3 over n, the source sum simplifies to 12 plus 9 over n, tending to the exact integral area 12 as n tends to infinity.</desc>
<defs><style>.bg{fill:#f3f6f6}.panel{fill:#fff;stroke:#d3dde2;stroke-width:3}.h1{font:700 40px Arial;fill:#10233f}.h2{font:700 25px Arial;fill:#10233f}.body{font:21px Arial;fill:#263f58}.small{font:18px Arial;fill:#5b6d80}.eq{font:700 23px Arial;fill:#16807f}.grid{stroke:#e3e9ec;stroke-width:1}.axis{stroke:#526a80;stroke-width:2}.curve{stroke:#c45f59;stroke-width:5;fill:none}.rect{fill:#d9ecee;stroke:#317b91;stroke-width:2}.gold{fill:#fff7dc;stroke:#c9a227;stroke-width:2}</style></defs>
<rect class="bg" width="1600" height="1000"/><text x="54" y="60" class="h1">From narrow rectangles to an integral</text><text x="56" y="98" class="small">OCR A Level Mathematics A • integration as the limit of a sum</text>
<rect x="48" y="132" width="900" height="660" rx="18" class="panel"/><text x="80" y="180" class="h2">Example: area under y = 2x + 1, 0 ≤ x ≤ 3</text>
<path class="grid" d="M180 680H850M180 600H850M180 520H850M180 440H850M180 360H850M180 280H850M330 260V680M480 260V680M630 260V680M780 260V680"/><path class="axis" d="M160 680H870M180 700V250"/>
<rect x="180" y="530" width="200" height="150" class="rect"/><rect x="380" y="430" width="200" height="250" class="rect"/><rect x="580" y="330" width="200" height="350" class="rect"/><path d="M180 630L780 330" class="curve"/><text x="265" y="711" class="small">1</text><text x="465" y="711" class="small">2</text><text x="665" y="711" class="small">3</text><text x="794" y="290" class="small">y=2x+1</text><text x="220" y="765" class="small">Right-end rectangles; width Δx = 1 for n=3 (schematic).</text>
<rect x="990" y="132" width="562" height="660" rx="18" class="panel"/><text x="1022" y="180" class="h2">Make the strips narrower</text><text x="1022" y="232" class="body">n strips:  Δx = 3/n</text><text x="1022" y="282" class="body">Right endpoint of strip r:</text><text x="1022" y="322" class="eq">xᵣ = 3r/n,   r = 1,…,n</text><text x="1022" y="382" class="body">Rectangle sum:</text><text x="1022" y="424" class="eq">Σ (3/n)(2·3r/n + 1)</text><text x="1022" y="474" class="body">Using Σr = n(n+1)/2:</text><text x="1022" y="518" class="eq">= 12 + 9/n</text><path d="M1270 547V586" stroke="#16807f" stroke-width="4"/><text x="1022" y="630" class="body">As n → ∞:</text><rect x="1022" y="652" width="480" height="92" rx="14" class="gold"/><text x="1050" y="692" class="eq">lim (12 + 9/n) = 12</text><text x="1050" y="726" class="small">Matches ∫₀³(2x+1)dx = 12</text>
<text x="56" y="856" class="small">For this increasing straight line, right-end rectangles overestimate at finite n; the excess 9/n vanishes in the limit.</text><text x="56" y="915" class="small">MARLBRIDGE • MATHS • n=3 drawing is schematic; the sum uses general n.</text><text x="1370" y="915" style="font:700 23px Georgia;fill:#10233f">M<tspan fill="#c9a227">B</tspan> MARLBRIDGE</text><path d="M55 941H1545" stroke="#c9a227" stroke-width="3"/><text x="800" y="978" text-anchor="middle" style="font:700 22px Georgia;letter-spacing:9px;fill:#dce4e6">MARLBRIDGE STUDY RESOURCES</text></svg>
