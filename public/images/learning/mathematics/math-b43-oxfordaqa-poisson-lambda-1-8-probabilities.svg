<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="ti de"><title id="ti">Poisson probabilities: the mean shapes the count distribution</title><desc id="de">A discrete probability bar chart for a Poisson random variable with mean 1.8 highlights the probabilities of zero and two errors and the complement for at least one.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#315F86"/></marker><marker id="arrT" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#168C8C"/></marker><marker id="arrR" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#C44949"/></marker></defs><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#10233F">Poisson probabilities: the mean shapes the count distribution</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#5B6D80">Marlbridge • OxfordAQA International A-level Mathematics 9660 • The Poisson distribution (S1)</text><rect x="52" y="128" width="1424" height="548" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/>,<path d="M140 184V644H1080" fill="none" stroke="#20314B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />,<text x="610" y="684" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">Number of errors r on one page</text>,<text transform="rotate(-90 78 414)" x="78" y="414" text-anchor="middle" dominant-baseline="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#20314B">P(X = r)</text>,<text x="630" y="164" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#315F86">X ~ Po(1.8) • P(X=r)=e⁻¹·⁸ × 1.8ʳ / r!</text>,<path d="M140 644H1080" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<text x="126" y="648" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">0.00</text>,<path d="M140 576.3529411764706H1080" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<text x="126" y="580.3529411764706" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">0.05</text>,<path d="M140 508.70588235294116H1080" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<text x="126" y="512.7058823529412" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">0.10</text>,<path d="M140 441.0588235294117H1080" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<text x="126" y="445.0588235294117" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">0.15</text>,<path d="M140 373.4117647058823H1080" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<text x="126" y="377.4117647058823" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">0.20</text>,<path d="M140 305.764705882353H1080" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<text x="126" y="309.764705882353" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">0.25</text>,<path d="M140 238.1176470588236H1080" fill="none" stroke="#D3DCE2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />,<text x="126" y="242.1176470588236" text-anchor="end" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">0.30</text>,<rect x="102.5" y="420.3603277002065" width="75" height="76.03748858192981" rx="5" fill="#D88329"/>,<text x="140" y="666" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">0</text>,<text x="140" y="408.3603277002065" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#D88329">0.1653</text>,<rect x="220" y="241.4485898603716" width="75" height="136.86747944747367" rx="5" fill="#91A7B7"/>,<text x="257.5" y="666" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">1</text>,<text x="257.5" y="229.4485898603716" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#91A7B7">0.2975</text>,<rect x="337.5" y="281.70373087433444" width="75" height="123.18073150272629" rx="5" fill="#168C8C"/>,<text x="375" y="666" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">2</text>,<text x="375" y="269.70373087433444" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#168C8C">0.2678</text>,<rect x="455" y="426.6222385246007" width="75" height="73.90843890163578" rx="5" fill="#91A7B7"/>,<text x="492.5" y="666" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">3</text>,<text x="492.5" y="414.6222385246007" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#91A7B7">0.1607</text>,<rect x="572.5" y="546.1800073360703" width="75" height="33.2587975057361" rx="5" fill="#91A7B7"/>,<text x="610" y="666" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">4</text>,<rect x="690" y="608.7848026409853" width="75" height="11.973167102064997" rx="5" fill="#91A7B7"/>,<text x="727.5" y="666" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">5</text>,<rect x="807.5" y="633.4354407922956" width="75" height="3.591950130619499" rx="5" fill="#91A7B7"/>,<text x="845" y="666" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">6</text>,<rect x="925" y="641.283399060876" width="75" height="0.923644319302157" rx="5" fill="#91A7B7"/>,<text x="962.5" y="666" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">7</text>,<rect x="1042.5" y="643.3887647886971" width="75" height="0.2078199718429853" rx="5" fill="#91A7B7"/>,<text x="1080" y="666" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">8</text>,<rect x="1120" y="170" width="320" height="470" rx="14" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/>,<text x="1280" y="211" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">SOURCE RESULTS</text>,<text x="1280" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">No errors</text>,<text x="1280" y="291" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#D88329">P(X = 0) = 0.1653</text>,<text x="1280" y="350" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">Exactly two</text>,<text x="1280" y="381" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#168C8C">P(X = 2) = 0.2678</text>,<path d="M1160 408H1400" fill="none" stroke="#C9A227" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />,<text x="1280" y="453" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#5B6D80">At least one</text>,<text x="1280" y="486" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#20314B">1 − P(X = 0)</text>,<text x="1280" y="522" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#20314B">= 1 − 0.1653</text>,<text x="1280" y="562" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">= 0.8347</text>,<text x="1280" y="609" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">Complement avoids an infinite sum.</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE  •  STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
