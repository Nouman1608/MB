<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">Production possibility curves: efficiency, opportunity cost and growth</title><desc id="desc">A current PPC and an outward-shifted PPC distinguish an efficient point on the frontier, an inefficient point inside it and an unattainable point outside current capacity. A movement along the frontier trades one good for another; outward shift indicates greater productive capacity.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial, sans-serif" fill="#20314B"><text x="62" y="78" font-size="40" font-weight="700" fill="#0B1F3A">Production possibility curves: efficiency, opportunity cost and growth</text><text x="64" y="124" font-size="22">Marlbridge teaching diagram • examples are schematic</text><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#C9A227"/></marker></defs><rect x="60" y="165" width="1480" height="755" rx="18" fill="white" stroke="#CCD6D7" stroke-width="2"/><text x="100" y="225" font-size="22">A production possibility curve separates efficient production, unused capacity and unattainable output.</text><path d="M250 780 V330 M250 780 H1030" stroke="#0B1F3A" stroke-width="4"/><text x="590" y="830" text-anchor="middle" font-size="20">Good X output</text><text x="180" y="530" text-anchor="middle" font-size="20" transform="rotate(-90 180 530)">Good Y output</text><path d="M270 760 C400 540 650 370 930 305" fill="none" stroke="#2D7A78" stroke-width="6"/><text x="730" y="385" font-size="19" font-weight="700" fill="#2D7A78">Current PPC</text><path d="M270 760 C430 475 715 280 1030 200" fill="none" stroke="#397DA4" stroke-width="5" stroke-dasharray="12 9"/><text x="700" y="255" font-size="19" font-weight="700" fill="#397DA4">PPC after growth: more capacity</text><circle cx="500" cy="471" r="9" fill="#C9A227"/><text x="545" y="475" font-size="20" font-weight="700">A · on frontier: productively efficient</text><circle cx="445" cy="590" r="9" fill="#B6534B"/><text x="458" y="620" font-size="19">B · inside: resources underused or inefficient</text><circle cx="910" cy="270" r="9" fill="#B6534B"/><text x="930" y="300" font-size="19">C · outside current PPC</text><path d="M520 458 Q610 405 680 373" fill="none" stroke="#C9A227" stroke-width="5" marker-end="url(#arr)"/><text x="300" y="420" font-size="17" font-weight="700" fill="#0B1F3A">Move along: more X, less Y</text><path d="M1120 610 V470" stroke="#397DA4" stroke-width="4" marker-end="url(#arr)"/><text x="1150" y="500" font-size="18" font-weight="700" fill="#0B1F3A">Shift outward:</text><text x="1150" y="530" font-size="18">more resources,</text><text x="1150" y="560" font-size="18">technology or</text><text x="1150" y="590" font-size="18">productivity raises</text><text x="1150" y="620" font-size="18">productive capacity.</text><line x1="60" y1="972" x2="1540" y2="972" stroke="#CCD6D7" stroke-width="2"/><text x="64" y="1017" font-size="18">Marlbridge • study diagram • check assumptions and context</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>
