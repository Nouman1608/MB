<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">Equilibrium and the price mechanism: how prices adjust</title><desc id="desc">A demand and supply diagram marks equilibrium, a below-equilibrium shortage with upward price pressure, and the general surplus adjustment.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial,sans-serif" fill="#20314B"><text x="62" y="78" font-size="40" font-weight="700" fill="#0B1F3A" text-anchor="start">Equilibrium and the price mechanism: how prices adjust</text><text x="64" y="124" font-size="22" font-weight="400" fill="#20314B" text-anchor="start">Marlbridge teaching diagram • examples are schematic</text><rect x="60" y="165" width="1480" height="755" rx="18" fill="white" stroke="#CCD6D7" stroke-width="2"/><text x="100" y="225" font-size="22" font-weight="400" fill="#20314B" text-anchor="start">At equilibrium Qd = Qs. Disequilibrium creates pressure that moves price back toward equilibrium.</text><rect x="105" y="270" width="900" height="550" rx="14" fill="#FBFCFC" stroke="#CCD6D7" stroke-width="2"/><path d="M220 755V345 M220 755H910" stroke="#20314B" stroke-width="3" fill="none"/><text x="565.0" y="791" font-size="18" font-weight="400" fill="#20314B" text-anchor="middle">Quantity</text><text x="185" y="550.0" font-size="18" fill="#20314B" transform="rotate(-90 185 550.0)">Price</text><path d="M300 355L825 705" stroke="#397DA4" stroke-width="5" fill="none"/><text x="800" y="710" font-size="19" font-weight="700" fill="#397DA4" text-anchor="start">D</text><path d="M300 710L825 355" stroke="#2D7A78" stroke-width="5" fill="none"/><text x="800" y="372" font-size="19" font-weight="700" fill="#2D7A78" text-anchor="start">S</text><circle cx="560" cy="530" r="9" fill="#0B1F3A"/><text x="575" y="520" font-size="18" font-weight="700" fill="#0B1F3A" text-anchor="start">E</text><path d="M220 530H560" stroke="#CCD6D7" stroke-width="2" fill="none" stroke-dasharray="7 6"/><path d="M220 460H650" stroke="#CCD6D7" stroke-width="2" fill="none" stroke-dasharray="7 6"/><path d="M220 610H470" stroke="#CCD6D7" stroke-width="2" fill="none" stroke-dasharray="7 6"/><path d="M470 610V755 M650 460V755" stroke="#CCD6D7" stroke-width="2" fill="none" stroke-dasharray="6 6"/><text x="470" y="788" font-size="16" font-weight="700" fill="#2D7A78" text-anchor="middle">Qs</text><text x="650" y="788" font-size="16" font-weight="700" fill="#397DA4" text-anchor="middle">Qd</text><path d="M470 585H650" stroke="#B94E46" stroke-width="5" fill="none"/><path d="M650 577l14 8-14 8z" fill="#B94E46"/><text x="560" y="570" font-size="17" font-weight="700" fill="#B94E46" text-anchor="middle">Shortage</text><path d="M220 610V530" stroke="#C9A227" stroke-width="4" fill="none"/><path d="M212 540l8-14 8 14z" fill="#C9A227"/><text x="245" y="595" font-size="16" font-weight="700" fill="#C9A227" text-anchor="start">Price rises</text><rect x="1050" y="300" width="390" height="205" rx="14" fill="#FBE8E5" stroke="#B94E46" stroke-width="2"/><text x="1080" y="345" font-size="21" font-weight="700" fill="#0B1F3A" text-anchor="start">Price below equilibrium</text><text x="1080" y="390" font-size="18" font-weight="700" fill="#B94E46" text-anchor="start">Qd &gt; Qs = shortage</text><text x="1080" y="435" font-size="18" font-weight="400" fill="#20314B" text-anchor="start">Buyers bid price upward.</text><rect x="1050" y="545" width="390" height="205" rx="14" fill="#FFF4D6" stroke="#C9A227" stroke-width="2"/><text x="1080" y="590" font-size="21" font-weight="700" fill="#0B1F3A" text-anchor="start">Price above equilibrium</text><text x="1080" y="635" font-size="18" font-weight="700" fill="#C9A227" text-anchor="start">Qs &gt; Qd = surplus</text><text x="1080" y="680" font-size="17" font-weight="400" fill="#20314B" text-anchor="start">Sellers cut price to clear stock.</text><path d="M60 972H1540" stroke="#CCD6D7" stroke-width="2" fill="none"/><text x="64" y="1015" font-size="17" font-weight="400" fill="#20314B" text-anchor="start">Marlbridge • study diagram • check assumptions and context</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>
