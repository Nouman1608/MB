<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">Equilibrium: price functions and market surplus</title><desc id="desc">An equilibrium graph labels consumer and producer surplus; adjacent cards explain the price mechanism’s signalling, incentive and rationing functions.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial,sans-serif" fill="#20314B"><text x="62" y="78" font-size="40" font-weight="700" fill="#0B1F3A" text-anchor="start">Equilibrium: price functions and market surplus</text><text x="64" y="124" font-size="22" font-weight="400" fill="#20314B" text-anchor="start">Marlbridge teaching diagram • examples are schematic</text><rect x="60" y="165" width="1480" height="755" rx="18" fill="white" stroke="#CCD6D7" stroke-width="2"/><text x="100" y="225" font-size="22" font-weight="400" fill="#20314B" text-anchor="start">At competitive equilibrium, marginal benefit equals marginal cost and total surplus is maximised in the model.</text><rect x="100" y="270" width="855" height="555" rx="14" fill="#FBFCFC" stroke="#CCD6D7" stroke-width="2"/><path d="M205 745V350 M205 745H885" stroke="#20314B" stroke-width="3" fill="none"/><text x="545.0" y="781" font-size="18" font-weight="400" fill="#20314B" text-anchor="middle">Quantity</text><text x="170" y="547.5" font-size="18" fill="#20314B" transform="rotate(-90 170 547.5)">Price</text><path d="M285 355L800 700" stroke="#397DA4" stroke-width="5"/><path d="M285 700L800 355" stroke="#2D7A78" stroke-width="5"/><polygon points="285,355 543,527 285,527" fill="#C9A227" opacity="0.38"/><polygon points="285,700 543,527 285,527" fill="#2D7A78" opacity="0.32"/><path d="M205 527H543" stroke="#0B1F3A" stroke-width="2" fill="none" stroke-dasharray="7 6"/><circle cx="543" cy="527" r="8" fill="#0B1F3A"/><text x="550" y="512" font-size="16" font-weight="700" fill="#0B1F3A" text-anchor="start">E (P*, Q*)</text><text x="300" y="400" font-size="17" font-weight="700" fill="#397DA4" text-anchor="start">D</text><text x="795" y="370" font-size="17" font-weight="700" fill="#2D7A78" text-anchor="start">S</text><text x="310" y="475" font-size="15" font-weight="700" fill="#C9A227" text-anchor="start">Consumer surplus</text><text x="310" y="575" font-size="15" font-weight="700" fill="#2D7A78" text-anchor="start">Producer surplus</text><rect x="1010" y="285" width="440" height="155" rx="14" fill="#E7EFED" stroke="#2D7A78" stroke-width="2"/><text x="1040" y="330" font-size="21" font-weight="700" fill="#0B1F3A" text-anchor="start">Signalling</text><text x="1040" y="375" font-size="17" font-weight="400" fill="#20314B" text-anchor="start">Price communicates changing scarcity</text><text x="1040" y="408" font-size="17" font-weight="400" fill="#20314B" text-anchor="start">and consumer preferences.</text><rect x="1010" y="465" width="440" height="155" rx="14" fill="#FBFCFC" stroke="#CCD6D7" stroke-width="2"/><text x="1040" y="510" font-size="21" font-weight="700" fill="#0B1F3A" text-anchor="start">Incentive</text><text x="1040" y="555" font-size="17" font-weight="400" fill="#20314B" text-anchor="start">Higher price can encourage suppliers</text><text x="1040" y="588" font-size="17" font-weight="400" fill="#20314B" text-anchor="start">to offer more output.</text><rect x="1010" y="645" width="440" height="155" rx="14" fill="#FFF4D6" stroke="#C9A227" stroke-width="2"/><text x="1040" y="690" font-size="21" font-weight="700" fill="#0B1F3A" text-anchor="start">Rationing</text><text x="1040" y="735" font-size="17" font-weight="400" fill="#20314B" text-anchor="start">Price allocates scarce goods to buyers</text><text x="1040" y="768" font-size="17" font-weight="400" fill="#20314B" text-anchor="start">willing and able to pay.</text><path d="M60 972H1540" stroke="#CCD6D7" stroke-width="2" fill="none"/><text x="64" y="1015" font-size="17" font-weight="400" fill="#20314B" text-anchor="start">Marlbridge • study diagram • check assumptions and context</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>
