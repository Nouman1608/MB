<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img"><title>Pearson Edexcel IGCSE: production and business costs</title><rect width="1600" height="1050" fill="#F3F6F6"/><text x="70" y="95" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#0B1F3A">Pearson Edexcel IGCSE: production and business costs</text><text x="72" y="145" font-family="Arial,sans-serif" font-size="23" fill="#526273">Marlbridge teaching diagram • use with the lesson text</text><rect x="60" y="190" width="1480" height="730" rx="20" fill="white" stroke="#CCD6D7" stroke-width="2"/><g font-family="Arial,sans-serif"><text x="95" y="265" font-size="28" font-weight="700" fill="#0B1F3A">Long-run average cost and scale</text><rect x="100" y="335" width="1400" height="104" rx="14" fill="#EAF2F4" stroke="#CCD6D7" stroke-width="2"/><circle cx="145" cy="387" r="23" fill="#0B1F3A"/><text x="145" y="395" text-anchor="middle" font-size="23" font-weight="700" fill="white">1</text><text x="190" y="396" font-size="24" fill="#20314B">As firm output grows, specialisation / bulk buying may lower average cost.</text><rect x="100" y="461" width="1400" height="104" rx="14" fill="#F8F1DC" stroke="#CCD6D7" stroke-width="2"/><circle cx="145" cy="513" r="23" fill="#0B1F3A"/><text x="145" y="521" text-anchor="middle" font-size="23" font-weight="700" fill="white">2</text><text x="190" y="522" font-size="24" fill="#20314B">Minimum efficient scale (MES) is the lowest point of LRAC.</text><rect x="100" y="587" width="1400" height="104" rx="14" fill="#EAF2F4" stroke="#CCD6D7" stroke-width="2"/><circle cx="145" cy="639" r="23" fill="#0B1F3A"/><text x="145" y="647" text-anchor="middle" font-size="23" font-weight="700" fill="white">3</text><text x="190" y="648" font-size="24" fill="#20314B">Past efficient scale, coordination problems may raise average cost.</text><rect x="100" y="713" width="1400" height="104" rx="14" fill="#F4E9E5" stroke="#CCD6D7" stroke-width="2"/><circle cx="145" cy="765" r="23" fill="#0B1F3A"/><text x="145" y="773" text-anchor="middle" font-size="23" font-weight="700" fill="white">4</text><text x="190" y="774" font-size="21" fill="#20314B">Internal economies benefit one firm; external economies benefit firms across an industry cluster.</text></g><text x="90" y="965" font-family="Arial,sans-serif" font-size="19" fill="#526273">Distinguish average cost from total cost; outcomes depend on the firm and industry.</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></svg>
