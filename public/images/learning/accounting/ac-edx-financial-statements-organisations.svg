<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="ttl desc"><title id="ttl">Financial statements across organisations</title><desc id="desc">Four-part teaching diagram for Edexcel IAL • Topic 1.3.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><text x="70" y="82" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#0B1F3A">Financial statements across organisations</text><text x="72" y="126" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#526273">Edexcel IAL • Topic 1.3</text><rect x="55" y="160" width="1490" height="740" rx="24" fill="white" stroke="#CCD6D7" stroke-width="2"/><rect x="82" y="185" width="696" height="330" rx="20" fill="#EAF2F4" stroke="#CCD6D7" stroke-width="2"/><text x="112" y="225" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#0B1F3A">FROM TRIAL BALANCE TO PROFIT</text><circle cx="116" cy="256" r="5" fill="#176B5B"/><text x="134" y="263" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">Trial balance + year-end adjustments</text><circle cx="116" cy="288" r="5" fill="#176B5B"/><text x="134" y="295" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">Closing inventory; prepayments and accruals</text><circle cx="116" cy="320" r="5" fill="#176B5B"/><text x="134" y="327" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">Depreciation; irrecoverable debts; allowance for</text><text x="134" y="354" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">receivables</text><circle cx="116" cy="379" r="5" fill="#176B5B"/><text x="134" y="386" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">→ Statement of profit or loss → profit for the year</text><rect x="822" y="185" width="696" height="330" rx="20" fill="#F8F1DC" stroke="#CCD6D7" stroke-width="2"/><text x="852" y="225" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#0B1F3A">SOLE TRADER / DEPARTMENT</text><circle cx="856" cy="256" r="5" fill="#176B5B"/><text x="874" y="263" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">Profit increases sole trader capital; drawings</text><text x="874" y="290" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">reduce it.</text><circle cx="856" cy="315" r="5" fill="#176B5B"/><text x="874" y="322" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">Closing capital = opening capital + profit −</text><text x="874" y="349" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">drawings.</text><circle cx="856" cy="374" r="5" fill="#176B5B"/><text x="874" y="381" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">Departmental statements separate each department’s</text><text x="874" y="408" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">result.</text><circle cx="856" cy="433" r="5" fill="#176B5B"/><text x="874" y="440" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">Apportion shared income or costs on a consistent</text><text x="874" y="467" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">basis.</text><rect x="82" y="540" width="696" height="330" rx="20" fill="#E8F2EC" stroke="#CCD6D7" stroke-width="2"/><text x="112" y="580" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#0B1F3A">PARTNERSHIP</text><circle cx="116" cy="611" r="5" fill="#176B5B"/><text x="134" y="618" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">Profit for the year → appropriation account.</text><circle cx="116" cy="643" r="5" fill="#176B5B"/><text x="134" y="650" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">Apply agreement: partner salaries, interest on</text><text x="134" y="677" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">capital, then residual profit share.</text><circle cx="116" cy="702" r="5" fill="#176B5B"/><text x="134" y="709" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">Current accounts record each partner’s share and</text><text x="134" y="736" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">drawings.</text><circle cx="116" cy="761" r="5" fill="#176B5B"/><text x="134" y="768" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">Admission: account for agreed goodwill and revalued</text><text x="134" y="795" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">assets.</text><rect x="822" y="540" width="696" height="330" rx="20" fill="#F0ECF5" stroke="#CCD6D7" stroke-width="2"/><text x="852" y="580" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#0B1F3A">CLUB / MANUFACTURER</text><circle cx="856" cy="611" r="5" fill="#176B5B"/><text x="874" y="618" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">Club: subscriptions and other income → income and</text><text x="874" y="645" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">expenditure account.</text><circle cx="856" cy="670" r="5" fill="#176B5B"/><text x="874" y="677" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">Surplus or deficit changes accumulated fund; capital</text><text x="874" y="704" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">items stay separate.</text><circle cx="856" cy="729" r="5" fill="#176B5B"/><text x="874" y="736" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">Manufacturer: direct materials + labour + production</text><text x="874" y="763" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">overheads → cost of production.</text><circle cx="856" cy="788" r="5" fill="#176B5B"/><text x="874" y="795" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">Transfer cost of production into cost of sales.</text><rect x="65" y="918" width="1195" height="80" rx="16" fill="#FFFFFF" stroke="#CCD6D7" stroke-width="2"/><text x="90" y="950" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#C9A227">MARLBRIDGE  •  A-LEVEL ACCOUNTING</text><text x="90" y="979" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#526273">Start with adjusted figures; organisation type determines the statement or appropriation that follows.</text><image href="data:image/svg+xml;base64," x="1315" y="928" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></svg>
