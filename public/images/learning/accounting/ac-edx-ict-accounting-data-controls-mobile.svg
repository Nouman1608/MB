<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1720" viewBox="0 0 900 1720" role="img" aria-labelledby="ttl desc"><title id="ttl">Accounting ICT: data, decisions and controls — mobile</title><desc id="desc">Four stacked teaching panels for Edexcel IAL • Topic 2.9.</desc><rect width="900" height="1720" fill="#F3F6F6"/><text x="44" y="76" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#0B1F3A">Accounting ICT: data, decisions and</text><text x="44" y="112" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#0B1F3A">controls</text><text x="46" y="149" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#526273">Edexcel IAL • Topic 2.9</text><rect x="42" y="172" width="816" height="325" rx="20" fill="#EAF2F4" stroke="#CCD6D7" stroke-width="2"/><text x="76" y="212" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#0B1F3A">CAPTURE TRANSACTIONS</text><circle cx="80" cy="239" r="5" fill="#176B5B"/><text x="98" y="246" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20314B">EPOS records sales and stock movements.</text><circle cx="80" cy="269" r="5" fill="#176B5B"/><text x="98" y="276" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20314B">Invoices and credit notes update receivables and payables.</text><circle cx="80" cy="299" r="5" fill="#176B5B"/><text x="98" y="306" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20314B">Payroll and purchase records feed cost and cash data.</text><circle cx="80" cy="329" r="5" fill="#176B5B"/><text x="98" y="336" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20314B">Use unique references and validated inputs.</text><rect x="42" y="509" width="816" height="325" rx="20" fill="#F8F1DC" stroke="#CCD6D7" stroke-width="2"/><text x="76" y="549" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#0B1F3A">PROCESS + ANALYSE</text><circle cx="80" cy="576" r="5" fill="#176B5B"/><text x="98" y="583" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20314B">Spreadsheet formulas recalculate when an input changes.</text><circle cx="80" cy="606" r="5" fill="#176B5B"/><text x="98" y="613" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20314B">What-if analysis tests changed assumptions against a budget.</text><circle cx="80" cy="636" r="5" fill="#176B5B"/><text x="98" y="643" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20314B">Accounting packages process ledgers, invoices and debtor lists.</text><circle cx="80" cy="666" r="5" fill="#176B5B"/><text x="98" y="673" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20314B">EPOS can compare stock with reorder levels and report margins.</text><rect x="42" y="846" width="816" height="325" rx="20" fill="#E8F2EC" stroke="#CCD6D7" stroke-width="2"/><text x="76" y="886" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#0B1F3A">MANAGEMENT INFORMATION</text><circle cx="80" cy="913" r="5" fill="#176B5B"/><text x="98" y="920" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20314B">Budgets and variances support planning and control.</text><circle cx="80" cy="943" r="5" fill="#176B5B"/><text x="98" y="950" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20314B">Product costs inform pricing and production decisions.</text><circle cx="80" cy="973" r="5" fill="#176B5B"/><text x="98" y="980" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20314B">Aged receivables lists focus credit control.</text><circle cx="80" cy="1003" r="5" fill="#176B5B"/><text x="98" y="1010" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20314B">Reports are faster; decisions still need interpretation.</text><rect x="42" y="1183" width="816" height="325" rx="20" fill="#F4E9E5" stroke="#CCD6D7" stroke-width="2"/><text x="76" y="1223" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#0B1F3A">AUDIT TRAIL + TRADE-OFFS</text><circle cx="80" cy="1250" r="5" fill="#176B5B"/><text x="98" y="1257" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20314B">Keep source documents, user IDs, dates and change logs.</text><circle cx="80" cy="1280" r="5" fill="#176B5B"/><text x="98" y="1287" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20314B">Restrict access; back up data; reconcile system totals.</text><circle cx="80" cy="1310" r="5" fill="#176B5B"/><text x="98" y="1317" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20314B">Benefits: speed, consistency, timely information, fewer routine</text><text x="98" y="1343" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20314B">errors.</text><circle cx="80" cy="1366" r="5" fill="#176B5B"/><text x="98" y="1373" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20314B">Risks: setup cost, outages, cyberattack, bad input and training.</text><rect x="42" y="1530" width="816" height="136" rx="18" fill="#FFFFFF" stroke="#CCD6D7" stroke-width="2"/><text x="68" y="1572" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#C9A227">A-LEVEL ACCOUNTING  •  MARLBRIDGE</text><image href="data:image/svg+xml;base64," x="641" y="1541" width="210" height="52" preserveAspectRatio="xMidYMid meet"/><text x="68" y="1614" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#526273">Name the task, information produced, control and trade-off;</text><text x="68" y="1638" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#526273">software brand names are not required.</text></svg>
