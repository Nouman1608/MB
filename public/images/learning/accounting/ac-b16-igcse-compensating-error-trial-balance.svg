<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">A compensating error can leave the trial balance balanced</title><desc id="desc">Tracks the source example in which sales and purchases are each understated by $200, leaving debit and credit totals equal and gross profit unchanged.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><text x="55" y="66" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#0B1F3A" text-anchor="start">A compensating error can leave the trial balance balanced</text><text x="58" y="105" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#526273" text-anchor="start">OxfordAQA · IGCSE · Verification of accounting records</text><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#287F7A"/></marker></defs><rect x="80" y="155" width="660" height="240" rx="16" fill="#EAF2F4" stroke="#CCD6D7" stroke-width="2"/><text x="102" y="194" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#3E88B7" text-anchor="start">ERROR 1 · SALES (CREDIT)</text><text x="102" y="233" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20314B" text-anchor="start">Correct amount should be recorded</text><text x="102" y="266" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20314B" text-anchor="start">Sales is understated by $200</text><text x="102" y="299" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20314B" text-anchor="start">Credit total falls by $200</text><rect x="860" y="155" width="660" height="240" rx="16" fill="#FBF5E4" stroke="#CCD6D7" stroke-width="2"/><text x="882" y="194" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#D2AA2F" text-anchor="start">ERROR 2 · PURCHASES (DEBIT)</text><text x="882" y="233" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20314B" text-anchor="start">Correct amount should be recorded</text><text x="882" y="266" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20314B" text-anchor="start">Purchases is understated by $200</text><text x="882" y="299" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#20314B" text-anchor="start">Debit total falls by $200</text><line x1="740" y1="270" x2="855" y2="270" stroke="#287F7A" stroke-width="5" marker-end="url(#arr)"/><rect x="205" y="455" width="1190" height="170" rx="16" fill="#E8F3EF" stroke="#CCD6D7" stroke-width="2"/><text x="800" y="510" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#287F7A" text-anchor="middle">TRIAL BALANCE STILL AGREES</text><text x="800" y="555" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#20314B" text-anchor="middle">Debits − $200  =  Credits − $200</text><text x="800" y="595" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#526273" text-anchor="middle">No imbalance is raised by this pair of errors.</text><rect x="205" y="675" width="1190" height="170" rx="16" fill="#F1EEF7" stroke="#CCD6D7" stroke-width="2"/><text x="800" y="730" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0B1F3A" text-anchor="middle">GROSS PROFIT IN THIS EXAMPLE IS UNCHANGED</text><text x="800" y="775" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20314B" text-anchor="middle">(Sales − 200) − (Purchases − 200)  =  Sales − Purchases</text><text x="800" y="815" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#D96D5F" text-anchor="middle">This cancellation is specific to these two income/cost errors.</text><line x1="48" y1="925" x2="1552" y2="925" stroke="#D2AA2F" stroke-width="3"/><text x="56" y="966" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#526273" text-anchor="start">Marlbridge · Accounting study resource · schematic; source-linked</text><image href="data:image/svg+xml;base64," x="1320" y="940" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></svg>