<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">AQA Accounting: four business ownership structures compared</title><desc id="desc">A four-row comparison of sole traders, partnerships, private limited companies and public limited companies across ownership and liability, typical finance routes and reporting pattern, with legal-rule qualifications.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial, sans-serif" fill="#20314B"><text x="62" y="78" font-size="40" font-weight="700" fill="#0B1F3A">AQA Accounting: four business ownership structures compared</text><text x="64" y="124" font-size="22">Marlbridge teaching diagram • examples are schematic</text><rect x="60" y="165" width="1480" height="755" rx="18" fill="white" stroke="#CCD6D7" stroke-width="2"/><text x="100" y="225" font-size="21">Compare ownership, liability, finance and reporting. Exact statutory duties depend on applicable law and size.</text><rect x="90" y="280" width="260" height="68" fill="#0B1F3A" stroke="white" stroke-width="2"/><text x="104" y="322" font-size="18" font-weight="700" fill="white">Organisation</text><rect x="350" y="280" width="330" height="68" fill="#0B1F3A" stroke="white" stroke-width="2"/><text x="364" y="322" font-size="18" font-weight="700" fill="white">Ownership and liability</text><rect x="680" y="280" width="360" height="68" fill="#0B1F3A" stroke="white" stroke-width="2"/><text x="694" y="322" font-size="18" font-weight="700" fill="white">Typical finance routes</text><rect x="1040" y="280" width="390" height="68" fill="#0B1F3A" stroke="white" stroke-width="2"/><text x="1054" y="322" font-size="18" font-weight="700" fill="white">Reporting pattern</text><rect x="90" y="348" width="260" height="108" fill="#F5F8F7" stroke="#CCD6D7" stroke-width="1.5"/><text x="104" y="383" font-size="18" font-weight="700" fill="#0B1F3A"><tspan x="104" dy="0">Sole trader</tspan></text><rect x="350" y="348" width="330" height="108" fill="#F5F8F7" stroke="#CCD6D7" stroke-width="1.5"/><text x="364" y="383" font-size="18" font-weight="400" fill="#0B1F3A"><tspan x="364" dy="0">One owner</tspan><tspan x="364" dy="23">Unlimited liability</tspan></text><rect x="680" y="348" width="360" height="108" fill="#F5F8F7" stroke="#CCD6D7" stroke-width="1.5"/><text x="694" y="383" font-size="18" font-weight="400" fill="#0B1F3A"><tspan x="694" dy="0">Owner’s capital</tspan><tspan x="694" dy="23">Overdraft · loan</tspan></text><rect x="1040" y="348" width="390" height="108" fill="#F5F8F7" stroke="#CCD6D7" stroke-width="1.5"/><text x="1054" y="383" font-size="18" font-weight="400" fill="#0B1F3A"><tspan x="1054" dy="0">Generally lighter</tspan><tspan x="1054" dy="23">statutory reporting</tspan></text><rect x="90" y="456" width="260" height="108" fill="#E7EFED" stroke="#CCD6D7" stroke-width="1.5"/><text x="104" y="491" font-size="18" font-weight="700" fill="#0B1F3A"><tspan x="104" dy="0">Partnership</tspan></text><rect x="350" y="456" width="330" height="108" fill="#E7EFED" stroke="#CCD6D7" stroke-width="1.5"/><text x="364" y="491" font-size="18" font-weight="400" fill="#0B1F3A"><tspan x="364" dy="0">Two or more owners</tspan><tspan x="364" dy="23">Ordinary partners generally</tspan><tspan x="364" dy="23">have unlimited liability</tspan></text><rect x="680" y="456" width="360" height="108" fill="#E7EFED" stroke="#CCD6D7" stroke-width="1.5"/><text x="694" y="491" font-size="18" font-weight="400" fill="#0B1F3A"><tspan x="694" dy="0">Partners’ capital</tspan><tspan x="694" dy="23">Overdraft · loan</tspan></text><rect x="1040" y="456" width="390" height="108" fill="#E7EFED" stroke="#CCD6D7" stroke-width="1.5"/><text x="1054" y="491" font-size="18" font-weight="400" fill="#0B1F3A"><tspan x="1054" dy="0">Generally lighter than</tspan><tspan x="1054" dy="23">company reporting</tspan></text><rect x="90" y="564" width="260" height="108" fill="#F5F8F7" stroke="#CCD6D7" stroke-width="1.5"/><text x="104" y="599" font-size="18" font-weight="700" fill="#0B1F3A"><tspan x="104" dy="0">Private Ltd</tspan></text><rect x="350" y="564" width="330" height="108" fill="#F5F8F7" stroke="#CCD6D7" stroke-width="1.5"/><text x="364" y="599" font-size="18" font-weight="400" fill="#0B1F3A"><tspan x="364" dy="0">Shareholders</tspan><tspan x="364" dy="23">Limited liability</tspan><tspan x="364" dy="23">Shares not offered publicly</tspan></text><rect x="680" y="564" width="360" height="108" fill="#F5F8F7" stroke="#CCD6D7" stroke-width="1.5"/><text x="694" y="599" font-size="18" font-weight="400" fill="#0B1F3A"><tspan x="694" dy="0">Private share capital</tspan><tspan x="694" dy="23">Loans · debentures</tspan></text><rect x="1040" y="564" width="390" height="108" fill="#F5F8F7" stroke="#CCD6D7" stroke-width="1.5"/><text x="1054" y="599" font-size="18" font-weight="400" fill="#0B1F3A"><tspan x="1054" dy="0">Company filings and</tspan><tspan x="1054" dy="23">statutory reporting</tspan></text><rect x="90" y="672" width="260" height="108" fill="#E7EFED" stroke="#CCD6D7" stroke-width="1.5"/><text x="104" y="707" font-size="18" font-weight="700" fill="#0B1F3A"><tspan x="104" dy="0">Public plc</tspan></text><rect x="350" y="672" width="330" height="108" fill="#E7EFED" stroke="#CCD6D7" stroke-width="1.5"/><text x="364" y="707" font-size="18" font-weight="400" fill="#0B1F3A"><tspan x="364" dy="0">Public shareholders</tspan><tspan x="364" dy="23">Limited liability</tspan><tspan x="364" dy="23">Shares offered to public</tspan></text><rect x="680" y="672" width="360" height="108" fill="#E7EFED" stroke="#CCD6D7" stroke-width="1.5"/><text x="694" y="707" font-size="18" font-weight="400" fill="#0B1F3A"><tspan x="694" dy="0">Public ordinary shares</tspan><tspan x="694" dy="23">Loans · debentures</tspan></text><rect x="1040" y="672" width="390" height="108" fill="#E7EFED" stroke="#CCD6D7" stroke-width="1.5"/><text x="1054" y="707" font-size="18" font-weight="400" fill="#0B1F3A"><tspan x="1054" dy="0">More extensive disclosure</tspan><tspan x="1054" dy="23">and audit requirements</tspan></text><rect x="120" y="800" width="1360" height="62" rx="12" fill="#FFF6D9"/><text x="150" y="839" font-size="19" font-weight="700" fill="#0B1F3A">Tie each finance source to its legal form, control implications and risk; ordinary partnerships generally have unlimited liability.</text><line x1="60" y1="972" x2="1540" y2="972" stroke="#CCD6D7" stroke-width="2"/><text x="64" y="1017" font-size="18">Marlbridge • study diagram • check assumptions and context</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>
