<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1720" viewBox="0 0 900 1720" role="img" aria-labelledby="t d"><title id="t">Accounting concepts: correct Nadia’s draft profit — mobile</title><desc id="d">Eight concept-led adjustments turn Nadia’s draft profit of $48,000 into corrected profit of $47,800.</desc><rect width="900" height="1720" fill="#F3F6F6"/><text x="42" y="55" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0B1F3A" text-anchor="start">Accounting concepts: correct Nadia’s draft profit</text><text x="44" y="90" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#526273" text-anchor="start">Cambridge International · IGCSE · Accounting concepts and</text><text x="44" y="113" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#526273" text-anchor="start">modern practice · Topic 7</text><rect x="36" y="150" width="828" height="348.5" rx="18" fill="#EAF2F4" stroke="#CCD6D7" stroke-width="2"/><text x="62" y="192" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0B1F3A" text-anchor="start">PROFIT INCREASES</text><text x="62" y="228" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">Drawings: goods $600 not recorded → +$600 (entity).</text><text x="62" y="256" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">Owner’s electricity $400 wrongly expensed → +$400 (entity).</text><text x="62" y="284" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">Rent prepaid: $5,400 covers six months; 3/6 belongs next year → +$2,700</text><text x="62" y="308" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">(matching).</text><text x="62" y="336" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">Materiality: $25 waste bin stays in office expense → $0 adjustment.</text><rect x="36" y="510.5" width="828" height="348.5" rx="18" fill="#F8F1DC" stroke="#CCD6D7" stroke-width="2"/><text x="62" y="552.5" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0B1F3A" text-anchor="start">PROFIT DECREASES</text><text x="62" y="588.5" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">Wages owed for final week → −$750 (matching/accrual).</text><text x="62" y="616.5" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">Damaged inventory: NRV $700 − $100 repair = $600 vs $1,100 cost → −$500</text><text x="62" y="640.5" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">(prudence).</text><text x="62" y="668.5" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">Sale for goods delivered next year → remove revenue $2,500</text><text x="62" y="692.5" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">(realisation).</text><text x="62" y="720.5" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">Allowance rises from $450 to 5% × $12,000 = $600 → −$150 (prudence).</text><rect x="36" y="871.0" width="828" height="348.5" rx="18" fill="#E8F2EC" stroke="#CCD6D7" stroke-width="2"/><text x="62" y="913.0" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0B1F3A" text-anchor="start">BRIDGE THE DRAFT</text><text x="62" y="949.0" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">Start draft profit $48,000</text><text x="62" y="977.0" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">Add: $600 + $400 + $2,700 = $3,700</text><text x="62" y="1005.0" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">Subtract: $750 + $500 + $2,500 + $150 = $3,900</text><text x="62" y="1033.0" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">Net adjustment = $(200)</text><text x="62" y="1061.0" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">Corrected profit = $47,800</text><rect x="36" y="1231.5" width="828" height="348.5" rx="18" fill="#F0ECF5" stroke="#CCD6D7" stroke-width="2"/><text x="62" y="1273.5" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0B1F3A" text-anchor="start">CHECK THE POSITION TOO</text><text x="62" y="1309.5" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">Inventory = $9,200 − $500 write-down = $8,700.</text><text x="62" y="1337.5" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">Receivables $12,000 − allowance $600 = $11,400.</text><text x="62" y="1365.5" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">Rent prepaid (other receivable) = $2,700.</text><text x="62" y="1393.5" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">Drawings increase by $600 + $400 = $1,000; profit and drawings rise</text><text x="62" y="1417.5" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">equally, so closing capital is unchanged by those two corrections.</text><path d="M36 1580H864" stroke="#C9A227" stroke-width="3"/><text x="42" y="1611" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#526273" text-anchor="start">MARLBRIDGE  •  ACCOUNTING STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="650" y="1614" width="205" height="51" preserveAspectRatio="xMidYMid meet"/><text x="42" y="1643" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#20314B" text-anchor="start">Use the concept to justify each treatment: entity separates owner and business; matching</text><text x="42" y="1662" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#20314B" text-anchor="start">allocates to the period; realisation recognises delivered sales; prudence avoids</text></svg>
