<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="t d"><title id="t">Accounting concepts: correct Nadia’s draft profit</title><desc id="d">Eight concept-led adjustments turn Nadia’s draft profit of $48,000 into corrected profit of $47,800.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><text x="60" y="76" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0B1F3A" text-anchor="start">Accounting concepts: correct Nadia’s draft profit</text><text x="62" y="118" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#526273" text-anchor="start">Cambridge International · IGCSE · Accounting concepts and modern practice · Topic 7</text><rect x="45" y="145" width="1510" height="770" rx="22" fill="white" stroke="#CCD6D7" stroke-width="2"/><rect x="70" y="175" width="710" height="300" rx="18" fill="#EAF2F4" stroke="#CCD6D7" stroke-width="2"/><text x="96" y="217" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0B1F3A" text-anchor="start">PROFIT INCREASES</text><text x="96" y="253" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">Drawings: goods $600 not recorded → +$600 (entity).</text><text x="96" y="281" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">Owner’s electricity $400 wrongly expensed → +$400 (entity).</text><text x="96" y="309" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">Rent prepaid: $5,400 covers six months; 3/6 belongs next year →</text><text x="96" y="333" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">+$2,700 (matching).</text><text x="96" y="361" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">Materiality: $25 waste bin stays in office expense → $0</text><text x="96" y="385" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">adjustment.</text><rect x="820" y="175" width="710" height="300" rx="18" fill="#F8F1DC" stroke="#CCD6D7" stroke-width="2"/><text x="846" y="217" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0B1F3A" text-anchor="start">PROFIT DECREASES</text><text x="846" y="253" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">Wages owed for final week → −$750 (matching/accrual).</text><text x="846" y="281" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">Damaged inventory: NRV $700 − $100 repair = $600 vs $1,100 cost →</text><text x="846" y="305" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">−$500 (prudence).</text><text x="846" y="333" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">Sale for goods delivered next year → remove revenue $2,500</text><text x="846" y="357" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">(realisation).</text><text x="846" y="385" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">Allowance rises from $450 to 5% × $12,000 = $600 → −$150</text><text x="846" y="409" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">(prudence).</text><rect x="70" y="500" width="710" height="300" rx="18" fill="#E8F2EC" stroke="#CCD6D7" stroke-width="2"/><text x="96" y="542" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0B1F3A" text-anchor="start">BRIDGE THE DRAFT</text><text x="96" y="578" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">Start draft profit $48,000</text><text x="96" y="606" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">Add: $600 + $400 + $2,700 = $3,700</text><text x="96" y="634" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">Subtract: $750 + $500 + $2,500 + $150 = $3,900</text><text x="96" y="662" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">Net adjustment = $(200)</text><text x="96" y="690" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">Corrected profit = $47,800</text><rect x="820" y="500" width="710" height="300" rx="18" fill="#F0ECF5" stroke="#CCD6D7" stroke-width="2"/><text x="846" y="542" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0B1F3A" text-anchor="start">CHECK THE POSITION TOO</text><text x="846" y="578" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">Inventory = $9,200 − $500 write-down = $8,700.</text><text x="846" y="606" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">Receivables $12,000 − allowance $600 = $11,400.</text><text x="846" y="634" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">Rent prepaid (other receivable) = $2,700.</text><text x="846" y="662" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">Drawings increase by $600 + $400 = $1,000; profit and drawings</text><text x="846" y="686" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">rise equally, so closing capital is unchanged by those two</text><text x="846" y="710" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">corrections.</text><rect x="70" y="825" width="1460" height="65" rx="13" fill="#FFF8E5" stroke="#C9A227" stroke-width="2"/><text x="92" y="852" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#C9A227" text-anchor="start">CHECK / EXAM CUE</text><text x="92" y="875" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#20314B" text-anchor="start">Use the concept to justify each treatment: entity separates owner and business; matching allocates to the period; realisation recognises delivered sales; prudence</text><text x="92" y="894" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#20314B" text-anchor="start">avoids overstatement.</text><path d="M55 940H1545" stroke="#C9A227" stroke-width="3"/><text x="62" y="982" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#526273" text-anchor="start">MARLBRIDGE  •  ACCOUNTING STUDY RESOURCE  •  Use the method and check the context</text><image href="data:image/svg+xml;base64," x="1320" y="956" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></svg>
