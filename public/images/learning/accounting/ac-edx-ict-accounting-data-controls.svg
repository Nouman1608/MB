<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="ttl desc"><title id="ttl">Accounting ICT: data, decisions and controls</title><desc id="desc">Four-part teaching diagram for Edexcel IAL • Topic 2.9.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><text x="70" y="82" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#0B1F3A">Accounting ICT: data, decisions and controls</text><text x="72" y="126" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#526273">Edexcel IAL • Topic 2.9</text><rect x="55" y="160" width="1490" height="740" rx="24" fill="white" stroke="#CCD6D7" stroke-width="2"/><rect x="82" y="185" width="696" height="330" rx="20" fill="#EAF2F4" stroke="#CCD6D7" stroke-width="2"/><text x="112" y="225" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#0B1F3A">CAPTURE TRANSACTIONS</text><circle cx="116" cy="256" r="5" fill="#176B5B"/><text x="134" y="263" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">EPOS records sales and stock movements.</text><circle cx="116" cy="288" r="5" fill="#176B5B"/><text x="134" y="295" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">Invoices and credit notes update receivables and</text><text x="134" y="322" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">payables.</text><circle cx="116" cy="347" r="5" fill="#176B5B"/><text x="134" y="354" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">Payroll and purchase records feed cost and cash</text><text x="134" y="381" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">data.</text><circle cx="116" cy="406" r="5" fill="#176B5B"/><text x="134" y="413" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">Use unique references and validated inputs.</text><rect x="822" y="185" width="696" height="330" rx="20" fill="#F8F1DC" stroke="#CCD6D7" stroke-width="2"/><text x="852" y="225" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#0B1F3A">PROCESS + ANALYSE</text><circle cx="856" cy="256" r="5" fill="#176B5B"/><text x="874" y="263" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">Spreadsheet formulas recalculate when an input</text><text x="874" y="290" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">changes.</text><circle cx="856" cy="315" r="5" fill="#176B5B"/><text x="874" y="322" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">What-if analysis tests changed assumptions against a</text><text x="874" y="349" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">budget.</text><circle cx="856" cy="374" r="5" fill="#176B5B"/><text x="874" y="381" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">Accounting packages process ledgers, invoices and</text><text x="874" y="408" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">debtor lists.</text><circle cx="856" cy="433" r="5" fill="#176B5B"/><text x="874" y="440" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">EPOS can compare stock with reorder levels and</text><text x="874" y="467" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">report margins.</text><rect x="82" y="540" width="696" height="330" rx="20" fill="#E8F2EC" stroke="#CCD6D7" stroke-width="2"/><text x="112" y="580" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#0B1F3A">MANAGEMENT INFORMATION</text><circle cx="116" cy="611" r="5" fill="#176B5B"/><text x="134" y="618" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">Budgets and variances support planning and control.</text><circle cx="116" cy="643" r="5" fill="#176B5B"/><text x="134" y="650" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">Product costs inform pricing and production</text><text x="134" y="677" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">decisions.</text><circle cx="116" cy="702" r="5" fill="#176B5B"/><text x="134" y="709" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">Aged receivables lists focus credit control.</text><circle cx="116" cy="734" r="5" fill="#176B5B"/><text x="134" y="741" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">Reports are faster; decisions still need</text><text x="134" y="768" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">interpretation.</text><rect x="822" y="540" width="696" height="330" rx="20" fill="#F4E9E5" stroke="#CCD6D7" stroke-width="2"/><text x="852" y="580" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#0B1F3A">AUDIT TRAIL + TRADE-OFFS</text><circle cx="856" cy="611" r="5" fill="#176B5B"/><text x="874" y="618" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">Keep source documents, user IDs, dates and change</text><text x="874" y="645" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">logs.</text><circle cx="856" cy="670" r="5" fill="#176B5B"/><text x="874" y="677" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">Restrict access; back up data; reconcile system</text><text x="874" y="704" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">totals.</text><circle cx="856" cy="729" r="5" fill="#176B5B"/><text x="874" y="736" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">Benefits: speed, consistency, timely information,</text><text x="874" y="763" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">fewer routine errors.</text><circle cx="856" cy="788" r="5" fill="#176B5B"/><text x="874" y="795" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">Risks: setup cost, outages, cyberattack, bad input</text><text x="874" y="822" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#20314B">and training.</text><rect x="65" y="918" width="1195" height="80" rx="16" fill="#FFFFFF" stroke="#CCD6D7" stroke-width="2"/><text x="90" y="950" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#C9A227">MARLBRIDGE  •  A-LEVEL ACCOUNTING</text><text x="90" y="979" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#526273">Name the task, information produced, control and trade-off; software brand names are not required.</text><image href="data:image/svg+xml;base64," x="1315" y="928" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></svg>
