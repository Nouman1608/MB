<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1720" viewBox="0 0 900 1720" role="img" aria-labelledby="ttl desc"><title id="ttl">Limited companies: how equity changes — mobile</title><desc id="desc">Four stacked teaching panels for Edexcel IAL • Topic 2.1.</desc><rect width="900" height="1720" fill="#F3F6F6"/><text x="44" y="76" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#0B1F3A">Limited companies: how equity changes</text><text x="46" y="149" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#526273">Edexcel IAL • Topic 2.1</text><rect x="42" y="172" width="816" height="325" rx="20" fill="#EAF2F4" stroke="#CCD6D7" stroke-width="2"/><text x="76" y="212" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#0B1F3A">COMPANY PERFORMANCE</text><circle cx="80" cy="239" r="5" fill="#176B5B"/><text x="98" y="246" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20314B">Revenue − cost of sales = gross profit.</text><circle cx="80" cy="269" r="5" fill="#176B5B"/><text x="98" y="276" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20314B">Operating expenses → profit from operations.</text><circle cx="80" cy="299" r="5" fill="#176B5B"/><text x="98" y="306" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20314B">Less finance costs and tax; distinguish continuing/discontinued</text><text x="98" y="332" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20314B">operations.</text><circle cx="80" cy="355" r="5" fill="#176B5B"/><text x="98" y="362" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20314B">Other comprehensive income feeds total comprehensive income.</text><rect x="42" y="509" width="816" height="325" rx="20" fill="#F8F1DC" stroke="#CCD6D7" stroke-width="2"/><text x="76" y="549" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#0B1F3A">EQUITY AT YEAR END</text><circle cx="80" cy="576" r="5" fill="#176B5B"/><text x="98" y="583" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20314B">Share capital + share premium + revaluation and other reserves +</text><text x="98" y="609" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20314B">retained earnings.</text><circle cx="80" cy="632" r="5" fill="#176B5B"/><text x="98" y="639" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20314B">Statement of changes in equity reconciles each component.</text><circle cx="80" cy="662" r="5" fill="#176B5B"/><text x="98" y="669" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20314B">Profit and OCI increase relevant reserves; dividends reduce</text><text x="98" y="695" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20314B">retained earnings.</text><circle cx="80" cy="718" r="5" fill="#176B5B"/><text x="98" y="725" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20314B">Reserve transfers change composition, not total equity.</text><rect x="42" y="846" width="816" height="325" rx="20" fill="#E8F2EC" stroke="#CCD6D7" stroke-width="2"/><text x="76" y="886" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#0B1F3A">NEW SHARES</text><circle cx="80" cy="913" r="5" fill="#176B5B"/><text x="98" y="920" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20314B">Rights issue: existing shareholders may buy new shares, usually</text><text x="98" y="946" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20314B">for cash.</text><circle cx="80" cy="969" r="5" fill="#176B5B"/><text x="98" y="976" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20314B">Credit share capital at nominal value; excess issue price</text><text x="98" y="1002" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20314B">credits share premium.</text><circle cx="80" cy="1025" r="5" fill="#176B5B"/><text x="98" y="1032" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20314B">Bonus issue: capitalise a reserve into share capital.</text><circle cx="80" cy="1055" r="5" fill="#176B5B"/><text x="98" y="1062" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20314B">Bonus issue changes equity labels; no new cash enters.</text><rect x="42" y="1183" width="816" height="325" rx="20" fill="#F4E9E5" stroke="#CCD6D7" stroke-width="2"/><text x="76" y="1223" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#0B1F3A">FINANCE + ASSURANCE</text><circle cx="80" cy="1250" r="5" fill="#176B5B"/><text x="98" y="1257" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20314B">Debentures are loan finance; interest is a finance cost.</text><circle cx="80" cy="1280" r="5" fill="#176B5B"/><text x="98" y="1287" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20314B">Gearing describes debt versus equity finance; more debt raises</text><text x="98" y="1313" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20314B">fixed-interest exposure.</text><circle cx="80" cy="1336" r="5" fill="#176B5B"/><text x="98" y="1343" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20314B">Auditor reports whether statements give a true and fair view</text><text x="98" y="1369" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20314B">within audit scope.</text><circle cx="80" cy="1392" r="5" fill="#176B5B"/><text x="98" y="1399" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20314B">A provision is a present obligation with uncertain timing or</text><text x="98" y="1425" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#20314B">amount; disclose material uncertainty.</text><rect x="42" y="1530" width="816" height="136" rx="18" fill="#FFFFFF" stroke="#CCD6D7" stroke-width="2"/><text x="68" y="1572" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#C9A227">A-LEVEL ACCOUNTING  •  MARLBRIDGE</text><image href="data:image/svg+xml;base64," x="641" y="1541" width="210" height="52" preserveAspectRatio="xMidYMid meet"/><text x="68" y="1614" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#526273">A rights issue brings in cash; a bonus issue transfers reserves</text><text x="68" y="1638" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#526273">into share capital without raising cash.</text></svg>
