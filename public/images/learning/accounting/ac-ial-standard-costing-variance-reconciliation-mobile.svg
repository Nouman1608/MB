<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1720" viewBox="0 0 900 1720" role="img" aria-labelledby="t d"><title id="t">Standard costing: reconcile six variances — mobile</title><desc id="d">Thurlby’s material, labour and overhead variances reconcile to standard cost $239,400 less actual cost $238,944 = $456 favourable.</desc><rect width="900" height="1720" fill="#F3F6F6"/><text x="42" y="55" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0B1F3A" text-anchor="start">Standard costing: reconcile six variances</text><text x="44" y="90" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#526273" text-anchor="start">Pearson Edexcel IAL · A-level · Standard costing · Topic 2.5</text><rect x="36" y="150" width="828" height="228.33333333333334" rx="18" fill="#EAF2F4" stroke="#CCD6D7" stroke-width="2"/><text x="62" y="192" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0B1F3A" text-anchor="start">MATERIALS · PRICE</text><text x="62" y="228" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">12 kg × $1.50 standard; 47,400 kg bought/used at $1.42 actual.</text><text x="62" y="256" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">(SP − AP) × AQ = ($1.50 − $1.42) × 47,400 = $3,792 F</text><rect x="36" y="390.33333333333337" width="828" height="228.33333333333334" rx="18" fill="#F8F1DC" stroke="#CCD6D7" stroke-width="2"/><text x="62" y="432.33333333333337" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0B1F3A" text-anchor="start">MATERIALS · USAGE</text><text x="62" y="468.33333333333337" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">Standard quantity for 3,800 basins = 45,600 kg; actual = 47,400 kg.</text><text x="62" y="496.33333333333337" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">(SQ − AQ) × SP = (45,600 − 47,400) × $1.50 = $2,700 A</text><rect x="36" y="630.6666666666667" width="828" height="228.33333333333334" rx="18" fill="#E8F2EC" stroke="#CCD6D7" stroke-width="2"/><text x="62" y="672.6666666666667" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0B1F3A" text-anchor="start">LABOUR · RATE</text><text x="62" y="708.6666666666667" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">5,520 actual hours; actual rate $16.30 vs standard $16.00.</text><text x="62" y="736.6666666666667" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">(SR − AR) × AH = ($16.00 − $16.30) × 5,520 = $1,656 A</text><rect x="36" y="871.0000000000001" width="828" height="228.33333333333334" rx="18" fill="#F0ECF5" stroke="#CCD6D7" stroke-width="2"/><text x="62" y="913.0000000000001" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0B1F3A" text-anchor="start">LABOUR · EFFICIENCY</text><text x="62" y="949.0000000000001" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">Standard hours for output = 5,700; actual hours = 5,520.</text><text x="62" y="977.0000000000001" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">(SH − AH) × SR = (5,700 − 5,520) × $16 = $2,880 F</text><rect x="36" y="1111.3333333333335" width="828" height="228.33333333333334" rx="18" fill="#F4E9E5" stroke="#CCD6D7" stroke-width="2"/><text x="62" y="1153.3333333333335" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0B1F3A" text-anchor="start">VARIABLE OVERHEAD · TOTAL</text><text x="62" y="1189.3333333333335" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">Standard: 3,800 basins × 1.5 h × $4 = $22,800; actual $23,460.</text><text x="62" y="1217.3333333333335" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">$22,800 − $23,460 = $660 A</text><rect x="36" y="1351.6666666666667" width="828" height="228.33333333333334" rx="18" fill="#E6F2EF" stroke="#CCD6D7" stroke-width="2"/><text x="62" y="1393.6666666666667" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0B1F3A" text-anchor="start">FIXED OVERHEAD · TOTAL</text><text x="62" y="1429.6666666666667" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">Standard absorbed: 3,800 × 1.5 h × $10 = $57,000; actual $58,200.</text><text x="62" y="1457.6666666666667" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">$57,000 − $58,200 = $1,200 A</text><path d="M36 1580H864" stroke="#C9A227" stroke-width="3"/><text x="42" y="1611" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#526273" text-anchor="start">MARLBRIDGE  •  ACCOUNTING STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="650" y="1614" width="205" height="51" preserveAspectRatio="xMidYMid meet"/><text x="42" y="1643" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#20314B" text-anchor="start">Reconciliation check: favourable $6,672 − adverse $6,216 = $456 F. Also: standard</text><text x="42" y="1662" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#20314B" text-anchor="start">$239,400 − actual $238,944 = $456 F.</text></svg>
