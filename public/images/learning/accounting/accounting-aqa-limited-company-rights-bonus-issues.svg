<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img"><title>Rights issue raises cash; bonus issue does not</title><desc>Exact Ellerby rights and bonus issue calculations and equity effect.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial,sans-serif" fill="#20314B"><text x="62" y="78" font-size="40" font-weight="700" fill="#0B1F3A">Rights issue raises cash; bonus issue does not</text><text x="64" y="124" font-size="22">Marlbridge teaching diagram • examples are schematic</text><rect x="60" y="165" width="1480" height="755" rx="18" fill="white" stroke="#CCD6D7" stroke-width="2"/><text x="100" y="225" font-size="21">Exact Ellerby rights and bonus issue calculations and equity effect.</text><rect x="100" y="285" width="660" height="220" rx="15" fill="#FBFCFC" stroke="#2D7A78" stroke-width="3"/><text x="124" y="329" font-size="19" font-weight="700" fill="#2D7A78">RIGHTS: 1 FOR 4 AT 80p</text><text x="124" y="376" font-size="17" fill="#20314B">600,000 ÷ 4 = 150,000 shares</text><text x="124" y="413" font-size="17" fill="#20314B">Bank receives £120,000</text><text x="124" y="450" font-size="17" fill="#20314B">Share capital £75k; premium £45k</text><rect x="820" y="285" width="660" height="220" rx="15" fill="#FBFCFC" stroke="#397DA4" stroke-width="3"/><text x="844" y="329" font-size="19" font-weight="700" fill="#397DA4">BONUS: 1 FOR 5</text><text x="844" y="376" font-size="17" fill="#20314B">After rights: 750,000 ÷ 5</text><text x="844" y="413" font-size="17" fill="#20314B">150,000 free shares</text><text x="844" y="450" font-size="17" fill="#20314B">Dr premium £75k; Cr capital £75k</text><rect x="100" y="535" width="660" height="220" rx="15" fill="#FBFCFC" stroke="#C9A227" stroke-width="3"/><text x="124" y="579" font-size="19" font-weight="700" fill="#C9A227">RIGHTS ISSUE</text><text x="124" y="626" font-size="17" fill="#20314B">Cash raised: yes</text><text x="124" y="663" font-size="17" fill="#20314B">Total equity increases</text><text x="124" y="700" font-size="17" fill="#20314B">Offer shares to existing holders</text><rect x="820" y="535" width="660" height="220" rx="15" fill="#FBFCFC" stroke="#2D7A78" stroke-width="3"/><text x="844" y="579" font-size="19" font-weight="700" fill="#2D7A78">BONUS ISSUE</text><text x="844" y="626" font-size="17" fill="#20314B">Cash raised: no</text><text x="844" y="663" font-size="17" fill="#20314B">Reserves reclassified to share capital</text><text x="844" y="700" font-size="17" fill="#20314B">Total equity unchanged by bonus</text><rect x="150" y="805" width="1300" height="70" rx="12" fill="#FFF4D6" stroke="#E0C76C" stroke-width="2"/><text x="180" y="850" font-size="18" font-weight="700" fill="#0B1F3A">Equity: £605k before → £725k after both issues; £120k increase equals rights cash.</text><path d="M60 972H1540" stroke="#CCD6D7" stroke-width="2"/><text x="64" y="1015" font-size="17">Marlbridge • study diagram • check assumptions and context</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>
