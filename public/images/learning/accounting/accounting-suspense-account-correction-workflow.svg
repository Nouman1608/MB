<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">Suspense accounts: locate, correct and clear the error</title><desc id="desc">Flowchart explains temporary suspense use and correction, with the £150 insurance omission journalled correctly and its profit effect.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial,sans-serif" fill="#20314B"><text x="62" y="78" font-size="40" font-weight="700" fill="#0B1F3A">Suspense accounts: locate, correct and clear the error</text><text x="64" y="124" font-size="22">Marlbridge teaching diagram • examples are schematic</text><rect x="60" y="165" width="1480" height="755" rx="18" fill="white" stroke="#CCD6D7" stroke-width="2"/><text x="100" y="225" font-size="22" font-weight="400" fill="#20314B" text-anchor="start">A suspense account is temporary. Use it only when the trial balance does not balance.</text><rect x="100" y="300" width="315" height="230" rx="14" fill="#FBFCFC" stroke="#CCD6D7" stroke-width="2"/><circle cx="135" cy="335" r="23" fill="#0B1F3A"/><text x="135" y="343" font-size="21" font-weight="700" fill="white" text-anchor="middle">1</text><text x="122" y="390" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="start">Trial balance differs</text><text x="122" y="435" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">Open suspense for the difference</text><text x="122" y="488" font-size="16" font-weight="400" fill="#596B7E" text-anchor="start">Temporary balancing entry</text><path d="M415 410 L445 410" stroke="#397DA4" stroke-width="4" fill="none"/><path d="M445 402 l14 8 -14 8" fill="#397DA4"/><rect x="450" y="300" width="315" height="230" rx="14" fill="#FBFCFC" stroke="#CCD6D7" stroke-width="2"/><circle cx="485" cy="335" r="23" fill="#0B1F3A"/><text x="485" y="343" font-size="21" font-weight="700" fill="white" text-anchor="middle">2</text><text x="472" y="390" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="start">Find the error</text><text x="472" y="435" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">Identify the missing or one-sided posting</text><text x="472" y="488" font-size="16" font-weight="400" fill="#596B7E" text-anchor="start">Check original documents</text><path d="M765 410 L795 410" stroke="#397DA4" stroke-width="4" fill="none"/><path d="M795 402 l14 8 -14 8" fill="#397DA4"/><rect x="800" y="300" width="315" height="230" rx="14" fill="#FBFCFC" stroke="#CCD6D7" stroke-width="2"/><circle cx="835" cy="335" r="23" fill="#0B1F3A"/><text x="835" y="343" font-size="21" font-weight="700" fill="white" text-anchor="middle">3</text><text x="822" y="390" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="start">Correct both entries</text><text x="822" y="435" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">Post the correcting journal</text><text x="822" y="488" font-size="16" font-weight="400" fill="#596B7E" text-anchor="start">Do not repost the valid cash entry</text><path d="M1115 410 L1145 410" stroke="#397DA4" stroke-width="4" fill="none"/><path d="M1145 402 l14 8 -14 8" fill="#397DA4"/><rect x="1150" y="300" width="315" height="230" rx="14" fill="#FBFCFC" stroke="#CCD6D7" stroke-width="2"/><circle cx="1185" cy="335" r="23" fill="#0B1F3A"/><text x="1185" y="343" font-size="21" font-weight="700" fill="white" text-anchor="middle">4</text><text x="1172" y="390" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="start">Clear suspense</text><text x="1172" y="435" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">Correction offsets the original balance</text><text x="1172" y="488" font-size="16" font-weight="400" fill="#596B7E" text-anchor="start">Reconcile to zero</text><rect x="100" y="600" width="660" height="220" rx="14" fill="#E7EFED" stroke="#2D7A78" stroke-width="2"/><text x="130" y="647" font-size="22" font-weight="700" fill="#0B1F3A" text-anchor="start">Example: £150 insurance posting omitted</text><text x="130" y="700" font-size="20" font-weight="400" fill="#20314B" text-anchor="start">Dr Insurance expense     £150</text><text x="130" y="745" font-size="20" font-weight="400" fill="#20314B" text-anchor="start">Cr Suspense                    £150</text><text x="130" y="790" font-size="18" font-weight="700" fill="#20314B" text-anchor="start">Suspense closes; profit falls by £150.</text><rect x="810" y="600" width="610" height="220" rx="14" fill="#FFF4D6" stroke="#E0C76C" stroke-width="2"/><text x="840" y="647" font-size="22" font-weight="700" fill="#0B1F3A" text-anchor="start">Does every error need suspense?</text><text x="840" y="700" font-size="18" font-weight="400" fill="#20314B" text-anchor="start">No. Errors that leave debits equal to credits</text><text x="840" y="738" font-size="18" font-weight="400" fill="#20314B" text-anchor="start">do not create a trial-balance difference.</text><text x="840" y="790" font-size="17" font-weight="400" fill="#20314B" text-anchor="start">Revised profit changes only when income or expense changes.</text><path d="M60 972H1540" stroke="#CCD6D7" stroke-width="2"/><text x="64" y="1015" font-size="17">Marlbridge • study diagram • check assumptions and context</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>
