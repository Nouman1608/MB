<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">Reconcile Ollerby Rugs budget profit to actual profit</title><desc id="desc">Adds the six source-calculated favourable and adverse variances to budgeted profit and checks against independently calculated actual profit.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><text x="55" y="66" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#0B1F3A" text-anchor="start">Reconcile Ollerby Rugs budget profit to actual profit</text><text x="58" y="105" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#526273" text-anchor="start">OxfordAQA · International A-level · Standard costing and variance analysis</text><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#287F7A"/></marker></defs><text x="800" y="155" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#526273" text-anchor="middle">Favourable raises profit  ·  Adverse reduces profit</text><rect x="120" y="195" width="1360" height="90" rx="16" fill="#EAF2F4" stroke="#CCD6D7" stroke-width="2"/><text x="170" y="250" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0B1F3A" text-anchor="start">Budget profit</text><text x="1430" y="250" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0B1F3A" text-anchor="end">$27,200</text><line x1="150" y1="337" x2="1450" y2="337" stroke="#CCD6D7" stroke-width="1"/><text x="185" y="333" font-family="Arial,sans-serif" font-size="19" font-weight="600" fill="#20314B" text-anchor="start">Sales volume</text><text x="1370" y="333" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#D96D5F" text-anchor="end">− $3,300  A</text><line x1="150" y1="401" x2="1450" y2="401" stroke="#CCD6D7" stroke-width="1"/><text x="185" y="397" font-family="Arial,sans-serif" font-size="19" font-weight="600" fill="#20314B" text-anchor="start">Sales price</text><text x="1370" y="397" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#287F7A" text-anchor="end">+ $6,900  F</text><line x1="150" y1="465" x2="1450" y2="465" stroke="#CCD6D7" stroke-width="1"/><text x="185" y="461" font-family="Arial,sans-serif" font-size="19" font-weight="600" fill="#20314B" text-anchor="start">Materials price</text><text x="1370" y="461" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#287F7A" text-anchor="end">+ $2,115  F</text><line x1="150" y1="529" x2="1450" y2="529" stroke="#CCD6D7" stroke-width="1"/><text x="185" y="525" font-family="Arial,sans-serif" font-size="19" font-weight="600" fill="#20314B" text-anchor="start">Materials usage</text><text x="1370" y="525" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#D96D5F" text-anchor="end">− $1,350  A</text><line x1="150" y1="593" x2="1450" y2="593" stroke="#CCD6D7" stroke-width="1"/><text x="185" y="589" font-family="Arial,sans-serif" font-size="19" font-weight="600" fill="#20314B" text-anchor="start">Labour rate</text><text x="1370" y="589" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#D96D5F" text-anchor="end">− $1,656  A</text><line x1="150" y1="657" x2="1450" y2="657" stroke="#CCD6D7" stroke-width="1"/><text x="185" y="653" font-family="Arial,sans-serif" font-size="19" font-weight="600" fill="#20314B" text-anchor="start">Labour efficiency</text><text x="1370" y="653" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#287F7A" text-anchor="end">+ $1,840  F</text><rect x="120" y="725" width="1360" height="100" rx="16" fill="#E8F3EF" stroke="#CCD6D7" stroke-width="2"/><text x="180" y="770" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#287F7A" text-anchor="start">Net movement</text><text x="1430" y="770" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#287F7A" text-anchor="end">+ $4,549 F</text><text x="800" y="855" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0B1F3A" text-anchor="middle">Budget $27,200 + net favourable $4,549 = actual profit $31,749</text><line x1="48" y1="925" x2="1552" y2="925" stroke="#D2AA2F" stroke-width="3"/><text x="56" y="966" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#526273" text-anchor="start">Marlbridge · Accounting study resource · schematic; source-linked</text><image href="data:image/svg+xml;base64," x="1320" y="940" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></svg>