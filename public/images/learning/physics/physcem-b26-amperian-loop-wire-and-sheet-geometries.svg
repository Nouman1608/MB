<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><defs><marker id="n" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#0B1F3A"/></marker><marker id="b" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#3C7EA7"/></marker><marker id="t" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#108B88"/></marker><marker id="r" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#C85C5C"/></marker><marker id="gold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#D6A72C"/></marker></defs><title id="title">Choose an Amperian loop that matches the field</title><desc id="desc">Two cross-sections compare Ampere loops. Around a long straight wire with current out of the page, a circular loop of radius r has a tangent magnetic field of constant magnitude, so the line integral is B times 2 pi r. Around a broad current sheet, a rectangle straddles the sheet with long horizontal sides parallel to the opposite magnetic fields above and below; the short sides are perpendicular and contribute zero, while the two long sides contribute 2 B times length.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial, Liberation Sans, sans-serif"><text x="58" y="74" fill="#0B1F3A" font-size="37" font-weight="700">Choose an Amperian loop that matches the field</text><text x="60" y="116" fill="#637783" font-size="20">Circular-wire and sheet-straddling loops make the line integral simple.</text><rect x="55" y="150" width="1490" height="750" rx="18" fill="#FFFFFF" stroke="#CBD7D9" stroke-width="2"/><rect x="80" y="190" width="700" height="610" rx="14" fill="#F7FAFA" stroke="#CBD7D9" stroke-width="2"/><rect x="810" y="190" width="710" height="610" rx="14" fill="#F7FAFA" stroke="#CBD7D9" stroke-width="2"/><text x="430" y="235" text-anchor="middle" fill="#0B1F3A" font-size="22" font-weight="700">Long straight wire</text><text x="1165" y="235" text-anchor="middle" fill="#0B1F3A" font-size="22" font-weight="700">Broad current sheet</text>
<circle cx="430" cy="480" r="145" fill="#EAF4F3" fill-opacity=".6" stroke="#0B1F3A" stroke-width="4"/><circle cx="430" cy="480" r="9" fill="#D6A72C" stroke="#0B1F3A" stroke-width="2"/><text x="455" y="525" fill="#637783" font-size="15">I out of page</text><text x="430" y="390" text-anchor="middle" fill="#3C7EA7" font-size="17" font-weight="700">B tangent, constant |B|</text><path d="M575 480 A145 145 0 0 1 530 582" fill="none" stroke="#3C7EA7" stroke-width="6" marker-end="url(#b)"/><line x1="430" y1="480" x2="575" y2="480" stroke="#637783" stroke-width="3" stroke-dasharray="8 6"/><text x="493" y="468" fill="#637783" font-size="17">r</text><text x="430" y="685" text-anchor="middle" fill="#108B88" font-size="20" font-weight="700">∮B·dℓ = B(2πr)</text><text x="430" y="730" text-anchor="middle" fill="#637783" font-size="16">Circle: B is parallel and constant everywhere.</text>
<rect x="865" y="470" width="600" height="26" fill="#DDE7E8" stroke="#718B92" stroke-width="2"/><text x="1165" y="520" text-anchor="middle" fill="#637783" font-size="16">current sheet • J into the page</text><g fill="#D6A72C" font-size="20" font-weight="700"><text x="1030" y="490">×</text><text x="1145" y="490">×</text><text x="1285" y="490">×</text></g><text x="1190" y="310" fill="#D6A72C" font-size="17" font-weight="700">current J into page</text><path d="M960 385 H1370 V590 H960 Z" fill="none" stroke="#0B1F3A" stroke-width="4"/><line x1="980" y1="385" x2="1305" y2="385" stroke="#3C7EA7" stroke-width="5" marker-end="url(#b)"/><line x1="1350" y1="590" x2="1025" y2="590" stroke="#3C7EA7" stroke-width="5" marker-end="url(#b)"/><text x="1165" y="365" text-anchor="middle" fill="#3C7EA7" font-size="17" font-weight="700">B above</text><text x="1165" y="625" text-anchor="middle" fill="#3C7EA7" font-size="17" font-weight="700">B below • opposite direction</text><text x="975" y="495" fill="#637783" font-size="16" transform="rotate(-90 975 495)">short side: B ⟂ dℓ</text><text x="1350" y="495" fill="#637783" font-size="16" transform="rotate(-90 1350 495)">zero contribution</text><text x="1165" y="690" text-anchor="middle" fill="#108B88" font-size="20" font-weight="700">∮B·dℓ = Bℓ + Bℓ = 2Bℓ</text><text x="1165" y="730" text-anchor="middle" fill="#637783" font-size="16">Long sides align with B; short sides contribute zero.</text>
<rect x="205" y="817" width="1190" height="42" rx="10" fill="#FFF5DB" stroke="#D6A72C" stroke-width="2"/><text x="800" y="844" text-anchor="middle" fill="#0B1F3A" font-size="17" font-weight="700">The solenoid rectangle is covered in the source example; this supplement adds the wire circle and sheet-straddling rectangle.</text></g><text x="800" y="942" fill="#A9BABC" font-size="26" font-weight="700" text-anchor="middle" opacity=".24" letter-spacing="2">MARLBRIDGE STUDY RESOURCES</text><line x1="55" y1="964" x2="1545" y2="964" stroke="#C9A227" stroke-width="2"/><text x="58" y="1000" fill="#0B1F3A" font-size="17" font-weight="700">MARLBRIDGE • STUDY RESOURCE</text><image x="1260" y="968" width="285" height="70" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/></svg>
