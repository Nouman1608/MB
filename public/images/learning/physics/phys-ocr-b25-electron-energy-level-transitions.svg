<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><defs><marker id="n" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#0B1F3A"/></marker><marker id="b" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#3C7EA7"/></marker><marker id="t" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#108B88"/></marker><marker id="r" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#C85C5C"/></marker></defs><title id="title">Absorption, emission and ionisation are different changes</title><desc id="desc">A vertical energy-level diagram shows an electron absorbing a photon and moving from a lower bound level to a higher one, then emitting a photon as it falls back. A separate ionisation path shows the electron gaining enough energy to leave the atom; excitation remains bound, while ionisation leaves a positive ion.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial, Liberation Sans, sans-serif"><text x="58" y="74" fill="#0B1F3A" font-size="37" font-weight="700">Absorption, emission and ionisation are different changes</text><text x="60" y="116" fill="#637783" font-size="20">Energy absorbed can excite a bound electron; enough energy can remove it from the atom.</text><rect x="55" y="150" width="1490" height="750" rx="18" fill="#FFFFFF" stroke="#CBD7D9" stroke-width="2"/><rect x="85" y="190" width="990" height="610" rx="14" fill="#F7FAFA" stroke="#CBD7D9" stroke-width="2"/><rect x="1110" y="190" width="410" height="610" rx="14" fill="#F7FAFA" stroke="#CBD7D9" stroke-width="2"/><text x="580" y="235" text-anchor="middle" fill="#0B1F3A" font-size="22" font-weight="700">Electron energy increases upward</text><line x1="210" y1="700" x2="985" y2="700" stroke="#0B1F3A" stroke-width="3"/><line x1="210" y1="700" x2="210" y2="285" stroke="#0B1F3A" stroke-width="3" marker-end="url(#n)"/><text x="125" y="485" transform="rotate(-90 125 485)" text-anchor="middle" fill="#0B1F3A" font-size="18" font-weight="700">Energy</text>
  <line x1="315" y1="630" x2="670" y2="630" stroke="#108B88" stroke-width="5"/><line x1="315" y1="490" x2="670" y2="490" stroke="#108B88" stroke-width="5"/><line x1="315" y1="395" x2="670" y2="395" stroke="#108B88" stroke-width="5"/><text x="280" y="637" text-anchor="end" fill="#0B1F3A" font-size="17">lower level</text><text x="280" y="497" text-anchor="end" fill="#0B1F3A" font-size="17">higher bound level</text><text x="280" y="402" text-anchor="end" fill="#0B1F3A" font-size="17">outer bound level</text>
  <line x1="385" y1="620" x2="385" y2="500" stroke="#3C7EA7" stroke-width="5" marker-end="url(#b)"/><text x="405" y="555" fill="#3C7EA7" font-size="17" font-weight="700">absorb hf</text><text x="385" y="670" text-anchor="middle" fill="#3C7EA7" font-size="16">excitation</text>
  <line x1="565" y1="405" x2="565" y2="505" stroke="#C85C5C" stroke-width="5" marker-end="url(#r)"/><text x="585" y="455" fill="#C85C5C" font-size="17" font-weight="700">emit hf</text><text x="565" y="550" text-anchor="middle" fill="#C85C5C" font-size="16">returns to lower level</text>
  <line x1="705" y1="315" x2="1000" y2="315" stroke="#108B88" stroke-width="4" stroke-dasharray="9 7"/><text x="805" y="300" text-anchor="middle" fill="#0B1F3A" font-size="14" font-weight="700">ionisation threshold, E = 0</text><line x1="970" y1="385" x2="970" y2="260" stroke="#D6A72C" stroke-width="5" marker-end="url(#n)"/><circle cx="970" cy="385" r="10" fill="#D6A72C" stroke="#0B1F3A" stroke-width="2"/><text x="817" y="255" text-anchor="middle" fill="#0B1F3A" font-size="16" font-weight="700">electron escapes</text><text x="817" y="360" text-anchor="middle" fill="#637783" font-size="15">energy above threshold</text>
  <rect x="325" y="730" width="575" height="42" rx="10" fill="#EAF4F3" stroke="#9CCAC5" stroke-width="2"/><text x="612" y="757" text-anchor="middle" fill="#0B1F3A" font-size="17" font-weight="700">Excitation: electron stays bound at a higher level.</text>
  <text x="1315" y="250" text-anchor="middle" fill="#0B1F3A" font-size="21" font-weight="700">What changes?</text><circle cx="1315" cy="355" r="53" fill="#FFF5DB" stroke="#D6A72C" stroke-width="3"/><circle cx="1315" cy="355" r="17" fill="#C85C5C"/><ellipse cx="1315" cy="355" rx="82" ry="58" fill="none" stroke="#3C7EA7" stroke-width="3"/><circle cx="1388" cy="355" r="8" fill="#3C7EA7"/><text x="1315" y="450" text-anchor="middle" fill="#3C7EA7" font-size="17" font-weight="700">Excitation</text><text x="1315" y="479" text-anchor="middle" fill="#0B1F3A" font-size="16">electron moves between levels;</text><text x="1315" y="505" text-anchor="middle" fill="#0B1F3A" font-size="16">it remains in the atom.</text><line x1="1150" y1="545" x2="1480" y2="545" stroke="#CBD7D9" stroke-width="2"/><circle cx="1315" cy="620" r="48" fill="#FFF5DB" stroke="#D6A72C" stroke-width="3"/><circle cx="1315" cy="620" r="16" fill="#C85C5C"/><line x1="1360" y1="620" x2="1452" y2="620" stroke="#C85C5C" stroke-width="4" marker-end="url(#r)"/><text x="1315" y="700" text-anchor="middle" fill="#C85C5C" font-size="17" font-weight="700">Ionisation</text><text x="1315" y="729" text-anchor="middle" fill="#0B1F3A" font-size="16">outer electron escapes;</text><text x="1315" y="755" text-anchor="middle" fill="#0B1F3A" font-size="16">atom is left positive.</text>
  <rect x="205" y="817" width="1190" height="42" rx="10" fill="#FFF5DB" stroke="#D6A72C" stroke-width="2"/><text x="800" y="844" text-anchor="middle" fill="#0B1F3A" font-size="17" font-weight="700">A larger bound-level drop releases a higher-frequency photon; ionisation removes an electron completely.</text></g><text x="800" y="942" fill="#A9BABC" font-size="26" font-weight="700" text-anchor="middle" opacity=".24" letter-spacing="2">MARLBRIDGE STUDY RESOURCES</text><line x1="55" y1="964" x2="1545" y2="964" stroke="#C9A227" stroke-width="2"/><text x="58" y="1000" fill="#0B1F3A" font-size="17" font-weight="700">MARLBRIDGE  •  STUDY RESOURCE</text><image x="1260" y="968" width="285" height="70" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/></svg>
