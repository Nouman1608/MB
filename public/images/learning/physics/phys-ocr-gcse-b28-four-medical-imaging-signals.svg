<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020" role="img" aria-labelledby="title desc"><title id="title">Four wave signals used to image hidden structures</title><desc id="desc">A GCSE comparison shows infrared emitted from warm skin and detected at the surface; X-rays transmitted through the body with greater absorption by bone, creating a detector shadow; gamma rays emitted by an internal tracer and detected outside the body; and ultrasound pulses reflected at tissue boundaries, with echo time indicating depth.</desc><rect width="1440" height="1020" fill="#F4F7F7"/><text x="62" y="62" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#0B1F3A">Four signals used to image hidden structures</text><text x="64" y="101" font-family="Arial,sans-serif" font-size="19" fill="#52677C">Each method detects a different change or signal from inside, through, or at the body's surface.</text>
<!-- infrared card -->
<g font-family="Arial,sans-serif"><rect x="55" y="135" width="650" height="370" rx="18" fill="#fff" stroke="#C8D3D4" stroke-width="3"/><text x="82" y="179" font-size="27" font-weight="700" fill="#0B1F3A">Infrared: emitted surface heat</text><rect x="100" y="265" width="360" height="125" rx="16" fill="#F6D7CE" stroke="#B75E53" stroke-width="3"/><rect x="255" y="265" width="75" height="125" fill="#E98F74"/><text x="280" y="423" text-anchor="middle" font-size="17" fill="#52677C">skin surface; warm region emits more IR</text><path d="M350 265C385 242 420 230 450 232C470 234 485 240 500 247M355 285C400 270 445 260 500 260M350 305C395 298 445 286 500 273" fill="none" stroke="#C96F4C" stroke-width="5" marker-end="url(#ir)"/><rect x="500" y="206" width="125" height="82" rx="12" fill="#EAF3F5" stroke="#357EA2" stroke-width="4"/><circle cx="561" cy="247" r="23" fill="#fff" stroke="#357EA2" stroke-width="4"/><path d="M532 288V311M592 288V311M532 311H592" stroke="#357EA2" stroke-width="4"/><text x="562" y="345" text-anchor="middle" font-size="17" fill="#0B1F3A">thermal camera</text><text x="82" y="472" font-size="17" fill="#52677C">Camera maps emitted infrared from the surface; deep structures are not seen directly.</text></g>
<!-- x-ray card -->
<g font-family="Arial,sans-serif"><rect x="735" y="135" width="650" height="370" rx="18" fill="#fff" stroke="#C8D3D4" stroke-width="3"/><text x="762" y="179" font-size="27" font-weight="700" fill="#0B1F3A">X-rays: differential absorption</text><rect x="780" y="250" width="75" height="90" rx="12" fill="#FFF7DF" stroke="#C9A227" stroke-width="3"/><text x="817" y="302" text-anchor="middle" font-size="20" font-weight="700" fill="#0B1F3A">X</text><text x="817" y="365" text-anchor="middle" font-size="16" fill="#52677C">source</text><rect x="930" y="220" width="245" height="155" rx="42" fill="#F4D8D1" stroke="#B75E53" stroke-width="3"/><path d="M920 260H1175M920 300H1028M920 340H1175" fill="none" stroke="#357EA2" stroke-width="3"/><text x="1000" y="410" text-anchor="middle" font-size="16" fill="#52677C">soft tissue</text><path d="M1045 275L1095 275L1110 300L1095 325L1045 325L1028 300Z" fill="#D8E4EA" stroke="#357EA2" stroke-width="3"/><text x="1068" y="290" text-anchor="middle" font-size="16" fill="#0B1F3A">bone</text><path d="M855 260H920M855 300H920M855 340H920" stroke="#357EA2" stroke-width="4" marker-end="url(#xray)"/><path d="M1178 260H1240M1178 340H1240" stroke="#357EA2" stroke-width="4" marker-end="url(#xray)"/><rect x="1248" y="220" width="48" height="155" fill="#EAF3F5" stroke="#357EA2" stroke-width="4"/><line x1="1272" y1="235" x2="1272" y2="360" stroke="#357EA2" stroke-width="2" stroke-dasharray="6 8"/><text x="1272" y="410" text-anchor="middle" font-size="16" fill="#52677C">detector</text><text x="762" y="472" font-size="17" fill="#52677C">Bone absorbs more than soft tissue, so fewer X-rays reach the detector behind bone.</text></g>
<!-- gamma tracer card -->
<g font-family="Arial,sans-serif"><rect x="55" y="535" width="650" height="370" rx="18" fill="#fff" stroke="#C8D3D4" stroke-width="3"/><text x="82" y="579" font-size="27" font-weight="700" fill="#0B1F3A">Gamma: emission from a tracer</text><rect x="160" y="650" width="260" height="135" rx="62" fill="#F4D8D1" stroke="#B75E53" stroke-width="3"/><ellipse cx="295" cy="720" rx="58" ry="42" fill="#E6DDF0" stroke="#7E65A8" stroke-width="3"/><circle cx="278" cy="710" r="7" fill="#7E65A8"/><circle cx="300" cy="730" r="7" fill="#7E65A8"/><circle cx="320" cy="710" r="7" fill="#7E65A8"/><path d="M300 695L300 625M340 718L465 680M260 720L175 680" stroke="#7E65A8" stroke-width="4" marker-end="url(#gamma)"/><rect x="465" y="635" width="160" height="85" rx="14" fill="#EAF3F5" stroke="#357EA2" stroke-width="4"/><rect x="485" y="650" width="120" height="53" fill="#fff" stroke="#357EA2" stroke-width="2"/><text x="545" y="690" text-anchor="middle" font-size="18" font-weight="700" fill="#357EA2">camera</text><text x="545" y="751" text-anchor="middle" font-size="16" fill="#52677C">detects emitted gamma</text><text x="82" y="864" font-size="17" fill="#52677C">Tracer uptake marks an organ; gamma rays leave the body and reveal tracer location.</text></g>
<!-- ultrasound card -->
<g font-family="Arial,sans-serif"><rect x="735" y="535" width="650" height="370" rx="18" fill="#fff" stroke="#C8D3D4" stroke-width="3"/><text x="762" y="579" font-size="27" font-weight="700" fill="#0B1F3A">Ultrasound: reflected echoes</text><rect x="795" y="650" width="390" height="175" rx="14" fill="#EAF3F5" stroke="#8EB8C0" stroke-width="3"/><line x1="795" y1="730" x2="1185" y2="730" stroke="#3F8582" stroke-width="4"/><text x="1194" y="735" font-size="16" fill="#52677C">tissue boundary</text><path d="M835 630L820 606L850 606Z" fill="#357EA2" stroke="#20354D" stroke-width="3"/><rect x="815" y="625" width="40" height="20" rx="6" fill="#357EA2"/><text x="835" y="682" text-anchor="middle" font-size="16" fill="#52677C">probe</text><path d="M835 650L905 715" stroke="#357EA2" stroke-width="5" marker-end="url(#us)"/><path d="M920 715L855 650" stroke="#C9A227" stroke-width="5" stroke-dasharray="9 7" marker-end="url(#gold)"/><path d="M935 730C960 752 985 752 1010 730" fill="none" stroke="#3F8582" stroke-width="4"/><text x="994" y="790" text-anchor="middle" font-size="16" fill="#52677C">echo returns to probe</text><text x="1230" y="655" font-size="16" fill="#52677C">pulse in</text><text x="1230" y="685" font-size="16" fill="#52677C">echo back</text><text x="762" y="864" font-size="17" fill="#52677C">Echo delay gives depth; reflection occurs where tissue properties change.</text></g>
<line x1="65" y1="930" x2="1375" y2="930" stroke="#C9A227" stroke-width="3"/><text x="75" y="972" font-family="Arial,sans-serif" font-size="17" fill="#52677C">Emission: infrared and tracer gamma • Transmission/absorption: X-rays • Reflection and travel time: ultrasound. — Marlbridge Physics</text><defs><marker id="ir" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#C96F4C"/></marker><marker id="xray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#357EA2"/></marker><marker id="gamma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7E65A8"/></marker><marker id="us" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#357EA2"/></marker><marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#C9A227"/></marker></defs><image x="1195" y="930" width="175" height="45" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/></svg>
