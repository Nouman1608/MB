<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img"><title>Three Ways to Change Magnetic Flux</title><desc>Change B, area or angle; induced emf depends on the rate of flux change</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#168C8C"/></marker><marker id="arrN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#10233F"/></marker></defs><rect width="1528" height="940" fill="#F3F6F6"/><text x="54" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#10233F">Three Ways to Change Magnetic Flux</text><text x="56" y="92" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#53677B">Change B, area or angle; induced emf depends on the rate of flux change</text><rect x="42" y="130" width="465" height="660" rx="18" fill="#FFFFFF" stroke="#CAD6DF" stroke-width="2"/><rect x="532" y="130" width="465" height="660" rx="18" fill="#FFFFFF" stroke="#CAD6DF" stroke-width="2"/><rect x="1022" y="130" width="464" height="660" rx="18" fill="#FFFFFF" stroke="#CAD6DF" stroke-width="2"/><text x="70" y="174" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">Change B, loop area A or angle θ</text><text x="70" y="228" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#315F86">1 • Change field strength</text><circle cx="275" cy="435" r="105" fill="none" stroke="#168C8C" stroke-width="5"/><line x1="120" y1="345" x2="120" y2="520" stroke="#725C8E" stroke-width="3" marker-end="url(#arr)"/><line x1="190" y1="345" x2="190" y2="520" stroke="#725C8E" stroke-width="3" marker-end="url(#arr)"/><line x1="260" y1="345" x2="260" y2="520" stroke="#725C8E" stroke-width="3" marker-end="url(#arr)"/><line x1="330" 