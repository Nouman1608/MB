dth="4" marker-end="url(#arr)"/><text x="1296" y="320" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#725C8E">A⃗</text><line x1="1090" y1="410" x2="1400" y2="410" stroke="#315F86" stroke-width="3" marker-end="url(#arr)"/><text x="1405" y="404" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#315F86">B⃗</text><text x="1250" y="580" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">Φ = NBA cos(ωt)</text><text x="1250" y="620" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#53677B">vary θ(t)</text><rect x="350" y="705" width="868" height="58" rx="12" fill="#E7F3F1" stroke="#E7F3F1" stroke-width="2"/><text x="784" y="742" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#168C8C">ℰ = −N dΦ/dt  •  the induced emf opposes the change</text><text letter-spacing="5" opacity=".08" x="764" y="855" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE STUDY RESOURCES</text><line x1="52" y1="873" x2="1476" y2="873" stroke="#C9A227" stroke-width="2"/><text x="54" y="906" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1305" y="881" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
