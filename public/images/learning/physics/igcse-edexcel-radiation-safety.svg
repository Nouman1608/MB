<text x="145" y="268" font-size="32" font-weight="700" fill="#1E2B47">Less time</text>
<text x="78" y="333" font-size="24" fill="#4B5B72">Source out only</text>
<text x="78" y="368" font-size="24" fill="#4B5B72">while needed</text>
