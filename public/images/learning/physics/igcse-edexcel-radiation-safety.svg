<svg xmlns="http://www.w3.org/2000/svg" width="900" height="890" viewBox="0 0 1000 988.89" role="img" aria-labelledby="title desc"><title id="title">Staying safe around radioactive sources (Edexcel International GCSE Physics)</title><desc id="desc">Three ways to reduce exposure to ionising radiation. 1 Less time: the source is out only while needed; a clock with a large shaded sector (long) changes to one with a small sector (short). 2 More distance: a person holds the source with long tongs, never by hand. 3 Shielding: radiation from a source is stopped by a lead wall before it reaches a person; use a lead container or a lead or concrete wall. No tier labels: the dangers of ionising radiation and reducing their risks are 4PH1 7.16, on both papers.</desc><rect width="1000" height="988.89" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="500" y="62" font-size="36" font-weight="700" fill="#1E2B47" text-anchor="middle">Staying safe around sources</text>
<text x="500" y="106" font-size="23" fill="#4B5B72" text-anchor="middle">Time, distance, shielding</text>
