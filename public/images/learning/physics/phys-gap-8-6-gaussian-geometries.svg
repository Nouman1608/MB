<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img"><title>Gaussian Surfaces for Sphere, Line and Sheet</title><desc>Three symmetry-matched surfaces and their flux equations</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#168C8C"/></marker><marker id="arrN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#10233F"/></marker></defs><rect width="1528" height="940" fill="#F3F6F6"/><text x="54" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#10233F">Gaussian Surfaces for Sphere, Line and Sheet</text><text x="56" y="92" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#53677B">Three symmetry-matched surfaces and their flux equations</text><rect x="42" y="130" width="465" height="660" rx="18" fill="#FFFFFF" stroke="#CAD6DF" stroke-width="2"/><rect x="532" y="130" width="465" height="660" rx="18" fill="#FFFFFF" stroke="#CAD6DF" stroke-width="2"/><rect x="1022" y="130" width="464" height="660" rx="18" fill="#FFFFFF" stroke="#CAD6DF" stroke-width="2"/><text x="70" y="174" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">Match the Gaussian surface to symmetry</text><text x="70" y="230" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#315F86">Solid sphere</text><circle cx="275" cy="450" r="128" fill="#F8FBFB" stroke="#315F86" stroke-width="4"/><circle cx="275" cy="450" r="6" fill="#C44949" stroke="#C44949" stroke-width="1"/><circle cx="275" cy="450" r="85" fill="none" stroke="#C9A227" stroke-width="3"/><line x1="275" y1="450" x2="399" y2="450" stroke="#168C8C" stroke-width="3" marker-end="url(#arr)"/><text x="275" y="622" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">E(4πr²) = qenc/ε₀</text><text x="275" y="660" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#53677B">inside: E ∝ r; outside: E ∝ 1/r²</text><text x="560" y="230" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#315F86">Infinite line: coaxial cylinder</text><path d="M650 350 C650 310 870 310 870 350 L870 555 C870 595 650 595 650 555 Z" fill="#E8F1F4" stroke="#315F86" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M650 350 C650 390 870 390 870 350" fill="none" stroke="#315F86" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M650 555 C650 515 870 515 870 555" fill="none" stroke="#315F86" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="760" y1="450" x2="900" y2="450" stroke="#168C8C" stroke-width="3" marker-end="url(#arr)"/><text x="760" y="622" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">E(2πrL) = λL/ε₀</text><text x="760" y="660" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#53677B">E = λ/(2πε₀r)</text><text x="1050" y="230" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#315F86">Infinite sheet: pillbox</text><line x1="1250" y1="310" x2="1250" y2="580" stroke="#C9A227" stroke-width="5"/><path d="M1160 390 L1340 390 L1340 500 L1160 500 Z" fill="#E8F1F4" stroke="#315F86" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><line x1="1220" y1="390" x2="1220" y2="300" stroke="#168C8C" stroke-width="3" marker-end="url(#arr)"/><line x1="1280" y1="500" x2="1280" y2="590" stroke="#168C8C" stroke-width="3" marker-end="url(#arr)"/><text x="1250" y="622" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">2EA = σA/ε₀</text><text x="1250" y="660" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#53677B">E = σ/(2ε₀)</text><text letter-spacing="5" opacity=".08" x="764" y="855" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE STUDY RESOURCES</text><line x1="52" y1="873" x2="1476" y2="873" stroke="#C9A227" stroke-width="2"/><text x="54" y="906" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1305" y="881" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
