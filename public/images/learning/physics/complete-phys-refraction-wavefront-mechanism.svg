<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="940" viewBox="0 0 1520 940" role="img" aria-labelledby="title desc"><title id="title">Why a wave refracts at a boundary</title><desc id="desc">The Huygens-style sequence shows one part of a wavefront entering a slower medium first and the wavefront pivoting. The ray bends toward the normal; frequency remains constant while speed and wavelength decrease. Ideal uniform stationary boundary.</desc><defs><marker id="aN" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0B1F3A"/></marker><marker id="aB" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#357EA2"/></marker><marker id="aR" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#B75E53"/></marker><marker id="aM" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#56866D"/></marker><marker id="aG" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#C9A227"/></marker></defs><rect width="1520" height="940" fill="#F4F7F6"/><g opacity=".045" transform="translate(686,345) scale(1.1)"><path d="M83 46 H129 A26 26 0 0 1 129 98 H130 A32 32 0 0 1 130 162 H83 Z M104 66 H123 A12 12 0 0 1 123 90 H104 Z M104 106 H124 A18 18 0 0 1 124 142 H104 Z" fill="#C9A227" fill-rule="evenodd"/><path d="M30 162 L30 46 L51 46 L67 116 L83 46 L104 46 L104 162 L83 162 L83 86 L67 150 L51 86 L51 162 Z" fill="#0B1F3A"/></g><g font-family="Arial,sans-serif"><text x="38" y="58" font-family="Arial,sans-serif" font-size="36" font-weight="700" text-anchor="start" fill="#0B1F3A">Why a wave refracts at a boundary</text><text x="38" y="101" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#607184">Marlbridge Physics • Why light bends</text><rect x="28" y="142" width="710" height="690" rx="16" fill="white" stroke="#BBC8C9" stroke-width="2"/><rect x="782" y="142" width="710" height="690" rx="16" fill="white" stroke="#BBC8C9" stroke-width="2"/><text x="60" y="190" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#0B1F3A">A  Boundary crossing rotates the wavefront</text><text x="814" y="190" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#0B1F3A">B  What changes—and what stays fixed</text><path d="M80 465 H690" fill="none" stroke="#0B1F3A" stroke-width="3" /><text x="95" y="450" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#607184">interface</text><rect x="95" y="235" width="585" height="205" rx="10" fill="#EEF5F7" stroke="none" stroke-width="2"/><rect x="95" y="485" width="585" height="260" rx="10" fill="#F9F2E8" stroke="none" stroke-width="2"/><text x="390" y="260" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#357EA2">Medium 1: faster wave</text><text x="390" y="718" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#B75E53">Medium 2: slower wave</text><path d="M150 345 L390 465" fill="none" stroke="#357EA2" stroke-width="6" /><path d="M390 465 L520 720" fill="none" stroke="#B75E53" stroke-width="6" /><path d="M330 585 L450 345" fill="none" stroke="#56866D" stroke-width="4" /><path d="M270 540 L630 315" fill="none" stroke="#C9A227" stroke-width="4" /><path d="M270 540 L630 315" fill="none" stroke="#C9A227" stroke-width="4" /><text x="236" y="288" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#357EA2">incident ray</text><text x="485" y="610" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#B75E53">refracted ray</text><path d="M390 465 V590" fill="none" stroke="#BBC8C9" stroke-width="2" stroke-dasharray="6 7"/><text x="401" y="510" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#607184">normal</text><text x="414" y="452" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#0B1F3A">θ₁</text><text x="417" y="510" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#0B1F3A">θ₂</text><text x="115" y="760" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#0B1F3A">Slower region bends the ray toward the normal.</text>
<rect x="830" y="240" width="600" height="170" rx="12" fill="#EEF5F7" stroke="none" stroke-width="2"/><rect x="830" y="420" width="600" height="170" rx="12" fill="#F9F2E8" stroke="none" stroke-width="2"/><text x="850" y="282" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#357EA2">Before boundary: speed v₁, wavelength λ₁</text><text x="850" y="321" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#0B1F3A">Wavefront spacing = λ₁; frequency = f</text><text x="850" y="459" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#B75E53">After boundary: speed v₂ &lt; v₁, wavelength λ₂ &lt; λ₁</text><text x="850" y="499" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#0B1F3A">Wavefront spacing decreases; frequency stays f</text><text x="850" y="554" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#0B1F3A">λ = v/f     →     n₁ sin θ₁ = n₂ sin θ₂</text><rect x="830" y="635" width="600" height="145" rx="12" fill="white" stroke="#BBC8C9" stroke-width="2"/><text x="855" y="675" font-family="Arial,sans-serif" font-size="19" font-weight="600" text-anchor="start" fill="#0B1F3A">The leading edge slows first; the wavefront pivots.</text><text x="855" y="712" font-family="Arial,sans-serif" font-size="19" font-weight="600" text-anchor="start" fill="#0B1F3A">The ray is perpendicular to each wavefront.</text><text x="855" y="749" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#607184">At normal incidence, direction does not bend.</text><text x="58" y="867" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#607184">Ideal uniform, stationary boundary; no frequency conversion or absorption is shown.</text><line x1="36" y1="892" x2="1480" y2="892" stroke="#BBC8C9" stroke-width="1.5"/><text x="38" y="923" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#607184">Bounded teaching diagram • Why light bends • AP Physics 2</text><text x="1370" y="923" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="end" fill="#0B1F3A">MARLBRIDGE</text><g transform="translate(1420,898) scale(.17)"><path d="M83 46 H129 A26 26 0 0 1 129 98 H130 A32 32 0 0 1 130 162 H83 Z M104 66 H123 A12 12 0 0 1 123 90 H104 Z M104 106 H124 A18 18 0 0 1 124 142 H104 Z" fill="#C9A227" fill-rule="evenodd"/><path d="M30 162 L30 46 L51 46 L67 116 L83 46 L104 46 L104 162 L83 162 L83 86 L67 150 L51 86 L51 162 Z" fill="#0B1F3A"/></g></g></svg>
