<svg xmlns="http://www.w3.org/2000/svg" width="900" height="920" viewBox="0 0 1000 1022.22" role="img" aria-labelledby="title desc"><title id="title">Which rod conducts best?</title><desc id="desc">Four equal rods of copper, iron, glass and wood are heated at one end; a pin is stuck to the far end of each with wax. The pin on copper falls first and the pin on iron second; the pins on glass and wood stay. The pin falls first on the best conductor. No tier labels: Edexcel 4PH1 4.6 and 4.9 (both papers) and OxfordAQA 9203 3.4.2a (untiered).</desc><rect width="1000" height="1022.22" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="500" y="62" font-size="36" font-weight="700" fill="#1E2B47" text-anchor="middle">Which rod conducts best?</text>
<text x="500" y="106" font-size="23" fill="#4B5B72" text-anchor="middle">Wax holds a pin on the far end of each rod</text>
<rect x="166" y="178" width="67" height="632" rx="10" fill="#EEB26B" stroke="#B9632F" stroke-width="3"/>
<text x="200" y="845" font-size="24" font-weight="700" fill="#8A6A0C" text-anchor="middle">heat</text>
<rect x="233" y="222" width="457" height="46" fill="#B9632F" stroke="#1E2B47" stroke-width="3"/>
<text x="461" y="255" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">Copper</text>
<rect x="233" y="388" width="457" height="46" fill="#8C96A3" stroke="#1E2B47" stroke-width="3"/>
<text x="461" y="421" font-size="24" font-weight="700" fill="#1E2B47" text-anchor="middle">Iron</text>
<rect x="233" y="555" width="457" height="46" fill="#BFE0E6" stroke="#1E2B47" stroke-width="3"/>
<text x="461" y="588" font-size="24" font-weight="700" fill="#1E2B47" text-anchor="middle">Glass</text>
<rect x="233" y="722" width="457" height="46" fill="#B58A5B" stroke="#1E2B47" stroke-width="3"/>
<text x="461" y="755" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">Wood</text>
<text x="867" y="188" font-size="23" fill="#4B5B72" text-anchor="middle">pin falls</text>
<line x1="698" y1="272" x2="698" y2="298" stroke="#2F6B63" stroke-width="3.5" stroke-linecap="round"/><polygon points="698,318 684.8,296 711.2,296" fill="#2F6B63"/>
<circle cx="698" cy="326" r="9" fill="#B8BEC7" stroke="#1E2B47" stroke-width="2.5"/>
<line x1="698" y1="335" x2="698" y2="365" stroke="#1E2B47" stroke-width="4" stroke-linecap="round"/>
<text x="845" y="255" font-size="28" font-weight="700" fill="#2F6B63" text-anchor="middle">1st</text>
<line x1="698" y1="438" x2="698" y2="464" stroke="#2F6B63" stroke-width="3.5" stroke-linecap="round"/><polygon points="698,484 684.8,462 711.2,462" fill="#2F6B63"/>
<circle cx="698" cy="492" r="9" fill="#B8BEC7" stroke="#1E2B47" stroke-width="2.5"/>
<line x1="698" y1="501" x2="698" y2="531" stroke="#1E2B47" stroke-width="4" stroke-linecap="round"/>
<text x="845" y="421" font-size="28" font-weight="700" fill="#2F6B63" text-anchor="middle">2nd</text>
<ellipse cx="698" cy="578" rx="11" ry="16" fill="#F2E6B7" stroke="#8A6A0C" stroke-width="2"/>
<line x1="709" y1="578" x2="742" y2="578" stroke="#1E2B47" stroke-width="4" stroke-linecap="round"/>
<circle cx="751" cy="578" r="9" fill="#B8BEC7" stroke="#1E2B47" stroke-width="2.5"/>
<text x="862" y="588" font-size="28" font-weight="700" fill="#4B5B72" text-anchor="middle">stays</text>
<ellipse cx="698" cy="745" rx="11" ry="16" fill="#F2E6B7" stroke="#8A6A0C" stroke-width="2"/>
<line x1="709" y1="745" x2="742" y2="745" stroke="#1E2B47" stroke-width="4" stroke-linecap="round"/>
<circle cx="751" cy="745" r="9" fill="#B8BEC7" stroke="#1E2B47" stroke-width="2.5"/>
<text x="862" y="755" font-size="28" font-weight="700" fill="#4B5B72" text-anchor="middle">stays</text>
<text x="500" y="977" font-size="28" font-weight="700" fill="#2F6B63" text-anchor="middle">Pin falls first on the best conductor</text></g></svg>
