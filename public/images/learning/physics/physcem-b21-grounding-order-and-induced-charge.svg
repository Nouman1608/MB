<marker id="aN" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#0B1F3A"/></marker>
<marker id="aB" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#3C7EA7"/></marker>
<marker id="aT" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#108B88"/></marker>
<marker id="aR" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#C85C5C"/></marker>
</defs><title id="title">Grounding a conductor: retain induced charge</title><desc id="desc">Three steps: an isolated charged sphere neutralises when grounded; a positive external charge induces net negative charge on a grounded sphere; disconnect the ground while the external charge remains, then remove the charge so the sphere retains Q prime.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial, Liberation Sans, sans-serif"><text x="58" y="74" fill="#0B1F3A" font-size="38" font-weight="700" text-anchor="start">Grounding a conductor: retain induced charge</text><text x="60" y="116" fill="#637783" font-size="20" font-weight="500" text-anchor="start">To retain the charge induced by a nearby object, disconnect ground before removing that object.</text><rect x="55" y="145" width="1490" height="780" rx="18" fill="#FFFFFF" stroke="#CBD7D9" stroke-width="2"/><rect x="80" y="205" width="1440" height="650" rx="18" fill="#FFFFFF" stroke="#CBD7D9" stroke-width="2"/><text x="800" y="255" fill="#108B88" font-size="24" font-weight="700" text-anchor="middle">Grounding changes the conductor’s charge; connection order matters</text><rect x="105" y="300" width="415" height="480" rx="14" fill="#F8FAFA" stroke="#CBD7D9" stroke-width="2"/><text x="312" y="345" fill="#108B88" font-size="19" font-weight="700" text-anchor="middle">1  Isolated sphere</text><rect x="565" y="300" width="415" height="480" rx="14" fill="#F8FAFA" stroke="#CBD7D9" stroke-width="2"/><text x="772" y="345" fill="#108B88" font-size="19" font-weight="700" text-anchor="middle">2  Hold +q nearby</text><rect x="1025" y="300" width="415" height="480" rx="14" fill="#F8FAFA" stroke="#CBD7D9" stroke-width="2"/><text x="1232" y="345" fill="#108B88" font-size="19" font-weight="700" text-anchor="middle">3  Disconnect ground first</text><circle cx="312" cy="500" r="75" fill="#E6EEF0" stroke="#718B92" stroke-width="3"/><text x="312" y="506" fill="#0B1F3A" font-size="17" font-weight="700" text-anchor="middle">+ sphere</text><path d="M 312 575 L 312 635 L 255 635 L 255 675 L 370 675 L 370 635 L 312 635" fill="none" stroke="#3C7EA7" stroke-width="4"/><text x="312" y="718" fill="#0B1F3A" font-size="15" font-weight="600" text-anchor="middle">If initially charged alone:</text><text x="312" y="745" fill="#637783" font-size="14" font-weight="500" text-anchor="middle">grounding makes it neutral (Q = 0).</text><circle cx="650" cy="520" r="21" fill="#F7DDDA" stroke="#C85C5C" stroke-width="3"/><text x="650" y="527" fill="#C85C5C" font-size="16" font-weight="700" text-anchor="middle">+q</text><circle cx="820" cy="520" r="75" fill="#E6EEF0" stroke="#718B92" stroke-width="3"/><path d="M 820 595 L 820 650 L 760 650 L 760 685 L 885 685 L 885 650 L 820 650" fill="none" stroke="#3C7EA7" stroke-width="4"/><circle cx="770" cy="490" r="6" fill="#3C7EA7" stroke="#3C7EA7" stroke-width="1"/><circle cx="786" cy="455" r="6" fill="#3C7EA7" stroke="#3C7EA7" stroke-width="1"/><circle cx="790" cy="545" r="6" fill="#3C7EA7" stroke="#3C7EA7" stroke-width="1"/><circle cx="835" cy="450" r="6" fill="#3C7EA7" stroke="#3C7EA7" stroke-width="1"/><circle cx="860" cy="520" r="6" fill="#3C7EA7" stroke="#3C7EA7" stroke-width="1"/><line x1="675" y1="520" x2="730" y2="520" stroke="#C85C5C" stroke-width="3" marker-end="url(#aR)"/><line x1="650" y1="430" x2="820" y2="430" stroke="#D8A927" stroke-width="2"/><line x1="650" y1="422" x2="650" y2="438" stroke="#D8A927" stroke-width="2"/><line x1="820" y1="422" x2="820" y2="438" stroke="#D8A927" stroke-width="2"/><text x="735" y="420" fill="#D8A927" font-size="15" font-weight="700" text-anchor="middle">d</text><line x1="820" y1="520" x2="880" y2="520" stroke="#3C7EA7" stroke-width="2"/><text x="850" y="510" fill="#3C7EA7" font-size="15" font-weight="700" text-anchor="middle">R</text><text x="820" y="620" fill="#0B1F3A" font-size="14" font-weight="600" text-anchor="middle">grounded sphere at V = 0</text><text x="772" y="715" fill="#108B88" font-size="18" font-weight="700" text-anchor="middle">Q′ = −qR/d</text><text x="772" y="744" fill="#637783" font-size="14" font-weight="500" text-anchor="middle">electrons enter from ground</text><circle cx="1260" cy="520" r="75" fill="#E6EEF0" stroke="#718B92" stroke-width="3"/><circle cx="1260" cy="445" r="6" fill="#3C7EA7" stroke="#3C7EA7" stroke-width="1"/><circle cx="1313" cy="467" r="6" fill="#3C7EA7" stroke="#3C7EA7" stroke-width="1"/><circle cx="1325" cy="520" r="6" fill="#3C7EA7" stroke="#3C7EA7" stroke-width="1"/><circle cx="1313" cy="573" r="6" fill="#3C7EA7" stroke="#3C7EA7" stroke-width="1"/><circle cx="1260" cy="595" r="6" fill="#3C7EA7" stroke="#3C7EA7" stroke-width="1"/><circle cx="1207" cy="573" r="6" fill="#3C7EA7" stroke="#3C7EA7" stroke-width="1"/><circle cx="1195" cy="520" r="6" fill="#3C7EA7" stroke="#3C7EA7" stroke-width="1"/><circle cx="1207" cy="467" r="6" fill="#3C7EA7" stroke="#3C7EA7" stroke-width="1"/><path d="M 1260 595 L 1260 640 L 1195 640" fill="none" stroke="#3C7EA7" stroke-width="4"/><line x1="1195" y1="625" x2="1195" y2="655" stroke="#C85C5C" stroke-width="4"/><text x="1260" y="690" fill="#0B1F3A" font-size="15" font-weight="700" text-anchor="middle">Open the ground wire while +q remains.</text><text x="1260" y="722" fill="#108B88" font-size="15" font-weight="600" text-anchor="middle">Then remove +q: Q′ spreads uniformly.</text><text x="1260" y="750" fill="#637783" font-size="12" font-weight="500" text-anchor="middle">Remove +q first and charge returns to ground.</text><text x="800" y="942" fill="#A9BABC" font-size="26" font-weight="700" text-anchor="middle" opacity="0.24" letter-spacing="2">MARLBRIDGE STUDY RESOURCES</text><line x1="55" y1="960" x2="1545" y2="960" stroke="#D8A927" stroke-width="2"/><text x="64" y="997" fill="#637783" font-size="14" font-weight="500" text-anchor="start">Marlbridge • Physics study resource • Schematic; labels state key assumptions</text><image x="1260" y="968" width="285" height="47" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/></g></svg>