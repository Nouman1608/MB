<svg xmlns="http://www.w3.org/2000/svg" width="900" height="770" viewBox="0 0 1000 855.56" role="img" aria-labelledby="title desc"><title id="title">Image from a converging lens (OxfordAQA International GCSE Physics)</title><desc id="desc">To-scale ray diagram with focal length 120 units and the object 300 units from a converging lens, beyond 2F. A ray parallel to the axis refracts through F; a ray through the centre of the lens goes straight on. They meet 200 units beyond the lens, between F and 2F, where the image is real, inverted and diminished (two thirds of the object height). No tier labels: 9203 3.3.6b, e and f.</desc><rect width="1000" height="855.56" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="500" y="62" font-size="36" font-weight="700" fill="#1E2B47" text-anchor="middle">Image from a converging lens</text>
