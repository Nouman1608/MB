<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><defs>
<marker id="aN" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#0B1F3A"/></marker>
<marker id="aB" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#3C7EA7"/></marker>
<marker id="aT" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#108B88"/></marker>
<marker id="aR" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#C85C5C"/></marker>
</defs><title id="title">Charged conductors and insulators</title><desc id="desc">Compare an electrostatically equilibrated charged conducting sphere, a charged insulating sphere with fixed internal charges and nonzero internal field, and an empty cavity in a closed conductor under electrostatic shielding assumptions.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial, Liberation Sans, sans-serif"><text x="58" y="74" fill="#0B1F3A" font-size="38" font-weight="700" text-anchor="start">Charged conductors and insulators</text><text x="60" y="116" fill="#637783" font-size="20" font-weight="500" text-anchor="start">Free charge moves to a conductor’s surface; charge in an insulator can remain within its material.</text><rect x="55" y="145" width="1490" height="780" rx="18" fill="#FFFFFF" stroke="#CBD7D9" stroke-width="2"/><rect x="82" y="205" width="465" height="650" rx="18" fill="#FFFFFF" stroke="#CBD7D9" stroke-width="2"/><rect x="567" y="205" width="465" height="650" rx="18" fill="#FFFFFF" stroke="#CBD7D9" stroke-width="2"/><rect x="1052" y="205" width="465" height="650" rx="18" fill="#F7FAFA" stroke="#CBD7D9" stroke-width="2"/><text x="315" y="255" fill="#108B88" font-size="23" font-weight="700" text-anchor="middle">Conducting sphere</text><text x="800" y="255" fill="#108B88" font-size="23" font-weight="700" text-anchor="middle">Insulating sphere</text><text x="1285" y="255" fill="#108B88" font-size="23" font-weight="700" text-anchor="middle">Empty metal cavity</text><circle cx="315" cy="485" r="118" fill="#E6EEF0" stroke="#718B92" stroke-width="3"/><circle cx="315" cy="367" r="7" fill="#C85C5C" stroke="#C85C5C" stroke-width="1"/><circle cx="398" cy="401" r="7" fill="#C85C5C" stroke="#C85C5C" stroke-width="1"/><circle cx="433" cy="485" r="7" fill="#C85C5C" stroke="#C85C5C" stroke-width="1"/><circle cx="398" cy="568" r="7" fill="#C85C5C" stroke="#C85C5C" stroke-width="1"/><circle cx="315" cy="603" r="7" fill="#C85C5C" stroke="#C85C5C" stroke-width="1"/><circle cx="232" cy="568" r="7" fill="#C85C5C" stroke="#C85C5C" stroke-width="1"/><circle cx="197" cy="485" r="7" fill="#C85C5C" stroke="#C85C5C" stroke-width="1"/><circle cx="232" cy="401" r="7" fill="#C85C5C" stroke="#C85C5C" stroke-width="1"/><circle cx="315" cy="485" r="7" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="1"/><text x="315" y="645" fill="#108B88" font-size="17" font-weight="700" text-anchor="middle">E = 0 in the metal</text><line x1="315" y1="355" x2="315" y2="315" stroke="#3C7EA7" stroke-width="3" marker-end="url(#aB)"/><line x1="445" y1="485" x2="485" y2="485" stroke="#3C7EA7" stroke-width="3" marker-end="url(#aB)"/><line x1="185" y1="485" x2="145" y2="485" stroke="#3C7EA7" stroke-width="3" marker-end="url(#aB)"/><text x="315" y="715" fill="#0B1F3A" font-size="16" font-weight="600" text-anchor="middle">Excess charge spreads over the surface.</text><text x="315" y="750" fill="#637783" font-size="15" font-weight="500" text-anchor="middle">Outside a spherical conductor, E is radial.</text><circle cx="800" cy="485" r="118" fill="#F9F2E7" stroke="#A99478" stroke-width="3"/><circle cx="800" cy="485" r="7" fill="#C85C5C" stroke="#C85C5C" stroke-width="1"/><circle cx="760" cy="435" r="7" fill="#C85C5C" stroke="#C85C5C" stroke-width="1"/><circle cx="840" cy="438" r="7" fill="#C85C5C" stroke="#C85C5C" stroke-width="1"/><circle cx="745" cy="520" r="7" fill="#C85C5C" stroke="#C85C5C" stroke-width="1"/><circle cx="850" cy="525" r="7" fill="#C85C5C" stroke="#C85C5C" stroke-width="1"/><circle cx="790" cy="560" r="7" fill="#C85C5C" stroke="#C85C5C" stroke-width="1"/><circle cx="825" cy="490" r="7" fill="#C85C5C" stroke="#C85C5C" stroke-width="1"/><circle cx="770" cy="490" r="7" fill="#C85C5C" stroke="#C85C5C" stroke-width="1"/><circle cx="835" cy="565" r="7" fill="#C85C5C" stroke="#C85C5C" stroke-width="1"/><circle cx="830" cy="485" r="5" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="1"/><line x1="835" y1="485" x2="877" y2="485" stroke="#3C7EA7" stroke-width="4" marker-end="url(#aB)"/><text x="850" y="455" fill="#0B1F3A" font-size="14" font-weight="600" text-anchor="middle">P</text><text x="800" y="645" fill="#0B1F3A" font-size="17" font-weight="600" text-anchor="middle">Charge can remain inside</text><text x="800" y="680" fill="#108B88" font-size="16" font-weight="700" text-anchor="middle">the material; E need not be zero.</text><text x="800" y="735" fill="#637783" font-size="15" font-weight="500" text-anchor="middle">The internal field depends on the</text><text x="800" y="760" fill="#637783" font-size="15" font-weight="500" text-anchor="middle">charge distribution.</text><rect x="1168" y="370" width="235" height="235" rx="8" fill="#DCE7E9" stroke="#718B92" stroke-width="5"/><rect x="1225" y="425" width="120" height="120" rx="3" fill="#FFFFFF" stroke="#718B92" stroke-width="3"/><text x="1285" y="485" fill="#0B1F3A" font-size="18" font-weight="700" text-anchor="middle">empty</text><text x="1285" y="512" fill="#0B1F3A" font-size="18" font-weight="700" text-anchor="middle">cavity</text><line x1="1090" y1="320" x2="1150" y2="320" stroke="#3C7EA7" stroke-width="3" marker-end="url(#aB)"/><line x1="1385" y1="320" x2="1470" y2="320" stroke="#3C7EA7" stroke-width="3" marker-end="url(#aB)"/><line x1="1090" y1="665" x2="1150" y2="665" stroke="#3C7EA7" stroke-width="3" marker-end="url(#aB)"/><line x1="1385" y1="665" x2="1470" y2="665" stroke="#3C7EA7" stroke-width="3" marker-end="url(#aB)"/><text x="1285" y="645" fill="#108B88" font-size="17" font-weight="700" text-anchor="middle">E = 0 in the empty cavity</text><text x="1285" y="695" fill="#0B1F3A" font-size="16" font-weight="600" text-anchor="middle">Electrostatic equilibrium; no</text><text x="1285" y="723" fill="#0B1F3A" font-size="16" font-weight="600" text-anchor="middle">charge inside the cavity.</text><text x="800" y="942" fill="#A9BABC" font-size="26" font-weight="700" text-anchor="middle" opacity="0.24" letter-spacing="2">MARLBRIDGE STUDY RESOURCES</text><line x1="55" y1="960" x2="1545" y2="960" stroke="#D8A927" stroke-width="2"/><text x="64" y="997" fill="#637783" font-size="14" font-weight="500" text-anchor="start">Marlbridge • Physics study resource • Schematic; labels state key assumptions</text><image x="1260" y="968" width="285" height="47" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/></g></svg>
