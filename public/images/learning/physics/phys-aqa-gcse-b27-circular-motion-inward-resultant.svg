<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><defs><marker id="n" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#0B1F3A"/></marker><marker id="b" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#3C7EA7"/></marker><marker id="t" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#108B88"/></marker><marker id="r" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#C85C5C"/></marker><marker id="gold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#D6A72C"/></marker></defs><title id="title">Circular motion: velocity changes direction</title><desc id="desc">A cyclist moves at constant speed around a circular path. At two points, equal-length velocity arrows are tangent to the path but point in different directions. At each point an acceleration and resultant-force arrow points inward toward the circle centre. The speed is unchanged while velocity changes direction.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial, Liberation Sans, sans-serif"><text x="58" y="74" fill="#0B1F3A" font-size="37" font-weight="700">Circular motion: velocity changes direction</text><text x="60" y="116" fill="#637783" font-size="20">A constant-speed object still accelerates when its direction changes.</text><rect x="55" y="150" width="1490" height="750" rx="18" fill="#FFFFFF" stroke="#CBD7D9" stroke-width="2"/><rect x="85" y="190" width="970" height="610" rx="14" fill="#F7FAFA" stroke="#CBD7D9" stroke-width="2"/><rect x="1080" y="190" width="440" height="610" rx="14" fill="#F7FAFA" stroke="#CBD7D9" stroke-width="2"/><text x="570" y="235" text-anchor="middle" fill="#0B1F3A" font-size="22" font-weight="700">Same speed at two points • different velocity directions</text>
<circle cx="560" cy="500" r="205" fill="#EAF4F3" stroke="#718B92" stroke-width="4" stroke-dasharray="10 8"/><circle cx="560" cy="295" r="13" fill="#D6A72C" stroke="#0B1F3A" stroke-width="2"/><circle cx="765" cy="500" r="13" fill="#D6A72C" stroke="#0B1F3A" stroke-width="2"/><circle cx="560" cy="500" r="8" fill="#0B1F3A"/><text x="580" y="495" fill="#0B1F3A" font-size="16">centre</text>
<line x1="560" y1="295" x2="760" y2="295" stroke="#3C7EA7" stroke-width="6" marker-end="url(#b)"/><text x="650" y="258" text-anchor="middle" fill="#3C7EA7" font-size="17" font-weight="700">velocity v₁ (tangent)</text><line x1="765" y1="500" x2="765" y2="700" stroke="#3C7EA7" stroke-width="6" marker-end="url(#b)"/><text x="800" y="620" fill="#3C7EA7" font-size="17" font-weight="700">velocity v₂</text>
<line x1="560" y1="295" x2="560" y2="420" stroke="#C85C5C" stroke-width="5" marker-end="url(#r)"/><text x="575" y="385" fill="#C85C5C" font-size="15" font-weight="700">a inward</text><line x1="765" y1="500" x2="650" y2="500" stroke="#C85C5C" stroke-width="5" marker-end="url(#r)"/><text x="790" y="455" fill="#C85C5C" font-size="15" font-weight="700">resultant force inward</text><text x="560" y="745" text-anchor="middle" fill="#637783" font-size="17">The speed can stay constant; the velocity changes because its direction changes.</text>
<text x="1300" y="255" text-anchor="middle" fill="#0B1F3A" font-size="21" font-weight="700">At every point on the circle</text><line x1="1130" y1="305" x2="1470" y2="305" stroke="#CBD7D9" stroke-width="2"/><text x="1120" y="365" fill="#3C7EA7" font-size="18" font-weight="700">v is tangent to the path.</text><text x="1120" y="420" fill="#C85C5C" font-size="18" font-weight="700">Resultant force and</text><text x="1120" y="450" fill="#C85C5C" font-size="18" font-weight="700">acceleration point inward.</text><rect x="1110" y="520" width="380" height="130" rx="12" fill="#FFF5DB" stroke="#D6A72C" stroke-width="2"/><text x="1300" y="560" text-anchor="middle" fill="#0B1F3A" font-size="17" font-weight="700">A changing direction is a</text><text x="1300" y="592" text-anchor="middle" fill="#0B1F3A" font-size="17" font-weight="700">change in velocity—even when</text><text x="1300" y="624" text-anchor="middle" fill="#0B1F3A" font-size="17" font-weight="700">speed does not change.</text>
<rect x="205" y="817" width="1190" height="42" rx="10" fill="#EAF4F3" stroke="#9CCAC5" stroke-width="2"/><text x="800" y="844" text-anchor="middle" fill="#0B1F3A" font-size="17" font-weight="700">Higher Tier • qualitative circular-motion model; no formula beyond the GCSE scope is needed here.</text></g><text x="800" y="942" fill="#A9BABC" font-size="26" font-weight="700" text-anchor="middle" opacity=".24" letter-spacing="2">MARLBRIDGE STUDY RESOURCES</text><line x1="55" y1="964" x2="1545" y2="964" stroke="#C9A227" stroke-width="2"/><text x="58" y="1000" fill="#0B1F3A" font-size="17" font-weight="700">MARLBRIDGE • STUDY RESOURCE</text><image x="1260" y="968" width="285" height="70" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/></svg>
