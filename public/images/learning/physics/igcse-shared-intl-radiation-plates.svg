<svg xmlns="http://www.w3.org/2000/svg" width="900" height="950" viewBox="0 0 1000 1055.56" role="img" aria-labelledby="title desc"><title id="title">Radiation: black absorbs, shiny reflects</title><desc id="desc">A radiant heater faces a dull black plate and a shiny metal plate at the same distance; infrared, drawn as wavy gold lines, crosses the gap with no medium. The black plate absorbs the infrared, its wax melts and its pin falls first. The shiny plate reflects most of it, shown by navy arrows, and its pin stays. No tier labels: Edexcel 4PH1 4.8 (both papers) and OxfordAQA 9203 3.3.2d (untiered).</desc><rect width="1000" height="1055.56" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="500" y="62" font-size="36" font-weight="700" fill="#1E2B47" text-anchor="middle">Radiation: black absorbs, shiny reflects</text>
<text x="500" y="106" font-size="23" fill="#4B5B72" text-anchor="middle">Infrared crosses the gap with no medium</text>
<rect x="77" y="211" width="101" height="689" rx="10" fill="#EEB26B" stroke="#B9632F" stroke-width="3"/>
<text x="127" y="532" font-size="24" font-weight="700" fill="#1E2B47" text-anchor="middle">radiant</text>
<text x="127" y="566" font-size="24" font-weight="700" fill="#1E2B47" text-anchor="middle">heater</text>
