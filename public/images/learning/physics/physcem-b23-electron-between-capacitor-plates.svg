<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><defs>
<marker id="arrowN" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#0B1F3A"/></marker><marker id="arrowB" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#3C7EA7"/></marker><marker id="arrowT" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#108B88"/></marker><marker id="arrowR" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#C85C5C"/></marker></defs>
<title id="title">An electron curves through a capacitor field</title><desc id="desc">An electron enters midway between parallel plates at 1.0 × 10⁷ metres per second. Across the 5.0 cm plate length its path curves toward the positive lower plate by 4.4 mm, leaving 5.6 mm clearance from the plate; electric field points upward and force on the electron downward.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial, Liberation Sans, sans-serif">
<text x="60" y="76" fill="#0B1F3A" font-size="38" font-weight="700">An electron curves through a capacitor field</text><text x="62" y="117" fill="#637783" font-size="20">A uniform electric field bends the negative electron toward the positive plate.</text>
<rect x="55" y="150" width="1490" height="750" rx="18" fill="#FFFFFF" stroke="#CBD7D9" stroke-width="2"/>
<!-- parallel plates: 20 mm separation drawn as 320 px (16 px/mm); 50 mm length drawn as 800 px -->
<rect x="300" y="310" width="800" height="44" rx="5" fill="#DCE8F1" stroke="#3C7EA7" stroke-width="3"/><text x="700" y="340" text-anchor="middle" fill="#0B1F3A" font-size="21" font-weight="700">negative plate  −</text>
<rect x="300" y="674" width="800" height="44" rx="5" fill="#F7DDDA" stroke="#C85C5C" stroke-width="3"/><text x="700" y="704" text-anchor="middle" fill="#0B1F3A" font-size="21" font-weight="700">positive plate  +</text>
<text x="302" y="278" fill="#637783" font-size="16">plate length = 5.0 cm</text>
<!-- uniform electric field upwards -->
<g stroke="#3C7EA7" stroke-width="3" marker-end="url(#arrowB)" opacity=".9"><line x1="415" y1="630" x2="415" y2="390"/><line x1="575" y1="630" x2="575" y2="390"/><line x1="735" y1="630" x2="735" y2="390"/><line x1="895" y1="630" x2="895" y2="390"/></g>
<text x="468" y="422" fill="#3C7EA7" font-size="19" font-weight="700">E upward (from + to −)</text>
<!-- electron starts halfway and bends down toward positive plate -->
<path d="M330 514 Q715 514 1100 584" fill="none" stroke="#108B88" stroke-width="6" stroke-linecap="round"/>
<circle cx="330" cy="514" r="25" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="3"/><text x="330" y="522" text-anchor="middle" fill="#0B1F3A" font-size="22" font-weight="700">e−</text>
<circle cx="1100" cy="562" r="8" fill="#108B88"/><text x="345" y="480" fill="#0B1F3A" font-size="17" font-weight="700">entry: midway, vₓ = 1.0 × 10⁷ m/s</text>
<line x1="370" y1="556" x2="540" y2="556" stroke="#0B1F3A" stroke-width="3" marker-end="url(#arrowN)"/><text x="446" y="585" fill="#0B1F3A" font-size="17" text-anchor="middle">initial velocity</text>
<line x1="795" y1="539" x2="795" y2="609" stroke="#C85C5C" stroke-width="4" marker-end="url(#arrowR)"/><text x="815" y="580" fill="#C85C5C" font-size="17" font-weight="700">F on e−</text>
<!-- dimension lines -->
<line x1="1150" y1="354" x2="1150" y2="674" stroke="#0B1F3A" stroke-width="2"/><line x1="1137" y1="354" x2="1163" y2="354" stroke="#0B1F3A" stroke-width="2"/><line x1="1137" y1="674" x2="1163" y2="674" stroke="#0B1F3A" stroke-width="2"/><text x="1180" y="510" fill="#0B1F3A" font-size="18" font-weight="700" transform="rotate(90 1180 510)" text-anchor="middle">plate gap = 2.0 cm</text>
<line x1="300" y1="756" x2="1100" y2="756" stroke="#0B1F3A" stroke-width="2"/><line x1="300" y1="744" x2="300" y2="768" stroke="#0B1F3A" stroke-width="2"/><line x1="1100" y1="744" x2="1100" y2="768" stroke="#0B1F3A" stroke-width="2"/><text x="700" y="784" text-anchor="middle" fill="#0B1F3A" font-size="17" font-weight="700">horizontal distance across field = 5.0 cm; time in field = 5.0 ns</text>
<rect x="1208" y="260" width="298" height="468" rx="14" fill="#F7FAFA" stroke="#CBD7D9" stroke-width="2"/><text x="1230" y="300" fill="#0B1F3A" font-size="19" font-weight="700">At the exit</text><text x="1230" y="344" fill="#637783" font-size="16">vertical deflection</text><text x="1230" y="373" fill="#108B88" font-size="23" font-weight="700">4.4 mm</text><text x="1230" y="420" fill="#637783" font-size="16">clearance to + plate</text><text x="1230" y="449" fill="#108B88" font-size="23" font-weight="700">5.6 mm</text><text x="1230" y="496" fill="#637783" font-size="16">deflection angle</text><text x="1230" y="525" fill="#108B88" font-size="23" font-weight="700">≈ 10° downward</text><line x1="1228" y1="550" x2="1484" y2="550" stroke="#CBD7D9" stroke-width="2"/><text x="1230" y="586" fill="#0B1F3A" font-size="16">Since 4.4 mm &lt; 10 mm,</text><text x="1230" y="612" fill="#0B1F3A" font-size="16">the electron clears the plate</text><text x="1230" y="638" fill="#0B1F3A" font-size="16">and exits the field region.</text><text x="1230" y="690" fill="#637783" font-size="14">Trajectory is a parabola.</text>
<rect x="300" y="814" width="1190" height="46" rx="10" fill="#FFF5DB" stroke="#D6A72C" stroke-width="2"/><text x="895" y="843" text-anchor="middle" fill="#0B1F3A" font-size="17" font-weight="700">Direction check: E points upward; F = qE points downward because q = −e.</text>
<text x="800" y="942" fill="#A9BABC" font-size="26" font-weight="700" text-anchor="middle" opacity=".24" letter-spacing="2">MARLBRIDGE STUDY RESOURCES</text><line x1="55" y1="964" x2="1545" y2="964" stroke="#C9A227" stroke-width="2"/><text x="58" y="1000" fill="#0B1F3A" font-size="17" font-weight="700">MARLBRIDGE  •  STUDY RESOURCE</text><image x="1260" y="968" width="285" height="70" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/></g></svg>
