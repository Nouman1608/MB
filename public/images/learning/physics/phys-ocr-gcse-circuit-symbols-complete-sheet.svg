<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc"><title id="title">OCR GCSE circuit symbols: complete P3.2b set</title><desc id="desc">A labelled reference sheet of circuit symbols for a cell, battery, positive and negative d.c. supply, switch, filament lamp, fixed and variable resistors, diode, LDR, NTC thermistor, ammeter and voltmeter.</desc><rect width="1440" height="980" fill="#F4F7F7"/><text x="64" y="66" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#0B1F3A">OCR GCSE circuit symbols</text><text x="66" y="105" font-family="Arial,sans-serif" font-size="19" fill="#52677C">P3.2b reference sheet • Conventional current leaves the positive supply terminal</text>
<g font-family="Arial,sans-serif" fill="#0B1F3A"><g><rect x="55" y="145" width="420" height="170" rx="14" fill="#fff" stroke="#C8D3D4" stroke-width="2"/><text x="230" y="190" font-size="24" font-weight="700">Cell</text><line x1="90" y1="240" x2="160" y2="240" stroke="#20354D" stroke-width="4"/><line x1="210" y1="240" x2="285" y2="240" stroke="#20354D" stroke-width="4"/><line x1="170" y1="205" x2="170" y2="275" stroke="#20354D" stroke-width="5"/><line x1="198" y1="220" x2="198" y2="260" stroke="#20354D" stroke-width="5"/><text x="159" y="200" font-size="18" fill="#3F8582">+</text><text x="196" y="200" font-size="18" fill="#52677C">−</text><text x="315" y="242" font-size="18" fill="#52677C">long line is +</text></g>
<g><rect x="510" y="145" width="420" height="170" rx="14" fill="#fff" stroke="#C8D3D4" stroke-width="2"/><text x="685" y="190" font-size="24" font-weight="700">Battery</text><line x1="545" y1="240" x2="615" y2="240" stroke="#20354D" stroke-width="4"/><line x1="675" y1="240" x2="760" y2="240" stroke="#20354D" stroke-width="4"/><line x1="625" y1="203" x2="625" y2="277" stroke="#20354D" stroke-width="5"/><line x1="650" y1="218" x2="650" y2="262" stroke="#20354D" stroke-width="5"/><line x1="770" y1="203" x2="770" y2="277" stroke="#20354D" stroke-width="5"/><line x1="795" y1="218" x2="795" y2="262" stroke="#20354D" stroke-width="5"/><line x1="805" y1="240" x2="885" y2="240" stroke="#20354D" stroke-width="4"/><text x="830" y="282" font-size="17" fill="#52677C">two or more cells</text></g>
<g><rect x="965" y="145" width="420" height="170" rx="14" fill="#fff" stroke="#C8D3D4" stroke-width="2"/><text x="1140" y="190" font-size="24" font-weight="700">d.c. power supply</text><line x1="1000" y1="240" x2="1060" y2="240" stroke="#20354D" stroke-width="4"/><circle cx="1115" cy="240" r="50" fill="#fff" stroke="#20354D" stroke-width="4"/><text x="1093" y="230" font-size="24" font-weight="700" fill="#3F8582">+</text><text x="1124" y="256" font-size="24" font-weight="700" fill="#B75E53">−</text><line x1="1170" y1="240" x2="1230" y2="240" stroke="#20354D" stroke-width="4"/><text x="1245" y="246" font-size="18" fill="#52677C">marked poles</text></g>
<g><rect x="55" y="335" width="420" height="170" rx="14" fill="#fff" stroke="#C8D3D4" stroke-width="2"/><text x="230" y="380" font-size="24" font-weight="700">Switch (open)</text><line x1="90" y1="435" x2="160" y2="435" stroke="#20354D" stroke-width="4"/><circle cx="164" cy="435" r="6" fill="#20354D"/><line x1="170" y1="435" x2="230" y2="395" stroke="#20354D" stroke-width="5"/><circle cx="238" cy="435" r="6" fill="#20354D"/><line x1="244" y1="435" x2="300" y2="435" stroke="#20354D" stroke-width="4"/><text x="315" y="442" font-size="18" fill="#52677C">gap = open</text></g>
<g><rect x="510" y="335" width="420" height="170" rx="14" fill="#fff" stroke="#C8D3D4" stroke-width="2"/><text x="685" y="380" font-size="24" font-weight="700">Filament lamp</text><line x1="545" y1="435" x2="635" y2="435" stroke="#20354D" stroke-width="4"/><circle cx="690" cy="435" r="48" fill="#fff" stroke="#20354D" stroke-width="4"/><path d="M660 405L720 465M720 405L660 465" stroke="#20354D" stroke-width="4"/><line x1="745" y1="435" x2="840" y2="435" stroke="#20354D" stroke-width="4"/></g>
<g><rect x="965" y="335" width="420" height="170" rx="14" fill="#fff" stroke="#C8D3D4" stroke-width="2"/><text x="1140" y="380" font-size="24" font-weight="700">Fixed resistor</text><line x1="1000" y1="435" x2="1080" y2="435" stroke="#20354D" stroke-width="4"/><rect x="1080" y="412" width="120" height="46" fill="#fff" stroke="#20354D" stroke-width="4"/><line x1="1200" y1="435" x2="1315" y2="435" stroke="#20354D" stroke-width="4"/><text x="1140" y="482" text-anchor="middle" font-size="17" fill="#52677C">rectangle symbol</text></g>
<g><rect x="55" y="525" width="420" height="170" rx="14" fill="#fff" stroke="#C8D3D4" stroke-width="2"/><text x="230" y="570" font-size="24" font-weight="700">Variable resistor</text><line x1="90" y1="625" x2="145" y2="625" stroke="#20354D" stroke-width="4"/><rect x="145" y="602" width="120" height="46" fill="#fff" stroke="#20354D" stroke-width="4"/><line x1="265" y1="625" x2="340" y2="625" stroke="#20354D" stroke-width="4"/><path d="M190 665L245 590" stroke="#B75E53" stroke-width="4" marker-end="url(#red)"/><text x="305" y="680" font-size="17" fill="#52677C">sloping arrow adjusts R</text></g>
<g><rect x="510" y="525" width="420" height="170" rx="14" fill="#fff" stroke="#C8D3D4" stroke-width="2"/><text x="685" y="570" font-size="24" font-weight="700">Diode</text><line x1="545" y1="625" x2="645" y2="625" stroke="#20354D" stroke-width="4"/><path d="M645 592L700 625L645 658Z" fill="#E8F2F3" stroke="#20354D" stroke-width="4"/><line x1="706" y1="590" x2="706" y2="660" stroke="#20354D" stroke-width="5"/><line x1="706" y1="625" x2="800" y2="625" stroke="#20354D" stroke-width="4"/><text x="810" y="632" font-size="17" fill="#52677C">one-way device</text></g>
<g><rect x="965" y="525" width="420" height="170" rx="14" fill="#fff" stroke="#C8D3D4" stroke-width="2"/><text x="1140" y="570" font-size="24" font-weight="700">LDR</text><line x1="1000" y1="625" x2="1050" y2="625" stroke="#20354D" stroke-width="4"/><circle cx="1120" cy="625" r="47" fill="#fff" stroke="#20354D" stroke-width="4"/><rect x="1090" y="610" width="60" height="30" fill="#fff" stroke="#20354D" stroke-width="4"/><line x1="1060" y1="585" x2="1085" y2="605" stroke="#C9A227" stroke-width="4" marker-end="url(#gold)"/><line x1="1070" y1="575" x2="1095" y2="595" stroke="#C9A227" stroke-width="4" marker-end="url(#gold)"/><line x1="1167" y1="625" x2="1315" y2="625" stroke="#20354D" stroke-width="4"/><text x="1140" y="680" text-anchor="middle" font-size="17" fill="#52677C">arrows point towards sensor</text></g>
<g><rect x="55" y="715" width="420" height="170" rx="14" fill="#fff" stroke="#C8D3D4" stroke-width="2"/><text x="230" y="760" font-size="24" font-weight="700">NTC thermistor</text><line x1="90" y1="815" x2="145" y2="815" stroke="#20354D" stroke-width="4"/><rect x="145" y="792" width="120" height="46" fill="#fff" stroke="#20354D" stroke-width="4"/><line x1="265" y1="815" x2="340" y2="815" stroke="#20354D" stroke-width="4"/><path d="M175 850L230 780" stroke="#B75E53" stroke-width="4"/><path d="M225 778L241 790L228 802" fill="none" stroke="#B75E53" stroke-width="4"/><text x="300" y="868" font-size="16" fill="#52677C">resistance falls as T rises</text></g>
<g><rect x="510" y="715" width="420" height="170" rx="14" fill="#fff" stroke="#C8D3D4" stroke-width="2"/><text x="685" y="760" font-size="24" font-weight="700">Ammeter</text><line x1="545" y1="815" x2="625" y2="815" stroke="#20354D" stroke-width="4"/><circle cx="685" cy="815" r="45" fill="#fff" stroke="#20354D" stroke-width="4"/><text x="685" y="825" text-anchor="middle" font-size="30" font-weight="700" fill="#0B1F3A">A</text><line x1="730" y1="815" x2="845" y2="815" stroke="#20354D" stroke-width="4"/><text x="685" y="870" text-anchor="middle" font-size="17" fill="#52677C">connect in series</text></g>
<g><rect x="965" y="715" width="420" height="170" rx="14" fill="#fff" stroke="#C8D3D4" stroke-width="2"/><text x="1140" y="760" font-size="24" font-weight="700">Voltmeter</text><line x1="1000" y1="815" x2="1080" y2="815" stroke="#20354D" stroke-width="4"/><circle cx="1140" cy="815" r="45" fill="#fff" stroke="#20354D" stroke-width="4"/><text x="1140" y="825" text-anchor="middle" font-size="30" font-weight="700" fill="#0B1F3A">V</text><line x1="1185" y1="815" x2="1315" y2="815" stroke="#20354D" stroke-width="4"/><text x="1140" y="870" text-anchor="middle" font-size="17" fill="#52677C">connect in parallel</text></g></g>
<line x1="65" y1="920" x2="1375" y2="920" stroke="#C9A227" stroke-width="3"/><text x="75" y="958" font-family="Arial,sans-serif" font-size="17" fill="#52677C">Symbols are schematic; draw circuit connections with straight lines and right-angle corners. • Marlbridge Physics</text><defs><marker id="red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#B75E53"/></marker><marker id="gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#C9A227"/></marker></defs><image x="1190" y="925" width="175" height="45" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/></svg>
