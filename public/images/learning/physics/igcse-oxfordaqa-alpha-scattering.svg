<polygon points="785,137 753.4,163.3 745.9,124.4" fill="#2F6B63"/>
<path d="M67 367 L330 362 Q470 355 560 300 L878 147" fill="none" stroke="#B9632F" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="902,136 878.1,169.5 861,133.8" fill="#B9632F"/>
<path d="M67 505 L440 509 Q470 512 440 521 L88 614" fill="none" stroke="#B9632F" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="62,621 91.6,592.6 101.9,630.8" fill="#B9632F"/>
<path d="M67 787 Q400 790 678 840" fill="none" stroke="#2F6B63" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="702,845 663.1,858.2 670,819.2" fill="#2F6B63"/>
<text x="67" y="185" font-size="25" font-weight="700" fill="#B9632F">Alpha particles</text>
<text x="67" y="425" font-size="25" font-weight="700" fill="#B9632F">A few are deflected</text>
