<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
  <title id="title">Investigating resistance: circuit and I–V curves</title>
  <desc id="desc">The left panel shows a cell, switch, ammeter and variable resistor in series with a test component, with a voltmeter connected in parallel across it. The right panel plots current vertically against potential difference horizontally for a fixed resistor, a filament lamp and a diode. The fixed resistor is a straight line through the origin; the lamp curve flattens as it heats; the diode has little reverse current and a steep forward rise after its threshold.</desc>
  <rect width="1200" height="720" fill="#fff"/>
  <text x="600" y="42" text-anchor="middle" font-size="28" font-weight="700" fill="#0b1f3a">Investigating resistance: circuit and I–V curves</text>
  <text x="42" y="88" font-size="21" font-weight="700" fill="#0b1f3a">1  Measure the component</text>
  <text x="650" y="88" font-size="21" font-weight="700" fill="#0b1f3a">2  Plot current against p.d.</text>
  <line x1="615" y1="70" x2="615" y2="650" stroke="#d6e0e6" stroke-width="2"/>
  <!-- Series circuit -->
  <g fill="none" stroke="#0b1f3a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M82 220 H130 M190 220 H250 M330 220 H390 M442 220 H520 V300 M520 360 V470 H82 V220"/>
    <path d="M250 220 l16 -25 20 50 20 -50 24 25"/>
    <path d="M390 220 a26 26 0 1 0 52 0 a26 26 0 1 0 -52 0"/>
    <path d="M520 300 H450 V303 M450 357 V360 H520"/>
    <path d="M500 300 H540 V360 H500 Z"/>
    <path d="M450 303 a27 27 0 1 0 0 54 a27 27 0 1 0 0 -54"/>
  </g>
  <rect x="500" y="300" width="40" height="60" fill="#fff" stroke="#0b1f3a" stroke-width="4"/>
  <!-- Cell -->
  <line x1="130" y1="199" x2="130" y2="241" stroke="#0b1f3a" stroke-width="4"/>
  <line x1="150" y1="207" x2="150" y2="233" stroke="#0b1f3a" stroke-width="3"/>
  <line x1="170" y1="199" x2="170" y2="241" stroke="#0b1f3a" stroke-width="4"/>
  <line x1="190" y1="207" x2="190" y2="233" stroke="#0b1f3a" stroke-width="3"/>
  <text x="160" y="277" text-anchor="middle" font-size="17" fill="#0b1f3a">cell / supply</text>
  <text x="290" y="165" text-anchor="middle" font-size="17" fill="#0b1f3a">variable resistor</text>
  <text x="416" y="226" text-anchor="middle" font-size="20" font-weight="700" fill="#0b1f3a">A</text>
  <text x="416" y="267" text-anchor="middle" font-size="16" fill="#0b1f3a">ammeter in series</text>
  <text x="550" y="325" font-size="16" fill="#0b1f3a">test</text>
  <text x="550" y="346" font-size="16" fill="#0b1f3a">component</text>
  <text x="450" y="338" text-anchor="middle" font-size="20" font-weight="700" fill="#0b1f3a">V</text>
  <text x="284" y="534" text-anchor="middle" font-size="16" fill="#31465a">Voltmeter across the test component</text>
  <text x="284" y="570" text-anchor="middle" font-size="16" fill="#31465a">Change current; record V and I.</text>
  <text x="284" y="600" text-anchor="middle" font-size="16" fill="#31465a">Keep a metal wire at constant temperature.</text>
  <!-- I-V axes -->
  <g fill="none" stroke="#0b1f3a" stroke-width="3" stroke-linecap="round">
    <path d="M920 560 V150 M730 355 H1135"/>
    <path d="M1125 347 l10 8 -10 8 M912 160 l8 -10 8 10"/>
  </g>
  <text x="1140" y="363" font-size="18" fill="#0b1f3a">V</text>
  <text x="907" y="142" font-size="18" fill="#0b1f3a">I</text>
  <text x="735" y="590" font-size="14" fill="#637783">−V</text>
  <text x="1110" y="590" font-size="14" fill="#637783">+V</text>
  <text x="885" y="174" font-size="14" fill="#637783">+I</text>
  <text x="885" y="553" font-size="14" fill="#637783">−I</text>
  <!-- fixed resistor -->
  <path d="M790 468 L1090 207" fill="none" stroke="#147d64" stroke-width="5"/>
  <text x="1002" y="213" font-size="16" font-weight="700" fill="#147d64">fixed resistor / wire</text>
  <!-- filament lamp symmetric flattening -->
  <path d="M790 470 C850 440 890 385 920 355 C950 325 990 270 1090 240" fill="none" stroke="#dc7a19" stroke-width="5"/>
  <text x="1017" y="267" font-size="16" font-weight="700" fill="#b75d08">filament lamp</text>
  <!-- diode: subdued reverse and sharp forward -->
  <path d="M790 360 C850 360 895 358 920 355 C975 355 1005 355 1025 345 C1040 337 1042 300 1052 250 C1060 210 1075 180 1090 160" fill="none" stroke="#6750a4" stroke-width="5"/>
  <text x="968" y="415" font-size="16" font-weight="700" fill="#6750a4">diode</text>
  <text x="920" y="620" text-anchor="middle" font-size="15" fill="#31465a">A steeper straight-line gradient means a smaller R; a curve means R changes.</text>
  <text x="600" y="674" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2" fill="#0b1f3a">MARLBRIDGE STUDY RESOURCES</text>
  <text x="600" y="698" text-anchor="middle" font-size="13" fill="#637783">Schematic, not to scale. NTC thermistors and LDRs are tested while controlling temperature or light. • Marlbridge Physics</text>
</svg>
