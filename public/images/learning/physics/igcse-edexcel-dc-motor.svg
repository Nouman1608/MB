<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1278" viewBox="0 0 1000 1420" role="img" aria-labelledby="title desc"><title id="title">How the d.c. motor keeps turning (Edexcel International GCSE Physics)</title><desc id="desc">Three end views of a coil between N and S poles, with the field from N to S, a split-ring commutator and two brushes. 1: current flows towards you on the left side of the coil and away on the right; the force is up on one side and down on the other, so the coil turns clockwise. 2: the coil is vertical, the gaps in the split ring are at the brushes and no current flows for an instant. 3: the halves of the split ring have swapped brushes, the current in the coil has reversed, and the forces still turn the coil clockwise. No tier labels: the motor effect in simple d.c. motors and the left-hand rule are on both 4PH1 papers (6.12, 6.13).</desc><rect width="1000" height="1420" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="500" y="62" font-size="36" font-weight="700" fill="#1E2B47" text-anchor="middle">How the d.c. motor keeps turning</text>
<text x="500" y="106" font-size="23" fill="#4B5B72" text-anchor="middle">End view of the coil in the magnetic field</text>
