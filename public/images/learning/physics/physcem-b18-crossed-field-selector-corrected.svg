<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Crossed-field velocity selector</title><desc id="dsc">A positive ion travels right between positive and negative plates while B points into the page. E and magnetic forces oppose; negative ions reverse both. At v=E/B either sign passes straight. For positive ions slower/faster particles deflect down/up; for negative ions the directions reverse.</desc><defs>
<marker id="arrN" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#0B1F3A"/></marker>
<marker id="arrB" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#3C7EA7"/></marker>
<marker id="arrT" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#108B88"/></marker>
<marker id="arrG" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#D8A927"/></marker>
<marker id="arrR" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#C85C5C"/></marker>
</defs>
<rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial, Liberation Sans, sans-serif">
<text x="60" y="70" fill="#0B1F3A" font-size="38" font-weight="700" text-anchor="start" >Crossed-field velocity selector</text><text x="62" y="112" fill="#637783" font-size="20" font-weight="500" text-anchor="start" >Electric and magnetic forces oppose; only a selected speed has zero net deflection.</text>
<rect x="55" y="145" width="1490" height="780" rx="22" fill="#FFFFFF" stroke="#CBD7D9" stroke-width="2" /><rect x="78" y="188" width="710" height="664" rx="16" fill="#FFFFFF" stroke="#CAD8DC" stroke-width="2" /><text x="102" y="228" fill="#108B88" font-size="24" font-weight="700" text-anchor="start" >Field geometry and force directions</text><rect x="812" y="188" width="710" height="664" rx="16" fill="#FFFFFF" stroke="#CAD8DC" stroke-width="2" /><text x="836" y="228" fill="#108B88" font-size="24" font-weight="700" text-anchor="start" >Which particles pass straight through?</text><rect x="140" y="290" width="590" height="300" rx="4" fill="#F8FBFB" stroke="#0B1F3A" stroke-width="3" /><rect x="160" y="305" width="550" height="48" rx="6" fill="#C85C5C" stroke="#C85C5C" stroke-width="1" /><rect x="160" y="528" width="550" height="48" rx="6" fill="#3C7EA7" stroke="#3C7EA7" stroke-width="1" /><text x="435" y="337" fill="#FFFFFF" font-size="18" font-weight="700" text-anchor="middle" >+ plate</text><text x="435" y="563" fill="#FFFFFF" font-size="18" font-weight="700" text-anchor="middle" >− plate</text><line x1="270" y1="420" x2="610" y2="420" stroke="#108B88" stroke-width="5" marker-end="url(#arrT)" /><text x="590" y="396" fill="#108B88" font-size="18" font-weight="700" text-anchor="middle" >v →</text><circle cx="418" cy="420" r="26" fill="#FFF2CF" stroke="#D8A927" stroke-width="3" /><text x="418" y="428" fill="#0B1F3A" font-size="17" font-weight="700" text-anchor="middle" >+q</text><line x1="418" y1="397" x2="418" y2="363" stroke="#C85C5C" stroke-width="4" marker-end="url(#arrR)" /><text x="445" y="368" fill="#C85C5C" font-size="16" font-weight="700" text-anchor="start" >Fₑ = qE down</text><line x1="455" y1="443" x2="455" y2="482" stroke="#3C7EA7" stroke-width="4" marker-end="url(#arrB)" /><text x="477" y="477" fill="#3C7EA7" font-size="16" font-weight="700" text-anchor="start" >Fᵦ = qvB up</text><text x="430" y="625" fill="#0B1F3A" font-size="17" font-weight="600" text-anchor="middle" >E points down; B points into the page (×)</text><text x="430" y="659" fill="#0B1F3A" font-size="17" font-weight="600" text-anchor="middle" >For a positive ion, qE is down and q(v × B) is up.</text><circle cx="230" cy="380" r="13" fill="#FFFFFF" stroke="#3C7EA7" stroke-width="2" /><line x1="224" y1="374" x2="236" y2="386" stroke="#3C7EA7" stroke-width="2" /><line x1="224" y1="386" x2="236" y2="374" stroke="#3C7EA7" stroke-width="2" /><circle cx="280" cy="480" r="13" fill="#FFFFFF" stroke="#3C7EA7" stroke-width="2" /><line x1="274" y1="474" x2="286" y2="486" stroke="#3C7EA7" stroke-width="2" /><line x1="274" y1="486" x2="286" y2="474" stroke="#3C7EA7" stroke-width="2" /><circle cx="640" cy="380" r="13" fill="#FFFFFF" stroke="#3C7EA7" stroke-width="2" /><line x1="634" y1="374" x2="646" y2="386" stroke="#3C7EA7" stroke-width="2" /><line x1="634" y1="386" x2="646" y2="374" stroke="#3C7EA7" stroke-width="2" /><circle cx="640" cy="480" r="13" fill="#FFFFFF" stroke="#3C7EA7" stroke-width="2" /><line x1="634" y1="474" x2="646" y2="486" stroke="#3C7EA7" stroke-width="2" /><line x1="634" y1="486" x2="646" y2="474" stroke="#3C7EA7" stroke-width="2" /><text x="430" y="720" fill="#637783" font-size="16" font-weight="600" text-anchor="middle" >For a negative ion, both forces reverse.</text><text x="430" y="750" fill="#637783" font-size="16" font-weight="600" text-anchor="middle" >They still oppose one another at the same selected speed.</text><text x="1165" y="260" fill="#108B88" font-size="25" font-weight="700" text-anchor="middle" >At v = E/B</text><text x="1165" y="295" fill="#0B1F3A" font-size="18" font-weight="600" text-anchor="middle" >qE = qvB; net vertical force = 0</text><rect x="875" y="330" width="580" height="145" rx="12" fill="#F2F8F7" stroke="#BCD4D6" stroke-width="2" /><circle cx="1000" cy="402" r="24" fill="#FFF2CF" stroke="#D8A927" stroke-width="3" /><text x="1000" y="410" fill="#0B1F3A" font-size="22" font-weight="700" text-anchor="middle" >+</text><line x1="1038" y1="402" x2="1150" y2="402" stroke="#108B88" stroke-width="4" marker-end="url(#arrT)" /><text x="1245" y="390" fill="#108B88" font-size="17" font-weight="700" text-anchor="middle" >straight through</text><text x="1245" y="423" fill="#0B1F3A" font-size="15" font-weight="600" text-anchor="middle" >positive: down + up = 0</text><rect x="875" y="495" width="580" height="145" rx="12" fill="#F9F5F3" stroke="#E1C5B8" stroke-width="2" /><circle cx="1000" cy="566" r="24" fill="#EAF3F8" stroke="#3C7EA7" stroke-width="3" /><text x="1000" y="574" fill="#0B1F3A" font-size="22" font-weight="700" text-anchor="middle" >−</text><line x1="1038" y1="566" x2="1150" y2="566" stroke="#108B88" stroke-width="4" marker-end="url(#arrT)" /><text x="1245" y="554" fill="#108B88" font-size="17" font-weight="700" text-anchor="middle" >straight through</text><text x="1245" y="587" fill="#0B1F3A" font-size="15" font-weight="600" text-anchor="middle" >negative: up + down = 0</text><rect x="875" y="672" width="580" height="126" rx="12" fill="#FFF5DA" stroke="#E5C971" stroke-width="2" /><text x="1165" y="707" fill="#D8A927" font-size="18" font-weight="700" text-anchor="middle" >Worked example</text><text x="1165" y="739" fill="#0B1F3A" font-size="15" font-weight="600" text-anchor="middle" >E = 600 V / 0.020 m = 3.0 × 10⁴ V m⁻¹</text><text x="1165" y="770" fill="#0B1F3A" font-size="15" font-weight="600" text-anchor="middle" >B = 0.15 T  ⇒  v = E/B = 2.0 × 10⁵ m s⁻¹</text><text x="430" y="795" fill="#0B1F3A" font-size="16" font-weight="600" text-anchor="middle" >Positive ions: v &lt; E/B deflects down; v &gt; E/B deflects up.</text><text x="430" y="822" fill="#0B1F3A" font-size="16" font-weight="600" text-anchor="middle" >Negative ions reverse both off-speed directions.</text>
<text x="800" y="938" fill="#A9BABC" font-size="26" font-weight="700" text-anchor="middle" opacity="0.24" letter-spacing="2">MARLBRIDGE STUDY RESOURCES</text>
<line x1="55" y1="960" x2="1545" y2="960" stroke="#D8A927" stroke-width="2"/>
<text x="64" y="997" fill="#637783" font-size="14" font-weight="500" text-anchor="start" >Marlbridge • AP Physics study resource • Schematic; assumptions are stated in labels</text>
<image x="1260" y="968" width="285" height="47" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
</g></svg>