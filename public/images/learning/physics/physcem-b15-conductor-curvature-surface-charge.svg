<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
<title id="title">Conductor surface charge: curvature and field strength</title><desc id="desc">A single conductor remains equipotential; the sharper region has greater surface charge density and stronger field just outside. Schematic, not to scale.</desc><defs>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#20354D"/></marker>
      <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#357EA2"/></marker>
      <marker id="arrGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#C9A227"/></marker>
    </defs>
<rect width="1600" height="1050" fill="#F4F7F7"/><text x="54" y="58" font-family="Arial,sans-serif" font-size="34" fill="#0B1F3A" font-weight="700" text-anchor="start" >Conductor surface charge: curvature and field strength</text><text x="56" y="96" font-family="Arial,sans-serif" font-size="18" fill="#52677C" font-weight="400" text-anchor="start" >Marlbridge • AP Physics C: Electricity and Magnetism • teaching diagram</text>
<rect x="55" y="135" width="1490" height="760" rx="16" fill="white" stroke="#C8D3D4" stroke-width="2"/><text x="100" y="185" font-family="Arial,sans-serif" font-size="27" fill="#0B1F3A" font-weight="700" text-anchor="start" >Positive conductor example: every point shares one equipotential V</text><text x="100" y="235" font-family="Arial,sans-serif" font-size="22" fill="#20354D" font-weight="400" text-anchor="start" >At the same V, a smaller local radius of curvature requires larger surface charge density σ.</text><path d="M190 570 C235 395 365 315 515 345 C655 372 735 475 810 530 C885 585 960 585 1030 520 C1090 465 1135 380 1190 310 C1228 260 1270 245 1310 278 C1340 304 1320 346 1288 380 C1220 455 1218 535 1270 590 C1320 645 1375 680 1430 695 Z" stroke="#0B1F3A" stroke-width="5" fill="#E7EFF2"  /><text x="410" y="635" font-family="Arial,sans-serif" font-size="20" fill="#357EA2" font-weight="700" text-anchor="middle" >gently curved region</text><text x="1245" y="665" font-family="Arial,sans-serif" font-size="20" fill="#B75E53" font-weight="700" text-anchor="middle" >sharper tip</text><text x="795" y="760" font-family="Arial,sans-serif" font-size="22" fill="#0B1F3A" font-weight="700" text-anchor="middle" >same conductor → same potential V</text><text x="410" y="680" font-family="Arial,sans-serif" font-size="18" fill="#52677C" font-weight="400" text-anchor="middle" >lower σ • weaker E just outside</text><text x="1245" y="710" font-family="Arial,sans-serif" font-size="18" fill="#B75E53" font-weight="700" text-anchor="middle" >higher σ • stronger E just outside</text><path d="M295 430 C275 390 265 330 250 260" stroke="#357EA2" stroke-width="3" fill="none"  marker-end="url(#arrBlue)"/><path d="M430 380 C405 365 380 335 365 255" stroke="#357EA2" stroke-width="3" fill="none"  marker-end="url(#arrBlue)"/><path d="M535 345 C525 323 520 305 515 250" stroke="#357EA2" stroke-width="3" fill="none"  marker-end="url(#arrBlue)"/><path d="M1190 310 C1170 275 1130 255 1080 240" stroke="#B75E53" stroke-width="4" fill="none"  marker-end="url(#arr)"/><path d="M1228 263 C1218 245 1210 225 1195 185" stroke="#B75E53" stroke-width="4" fill="none"  marker-end="url(#arr)"/><path d="M1310 278 C1315 250 1318 225 1325 190" stroke="#B75E53" stroke-width="4" fill="none"  marker-end="url(#arr)"/><path d="M1334 324 C1355 300 1390 280 1445 260" stroke="#B75E53" stroke-width="4" fill="none"  marker-end="url(#arr)"/><rect x="105" y="805" width="1390" height="55" rx="12" fill="#FFF7DF" stroke="#E1C568" stroke-width="2"/><text x="130" y="841" font-family="Arial,sans-serif" font-size="18" fill="#0B1F3A" font-weight="600" text-anchor="start" >Schematic, not to scale • Curvature concentrates surface charge; it does not make the conductor a different potential.</text><line x1="55" y1="958" x2="1545" y2="958" stroke="#C9A227" stroke-width="3"/>
