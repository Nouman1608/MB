<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1192" viewBox="0 0 1000 1324.44" role="img" aria-labelledby="title desc"><title id="title">Current–voltage graphs</title><desc id="desc">Three graphs of current I against voltage V. Fixed resistor: a straight line through the origin from −6 V, −0.3 A to 6 V, 0.3 A, so R stays constant. Filament lamp: an S-shaped curve through the origin that gets less steep at higher voltages, because the hot filament has a higher resistance. Diode: no current in reverse; forward current, in mA, rises steeply after about 0.6 V. No tier labels: Edexcel 4PH1 2.9 (both papers) and OxfordAQA 9203 3.5.1i, m, n (untiered).</desc><rect width="1000" height="1324.44" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="500" y="62" font-size="36" font-weight="700" fill="#1E2B47" text-anchor="middle">Current–voltage graphs</text>
