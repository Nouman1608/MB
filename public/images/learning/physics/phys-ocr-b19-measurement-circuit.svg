</defs><title id="title">Circuit for measuring a component</title><desc id="desc">A single loop includes a cell, ammeter and lamp. A voltmeter bridges both terminals of the lamp in parallel; text notes variable resistor for repeated readings.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial, Liberation Sans, sans-serif"><text x="58" y="74" fill="#0B1F3A" font-size="38" font-weight="700" text-anchor="start">Circuit for measuring a component</text><text x="60" y="116" fill="#637783" font-size="20" font-weight="500" text-anchor="start">Place the ammeter in series and the voltmeter across the component.</text><rect x="55" y="145" width="1490" height="780" rx="18" fill="#FFFFFF" stroke="#CBD7D9" stroke-width="2"/><rect x="95" y="205" width="1410" height="640" rx="18" fill="#FFFFFF" stroke="#CBD7D9" stroke-width="2"/><text x="800" y="255" fill="#108B88" font-size="25" font-weight="700" text-anchor="middle">Measure current through and potential difference across a lamp</text><path d="M 350 410 L 350 340 L 1160 340 L 1160 410 M 660 340 L 660 470 M 350 610 L 350 690 L 1160 690 L 1160 610" fill="none" stroke="#0B1F3A" stroke-width="4"/><line x1="350" y1="410" x2="350" y2="475" stroke="#0B1F3A" stroke-width="4"/><circle cx="350" cy="535" r="38" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="3"/><text x="350" y="544" fill="#0B1F3A" font-size="25" font-weight="700" text-anchor="middle">A</text><line x1="350" y1="573" x2="350" y2="610" stroke="#0B1F3A" stroke-width="4"/><rect x="615" y="460" width="90" height="150" rx="8" fill="#FFF2CF" stroke="#D8A927" stroke-width="3"/><path d="M635 500 Q660 470 685 500 M635 535 Q660 505 685 535 M635 570 Q660 540 685 570" fill="none" stroke="#D8A927" stroke-width="3"/><text x="660" y="645" fill="#0B1F3A" font-size="17" font-weight="600" text-anchor="middle">lamp</text><circle cx="1160" cy="535" r="38" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="3"/><text x="1160" y="544" fill="#0B1F3A" font-size="17" font-weight="700" text-anchor="middle">cell</text><line x1="1160" y1="410" x2="1160" y2="497" stroke="#0B1F3A" stroke-width="4"/><line x1="1160" y1="573" x2="1160" y2="610" stroke="#0B1F3A" stroke-width="4"/><line x1="1135" y1="515" x2="1185" y2="515" stroke="#C85C5C" stroke-width="5"/><line x1="1145" y1="555" x2="1175" y2="555" stroke="#0B1F3A" stroke-width="3"/><path d="M 660 340 L 850 340 L 850 450 M 660 610 L 850 610 L 850 575" fill="none" stroke="#3C7EA7" stroke-width="4"/><circle cx="850" cy="515" r="38" fill="#EDF7F6" stroke="#108B88" stroke-width="3"/><text x="850" y="524" fill="#108B88" font-size="25" font-weight="700" text-anchor="middle">V</text><text x="420" y="735" fill="#0B1F3A" font-size="20" font-weight="700" text-anchor="middle">Ammeter is in series</text><text x="880" y="735" fill="#0B1F3A" font-size="20" font-weight="700" text-anchor="middle">Voltmeter is in parallel across the lamp</text><text x="800" y="790" fill="#637783" font-size="17" font-weight="500" text-anchor="middle">Use a variable resistor to take a range of current and voltage readings.</text><text x="800" y="942" fill="#A9BABC" font-size="26" font-weight="700" text-anchor="middle" opacity="0.24" letter-spacing="2">MARLBRIDGE STUDY RESOURCES</text><line x1="55" y1="960" x2="1545" y2="960" stroke="#D8A927" stroke-width="2"/><text x="64" y="997" fill="#637783" font-size="14" font-weight="500" text-anchor="start">Marlbridge • Physics study resource • Schematic; labels state key assumptions</text><image x="1260" y="968" width="285" height="47" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/></g></svg>