<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="t d">
<title id="t">Polarization in conductors and insulators</title><desc id="d">A positive rod causes mobile electrons to redistribute across a neutral conductor, while in an insulator bound charge centres shift or molecular dipoles align. Both remain neutral overall.</desc>
<rect width="1440" height="820" fill="#F4F7F7"/><text x="70" y="70" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#0B1F3A">Two ways a neutral object polarizes</text><text x="72" y="110" font-family="Arial,sans-serif" font-size="19" fill="#52677C">An external field separates charge without changing the object's net charge</text>
<rect x="45" y="145" width="650" height="570" rx="20" fill="#fff" stroke="#C8D3D4" stroke-width="3"/><rect x="745" y="145" width="650" height="570" rx="20" fill="#fff" stroke="#C8D3D4" stroke-width="3"/>
<text x="370" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0B1F3A">Conductor: free electrons move</text><text x="1070" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0B1F3A">Insulator: bound charges shift</text>
<rect x="90" y="300" width="105" height="260" rx="18" fill="#B75E53"/><text x="142" y="430" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="white">+ + +</text><text x="142" y="590" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#52677C">positive rod</text>
<rect x="245" y="290" width="390" height="280" rx="100" fill="#E8F2F3" stroke="#3F8582" stroke-width="4"/><text x="258" y="330" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#357EA2">− − − −</text><text x="535" y="330" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#B75E53">+ + + +</text><path d="M515 430H315" stroke="#357EA2" stroke-width="5" marker-end="url(#arr)"/><text x="415" y="410" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#52677C">electrons redistribute</text><text x="440" y="625" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#0B1F3A">Mobile electrons gather on the near side;</text><text x="440" y="655" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#0B1F3A">the far side has an electron deficit.</text>
<rect x="790" y="300" width="105" height="260" rx="18" fill="#B75E53"/><text x="842" y="430" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="white">+ + +</text><text x="842" y="590" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#52677C">positive rod</text>
<rect x="945" y="290" width="390" height="280" rx="100" fill="#F8F3E5" stroke="#C9A227" stroke-width="4"/>
<g font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle"><g transform="translate(1015 370)"><circle r="27" fill="#fff" stroke="#AFC8C8"/><text x="-8" y="7" fill="#357EA2">−</text><text x="10" y="7" fill="#B75E53">+</text></g><g transform="translate(1115 370)"><circle r="27" fill="#fff" stroke="#AFC8C8"/><text x="-8" y="7" fill="#357EA2">−</text><text x="10" y="7" fill="#B75E53">+</text></g><g transform="translate(1215 370)"><circle r="27" fill="#fff" stroke="#AFC8C8"/><text x="-8" y="7" fill="#357EA2">−</text><text x="10" y="7" fill="#B75E53">+</text></g><g transform="translate(1015 480)"><circle r="27" fill="#fff" stroke="#AFC8C8"/><text x="-8" y="7" fill="#357EA2">−</text><text x="10" y="7" fill="#B75E53">+</text></g><g transform="translate(1115 480)"><circle r="27" fill="#fff" stroke="#AFC8C8"/><text x="-8" y="7" fill="#357EA2">−</text><text x="10" y="7" fill="#B75E53">+</text></g><g transform="translate(1215 480)"><circle r="27" fill="#fff" stroke="#AFC8C8"/><text x="-8" y="7" fill="#357EA2">−</text><text x="10" y="7" fill="#B75E53">+</text></g></g>
<text x="1140" y="625" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#0B1F3A">Bound charge centres shift or polar molecules turn;</text><text x="1140" y="655" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#0B1F3A">charge does not flow freely through the material.</text>
<rect x="65" y="730" width="1310" height="2" fill="#C9A227"/><text x="75" y="772" font-family="Arial,sans-serif" font-size="18" fill="#52677C">Both objects remain neutral overall; polarization changes charge distribution. • Marlbridge Physics</text>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#357EA2"/></marker></defs><image href="data:image/svg+xml;base64," x="1190" y="748" width="175" height="48" preserveAspectRatio="xMidYMid meet"/></svg>
