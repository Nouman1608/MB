<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><defs><marker id="aN" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#0B1F3A"/></marker><marker id="aT" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#108B88"/></marker></defs><title id="title">Connecting conductors moves charge to the outside</title><desc id="desc">A positively charged inner conducting sphere inside an initially neutral hollow conductor is connected to the shell by a wire. Initially the shell has induced negative charge on its inner wall and matching positive charge on its outside. After connection, charge redistributes so the inner sphere and cavity wall carry zero net charge and the total positive charge resides on the shell’s outside.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial, Liberation Sans, sans-serif"><text x="58" y="74" fill="#0B1F3A" font-size="37" font-weight="700">Connecting conductors moves charge to the outside</text><text x="60" y="116" fill="#637783" font-size="20">A wire joins the inner sphere to the hollow conductor; the whole connected object reaches one potential.</text><rect x="55" y="150" width="1490" height="750" rx="18" fill="#FFFFFF" stroke="#CBD7D9" stroke-width="2"/>
<rect x="82" y="195" width="690" height="620" rx="16" fill="#F7FAFA" stroke="#CBD7D9" stroke-width="2"/><rect x="827" y="195" width="690" height="620" rx="16" fill="#F7FAFA" stroke="#CBD7D9" stroke-width="2"/><text x="427" y="236" text-anchor="middle" fill="#0B1F3A" font-size="22" font-weight="700">Before connection</text><text x="1172" y="236" text-anchor="middle" fill="#108B88" font-size="22" font-weight="700">After equilibrium</text>
<!-- Before: neutral isolated shell polarised by +q inner sphere -->
<circle cx="425" cy="505" r="185" fill="#E7EEF1" stroke="#0B1F3A" stroke-width="7"/><circle cx="425" cy="505" r="138" fill="#F7FAFA" stroke="#718B92" stroke-width="3" stroke-dasharray="6 6"/><circle cx="425" cy="505" r="50" fill="#FFF5DB" stroke="#C9A227" stroke-width="4"/><text x="425" y="511" text-anchor="middle" fill="#0B1F3A" font-size="22" font-weight="700">inner</text>
<g fill="#C85C5C" font-size="23" font-weight="700" text-anchor="middle"><text x="425" y="448">+</text><text x="425" y="568">+</text><text x="366" y="512">+</text><text x="484" y="512">+</text></g>
<g fill="#3C7EA7" font-size="20" font-weight="700" text-anchor="middle"><text x="425" y="365">−</text><text x="425" y="645">−</text><text x="285" y="511">−</text><text x="565" y="511">−</text></g>
<g fill="#C85C5C" font-size="20" font-weight="700" text-anchor="middle"><text x="425" y="300">+</text><text x="425" y="721">+</text><text x="216" y="510">+</text><text x="634" y="510">+</text></g>
<text x="425" y="761" text-anchor="middle" fill="#637783" font-size="16">inner sphere: +q  •  neutral shell: induced −q inside, +q outside</text>
<!-- After: conducting wire joins inner sphere and shell; all +q ends outside -->
<circle cx="1170" cy="505" r="185" fill="#E7EEF1" stroke="#0B1F3A" stroke-width="7"/><circle cx="1170" cy="505" r="138" fill="#F7FAFA" stroke="#718B92" stroke-width="3" stroke-dasharray="6 6"/><circle cx="1170" cy="505" r="50" fill="#FFFFFF" stroke="#718B92" stroke-width="3"/><path d="M1170 505 L1307 505" fill="none" stroke="#0B1F3A" stroke-width="16" stroke-linecap="round"/><circle cx="1307" cy="505" r="11" fill="#0B1F3A"/>
<g fill="#C85C5C" font-size="20" font-weight="700" text-anchor="middle"><text x="1170" y="300">+</text><text x="1170" y="721">+</text><text x="961" y="510">+</text><text x="1379" y="510">+</text><text x="1033" y="363">+</text><text x="1307" y="363">+</text><text x="1033" y="655">+</text><text x="1307" y="655">+</text></g>
<text x="1170" y="761" text-anchor="middle" fill="#637783" font-size="16">inner sphere and cavity wall: zero net charge  •  outside: total +q</text>
<rect x="123" y="829" width="1354" height="42" rx="10" fill="#EAF4F3" stroke="#9CCAC5" stroke-width="2"/><text x="800" y="856" text-anchor="middle" fill="#0B1F3A" font-size="17" font-weight="700">Connected conductors share one potential; after equilibrium the cavity field is zero and net charge lies on the exterior.</text>
<text x="800" y="942" fill="#A9BABC" font-size="26" font-weight="700" text-anchor="middle" opacity=".24" letter-spacing="2">MARLBRIDGE STUDY RESOURCES</text><line x1="55" y1="964" x2="1545" y2="964" stroke="#C9A227" stroke-width="2"/><text x="58" y="1000" fill="#0B1F3A" font-size="17" font-weight="700">MARLBRIDGE  •  STUDY RESOURCE</text><image x="1260" y="968" width="285" height="70" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/></g></svg>
