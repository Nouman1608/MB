<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">Charging capacitor: equal-boundary Ampèrian surfaces</title><desc id="desc">A flat surface through the lead wire and a bulging surface between capacitor plates share the same circular boundary. Conduction current through one is matched by changing electric flux and displacement current through the other; the magnetic circulation is consistent.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#20354D"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#357EA2"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B75E53"/></marker></defs><rect width="1600" height="1050" fill="#F4F7F7"/><text x="55" y="58" font-family="Arial,sans-serif" font-size="34" fill="#0B1F3A" font-weight="700" text-anchor="start">Charging capacitor: equal-boundary Ampèrian surfaces</text><text x="57" y="96" font-family="Arial,sans-serif" font-size="18" fill="#52677C" font-weight="400" text-anchor="start">Marlbridge • AP Physics teaching diagram</text><rect x="60" y="135" width="1480" height="760" rx="16" fill="white" stroke="#C8D3D4" stroke-width="2"/><text x="800" y="205" font-family="Arial,sans-serif" font-size="20" fill="#0B1F3A" font-weight="700" text-anchor="middle">Choose either spanning surface with the same circular Ampèrian boundary C</text><rect x="100" y="245" width="655" height="520" rx="16" fill="#FFF7DF" stroke="#C9A227" stroke-width="2"/><text x="427" y="285" font-family="Arial,sans-serif" font-size="19" fill="#0B1F3A" font-weight="700" text-anchor="middle">A • flat disc cuts the lead wire</text><ellipse cx="427" cy="500" rx="190" ry="115" fill="#F8F3E4" stroke="#357EA2" stroke-width="4"/><line x1="427" y1="560" x2="427" y2="390" stroke="#B75E53" stroke-width="5"  marker-end="url(#a)"/><text x="452" y="405" font-family="Arial,sans-serif" font-size="17" fill="#B75E53" font-weight="700" text-anchor="start">conduction current I</text><text x="427" y="690" font-family="Arial,sans-serif" font-size="18" fill="#0B1F3A" font-weight="600" text-anchor="middle">current pierces surface A</text><rect x="845" y="245" width="655" height="520" rx="16" fill="#EAF2F5" stroke="#3F8582" stroke-width="2"/><text x="1172" y="285" font-family="Arial,sans-serif" font-size="18" fill="#0B1F3A" font-weight="700" text-anchor="middle">B • bulging surface passes through capacitor gap</text><line x1="980" y1="395" x2="1365" y2="395" stroke="#0B1F3A" stroke-width="7"  /><line x1="980" y1="620" x2="1365" y2="620" stroke="#0B1F3A" stroke-width="7"  /><text x="1020" y="385" font-family="Arial,sans-serif" font-size="18" fill="#B75E53" font-weight="700" text-anchor="middle">+</text><text x="1080" y="385" font-family="Arial,sans-serif" font-size="18" fill="#B75E53" font-weight="700" text-anchor="middle">+</text><text x="1140" y="385" font-family="Arial,sans-serif" font-size="18" fill="#B75E53" font-weight="700" text-anchor="middle">+</text><text x="1200" y="385" font-family="Arial,sans-serif" font-size="18" fill="#B75E53" font-weight="700" text-anchor="middle">+</text><text x="1260" y="385" font-family="Arial,sans-serif" font-size="18" fill="#B75E53" font-weight="700" text-anchor="middle">+</text><text x="1320" y="385" font-family="Arial,sans-serif" font-size="18" fill="#B75E53" font-weight="700" text-anchor="middle">+</text><text x="1020" y="655" font-family="Arial,sans-serif" font-size="18" fill="#357EA2" font-weight="700" text-anchor="middle">−</text><text x="1080" y="655" font-family="Arial,sans-serif" font-size="18" fill="#357EA2" font-weight="700" text-anchor="middle">−</text><text x="1140" y="655" font-family="Arial,sans-serif" font-size="18" fill="#357EA2" font-weight="700" text-anchor="middle">−</text><text x="1200" y="655" font-family="Arial,sans-serif" font-size="18" fill="#357EA2" font-weight="700" text-anchor="middle">−</text><text x="1260" y="655" font-family="Arial,sans-serif" font-size="18" fill="#357EA2" font-weight="700" text-anchor="middle">−</text><text x="1320" y="655" font-family="Arial,sans-serif" font-size="18" fill="#357EA2" font-weight="700" text-anchor="middle">−</text><line x1="1050" y1="420" x2="1050" y2="575" stroke="#3F8582" stroke-width="3"  marker-end="url(#a)"/><line x1="1130" y1="420" x2="1130" y2="575" stroke="#3F8582" stroke-width="3"  marker-end="url(#a)"/><line x1="1210" y1="420" x2="1210" y2="575" stroke="#3F8582" stroke-width="3"  marker-end="url(#a)"/><line x1="1290" y1="420" x2="1290" y2="575" stroke="#3F8582" stroke-width="3"  marker-end="url(#a)"/><text x="1172" y="445" font-family="Arial,sans-serif" font-size="16" fill="#3F8582" font-weight="700" text-anchor="middle">changing electric flux ΦE</text><path d="M950 505 Q1170 535 1395 505" fill="none" stroke="#C9A227" stroke-width="4" /><text x="1172" y="580" font-family="Arial,sans-serif" font-size="17" fill="#52677C" font-weight="600" text-anchor="middle">no charge crosses the gap</text><text x="427" y="735" font-family="Arial,sans-serif" font-size="21" fill="#0B1F3A" font-weight="700" text-anchor="middle">μ₀I</text><text x="1172" y="735" font-family="Arial,sans-serif" font-size="20" fill="#0B1F3A" font-weight="700" text-anchor="middle">μ₀ε₀ dΦE/dt = μ₀I</text><text x="800" y="825" font-family="Arial,sans-serif" font-size="20" fill="#3F8582" font-weight="700" text-anchor="middle">The displacement-current term makes the two surface choices consistent.</text><text x="800" y="870" font-family="Arial,sans-serif" font-size="18" fill="#B75E53" font-weight="700" text-anchor="middle">The magnetic field still circles the gap; it is not absent between the plates.</text><text x="800" y="914" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#0B1F3A" opacity=".09">MARLBRIDGE • STUDY RESOURCES</text><line x1="55" y1="958" x2="1545" y2="958" stroke="#C9A227" stroke-width="3"/><text x="58" y="991" font-family="Arial,sans-serif" font-size="16" fill="#52677C" font-weight="400" text-anchor="start">Marlbridge Physics study resource • Diagram schematic; assumptions stated in labels</text><image x="1260" y="968" width="285" height="47" href="data:image/svg+xml;base64,"/><text x="800" y="1020" font-family="Arial,sans-serif" font-size="13" fill="#738394" font-weight="400" text-anchor="middle">ebbb36299580869bb886</text></svg>