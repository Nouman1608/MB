<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><defs><marker id="n" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#0B1F3A"/></marker><marker id="b" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#3C7EA7"/></marker><marker id="t" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#108B88"/></marker><marker id="r" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#C85C5C"/></marker></defs><title id="title">Rolling right: signed rotation is clockwise</title><desc id="desc">A wheel rolls right without slipping. With positive x to the right and positive angular displacement counterclockwise, the centre moves right with positive v_cm while the wheel rotates clockwise with negative omega. At the ground contact point, translation v_cm right cancels rotational velocity R omega left, giving v_cm + R omega = 0 and v_cm = −R omega; in magnitudes, |v_cm| = R|omega|.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial, Liberation Sans, sans-serif"><text x="58" y="74" fill="#0B1F3A" font-size="37" font-weight="700">Rolling right: signed rotation is clockwise</text><text x="60" y="116" fill="#637783" font-size="20">For a wheel rolling right, positive x and positive counterclockwise make ω negative.</text><rect x="55" y="150" width="1490" height="750" rx="18" fill="#FFFFFF" stroke="#CBD7D9" stroke-width="2"/><rect x="80" y="190" width="910" height="610" rx="14" fill="#F7FAFA" stroke="#CBD7D9" stroke-width="2"/><rect x="1025" y="190" width="495" height="610" rx="14" fill="#F7FAFA" stroke="#CBD7D9" stroke-width="2"/><text x="535" y="235" text-anchor="middle" fill="#0B1F3A" font-size="22" font-weight="700">Choose a sign convention before writing the constraint</text>
  <line x1="155" y1="650" x2="905" y2="650" stroke="#0B1F3A" stroke-width="4"/><text x="915" y="657" fill="#0B1F3A" font-size="16" font-weight="700">ground</text><circle cx="510" cy="440" r="210" fill="#EAF4F3" stroke="#0B1F3A" stroke-width="4"/><circle cx="510" cy="440" r="12" fill="#D6A72C" stroke="#0B1F3A" stroke-width="2"/><text x="510" y="445" text-anchor="middle" fill="#0B1F3A" font-size="14" font-weight="700">CM</text>
  <line x1="510" y1="440" x2="510" y2="650" stroke="#718B92" stroke-width="3" stroke-dasharray="8 6"/><text x="525" y="555" fill="#637783" font-size="16">R</text><line x1="510" y1="440" x2="820" y2="440" stroke="#3C7EA7" stroke-width="5" marker-end="url(#b)"/><text x="645" y="420" fill="#3C7EA7" font-size="19" font-weight="700">v_cm &gt; 0 (right)</text>
  <path d="M430 355 A120 120 0 0 1 585 355" fill="none" stroke="#C85C5C" stroke-width="5" marker-end="url(#r)"/><text x="347" y="300" fill="#C85C5C" font-size="18" font-weight="700">ω &lt; 0 (clockwise)</text>
  <line x1="496" y1="654" x2="330" y2="654" stroke="#108B88" stroke-width="4" marker-end="url(#t)"/><text x="230" y="687" fill="#108B88" font-size="17" font-weight="700">rotation contribution at contact: Rω left</text><line x1="525" y1="710" x2="740" y2="710" stroke="#3C7EA7" stroke-width="4" marker-end="url(#b)"/><text x="760" y="716" fill="#3C7EA7" font-size="17" font-weight="700">translation: v_cm right</text><circle cx="510" cy="650" r="9" fill="#C9A227" stroke="#0B1F3A" stroke-width="2"/><text x="520" y="628" fill="#0B1F3A" font-size="15" font-weight="700">contact point: v = 0</text>
  <line x1="170" y1="760" x2="250" y2="760" stroke="#0B1F3A" stroke-width="3" marker-end="url(#n)"/><text x="260" y="766" fill="#0B1F3A" font-size="16" font-weight="700">+x</text><path d="M835 285 A46 46 0 1 1 778 275" fill="none" stroke="#637783" stroke-width="3" marker-end="url(#n)"/><text x="835" y="282" fill="#637783" font-size="16">+θ = counterclockwise</text>
  <text x="1270" y="255" text-anchor="middle" fill="#0B1F3A" font-size="21" font-weight="700">No slip at the contact</text><text x="1060" y="330" fill="#0B1F3A" font-size="20">v_contact = v_cm + Rω</text><text x="1060" y="390" fill="#108B88" font-size="23" font-weight="700">0 = v_cm + Rω</text><line x1="1060" y1="425" x2="1480" y2="425" stroke="#CBD7D9" stroke-width="2"/><text x="1060" y="480" fill="#0B1F3A" font-size="21" font-weight="700">Signed relation</text><text x="1060" y="525" fill="#108B88" font-size="24" font-weight="700">v_cm = −Rω</text><text x="1060" y="585" fill="#0B1F3A" font-size="19">For acceleration, with the same</text><text x="1060" y="615" fill="#0B1F3A" font-size="19">sign choices: a_cm = −Rα</text><rect x="1055" y="665" width="430" height="90" rx="12" fill="#FFF5DB" stroke="#D6A72C" stroke-width="2"/><text x="1270" y="702" text-anchor="middle" fill="#0B1F3A" font-size="17" font-weight="700">Magnitudes only:</text><text x="1270" y="733" text-anchor="middle" fill="#0B1F3A" font-size="20">|v_cm| = R|ω|</text>
  <rect x="205" y="817" width="1190" height="42" rx="10" fill="#EAF4F3" stroke="#9CCAC5" stroke-width="2"/><text x="800" y="844" text-anchor="middle" fill="#0B1F3A" font-size="17" font-weight="700">The source’s positive circumference relation is a magnitude statement; signed equations depend on the chosen axes.</text></g><text x="800" y="942" fill="#A9BABC" font-size="26" font-weight="700" text-anchor="middle" opacity=".24" letter-spacing="2">MARLBRIDGE STUDY RESOURCES</text><line x1="55" y1="964" x2="1545" y2="964" stroke="#C9A227" stroke-width="2"/><text x="58" y="1000" fill="#0B1F3A" font-size="17" font-weight="700">MARLBRIDGE  •  STUDY RESOURCE</text><image x="1260" y="968" width="285" height="70" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/></svg>
