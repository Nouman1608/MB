<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1010" viewBox="0 0 1000 1122.22" role="img" aria-labelledby="title desc"><title id="title">Solid, liquid, gas: the particle picture (OxfordAQA International GCSE Physics)</title><desc id="desc">No tier labels: 9203 3.4.1a (recognise, use and compare simple diagrams of solids, liquids and gases). Three boxes of identical particles. Solid: particles touching in regular rows, vibrating in place. Liquid: particles touching but randomly arranged below a surface, able to slide past each other. Gas: a few particles far apart, moving fast and freely in random directions, shown by arrows.</desc><rect width="1000" height="1122.22" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="500" y="62" font-size="36" font-weight="700" fill="#1E2B47" text-anchor="middle">Solid, liquid, gas: the particle picture</text>
<text x="500" y="106" font-size="23" fill="#4B5B72" text-anchor="middle">Same particles, different arrangement and motion</text>
