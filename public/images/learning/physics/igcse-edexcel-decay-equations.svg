<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1060" viewBox="0 0 1000 1177.78" role="img" aria-labelledby="title desc"><title id="title">Decay equations must balance (Edexcel International GCSE Physics)</title><desc id="desc">Radium-226 (mass number 226, atomic number 88) decays by alpha emission to radon-222 (atomic number 86) plus an alpha particle, helium-4 (4 over 2), drawn as two protons and two neutrons: top 226 = 222 + 4, bottom 88 = 86 + 2. Carbon-14 (atomic number 6) decays by beta emission to nitrogen-14 (atomic number 7) plus an electron (0 over −1): top 14 = 14 + 0, bottom 6 = 7 + (−1). Footer: alpha, A falls by 4 and Z by 2; beta, A stays the same and Z goes up by 1. No tier labels: Edexcel 4PH1 7.7 and 7.8 are on both papers.</desc><rect width="1000" height="1177.78" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="45" y="62" font-size="34" font-weight="700" fill="#1E2B47">Decay equations must balance</text>
