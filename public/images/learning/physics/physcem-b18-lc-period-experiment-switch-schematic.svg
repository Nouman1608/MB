<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Testing the period of an LC circuit</title><desc id="dsc">A two-way switch charges a variable capacitor from a battery, then disconnects the battery and closes the capacitor-inductor loop. A high-impedance voltage sensor reads capacitor voltage. Repeating for different capacitances while keeping L fixed yields a T-squared versus C graph with gradient 4π squared L.</desc><defs>
<marker id="arrN" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#0B1F3A"/></marker>
<marker id="arrB" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#3C7EA7"/></marker>
<marker id="arrT" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#108B88"/></marker>
<marker id="arrG" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#D8A927"/></marker>
<marker id="arrR" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#C85C5C"/></marker>
</defs>
<rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial, Liberation Sans, sans-serif">
<text x="60" y="70" fill="#0B1F3A" font-size="38" font-weight="700" text-anchor="start" >Testing the period of an LC circuit</text><text x="62" y="112" fill="#637783" font-size="20" font-weight="500" text-anchor="start" >Charge the capacitor, isolate the battery, then record the oscillation.</text>
<rect x="55" y="145" width="1490" height="780" rx="22" fill="#FFFFFF" stroke="#CBD7D9" stroke-width="2" /><rect x="75" y="190" width="910" height="660" rx="16" fill="#FFFFFF" stroke="#CAD8DC" stroke-width="2" /><text x="99" y="230" fill="#108B88" font-size="24" font-weight="700" text-anchor="start" >Switching between charge and oscillation</text><rect x="1010" y="190" width="510" height="660" rx="16" fill="#FFFFFF" stroke="#CAD8DC" stroke-width="2" /><text x="1034" y="230" fill="#108B88" font-size="24" font-weight="700" text-anchor="start" >Test the relationship</text><line x1="170" y1="370" x2="170" y2="510" stroke="#0B1F3A" stroke-width="4" /><line x1="145" y1="425" x2="195" y2="425" stroke="#C85C5C" stroke-width="4" /><line x1="152" y1="448" x2="188" y2="448" stroke="#C85C5C" stroke-width="2" /><text x="170" y="340" fill="#0B1F3A" font-size="17" font-weight="700" text-anchor="middle" >DC battery</text><line x1="170" y1="370" x2="350" y2="370" stroke="#0B1F3A" stroke-width="4" /><line x1="170" y1="510" x2="870" y2="510" stroke="#0B1F3A" stroke-width="4" /><line x1="350" y1="370" x2="350" y2="435" stroke="#0B1F3A" stroke-width="4" /><line x1="350" y1="475" x2="350" y2="510" stroke="#0B1F3A" stroke-width="4" /><line x1="315" y1="435" x2="385" y2="435" stroke="#3C7EA7" stroke-width="5" /><line x1="315" y1="475" x2="385" y2="475" stroke="#3C7EA7" stroke-width="5" /><text x="350" y="550" fill="#3C7EA7" font-size="17" font-weight="700" text-anchor="middle" >variable C</text><rect x="400" y="388" width="155" height="52" rx="8" fill="#EAF4F4" stroke="#AFCBCD" stroke-width="2" /><text x="478" y="421" fill="#108B88" font-size="16" font-weight="700" text-anchor="middle" >voltage probe</text><line x1="350" y1="370" x2="400" y2="414" stroke="#108B88" stroke-width="3" /><line x1="350" y1="510" x2="400" y2="414" stroke="#108B88" stroke-width="3" /><circle cx="625" cy="370" r="9" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="1" /><circle cx="705" cy="330" r="9" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="3" /><circle cx="705" cy="410" r="9" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="3" /><line x1="625" y1="370" x2="697" y2="337" stroke="#108B88" stroke-width="5" /><text x="685" y="285" fill="#0B1F3A" font-size="17" font-weight="700" text-anchor="middle" >two-way switch</text><text x="740" y="336" fill="#C85C5C" font-size="15" font-weight="600" text-anchor="start" >1  charge</text><text x="740" y="416" fill="#108B88" font-size="15" font-weight="600" text-anchor="start" >2  oscillate</text><line x1="625" y1="370" x2="625" y2="310" stroke="#0B1F3A" stroke-width="3" /><line x1="625" y1="310" x2="170" y2="310" stroke="#0B1F3A" stroke-width="3" /><line x1="170" y1="310" x2="170" y2="370" stroke="#0B1F3A" stroke-width="3" /><line x1="714" y1="410" x2="810" y2="410" stroke="#0B1F3A" stroke-width="3" /><line x1="810" y1="410" x2="810" y2="510" stroke="#0B1F3A" stroke-width="3" /><path d="M 600 510 C 600 475 630 475 630 510 C 630 475 660 475 660 510 C 660 475 690 475 690 510 C 690 475 720 475 720 510" fill="none" stroke="#D8A927" stroke-width="5" /><text x="660" y="555" fill="#D8A927" font-size="17" font-weight="700" text-anchor="middle" >fixed inductor L</text><text x="528" y="627" fill="#C85C5C" font-size="17" font-weight="700" text-anchor="middle" >1  Charge C from the battery</text><text x="528" y="659" fill="#108B88" font-size="17" font-weight="700" text-anchor="middle" >2  Move the switch to isolate the source</text><text x="528" y="691" fill="#108B88" font-size="17" font-weight="700" text-anchor="middle" >3  Let the LC circuit oscillate; record V_C(t)</text><text x="1265" y="260" fill="#0B1F3A" font-size="19" font-weight="700" text-anchor="middle" >For each capacitance C</text><text x="1265" y="302" fill="#637783" font-size="17" font-weight="500" text-anchor="middle" >measure several cycles</text><text x="1265" y="334" fill="#637783" font-size="17" font-weight="500" text-anchor="middle" >and calculate T².</text><line x1="1090" y1="650" x2="1450" y2="650" stroke="#0B1F3A" stroke-width="3" marker-end="url(#arrN)" /><line x1="1090" y1="650" x2="1090" y2="420" stroke="#0B1F3A" stroke-width="3" marker-end="url(#arrN)" /><text x="1078" y="435" fill="#0B1F3A" font-size="17" font-weight="700" text-anchor="end" >T²</text><text x="1458" y="674" fill="#0B1F3A" font-size="17" font-weight="700" text-anchor="start" >C</text><line x1="1125" y1="620" x2="1410" y2="450" stroke="#3C7EA7" stroke-width="5" marker-end="url(#arrB)" /><text x="1310" y="510" fill="#3C7EA7" font-size="17" font-weight="700" text-anchor="middle" >gradient = 4π²L</text><text x="1260" y="720" fill="#0B1F3A" font-size="16" font-weight="600" text-anchor="middle" >A straight line through the origin</text><text x="1260" y="746" fill="#0B1F3A" font-size="16" font-weight="600" text-anchor="middle" >supports T² = 4π²LC.</text><rect x="1065" y="775" width="400" height="42" rx="10" fill="#FFF5DA" stroke="#E5C971" stroke-width="2" /><text x="1265" y="802" fill="#0B1F3A" font-size="15" font-weight="600" text-anchor="middle" >Keep L fixed while C changes.</text>
<text x="800" y="938" fill="#A9BABC" font-size="26" font-weight="700" text-anchor="middle" opacity="0.24" letter-spacing="2">MARLBRIDGE STUDY RESOURCES</text>
<line x1="55" y1="960" x2="1545" y2="960" stroke="#D8A927" stroke-width="2"/>
