<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">Crossed fields: velocity selector</title><desc id="desc">Parallel plates make E downward; B points into the page. For positive ions moving right, electric and magnetic forces oppose and cancel only at v=E/B=2.0×10⁵ m/s. Faster ions deflect up, slower down; negative charges reverse both force directions.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#20354D"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#357EA2"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B75E53"/></marker></defs><rect width="1600" height="1050" fill="#F4F7F7"/><text x="55" y="58" font-family="Arial,sans-serif" font-size="34" fill="#0B1F3A" font-weight="700" text-anchor="start">Crossed fields: velocity selector</text><text x="57" y="96" font-family="Arial,sans-serif" font-size="18" fill="#52677C" font-weight="400" text-anchor="start">Marlbridge • AP Physics teaching diagram</text><rect x="65" y="135" width="1470" height="775" rx="14" fill="white" stroke="#C8D3D4" stroke-width="2"/><rect x="170" y="225" width="920" height="26" rx="0" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="2"/><rect x="170" y="700" width="920" height="26" rx="0" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="2"/><text x="625" y="210" font-family="Arial,sans-serif" font-size="18" fill="#357EA2" font-weight="700" text-anchor="middle">+ plate</text><text x="625" y="765" font-family="Arial,sans-serif" font-size="18" fill="#B75E53" font-weight="700" text-anchor="middle">− plate</text><line x1="300" y1="300" x2="300" y2="650" stroke="#357EA2" stroke-width="2"  marker-end="url(#arr)"/><line x1="450" y1="300" x2="450" y2="650" stroke="#357EA2" stroke-width="2"  marker-end="url(#arr)"/><line x1="600" y1="300" x2="600" y2="650" stroke="#357EA2" stroke-width="2"  marker-end="url(#arr)"/><line x1="750" y1="300" x2="750" y2="650" stroke="#357EA2" stroke-width="2"  marker-end="url(#arr)"/><line x1="900" y1="300" x2="900" y2="650" stroke="#357EA2" stroke-width="2"  marker-end="url(#arr)"/><text x="250" y="355" font-family="Arial,sans-serif" font-size="22" fill="#357EA2" font-weight="700" text-anchor="start">E ↓</text><text x="1170" y="345" font-family="Arial,sans-serif" font-size="24" fill="#3F8582" font-weight="700" text-anchor="start">B ⊗</text><line x1="250" y1="485" x2="1000" y2="485" stroke="#C9A227" stroke-width="6"  marker-end="url(#arr)"/><text x="380" y="455" font-family="Arial,sans-serif" font-size="19" fill="#0B1F3A" font-weight="700" text-anchor="start">positive ion velocity v →</text><circle cx="650" cy="485" r="18" fill="#E8F2F6" stroke="#357EA2" stroke-width="3"/><line x1="650" y1="485" x2="650" y2="385" stroke="#B75E53" stroke-width="4"  marker-end="url(#arr)"/><text x="665" y="375" font-family="Arial,sans-serif" font-size="17" fill="#B75E53" font-weight="700" text-anchor="start">Fᴮ up</text><line x1="650" y1="485" x2="650" y2="585" stroke="#357EA2" stroke-width="4"  marker-end="url(#arr)"/><text x="665" y="610" font-family="Arial,sans-serif" font-size="17" fill="#357EA2" font-weight="700" text-anchor="start">Fᴱ down</text><rect x="1140" y="430" width="310" height="245" rx="14" fill="#EFF6F6" stroke="#AFC8C8" stroke-width="2"/><text x="1295" y="480" font-family="Arial,sans-serif" font-size="20" fill="#3F8582" font-weight="700" text-anchor="middle">selector condition</text><text x="1295" y="530" font-family="Arial,sans-serif" font-size="23" fill="#0B1F3A" font-weight="700" text-anchor="middle">qE = qvB</text><text x="1295" y="580" font-family="Arial,sans-serif" font-size="23" fill="#0B1F3A" font-weight="700" text-anchor="middle">v = E/B</text><text x="1295" y="630" font-family="Arial,sans-serif" font-size="19" fill="#3F8582" font-weight="700" text-anchor="middle">= 2.0 × 10⁵ m/s</text><text x="800" y="835" font-family="Arial,sans-serif" font-size="18" fill="#0B1F3A" font-weight="600" text-anchor="middle">Too fast: magnetic force wins → upward. Too slow: electric force wins → downward. For negative ions both force arrows reverse.</text><line x1="55" y1="958" x2="1545" y2="958" stroke="#C9A227" stroke-width="3"/><text x="58" y="991" font-family="Arial,sans-serif" font-size="16" fill="#52677C" font-weight="400" text-anchor="start">Marlbridge Physics study resource • Diagram schematic; assumptions stated in labels</text><image x="1260" y="968" width="285" height="47" href="data:image/svg+xml;base64,"/><text x="800" y="1020" font-family="Arial,sans-serif" font-size="13" fill="#738394" font-weight="400" text-anchor="middle">091065bb57d3df33e3e3</text></svg>