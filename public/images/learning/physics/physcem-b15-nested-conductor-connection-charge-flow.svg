<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
<title id="title">Nested conductors: charge after electrical connection</title><desc id="desc">Before connection, an inner conductor carries +q and the outer shell has net charge Q. Once joined, both conductors and the cavity wall carry zero net charge; Q+q is on the outside surface. Total charge is conserved.</desc><defs>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#20354D"/></marker>
      <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#357EA2"/></marker>
      <marker id="arrGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#C9A227"/></marker>
    </defs>
<rect width="1600" height="1050" fill="#F4F7F7"/><text x="54" y="58" font-family="Arial,sans-serif" font-size="34" fill="#0B1F3A" font-weight="700" text-anchor="start" >Nested conductors: charge after electrical connection</text><text x="56" y="96" font-family="Arial,sans-serif" font-size="18" fill="#52677C" font-weight="400" text-anchor="start" >Marlbridge • AP Physics C: Electricity and Magnetism • teaching diagram</text>
<rect x="55" y="135" width="1490" height="760" rx="16" fill="white" stroke="#C8D3D4" stroke-width="2"/><text x="100" y="185" font-family="Arial,sans-serif" font-size="27" fill="#0B1F3A" font-weight="700" text-anchor="start" >Connecting conductors makes one equipotential object</text><rect x="95" y="225" width="665" height="565" rx="16" fill="#FBFCFC" stroke="#C8D3D4" stroke-width="2"/><rect x="840" y="225" width="665" height="565" rx="16" fill="#FBFCFC" stroke="#C8D3D4" stroke-width="2"/><text x="425" y="270" font-family="Arial,sans-serif" font-size="24" fill="#357EA2" font-weight="700" text-anchor="middle" >BEFORE: separate conductors</text><text x="1170" y="270" font-family="Arial,sans-serif" font-size="24" fill="#3F8582" font-weight="700" text-anchor="middle" >AFTER: joined by a wire</text><circle cx="425" cy="490" r="125" fill="#E7EFF2" stroke="#607184" stroke-width="8"/><circle cx="425" cy="490" r="54" fill="#E8F2F6" stroke="#357EA2" stroke-width="5"/><text x="425" y="477" font-family="Arial,sans-serif" font-size="18" fill="#0B1F3A" font-weight="700" text-anchor="middle" >inner</text><text x="425" y="505" font-family="Arial,sans-serif" font-size="26" fill="#357EA2" font-weight="700" text-anchor="middle" >+q</text><text x="425" y="345" font-family="Arial,sans-serif" font-size="19" fill="#0B1F3A" font-weight="700" text-anchor="middle" >shell net Q</text><text x="425" y="642" font-family="Arial,sans-serif" font-size="18" fill="#B75E53" font-weight="700" text-anchor="middle" >cavity wall: −q</text><text x="425" y="682" font-family="Arial,sans-serif" font-size="20" fill="#3F8582" font-weight="700" text-anchor="middle" >outer surface: Q + q</text><circle cx="1170" cy="490" r="125" fill="#E7EFF2" stroke="#607184" stroke-width="8"/><circle cx="1170" cy="490" r="54" fill="#E8F2F6" stroke="#357EA2" stroke-width="5"/><path d="M1170 436 L1170 365" stroke="#C9A227" stroke-width="8" fill="none"  marker-end="url(#arrGold)"/><text x="1170" y="477" font-family="Arial,sans-serif" font-size="18" fill="#0B1F3A" font-weight="700" text-anchor="middle" >inner</text><text x="1170" y="505" font-family="Arial,sans-serif" font-size="26" fill="#3F8582" font-weight="700" text-anchor="middle" >0</text><text x="1170" y="352" font-family="Arial,sans-serif" font-size="17" fill="#C9A227" font-weight="700" text-anchor="middle" >joined contact</text><text x="1170" y="642" font-family="Arial,sans-serif" font-size="18" fill="#3F8582" font-weight="700" text-anchor="middle" >cavity wall: 0</text><text x="1170" y="682" font-family="Arial,sans-serif" font-size="20" fill="#3F8582" font-weight="700" text-anchor="middle" >outer surface: Q + q</text><rect x="180" y="720" width="1210" height="80" rx="12" fill="#FFF7DF" stroke="#E1C568" stroke-width="2"/><text x="785" y="754" font-family="Arial,sans-serif" font-size="21" fill="#0B1F3A" font-weight="700" text-anchor="middle" >Charge redistributes through the connection; total charge is conserved.</text><text x="785" y="783" font-family="Arial,sans-serif" font-size="18" fill="#20354D" font-weight="400" text-anchor="middle" >Initially: +q on inner conductor and net Q on shell  →  finally: Q + q on the outside surface.</text><rect x="180" y="820" width="1210" height="42" rx="10" fill="#EFF6F6" stroke="#AFC8C8" stroke-width="2"/><text x="785" y="849" font-family="Arial,sans-serif" font-size="17" fill="#52677C" font-weight="400" text-anchor="middle" >Ideal electrostatic equilibrium; labels show net surface charges, not individual microscopic carriers.</text><line x1="55" y1="958" x2="1545" y2="958" stroke="#C9A227" stroke-width="3"/>
