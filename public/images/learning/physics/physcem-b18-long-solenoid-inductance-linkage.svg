<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="ttl dsc">
<title id="ttl">The inductance of a long solenoid</title><desc id="dsc">A long air-core solenoid with N turns, length ell, cross-sectional area A and current I has an approximately uniform internal field B=mu0NI/ell. Flux through one turn is BA; linkage NΦ gives L=mu0N²A/ell under the ideal long-solenoid model.</desc><defs>
<marker id="arrN" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#0B1F3A"/></marker>
<marker id="arrB" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#3C7EA7"/></marker>
<marker id="arrT" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#108B88"/></marker>
<marker id="arrG" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#D8A927"/></marker>
<marker id="arrR" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#C85C5C"/></marker>
</defs>
<rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial, Liberation Sans, sans-serif">
<text x="60" y="70" fill="#0B1F3A" font-size="38" font-weight="700" text-anchor="start" >The inductance of a long solenoid</text><text x="62" y="112" fill="#637783" font-size="20" font-weight="500" text-anchor="start" >More turns and area increase flux linkage; greater length reduces it.</text>
<rect x="55" y="145" width="1490" height="780" rx="22" fill="#FFFFFF" stroke="#CBD7D9" stroke-width="2" /><rect x="80" y="195" width="850" height="645" rx="16" fill="#FFFFFF" stroke="#CAD8DC" stroke-width="2" /><text x="104" y="235" fill="#108B88" font-size="24" font-weight="700" text-anchor="start" >Long air-core solenoid</text><rect x="960" y="195" width="560" height="645" rx="16" fill="#FFFFFF" stroke="#CAD8DC" stroke-width="2" /><text x="984" y="235" fill="#108B88" font-size="24" font-weight="700" text-anchor="start" >Flux linkage leads to inductance</text><rect x="210" y="390" width="520" height="180" rx="14" fill="#F7FAFA" stroke="#B8C8CD" stroke-width="2" /><path d="M 236 390 C 214 418 214 542 236 570" fill="none" stroke="#108B88" stroke-width="4" /><path d="M 278 390 C 256 418 256 542 278 570" fill="none" stroke="#108B88" stroke-width="4" /><path d="M 320 390 C 298 418 298 542 320 570" fill="none" stroke="#108B88" stroke-width="4" /><path d="M 362 390 C 340 418 340 542 362 570" fill="none" stroke="#108B88" stroke-width="4" /><path d="M 404 390 C 382 418 382 542 404 570" fill="none" stroke="#108B88" stroke-width="4" /><path d="M 446 390 C 424 418 424 542 446 570" fill="none" stroke="#108B88" stroke-width="4" /><path d="M 488 390 C 466 418 466 542 488 570" fill="none" stroke="#108B88" stroke-width="4" /><path d="M 530 390 C 508 418 508 542 530 570" fill="none" stroke="#108B88" stroke-width="4" /><path d="M 572 390 C 550 418 550 542 572 570" fill="none" stroke="#108B88" stroke-width="4" /><path d="M 614 390 C 592 418 592 542 614 570" fill="none" stroke="#108B88" stroke-width="4" /><path d="M 656 390 C 634 418 634 542 656 570" fill="none" stroke="#108B88" stroke-width="4" /><path d="M 698 390 C 676 418 676 542 698 570" fill="none" stroke="#108B88" stroke-width="4" /><line x1="166" y1="480" x2="260" y2="480" stroke="#108B88" stroke-width="5" marker-end="url(#arrT)" /><line x1="690" y1="480" x2="802" y2="480" stroke="#108B88" stroke-width="5" marker-end="url(#arrT)" /><text x="178" y="455" fill="#108B88" font-size="18" font-weight="700" text-anchor="middle" >I</text><text x="808" y="455" fill="#108B88" font-size="18" font-weight="700" text-anchor="middle" >I</text><line x1="330" y1="423" x2="610" y2="423" stroke="#3C7EA7" stroke-width="4" marker-end="url(#arrB)" /><line x1="330" y1="480" x2="610" y2="480" stroke="#3C7EA7" stroke-width="4" marker-end="url(#arrB)" /><line x1="330" y1="537" x2="610" y2="537" stroke="#3C7EA7" stroke-width="4" marker-end="url(#arrB)" /><text x="480" y="354" fill="#0B1F3A" font-size="21" font-weight="700" text-anchor="middle" >N turns over length ℓ</text><text x="477" y="620" fill="#3C7EA7" font-size="17" font-weight="600" text-anchor="middle" >Nearly uniform B inside; small outside for a long ideal solenoid</text><line x1="215" y1="680" x2="730" y2="680" stroke="#D8A927" stroke-width="3" /><line x1="215" y1="668" x2="215" y2="692" stroke="#D8A927" stroke-width="3" /><line x1="730" y1="668" x2="730" y2="692" stroke="#D8A927" stroke-width="3" /><text x="473" y="716" fill="#D8A927" font-size="22" font-weight="700" text-anchor="middle" >ℓ</text><text x="480" y="765" fill="#0B1F3A" font-size="18" font-weight="600" text-anchor="middle" >Cross-section A = πr²</text><text x="1238" y="277" fill="#108B88" font-size="20" font-weight="700" text-anchor="middle" >Field inside</text><text x="1238" y="319" fill="#0B1F3A" font-size="28" font-weight="700" text-anchor="middle" >B = μ₀NI / ℓ</text><text x="1238" y="384" fill="#108B88" font-size="20" font-weight="700" text-anchor="middle" >Flux through one turn</text><text x="1238" y="426" fill="#0B1F3A" font-size="28" font-weight="700" text-anchor="middle" >Φ = BA</text><text x="1238" y="486" fill="#108B88" font-size="20" font-weight="700" text-anchor="middle" >Flux linkage</text><text x="1238" y="528" fill="#0B1F3A" font-size="25" font-weight="700" text-anchor="middle" >NΦ = μ₀N²IA / ℓ</text><line x1="1030" y1="570" x2="1450" y2="570" stroke="#D4DFE0" stroke-width="2" /><text x="1238" y="626" fill="#108B88" font-size="20" font-weight="700" text-anchor="middle" >Inductance</text><text x="1238" y="670" fill="#0B1F3A" font-size="25" font-weight="700" text-anchor="middle" >L = NΦ/I</text><text x="1238" y="713" fill="#D8A927" font-size="28" font-weight="700" text-anchor="middle" >= μ₀N²A / ℓ</text><text x="1238" y="770" fill="#637783" font-size="16" font-weight="600" text-anchor="middle" >Ideal long solenoid; no magnetic core.</text>
