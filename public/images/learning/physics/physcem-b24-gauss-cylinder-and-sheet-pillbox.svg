<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><defs><marker id="arrN" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#0B1F3A"/></marker><marker id="arrB" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#3C7EA7"/></marker><marker id="arrT" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#108B88"/></marker><marker id="arrR" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#C85C5C"/></marker></defs><title id="title">Two Gaussian surfaces, two nonzero-area factors</title><desc id="desc">Symmetry selects the nonzero-flux surface patches.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial, Liberation Sans, sans-serif"><text x="58" y="74" fill="#0B1F3A" font-size="37" font-weight="700">Two Gaussian surfaces, two nonzero-area factors</text><text x="60" y="116" fill="#637783" font-size="20">Symmetry selects the nonzero-flux surface patches.</text><rect x="55" y="150" width="1490" height="750" rx="18" fill="#FFFFFF" stroke="#CBD7D9" stroke-width="2"/><rect x="80" y="190" width="690" height="610" rx="14" fill="#F7FAFA" stroke="#CBD7D9" stroke-width="2"/><rect x="830" y="190" width="690" height="610" rx="14" fill="#F7FAFA" stroke="#CBD7D9" stroke-width="2"/><text x="425" y="235" text-anchor="middle" fill="#0B1F3A" font-size="23" font-weight="700">Line charge • coaxial cylinder</text><text x="1175" y="235" text-anchor="middle" fill="#0B1F3A" font-size="23" font-weight="700">Infinite sheet • pillbox</text>
  <ellipse cx="425" cy="390" rx="175" ry="58" fill="#EAF4F3" stroke="#108B88" stroke-width="4"/><path d="M250 390v210 M600 390v210" stroke="#108B88" stroke-width="4"/><ellipse cx="425" cy="600" rx="175" ry="58" fill="#EAF4F3" stroke="#108B88" stroke-width="4"/><line x1="425" y1="320" x2="425" y2="668" stroke="#C9A227" stroke-width="6" stroke-dasharray="10 8"/><text x="445" y="365" fill="#0B1F3A" font-size="15" font-weight="700">+λ</text><text x="425" y="690" text-anchor="middle" fill="#0B1F3A" font-size="17">enclosed line charge = λL</text><line x1="425" y1="622" x2="590" y2="622" stroke="#0B1F3A" stroke-width="2" stroke-dasharray="5 4"/><text x="510" y="616" text-anchor="middle" fill="#0B1F3A" font-size="15" font-weight="700">r</text><line x1="625" y1="395" x2="625" y2="585" stroke="#0B1F3A" stroke-width="2"/><line x1="616" y1="395" x2="634" y2="395" stroke="#0B1F3A" stroke-width="2"/><line x1="616" y1="585" x2="634" y2="585" stroke="#0B1F3A" stroke-width="2"/><text x="643" y="492" fill="#0B1F3A" font-size="15" font-weight="700" transform="rotate(90 643 492)" text-anchor="middle">L</text>
  <g stroke="#3C7EA7" stroke-width="3" marker-end="url(#arrB)"><line x1="425" y1="465" x2="565" y2="465"/><line x1="425" y1="530" x2="580" y2="530"/><line x1="425" y1="465" x2="290" y2="465"/><line x1="425" y1="530" x2="275" y2="530"/></g><text x="445" y="500" fill="#3C7EA7" font-size="17" font-weight="700">E radial</text><text x="425" y="730" text-anchor="middle" fill="#0B1F3A" font-size="19" font-weight="700">Φ = E(2πrL) = λL/ε₀</text><text x="425" y="762" text-anchor="middle" fill="#637783" font-size="16">Curved side contributes; end-cap normals are perpendicular to E.</text>
  <path d="M940 485 L1408 485 L1408 585 L940 585 Z" fill="#EAF4F3" stroke="#108B88" stroke-width="4"/><path d="M940 485 L985 447 L1453 447 L1408 485 M1408 485 L1453 447 L1453 547 L1408 585" fill="#F7FAFA" stroke="#108B88" stroke-width="3"/><path d="M940 485 L985 447 L985 547 L940 585" fill="#F7FAFA" stroke="#108B88" stroke-width="3"/><path d="M880 535h610" stroke="#C9A227" stroke-width="5"/><text x="1175" y="570" text-anchor="middle" fill="#0B1F3A" font-size="16" font-weight="700">positive sheet σ &gt; 0</text>
  <g stroke="#3C7EA7" stroke-width="3" marker-end="url(#arrB)"><line x1="1080" y1="400" x2="1080" y2="310"/><line x1="1175" y1="400" x2="1175" y2="310"/><line x1="1270" y1="400" x2="1270" y2="310"/><line x1="1080" y1="660" x2="1080" y2="675"/><line x1="1175" y1="660" x2="1175" y2="675"/><line x1="1270" y1="660" x2="1270" y2="675"/></g><text x="1175" y="284" text-anchor="middle" fill="#3C7EA7" font-size="17" font-weight="700">E normal to both caps</text>
  <text x="1175" y="690" text-anchor="middle" fill="#0B1F3A" font-size="19" font-weight="700">Φ = 2EA = σA/ε₀</text><text x="1175" y="730" text-anchor="middle" fill="#637783" font-size="16">Both caps contribute; the curved side has zero flux.</text><rect x="205" y="817" width="1190" height="42" rx="10" fill="#FFF5DB" stroke="#D6A72C" stroke-width="2"/><text x="800" y="844" text-anchor="middle" fill="#0B1F3A" font-size="17" font-weight="700">Choose a surface whose symmetry makes E constant on the contributing area; zero-flux patches do not enter the sum.</text></g><text x="800" y="942" fill="#A9BABC" font-size="26" font-weight="700" text-anchor="middle" opacity=".24" letter-spacing="2">MARLBRIDGE STUDY RESOURCES</text><line x1="55" y1="964" x2="1545" y2="964" stroke="#C9A227" stroke-width="2"/><text x="58" y="1000" fill="#0B1F3A" font-size="17" font-weight="700">MARLBRIDGE  •  STUDY RESOURCE</text><image x="1260" y="968" width="285" height="70" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/></svg>
