<svg xmlns="http://www.w3.org/2000/svg" width="900" height="880" viewBox="0 0 1000 977.78" role="img" aria-labelledby="title desc"><title id="title">Convection current in water</title><desc id="desc">A beaker of water heated from below at one bottom corner, where a purple crystal sits. The purple dye shows the flow: hot water rises above the heated spot, crosses the top, cools and sinks on the far side, then returns along the bottom. No tier labels: Edexcel 4PH1 4.6–4.7 (both papers) and OxfordAQA 9203 3.4.2a (untiered).</desc><rect width="1000" height="977.78" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="500" y="62" font-size="36" font-weight="700" fill="#1E2B47" text-anchor="middle">Convection current in water</text>
<text x="500" y="106" font-size="23" fill="#4B5B72" text-anchor="middle">Heated water expands, becomes less dense and rises</text>
<rect x="168" y="255" width="664" height="465" fill="#D2E5EC"/>
