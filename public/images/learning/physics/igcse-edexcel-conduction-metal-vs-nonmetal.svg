<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1040" viewBox="0 0 1000 1155.56" role="img" aria-labelledby="title desc"><title id="title">How metals conduct better (Edexcel International GCSE Physics)</title><desc id="desc">Two rods from a hot end to a cold end. Top, a non-metal: each atom vibrates and passes energy on to its neighbour. Bottom, a metal: as well as the vibrating atoms, fast free electrons move through the lattice carrying energy, so metals conduct much better. No tier labels: conduction is 4PH1 4.6, on both papers.</desc><rect width="1000" height="1155.56" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="500" y="62" font-size="36" font-weight="700" fill="#1E2B47" text-anchor="middle">How metals conduct better</text>
