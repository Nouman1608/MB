<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img"><title>Equivalence principle: local and approximately uniform</title><desc>A small cabin in a nearly uniform field illustrates local equivalence; a larger region can reveal field gradients and tidal effects.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial,sans-serif" fill="#20314B"><text x="62" y="78" font-size="40" font-weight="700" fill="#0B1F3A" text-anchor="start">Equivalence principle: local and approximately uniform</text><text x="64" y="124" font-size="22" font-weight="400" fill="#20314B" text-anchor="start">Marlbridge teaching diagram • schematic concept illustration</text><rect x="60" y="165" width="1480" height="755" rx="18" fill="white" stroke="#CCD6D7" stroke-width="2"/><text x="100" y="225" font-size="20" font-weight="400" fill="#20314B" text-anchor="start">Local experiments in a closed cabin cannot distinguish these cases when the field is nearly uniform.</text><rect x="110" y="300" width="660" height="400" rx="14" fill="#E7EFED" stroke="#2D7A78" stroke-width="2"/><text x="145" y="350" font-size="20" font-weight="700" fill="#2D7A78" text-anchor="start">SMALL LAB — LOCAL APPROXIMATION</text><rect x="165" y="405" width="230" height="180" rx="14" fill="#FFFFFF" stroke="#CCD6D7" stroke-width="2"/><text x="280" y="450" font-size="16" font-weight="700" fill="#0B1F3A" text-anchor="middle">AT REST</text><text x="280" y="488" font-size="18" font-weight="700" fill="#0B1F3A" text-anchor="middle">g = 11.0 N/kg</text><path d="M280 515 L280 555" stroke="#397DA4" stroke-width="4" fill="none"/><text x="280" y="578" font-size="15" font-weight="400" fill="#397DA4" text-anchor="middle">effective down</text><text x="435" y="505" font-size="35" font-weight="700" fill="#596B7E" text-anchor="middle">&#8776;</text><rect x="485" y="405" width="240" height="180" rx="14" fill="#FFFFFF" stroke="#CCD6D7" stroke-width="2"/><text x="605" y="450" font-size="16" font-weight="700" fill="#0B1F3A" text-anchor="middle">CABIN UP</text><text x="605" y="488" font-size="17" font-weight="700" fill="#0B1F3A" text-anchor="middle">g = 9.8; cabin a_up = 1.2</text><path d="M605 515 L605 555" stroke="#397DA4" stroke-width="4" fill="none"/><text x="605" y="578" font-size="15" font-weight="400" fill="#397DA4" text-anchor="middle">effective down = 11.0 N/kg</text><text x="440" y="650" font-size="16" font-weight="700" fill="#0B1F3A" text-anchor="middle">Assume field is uniform across this small cabin.</text><rect x="830" y="300" width="660" height="400" rx="14" fill="#FBFCFC" stroke="#C9A227" stroke-width="2"/><text x="865" y="350" font-size="20" font-weight="700" fill="#A58214" text-anchor="start">LARGE REGION / FIELD VARIATION</text><path d="M980 430 L980 454" stroke="#397DA4" stroke-width="5" fill="none"/><path d="M971 438 L980 456 L989 438 Z" fill="#397DA4"/><path d="M1100 430 L1100 478" stroke="#397DA4" stroke-width="5" fill="none"/><path d="M1091 462 L1100 480 L1109 462 Z" fill="#397DA4"/><path d="M1220 430 L1220 502" stroke="#397DA4" stroke-width="5" fill="none"/><path d="M1211 486 L1220 504 L1229 486 Z" fill="#397DA4"/><path d="M1340 430 L1340 526" stroke="#397DA4" stroke-width="5" fill="none"/><path d="M1331 510 L1340 528 L1349 510 Z" fill="#397DA4"/><text x="1160" y="560" font-size="17" font-weight="700" fill="#0B1F3A" text-anchor="middle">Strength/direction varies across space.</text><text x="1160" y="605" font-size="17" font-weight="400" fill="#596B7E" text-anchor="middle">Tidal differences can reveal the gradient.</text><text x="1160" y="650" font-size="17" font-weight="700" fill="#A58214" text-anchor="middle">Equivalence is local, not arbitrary.</text><rect x="180" y="760" width="1240" height="95" rx="10" fill="#FFF4D6" stroke="#E0C76C" stroke-width="2"/><text x="215" y="800" font-size="19" font-weight="700" fill="#0B1F3A" text-anchor="start">Boundary of the claim</text><text x="215" y="832" font-size="17" font-weight="400" fill="#20314B" text-anchor="start">A small-region, near-uniform-field approximation is required; large gradients can distinguish the situations.</text><path d="M60 972H1540" stroke="#CCD6D7" stroke-width="2"/><text x="64" y="1015" font-size="17" font-weight="400" fill="#20314B" text-anchor="start">Marlbridge • study diagram • check assumptions and context</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>
