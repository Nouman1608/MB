<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="740" viewBox="0 0 1440 740" role="img" aria-labelledby="title desc"><title id="title">Measurement uncertainty and gradient limits</title><desc id="desc">A schematic graph shows vertical error bars around measurements, with best-fit, steepest and shallowest acceptable lines. Half the difference between maximum and minimum gradient is the uncertainty in the gradient.</desc><rect width="1440" height="740" fill="#F4F7F7"/><text x="64" y="64" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0B1F3A">Use error bars to estimate gradient uncertainty</text><text x="66" y="101" font-family="Arial,sans-serif" font-size="19" fill="#52677C">Schematic: acceptable lines must remain consistent with the measured uncertainties</text><rect x="55" y="130" width="1330" height="520" rx="18" fill="#fff" stroke="#C8D3D4" stroke-width="3"/><g stroke="#E1E8E8" stroke-width="1"><line x1="190" y1="220" x2="900" y2="220"/><line x1="190" y1="300" x2="900" y2="300"/><line x1="190" y1="380" x2="900" y2="380"/><line x1="190" y1="460" x2="900" y2="460"/><line x1="330" y1="180" x2="330" y2="540"/><line x1="470" y1="180" x2="470" y2="540"/><line x1="610" y1="180" x2="610" y2="540"/><line x1="750" y1="180" x2="750" y2="540"/></g><line x1="190" y1="540" x2="920" y2="540" stroke="#52677C" stroke-width="3" marker-end="url(#arrow)"/><line x1="190" y1="540" x2="190" y2="170" stroke="#52677C" stroke-width="3" marker-end="url(#arrow)"/><text x="545" y="590" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#0B1F3A">Measured quantity x</text><text x="105" y="355" text-anchor="middle" transform="rotate(-90 105 355)" font-family="Arial,sans-serif" font-size="20" fill="#0B1F3A">Measured quantity y</text><g stroke="#52677C" stroke-width="3"><line x1="285" y1="455" x2="285" y2="505"/><line x1="275" y1="455" x2="295" y2="455"/><line x1="275" y1="505" x2="295" y2="505"/><line x1="420" y1="380" x2="420" y2="430"/><line x1="410" y1="380" x2="430" y2="380"/><line x1="410" y1="430" x2="430" y2="430"/><line x1="555" y1="305" x2="555" y2="355"/><line x1="545" y1="305" x2="565" y2="305"/><line x1="545" y1="355" x2="565" y2="355"/><line x1="690" y1="230" x2="690" y2="280"/><line x1="680" y1="230" x2="700" y2="230"/><line x1="680" y1="280" x2="700" y2="280"/><line x1="825" y1="185" x2="825" y2="235"/><line x1="815" y1="185" x2="835" y2="185"/><line x1="815" y1="235" x2="835" y2="235"/></g><g fill="#C9A227" stroke="#fff" stroke-width="2"><circle cx="285" cy="480" r="8"/><circle cx="420" cy="405" r="8"/><circle cx="555" cy="330" r="8"/><circle cx="690" cy="255" r="8"/><circle cx="825" cy="210" r="8"/></g><line x1="245" y1="515" x2="850" y2="195" stroke="#3F8582" stroke-width="5"/><line x1="235" y1="530" x2="850" y2="172" stroke="#357EA2" stroke-width="4" stroke-dasharray="12 8"/><line x1="240" y1="505" x2="850" y2="226" stroke="#B75E53" stroke-width="4" stroke-dasharray="12 8"/><g font-family="Arial,sans-serif" font-size="18" fill="#0B1F3A"><line x1="980" y1="220" x2="1035" y2="220" stroke="#3F8582" stroke-width="5"/><text x="1050" y="226">Best-fit line</text><line x1="980" y1="275" x2="1035" y2="275" stroke="#357EA2" stroke-width="4" stroke-dasharray="10 6"/><text x="1050" y="281">Steepest acceptable line → m_max</text><line x1="980" y1="330" x2="1035" y2="330" stroke="#B75E53" stroke-width="4" stroke-dasharray="10 6"/><text x="1050" y="336">Shallowest acceptable line → m_min</text></g><rect x="965" y="385" width="340" height="135" rx="12" fill="#EFF6F6" stroke="#AFC8C8" stroke-width="2"/><text x="1135" y="430" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#0B1F3A">gradient uncertainty</text><text x="1135" y="476" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#3F8582">Δm = (m_max − m_min)/2</text><text x="1135" y="555" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#52677C">Each bar shows the plausible y range</text><text x="1135" y="580" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#52677C">for that measured x.</text><line x1="65" y1="674" x2="1375" y2="674" stroke="#C9A227" stroke-width="3"/><text x="75" y="714" font-family="Arial,sans-serif" font-size="17" fill="#52677C">Schematic, not a specific experimental data set. — Marlbridge Physics</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#52677C"/></marker></defs><image href="data:image/svg+xml;base64," x="1190" y="684" width="175" height="48" preserveAspectRatio="xMidYMid meet"/></svg>
