<svg xmlns="http://www.w3.org/2000/svg" width="900" height="890" viewBox="0 0 1800 1780" role="img" aria-labelledby="title desc"><title id="title">Transverse and longitudinal waves</title><desc id="desc">Top panel: a transverse wave on a rope; one marked point vibrates up and down, at right angles to the wave direction arrow. Bottom panel: a longitudinal wave on a spring; one marked coil vibrates back and forth along the wave direction, and the coils bunch into compressions (C) and spread into rarefactions (R). No tier labels: both ideas are on both tiers.</desc><rect width="1800" height="1780" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="112" font-size="70" font-weight="700" fill="#1E2B47" text-anchor="middle">Which way does it vibrate?</text>
<text x="900" y="190" font-size="44" fill="#4B5B72" text-anchor="middle">Compare vibration with wave direction</text>
