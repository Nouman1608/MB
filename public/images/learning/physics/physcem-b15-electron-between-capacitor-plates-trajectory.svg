<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
<title id="title">Electron between capacitor plates: force and trajectory</title><desc id="desc">A negative electron enters midway between horizontal plates at 1.0×10⁷ m/s. With ΔV=40 V, d=2.0 cm and length 5.0 cm, it accelerates toward the positive plate and exits after a 4.4 mm deflection, less than its 10 mm clearance. The drawn curve is schematic.</desc><defs>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#20354D"/></marker>
      <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#357EA2"/></marker>
      <marker id="arrGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#C9A227"/></marker>
    </defs>
<rect width="1600" height="1050" fill="#F4F7F7"/><text x="54" y="58" font-family="Arial,sans-serif" font-size="34" fill="#0B1F3A" font-weight="700" text-anchor="start" >Electron between capacitor plates: force and trajectory</text><text x="56" y="96" font-family="Arial,sans-serif" font-size="18" fill="#52677C" font-weight="400" text-anchor="start" >Marlbridge • AP Physics C: Electricity and Magnetism • teaching diagram</text>
<rect x="55" y="135" width="1490" height="760" rx="16" fill="white" stroke="#C8D3D4" stroke-width="2"/><text x="100" y="185" font-family="Arial,sans-serif" font-size="27" fill="#0B1F3A" font-weight="700" text-anchor="start" >Electron trajectory in a uniform capacitor field</text><rect x="105" y="240" width="1080" height="455" rx="12" fill="#FCFDFD" stroke="#C8D3D4" stroke-width="2"/><rect x="160" y="280" width="850" height="18" rx="0" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="1"/><rect x="160" y="635" width="850" height="18" rx="0" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="1"/><text x="580" y="270" font-family="Arial,sans-serif" font-size="17" fill="#357EA2" font-weight="700" text-anchor="middle" >positive plate</text><text x="580" y="675" font-family="Arial,sans-serif" font-size="17" fill="#B75E53" font-weight="700" text-anchor="middle" >negative plate</text><line x1="260" y1="322" x2="260" y2="595" stroke="#357EA2" stroke-width="3"  marker-end="url(#arrBlue)"/><line x1="420" y1="322" x2="420" y2="595" stroke="#357EA2" stroke-width="3"  marker-end="url(#arrBlue)"/><line x1="580" y1="322" x2="580" y2="595" stroke="#357EA2" stroke-width="3"  marker-end="url(#arrBlue)"/><line x1="740" y1="322" x2="740" y2="595" stroke="#357EA2" stroke-width="3"  marker-end="url(#arrBlue)"/><line x1="900" y1="322" x2="900" y2="595" stroke="#357EA2" stroke-width="3"  marker-end="url(#arrBlue)"/><text x="1045" y="370" font-family="Arial,sans-serif" font-size="20" fill="#357EA2" font-weight="700" text-anchor="start" >E = ΔV/d</text><text x="1045" y="400" font-family="Arial,sans-serif" font-size="18" fill="#357EA2" font-weight="700" text-anchor="start" >= 2.0 × 10³ V/m</text><circle cx="255" cy="455" r="13" fill="#C9A227" stroke="#6A5514" stroke-width="2"/><text x="255" y="430" font-family="Arial,sans-serif" font-size="19" fill="#0B1F3A" font-weight="700" text-anchor="middle" >e⁻</text><path d="M255 455 C430 455 630 432 810 378 C885 356 965 337 1010 326" stroke="#3F8582" stroke-width="6" fill="none"  marker-end="url(#arr)"/><line x1="275" y1="485" x2="430" y2="485" stroke="#C9A227" stroke-width="4"  marker-end="url(#arrGold)"/><text x="355" y="518" font-family="Arial,sans-serif" font-size="18" fill="#C9A227" font-weight="700" text-anchor="middle" >vₓ constant</text><line x1="520" y1="480" x2="520" y2="428" stroke="#B75E53" stroke-width="4"  marker-end="url(#arr)"/><text x="555" y="447" font-family="Arial,sans-serif" font-size="18" fill="#B75E53" font-weight="700" text-anchor="start" >|q|E upward</text><line x1="890" y1="310" x2="890" y2="338" stroke="#20354D" stroke-width="2" stroke-dasharray="3 5" /><text x="913" y="329" font-family="Arial,sans-serif" font-size="18" fill="#20354D" font-weight="700" text-anchor="start" >4.4 mm</text><line x1="250" y1="710" x2="1000" y2="710" stroke="#20354D" stroke-width="2"  marker-end="url(#arr)"/><text x="625" y="740" font-family="Arial,sans-serif" font-size="19" fill="#0B1F3A" font-weight="700" text-anchor="middle" >plate length = 5.0 cm  •  flight time = 5.0 ns</text><rect x="1215" y="240" width="280" height="455" rx="14" fill="#EFF6F6" stroke="#B7D0D0" stroke-width="2"/><text x="1240" y="285" font-family="Arial,sans-serif" font-size="18" fill="#3F8582" font-weight="700" text-anchor="start" >WORKED EXAMPLE</text><text x="1240" y="335" font-family="Arial,sans-serif" font-size="20" fill="#0B1F3A" font-weight="700" text-anchor="start" >ΔV = 40 V</text><text x="1240" y="375" font-family="Arial,sans-serif" font-size="20" fill="#0B1F3A" font-weight="700" text-anchor="start" >d = 2.0 cm</text><text x="1240" y="415" font-family="Arial,sans-serif" font-size="19" fill="#0B1F3A" font-weight="700" text-anchor="start" >vₓ = 1.0 × 10⁷ m/s</text><text x="1240" y="485" font-family="Arial,sans-serif" font-size="19" fill="#20354D" font-weight="700" text-anchor="start" >a = eE/mₑ</text><text x="1240" y="520" font-family="Arial,sans-serif" font-size="18" fill="#20354D" font-weight="600" text-anchor="start" >= 3.51 × 10¹⁴ m/s²</text><text x="1240" y="580" font-family="Arial,sans-serif" font-size="19" fill="#20354D" font-weight="700" text-anchor="start" >y = ½at²</text><text x="1240" y="615" font-family="Arial,sans-serif" font-size="18" fill="#3F8582" font-weight="700" text-anchor="start" >= 4.4 mm &lt; 10 mm</text><text x="1240" y="655" font-family="Arial,sans-serif" font-size="17" fill="#3F8582" font-weight="700" text-anchor="start" >Exit angle θ ≈ 10.0°</text><rect x="105" y="785" width="1390" height="75" rx="12" fill="#FFF7DF" stroke="#E1C568" stroke-width="2"/><text x="800" y="817" font-family="Arial,sans-serif" font-size="20" fill="#0B1F3A" font-weight="700" text-anchor="middle" >Negative electron: force is opposite E, toward the positive plate.</text><text x="800" y="846" font-family="Arial,sans-serif" font-size="16" fill="#52677C" font-weight="400" text-anchor="middle" >The track is a schematic parabola; the numerical exit displacement comes from the source worked example.</text><line x1="55" y1="958" x2="1545" y2="958" stroke="#C9A227" stroke-width="3"/>
