<svg xmlns="http://www.w3.org/2000/svg" width="900" height="920" viewBox="0 0 1000 1022.22" role="img" aria-labelledby="title desc"><title id="title">Heating water: where does the energy go? (Edexcel International GCSE Physics: Paper 2 only)</title><desc id="desc">Marked Paper 2 only: changes of state and the temperature–time graph are 4PH1 statements 5.8P, 5.9P and 5.11P. Schematic graph of temperature in °C against energy supplied, not to scale: ice warms to 0 °C, stays flat at 0 °C while melting, water warms to 100 °C, stays flat at 100 °C while boiling, then steam warms. Particle boxes below show the arrangement in each part: ice, melting, water, boiling, steam. On the flat parts the energy changes the arrangement, not the temperature.</desc><rect width="1000" height="1022.22" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="500" y="62" font-size="36" font-weight="700" fill="#1E2B47" text-anchor="middle">Heating water: where does the energy go?</text>
<text x="500" y="106" font-size="23" fill="#4B5B72" text-anchor="middle">On the flat parts the temperature does not rise</text>
