<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img"><title>Magnetic Fields from a Loop, Arc and Radial Leads</title><desc>Current direction, axial field, arc geometry and cancellation by a nearby straight wire</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#168C8C"/></marker><marker id="arrN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#10233F"/></marker></defs><rect width="1528" height="940" fill="#F3F6F6"/><text x="54" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#10233F">Magnetic Fields from a Loop, Arc and Radial Leads</text><text x="56" y="92" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#53677B">Current direction, axial field, arc geometry and cancellation by a nearby straight wire</text><rect x="42" y="130" width="1444" height="660" rx="18" fill="#FFFFFF" stroke="#CAD6DF" stroke-width="2"/><text x="72" y="174" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">Loop and arc contributions follow the right-hand rule</text><circle cx="240" cy="450" r="92" fill="#F8FBFB" stroke="#315F86" stroke-width="5"/><circle cx="240" cy="450" r="7" fill="#C44949" stroke="#C44949" stroke-width="1"/><text x="240" y="425" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">P</text><path d="M300 382 A92 92 0 0 0 180 382" fill="none" stroke="#168C8C" stroke-width="5" marker-end="url(#arr)"/><text x="240" y="570" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#53677B">loop: R = 0.050 m, I = 2.0 A</text><text x="240" y="610" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">Bloop = 25.13 μT out of page</text><line x1="470" y1="330" x2="470" y2="585" stroke="#10233F" stroke-width="6"/><line x1="470" y1="360" x2="470" y2="470" stroke="#725C8E" stroke-width="4" marker-end="url(#arr)"/><text x="455" y="300" text-anchor="end" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#725C8E">wire I = 18.850 A</text><text x="455" y="324" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#53677B">d = 0.150 m from P</text><text x="240" y="460" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#C44949">⊙</text><text x="430" y="460" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#315F86">×</text><text x="240" y="500" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#C44949">Bloop out</text><text x="430" y="500" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#315F86">Bwire in</text><rect x="545" y="220" width="330" height="405" rx="18" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="570" y="262" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#315F86">Centre of loop</text><text x="570" y="300" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">B = μ₀I/(2R)</text><text x="570" y="350" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#315F86">Arc subtending φ</text><text x="570" y="386" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">B = μ₀Iφ/(4πR)</text><text x="570" y="436" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#C9A227">Radial leads</text><text x="570" y="470" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">dℓ ∥ r̂ ⇒ zero at P</text><line x1="570" y1="495" x2="850" y2="495" stroke="#CAD6DF" stroke-width="2"/><text x="570" y="536" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">Bwire = μ₀I/(2πd)</text><text x="570" y="574" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#168C8C">equal opposite fields ⇒ Bnet = 0</text><text x="710" y="606" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#53677B">at P, for the shown currents</text><rect x="930" y="220" width="500" height="405" rx="18" fill="#F4F1E8" stroke="#F4F1E8" stroke-width="2"/><text x="960" y="262" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#C9A227">Radial leads aimed at P</text><circle cx="1180" cy="440" r="118" fill="none" stroke="#315F86" stroke-width="5"/><path d="M1180 322 A118 118 0 0 1 1290 405" fill="none" stroke="#168C8C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><line x1="1215" y1="350" x2="1235" y2="330" stroke="#168C8C" stroke-width="3" marker-end="url(#arr)"/><line x1="1180" y1="440" x2="1180" y2="322" stroke="#C44949" stroke-width="3"/><line x1="1180" y1="440" x2="1290" y2="405" stroke="#C44949" stroke-width="3"/><text x="1180" y="485" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#10233F">dℓ is parallel to r̂</text><text x="1180" y="525" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#C44949">sinθ = 0 ⇒ dB = 0</text><text x="1180" y="570" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#10233F">Arc length = Rφ</text><text letter-spacing="5" opacity=".08" x="764" y="855" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE STUDY RESOURCES</text><line x1="52" y1="873" x2="1476" y2="873" stroke="#C9A227" stroke-width="2"/><text x="54" y="906" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1305" y="881" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
