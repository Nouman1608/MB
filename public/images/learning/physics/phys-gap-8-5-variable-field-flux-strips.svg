<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="t d"><title id="t">Flux through a rectangle in a variable electric field</title><desc id="d">A rectangular surface in the xy-plane is divided into horizontal strips of width dy and length a. The field E equals b y squared and points normal to the surface, growing upward; strip flux is E(y) a dy and total flux is its integral.</desc>
<rect width="1440" height="820" fill="#F4F7F7"/><text x="70" y="70" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#0B1F3A">Flux through a surface when the field varies</text><text x="72" y="110" font-family="Arial,sans-serif" font-size="19" fill="#52677C">Divide the rectangle into strips where E is nearly constant</text>
<rect x="65" y="145" width="1310" height="555" rx="18" fill="#fff" stroke="#C8D3D4" stroke-width="3"/>
<rect x="220" y="250" width="600" height="350" fill="#EAF3F5" stroke="#3F8582" stroke-width="4"/><path d="M220 530H820M220 460H820M220 390H820M220 320H820" stroke="#8EB8C0" stroke-width="2" stroke-dasharray="8 7"/><rect x="220" y="390" width="600" height="70" fill="#F6EFCF" stroke="#C9A227" stroke-width="3"/><text x="520" y="435" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0B1F3A">one strip: dA = a dy</text>
<path d="M330 540V490M460 540V490M590 540V490M720 540V490" stroke="#357EA2" stroke-width="5" marker-end="url(#arr)"/><path d="M330 440V350M460 440V320M590 440V285M720 440V260" stroke="#B75E53" stroke-width="5" marker-end="url(#arr)"/><text x="520" y="232" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#B75E53">E(y) = b y² grows with y; field is normal to surface</text>
<line x1="220" y1="630" x2="820" y2="630" stroke="#52677C" stroke-width="3" marker-start="url(#dim)" marker-end="url(#dim)"/><text x="520" y="668" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#0B1F3A">rectangle length a</text><line x1="170" y1="600" x2="170" y2="250" stroke="#52677C" stroke-width="3" marker-start="url(#dim)" marker-end="url(#dim)"/><text x="142" y="430" transform="rotate(-90 142 430)" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#0B1F3A">height h</text>
<text x="1010" y="270" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0B1F3A">Add strip contributions</text><text x="1010" y="325" font-family="Arial,sans-serif" font-size="22" fill="#0B1F3A">dΦ = E(y) dA</text><text x="1010" y="370" font-family="Arial,sans-serif" font-size="22" fill="#0B1F3A">dΦ = b y² a dy</text><line x1="1005" y1="405" x2="1315" y2="405" stroke="#C9A227" stroke-width="3"/><text x="1010" y="460" font-family="Arial,sans-serif" font-size="22" fill="#0B1F3A">Φ = ∫₀ʰ b y² a dy</text><text x="1010" y="515" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#3F8582">Φ = abh³ / 3</text><text x="1010" y="575" font-family="Arial,sans-serif" font-size="18" fill="#52677C">The normal E component crosses</text><text x="1010" y="605" font-family="Arial,sans-serif" font-size="18" fill="#52677C">the surface; integrate over y.</text>
<line x1="65" y1="730" x2="1375" y2="730" stroke="#C9A227" stroke-width="3"/><text x="75" y="772" font-family="Arial,sans-serif" font-size="18" fill="#52677C">Schematic strip method for Φ = ∫ E·dA. • Marlbridge Physics</text><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#B75E53"/></marker><marker id="dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#52677C"/></marker></defs><image href="data:image/svg+xml;base64," x="1190" y="748" width="175" height="48" preserveAspectRatio="xMidYMid meet"/></svg>
