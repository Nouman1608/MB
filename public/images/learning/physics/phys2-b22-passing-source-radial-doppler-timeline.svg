</defs><title id="title">A passing source: pitch follows radial motion</title><desc id="desc">A train moves at constant speed along a straight track past a stationary listener. Its radial velocity is toward the listener before closest approach, zero at closest approach, and away afterward. A qualitative frequency-time curve falls from above the rest frequency f0 through f0 near closest approach to below f0. Loudness is shown as a separate distance effect. Assumes sound in still air; plot is not to scale.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial, Liberation Sans, sans-serif"><text x="58" y="74" fill="#0B1F3A" font-size="38" font-weight="700" text-anchor="start">A passing source: pitch follows radial motion</text><text x="60" y="116" fill="#637783" font-size="20" font-weight="500" text-anchor="start">As a sound source passes a stationary listener, the line-of-sight velocity changes from toward, through zero, to away.</text><rect x="55" y="145" width="1490" height="780" rx="18" fill="#FFFFFF" stroke="#CBD7D9" stroke-width="2"/><rect x="82" y="205" width="920" height="645" rx="18" fill="#FFFFFF" stroke="#CBD7D9" stroke-width="2"/><rect x="1040" y="205" width="475" height="645" rx="18" fill="#F7FAFA" stroke="#CBD7D9" stroke-width="2"/><text x="542" y="255" fill="#108B88" font-size="22" font-weight="700" text-anchor="middle">Stationary listener • train moves at constant speed</text><text x="1277" y="255" fill="#108B88" font-size="22" font-weight="700" text-anchor="middle">Observed frequency</text><line x1="145" y1="600" x2="935" y2="600" stroke="#0B1F3A" stroke-width="4"/><circle cx="540" cy="735" r="24" fill="#F7DDDA" stroke="#C85C5C" stroke-width="3"/><text x="540" y="783" fill="#0B1F3A" font-size="16" font-weight="600" text-anchor="middle">listener</text><line x1="540" y1="710" x2="540" y2="620" stroke="#C85C5C" stroke-width="2" stroke-dasharray="6 5"/><circle cx="310" cy="600" r="17" fill="#DDECEF" stroke="#3C7EA7" stroke-width="3"/><text x="310" y="560" fill="#3C7EA7" font-size="15" font-weight="600" text-anchor="middle">approaching</text><circle cx="540" cy="600" r="17" fill="#DDECEF" stroke="#3C7EA7" stroke-width="3"/><text x="540" y="560" fill="#108B88" font-size="15" font-weight="700" text-anchor="middle">closest</text><circle cx="770" cy="600" r="17" fill="#DDECEF" stroke="#3C7EA7" stroke-width="3"/><text x="770" y="560" fill="#D8A927" font-size="15" font-weight="600" text-anchor="middle">receding</text><line x1="250" y1="480" x2="830" y2="480" stroke="#3C7EA7" stroke-width="4" marker-end="url(#aB)"/><text x="540" y="455" fill="#3C7EA7" font-size="16" font-weight="600" text-anchor="middle">train velocity</text><line x1="310" y1="625" x2="355" y2="674" stroke="#3C7EA7" stroke-width="4" marker-end="url(#aB)"/><text x="270" y="690" fill="#3C7EA7" font-size="13" font-weight="600" text-anchor="middle">radial motion toward listener</text><text x="540" y="686" fill="#108B88" font-size="13" font-weight="600" text-anchor="middle">v perpendicular to line of sight</text><line x1="770" y1="625" x2="815" y2="580" stroke="#D8A927" stroke-width="4" marker-end="url(#aN)"/><text x="820" y="690" fill="#D8A927" font-size="13" font-weight="600" text-anchor="middle">radial motion away</text><line x1="1110" y1="625" x2="1450" y2="625" stroke="#0B1F3A" stroke-width="3" marker-end="url(#aN)"/><line x1="1110" y1="625" x2="1110" y2="345" stroke="#0B1F3A" stroke-width="3" marker-end="url(#aN)"/><line x1="1110" y1="490.0" x2="1450" y2="490.0" stroke="#637783" stroke-width="2" stroke-dasharray="6 5"/><path d="M 1128 407 C 1205 417 1222 460 1270 490 C 1325 530 1365 573 1432 581" fill="none" stroke="#108B88" stroke-width="5"/><line x1="1280" y1="354" x2="1280" y2="625" stroke="#D8A927" stroke-width="2" stroke-dasharray="6 5"/><text x="1092" y="495.0" fill="#637783" font-size="15" font-weight="600" text-anchor="end">f₀</text><text x="1280" y="651" fill="#0B1F3A" font-size="14" font-weight="600" text-anchor="middle">closest approach</text><text x="1450" y="651" fill="#0B1F3A" font-size="15" font-weight="700" text-anchor="end">time</text><text x="1190" y="425" fill="#108B88" font-size="14" font-weight="600" text-anchor="middle">higher pitch</text><text x="1372" y="570" fill="#D8A927" font-size="14" font-weight="600" text-anchor="middle">lower</text><text x="1277" y="740" fill="#637783" font-size="14" font-weight="500" text-anchor="middle">Sound in still air; qualitative curve.</text><text x="1277" y="775" fill="#0B1F3A" font-size="15" font-weight="600" text-anchor="middle">Loudness changes with distance,</text><text x="1277" y="800" fill="#0B1F3A" font-size="15" font-weight="600" text-anchor="middle">independently of pitch.</text><text x="800" y="942" fill="#A9BABC" font-size="26" font-weight="700" text-anchor="middle" opacity="0.24" letter-spacing="2">MARLBRIDGE STUDY RESOURCES</text><line x1="55" y1="960" x2="1545" y2="960" stroke="#D8A927" stroke-width="2"/><text x="64" y="997" fill="#637783" font-size="14" font-weight="500" text-anchor="start">Marlbridge • Physics study resource • Schematic; labels state key assumptions</text><image x="1260" y="968" width="285" height="47" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/></g></svg>