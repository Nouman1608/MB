<svg xmlns="http://www.w3.org/2000/svg" width="900" height="910" viewBox="0 0 1000 1011.11" role="img" aria-labelledby="title desc"><title id="title">Speed and distance of galaxies (Edexcel International GCSE Physics: Paper 2 only)</title><desc id="desc">Marked Paper 2 only: red-shift of galaxies at different distances and the expansion of the universe are 4PH1 statements 8.17P and 8.18P. Graph of recession speed v (10^7 m/s) against distance d (10^8 light-years): a straight line through the origin; further galaxies move away faster. A highlighted galaxy at 5.3 × 10^8 light-years moves at 1.1 × 10^7 m/s. The gradient label H0 = v / d and the estimate of the age of the Universe, 1 / H0 ≈ 1.4 × 10^10 years (about 14 billion), are grey and marked not required by Edexcel: 4PH1 does not include the Hubble constant.</desc><rect width="1000" height="1011.11" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><rect x="35" y="120" width="190" height="38" rx="19" fill="#8A6A0C"/><text x="130" y="147.64" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">Paper 2 only</text>
