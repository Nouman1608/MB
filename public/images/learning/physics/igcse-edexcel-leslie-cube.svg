<svg xmlns="http://www.w3.org/2000/svg" width="900" height="930" viewBox="0 0 1000 1033.33" role="img" aria-labelledby="title desc"><title id="title">Which surface emits most? (Edexcel International GCSE Physics)</title><desc id="desc">A Leslie cube full of hot water with detectors at the same distance from two faces. The dull black face sends out much infrared and gives the biggest reading; the shiny silver face gives a small reading. Below: an object emits faster if it is hotter (same size) or has a larger surface area (same temperature). No tier labels: emission related to surface and temperature is 4PH1 4.8, on both papers.</desc><rect width="1000" height="1033.33" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="500" y="62" font-size="36" font-weight="700" fill="#1E2B47" text-anchor="middle">Which surface emits most?</text>
