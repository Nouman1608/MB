<line x1="458" y1="433" x2="458" y2="476" stroke="#8A6A0C" stroke-width="4" stroke-linecap="round"/><polygon points="458,500 442.4,474 473.6,474" fill="#8A6A0C"/>
<text x="480" y="480.5" font-size="24" font-weight="700" fill="#8A6A0C">x</text>
<text x="388" y="766" font-size="25" font-weight="700" fill="#1E2B47" text-anchor="middle">x = 0.04 m</text>
<text x="388" y="816" font-size="25" fill="#1E2B47" text-anchor="middle">2 ÷ 0.04</text>
<text x="388" y="862" font-size="25" font-weight="700" fill="#2F6B63" text-anchor="middle">= 50 N/m</text>
<path d="M610 212 L610 235 L640 256.6 L580 278.3 L640 299.9 L580 321.6 L640 343.2 L580 364.9 L640 386.5 L580 408.1 L640 429.8 L580 451.4 L640 473.1 L580 494.7 L640 516.4 L610 538.0 L610 588" fill="none" stroke="#1E2B47" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
