<text x="610" y="766" font-size="25" font-weight="700" fill="#1E2B47" text-anchor="middle">x = 0.08 m</text>
<text x="610" y="816" font-size="25" fill="#1E2B47" text-anchor="middle">4 ÷ 0.08</text>
<text x="610" y="862" font-size="25" font-weight="700" fill="#2F6B63" text-anchor="middle">= 50 N/m</text>
