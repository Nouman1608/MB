<svg xmlns="http://www.w3.org/2000/svg" width="900" height="820" viewBox="0 0 1000 911.11" role="img" aria-labelledby="title desc"><title id="title">Extension of a spring (OxfordAQA International GCSE Physics)</title><desc id="desc">Four identical springs hang from a bar with loads of 0, 2, 4 and 6 N. A dashed line marks the natural length; the extension x is measured down from it and is 0, 0.04, 0.08 and 0.12 m. F ÷ x is 2 ÷ 0.04, 4 ÷ 0.08 and 6 ÷ 0.12, each 50 N/m: the spring constant (9203 3.1.5h writes F = k × e). No tier labels.</desc><rect width="1000" height="911.11" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="500" y="62" font-size="36" font-weight="700" fill="#1E2B47" text-anchor="middle">Extension = stretched − natural length</text>
<text x="500" y="106" font-size="23" fill="#4B5B72" text-anchor="middle">Spring constant k = F ÷ x</text>
<rect x="65" y="178" width="868" height="32" rx="6" fill="#B5D4CF" stroke="#1E2B47" stroke-width="2.5"/>
<line x1="65" y1="433" x2="935" y2="433" stroke="#8A6A0C" stroke-width="3" stroke-dasharray="12 8"/>
<path d="M165 212 L165 235 L195 247.1 L135 259.3 L195 271.4 L135 283.6 L195 295.7 L135 307.9 L195 320.0 L135 332.1 L195 344.3 L135 356.4 L195 368.6 L135 380.7 L195 392.9 L165 405.0 L165 455" fill="none" stroke="#1E2B47" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="125" y="455" width="80" height="62" rx="6" fill="#F2E6B7" stroke="#8A6A0C" stroke-width="3"/>
<text x="165" y="497" font-size="26" font-weight="700" fill="#1E2B47" text-anchor="middle">0 N</text>
<text x="165" y="766" font-size="25" font-weight="700" fill="#1E2B47" text-anchor="middle">x = 0</text>
<path d="M388 212 L388 235 L418 251.9 L358 268.9 L418 285.8 L358 302.7 L418 319.6 L358 336.6 L418 353.5 L358 370.4 L418 387.4 L358 404.3 L418 421.2 L358 438.1 L418 455.1 L388 472.0 L388 522" fill="none" stroke="#1E2B47" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
