<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="t d"><title id="t">Charged spheres: conductor and insulator</title><desc id="d">Two isolated, positively charged spheres with the same total charge Q and radius R are compared. In the conducting sphere, excess charge is on the outer surface and the electrostatic field in the conducting material is zero; just outside the surface the field is perpendicular, and outside it is radial with magnitude kQ over r squared. In the uniformly charged insulating sphere, positive charge is distributed through its volume; its internal field is nonzero away from the centre, represented qualitatively by radial arrows increasing with distance from the centre. Outside, the field follows the same kQ over r squared relation. The conductor is assumed to have no charged object inside a cavity.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial, Liberation Sans, sans-serif"><text x="58" y="74" fill="#0B1F3A" font-size="37" font-weight="700">Charged spheres: conductor and insulator</text><text x="60" y="116" fill="#637783" font-size="20">The material changes the field inside; spherical symmetry gives the same exterior rule.</text><rect x="55" y="150" width="1490" height="710" rx="18" fill="#FFFFFF" stroke="#CBD7D9" stroke-width="2"/><rect x="80" y="190" width="700" height="610" rx="16" fill="#F7FAFA" stroke="#CBD7D9" stroke-width="2"/><rect x="820" y="190" width="700" height="610" rx="16" fill="#F7FAFA" stroke="#CBD7D9" stroke-width="2"/><text x="430" y="235" text-anchor="middle" fill="#0B1F3A" font-size="22" font-weight="700">Conductor • electrostatic equilibrium</text><text x="1170" y="235" text-anchor="middle" fill="#0B1F3A" font-size="22" font-weight="700">Insulator • charge fixed in material</text><circle cx="430" cy="485" r="150" fill="#EAF4F3" stroke="#3C7EA7" stroke-width="4"/><circle cx="1170" cy="485" r="150" fill="#F7F1DE" stroke="#D6A72C" stroke-width="4"/><text x="430" y="490" text-anchor="middle" fill="#0B1F3A" font-size="21" font-weight="700">E = 0</text><text x="430" y="518" text-anchor="middle" fill="#637783" font-size="15">inside conducting material</text><g fill="#C85C5C" stroke="#FFFFFF" stroke-width="2"><circle cx="430" cy="335" r="10"/><circle cx="536" cy="379" r="10"/><circle cx="580" cy="485" r="10"/><circle cx="536" cy="591" r="10"/><circle cx="430" cy="635" r="10"/><circle cx="324" cy="591" r="10"/><circle cx="280" cy="485" r="10"/><circle cx="324" cy="379" r="10"/></g><g fill="#C85C5C"><circle cx="1170" cy="485" r="8"/><circle cx="1170" cy="432" r="8"/><circle cx="1215" cy="460" r="8"/><circle cx="1125" cy="460" r="8"/><circle cx="1210" cy="520" r="8"/><circle cx="1130" cy="520" r="8"/><circle cx="1170" cy="538" r="8"/><circle cx="1170" cy="385" r="8"/><circle cx="1270" cy="485" r="8"/><circle cx="1070" cy="485" r="8"/></g><text x="1170" y="680" text-anchor="middle" fill="#C85C5C" font-size="17" font-weight="700">E can be non-zero inside</text><g stroke="#108B88" stroke-width="4" fill="none"><line x1="430" y1="335" x2="430" y2="280"/><line x1="580" y1="485" x2="635" y2="485"/><line x1="536" y1="591" x2="575" y2="630"/><line x1="1170" y1="435" x2="1170" y2="410"/><line x1="1215" y1="460" x2="1255" y2="445"/><line x1="1270" y1="485" x2="1330" y2="485"/><line x1="1070" y1="485" x2="1010" y2="485"/></g><g fill="#108B88"><path d="M430 268l-8 15h16z"/><path d="M642 485l-15-8v16z"/><path d="M581 636l-16-5 11-11z"/><path d="M1170 437l-8 14h16z"/><path d="M1263 442l-16-1 10 12z"/><path d="M1337 485l-15-8v16z"/><path d="M1003 485l15-8v16z"/></g><text x="430" y="715" text-anchor="middle" fill="#108B88" font-size="16" font-weight="700">Just outside: E is normal to the surface</text><text x="1170" y="715" text-anchor="middle" fill="#637783" font-size="15">Arrow lengths are qualitative; uniform volume charge only.</text><rect x="125" y="755" width="1350" height="50" rx="10" fill="#FFF5DB" stroke="#D6A72C" stroke-width="2"/><text x="800" y="787" text-anchor="middle" fill="#0B1F3A" font-size="17" font-weight="700">For both spheres with the same total Q and spherical symmetry: outside, E = kQ/r² for r ≥ R.</text><text x="800" y="838" text-anchor="middle" fill="#637783" font-size="14">Conductor statement assumes no charged object inside a cavity • positive Q shown • schematic, not to scale</text></g><text x="800" y="942" fill="#A9BABC" font-size="26" font-weight="700" text-anchor="middle" opacity=".24" letter-spacing="2">MARLBRIDGE STUDY RESOURCES</text><line x1="55" y1="964" x2="1545" y2="964" stroke="#C9A227" stroke-width="2"/><text x="58" y="1000" fill="#0B1F3A" font-size="17" font-weight="700">MARLBRIDGE • STUDY RESOURCE</text><image x="1260" y="968" width="285" height="70" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/></svg>
