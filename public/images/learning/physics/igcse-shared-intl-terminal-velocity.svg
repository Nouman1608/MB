<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1067" viewBox="0 0 1000 1185.56" role="img" aria-labelledby="title desc"><title id="title">Falling with air resistance: terminal velocity</title><desc id="desc">Illustrative speed–time graph for a skydiver: speed rises from 0, steeply at first, then levels off at 50 m/s, the terminal velocity, shown dashed. Points A (start), B (about 35 m/s at 4.5 s) and C (50 m/s) are marked. Force diagrams below: at A only the weight acts; at B the upward drag is smaller than the weight, so the skydiver still speeds up; at C drag equals weight, so the speed is constant. No tier labels: terminal velocity is on both Edexcel International GCSE papers (4PH1 1.21) and in OxfordAQA 9203 3.1.6b, which is untiered.</desc><rect width="1000" height="1185.56" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="500" y="62" font-size="36" font-weight="700" fill="#1E2B47" text-anchor="middle">Falling with air resistance</text>
