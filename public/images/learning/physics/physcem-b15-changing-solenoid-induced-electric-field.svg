<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
<title id="title">Induced electric field around a changing solenoid field</title><desc id="desc">A uniform solenoid field increasing out of the page induces clockwise closed electric-field loops. Inside radius R, E=(r/2)dB/dt; outside, E=(R²/2r)dB/dt. The E field exists outside the solenoid even where B is nearly zero.</desc><defs>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#20354D"/></marker>
      <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#357EA2"/></marker>
      <marker id="arrGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#C9A227"/></marker>
    </defs>
<rect width="1600" height="1050" fill="#F4F7F7"/><text x="54" y="58" font-family="Arial,sans-serif" font-size="34" fill="#0B1F3A" font-weight="700" text-anchor="start" >Induced electric field around a changing solenoid field</text><text x="56" y="96" font-family="Arial,sans-serif" font-size="18" fill="#52677C" font-weight="400" text-anchor="start" >Marlbridge • AP Physics C: Electricity and Magnetism • teaching diagram</text>
<rect x="55" y="135" width="1490" height="760" rx="16" fill="white" stroke="#C8D3D4" stroke-width="2"/><text x="100" y="185" font-family="Arial,sans-serif" font-size="26" fill="#0B1F3A" font-weight="700" text-anchor="start" >A changing axial B field creates closed, non-conservative E loops</text><rect x="90" y="230" width="710" height="620" rx="16" fill="#FCFDFD" stroke="#C8D3D4" stroke-width="2"/><rect x="825" y="230" width="680" height="620" rx="16" fill="#FCFDFD" stroke="#C8D3D4" stroke-width="2"/><text x="445" y="275" font-family="Arial,sans-serif" font-size="20" fill="#357EA2" font-weight="700" text-anchor="middle" >CROSS-SECTION</text><text x="1165" y="275" font-family="Arial,sans-serif" font-size="20" fill="#3F8582" font-weight="700" text-anchor="middle" >E MAGNITUDE VS RADIUS</text><circle cx="445" cy="490" r="130" fill="#EAF3F5" stroke="#357EA2" stroke-width="4" stroke-dasharray="10 6"/><circle cx="400" cy="450" r="16" fill="white" stroke="#357EA2" stroke-width="2"/><circle cx="400" cy="450" r="5" fill="#357EA2"/><circle cx="490" cy="450" r="16" fill="white" stroke="#357EA2" stroke-width="2"/><circle cx="490" cy="450" r="5" fill="#357EA2"/><circle cx="400" cy="530" r="16" fill="white" stroke="#357EA2" stroke-width="2"/><circle cx="400" cy="530" r="5" fill="#357EA2"/><circle cx="490" cy="530" r="16" fill="white" stroke="#357EA2" stroke-width="2"/><circle cx="490" cy="530" r="5" fill="#357EA2"/><circle cx="445" cy="490" r="16" fill="white" stroke="#357EA2" stroke-width="2"/><circle cx="445" cy="490" r="5" fill="#357EA2"/><circle cx="445" cy="490" r="70" fill="none" stroke="#C9A227" stroke-width="5"/><path d="M445 420 A70 70 0 0 1 515 490" stroke="#C9A227" stroke-width="5" fill="none"  marker-end="url(#arrGold)"/><circle cx="445" cy="490" r="195" fill="none" stroke="#3F8582" stroke-width="5"/><path d="M445 295 A195 195 0 0 1 640 490" stroke="#3F8582" stroke-width="5" fill="none"  marker-end="url(#arr)"/><text x="445" y="715" font-family="Arial,sans-serif" font-size="16" fill="#357EA2" font-weight="700" text-anchor="middle" >Increasing B out of page (⊙) inside radius R</text><text x="445" y="748" font-family="Arial,sans-serif" font-size="16" fill="#3F8582" font-weight="700" text-anchor="middle" >Clockwise induced E (Lenz’s law)</text><text x="445" y="788" font-family="Arial,sans-serif" font-size="21" fill="#0B1F3A" font-weight="700" text-anchor="middle" >∮E·dℓ = −dΦB/dt</text><line x1="930" y1="680" x2="1430" y2="680" stroke="#20354D" stroke-width="2"  marker-end="url(#arr)"/><line x1="1035" y1="705" x2="1035" y2="330" stroke="#20354D" stroke-width="2"  marker-end="url(#arr)"/><text x="1430" y="708" font-family="Arial,sans-serif" font-size="16" fill="#0B1F3A" font-weight="700" text-anchor="start" >radius r</text><text x="1035" y="315" font-family="Arial,sans-serif" font-size="18" fill="#0B1F3A" font-weight="700" text-anchor="middle" >E</text><path d="M1040 690 L1190 430 L1210 430 C1290 515 1360 580 1420 620" stroke="#B75E53" stroke-width="6" fill="none"  /><line x1="1210" y1="420" x2="1210" y2="735" stroke="#52677C" stroke-width="2" stroke-dasharray="6 5" /><text x="1080" y="390" font-family="Arial,sans-serif" font-size="16" fill="#B75E53" font-weight="700" text-anchor="middle" >inside: E = (r/2) dB/dt</text><text x="1370" y="465" font-family="Arial,sans-serif" font-size="16" fill="#B75E53" font-weight="700" text-anchor="middle" >outside:</text><text x="1370" y="490" font-family="Arial,sans-serif" font-size="16" fill="#B75E53" font-weight="700" text-anchor="middle" >E = (R²/2r) dB/dt</text><text x="1270" y="395" font-family="Arial,sans-serif" font-size="16" fill="#52677C" font-weight="700" text-anchor="middle" >R = 0.025 m</text><text x="1165" y="760" font-family="Arial,sans-serif" font-size="16" fill="#0B1F3A" font-weight="700" text-anchor="middle" >dB/dt = 0.40 T/s • r = 0.010 m → 2.0 mV/m</text><text x="1165" y="795" font-family="Arial,sans-serif" font-size="15" fill="#0B1F3A" font-weight="700" text-anchor="middle" >r = R = 0.025 m → 5.0 mV/m • r = 0.050 m → 2.5 mV/m</text><rect x="105" y="875" width="1390" height="54" rx="10" fill="#FFF7DF" stroke="#E1C568" stroke-width="2"/><text x="800" y="909" font-family="Arial,sans-serif" font-size="18" fill="#0B1F3A" font-weight="700" text-anchor="middle" >The induced E loop extends beyond the solenoid, even where its magnetic field is nearly zero.</text><line x1="55" y1="958" x2="1545" y2="958" stroke="#C9A227" stroke-width="3"/>
