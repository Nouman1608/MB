<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Permanent and induced magnetism</title><desc id="dsc">Three panels compare a mixed-domain iron clip, alignment when a bar magnet&#x27;s north pole is brought near (induced south pole at the near end), and a simplified disordered state after removing the field. Real materials can retain remanence.</desc><defs>
<marker id="arrN" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#0B1F3A"/></marker>
<marker id="arrB" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#3C7EA7"/></marker>
<marker id="arrT" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#108B88"/></marker>
<marker id="arrG" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#D8A927"/></marker>
<marker id="arrR" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#C85C5C"/></marker>
</defs>
<rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial, Liberation Sans, sans-serif">
<text x="60" y="70" fill="#0B1F3A" font-size="38" font-weight="700" text-anchor="start" >Permanent and induced magnetism</text><text x="62" y="112" fill="#637783" font-size="20" font-weight="500" text-anchor="start" >A field can align domains; permanence depends on whether alignment remains after the field is removed.</text>
<rect x="55" y="145" width="1490" height="780" rx="22" fill="#FFFFFF" stroke="#CBD7D9" stroke-width="2" /><rect x="82" y="205" width="445" height="640" rx="16" fill="#FFFFFF" stroke="#CAD8DC" stroke-width="2" /><text x="106" y="245" fill="#108B88" font-size="24" font-weight="700" text-anchor="start" >1  No external field</text><rect x="578" y="205" width="445" height="640" rx="16" fill="#FFFFFF" stroke="#CAD8DC" stroke-width="2" /><text x="602" y="245" fill="#108B88" font-size="24" font-weight="700" text-anchor="start" >2  Field induces alignment</text><rect x="1074" y="205" width="445" height="640" rx="16" fill="#FFFFFF" stroke="#CAD8DC" stroke-width="2" /><text x="1098" y="245" fill="#108B88" font-size="24" font-weight="700" text-anchor="start" >3  Field removed (idealised)</text><text x="304" y="278" fill="#0B1F3A" font-size="21" font-weight="700" text-anchor="middle" >Unmagnetised paper clip</text><text x="304" y="318" fill="#637783" font-size="17" font-weight="500" text-anchor="middle" >Domain directions are mixed</text><rect x="168" y="438" width="280" height="126" rx="32" fill="#EEF3F3" stroke="#95A9AE" stroke-width="4" /><text x="308" y="416" fill="#637783" font-size="16" font-weight="500" text-anchor="middle" >iron clip</text><line x1="192" y1="478" x2="228" y2="478" stroke="#3C7EA7" stroke-width="3" marker-end="url(#arrB)" /><line x1="288" y1="526" x2="252" y2="526" stroke="#3C7EA7" stroke-width="3" marker-end="url(#arrR)" /><line x1="353" y1="475" x2="317" y2="475" stroke="#3C7EA7" stroke-width="3" marker-end="url(#arrR)" /><line x1="382" y1="526" x2="418" y2="526" stroke="#3C7EA7" stroke-width="3" marker-end="url(#arrB)" /><line x1="217" y1="540" x2="253" y2="540" stroke="#3C7EA7" stroke-width="3" marker-end="url(#arrB)" /><line x1="383" y1="455" x2="347" y2="455" stroke="#3C7EA7" stroke-width="3" marker-end="url(#arrR)" /><text x="304" y="630" fill="#0B1F3A" font-size="19" font-weight="600" text-anchor="middle" >No overall pole is exposed</text><text x="304" y="665" fill="#637783" font-size="17" font-weight="500" text-anchor="middle" >The domains partly cancel</text><rect x="640" y="460" width="185" height="104" rx="28" fill="#EEF3F3" stroke="#95A9AE" stroke-width="4" /><text x="732" y="451" fill="#637783" font-size="16" font-weight="500" text-anchor="middle" >iron clip</text><rect x="620" y="360" width="80" height="78" rx="8" fill="#C85C5C" stroke="#C85C5C" stroke-width="1" /><rect x="700" y="360" width="80" height="78" rx="8" fill="#3C7EA7" stroke="#3C7EA7" stroke-width="1" /><text x="660" y="410" fill="#FFFFFF" font-size="29" font-weight="700" text-anchor="middle" >S</text><text x="740" y="410" fill="#FFFFFF" font-size="29" font-weight="700" text-anchor="middle" >N</text><text x="700" y="337" fill="#637783" font-size="16" font-weight="500" text-anchor="middle" >bar magnet</text><text x="842" y="405" fill="#0B1F3A" font-size="17" font-weight="600" text-anchor="middle" >N pole faces the clip</text><line x1="818" y1="420" x2="818" y2="455" stroke="#D8A927" stroke-width="3" marker-end="url(#arrG)" /><text x="698" y="600" fill="#C85C5C" font-size="20" font-weight="700" text-anchor="middle" >induced S</text><text x="808" y="600" fill="#3C7EA7" font-size="20" font-weight="700" text-anchor="middle" >induced N</text><line x1="705" y1="570" x2="750" y2="520" stroke="#C85C5C" stroke-width="3" marker-end="url(#arrR)" /><line x1="840" y1="568" x2="882" y2="520" stroke="#3C7EA7" stroke-width="3" marker-end="url(#arrB)" /><line x1="614" y1="690" x2="646" y2="690" stroke="#108B88" stroke-width="3" marker-end="url(#arrT)" /><line x1="684" y1="690" x2="716" y2="690" stroke="#108B88" stroke-width="3" marker-end="url(#arrT)" /><line x1="754" y1="690" x2="786" y2="690" stroke="#108B88" stroke-width="3" marker-end="url(#arrT)" /><line x1="824" y1="690" x2="856" y2="690" stroke="#108B88" stroke-width="3" marker-end="url(#arrT)" /><line x1="614" y1="730" x2="646" y2="730" stroke="#108B88" stroke-width="3" marker-end="url(#arrT)" /><line x1="684" y1="730" x2="716" y2="730" stroke="#108B88" stroke-width="3" marker-end="url(#arrT)" /><line x1="754" y1="730" x2="786" y2="730" stroke="#108B88" stroke-width="3" marker-end="url(#arrT)" /><line x1="824" y1="730" x2="856" y2="730" stroke="#108B88" stroke-width="3" marker-end="url(#arrT)" /><text x="800" y="790" fill="#0B1F3A" font-size="18" font-weight="600" text-anchor="middle" >Dipoles line up with the applied field</text><rect x="1160" y="438" width="330" height="126" rx="32" fill="#EEF3F3" stroke="#95A9AE" stroke-width="4" /><text x="1325" y="416" fill="#637783" font-size="16" font-weight="500" text-anchor="middle" >same iron clip</text><line x1="1190" y1="478" x2="1226" y2="478" stroke="#3C7EA7" stroke-width="3" marker-end="url(#arrB)" /><line x1="1286" y1="526" x2="1250" y2="526" stroke="#3C7EA7" stroke-width="3" marker-end="url(#arrR)" /><line x1="1351" y1="475" x2="1315" y2="475" stroke="#3C7EA7" stroke-width="3" marker-end="url(#arrR)" /><line x1="1380" y1="526" x2="1416" y2="526" stroke="#3C7EA7" stroke-width="3" marker-end="url(#arrB)" /><line x1="1215" y1="540" x2="1251" y2="540" stroke="#3C7EA7" stroke-width="3" marker-end="url(#arrB)" /><line x1="1381" y1="455" x2="1345" y2="455" stroke="#3C7EA7" stroke-width="3" marker-end="url(#arrR)" /><line x1="1432" y1="480" x2="1468" y2="480" stroke="#3C7EA7" stroke-width="3" marker-end="url(#arrB)" /><text x="1298" y="635" fill="#0B1F3A" font-size="18" font-weight="600" text-anchor="middle" >Alignment is no longer maintained</text><text x="1298" y="672" fill="#637783" font-size="15" font-weight="500" text-anchor="middle" >Real materials can retain some magnetisation</text><text x="1298" y="700" fill="#637783" font-size="15" font-weight="500" text-anchor="middle" >depending on their properties.</text><rect x="250" y="770" width="1100" height="52" rx="12" fill="#FFF5DA" stroke="#E5C971" stroke-width="2" /><text x="800" y="803" fill="#0B1F3A" font-size="17" font-weight="600" text-anchor="middle" >Induced magnetism is temporary in this simplified model; permanent magnets retain domain alignment.</text>
