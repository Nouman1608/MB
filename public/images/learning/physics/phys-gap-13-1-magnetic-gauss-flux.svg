<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img"><title>Zero Net Magnetic Flux Through a Closed Surface</title><desc>Dipole field lines and explicit outward normals for a bowl closed by a disc</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#168C8C"/></marker><marker id="arrN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#10233F"/></marker></defs><rect width="1528" height="940" fill="#F3F6F6"/><text x="54" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#10233F">Zero Net Magnetic Flux Through a Closed Surface</text><text x="56" y="92" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#53677B">Dipole field lines and explicit outward normals for a bowl closed by a disc</text><rect x="42" y="130" width="700" height="660" rx="18" fill="#FFFFFF" stroke="#CAD6DF" stroke-width="2"/><rect x="766" y="130" width="720" height="660" rx="18" fill="#FFFFFF" stroke="#CAD6DF" stroke-width="2"/><text x="70" y="174" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">Magnetic dipole lines have no local endpoints</text><text x="794" y="174" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233F">Bowl plus disc: outward normals close the surface</text><circle cx="390" cy="470" r="210" fill="#F8FBFB" stroke="#315F86" stroke-width="4"/><circle cx="390" cy="410" r="28" fill="#C44949" stroke="#C44949" stroke-width="1"/><circle cx="390" cy="530" r="28" fill="#315F86" stroke="#315F86" stroke-width="1"/><text x="390" y="414" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">N</text><text x="390" y="534" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">S</text><path d="M290 385 C220 310 235 615 290 570 C350 520 345 340 290 385" fill="none" stroke="#168C8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M340 385 C270 310 285 615 340 570 C400 520 395 340 340 385" fill="none" stroke="#168C8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M440 385 C370 310 385 615 440 570 C500 520 495 340 440 385" fill="none" stroke="#168C8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M490 385 C420 310 435 615 490 570 C550 520 545 340 490 385" fill="none" stroke="#168C8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="390" y="730" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">Closed surface: ∮ B·dA = 0</text><text x="390" y="760" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#53677B">equal net flux enters and leaves</text><path d="M850 520 Q1110 700 1400 520" fill="none" stroke="#315F86" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><line x1="850" y1="520" x2="1400" y2="520" stroke="#C9A227" stroke-width="4" stroke-dasharray="7 6"/><path d="M850 520 Q1110 700 1400 520 M850 520 Q1110 340 1400 520" fill="none" stroke="#168C8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="1110" y1="520" x2="1110" y2="442" stroke="#725C8E" stroke-width="4" marker-end="url(#arr)"/><text x="1125" y="454" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#725C8E">n̂disc</text><line x1="920" y1="565" x2="875" y2="605" stroke="#725C8E" stroke-width="4" marker-end="url(#arr)"/><text x="850" y="626" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#725C8E">n̂bowl</text><line x1="1300" y1="565" x2="1345" y2="605" stroke="#725C8E" stroke-width="4" marker-end="url(#arr)"/><text x="1350" y="626" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#725C8E">outward</text><line x1="950" y1="540" x2="980" y2="540" stroke="#C44949" stroke-width="3" marker-end="url(#arr)"/><line x1="1300" y1="540" x2="1270" y2="540" stroke="#C44949" stroke-width="3" marker-end="url(#arr)"/><text x="1110" y="662" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">bowl surface + closing disc</text><text x="1110" y="705" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#168C8C">∮ B·dA = 0; normals point outward</text><text x="1110" y="746" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#53677B">for both parts of the closed surface</text><text letter-spacing="5" opacity=".08" x="764" y="855" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE STUDY RESOURCES</text><line x1="52" y1="873" x2="1476" y2="873" stroke="#C9A227" stroke-width="2"/><text x="54" y="906" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1305" y="881" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
