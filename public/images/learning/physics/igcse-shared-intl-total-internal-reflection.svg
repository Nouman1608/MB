<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1160" viewBox="0 0 1000 1288.89" role="img" aria-labelledby="title desc"><title id="title">Total internal reflection</title><desc id="desc">Three rays inside a glass semicircle (n = 1.5), each aimed at the centre of the flat face. At i = 30°, less than the critical angle, some light leaves, refracted away from the normal to about 49°, and some reflects (dashed). At i = c = 42° the refracted ray runs along the surface. At i = 62°, more than c, all the light reflects: total internal reflection. A box gives sin c = 1 ÷ n = 1 ÷ 1.5, so c = 41.8°. No tier labels: Edexcel 4PH1 3.20–3.22 (both papers) and OxfordAQA 9203 3.3.5f–g (untiered).</desc><rect width="1000" height="1288.89" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="500" y="62" font-size="36" font-weight="700" fill="#1E2B47" text-anchor="middle">Total internal reflection</text>
<text x="500" y="106" font-size="23" fill="#4B5B72" text-anchor="middle">Light inside a glass semicircle, n = 1.5</text>
<rect x="33" y="166" width="934" height="300" rx="14" fill="#FFFFFF" stroke="#1E2B47" stroke-width="2.5"/>
<path d="M145 289 H411 A133 133 0 0 1 145 289Z" fill="#DDEBE8" stroke="#2F6B63" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="278" y1="194" x2="278" y2="289" stroke="#1E2B47" stroke-width="2" stroke-dasharray="7 6"/>
<line x1="211.5" y1="404.2" x2="278" y2="289" stroke="#8A6A0C" stroke-width="4" stroke-linecap="round"/>
<polygon points="251.8,334.5 252.5,374.1 217.1,353.7" fill="#8A6A0C"/>
<line x1="278" y1="289" x2="371.8" y2="206.3" stroke="#8A6A0C" stroke-width="4" stroke-linecap="round"/>
<line x1="278" y1="289" x2="328" y2="375.6" stroke="#8A6A0C" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 5"/>
<text x="578" y="277" font-size="26" font-weight="700" fill="#1E2B47">i = 30°, less than c</text>
<text x="578" y="319" font-size="25" fill="#4B5B72">some light leaves,</text>
<text x="578" y="361" font-size="25" fill="#4B5B72">some reflects</text>
<rect x="33" y="488" width="934" height="300" rx="14" fill="#FFFFFF" stroke="#1E2B47" stroke-width="2.5"/>
<path d="M145 611 H411 A133 133 0 0 1 145 611Z" fill="#DDEBE8" stroke="#2F6B63" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="278" y1="516" x2="278" y2="611" stroke="#1E2B47" stroke-width="2" stroke-dasharray="7 6"/>
<line x1="189.4" y1="710.1" x2="278" y2="611" stroke="#8A6A0C" stroke-width="4" stroke-linecap="round"/>
<polygon points="243,650.1 235.5,689 205.1,661.8" fill="#8A6A0C"/>
<line x1="278" y1="611" x2="435" y2="611" stroke="#8A6A0C" stroke-width="4" stroke-linecap="round"/>
<text x="578" y="599" font-size="26" font-weight="700" fill="#1E2B47">i = c = 42°</text>
<text x="578" y="641" font-size="25" fill="#4B5B72">refracted ray runs</text>
<text x="578" y="683" font-size="25" fill="#4B5B72">along the surface</text>
<rect x="33" y="810" width="934" height="300" rx="14" fill="#FFFFFF" stroke="#1E2B47" stroke-width="2.5"/>
<path d="M145 933 H411 A133 133 0 0 1 145 933Z" fill="#DDEBE8" stroke="#2F6B63" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="278" y1="838" x2="278" y2="933" stroke="#1E2B47" stroke-width="2" stroke-dasharray="7 6"/>
<line x1="160.6" y1="995.4" x2="278" y2="933" stroke="#8A6A0C" stroke-width="4" stroke-linecap="round"/>
<polygon points="231.6,957.6 211.2,991.6 192,955.5" fill="#8A6A0C"/>
<line x1="278" y1="933" x2="395.4" y2="995.4" stroke="#8A6A0C" stroke-width="4" stroke-linecap="round"/>
<polygon points="349.1,970.8 309.5,972.9 328.7,936.8" fill="#8A6A0C"/>
<text x="578" y="921" font-size="26" font-weight="700" fill="#1E2B47">i = 62°, more than c</text>
<text x="578" y="963" font-size="25" fill="#4B5B72">all light reflects:</text>
<text x="578" y="1005" font-size="25" fill="#4B5B72">total internal reflection</text>
<rect x="33" y="1145" width="934" height="120" rx="14" fill="#FFFFFF" stroke="#1E2B47" stroke-width="2.5"/>
<text x="500" y="1218" font-size="30" font-weight="700" fill="#2F6B63" text-anchor="middle">sin c = 1 ÷ n = 1 ÷ 1.5, so c = 41.8°</text></g></svg>
