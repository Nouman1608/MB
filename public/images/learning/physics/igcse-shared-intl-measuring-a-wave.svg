<svg xmlns="http://www.w3.org/2000/svg" width="900" height="890" viewBox="0 0 1000 988.89" role="img" aria-labelledby="title desc"><title id="title">Measuring a wave</title><desc id="desc">Graph of displacement against distance in metres for a wave. Two crests 0.40 m apart mark the wavelength; an arrow from the rest position up to a crest marks the amplitude; a trough is labelled. Boxes: wave speed v = f × λ = 5 × 0.40 = 2.0 m/s; frequency f = 5 Hz, 5 waves each second; period T = 1 ÷ 5 = 0.2 s. No tier labels: Edexcel 4PH1 3.3, 3.5 and 3.6 (both papers) and OxfordAQA 9203 3.3.1g–h (untiered).</desc><rect width="1000" height="988.89" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="500" y="62" font-size="36" font-weight="700" fill="#1E2B47" text-anchor="middle">Measuring a wave</text>
