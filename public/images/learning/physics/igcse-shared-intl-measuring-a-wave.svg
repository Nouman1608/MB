<text x="67" y="688" font-size="26" font-weight="700" fill="#1E2B47">Wave speed</text>
<text x="67" y="775" font-size="44" font-weight="700" fill="#2F6B63">v = f × λ</text>
<text x="67" y="855" font-size="36" font-weight="700" fill="#1E2B47">= 5 × 0.40</text>
<text x="67" y="920" font-size="38" font-weight="700" fill="#8A6A0C">= 2.0 m/s</text>
<text x="545" y="688" font-size="26" font-weight="700" fill="#1E2B47">Frequency</text>
<text x="545" y="755" font-size="34" font-weight="700" fill="#2F6B63">f = 5 Hz</text>
<text x="545" y="802" font-size="22" fill="#4B5B72">5 waves each second</text>
<text x="545" y="866" font-size="26" font-weight="700" fill="#1E2B47">Period</text>
<text x="545" y="920" font-size="30" font-weight="700" fill="#2F6B63">T = 1 ÷ 5 = 0.2 s</text></g></svg>
