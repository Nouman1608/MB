<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="t d"><title id="t">Average speed and average velocity</title><desc id="d">A cart starts at x equals 0 metres and ends at x equals 5 metres after 2.5 seconds. A straight path has distance 5 metres and displacement plus 5 metres, giving average speed 2 metres per second and average velocity plus 2 metres per second. A second path travels from 0 to 8 metres, turns around and ends at 5 metres: distance 11 metres, displacement plus 5 metres, average speed 4.4 metres per second, and average velocity plus 2 metres per second. The example shows why endpoints alone do not determine average speed when the object reverses.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial, Liberation Sans, sans-serif"><text x="58" y="74" fill="#0B1F3A" font-size="37" font-weight="700">Average speed and average velocity</text><text x="60" y="116" fill="#637783" font-size="20">Same start and finish can hide a longer path.</text><rect x="55" y="150" width="1490" height="700" rx="18" fill="#FFFFFF" stroke="#CBD7D9" stroke-width="2"/><rect x="90" y="190" width="690" height="610" rx="16" fill="#F7FAFA" stroke="#CBD7D9" stroke-width="2"/><rect x="820" y="190" width="690" height="610" rx="16" fill="#F7FAFA" stroke="#CBD7D9" stroke-width="2"/><text x="435" y="240" text-anchor="middle" fill="#0B1F3A" font-size="23" font-weight="700">Path A • no reversal</text><text x="1165" y="240" text-anchor="middle" fill="#0B1F3A" font-size="23" font-weight="700">Path B • turns around</text><line x1="180" y1="430" x2="680" y2="430" stroke="#3C7EA7" stroke-width="9" stroke-linecap="round"/><circle cx="180" cy="430" r="13" fill="#D6A72C"/><circle cx="680" cy="430" r="13" fill="#108B88"/><text x="180" y="395" text-anchor="middle" fill="#0B1F3A" font-size="17">start x₀ = 0 m</text><text x="680" y="395" text-anchor="middle" fill="#0B1F3A" font-size="17">finish x = +5 m</text><line x1="180" y1="472" x2="680" y2="472" stroke="#0B1F3A" stroke-width="3"/><text x="430" y="510" text-anchor="middle" fill="#0B1F3A" font-size="18" font-weight="700">distance = 5 m • displacement = +5 m</text><text x="435" y="570" text-anchor="middle" fill="#108B88" font-size="18" font-weight="700">average speed = 5 ÷ 2.5 = 2.0 m/s</text><text x="435" y="610" text-anchor="middle" fill="#3C7EA7" font-size="18" font-weight="700">average velocity = +5 ÷ 2.5 = +2.0 m/s</text><line x1="920" y1="430" x2="1460" y2="430" stroke="#CBD7D9" stroke-width="3"/><path d="M920 430 L1460 430 L1257 430" fill="none" stroke="#C85C5C" stroke-width="9" stroke-linecap="round"/><circle cx="920" cy="430" r="13" fill="#D6A72C"/><circle cx="1460" cy="430" r="13" fill="#C85C5C"/><circle cx="1257" cy="430" r="13" fill="#108B88"/><text x="920" y="395" text-anchor="middle" fill="#0B1F3A" font-size="17">start 0 m</text><text x="1420" y="365" text-anchor="end" fill="#C85C5C" font-size="17">turns at +8 m</text><text x="1257" y="485" text-anchor="middle" fill="#108B88" font-size="17">finish +5 m</text><text x="1165" y="545" text-anchor="middle" fill="#0B1F3A" font-size="18" font-weight="700">distance = 8 + 3 = 11 m</text><text x="1165" y="585" text-anchor="middle" fill="#108B88" font-size="18" font-weight="700">average speed = 11 ÷ 2.5 = 4.4 m/s</text><text x="1165" y="625" text-anchor="middle" fill="#3C7EA7" font-size="18" font-weight="700">average velocity = +5 ÷ 2.5 = +2.0 m/s</text><rect x="140" y="700" width="1320" height="68" rx="12" fill="#FFF5DB" stroke="#D6A72C" stroke-width="2"/><text x="800" y="730" text-anchor="middle" fill="#0B1F3A" font-size="18" font-weight="700">Average velocity needs displacement; average speed needs total distance travelled.</text><text x="800" y="755" text-anchor="middle" fill="#637783" font-size="16">Illustrative values • both journeys take 2.5 s • positive x is to the right</text></g><text x="800" y="942" fill="#A9BABC" font-size="26" font-weight="700" text-anchor="middle" opacity=".24" letter-spacing="2">MARLBRIDGE STUDY RESOURCES</text><line x1="55" y1="964" x2="1545" y2="964" stroke="#C9A227" stroke-width="2"/><text x="58" y="1000" fill="#0B1F3A" font-size="17" font-weight="700">MARLBRIDGE • STUDY RESOURCE</text><image x="1260" y="968" width="285" height="70" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/></svg>
