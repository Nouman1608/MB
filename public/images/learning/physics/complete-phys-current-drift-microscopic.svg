<rect x="65" y="570" width="635" height="220" rx="12" fill="white" stroke="#BBC8C9" stroke-width="2"/><rect x="819" y="670" width="635" height="120" rx="12" fill="white" stroke="#BBC8C9" stroke-width="2"/><text x="90" y="615" font-family="Arial,sans-serif" font-size="20" font-weight="600" text-anchor="start" fill="#0B1F3A">Random velocities cancel on average:</text><text x="90" y="658" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#357EA2">⟨vₜₕₑᵣₘₐₗ⟩ = 0  →  no net current</text><text x="90" y="713" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#607184">Particles still move rapidly in all directions.</text><text x="845" y="712" font-family="Arial,sans-serif" font-size="20" font-weight="600" text-anchor="start" fill="#0B1F3A">For one carrier species:</text><text x="845" y="750" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#0B1F3A">I = n |q| A v_d   (magnitude form)</text><text x="845" y="779" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#607184">For electrons, current direction is opposite drift.</text><text x="58" y="867" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#607184">Arrow directions are illustrative, not a measured trajectory or speed scale.</text><line x1="36" y1="892" x2="1480" y2="892" stroke="#BBC8C9" stroke-width="1.5"/><text x="38" y="923" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#607184">Bounded teaching diagram • Random motion and drift • AP Physics 2</text><text x="1370" y="923" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="end" fill="#0B1F3A">MARLBRIDGE</text><g transform="translate(1420,898) scale(.17)"><path d="M83 46 H129 A26 26 0 0 1 129 98 H130 A32 32 0 0 1 130 162 H83 Z M104 66 H123 A12 12 0 0 1 123 90 H104 Z M104 106 H124 A18 18 0 0 1 124 142 