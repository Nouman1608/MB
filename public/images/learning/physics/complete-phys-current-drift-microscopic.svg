<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="940" viewBox="0 0 1520 940" role="img" aria-labelledby="title desc"><title id="title">Random motion and electron drift in a current</title><desc id="desc">Paired conductor views distinguish cancelling random thermal motion from random motion plus a small average electron drift. Conventional current is opposite the electron drift. I = n|q|Avd is stated for one carrier species in magnitude form.</desc><defs><marker id="aN" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0B1F3A"/></marker><marker id="aB" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#357EA2"/></marker><marker id="aR" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#B75E53"/></marker><marker id="aM" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#56866D"/></marker><marker id="aG" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#C9A227"/></marker></defs><rect width="1520" height="940" fill="#F4F7F6"/><g opacity=".045" transform="translate(686,345) scale(1.1)"><path d="M83 46 H129 A26 26 0 0 1 129 98 H130 A32 32 0 0 1 130 162 H83 Z M104 66 H123 A12 12 0 0 1 123 90 H104 Z M104 106 H124 A18 18 0 0 1 124 142 H104 Z" fill="#C9A227" fill-rule="evenodd"/><path d="M30 162 L30 46 L51 46 L67 116 L83 46 L104 46 L104 162 L83 162 L83 86 L67 150 L51 86 L51 162 Z" fill="#0B1F3A"/></g><g font-family="Arial,sans-serif"><text x="38" y="58" font-family="Arial,sans-serif" font-size="36" font-weight="700" text-anchor="start" fill="#0B1F3A">Random motion and electron drift in a current</text><text x="38" y="101" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#607184">Marlbridge Physics • Random motion and drift</text><rect x="28" y="142" width="710" height="690" rx="16" fill="white" stroke="#BBC8C9" stroke-width="2"/><rect x="782" y="142" width="710" height="690" rx="16" fill="white" stroke="#BBC8C9" stroke-width="2"/><text x="60" y="190" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#0B1F3A">A  Thermal motion only</text><text x="814" y="190" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#0B1F3A">B  Thermal motion + drift</text><rect x="65" y="230" width="635" height="310" rx="12" fill="#F8FAFA" stroke="#BBC8C9" stroke-width="2"/><rect x="819" y="230" width="635" height="310" rx="12" fill="#F8FAFA" stroke="#BBC8C9" stroke-width="2"/><text x="85" y="270" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#607184">Conductor; snapshots at one instant</text><text x="839" y="270" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#607184">Same random spread; non-zero mean drift</text>
