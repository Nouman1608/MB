<svg xmlns="http://www.w3.org/2000/svg" width="900" height="990" viewBox="0 0 1000 1100" role="img" aria-labelledby="title desc"><title id="title">Why a gas pushes on its container (Edexcel International GCSE Physics)</title><desc id="desc">Three boxes with the same eight gas particles, each with an arrow for its velocity. Start: a pressure bar. Hotter: the particles move faster (the kelvin temperature has doubled) and the pressure bar doubles. Squeezed: a piston pushes the gas into half the volume at the same temperature, the walls are hit more often and the pressure bar doubles. No tier labels: 4PH1 5.15, 5.18 and 5.20–5.22 are on both papers.</desc><rect width="1000" height="1100" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="500" y="62" font-size="36" font-weight="700" fill="#1E2B47" text-anchor="middle">Why a gas pushes on its container</text>
