<svg xmlns="http://www.w3.org/2000/svg" width="900" height="870" viewBox="0 0 1000 966.67" role="img" aria-labelledby="title desc"><title id="title">Series and parallel circuits</title><desc id="desc">Two circuits with the same 6.0 V cell and 20 Ω and 40 Ω resistors. Series: one path, 0.10 A everywhere; the resistors have 2.0 V and 4.0 V across them, and 2.0 + 4.0 = 6.0 V. Parallel: each branch has the full 6.0 V; branch currents are 0.30 A and 0.15 A and add to the 0.45 A from the cell. Arrows show current from + to −. No tier labels: Edexcel 4PH1 2.13, 2.17–2.19 (both papers) and OxfordAQA 9203 3.5.1q–s (untiered).</desc><rect width="1000" height="966.67" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="500" y="62" font-size="36" font-weight="700" fill="#1E2B47" text-anchor="middle">Series and parallel circuits</text>
