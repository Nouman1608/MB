<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">Hall effect: carrier sign and voltage edges</title><desc id="desc">A current-carrying strip in perpendicular magnetic field separates charge across its width. The diagram defines y− and y+ edges, force direction, Hall-field polarity for positive versus negative carriers, and ΔV_H=−IB/(nqt) for the stated axes.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#20354D"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#357EA2"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B75E53"/></marker></defs><rect width="1600" height="1050" fill="#F4F7F7"/><text x="55" y="58" font-family="Arial,sans-serif" font-size="34" fill="#0B1F3A" font-weight="700" text-anchor="start">Hall effect: carrier sign and voltage edges</text><text x="57" y="96" font-family="Arial,sans-serif" font-size="18" fill="#52677C" font-weight="400" text-anchor="start">Marlbridge • AP Physics teaching diagram</text><rect x="60" y="135" width="1480" height="760" rx="16" fill="white" stroke="#C8D3D4" stroke-width="2"/><rect x="110" y="205" width="650" height="570" rx="16" fill="#F7FBFC" stroke="#C8D3D4" stroke-width="2"/><text x="435" y="245" font-family="Arial,sans-serif" font-size="21" fill="#0B1F3A" font-weight="700" text-anchor="middle">positive carriers: q &gt; 0</text><rect x="840" y="205" width="650" height="570" rx="16" fill="#F7FBFC" stroke="#C8D3D4" stroke-width="2"/><text x="1165" y="245" font-family="Arial,sans-serif" font-size="21" fill="#0B1F3A" font-weight="700" text-anchor="middle">negative carriers: q &lt; 0</text><rect x="220" y="320" width="430" height="235" rx="0" fill="#EAF2F5" stroke="#357EA2" stroke-width="2"/><text x="435" y="300" font-family="Arial,sans-serif" font-size="17" fill="#0B1F3A" font-weight="700" text-anchor="middle">current I →    B into page ⊗</text><line x1="255" y1="440" x2="600" y2="440" stroke="#357EA2" stroke-width="5"  marker-end="url(#a)"/><text x="435" y="420" font-family="Arial,sans-serif" font-size="16" fill="#357EA2" font-weight="600" text-anchor="middle">carrier drift →</text><line x1="435" y1="480" x2="435" y2="370" stroke="#B75E53" stroke-width="4"  marker-end="url(#a)"/><text x="435" y="355" font-family="Arial,sans-serif" font-size="17" fill="#B75E53" font-weight="700" text-anchor="middle">F_B → y+</text><text x="270" y="385" font-family="Arial,sans-serif" font-size="16" fill="#0B1F3A" font-weight="700" text-anchor="start">y+ edge</text><text x="270" y="535" font-family="Arial,sans-serif" font-size="16" fill="#0B1F3A" font-weight="700" text-anchor="start">y− edge</text><circle cx="435" cy="395" r="15" fill="#B75E53" stroke="#B75E53" stroke-width="3"/><text x="435" y="400" font-family="Arial,sans-serif" font-size="16" fill="white" font-weight="700" text-anchor="middle">+</text><circle cx="435" cy="520" r="15" fill="#357EA2" stroke="#357EA2" stroke-width="3"/><text x="435" y="525" font-family="Arial,sans-serif" font-size="16" fill="white" font-weight="700" text-anchor="middle">−</text><line x1="530" y1="395" x2="530" y2="485" stroke="#3F8582" stroke-width="3"  marker-end="url(#a)"/><text x="550" y="445" font-family="Arial,sans-serif" font-size="15" fill="#3F8582" font-weight="700" text-anchor="start">E_H</text><text x="435" y="650" font-family="Arial,sans-serif" font-size="21" fill="#0B1F3A" font-weight="700" text-anchor="middle">V(y+) − V(y−) &gt; 0</text><rect x="950" y="320" width="430" height="235" rx="0" fill="#EAF2F5" stroke="#357EA2" stroke-width="2"/><text x="1165" y="300" font-family="Arial,sans-serif" font-size="17" fill="#0B1F3A" font-weight="700" text-anchor="middle">current I →    B into page ⊗</text><line x1="1330" y1="440" x2="985" y2="440" stroke="#357EA2" stroke-width="5"  marker-end="url(#a)"/><text x="1165" y="420" font-family="Arial,sans-serif" font-size="16" fill="#357EA2" font-weight="600" text-anchor="middle">carrier drift ←</text><line x1="1165" y1="480" x2="1165" y2="370" stroke="#B75E53" stroke-width="4"  marker-end="url(#a)"/><text x="1165" y="355" font-family="Arial,sans-serif" font-size="17" fill="#B75E53" font-weight="700" text-anchor="middle">F_B → y+</text><text x="1000" y="385" font-family="Arial,sans-serif" font-size="16" fill="#0B1F3A" font-weight="700" text-anchor="start">y+ edge</text><text x="1000" y="535" font-family="Arial,sans-serif" font-size="16" fill="#0B1F3A" font-weight="700" text-anchor="start">y− edge</text><circle cx="1165" cy="395" r="15" fill="#357EA2" stroke="#357EA2" stroke-width="3"/><text x="1165" y="400" font-family="Arial,sans-serif" font-size="16" fill="white" font-weight="700" text-anchor="middle">−</text><circle cx="1165" cy="520" r="15" fill="#B75E53" stroke="#B75E53" stroke-width="3"/><text x="1165" y="525" font-family="Arial,sans-serif" font-size="16" fill="white" font-weight="700" text-anchor="middle">+</text><line x1="1260" y1="485" x2="1260" y2="395" stroke="#3F8582" stroke-width="3"  marker-end="url(#a)"/><text x="1280" y="445" font-family="Arial,sans-serif" font-size="15" fill="#3F8582" font-weight="700" text-anchor="start">E_H</text><text x="1165" y="650" font-family="Arial,sans-serif" font-size="21" fill="#0B1F3A" font-weight="700" text-anchor="middle">V(y+) − V(y−) &lt; 0</text><text x="800" y="825" font-family="Arial,sans-serif" font-size="20" fill="#3F8582" font-weight="700" text-anchor="middle">For +x current and B into page: ΔV_H = IB/(nqt) • signed q sets the voltage sign.</text><text x="800" y="914" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#0B1F3A" opacity=".09">MARLBRIDGE • STUDY RESOURCES</text><line x1="55" y1="958" x2="1545" y2="9