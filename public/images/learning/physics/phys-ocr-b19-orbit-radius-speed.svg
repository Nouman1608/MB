<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><defs>
<marker id="aN" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#0B1F3A"/></marker>
<marker id="aB" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#3C7EA7"/></marker>
<marker id="aT" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#108B88"/></marker>
<marker id="aR" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#C85C5C"/></marker>
</defs><title id="title">Circular orbits: speed depends on radius</title><desc id="desc">Earth and a satellite on circular orbit. Gravity is inward and velocity tangent. Example values from the lesson compare a lower polar orbit at about 7460 metres per second to geostationary radius at about 3070 metres per second.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial, Liberation Sans, sans-serif"><text x="58" y="74" fill="#0B1F3A" font-size="38" font-weight="700" text-anchor="start">Circular orbits: speed depends on radius</text><text x="60" y="116" fill="#637783" font-size="20" font-weight="500" text-anchor="start">For the same central body, the stable circular-orbit speed is lower at a larger orbital radius.</text><rect x="55" y="145" width="1490" height="780" rx="18" fill="#FFFFFF" stroke="#CBD7D9" stroke-width="2"/><rect x="90" y="205" width="900" height="650" rx="18" fill="#FFFFFF" stroke="#CBD7D9" stroke-width="2"/><rect x="1020" y="205" width="490" height="650" rx="18" fill="#F7FAFA" stroke="#CBD7D9" stroke-width="2"/><text x="540" y="252" fill="#108B88" font-size="25" font-weight="700" text-anchor="middle">Orbit radius sets the stable orbital speed</text><text x="1265" y="252" fill="#108B88" font-size="24" font-weight="700" text-anchor="middle">Compare the guide values</text><circle cx="515" cy="535" r="115" fill="#DDECEF" stroke="#6B8991" stroke-width="3"/><text x="515" y="570" fill="#0B1F3A" font-size="19" font-weight="700" text-anchor="middle">planet</text><circle cx="515" cy="535" r="295" fill="none" stroke="#9EB5BA" stroke-width="3"/><circle cx="810" cy="535" r="19" fill="#FFF2CF" stroke="#D8A927" stroke-width="3"/><line x1="810" y1="535" x2="515" y2="535" stroke="#0B1F3A" stroke-width="3" marker-end="url(#aN)"/><text x="660" y="515" fill="#0B1F3A" font-size="24" font-weight="700" text-anchor="middle">r</text><line x1="810" y1="535" x2="810" y2="420" stroke="#3C7EA7" stroke-width="5" marker-end="url(#aB)"/><line x1="810" y1="535" x2="870" y2="535" stroke="#C85C5C" stroke-width="5" marker-end="url(#aR)"/><text x="870" y="405" fill="#3C7EA7" font-size="19" font-weight="700" text-anchor="middle">v tangent</text><text x="900" y="570" fill="#C85C5C" font-size="18" font-weight="600" text-anchor="middle">gravity inward</text><text x="530" y="760" fill="#0B1F3A" font-size="18" font-weight="600" text-anchor="middle">Gravity is perpendicular to velocity in an ideal circular orbit.</text><rect x="1065" y="310" width="395" height="170" rx="18" fill="#EEF5F7" stroke="#B8CDD2" stroke-width="2"/><text x="1262" y="350" fill="#0B1F3A" font-size="21" font-weight="700" text-anchor="middle">Lower orbit (polar)</text><text x="1262" y="392" fill="#637783" font-size="18" font-weight="500" text-anchor="middle">r = 7.171 × 10⁶ m</text><text x="1262" y="430" fill="#3C7EA7" font-size="24" font-weight="700" text-anchor="middle">v ≈ 7460 m s⁻¹</text><rect x="1065" y="525" width="395" height="170" rx="18" fill="#F4F8F8" stroke="#B8CDD2" stroke-width="2"/><text x="1262" y="565" fill="#0B1F3A" font-size="19" font-weight="700" text-anchor="middle">Higher orbit (geostationary)</text><text x="1262" y="607" fill="#637783" font-size="18" font-weight="500" text-anchor="middle">r = 4.22 × 10⁷ m</text><text x="1262" y="645" fill="#3C7EA7" font-size="24" font-weight="700" text-anchor="middle">v ≈ 3070 m s⁻¹</text><text x="1262" y="750" fill="#0B1F3A" font-size="17" font-weight="600" text-anchor="middle">Higher stable circular orbit → lower speed</text><text x="1262" y="780" fill="#637783" font-size="15" font-weight="500" text-anchor="middle">(qualitative comparison; same central body)</text><text x="800" y="942" fill="#A9BABC" font-size="26" font-weight="700" text-anchor="middle" opacity="0.24" letter-spacing="2">MARLBRIDGE STUDY RESOURCES</text><line x1="55" y1="960" x2="1545" y2="960" stroke="#D8A927" stroke-width="2"/><text x="64" y="997" fill="#637783" font-size="14" font-weight="500" text-anchor="start">Marlbridge • Physics study resource • Schematic; labels state key assumptions</text><image x="1260" y="968" width="285" height="47" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/></g></svg>