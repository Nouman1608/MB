<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img"><title>Turning Effects of an Induced Current</title><desc>A rotating coil’s magnetic forces form a resisting couple</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#168C8C"/></marker><marker id="arrN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#10233F"/></marker></defs><rect width="1528" height="940" fill="#F3F6F6"/><text x="54" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#10233F">Turning Effects of an Induced Current</text><text x="56" y="92" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#53677B">A rotating coil’s magnetic forces form a resisting couple</text><rect x="42" y="130" width="900" height="660" rx="18" fill="#FFFFFF" stroke="#CAD6DF" stroke-width="2"/><rect x="960" y="130" width="526" height="660" rx="18" fill="#FFFFFF" stroke="#CAD6DF" stroke-width="2"/><text x="72" y="174" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">Opposing forces form a couple on the coil</text><line x1="130" y1="475" x2="840" y2="475" stroke="#315F86" stroke-width="5" marker-end="url(#arr)"/><text x="850" y="462" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#315F86">B</text><path d="M300 315 L680 315 L680 635 L300 635 Z" fill="#E8F1F4" stroke="#168C8C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="490" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#10233F">rectangular conducting coil</text><line x1="300" y1="390" x2="300" y2="525" stroke="#C44949" stroke-width="5" marker-end="url(#arr)"/><line x1="680" y1="525" x2="680" y2="390" stroke="#C44949" stroke-width="5" marker-end="url(#arr)"/><text x="270" y="368" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#C44949">F</text><text x="705" y="368" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#C44949">F</text><line x1="190" y1="600" x2="270" y2="600" stroke="#725C8E" stroke-width="4" marker-end="url(#arr)"/><text x="180" y="630" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#725C8E">ω</text><path d="M250 655 A300 300 0 0 0 725 655" fill="none" stroke="#C9A227" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="490" y="720" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#C9A227">induced torque opposes rotation (Lenz)</text><rect x="990" y="168" width="466" height="164" rx="18" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="1018" y="210" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#315F86">Torque magnitude</text><text x="1018" y="254" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#10233F">τ = N I A B sin θ</text><text x="1018" y="296" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#53677B">force pair × lever arm</text><rect x="990" y="358" width="466" height="164" rx="18" fill="#F4F1E8" stroke="#F4F1E8" stroke-width="2"/><text x="1018" y="400" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#C9A227">Energy pathway</text><text x="1018" y="444" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">mechanical work → electrical</text><text x="1018" y="484" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#53677B">plus resistive heating</text><rect x="990" y="548" width="466" height="164" rx="18" fill="#E7F3F1" stroke="#E7F3F1" stroke-width="2"/><text x="1018" y="590" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#168C8C">Lenz’s law</text><text x="1018" y="634" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">induced current opposes the</text><text x="1018" y="672" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">change that produced it</text><text x="1018" y="700" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#53677B">not simply the field direction</text><text letter-spacing="5" opacity=".08" x="764" y="855" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE STUDY RESOURCES</text><line x1="52" y1="873" x2="1476" y2="873" stroke="#C9A227" stroke-width="2"/><text x="54" y="906" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1305" y="881" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
