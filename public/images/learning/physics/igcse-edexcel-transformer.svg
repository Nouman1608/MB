<text x="105" y="372" font-size="25" fill="#1E2B47" text-anchor="middle">920 turns</text>
<text x="105" y="453" font-size="32" font-weight="700" fill="#1E2B47" text-anchor="middle">230 V</text>
<text x="105" y="495" font-size="23" fill="#4B5B72" text-anchor="middle">a.c. in</text>
<text x="893" y="333" font-size="28" font-weight="700" fill="#8A6A0C" text-anchor="middle">Secondary</text>
<text x="893" y="372" font-size="25" fill="#1E2B47" text-anchor="middle">48 turns</text>
<text x="893" y="453" font-size="32" font-weight="700" fill="#1E2B47" text-anchor="middle">12 V</text>
<text x="893" y="495" font-size="23" fill="#4B5B72" text-anchor="middle">a.c. out</text>
<rect x="33" y="633" width="934" height="157" rx="14" fill="#FFFFFF" stroke="#1E2B47" stroke-width="2.5"/>
<text x="500" y="692" font-size="38" font-weight="700" fill="#2F6B63" text-anchor="middle" xml:space="preserve"><tspan>V</tspan><tspan dy="10.6" font-size="25.8">s</tspan><tspan dy="-10.6"> = 230 × 48 ÷ 920 = 12 V</tspan></text>
<text x="500" y="740" font-size="25" fill="#4B5B72" text-anchor="middle" xml:space="preserve"><tspan>V</tspan><tspan dy="7" font-size="17">p</tspan><tspan dy="-7"> / V</tspan><tspan dy="7" font-size="17">s</tspan><tspan dy="-7"> = N</tspan><tspan dy="7" font-size="17">p</tspan><tspan dy="-7"> / N</tspan><tspan dy="7" font-size="17">s</tspan></text>
<text x="500" y="777" font-size="21" fill="#4B5B72" text-anchor="middle">1 loop drawn ≈ 48 turns</text>
<rect x="33" y="811" width="934" height="134" rx="14" fill="#FFFFFF" stroke="#1E2B47" stroke-width="2.5"/>
<text x="500" y="858" font-size="27" font-weight="700" fill="#1E2B47" text-anchor="middle">Power in = power out (100% efficient)</text>
<text x="500" y="914" font-size="26" fill="#1E2B47" text-anchor="middle">230 V × 0.078 A = 12 V × 1.5 A = 18 W</text></g></svg>
