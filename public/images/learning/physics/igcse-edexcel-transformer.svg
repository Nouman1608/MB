<svg xmlns="http://www.w3.org/2000/svg" width="900" height="880" viewBox="0 0 1000 977.78" role="img" aria-labelledby="title desc"><title id="title">The transformer (Edexcel International GCSE Physics: Paper 2 only)</title><desc id="desc">Marked Paper 2 only: transformers are 4PH1 statements 6.17P, 6.19P and 6.20P. A soft-iron core with a primary coil of 920 turns taking 230 V a.c. and a secondary coil of 48 turns giving 12 V a.c.; one loop drawn stands for about 48 turns. Vs = 230 × 48 ÷ 920 = 12 V, from Vp / Vs = Np / Ns, a step-down transformer. For a 100% efficient transformer power in = power out: 230 V × 0.078 A = 12 V × 1.5 A = 18 W.</desc><rect width="1000" height="977.78" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="500" y="62" font-size="36" font-weight="700" fill="#1E2B47" text-anchor="middle">The transformer</text>
<text x="500" y="106" font-size="23" fill="#4B5B72" text-anchor="middle">Step-down: fewer turns on the secondary</text>
<rect x="35" y="126" width="190" height="38" rx="19" fill="#8A6A0C"/><text x="130" y="153.64" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">Paper 2 only</text>
