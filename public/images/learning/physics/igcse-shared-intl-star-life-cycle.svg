<text x="572" y="353" font-size="28" font-weight="700" fill="#1E2B47">Protostar</text>
<text x="572" y="390" font-size="23" fill="#4B5B72">gravity pulls in, heats up</text>
<line x1="500" y1="408" x2="500" y2="462" stroke="#1E2B47" stroke-width="4" stroke-linecap="round"/><polygon points="500,488 483.2,460 516.8,460" fill="#1E2B47"/>
<circle cx="500" cy="527" r="32" fill="#E8C23A" stroke="#8A6A0C" stroke-width="2.5"/>
<text x="558" y="525" font-size="28" font-weight="700" fill="#1E2B47">Main sequence star</text>
<text x="558" y="562" font-size="23" fill="#4B5B72">stable: gravity in = heat out</text>
<line x1="478" y1="573" x2="189.0539983614996" y2="686.7438228672193" stroke="#1E2B47" stroke-width="4" stroke-linecap="round"/><polygon points="163,697 184.3,669.3 197.5,702.8" fill="#1E2B47"/>
<line x1="523" y1="573" x2="557.9485857793517" y2="663.8663230263143" stroke="#1E2B47" stroke-width="4" stroke-linecap="round"/><polygon points="568,690 540.4,668.5 574,655.5" fill="#1E2B47"/>
<text x="18" y="655" font-size="26" font-weight="700" fill="#1E2B47">Less massive</text>
<text x="650" y="655" font-size="26" font-weight="700" fill="#1E2B47">More massive</text>
<circle cx="145" cy="766" r="50" fill="#C4553A" stroke="#1E2B47" stroke-width="3"/>
