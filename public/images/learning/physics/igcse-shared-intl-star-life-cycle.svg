<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1110" viewBox="0 0 1000 1233.33" role="img" aria-labelledby="title desc"><title id="title">Life cycle of a star</title><desc id="desc">Flow chart. A cloud of gas and dust is pulled in by gravity and heats up into a protostar, then becomes a stable main sequence star. A less massive star, like the Sun, becomes a red giant, then a planetary nebula (its shed outer layers) leaving a white dwarf. A more massive star becomes a red supergiant, explodes as a supernova and leaves a neutron star or a black hole. A dashed arrow shows that material from a supernova may form new stars. No tier labels: Edexcel 4PH1 8.9–8.10 (both papers) and OxfordAQA 9203 3.8.1 (untiered).</desc><rect width="1000" height="1233.33" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="500" y="62" font-size="36" font-weight="700" fill="#1E2B47" text-anchor="middle">Life cycle of a star</text>
<text x="500" y="106" font-size="23" fill="#4B5B72" text-anchor="middle">Mass decides the ending</text>
<circle cx="478" cy="192" r="30" fill="#BCC7D8" stroke="#7E8DA6" stroke-width="2.5"/>
<circle cx="512" cy="168" r="32" fill="#BCC7D8" stroke="#7E8DA6" stroke-width="2.5"/>
<circle cx="530" cy="196" r="26" fill="#BCC7D8" stroke="#7E8DA6" stroke-width="2.5"/>
<circle cx="494" cy="205" r="26" fill="#BCC7D8" stroke="#7E8DA6" stroke-width="2.5"/>
<text x="415" y="193" font-size="28" font-weight="700" fill="#1E2B47" text-anchor="end">Gas and dust cloud</text>
<line x1="500" y1="245" x2="500" y2="279" stroke="#1E2B47" stroke-width="4" stroke-linecap="round"/><polygon points="500,305 483.2,277 516.8,277" fill="#1E2B47"/>
<circle cx="500" cy="355" r="45" fill="none" stroke="#4B5B72" stroke-width="2.5" stroke-dasharray="6 6"/>
