<title id="ttl">Energy in an LC oscillation</title><desc id="dsc">Over one oscillation period, capacitor energy Uc follows cos squared and inductor energy Ul follows sin squared. Their sum is constant at 25 millijoules for a 20 microfarad capacitor initially charged to 50 volts; the period with an 80 millihenry inductor is about 7.95 milliseconds.</desc><defs>
