<text x="60" y="70" fill="#0B1F3A" font-size="38" font-weight="700" text-anchor="start" >Energy in an LC oscillation</text><text x="62" y="112" fill="#637783" font-size="20" font-weight="500" text-anchor="start" >Energy moves between the electric field of the capacitor and the magnetic field of the inductor.</text>
