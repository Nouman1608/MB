<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="940" viewBox="0 0 1520 940" role="img" aria-labelledby="title desc"><title id="title">Doppler effect: a moving observer</title><desc id="desc">Concentric wavefronts remain centred on a stationary source. An observer moving toward the source meets adjacent crests at a relative speed v + vo, so the encounter interval is λ/(v+vo) and fo = f(v+vo)/v. Classical sound model in a uniform medium.</desc><defs><marker id="aN" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0B1F3A"/></marker><marker id="aB" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#357EA2"/></marker><marker id="aR" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#B75E53"/></marker><marker id="aM" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#56866D"/></marker><marker id="aG" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#C9A227"/></marker></defs><rect width="1520" height="940" fill="#F4F7F6"/><g opacity=".045" transform="translate(686,345) scale(1.1)"><path d="M83 46 H129 A26 26 0 0 1 129 98 H130 A32 32 0 0 1 130 162 H83 Z M104 66 H123 A12 12 0 0 1 123 90 H104 Z M104 106 H124 A18 18 0 0 1 124 142 H104 Z" fill="#C9A227" fill-rule="evenodd"/><path d="M30 162 L30 46 L51 46 L67 116 L83 46 L104 46 L104 162 L83 162 L83 86 L67 150 L51 86 L51 162 Z" fill="#0B1F3A"/></g><g font-family="Arial,sans-serif"><text x="38" y="58" font-family="Arial,sans-serif" font-size="36" font-weight="700" text-anchor="start" fill="#0B1F3A">Doppler effect: a moving observer</text><text x="38" y="101" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#607184">Marlbridge Physics • A moving observer</text><rect x="28" y="142" width="710" height="690" rx="16" fill="white" stroke="#BBC8C9" stroke-width="2"/><rect x="782" y="142" width="710" height="690" rx="16" fill="white" stroke="#BBC8C9" stroke-width="2"/><text x="60" y="190" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#0B1F3A">A  Fronts spread from a stationary source</text><text x="814" y="190" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#0B1F3A">B  Moving toward the source</text><circle cx="330" cy="485" r="18" fill="#B75E53" stroke="#0B1F3A" stroke-width="2"/><text x="210" y="493" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="white">S</text><circle cx="330" cy="485" r="100" fill="none" stroke="#357EA2" stroke-width="3"/><circle cx="330" cy="485" r="190" fill="none" stroke="#357EA2" stroke-width="3"/><circle cx="330" cy="485" r="280" fill="none" stroke="#357EA2" stroke-width="3"/><text x="85" y="650" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#0B1F3A">Source emits one crest each period T.</text><text x="85" y="688" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#0B1F3A">Adjacent crests stay separated by λ = vT.</text><path d="M430 485 H580" fill="none" stroke="#C9A227" stroke-width="6" /><text x="505" y="457" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#C9A227">wave travel →</text><circle cx="600" cy="485" r="18" fill="#56866D" stroke="#0B1F3A" stroke-width="2"/><text x="600" y="493" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="white">O</text><path d="M590 535 H430" fill="none" stroke="#B75E53" stroke-width="6" /><text x="510" y="570" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#B75E53">observer velocity vₒ toward S</text><text x="95" y="746" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#607184">The source does not move: the wavefront centres remain at S.</text>
<rect x="830" y="240" width="600" height="165" rx="12" fill="white" stroke="#BBC8C9" stroke-width="2"/><text x="855" y="279" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#0B1F3A">Between adjacent crests:</text><text x="855" y="319" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#357EA2">crest spacing = λ</text><text x="855" y="359" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#B75E53">approach speed = v + vₒ</text><path d="M880 455 H1370" fill="none" stroke="#BBC8C9" stroke-width="3" /><line x1="900" y1="435" x2="900" y2="475" stroke="#357EA2" stroke-width="3"/><line x1="1010" y1="435" x2="1010" y2="475" stroke="#357EA2" stroke-width="3"/><line x1="1120" y1="435" x2="1120" y2="475" stroke="#357EA2" stroke-width="3"/><line x1="1230" y1="435" x2="1230" y2="475" stroke="#357EA2" stroke-width="3"/><line x1="1340" y1="435" x2="1340" y2="475" stroke="#357EA2" stroke-width="3"/><path d="M900 505 H1340" fill="none" stroke="#B75E53" stroke-width="5" /><text x="1120" y="544" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#B75E53">Observer moves left toward the source</text><text x="850" y="610" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#0B1F3A">Δt between encounters = λ / (v + vₒ)</text><text x="850" y="653" font-family="Arial,sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#0B1F3A">fₒ = 1/Δt = f (v + vₒ)/v</text><rect x="830" y="695" width="600" height="93" rx="12" fill="#FFF9E8" stroke="#C9A227" stroke-width="2"/><text x="850" y="732" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#0B1F3A">Toward source → higher observed frequency.</text><text x="850" y="766" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#0B1F3A">Away from source: fₒ = f (v − vₒ)/v.</text><text x="58" y="867" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#607184">Classical sound model; stationary source, uniform medium, observer speed below sound speed.</text><line x1="36" y1="892" x2="1480" y2="892" stroke="#BBC8C9" stroke-width="1.5"/><text x="38" y="923" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#607184">Bounded teaching diagram • A moving observer • AP Physics 2</text><text x="1370" y="923" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="end" fill="#0B1F3A">MARLBRIDGE</text><g transform="translate(1420,898) scale(.17)"><path d="M83 46 H129 A26 26 0 0 1 129 98 H130 A32 32 0 0 1 130 162 H83 Z M104 66 H123 A12 12 0 0 1 123 90 H104 Z M104 106 H124 A18 18 0 0 1 124 142 H104 Z" fill="#C9A227" fill-rule="evenodd"/><path d="M30 162 L30 46 L51 46 L67 116 L83 46 L104 46 L104 162 L83 162 L83 86 L67 150 L51 86 L51 162 Z" fill="#0B1F3A"/></g></g></svg>
