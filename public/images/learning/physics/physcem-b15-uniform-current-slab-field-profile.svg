<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
<title id="title">Uniform current slab: Amperian loop and magnetic-field profile</title><desc id="desc">A thick slab carries uniform current density J into the page. The magnetic field is zero at the mid-plane, grows linearly inside as B=μ₀Jz, and is constant in magnitude outside at μ₀Jt/2, with opposite directions above and below.</desc><defs>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#20354D"/></marker>
      <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#357EA2"/></marker>
      <marker id="arrGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#C9A227"/></marker>
    </defs>
<rect width="1600" height="1050" fill="#F4F7F7"/><text x="54" y="58" font-family="Arial,sans-serif" font-size="34" fill="#0B1F3A" font-weight="700" text-anchor="start" >Uniform current slab: Amperian loop and magnetic-field profile</text><text x="56" y="96" font-family="Arial,sans-serif" font-size="18" fill="#52677C" font-weight="400" text-anchor="start" >Marlbridge • AP Physics C: Electricity and Magnetism • teaching diagram</text>
