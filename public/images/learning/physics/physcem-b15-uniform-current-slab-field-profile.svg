7EA2" stroke-width="3"/><circle cx="520" cy="520" r="19" fill="white" stroke="#357EA2" stroke-width="3"/><path d="M512 512 L528 528 M528 512 L512 528" stroke="#357EA2" stroke-width="3"/><circle cx="520" cy="585" r="19" fill="white" stroke="#357EA2" stroke-width="3"/><path d="M512 577 L528 593 M528 577 L512 593" stroke="#357EA2" stroke-width="3"/><circle cx="600" cy="455" r="19" fill="white" stroke="#357EA2" stroke-width="3"/><path d="M592 447 L608 463 M608 447 L592 463" stroke="#357EA2" stroke-width="3"/><circle cx="600" cy="520" r="19" fill="white" stroke="#357EA2" stroke-width="3"/><path d="M592 512 L608 528 M608 512 L592 528" stroke="#357EA2" stroke-width="3"/><circle cx="600" cy="585" r="19" fill="white" stroke="#357EA2" stroke-width="3"/><path d="M592 577 L608 593 M608 577 L592 593" stroke="#357EA2" stroke-width="3"/><text x="450" y="660" font-family="Arial,sans-serif" font-size="18" fill="#0B1F3A" font-weight="700" text-anchor="middle" >J into page • thickness t</text><line x1="260" y1="400" x2="650" y2="400" stroke="#C9A227" stroke-width="4"  marker-end="url(#arrGold)"/><text x="450" y="330" font-family="Arial,sans-serif" font-size="18" fill="#C9A227" font-weight="700" text-anchor="middle" >B right above mid-plane</text><line x1="650" y1="720" x2="260" y2="720" stroke="#B75E53" stroke-width="4"  marker-end="url(#arr)"/><text x="450" y="750" font-family="Arial,sans-serif" font-size="18" fill="#B75E53" font-weight="700" text-anchor="middle" >B left below mid-plane</text><path d="M210 355 H700 V700 H210 Z" stroke="#20354D" stroke-width="3" fill="none" stroke-dasharray="9 7" /><line x1="265" y1="355" x2="390" y2="355" stroke="#20354D" stroke-width="3"  marker-end="url(#arr)"/><line x1="700" y1="405" x2="700" y2="505" stroke="#20354D" stroke-width="3"  marker-end="url(#arr)"/><line x1="650" y1="700" x2="520" y2="700" stroke="#20354D" stroke-width="3"  marker-end="url(#arr)"/><line x1="210" y1="650" x2="210" y2="550" stroke="#20354D" stroke-width="3"  marker-end="url(#arr)"/><text x="455" y="790" font-family="Arial,sans-serif" font-size="17" fill="#52677C" font-weight="600" text-anchor="middle" >Amperian rectangle: long sides ∥ B</text><line x1="900" y1="600" x2="1440" y2="600" stroke="#20354D" stroke-width="2"  marker-end="url(#arr)"/><line x1="1170" y1="785" x2="1170" y2="335" stroke="#20354D" stroke-width="2"  marker-end="url(#arr)"/><text x="1430" y="628" font-family="Arial,sans-serif" font-size="18" fill="#0B1F3A" font-weight="700" text-anchor="start" >z</text><text x="1170" y="320" font-family="Arial,sans-serif" font-size="18" fill="#0B1F3A" font-weight="700" text-anchor="middle" >B (signed)</text><path d="M930 735 L1085 735 L1255 465 L1400 465" stroke="#357EA2" stroke-width="6" fill="none"  /><text x="1030" y="430" font-family="Arial,sans-serif" font-size="16" fill="#B75E53" font-weight="700" text-anchor="middle" >outside: B = −μ₀Jt/2</text><text x="1325" y="430" font-family="Arial,sans-serif" font-size="16" fill="#357EA2" font-weight="700" text-anchor="middle" >outside: B = +μ₀Jt/2</text><text x="1188" y="380" font-family="Arial,sans-serif" font-size="16" fill="#3F8582" font-weight="700" text-anchor="start" >inside: B = μ₀Jz</text><rect x="105" y="875" width="1390" height="54" rx="10" fill="#EFF6F6" stroke="#B7D0D0" stroke-width="2"/><text x="800" y="910" font-family="Arial,sans-serif" font-size="19" fill="#0B1F3A" font-weight="700" text-anchor="middle" >For K = Jt, the ideal thin sheet has |B| = μ₀K/2 on either side.</text><line x1="55" y1="958" x2="1545" y2="958" stroke="#C9A227" stroke-width="3"/>
