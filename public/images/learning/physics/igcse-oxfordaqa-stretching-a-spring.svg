<svg xmlns="http://www.w3.org/2000/svg" width="900" height="960" viewBox="0 0 1000 1066.67" role="img" aria-labelledby="title desc"><title id="title">Stretching a spring (OxfordAQA International GCSE Physics)</title><desc id="desc">Force in newtons against extension in metres. The line is straight through the origin up to the limit of proportionality at 0.20 m and 8 N, then curves away below the dashed continuation. Dashed lines mark 6.0 N at 0.15 m. The gradient is k = 40 N/m, and a box works F = k x backwards: x = 6.0 ÷ 40 = 0.15 m. A note says 9203 3.1.5h writes this as F = k × e. No tier labels.</desc><rect width="1000" height="1066.67" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="500" y="62" font-size="36" font-weight="700" fill="#1E2B47" text-anchor="middle">Stretching a spring</text>
