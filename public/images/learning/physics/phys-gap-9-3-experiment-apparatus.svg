<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img"><title>Designing an Experiment to Measure Electric Energy Transfer</title><desc>Potential-difference source, plates, field-free drift, detector and v² versus accelerating voltage</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#168C8C"/></marker><marker id="arrN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#10233F"/></marker></defs><rect width="1528" height="940" fill="#F3F6F6"/><text x="54" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#10233F">Designing an Experiment to Measure Electric Energy Transfer</text><text x="56" y="92" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#53677B">Potential-difference source, plates, field-free drift, detector and v² versus accelerating voltage</text><rect x="42" y="130" width="1000" height="660" rx="18" fill="#FFFFFF" stroke="#CAD6DF" stroke-width="2"/><rect x="1060" y="130" width="426" height="660" rx="18" fill="#FFFFFF" stroke="#CAD6DF" stroke-width="2"/><text x="70" y="174" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">Measure energy change per unit charge across ΔV</text><rect x="95" y="285" width="180" height="150" rx="18" fill="#F4F1E8" stroke="#C9A227" stroke-width="2"/><text x="185" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">source</text><text x="185" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#C44949">ΔV = +12 V</text><text x="185" y="405" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#53677B">electron gun</text><line x1="275" y1="360" x2="420" y2="360" stroke="#315F86" stroke-width="5"/><line x1="310" y1="360" x2="400" y2="360" stroke="#315F86" stroke-width="4" marker-end="url(#arr)"/><path d="M420 260 L420 465 M510 260 L510 465" fill="none" stroke="#10233F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="465" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">uniform E field</text><text x="420" y="500" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#315F86">− plate</text><text x="510" y="500" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#C44949">+ plate</text><line x1="450" y1="345" x2="485" y2="345" stroke="#C44949" stroke-width="3" marker-end="url(#arr)"/><text x="465" y="310" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#C44949">ΔV &gt; 0</text><rect x="580" y="285" width="205" height="150" rx="18" fill="#E8F1F4" stroke="#315F86" stroke-width="2"/><text x="682" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">field-free drift</text><text x="682" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#53677B">measure speed</text><line x1="525" y1="360" x2="575" y2="360" stroke="#168C8C" stroke-width="4" marker-end="url(#arr)"/><line x1="790" y1="360" x2="905" y2="360" stroke="#168C8C" stroke-width="4" marker-end="url(#arr)"/><text x="844" y="335" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#168C8C">detector</text><text x="475" y="590" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">Electron: ΔK = −qΔV = e|ΔV|</text><text x="475" y="632" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#C44949">At |ΔV| = 12 V, energy gain = 12 eV</text><text x="475" y="682" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#53677B">Keep the accelerating voltage as a positive magnitude.</text><rect x="1090" y="164" width="366" height="158" rx="18" fill="#E7F3F1" stroke="#E7F3F1" stroke-width="2"/><text x="1118" y="205" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#168C8C">Energy relation</text><text x="1118" y="248" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#10233F">ΔU = qΔV</text><text x="1118" y="286" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233F">ΔK = −qΔV</text><rect x="1090" y="350" width="366" height="170" rx="18" fill="#F4F1E8" stroke="#F4F1E8" stroke-width="2"/><text x="1118" y="392" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#C9A227">Sign check</text><text x="1118" y="435" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">electron: q = −e</text><text x="1118" y="472" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">ΔV &gt; 0 ⇒ ΔK &gt; 0</text><text x="1118" y="502" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#53677B">gain scales with |ΔV|</text><rect x="1090" y="548" width="366" height="160" rx="18" fill="#E8F1F4" stroke="#E8F1F4" stroke-width="2"/><text x="1118" y="585" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#315F86">Analyse measurements</text><text x="1118" y="620" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#10233F">v = L/t; plot v² vs |ΔV|</text><text x="1118" y="651" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#10233F">slope = 2|q|/m</text><text x="1118" y="681" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#53677B">intercept ≈ 0 if losses are small</text><text letter-spacing="5" opacity=".08" x="764" y="855" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE STUDY RESOURCES</text><line x1="52" y1="873" x2="1476" y2="873" stroke="#C9A227" stroke-width="2"/><text x="54" y="906" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">MARLBRIDGE • STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1305" y="881" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
