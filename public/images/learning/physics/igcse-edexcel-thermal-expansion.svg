<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1296" viewBox="0 0 1000 1440" role="img" aria-labelledby="title desc"><title id="title">Why a heated solid expands (Edexcel International GCSE Physics)</title><desc id="desc">Marked not required by Edexcel: thermal expansion is not in the 4PH1 specification. Top: in a cold solid the particles vibrate a little and sit close together; in a hot solid the same-sized particles vibrate more widely (dashed rings) and sit further apart, so the solid is longer. Middle: for the same temperature rise a solid expands least, a liquid more and a gas most (order only, not to scale). Bottom: where it matters: gaps between rails, slack overhead cables and the liquid rising in a thermometer.</desc><rect width="1000" height="1440" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="500" y="62" font-size="36" font-weight="700" fill="#1E2B47" text-anchor="middle">Why a heated solid expands</text>
