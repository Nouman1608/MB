<svg xmlns="http://www.w3.org/2000/svg" width="900" height="880" viewBox="0 0 1800 1760" role="img" aria-labelledby="title desc"><title id="title">Will it float? (OCR GCSE Physics, Higher tier only)</title><desc id="desc">The whole figure is marked Higher tier only. In one beaker of water (density 1.0 g/cm³) a block of density 0.80 g/cm³ floats with most of it under the surface and a stone of 2.7 g/cm³ sinks to the bottom. In a second beaker oil of 0.92 g/cm³ floats on water of 1.0 g/cm³. A banner reads: density less than liquid, floats.</desc><rect width="1800" height="1760" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="112" font-size="70" font-weight="700" fill="#1E2B47" text-anchor="middle">Will it float?</text>
<text x="900" y="185" font-size="44" fill="#4B5B72" text-anchor="middle" xml:space="preserve"><tspan>Compare densities in g/cm</tspan><tspan dy="-16.7" font-size="29.9">3</tspan></text>
