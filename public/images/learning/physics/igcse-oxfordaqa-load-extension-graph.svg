<svg xmlns="http://www.w3.org/2000/svg" width="900" height="940" viewBox="0 0 1000 1044.44" role="img" aria-labelledby="title desc"><title id="title">Load–extension graph (OxfordAQA International GCSE Physics)</title><desc id="desc">Graph of load F in newtons against extension x in metres. The line is straight through the origin up to 0.16 m and 8 N, where the limit of proportionality is marked, then curves and is no longer straight. A gradient triangle from 2 N to 6 N and 0.04 m to 0.12 m gives gradient = ΔF ÷ Δx = 4 ÷ 0.08 = 50 N/m, the spring constant (9203 3.1.5h, F = k × e). No tier labels.</desc><rect width="1000" height="1044.44" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="500" y="62" font-size="36" font-weight="700" fill="#1E2B47" text-anchor="middle">Load–extension graph</text>
<text x="500" y="106" font-size="23" fill="#4B5B72" text-anchor="middle">Straight line = extension proportional to load</text>
