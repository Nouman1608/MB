<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><defs><marker id="n" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#0B1F3A"/></marker><marker id="b" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#3C7EA7"/></marker><marker id="t" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#108B88"/></marker><marker id="r" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#C85C5C"/></marker></defs><title id="title">Radiotherapy directs several beams toward a tumour</title><desc id="desc">Three gamma-ray beams approach a tumour from different directions. Each beam passes through a different strip of healthy tissue, while the paths overlap at the tumour to deliver a greater combined dose. No numerical dose is implied.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial, Liberation Sans, sans-serif"><text x="58" y="74" fill="#0B1F3A" font-size="37" font-weight="700">Radiotherapy directs several beams toward a tumour</text><text x="60" y="116" fill="#637783" font-size="20">Several gamma-ray beams are aimed from different directions to limit dose along any one path.</text><rect x="55" y="150" width="1490" height="750" rx="18" fill="#FFFFFF" stroke="#CBD7D9" stroke-width="2"/><rect x="80" y="190" width="950" height="610" rx="14" fill="#F7FAFA" stroke="#CBD7D9" stroke-width="2"/><rect x="1065" y="190" width="455" height="610" rx="14" fill="#F7FAFA" stroke="#CBD7D9" stroke-width="2"/><text x="555" y="235" text-anchor="middle" fill="#0B1F3A" font-size="22" font-weight="700">Paths cross the target from different directions</text><path d="M345 300 Q555 245 765 300 L845 665 Q555 725 265 665Z" fill="#F3E4E2" stroke="#718B92" stroke-width="4"/><text x="555" y="337" text-anchor="middle" fill="#637783" font-size="17">patient</text><circle cx="555" cy="500" r="58" fill="#F7DDDA" stroke="#C85C5C" stroke-width="4"/><circle cx="555" cy="500" r="33" fill="#C85C5C" opacity=".82"/><text x="555" y="506" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">tumour</text>
  <path d="M162 365 L493 475 L523 490 L508 518 L475 514 L135 395Z" fill="#3C7EA7" opacity=".20" stroke="#3C7EA7" stroke-width="2"/><line x1="155" y1="377" x2="518" y2="492" stroke="#3C7EA7" stroke-width="5" marker-end="url(#b)"/><rect x="112" y="310" width="118" height="52" rx="8" fill="#FFFFFF" stroke="#3C7EA7" stroke-width="3"/><text x="171" y="342" text-anchor="middle" fill="#0B1F3A" font-size="15" font-weight="700">gamma source</text>
  <path d="M946 345 L625 470 L587 490 L605 520 L642 505 L980 380Z" fill="#108B88" opacity=".19" stroke="#108B88" stroke-width="2"/><line x1="963" y1="362" x2="592" y2="492" stroke="#108B88" stroke-width="5" marker-end="url(#t)"/><rect x="872" y="287" width="118" height="52" rx="8" fill="#FFFFFF" stroke="#108B88" stroke-width="3"/><text x="931" y="319" text-anchor="middle" fill="#0B1F3A" font-size="15" font-weight="700">gamma source</text>
  <path d="M555 730 L530 570 L555 545 L580 570 L555 730Z" fill="#C9A227" opacity=".20" stroke="#C9A227" stroke-width="2"/><line x1="555" y1="739" x2="555" y2="558" stroke="#C9A227" stroke-width="5" marker-end="url(#n)"/><rect x="493" y="741" width="124" height="44" rx="8" fill="#FFFFFF" stroke="#C9A227" stroke-width="3"/><text x="555" y="769" text-anchor="middle" fill="#0B1F3A" font-size="14" font-weight="700">gamma source</text>
  <rect x="152" y="590" width="242" height="66" rx="10" fill="#EAF4F3" stroke="#9CCAC5" stroke-width="2"/><text x="273" y="618" text-anchor="middle" fill="#0B1F3A" font-size="15" font-weight="700">Each path through healthy</text><text x="273" y="641" text-anchor="middle" fill="#637783" font-size="14">tissue receives a lower dose.</text>
  <rect x="700" y="578" width="270" height="72" rx="10" fill="#FFF5DB" stroke="#D6A72C" stroke-width="2"/><text x="835" y="607" text-anchor="middle" fill="#0B1F3A" font-size="15" font-weight="700">Paths overlap at target:</text><text x="835" y="633" text-anchor="middle" fill="#C85C5C" font-size="15" font-weight="700">higher combined dose.</text>
  <text x="1292" y="250" text-anchor="middle" fill="#0B1F3A" font-size="21" font-weight="700">Why use several angles?</text><text x="1120" y="320" fill="#637783" font-size="16">Each individual beam passes through</text><text x="1120" y="347" fill="#637783" font-size="16">healthy tissue on its way to the target.</text><rect x="1120" y="390" width="345" height="54" rx="10" fill="#EAF4F3" stroke="#9CCAC5" stroke-width="2"/><text x="1292" y="424" text-anchor="middle" fill="#0B1F3A" font-size="16" font-weight="700">healthy path • lower relative dose</text><rect x="1120" y="465" width="345" height="54" rx="10" fill="#F7DDDA" stroke="#C85C5C" stroke-width="2"/><text x="1292" y="499" text-anchor="middle" fill="#0B1F3A" font-size="16" font-weight="700">tumour • beams add at target</text><rect x="1120" y="558" width="345" height="130" rx="12" fill="#FFF5DB" stroke="#D6A72C" stroke-width="2"/><text x="1292" y="594" text-anchor="middle" fill="#0B1F3A" font-size="16" font-weight="700">Qualitative schematic only.</text><text x="1292" y="623" text-anchor="middle" fill="#0B1F3A" font-size="15">Real treatment planning sets the</text><text x="1292" y="650" text-anchor="middle" fill="#0B1F3A" font-size="15">beam directions and exposure.</text>
  <rect x="205" y="817" width="1190" height="42" rx="10" fill="#FFF5DB" stroke="#D6A72C" stroke-width="2"/><text x="800" y="844" text-anchor="middle" fill="#0B1F3A" font-size="17" font-weight="700">The tumour receives a high combined dose; healthy tissue along each beam path receives less.</text></g><text x="800" y="942" fill="#A9BABC" font-size="26" font-weight="700" text-anchor="middle" opacity=".24" letter-spacing="2">MARLBRIDGE STUDY RESOURCES</text><line x1="55" y1="964" x2="1545" y2="964" stroke="#C9A227" stroke-width="2"/><text x="58" y="1000" fill="#0B1F3A" font-size="17" font-weight="700">MARLBRIDGE  •  STUDY RESOURCE</text><image x="1260" y="968" width="285" height="70" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/></svg>
