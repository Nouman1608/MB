</defs><title id="title">Medical uses of radiation</title><desc id="desc">Left: tracer introduced and detected outside body to map organ uptake. Right: shielded treatment source directs a beam at tumour while limiting exposure to healthy tissue. Schematic only.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial, Liberation Sans, sans-serif"><text x="58" y="74" fill="#0B1F3A" font-size="38" font-weight="700" text-anchor="start">Medical uses of radiation</text><text x="60" y="116" fill="#637783" font-size="20" font-weight="500" text-anchor="start">A tracer can reveal organ function; radiotherapy directs ionising radiation towards diseased tissue.</text><rect x="55" y="145" width="1490" height="780" rx="18" fill="#FFFFFF" stroke="#CBD7D9" stroke-width="2"/><rect x="85" y="205" width="700" height="640" rx="18" fill="#FFFFFF" stroke="#CBD7D9" stroke-width="2"/><rect x="820" y="205" width="695" height="640" rx="18" fill="#F7FAFA" stroke="#CBD7D9" stroke-width="2"/><text x="435" y="255" fill="#108B88" font-size="24" font-weight="700" text-anchor="middle">Tracer: detect internal function</text><text x="1167" y="255" fill="#108B88" font-size="24" font-weight="700" text-anchor="middle">Radiotherapy: target a tumour</text><circle cx="430" cy="365" r="42" fill="#EAF3F4" stroke="#6B8991" stroke-width="3"/><path d="M 385 408 Q 330 450 350 560 L 380 670 L 480 670 L 510 560 Q 530 450 475 408 Z" fill="#EAF3F4" stroke="#6B8991" stroke-width="3"/><path d="M 405 470 Q 450 440 480 476 Q 470 515 425 515 Z" fill="#F7DDDA" stroke="#C85C5C" stroke-width="3"/><text x="435" y="546" fill="#C85C5C" font-size="16" font-weight="700" text-anchor="middle">organ uptake</text><circle cx="370" cy="475" r="5" fill="#D8A927" stroke="#D8A927" stroke-width="1"/><circle cx="495" cy="450" r="5" fill="#D8A927" stroke="#D8A927" stroke-width="1"/><circle cx="380" cy="575" r="5" fill="#D8A927" stroke="#D8A927" stroke-width="1"/><circle cx="480" cy="600" r="5" fill="#D8A927" stroke="#D8A927" stroke-width="1"/><circle cx="430" cy="625" r="5" fill="#D8A927" stroke="#D8A927" stroke-width="1"/><line x1="570" y1="450" x2="500" y2="475" stroke="#108B88" stroke-width="4" marker-end="url(#aT)"/><text x="630" y="430" fill="#0B1F3A" font-size="17" font-weight="600" text-anchor="middle">detector records</text><text x="630" y="455" fill="#0B1F3A" font-size="17" font-weight="600" text-anchor="middle">radiation from tracer</text><text x="435" y="735" fill="#0B1F3A" font-size="17" font-weight="600" text-anchor="middle">Small tracer activity; detector outside body.</text><circle cx="1160" cy="385" r="40" fill="#EAF3F4" stroke="#6B8991" stroke-width="3"/><path d="M 1100 426 Q 1050 470 1065 590 L 1110 660 L 1210 660 L 1255 590 Q 1270 470 1220 426 Z" fill="#EAF3F4" stroke="#6B8991" stroke-width="3"/><circle cx="1178" cy="535" r="32" fill="#F4C6BE" stroke="#C85C5C" stroke-width="3"/><text x="1178" y="541" fill="#C85C5C" font-size="14" font-weight="700" text-anchor="middle">target</text><rect x="1320" y="430" width="125" height="130" rx="8" fill="#E8EDF0" stroke="#748A91" stroke-width="2"/><text x="1382" y="475" fill="#0B1F3A" font-size="16" font-weight="700" text-anchor="middle">shielded</text><text x="1382" y="500" fill="#0B1F3A" font-size="16" font-weight="700" text-anchor="middle">source</text><path d="M 1320 480 L 1210 523 L 1210 548 Z" fill="#FFF0C2" stroke="#D8A927" stroke-width="2"/><path d="M 1320 520 L 1210 530 L 1210 552 Z" fill="#FFE7A6" stroke="#D8A927" stroke-width="2"/><text x="1167" y="735" fill="#0B1F3A" font-size="17" font-weight="600" text-anchor="middle">Beam is aimed at the tumour; healthy tissue is</text><text x="1167" y="765" fill="#637783" font-size="16" font-weight="500" text-anchor="middle">limited where possible. Clinical plans vary.</text><text x="800" y="942" fill="#A9BABC" font-size="26" font-weight="700" text-anchor="middle" opacity="0.24" letter-spacing="2">MARLBRIDGE STUDY RESOURCES</text><line x1="55" y1="960" x2="1545" y2="960" stroke="#D8A927" stroke-width="2"/><text x="64" y="997" fill="#637783" font-size="14" font-weight="500" text-anchor="start">Marlbridge • Physics study resource • Schematic; labels state key assumptions</text><image x="1260" y="968" width="285" height="47" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/></g></svg>