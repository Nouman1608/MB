<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 1000 844.44" role="img" aria-labelledby="title desc"><title id="title">Magnetic field of a bar magnet</title><desc id="desc">A bar magnet with N on the left and S on the right. Curved field lines leave the N end and enter the S end above and below the magnet, with arrows pointing from N to S. The lines are close together near the poles, labelled strong field, and far apart further out, labelled weaker field. No tier labels: field lines and the bar-magnet field pattern are on both Edexcel International GCSE papers (4PH1 6.4, 6.6) and in OxfordAQA 9203 3.5.2b, which is untiered.</desc><rect width="1000" height="844.44" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="500" y="62" font-size="36" font-weight="700" fill="#1E2B47" text-anchor="middle">Magnetic field of a bar magnet</text>
