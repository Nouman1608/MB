<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><defs><marker id="n" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#0B1F3A"/></marker><marker id="b" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#3C7EA7"/></marker><marker id="t" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#108B88"/></marker><marker id="r" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#C85C5C"/></marker><marker id="gold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#D6A72C"/></marker></defs><title id="title">A magnetic force on a curved wire</title><desc id="desc">A semicircular wire of radius 0.12 m carries 2.5 A from left to right along its upper arc in a uniform magnetic field directed into the page. The magnetic forces on opposite halves have sideways components that cancel; their upward components add. The resultant equals the force on the straight chord joining the endpoints, with magnitude I times B times the 0.24 m chord, or 0.18 N.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial, Liberation Sans, sans-serif"><text x="58" y="74" fill="#0B1F3A" font-size="37" font-weight="700">A magnetic force on a curved wire</text><text x="60" y="116" fill="#637783" font-size="20">In a uniform field, a curved wire’s net force equals the force on its chord.</text><rect x="55" y="150" width="1490" height="750" rx="18" fill="#FFFFFF" stroke="#CBD7D9" stroke-width="2"/><rect x="80" y="190" width="940" height="610" rx="14" fill="#F7FAFA" stroke="#CBD7D9" stroke-width="2"/><rect x="1055" y="190" width="465" height="610" rx="14" fill="#F7FAFA" stroke="#CBD7D9" stroke-width="2"/><text x="550" y="235" text-anchor="middle" fill="#0B1F3A" font-size="22" font-weight="700">Uniform field into the page • current follows the upper semicircle</text>
<path d="M270 540 A250 250 0 0 1 770 540" fill="none" stroke="#0B1F3A" stroke-width="10"/><path d="M460 340 A250 250 0 0 1 585 320" fill="none" stroke="#3C7EA7" stroke-width="5" marker-end="url(#b)"/><text x="500" y="270" fill="#3C7EA7" font-size="18" font-weight="700">I = 2.5 A</text><line x1="270" y1="540" x2="770" y2="540" stroke="#637783" stroke-width="3" stroke-dasharray="10 8"/><circle cx="520" cy="540" r="7" fill="#D6A72C"/><line x1="520" y1="540" x2="770" y2="540" stroke="#637783" stroke-width="3"/><text x="635" y="575" fill="#637783" font-size="17">R = 0.12 m</text><text x="520" y="595" text-anchor="middle" fill="#0B1F3A" font-size="17" font-weight="700">diameter = 2R = 0.24 m</text>
<g fill="#637783" font-size="22" font-weight="700"><text x="170" y="330">×</text><text x="310" y="260">×</text><text x="660" y="260">×</text><text x="865" y="330">×</text><text x="150" y="490">×</text><text x="885" y="490">×</text></g><text x="520" y="670" text-anchor="middle" fill="#637783" font-size="17">× = B into the page • B = 0.30 T</text>
<line x1="440" y1="470" x2="330" y2="410" stroke="#C85C5C" stroke-width="5" marker-end="url(#r)"/><line x1="600" y1="470" x2="710" y2="410" stroke="#C85C5C" stroke-width="5" marker-end="url(#r)"/><text x="520" y="405" text-anchor="middle" fill="#C85C5C" font-size="16" font-weight="700">sideways parts cancel</text><line x1="520" y1="485" x2="520" y2="375" stroke="#108B88" stroke-width="6" marker-end="url(#t)"/><text x="540" y="380" fill="#108B88" font-size="16" font-weight="700">net force ↑</text><text x="520" y="735" text-anchor="middle" fill="#637783" font-size="16">Schematic vector decomposition; resultant direction follows I Δℓ × B.</text>
<text x="1287" y="255" text-anchor="middle" fill="#0B1F3A" font-size="22" font-weight="700">Replace the arc by its chord</text><text x="1095" y="330" fill="#0B1F3A" font-size="20">F = I ∫dℓ × B</text><text x="1095" y="375" fill="#0B1F3A" font-size="19">Uniform B: F = I Δℓ × B</text><text x="1095" y="435" fill="#108B88" font-size="22" font-weight="700">F = I (2R) B</text><text x="1095" y="480" fill="#0B1F3A" font-size="19">= 2(2.5)(0.12)(0.30)</text><text x="1287" y="540" text-anchor="middle" fill="#C85C5C" font-size="28" font-weight="700">= 0.18 N</text><rect x="1090" y="610" width="395" height="105" rx="12" fill="#EAF4F3" stroke="#9CCAC5" stroke-width="2"/><text x="1287" y="650" text-anchor="middle" fill="#0B1F3A" font-size="17" font-weight="700">Perpendicular to the chord</text><text x="1287" y="682" text-anchor="middle" fill="#0B1F3A" font-size="16">The detailed local forces add to this</text><text x="1287" y="706" text-anchor="middle" fill="#0B1F3A" font-size="16">same endpoint result.</text>
<rect x="205" y="817" width="1190" height="42" rx="10" fill="#FFF5DB" stroke="#D6A72C" stroke-width="2"/><text x="800" y="844" text-anchor="middle" fill="#0B1F3A" font-size="17" font-weight="700">The net force on a curved wire in a uniform field equals the force on the straight chord between its ends.</text></g><text x="800" y="942" fill="#A9BABC" font-size="26" font-weight="700" text-anchor="middle" opacity=".24" letter-spacing="2">MARLBRIDGE STUDY RESOURCES</text><line x1="55" y1="964" x2="1545" y2="964" stroke="#C9A227" stroke-width="2"/><text x="58" y="1000" fill="#0B1F3A" font-size="17" font-weight="700">MARLBRIDGE • STUDY RESOURCE</text><image x="1260" y="968" width="285" height="70" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/></svg>
