<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Magnetic forces between moving charges</title><desc id="dsc">In the stated observer frame, two equal positive charges move side by side at equal speed v much less than c. Both charges have an outward electric force and an inward magnetic force. For this geometry, F_B/F_E is approximately v²/c².</desc><defs>
<marker id="arrN" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#0B1F3A"/></marker>
<marker id="arrB" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#3C7EA7"/></marker>
<marker id="arrT" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#108B88"/></marker>
<marker id="arrG" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#D8A927"/></marker>
<marker id="arrR" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#C85C5C"/></marker>
</defs>
<rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial, Liberation Sans, sans-serif">
<text x="60" y="70" fill="#0B1F3A" font-size="38" font-weight="700" text-anchor="start" >Magnetic forces between moving charges</text><text x="62" y="112" fill="#637783" font-size="20" font-weight="500" text-anchor="start" >One charge creates a magnetic field; another moving charge feels a magnetic force.</text>
<rect x="55" y="145" width="1490" height="780" rx="22" fill="#FFFFFF" stroke="#CBD7D9" stroke-width="2" /><rect x="85" y="200" width="940" height="630" rx="16" fill="#FFFFFF" stroke="#CAD8DC" stroke-width="2" /><text x="109" y="240" fill="#108B88" font-size="24" font-weight="700" text-anchor="start" >Two equal positive charges move side by side</text><rect x="1060" y="200" width="455" height="630" rx="16" fill="#FFFFFF" stroke="#CAD8DC" stroke-width="2" /><text x="1084" y="240" fill="#108B88" font-size="24" font-weight="700" text-anchor="start" >Compare the force sizes</text><line x1="240" y1="405" x2="840" y2="405" stroke="#108B88" stroke-width="6" marker-end="url(#arrT)" /><line x1="240" y1="620" x2="840" y2="620" stroke="#108B88" stroke-width="6" marker-end="url(#arrT)" /><circle cx="540" cy="405" r="40" fill="#FFF2CF" stroke="#D8A927" stroke-width="4" /><circle cx="540" cy="620" r="40" fill="#FFF2CF" stroke="#D8A927" stroke-width="4" /><text x="540" y="414" fill="#0B1F3A" font-size="24" font-weight="700" text-anchor="middle" >+q₁</text><text x="540" y="629" fill="#0B1F3A" font-size="24" font-weight="700" text-anchor="middle" >+q₂</text><text x="805" y="382" fill="#108B88" font-size="18" font-weight="700" text-anchor="middle" >same velocity v</text><text x="805" y="597" fill="#108B88" font-size="18" font-weight="700" text-anchor="middle" >same velocity v</text><line x1="520" y1="360" x2="520" y2="275" stroke="#C85C5C" stroke-width="5" marker-end="url(#arrR)" /><text x="610" y="300" fill="#C85C5C" font-size="17" font-weight="700" text-anchor="start" >Fₑ on upper +q₁ (away)</text><line x1="570" y1="450" x2="570" y2="495" stroke="#3C7EA7" stroke-width="5" marker-end="url(#arrB)" /><text x="620" y="470" fill="#3C7EA7" font-size="17" font-weight="700" text-anchor="start" >Fᵦ on upper +q₁ (toward)</text><line x1="520" y1="665" x2="520" y2="750" stroke="#C85C5C" stroke-width="5" marker-end="url(#arrR)" /><line x1="570" y1="575" x2="570" y2="530" stroke="#3C7EA7" stroke-width="5" marker-end="url(#arrB)" /><line x1="650" y1="450" x2="650" y2="575" stroke="#9AAEB3" stroke-width="2" stroke-dasharray="8 8" /><text x="660" y="515" fill="#637783" font-size="15" font-weight="500" text-anchor="start" >r ⟂ v</text><text x="1285" y="286" fill="#0B1F3A" font-size="19" font-weight="700" text-anchor="middle" >For this side-by-side geometry</text><text x="1285" y="360" fill="#C85C5C" font-size="26" font-weight="700" text-anchor="middle" >Fₑ = kq²/r²</text><text x="1285" y="421" fill="#3C7EA7" font-size="27" font-weight="700" text-anchor="middle" >Fᵦ / Fₑ ≈ v²/c²</text><text x="1285" y="476" fill="#637783" font-size="19" font-weight="600" text-anchor="middle" >when v ≪ c</text><line x1="1130" y1="526" x2="1445" y2="526" stroke="#D4DFE0" stroke-width="2" /><text x="1285" y="577" fill="#0B1F3A" font-size="19" font-weight="700" text-anchor="middle" >Electric repulsion is larger</text><text x="1285" y="609" fill="#0B1F3A" font-size="18" font-weight="600" text-anchor="middle" >at ordinary speeds. Magnetic</text><text x="1285" y="638" fill="#0B1F3A" font-size="18" font-weight="600" text-anchor="middle" >attraction is still present; in a</text><text x="1285" y="667" fill="#0B1F3A" font-size="18" font-weight="600" text-anchor="middle" >wire, many moving charges make</text><text x="1285" y="696" fill="#0B1F3A" font-size="18" font-weight="600" text-anchor="middle" >its collective effect observable.</text><rect x="175" y="770" width="770" height="48" rx="12" fill="#FFF5DA" stroke="#E5C971" stroke-width="2" /><text x="560" y="800" fill="#0B1F3A" font-size="16" font-weight="600" text-anchor="middle" >Lower +q₂: Fₑ points down (away); Fᵦ points up (toward).</text>
<text x="800" y="938" fill="#A9BABC" font-size="26" font-weight="700" text-anchor="middle" opacity="0.24" letter-spacing="2">MARLBRIDGE STUDY RESOURCES</text>
<line x1="55" y1="960" x2="1545" y2="960" stroke="#D8A927" stroke-width="2"/>
<text x="64" y="997" fill="#637783" font-size="14" font-weight="500" text-anchor="start" >Marlbridge • AP Physics study resource • Schematic; assumptions are stated in labels</text>
<image x="1260" y="968" width="285" height="47" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
</g></svg>