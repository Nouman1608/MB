<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">Measuring induced emf with a search coil</title><desc id="desc">A ramped solenoid field passes through an aligned N-turn search coil connected to a voltmeter. Plotting emf magnitude against |dB/dt| gives a straight line with slope NA; a steady current gives zero induced emf.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#20354D"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#357EA2"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B75E53"/></marker></defs><rect width="1600" height="1050" fill="#F4F7F7"/><text x="55" y="58" font-family="Arial,sans-serif" font-size="34" fill="#0B1F3A" font-weight="700" text-anchor="start">Measuring induced emf with a search coil</text><text x="57" y="96" font-family="Arial,sans-serif" font-size="18" fill="#52677C" font-weight="400" text-anchor="start">Marlbridge • AP Physics teaching diagram</text><rect x="60" y="135" width="1480" height="760" rx="16" fill="white" stroke="#C8D3D4" stroke-width="2"/><rect x="100" y="205" width="660" height="555" rx="16" fill="#F7FBFC" stroke="#C8D3D4" stroke-width="2"/><text x="430" y="245" font-family="Arial,sans-serif" font-size="21" fill="#0B1F3A" font-weight="700" text-anchor="middle">ramped-field apparatus</text><rect x="170" y="345" width="190" height="220" rx="0" fill="#EAF2F5" stroke="#357EA2" stroke-width="2"/><text x="265" y="405" font-family="Arial,sans-serif" font-size="19" fill="#0B1F3A" font-weight="700" text-anchor="middle">solenoid</text><line x1="210" y1="380" x2="210" y2="530" stroke="#3F8582" stroke-width="4"  marker-end="url(#a)"/><line x1="250" y1="380" x2="250" y2="530" stroke="#3F8582" stroke-width="4"  marker-end="url(#a)"/><line x1="290" y1="380" x2="290" y2="530" stroke="#3F8582" stroke-width="4"  marker-end="url(#a)"/><line x1="330" y1="380" x2="330" y2="530" stroke="#3F8582" stroke-width="4"  marker-end="url(#a)"/><line x1="170" y1="450" x2="95" y2="450" stroke="#B75E53" stroke-width="4"  marker-end="url(#a)"/><line x1="360" y1="450" x2="445" y2="450" stroke="#B75E53" stroke-width="4"  marker-end="url(#a)"/><text x="265" y="590" font-family="Arial,sans-serif" font-size="17" fill="#B75E53" font-weight="700" text-anchor="middle">I(t) rising at known rate</text><circle cx="540" cy="450" r="65" fill="none" stroke="#C9A227" stroke-width="3"/><circle cx="540" cy="450" r="42" fill="none" stroke="#C9A227" stroke-width="3"/><text x="540" y="455" font-family="Arial,sans-serif" font-size="15" fill="#0B1F3A" font-weight="700" text-anchor="middle">N turns</text><line x1="605" y1="450" x2="670" y2="450" stroke="#20354D" stroke-width="3"  marker-end="url(#a)"/><rect x="650" y="405" width="85" height="90" rx="6" fill="#FFF7DF" stroke="#C9A227" stroke-width="2"/><text x="692" y="460" font-family="Arial,sans-serif" font-size="27" fill="#0B1F3A" font-weight="700" text-anchor="middle">V</text><text x="430" y="690" font-family="Arial,sans-serif" font-size="17" fill="#3F8582" font-weight="600" text-anchor="middle">coil face normal || B</text><rect x="840" y="205" width="650" height="555" rx="16" fill="#F7FBFC" stroke="#C8D3D4" stroke-width="2"/><text x="1165" y="245" font-family="Arial,sans-serif" font-size="21" fill="#0B1F3A" font-weight="700" text-anchor="middle">plot |ℰ| against |dB/dt|</text><line x1="950" y1="645" x2="1390" y2="645" stroke="#20354D" stroke-width="3"  marker-end="url(#a)"/><line x1="950" y1="645" x2="950" y2="335" stroke="#20354D" stroke-width="3"  marker-end="url(#a)"/><text x="1395" y="655" font-family="Arial,sans-serif" font-size="16" fill="#0B1F3A" font-weight="700" text-anchor="start">|dB/dt|</text><text x="930" y="335" font-family="Arial,sans-serif" font-size="16" fill="#0B1F3A" font-weight="700" text-anchor="end">|ℰ|</text><line x1="1000" y1="605" x2="1335" y2="370" stroke="#357EA2" stroke-width="5"  marker-end="url(#a)"/><text x="1190" y="435" font-family="Arial,sans-serif" font-size="20" fill="#3F8582" font-weight="700" text-anchor="start">slope = NA</text><text x="1165" y="705" font-family="Arial,sans-serif" font-size="17" fill="#52677C" font-weight="600" text-anchor="middle">steady current → dB/dt = 0 → ℰ = 0</text><text x="800" y="825" font-family="Arial,sans-serif" font-size="19" fill="#3F8582" font-weight="700" text-anchor="middle">Keep coil position and angle fixed; compare magnitude so polarity conventions are explicit.</text><text x="800" y="914" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#0B1F3A" opacity=".09">MARLBRIDGE • STUDY RESOURCES</text><line x1="55" y1="958" x2="1545" y2="958" stroke="#C9A227" stroke-width="3"/><text x="58" y="991" font-family="Arial,sans-serif" font-size="16" fill="#52677C" font-weight="400" text-anchor="start">Marlbridge Physics study resource • Diagram schematic; assumptions stated in labels</text><image x="1260" y="968" width="285" height="47" href="data:image/svg+xml;base64,"/><text x="800" y="1020" font-family="Arial,sans-serif" font-size="13" fill="#738394" font-weight="400" text-anchor="middle">cd6ad80fd264cb613c40</text></svg>