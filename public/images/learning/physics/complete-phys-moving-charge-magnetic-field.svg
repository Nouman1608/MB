<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="940" viewBox="0 0 1520 940" role="img" aria-labelledby="title desc"><title id="title">Magnetic field of a moving point charge</title><desc id="desc">For a positive point charge moving to the right, an observation point above the path has magnetic field out of the page. A transverse view shows field direction circling the motion axis. The vector expression B = μ0/(4π) q(v × rhat)/r² is scoped to a low-speed quasi-static model.</desc><defs><marker id="aN" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0B1F3A"/></marker><marker id="aB" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#357EA2"/></marker><marker id="aR" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#B75E53"/></marker><marker id="aM" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#56866D"/></marker><marker id="aG" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#C9A227"/></marker></defs><rect width="1520" height="940" fill="#F4F7F6"/><g opacity=".045" transform="translate(686,345) scale(1.1)"><path d="M83 46 H129 A26 26 0 0 1 129 98 H130 A32 32 0 0 1 130 162 H83 Z M104 66 H123 A12 12 0 0 1 123 90 H104 Z M104 106 H124 A18 18 0 0 1 124 142 H104 Z" fill="#C9A227" fill-rule="evenodd"/><path d="M30 162 L30 46 L51 46 L67 116 L83 46 L104 46 L104 162 L83 162 L83 86 L67 150 L51 86 L51 162 Z" fill="#0B1F3A"/></g><g font-family="Arial,sans-serif"><text x="38" y="58" font-family="Arial,sans-serif" font-size="36" font-weight="700" text-anchor="start" fill="#0B1F3A">Magnetic field of a moving point charge</text><text x="38" y="101" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#607184">Marlbridge Physics • Moving charges make magnetic fields</text><rect x="28" y="142" width="710" height="690" rx="16" fill="white" stroke="#BBC8C9" stroke-width="2"/><rect x="782" y="142" width="710" height="690" rx="16" fill="white" stroke="#BBC8C9" stroke-width="2"/><text x="60" y="190" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#0B1F3A">A  Side view: choose the observation point</text><text x="814" y="190" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#0B1F3A">B  View along the direction of motion</text><path d="M130 480 H620" fill="none" stroke="#BBC8C9" stroke-width="2" stroke-dasharray="8 8"/><circle cx="300" cy="480" r="20" fill="#B75E53" stroke="#0B1F3A" stroke-width="2"/><text x="300" y="489" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="white">+q</text><path d="M328 480 H490" fill="none" stroke="#357EA2" stroke-width="6" /><path d="M300 452 L418 330" fill="none" stroke="#C9A227" stroke-width="4" stroke-dasharray="7 7"/><circle cx="420" cy="328" r="9" fill="#56866D" stroke="#56866D" stroke-width="1"/><text x="442" y="325" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#0B1F3A">P</text><text x="365" y="512" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#357EA2">v →</text><text x="360" y="395" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#C9A227">r̂</text><text x="100" y="570" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#0B1F3A">For q &gt; 0, v points right and r̂ points up:</text><text x="100" y="606" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#0B1F3A">v × r̂ points out of the page at P (⊙).</text><text x="100" y="662" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#0B1F3A">B = (μ₀/4π) q (v × r̂) / r²</text><text x="100" y="705" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#607184">Direction follows the right-hand rule; magnitude ∝ |q|v sinθ/r².</text>
<circle cx="1130" cy="470" r="125" fill="#F8FAFA" stroke="#BBC8C9" stroke-width="2"/><circle cx="1130" cy="470" r="22" fill="#B75E53" stroke="#0B1F3A" stroke-width="2"/><text x="1130" y="478" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="white">+q</text><path d="M1150 470 H1265" fill="none" stroke="#357EA2" stroke-width="6" /><text x="1268" y="477" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#357EA2">v</text><circle cx="1130" cy="345" r="9" fill="#0B1F3A"/><circle cx="1130" cy="345" r="9" fill="white" stroke="#0B1F3A" stroke-width="1"/><circle cx="1130" cy="345" r="2" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="1"/><circle cx="1220" cy="380" r="10" fill="#0B1F3A"/><path d="M1215 375 L1225 385 M1225 375 L1215 385" stroke="white" stroke-width="2"/><circle cx="1255" cy="470" r="9" fill="#0B1F3A"/><circle cx="1255" cy="470" r="9" fill="white" stroke="#0B1F3A" stroke-width="1"/><circle cx="1255" cy="470" r="2" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="1"/><circle cx="1220" cy="560" r="10" fill="#0B1F3A"/><path d="M1215 555 L1225 565 M1225 555 L1215 565" stroke="white" stroke-width="2"/><circle cx="1130" cy="595" r="9" fill="#0B1F3A"/><circle cx="1130" cy="595" r="9" fill="white" stroke="#0B1F3A" stroke-width="1"/><circle cx="1130" cy="595" r="2" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="1"/><circle cx="1040" cy="560" r="10" fill="#0B1F3A"/><path d="M1035 555 L1045 565 M1045 555 L1035 565" stroke="white" stroke-width="2"/><circle cx="1005" cy="470" r="9" fill="#0B1F3A"/><circle cx="1005" cy="470" r="9" fill="white" stroke="#0B1F3A" stroke-width="1"/><circle cx="1005" cy="470" r="2" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="1"/><circle cx="1040" cy="380" r="10" fill="#0B1F3A"/><path d="M1035 375 L1045 385 M1045 375 L1035 385" stroke="white" stroke-width="2"/><text x="1130" y="650" font-family="Arial,sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#0B1F3A">At equal-time points around the path:</text><text x="1130" y="681" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#0B1F3A">B circles the motion axis.</text><text x="1130" y="721" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#607184">⊙ out of page     ⊗ into page</text><rect x="820" y="760" width="630" height="52" rx="10" fill="#FFF9E8" stroke="#C9A227" stroke-width="2"/><text x="1135" y="794" font-family="Arial,sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#0B1F3A">Low-speed / quasi-static model; not a relativistic field law.</text><text x="58" y="867" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#607184">The source charge moves; the field is sampled at P. This is distinct from magnetic force on a moving charge.</text><line x1="36" y1="892" x2="1480" y2="892" stroke="#BBC8C9" stroke-width="1.5"/><text x="38" y="923" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#607184">Bounded teaching diagram • Moving charges make magnetic fields • AP Physics 2</text><text x="1370" y="923" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="end" fill="#0B1F3A">MARLBRIDGE</text><g transform="translate(1420,898) scale(.17)"><path d="M83 46 H129 A26 26 0 0 1 129 98 H130 A32 32 0 0 1 130 162 H83 Z M104 66 H123 A12 12 0 0 1 123 90 H104 Z M104 106 H124 A18 18 0 0 1 124 142 H104 Z" fill="#C9A227" fill-rule="evenodd"/><path d="M30 162 L30 46 L51 46 L67 116 L83 46 L104 46 L104 162 L83 162 L83 86 L67 150 L51 86 L51 162 Z" fill="#0B1F3A"/></g></g></svg>
