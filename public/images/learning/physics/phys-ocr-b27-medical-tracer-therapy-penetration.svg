<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><defs><marker id="n" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#0B1F3A"/></marker><marker id="b" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#3C7EA7"/></marker><marker id="t" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#108B88"/></marker><marker id="r" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#C85C5C"/></marker><marker id="gold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#D6A72C"/></marker></defs><title id="title">Radiation in medicine: locate or target</title><desc id="desc">A GCSE comparison of two medical uses of radiation. In imaging, a small gamma-emitting tracer such as technetium-99m is taken up by an organ; gamma rays pass out through the body to an external detector, revealing the tracer location. Alpha radiation would not reach the detector. In treatment, gamma beams from several directions cross at a tumour, concentrating the dose there; a source can also be placed near the tumour or iodine-131 can target the thyroid. The diagram is qualitative.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial, Liberation Sans, sans-serif"><text x="58" y="74" fill="#0B1F3A" font-size="37" font-weight="700">Radiation in medicine: locate or target</text><text x="60" y="116" fill="#637783" font-size="20">A tracer reveals uptake from inside; treatment aims radiation at unwanted tissue.</text><rect x="55" y="150" width="1490" height="750" rx="18" fill="#FFFFFF" stroke="#CBD7D9" stroke-width="2"/><rect x="75" y="190" width="700" height="610" rx="14" fill="#F7FAFA" stroke="#CBD7D9" stroke-width="2"/><rect x="805" y="190" width="720" height="610" rx="14" fill="#F7FAFA" stroke="#CBD7D9" stroke-width="2"/><text x="425" y="235" text-anchor="middle" fill="#0B1F3A" font-size="22" font-weight="700">Tracer imaging • find an organ</text><text x="1165" y="235" text-anchor="middle" fill="#0B1F3A" font-size="22" font-weight="700">Radiotherapy • treat a target</text>
<path d="M300 325 C245 330 205 395 215 490 L240 600 Q425 640 610 600 L635 490 C645 395 605 330 550 325Z" fill="#EAF4F3" stroke="#718B92" stroke-width="4"/><circle cx="425" cy="305" r="47" fill="#EAF4F3" stroke="#718B92" stroke-width="4"/><path d="M335 425 Q425 370 515 425 L505 520 Q425 565 345 520Z" fill="#F7DDDA" stroke="#C85C5C" stroke-width="3"/><text x="425" y="485" text-anchor="middle" fill="#C85C5C" font-size="16" font-weight="700">organ uptake</text><circle cx="425" cy="455" r="9" fill="#D6A72C" stroke="#0B1F3A" stroke-width="2"/><text x="535" y="420" fill="#637783" font-size="15">small Tc-99m tracer</text><rect x="95" y="360" width="115" height="58" rx="8" fill="#FFFFFF" stroke="#3C7EA7" stroke-width="3"/><text x="152" y="385" text-anchor="middle" fill="#3C7EA7" font-size="14" font-weight="700">gamma camera</text><text x="152" y="405" text-anchor="middle" fill="#3C7EA7" font-size="13">detector</text><path d="M418 450 L215 380 M430 455 L215 400" fill="none" stroke="#108B88" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#t)"/><text x="105" y="455" fill="#108B88" font-size="15" font-weight="700">γ exits body</text><text x="105" y="480" fill="#637783" font-size="14">camera maps uptake</text><rect x="125" y="680" width="600" height="78" rx="10" fill="#FFF5DB" stroke="#D6A72C" stroke-width="2"/><text x="425" y="712" text-anchor="middle" fill="#0B1F3A" font-size="16" font-weight="700">Gamma is penetrating; alpha would be absorbed inside</text><text x="425" y="738" text-anchor="middle" fill="#0B1F3A" font-size="16">and would not reach the detector. Tc-99m half-life ≈ 6 h.</text>
<path d="M1000 325 C945 330 905 395 915 490 L940 600 Q1125 640 1310 600 L1335 490 C1345 395 1305 330 1250 325Z" fill="#EAF4F3" stroke="#718B92" stroke-width="4"/><circle cx="1125" cy="305" r="47" fill="#EAF4F3" stroke="#718B92" stroke-width="4"/><circle cx="1125" cy="485" r="54" fill="#F7DDDA" stroke="#C85C5C" stroke-width="4"/><text x="1125" y="491" text-anchor="middle" fill="#C85C5C" font-size="16" font-weight="700">tumour</text><rect x="850" y="330" width="90" height="54" rx="8" fill="#FFFFFF" stroke="#3C7EA7" stroke-width="3"/><text x="895" y="362" text-anchor="middle" fill="#0B1F3A" font-size="14" font-weight="700">γ beam</text><rect x="1350" y="330" width="90" height="54" rx="8" fill="#FFFFFF" stroke="#108B88" stroke-width="3"/><text x="1395" y="362" text-anchor="middle" fill="#0B1F3A" font-size="14" font-weight="700">γ beam</text><line x1="940" y1="365" x2="1080" y2="475" stroke="#3C7EA7" stroke-width="5" marker-end="url(#b)"/><line x1="1350" y1="365" x2="1170" y2="475" stroke="#108B88" stroke-width="5" marker-end="url(#t)"/><text x="1125" y="675" text-anchor="middle" fill="#637783" font-size="14">Other routes: a source can be placed at/near the tumour;</text><text x="1125" y="694" text-anchor="middle" fill="#637783" font-size="14">iodine-131 can target the thyroid.</text><rect x="865" y="700" width="600" height="58" rx="10" fill="#FFF5DB" stroke="#D6A72C" stroke-width="2"/><text x="1165" y="735" text-anchor="middle" fill="#0B1F3A" font-size="16" font-weight="700">Beams overlap at the tumour; schematic, no dose scale.</text>
<rect x="205" y="817" width="1190" height="42" rx="10" fill="#EAF4F3" stroke="#9CCAC5" stroke-width="2"/><text x="800" y="844" text-anchor="middle" fill="#0B1F3A" font-size="17" font-weight="700">Imaging locates tracer uptake; treatment directs radiation to damage unwanted tissue.</text></g><text x="800" y="942" fill="#A9BABC" font-size="26" font-weight="700" text-anchor="middle" opacity=".24" letter-spacing="2">MARLBRIDGE STUDY RESOURCES</text><line x1="55" y1="964" x2="1545" y2="964" stroke="#C9A227" stroke-width="2"/><text x="58" y="1000" fill="#0B1F3A" font-size="17" font-weight="700">MARLBRIDGE • STUDY RESOURCE</text><image x="1260" y="968" width="285" height="70" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/></svg>
