<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="t d"><title id="t">Finite rod field approaches line and point-charge limits</title><desc id="d">A log-log plot of the exact finite-rod field versus distance shows a slope of minus one at distances much smaller than rod length and a slope of minus two at distances much larger than rod length.</desc><rect width="1440" height="590" fill="#F4F7F7"/><text x="65" y="62" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0B1F3A">A finite rod connects two field-distance limits</text><text x="67" y="100" font-family="Arial,sans-serif" font-size="19" fill="#52677C">Log–log comparison for a uniform rod at distance x on its perpendicular bisector</text><rect x="70" y="130" width="1300" height="390" rx="15" fill="#fff" stroke="#C8D3D4" stroke-width="2"/><line x1="185" y1="455" x2="1000" y2="455" stroke="#52677C" stroke-width="3"/><line x1="185" y1="455" x2="185" y2="175" stroke="#52677C" stroke-width="3"/><g stroke="#D8E0E1" stroke-width="1"><line x1="185" y1="175" x2="1000" y2="175"/><line x1="185" y1="245" x2="1000" y2="245"/><line x1="185" y1="315" x2="1000" y2="315"/><line x1="185" y1="385" x2="1000" y2="385"/><line x1="389" y1="175" x2="389" y2="455"/><line x1="593" y1="175" x2="593" y2="455"/><line x1="797" y1="175" x2="797" y2="455"/><line x1="1000" y1="175" x2="1000" y2="455"/></g><g font-family="Arial,sans-serif" font-size="16" fill="#52677C"><text x="185" y="484" text-anchor="middle">0.1</text><text x="389" y="484" text-anchor="middle">0.32</text><text x="593" y="484" text-anchor="middle">1</text><text x="797" y="484" text-anchor="middle">3.2</text><text x="1000" y="484" text-anchor="middle">10</text><text x="160" y="460" text-anchor="end">0.01</text><text x="160" y="390" text-anchor="end">0.1</text><text x="160" y="320" text-anchor="end">1</text><text x="160" y="250" text-anchor="end">10</text><text x="160" y="180" text-anchor="end">100</text></g><text x="590" y="550" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#0B1F3A">Distance ratio x/L (log scale)</text><text x="30" y="315" text-anchor="middle" transform="rotate(-90 30 315)" font-family="Arial,sans-serif" font-size="20" fill="#0B1F3A">E L/(kλ) (log scale)</text><path d="M185 225 L389 264 L593 318 L797 385 L1000 455" fill="none" stroke="#3F8582" stroke-width="6"/><path d="M185 225 L389 260 L593 295 L797 330 L1000 365" fill="none" stroke="#357EA2" stroke-width="4" stroke-dasharray="11 8"/><path d="M593 315 L797 385 L1000 455" fill="none" stroke="#B75E53" stroke-width="4" stroke-dasharray="11 8"/><line x1="593" y1="165" x2="593" y2="455" stroke="#C9A227" stroke-width="3" stroke-dasharray="6 6"/><text x="603" y="198" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#9B7812">x = L</text><g font-family="Arial,sans-serif" font-size="18" fill="#0B1F3A"><text x="1040" y="225" font-weight="700">Exact finite rod</text><line x1="1005" y1="219" x2="1030" y2="219" stroke="#3F8582" stroke-width="5"/><text x="1040" y="285">x ≪ L: E ≈ 2kλ/x</text><line x1="1005" y1="279" x2="1030" y2="279" stroke="#357EA2" stroke-width="4" stroke-dasharray="8 5"/><text x="1040" y="345">x ≫ L: E ≈ kQ/x²</text><line x1="1005" y1="339" x2="1030" y2="339" stroke="#B75E53" stroke-width="4" stroke-dasharray="8 5"/></g><text x="1120" y="420" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#52677C">As distance grows, the finite rod</text><text x="1120" y="447" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#52677C">transitions from line-like to point-like.</text><line x1="65" y1="590" x2="1375" y2="590" stroke="#C9A227" stroke-width="3"/><text x="75" y="610" font-family="Arial,sans-serif" font-size="15" fill="#52677C">Exact curve: E = kλL/[x√(x² + L²/4)], Q = λL. Asymptotes shown for x/L ≪ 1 and x/L ≫ 1. • Marlbridge Physics</text><image href="data:image/svg+xml;base64," x="1190" y="570" width="175" height="48" preserveAspectRatio="xMidYMid meet"/></svg>
