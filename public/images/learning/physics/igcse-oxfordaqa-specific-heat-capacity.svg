<line x1="845" y1="717" x2="845" y2="733" stroke="#1E2B47" stroke-width="3" stroke-linecap="round"/>
<circle cx="845" cy="679" r="38" fill="#FFFFFF" stroke="#1E2B47" stroke-width="3"/>
<text x="845" y="691" font-size="34" font-weight="700" fill="#1E2B47" text-anchor="middle">V</text>
<circle cx="623" cy="622" r="7" fill="#1E2B47"/>
<circle cx="623" cy="733" r="7" fill="#1E2B47"/>
<text x="500" y="828" font-size="24" fill="#4B5B72" text-anchor="middle">A in series, V across the heater</text>
<rect x="33" y="855" width="934" height="278" rx="14" fill="#FFFFFF" stroke="#1E2B47" stroke-width="2.5"/>
<text x="67" y="912" font-size="27" font-weight="700" fill="#1E2B47">E = I × V × t = 4.0 × 12 × 300 = 14 400 J</text>
<text x="67" y="975" font-size="26" font-weight="700" fill="#2F6B63">c = E ÷ (m × Δθ)</text>
<text x="67" y="1030" font-size="26" font-weight="700" fill="#2F6B63">= 14 400 ÷ (1.0 × 16)</text>
<text x="67" y="1094" font-size="36" font-weight="700" fill="#2F6B63">= 900 J/(kg °C)</text>
<text x="933" y="1092" font-size="22" fill="#4B5B72" text-anchor="end">too high if energy is lost</text></g></svg>
