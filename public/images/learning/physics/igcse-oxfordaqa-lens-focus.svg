<svg xmlns="http://www.w3.org/2000/svg" width="900" height="890" viewBox="0 0 1000 988.89" role="img" aria-labelledby="title desc"><title id="title">Focal length and principal focus (OxfordAQA International GCSE Physics)</title><desc id="desc">Top: three parallel rays pass through a converging lens and meet at the principal focus F; the focal length is the distance from the lens to F. Bottom: three parallel rays pass through a diverging lens and spread out as if from a principal focus F on the incoming side, shown by dashed lines traced back (not real rays). No tier labels: 9203 3.3.6b–d.</desc><rect width="1000" height="988.89" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="500" y="62" font-size="36" font-weight="700" fill="#1E2B47" text-anchor="middle">Focal length and principal focus</text>
<text x="500" y="106" font-size="23" fill="#4B5B72" text-anchor="middle">Parallel rays enter each lens</text>
