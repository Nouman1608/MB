<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="740" viewBox="0 0 1440 740" role="img" aria-labelledby="title desc"><title id="title">Test circuit: ammeter in series, voltmeter in parallel</title><desc id="desc">A closed circuit powered by a cell has a closed switch and ammeter in series with a lamp. A voltmeter is connected in a separate parallel branch across the lamp. Conventional current leaves the positive cell terminal.</desc><rect width="1440" height="740" fill="#F4F7F7"/><text x="65" y="65" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#0B1F3A">Measuring current through a lamp and p.d. across it</text><text x="67" y="104" font-family="Arial,sans-serif" font-size="19" fill="#52677C">A complete closed circuit with both meters connected correctly</text><rect x="55" y="135" width="1330" height="520" rx="18" fill="#fff" stroke="#C8D3D4" stroke-width="3"/>
<!-- main loop and components -->
<path d="M290 250H450M530 250H630M710 250H1040V535H290V250" fill="none" stroke="#20354D" stroke-width="5" stroke-linejoin="round"/><line x1="290" y1="250" x2="290" y2="340" stroke="#20354D" stroke-width="5"/><line x1="290" y1="430" x2="290" y2="535" stroke="#20354D" stroke-width="5"/><line x1="260" y1="350" x2="320" y2="350" stroke="#20354D" stroke-width="5"/><line x1="272" y1="415" x2="308" y2="415" stroke="#20354D" stroke-width="5"/><text x="232" y="357" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#3F8582">+</text><text x="234" y="423" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#B75E53">−</text><text x="225" y="475" text-anchor="end" font-family="Arial,sans-serif" font-size="18" fill="#52677C">cell</text>
<!-- closed switch -->
<circle cx="450" cy="250" r="7" fill="#20354D"/><circle cx="530" cy="250" r="7" fill="#20354D"/><line x1="450" y1="250" x2="530" y2="250" stroke="#20354D" stroke-width="5"/><text x="490" y="215" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#52677C">closed switch</text>
<!-- ammeter in series -->
<circle cx="670" cy="250" r="42" fill="#fff" stroke="#20354D" stroke-width="5"/><text x="670" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0B1F3A">A</text><text x="670" y="315" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#357EA2">ammeter in series</text>
<!-- lamp in right leg -->
<line x1="1040" y1="250" x2="1040" y2="335" stroke="#20354D" stroke-width="5"/><circle cx="1040" cy="375" r="40" fill="#fff" stroke="#20354D" stroke-width="5"/><path d="M1015 350L1065 400M1065 350L1015 400" stroke="#20354D" stroke-width="4"/><line x1="1040" y1="415" x2="1040" y2="535" stroke="#20354D" stroke-width="5"/><text x="1097" y="382" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0B1F3A">test lamp</text>
<!-- voltmeter branch in parallel across lamp -->
<line x1="1040" y1="335" x2="1210" y2="335" stroke="#3F8582" stroke-width="5"/><line x1="1040" y1="415" x2="1210" y2="415" stroke="#3F8582" stroke-width="5"/><line x1="1210" y1="335" x2="1210" y2="353" stroke="#3F8582" stroke-width="5"/><circle cx="1210" cy="375" r="22" fill="#fff" stroke="#3F8582" stroke-width="5"/><text x="1210" y="383" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0B1F3A">V</text><line x1="1210" y1="397" x2="1210" y2="415" stroke="#3F8582" stroke-width="5"/><text x="1210" y="455" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#3F8582">voltmeter in parallel</text><text x="1210" y="480" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#52677C">across lamp terminals</text>
<!-- current arrow and labels -->
<path d="M760 250H885" stroke="#B75E53" stroke-width="4" marker-end="url(#arr)"/><text x="822" y="232" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#B75E53">conventional current</text><text x="660" y="590" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0B1F3A">The ammeter is part of the loop; the voltmeter bridges the component.</text><line x1="65" y1="674" x2="1375" y2="674" stroke="#C9A227" stroke-width="3"/><text x="75" y="714" font-family="Arial,sans-serif" font-size="17" fill="#52677C">The voltmeter branch does not break the lamp-current path. • Marlbridge Physics</text><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#B75E53"/></marker></defs><image x="1190" y="684" width="175" height="48" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/></svg>
