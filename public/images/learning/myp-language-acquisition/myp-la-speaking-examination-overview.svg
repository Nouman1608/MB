<svg xmlns="http://www.w3.org/2000/svg" width="900" height="555" viewBox="0 0 900 555" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
<title id="title">The speaking examination at a glance</title>
<desc id="desc">Criteria A, B and D are assessed in the on-screen examination, which is worth 96 marks, 32 each. Criterion C, speaking, is a separate interactive examination worth 32 marks and lasting 15 to 17 minutes including preparation time. It is a conversation, not a speech, and responds to multimodal texts. The classroom teacher marks it against the MYP year 5 speaking criteria, the IB moderates a sample from each school each session, and grades are adjusted where needed.</desc>
<rect width="900" height="555" fill="#f4f6f6"/>
<text x="450" y="52" font-size="30" font-weight="700" fill="#1c2d4b" text-anchor="middle">The speaking examination at a glance</text>
<rect x="30" y="95" width="410" height="285" rx="16" fill="#e8f2ef" stroke="#2f6e66" stroke-width="3"/>
<text x="52" y="134" font-size="20" font-weight="700" fill="#2f6e66" text-anchor="start">On-screen examination: 96 marks</text>
<rect x="52" y="152" width="366" height="56" rx="14" fill="#fff" stroke="#2f6e66" stroke-width="3"/>
<text x="235" y="188" font-size="21" font-weight="700" fill="#1c2d4b" text-anchor="middle">A Listening: 32 marks</text>
<rect x="52" y="224" width="366" height="56" rx="14" fill="#fff" stroke="#2f6e66" stroke-width="3"/>
<text x="235" y="260" font-size="21" font-weight="700" fill="#1c2d4b" text-anchor="middle">B Reading: 32 marks</text>
<rect x="52" y="296" width="366" height="56" rx="14" fill="#fff" stroke="#2f6e66" stroke-width="3"/>
<text x="235" y="332" font-size="21" font-weight="700" fill="#1c2d4b" text-anchor="middle">D Writing: 32 marks</text>
<rect x="460" y="95" width="410" height="285" rx="16" fill="#f0e6b8" stroke="#8a6d0b" stroke-width="3"/>
<text x="482" y="134" font-size="20" font-weight="700" fill="#8a6d0b" text-anchor="start">Speaking examination</text>
<rect x="482" y="152" width="366" height="56" rx="14" fill="#d4b02e" stroke="#1c2d4b" stroke-width="3"/>
<text x="665" y="188" font-size="21" font-weight="700" fill="#1c2d4b" text-anchor="middle">C Speaking: 32 marks</text>
<text x="482" y="236" font-size="19" fill="#1c2d4b" text-anchor="start">• interactive: a conversation,</text>
<text x="482" y="260" font-size="19" fill="#1c2d4b" text-anchor="start">   not a speech</text>
<text x="482" y="292" font-size="19" fill="#1c2d4b" text-anchor="start">• responds to multimodal texts</text>
<text x="482" y="324" font-size="19" fill="#1c2d4b" text-anchor="start">• 15 to 17 minutes, including</text>
<text x="482" y="348" font-size="19" fill="#1c2d4b" text-anchor="start">   preparation time</text>
<rect x="30" y="398" width="264" height="108" rx="14" fill="#fff" stroke="#c9d6d3" stroke-width="3"/>
<text x="48" y="432" font-size="19" font-weight="700" fill="#1c2d4b" text-anchor="start">Teacher marks it</text>
<text x="48" y="460" font-size="17" fill="#4a5a72" text-anchor="start">against the MYP year 5</text>
<text x="48" y="484" font-size="17" fill="#4a5a72" text-anchor="start">speaking criteria</text>
<rect x="318" y="398" width="264" height="108" rx="14" fill="#fff" stroke="#c9d6d3" stroke-width="3"/>
<text x="336" y="432" font-size="19" font-weight="700" fill="#1c2d4b" text-anchor="start">IB moderates a sample</text>
<text x="336" y="460" font-size="17" fill="#4a5a72" text-anchor="start">from each school,</text>
<text x="336" y="484" font-size="17" fill="#4a5a72" text-anchor="start">each session</text>
<rect x="606" y="398" width="264" height="108" rx="14" fill="#fff" stroke="#c9d6d3" stroke-width="3"/>
<text x="624" y="432" font-size="19" font-weight="700" fill="#1c2d4b" text-anchor="start">Grades adjusted</text>
<text x="624" y="460" font-size="17" fill="#4a5a72" text-anchor="start">where needed</text>
<path d="M296,440 L316,452 L296,464 Z" fill="#1c2d4b"/>
<path d="M584,440 L604,452 L584,464 Z" fill="#1c2d4b"/>
<text x="450" y="538" font-size="17" fill="#4a5a72" text-anchor="middle">Assessed at one level: emergent, capable or proficient. Four criteria, equally weighted, levels 1–8.</text>
</svg>
