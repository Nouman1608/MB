<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif"><title id="title">How a tropical cyclone forms</title><desc id="desc">Cross-section of a tropical cyclone over warm ocean. Sea surface temperature of at least 27 degrees Celsius heats the air. Warm moist air rises in two cloud walls either side of a clear eye, condenses and releases heat that powers the storm, then flows out at the top. Earth's rotation spins the system, so the storm must be away from the equator. Over land the storm weakens.</desc>
<defs><marker id="n" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#1c2d4b"/></marker><marker id="o" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#b5652f"/></marker><marker id="t" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#2f6e66"/></marker><marker id="g" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#8a6d0b"/></marker></defs>
<rect width="900" height="900" fill="#e8f0f5"/><rect width="900" height="110" fill="#f4f6f6"/>
<text x="40" y="62" font-size="34" font-weight="700" fill="#1c2d4b">How a tropical cyclone forms</text>
<text x="40" y="96" font-size="21" fill="#4a5a72">Schematic cross-section, not to scale</text>
<text x="350" y="150" font-size="24" font-weight="700" fill="#1c2d4b" text-anchor="middle">Warm moist air rises and condenses</text>
<text x="350" y="185" font-size="21" fill="#1c2d4b" text-anchor="middle">Released heat powers the storm</text>
<path d="M230,220 Q150,190 70,235" fill="none" stroke="#1c2d4b" stroke-width="4" marker-end="url(#n)"/>
<path d="M470,220 Q550,190 630,235" fill="none" stroke="#1c2d4b" stroke-width="4" marker-end="url(#n)"/>
<path d="M160,580 V300 Q160,232 230,232 Q300,232 300,300 V580 Z" fill="#fff" stroke="#1c2d4b" stroke-width="4"/>
<path d="M400,580 V300 Q400,232 470,232 Q540,232 540,300 V580 Z" fill="#fff" stroke="#1c2d4b" stroke-width="4"/>
<line x1="230" y1="570" x2="230" y2="275" stroke="#b5652f" stroke-width="6" marker-end="url(#o)"/>
<line x1="470" y1="570" x2="470" y2="275" stroke="#b5652f" stroke-width="6" marker-end="url(#o)"/>
<text x="350" y="540" font-size="22" font-weight="700" fill="#1c2d4b" text-anchor="middle">Eye</text>
<line x1="30" y1="530" x2="125" y2="530" stroke="#2f6e66" stroke-width="5" marker-end="url(#t)"/>
<line x1="620" y1="530" x2="575" y2="530" stroke="#2f6e66" stroke-width="5" marker-end="url(#t)"/>
<text x="765" y="150" font-size="22" fill="#1c2d4b" text-anchor="middle">Earth’s rotation</text>
<path d="M740,180 Q830,210 790,265" fill="none" stroke="#8a6d0b" stroke-width="4" marker-end="url(#g)"/>
<text x="790" y="300" font-size="22" fill="#1c2d4b" text-anchor="middle">spins it</text>
<rect x="0" y="600" width="640" height="300" fill="#bcdbe5"/><rect x="640" y="590" width="260" height="310" fill="#efe3c4"/><line x1="640" y1="590" x2="640" y2="900" stroke="#1c2d4b" stroke-width="2"/>
<path d="M20,636 q15,-8 30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0 t30,0" fill="none" stroke="#fff" stroke-width="3"/>
<line x1="100" y1="700" x2="100" y2="665" stroke="#b5652f" stroke-width="5" marker-end="url(#o)"/>
<line x1="350" y1="700" x2="350" y2="665" stroke="#b5652f" stroke-width="5" marker-end="url(#o)"/>
<line x1="570" y1="700" x2="570" y2="665" stroke="#b5652f" stroke-width="5" marker-end="url(#o)"/>
<rect x="30" y="712" width="580" height="96" rx="10" fill="#f8fafb"/>
<text x="320" y="752" font-size="25" font-weight="700" fill="#1c2d4b" text-anchor="middle">Warm sea: at least 27 °C</text>
<text x="320" y="788" font-size="21" fill="#1c2d4b" text-anchor="middle">over a large area of ocean</text>
<path d="M735,552 L770,528 L805,552 Z" fill="#b5652f" stroke="#1c2d4b" stroke-width="3"/><rect x="742" y="552" width="56" height="38" fill="#fff" stroke="#1c2d4b" stroke-width="3"/><rect x="764" y="568" width="12" height="22" fill="#9cc7c0" stroke="#1c2d4b" stroke-width="2"/>
<text x="770" y="668" font-size="23" font-weight="700" fill="#1c2d4b" text-anchor="middle">Over land</text>
<text x="770" y="700" font-size="21" fill="#1c2d4b" text-anchor="middle">storm weakens</text>
<text x="770" y="730" font-size="21" fill="#1c2d4b" text-anchor="middle">(no warm sea)</text>
<rect x="30" y="825" width="840" height="58" rx="14" fill="#fff" stroke="#1c2d4b" stroke-width="3"/>
<text x="450" y="864" font-size="24" font-weight="700" fill="#1c2d4b" text-anchor="middle">Needs warm ocean AND distance from the equator</text>
</svg>
