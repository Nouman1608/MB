<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Placental villus: exchange across a thin barrier</title><desc id="desc">A cross-section shows maternal blood surrounding a chorionic villus, fetal blood within a capillary, and a thin tissue barrier. Oxygen, nutrients, carbon dioxide and urea are shown moving in opposite overall directions while the two blood spaces remain separate.</desc><defs><marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#D76C61"/></marker><marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#3983B8"/></marker><marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#168C8C"/></marker><marker id="arrow-gold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#E1AA37"/></marker></defs><rect width="1600" height="1000" fill="#F4F8F7"/><text x="800" y="60" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#17324D" text-anchor="middle">Placental villus: exchange across a thin barrier</text><text x="800" y="96" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#526778" text-anchor="middle">Pearson Edexcel International GCSE Biology 4BI1 • Reproduction • placenta and nutrition (3.11)</text><rect x="55" y="140" width="1490" height="700" rx="14" fill="#fff" stroke="#CAD7DC" stroke-width="2"/><text x="95" y="190" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17324D" text-anchor="start">Cross-section of one chorionic villus: two blood spaces remain separate</text><rect x="150" y="260" width="1300" height="445" rx="22" fill="#FFF4D6" stroke="#E1AA37" stroke-width="3"/><text x="220" y="300" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#E1AA37" text-anchor="start">MATERNAL BLOOD IN INTERVILLOUS SPACE</text><path d="M520 325 Q800 230 1080 325 L1095 560 Q1050 670 800 680 Q550 670 505 560Z" fill="#FCE9E1" stroke="#D76C61" stroke-width="5"/><text x="800" y="360" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#D76C61" text-anchor="middle">chorionic villus tissue</text><path d="M660 430 Q800 370 940 430 L930 555 Q800 610 670 555Z" fill="#DDEFF7" stroke="#3983B8" stroke-width="4"/><text x="800" y="485" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#3983B8" text-anchor="middle">fetal capillary</text><ellipse cx="760" cy="530" rx="24" ry="13" fill="#C95750" stroke="#B94F47" stroke-width="2"/><ellipse cx="835" cy="535" rx="24" ry="13" fill="#C95750" stroke="#B94F47" stroke-width="2"/><text x="800" y="635" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17324D" text-anchor="middle">Thin exchange barrier</text><path d="M330 430 L605 445" fill="none" stroke="#168C8C" stroke-width="5" marker-end="url(#arrow-teal)"/><text x="420" y="410" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#168C8C" text-anchor="middle">O₂ • glucose • nutrients</text><path d="M980 510 L1240 510" fill="none" stroke="#D76C61" stroke-width="5" marker-end="url(#arrow-red)"/><text x="1110" y="485" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#D76C61" text-anchor="middle">CO₂ • urea</text><rect x="170" y="735" width="1260" height="80" rx="12" fill="#FFF4D6" stroke="#E1AA37" stroke-width="2"/><text x="800" y="770" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#17324D" text-anchor="middle">Maternal and fetal blood do not normally mix; exchange pathways vary by substance.</text><text x="800" y="797" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#526778" text-anchor="middle">Arrows show overall direction only; do not assume every substance crosses by simple diffusion.</text><text x="42" y="938" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#526778" text-anchor="start">Schematic villus cross-section • tissue proportions not to scale</text><path d="M40 918H1560" stroke="#E1AA37" stroke-width="3"/><text x="800" y="898" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#17324D" opacity=".07" text-anchor="middle">MARLBRIDGE STUDY RESOURCES</text><image href="data:image/svg+xml;base64," x="1365" y="923" width="190" height="54" preserveAspectRatio="xMaxYMid meet"/><text x="42" y="980" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#526778" text-anchor="start">MARLBRIDGE • STUDY RESOURCE</text></svg>