<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1010" viewBox="0 0 1800 2020" role="img" aria-labelledby="title desc"><title id="title">The menstrual cycle (Edexcel International GCSE Biology)</title><desc id="desc">Top: the lining of the uterus over a 28-day cycle. It breaks down during days 1 to 5, then thickens; ovulation, when an egg is released, is at day 14; the lining stays thick until about day 26, then starts to break down. Bottom: a sketch of hormone levels. FSH peaks early in the cycle, oestrogen peaks just before ovulation, LH surges sharply at ovulation and progesterone peaks around day 21. A label marks FSH and LH as Paper 2 only (4BI1 3.10B); oestrogen and progesterone are statement 3.9, on both papers.</desc><rect width="1800" height="2020" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="88" font-size="68" font-weight="700" fill="#1E2B47" text-anchor="middle">The menstrual cycle</text>
<text x="900" y="164" font-size="44" fill="#4B5B72" text-anchor="middle">A 28-day cycle</text>
<text x="60" y="294" font-size="50" font-weight="700" fill="#1E2B47">Lining of the uterus</text>
<rect x="262" y="410" width="258" height="410" fill="#F2D4C6"/>
<text x="296" y="474" font-size="42" font-weight="700" fill="#9C4A1F">days 1-5</text>
