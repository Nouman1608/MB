<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">Amino-acid structure and peptide-bond formation</title><desc id="desc">Amino-acid structure and peptide-bond formation. Two general neutral-form amino acids join by condensation. A carboxyl OH and an amino H leave as water; the carbonyl carbon bonds to nitrogen to make the peptide linkage –CO–NH–. A companion short polypeptide schematic marks the free N and C termini and sequence backbone. R groups vary; this is not a stereochemical molecular model.</desc><rect width="100%" height="100%" fill="#f5f8f7"/><text x="26" y="46" font-family="Arial,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#1c2d4b">Amino-acid structure and peptide-bond formation</text><text x="26" y="80" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#1c2d4b">General amino-acid condensation makes a peptide bond.</text><g transform="translate(30,120)"><rect x="0" y="0" width="740" height="410" rx="12" fill="white" stroke="#cbd7d5" stroke-width="2"/><text x="20" y="34" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#1c2d4b">One amino acid and a peptide bond</text><text x="20" y="60" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#71818d">General neutral-form scheme; R groups differ between amino acids</text><rect x="38" y="118" width="275" height="105" rx="10" fill="#e3efec" stroke="#73aaa4" stroke-width="1.5"/><text x="175" y="154" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1c2d4b">H₂N–CH(R₁)–COOH</text><text x="175" y="188" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#1c2d4b">amino  •  alpha carbon  •  carboxyl</text><text x="350" y="170" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#d6b32d">+</text><rect x="400" y="118" width="275" height="105" rx="10" fill="#e3efec" stroke="#73aaa4" stroke-width="1.5"/><text x="537" y="154" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1c2d4b">H₂N–CH(R₂)–COOH</text><text x="537" y="188" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#1c2d4b">second amino acid</text><text x="354" y="265" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#357ea2">condensation: remove –OH + –H → H₂O</text><text x="360" y="315" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#1c2d4b">H₂N–CH(R₁)–CO–NH–CH(R₂)–COOH  +  H₂O</text><rect x="402" y="323" width="100" height="35" rx="8" fill="#fff5ec" stroke="#b55c52" stroke-width="1.5"/><text x="452" y="347" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#b55c52">peptide bond</text><text x="36" y="388" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#1c2d4b">Hydrolysis adds water to break the peptide bond; chain ends remain –NH₂ and –COOH.</text></g><g transform="translate(820,120)"><rect x="0" y="0" width="740" height="410" rx="12" fill="white" stroke="#cbd7d5" stroke-width="2"/><text x="20" y="34" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#1c2d4b">Read a polypeptide from N to C</text><text x="20" y="60" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#71818d">Successive peptide bonds connect amino-acid residues</text><rect x="45" y="145" width="155" height="85" rx="10" fill="#e3efec" stroke="#73aaa4" stroke-width="1.5"/><text x="122" y="178" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#1c2d4b">N terminus</text><text x="122" y="207" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#1c2d4b">free –NH₂</text><text x="224" y="190" font-family="Arial,sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#357ea2">→</text><circle cx="280" cy="185" r="34" fill="#f7eac5" stroke="#d6b32d" stroke-width="2"/><text x="280" y="191" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1c2d4b">R1</text><line x1="314" y1="185" x2="346" y2="185" stroke="#73aaa4" stroke-width="5" stroke-linecap="round"/><circle cx="380" cy="185" r="34" fill="#f7eac5" stroke="#d6b32d" stroke-width="2"/><text x="380" y="191" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1c2d4b">R2</text><line x1="414" y1="185" x2="446" y2="185" stroke="#73aaa4" stroke-width="5" stroke-linecap="round"/><circle cx="480" cy="185" r="34" fill="#f7eac5" stroke="#d6b32d" stroke-width="2"/><text x="480" y="191" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1c2d4b">R3</text><text x="575" y="190" font-family="Arial,sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#357ea2">→</text><rect x="605" y="145" width="100" height="85" rx="10" fill="#e3efec" stroke="#73aaa4" stroke-width="1.5"/><text x="655" y="178" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1c2d4b">C terminus</text><text x="655" y="207" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#1c2d4b">free –COOH</text><text x="36" y="285" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#1c2d4b">Primary structure is the amino-acid sequence.</text><text x="36" y="320" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#1c2d4b">Each link is a covalent –CO–NH– bond. R groups are not part of the backbone.</text><text x="36" y="355" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#71818d">This schematic shows three residues; real polypeptides can be much longer.</text></g><text x="26" y="1030" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#1c2d4b">MARLBRIDGE • Schematic; not to scale.</text></svg>