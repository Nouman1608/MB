<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1130" viewBox="0 0 1800 2260" role="img" aria-labelledby="title desc"><title id="title">Built to carry water (OxfordAQA International GCSE Biology)</title><desc id="desc">A xylem vessel cut lengthways, carrying water from the root to the leaf. (1) Thick walls with lignin are strong, so the vessel does not collapse, and support the plant; (2) there are no cell contents, so nothing blocks the flow of water; (3) the cells are joined end to end with no cross walls, making one long tube from root to leaf. Dotted lines show where one cell ended and the next began. No tier labels: 9201 3.2.2f says the structure of the xylem is related to its function.</desc><rect width="1800" height="2260" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="88" font-size="68" font-weight="700" fill="#1E2B47" text-anchor="middle">Built to carry water</text>
<text x="900" y="164" font-size="44" fill="#4B5B72" text-anchor="middle">A xylem vessel, cut lengthways</text>
<text x="460" y="364" font-size="46" font-weight="700" fill="#2F6B63" text-anchor="middle">To the leaf</text>
<text x="460" y="2108" font-size="46" font-weight="700" fill="#2F6B63" text-anchor="middle">From the root</text>
