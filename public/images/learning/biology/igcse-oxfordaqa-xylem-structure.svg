<text x="952" y="672" font-size="52" font-weight="700" fill="#1E2B47">Thick walls with lignin</text>
<text x="952" y="750" font-size="44" fill="#4B5B72">strong: no collapse,</text>
<text x="952" y="812" font-size="44" fill="#4B5B72">supports the plant</text>
<circle cx="878" cy="1116" r="38" fill="#1E2B47"/><text x="878" y="1131" font-size="42" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="952" y="1132" font-size="52" font-weight="700" fill="#1E2B47">No cell contents</text>
<text x="952" y="1210" font-size="44" fill="#4B5B72">nothing blocks the flow of water</text>
<circle cx="878" cy="1580" r="38" fill="#1E2B47"/><text x="878" y="1595" font-size="42" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="952" y="1596" font-size="52" font-weight="700" fill="#1E2B47">Cells joined end to end</text>
<text x="952" y="1670" font-size="44" fill="#4B5B72">no cross walls: one long</text>
<text x="952" y="1732" font-size="44" fill="#4B5B72">tube from root to leaf</text>
<text x="880" y="2000" font-size="42" fill="#4B5B72">Dotted line: where one cell</text>
<text x="880" y="2058" font-size="42" fill="#4B5B72">ended and the next began</text></g></svg>
