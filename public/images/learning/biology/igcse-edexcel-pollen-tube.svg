<svg xmlns="http://www.w3.org/2000/svg" width="900" height="960" viewBox="0 0 1800 1920" role="img" aria-labelledby="title desc"><title id="title">From pollen to seed (Edexcel International GCSE Biology)</title><desc id="desc">Section through a carpel showing the stigma, style, ovary and ovule. (1) Pollen lands on the stigma: pollination; (2) a pollen tube grows down the style; (3) the tube enters the ovule through the micropyle; (4) the pollen nucleus fuses with the ovule nucleus: fertilisation. No tier labels: growth of the pollen tube followed by fertilisation is 4BI1 statement 3.4, on both papers.</desc><rect width="1800" height="1920" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="88" font-size="68" font-weight="700" fill="#1E2B47" text-anchor="middle">From pollen to seed</text>
<text x="900" y="164" font-size="44" fill="#4B5B72" text-anchor="middle">Section through a carpel</text>
