<text x="1320" y="356" font-size="46" font-weight="700" fill="#1E2B47">Pollen lands on</text>
<text x="1320" y="416" font-size="46" fill="#1E2B47">the stigma:</text>
<text x="1320" y="476" font-size="46" fill="#1E2B47">pollination</text>
<text x="1320" y="786" font-size="46" font-weight="700" fill="#1E2B47">Pollen tube grows</text>
<text x="1320" y="846" font-size="46" fill="#1E2B47">down the style</text>
<text x="1320" y="1240" font-size="46" font-weight="700" fill="#1E2B47">Tube enters the</text>
<text x="1320" y="1300" font-size="46" fill="#1E2B47">ovule through</text>
<text x="1320" y="1360" font-size="46" fill="#1E2B47">the micropyle</text>
<text x="1320" y="1524" font-size="46" font-weight="700" fill="#1E2B47">Pollen nucleus</text>
<text x="1320" y="1584" font-size="46" fill="#1E2B47">fuses with ovule</text>
<text x="1320" y="1644" font-size="46" fill="#1E2B47">nucleus:</text>
<text x="1320" y="1704" font-size="46" fill="#1E2B47">fertilisation</text></g></svg>
