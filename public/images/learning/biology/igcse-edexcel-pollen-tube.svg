<circle cx="900" cy="1546" r="48" fill="#2F6B63" stroke="#1E2B47" stroke-width="5"/>
<circle cx="900" cy="356" r="54" fill="#D6B22F" stroke="#1E2B47" stroke-width="5"/>
<text x="60" y="452" font-size="46" font-weight="700" fill="#1E2B47">Stigma</text>
