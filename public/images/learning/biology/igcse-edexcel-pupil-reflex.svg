<svg xmlns="http://www.w3.org/2000/svg" width="900" height="960" viewBox="0 0 1800 1920" role="img" aria-labelledby="title desc"><title id="title">Pupil reflex (Edexcel International GCSE Biology)</title><desc id="desc">Front views of the eye. In bright light the circular muscles of the iris contract and the radial muscles relax, so the pupil narrows and less light enters. In dim light the circular muscles relax and the radial muscles contract, so the pupil widens and more light enters. A key explains that the iris muscles work as an antagonistic pair. No tier labels: the eye responding to changes in light intensity is 4BI1 statement 2.92, on both papers.</desc><rect width="1800" height="1920" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="88" font-size="68" font-weight="700" fill="#1E2B47" text-anchor="middle">Pupil reflex</text>
