<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">Chromosome structure and telomere protection</title><desc id="desc">Chromosome structure and telomere protection. Panel A labels the sister chromatids, centromere, telomere ends and DNA wrapped around histones. Panel B gives a simplified before/after end-replication schematic in which repeat-rich telomere DNA shortens before adjacent genes are lost. It is explicitly simplified and does not depict detailed strand-specific replication or telomerase.</desc><rect width="100%" height="100%" fill="#f5f8f7"/><text x="26" y="46" font-family="Arial,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#1c2d4b">Chromosome structure and telomere protection</text><text x="26" y="80" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#1c2d4b">Sister chromatids, histones and telomere shortening.</text><g transform="translate(30,120)"><rect x="0" y="0" width="740" height="410" rx="12" fill="white" stroke="#cbd7d5" stroke-width="2"/><text x="20" y="34" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#1c2d4b">A replicated chromosome</text><text x="20" y="60" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#71818d">Two identical sister chromatids joined at the centromere</text><line x1="112" y1="112" x2="260" y2="270" stroke="#1c2d4b" stroke-width="20" stroke-linecap="round"/><line x1="260" y1="112" x2="112" y2="270" stroke="#1c2d4b" stroke-width="20" stroke-linecap="round"/><circle cx="186" cy="191" r="14" fill="#d6b32d" stroke="#1c2d4b" stroke-width="2"/><circle cx="112" cy="112" r="10" fill="#b55c52" stroke="white" stroke-width="2"/><circle cx="260" cy="270" r="10" fill="#b55c52" stroke="white" stroke-width="2"/><circle cx="260" cy="112" r="10" fill="#b55c52" stroke="white" stroke-width="2"/><circle cx="112" cy="270" r="10" fill="#b55c52" stroke="white" stroke-width="2"/><line x1="112" y1="112" x2="65" y2="85" stroke="#357ea2" stroke-width="1.8" stroke-linecap="round"/><text x="34" y="77" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#357ea2">telomere</text><line x1="196" y1="196" x2="259" y2="292" stroke="#d6b32d" stroke-width="1.8" stroke-linecap="round"/><text x="267" y="300" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#d6b32d">centromere</text><line x1="260" y1="112" x2="318" y2="90" stroke="#73aaa4" stroke-width="1.8" stroke-linecap="round"/><text x="324" y="87" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#73aaa4">sister chromatids</text><rect x="360" y="105" width="340" height="155" rx="10" fill="#e3efec" stroke="#73aaa4" stroke-width="1.5"/><text x="530" y="132" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#1c2d4b">Chromatin packs DNA</text><line x1="395" y1="184" x2="665" y2="184" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round"/><circle cx="418" cy="184" r="16" fill="white" stroke="#357ea2" stroke-width="3"/><line x1="406" y1="184" x2="430" y2="184" stroke="#d6b32d" stroke-width="2" stroke-linecap="round"/><circle cx="472" cy="184" r="16" fill="white" stroke="#357ea2" stroke-width="3"/><line x1="460" y1="184" x2="484" y2="184" stroke="#d6b32d" stroke-width="2" stroke-linecap="round"/><circle cx="526" cy="184" r="16" fill="white" stroke="#357ea2" stroke-width="3"/><line x1="514" y1="184" x2="538" y2="184" stroke="#d6b32d" stroke-width="2" stroke-linecap="round"/><circle cx="580" cy="184" r="16" fill="white" stroke="#357ea2" stroke-width="3"/><line x1="568" y1="184" x2="592" y2="184" stroke="#d6b32d" stroke-width="2" stroke-linecap="round"/><circle cx="634" cy="184" r="16" fill="white" stroke="#357ea2" stroke-width="3"/><line x1="622" y1="184" x2="646" y2="184" stroke="#d6b32d" stroke-width="2" stroke-linecap="round"/><text x="530" y="228" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1c2d4b">DNA wraps around histone proteins</text><text x="35" y="316" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#1c2d4b">A G1 chromosome has one chromatid; this replicated form appears after S phase.</text><text x="35" y="350" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#1c2d4b">Telomeres are repeated, non-coding sequences at both chromosome ends.</text><text x="35" y="383" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#71818d">Schematic structure; lengths and chromosome shape are not to scale.</text></g><g transform="translate(820,120)"><rect x="0" y="0" width="740" height="410" rx="12" fill="white" stroke="#cbd7d5" stroke-width="2"/><text x="20" y="34" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#1c2d4b">Telomeres protect genes at chromosome ends</text><text x="20" y="60" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#71818d">Simplified end-replication model; sequence lengths are not to scale</text><text x="42" y="110" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#1c2d4b">Before repeated DNA replication</text><text x="42" y="138" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#1c2d4b">[telomere repeats] [nearby gene]</text><rect x="42" y="155" width="640" height="30" rx="6" fill="#ffffff" stroke="#1c2d4b" stroke-width="1.6"/><rect x="48" y="159" width="180" height="22" rx="4" fill="#e6efec" stroke="#73aaa4" stroke-width="1"/><rect x="235" y="159" width="120" height="22" rx="4" fill="#f4ddb0" stroke="#d6b32d" stroke-width="1"/><text x="135" y="175" font-family="Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1c2d4b">telomere</text><text x="295" y="175" font-family="Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1c2d4b">gene</text><text x="42" y="234" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#1c2d4b">After end sequences shorten over cell divisions</text><rect x="42" y="250" width="640" height="30" rx="6" fill="#ffffff" stroke="#1c2d4b" stroke-width="1.6"/><rect x="48" y="254" width="112" height="22" rx="4" fill="#e6efec" stroke="#73aaa4" stroke-width="1"/><rect x="167" y="254" width="120" height="22" rx="4" fill="#f4ddb0" stroke="#d6b32d" stroke-width="1"/><text x="104" y="270" font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1c2d4b">shorter telomere</text><text x="227" y="270" font-family="Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1c2d4b">gene remains</text><text x="42" y="319" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#1c2d4b">Repeated telomere DNA shortens first, buffering nearby genes.</text><text x="42" y="354" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#1c2d4b">In most body cells, telomeres shorten with division. Enzyme details are outside this diagram.</text><text x="42" y="386" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#b55c52">Telomeres do not prevent all DNA loss; they buffer genes.</text></g><text x="26" y="1030" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#1c2d4b">MARLBRIDGE • Schematic; not to scale.</text></svg>