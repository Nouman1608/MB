  <rect x="80" y="672" width="1440" height="120" rx="14" fill="#FFF4D8" stroke="#D4AA27" stroke-width="2"/>
  <text x="800" y="707" class="head" text-anchor="middle">Why the pH falls</text>
  <text x="800" y="740" class="call" text-anchor="middle">lipase breaks milk fat → fatty acids form → pH decreases</text>
  <text x="800" y="771" class="small" text-anchor="middle">Keep sample volumes, starting mixture, lipase amount and timing consistent. Use one pH-reading or indicator end-point method throughout.</text>
