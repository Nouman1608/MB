<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">AQA required practical 10: milk decay and pH</title>
  <desc id="desc">A controlled comparison at different water-bath temperatures. Equal milk and alkaline indicator mixtures receive equal lipase volumes to start timing. Lipase makes fatty acids from milk fat, lowering pH. pH is measured at fixed intervals or the same indicator endpoint is used consistently. The diagram is illustrative; follow the approved school method.</desc>
