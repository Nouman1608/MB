<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="871" viewBox="0 0 1528 871" role="img" aria-labelledby="title desc">
  <title id="title">Nitrogen cycling and the roles of microorganisms</title>
  <desc id="desc">Nitrogen fixation, nitrification via nitrite and denitrification connect atmospheric nitrogen with soil nitrogen compounds. Plants assimilate nitrate, feeding transfers organic nitrogen, and decomposition releases ammonium.</desc>
  <defs>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1c2d4b" />
    </marker>
    <marker id="red" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b75e53" />
    </marker>
    <marker id="blue" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#357ea2" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f8f7" />
  <g font-family="Arial, sans-serif">
    <text x="24" y="58" font-size="38" font-weight="700" text-anchor="start" fill="#1c2d4b">Nitrogen cycling and the roles of microorganisms</text>
    <text x="24" y="104" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Edexcel International GCSE Biology 4BI1 • transformations and transfers</text>
    <g transform="translate(24,172)">
      <rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2" />
      <text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Microorganisms change nitrogen compounds</text>
      <rect x="70" y="95" width="580" height="65" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2" />
      <text x="360.0" y="127" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">Atmospheric nitrogen, N₂</text>
      <rect x="70" y="245" width="235" height="85" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2" />
      <text x="187.5" y="277" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">Ammonium ions</text>
      <rect x="415" y="245" width="235" height="85" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2" />
      <text x="532.5" y="277" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">Nitrate ions</text>
      <path d="M190,165 L190,235" fill="none" stroke="#1c2d4b" stroke-width="4" marker-end="url(#arr)" />
      <text x="295" y="200" font-size="22" font-weight="700" text-anchor="start" fill="#1c2d4b">Nitrogen fixation</text>
      <text x="295" y="231" font-size="22" font-weight="700" text-anchor="start" fill="#1c2d4b">by bacteria</text>
      <path d="M315,285 L405,285" fill="none" stroke="#1c2d4b" stroke-width="4" marker-end="url(#arr)" />
      <text x="360" y="355" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">Nitrification via nitrite</text>
      <path d="M650,285 H685 V126 H660" fill="none" stroke="#1c2d4b" stroke-width="4" marker-end="url(#arr)" />
      <text x="365" y="405" font-size="22" font-weight="700" text-anchor="middle" fill="#1c2d4b">Denitrification: nitrate → N₂</text>
      <text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Nitrogen-fixing bacteria convert N₂ into usable compounds.</text>
      <text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Nitrifying bacteria oxidise ammonium via nitrite to nitrate.</text>
      <text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Denitrifying bacteria return nitrogen gas to the air.</text>
    </g>
    <g transform="translate(784,172)">
      <rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2" />
      <text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Build proteins; return nitrogen to soil</text>
      <rect x="55" y="105" width="260" height="75" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2" />
      <text x="185.0" y="137" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">Nitrate in soil</text>
      <rect x="405" y="105" width="260" height="75" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2" />
      <text x="535.0" y="137" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">Plant proteins</text>
      <rect x="405" y="275" width="260" height="75" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2" />
      <text x="535.0" y="307" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">Animal proteins</text>
      <rect x="55" y="375" width="260" height="75" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2" />
      <text x="185.0" y="407" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">Ammonium in soil</text>
      <path d="M325,143 L395,143" fill="none" stroke="#1c2d4b" stroke-width="4" marker-end="url(#arr)" />
      <text x="360" y="92" font-size="21" font-weight="700" text-anchor="middle" fill="#1c2d4b">Uptake and assimilation</text>
      <path d="M535,190 L535,265" fill="none" stroke="#1c2d4b" stroke-width="4" marker-end="url(#arr)" />
      <text x="605" y="235" font-size="21" font-weight="700" text-anchor="middle" fill="#1c2d4b">Feeding</text>
      <path d="M430,180 V220 H360 V410 H325" fill="none" stroke="#1c2d4b" stroke-width="4" marker-end="url(#arr)" />
      <path d="M405,313 H380 V435 H325" fill="none" stroke="#1c2d4b" stroke-width="4" marker-end="url(#arr)" />
      <text x="180" y="300" font-size="21" font-weight="700" text-anchor="middle" fill="#1c2d4b">Decomposition</text>
      <text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Plants use absorbed nitrate to make amino acids and proteins.</text>
      <text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Feeding passes organic nitrogen to animals. Decomposers</text>
      <text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">return ammonium from dead material and waste.</text>
    </g>
    <text x="24" y="849" font-size="19" font-weight="400" text-anchor="start" fill="#1c2d4b">MARLBRIDGE  •  Schematic; structures and particles are not to scale.</text>
  </g>
</svg>