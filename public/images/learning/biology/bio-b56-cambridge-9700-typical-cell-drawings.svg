<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Schematic drawings of typical plant and animal cells</title>
  <desc id="desc">Side-by-side simplified drawings of a typical photosynthesising plant cell and animal cell. Numbered keys identify cell boundaries, nucleus, vacuole, chloroplasts, mitochondria and other organelles. The drawings are schematic and not to scale.</desc>
  <rect width="1600" height="1000" fill="#f5f8f7"/>
  <text x="60" y="68" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#10233f">Typical plant and animal cell drawings</text>
  <text x="62" y="108" font-family="Arial,sans-serif" font-size="20" fill="#536477">Simplified eukaryotic cell diagrams • not to scale • compare with the authentic micrographs above</text>
  <rect x="50" y="145" width="735" height="750" rx="16" fill="#fff" stroke="#cad5d9" stroke-width="2"/>
  <rect x="815" y="145" width="735" height="750" rx="16" fill="#fff" stroke="#cad5d9" stroke-width="2"/>
  <text x="417" y="192" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#10233f">PLANT CELL • photosynthesising</text>
  <text x="1182" y="192" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#10233f">ANIMAL CELL • typical example</text>

  <!-- Plant cell: wall and membrane, large vacuole, chloroplasts and shared eukaryotic organelles. -->
  <rect x="157" y="232" width="520" height="350" rx="30" fill="#fffdf7" stroke="#10233f" stroke-width="10"/>
  <rect x="171" y="246" width="492" height="322" rx="22" fill="none" stroke="#168c8c" stroke-width="4"/>
  <rect x="342" y="326" width="247" height="184" rx="24" fill="#edf7fa" stroke="#315f86" stroke-width="4"/>
  <ellipse cx="255" cy="326" rx="52" ry="43" fill="#f4e9f0" stroke="#725c8e" stroke-width="4"/>
  <circle cx="261" cy="328" r="14" fill="#725c8e"/>
  <ellipse cx="566" cy="294" rx="40" ry="21" fill="#edf4d8" stroke="#5d7a42" stroke-width="4"/>
  <path d="M540 294H592M548 286H584M548 302H584" stroke="#5d7a42" stroke-width="3"/>
  <ellipse cx="230" cy="492" rx="35" ry="17" fill="#fff1dd" stroke="#a76940" stroke-width="4"/>
  <path d="M205 492C214 475 224 509 234 492S252 475 260 492" fill="none" stroke="#a76940" stroke-width="3"/>
  <path d="M248 399C278 384 300 390 326 402M245 415C276 400 302 406 330 419M250 432C279 417 304 424 330 437" fill="none" stroke="#725c8e" stroke-width="4"/>
  <path d="M270 485C285 471 301 470 317 478M270 496C286 485 302 484 318 492M270 507C284 499 302 498 317 506" fill="none" stroke="#c9a227" stroke-width="4"/>
  <circle cx="300" cy="285" r="4" fill="#10233f"/><circle cx="315" cy="296" r="4" fill="#10233f"/><circle cx="327" cy="282" r="4" fill="#10233f"/><circle cx="286" cy="470" r="4" fill="#10233f"/><circle cx="305" cy="462" r="4" fill="#10233f"/><circle cx="320" cy="474" r="4" fill="#10233f"/>
  <ellipse cx="620" cy="520" rx="34" ry="18" fill="#edf4d8" stroke="#5d7a42" stroke-width="4"/>
  <path d="M594 520H646M602 512H638M602 528H638" stroke="#5d7a42" stroke-width="3"/>
  <g font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#fff">
    <circle cx="182" cy="260" r="16" fill="#10233f"/><text x="182" y="266">1</text>
    <circle cx="196" cy="276" r="16" fill="#168c8c"/><text x="196" y="282">2</text>
    <circle cx="255" cy="326" r="16" fill="#725c8e"/><text x="255" y="332">3</text>
    <circle cx="465" cy="418" r="16" fill="#315f86"/><text x="465" y="424">4</text>
    <circle cx="566" cy="294" r="16" fill="#5d7a42"/><text x="566" y="300">5</text>
    <circle cx="230" cy="492" r="16" fill="#a76940"/><text x="230" y="498">6</text>
    <circle cx="287" cy="485" r="16" fill="#c9a227"/><text x="287" y="491">7</text>
  </g>
  <g font-family="Arial,sans-serif" font-size="17" fill="#10233f">
    <text x="88" y="626"><tspan font-weight="700">1</tspan><tspan dx="6">Cellulose cell wall</tspan></text>
    <text x="88" y="655"><tspan font-weight="700">2</tspan><tspan dx="6">Cell surface membrane</tspan></text>
    <text x="88" y="684"><tspan font-weight="700">3</tspan><tspan dx="6">Nucleus and nucleolus</tspan></text>
    <text x="430" y="626"><tspan font-weight="700">4</tspan><tspan dx="6">Vacuole and tonoplast</tspan></text>
    <text x="430" y="655"><tspan font-weight="700">5</tspan><tspan dx="6">Chloroplast</tspan></text>
    <text x="430" y="684"><tspan font-weight="700">6</tspan><tspan dx="6">Mitochondrion</tspan></text>
    <text x="88" y="713"><tspan font-weight="700">7</tspan><tspan dx="6">Golgi body; ribosomes are dots</tspan></text>
    <text x="88" y="748" fill="#536477">Rough ER is shown beside the nucleus. Plant cells also contain</text>
    <text x="88" y="773" fill="#536477">mitochondria, ribosomes, Golgi body and other shared organelles.</text>
  </g>

  <!-- Animal cell: no wall, chloroplast or large permanent vacuole. -->
  <path d="M1014 404C1000 330 1060 257 1155 242C1265 224 1370 271 1401 352C1435 442 1387 536 1294 570C1198 605 1084 569 1037 500C1018 473 1007 439 1014 404Z" fill="#fffdf7" stroke="#168c8c" stroke-width="5"/>
  <ellipse cx="1190" cy="371" rx="62" ry="51" fill="#f4e9f0" stroke="#725c8e" stroke-width="4"/>
  <circle cx="1195" cy="372" r="15" fill="#725c8e"/>
  <ellipse cx="1313" cy="321" rx="39" ry="20" fill="#fff1dd" stroke="#a76940" stroke-width="4"/>
  <path d="M1284 321C1294 303 1304 340 1315 321S1333 303 1342 321" fill="none" stroke="#a76940" stroke-width="3"/>
  <ellipse cx="1080" cy="461" rx="39" ry="20" fill="#fff1dd" stroke="#a76940" stroke-width="4"/>
  <path d="M1051 461C1061 443 1071 480 1082 461S1100 443 1109 461" fill="none" stroke="#a76940" stroke-width="3"/>
  <path d="M1228 431C1244 416 1264 417 1280 430M1228 443C1245 430 1264 431 1280 443M1228 455C1244 444 1265 444 1280 456M1230 467C1246 458 1264 458 1278 469" fill="none" stroke="#725c8e" stroke-width="4"/>
  <path d="M1305 503C1318 488 1332 488 1345 500M1305 513C1318 502 1332 502 1345 512M1305 523C1318 516 1332 516 1345 524" fill="none" stroke="#c9a227" stroke-width="4"/>
  <circle cx="1355" cy="446" r="22" fill="#f5e8f2" stroke="#9c628f" stroke-width="4"/>
  <g transform="translate(1110 312) rotate(-20)"><rect x="-9" y="-28" width="18" height="56" rx="8" fill="#edf4d8" stroke="#5d7a42" stroke-width="4"/><path d="M-8 -8H8M-8 2H8M-8 12H8" stroke="#5d7a42" stroke-width="3"/></g>
  <g transform="translate(1140 317) rotate(65)"><rect x="-9" y="-28" width="18" height="56" rx="8" fill="#edf4d8" stroke="#5d7a42" stroke-width="4"/><path d="M-8 -8H8M-8 2H8M-8 12H8" stroke="#5d7a42" stroke-width="3"/></g>
  <circle cx="1230" cy="290" r="4" fill="#10233f"/><circle cx="1247" cy="300" r="4" fill="#10233f"/><circle cx="1260" cy="286" r="4" fill="#10233f"/><circle cx="1274" cy="297" r="4" fill="#10233f"/><circle cx="1160" cy="481" r="4" fill="#10233f"/><circle cx="1177" cy="491" r="4" fill="#10233f"/><circle cx="1193" cy="478" r="4" fill="#10233f"/>
  <g font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#fff">
    <circle cx="1035" cy="390" r="16" fill="#168c8c"/><text x="1035" y="396">1</text>
    <circle cx="1190" cy="371" r="16" fill="#725c8e"/><text x="1190" y="377">2</text>
    <circle cx="1313" cy="321" r="16" fill="#a76940"/><text x="1313" y="327">3</text>
    <circle cx="1318" cy="507" r="16" fill="#c9a227"/><text x="1318" y="513">4</text>
    <circle cx="1355" cy="446" r="16" fill="#9c628f"/><text x="1355" y="452">5</text>
    <circle cx="1125" cy="315" r="16" fill="#5d7a42"/><text x="1125" y="321">6</text>
    <circle cx="1252" cy="441" r="16" fill="#725c8e"/><text x="1252" y="447">7</text>
  </g>
  <g font-family="Arial,sans-serif" font-size="17" fill="#10233f">
    <text x="852" y="626"><tspan font-weight="700">1</tspan><tspan dx="6">Cell surface membrane</tspan></text>
    <text x="852" y="655"><tspan font-weight="700">2</tspan><tspan dx="6">Nucleus and nucleolus</tspan></text>
    <text x="852" y="684"><tspan font-weight="700">3</tspan><tspan dx="6">Mitochondrion</tspan></text>
    <text x="1190" y="626"><tspan font-weight="700">4</tspan><tspan dx="6">Golgi body; ribosomes are dots</tspan></text>
    <text x="1190" y="655"><tspan font-weight="700">5</tspan><tspan dx="6">Lysosome</tspan></text>
    <text x="1190" y="684"><tspan font-weight="700">6</tspan><tspan dx="6">Centrioles (pair)</tspan></text>
    <text x="852" y="713"><tspan font-weight="700">7</tspan><tspan dx="6">Rough ER beside nucleus</tspan></text>
    <text x="852" y="748" fill="#536477">No cell wall, chloroplasts or large permanent vacuole.</text>
    <text x="852" y="773" fill="#536477">Some specialised animal cells have extra features, such as cilia.</text>
  </g>
  <text x="800" y="950" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="4" fill="#10233f" opacity=".12">MARLBRIDGE STUDY RESOURCE</text>
  <path d="M50 920H1550" stroke="#c9a227" stroke-width="2"/>
  <text x="60" y="975" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233f">MARLBRIDGE  •  STUDY RESOURCE</text>
</svg>
