<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="ti de"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#315F86"/></marker></defs><title id="ti">Human reproduction: organs, pathways and fetal support</title><desc id="de">Male and female reproductive anatomy and pregnancy support structures.</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#10233F">Human reproduction: organs, pathways and fetal support</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#5B6D80">Marlbridge • Cambridge IGCSE Biology 0610 • 16.4 Sexual reproduction in humans</text><rect x="52" y="130" width="1424" height="680" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/>,<rect x="76" y="157" width="444" height="544" rx="12" fill="#FBFCFD" stroke="#D3DCE2" stroke-width="2"/>,<rect x="542" y="157" width="444" height="544" rx="12" fill="#FBFCFD" stroke="#D3DCE2" stroke-width="2"/>,<rect x="1008" y="157" width="444" height="544" rx="12" fill="#FBFCFD" stroke="#D3DCE2" stroke-width="2"/>,<text x="298" y="194" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MALE SYSTEM • simplified side view</text>,<text x="764" y="194" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">FEMALE SYSTEM • simplified view</text>,<text x="1230" y="194" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">PREGNANCY • simplified section</text>,<rect x="130" y="485" width="66" height="90" rx="20" fill="#EAF5FB" stroke="#315F86" stroke-width="2"/>,<text x="163" y="519" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#10233F">testis</text>,<text x="163" y="537" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="500" fill="#5B6D80">in scrotum</text>,<path d="M196 505 C228 490 232 458 256 438 C280 415 302 423 304 398 C305 387 298 379 289 377" fill="none" stroke="#315F86" stroke-width="7" stroke-linecap="round"/>,<rect x="240" y="324" width="122" height="42" rx="20" fill="#F5F0FA" stroke="#725C8E" stroke-width="2"/>,<text x="301" y="350" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#10233F">bladder</text>,<rect x="254" y="386" width="70" height="40" rx="10" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/>,<text x="289" y="412" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#10233F">prostate</text>,<path d="M289 366V490H425" fill="none" stroke="#C44949" stroke-width="8" stroke-linecap="round"/>,<rect x="418" y="470" width="72" height="42" rx="18" fill="#EAF5FB" stroke="#315F86" stroke-width="2"/>,<text x="454" y="496" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#10233F">penis</text>,<text x="344" y="461" text-anchor="start" font-family="Arial,sans-serif" font-size="11" font-weight="600" fill="#315F86">sperm duct</text>,<text x="344" y="521" text-anchor="start" font-family="Arial,sans-serif" font-size="11" font-weight="600" fill="#C44949">urethra</text>,<text x="298" y="592" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="600" fill="#20314B">Sperm: testes → sperm ducts → urethra → penis</text>,<text x="298" y="625" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="500" fill="#5B6D80">Prostate adds fluid; scrotum holds testes cooler.</text>,<circle cx="635" cy="350" r="22" fill="#FFF6DE" stroke="#C9A227" stroke-width="3"/>,<circle cx="893" cy="350" r="22" fill="#FFF6DE" stroke="#C9A227" stroke-width="3"/>,<path d="M656 350 C686 321 708 323 726 345 M872 350 C842 321 820 323 802 345" fill="none" stroke="#C44949" stroke-width="7" stroke-linecap="round"/>,<path d="M718 340 Q764 318 810 340 L799 429 Q764 466 729 429Z" fill="#FBE9E9" stroke="#C44949" stroke-width="4"/>,<path d="M744 438 L744 477 M784 438 L784 477" fill="none" stroke="#315F86" stroke-width="6"/>,<path d="M744 477 Q764 491 784 477 L784 535 L744 535Z" fill="#EAF5FB" stroke="#315F86" stroke-width="3"/>,<text x="764" y="288" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="600" fill="#10233F">ovaries</text>,<text x="764" y="329" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="600" fill="#315F86">oviducts</text>,<text x="764" y="403" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#10233F">uterus</text>,<text x="764" y="462" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#315F86">cervix</text>,<text x="764" y="527" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="600" fill="#315F86">vagina</text>,<text x="764" y="575" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#20314B">Oviduct: usual fertilisation site • uterus: fetal development</text>,<text x="764" y="625" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="500" fill="#5B6D80">Cervix holds fetus in place and widens at birth.</text>, <path d="M1094 298 C1094 250 1366 250 1366 298 L1366 510 C1366 584 1307 628 1230 628 C1153 628 1094 584 1094 510Z" fill="#F9E4E4" stroke="#C44949" stroke-width="7"/>,<text x="1230" y="280" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="600" fill="#C44949">uterine wall</text>,<path d="M1140 355 C1140 311 1320 311 1320 355 L1320 513 C1320 562 1276 596 1230 596 C1184 596 1140 562 1140 513Z" fill="#EAF5FB" stroke="#315F86" stroke-width="3"/>,<text x="1230" y="344" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#315F86">amniotic sac + fluid</text>,<path d="M1204 500 C1180 471 1186 433 1216 422 C1233 416 1242 430 1246 444 C1267 438 1284 450 1282 469 C1281 490 1259 510 1230 517Z" fill="#FFF6DE" stroke="#C9A227" stroke-width="3"/>,<path d="M1254 423 C1287 392 1304 374 1306 353" fill="none" stroke="#C44949" stroke-width="6" stroke-linecap="round"/>,<rect x="1290" y="310" width="55" height="25" rx="8" fill="#C44949" stroke="#C44949" stroke-width="2"/>,<text x="1317" y="301" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#10233F">placenta</text>,<text x="1260" y="478" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#10233F">fetus</text>,<text x="1230" y="551" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="500" fill="#20314B">umbilical cord joins fetus to placenta</text>,<text x="1230" y="651" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#C44949">Placenta exchange: maternal and fetal blood remain separate.</text>,<rect x="94" y="717" width="1340" height="64" rx="10" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/>,<text x="764" y="744" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#10233F">All drawings schematic and not to scale. The fetus receives oxygen/nutrients and returns CO₂/urea via separate blood flows.</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE  •  STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
