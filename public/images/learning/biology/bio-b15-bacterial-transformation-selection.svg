<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc"><title id="title">Bacterial transformation: uptake, selection and cloning</title><desc id="desc">A circular plasmid carries an origin of replication, a gene of interest and an antibiotic-resistance marker. Only a small fraction of bacteria take it up. On selective medium, plasmid-bearing cells form colonies while cells without the plasmid fail to grow; a no-antibiotic control shows viability. A transformed cell replicates its plasmid as it divides.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#087F8C"/></marker><marker id="arrgold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#C9A227"/></marker></defs><rect width="1600" height="960" fill="#F3F7F6"/><text x="800" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0B1F3A">Bacterial transformation: uptake, selection and cloning</text><text x="800" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#526578">Marlbridge · schematic teaching diagram · not to scale</text><rect x="42" y="116" width="1516" height="698" rx="16" fill="#FFFFFF" stroke="#CBD8DE" stroke-width="2"/><text x="72" y="154" font-family="Arial,sans-serif" font-size="20" fill="#0B1F3A" font-weight="700" text-anchor="start">A small transformed fraction is identified, then its plasmid is copied as cells divide</text>
<rect x="76" y="186" width="305" height="480" rx="16" fill="#F5F8FB" stroke="#CBD8DE" stroke-width="2"/><text x="100" y="223" font-family="Arial,sans-serif" font-size="18" fill="#087F8C" font-weight="700" text-anchor="start">1  PLASMID VECTOR</text><circle cx="227" cy="380" r="92" fill="none" stroke="#0B1F3A" stroke-width="16"/><path d="M198 293 A92 92 0 0 1 298 332" fill="none" stroke="#C9A227" stroke-width="19"/><path d="M169 431 A92 92 0 0 1 176 314" fill="none" stroke="#087F8C" stroke-width="19"/><text x="229" y="370" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#0B1F3A" text-anchor="middle">origin of</text><text x="229" y="393" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#0B1F3A" text-anchor="middle">replication</text><text x="227" y="280" font-family="Arial,sans-serif" font-size="15" fill="#C9A227" font-weight="700" text-anchor="middle">gene of interest</text><text x="227" y="503" font-family="Arial,sans-serif" font-size="15" fill="#087F8C" font-weight="700" text-anchor="middle">antibiotic-resistance marker</text><text x="100" y="556" font-family="Arial,sans-serif" font-size="16" fill="#18324B" font-weight="600" text-anchor="start">Circular DNA plasmid</text><text x="100" y="586" font-family="Arial,sans-serif" font-size="14" fill="#526578" font-weight="400" text-anchor="start">with a compatible replication origin</text>
<rect x="420" y="186" width="300" height="480" rx="16" fill="#FFFFFF" stroke="#CBD8DE" stroke-width="2"/><text x="445" y="223" font-family="Arial,sans-serif" font-size="18" fill="#087F8C" font-weight="700" text-anchor="start">2  CELL UPTAKE</text><ellipse cx="566" cy="378" rx="103" ry="62" fill="#E3F0E7" stroke="#4D8B59" stroke-width="5"/><path d="M493 376 C525 350 550 405 580 376 S632 350 650 380" fill="none" stroke="#4D8B59" stroke-width="4"/><circle cx="548" cy="365" r="8" fill="#C9A227"/><circle cx="588" cy="388" r="8" fill="#C9A227"/><path d="M458 294 C500 300 514 321 524 339" fill="none" stroke="#C9A227" stroke-width="6" marker-end="url(#arrgold)"/><circle cx="488" cy="285" r="37" fill="#F5F8FB" stroke="#CBD8DE" stroke-width="3"/><text x="488" y="291" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#18324B">DNA</text><text x="566" y="475" font-family="Arial,sans-serif" font-size="15" fill="#18324B" font-weight="600" text-anchor="middle">Only a small fraction take up</text><text x="566" y="497" font-family="Arial,sans-serif" font-size="15" fill="#18324B" font-weight="600" text-anchor="middle">the plasmid in the model.</text><text x="445" y="557" font-family="Arial,sans-serif" font-size="14" fill="#526578" font-weight="400" text-anchor="start">Transformation is not guaranteed.</text><text x="445" y="586" font-family="Arial,sans-serif" font-size="14" fill="#526578" font-weight="400" text-anchor="start">The marker is carried on plasmid;</text><text x="445" y="609" font-family="Arial,sans-serif" font-size="14" fill="#526578" font-weight="400" text-anchor="start">the antibiotic does not create resistance.</text>
<rect x="750" y="186" width="350" height="480" rx="16" fill="#FFFFFF" stroke="#CBD8DE" stroke-width="2"/><text x="774" y="223" font-family="Arial,sans-serif" font-size="18" fill="#087F8C" font-weight="700" text-anchor="start">3  SELECT ON ANTIBIOTIC</text><rect x="790" y="274" width="270" height="148" rx="60" fill="#FFF3E8" stroke="#E4C59B" stroke-width="2"/><ellipse cx="858" cy="350" rx="24" ry="12" fill="#F5F8FB" stroke="#CBD8DE" stroke-width="2"/><ellipse cx="956" cy="350" rx="24" ry="12" fill="#E5F0E2" stroke="#4D8B59" stroke-width="2"/><circle cx="950" cy="349" r="5" fill="#4D8B59"/><circle cx="962" cy="351" r="5" fill="#4D8B59"/><text x="858" y="390" font-family="Arial,sans-serif" font-size="13" fill="#18324B" font-weight="600" text-anchor="middle">no plasmid</text><text x="956" y="390" font-family="Arial,sans-serif" font-size="13" fill="#18324B" font-weight="600" text-anchor="middle">plasmid</text><text x="925" y="450" font-family="Arial,sans-serif" font-size="16" fill="#0B1F3A" font-weight="700" text-anchor="middle">Antibiotic plate</text><text x="925" y="490" font-family="Arial,sans-serif" font-size="14" fill="#BE6258" font-weight="600" text-anchor="middle">No resistance → no colony</text><text x="925" y="517" font-family="Arial,sans-serif" font-size="14" fill="#4D8B59" font-weight="600" text-anchor="middle">Resistance marker → colony grows</text><text x="774" y="566" font-family="Arial,sans-serif" font-size="14" fill="#18324B" font-weight="400" text-anchor="start">Each selected colony descends</text><text x="774" y="588" font-family="Arial,sans-serif" font-size="14" fill="#18324B" font-weight="400" text-anchor="start">from a transformed cell; colonies</text><text x="774" y="610" font-family="Arial,sans-serif" font-size="14" fill="#18324B" font-weight="400" text-anchor="start">contain copies of the plasmid.</text>
<rect x="1130" y="186" width="390" height="480" rx="16" fill="#F8FAF4" stroke="#CEDBBC" stroke-width="2"/><text x="1155" y="223" font-family="Arial,sans-serif" font-size="18" fill="#087F8C" font-weight="700" text-anchor="start">4  CLONAL GROWTH + CONTROL</text><circle cx="1227" cy="332" r="34" fill="#E5F0E2" stroke="#4D8B59" stroke-width="3"/><circle cx="1324" cy="332" r="34" fill="#E5F0E2" stroke="#4D8B59" stroke-width="3"/><circle cx="1421" cy="332" r="34" fill="#E5F0E2" stroke="#4D8B59" stroke-width="3"/><path d="M1265 332H1281M1362 332H1378" stroke="#087F8C" stroke-width="4" marker-end="url(#arr)"/><text x="1324" y="396" font-family="Arial,sans-serif" font-size="15" fill="#0B1F3A" font-weight="700" text-anchor="middle">cell division</text><text x="1155" y="445" font-family="Arial,sans-serif" font-size="14" fill="#18324B" font-weight="400" text-anchor="start">In transformed cells, plasmid copies</text><text x="1155" y="467" font-family="Arial,sans-serif" font-size="14" fill="#18324B" font-weight="400" text-anchor="start">replicate as the bacteria divide.</text><rect x="1160" y="505" width="330" height="100" rx="12" fill="#FFFFFF" stroke="#CEDBBC" stroke-width="2"/><text x="1180" y="535" font-family="Arial,sans-serif" font-size="15" fill="#0B1F3A" font-weight="700" text-anchor="start">No-antibiotic control:</text><text x="1180" y="560" font-family="Arial,sans-serif" font-size="14" fill="#18324B" font-weight="400" text-anchor="start">both cell types can grow if viable.</text><text x="1180" y="585" font-family="Arial,sans-serif" font-size="14" fill="#526578" font-weight="400" text-anchor="start">It does not select transformants.</text><text x="1155" y="630" font-family="Arial,sans-serif" font-size="14" fill="#BE6258" font-weight="600" text-anchor="start">Plates must use suitable controls.</text>
<rect x="82" y="714" width="1430" height="70" rx="12" fill="#E8F2F5" stroke="#B8D4DD" stroke-width="2"/><text x="108" y="755" font-family="Arial,sans-serif" font-size="17" fill="#0B1F3A" font-weight="600" text-anchor="start">Selection identifies cells with marker-bearing plasmids; it does not prove every inserted gene is expressed.</text><text x="800" y="944" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0B1F3A" opacity=".065" transform="rotate(-14 800 944)">MARLBRIDGE STUDY RESOURCES</text><image x="1332" y="872" width="220" height="54" href="data:image/svg+xml;base64," xlink:href="data:image/svg+xml;base64," opacity=".94"/></svg>