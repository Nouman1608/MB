<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="title desc"><title id="title">IVF: simplified treatment sequence</title><desc id="desc">Five stages show hormone stimulation, egg collection, fertilisation in the laboratory, embryo development and transfer into the uterus. The number transferred and outcomes vary.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#315F86"/></marker></defs><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="62" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#10233F">IVF: a simplified treatment sequence</text><text x="54" y="98" font-family="Arial,sans-serif" font-size="18" fill="#5B6D80">AQA GCSE Biology 8461 • hormone treatment and assisted fertilisation</text><g font-family="Arial,sans-serif"><g fill="#fff" stroke="#D3DCE2" stroke-width="2"><rect x="48" y="150" width="272" height="480" rx="18"/><rect x="342" y="150" width="272" height="480" rx="18"/><rect x="636" y="150" width="272" height="480" rx="18"/><rect x="930" y="150" width="272" height="480" rx="18"/><rect x="1224" y="150" width="256" height="480" rx="18"/></g><g fill="#E7F5EF" stroke="#397D64" stroke-width="2"><circle cx="78" cy="184" r="22"/><circle cx="372" cy="184" r="22"/><circle cx="666" cy="184" r="22"/><circle cx="960" cy="184" r="22"/><circle cx="1254" cy="184" r="22"/></g><g font-size="20" font-weight="700" fill="#10233F" text-anchor="middle"><text x="78" y="191">1</text><text x="372" y="191">2</text><text x="666" y="191">3</text><text x="960" y="191">4</text><text x="1254" y="191">5</text></g><g font-size="22" font-weight="700" fill="#10233F" text-anchor="middle"><text x="184" y="242">Stimulate</text><text x="478" y="242">Collect eggs</text><text x="772" y="242">Fertilise</text><text x="1066" y="242">Develop</text><text x="1352" y="242">Transfer</text></g><g font-size="17" fill="#243B53" text-anchor="middle"><text x="184" y="287"><tspan x="184">FSH and LH help</tspan><tspan x="184" dy="24">several eggs mature.</tspan></text><text x="478" y="287"><tspan x="478">Mature eggs are</tspan><tspan x="478" dy="24">collected from the</tspan><tspan x="478" dy="24">ovaries.</tspan></text><text x="772" y="287"><tspan x="772">Eggs and sperm are</tspan><tspan x="772" dy="24">brought together in</tspan><tspan x="772" dy="24">the laboratory.</tspan></text><text x="1066" y="287"><tspan x="1066">Fertilised eggs divide</tspan><tspan x="1066" dy="24">and develop into early</tspan><tspan x="1066" dy="24">embryos.</tspan></text><text x="1352" y="287"><tspan x="1352">An embryo is placed</tspan><tspan x="1352" dy="24">in the uterus by a</tspan><tspan x="1352" dy="24">thin catheter.</tspan></text></g><g fill="none" stroke="#315F86" stroke-width="4"><path d="M90 414c20-38 56-38 76 0c20-38 56-38 76 0"/><circle cx="478" cy="410" r="50" fill="#FDF6DF"/><circle cx="478" cy="410" r="25" fill="#fff"/><circle cx="736" cy="400" r="21" fill="#F7C7A5"/><circle cx="798" cy="400" r="13" fill="#fff"/><path d="M759 400h19" marker-end="url(#arrow)"/><circle cx="1066" cy="407" r="30" fill="#E7F5EF"/><circle cx="1066" cy="407" r="12" fill="#fff"/><path d="M1066 377v60M1036 407h60M1045 386l42 42M1087 386l-42 42" stroke-width="2"/><path d="M1320 373c22-26 55-20 64 3 9-23 42-29 64-3 27 33-16 73-64 106-48-33-91-73-64-106Z" fill="#F8E7E7"/><path d="M1352 402h31v28h-31z" fill="#E7F5EF"/></g><g fill="#397D64"><circle cx="442" cy="457" r="8"/><circle cx="514" cy="457" r="8"/><circle cx="449" cy="464" r="5"/><circle cx="507" cy="464" r="5"/></g><g stroke="#315F86" stroke-width="3" marker-end="url(#arrow)"><path d="M322 386h14"/><path d="M616 386h14"/><path d="M910 386h14"/><path d="M1204 386h14"/></g><rect x="48" y="666" width="1432" height="112" rx="14" fill="#FFF6DE" stroke="#D8C27A"/><text x="76" y="711" font-size="20" font-weight="700" fill="#10233F">Important limits</text><text x="76" y="744" font-size="17" fill="#243B53">Not every egg fertilises or embryo develops. Embryo-transfer decisions are individualized; outcomes depend on the group, measure and time period.</text><text x="76" y="801" font-size="15" fill="#5B6D80">Schematic • symbols are not to scale • process may vary between patients and clinics</text><text x="48" y="906" font-size="18" font-weight="700" fill="#315F86">Marlbridge Study Resources</text><image x="1288" y="866" width="190" height="54" href="data:image/svg+xml;base64,"/></g></svg>
