<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1250" viewBox="0 0 1800 2500" role="img" aria-labelledby="title desc"><title id="title">Inside a villus (Edexcel International GCSE Biology)</title><desc id="desc">The lining of the small intestine is folded and covered in villi. Zooming in on one villus: digested food moves from the gut cavity into the villus. Microvilli give more surface area; the epithelium is one cell thick; a capillary network takes sugars and amino acids into the blood; the lacteal, a lymph vessel, takes fatty acids and glycerol. No tier labels: the structure of a villus is 4BI1 statement 2.32, on both papers.</desc><rect width="1800" height="2500" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="88" font-size="68" font-weight="700" fill="#1E2B47" text-anchor="middle">Inside a villus</text>
<text x="900" y="164" font-size="44" fill="#4B5B72" text-anchor="middle">Where digested food enters the body</text>
<text x="900" y="336" font-size="46" font-weight="700" fill="#1E2B47" text-anchor="middle">Small intestine lining: folded, covered in villi</text>
