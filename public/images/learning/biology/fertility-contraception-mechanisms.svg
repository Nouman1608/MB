<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="871" viewBox="0 0 1528 871" role="img" aria-labelledby="title desc"><title id="title">Compare reproductive intervention mechanisms</title><desc id="desc">Contraceptive mechanisms are grouped by biological target, alongside a three-stage IVF pathway with distinct outcomes.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#1c2d4b"/></marker><marker id="red" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#b75e53"/></marker><marker id="blue" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#357ea2"/></marker></defs><rect width="100%" height="100%" fill="#f5f8f7"/><g font-family="Arial, sans-serif"><text x="24" y="58" font-size="38" font-weight="700" text-anchor="start" fill="#1c2d4b">Compare reproductive intervention mechanisms</text><text x="24" y="104" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">A curriculum concept map of mechanisms, with distinct stages of action.</text><g transform="translate(24,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Contraception: different targets</text><rect x="35" y="100" width="310" height="175" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="51" y="131" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">Hormonal methods</text><text x="51" y="189" font-size="20" font-weight="400" text-anchor="start" fill="#1c2d4b">Can suppress ovulation and/or</text><text x="51" y="215" font-size="20" font-weight="400" text-anchor="start" fill="#1c2d4b">alter cervical mucus; effects</text><text x="51" y="241" font-size="20" font-weight="400" text-anchor="start" fill="#1c2d4b">depend on the formulation.</text><rect x="375" y="100" width="310" height="175" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="391" y="131" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">Barrier methods</text><text x="391" y="189" font-size="20" font-weight="400" text-anchor="start" fill="#1c2d4b">Reduce sperm passage</text><text x="391" y="215" font-size="20" font-weight="400" text-anchor="start" fill="#1c2d4b">towards the oocyte.</text><rect x="35" y="280" width="310" height="175" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="51" y="311" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">Copper intrauterine</text><text x="51" y="339" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">device</text><text x="51" y="369" font-size="20" font-weight="400" text-anchor="start" fill="#1c2d4b">Creates local conditions that</text><text x="51" y="395" font-size="20" font-weight="400" text-anchor="start" fill="#1c2d4b">impair sperm function and</text><text x="51" y="421" font-size="20" font-weight="400" text-anchor="start" fill="#1c2d4b">fertilisation.</text><rect x="375" y="280" width="310" height="175" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="391" y="311" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">Sterilisation</text><text x="391" y="369" font-size="20" font-weight="400" text-anchor="start" fill="#1c2d4b">Interrupts gamete transport</text><text x="391" y="395" font-size="20" font-weight="400" text-anchor="start" fill="#1c2d4b">through the sperm ducts or</text><text x="391" y="421" font-size="20" font-weight="400" text-anchor="start" fill="#1c2d4b">oviducts.</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Different methods act at different reproductive stages;</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">preventing ovulation and preventing fertilisation are distinct</text><text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">mechanisms.</text></g><g transform="translate(784,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">In vitro fertilisation overview</text><rect x="35" y="90" width="650" height="112" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="53" y="119" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">1 Stimulate and collect oocytes</text><text x="53" y="150" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">Ovarian stimulation and monitoring precede collection.</text><path d="M360,205 L360,217" fill="none" stroke="#357ea2" stroke-width="2" marker-end="url(#blue)"/><rect x="35" y="220" width="650" height="112" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="53" y="249" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">2 Fertilise and culture embryos</text><text x="53" y="280" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">Fertilisation occurs outside the body; embryos develop under</text><text x="53" y="307" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">controlled conditions.</text><path d="M360,335 L360,347" fill="none" stroke="#357ea2" stroke-width="2" marker-end="url(#blue)"/><rect x="35" y="350" width="650" height="112" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="53" y="379" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">3 Transfer embryo to the uterus</text><text x="53" y="410" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">Implantation and continued development may occur, but are not</text><text x="53" y="437" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">guaranteed.</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">IVF bypasses some barriers to fertilisation; fertilisation,</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">implantation and a live birth are separate outcomes.</text></g><text x="24" y="849" font-size="19" font-weight="400" text-anchor="start" fill="#1c2d4b">MARLBRIDGE  •  Schematic; structures and particles are not to scale.</text></g></svg>