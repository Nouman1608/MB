<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Pain-withdrawal reflex arc</title><desc id="desc">Maps the source sequence from skin receptor to sensory neurone, CNS relay, motor neurone and muscle effector, clarifying chemical synapses.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#168C8C"/></marker></defs><rect width="1600" height="900" fill="#F4F8F7"/><text x="800" y="58" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#17324D" text-anchor="middle">Pain-withdrawal reflex arc</text><text x="800" y="92" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#526778" text-anchor="middle">Marlbridge • OxfordAQA IGCSE Biology • Nervous system / reflexes</text><rect x="60" y="145" width="330" height="170" rx="16" fill="#fff" stroke="#CAD7DC" stroke-width="2"/><text x="82" y="183" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#3983B8" text-anchor="start">STIMULUS</text><text x="82" y="223" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#17324D" text-anchor="start">Hot object touches skin</text><path d="M395,230 L445,230" fill="none" stroke="#168C8C" stroke-width="5" marker-end="url(#arr)"/><rect x="460" y="145" width="330" height="170" rx="16" fill="#fff" stroke="#CAD7DC" stroke-width="2"/><text x="482" y="183" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#168C8C" text-anchor="start">RECEPTOR</text><text x="482" y="223" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#17324D" text-anchor="start">Pain receptor starts</text><text x="482" y="254" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#17324D" text-anchor="start">an electrical impulse</text><path d="M795,230 L845,230" fill="none" stroke="#168C8C" stroke-width="5" marker-end="url(#arr)"/><rect x="860" y="145" width="330" height="170" rx="16" fill="#fff" stroke="#CAD7DC" stroke-width="2"/><text x="882" y="183" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#E1AA37" text-anchor="start">SENSORY NEURONE</text><text x="882" y="223" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#17324D" text-anchor="start">Carries impulse to</text><text x="882" y="254" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#17324D" text-anchor="start">the CNS</text><path d="M1195,230 L1245,230" fill="none" stroke="#168C8C" stroke-width="5" marker-end="url(#arr)"/><rect x="1260" y="145" width="280" height="170" rx="16" fill="#fff" stroke="#CAD7DC" stroke-width="2"/><text x="1282" y="183" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#D76C61" text-anchor="start">CNS</text><text x="1282" y="223" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#17324D" text-anchor="start">Relay neurone</text><text x="1282" y="254" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#17324D" text-anchor="start">links pathway</text><path d="M1400,335 L1400,430" fill="none" stroke="#D76C61" stroke-width="5" marker-end="url(#arr)"/><rect x="1150" y="450" width="390" height="170" rx="16" fill="#fff" stroke="#CAD7DC" stroke-width="2"/><text x="1172" y="488" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#3983B8" text-anchor="start">MOTOR NEURONE</text><text x="1172" y="528" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#17324D" text-anchor="start">Carries impulse</text><text x="1172" y="559" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#17324D" text-anchor="start">from the CNS</text><path d="M1145,535 L1060,535" fill="none" stroke="#168C8C" stroke-width="5" marker-end="url(#arr)"/><rect x="650" y="450" width="390" height="170" rx="16" fill="#fff" stroke="#CAD7DC" stroke-width="2"/><text x="672" y="488" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#168C8C" text-anchor="start">EFFECTOR MUSCLE</text><text x="672" y="528" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#17324D" text-anchor="start">Contracts to pull</text><text x="672" y="559" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#17324D" text-anchor="start">the hand away</text><text x="800" y="700" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#17324D" text-anchor="middle">At each synapse, a chemical crosses the gap; the next neurone starts a new electrical impulse.</text><text x="45" y="862" font-family="Arial,sans-serif" font-size="13" fill="#526778">Schematic teaching diagram • check the stated conditions and limits</text><text x="800" y="835" text-anchor="middle" font-family="Arial,sans-serif" font-size="42" font-weight="700" opacity=".06" fill="#17324D">MARLBRIDGE STUDY RESOURCES</text><image href="data:image/svg+xml;base64," x="1370" y="825" width="180" height="50" preserveAspectRatio="xMaxYMid meet"/></svg>