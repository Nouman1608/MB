<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="871" viewBox="0 0 1528 871" role="img" aria-labelledby="title desc"><title id="title">Flower structures: include sepals and compare pollination</title><desc id="desc">A complete original flower section identifies stigma, style, ovary, ovules, anthers, filaments, petals and sepals. Paired insect/wind models contrast internal versus hanging anthers and internal versus exposed feathery stigma, with pollination-group qualifications.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#1c2d4b"/></marker><marker id="red" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#b75e53"/></marker><marker id="blue" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#357ea2"/></marker></defs><rect width="100%" height="100%" fill="#f5f8f7"/><g font-family="Arial, sans-serif"><text x="24" y="58" font-size="38" font-weight="700" text-anchor="start" fill="#1c2d4b">Flower structures: include sepals and compare pollination</text><text x="24" y="104" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Cambridge 0610 Biology 16.3 • Core • Original simplified longitudinal sections</text><g transform="translate(24,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Longitudinal flower section: all named parts</text><path d="M347,376 V462" fill="none" stroke="#73aaa5" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M340,381 C211,335 162,269 121,243 Q127,340 282,390 Z" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M367,381 C500,335 549,269 590,243 Q585,340 429,390 Z" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M320,351 C196,277 181,164 212,127 Q285,146 341,301 Z" fill="#e9c7d4" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M397,351 C518,277 535,164 503,127 Q429,146 375,301 Z" fill="#e9c7d4" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="360" cy="331" rx="46" ry="54" fill="#e2efec" stroke="#1c2d4b" stroke-width="3"/><path d="M345,285 V161 H375 V285" fill="#e2efec" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="360" cy="147" rx="47" ry="14" fill="#73aaa5" stroke="#1c2d4b" stroke-width="3"/><ellipse cx="345" cy="320" rx="10" ry="14" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><ellipse cx="376" cy="339" rx="10" ry="14" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><ellipse cx="350" cy="351" rx="10" ry="14" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><path d="M263,316 V206 M457,316 V206" fill="none" stroke="#1c2d4b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="263" cy="192" rx="29" ry="14" fill="#d5b32d" stroke="#1c2d4b" stroke-width="3"/><ellipse cx="457" cy="192" rx="29" ry="14" fill="#d5b32d" stroke="#1c2d4b" stroke-width="3"/><path d="M114.0,88.3 L360,145" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="38" y="96" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Stigma</text><path d="M471,99.3 L457,191" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="479" y="107" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Anther</text><path d="M95.0,211.3 L350,230" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="38" y="219" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Style</text><path d="M470,242.3 L457,260" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="478" y="250" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Filament</text><path d="M104.0,361.3 L322,331" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="38" y="369" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Ovary</text><path d="M469,341.3 L375,339" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="477" y="349" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Ovule</text><path d="M102.0,428.3 L264,381" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="38" y="436" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Sepal</text><path d="M96.0,277.3 L234,225" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="38" y="285" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Petal</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Stamen = anther + filament. Carpel = stigma + style + ovary.</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">The ovary encloses ovules. Petals attract pollinators; sepals</text><text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">protect the flower bud.</text></g><g transform="translate(784,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Compare the pollen-release and capture positions</text><text x="190" y="101" font-size="24" font-weight="700" text-anchor="middle" fill="#1c2d4b">Insect-pollinated</text><text x="538" y="101" font-size="24" font-weight="700" text-anchor="middle" fill="#1c2d4b">Wind-pollinated</text><ellipse cx="190" cy="263" rx="113" ry="117" fill="#e9c7d4" stroke="#1c2d4b" stroke-width="3"/><path d="M190,378 V188" fill="none" stroke="#73aaa5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="190" cy="190" rx="23" ry="9" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><ellipse cx="144" cy="253" rx="22" ry="11" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><ellipse cx="236" cy="253" rx="22" ry="11" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><path d="M538,397 V190 M538,275 L451,229 M538,275 L625,229" fill="none" stroke="#73aaa5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M451,229 L439,275" fill="none" stroke="#1c2d4b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="439" cy="286" rx="22" ry="10" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><path d="M625,229 L637,275" fill="none" stroke="#1c2d4b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="637" cy="286" rx="22" ry="10" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><path d="M538,192 L485,161 M538,192 L591,161" fill="none" stroke="#73aaa5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M502,171 l-7,-23 M574,171 l7,-23" fill="none" stroke="#73aaa5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M512,177 l-7,-23 M564,177 l7,-23" fill="none" stroke="#73aaa5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M522,183 l-7,-23 M554,183 l7,-23" fill="none" stroke="#73aaa5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M532,189 l-7,-23 M544,189 l7,-23" fill="none" stroke="#73aaa5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="43" y="433" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Petals and internal anthers;</text><text x="43" y="462" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">sticky receiving stigma.</text><text x="390" y="433" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Exposed anthers and</text><text x="390" y="462" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">feathery receiving stigma.</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">These are schematic examples, not universal flower forms.</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Wind flowers often have reduced petals and abundant small,</text><text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">light pollen; insect pollen is often sticky or spiky.</text></g><text x="24" y="849" font-size="19" font-weight="400" text-anchor="start" fill="#1c2d4b">MARLBRIDGE  •  Schematic; structures and particles are not to scale.</text></g></svg>