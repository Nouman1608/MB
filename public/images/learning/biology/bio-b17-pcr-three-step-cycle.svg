<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">PCR: denature, anneal, extend</title><desc id="desc">Maps the three PCR temperatures and primer/Taq roles, then links repeated cycles to the source doubling rule.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#168C8C"/></marker><marker id="arrGold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#D4AA27"/></marker></defs><rect width="1600" height="1000" fill="#F4F8F7"/><text x="800" y="57" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#17324D" text-anchor="middle">PCR: denature, anneal, extend</text><text x="800" y="92" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#526778" text-anchor="middle">Cambridge International AS &amp; A Level Biology 9700</text><rect x="55" y="145" width="470" height="610" rx="16" fill="#FFFFFF" stroke="#CAD7DC" stroke-width="2"/><rect x="565" y="145" width="470" height="610" rx="16" fill="#FFFFFF" stroke="#CAD7DC" stroke-width="2"/><rect x="1075" y="145" width="470" height="610" rx="16" fill="#FFFFFF" stroke="#CAD7DC" stroke-width="2"/><text x="290" y="198" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#D76C61" text-anchor="middle">1 • DENATURATION</text><text x="290" y="243" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#17324D" text-anchor="middle">≈ 95 °C</text><text x="800" y="198" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#D4AA27" text-anchor="middle">2 • ANNEALING</text><text x="800" y="243" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#17324D" text-anchor="middle">≈ 55–65 °C</text><text x="1310" y="198" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#168C8C" text-anchor="middle">3 • EXTENSION</text><text x="1310" y="243" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#17324D" text-anchor="middle">≈ 72 °C</text><path d="M145 360 C220 325 300 395 385 360" fill="none" stroke="#3983B8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M145 405 C220 440 300 370 385 405" fill="none" stroke="#D76C61" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="265" y="470" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#17324D" text-anchor="middle">two DNA strands separate</text><path d="M655 360 C730 325 810 395 895 360" fill="none" stroke="#3983B8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M655 405 C730 440 810 370 895 405" fill="none" stroke="#D76C61" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><line x1="655" y1="346" x2="690" y2="346" stroke="#D4AA27" stroke-width="9"/><line x1="860" y1="419" x2="895" y2="419" stroke="#D4AA27" stroke-width="9"/><text x="800" y="470" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#17324D" text-anchor="middle">primers bind target ends</text><path d="M1165 360 C1240 325 1320 395 1405 360" fill="none" stroke="#3983B8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M1165 405 C1240 440 1320 370 1405 405" fill="none" stroke="#D76C61" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><line x1="1165" y1="346" x2="1320" y2="346" stroke="#168C8C" stroke-width="7"/><line x1="1245" y1="419" x2="1405" y2="419" stroke="#168C8C" stroke-width="7"/><text x="1310" y="470" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#17324D" text-anchor="middle">Taq extends from primers</text><line x1="525" y1="440" x2="555" y2="440" stroke="#168C8C" stroke-width="4" marker-end="url(#arr)"/><line x1="1035" y1="440" x2="1065" y2="440" stroke="#168C8C" stroke-width="4" marker-end="url(#arr)"/><rect x="195" y="590" width="1210" height="105" rx="18" fill="#EDF5FA" stroke="#3983B8" stroke-width="2"/><text x="800" y="630" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#3983B8" text-anchor="middle">Each cycle doubles target DNA</text><text x="800" y="667" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#17324D" text-anchor="middle">starting copies × 2ⁿ  •  Taq works near 72 °C</text><text x="800" y="902" text-anchor="middle" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#DCE5E5" opacity="0.62">MARLBRIDGE STUDY RESOURCES</text><line x1="48" y1="918" x2="1552" y2="918" stroke="#D4AA27" stroke-width="3"/><text x="48" y="954" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#526778" text-anchor="start">Marlbridge • Cambridge International A Level Biology 9700 • teaching diagram</text><image href="data:image/svg+xml;base64," x="1370" y="928" width="180" height="50" preserveAspectRatio="xMaxYMid meet"/></svg>