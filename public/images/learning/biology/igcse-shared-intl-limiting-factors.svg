<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1080" viewBox="0 0 1800 2160" role="img" aria-labelledby="title desc"><title id="title">Limiting factors in photosynthesis</title><desc id="desc">No tier label: limiting factors are on both Edexcel International GCSE papers (4BI1 2.20, 5.2) and OxfordAQA International GCSE Biology is not tiered (9201 3.2.1c). Sketch graph of rate of photosynthesis against light intensity for 0.4% and 0.04% carbon dioxide at 25 °C and 15 °C. All four curves rise together, then level off at different heights, highest for 0.4% CO2 at 25 °C. On the rising part (1) light is limiting; on the flat part (2) something else limits: at 0.4% CO2 the 25 °C line is higher, so temperature is the limiting factor.</desc><rect width="1800" height="2160" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="108" font-size="68" font-weight="700" fill="#1E2B47" text-anchor="middle">Limiting factors</text>
<text x="900" y="181" font-size="44" fill="#4B5B72" text-anchor="middle">Rate against light intensity (sketch)</text>

<text x="60" y="337" font-size="50" font-weight="700" fill="#1E2B47">Rate of photosynthesis</text>
