<text x="99" y="1816" font-size="46" font-weight="700" fill="#1E2B47" text-anchor="middle">2</text>
<text x="181" y="1818" font-size="52" font-weight="700" fill="#1E2B47">Flat part: not light. Something else limits.</text>
<text x="181" y="1901" font-size="46" fill="#1E2B47" xml:space="preserve"><tspan>At 0.4% CO</tspan><tspan dy="12.9" font-size="31.3">2</tspan><tspan dy="-12.9">, the 25 °C line is higher,</tspan></text>
<text x="181" y="1971" font-size="46" fill="#1E2B47">so temperature is the limiting factor.</text></g></svg>
