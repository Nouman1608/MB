<text x="700" y="1946" font-size="44" font-weight="700" fill="#1E2B47" text-anchor="middle">of heart</text>
<text x="1100" y="1888" font-size="44" font-weight="700" fill="#1E2B47" text-anchor="middle">Left side</text>
<text x="1100" y="1946" font-size="44" font-weight="700" fill="#1E2B47" text-anchor="middle">of heart</text>
