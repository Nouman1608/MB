<polygon points="300,918 280,962 320,962" fill="#2F6B63"/>
<rect x="720" y="500" width="360" height="140" rx="20" fill="#DDEBE8" stroke="#1E2B47" stroke-width="5"/><text x="900" y="587.28" font-size="48" font-weight="700" fill="#1E2B47" text-anchor="middle">Gills</text>
<rect x="120" y="690" width="360" height="220" rx="24" fill="#FFFFFF" stroke="#1E2B47" stroke-width="5"/><text x="300" y="817.28" font-size="48" font-weight="700" fill="#1E2B47" text-anchor="middle">Heart</text>
<rect x="1320" y="690" width="360" height="220" rx="24" fill="#F2E6B7" stroke="#1E2B47" stroke-width="5"/><text x="1500" y="817.28" font-size="48" font-weight="700" fill="#1E2B47" text-anchor="middle">Body</text>
<text x="900" y="718" font-size="42" fill="#1E2B47" text-anchor="middle">Pressure drops in the gills,</text>
<text x="900" y="776" font-size="42" fill="#1E2B47" text-anchor="middle">so blood reaches body slowly</text>
<text x="900" y="1144" font-size="44" font-weight="700" fill="#1E2B47" text-anchor="middle">Heart is passed once per circuit</text>
<line x1="60" y1="1240" x2="1740" y2="1240" stroke="#C6D3D0" stroke-width="5" stroke-linecap="round"/>
<text x="900" y="1354" font-size="52" font-weight="700" fill="#1E2B47" text-anchor="middle">Mammal: double circulation</text>
<rect x="500" y="1440" width="800" height="152" rx="20" fill="#DDEBE8" stroke="#1E2B47" stroke-width="5"/><text x="900" y="1533.28" font-size="48" font-weight="700" fill="#1E2B47" text-anchor="middle">Lungs</text>
<rect x="500" y="1760" width="400" height="276" rx="24" fill="#B5D4CF" stroke="#1E2B47" stroke-width="5"/>
<rect x="900" y="1760" width="400" height="276" rx="24" fill="#F2CDB2" stroke="#1E2B47" stroke-width="5"/>
