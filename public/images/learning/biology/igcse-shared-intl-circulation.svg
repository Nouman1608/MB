<line x1="1140" y1="2036" x2="1140" y2="2134" stroke="#B9632F" stroke-width="7" stroke-linecap="round"/><polygon points="1140,2176 1118,2132 1162,2132" fill="#B9632F"/>
<text x="1200" y="2066" font-size="42" font-weight="700" fill="#1E2B47">Aorta</text>
<text x="1200" y="2128" font-size="42" fill="#1E2B47">high pressure</text>
<text x="900" y="2096" font-size="42" fill="#4B5B72" text-anchor="middle">Systemic</text>
<text x="900" y="2150" font-size="42" fill="#4B5B72" text-anchor="middle">circulation</text>
<text x="900" y="2444" font-size="44" font-weight="700" fill="#1E2B47" text-anchor="middle">Passes through the heart twice per circuit</text>
<line x1="116" y1="2524" x2="260" y2="2524" stroke="#B9632F" stroke-width="12" stroke-linecap="round"/>
<text x="290" y="2538" font-size="42" fill="#1E2B47">oxygenated blood</text>
