<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1290" viewBox="0 0 1800 2580" role="img" aria-labelledby="title desc"><title id="title">Single and double circulation</title><desc id="desc">Top, greyed and marked not required by Edexcel or OxfordAQA: a fish has a single circulation, heart to gills to body and back, so blood passes the heart once per circuit and pressure drops in the gills. Bottom: a mammal has a double circulation. The right side of the heart pumps deoxygenated blood through the pulmonary artery to the lungs, and oxygenated blood returns in the pulmonary vein to the left side (pulmonary circulation). The left side pumps blood at high pressure through the aorta to the body organs, and blood returns in the vena cava to the right side (systemic circulation). Blood passes through the heart twice per circuit. No tier labels: 4BI1 2.69 (both papers); 9201 3.2.3b and 3.2.3i.</desc><rect width="1800" height="2580" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="88" font-size="68" font-weight="700" fill="#1E2B47" text-anchor="middle">Single and double circulation</text>
<text x="900" y="164" font-size="44" fill="#4B5B72" text-anchor="middle">Schematic, not to scale</text>
<rect x="60" y="235" width="955" height="54" rx="27" fill="#6B7785"/><text x="537.5" y="274.24" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">Fish panel: not required by Edexcel or OxfordAQA</text>
<text x="900" y="404" font-size="52" font-weight="700" fill="#6B7785" text-anchor="middle">Fish: single circulation</text>
