<rect x="60" y="512" width="276" height="76" rx="38" fill="#D6B22F" stroke="#8A6A0C" stroke-width="4"/>
<text x="198" y="566" font-size="44" font-weight="700" fill="#1E2B47" text-anchor="middle">SOURCE</text>
<text x="60" y="656" font-size="48" font-weight="700" fill="#1E2B47">Mature leaf</text>
<text x="60" y="724" font-size="44" fill="#4B5B72">releases sucrose</text>
<rect x="1160" y="380" width="208" height="76" rx="38" fill="#62B3AD" stroke="#2E6B63" stroke-width="4"/>
<text x="1264" y="436" font-size="44" font-weight="700" fill="#1E2B47" text-anchor="middle">SINK</text>
<text x="1160" y="536" font-size="48" font-weight="700" fill="#1E2B47">Shoot tip</text>
<text x="1160" y="602" font-size="44" fill="#4B5B72">uses sucrose</text>
<text x="1180" y="1274" font-size="48" font-weight="700" fill="#1E2B47">Fruit</text>
<text x="1180" y="1344" font-size="44" fill="#4B5B72">uses or stores it</text>
<text x="140" y="1576" font-size="46" font-weight="700" fill="#8A6A0C">Phloem carries sucrose</text>
<text x="140" y="1640" font-size="46" font-weight="700" fill="#6B7785">and amino acids</text>
<text x="1200" y="1756" font-size="48" font-weight="700" fill="#1E2B47">Roots</text>
<text x="1200" y="1824" font-size="44" fill="#4B5B72">use or store it</text>
