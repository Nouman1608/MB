<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1290" viewBox="0 0 1800 2580" role="img" aria-labelledby="title desc"><title id="title">Sucrose moves from source to sink (OxfordAQA International GCSE Biology)</title><desc id="desc">A mature leaf, the source, releases sucrose; phloem carries it up the stem to the shoot tip, a sink that uses sucrose, to a fruit that uses or stores it, and down to the roots, which use or store it. The bottom panel shows that the same leaf changes role: a young leaf is a sink and grows into a mature leaf that is a source. No tier labels: 9201 3.2.2f says phloem carries dissolved sugars from the leaves to the rest of the plant, including growing regions and storage organs. A grey note says the terms source and sink, the bottom panel and amino acids in phloem are not required by OxfordAQA.</desc><rect width="1800" height="2580" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="88" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle">Sucrose moves from source to sink</text>
<text x="60" y="172" font-size="32" fill="#6B7785">The terms source and sink and the bottom panel</text>
<text x="60" y="212" font-size="32" fill="#6B7785">are not required by OxfordAQA; nor are amino acids in phloem</text>
<rect x="0" y="1400" width="1800" height="24" fill="#D9C9A6"/>
