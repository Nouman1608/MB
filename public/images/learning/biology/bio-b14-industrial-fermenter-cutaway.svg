<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="t d"><title id="t">Inside an industrial fermenter</title><desc id="d">A vessel cutaway labels the filtered-air inlet and exhaust, impeller and baffles, cooling jacket and water flow, temperature and pH probes, nutrient feed, and controlled sample or harvest port.</desc><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#087f8c"/></marker></defs><rect width="100%" height="100%" fill="#f3f7f6"/><g font-family="Arial,sans-serif" fill="#18324b"><text x="800" y="55" text-anchor="middle" font-size="36" font-weight="700">Inside an industrial fermenter</text><text x="800" y="88" text-anchor="middle" font-size="17" fill="#526578">Marlbridge · schematic teaching diagram · not to scale</text><rect x="28" y="125" width="1040" height="620" rx="20" fill="#fff" stroke="#c9d8de" stroke-width="3"/><text x="548" y="165" text-anchor="middle" font-size="21" font-weight="700">Vessel cutaway · sterile boundary</text><rect x="350" y="250" width="365" height="410" rx="90" fill="#eaf3f3" stroke="#18324b" stroke-width="5"/><ellipse cx="532" cy="250" rx="182" ry="28" fill="#f7faf9" stroke="#18324b" stroke-width="5"/><ellipse cx="532" cy="660" rx="182" ry="28" fill="#f7faf9" stroke="#18324b" stroke-width="5"/><rect x="372" y="440" width="321" height="205" fill="#d7edf2"/><line x1="532" y1="200" x2="532" y2="595" stroke="#425b72" stroke-width="11"/><rect x="480" y="395" width="104" height="17" rx="8" fill="#c49b27"/><rect x="460" y="478" width="144" height="17" rx="8" fill="#c49b27"/><line x1="390" y1="320" x2="390" y2="585" stroke="#7ba8a5" stroke-width="9"/><line x1="675" y1="320" x2="675" y2="585" stroke="#7ba8a5" stroke-width="9"/><text x="532" y="555" text-anchor="middle" font-size="17" font-weight="700">microbial culture</text><path d="M532 710V660V615" fill="none" stroke="#237d9d" stroke-width="9" marker-end="url(#a)"/><circle cx="494" cy="608" r="8" fill="#fff" stroke="#237d9d" stroke-width="3"/><circle cx="532" cy="597" r="8" fill="#fff" stroke="#237d9d" stroke-width="3"/><circle cx="570" cy="608" r="8" fill="#fff" stroke="#237d9d" stroke-width="3"/><text x="532" y="730" text-anchor="middle" font-size="14">filtered air → sparger</text><path d="M280 300H348M280 300V610H348" fill="none" stroke="#58a6c8" stroke-width="16"/><text x="220" y="465" text-anchor="middle" font-size="15" transform="rotate(-90 220 465)">cooling-water jacket</text><path d="M532 200V185H855" fill="none" stroke="#18324b" stroke-width="6"/><text x="855" y="177" font-size="14">motor + filtered exhaust</text><path d="M715 330H890" stroke="#81a24c" stroke-width="6" marker-end="url(#a)"/><text x="895" y="335" font-size="14">nutrient feed</text><path d="M715 580H890" stroke="#d28b39" stroke-width="6" marker-end="url(#a)"/><text x="895" y="585" font-size="14">sample / harvest port</text><line x1="707" y1="390" x2="855" y2="390" stroke="#b75d55" stroke-width="6"/><text x="865" y="395" font-size="14">temperature probe</text><line x1="707" y1="430" x2="855" y2="430" stroke="#8d6ca8" stroke-width="6"/><text x="865" y="435" font-size="14">pH probe</text><rect x="1090" y="135" width="460" height="245" rx="16" fill="#fff" stroke="#c9d8de" stroke-width="2"/><text x="1106" y="163" font-size="17" font-weight="700" fill="#087f8c">Sterility and control</text><text x="1106" y="193" font-size="14">Steam sterilises vessel; filtered air and</text><text x="1106" y="218" font-size="14">prepared nutrients reduce contamination.</text><text x="1106" y="243" font-size="14">Probes monitor temperature and pH.</text><text x="1106" y="268" font-size="14">Cooling jacket removes metabolic heat.</text><rect x="1090" y="410" width="460" height="305" rx="16" fill="#fff" stroke="#c9d8de" stroke-width="2"/><text x="1106" y="438" font-size="17" font-weight="700" fill="#087f8c">Mixing and transfer</text><text x="1106" y="468" font-size="14">Motor turns an impeller; baffles aid mixing.</text><text x="1106" y="493" font-size="14">Sterile air enters through a sparger.</text><text x="1106" y="518" font-size="14">Filtered exhaust prevents contamination.</text><text x="1106" y="543" font-size="14">Nutrient feed and product ports are controlled.</text><text x="1106" y="568" font-size="14">Not all fermentation processes are anaerobic.</text><text x="800" y="936" text-anchor="middle" font-size="25" opacity=".07" transform="rotate(-15 800 936)">MARLBRIDGE STUDY RESOURCES</text><image href="data:image/svg+xml;base64," x="1448" y="896" width="128" height="34" preserveAspectRatio="xMaxYMid meet"/><text x="24" y="936" font-size="12" fill="#526578">Use labeled structures and stated limits; conditions affect outcomes.</text></g></svg>
