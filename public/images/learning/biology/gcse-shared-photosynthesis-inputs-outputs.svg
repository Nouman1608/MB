<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1290" viewBox="0 0 1800 2580" role="img" aria-labelledby="title desc"><title id="title">Photosynthesis: raw materials in, products out</title><desc id="desc">A leaf takes in light energy from the sun, carbon dioxide from the air and water from the roots, and gives out oxygen; it makes glucose, a carbohydrate. A close-up of a chloroplast notes that chlorophyll, the green pigment, transfers light energy into chemical energy. Word equation: carbon dioxide + water → glucose + oxygen. Symbol equation: 6CO2 + 6H2O → C6H12O6 + 6O2. No tier labels.</desc><rect width="1800" height="2580" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="110" font-size="68" font-weight="700" fill="#1E2B47" text-anchor="middle">Photosynthesis</text>
