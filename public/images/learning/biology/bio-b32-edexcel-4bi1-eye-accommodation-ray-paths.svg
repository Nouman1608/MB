ght="600" fill="#168C8C">cornea</text>,<path d="M242 268L230 325" stroke="#168C8C" stroke-width="2" fill="none" stroke-linecap="round" />,<text x="286" y="282" text-anchor="start" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#C9A227">lens</text>,<path d="M320 287L337 315" stroke="#C9A227" stroke-width="2" fill="none" stroke-linecap="round" />,<text x="541" y="259" text-anchor="start" font-family="Arial,sans-serif" font-size="11" font-weight="600" fill="#315F86">sclera</text>,<path d="M535 263L524 279" stroke="#315F86" stroke-width="2" fill="none" stroke-linecap="round" />,<text x="558" y="296" text-anchor="start" font-family="Arial,sans-serif" font-size="11" font-weight="600" fill="#C9A227">retina</text>,<path d="M552 300L544 321" stroke="#C9A227" stroke-width="2" fill="none" stroke-linecap="round" />,<text x="568" y="341" text-anchor="start" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#C44949">fovea</text>,<text x="217" y="542" text-anchor="start" font-family="Arial,sans-serif" font-size="11" font-weight="600" fill="#725C8E">ciliary muscle</text>,<path d="M294 536L316 478" stroke="#725C8E" stroke-width="2" fill="none" stroke-linecap="round" />,<text x="362" y="575" text-anchor="start" font-family="Arial,sans-serif" font-size="11" font-weight="600" fill="#C9A227">suspensory ligaments</text>,<path d="M449 563L333 448" stroke="#C9A227" stroke-width="2" fill="none" stroke-linecap="round" />,<text x="930" y="264" text-anchor="start" font-family="Arial,sans-serif" font-size="11" font-weight="600" fill="#168C8C">cornea</text>,<path d="M967 268L954 325" stroke="#168C8C" stroke-width="2" fill="none" stroke-linecap="round" />,<text x="1010" y="282" text-anchor="start" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#C9A227">lens</text>,<path d="M1043 287L1060 315" stroke="#C9A227" stroke-width="2" fill="none" stroke-linecap="round" />,<text x="1265" y="259" text-anchor="start" font-family="Arial,sans-serif" font-size="11" font-weight="600" fill="#315F86">sclera</text>,<path d="M1259 263L1248 279" stroke="#315F86" stroke-width="2" fill="none" stroke-linecap="round" />,<text x="1282" y="296" text-anchor="start" font-family="Arial,sans-serif" font-size="11" font-weight="600" fill="#C9A227">retina</text>,<path d="M1276 300L1267 321" stroke="#C9A227" stroke-width="2" fill="none" stroke-linecap="round" />,<text x="1292" y="341" text-anchor="start" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#C44949">fovea</text>,<text x="940" y="542" text-anchor="start" font-family="Arial,sans-serif" font-size="11" font-weight="600" fill="#725C8E">ciliary muscle</text>,<path d="M1017 536L1040 478" stroke="#725C8E" stroke-width="2" fill="none" stroke-linecap="round" />,<text x="1082" y="575" text-anchor="start" font-family="Arial,sans-serif" font-size="11" font-weight="600" fill="#C9A227">suspensory ligaments</text>,<path d="M1169 563L1057 448" stroke="#C9A227" stroke-width="2" fill="none" stroke-linecap="round" />,<rect x="88" y="618" width="628" height="126" rx="10" fill="#EFF5FA" stroke="#B9CDDB" stroke-width="2"/>,<text x="402" y="651" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#10233F">Ciliary muscle relaxes • ligaments pulled tight</text>,<text x="402" y="678" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#20314B">Lens flatter • less refraction • rays focus on the fovea</text>,<text x="402" y="715" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">Distant rays enter almost parallel.</text>,<rect x="812" y="618" width="628" height="126" rx="10" fill="#FFF8E6" stroke="#E1D19C" stroke-width="2"/>,<text x="1126" y="651" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#10233F">Ciliary muscle contracts • ligaments slacken</text>,<text x="1126" y="678" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#20314B">Lens becomes fatter • more refraction • rays focus on the fovea</text>,<text x="1126" y="715" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">Near rays diverge from the object.</text>,<rect x="88" y="780" width="1352" height="46" rx="10" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/>,<text x="764" y="808" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#C44949">Pupil reflex controls light entry; accommodation focuses the image. Pupil constriction cannot guarantee protection from intense light.</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE  •  STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
