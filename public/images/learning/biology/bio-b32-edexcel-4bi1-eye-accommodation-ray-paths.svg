<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="ti de"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#315F86"/></marker><marker id="ray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#C44949"/></marker></defs><title id="ti">Eye accommodation: structure and light-ray paths</title><desc id="de">Two simplified eye-section ray diagrams for far and near accommodation with spatial labels for the outer wall, ciliary muscle, ligaments, lens, retina and fovea.</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#10233F">Eye accommodation: structure and light-ray paths</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#5B6D80">Marlbridge • Pearson Edexcel International GCSE Biology 4BI1 • The eye (2.91–2.92)</text><rect x="52" y="130" width="700" height="640" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/>,<rect x="776" y="130" width="700" height="640" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/>,<text x="402" y="176" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#315F86">DISTANT OBJECT • PARALLEL RAYS</text>,<text x="1126" y="176" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#315F86">NEAR OBJECT • DIVERGING RAYS</text>,<ellipse cx="425" cy="382" rx="205" ry="151" fill="#FFFFFF" stroke="#315F86" stroke-width="8"/><path d="M220 319 Q172 382 220 445" fill="#EAF5FB" stroke="#168C8C" stroke-width="5"/><path d="M576 277 Q610 382 576 487" fill="none" stroke="#C9A227" stroke-width="9"/><path d="M582 266 Q624 382 582 498" fill="none" stroke="#725C8E" stroke-width="3"/><circle cx="579" cy="382" r="7"