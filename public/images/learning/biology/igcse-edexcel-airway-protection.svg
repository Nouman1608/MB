<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 1800 1800" role="img" aria-labelledby="title desc"><title id="title">Protecting the airway (Edexcel International GCSE Biology: not required)</title><desc id="desc">The whole figure is marked not required by Edexcel: 4BI1 does not mention cilia, goblet cells or mucus. The lining of the trachea and bronchi has ciliated cells and goblet cells. Goblet cells make mucus, which traps dust and bacteria from the air; the cilia move the mucus to the throat, where it is swallowed. No tier labels.</desc><rect width="1800" height="1800" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="88" font-size="68" font-weight="700" fill="#1E2B47" text-anchor="middle">Protecting the airway</text>
<text x="900" y="164" font-size="44" fill="#4B5B72" text-anchor="middle">Lining of the trachea and bronchi, schematic</text>
