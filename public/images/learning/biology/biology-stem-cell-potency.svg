<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">Stem-cell potency narrows as lineages specialize</title><desc id="desc">Conceptual range: totipotent cells can contribute to embryonic and extraembryonic tissues; pluripotent cells form body-cell lineages; multipotent cells form several related types; unipotent cells form one type. The examples are schematic and do not imply every cell follows one fixed developmental ladder.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#315fbd"/></marker><marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#177e79"/></marker><marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c66a1d"/></marker></defs><rect width="100%" height="100%" fill="#f8faff"/><text x="28" y="45" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#18263d" text-anchor="start">Stem-cell potency narrows as lineages specialize</text><text x="28" y="76" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#667085" text-anchor="start">Potency describes the range of possible cell fates.</text><rect x="24" y="100" width="952" height="510" rx="14" fill="white" stroke="#d5ddea" stroke-width="2"/><rect x="45" y="146" width="210" height="320" rx="13" fill="#fff" stroke="#d5ddea" stroke-width="2"/><text x="150" y="182" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#315fbd" text-anchor="middle">Totipotent</text><text x="150" y="212" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#667085" text-anchor="middle">zygote / early blastomere</text><rect x="66" y="249" width="168" height="36" rx="9" fill="#e5f4f1" stroke="#177e79" stroke-width="1"/><text x="150" y="273" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#18263d" text-anchor="middle">embryo</text><rect x="66" y="297" width="168" height="36" rx="9" fill="#e9f1fa" stroke="#d5ddea" stroke-width="1"/><text x="150" y="321" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#18263d" text-anchor="middle">placenta</text><rect x="66" y="345" width="168" height="36" rx="9" fill="#e9f1fa" stroke="#d5ddea" stroke-width="1"/><text x="150" y="369" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#18263d" text-anchor="middle">other extra-embryonic</text><path d="M257 308 L275 308" fill="none" stroke="#315fbd" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><rect x="278" y="146" width="210" height="320" rx="13" fill="#f1f6fb" stroke="#d5ddea" stroke-width="2"/><text x="383" y="182" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#315fbd" text-anchor="middle">Pluripotent</text><text x="383" y="212" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#667085" text-anchor="middle">embryonic stem cell</text><rect x="299" y="249" width="168" height="36" rx="9" fill="#e9f1fa" stroke="#d5ddea" stroke-width="1"/><text x="383" y="273" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#18263d" text-anchor="middle">all body lineages</text><rect x="299" y="297" width="168" height="36" rx="9" fill="#e9f1fa" stroke="#d5ddea" stroke-width="1"/><text x="383" y="321" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#18263d" text-anchor="middle">ectoderm</text><rect x="299" y="345" width="168" height="36" rx="9" fill="#e9f1fa" stroke="#d5ddea" stroke-width="1"/><text x="383" y="369" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#18263d" text-anchor="middle">mesoderm + endoderm</text><path d="M490 308 L508 308" fill="none" stroke="#315fbd" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><rect x="511" y="146" width="210" height="320" rx="13" fill="#fff" stroke="#d5ddea" stroke-width="2"/><text x="616" y="182" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#315fbd" text-anchor="middle">Multipotent</text><text x="616" y="212" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#667085" text-anchor="middle">blood stem cell</text><rect x="532" y="249" width="168" height="36" rx="9" fill="#e9f1fa" stroke="#d5ddea" stroke-width="1"/><text x="616" y="273" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#18263d" text-anchor="middle">several related</text><rect x="532" y="297" width="168" height="36" rx="9" fill="#e9f1fa" stroke="#d5ddea" stroke-width="1"/><text x="616" y="321" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#18263d" text-anchor="middle">blood-cell types</text><path d="M723 308 L741 308" fill="none" stroke="#315fbd" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><rect x="744" y="146" width="210" height="320" rx="13" fill="#f1f6fb" stroke="#d5ddea" stroke-width="2"/><text x="849" y="182" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#315fbd" text-anchor="middle">Unipotent</text><text x="849" y="212" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#667085" text-anchor="middle">basal epidermal stem cell</text><rect x="765" y="249" width="168" height="36" rx="9" fill="#e9f1fa" stroke="#d5ddea" stroke-width="1"/><text x="849" y="273" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#18263d" text-anchor="middle">one mature</text><rect x="765" y="297" width="168" height="36" rx="9" fill="#e9f1fa" stroke="#d5ddea" stroke-width="1"/><text x="849" y="321" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#18263d" text-anchor="middle">cell type</text><text x="500" y="506" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#177e79" text-anchor="middle">Broad range of fates</text><path d="M150 527 L850 527" fill="none" stroke="#177e79" stroke-width="3" stroke-linecap="round" marker-end="url(#arr-teal)"/><text x="500" y="564" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#18263d" text-anchor="middle">Fewer possible fates as developmental restriction increases</text><text x="27" y="632" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#667085" text-anchor="start">MARLBRIDGE • Schematic categories; potency depends on cell context.</text></svg>