<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="1515" viewBox="0 0 1528 1515" role="img" aria-labelledby="title desc"><title id="title">Water balance in plant cells</title><desc id="desc">A turgid cell presses against its wall, a flaccid cell has little turgor pressure, and a plasmolysed cell has lost enough water for its membrane and contents to separate from the wall.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#1c2d4b"/></marker><marker id="red" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#b75e53"/></marker><marker id="blue" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#357ea2"/></marker></defs><rect width="100%" height="100%" fill="#f5f8f7"/><g font-family="Arial, sans-serif"><text x="24" y="58" font-size="38" font-weight="700" text-anchor="start" fill="#1c2d4b">Water balance in plant cells</text><text x="24" y="104" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Wall, membrane and vacuole • a schematic comparison, not a timed sequence</text><g transform="translate(24,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Turgid cell</text><rect x="115" y="125" width="490" height="290" rx="15" fill="#f8faf9" stroke="#1c2d4b" stroke-width="8"/><rect x="130" y="140" width="460" height="260" rx="18" fill="#e2efec" stroke="#1c2d4b" stroke-width="3"/><rect x="190" y="175" width="340" height="190" rx="20" fill="#c6dfdf" stroke="#73aaa5" stroke-width="2"/><ellipse cx="165" cy="355" rx="18" ry="22" fill="#d5b32d" stroke="#1c2d4b" stroke-width="3"/><path d="M120,115 L120,130" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="105" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Cell wall</text><path d="M561.5,437.3 L575,396" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="480" y="445" font-size="22" font-weight="400" text-anchor="middle" fill="#1c2d4b">Cell membrane</text><path d="M55,265 L160,265" fill="none" stroke="#357ea2" stroke-width="4" marker-end="url(#blue)"/><path d="M665,265 L560,265" fill="none" stroke="#357ea2" stroke-width="4" marker-end="url(#blue)"/><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Water enters when the external water potential is higher. The</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">contents press against the wall, producing turgor pressure.</text></g><g transform="translate(784,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Flaccid cell</text><rect x="115" y="125" width="490" height="290" rx="15" fill="#f8faf9" stroke="#1c2d4b" stroke-width="8"/><rect x="130" y="140" width="460" height="260" rx="18" fill="#e2efec" stroke="#1c2d4b" stroke-width="3"/><rect x="190" y="215" width="340" height="110" rx="20" fill="#c6dfdf" stroke="#73aaa5" stroke-width="2"/><ellipse cx="165" cy="355" rx="18" ry="22" fill="#d5b32d" stroke="#1c2d4b" stroke-width="3"/><path d="M120,115 L120,130" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="105" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Cell wall</text><path d="M561.5,437.3 L575,396" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="480" y="445" font-size="22" font-weight="400" text-anchor="middle" fill="#1c2d4b">Cell membrane</text><text x="360" y="300" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">Low turgor pressure</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Turgor pressure is low. The contents no longer press firmly</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">against the cell wall; the cell provides less support.</text></g><g transform="translate(24,816)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Plasmolysed cell</text><rect x="115" y="125" width="490" height="290" rx="15" fill="#f8faf9" stroke="#1c2d4b" stroke-width="8"/><rect x="220" y="185" width="280" height="170" rx="18" fill="#e2efec" stroke="#1c2d4b" stroke-width="3"/><rect x="280" y="220" width="160" height="100" rx="20" fill="#c6dfdf" stroke="#73aaa5" stroke-width="2"/><ellipse cx="255" cy="310" rx="18" ry="22" fill="#d5b32d" stroke="#1c2d4b" stroke-width="3"/><path d="M120,115 L120,130" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="105" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Cell wall</text><path d="M485,417 L485,351" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="480" y="445" font-size="22" font-weight="400" text-anchor="middle" fill="#1c2d4b">Cell membrane</text><path d="M230,265 L75,265" fill="none" stroke="#357ea2" stroke-width="4" marker-end="url(#blue)"/><path d="M500,265 L660,265" fill="none" stroke="#357ea2" stroke-width="4" marker-end="url(#blue)"/><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Water leaves when external water potential is much lower. The</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">membrane and contents pull away from the cell wall.</text></g><text x="24" y="1493" font-size="19" font-weight="400" text-anchor="start" fill="#1c2d4b">MARLBRIDGE  •  Schematic; structures and particles are not to scale.</text></g></svg>
