<text x="1350" y="1284" font-size="42" font-weight="700" fill="#2A6F97" text-anchor="middle">Water lost</text>
<text x="1350" y="1846" font-size="54" font-weight="700" fill="#1E2B47" text-anchor="middle">Flaccid</text>
<text x="1350" y="1916" font-size="44" fill="#4B5B72" text-anchor="middle">limp, no support</text>
<text x="900" y="2072" font-size="48" font-weight="700" fill="#2F6B63" text-anchor="middle">Water lost by transpiration faster</text>
<text x="900" y="2144" font-size="48" font-weight="700" fill="#2F6B63" text-anchor="middle">than it is taken up from the soil</text>
<text x="900" y="2244" font-size="42" fill="#4B5B72" text-anchor="middle">Thick green outline = cell wall</text></g></svg>
