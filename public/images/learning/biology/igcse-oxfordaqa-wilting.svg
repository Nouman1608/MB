<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1150" viewBox="0 0 1800 2300" role="img" aria-labelledby="title desc"><title id="title">Why a plant wilts (OxfordAQA International GCSE Biology)</title><desc id="desc">With enough water the leaves are held up; when water is short the leaves and stem droop. A turgid cell pushes on its cell wall; when it loses water by osmosis it becomes flaccid, limp and gives no support. Wilting happens when water is lost by transpiration faster than it is taken up from the soil. No tier labels: 9201 3.1.5 (osmosis, turgor) and 3.2.2d (wilting).</desc><rect width="1800" height="2300" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="88" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle">Why a plant wilts</text>
<text x="450" y="316" font-size="56" font-weight="700" fill="#2F6B63" text-anchor="middle">Enough water</text>
<text x="1350" y="316" font-size="56" font-weight="700" fill="#2F6B63" text-anchor="middle">Water short</text>
<line x1="450" y1="936" x2="450" y2="590" stroke="#3E8E41" stroke-width="16" stroke-linecap="round"/>
