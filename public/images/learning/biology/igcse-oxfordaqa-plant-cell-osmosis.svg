<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1190" viewBox="0 0 1800 2380" role="img" aria-labelledby="title desc"><title id="title">Plant cells and water (OxfordAQA International GCSE Biology)</title><desc id="desc">Turgid: in a dilute solution water moves in, the vacuole pushes out with turgor pressure and the cell is firm. Flaccid: at the same concentration there is no net water movement and the cell is limp. Plasmolysed: in a concentrated solution water moves out and the membrane pulls away from the cell wall. A key names the cell wall, cytoplasm and membrane, and vacuole. No tier labels: 9201 3.1.5e asks students to be familiar with the terms turgor and plasmolysis.</desc><rect width="1800" height="2380" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="88" font-size="68" font-weight="700" fill="#1E2B47" text-anchor="middle">Plant cells and water</text>
<text x="900" y="164" font-size="44" fill="#4B5B72" text-anchor="middle">Cross-section of one cell, schematic</text>
