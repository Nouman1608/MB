<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1010" viewBox="0 0 1800 2020" role="img" aria-labelledby="title desc"><title id="title">Antibiotics: only when essential (OxfordAQA International GCSE Biology)</title><desc id="desc">Three cases: a cold or flu is caused by a virus, so no antibiotic; a minor bacterial infection is cleared by the body, so no antibiotic; a serious bacterial infection needs help, so an antibiotic is used. Using antibiotics only when essential means fewer antibiotic uses, so fewer chances to select resistant bacteria, so antibiotics keep working. This follows 9201 3.4.7g and 3.4.7i. No tier labels.</desc><rect width="1800" height="2020" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="88" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle">Antibiotics: only when essential</text>
<text x="900" y="166" font-size="44" fill="#4B5B72" text-anchor="middle">Schematic, not to scale</text>
<rect x="60" y="300" width="1680" height="376" rx="28" fill="#FFFFFF" stroke="#B9632F" stroke-width="5"/>
<text x="430" y="476" font-size="52" font-weight="700" fill="#1E2B47">Cold or flu</text>
<text x="430" y="560" font-size="48" fill="#1E2B47">Caused by a virus</text>
<circle cx="1550" cy="424" r="56" fill="#B9632F"/><line x1="1530" y1="404" x2="1570" y2="444" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/><line x1="1570" y1="404" x2="1530" y2="444" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
<text x="1550" y="566" font-size="46" font-weight="700" fill="#B9632F" text-anchor="middle">No antibiotic</text>
<line x1="232" y1="476" x2="232" y2="336" stroke="#1E2B47" stroke-width="5" stroke-linecap="round"/>
<circle cx="232" cy="336" r="18" fill="#8A6A0C" stroke="#1E2B47" stroke-width="3"/>
<line x1="232" y1="476" x2="353.2" y2="406" stroke="#1E2B47" stroke-width="5" stroke-linecap="round"/>
<circle cx="353.2" cy="406" r="18" fill="#8A6A0C" stroke="#1E2B47" stroke-width="3"/>
<line x1="232" y1="476" x2="353.2" y2="546" stroke="#1E2B47" stroke-width="5" stroke-linecap="round"/>
<circle cx="353.2" cy="546" r="18" fill="#8A6A0C" stroke="#1E2B47" stroke-width="3"/>
<line x1="232" y1="476" x2="232" y2="616" stroke="#1E2B47" stroke-width="5" stroke-linecap="round"/>
<circle cx="232" cy="616" r="18" fill="#8A6A0C" stroke="#1E2B47" stroke-width="3"/>
<line x1="232" y1="476" x2="110.8" y2="546" stroke="#1E2B47" stroke-width="5" stroke-linecap="round"/>
<circle cx="110.8" cy="546" r="18" fill="#8A6A0C" stroke="#1E2B47" stroke-width="3"/>
<line x1="232" y1="476" x2="110.8" y2="406" stroke="#1E2B47" stroke-width="5" stroke-linecap="round"/>
<circle cx="110.8" cy="406" r="18" fill="#8A6A0C" stroke="#1E2B47" stroke-width="3"/>

<polygon points="232,400 297.8,438 297.8,514 232,552 166.2,514 166.2,438" fill="#F2E6B7" stroke="#8A6A0C" stroke-width="10" stroke-linejoin="round"/>
<polygon points="232,438 240.2,464.7 268.1,464.3 245.3,480.3 254.3,506.7 232,490 209.7,506.7 218.7,480.3 195.9,464.3 223.8,464.7" fill="none" stroke="#1E2B47" stroke-width="5" stroke-linejoin="round"/>
<rect x="60" y="720" width="1680" height="376" rx="28" fill="#FFFFFF" stroke="#B9632F" stroke-width="5"/>
<text x="430" y="896" font-size="52" font-weight="700" fill="#1E2B47">Minor bacterial infection</text>
<text x="430" y="980" font-size="48" fill="#1E2B47">The body clears it itself</text>
<circle cx="1550" cy="844" r="56" fill="#B9632F"/><line x1="1530" y1="824" x2="1570" y2="864" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/><line x1="1570" y1="824" x2="1530" y2="864" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
<text x="1550" y="986" font-size="46" font-weight="700" fill="#B9632F" text-anchor="middle">No antibiotic</text>
<g transform="rotate(10 166 866)"><rect x="124" y="848" width="84" height="36" rx="18" fill="#DDEBE8" stroke="#1E2B47" stroke-width="5"/></g>
<g transform="rotate(-15 298 890)"><rect x="256" y="872" width="84" height="36" rx="18" fill="#DDEBE8" stroke="#1E2B47" stroke-width="5"/></g>
<g transform="rotate(0 222 962)"><rect x="180" y="944" width="84" height="36" rx="18" fill="#DDEBE8" stroke="#1E2B47" stroke-width="5"/></g>
<rect x="60" y="1140" width="1680" height="376" rx="28" fill="#FFFFFF" stroke="#2F6B63" stroke-width="5"/>
<text x="430" y="1316" font-size="52" font-weight="700" fill="#1E2B47">Serious bacterial infection</text>
<text x="430" y="1400" font-size="48" fill="#1E2B47">The body needs help</text>
<circle cx="1550" cy="1264" r="56" fill="#2F6B63"/><path d="M1526 1266 L1544 1284 L1576 1248" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1550" y="1406" font-size="46" font-weight="700" fill="#2F6B63" text-anchor="middle">Use antibiotic</text>
<g transform="rotate(12 148 1226)"><rect x="106" y="1208" width="84" height="36" rx="18" fill="#DDEBE8" stroke="#1E2B47" stroke-width="5"/></g>
<g transform="rotate(-6 250 1220)"><rect x="208" y="1202" width="84" height="36" rx="18" fill="#DDEBE8" stroke="#1E2B47" stroke-width="5"/></g>
<g transform="rotate(20 326 1250)"><rect x="284" y="1232" width="84" height="36" rx="18" fill="#DDEBE8" stroke="#1E2B47" stroke-width="5"/></g>
<g transform="rotate(-8 126 1312)"><rect x="84" y="1294" width="84" height="36" rx="18" fill="#DDEBE8" stroke="#1E2B47" stroke-width="5"/></g>
<g transform="rotate(12 230 1308)"><rect x="188" y="1290" width="84" height="36" rx="18" fill="#DDEBE8" stroke="#1E2B47" stroke-width="5"/></g>
<g transform="rotate(-14 330 1346)"><rect x="288" y="1328" width="84" height="36" rx="18" fill="#DDEBE8" stroke="#1E2B47" stroke-width="5"/></g>
<g transform="rotate(10 136 1398)"><rect x="94" y="1380" width="84" height="36" rx="18" fill="#DDEBE8" stroke="#1E2B47" stroke-width="5"/></g>
<g transform="rotate(-14 270 1418)"><rect x="228" y="1400" width="84" height="36" rx="18" fill="#DDEBE8" stroke="#1E2B47" stroke-width="5"/></g>
<g transform="rotate(8 348 1434)"><rect x="306" y="1416" width="84" height="36" rx="18" fill="#DDEBE8" stroke="#1E2B47" stroke-width="5"/></g>
<text x="900" y="1614" font-size="50" font-weight="700" fill="#1E2B47" text-anchor="middle">Using antibiotics only when essential means:</text>
<rect x="80" y="1680" width="500" height="256" rx="18" fill="#F2E6B7" stroke="#1E2B47" stroke-width="5"/><text x="330" y="1793.56" font-size="46" font-weight="700" fill="#1E2B47" text-anchor="middle">Fewer</text><text x="330" y="1855.56" font-size="46" font-weight="700" fill="#1E2B47" text-anchor="middle">antibiotic uses</text>
<rect x="650" y="1680" width="500" height="256" rx="18" fill="#F2E6B7" stroke="#1E2B47" stroke-width="5"/><text x="900" y="1762.56" font-size="46" font-weight="700" fill="#1E2B47" text-anchor="middle">Fewer chances to</text><text x="900" y="1824.56" font-size="46" font-weight="700" fill="#1E2B47" text-anchor="middle">select resistant</text><text x="900" y="1886.56" font-size="46" font-weight="700" fill="#1E2B47" text-anchor="middle">bacteria</text>
<rect x="1220" y="1680" width="500" height="256" rx="18" fill="#DDEBE8" stroke="#1E2B47" stroke-width="5"/><text x="1470" y="1793.56" font-size="46" font-weight="700" fill="#1E2B47" text-anchor="middle">Antibiotics</text><text x="1470" y="1855.56" font-size="46" font-weight="700" fill="#1E2B47" text-anchor="middle">keep working</text>
<polygon points="584,1780 622,1808 584,1836" fill="#1E2B47"/>
<polygon points="1154,1780 1192,1808 1154,1836" fill="#1E2B47"/></g></svg>
