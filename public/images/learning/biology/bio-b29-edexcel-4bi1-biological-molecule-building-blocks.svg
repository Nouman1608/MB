<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="1515" viewBox="0 0 1528 1515" role="img" aria-labelledby="title desc"><title id="title">Large biological molecules and their building blocks</title><desc id="desc">Polysaccharides are built from glucose, proteins from amino acids, and triglycerides from one glycerol and three fatty acids. Lipids are distinguished from polymers.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#1c2d4b"/></marker><marker id="red" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#b75e53"/></marker><marker id="blue" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#357ea2"/></marker></defs><rect width="100%" height="100%" fill="#f5f8f7"/><g font-family="Arial, sans-serif"><text x="24" y="58" font-size="38" font-weight="700" text-anchor="start" fill="#1c2d4b">Large biological molecules and their building blocks</text><text x="24" y="104" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Identify glucose, amino acids, glycerol and fatty acids</text><g transform="translate(24,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Carbohydrates</text><circle cx="130" cy="225" r="28" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><text x="130" y="233" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">G</text><path d="M158,225 h34" fill="none" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="220" cy="225" r="28" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><text x="220" y="233" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">G</text><path d="M248,225 h34" fill="none" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="310" cy="225" r="28" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><text x="310" y="233" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">G</text><path d="M338,225 h34" fill="none" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="400" cy="225" r="28" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><text x="400" y="233" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">G</text><path d="M428,225 h34" fill="none" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="490" cy="225" r="28" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><text x="490" y="233" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">G</text><path d="M518,225 h34" fill="none" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="580" cy="225" r="28" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><text x="580" y="233" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">G</text><text x="360" y="140" font-size="25" font-weight="700" text-anchor="middle" fill="#1c2d4b">Glucose units linked together</text><text x="360" y="340" font-size="27" font-weight="700" text-anchor="middle" fill="#1c2d4b">Starch • glycogen • cellulose</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">These three polysaccharides are all built from glucose. Their</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">glucose units are arranged and linked differently; this is a</text><text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">building-block model.</text></g><g transform="translate(784,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Proteins</text><circle cx="130" cy="225" r="27" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><text x="130" y="233" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">1</text><path d="M157,225 h36" fill="none" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="220" cy="225" r="27" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><text x="220" y="233" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">2</text><path d="M247,225 h36" fill="none" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="310" cy="225" r="27" fill="#b75e53" stroke="#1c2d4b" stroke-width="2"/><text x="310" y="233" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">3</text><path d="M337,225 h36" fill="none" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="400" cy="225" r="27" fill="#357ea2" stroke="#1c2d4b" stroke-width="2"/><text x="400" y="233" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">4</text><path d="M427,225 h36" fill="none" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="490" cy="225" r="27" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><text x="490" y="233" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">5</text><path d="M517,225 h36" fill="none" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="580" cy="225" r="27" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><text x="580" y="233" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">6</text><text x="360" y="140" font-size="25" font-weight="700" text-anchor="middle" fill="#1c2d4b">Amino acids in a sequence</text><text x="360" y="340" font-size="25" font-weight="700" text-anchor="middle" fill="#1c2d4b">A polypeptide folds into a protein</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Different amino-acid sequences give different proteins. The</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">sequence helps determine the final folded shape.</text></g><g transform="translate(24,816)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Fats and oils: triglycerides</text><rect x="120" y="150" width="95" height="235" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2"/><text x="167" y="280" font-size="21" font-weight="700" text-anchor="middle" fill="#1c2d4b">Glycerol</text><path d="M215,180 H500" fill="none" stroke="#d5b32d" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><path d="M215,180 H500" fill="none" stroke="#1c2d4b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="580" y="187" font-size="22" font-weight="400" text-anchor="middle" fill="#1c2d4b">Fatty acid</text><path d="M215,265 H500" fill="none" stroke="#d5b32d" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><path d="M215,265 H500" fill="none" stroke="#1c2d4b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="580" y="272" font-size="22" font-weight="400" text-anchor="middle" fill="#1c2d4b">Fatty acid</text><path d="M215,350 H500" fill="none" stroke="#d5b32d" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><path d="M215,350 H500" fill="none" stroke="#1c2d4b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="580" y="357" font-size="22" font-weight="400" text-anchor="middle" fill="#1c2d4b">Fatty acid</text><text x="360" y="440" font-size="25" font-weight="700" text-anchor="middle" fill="#1c2d4b">One glycerol + three fatty acids</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">A triglyceride has one glycerol joined to three fatty acids. Lipids</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">are not polymers of repeated monomer units.</text></g><text x="24" y="1493" font-size="19" font-weight="400" text-anchor="start" fill="#1c2d4b">MARLBRIDGE  •  Schematic; structures and particles are not to scale.</text></g></svg>
