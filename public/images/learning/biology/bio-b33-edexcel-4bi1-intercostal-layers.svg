<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="871" viewBox="0 0 1528 871" role="img" aria-labelledby="title desc">
  <title id="title">Intercostal layers: depth, ribs and breathing</title>
  <desc id="desc">An explicit outside-to-inside intercostal-space cutaway distinguishes superficial external and deeper internal intercostal layers. Paired rib/diaphragm models show inspiration versus forced expiration and explicitly qualify quiet passive expiration.</desc>
  <defs>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1c2d4b" />
    </marker>
    <marker id="red" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b75e53" />
    </marker>
    <marker id="blue" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#357ea2" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f8f7" />
  <g font-family="Arial, sans-serif">
    <text x="24" y="58" font-size="38" font-weight="700" text-anchor="start" fill="#1c2d4b">Intercostal layers: depth, ribs and breathing</text>
    <text x="24" y="104" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Pearson Edexcel International GCSE Biology 4BI1 • ventilation</text>
    <g transform="translate(24,172)">
      <rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2" />
      <text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Depth through an intercostal space</text>
      <text x="62" y="104" font-size="24" font-weight="700" text-anchor="start" fill="#1c2d4b">Outside: skin side</text>
      <text x="62" y="460" font-size="24" font-weight="700" text-anchor="start" fill="#1c2d4b">Inside: lung side</text>
      <rect x="72" y="136" width="558" height="48" rx="8" fill="#e9c7d4" stroke="#1c2d4b" stroke-width="2" />
      <rect x="72" y="199" width="558" height="76" rx="8" fill="#e2efec" stroke="#1c2d4b" stroke-width="2" />
      <rect x="72" y="290" width="558" height="76" rx="8" fill="#f2df9b" stroke="#1c2d4b" stroke-width="2" />
      <path d="M97,261 l25,-48" fill="none" stroke="#73aaa5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M97,303 l25,48" fill="none" stroke="#d5b32d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M132,261 l25,-48" fill="none" stroke="#73aaa5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
