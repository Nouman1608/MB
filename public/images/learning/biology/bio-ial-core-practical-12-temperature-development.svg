<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="title desc"><title id="title">Core Practical 12: temperature and development</title><desc id="desc">Brine-shrimp eggs in equal-volume samples are incubated at five controlled temperatures, with three replicate tubes per temperature. The graph plots example mean hatch percentages from the lesson.</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="62" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#10233F">Core Practical 12: temperature and development</text><text x="54" y="98" font-family="Arial,sans-serif" font-size="18" fill="#5B6D80">Pearson Edexcel International A Level Biology • temperature response</text><rect x="48" y="142" width="640" height="620" rx="18" fill="#fff" stroke="#D3DCE2" stroke-width="2"/><text x="368" y="184" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#10233F">Set up matched replicates</text><text x="82" y="222" font-family="Arial,sans-serif" font-size="17" fill="#243B53">100 eggs per tube • same salinity, volume and light</text><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#E7F5EF" stroke="#397D64" stroke-width="2"><rect x="90" y="350" width="90" height="130" rx="16"/><rect x="205" y="350" width="90" height="130" rx="16"/><rect x="320" y="350" width="90" height="130" rx="16"/><rect x="435" y="350" width="90" height="130" rx="16"/><rect x="550" y="350" width="90" height="130" rx="16"/></g><g fill="#315F86"><path d="M102 424q18-14 36 0t36 0v48h-72z"/><path d="M217 424q18-14 36 0t36 0v48h-72z"/><path d="M332 424q18-14 36 0t36 0v48h-72z"/><path d="M447 424q18-14 36 0t36 0v48h-72z"/><path d="M562 424q18-14 36 0t36 0v48h-72z"/></g><g fill="#fff" font-size="20" font-weight="700"><text x="135" y="454">15°</text><text x="250" y="454">20°</text><text x="365" y="454">25°</text><text x="480" y="454">30°</text><text x="595" y="454">35°</text></g><g fill="#10233F" font-size="16"><text x="135" y="515">water bath</text><text x="250" y="515">water bath</text><text x="365" y="515">water bath</text><text x="480" y="515">water bath</text><text x="595" y="515">water bath</text></g></g><rect x="80" y="560" width="576" height="130" rx="14" fill="#F3F6F6" stroke="#D3DCE2"/><text x="106" y="598" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">At each temperature</text><text x="106" y="631" font-family="Arial,sans-serif" font-size="16" fill="#243B53">Use 3 replicate tubes • hold other conditions constant</text><text x="106" y="660" font-family="Arial,sans-serif" font-size="16" fill="#243B53">After 24 h, count hatched nauplii in each tube</text><text x="80" y="724" font-family="Arial,sans-serif" font-size="16" fill="#5B6D80">Illustrative method • use an approved, humane protocol for live organisms</text><rect x="720" y="142" width="760" height="620" rx="18" fill="#fff" stroke="#D3DCE2" stroke-width="2"/><text x="1100" y="184" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#10233F">Lesson data: mean hatch percentage</text><g stroke="#D3DCE2" stroke-width="1" fill="none"><path d="M825 350H1405M825 418H1405M825 486H1405M825 554H1405M825 622H1405M825 690H1405"/></g><g stroke="#315F86" stroke-width="3" fill="none"><path d="M825 350V690H1405"/></g><g font-family="Arial,sans-serif" font-size="14" fill="#5B6D80" text-anchor="end"><text x="810" y="696">0</text><text x="810" y="628">20</text><text x="810" y="560">40</text><text x="810" y="492">60</text><text x="810" y="424">80</text><text x="810" y="356">100</text></g><polyline points="850,649 985,585 1120,493 1255,408 1390,554" fill="none" stroke="#C96D35" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g fill="#C96D35" stroke="#fff" stroke-width="3"><circle cx="850" cy="649" r="9"/><circle cx="985" cy="585" r="9"/><circle cx="1120" cy="493" r="9"/><circle cx="1255" cy="408" r="9"/><circle cx="1390" cy="554" r="9"/></g><g font-family="Arial,sans-serif" font-size="15" fill="#243B53" text-anchor="middle"><text x="850" y="722">15</text><text x="985" y="722">20</text><text x="1120" y="722">25</text><text x="1255" y="722">30</text><text x="1390" y="722">35</text></g><text x="1100" y="749" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#243B53">Temperature (°C) • three replicates per point • y-axis: hatched / 100 × 100%</text><rect x="48" y="788" width="1432" height="82" rx="14" fill="#FFF6DE" stroke="#D8C27A"/><text x="76" y="822" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">Interpretation</text><text x="76" y="850" font-family="Arial,sans-serif" font-size="16" fill="#243B53">The illustrated hatch percentage peaks at 30 °C, then falls. This species-specific dataset shows a pattern, not the mechanism or a universal optimum.</text><text x="48" y="916" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#315F86">Marlbridge Study Resources</text><image x="1288" y="876" width="190" height="54" href="data:image/svg+xml;base64,"/></svg>
