<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="1515" viewBox="0 0 1528 1515" role="img" aria-labelledby="title desc"><title id="title">Four food tests: method and results</title><desc id="desc">Iodine detects starch, Benedict’s detects reducing sugars after water-bath heating, biuret detects protein, and an ethanol extract added to water gives an emulsion if lipid is present. Colours are also labelled in text.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#1c2d4b"/></marker><marker id="red" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#b75e53"/></marker><marker id="blue" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#357ea2"/></marker></defs><rect width="100%" height="100%" fill="#f5f8f7"/><g font-family="Arial, sans-serif"><text x="24" y="58" font-size="38" font-weight="700" text-anchor="start" fill="#1c2d4b">Four food tests: method and results</text><text x="24" y="104" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Compare with a distilled-water control • wear eye protection</text><g transform="translate(24,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Iodine: starch</text><path d="M170,140 v135 q0,30 30,30 q30,0 30,-30 v-135" fill="white" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M173,215 h54 v60 q0,27 -27,27 q-27,0 -27,-27 Z" fill="#b4782f" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M480,140 v135 q0,30 30,30 q30,0 30,-30 v-135" fill="white" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M483,215 h54 v60 q0,27 -27,27 q-27,0 -27,-27 Z" fill="#252b47" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M270,230 L445,230" fill="none" stroke="#1c2d4b" stroke-width="4" marker-end="url(#arr)"/><text x="200" y="350" font-size="21" font-weight="400" text-anchor="middle" fill="#1c2d4b">Negative / no change</text><text x="510" y="350" font-size="21" font-weight="700" text-anchor="middle" fill="#1c2d4b">Positive example</text><text x="50" y="405" font-size="22" font-weight="700" text-anchor="start" fill="#1c2d4b">Orange-brown → blue-black: starch detected.</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Add iodine solution to the sample. No heating is needed.</text></g><g transform="translate(784,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Benedict’s: reducing sugars</text><path d="M170,140 v135 q0,30 30,30 q30,0 30,-30 v-135" fill="white" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M173,215 h54 v60 q0,27 -27,27 q-27,0 -27,-27 Z" fill="#5ba6d0" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M480,140 v135 q0,30 30,30 q30,0 30,-30 v-135" fill="white" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M483,215 h54 v60 q0,27 -27,27 q-27,0 -27,-27 Z" fill="#b85936" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M270,230 L445,230" fill="none" stroke="#1c2d4b" stroke-width="4" marker-end="url(#arr)"/><text x="200" y="350" font-size="21" font-weight="400" text-anchor="middle" fill="#1c2d4b">Negative / no change</text><text x="510" y="350" font-size="21" font-weight="700" text-anchor="middle" fill="#1c2d4b">Positive example</text><text x="50" y="405" font-size="22" font-weight="700" text-anchor="start" fill="#1c2d4b">Blue → green / yellow / orange / brick-red precipitate.</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Add Benedict’s solution; heat in a hot water bath.</text></g><g transform="translate(24,816)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Biuret: protein</text><path d="M170,140 v135 q0,30 30,30 q30,0 30,-30 v-135" fill="white" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M173,215 h54 v60 q0,27 -27,27 q-27,0 -27,-27 Z" fill="#5ba6d0" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M480,140 v135 q0,30 30,30 q30,0 30,-30 v-135" fill="white" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M483,215 h54 v60 q0,27 -27,27 q-27,0 -27,-27 Z" fill="#8c619b" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M270,230 L445,230" fill="none" stroke="#1c2d4b" stroke-width="4" marker-end="url(#arr)"/><text x="200" y="350" font-size="21" font-weight="400" text-anchor="middle" fill="#1c2d4b">Negative / no change</text><text x="510" y="350" font-size="21" font-weight="700" text-anchor="middle" fill="#1c2d4b">Positive example</text><text x="50" y="405" font-size="22" font-weight="700" text-anchor="start" fill="#1c2d4b">Blue → purple: protein detected.</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Add biuret reagent and mix. No heating is needed.</text></g><g transform="translate(784,816)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Emulsion: fats and oils</text><path d="M170,140 v135 q0,30 30,30 q30,0 30,-30 v-135" fill="white" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M173,215 h54 v60 q0,27 -27,27 q-27,0 -27,-27 Z" fill="#f4faf9" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M480,140 v135 q0,30 30,30 q30,0 30,-30 v-135" fill="white" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M483,215 h54 v60 q0,27 -27,27 q-27,0 -27,-27 Z" fill="#d8e2df" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="495" cy="250" r="8" fill="white" stroke="#cbd7d5" stroke-width="1"/><circle cx="522" cy="265" r="8" fill="white" stroke="#cbd7d5" stroke-width="1"/><circle cx="505" cy="288" r="8" fill="white" stroke="#cbd7d5" stroke-width="1"/><circle cx="524" cy="234" r="8" fill="white" stroke="#cbd7d5" stroke-width="1"/><circle cx="496" cy="272" r="8" fill="white" stroke="#cbd7d5" stroke-width="1"/><path d="M270,230 L445,230" fill="none" stroke="#1c2d4b" stroke-width="4" marker-end="url(#arr)"/><text x="200" y="350" font-size="21" font-weight="400" text-anchor="middle" fill="#1c2d4b">Negative / no change</text><text x="510" y="350" font-size="21" font-weight="700" text-anchor="middle" fill="#1c2d4b">Positive example</text><text x="50" y="405" font-size="22" font-weight="700" text-anchor="start" fill="#1c2d4b">Clear → cloudy white emulsion: lipid detected.</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Shake the sample with ethanol first. Add the ethanol extract to</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">water.</text></g><text x="24" y="1493" font-size="19" font-weight="400" text-anchor="start" fill="#1c2d4b">MARLBRIDGE  •  Schematic; structures and particles are not to scale.</text></g></svg>
