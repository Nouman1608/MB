<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1000" viewBox="0 0 1800 2000" role="img" aria-labelledby="title desc"><title id="title">pH and enzyme activity</title><desc id="desc">Sketch graph of enzyme activity against pH from 0 to 14. Pepsin, from the stomach, peaks in acid at about pH 2; trypsin, from the small intestine, peaks in alkaline conditions at about pH 8. Each falls on both sides of its optimum and far from it the enzyme is denatured. Below, three pictures show the substrate fitting the active site at the optimum pH, fitting less well when the pH moves away, and not fitting at an extreme pH. No tier labels.</desc><rect width="1800" height="2000" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="110" font-size="70" font-weight="700" fill="#1E2B47" text-anchor="middle">pH and enzyme activity</text>
<text x="900" y="188" font-size="44" fill="#4B5B72" text-anchor="middle">Sketch graph, not experimental data</text>
