<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="t d"><title id="t">A potometer measures water uptake</title><desc id="d">A leafy shoot is sealed to water-filled tubing. A capillary contains one movable air bubble, and a reservoir resets it. Bubble distance and tube radius estimate water uptake per time; uptake is a proxy, not direct transpiration.</desc><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#087f8c"/></marker></defs><rect width="100%" height="100%" fill="#f3f7f6"/><g font-family="Arial,sans-serif" fill="#18324b"><text x="800" y="55" text-anchor="middle" font-size="36" font-weight="700">A potometer measures water uptake</text><text x="800" y="88" text-anchor="middle" font-size="17" fill="#526578">Marlbridge · schematic teaching diagram · not to scale</text><rect x="28" y="125" width="1040" height="600" rx="20" fill="#fff" stroke="#c9d8de" stroke-width="3"/><text x="548" y="165" text-anchor="middle" font-size="21" font-weight="700">Airtight, water-filled assembly</text><path d="M135 410H330M780 410H875" stroke="#78b8d2" stroke-width="32" stroke-linecap="round"/><path d="M330 410H780" stroke="#78b8d2" stroke-width="13"/><g stroke="#18324b" stroke-width="2"><line x1="370" y1="398" x2="370" y2="422"/><line x1="420" y1="401" x2="420" y2="419"/><line x1="470" y1="398" x2="470" y2="422"/><line x1="520" y1="401" x2="520" y2="419"/><line x1="570" y1="398" x2="570" y2="422"/><line x1="620" y1="401" x2="620" y2="419"/><line x1="670" y1="398" x2="670" y2="422"/><line x1="720" y1="401" x2="720" y2="419"/></g><circle cx="500" cy="410" r="13" fill="#fff" stroke="#18324b" stroke-width="4"/><line x1="418" y1="360" x2="576" y2="360" stroke="#c49b27" stroke-width="4" marker-end="url(#a)"/><text x="496" y="338" text-anchor="middle" font-size="15">bubble distance</text><text x="496" y="451" text-anchor="middle" font-size="15">narrow graduated capillary</text><path d="M255 410V290Q255 260 290 260" fill="none" stroke="#18324b" stroke-width="9"/><path d="M290 260Q325 218 360 210M290 260Q263 220 244 205M312 245Q350 226 380 230" fill="none" stroke="#4d8b59" stroke-width="11"/><ellipse cx="244" cy="207" rx="20" ry="10" fill="#83b875"/><ellipse cx="360" cy="210" rx="20" ry="10" fill="#83b875"/><ellipse cx="380" cy="230" rx="20" ry="10" fill="#83b875"/><text x="310" y="188" text-anchor="middle" font-size="16" font-weight="700">leafy shoot</text><line x1="225" y1="310" x2="285" y2="310" stroke="#b75d55" stroke-width="7"/><text x="220" y="338" text-anchor="middle" font-size="14">sealed joint</text><path d="M875 410V550Q875 580 905 580Q935 580 935 550V410" fill="#dceef4" stroke="#18324b" stroke-width="4"/><text x="905" y="615" text-anchor="middle" font-size="15">reservoir / tap</text><path d="M255 410V520H360" fill="none" stroke="#78b8d2" stroke-width="24"/><text x="400" y="526" font-size="14">stand / clamp supports tubing</text><rect x="1090" y="130" width="460" height="255" rx="16" fill="#fff" stroke="#c9d8de" stroke-width="2"/><text x="1106" y="158" font-size="17" font-weight="700" fill="#087f8c">Procedure</text><text x="1106" y="188" font-size="14">Fit the shoot under water; seal joints.</text><text x="1106" y="213" font-size="14">Introduce a single bubble into capillary.</text><text x="1106" y="238" font-size="14">Time its travel; reset with reservoir.</text><text x="1106" y="263" font-size="14">Repeat and calculate a mean.</text><rect x="1090" y="415" width="460" height="300" rx="16" fill="#fff" stroke="#c9d8de" stroke-width="2"/><text x="1106" y="443" font-size="17" font-weight="700" fill="#087f8c">Interpretation</text><text x="1106" y="473" font-size="14">Volume ≈ πr² × bubble distance.</text><text x="1106" y="498" font-size="14">Rate = volume ÷ time.</text><text x="1106" y="523" font-size="14">Uptake estimates transpiration indirectly.</text><text x="1106" y="548" font-size="14">Growth, storage and leaks affect uptake.</text><text x="1106" y="573" font-size="14">Change one factor; hold others steady.</text><rect x="50" y="770" width="1490" height="135" rx="18" fill="#fff" stroke="#c9d8de" stroke-width="2"/><text x="80" y="814" font-size="17" font-weight="700" fill="#087f8c">Fair test</text><text x="80" y="852" font-size="15">Use comparable shoots and measurement times. A lamp also changes temperature; monitor it. A potometer records uptake, not water leaving leaves directly.</text><text x="800" y="936" text-anchor="middle" font-size="25" opacity=".07" transform="rotate(-15 800 936)">MARLBRIDGE STUDY RESOURCES</text><image href="data:image/svg+xml;base64," x="1448" y="896" width="128" height="34" preserveAspectRatio="xMaxYMid meet"/><text x="24" y="936" font-size="12" fill="#526578">Use labeled structures and stated limits; conditions affect outcomes.</text></g></svg>
