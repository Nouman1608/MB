<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="title desc"><title id="title">Edexcel IAL Core Practical 14: antibiotic disc diffusion</title><desc id="desc">A sealed agar plate with a bacterial lawn, antibiotic discs and sterile-water control. Measure inhibition-zone diameters, repeat, and interpret cautiously because diffusion affects zone size.</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="62" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#10233F">Core Practical 14: antibiotic disc diffusion</text><text x="54" y="98" font-family="Arial,sans-serif" font-size="18" fill="#5B6D80">Pearson Edexcel International A Level Biology • 6.14</text><rect x="48" y="142" width="700" height="620" rx="18" fill="#fff" stroke="#D3DCE2" stroke-width="2"/><text x="398" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#10233F">Plate plan (top view)</text><circle cx="390" cy="458" r="205" fill="#F6FBFD" stroke="#315F86" stroke-width="5"/><circle cx="390" cy="458" r="173" fill="#E4F1D9" stroke="#8AB2A0" stroke-width="2"/><text x="390" y="291" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#397D64">even lawn of safe, approved bacteria</text><circle cx="326" cy="423" r="61" fill="#FFF6DE" stroke="#C9A227" stroke-width="3"/><circle cx="326" cy="423" r="12" fill="#fff" stroke="#315F86" stroke-width="3"/><text x="326" y="428" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#10233F">P</text><circle cx="467" cy="412" r="45" fill="#E7F5EF" stroke="#397D64" stroke-width="3"/><circle cx="467" cy="412" r="12" fill="#fff" stroke="#315F86" stroke-width="3"/><text x="467" y="417" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#10233F">R</text><circle cx="399" cy="531" r="37" fill="#F7F7F7" stroke="#AAB6C2" stroke-width="3"/><circle cx="399" cy="531" r="12" fill="#fff" stroke="#315F86" stroke-width="3"/><text x="399" y="536" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#10233F">W</text><g font-family="Arial,sans-serif" font-size="16" fill="#243B53"><text x="142" y="655">P, R = different antibiotic discs</text><text x="142" y="683">W = sterile-water control disc</text><text x="142" y="711">Use replicates; keep conditions constant.</text></g><rect x="780" y="142" width="700" height="620" rx="18" fill="#fff" stroke="#D3DCE2" stroke-width="2"/><text x="1130" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#10233F">Measure, compare, evaluate</text><circle cx="962" cy="380" r="93" fill="#E7F5EF" stroke="#397D64" stroke-width="3"/><circle cx="962" cy="380" r="13" fill="#fff" stroke="#315F86" stroke-width="3"/><line x1="869" y1="380" x2="1055" y2="380" stroke="#C9A227" stroke-width="4"/><path d="M869 366v28M1055 366v28" stroke="#C9A227" stroke-width="4"/><text x="962" y="510" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#243B53">Measure full zone diameter</text><text x="962" y="538" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#5B6D80">including disc • repeat • calculate mean</text><g font-family="Arial,sans-serif"><rect x="1090" y="260" width="330" height="208" rx="12" fill="#F3F6F6" stroke="#D3DCE2"/><text x="1115" y="297" font-size="18" font-weight="700" fill="#10233F">Example diameters (mm)</text><text x="1115" y="338" font-size="16" fill="#243B53">P: 22, 24, 23 → mean 23</text><text x="1115" y="374" font-size="16" fill="#243B53">R: 12, 13, 14 → mean 13</text><text x="1115" y="410" font-size="16" fill="#243B53">Water control: disc only</text><text x="1115" y="446" font-size="15" fill="#5B6D80">Illustrative data from lesson</text><rect x="810" y="600" width="640" height="112" rx="14" fill="#FFF6DE" stroke="#D8C27A"/><text x="834" y="640" font-size="18" font-weight="700" fill="#10233F">Interpret with care</text><text x="834" y="672" font-size="16" fill="#243B53">Zone size reflects diffusion and growth inhibition; it does not alone</text><text x="834" y="696" font-size="16" fill="#243B53">prove clinical effectiveness or whether cells were killed.</text></g><rect x="48" y="790" width="1432" height="76" rx="14" fill="#E7F5EF" stroke="#9DCBB6"/><text x="76" y="823" font-family="Arial,sans-serif" font-size="16" fill="#243B53">Use only a safe, approved strain and your centre's risk-assessed procedure; keep cultures sealed and dispose of them as instructed.</text><text x="48" y="916" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#315F86">Marlbridge Study Resources</text><image x="1288" y="876" width="190" height="54" href="data:image/svg+xml;base64,"/></svg>
