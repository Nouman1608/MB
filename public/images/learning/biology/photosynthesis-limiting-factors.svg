<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="871" viewBox="0 0 1528 871" role="img" aria-labelledby="title desc"><title id="title">Identify which factor limits photosynthesis</title><desc id="desc">A controlled light-response investigation distinguishes limiting factors, plateaus, net oxygen exchange and measurement limitations.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#1c2d4b"/></marker><marker id="red" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#b75e53"/></marker><marker id="blue" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#357ea2"/></marker></defs><rect width="100%" height="100%" fill="#f5f8f7"/><g font-family="Arial, sans-serif"><text x="24" y="58" font-size="38" font-weight="700" text-anchor="start" fill="#1c2d4b">Identify which factor limits photosynthesis</text><text x="24" y="104" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Changing one factor helps only while another requirement does not become limiting.</text><g transform="translate(24,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">A light-intensity investigation</text><rect x="35" y="90" width="650" height="112" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="53" y="119" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">1 Hold relevant variables steady</text><text x="53" y="150" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">Control temperature, CO₂ availability, plant material and</text><text x="53" y="177" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">measurement interval.</text><path d="M360,205 L360,217" fill="none" stroke="#357ea2" stroke-width="2" marker-end="url(#blue)"/><rect x="35" y="220" width="650" height="112" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="53" y="249" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">2 Increase light intensity in measured steps</text><text x="53" y="280" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">At low light, increased light can raise the rate.</text><path d="M360,335 L360,347" fill="none" stroke="#357ea2" stroke-width="2" marker-end="url(#blue)"/><rect x="35" y="350" width="650" height="112" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="53" y="379" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">3 Interpret a plateau</text><text x="53" y="410" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">Another factor or capacity may now limit the rate; more light</text><text x="53" y="437" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">alone may have little effect.</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Distance from a lamp is not light intensity itself; lamp heating is</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">a possible confounder.</text></g><g transform="translate(784,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">What the measurement represents</text><rect x="35" y="100" width="310" height="175" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="51" y="131" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">O₂ production</text><text x="51" y="189" font-size="20" font-weight="400" text-anchor="start" fill="#1c2d4b">A gas-volume or sensor</text><text x="51" y="215" font-size="20" font-weight="400" text-anchor="start" fill="#1c2d4b">measurement can be a proxy</text><text x="51" y="241" font-size="20" font-weight="400" text-anchor="start" fill="#1c2d4b">for photosynthetic activity.</text><rect x="375" y="100" width="310" height="175" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="391" y="131" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">Bubble counts</text><text x="391" y="189" font-size="20" font-weight="400" text-anchor="start" fill="#1c2d4b">Bubble sizes vary, so counting</text><text x="391" y="215" font-size="20" font-weight="400" text-anchor="start" fill="#1c2d4b">alone gives a less direct</text><text x="391" y="241" font-size="20" font-weight="400" text-anchor="start" fill="#1c2d4b">volume estimate.</text><rect x="35" y="280" width="310" height="175" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="51" y="311" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">Net vs gross</text><text x="51" y="369" font-size="20" font-weight="400" text-anchor="start" fill="#1c2d4b">The observed gas change</text><text x="51" y="395" font-size="20" font-weight="400" text-anchor="start" fill="#1c2d4b">includes simultaneous</text><text x="51" y="421" font-size="20" font-weight="400" text-anchor="start" fill="#1c2d4b">respiration as well as</text><text x="51" y="447" font-size="20" font-weight="400" text-anchor="start" fill="#1c2d4b">photosynthesis.</text><rect x="375" y="280" width="310" height="175" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="391" y="311" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">Temperature</text><text x="391" y="369" font-size="20" font-weight="400" text-anchor="start" fill="#1c2d4b">Warming may initially increase</text><text x="391" y="395" font-size="20" font-weight="400" text-anchor="start" fill="#1c2d4b">enzyme activity; excessive</text><text x="391" y="421" font-size="20" font-weight="400" text-anchor="start" fill="#1c2d4b">heat can impair the system.</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">State whether the rate is net gas exchange, a gross estimate or</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">another proxy, and include replicates.</text></g><text x="24" y="849" font-size="19" font-weight="400" text-anchor="start" fill="#1c2d4b">MARLBRIDGE  •  Schematic; structures and particles are not to scale.</text></g></svg>
