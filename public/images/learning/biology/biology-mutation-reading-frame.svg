<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">A single-base addition shifts the reading frame</title><desc id="desc">Worked mRNA example: a substitution changes one codon, whereas a one-base insertion after AUG changes every downstream codon grouping. Mutations may be silent or have different effects; the displayed sequences are illustrative.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#315fbd"/></marker><marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#177e79"/></marker><marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c66a1d"/></marker></defs><rect width="100%" height="100%" fill="#f8faff"/><text x="28" y="45" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#18263d" text-anchor="start">A single-base addition shifts the reading frame</text><text x="28" y="76" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#667085" text-anchor="start">Codons are read in non-overlapping triplets.</text><rect x="24" y="100" width="952" height="510" rx="14" fill="white" stroke="#d5ddea" stroke-width="2"/><rect x="44" y="128" width="438" height="365" rx="14" fill="#fff" stroke="#d5ddea" stroke-width="2"/><text x="263" y="165" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#18263d" text-anchor="middle">Substitution: downstream frame stays</text><text x="70" y="213" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#667085" text-anchor="start">Original mRNA</text><text x="70" y="246" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#18263d" text-anchor="start">AUG  |  GAA  |  UUU  |  GGC  |  UAA</text><text x="70" y="288" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#667085" text-anchor="start">Changed mRNA</text><rect x="144" y="301" width="43" height="43" rx="7" fill="#fff0ed" stroke="#bd5c52" stroke-width="1"/><text x="70" y="330" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#18263d" text-anchor="start">AUG  |  GUA  |  UUU  |  GGC  |  UAA</text><text x="70" y="375" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#bd5c52" text-anchor="start">GAA → GUA changes Glu → Val in this example.</text><text x="70" y="408" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">Later codons remain grouped the same way.</text><text x="70" y="461" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#18263d" text-anchor="start">The peptide may change at one position.</text><rect x="518" y="128" width="438" height="365" rx="14" fill="#fff" stroke="#d5ddea" stroke-width="2"/><text x="737" y="165" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#18263d" text-anchor="middle">One-base insertion: frame shifts</text><text x="545" y="213" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#667085" text-anchor="start">Original mRNA</text><text x="545" y="246" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#18263d" text-anchor="start">AUG  |  GAA  |  UUU  |  GGC  |  UAA</text><text x="545" y="288" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#667085" text-anchor="start">Insert C after AUG</text><rect x="623" y="301" width="70" height="43" rx="7" fill="#fff0ed" stroke="#bd5c52" stroke-width="1"/><text x="545" y="330" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#18263d" text-anchor="start">AUG  |  CGA  |  AUU  |  UGG  |  CUA  |  …</text><text x="545" y="375" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#bd5c52" text-anchor="start">Every downstream triplet boundary changes.</text><text x="545" y="408" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">A later stop may appear; effect varies.</text><text x="545" y="461" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#18263d" text-anchor="start">A multiple of 3 adds/removes amino acids</text><text x="545" y="483" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#18263d" text-anchor="start">but keeps the downstream reading frame.</text><rect x="82" y="520" width="836" height="54" rx="11" fill="#e5f4f1" stroke="#177e79" stroke-width="1"/><text x="500" y="554" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#18263d" text-anchor="middle">Substitution affects a codon; a non-multiple-of-three indel changes downstream grouping.</text><text x="26" y="632" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#667085" text-anchor="start">MARLBRIDGE • Example sequence; codons and outcomes are illustrative.</text></svg>