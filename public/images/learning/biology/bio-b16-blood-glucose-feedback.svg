<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Blood glucose: insulin and glucagon</title><desc id="desc">Contrasts insulin and glucagon actions described in the source and shows how each response opposes a change in blood glucose.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#168C8C"/></marker></defs><rect width="1600" height="900" fill="#F4F8F7"/><text x="800" y="58" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#17324D" text-anchor="middle">Blood glucose: insulin and glucagon</text><text x="800" y="92" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#526778" text-anchor="middle">Marlbridge • OxfordAQA IGCSE Biology • Homeostasis / blood glucose</text><rect x="80" y="155" width="600" height="185" rx="16" fill="#fff" stroke="#CAD7DC" stroke-width="2"/><text x="102" y="193" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#D76C61" text-anchor="start">BLOOD GLUCOSE TOO HIGH</text><text x="102" y="233" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#17324D" text-anchor="start">Pancreas releases insulin.</text><text x="102" y="264" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#17324D" text-anchor="start">Glucose moves from blood into cells.</text><text x="102" y="295" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#17324D" text-anchor="start">Liver and muscles store glucose as glycogen.</text><path d="M700,250 L870,250" fill="none" stroke="#D76C61" stroke-width="7" marker-end="url(#arr)"/><rect x="920" y="155" width="600" height="185" rx="16" fill="#fff" stroke="#CAD7DC" stroke-width="2"/><text x="942" y="193" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#3983B8" text-anchor="start">Blood glucose falls</text><text x="942" y="233" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#17324D" text-anchor="start">The response reverses the rise.</text><text x="942" y="264" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#17324D" text-anchor="start">The level moves back towards normal.</text><rect x="80" y="470" width="600" height="185" rx="16" fill="#fff" stroke="#CAD7DC" stroke-width="2"/><text x="102" y="508" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#E1AA37" text-anchor="start">BLOOD GLUCOSE TOO LOW</text><text x="102" y="548" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#17324D" text-anchor="start">Pancreas releases glucagon.</text><text x="102" y="579" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#17324D" text-anchor="start">Stored glycogen changes back into glucose.</text><text x="102" y="610" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#17324D" text-anchor="start">Glucose enters the blood.</text><path d="M700,565 L870,565" fill="none" stroke="#E1AA37" stroke-width="7" marker-end="url(#arr)"/><rect x="920" y="470" width="600" height="185" rx="16" fill="#fff" stroke="#CAD7DC" stroke-width="2"/><text x="942" y="508" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#168C8C" text-anchor="start">Blood glucose rises</text><text x="942" y="548" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#17324D" text-anchor="start">The response reverses the fall.</text><text x="942" y="579" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#17324D" text-anchor="start">The level moves back towards normal.</text><text x="800" y="735" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#17324D" text-anchor="middle">Insulin and glucagon act in opposite directions to regulate blood glucose.</text><text x="45" y="862" font-family="Arial,sans-serif" font-size="13" fill="#526778">Schematic teaching diagram • check the stated conditions and limits</text><text x="800" y="835" text-anchor="middle" font-family="Arial,sans-serif" font-size="42" font-weight="700" opacity=".06" fill="#17324D">MARLBRIDGE STUDY RESOURCES</text><image href="data:image/svg+xml;base64," x="1370" y="825" width="180" height="50" preserveAspectRatio="xMaxYMid meet"/></svg>