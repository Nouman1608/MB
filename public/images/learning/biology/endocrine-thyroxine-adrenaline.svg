<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="871" viewBox="0 0 1528 871" role="img" aria-labelledby="title desc"><title id="title">Endocrine signals act through target-cell receptors</title><desc id="desc">A thyroid-axis negative feedback pathway is contrasted with rapid receptor-dependent adrenal-medullary signalling.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#1c2d4b"/></marker><marker id="red" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#b75e53"/></marker><marker id="blue" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#357ea2"/></marker></defs><rect width="100%" height="100%" fill="#f5f8f7"/><g font-family="Arial, sans-serif"><text x="24" y="58" font-size="38" font-weight="700" text-anchor="start" fill="#1c2d4b">Endocrine signals act through target-cell receptors</text><text x="24" y="104" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Hormones travel in blood, but responses depend on receptor expression and cellular pathways.</text><g transform="translate(24,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Thyroid-axis negative feedback</text><rect x="35" y="90" width="650" height="112" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="53" y="119" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">1 Hypothalamus releases TRH</text><text x="53" y="150" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">TRH stimulates the anterior pituitary.</text><path d="M360,205 L360,217" fill="none" stroke="#357ea2" stroke-width="2" marker-end="url(#blue)"/><rect x="35" y="220" width="650" height="112" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="53" y="249" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">2 Pituitary releases TSH</text><text x="53" y="280" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">TSH stimulates thyroid hormone production and release.</text><path d="M360,335 L360,347" fill="none" stroke="#357ea2" stroke-width="2" marker-end="url(#blue)"/><rect x="35" y="350" width="650" height="112" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="53" y="379" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">3 Thyroid hormones feed back</text><text x="53" y="410" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">Rising thyroid hormone levels inhibit upstream stimulation.</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Thyroid hormones affect gene expression and metabolic</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">activity; thyroxine is converted to more active T₃ in many</text><text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">tissues.</text></g><g transform="translate(784,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Adrenaline in an acute response</text><rect x="35" y="90" width="650" height="112" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="53" y="119" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">1 Sympathetic activity stimulates the adrenal medulla</text><text x="53" y="150" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">Chromaffin cells release adrenaline into the blood.</text><path d="M360,205 L360,217" fill="none" stroke="#357ea2" stroke-width="2" marker-end="url(#blue)"/><rect x="35" y="220" width="650" height="112" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="53" y="249" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">2 Receptor-dependent tissue effects follow</text><text x="53" y="280" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">Responses can include increased cardiac activity and</text><text x="53" y="307" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">mobilisation of stored fuel.</text><path d="M360,335 L360,347" fill="none" stroke="#357ea2" stroke-width="2" marker-end="url(#blue)"/><rect x="35" y="350" width="650" height="112" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="53" y="379" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">3 Signal termination permits recovery</text><text x="53" y="410" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">Hormone removal and changes in autonomic activity limit the</text><text x="53" y="437" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">response.</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Effects vary among receptor subtypes and tissues; not every</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">blood vessel responds in the same direction.</text></g><text x="24" y="849" font-size="19" font-weight="400" text-anchor="start" fill="#1c2d4b">MARLBRIDGE  •  Schematic; structures and particles are not to scale.</text></g></svg>