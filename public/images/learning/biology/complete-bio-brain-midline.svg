<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="871" viewBox="0 0 1528 871" role="img" aria-labelledby="title desc"><title id="title">Brain regions: include the hypothalamus and pituitary</title><desc id="desc">A simplified sagittal brain labels cerebrum, cerebellum, medulla, hypothalamus and pituitary. The hypothalamus is above the pituitary; the cerebellum is posterior to the brainstem.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#1c2d4b"/></marker><marker id="red" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#b75e53"/></marker><marker id="blue" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#357ea2"/></marker></defs><rect width="100%" height="100%" fill="#f5f8f7"/><g font-family="Arial, sans-serif"><text x="24" y="58" font-size="38" font-weight="700" text-anchor="start" fill="#1c2d4b">Brain regions: include the hypothalamus and pituitary</text><text x="24" y="104" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">OCR Biology 5.1.5(h) • Gross structure and core functions</text><g transform="translate(24,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">A simplified midline section</text><path d="M90,267 C65,190 90,105 200,92 C320,65 493,99 550,190 C590,257 548,300 474,306 L405,279 L372,319 L274,324 L238,291 C170,318 111,308 90,267 Z" fill="#e2efec" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M382,278 C399,288 429,306 434,341 L419,397 L390,389 L394,337 L361,311" fill="#73aaa5" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="493" cy="332" rx="65" ry="46" fill="#d5b32d" stroke="#1c2d4b" stroke-width="3"/><ellipse cx="305" cy="286" rx="26" ry="18" fill="#b75e53" stroke="#1c2d4b" stroke-width="3"/><path d="M305,305 L308,344" fill="none" stroke="#b75e53" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="308" cy="359" rx="24" ry="17" fill="#b75e53" stroke="#1c2d4b" stroke-width="3"/><path d="M137,160 q20,-27 40,0 t40,0" fill="none" stroke="#cad7d5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M216,125 q20,-27 40,0 t40,0" fill="none" stroke="#cad7d5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M315,147 q20,-27 40,0 t40,0" fill="none" stroke="#cad7d5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M418,169 q20,-27 40,0 t40,0" fill="none" stroke="#cad7d5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M110,247 q20,-27 40,0 t40,0" fill="none" stroke="#cad7d5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M440,244 q20,-27 40,0 t40,0" fill="none" stroke="#cad7d5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M151.0,72.3 L200,133" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="47" y="80" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Cerebrum</text><path d="M495,406 L495,347" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="459" y="434" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Cerebellum</text><path d="M412,441 L412,375" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="417" y="469" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Medulla</text><path d="M185.0,381.3 L308,359" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="39" y="389" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Pituitary gland</text><path d="M182.0,333.3 L305,286" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="35" y="341" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Hypothalamus</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Front is at the left; back is at the right. The pituitary hangs</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">below the hypothalamus. Internal boundaries are simplified.</text></g><g transform="translate(784,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Associate a part with its role</text><text x="35" y="83" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">Cerebrum</text><text x="35" y="110" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">Thought, memory, sensory interpretation; initiates voluntary</text><text x="35" y="135" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">movement.</text><text x="35" y="161" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">Cerebellum</text><text x="35" y="188" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">Coordinates movement and balance.</text><text x="35" y="239" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">Medulla oblongata</text><text x="35" y="266" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">Regulates breathing and heart rate.</text><text x="35" y="317" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">Hypothalamus</text><text x="35" y="344" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">Coordinates homeostasis; controls pituitary signals.</text><text x="35" y="395" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">Pituitary gland</text><text x="35" y="422" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">Releases hormones into the blood.</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">The pituitary has different anterior and posterior functions; this</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">overview identifies its location and overall role.</text></g><text x="24" y="849" font-size="19" font-weight="400" text-anchor="start" fill="#1c2d4b">MARLBRIDGE  •  Schematic; structures and particles are not to scale.</text></g></svg>