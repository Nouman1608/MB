<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Lipids and proteins: structures to draw and interpret</title><desc id="desc">Overview of triglyceride ester links, phospholipid head and tails, general amino-acid structure and peptide bonds, and levels of protein folding with stabilising interactions.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#168C8C"/></marker><marker id="arrN" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#17324D"/></marker></defs><rect width="1600" height="1000" fill="#F4F8F7"/><text x="800" y="62" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#17324D" text-anchor="middle">Lipids and proteins: structures to draw and interpret</text><text x="800" y="98" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#526778" text-anchor="middle">Marlbridge • AQA A Level Biology • Biological molecules • lipids and protein structure</text><rect x="48" y="130" width="1504" height="735" rx="18" fill="#fff" stroke="#CAD7DC" stroke-width="2"/><rect x="70" y="160" width="700" height="310" rx="14" fill="#fff" stroke="#CAD7DC" stroke-width="2"/><text x="92" y="200" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#168C8C" text-anchor="start">1  TRIGLYCERIDE</text><text x="92" y="230" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#17324D" text-anchor="start">One glycerol + three fatty acids; three ester links; three H₂O lost.</text><rect x="830" y="160" width="700" height="310" rx="14" fill="#fff" stroke="#CAD7DC" stroke-width="2"/><text x="852" y="200" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#3983B8" text-anchor="start">2  PHOSPHOLIPID</text><text x="852" y="230" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#17324D" text-anchor="start">Phosphate-containing head + two fatty-acid tails.</text><rect x="70" y="500" width="700" height="310" rx="14" fill="#fff" stroke="#CAD7DC" stroke-width="2"/><text x="92" y="540" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#E1AA37" text-anchor="start">3  AMINO ACID → PEPTIDE</text><text x="92" y="570" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#17324D" text-anchor="start">Shared amino-acid core; R varies. Peptide bond forms by condensation.</text><rect x="830" y="500" width="700" height="310" rx="14" fill="#fff" stroke="#CAD7DC" stroke-width="2"/><text x="852" y="540" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#D76C61" text-anchor="start">4  PROTEIN STRUCTURE</text><text x="852" y="570" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#17324D" text-anchor="start">Sequence → local folds → whole-chain shape → multiple subunits.</text><text x="150" y="285" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#17324D" text-anchor="start">glycerol</text><path d="M250 255 V380" stroke="#172B3C" stroke-width="5"/><path d="M250 265 H350 H515" stroke="#3983B8" stroke-width="5" fill="none"/><circle cx="360" cy="265" r="7" fill="#E1AA37" stroke="#E1AA37" stroke-width="1"/><text x="375" y="270" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#E1AA37" text-anchor="start">ester link</text><text x="525" y="270" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#3983B8" text-anchor="start">fatty acid 1</text><path d="M250 315 H350 H515" stroke="#3983B8" stroke-width="5" fill="none"/><circle cx="360" cy="315" r="7" fill="#E1AA37" stroke="#E1AA37" stroke-width="1"/><text x="375" y="320" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#E1AA37" text-anchor="start">ester link</text><text x="525" y="320" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#3983B8" text-anchor="start">fatty acid 2</text><path d="M250 365 H350 H515" stroke="#3983B8" stroke-width="5" fill="none"/><circle cx="360" cy="365" r="7" fill="#E1AA37" stroke="#E1AA37" stroke-width="1"/><text x="375" y="370" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#E1AA37" text-anchor="start">ester link</text><text x="525" y="370" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#3983B8" text-anchor="start">fatty acid 3</text><text x="165" y="420" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#526778" text-anchor="start">condensation: 3 links formed, 3 water molecules released</text><circle cx="990" cy="315" r="48" fill="#EAF4F8" stroke="#3983B8" stroke-width="4"/><text x="990" y="321" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#3983B8" text-anchor="middle">phosphate</text><path d="M1037 315 L1090 315" fill="none" stroke="#17324D" stroke-width="4"/><path d="M1090 315 L1150 270" fill="none" stroke="#17324D" stroke-width="4"/><path d="M1090 315 L1150 360" fill="none" stroke="#17324D" stroke-width="4"/><path d="M1150 270 L1200 270 L1225 285 L1275 285 L1300 300 L1385 300" fill="none" stroke="#3983B8" stroke-width="5"/><path d="M1150 360 L1200 360 L1225 345 L1275 345 L1300 330 L1385 330" fill="none" stroke="#3983B8" stroke-width="5"/><text x="990" y="420" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#3983B8" text-anchor="middle">hydrophilic head</text><text x="1280" y="385" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#3983B8" text-anchor="middle">hydrophobic tails</text><text x="145" y="610" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#17324D" text-anchor="start">general amino acid</text><text x="285" y="710" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17324D" text-anchor="middle">H</text><text x="375" y="710" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17324D" text-anchor="middle">C</text><text x="465" y="710" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#168C8C" text-anchor="middle">R</text><path d="M297 690 L355 690" fill="none" stroke="#17324D" stroke-width="3"/><path d="M393 690 L450 690" fill="none" stroke="#17324D" stroke-width="3"/><text x="375" y="655" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#3983B8" text-anchor="middle">NH₂</text><text x="375" y="775" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#D76C61" text-anchor="middle">COOH</text><text x="535" y="710" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#168C8C" text-anchor="start">R group changes</text><text x="145" y="785" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#526778" text-anchor="start">amino acid + amino acid → dipeptide</text><text x="510" y="785" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#E1AA37" text-anchor="start">peptide bond = –CO–NH–</text><path d="M930 665 C960 600 995 720 1030 650 S1095 705 1128 638" fill="none" stroke="#3983B8" stroke-width="7"/><text x="1030" y="750" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#3983B8" text-anchor="middle">primary → secondary</text><path d="M1175 650 C1200 590 1290 600 1310 650 C1330 705 1265 735 1215 700 C1185 680 1265 630 1360 690" fill="none" stroke="#168C8C" stroke-width="7"/><text x="1270" y="750" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#168C8C" text-anchor="middle">tertiary fold</text><text x="1160" y="785" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#D76C61" text-anchor="middle">H bonds • ionic links • disulfide bridges</text><rect x="100" y="820" width="1400" height="28" rx="8" fill="#FFF4D6" stroke="#E1AA37" stroke-width="1"/><text x="800" y="841" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17324D" text-anchor="middle">Schematic molecular forms; lipid chains, R groups and folds vary; a lipid is not a repeating-unit polymer.</text><text x="42" y="944" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#526778" text-anchor="start">Molecular diagrams are simplified and not to scale</text><path d="M40 918H1560" stroke="#E1AA37" stroke-width="3"/><text x="800" y="900" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#17324D" opacity=".07" text-anchor="middle">MARLBRIDGE STUDY RESOURCES</text><image href="data:image/svg+xml;base64," x="1365" y="923" width="190" height="54" preserveAspectRatio="xMaxYMid meet"/><text x="42" y="980" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#526778" text-anchor="start">MARLBRIDGE  •  STUDY RESOURCE</text></svg>