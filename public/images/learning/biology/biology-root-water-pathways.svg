<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">Two pathways carry water from soil to xylem</title><desc id="desc">Schematic radial route: apoplast water moves through walls but is stopped by the endodermal Casparian strip; symplast water crosses a membrane and moves through cytoplasm and plasmodesmata. Water must enter endodermal cytoplasm before reaching xylem.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#315fbd"/></marker><marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#177e79"/></marker><marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c66a1d"/></marker></defs><rect width="100%" height="100%" fill="#f8faff"/><text x="28" y="45" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#18263d" text-anchor="start">Two pathways carry water from soil to xylem</text><text x="28" y="76" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#667085" text-anchor="start">The Casparian strip makes the root select what enters the xylem.</text><rect x="24" y="100" width="952" height="510" rx="14" fill="white" stroke="#d5ddea" stroke-width="2"/><rect x="45" y="155" width="160" height="160" rx="14" fill="#e9f1fa" stroke="#d5ddea" stroke-width="2"/><text x="125" y="188" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#18263d" text-anchor="middle">Soil</text><text x="125" y="218" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#667085" text-anchor="middle">water + ions</text><rect x="232" y="155" width="160" height="160" rx="14" fill="#e5f4f1" stroke="#d5ddea" stroke-width="2"/><text x="312" y="188" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#18263d" text-anchor="middle">Root hair</text><text x="312" y="218" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#667085" text-anchor="middle">water crosses membrane</text><rect x="419" y="155" width="160" height="160" rx="14" fill="#e5f4f1" stroke="#d5ddea" stroke-width="2"/><text x="499" y="188" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#18263d" text-anchor="middle">Cortex</text><text x="499" y="218" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#667085" text-anchor="middle">wall or cytoplasm</text><rect x="606" y="155" width="160" height="160" rx="14" fill="#e5f4f1" stroke="#d5ddea" stroke-width="2"/><text x="686" y="188" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#18263d" text-anchor="middle">Endodermis</text><text x="686" y="218" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#667085" text-anchor="middle">suberin strip</text><rect x="793" y="155" width="160" height="160" rx="14" fill="#e9f1fa" stroke="#d5ddea" stroke-width="2"/><text x="873" y="188" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#18263d" text-anchor="middle">Xylem</text><text x="873" y="218" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#667085" text-anchor="middle">water + selected ions</text><rect x="248" y="235" width="135" height="66" rx="10" fill="#fff" stroke="#d5ddea" stroke-width="1"/><rect x="259" y="245" width="113" height="47" rx="8" fill="#eef4fa" stroke="#315fbd" stroke-width="2"/><text x="315" y="274" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#315fbd" text-anchor="middle">cytoplasm</text><rect x="435" y="235" width="135" height="66" rx="10" fill="#fff" stroke="#d5ddea" stroke-width="1"/><rect x="446" y="245" width="113" height="47" rx="8" fill="#eef4fa" stroke="#315fbd" stroke-width="2"/><text x="502" y="274" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#315fbd" text-anchor="middle">cytoplasm</text><rect x="622" y="235" width="135" height="66" rx="10" fill="#fff" stroke="#d5ddea" stroke-width="1"/><rect x="633" y="245" width="113" height="47" rx="8" fill="#eef4fa" stroke="#315fbd" stroke-width="2"/><text x="689" y="274" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#315fbd" text-anchor="middle">cytoplasm</text><rect x="830" y="232" width="86" height="70" rx="13" fill="#fff" stroke="#315fbd" stroke-width="3"/><text x="873" y="275" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#315fbd" text-anchor="middle">vessel</text><path d="M208 235 L230 235" fill="none" stroke="#18263d" stroke-width="3" stroke-linecap="round"/><path d="M395 235 L417 235" fill="none" stroke="#18263d" stroke-width="3" stroke-linecap="round"/><path d="M582 235 L604 235" fill="none" stroke="#18263d" stroke-width="3" stroke-linecap="round"/><path d="M769 235 L791 235" fill="none" stroke="#18263d" stroke-width="3" stroke-linecap="round"/><rect x="68" y="346" width="96" height="26" rx="4" fill="#fff" stroke="#f8faff" stroke-width="0"/><text x="72" y="365" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#c66a1d" text-anchor="start">APOPLAST</text><path d="M164 365 L690 365" fill="none" stroke="#c66a1d" stroke-width="5" stroke-linecap="round"/><path d="M690 365 L690 333" fill="none" stroke="#c66a1d" stroke-width="5" stroke-linecap="round"/><text x="690" y="390" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#bd5c52" text-anchor="middle">blocked here</text><path d="M695 348 L695 379" fill="none" stroke="#bd5c52" stroke-width="5" stroke-linecap="round"/><text x="82" y="444" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#315fbd" text-anchor="start">SYMPLAST</text><path d="M145 437 L800 437" fill="none" stroke="#315fbd" stroke-width="5" stroke-linecap="round" marker-end="url(#arr)"/><path d="M310 437 L310 301" fill="none" stroke="#315fbd" stroke-width="3" stroke-linecap="round"/><path d="M497 437 L497 301" fill="none" stroke="#315fbd" stroke-width="3" stroke-linecap="round"/><path d="M684 437 L684 301" fill="none" stroke="#315fbd" stroke-width="3" stroke-linecap="round"/><text x="505" y="470" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#315fbd" text-anchor="middle">Cytoplasm connects through plasmodesmata.</text><rect x="80" y="503" width="840" height="76" rx="12" fill="#fff4e9" stroke="#f1d1aa" stroke-width="1"/><text x="100" y="532" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#18263d" text-anchor="start">To enter the xylem, water must cross a cell-surface membrane at the endodermis.</text><text x="100" y="557" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="start">The plant can regulate which mineral ions reach the vascular tissue.</text><text x="26" y="632" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#667085" text-anchor="start">MARLBRIDGE • Schematic route; cells and distances are not to scale.</text></svg>