<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="871" viewBox="0 0 1528 871" role="img" aria-labelledby="title desc"><title id="title">Osmosis practicals: membrane bag and potato tissue</title><desc id="desc">A closed bag in water models inward water movement only when its solute is retained. A second panel details comparable potato cylinders, concentration treatments, repeated masses and percentage change. Membrane selectivity is an explicit condition.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#1c2d4b"/></marker><marker id="red" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#b75e53"/></marker><marker id="blue" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#357ea2"/></marker></defs><rect width="100%" height="100%" fill="#f5f8f7"/><g font-family="Arial, sans-serif"><text x="24" y="58" font-size="38" font-weight="700" text-anchor="start" fill="#1c2d4b">Osmosis practicals: membrane bag and potato tissue</text><text x="24" y="104" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Edexcel International GCSE Biology 4BI1 • Controls, mass and cautious interpretation</text><g transform="translate(24,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Bag model: measure mass change</text><rect x="65" y="135" width="580" height="272" rx="0" fill="white" stroke="#1c2d4b" stroke-width="3"/><rect x="68" y="198" width="574" height="205" rx="0" fill="#e5f1f6" stroke="none" stroke-width="0"/><path d="M260,164 Q235,222 248,342 Q345,384 444,342 Q458,222 430,164 Z" fill="#e2efec" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M260,164 Q345,184 430,164" fill="none" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M236.0,100.3 L322,256" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="35" y="108" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Bag: retained solute</text><path d="M551,424 L551,285" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="429" y="452" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">External water</text><path d="M170,278 L238,278" fill="none" stroke="#1c2d4b" stroke-width="4" marker-end="url(#arr)"/><path d="M520,278 L451,278" fill="none" stroke="#1c2d4b" stroke-width="4" marker-end="url(#arr)"/><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Choose a membrane documented to retain the solute during</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">the trial. Water can cross. Tie securely, blot consistently, then</text><text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">weigh before and after a fixed time.</text></g><g transform="translate(784,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Plant tissue: compare concentrations</text><rect x="38" y="88" width="644" height="104" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2"/><text x="360.0" y="120" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">Prepare comparable potato cylinders</text><text x="360.0" y="153" font-size="20" font-weight="400" text-anchor="middle" fill="#1c2d4b">Keep initial size, tissue source, solution volume, temperature and</text><text x="360.0" y="179" font-size="20" font-weight="400" text-anchor="middle" fill="#1c2d4b">immersion time the same.</text><path d="M360,196 L360,210" fill="none" stroke="#1c2d4b" stroke-width="4" marker-end="url(#arr)"/><rect x="38" y="214" width="644" height="104" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2"/><text x="360.0" y="246" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">Use a range of external concentrations</text><text x="360.0" y="279" font-size="20" font-weight="400" text-anchor="middle" fill="#1c2d4b">Record initial mass; immerse, blot in a standard way, then measure</text><text x="360.0" y="305" font-size="20" font-weight="400" text-anchor="middle" fill="#1c2d4b">final mass. Repeat each level.</text><path d="M360,322 L360,336" fill="none" stroke="#1c2d4b" stroke-width="4" marker-end="url(#arr)"/><rect x="38" y="340" width="644" height="104" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2"/><text x="360.0" y="372" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">Calculate percentage mass change</text><text x="360.0" y="405" font-size="20" font-weight="400" text-anchor="middle" fill="#1c2d4b">(Final − initial) / initial × 100. Plot against concentration; find the</text><text x="360.0" y="431" font-size="20" font-weight="400" text-anchor="middle" fill="#1c2d4b">zero-change point.</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Mass gain supports net water entry; loss supports net exit.</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Zero net change estimates balance under these conditions;</text><text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">individual water molecules still move.</text></g><text x="24" y="849" font-size="19" font-weight="400" text-anchor="start" fill="#1c2d4b">MARLBRIDGE  •  Schematic; structures and particles are not to scale.</text></g></svg>
