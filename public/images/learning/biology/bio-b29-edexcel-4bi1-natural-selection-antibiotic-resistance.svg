<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="1515" viewBox="0 0 1528 1515" role="img" aria-labelledby="title desc"><title id="title">Natural selection and antibiotic resistance</title><desc id="desc">A resistant variant exists before antibiotic treatment. Treatment removes susceptible bacteria preferentially, and surviving resistant bacteria reproduce, increasing resistance frequency in later generations.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#1c2d4b"/></marker><marker id="red" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#b75e53"/></marker><marker id="blue" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#357ea2"/></marker></defs><rect width="100%" height="100%" fill="#f5f8f7"/><g font-family="Arial, sans-serif"><text x="24" y="58" font-size="38" font-weight="700" text-anchor="start" fill="#1c2d4b">Natural selection and antibiotic resistance</text><text x="24" y="104" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Population change across generations • a simplified model</text><g transform="translate(24,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">1  Variation exists before treatment</text><ellipse cx="130" cy="170" rx="33" ry="24" fill="#e2efec" stroke="#1c2d4b" stroke-width="3"/><text x="130" y="178" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">S</text><ellipse cx="245" cy="170" rx="33" ry="24" fill="#e2efec" stroke="#1c2d4b" stroke-width="3"/><text x="245" y="178" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">S</text><ellipse cx="360" cy="170" rx="33" ry="24" fill="#d5b32d" stroke="#1c2d4b" stroke-width="3"/><text x="360" y="178" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">R</text><ellipse cx="475" cy="170" rx="33" ry="24" fill="#e2efec" stroke="#1c2d4b" stroke-width="3"/><text x="475" y="178" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">S</text><ellipse cx="590" cy="170" rx="33" ry="24" fill="#e2efec" stroke="#1c2d4b" stroke-width="3"/><text x="590" y="178" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">S</text><ellipse cx="130" cy="275" rx="33" ry="24" fill="#e2efec" stroke="#1c2d4b" stroke-width="3"/><text x="130" y="283" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">S</text><ellipse cx="245" cy="275" rx="33" ry="24" fill="#e2efec" stroke="#1c2d4b" stroke-width="3"/><text x="245" y="283" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">S</text><ellipse cx="360" cy="275" rx="33" ry="24" fill="#e2efec" stroke="#1c2d4b" stroke-width="3"/><text x="360" y="283" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">S</text><ellipse cx="475" cy="275" rx="33" ry="24" fill="#d5b32d" stroke="#1c2d4b" stroke-width="3"/><text x="475" y="283" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">R</text><ellipse cx="590" cy="275" rx="33" ry="24" fill="#e2efec" stroke="#1c2d4b" stroke-width="3"/><text x="590" y="283" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">S</text><ellipse cx="130" cy="380" rx="33" ry="24" fill="#e2efec" stroke="#1c2d4b" stroke-width="3"/><text x="130" y="388" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">S</text><ellipse cx="245" cy="380" rx="33" ry="24" fill="#e2efec" stroke="#1c2d4b" stroke-width="3"/><text x="245" y="388" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">S</text><ellipse cx="360" cy="380" rx="33" ry="24" fill="#e2efec" stroke="#1c2d4b" stroke-width="3"/><text x="360" y="388" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">S</text><ellipse cx="475" cy="380" rx="33" ry="24" fill="#e2efec" stroke="#1c2d4b" stroke-width="3"/><text x="475" y="388" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">S</text><ellipse cx="590" cy="380" rx="33" ry="24" fill="#e2efec" stroke="#1c2d4b" stroke-width="3"/><text x="590" y="388" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">S</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">A few bacteria already carry a heritable resistance trait.</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Susceptible bacteria are labelled S; resistant bacteria are</text><text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">labelled R.</text></g><g transform="translate(784,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">2  The antibiotic acts as a selection pressure</text><ellipse cx="130" cy="170" rx="33" ry="24" fill="#e2efec" stroke="#1c2d4b" stroke-width="3"/><text x="130" y="178" font-size="23" font-weight="700" text-anchor="middle" fill="#b75e53">×</text><ellipse cx="245" cy="170" rx="33" ry="24" fill="#e2efec" stroke="#1c2d4b" stroke-width="3"/><text x="245" y="178" font-size="23" font-weight="700" text-anchor="middle" fill="#b75e53">×</text><ellipse cx="360" cy="170" rx="33" ry="24" fill="#d5b32d" stroke="#1c2d4b" stroke-width="3"/><text x="360" y="178" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">R</text><ellipse cx="475" cy="170" rx="33" ry="24" fill="#e2efec" stroke="#1c2d4b" stroke-width="3"/><text x="475" y="178" font-size="23" font-weight="700" text-anchor="middle" fill="#b75e53">×</text><ellipse cx="590" cy="170" rx="33" ry="24" fill="#e2efec" stroke="#1c2d4b" stroke-width="3"/><text x="590" y="178" font-size="23" font-weight="700" text-anchor="middle" fill="#b75e53">×</text><ellipse cx="130" cy="275" rx="33" ry="24" fill="#e2efec" stroke="#1c2d4b" stroke-width="3"/><text x="130" y="283" font-size="23" font-weight="700" text-anchor="middle" fill="#b75e53">×</text><ellipse cx="245" cy="275" rx="33" ry="24" fill="#e2efec" stroke="#1c2d4b" stroke-width="3"/><text x="245" y="283" font-size="23" font-weight="700" text-anchor="middle" fill="#b75e53">×</text><ellipse cx="360" cy="275" rx="33" ry="24" fill="#e2efec" stroke="#1c2d4b" stroke-width="3"/><text x="360" y="283" font-size="23" font-weight="700" text-anchor="middle" fill="#b75e53">×</text><ellipse cx="475" cy="275" rx="33" ry="24" fill="#d5b32d" stroke="#1c2d4b" stroke-width="3"/><text x="475" y="283" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">R</text><ellipse cx="590" cy="275" rx="33" ry="24" fill="#e2efec" stroke="#1c2d4b" stroke-width="3"/><text x="590" y="283" font-size="23" font-weight="700" text-anchor="middle" fill="#b75e53">×</text><ellipse cx="130" cy="380" rx="33" ry="24" fill="#e2efec" stroke="#1c2d4b" stroke-width="3"/><text x="130" y="388" font-size="23" font-weight="700" text-anchor="middle" fill="#b75e53">×</text><ellipse cx="245" cy="380" rx="33" ry="24" fill="#e2efec" stroke="#1c2d4b" stroke-width="3"/><text x="245" y="388" font-size="23" font-weight="700" text-anchor="middle" fill="#b75e53">×</text><ellipse cx="360" cy="380" rx="33" ry="24" fill="#e2efec" stroke="#1c2d4b" stroke-width="3"/><text x="360" y="388" font-size="23" font-weight="700" text-anchor="middle" fill="#b75e53">×</text><ellipse cx="475" cy="380" rx="33" ry="24" fill="#e2efec" stroke="#1c2d4b" stroke-width="3"/><text x="475" y="388" font-size="23" font-weight="700" text-anchor="middle" fill="#b75e53">×</text><ellipse cx="590" cy="380" rx="33" ry="24" fill="#e2efec" stroke="#1c2d4b" stroke-width="3"/><text x="590" y="388" font-size="23" font-weight="700" text-anchor="middle" fill="#b75e53">×</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Susceptible bacteria are killed or inhibited. Resistant bacteria</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">are more likely to survive. The antibiotic does not create the</text><text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">resistance because bacteria need it.</text></g><g transform="translate(24,816)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">3  Survivors reproduce</text><ellipse cx="130" cy="170" rx="33" ry="24" fill="#d5b32d" stroke="#1c2d4b" stroke-width="3"/><text x="130" y="178" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">R</text><ellipse cx="245" cy="170" rx="33" ry="24" fill="#d5b32d" stroke="#1c2d4b" stroke-width="3"/><text x="245" y="178" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">R</text><ellipse cx="360" cy="170" rx="33" ry="24" fill="#d5b32d" stroke="#1c2d4b" stroke-width="3"/><text x="360" y="178" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">R</text><ellipse cx="475" cy="170" rx="33" ry="24" fill="#d5b32d" stroke="#1c2d4b" stroke-width="3"/><text x="475" y="178" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">R</text><ellipse cx="590" cy="170" rx="33" ry="24" fill="#d5b32d" stroke="#1c2d4b" stroke-width="3"/><text x="590" y="178" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">R</text><ellipse cx="130" cy="275" rx="33" ry="24" fill="#d5b32d" stroke="#1c2d4b" stroke-width="3"/><text x="130" y="283" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">R</text><ellipse cx="245" cy="275" rx="33" ry="24" fill="#d5b32d" stroke="#1c2d4b" stroke-width="3"/><text x="245" y="283" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">R</text><ellipse cx="360" cy="275" rx="33" ry="24" fill="#d5b32d" stroke="#1c2d4b" stroke-width="3"/><text x="360" y="283" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">R</text><ellipse cx="475" cy="275" rx="33" ry="24" fill="#d5b32d" stroke="#1c2d4b" stroke-width="3"/><text x="475" y="283" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">R</text><ellipse cx="590" cy="275" rx="33" ry="24" fill="#d5b32d" stroke="#1c2d4b" stroke-width="3"/><text x="590" y="283" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">R</text><ellipse cx="130" cy="380" rx="33" ry="24" fill="#d5b32d" stroke="#1c2d4b" stroke-width="3"/><text x="130" y="388" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">R</text><ellipse cx="245" cy="380" rx="33" ry="24" fill="#d5b32d" stroke="#1c2d4b" stroke-width="3"/><text x="245" y="388" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">R</text><ellipse cx="360" cy="380" rx="33" ry="24" fill="#d5b32d" stroke="#1c2d4b" stroke-width="3"/><text x="360" y="388" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">R</text><ellipse cx="475" cy="380" rx="33" ry="24" fill="#d5b32d" stroke="#1c2d4b" stroke-width="3"/><text x="475" y="388" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">R</text><ellipse cx="590" cy="380" rx="33" ry="24" fill="#d5b32d" stroke="#1c2d4b" stroke-width="3"/><text x="590" y="388" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">R</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Survivors pass on resistance when they reproduce. Over</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">generations, resistance becomes more common in the</text><text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">population.</text></g><text x="24" y="1493" font-size="19" font-weight="400" text-anchor="start" fill="#1c2d4b">MARLBRIDGE  •  Schematic; structures and particles are not to scale.</text></g></svg>
