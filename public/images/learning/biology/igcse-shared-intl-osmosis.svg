<svg xmlns="http://www.w3.org/2000/svg" width="900" height="960" viewBox="0 0 1800 1920" role="img" aria-labelledby="title desc"><title id="title">Osmosis</title><desc id="desc">A partially permeable membrane separates a dilute solution, with many water molecules and few solute particles, from a concentrated solution, with many solute particles that are too big to pass. Arrows show water moving by osmosis from the dilute to the concentrated solution. A box labels the sides higher and lower water potential, greyed with a note that water potential is not required by Edexcel or OxfordAQA. No tier labels: osmosis is on both Edexcel papers (4BI1 2.15) and in OxfordAQA 9201 3.1.5d, which is not tiered.</desc><rect width="1800" height="1920" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="88" font-size="68" font-weight="700" fill="#1E2B47" text-anchor="middle">Osmosis</text>
