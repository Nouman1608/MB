<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="871" viewBox="0 0 1528 871" role="img" aria-labelledby="title desc"><title id="title">Mitosis and meiosis: compare the outcomes</title><desc id="desc">In a diploid example with two chromosomes, mitosis yields two diploid cells and meiosis yields four haploid cells. The model compares chromosome sets and outcomes, not replication or detailed division stages.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#1c2d4b"/></marker><marker id="red" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#b75e53"/></marker><marker id="blue" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#357ea2"/></marker></defs><rect width="100%" height="100%" fill="#f5f8f7"/><g font-family="Arial, sans-serif"><text x="24" y="58" font-size="38" font-weight="700" text-anchor="start" fill="#1c2d4b">Mitosis and meiosis: compare the outcomes</text><text x="24" y="104" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Chromosome-set model • replication and individual division stages are omitted</text><g transform="translate(24,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Mitosis: chromosome number maintained</text><path d="M330,180 L235,290" fill="none" stroke="#1c2d4b" stroke-width="4" marker-end="url(#arr)"/><path d="M390,180 L485,290" fill="none" stroke="#1c2d4b" stroke-width="4" marker-end="url(#arr)"/><circle cx="360" cy="135" r="45" fill="white" stroke="#1c2d4b" stroke-width="3"/><path d="M346,115 v40" fill="none" stroke="#357ea2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M374,115 v40" fill="none" stroke="#b75e53" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="220" cy="345" r="45" fill="white" stroke="#1c2d4b" stroke-width="3"/><path d="M206,325 v40" fill="none" stroke="#357ea2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M234,325 v40" fill="none" stroke="#b75e53" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="500" cy="345" r="45" fill="white" stroke="#1c2d4b" stroke-width="3"/><path d="M486,325 v40" fill="none" stroke="#357ea2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M514,325 v40" fill="none" stroke="#b75e53" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">One division produces two genetically identical cells, apart from</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">mutation. In this diploid example, 2n = 2 before and after</text><text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">mitosis.</text></g><g transform="translate(784,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Meiosis: chromosome number halved</text><path d="M330,160 L210,225" fill="none" stroke="#1c2d4b" stroke-width="4" marker-end="url(#arr)"/><path d="M390,160 L510,225" fill="none" stroke="#1c2d4b" stroke-width="4" marker-end="url(#arr)"/><path d="M185,305 L115,355" fill="none" stroke="#1c2d4b" stroke-width="4" marker-end="url(#arr)"/><path d="M215,305 L265,355" fill="none" stroke="#1c2d4b" stroke-width="4" marker-end="url(#arr)"/><path d="M505,305 L455,355" fill="none" stroke="#1c2d4b" stroke-width="4" marker-end="url(#arr)"/><path d="M535,305 L605,355" fill="none" stroke="#1c2d4b" stroke-width="4" marker-end="url(#arr)"/><circle cx="360" cy="125" r="45" fill="white" stroke="#1c2d4b" stroke-width="3"/><path d="M346,105 v40" fill="none" stroke="#357ea2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M374,105 v40" fill="none" stroke="#b75e53" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="200" cy="270" r="45" fill="white" stroke="#1c2d4b" stroke-width="3"/><path d="M200,250 v40" fill="none" stroke="#357ea2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="520" cy="270" r="45" fill="white" stroke="#1c2d4b" stroke-width="3"/><path d="M520,250 v40" fill="none" stroke="#b75e53" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="100" cy="400" r="45" fill="white" stroke="#1c2d4b" stroke-width="3"/><path d="M100,380 v40" fill="none" stroke="#357ea2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="280" cy="400" r="45" fill="white" stroke="#1c2d4b" stroke-width="3"/><path d="M280,380 v40" fill="none" stroke="#357ea2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="440" cy="400" r="45" fill="white" stroke="#1c2d4b" stroke-width="3"/><path d="M440,380 v40" fill="none" stroke="#b75e53" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="620" cy="400" r="45" fill="white" stroke="#1c2d4b" stroke-width="3"/><path d="M620,380 v40" fill="none" stroke="#b75e53" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Two divisions produce four haploid cells from a diploid cell.</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Here 2n = 2 becomes n = 1. Meiosis also generates genetic</text><text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">variation.</text></g><text x="24" y="849" font-size="19" font-weight="400" text-anchor="start" fill="#1c2d4b">MARLBRIDGE  •  Schematic; structures and particles are not to scale.</text></g></svg>
