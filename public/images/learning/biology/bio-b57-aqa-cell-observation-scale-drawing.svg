<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Worked model drawings from microscope observations</title>
  <desc id="desc">Worked, simplified plant and animal cell drawings. A cheek cell is paired with the retained 15 micrometre scale bar from the source micrograph. The Elodea cell is identified as a schematic because its source photograph has no calibrated scale bar.</desc>
  <defs>
    <style>
      .ink{fill:#18324b}.muted{fill:#536779}.line{stroke:#18324b;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}.fine{stroke:#536779;stroke-width:2;fill:none}.label{font:24px Arial,sans-serif;fill:#18324b}.small{font:20px Arial,sans-serif;fill:#536779}.head{font:700 34px Arial,sans-serif;fill:#18324b}.sub{font:22px Arial,sans-serif;fill:#536779}.cell{fill:#f4f8fb;stroke:#247b8a;stroke-width:5}.org{fill:#badfe2;stroke:#247b8a;stroke-width:4}.plant{fill:#f2f8ed;stroke:#247b8a;stroke-width:5}.chlor{fill:#75b87a;stroke:#326c43;stroke-width:2}.card{fill:#fff;stroke:#d5e1e8;stroke-width:2}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f5f8fa"/>
  <text x="72" y="74" class="head">From microscope view to a clear biological drawing</text>
  <text x="72" y="112" class="sub">Worked models for Required practical 1 · draw only what you can observe, then add labels and a scale</text>
  <rect x="70" y="150" width="700" height="650" rx="22" class="card"/>
  <rect x="830" y="150" width="700" height="650" rx="22" class="card"/>
  <image href="data:image/svg+xml;base64," x="565" y="392" width="470" height="115" opacity="0.055" preserveAspectRatio="xMidYMid meet" aria-hidden="true"/>
  <text x="110" y="205" class="head">Animal cell · cheek epithelial cell</text>
  <text x="110" y="240" class="small">Simplified model based on the authentic cheek-cell micrograph above.</text>
  <path class="cell" d="M198 421 C216 335 305 294 414 308 C529 323 624 383 618 466 C612 548 516 599 404 589 C293 579 180 511 198 421 Z"/>
  <ellipse cx="408" cy="445" rx="48" ry="61" class="org"/>
  <path class="fine" d="M257 329 L203 286 L145 286"/><text x="112" y="278" class="label">Cell membrane</text>
  <path class="fine" d="M357 501 L318 552 L191 552"/><text x="112" y="584" class="label">Cytoplasm</text>
  <path class="fine" d="M450 428 L523 350 L651 350"/><text x="548" y="342" class="label">Nucleus</text>
  <text x="110" y="650" class="small">Model drawing: one large, clear outline; no shading or sketch marks.</text>
  <line x1="288" y1="709" x2="438" y2="709" stroke="#18324b" stroke-width="8"/>
  <line x1="288" y1="697" x2="288" y2="721" stroke="#18324b" stroke-width="4"/><line x1="438" y1="697" x2="438" y2="721" stroke="#18324b" stroke-width="4"/>
  <text x="455" y="718" class="small">15 μm · source micrograph</text>
  <text x="110" y="760" class="small">This is a reference scale bar, not a claim that the drawing is to physical size.</text>
  <text x="870" y="205" class="head">Plant cell · Elodea leaf cell</text>
  <text x="870" y="240" class="small">Schematic of observed features; source photo is labelled 400×.</text>
  <text x="870" y="267" class="small">It has no calibrated scale bar.</text>
  <rect x="1000" y="300" width="420" height="280" rx="12" class="plant"/>
  <rect x="1018" y="318" width="384" height="244" rx="9" fill="none" stroke="#78a96c" stroke-width="3"/>
  <rect x="1110" y="368" width="222" height="144" rx="28" fill="#e4f0d8" stroke="#9bb98c" stroke-width="2"/>
  <ellipse cx="1073" cy="348" rx="17" ry="9" class="chlor"/><ellipse cx="1360" cy="351" rx="17" ry="9" class="chlor"/>
  <ellipse cx="1074" cy="534" rx="17" ry="9" class="chlor"/><ellipse cx="1360" cy="532" rx="17" ry="9" class="chlor"/>
  <ellipse cx="1090" cy="446" rx="17" ry="9" class="chlor"/><ellipse cx="1350" cy="445" rx="17" ry="9" class="chlor"/>
  <text x="870" y="620" class="small">Features: cell wall · cell membrane · chloroplasts · vacuole</text>
  <text x="870" y="620" class="small">Features: cell wall · cell membrane · chloroplasts · vacuole</text>
  <text x="870" y="674" class="small">Do not infer a real-size scale from magnification alone.</text>
  <text x="870" y="710" class="small">Calibrate with a stage micrometer or a micrograph scale bar.</text>
  <rect x="70" y="820" width="1460" height="2" fill="#d5e1e8"/>
  <text x="72" y="858" class="small">Marlbridge Study Resources · Biological drawings use clean single lines, straight label rules and a justified scale.</text>
  <image href="data:image/svg+xml;base64," x="1365" y="831" width="160" height="39" preserveAspectRatio="xMaxYMid meet" aria-hidden="true"/></svg>
