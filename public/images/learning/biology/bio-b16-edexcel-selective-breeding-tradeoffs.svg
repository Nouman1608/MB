<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="871" viewBox="0 0 1528 871" role="img" aria-labelledby="title desc"><title id="title">Improve food production while evaluating trade-offs</title><desc id="desc">An iterative selective-breeding pathway is compared with environmental control, genetic modification and ecological management.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#1c2d4b"/></marker><marker id="red" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#b75e53"/></marker><marker id="blue" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#357ea2"/></marker></defs><rect width="100%" height="100%" fill="#f5f8f7"/><g font-family="Arial, sans-serif"><text x="24" y="58" font-size="38" font-weight="700" text-anchor="start" fill="#1c2d4b">Improve food production while evaluating trade-offs</text><text x="24" y="104" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Breeding, environmental control and biotechnology act through different mechanisms.</text><g transform="translate(24,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Selective breeding over generations</text><rect x="35" y="90" width="650" height="112" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="53" y="119" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">1 Choose parents with useful heritable traits</text><text x="53" y="150" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">For example, suitable yield, quality or disease-resistance</text><text x="53" y="177" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">phenotypes.</text><path d="M360,205 L360,217" fill="none" stroke="#357ea2" stroke-width="2" marker-end="url(#blue)"/><rect x="35" y="220" width="650" height="112" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="53" y="249" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">2 Cross and assess offspring</text><text x="53" y="280" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">Select descendants that combine the desired traits under the</text><text x="53" y="307" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">target conditions.</text><path d="M360,335 L360,347" fill="none" stroke="#357ea2" stroke-width="2" marker-end="url(#blue)"/><rect x="35" y="350" width="650" height="112" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="53" y="379" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">3 Repeat while managing diversity</text><text x="53" y="410" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">Track performance and avoid excessive inbreeding or loss of</text><text x="53" y="437" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">useful variation.</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Selection acts on existing heritable variation; it does not</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">deliberately create the mutation a breeder needs.</text></g><g transform="translate(784,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Compare production strategies</text><rect x="35" y="100" width="310" height="175" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="51" y="131" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">Controlled conditions</text><text x="51" y="189" font-size="20" font-weight="400" text-anchor="start" fill="#1c2d4b">Water, nutrients, temperature</text><text x="51" y="215" font-size="20" font-weight="400" text-anchor="start" fill="#1c2d4b">and pests can limit</text><text x="51" y="241" font-size="20" font-weight="400" text-anchor="start" fill="#1c2d4b">productivity; inputs have costs.</text><rect x="375" y="100" width="310" height="175" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="391" y="131" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">Genetic modification</text><text x="391" y="189" font-size="20" font-weight="400" text-anchor="start" fill="#1c2d4b">Introduces or alters genetic</text><text x="391" y="215" font-size="20" font-weight="400" text-anchor="start" fill="#1c2d4b">material more directly than</text><text x="391" y="241" font-size="20" font-weight="400" text-anchor="start" fill="#1c2d4b">traditional crossing.</text><rect x="35" y="280" width="310" height="175" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="51" y="311" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">Biological control</text><text x="51" y="369" font-size="20" font-weight="400" text-anchor="start" fill="#1c2d4b">Natural enemies can reduce</text><text x="51" y="395" font-size="20" font-weight="400" text-anchor="start" fill="#1c2d4b">pests, but ecological</text><text x="51" y="421" font-size="20" font-weight="400" text-anchor="start" fill="#1c2d4b">consequences need</text><text x="51" y="447" font-size="20" font-weight="400" text-anchor="start" fill="#1c2d4b">evaluation.</text><rect x="375" y="280" width="310" height="175" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="391" y="311" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">Sustainable management</text><text x="391" y="369" font-size="20" font-weight="400" text-anchor="start" fill="#1c2d4b">Assess yield alongside soil,</text><text x="391" y="395" font-size="20" font-weight="400" text-anchor="start" fill="#1c2d4b">water, biodiversity and</text><text x="391" y="421" font-size="20" font-weight="400" text-anchor="start" fill="#1c2d4b">long-term resilience.</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">A benefit in one setting does not guarantee success</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">everywhere; evaluate evidence and constraints for the actual</text><text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">crop or livestock system.</text></g><text x="24" y="849" font-size="19" font-weight="400" text-anchor="start" fill="#1c2d4b">MARLBRIDGE  •  Schematic; structures and particles are not to scale.</text></g></svg>
