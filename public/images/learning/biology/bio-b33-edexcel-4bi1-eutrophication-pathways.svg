<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="871" viewBox="0 0 1528 871" role="img" aria-labelledby="title desc">
  <title id="title">Eutrophication: link the six steps</title>
  <desc id="desc">Nutrient enrichment increases producer growth. Dead material supports decomposition, increasing aerobic respiration by decomposers. Dissolved oxygen falls and oxygen-dependent organisms may die.</desc>
  <defs>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1c2d4b" />
    </marker>
    <marker id="red" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b75e53" />
    </marker>
    <marker id="blue" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#357ea2" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f8f7" />
  <g font-family="Arial, sans-serif">
    <text x="24" y="58" font-size="38" font-weight="700" text-anchor="start" fill="#1c2d4b">Eutrophication: link the six steps</text>
    <text x="24" y="104" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Edexcel International GCSE Biology 4BI1 • two distinct oxygen-demand pathways</text>
    <g transform="translate(24,172)">
      <rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2" />
      <text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">1–3  More nutrients; more dead material</text>
      <rect x="55" y="95" width="610" height="95" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2" />
      <text x="360.0" y="127" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">1 Nutrient enrichment</text>
      <text x="360.0" y="160" font-size="20" font-weight="400" text-anchor="middle" fill="#1c2d4b">Nitrate and other ions enter the water</text>
      <path d="M360,195 L360,208" fill="none" stroke="#1c2d4b" stroke-width="3" marker-end="url(#arr)" />
      <rect x="55" y="215" width="610" height="95" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2" />
      <text x="360.0" y="247" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">2 Producer growth increases</text>
      <text x="360.0" y="280" font-size="20" font-weight="400" text-anchor="middle" fill="#1c2d4b">An algal bloom may develop</text>
      <path d="M360,315 L360,328" fill="none" stroke="#1c2d4b" stroke-width="3" marker-end="url(#arr)" />
      <rect x="55" y="335" width="610" height="95" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2" />
      <text x="360.0" y="367" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">3 More organic material dies</text>
      <text x="360.0" y="400" font-size="20" font-weight="400" text-anchor="middle" fill="#1c2d4b">Dead material becomes food for decomposers</text>
      <text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Nutrient enrichment can promote a bloom; after organic matter dies,</text>
      <text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">decomposer respiration consumes dissolved oxygen.</text>
    </g>
    <g transform="translate(784,172)">
      <rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2" />
      <text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">4–6  Respiration lowers dissolved oxygen</text>
      <rect x="55" y="95" width="610" height="95" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2" />
      <text x="360.0" y="127" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">4 Decomposer respiration increases</text>
      <text x="360.0" y="160" font-size="20" font-weight="400" text-anchor="middle" fill="#1c2d4b">Aerobic respiration uses dissolved oxygen</text>
      <path d="M360,195 L360,208" fill="none" stroke="#1c2d4b" stroke-width="3" marker-end="url(#arr)" />
      <rect x="55" y="215" width="610" height="95" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2" />
      <text x="360.0" y="247" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">5 Dissolved oxygen falls</text>
      <text x="360.0" y="280" font-size="20" font-weight="400" text-anchor="middle" fill="#1c2d4b">Less oxygen is available to aquatic organisms</text>
      <path d="M360,315 L360,328" fill="none" stroke="#1c2d4b" stroke-width="3" marker-end="url(#arr)" />
      <rect x="55" y="335" width="610" height="95" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2" />
      <text x="360.0" y="367" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">6 Oxygen-dependent organisms die</text>
      <text x="360.0" y="400" font-size="20" font-weight="400" text-anchor="middle" fill="#1c2d4b">Fish and other aerobic organisms may suffocate</text>
      <text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Sewage also adds organic matter; decomposition can use oxygen</text>
      <text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">directly without an algal bloom. Algae also respire day and night.</text>
      <text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Oxygen balance varies with light and water mixing.</text>
    </g>
    <text x="24" y="849" font-size="19" font-weight="400" text-anchor="start" fill="#1c2d4b">MARLBRIDGE  •  Schematic; structures and particles are not to scale.</text>
  </g>
</svg>