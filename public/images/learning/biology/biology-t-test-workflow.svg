<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">Two-sample t-test workflow for Cambridge 9700</title><desc id="desc">Two-sample t-test workflow for Cambridge 9700. The figure checks test suitability, displays the course formula, and works through the exact plant-cutting height example in the source guide, including t=4.44, df=14, p=0.05 critical value 2.14 and conclusion. A companion panel gives a bounded decision workflow. Statistical significance does not by itself identify causation.</desc><rect width="100%" height="100%" fill="#f5f8f7"/><text x="26" y="46" font-family="Arial,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#1c2d4b">Two-sample t-test workflow for Cambridge 9700</text><text x="26" y="80" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#1c2d4b">A worked Cambridge 9700 example with exact lesson data.</text><g transform="translate(30,120)"><rect x="0" y="0" width="740" height="410" rx="12" fill="white" stroke="#cbd7d5" stroke-width="2"/><text x="20" y="34" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#1c2d4b">Cambridge 9700 t-test workflow</text><text x="20" y="60" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#71818d">Use the formula supplied; compare with the correct critical value for degrees of freedom</text><text x="36" y="103" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#357ea2">Check suitability: continuous data • approximately normal samples • similar SDs</text><rect x="36" y="128" width="668" height="56" rx="9" fill="#e3efec" stroke="#73aaa4" stroke-width="1.4"/><text x="370" y="164" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1c2d4b">t = (x̄₁ − x̄₂) / √(s₁²/n₁ + s₂²/n₂)</text><text x="38" y="217" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#1c2d4b">Plant-cutting example from the lesson</text><text x="48" y="248" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#1c2d4b">High light: mean 35.5 cm, s = 2.878, n = 8</text><text x="48" y="275" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#1c2d4b">Low light:  mean 30.0 cm, s = 2.000, n = 8</text><text x="48" y="312" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#1c2d4b">t = 4.44     df = 8 + 8 − 2 = 14     critical value (p = 0.05) = 2.14</text><rect x="36" y="335" width="668" height="46" rx="8" fill="#fff5ec" stroke="#b55c52" stroke-width="1.4"/><text x="370" y="365" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#b55c52">4.44 &gt; 2.14 → reject H₀: the difference is significant</text><text x="36" y="399" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#1c2d4b">Significance alone does not prove a cause.</text></g><g transform="translate(820,120)"><rect x="0" y="0" width="740" height="410" rx="12" fill="white" stroke="#cbd7d5" stroke-width="2"/><text x="20" y="34" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#1c2d4b">State a conclusion with its limits</text><text x="20" y="60" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#71818d">Statistical significance is evidence against H₀ under the test assumptions</text><rect x="36" y="95" width="668" height="44" rx="8" fill="white" stroke="#cbd7d5" stroke-width="1.2"/><text x="50" y="114" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1c2d4b">1  State H₀</text><text x="170" y="114" font-family="Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#1c2d4b">No significant difference between the population means.</text><rect x="36" y="151" width="668" height="44" rx="8" fill="white" stroke="#cbd7d5" stroke-width="1.2"/><text x="50" y="170" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1c2d4b">2  Calculate t</text><text x="170" y="170" font-family="Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#1c2d4b">Use the given formula and sample statistics; retain units consistently.</text><rect x="36" y="207" width="668" height="44" rx="8" fill="white" stroke="#cbd7d5" stroke-width="1.2"/><text x="50" y="226" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1c2d4b">3  Find df</text><text x="170" y="226" font-family="Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#1c2d4b">For the guide’s two-sample method: n₁ + n₂ − 2.</text><rect x="36" y="263" width="668" height="44" rx="8" fill="white" stroke="#cbd7d5" stroke-width="1.2"/><text x="50" y="282" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1c2d4b">4  Compare</text><text x="170" y="282" font-family="Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#1c2d4b">Compare calculated |t| with the table value at the stated p and df.</text><rect x="36" y="319" width="668" height="44" rx="8" fill="white" stroke="#cbd7d5" stroke-width="1.2"/><text x="50" y="338" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1c2d4b">5  Conclude</text><text x="170" y="338" font-family="Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#1c2d4b">If |t| exceeds the critical value, reject H₀; otherwise do not reject H₀.</text><text x="38" y="390" font-family="Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#b55c52">Independent-sample formula; do not apply blindly to paired data.</text></g><text x="26" y="1030" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#1c2d4b">MARLBRIDGE • Schematic; not to scale.</text></svg>