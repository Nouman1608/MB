<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="1515" viewBox="0 0 1528 1515" role="img" aria-labelledby="title desc"><title id="title">Meiosis I and II: what attaches and what separates</title><desc id="desc">Four original panels compare metaphase I, anaphase I, metaphase II and anaphase II in a model starting with two homologous pairs. In meiosis I the long and short homologues pair; sisters co-orient toward one pole and homologues face opposite poles. Anaphase I retains four duplicated chromosomes in the single cell, two toward each pole. Meiosis II follows one haploid daughter containing one maternal long and one paternal short chromosome: its two duplicated chromosomes align singly with opposite-pole sister attachments. Anaphase II shows four single-chromatid daughter chromosomes briefly in that cell, two moving centromere-first toward each pole. No S phase intervenes; each final product has two chromosomes. The second meiosis-I daughter also divides, giving four products overall. Crossing-over and the molecular linkage between homologues are omitted for this counting model, not asserted absent from natural meiosis. Pole markers do not depict universal centrosome anatomy.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#1c2d4b"/></marker><marker id="red" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#b75e53"/></marker><marker id="blue" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#357ea2"/></marker></defs><rect width="100%" height="100%" fill="#f5f8f7"/><g font-family="Arial, sans-serif"><text x="24" y="58" font-size="38" font-weight="700" text-anchor="start" fill="#1c2d4b">Meiosis I and II: what attaches and what separates</text><text x="24" y="104" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">A 2n = 4 model: red = maternal, blue = paternal. Long and short identify the two different homologous pairs.</text><g transform="translate(24,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">1  Metaphase I: homologous pairs</text><text x="35" y="88" font-size="22" font-weight="700" text-anchor="start" fill="#1c2d4b">4 duplicated chromosomes; 8 chromatids</text><ellipse cx="360" cy="285" rx="280" ry="145" fill="#f8faf9" stroke="#1c2d4b" stroke-width="3"/><circle cx="145" cy="285" r="7" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><circle cx="575" cy="285" r="7" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><path d="M360,145 V425" fill="none" stroke="#cad7d5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/><path d="M145,285 L318,220 M145,285 L318,230" fill="none" stroke="#73aaa5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g id="mi-meta-0-left" data-stage="metaphase-I" data-kind="duplicated" data-homologue="long" data-parent="maternal" data-pole=""><path d="M307,191 L343,259 M343,191 L307,259" fill="none" stroke="#b75e53" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="325" cy="225" r="5" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/></g><circle cx="318" cy="220" r="3" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="318" cy="230" r="3" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><path d="M575,285 L402,220 M575,285 L402,230" fill="none" stroke="#73aaa5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g id="mi-meta-0-right" data-stage="metaphase-I" data-kind="duplicated" data-homologue="long" data-parent="paternal" data-pole=""><path d="M377,191 L413,259 M413,191 L377,259" fill="none" stroke="#357ea2" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="395" cy="225" r="5" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/></g><circle cx="402" cy="220" r="3" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="402" cy="230" r="3" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><path d="M145,285 L318,340 M145,285 L318,350" fill="none" stroke="#73aaa5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g id="mi-meta-1-left" data-stage="metaphase-I" data-kind="duplicated" data-homologue="short" data-parent="paternal" data-pole=""><path d="M307,322 L343,368 M343,322 L307,368" fill="none" stroke="#357ea2" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="325" cy="345" r="5" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/></g><circle cx="318" cy="340" r="3" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="318" cy="350" r="3" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><path d="M575,285 L402,340 M575,285 L402,350" fill="none" stroke="#73aaa5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g id="mi-meta-1-right" data-stage="metaphase-I" data-kind="duplicated" data-homologue="short" data-parent="maternal" data-pole=""><path d="M377,322 L413,368 M413,322 L377,368" fill="none" stroke="#b75e53" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="395" cy="345" r="5" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/></g><circle cx="402" cy="340" r="3" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="402" cy="350" r="3" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><path d="M360,136 L360,225" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="360" y="126" font-size="21" font-weight="400" text-anchor="middle" fill="#1c2d4b">A homologous pair</text><text x="360" y="475" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">Sisters attach toward the SAME pole</text><text x="35" y="515" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Small dots mark kinetochores; larger centres locate chromosomes.</text><text x="35" y="544" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Sisters of one chromosome co-orient; homologues face opposite</text><text x="35" y="573" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">poles. Pair linkage and crossing-over detail are omitted.</text></g><g transform="translate(784,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">2  Anaphase I: separate homologues</text><text x="35" y="88" font-size="22" font-weight="700" text-anchor="start" fill="#1c2d4b">4 chromosomes in this cell; 2 toward each pole</text><ellipse cx="360" cy="285" rx="280" ry="145" fill="#f8faf9" stroke="#1c2d4b" stroke-width="3"/><circle cx="145" cy="285" r="7" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><circle cx="575" cy="285" r="7" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><path d="M145,285 L235,225" fill="none" stroke="#73aaa5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g id="mi-ana-0-left" data-stage="anaphase-I" data-kind="duplicated" data-homologue="long" data-parent="maternal" data-pole="left"><path d="M217,191 L253,259 M253,191 L217,259" fill="none" stroke="#b75e53" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="235" cy="225" r="5" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/></g><path d="M575,285 L485,225" fill="none" stroke="#73aaa5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g id="mi-ana-0-right" data-stage="anaphase-I" data-kind="duplicated" data-homologue="long" data-parent="paternal" data-pole="right"><path d="M467,191 L503,259 M503,191 L467,259" fill="none" stroke="#357ea2" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="485" cy="225" r="5" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/></g><path d="M145,285 L235,345" fill="none" stroke="#73aaa5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g id="mi-ana-1-left" data-stage="anaphase-I" data-kind="duplicated" data-homologue="short" data-parent="paternal" data-pole="left"><path d="M217,322 L253,368 M253,322 L217,368" fill="none" stroke="#357ea2" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="235" cy="345" r="5" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/></g><path d="M575,285 L485,345" fill="none" stroke="#73aaa5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g id="mi-ana-1-right" data-stage="anaphase-I" data-kind="duplicated" data-homologue="short" data-parent="maternal" data-pole="right"><path d="M467,322 L503,368 M503,322 L467,368" fill="none" stroke="#b75e53" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="485" cy="345" r="5" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/></g><path d="M335,285 L290,285" fill="none" stroke="#1c2d4b" stroke-width="3" marker-end="url(#arr)"/><path d="M385,285 L430,285" fill="none" stroke="#1c2d4b" stroke-width="3" marker-end="url(#arr)"/><text x="360" y="475" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">Homologues separate; sisters stay joined</text><text x="35" y="515" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Each pole receives one long and one short duplicated</text><text x="35" y="544" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">chromosome. After division, each daughter is haploid (n = 2), with 2</text><text x="35" y="573" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">chromosomes and 4 chromatids.</text></g><g transform="translate(24,816)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">3  Metaphase II: single chromosomes</text><text x="35" y="88" font-size="21" font-weight="700" text-anchor="start" fill="#1c2d4b">ONE haploid daughter: 2 chromosomes; 4 chromatids</text><text x="35" y="119" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">No second S phase occurs before meiosis II.</text><ellipse cx="360" cy="285" rx="280" ry="145" fill="#f8faf9" stroke="#1c2d4b" stroke-width="3"/><circle cx="145" cy="285" r="7" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><circle cx="575" cy="285" r="7" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><path d="M360,145 V425" fill="none" stroke="#cad7d5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/><path d="M145,285 L351,225 M575,285 L369,225" fill="none" stroke="#73aaa5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g id="mii-meta-0" data-stage="metaphase-II" data-kind="duplicated" data-homologue="long" data-parent="maternal" data-pole=""><path d="M342,191 L378,259 M378,191 L342,259" fill="none" stroke="#b75e53" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="360" cy="225" r="5" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/></g><circle cx="351" cy="225" r="3" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="369" cy="225" r="3" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><path d="M145,285 L351,345 M575,285 L369,345" fill="none" stroke="#73aaa5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g id="mii-meta-1" data-stage="metaphase-II" data-kind="duplicated" data-homologue="short" data-parent="paternal" data-pole=""><path d="M342,322 L378,368 M378,322 L342,368" fill="none" stroke="#357ea2" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="360" cy="345" r="5" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/></g><circle cx="351" cy="345" r="3" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><circle cx="369" cy="345" r="3" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/><text x="360" y="475" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">Sisters attach toward OPPOSITE poles</text><text x="35" y="515" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Duplicated chromosomes line up singly, not as homologous pairs.</text><text x="35" y="544" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">This panel follows one of the two cells produced by meiosis I; the</text><text x="35" y="573" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">other also divides.</text></g><g transform="translate(784,816)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">4  Anaphase II: separate sisters</text><text x="35" y="88" font-size="22" font-weight="700" text-anchor="start" fill="#1c2d4b">4 daughter chromosomes briefly in this ONE cell</text><text x="35" y="119" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">2 move toward each pole; no DNA was recopied.</text><ellipse cx="360" cy="285" rx="280" ry="145" fill="#f8faf9" stroke="#1c2d4b" stroke-width="3"/><circle cx="145" cy="285" r="7" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><circle cx="575" cy="285" r="7" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><path d="M145,285 L240,225" fill="none" stroke="#73aaa5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g id="mii-ana-0-left" data-stage="anaphase-II" data-kind="single" data-homologue="long" data-parent="maternal" data-pole="left"><path d="M280,191 L240,225 L280,259" fill="none" stroke="#b75e53" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="240" cy="225" r="5" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/></g><path d="M575,285 L480,225" fill="none" stroke="#73aaa5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g id="mii-ana-0-right" data-stage="anaphase-II" data-kind="single" data-homologue="long" data-parent="maternal" data-pole="right"><path d="M440,191 L480,225 L440,259" fill="none" stroke="#b75e53" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="480" cy="225" r="5" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/></g><path d="M145,285 L240,345" fill="none" stroke="#73aaa5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g id="mii-ana-1-left" data-stage="anaphase-II" data-kind="single" data-homologue="short" data-parent="paternal" data-pole="left"><path d="M280,322 L240,345 L280,368" fill="none" stroke="#357ea2" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="240" cy="345" r="5" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/></g><path d="M575,285 L480,345" fill="none" stroke="#73aaa5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g id="mii-ana-1-right" data-stage="anaphase-II" data-kind="single" data-homologue="short" data-parent="paternal" data-pole="right"><path d="M440,322 L480,345 L440,368" fill="none" stroke="#357ea2" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="480" cy="345" r="5" fill="#1c2d4b" stroke="#1c2d4b" stroke-width="1"/></g><path d="M335,285 L290,285" fill="none" stroke="#1c2d4b" stroke-width="3" marker-end="url(#arr)"/><path d="M385,285 L430,285" fill="none" stroke="#1c2d4b" stroke-width="3" marker-end="url(#arr)"/><text x="360" y="475" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">Sisters separate; each is now a chromosome</text><text x="35" y="515" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Centromeric regions lead; chromosome arms trail. Each final cell</text><text x="35" y="544" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">has n = 2 single-chromatid chromosomes. Across both meiosis-II</text><text x="35" y="573" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">cells, four products form.</text></g><text x="24" y="1493" font-size="19" font-weight="400" text-anchor="start" fill="#1c2d4b">MARLBRIDGE  •  Schematic; structures and particles are not to scale.</text></g></svg>