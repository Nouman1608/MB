<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1150" viewBox="0 0 1800 2300" role="img" aria-labelledby="title desc"><title id="title">What blood is made of (OxfordAQA International GCSE Biology)</title><desc id="desc">Red blood cells carry oxygen using haemoglobin and have no nucleus, so they have a pale centre. White blood cells, phagocytes and lymphocytes, each have a nucleus: lymphocytes make antibodies and phagocytes engulf pathogens. Platelets are small fragments of cells that help blood to clot. Plasma is the liquid part of blood and carries blood cells, ions, nutrients, urea, hormones and carbon dioxide. No tier labels. The names phagocyte and lymphocyte are greyed with a note that they are not required by OxfordAQA: 9201 3.2.3l-o and 3.4.7c describe white blood cells ingesting pathogens and producing antibodies without naming the cell types.</desc><rect width="1800" height="2300" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="88" font-size="68" font-weight="700" fill="#1E2B47" text-anchor="middle">What blood is made of</text>
<text x="900" y="164" font-size="44" fill="#4B5B72" text-anchor="middle">Schematic cells, not to scale</text>
