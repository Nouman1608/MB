<text x="800" y="782" font-size="56" font-weight="700" fill="#1E2B47">White blood cells</text>
<text x="800" y="884" font-size="46" fill="#1E2B47">Phagocytosis, antibodies</text>
<text x="800" y="954" font-size="46" fill="#1E2B47">Each has a nucleus</text>
<text x="800" y="1186" font-size="44" fill="#6B7785">Lymphocytes: make antibodies</text>
<text x="800" y="1250" font-size="44" fill="#6B7785">Phagocytes: engulf pathogens</text>
<text x="800" y="1060" font-size="32" fill="#6B7785">Grey: the names phagocyte and lymphocyte</text>
<text x="800" y="1098" font-size="32" fill="#6B7785">are not required by OxfordAQA</text>
