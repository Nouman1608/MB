<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1290" viewBox="0 0 1800 2580" role="img" aria-labelledby="title desc"><title id="title">Repaying the oxygen debt (OxfordAQA International GCSE Biology)</title><desc id="desc">After vigorous exercise, lactic acid from the muscles is carried by the blood: (1) the heart rate stays fast, so lactic acid goes to the liver; (2) breathing stays deeper and faster, bringing extra oxygen; (3) the liver breaks lactic acid down by aerobic respiration. A grey note says the liver's role is not required by OxfordAQA, whose 9201 3.2.6j says only that the oxygen debt is repaid to oxidise lactic acid to carbon dioxide and water. Two line graphs: heart rate 64 at rest, 172 at the end of a sprint, 118 after 5 minutes and 66 after 15 minutes; breathing rate 14, 40, 26 and 15 breaths per minute. Dashed lines show resting values. No tier labels.</desc><rect width="1800" height="2580" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="88" font-size="68" font-weight="700" fill="#1E2B47" text-anchor="middle">Repaying the oxygen debt</text>
<text x="900" y="164" font-size="44" fill="#4B5B72" text-anchor="middle">After vigorous exercise</text>
