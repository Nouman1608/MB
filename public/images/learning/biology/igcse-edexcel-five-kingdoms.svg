<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1206" viewBox="0 0 1800 2412" role="img" aria-labelledby="title desc"><title id="title">Five kingdoms and viruses (Edexcel International GCSE Biology)</title><desc id="desc">Six panels. Animal: many cells, no cell wall, feeds by ingestion. Plant: many cells, cellulose wall, photosynthesis for food. Fungus: chitin cell wall, thread-like hyphae, secretes enzymes and absorbs. Prokaryote: no nucleus, DNA free in the cytoplasm, for example bacteria. Protoctist: mostly single-celled, not clearly animal, plant or fungus. Virus, in a dashed panel: not in any kingdom; a protein coat and genetic material only. No tier labels: these groups are 4BI1 statements 1.2 to 1.4, on both papers.</desc><rect width="1800" height="2412" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="88" font-size="68" font-weight="700" fill="#1E2B47" text-anchor="middle">Five kingdoms and viruses</text>
<text x="900" y="164" font-size="44" fill="#4B5B72" text-anchor="middle">Defining features of each</text>
<rect x="60" y="340" width="820" height="660" rx="28" fill="#FFFFFF" stroke="#1E2B47" stroke-width="5"/>
<text x="470" y="724" font-size="56" font-weight="700" fill="#2F6B63" text-anchor="middle">Animal</text>
<text x="470" y="800" font-size="46" fill="#1E2B47" text-anchor="middle">Many cells, no cell wall</text>
<text x="470" y="868" font-size="46" fill="#1E2B47" text-anchor="middle">Feeds by ingestion</text>
<rect x="920" y="340" width="820" height="660" rx="28" fill="#FFFFFF" stroke="#1E2B47" stroke-width="5"/>
<text x="1330" y="724" font-size="56" font-weight="700" fill="#2F6B63" text-anchor="middle">Plant</text>
<text x="1330" y="800" font-size="46" fill="#1E2B47" text-anchor="middle">Many cells, cellulose wall</text>
<text x="1330" y="868" font-size="46" fill="#1E2B47" text-anchor="middle">Photosynthesis for food</text>
<rect x="60" y="1028" width="820" height="660" rx="28" fill="#FFFFFF" stroke="#1E2B47" stroke-width="5"/>
<text x="470" y="1412" font-size="56" font-weight="700" fill="#2F6B63" text-anchor="middle">Fungus</text>
<text x="470" y="1488" font-size="46" fill="#1E2B47" text-anchor="middle">Chitin cell wall</text>
<text x="470" y="1556" font-size="46" fill="#1E2B47" text-anchor="middle">Thread-like hyphae</text>
<text x="470" y="1624" font-size="46" fill="#1E2B47" text-anchor="middle">Secretes enzymes, absorbs</text>
<rect x="920" y="1028" width="820" height="660" rx="28" fill="#FFFFFF" stroke="#1E2B47" stroke-width="5"/>
<text x="1330" y="1412" font-size="56" font-weight="700" fill="#2F6B63" text-anchor="middle">Prokaryote</text>
<text x="1330" y="1488" font-size="46" fill="#1E2B47" text-anchor="middle">No nucleus</text>
<text x="1330" y="1556" font-size="46" fill="#1E2B47" text-anchor="middle">DNA free in cytoplasm</text>
<text x="1330" y="1624" font-size="46" fill="#1E2B47" text-anchor="middle">e.g. bacteria</text>
<rect x="60" y="1716" width="820" height="660" rx="28" fill="#FFFFFF" stroke="#1E2B47" stroke-width="5"/>
<text x="470" y="2100" font-size="56" font-weight="700" fill="#2F6B63" text-anchor="middle">Protoctist</text>
<text x="470" y="2176" font-size="46" fill="#1E2B47" text-anchor="middle">Mostly single-celled</text>
<text x="470" y="2244" font-size="46" fill="#1E2B47" text-anchor="middle">Not clearly animal,</text>
<text x="470" y="2312" font-size="46" fill="#1E2B47" text-anchor="middle">plant or fungus</text>
<rect x="920" y="1716" width="820" height="660" rx="28" fill="#F2F5F5" stroke="#1E2B47" stroke-width="5" stroke-dasharray="18 12"/>
<text x="1330" y="2100" font-size="56" font-weight="700" fill="#B9632F" text-anchor="middle">Virus</text>
<text x="1330" y="2176" font-size="42" font-weight="700" fill="#B9632F" text-anchor="middle">not in any kingdom</text>
<text x="1330" y="2244" font-size="46" fill="#1E2B47" text-anchor="middle">Protein coat and</text>
<text x="1330" y="2312" font-size="46" fill="#1E2B47" text-anchor="middle">genetic material only</text>
<circle cx="260" cy="520" r="112" fill="#DDEBE8" stroke="#1E2B47" stroke-width="5"/>
<circle cx="244" cy="528" r="36" fill="#B5D4CF" stroke="#1E2B47" stroke-width="4"/>
