<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="title desc"><title id="title">Heart anatomy: chambers, septum, valves and coronary supply</title><desc id="desc">Two clear route columns show the right and left atria and ventricles, the septum, atrioventricular valves between each atrium and ventricle, semilunar valves at the arterial outlets, and coronary arteries on the external heart surface.</desc><defs><style>text{font-family:Arial,sans-serif;fill:#182b49}.title{font-size:36px;font-weight:700}.sub{font-size:21px}.head{font-size:25px;font-weight:700}.label{font-size:23px;font-weight:700}.small{font-size:18px}.note{font-size:17px}.brand{font-size:17px;font-weight:700;letter-spacing:3px;fill:#31516e}.blue{fill:#eaf4fa;stroke:#347da1;stroke-width:4}.red{fill:#fbecea;stroke:#bd6258;stroke-width:4}.box{stroke:#31516e;stroke-width:3}.flowB{stroke:#347da1;stroke-width:5;fill:none;stroke-linecap:round}.flowR{stroke:#bd6258;stroke-width:5;fill:none;stroke-linecap:round}.arrB{fill:#347da1}.arrR{fill:#bd6258}</style><marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" class="arrB"/></marker><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" class="arrR"/></marker></defs><rect width="1528" height="940" rx="28" fill="#f5f8f7"/><text x="58" y="72" class="title">Heart anatomy: chambers, septum, valves and coronary supply</text><text x="60" y="113" class="sub">Follow blood through each side; the septum keeps the oxygen-poor and oxygen-rich routes separate.</text><image href="data:image/svg+xml;base64," x="1320" y="16" width="170" height="42" preserveAspectRatio="xMidYMid meet"/><rect x="52" y="155" width="910" height="665" rx="22" fill="#fff" stroke="#cad7d5" stroke-width="3"/><text x="82" y="198" class="head">Four chambers and one-way flow</text><rect x="80" y="225" width="405" height="535" rx="18" class="blue"/><rect x="529" y="225" width="405" height="535" rx="18" class="red"/><text x="282" y="263" text-anchor="middle" class="label" fill="#347da1">RIGHT HEART · lower O₂</text><text x="731" y="263" text-anchor="middle" class="label" fill="#bd6258">LEFT HEART · higher O₂</text><text x="282" y="301" text-anchor="middle" class="small">from body through vena cava</text><rect x="132" y="315" width="300" height="76" rx="14" fill="#fff" class="box"/><text x="282" y="363" text-anchor="middle" class="label">Right atrium</text><path d="M282 394V416" class="flowB" marker-end="url(#ab)"/><text x="458" y="445" text-anchor="end" class="small">tricuspid AV valve</text><path d="M282 454V476" class="flowB" marker-end="url(#ab)"/><rect x="132" y="487" width="300" height="84" rx="14" fill="#fff" class="box"/><text x="282" y="539" text-anchor="middle" class="label">Right ventricle</text><text x="458" y="612" text-anchor="end" class="small">semilunar valve</text><path d="M282 626V646" class="flowB" marker-end="url(#ab)"/><text x="282" y="681" text-anchor="middle" class="small">pulmonary artery → lungs</text><text x="731" y="301" text-anchor="middle" class="small">from lungs through pulmonary veins</text><rect x="581" y="315" width="300" height="76" rx="14" fill="#fff" class="box"/><text x="731" y="363" text-anchor="middle" class="label">Left atrium</text><path d="M731 394V416" class="flowR" marker-end="url(#ar)"/><text x="552" y="445" text-anchor="start" class="small">mitral AV valve</text><path d="M731 454V476" class="flowR" marker-end="url(#ar)"/><rect x="581" y="487" width="300" height="84" rx="14" fill="#fff" stroke="#bd6258" stroke-width="7"/><text x="731" y="539" text-anchor="middle" class="label">Left ventricle</text><text x="552" y="612" text-anchor="start" class="small">semilunar valve</text><path d="M731 626V646" class="flowR" marker-end="url(#ar)"/><text x="731" y="681" text-anchor="middle" class="small">aorta → body</text><rect x="491" y="300" width="32" height="330" rx="12" fill="#9caab3"/><text transform="translate(507 477) rotate(-90)" text-anchor="middle" class="small" font-weight="700">SEPTUM</text><text x="282" y="724" text-anchor="middle" class="note">AV valves lie between atria and ventricles.</text><text x="731" y="724" text-anchor="middle" class="note">Semilunar valves guard the arterial outlets.</text><rect x="992" y="155" width="484" height="665" rx="22" fill="#fff" stroke="#cad7d5" stroke-width="3"/><text x="1022" y="198" class="head">Coronary supply</text><text x="1022" y="234" class="small">Outside surface of the heart</text><path d="M1234 587C1181 544 1077 463 1072 369C1068 294 1146 270 1234 343C1322 270 1400 294 1396 369C1391 463 1287 544 1234 587Z" fill="#f6d9d5" stroke="#31516e" stroke-width="5"/><path d="M1234 343V440M1234 374C1192 354 1150 365 1120 405M1234 374C1276 354 1318 365 1348 405M1190 367C1180 395 1172 416 1153 438M1278 367C1288 395 1296 416 1315 438M1234 440L1198 476M1234 440L1270 476" fill="none" stroke="#bd6258" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><text x="1234" y="635" text-anchor="middle" class="label">Coronary arteries</text><text x="1234" y="675" text-anchor="middle" class="small">run over the heart surface</text><text x="1234" y="705" text-anchor="middle" class="small">and supply the myocardium</text><rect x="1040" y="742" width="390" height="44" rx="12" fill="#fbecea"/><text x="1235" y="770" text-anchor="middle" class="note">The left ventricular wall is thicker.</text><text x="60" y="868" class="small">Schematic, not to scale; the right heart is shown on the left of the page.</text><text x="820" y="910" text-anchor="middle" class="brand" opacity=".24">MARLBRIDGE STUDY RESOURCES</text></svg>