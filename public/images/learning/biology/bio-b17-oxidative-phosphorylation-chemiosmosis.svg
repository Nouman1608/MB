<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Oxidative phosphorylation: electron transport and chemiosmosis</title><desc id="desc">Shows reduced coenzymes delivering hydrogen, electron transport powering proton transfer, proton return through ATP synthase, and oxygen forming water.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#168C8C"/></marker><marker id="arrGold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#D4AA27"/></marker></defs><rect width="1600" height="1000" fill="#F4F8F7"/><text x="800" y="57" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#17324D" text-anchor="middle">Oxidative phosphorylation: electron transport and chemiosmosis</text><text x="800" y="92" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#526778" text-anchor="middle">Cambridge International AS &amp; A Level Biology 9700</text><rect x="60" y="150" width="1480" height="620" rx="16" fill="#FFFFFF" stroke="#CAD7DC" stroke-width="2"/><rect x="95" y="190" width="1410" height="250" rx="12" fill="#EAF3F5" stroke="#B9D1D3" stroke-width="2"/><rect x="95" y="450" width="1410" height="275" rx="12" fill="#F5F7F4" stroke="#B9D1D3" stroke-width="2"/><text x="135" y="230" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#168C8C" text-anchor="start">INTERMEMBRANE SPACE • H⁺ accumulates</text><text x="135" y="710" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#3983B8" text-anchor="start">MATRIX</text><line x1="100" y1="438" x2="1500" y2="438" stroke="#17324D" stroke-width="12"/><rect x="200" y="330" width="180" height="145" rx="20" fill="#E5F2F0" stroke="#168C8C" stroke-width="3"/><text x="290" y="375" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#168C8C" text-anchor="middle">ETC</text><text x="290" y="413" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#17324D" text-anchor="middle">e⁻ release energy</text><rect x="565" y="335" width="190" height="135" rx="20" fill="#FFF8E2" stroke="#D4AA27" stroke-width="3"/><text x="660" y="380" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#D4AA27" text-anchor="middle">H⁺ PUMPS</text><text x="660" y="420" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#17324D" text-anchor="middle">matrix → space</text><line x1="382" y1="400" x2="555" y2="400" stroke="#168C8C" stroke-width="5" marker-end="url(#arr)"/><line x1="620" y1="580" x2="620" y2="462" stroke="#D4AA27" stroke-width="5" marker-end="url(#arr)"/><line x1="685" y1="580" x2="685" y2="462" stroke="#D4AA27" stroke-width="5" marker-end="url(#arr)"/><line x1="750" y1="580" x2="750" y2="462" stroke="#D4AA27" stroke-width="5" marker-end="url(#arr)"/><rect x="930" y="365" width="145" height="135" rx="18" fill="#EDF5FA" stroke="#3983B8" stroke-width="3"/><text x="1002" y="415" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#3983B8" text-anchor="middle">ATP</text><text x="1002" y="455" font-family="Arial,sans-serif" font-size="17" font-weight="500" fill="#17324D" text-anchor="middle">synthase</text><line x1="1040" y1="330" x2="1040" y2="530" stroke="#168C8C" stroke-width="6" marker-end="url(#arr)"/><text x="1145" y="558" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#168C8C" text-anchor="start">H⁺ returns by facilitated diffusion</text><rect x="1190" y="250" width="275" height="125" rx="16" fill="#FDF0EE" stroke="#D76C61" stroke-width="2"/><text x="1327" y="290" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#D76C61" text-anchor="middle">O₂ = final e⁻ acceptor</text><text x="1327" y="325" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#17324D" text-anchor="middle">½O₂ + 2e⁻ + 2H⁺ → H₂O</text><rect x="190" y="550" width="285" height="105" rx="16" fill="#EDF5FA" stroke="#3983B8" stroke-width="2"/><text x="332" y="590" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#3983B8" text-anchor="middle">Reduced NAD / FAD</text><text x="332" y="625" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#17324D" text-anchor="middle">deliver hydrogen</text><line x1="475" y1="590" x2="385" y2="438" stroke="#3983B8" stroke-width="4" marker-end="url(#arr)"/><rect x="750" y="605" width="320" height="72" rx="15" fill="#FFF8E2" stroke="#D4AA27" stroke-width="2"/><text x="910" y="650" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#17324D" text-anchor="middle">ADP + Pi → ATP</text><line x1="1000" y1="500" x2="1000" y2="595" stroke="#168C8C" stroke-width="4" marker-end="url(#arr)"/><text x="800" y="815" font-family="Arial,sans-serif" font-size="19" font-weight="600" fill="#17324D" text-anchor="middle">The proton gradient stores energy; ATP synthase couples H⁺ flow to ATP formation.</text><text x="800" y="902" text-anchor="middle" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#DCE5E5" opacity="0.62">MARLBRIDGE STUDY RESOURCES</text><line x1="48" y1="918" x2="1552" y2="918" stroke="#D4AA27" stroke-width="3"/><text x="48" y="954" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#526778" text-anchor="start">Marlbridge • Cambridge International A Level Biology 9700 • teaching diagram</text><image href="data:image/svg+xml;base64," x="1370" y="928" width="180" height="50" preserveAspectRatio="xMaxYMid meet"/></svg>