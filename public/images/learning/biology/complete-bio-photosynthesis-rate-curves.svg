<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="871" viewBox="0 0 1528 871" role="img" aria-labelledby="title desc"><title id="title">Photosynthesis: rising rates, plateaus and an optimum</title><desc id="desc">Illustrative light-response curves share a rising low-light region but have different carbon-dioxide-dependent plateaus at the same temperature. A second qualitative curve shows a temperature optimum and decline at excessive heat. Neither curve is empirical data.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#1c2d4b"/></marker><marker id="red" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#b75e53"/></marker><marker id="blue" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#357ea2"/></marker></defs><rect width="100%" height="100%" fill="#f5f8f7"/><g font-family="Arial, sans-serif"><text x="24" y="58" font-size="38" font-weight="700" text-anchor="start" fill="#1c2d4b">Photosynthesis: rising rates, plateaus and an optimum</text><text x="24" y="104" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Cambridge 0610 Biology 6.1.8 and 6.1.11 • Limiting-factor explanation is Extended content</text><g transform="translate(24,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Light and carbon dioxide interact</text><path d="M80,410 H650 M80,410 V90" fill="none" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M80,410 L417,140 H640" fill="none" stroke="#73aaa5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M80,410 L274,255 H640" fill="none" stroke="#d5b32d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="35" y="75" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">Relative rate</text><text x="650" y="462" font-size="23" font-weight="400" text-anchor="end" fill="#1c2d4b">Relative light intensity</text><text x="79" y="445" font-size="21" font-weight="400" text-anchor="middle" fill="#1c2d4b">0</text><text x="439" y="116" font-size="23" font-weight="700" text-anchor="start" fill="#73aaa5">Higher CO₂</text><text x="448" y="235" font-size="23" font-weight="700" text-anchor="start" fill="#8b7424">Lower CO₂</text><circle cx="180" cy="330" r="7" fill="#b75e53" stroke="#1c2d4b" stroke-width="2"/><text x="152" y="305" font-size="23" font-weight="700" text-anchor="start" fill="#b75e53">A</text><circle cx="525" cy="255" r="7" fill="#b75e53" stroke="#1c2d4b" stroke-width="2"/><text x="524" y="302" font-size="23" font-weight="700" text-anchor="start" fill="#b75e53">B</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">At A, more light increases rate. At B on the lower-CO₂ curve,</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">more light alone has no effect; more CO₂ raises rate at the</text><text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">same temperature. Schematic curves.</text></g><g transform="translate(784,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Temperature has an optimum</text><path d="M80,410 H650 M80,410 V90" fill="none" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M90,396 C200,380 272,338 340,245 C390,170 415,116 440,133 C475,160 500,340 570,407" fill="none" stroke="#73aaa5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="35" y="75" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">Relative rate</text><text x="650" y="462" font-size="23" font-weight="400" text-anchor="end" fill="#1c2d4b">Temperature</text><text x="79" y="445" font-size="21" font-weight="400" text-anchor="middle" fill="#1c2d4b">0</text><path d="M447,98.3 L434,135" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="455" y="106" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Optimum</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Below the optimum, warming can increase enzyme-controlled</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">rates. Excessive heat reduces photosynthetic activity. Control</text><text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">light and CO₂; this curve is illustrative, not measured data.</text></g><text x="24" y="849" font-size="19" font-weight="400" text-anchor="start" fill="#1c2d4b">MARLBRIDGE  •  Schematic; structures and particles are not to scale.</text></g></svg>