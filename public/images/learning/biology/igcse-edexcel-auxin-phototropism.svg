<text x="900" y="1842" font-size="44" fill="#1E2B47">cells 0.15 mm</text>
<text x="900" y="1902" font-size="44" font-weight="700" fill="#1E2B47">(50% longer)</text>
<text x="900" y="2134" font-size="40" fill="#4B5B72" text-anchor="middle">Auxin collects on the shaded side; it does not move to the light</text></g></svg>
