<text x="860" y="676" font-size="46" font-weight="700" fill="#1E2B47">More auxin on</text>
<text x="860" y="736" font-size="46" font-weight="700" fill="#1E2B47">the shaded side</text>
<text x="60" y="1276" font-size="48" font-weight="700" fill="#1E2B47">2 Shaded cells grow longer</text>
<circle cx="120" cy="1536" r="56" fill="#D6B22F" stroke="#1E2B47" stroke-width="5"/>
