<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1080" viewBox="0 0 1800 2160" role="img" aria-labelledby="title desc"><title id="title">Why a shoot bends to light (Edexcel International GCSE Biology)</title><desc id="desc">Part 1: light comes from one side; auxin is made in the shoot tip and there is more auxin on the shaded side. Part 2: the shaded cells grow longer, 0.15 mm against 0.10 mm on the lit side (50% longer), so the shoot bends towards the light. Auxin collects on the shaded side; it does not move to the light. No tier labels: the role of auxin in phototropism is 4BI1 statement 2.85, on both papers.</desc><rect width="1800" height="2160" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="88" font-size="68" font-weight="700" fill="#1E2B47" text-anchor="middle">Why a shoot bends to light</text>
<text x="900" y="164" font-size="44" fill="#4B5B72" text-anchor="middle">Phototropism, schematic</text>
<text x="60" y="394" font-size="48" font-weight="700" fill="#1E2B47">1 Light from one side</text>
