<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1000" viewBox="0 0 1800 2000" role="img" aria-labelledby="title desc"><title id="title">DNA structure (Edexcel International GCSE Biology: Paper 2 only)</title><desc id="desc">The whole figure is marked Paper 2 only: the structure of DNA is statement 3.16B of the 4BI1 specification. Left: a double helix of two strands coiled together. Right: the two strands drawn straight, with eight pairs of bases joined by bonds across the middle; A always pairs with T and C always pairs with G, as the key at the bottom shows.</desc><rect width="1800" height="2000" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="88" font-size="68" font-weight="700" fill="#1E2B47" text-anchor="middle">DNA structure</text>
