<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="t d"><title id="t">Blood vessels: compare wall and lumen structures</title><desc id="d">Cross-section schematic compares artery, vein and capillary wall thickness and lumen size; a short longitudinal vein view shows a valve.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#3F6E96"/></marker><marker id="arrg" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#2F8C70"/></marker><pattern id="mesh" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M0 0L14 14M14 0L0 14" stroke="#94AABD" stroke-width="1.5"/></pattern></defs><rect width="1528" height="940" fill="#F3F6F6"/><image href="data:image/svg+xml;base64," x="470" y="392" width="588" height="144" opacity=".07" preserveAspectRatio="xMidYMid meet"/><text x="52" y="58" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#10233F">Blood vessels: compare wall and lumen structures</text><text x="54" y="94" font-family="Arial,sans-serif" font-size="18" fill="#5B6D80">Marlbridge • Pearson Edexcel International GCSE Biology 4BI1 • Circulation (2.68–2.69)</text><rect x="48" y="128" width="1432" height="692" rx="22" fill="#FFFFFF" stroke="#D1DCE3" stroke-width="2"/><text x="76" y="174" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#10233F">CROSS-SECTIONS • WALL LAYERS AND LUMEN SIZES ARE SCHEMATIC</text><rect x="78" y="204" width="418" height="540" rx="16" fill="#F8FAFB" stroke="#CFDAE1" stroke-width="2"/><text x="287" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">ARTERY</text><text x="287" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#5B6D80">Thicker muscular, elastic wall • typically narrower lumen</text><rect x="555" y="204" width="418" height="540" rx="16" fill="#F8FAFB" stroke="#CFDAE1" stroke-width="2"/><text x="764" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">VEIN</text><text x="764" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#5B6D80">Thinner wall • wider lumen • many veins have valves</text><rect x="1032" y="204" width="418" height="540" rx="16" fill="#F8FAFB" stroke="#CFDAE1" stroke-width="2"/><text x="1241" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">CAPILLARY</text><text x="1241" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#5B6D80">Wall one endothelial cell thick • very narrow lumen</text><circle cx="287" cy="461" r="117" fill="#E8C3A6" stroke="#B06A50" stroke-width="3"/><circle cx="287" cy="461" r="87" fill="#D67B68" stroke="#A9514A" stroke-width="3"/><circle cx="287" cy="461" r="55" fill="#FFFFFF" stroke="#A9514A" stroke-width="3"/><text x="287" y="466" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">LUMEN</text><line x1="340" y1="375" x2="410" y2="332" stroke="#25364B" stroke-width="2"/><text x="416" y="329" font-family="Arial,sans-serif" font-size="13" fill="#25364B">muscle + elastic</text><text x="416" y="347" font-family="Arial,sans-serif" font-size="13" fill="#25364B">tissue (thick wall)</text><text x="287" y="615" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#5B6D80">Wall stretches and recoils at higher pressure.</text><circle cx="764" cy="461" r="106" fill="#E8C3A6" stroke="#B06A50" stroke-width="3"/><circle cx="764" cy="461" r="82" fill="#D67B68" stroke="#A9514A" stroke-width="3"/><circle cx="764" cy="461" r="72" fill="#FFFFFF" stroke="#A9514A" stroke-width="3"/><text x="764" y="466" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">WIDE LUMEN</text><text x="764" y="593" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#5B6D80">Thin wall; lower-pressure return flow.</text><rect x="640" y="632" width="248" height="68" rx="12" fill="#EDF4F9" stroke="#BCD0DE" stroke-width="2"/><path d="M670 666H855" stroke="#3F6E96" stroke-width="13" stroke-linecap="round"/><path d="M744 649Q764 681 784 649" fill="none" stroke="#C9A227" stroke-width="5"/><text x="764" y="721" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#25364B">Valve shown in a short longitudinal view</text><circle cx="1241" cy="461" r="75" fill="#F1D3C6" stroke="#B06A50" stroke-width="7"/><circle cx="1241" cy="461" r="62" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2"/><text x="1241" y="466" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">NARROW LUMEN</text><path d="M1290 405L1360 353" stroke="#25364B" stroke-width="2"/><text x="1365" y="349" font-family="Arial,sans-serif" font-size="13" fill="#25364B">single cell layer</text><text x="1241" y="593" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#5B6D80">Short diffusion distance for exchange.</text><rect x="91" y="767" width="1344" height="34" rx="10" fill="#FFF5DA" stroke="#C9A227"/><text x="763" y="790" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">Not to scale. The paired route map separately shows hepatic portal and renal branches; these cross-sections compare vessel walls.</text><text x="764" y="854" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="7" fill="#CBD8D8" opacity=".78">MARLBRIDGE STUDY RESOURCES</text><line x1="52" y1="868" x2="1476" y2="868" stroke="#C9A227" stroke-width="2"/><text x="54" y="906" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE • BIOLOGY STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1300" y="878" width="176" height="43" opacity=".96" preserveAspectRatio="xMaxYMid meet"/></svg>
