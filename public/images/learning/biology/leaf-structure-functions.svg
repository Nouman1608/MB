<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="871" viewBox="0 0 1528 871" role="img" aria-labelledby="title desc"><title id="title">Leaf structure: tissues and adaptations</title><desc id="desc">The upper surface has a cuticle and epidermis. Palisade cells contain many chloroplasts; spongy mesophyll has air spaces. Guard cells surround a pore in the lower epidermis. Labels link these structures to photosynthesis and gas exchange.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#1c2d4b"/></marker><marker id="red" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#b75e53"/></marker><marker id="blue" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#357ea2"/></marker></defs><rect width="100%" height="100%" fill="#f5f8f7"/><g font-family="Arial, sans-serif"><text x="24" y="58" font-size="38" font-weight="700" text-anchor="start" fill="#1c2d4b">Leaf structure: tissues and adaptations</text><text x="24" y="104" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">A simplified dicotyledonous leaf cross-section</text><g transform="translate(24,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">A dicot leaf in cross-section</text><rect x="95" y="110" width="510" height="20" rx="0" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><rect x="95" y="132" width="62" height="42" rx="2" fill="#e2efec" stroke="#1c2d4b" stroke-width="1"/><rect x="159" y="132" width="62" height="42" rx="2" fill="#e2efec" stroke="#1c2d4b" stroke-width="1"/><rect x="223" y="132" width="62" height="42" rx="2" fill="#e2efec" stroke="#1c2d4b" stroke-width="1"/><rect x