h="62" height="35" rx="2" fill="#e2efec" stroke="#1c2d4b" stroke-width="1"/><rect x="159" y="385" width="62" height="35" rx="2" fill="#e2efec" stroke="#1c2d4b" stroke-width="1"/><rect x="223" y="385" width="62" height="35" rx="2" fill="#e2efec" stroke="#1c2d4b" stroke-width="1"/><rect x="415" y="385" width="62" height="35" rx="2" fill="#e2efec" stroke="#1c2d4b" stroke-width="1"/><rect x="479" y="385" width="62" height="35" rx="2" fill="#e2efec" stroke="#1c2d4b" stroke-width="1"/><rect x="543" y="385" width="62" height="35" rx="2" fill="#e2efec" stroke="#1c2d4b" stroke-width="1"/><ellipse cx="305" cy="401" rx="20" ry="17" fill="#73aaa5" stroke="#1c2d4b" stroke-width="3"/><ellipse cx="390" cy="401" rx="20" ry="17" fill="#73aaa5" stroke="#1c2d4b" stroke-width="3"/><path d="M348,445 L348,375" fill="none" stroke="#1c2d4b" stroke-width="4" marker-end="url(#arr)"/><text x="350" y="100" font-size="22" font-weight="700" text-anchor="middle" fill="#1c2d4b">Upper surface</text><path d="M600,158 L600,145" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="610" y="148" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">1</text><path d="M602,225.3 L590,230" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="610" y="233" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">2</text><path d="M602,342.3 L565,345" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="610" y="350" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">3</text><text x="455" y="452" font-size="21" font-weight="700" text-anchor="start" fill="#1c2d4b">Stoma (pore)</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">1 Upper epidermis; cuticle above it. 2 Palisade mesophyll with</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">many chloroplasts. 3 Spongy mesophyll with air spaces. Guard</text><text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">cells border the stoma.</text></g><g transform="translate(784,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Link structure to function</text><rect x="50" y="100" width="620" height="105" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2"/><text x="360.0" y="132" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">Broad and thin</text><text x="360.0" y="165" font-size="20" font-weight="400" text-anchor="middle" fill="#1c2d4b">Large light-absorbing area; short diffusion path</text><rect x="50" y="240" width="620" height="105" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2"/><text x="360.0" y="272" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">Air spaces and stomata</text><text x="360.0" y="305" font-size="20" font-weight="400" text-anchor="middle" fill="#1c2d4b">Gases diffuse between the air and mesophyll cells</text><rect x="50" y="380" width="620" height="80" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2"/><text x="360.0" y="412" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">Chloroplasts</text><text x="360.0" y="445" font-size="20" font-weight="400" text-anchor="middle" fill="#1c2d4b">Chlorophyll absorbs light</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">The vascular bundle also supplies water in xylem and</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">transports sucrose in phloem. This section omits the vein so</text><text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">the mesophyll layers are clear.</text></g><text x="24" y="849" font-size="19" font-weight="400" text-anchor="start" fill="#1c2d4b">MARLBRIDGE  •  Schematic; structures and particles are not to scale.</text></g></svg>