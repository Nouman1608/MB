<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Vascular cells: xylem and phloem</title><desc id="desc">Compares an elongated lignified xylem vessel element with a phloem sieve tube and its narrower adjacent companion cell, showing pits, sieve plate pores, nucleus, mitochondria and plasmodesmata.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#168C8C"/></marker><marker id="arrN" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#17324D"/></marker></defs><rect width="1600" height="1000" fill="#F4F8F7"/><text x="800" y="62" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#17324D" text-anchor="middle">Vascular cells: xylem and phloem</text><text x="800" y="98" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#526778" text-anchor="middle">Marlbridge • Cambridge International A Level Biology 9700 • Transport in plants • cell structure</text><rect x="48" y="130" width="1504" height="735" rx="18" fill="#fff" stroke="#CAD7DC" stroke-width="2"/><rect x="75" y="165" width="440" height="635" rx="14" fill="#fff" stroke="#CAD7DC" stroke-width="2"/><text x="295" y="205" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#3983B8" text-anchor="middle">Xylem vessel</text><path d="M230 250 H360 V680 H230 Z M230 460 H360" fill="none" stroke="#3983B8" stroke-width="12"/><path d="M230 250 H360 M230 680 H360" fill="none" stroke="#172B3C" stroke-width="3"/><path d="M232 300 H358" stroke="#E1AA37" stroke-width="7"/><path d="M232 350 H358" stroke="#E1AA37" stroke-width="7"/><path d="M232 400 H358" stroke="#E1AA37" stroke-width="7"/><path d="M232 510 H358" stroke="#E1AA37" stroke-width="7"/><path d="M232 560 H358" stroke="#E1AA37" stroke-width="7"/><path d="M232 610 H358" stroke="#E1AA37" stroke-width="7"/><text x="295" y="720" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#17324D" text-anchor="middle">Dead, hollow lumen • lignified wall</text><path d="M295 640 L295 530" fill="none" stroke="#168C8C" stroke-width="3" marker-end="url(#arr)"/><text x="390" y="560" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#168C8C" text-anchor="start">water + mineral ions</text><text x="100" y="760" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#526778" text-anchor="start">Pits allow sideways water movement</text><rect x="565" y="165" width="450" height="635" rx="14" fill="#fff" stroke="#CAD7DC" stroke-width="2"/><text x="790" y="205" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#168C8C" text-anchor="middle">Phloem sieve tube</text><path d="M720 250 H865 V650 H720 Z M720 450 H865" fill="none" stroke="#168C8C" stroke-width="5"/><circle cx="745" cy="450" r="4" fill="#168C8C"/><circle cx="775" cy="450" r="4" fill="#168C8C"/><circle cx="805" cy="450" r="4" fill="#168C8C"/><circle cx="835" cy="450" r="4" fill="#168C8C"/><text x="792" y="700" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#17324D" text-anchor="middle">Living element • no nucleus</text><text x="792" y="735" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#17324D" text-anchor="middle">Sieve plate pores join elements</text><path d="M790 625 L790 500" fill="none" stroke="#E1AA37" stroke-width="3" marker-end="url(#arr)"/><text x="790" y="600" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#E1AA37" text-anchor="middle">assimilate sap</text><rect x="1065" y="165" width="465" height="635" rx="14" fill="#fff" stroke="#CAD7DC" stroke-width="2"/><text x="1297" y="205" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#D76C61" text-anchor="middle">Companion cell</text><rect x="1235" y="275" width="125" height="350" rx="18" fill="#fff" stroke="#D76C61" stroke-width="5"/><circle cx="1298" cy="355" r="30" fill="#FFF4D6" stroke="#E1AA37" stroke-width="3"/><text x="1298" y="361" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#17324D" text-anchor="middle">N</text><ellipse cx="1264" cy="430" rx="18" ry="9" fill="#fff" stroke="#D76C61" stroke-width="3"/><ellipse cx="1330" cy="430" rx="18" ry="9" fill="#fff" stroke="#D76C61" stroke-width="3"/><ellipse cx="1264" cy="490" rx="18" ry="9" fill="#fff" stroke="#D76C61" stroke-width="3"/><ellipse cx="1330" cy="490" rx="18" ry="9" fill="#fff" stroke="#D76C61" stroke-width="3"/><text x="1298" y="670" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#17324D" text-anchor="middle">Nucleus • many mitochondria</text><text x="1298" y="705" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#17324D" text-anchor="middle">ATP supports active loading</text><text x="1298" y="740" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#17324D" text-anchor="middle">Plasmodesmata connect to sieve tube</text><path d="M865 465 H1234" fill="none" stroke="#172B3C" stroke-width="4" stroke-dasharray="8 8"/><text x="1050" y="450" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#526778" text-anchor="middle">plasmodesmata</text><rect x="100" y="770" width="1400" height="55" rx="12" fill="#FFF4D6" stroke="#E1AA37" stroke-width="2"/><text x="800" y="805" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17324D" text-anchor="middle">A companion cell is narrower than its sieve tube element; the two remain adjacent.</text><text x="42" y="944" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#526778" text-anchor="start">Cell features are schematic; relative widths are shown qualitatively</text><path d="M40 918H1560" stroke="#E1AA37" stroke-width="3"/><text x="800" y="900" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#17324D" opacity=".07" tex