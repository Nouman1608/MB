<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="871" viewBox="0 0 1528 871" role="img" aria-labelledby="title desc">
  <title id="title">Reflex arcs and synaptic transmission</title>
  <desc id="desc">A receptor sends information through sensory, relay and motor neurones to an effector. At a synapse, neurotransmitter diffuses from a presynaptic ending to receptors on the postsynaptic membrane, allowing one-way transmission.</desc>
  <defs>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1c2d4b" />
    </marker>
    <marker id="red" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b75e53" />
    </marker>
    <marker id="blue" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#357ea2" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f8f7" />
  <g font-family="Arial, sans-serif">
    <text x="24" y="58" font-size="38" font-weight="700" text-anchor="start" fill="#1c2d4b">Reflex arcs and synaptic transmission</text>
    <text x="24" y="104" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Edexcel International GCSE Biology 4BI1 • chemical synapse (2.89)</text>
    <g transform="translate(24,172)">
      <rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2" />
      <text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">A simple withdrawal reflex</text>
      <rect x="285" y="85" width="185" height="370" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2" />
      <text x="377" y="120" font-size="26" font-weight="700" text-anchor="middle" fill="#1c2d4b">CNS</text>
      <rect x="35" y="145" width="200" height="75" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2" />
      <text x="135.0" y="177" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">Receptor</text>
      <rect x="300" y="225" width="155" height="100" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2" />
      <text x="377.5" y="257" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">Relay</text>
      <text x="377.5" y="288" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">neurone</text>
      <rect x="35" y="365" width="200" height="75" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2" />
      <text x="135.0" y="397" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">Effector</text>
      <path d="M235,182 H377 V215" fill="none" stroke="#1c2d4b" stroke-width="4" marker-end="url(#arr)" />
      <path d="M377,325 V402 H245" fill="none" stroke="#1c2d4b" stroke-width="4" marker-end="url(#arr)" />
      <text x="245" y="165" font-size="21" font-weight="700" text-anchor="start" fill="#1c2d4b">Sensory neurone</text>
      <text x="245" y="448" font-size="21" font-weight="700" text-anchor="start" fill="#1c2d4b">Motor neurone</text>
      <text x="575" y="210" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">Stimulus</text>
      <text x="575" y="250" font-size="30" font-weight="700" text-anchor="middle" fill="#1c2d4b">↓</text>
      <text x="575" y="290" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">Response</text>
      <text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">A receptor detects a stimulus. Impulses pass along sensory,</text>
      <text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">relay and motor neurones. A muscle effector contracts,</text>
      <text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">producing a rapid, automatic response.</text>
    </g>
    <g transform="translate(784,172)">
      <rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2" />
      <text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Across a synapse</text>
      <rect x="60" y="180" width="210" height="170" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2" />
      <rect x="450" y="180" width="210" height="170" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2" />
      <circle cx="240" cy="225" r="10" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2" />
      <circle cx="305" cy="225" r="5" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2" />
      <circle cx="375" cy="225" r="5" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2" />
      <path d="M450,213 h-10 v24 h10" fill="none" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="240" cy="275" r="10" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2" />
      <circle cx="305" cy="275" r="5" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2" />
      <circle cx="375" cy="275" r="5" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2" />
      <path d="M450,263 h-10 v24 h10" fill="none" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="240" cy="325" r="10" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2" />
      <circle cx="305" cy="325" r="5" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2" />
      <circle cx="375" cy="325" r="5" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2" />
      <path d="M450,313 h-10 v24 h10" fill="none" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M285,145 L435,145" fill="none" stroke="#1c2d4b" stroke-width="4" marker-end="url(#arr)" />
      <text x="360" y="120" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">Neurotransmitter</text>
      <text x="165" y="405" font-size="22" font-weight="700" text-anchor="middle" fill="#1c2d4b">Presynaptic ending</text>
      <text x="550" y="405" font-size="21" font-weight="700" text-anchor="middle" fill="#1c2d4b">Postsynaptic membrane</text>
      <text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">The synaptic cleft is the narrow gap between cell membranes.</text>
      <text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Receptor binding can trigger a response; it does not guarantee</text>
      <text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">a new impulse unless the postsynaptic cell reaches threshold.</text>
    </g>
    <text x="24" y="849" font-size="19" font-weight="400" text-anchor="start" fill="#1c2d4b">MARLBRIDGE  •  Schematic; structures and particles are not to scale.</text>
  </g>
</svg>