<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="760" viewBox="0 0 1528 760" role="img" aria-labelledby="title desc"><title id="title">Investigating photosynthesis with pondweed</title><desc id="desc">A two-panel plan for the pondweed photosynthesis practical. Panel A shows pondweed submerged in sodium hydrogencarbonate solution in a sealed vessel, connected through an airtight delivery tube to a gas syringe. A lamp is separated from the vessel by a beaker water heat shield; distance is measured from the lamp to the pondweed and a thermometer monitors temperature. Panel B identifies distance or intensity as the changed factor, oxygen volume per fixed time as the measurement, and controlled conditions, acclimation and repeats. The 6.0 cubic centimetre in 5 minutes example is labelled as worked-example data only; it is not a practical result.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#1c2d4b"/></marker></defs><rect width="100%" height="100%" fill="#f5f8f7"/><text x="24" y="44" font-family="Arial,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#1c2d4b">Investigating photosynthesis with pondweed</text><text x="24" y="76" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#1c2d4b">AQA GCSE required practical • oxygen collection and rate measurement</text><g transform="translate(24,112)"><text x="30" y="45" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#1c2d4b">A. Closed oxygen-collection setup</text><text x="30" y="78" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#1c2d4b">Measure gas volume change in a fixed time; keep the collection path airtight.</text><rect x="24" y="102" width="672" height="492" rx="14" fill="white" stroke="#cad7d5" stroke-width="2"/><rect x="55" y="222" width="82" height="86" rx="8" fill="#e2efec" stroke="#1c2d4b" stroke-width="2"/><line x1="137" y1="265" x2="160" y2="265" stroke="#1c2d4b" stroke-width="5" stroke-linecap="round"/><rect x="42" y="230" width="16" height="70" rx="4" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><text x="96" y="332" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#1c2d4b">lamp</text><path d="M155 225 L214 252 M155 265 L214 265 M155 305 L214 278" fill="none" stroke="#d5b32d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M218 202 L218 330 Q218 345 233 345 L284 345 Q299 345 299 330 L299 202" fill="none" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M221 258 L296 258 L296 330 Q296 342 284 342 L233 342 Q221 342 221 330 Z" fill="#e2efec" stroke="#357ea2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="258" y="190" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1c2d4b">water heat shield</text><text x="258" y="368" font-family="Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#b75e53">does not guarantee constant T</text><path d="M361 224 L361 360 Q361 376 377 376 L453 376 Q469 376 469 360 L469 224" fill="none" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M364 260 L466 260 L466 359 Q466 373 453 373 L377 373 Q364 373 364 359 Z" fill="#e2efec" stroke="#73aaa5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="354" y="214" width="122" height="16" rx="4" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><text x="411" y="401" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#1c2d4b">pondweed in sodium</text><text x="411" y="421" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#1c2d4b">hydrogencarbonate solution</text><path d="M413 352 Q414 320 414 284" fill="none" stroke="#73aaa5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M414 327 Q394 320 389 304 Q407 302 414 315" fill="#e2efec" stroke="#73aaa5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M414 315 Q432 308 438 292 Q422 292 414 303" fill="#e2efec" stroke="#73aaa5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M414 299 Q398 290 400 276 Q412 278 416 290" fill="#e2efec" stroke="#73aaa5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M414 286 Q430 279 429 266 Q416 268 412 278" fill="#e2efec" stroke="#73aaa5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="401" cy="270" r="3" fill="white" stroke="#357ea2" stroke-width="1.5"/><circle cx="423" cy="250" r="4" fill="white" stroke="#357ea2" stroke-width="1.5"/><circle cx="406" cy="239" r="3" fill="white" stroke="#357ea2" stroke-width="1.5"/><line x1="449" y1="245" x2="449" y2="333" stroke="#b75e53" stroke-width="3" stroke-linecap="round"/><circle cx="449" cy="339" r="7" fill="#b75e53"/><text x="476" y="310" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#1c2d4b">thermometer</text><text x="476" y="329" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#1c2d4b">monitor T</text><path d="M415 214 L415 174 L575 174" fill="none" stroke="#357ea2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="475" y="159" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#357ea2">sealed delivery tube</text><rect x="575" y="142" width="104" height="64" rx="8" fill="white" stroke="#1c2d4b" stroke-width="3"/><rect x="578" y="151" width="14" height="46" rx="3" fill="#e2efec" stroke="#357ea2" stroke-width="2"/><line x1="594" y1="151" x2="594" y2="197" stroke="#1c2d4b" stroke-width="4" stroke-linecap="round"/><line x1="594" y1="174" x2="691" y2="174" stroke="#1c2d4b" stroke-width="5" stroke-linecap="round"/><line x1="692" y1="159" x2="692" y2="189" stroke="#1c2d4b" stroke-width="5" stroke-linecap="round"/><text x="627" y="227" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1c2d4b">gas syringe • zero start</text><text x="627" y="248" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1c2d4b">read Δvolume</text><path d="M546 166 L562 174 L546 182 Z" fill="#357ea2" stroke="#357ea2" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><line x1="154" y1="454" x2="413" y2="454" stroke="#1c2d4b" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 5"/><line x1="154" y1="445" x2="154" y2="463" stroke="#1c2d4b" stroke-width="2" stroke-linecap="round"/><line x1="413" y1="445" x2="413" y2="463" stroke="#1c2d4b" stroke-width="2" stroke-linecap="round"/><text x="284" y="447" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#1c2d4b">measure from lamp to weed: d</text><text x="45" y="512" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#1c2d4b">Start with syringe at zero; check for leaks. Let the weed acclimatise before timing.</text><text x="45" y="544" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#357ea2">No open gas outlet: photosynthetic gas moves through the sealed tube into the syringe.</text></g><g transform="translate(784,112)"><text x="30" y="45" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#1c2d4b">B. Control variables and calculate rate</text><text x="30" y="78" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#1c2d4b">Change one factor at a time; use repeats and report the unit.</text><rect x="24" y="102" width="672" height="492" rx="14" fill="white" stroke="#cad7d5" stroke-width="2"/><rect x="48" y="132" width="277" height="92" rx="12" fill="#e2efec" stroke="#73aaa5" stroke-width="2"/><text x="186" y="165" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#1c2d4b">Change</text><text x="186" y="198" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#1c2d4b">lamp distance (or light intensity)</text><rect x="365" y="132" width="277" height="92" rx="12" fill="#eef3fb" stroke="#357ea2" stroke-width="2"/><text x="503" y="165" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#1c2d4b">Measure</text><text x="503" y="198" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#1c2d4b">oxygen volume ÷ time</text><text x="55" y="273" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#1c2d4b">Keep the comparison fair</text><text x="70" y="310" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#1c2d4b">• same pondweed piece and starting length</text><text x="70" y="345" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#1c2d4b">• same sodium hydrogencarbonate solution</text><text x="70" y="380" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#1c2d4b">• same timed interval and background light</text><text x="70" y="415" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#1c2d4b">• monitor temperature; water shield reduces lamp heating</text><text x="70" y="450" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#1c2d4b">• allow acclimation; take repeated readings at each distance</text><line x1="48" y1="475" x2="670" y2="475" stroke="#cad7d5" stroke-width="2" stroke-linecap="round"/><text x="360" y="513" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#1c2d4b">rate = oxygen volume collected ÷ time</text><text x="360" y="548" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#357ea2">Worked example only: 6.0 cm³ ÷ 5 min = 1.2 cm³ min⁻¹</text><text x="360" y="574" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#b75e53">Do not present this example as measured practical data.</text></g><text x="24" y="740" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#1c2d4b">MARLBRIDGE • Schematic apparatus; use your centre’s approved practical method.</text></svg>