<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1120" viewBox="0 0 1800 2240" role="img" aria-labelledby="title desc"><title id="title">From gene to protein (OxfordAQA International GCSE Biology)</title><desc id="desc">No tier label: OxfordAQA International GCSE Biology is not tiered. A gene on the DNA stays in the nucleus (1); a ribosome joins amino acids in the order set by the bases (4); the chain folds into a protein whose shape decides what it does. Steps 2 and 3, mRNA copying the gene and moving out to the cytoplasm, are marked not required by OxfordAQA: the 9201 specification says the order of bases controls the order of amino acids but does not mention mRNA.</desc><rect width="1800" height="2240" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="109" font-size="68" font-weight="700" fill="#1E2B47" text-anchor="middle">From gene to protein</text>
<text x="900" y="172" font-size="44" fill="#4B5B72" text-anchor="middle">Simplified</text>
