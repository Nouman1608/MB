<text x="291" y="678" font-size="46" font-weight="700" fill="#1E2B47">Gene stays in</text>
<text x="291" y="741" font-size="46" font-weight="700" fill="#1E2B47">the nucleus</text>
<text x="1264" y="588" font-size="46" font-weight="700" fill="#1E2B47">mRNA is a copy</text>
<text x="1264" y="652" font-size="46" font-weight="700" fill="#1E2B47">of the gene</text>
<text x="1409" y="1067" font-size="46" font-weight="700" fill="#1E2B47">mRNA moves</text>
<text x="1409" y="1131" font-size="46" font-weight="700" fill="#1E2B47">out to the</text>
<text x="1409" y="1196" font-size="46" font-weight="700" fill="#1E2B47">cytoplasm</text>
<text x="1351" y="1389" font-size="46" font-weight="700" fill="#1E2B47">Ribosome joins</text>
<text x="1351" y="1453" font-size="46" font-weight="700" fill="#1E2B47">amino acids</text>
<text x="1389" y="426" font-size="52" font-weight="700" fill="#2F6B63" text-anchor="middle">Nucleus</text>
<text x="60" y="1340" font-size="46" font-weight="700" fill="#1E2B47">Order of bases in mRNA</text>
<text x="60" y="1406" font-size="46" font-weight="700" fill="#1E2B47">sets order of amino acids</text>
<text x="972" y="1635" font-size="44" fill="#4B5B72">amino acids</text>
<line x1="1070" y1="1299" x2="1226" y2="1369" stroke="#1E2B47" stroke-width="3" stroke-linecap="round"/>
<text x="60" y="1917" font-size="46" font-weight="700" fill="#1E2B47">Shape decides</text>
<text x="60" y="1982" font-size="46" font-weight="700" fill="#1E2B47">what it does</text>
<text x="753" y="2078" font-size="46" font-weight="700" fill="#1E2B47" text-anchor="middle">folds into a protein</text>
<text x="81" y="2137" font-size="46" font-weight="700" fill="#4B5B72">Cytoplasm</text>
<text x="1264" y="716" font-size="38" fill="#6B7785">not required</text>
<text x="1264" y="762" font-size="38" fill="#6B7785">by OxfordAQA</text>
<text x="1409" y="1252" font-size="38" fill="#6B7785">not required</text>
<text x="1409" y="1298" font-size="38" fill="#6B7785">by OxfordAQA</text></g></svg>
