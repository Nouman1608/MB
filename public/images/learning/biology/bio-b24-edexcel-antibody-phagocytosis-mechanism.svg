<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="t d"><title id="t">Immune response: antibody binding and phagocytosis</title><desc id="d">An antibody made by a lymphocyte binds a matching antigen epitope; antibodies can clump pathogens or mark them for destruction. A phagocyte ingests pathogens and digests them with enzymes.</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#10233F">Immune response: antibody binding and phagocytosis</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#5B6D80">Marlbridge • Edexcel International GCSE Biology 4BI1 • White blood cells (2.62)</text><rect x="52" y="132" width="1424" height="680" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="92" y="168" width="1344" height="488" rx="16" fill="#FBFCFD" stroke="#D3DCE2" stroke-width="2"/><rect x="126" y="212" width="580" height="400" rx="14" fill="#EAF5FB" stroke="#315F86" stroke-width="2"/><rect x="822" y="212" width="580" height="400" rx="14" fill="#F4EFF8" stroke="#725C8E" stroke-width="2"/><text x="416" y="253" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">1 • SPECIFIC ANTIBODY BINDING</text><text x="1112" y="253" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">2 • PHAGOCYTE RESPONSE</text><ellipse cx="282" cy="398" rx="90" ry="90" fill="#F8D9D7" stroke="#C44949" stroke-width="3"/><text x="282" y="400" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#10233F">Pathogen</text><text x="282" y="422" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#20314B">surface</text><path d="M365 395L370 401L375 395" stroke="#C9A227" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M339.2253967444162 457.2253967444162L344.2253967444162 463.2253967444162L349.2253967444162 457.2253967444162" stroke="#C9A227" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M277 483L282 489L287 483" stroke="#C9A227" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M214.77460325558383 457.2253967444162L219.77460325558383 463.2253967444162L224.77460325558383 457.2253967444162" stroke="#C9A227" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M189 395L194 401L199 395" stroke="#C9A227" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M214.7746032555838 332.7746032555838L219.7746032555838 338.7746032555838L224.7746032555838 332.7746032555838" stroke="#C9A227" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M277 307L282 313L287 307" stroke="#C9A227" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M339.2253967444162 332.7746032555838L344.2253967444162 338.7746032555838L349.2253967444162 332.7746032555838" stroke="#C9A227" stroke-width="5" fill="none" stroke-linecap="round"/><text x="282" y="525" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20314B">Antigens display specific epitopes</text><path d="M430 365L464 399" stroke="#168C8C" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M464 399L498 365" stroke="#168C8C" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M464 399L464 450" stroke="#168C8C" stroke-width="8" fill="none" stroke-linecap="round"/><text x="464" y="482" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#168C8C">Antibody</text><text x="464" y="505" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#20314B">released by lymphocyte</text><path d="M377 400L413 400" stroke="#315F86" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="410" y="285" width="246" height="42" rx="7" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="533" y="312" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#10233F">matching binding sites</text><rect x="173" y="562" width="467" height="34" rx="7" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/><text x="406" y="585" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#10233F">One antibody binds a matching epitope</text><ellipse cx="920" cy="369" rx="31" ry="31" fill="#F8D9D7" stroke="#C44949" stroke-width="2"/><ellipse cx="980" cy="369" rx="31" ry="31" fill="#F8D9D7" stroke="#C44949" stroke-width="2"/><ellipse cx="1040" cy="369" rx="31" ry="31" fill="#F8D9D7" stroke="#C44949" stroke-width="2"/><path d="M949 369L951 369" stroke="#168C8C" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M1009 369L1011 369" stroke="#168C8C" stroke-width="5" fill="none" stroke-linecap="round"/><text x="940" y="428" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">Antibodies can cross-link antigens</text><text x="940" y="451" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#20314B">and cause pathogens to clump</text><ellipse cx="1190" cy="502" rx="78" ry="64" fill="#DCEAF4" stroke="#597A97" stroke-width="3"/><ellipse cx="1168" cy="500" rx="27" ry="20" fill="#8B75A8" stroke="#725C8E" stroke-width="2"/><ellipse cx="1206" cy="503" rx="22" ry="16" fill="#8B75A8" stroke="#725C8E" stroke-width="2"/><ellipse cx="1175" cy="475" rx="12" ry="12" fill="#F8D9D7" stroke="#C44949" stroke-width="2"/><text x="1190" y="585" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#315F86">Phagocyte ingests pathogen</text><rect x="1040" y="277" width="300" height="47" rx="8" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="1190" y="307" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">Then digests it with enzymes</text><rect x="165" y="626" width="1198" height="48" rx="8" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/><text x="764" y="656" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">Antibodies clump or mark pathogens; phagocytes ingest and digest them.</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE  •  STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
