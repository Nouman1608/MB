<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="871" viewBox="0 0 1528 871" role="img" aria-labelledby="title desc"><title id="title">Diffusion rate: four factors and a fair comparison</title><desc id="desc">Four panels relate surface area, temperature, gradient and distance to diffusion. A two-chamber barrier model illustrates one-variable comparison with controlled solutions, thickness, temperature, volume and timing.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#1c2d4b"/></marker><marker id="red" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#b75e53"/></marker><marker id="blue" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#357ea2"/></marker></defs><rect width="100%" height="100%" fill="#f5f8f7"/><g font-family="Arial, sans-serif"><text x="24" y="58" font-size="38" font-weight="700" text-anchor="start" fill="#1c2d4b">Diffusion rate: four factors and a fair comparison</text><text x="24" y="104" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Edexcel International GCSE Biology 4BI1 • Compare one movement factor at a time</text><g transform="translate(24,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Change one factor at a time</text><rect x="35" y="90" width="310" height="164" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="51" y="125" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">Surface area</text><text x="51" y="166" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">More exposed exchange</text><text x="51" y="194" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">area can increase total</text><text x="51" y="222" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">transfer.</text><rect x="375" y="90" width="310" height="164" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="391" y="125" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">Temperature</text><text x="391" y="166" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Faster random motion can</text><text x="391" y="194" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">increase diffusion rate.</text><rect x="35" y="274" width="310" height="164" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="51" y="309" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">Concentration gradient</text><text x="51" y="350" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">A steeper gradient increases</text><text x="51" y="378" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">net transfer, all else equal.</text><rect x="375" y="274" width="310" height="164" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="391" y="309" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">Diffusion distance</text><text x="391" y="350" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">A shorter barrier/path</text><text x="391" y="378" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">generally allows faster</text><text x="391" y="406" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">transfer.</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">These predictions hold with the other relevant conditions</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">controlled. Surface area and surface-area:volume ratio are</text><text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">different quantities.</text></g><g transform="translate(784,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Plan a fair diffusion comparison</text><rect x="65" y="115" width="590" height="170" rx="0" fill="white" stroke="#1c2d4b" stroke-width="3"/><rect x="347" y="115" width="26" height="170" rx="0" fill="#e2efec" stroke="#1c2d4b" stroke-width="2"/><circle cx="110" cy="150" r="8" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="145" cy="200" r="8" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="190" cy="165" r="8" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="250" cy="220" r="8" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="290" cy="155" r="8" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="430" cy="185" r="8" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="540" cy="155" r="8" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><path d="M270,198 L445,198" fill="none" stroke="#1c2d4b" stroke-width="4" marker-end="url(#arr)"/><path d="M175,95 L175,155" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="85" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Higher concentration</text><path d="M408,319.3 L360,255" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="416" y="327" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Defined barrier area</text><text x="35" y="379" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">Example: vary the exposed barrier area.</text><text x="35" y="413" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Keep solutions, volumes, barrier thickness, temperature and</text><text x="35" y="441" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">sampling time fixed. Measure transfer per time; repeat each</text><text x="35" y="469" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">condition.</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Use the initial rate or maintain a comparable gradient. A</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">stronger colour alone is not a rate unless time and volume are</text><text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">accounted for.</text></g><text x="24" y="849" font-size="19" font-weight="400" text-anchor="start" fill="#1c2d4b">MARLBRIDGE  •  Schematic; structures and particles are not to scale.</text></g></svg>
