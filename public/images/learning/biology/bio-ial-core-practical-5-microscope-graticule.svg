<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="871" viewBox="0 0 1528 871" role="img" aria-labelledby="title desc"><title id="title">Measure cells with a calibrated scale</title><desc id="desc">Two worked measurement routes and an eyepiece graticule calibration, with explicit units and separate examples.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#1c2d4b"/></marker><marker id="red" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#b75e53"/></marker><marker id="blue" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#357ea2"/></marker></defs><rect width="100%" height="100%" fill="#f5f8f7"/><g font-family="Arial, sans-serif"><text x="24" y="58" font-size="38" font-weight="700" text-anchor="start" fill="#1c2d4b">Measure cells with a calibrated scale</text><text x="24" y="104" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Convert units before dividing; recalibrate an eyepiece graticule for each objective.</text><g transform="translate(24,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Image size to actual size</text><rect x="35" y="90" width="650" height="112" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="53" y="119" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">1 Convert to the same unit</text><text x="53" y="150" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">An image measures 24 mm = 24 000 µm.</text><path d="M360,205 L360,217" fill="none" stroke="#357ea2" stroke-width="2" marker-end="url(#blue)"/><rect x="35" y="220" width="650" height="112" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="53" y="249" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">2 Use magnification = image ÷ actual</text><text x="53" y="280" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">At ×400, actual length = 24 000 ÷ 400 = 60 µm.</text><path d="M360,335 L360,347" fill="none" stroke="#357ea2" stroke-width="2" marker-end="url(#blue)"/><rect x="35" y="350" width="650" height="112" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="53" y="379" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">3 A printed scale bar is safer after resizing</text><text x="53" y="410" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">If a 10 µm bar measures 8 mm, a 24 mm cell is 30 µm.</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">The magnification example and scale-bar example are</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">separate images.</text></g><g transform="translate(784,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Calibrate the graticule</text><rect x="35" y="90" width="650" height="112" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="53" y="119" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">1 Align both scales</text><text x="53" y="150" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">At one objective: 40 eyepiece units match 100 µm on the stage</text><text x="53" y="177" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">micrometer.</text><path d="M360,205 L360,217" fill="none" stroke="#357ea2" stroke-width="2" marker-end="url(#blue)"/><rect x="35" y="220" width="650" height="112" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="53" y="249" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">2 Find length per division</text><text x="53" y="280" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">100 ÷ 40 = 2.5 µm per eyepiece unit.</text><path d="M360,335 L360,347" fill="none" stroke="#357ea2" stroke-width="2" marker-end="url(#blue)"/><rect x="35" y="350" width="650" height="112" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="53" y="379" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">3 Measure the specimen</text><text x="53" y="410" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">A cell spanning 18 units is 18 × 2.5 = 45 µm long.</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Higher magnification enlarges detail; resolution determines</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">whether two points can be distinguished.</text></g><text x="24" y="849" font-size="19" font-weight="400" text-anchor="start" fill="#1c2d4b">MARLBRIDGE  •  Schematic; structures and particles are not to scale.</text></g></svg>
