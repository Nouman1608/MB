<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1290" viewBox="0 0 1800 2580" role="img" aria-labelledby="title desc"><title id="title">What changes transpiration? (OxfordAQA International GCSE Biology)</title><desc id="desc">Leaves with arrows for water loss; more arrows mean faster water loss. Temperature: warm air gives more arrows than cool, because evaporation and diffusion are faster. Wind speed: windy air gives more than still air, because vapour is swept away and the gradient stays steep. Humidity: dry air gives more than humid air, because with more vapour in the air the gradient is less steep. No tier labels: 9201 3.2.2d says evaporation is more rapid in hot, dry and windy conditions.</desc><rect width="1800" height="2580" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="88" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle">What changes transpiration?</text>
