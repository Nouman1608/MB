<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="ti de"><defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#315F86"/></marker></defs><title id="ti">Alimentary canal: organ positions and peristalsis</title><desc id="de">Spatial food route from mouth through oesophagus, stomach, duodenum, jejunum, ileum, colon and rectum to anus. The pancreas releases digestive enzymes into the duodenum; bile travels from liver via gall bladder and bile duct. An inset shows circular muscle contracted behind a bolus and relaxed ahead, moving food forward.</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#10233F">Alimentary canal: organ positions and peristalsis</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#5B6D80">Marlbridge • Edexcel International GCSE Biology 4BI1 • The alimentary canal (2.27, 2.28)</text><rect x="52" y="132" width="1424" height="680" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="92" y="168" width="866" height="490" rx="14" fill="#FBFCFD" stroke="#D3DCE2" stroke-width="2"/><text x="525" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">SPATIAL DIGESTIVE ROUTE</text><rect x="151" y="255" width="728" height="338" rx="12" fill="#F7F9FB" stroke="#D3DCE2" stroke-width="2"/><path d="M470 262 C430 290 430 320 470 344 C510 367 510 396 470 421 C430 445 430 474 470 502 C510 526 510 553 470 579" fill="none" stroke="#D49A84" stroke-width="33" stroke-linecap="round"/><ellipse cx="470" cy="269" rx="26" ry="15" fill="#F2C7B4" stroke="#A56E5B" stroke-width="2"/><text x="234" y="284" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">Mouth</text><text x="234" y="341" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">Oesophagus</text><ellipse cx="560" cy="346" rx="58" ry="41" fill="#E8C9C0" stroke="#A56E5B" stroke-width="2"/><text x="560" y="352" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">Stomach</text><path d="M522 410Q665 391 710 425L710 539Q658 568 524 548" fill="none" stroke="#D49A84" stroke-width="21" stroke-linecap="round"/><text x="257" y="491" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">Colon</text><text x="313" y="558" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">Rectum → anus</text><path d="M475 292L475 326" fill="none" stroke="#315F86" stroke-width="3" marker-end="url(#ar)" stroke-linecap="round"/><path d="M500 375L500 397" fill="none" stroke="#315F86" stroke-width="3" marker-end="url(#ar)" stroke-linecap="round"/><path d="M580 380L630 404" fill="none" stroke="#315F86" stroke-width="3" marker-end="url(#ar)" stroke-linecap="round"/><path d="M690 435L690 455" fill="none" stroke="#315F86" stroke-width="3" marker-end="url(#ar)" stroke-linecap="round"/><path d="M690 485L690 505" fill="none" stroke="#315F86" stroke-width="3" marker-end="url(#ar)" stroke-linecap="round"/><rect x="118" y="220" width="232" height="38" rx="7" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="234" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#10233F">Food pathway</text><rect x="720" y="255" width="190" height="68" rx="8" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/><text x="815" y="282" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#10233F">Liver → gall bladder</text><text x="815" y="305" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#20314B">bile duct → duodenum</text><path d="M720 328L650 394" fill="none" stroke="#C9A227" stroke-width="3" marker-end="url(#ar)" stroke-linecap="round"/><rect x="722" y="554" width="188" height="58" rx="8" fill="#E8F1F4" stroke="#315F86" stroke-width="2"/><text x="816" y="578" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#10233F">Pancreas → duodenum</text><path d="M722 550L674 431" fill="none" stroke="#315F86" stroke-width="3" marker-end="url(#ar)" stroke-linecap="round"/><text x="760" y="417" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#10233F">Duodenum</text><text x="760" y="470" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#10233F">Jejunum</text><text x="760" y="523" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#10233F">Ileum</text><rect x="990" y="168" width="448" height="490" rx="14" fill="#FBFCFD" stroke="#D3DCE2" stroke-width="2"/><text x="1214" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">PERISTALSIS • SIDE VIEW</text><rect x="1031" y="251" width="367" height="169" rx="40" fill="#EAF5FB" stroke="#315F86" stroke-width="2"/><rect x="1048" y="280" width="331" height="111" rx="28" fill="#F4D6C6" stroke="#C98E76" stroke-width="2"/><ellipse cx="1212" cy="335" rx="26" ry="24" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/><text x="1212" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#10233F">food</text><path d="M1049 280Q1084 287 1084 335Q1084 383 1049 391M1380 280Q1345 287 1345 335Q1345 383 1380 391" fill="none" stroke="#C44949" stroke-width="8"/><text x="1066" y="445" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#C44949">Contracted behind bolus</text><text x="1362" y="445" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#397D64">Relaxed ahead</text><path d="M1180 470L1300 470" fill="none" stroke="#315F86" stroke-width="4" marker-end="url(#ar)" stroke-linecap="round"/><text x="1240" y="500" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#315F86">net movement</text><text x="1214" y="540" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#20314B">Circular and longitudinal muscle layers</text><rect x="116" y="690" width="1294" height="76" rx="8" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/><text x="763" y="720" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">Jejunum lies between duodenum and ileum; “ileum” is not the entire remaining small intestine.</text><text x="763" y="747" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#20314B">Digestive secretions enter the duodenum from the pancreas and bile duct.</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE  •  STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
