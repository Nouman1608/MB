<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Photophosphorylation: cyclic and non-cyclic electron flow</title><desc id="desc">Compares PSI-only cyclic flow with PSII-to-PSI non-cyclic flow, showing ATP, reduced NADP and water photolysis outcomes.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#168C8C"/></marker><marker id="arrGold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#D4AA27"/></marker></defs><rect width="1600" height="1000" fill="#F4F8F7"/><text x="800" y="57" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#17324D" text-anchor="middle">Photophosphorylation: cyclic and non-cyclic electron flow</text><text x="800" y="92" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#526778" text-anchor="middle">Cambridge International AS &amp; A Level Biology 9700</text><rect x="55" y="135" width="720" height="680" rx="16" fill="#FFFFFF" stroke="#CAD7DC" stroke-width="2"/><rect x="825" y="135" width="720" height="680" rx="16" fill="#FFFFFF" stroke="#CAD7DC" stroke-width="2"/><text x="415" y="180" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#168C8C" text-anchor="middle">CYCLIC PHOTOPHOSPHORYLATION</text><text x="1185" y="180" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#3983B8" text-anchor="middle">NON-CYCLIC PHOTOPHOSPHORYLATION</text><line x1="95" y1="390" x2="740" y2="390" stroke="#8EAAA9" stroke-width="9"/><line x1="95" y1="425" x2="740" y2="425" stroke="#8EAAA9" stroke-width="4"/><rect x="145" y="315" width="175" height="125" rx="18" fill="#E5F2F0" stroke="#168C8C" stroke-width="3"/><text x="232" y="360" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#168C8C" text-anchor="middle">PSI</text><text x="232" y="397" font-family="Arial,sans-serif" font-size="17" font-weight="500" fill="#17324D" text-anchor="middle">light raises e⁻</text><path d="M320 345 C420 270 555 270 610 345 C665 420 565 500 445 480 C360 465 330 420 320 400" fill="none" stroke="#168C8C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><line x1="465" y1="284" x2="510" y2="300" stroke="#168C8C" stroke-width="3" marker-end="url(#arr)"/><rect x="480" y="540" width="225" height="86" rx="16" fill="#FFF8E2" stroke="#D4AA27" stroke-width="2"/><text x="592" y="576" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#17324D" text-anchor="middle">ATP made</text><text x="592" y="606" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#526778" text-anchor="middle">electrons return to PSI</text><text x="415" y="700" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#D76C61" text-anchor="middle">No water photolysis • no O₂ • no reduced NADP</text><line x1="865" y1="390" x2="1505" y2="390" stroke="#8EAAA9" stroke-width="9"/><line x1="865" y1="425" x2="1505" y2="425" stroke="#8EAAA9" stroke-width="4"/><rect x="890" y="315" width="145" height="125" rx="16" fill="#E5F2F0" stroke="#168C8C" stroke-width="3"/><text x="962" y="360" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#168C8C" text-anchor="middle">PSII</text><text x="962" y="397" font-family="Arial,sans-serif" font-size="17" font-weight="500" fill="#17324D" text-anchor="middle">light</text><rect x="1135" y="315" width="145" height="125" rx="16" fill="#EDF5FA" stroke="#3983B8" stroke-width="3"/><text x="1207" y="360" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#3983B8" text-anchor="middle">PSI</text><text x="1207" y="397" font-family="Arial,sans-serif" font-size="17" font-weight="500" fill="#17324D" text-anchor="middle">light</text><rect x="1360" y="315" width="150" height="125" rx="16" fill="#FFF8E2" stroke="#D4AA27" stroke-width="3"/><text x="1435" y="360" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#D4AA27" text-anchor="middle">NADP⁺</text><text x="1435" y="397" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="#17324D" text-anchor="middle">→ reduced NADP</text><line x1="1035" y1="375" x2="1130" y2="375" stroke="#168C8C" stroke-width="4" marker-end="url(#arr)"/><line x1="1280" y1="375" x2="1350" y2="375" stroke="#168C8C" stroke-width="4" marker-end="url(#arr)"/><rect x="875" y="515" width="215" height="145" rx="16" fill="#FDF0EE" stroke="#D76C61" stroke-width="2"/><text x="982" y="550" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#D76C61" text-anchor="middle">Water</text><text x="982" y="585" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#17324D" text-anchor="middle">2H₂O → 4H⁺ + 4e⁻</text><text x="982" y="615" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#17324D" text-anchor="middle">O₂ released</text><line x1="982" y1="515" x2="955" y2="450" stroke="#D76C61" stroke-width="4" marker-end="url(#arr)"/><rect x="1140" y="535" width="320" height="100" rx="16" fill="#FFF8E2" stroke="#D4AA27" stroke-width="2"/><text x="1300" y="576" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#17324D" text-anchor="middle">ATP also made</text><text x="1300" y="607" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#526778" text-anchor="middle">electrons do not return to PSII</text><text x="1190" y="720" font-family="Arial,sans-serif" font-size="17" font-weight="600" fill="#17324D" text-anchor="middle">PSII electrons are replaced by electrons from water.</text><text x="800" y="902" text-anchor="middle" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#DCE5E5" opacity="0.62">MARLBRIDGE STUDY RESOURCES</text><line x1="48" y1="918" x2="1552" y2="918" stroke="#D4AA27" stroke-width="3"/><text x="48" y="954" font-family="Arial,sans-serif" font-size="15" font