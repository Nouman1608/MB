<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1120" viewBox="0 0 1800 2240" role="img" aria-labelledby="title desc"><title id="title">Active transport</title><desc id="desc">A membrane separates a low concentration of particles above from a high concentration below. (1) An orange particle on the low side binds a carrier protein; (2) energy from respiration, shown as a lightning bolt, changes the carrier and the particle is released on the high side. Particles move from low to high concentration, against the gradient, which needs energy from respiration; an example is ion uptake by root hairs. No tier labels: active transport is on both Edexcel papers (4BI1 2.15) and in OxfordAQA 9201 3.1.5f-g, which is not tiered. The key line about the protein carrier is greyed with a note that it is not required by Edexcel or OxfordAQA.</desc><rect width="1800" height="2240" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="88" font-size="68" font-weight="700" fill="#1E2B47" text-anchor="middle">Active transport</text>
<text x="900" y="164" font-size="44" fill="#4B5B72" text-anchor="middle">One carrier protein in a membrane, schematic</text>
