<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1140" viewBox="0 0 1800 2280" role="img" aria-labelledby="title desc"><title id="title">Digestive enzymes and their products (Edexcel International GCSE Biology)</title><desc id="desc">Three rows show a large insoluble molecule, an enzyme and the small soluble products: amylase turns starch into simple sugars; protease turns protein into amino acids; lipase turns fat into glycerol and fatty acids. A further panel shows amylase turning starch into maltose and maltase, at the lining of the gut, turning maltose into glucose (4BI1 statement 2.29, both papers). No tier labels.</desc><rect width="1800" height="2280" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="105" font-size="68" font-weight="700" fill="#1E2B47" text-anchor="middle">Enzymes cut big molecules</text>
<text x="900" y="180" font-size="44" fill="#4B5B72" text-anchor="middle">into small, soluble ones</text>
<text x="62" y="319" font-size="46" font-weight="700" fill="#4B5B72">large, insoluble</text>
