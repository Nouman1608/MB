<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Polyploidy: compare chromosome sets in crosses</title><desc id="desc">The diagram compares tetraploid by tetraploid gametes (14 plus 14, usually restoring 28 chromosomes) with tetraploid by diploid gametes (14 plus 7, producing 21 chromosomes). Triploid meiosis often gives unbalanced gametes; outcomes depend on species and pairing.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#168C8C"/></marker><marker id="arrowN" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#17324D"/></marker></defs><rect width="1600" height="1000" fill="#F4F8F7"/><text x="800" y="60" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#17324D" text-anchor="middle">Polyploidy: compare chromosome sets in crosses</text><text x="800" y="96" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#526778" text-anchor="middle">AP Biology • Speciation • worked example, 2n = 14</text><rect x="55" y="140" width="1490" height="700" rx="14" fill="#fff" stroke="#CAD7DC" stroke-width="2"/><text x="95" y="190" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17324D" text-anchor="start">Example with base chromosome set x = 7 (2n = 14)</text><rect x="90" y="245" width="650" height="455" rx="16" fill="#fff" stroke="#CAD7DC" stroke-width="2"/><text x="415" y="285" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#168C8C" text-anchor="middle">TETRAPLOID × TETRAPLOID</text><text x="145" y="355" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#17324D" text-anchor="start">4x parent = 28</text><circle cx="250" cy="405" r="19" fill="#168C8C" stroke="#168C8C" stroke-width="2"/><circle cx="312" cy="405" r="19" fill="#3983B8" stroke="#3983B8" stroke-width="2"/><circle cx="374" cy="405" r="19" fill="#E1AA37" stroke="#E1AA37" stroke-width="2"/><circle cx="436" cy="405" r="19" fill="#D76C61" stroke="#D76C61" stroke-width="2"/><text x="415" y="463" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#17324D" text-anchor="middle">Meiosis usually produces 2x = 14 gametes</text><path d="M250 500 L350 560" fill="none" stroke="#168C8C" stroke-width="4" marker-end="url(#arrow)"/><path d="M435 500 L515 560" fill="none" stroke="#3983B8" stroke-width="4" marker-end="url(#arrow)"/><text x="435" y="610" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#17324D" text-anchor="middle">14 + 14 → 4x = 28</text><text x="415" y="650" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#526778" text-anchor="middle">Even chromosome sets can pair; fertility is typical, not guaranteed.</text><rect x="790" y="245" width="720" height="455" rx="16" fill="#fff" stroke="#CAD7DC" stroke-width="2"/><text x="1150" y="285" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#D76C61" text-anchor="middle">TETRAPLOID × DIPLOID</text><text x="860" y="355" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#168C8C" text-anchor="start">2x gamete = 14</text><text x="1220" y="355" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#3983B8" text-anchor="start">x gamete = 7</text><circle cx="930" cy="405" r="17" fill="#168C8C" stroke="#168C8C" stroke-width="2"/><circle cx="978" cy="405" r="17" fill="#3983B8" stroke="#3983B8" stroke-width="2"/><circle cx="1026" cy="405" r="17" fill="#E1AA37" stroke="#E1AA37" stroke-width="2"/><circle cx="1074" cy="405" r="17" fill="#D76C61" stroke="#D76C61" stroke-width="2"/><circle cx="1270" cy="405" r="17" fill="#168C8C" stroke="#168C8C" stroke-width="2"/><circle cx="1318" cy="405" r="17" fill="#3983B8" stroke="#3983B8" stroke-width="2"/><path d="M1085 440 L1150 495" fill="none" stroke="#E1AA37" stroke-width="4" marker-end="url(#arrow)"/><path d="M1335 440 L1270 495" fill="none" stroke="#E1AA37" stroke-width="4" marker-end="url(#arrow)"/><text x="1150" y="535" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#17324D" text-anchor="middle">3x = 21 triploid offspring</text><text x="1150" y="580" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#17324D" text-anchor="middle">Three homologues can segregate irregularly</text><text x="1150" y="610" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#17324D" text-anchor="middle">→ often unbalanced gametes and reduced fertility</text><text x="1150" y="650" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#526778" text-anchor="middle">Outcome varies with species and chromosome pairing.</text><rect x="150" y="735" width="1300" height="65" rx="12" fill="#FFF4D6" stroke="#E1AA37" stroke-width="2"/><text x="800" y="775" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#17324D" text-anchor="middle">A diagram of chromosome-set counts; it does not imply every polyploid is fertile or sterile.</text><text x="42" y="938" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#526778" text-anchor="start">Fictional example • chromosome-set counts shown schematically</text><path d="M40 918H1560" stroke="#E1AA37" stroke-width="3"/><text x="800" y="898" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#17324D" opacity=".07" text-anchor="middle">MARLBRIDGE STUDY RESOURCES</text><image href="data:image/svg+xml;base64," x="1365" y="923" width="190" height="54" preserveAspectRatio="xMaxYMid meet"/><text x="42" y="980" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#526778" text-anchor="start">MARLBRIDGE • STUDY RESOURCE</text></svg>