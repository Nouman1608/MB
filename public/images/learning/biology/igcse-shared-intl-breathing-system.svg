<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 1800 1800" role="img" aria-labelledby="title desc"><title id="title">The breathing system</title><desc id="desc">Front view of the thorax. Air enters through the nose or mouth and passes (1) the larynx, (2) the trachea, held open by cartilage rings, (3) the bronchi, (4) the bronchioles and (5) the alveoli in the lungs. The ribs, intercostal muscles and diaphragm surround the lungs. No tier labels: these structures are on both Edexcel papers (4BI1 2.46) and in OxfordAQA 9201 3.2.5a, which is not tiered. The larynx and cartilage rings are greyed with a note that they are not required by Edexcel or OxfordAQA.</desc><rect width="1800" height="1800" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="88" font-size="68" font-weight="700" fill="#1E2B47" text-anchor="middle">The breathing system</text>
