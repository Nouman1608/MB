<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1150" viewBox="0 0 1800 2300" role="img" aria-labelledby="title desc"><title id="title">Inside a fermenter (Edexcel International GCSE Biology)</title><desc id="desc">An industrial fermenter (4BI1 5.8, both papers): nutrients enter at the top and gas leaves; a motor turns paddles that stir the culture; pH and temperature probes monitor conditions; a water jacket with cold water in and warm water out removes heat; sterile air is bubbled in at the bottom; product is drawn off at the bottom. Below, fermenters make insulin by GM bacteria (4BI1 5.14); penicillin by Penicillium mould and mycoprotein by Fusarium fungus are greyed and marked not required by Edexcel. No tier labels.</desc><rect width="1800" height="2300" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="88" font-size="68" font-weight="700" fill="#1E2B47" text-anchor="middle">Inside a fermenter</text>
