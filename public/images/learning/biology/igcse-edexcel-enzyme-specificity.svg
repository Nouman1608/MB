<svg xmlns="http://www.w3.org/2000/svg" width="900" height="780" viewBox="0 0 1800 1560" role="img" aria-labelledby="title desc"><title id="title">Why each enzyme is specific (Edexcel International GCSE Biology)</title><desc id="desc">Top: fat has a shape complementary to the active site of lipase, so it fits, a complex forms and the reaction happens. Bottom: starch does not fit the active site of lipase, so no complex forms and there is no reaction. The words about the complex are greyed with a note that the term enzyme-substrate complex is not required by Edexcel; the active site is in 4BI1 statements 2.11 and 2.13, on both papers. No tier labels.</desc><rect width="1800" height="1560" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="92" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle">Why each enzyme is specific</text>
<text x="900" y="172" font-size="44" fill="#4B5B72" text-anchor="middle">Only a complementary shape fits</text>
