" r="8" fill="#73aaa5" stroke="#1c2d4b" stroke-width="1"/><circle cx="382" cy="328" r="8" fill="#73aaa5" stroke="#1c2d4b" stroke-width="1"/><path d="M346,328 h28" fill="none" stroke="#1c2d4b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="338" cy="354" r="8" fill="#73aaa5" stroke="#1c2d4b" stroke-width="1"/><circle cx="382" cy="354" r="8" fill="#73aaa5" stroke="#1c2d4b" stroke-width="1"/><path d="M346,354 h28" fill="none" stroke="#1c2d4b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="338" cy="380" r="8" fill="#73aaa5" stroke="#1c2d4b" stroke-width="1"/><circle cx="382" cy="380" r="8" fill="#73aaa5" stroke="#1c2d4b" stroke-width="1"/><path d="M346,380 h28" fill="none" stroke="#1c2d4b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="338" cy="406" r="8" fill="#73aaa5" stroke="#1c2d4b" stroke-width="1"/><circle cx="382" cy="406" r="8" fill="#73aaa5" stroke="#1c2d4b" stroke-width="1"/><path d="M346,406 h28" fill="none" stroke="#1c2d4b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="100" cy="170" r="13" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><circle cx="230" cy="320" r="13" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><circle cx="440" cy="150" r="13" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><circle cx="498" cy="150" r="13" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><circle cx="556" cy="150" r="13" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><circle cx="614" cy="150" r="13" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><circle cx="440" cy="215" r="13" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><circle cx="498" cy="215" r="13" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><circle cx="556" cy="215" r="13" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><circle cx="614" cy="215" r="13" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><circle cx="440" cy="280" r="13" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><circle cx="498" cy="280" r="13" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><circle cx="556" cy="280" r="13" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><circle cx="614" cy="280" r="13" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><circle cx="440" cy="345" r="13" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><circle cx="498" cy="345" r="13" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><circle cx="556" cy="345" r="13" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><circle cx="614" cy="345" r="13" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><rect x="327" y="220" width="66" height="90" rx="18" fill="white" stroke="#1c2d4b" stroke-width="4"/><path d="M235,265 L490,265" fill="none" stroke="#1c2d4b" stroke-width="4" marker-end="url(#arr)"/><text x="180" y="95" font-size="22" font-weight="700" text-anchor="middle" fill="#1c2d4b">Lower ion concentration</text><text x="535" y="95" font-size="22" font-weight="700" text-anchor="middle" fill="#1c2d4b">Higher ion concentration</text><path d="M221.0,427.3 L327,275" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="75" y="435" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Carrier protein</text><path d="M442,427.3 L382,370" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="450" y="435" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Cell membrane</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">A carrier protein moves ions from lower to higher</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">concentration. This requires energy from respiration.</text></g><g transform="translate(784,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Example: mineral-ion uptake</text><path d="M150,330 C160,235 220,220 290,230 H435 Q490,230 490,280 Q490,330 435,330 H250 Q210,335 195,375 Z" fill="#e2efec" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M150,338 C80,350 50,315 70,280 C80,260 120,260 160,270" fill="#e2efec" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="70" cy="160" r="12" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><circle cx="130" cy="195" r="12" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><circle cx="235" cy="260" r="12" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><circle cx="290" cy="260" r="12" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><circle cx="345" cy="260" r="12" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><circle cx="400" cy="260" r="12" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><circle cx="235" cy="295" r="12" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><circle cx="290" cy="295" r="12" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><circle cx="345" cy="295" r="12" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><circle cx="400" cy="295" r="12" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><path d="M130,195 L235,265" fill="none" stroke="#1c2d4b" stroke-width="4" marker-end="url(#arr)"/><text x="100" y="120" font-size="25" font-weight="700" text-anchor="middle" fill="#1c2d4b">Soil</text><path d="M372,172.3 L340,230" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="380" y="180" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Root hair cell</text><text x="360" y="405" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">Mineral ions, e.g. nitrate</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Root hairs can take up mineral ions even when their</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">concentration is lower in the soil than inside the root hair cell.</text><text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Water uptake is osmosis, a different process.</text></g><text x="24" y="849" font-size="19" font-weight="400" text-anchor="start" fill="#1c2d4b">MARLBRIDGE  •  Schematic; structures and particles are not to scale.</text></g></svg>
