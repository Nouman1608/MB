<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="871" viewBox="0 0 1528 871" role="img" aria-labelledby="title desc"><title id="title">Active transport: carriers and energy</title><desc id="desc">A carrier moves mineral ions against a concentration gradient using energy from respiration. Root hair cells can accumulate ions from dilute soil solution.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#1c2d4b"/></marker><marker id="red" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#b75e53"/></marker><marker id="blue" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#357ea2"/></marker></defs><rect width="100%" height="100%" fill="#f5f8f7"/><g font-family="Arial, sans-serif"><text x="24" y="58" font-size="38" font-weight="700" text-anchor="start" fill="#1c2d4b">Active transport: carriers and energy</text><text x="24" y="104" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Carrier-mediated ion uptake • Edexcel International GCSE Biology 4BI1</text><g transform="translate(24,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Transport against a gradient</text><rect x="40" y="110" width="640" height="300" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2"/><rect x="340" y="110" width="40" height="300" rx="0" fill="#e2efec" stroke="#cad7d5" stroke-width="1"/><circle cx="338" cy="120" r="8" fill="#73aaa5" stroke="#1c2d4b" stroke-width="1"/><circle cx="382" cy="120" r="8" fill="#73aaa5" stroke="#1c2d4b" stroke-width="1"/><path d="M346,120 h28" fill="none" stroke="#1c2d4b" stroke-width="2" stroke-linecap="round" stroke-linejoin=