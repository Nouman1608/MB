<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1270" viewBox="0 0 1800 2540" role="img" aria-labelledby="title desc"><title id="title">How a nephron makes urine (Edexcel International GCSE Biology: Paper 2 only)</title><desc id="desc">The whole figure is marked Paper 2 only: the nephron, ultrafiltration and selective reabsorption are statements 2.74B to 2.77B and 2.79B of 4BI1. (1) Filtration: blood enters the glomerulus inside the capsule, and water, glucose, urea and ions are filtered into the capsule; blood cells and protein stay in the blood. (2) Reabsorption along the tubule: all the glucose, most of the water and some ions go back into the blood, which leaves as blood out. (3) The collecting duct carries urine, urea with excess water and excess ions and no glucose, to the ureter.</desc><rect width="1800" height="2540" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="88" font-size="68" font-weight="700" fill="#1E2B47" text-anchor="middle">How a nephron makes urine</text>
<text x="900" y="164" font-size="44" fill="#4B5B72" text-anchor="middle">One nephron, schematic</text>
