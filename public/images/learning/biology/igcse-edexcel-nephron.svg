<text x="80" y="446" font-size="46" font-weight="700" fill="#B9632F">Blood in</text>
<text x="720" y="404" font-size="50" font-weight="700" fill="#1E2B47" text-anchor="middle">Glomerulus</text>
<line x1="720" y1="430" x2="720" y2="600" stroke="#1E2B47" stroke-width="4" stroke-linecap="round"/>
<text x="80" y="696" font-size="50" font-weight="700" fill="#1E2B47">Capsule</text>
<line x1="320" y1="686" x2="530" y2="686" stroke="#1E2B47" stroke-width="4" stroke-linecap="round"/>
<circle cx="120" cy="830" r="38" fill="#1E2B47"/><text x="120" y="845" font-size="42" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="190" y="816" font-size="50" font-weight="700" fill="#1E2B47">Filtration</text>
<text x="190" y="880" font-size="42" fill="#1E2B47">at glomerulus</text>
<text x="80" y="1016" font-size="50" font-weight="700" fill="#1E2B47">Tubule</text>
<line x1="300" y1="1000" x2="640" y2="1000" stroke="#1E2B47" stroke-width="4" stroke-linecap="round"/>
<text x="1180" y="858" font-size="44" fill="#1E2B47">Blood cells and</text>
<text x="1180" y="914" font-size="44" fill="#1E2B47">protein stay in</text>
<text x="1180" y="970" font-size="44" fill="#1E2B47">the blood</text>
<text x="980" y="1420" font-size="46" font-weight="700" fill="#B9632F">Blood out</text>
<circle cx="120" cy="1582" r="38" fill="#1E2B47"/><text x="120" y="1597" font-size="42" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="190" y="1566" font-size="50" font-weight="700" fill="#1E2B47">Reabsorption</text>
<text x="190" y="1636" font-size="42" fill="#1E2B47">all glucose</text>
<text x="190" y="1692" font-size="42" fill="#1E2B47">most water</text>
<text x="190" y="1748" font-size="42" fill="#1E2B47">some ions</text>
<text x="1396" y="1896" font-size="50" font-weight="700" fill="#1E2B47" text-anchor="end">Collecting</text>
<text x="1396" y="1958" font-size="50" font-weight="700" fill="#1E2B47" text-anchor="end">duct</text>
<text x="1396" y="2020" font-size="42" fill="#1E2B47" text-anchor="end">to the ureter</text>
<circle cx="120" cy="2290" r="38" fill="#1E2B47"/><text x="120" y="2305" font-size="42" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="190" y="2276" font-size="46" font-weight="700" fill="#1E2B47">Urine: urea, excess water,</text>
<text x="190" y="2340" font-size="46" font-weight="700" fill="#1E2B47">excess ions. No glucose.</text>
<circle cx="162" cy="2458" r="18" fill="#D6B22F" stroke="#1E2B47" stroke-width="5"/>
<text x="200" y="2474" font-size="44" fill="#1E2B47">glucose</text>
