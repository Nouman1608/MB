<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="title desc"><title id="title">Agar plate: control and inhibition-zone measurement</title><desc id="desc">Schematic agar plate with an even bacterial lawn, an antiseptic disc surrounded by a clear inhibition zone, and a sterile-water control disc without a clear zone. A ruler measures the full outside diameter across the treated disc. If calculating clear agar only, subtract the paper-disc area. Diffusion affects the zone size.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#315F86"/></marker></defs><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#10233F">Agar plate: control and inhibition-zone measurement</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#5B6D80">Marlbridge • AQA GCSE Biology 8461 • Required practical 2</text><rect x="52" y="132" width="1424" height="680" rx="18" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="764" y="176" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">SCHEMATIC TOP VIEW • not to scale</text>
<!-- plate --> <circle cx="500" cy="470" r="236" fill="#EAF5FB" stroke="#315F86" stroke-width="5"/><circle cx="500" cy="470" r="218" fill="#FFF9E8" stroke="#D9C992" stroke-width="2"/><text x="500" y="255" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#315F86">Even bacterial lawn</text>
<!-- colonies --> <g fill="#AFC9A5" opacity=".9"><circle cx="382" cy="330" r="4"/><circle cx="452" cy="302" r="4"/><circle cx="545" cy="321" r="4"/><circle cx="630" cy="352" r="4"/><circle cx="340" cy="399" r="4"/><circle cx="422" cy="390" r="4"/><circle cx="582" cy="390" r="4"/><circle cx="666" cy="431" r="4"/><circle cx="360" cy="515" r="4"/><circle cx="410" cy="596" r="4"/><circle cx="489" cy="636" r="4"/><circle cx="585" cy="590" r="4"/><circle cx="665" cy="538" r="4"/><circle cx="551" cy="530" r="4"/><circle cx="335" cy="470" r="4"/></g>
<!-- antiseptic zone, full measured diameter 120 mm arbitrary --> <circle cx="424" cy="464" r="80" fill="#E7F4F0" stroke="#168C8C" stroke-width="3" stroke-dasharray="8 6"/><circle cx="424" cy="464" r="26" fill="#FFFFFF" stroke="#10233F" stroke-width="3"/><text x="424" y="469" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#10233F">DISC</text><path d="M344 464H504" fill="none" stroke="#C44949" stroke-width="3"/><path d="M344 454V474M504 454V474" stroke="#C44949" stroke-width="3"/><text x="424" y="440" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#C44949">measure full clear-zone diameter</text><text x="424" y="565" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#168C8C">Clear zone: no visible growth</text>
<!-- control disc --> <circle cx="585" cy="515" r="26" fill="#FFFFFF" stroke="#10233F" stroke-width="3"/><text x="585" y="520" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#10233F">DISC</text><path d="M610 516L681 548" stroke="#315F86" stroke-width="2"/><text x="690" y="554" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#315F86">Sterile-water control</text><text x="690" y="575" font-family="Arial,sans-serif" font-size="14" fill="#5B6D80">No clear zone shown</text>
<!-- side notes --> <rect x="840" y="205" width="575" height="156" rx="14" fill="#EAF5F1" stroke="#168C8C" stroke-width="2"/><text x="870" y="244" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">What the plate shows</text><text x="870" y="280" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B">The clear zone is where growth was stopped or bacteria were killed.</text><text x="870" y="310" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#20314B">Compare treated discs with a sterile-water control.</text><text x="870" y="340" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#20314B">Use equal disc size, soaking, organism and incubation conditions.</text>
<rect x="840" y="386" width="575" height="173" rx="14" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/><text x="870" y="426" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">Area calculation</text><text x="870" y="464" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#20314B">If diameter is measured edge-to-edge across the whole clear zone:</text><text x="870" y="500" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">A = πr², where r = diameter ÷ 2</text><text x="870" y="532" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#20314B">This includes the disc footprint. For clear agar only, subtract π × disc radius².</text>
<rect x="840" y="584" width="575" height="145" rx="14" fill="#FCEEEE" stroke="#C44949" stroke-width="2"/><text x="870" y="624" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">Interpret with care</text><text x="870" y="662" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#20314B">Zone size depends on diffusion through agar as well as antimicrobial</text><text x="870" y="685" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#20314B">activity; it does not alone rank the intrinsic potency of different</text><text x="870" y="708" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#20314B">compounds.</text>
<rect x="126" y="755" width="1276" height="38" rx="8" fill="#F3F6F6" stroke="#D3DCE2"/><text x="764" y="781" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#20314B">Educational schematic only. Follow the school practical protocol and aseptic-safety instructions.</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE  •  STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
