<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="ti de"><defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#315F86"/></marker></defs><title id="ti">Photosynthesis practicals: gas collection and leaf controls</title><desc id="de">Pondweed in water containing sodium hydrogencarbonate is illuminated at a measured distance. Oxygen bubbles may be counted or collected in an inverted measuring cylinder; a water beaker between lamp and plant reduces heating. Three leaf tests show starch only in illuminated regions, in the no-soda-lime control, and in green regions of variegated leaves.</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#10233F">Photosynthesis practicals: gas collection and leaf controls</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#5B6D80">Marlbridge • Edexcel International GCSE Biology 4BI1 • The photosynthesis practicals (2.23)</text><rect x="52" y="132" width="1424" height="680" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="88" y="168" width="730" height="470" rx="14" fill="#FBFCFD" stroke="#D3DCE2" stroke-width="2"/><text x="453" y="202" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">A • PONDWEED OXYGEN PRACTICAL</text><rect x="136" y="250" width="627" height="304" rx="18" fill="#EAF5FB" stroke="#315F86" stroke-width="2"/><path d="M200 462 Q340 445 480 462T700 462V545H200Z" fill="#DDF0F4" stroke="#8ABCC8" stroke-width="2"/><text x="445" y="513" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#315F86">water + sodium hydrogencarbonate</text><path d="M470 290L470 455" stroke="#397D64" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M470 316Q435 350 470 378Q505 350 470 316Z" fill="#93C47D" stroke="#397D64" stroke-width="2"/><ellipse cx="515" cy="405" rx="8" ry="8" fill="#FFFFFF" stroke="#315F86" stroke-width="2"/><ellipse cx="506" cy="377" rx="6" ry="6" fill="#FFFFFF" stroke="#315F86" stroke-width="2"/><ellipse cx="500" cy="352" rx="5" ry="5" fill="#FFFFFF" stroke="#315F86" stroke-width="2"/><rect x="630" y="288" width="76" height="190" rx="9" fill="#FFFFFF" stroke="#315F86" stroke-width="2"/><path d="M633 409H703V470H633Z" fill="#DDF0F4"/><text x="668" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#10233F">inverted</text><text x="668" y="494" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#10233F">measuring cylinder</text><path d="M518 397L627 404" fill="none" stroke="#315F86" stroke-width="3" marker-end="url(#ar)" stroke-linecap="round"/><rect x="126" y="272" width="74" height="59" rx="8" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/><text x="163" y="298" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">Lamp</text><text x="163" y="317" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#20314B">distance set</text><path d="M199 303L380 303" fill="none" stroke="#C9A227" stroke-width="3" marker-end="url(#ar)" stroke-linecap="round"/><path d="M292 277H338V336L330 350H300L292 336Z" fill="#DFF1F7" fill-opacity=".65" stroke="#315F86" stroke-width="3"/><path d="M296 319H334V335L327 346H303L296 335Z" fill="#B8E0EC" stroke="none"/><rect x="245" y="223" width="242" height="38" rx="7" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="366" y="248" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#10233F">beaker of water: reduces radiant heating</text><path d="M310 261L310 276" stroke="#315F86" stroke-width="2" fill="none" stroke-linecap="round"/><rect x="110" y="563" width="685" height="51" rx="7" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/><text x="452" y="595" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#10233F">Measure bubbles per minute or collect gas volume; oxygen relights a glowing splint.</text><rect x="852" y="168" width="588" height="470" rx="14" fill="#FBFCFD" stroke="#D3DCE2" stroke-width="2"/><text x="1146" y="202" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">B • TEST A LEAF FOR STARCH</text><rect x="890" y="235" width="512" height="108" rx="10" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/><text x="1146" y="271" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">Light: foil covers part of a destarched leaf</text><text x="1146" y="302" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#20314B">After iodine: exposed part blue-black; covered part brown</text><path d="M1090 323Q1145 296 1194 323Q1145 350 1090 323Z" fill="#93C47D" stroke="#397D64" stroke-width="2"/><rect x="1090" y="309" width="48" height="28" fill="#BCC7CF"/><rect x="890" y="363" width="512" height="108" rx="10" fill="#EAF5F1" stroke="#397D64" stroke-width="2"/><text x="1146" y="399" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">Carbon dioxide: soda lime absorber vs control</text><text x="1146" y="430" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#20314B">After iodine: control forms starch; absorber plant does not</text><rect x="890" y="491" width="512" height="108" rx="10" fill="#F4EFF8" stroke="#725C8E" stroke-width="2"/><text x="1146" y="527" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">Chlorophyll: green and white regions of variegated leaf</text><text x="1146" y="558" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#20314B">After iodine: green region blue-black; white region brown</text><rect x="112" y="665" width="1296" height="110" rx="9" fill="#FCEEEE" stroke="#C44949" stroke-width="2"/><text x="760" y="701" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">Safe starch-test sequence: heat ethanol only in a hot-water bath, with any flame off.</text><text x="760" y="731" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20314B">Destarching time is species/condition dependent; monitor temperature during the light experiment.</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE  •  STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
