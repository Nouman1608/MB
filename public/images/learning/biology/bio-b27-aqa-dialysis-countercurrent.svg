<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="ti de"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#315F86"/></marker></defs><title id="ti">Dialysis: exchange across a partially permeable membrane</title><desc id="de">Simplified counter-current dialysis exchanger: blood and dialysis fluid flow in opposite directions on either side of a partially permeable membrane. Urea diffuses from blood into dialysis fluid. Dialysis fluid has the same glucose and ion concentrations as normal blood, so there is no net loss of those solutes; blood cells and large proteins remain in blood.</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#10233F">Dialysis: exchange across a partially permeable membrane</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#5B6D80">Marlbridge • AQA GCSE Biology 8461 • Water and nitrogen balance (4.5.3.3)</text><rect x="52" y="132" width="1424" height="680" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="92" y="168" width="1344" height="432" rx="14" fill="#FBFCFD" stroke="#D3DCE2" stroke-width="2"/><text x="764" y="204" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#10233F">SIMPLIFIED COUNTER-CURRENT DIALYSIS EXCHANGER</text><rect x="179" y="254" width="1170" height="118" rx="22" fill="#FCEEEE" stroke="#B64B4B" stroke-width="2"/><rect x="179" y="403" width="1170" height="118" rx="22" fill="#EAF5FB" stroke="#315F86" stroke-width="2"/><rect x="179" y="378" width="1170" height="17" rx="4" fill="#F4EFF8" stroke="#725C8E" stroke-width="2"/><text x="764" y="283" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#B64B4B">BLOOD • entering with urea</text><text x="764" y="348" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#20314B">Cells and large plasma proteins stay in the blood compartment</text><text x="764" y="434" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#315F86">DIALYSIS FLUID • same glucose and ion concentrations; no urea</text><path d="M200 316L1320 316" stroke="#B64B4B" stroke-width="4" fill="none" marker-end="url(#a)" stroke-linecap="round"/><path d="M1320 465L200 465" stroke="#315F86" stroke-width="4" fill="none" marker-end="url(#a)" stroke-linecap="round"/><ellipse cx="310" cy="310" rx="10" ry="10" fill="#D48282" stroke="#A94F4F" stroke-width="1"/><ellipse cx="520" cy="310" rx="10" ry="10" fill="#B64B4B" stroke="#B64B4B" stroke-width="1"/><ellipse cx="890" cy="310" rx="10" ry="10" fill="#D48282" stroke="#A94F4F" stroke-width="1"/><ellipse cx="1090" cy="310" rx="10" ry="10" fill="#D48282" stroke="#A94F4F" stroke-width="1"/><ellipse cx="420" cy="461" rx="7" ry="7" fill="#168C8C" stroke="#168C8C" stroke-width="1"/><ellipse cx="650" cy="461" rx="7" ry="7" fill="#168C8C" stroke="#168C8C" stroke-width="1"/><ellipse cx="810" cy="461" rx="7" ry="7" fill="#168C8C" stroke="#168C8C" stroke-width="1"/><ellipse cx="1010" cy="461" rx="7" ry="7" fill="#168C8C" stroke="#168C8C" stroke-width="1"/><ellipse cx="1180" cy="461" rx="7" ry="7" fill="#168C8C" stroke="#168C8C" stroke-width="1"/><path d="M620 356L620 420" stroke="#B64B4B" stroke-width="3" fill="none" marker-end="url(#a)" stroke-linecap="round"/><rect x="117" y="298" width="116" height="39" rx="7" fill="#FFFFFF" stroke="#B64B4B" stroke-width="2"/><text x="175" y="323" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#10233F">blood in</text><path d="M1325 316L1420 316" stroke="#B64B4B" stroke-width="3" fill="none" marker-end="url(#a)" stroke-linecap="round"/><rect x="1380" y="291" width="83" height="52" rx="7" fill="#FCEEEE" stroke="#B64B4B" stroke-width="2"/><text x="1421" y="313" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#10233F">lower-urea</text><text x="1421" y="329" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#10233F">blood out</text><path d="M1480 465L1349 465" stroke="#315F86" stroke-width="3" fill="none" marker-end="url(#a)" stroke-linecap="round"/><text x="1245" y="505" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#315F86">dialysis fluid in • no urea</text><rect x="98" y="486" width="150" height="46" rx="7" fill="#EAF5FB" stroke="#315F86" stroke-width="2"/><text x="173" y="506" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#10233F">urea-containing</text><text x="173" y="523" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#10233F">fluid out</text><rect x="138" y="628" width="1252" height="124" rx="9" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/><text x="764" y="662" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">The membrane allows small solutes to diffuse; the blood cells and large plasma proteins remain in blood.</text><text x="764" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#20314B">Equal glucose and ion concentrations prevent net loss; urea concentration is lower in the incoming dialysis fluid.</text><text x="764" y="721" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">This diagram shows dialysis exchange, not all kidney filtration or the full fate of urea in a nephron.</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE  •  STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
