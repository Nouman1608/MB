<svg xmlns="http://www.w3.org/2000/svg" width="900" height="920" viewBox="0 0 1800 1840" role="img" aria-labelledby="title desc"><title id="title">Enzymes that digest (OxfordAQA International GCSE Biology)</title><desc id="desc">Enzymes from microorganisms used in the home and in industry (9201 3.2.4c). In biological washing powder, protease breaks protein into amino acids, lipase breaks fat or oil into glycerol and fatty acids, and amylase breaks starch into simpler sugars. For lactose-free milk, lactase breaks lactose into glucose and galactose. No tier labels.</desc><rect width="1800" height="1840" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="88" font-size="68" font-weight="700" fill="#1E2B47" text-anchor="middle">Enzymes that digest</text>
