<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="tit des"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#315F86"/></marker></defs><title id="tit">Field sampling: random quadrats and fixed-interval transect</title><desc id="des">Field layout contrasts random quadrat placement for abundance or biodiversity with fixed-interval quadrats along a transect across an environmental gradient. A map shows clustered plants to make clear counts vary between samples; a single edge rule is applied consistently.</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#10233F">Field sampling: random quadrats and fixed-interval transect</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#5B6D80">Marlbridge • Edexcel International GCSE Biology 4BI1 • Biodiversity practical (4.3B, 4.4B)</text><rect x="52" y="132" width="1424" height="680" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="90" y="168" width="672" height="484" rx="14" fill="#FBFCFD" stroke="#D3DCE2" stroke-width="2"/><rect x="782" y="168" width="656" height="484" rx="14" fill="#FBFCFD" stroke="#D3DCE2" stroke-width="2"/><text x="426" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">RANDOM QUADRATS • abundance</text><text x="1110" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">FIXED INTERVALS • gradient</text><rect x="125" y="242" width="600" height="330" rx="8" fill="#EAF5F1" stroke="#397D64" stroke-width="2"/><text x="425" y="272" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#10233F">Bounded sample area • example 30 m × 20 m</text><path d="M175 310H675M175 360H675M175 410H675M175 460H675M175 510H675M175 310V510M275 310V510M375 310V510M475 310V510M575 310V510M675 310V510" stroke="#B7C6C5" stroke-width="1"/><rect x="315" y="400" width="50" height="50" rx="1" fill="none" stroke="#315F86" stroke-width="2"/><rect x="520" y="460" width="50" height="50" rx="1" fill="none" stroke="#315F86" stroke-width="2"/><rect x="205" y="310" width="50" height="50" rx="1" fill="none" stroke="#315F86" stroke-width="2"/><rect x="596" y="405" width="50" height="50" rx="1" fill="none" stroke="#315F86" stroke-width="2"/><ellipse cx="220" cy="325" rx="5" ry="5" fill="#397D64" stroke="#397D64" stroke-width="2"/><ellipse cx="229" cy="334" rx="5" ry="5" fill="#397D64" stroke="#397D64" stroke-width="2"/><ellipse cx="238" cy="329" rx="5" ry="5" fill="#397D64" stroke="#397D64" stroke-width="2"/><ellipse cx="330" cy="425" rx="5" ry="5" fill="#397D64" stroke="#397D64" stroke-width="2"/><ellipse cx="340" cy="431" rx="5" ry="5" fill="#397D64" stroke="#397D64" stroke-width="2"/><ellipse cx="350" cy="421" rx="5" ry="5" fill="#397D64" stroke="#397D64" stroke-width="2"/><ellipse cx="359" cy="435" rx="5" ry="5" fill="#397D64" stroke="#397D64" stroke-width="2"/><ellipse cx="530" cy="485" rx="5" ry="5" fill="#397D64" stroke="#397D64" stroke-width="2"/><ellipse cx="538" cy="492" rx="5" ry="5" fill="#397D64" stroke="#397D64" stroke-width="2"/><ellipse cx="550" cy="480" rx="5" ry="5" fill="#397D64" stroke="#397D64" stroke-width="2"/><text x="426" y="550" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#20314B">Place equal-sized quadrats at random coordinates; repeat across the area.</text><rect x="814" y="242" width="588" height="330" rx="8" fill="#F5F1E8" stroke="#B48A62" stroke-width="2"/><text x="1108" y="272" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#10233F">Shade edge → open grass</text><path d="M850 430L1360 430" stroke="#315F86" stroke-width="5" fill="none" stroke-linecap="round"/><text x="850" y="458" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#20314B">shade</text><text x="1360" y="458" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#20314B">open</text><rect x="915" y="398" width="48" height="48" rx="1" fill="none" stroke="#315F86" stroke-width="2"/><rect x="1050" y="398" width="48" height="48" rx="1" fill="none" stroke="#315F86" stroke-width="2"/><rect x="1185" y="398" width="48" height="48" rx="1" fill="none" stroke="#315F86" stroke-width="2"/><rect x="1320" y="398" width="48" height="48" rx="1" fill="none" stroke="#315F86" stroke-width="2"/><ellipse cx="938" cy="418" rx="5" ry="5" fill="#397D64" stroke="#397D64" stroke-width="2"/><ellipse cx="1073" cy="418" rx="5" ry="5" fill="#397D64" stroke="#397D64" stroke-width="2"/><ellipse cx="1208" cy="418" rx="5" ry="5" fill="#397D64" stroke="#397D64" stroke-width="2"/><ellipse cx="1343" cy="418" rx="5" ry="5" fill="#397D64" stroke="#397D64" stroke-width="2"/><text x="938" y="480" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#10233F">Q1</text><text x="1073" y="480" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#10233F">Q2</text><text x="1208" y="480" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#10233F">Q3</text><text x="1343" y="480" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#10233F">Q4</text><text x="1108" y="530" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#20314B">Place quadrats at regular intervals along tape.</text><rect x="118" y="594" width="1288" height="75" rx="9" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/><text x="762" y="625" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">Count rooted plants with one edge rule (for example, include top and left edges only).</text><text x="762" y="650" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#20314B">Clumped populations create variable counts; use sufficient samples and consistent area/effort.</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE  •  STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
