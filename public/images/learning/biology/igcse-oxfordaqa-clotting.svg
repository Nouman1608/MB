<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1130" viewBox="0 0 1800 2260" role="img" aria-labelledby="title desc"><title id="title">How a blood clot forms (OxfordAQA International GCSE Biology)</title><desc id="desc">(1) A damaged vessel lets blood escape and pathogens can enter. (2) Soluble fibrinogen, a plasma protein, becomes insoluble fibrin fibres. (3) A clot forms: the fibres trap blood cells, blood loss stops and pathogens are kept out. No tier labels: 9201 3.2.3p-q covers platelets and the change of fibrinogen to fibrin.</desc><rect width="1800" height="2260" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="88" font-size="68" font-weight="700" fill="#1E2B47" text-anchor="middle">How a blood clot forms</text>
