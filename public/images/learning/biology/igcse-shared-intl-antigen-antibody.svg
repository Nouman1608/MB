<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1090" viewBox="0 0 1800 2180" role="img" aria-labelledby="title desc"><title id="title">Antigens and antibodies</title><desc id="desc">Top left: an antibody whose shape is complementary to the triangular antigens on a pathogen fits and binds. Top right: the same antibody does not fit a pathogen with different, rectangular antigens, so there is no binding. A key names the antigen, a different antigen and the antibody (a protein). Bottom: binding leads to one of two outcomes: the pathogen is destroyed directly, or it is marked for destruction by a phagocyte. No tier labels: specific antibodies are on both Edexcel papers (4BI1 2.62) and in OxfordAQA 9201 3.4.7c-d, which is not tiered.</desc><rect width="1800" height="2180" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="88" font-size="68" font-weight="700" fill="#1E2B47" text-anchor="middle">Antigens and antibodies</text>
<text x="900" y="164" font-size="44" fill="#4B5B72" text-anchor="middle">Complementary shapes</text>
<text x="450" y="386" font-size="48" font-weight="700" fill="#2F6B63" text-anchor="middle">Fits: antibody binds</text>
<text x="1350" y="386" font-size="48" font-weight="700" fill="#B9632F" text-anchor="middle">No fit: no binding</text>
<ellipse cx="450" cy="580" rx="220" ry="180" fill="#F3D6CC" stroke="#1E2B47" stroke-width="6"/>
<text x="450" y="592" font-size="48" font-weight="700" fill="#1E2B47" text-anchor="middle">Pathogen</text>
<ellipse cx="1350" cy="580" rx="220" ry="180" fill="#F3D6CC" stroke="#1E2B47" stroke-width="6"/>
<text x="1350" y="592" font-size="48" font-weight="700" fill="#1E2B47" text-anchor="middle">Pathogen</text>
