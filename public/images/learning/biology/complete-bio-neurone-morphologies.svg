<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="871" viewBox="0 0 1528 871" role="img" aria-labelledby="title desc"><title id="title">Sensory, relay and motor neurones: structure and direction</title><desc id="desc">Three actual cell sketches distinguish a sensory side-branch cell body, a short branched relay cell and a motor cell body with long axon. A separate receptor-CNS-effector map distinguishes structural drawings from functional arrows.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#1c2d4b"/></marker><marker id="red" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#b75e53"/></marker><marker id="blue" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#357ea2"/></marker></defs><rect width="100%" height="100%" fill="#f5f8f7"/><g font-family="Arial, sans-serif"><text x="24" y="58" font-size="38" font-weight="700" text-anchor="start" fill="#1c2d4b">Sensory, relay and motor neurones: structure and direction</text><text x="24" y="104" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Cambridge 0610 Biology 14.1 • Simplified typical morphologies; not to scale</text><g transform="translate(24,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Compare cell-body position and branching</text><text x="35" y="97" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">Sensory neurone</text><text x="35" y="232" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">Relay neurone</text><text x="35" y="377" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">Motor neurone</text><path d="M90,145 H630 M330,145 V110" fill="none" stroke="#1c2d4b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="330" cy="93" r="20" fill="#e2efec" stroke="#1c2d4b" stroke-width="3"/><circle cx="330" cy="93" r="6" fill="#d5b32d" stroke="#1c2d4b" stroke-width="1"/><path d="M120,145 L235,145" fill="none" stroke="#357ea2" stroke-width="3" marker-end="url(#blue)"/><path d="M440,145 L575,145" fill="none" stroke="#357ea2" stroke-width="3" marker-end="url(#blue)"/><circle cx="275" cy="290" r="25" fill="#e2efec" stroke="#1c2d4b" stroke-width="3"/><circle cx="275" cy="290" r="7" fill="#d5b32d" stroke="#1c2d4b" stroke-width="1"/><path d="M250,285 L210,265 L195,240 M213,267 L184,280 M253,302 L213,322 M299,290 H580 M580,290 L610,271 M580,290 L610,311" fill="none" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M360,290 L470,290" fill="none" stroke="#357ea2" stroke-width="3" marker-end="url(#blue)"/><circle cx="170" cy="425" r="27" fill="#e2efec" stroke="#1c2d4b" stroke-width="3"/><circle cx="170" cy="425" r="8" fill="#d5b32d" stroke="#1c2d4b" stroke-width="1"/><path d="M145,415 L105,398 L85,390 M106,398 L77,412 M144,437 L105,458 M197,425 H595 M595,425 L627,399 M595,425 L627,449" fill="none" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M335,425 L480,425" fill="none" stroke="#357ea2" stroke-width="3" marker-end="url(#blue)"/><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Typical school models: sensory cell body on a side branch;</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">short relay within the CNS; motor cell body at one end. Blue</text><text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">arrows show impulse direction.</text></g><g transform="translate(784,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Match structure to the direction of signalling</text><rect x="233" y="105" width="254" height="270" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="360" y="141" font-size="25" font-weight="700" text-anchor="middle" fill="#1c2d4b">CNS</text><rect x="35" y="184" width="168" height="70" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2"/><text x="119.0" y="216" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">Receptor</text><rect x="255" y="184" width="210" height="70" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2"/><text x="360.0" y="216" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">Relay</text><rect x="510" y="318" width="174" height="70" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2"/><text x="597.0" y="350" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">Effector</text><path d="M203,219 H255" fill="none" stroke="#357ea2" stroke-width="4" marker-end="url(#blue)"/><path d="M465,219 H492 V353 H510" fill="none" stroke="#357ea2" stroke-width="4" marker-end="url(#blue)"/><path d="M183.0,159.3 L220,219" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="167" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Sensory input</text><path d="M492,292 L492,319" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="500" y="282" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Motor output</text><text x="35" y="405" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Sensory: receptor → CNS</text><text x="35" y="433" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Relay: within CNS</text><text x="35" y="461" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Motor: CNS → muscle or gland</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">The left panel shows cell shape; this panel is a functional route</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">map. A withdrawal reflex can use a relay neurone. Not every</text><text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">reflex has the same number of synapses.</text></g><text x="24" y="849" font-size="19" font-weight="400" text-anchor="start" fill="#1c2d4b">MARLBRIDGE  •  Schematic; structures and particles are not to scale.</text></g></svg>