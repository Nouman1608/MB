<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Energy transfer and biomass pyramids</title><desc id="desc">Combines the source’s 1% plant capture, approximate 10% transfer, losses and sample energy values with a scale-concept pyramid.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#168C8C"/></marker></defs><rect width="1600" height="900" fill="#F4F8F7"/><text x="800" y="58" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#17324D" text-anchor="middle">Energy transfer and biomass pyramids</text><text x="800" y="92" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#526778" text-anchor="middle">Marlbridge • OxfordAQA IGCSE Biology • Ecology / biomass pyramids</text><rect x="70" y="145" width="430" height="190" rx="16" fill="#fff" stroke="#CAD7DC" stroke-width="2"/><text x="92" y="183" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#E1AA37" text-anchor="start">SUN → PRODUCERS</text><text x="92" y="223" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#17324D" text-anchor="start">Plants store about 1% of</text><text x="92" y="254" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#17324D" text-anchor="start">incident light energy.</text><text x="92" y="285" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#17324D" text-anchor="start">Example: 3.2×10⁶ kJ →</text><text x="92" y="316" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#17324D" text-anchor="start">3.2×10⁴ kJ per m².</text><rect x="565" y="145" width="460" height="190" rx="16" fill="#fff" stroke="#CAD7DC" stroke-width="2"/><text x="587" y="183" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#D76C61" text-anchor="start">~10% TRANSFERRED</text><text x="587" y="223" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#17324D" text-anchor="start">Each trophic transfer is</text><text x="587" y="254" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#17324D" text-anchor="start">approximately 10%.</text><text x="587" y="285" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#17324D" text-anchor="start">Waste, respiration/heat,</text><text x="587" y="316" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#17324D" text-anchor="start">and uneaten parts reduce it.</text><rect x="1090" y="145" width="440" height="190" rx="16" fill="#fff" stroke="#CAD7DC" stroke-width="2"/><text x="1112" y="183" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#168C8C" text-anchor="start">BIOMASS PYRAMID</text><text x="1112" y="223" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#17324D" text-anchor="start">Producers form the base.</text><text x="1112" y="254" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#17324D" text-anchor="start">Bar width is proportional</text><text x="1112" y="285" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#17324D" text-anchor="start">to dry biomass at sampling.</text><text x="800" y="390" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#526778" text-anchor="middle">Schematic biomass bars • wider = more biomass</text><rect x="735.0" y="415" width="130" height="52" rx="6" fill="#EBCB76" stroke="#fff" stroke-width="2"/><text x="800" y="449" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17324D" text-anchor="middle">Tertiary consumers</text><rect x="680.0" y="472" width="240" height="52" rx="6" fill="#D6E5C9" stroke="#fff" stroke-width="2"/><text x="800" y="506" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17324D" text-anchor="middle">Secondary consumers</text><rect x="585.0" y="529" width="430" height="52" rx="6" fill="#BFD9CE" stroke="#fff" stroke-width="2"/><text x="800" y="563" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17324D" text-anchor="middle">Primary consumers</text><rect x="420.0" y="586" width="760" height="52" rx="6" fill="#91BDB0" stroke="#fff" stroke-width="2"/><text x="800" y="620" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17324D" text-anchor="middle">Producers</text><text x="1210" y="455" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#168C8C" text-anchor="start">Example energy</text><text x="1210" y="500" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#17324D" text-anchor="start">32 000 → 3 200</text><text x="1210" y="535" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#17324D" text-anchor="start">→ 320 → 32</text><text x="1210" y="580" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#526778" text-anchor="start">kJ per m²</text><text x="1210" y="635" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#526778" text-anchor="start">10% rule is approximate.</text><text x="45" y="862" font-family="Arial,sans-serif" font-size="13" fill="#526778">Schematic teaching diagram • check the stated conditions and limits</text><text x="800" y="835" text-anchor="middle" font-family="Arial,sans-serif" font-size="42" font-weight="700" opacity=".06" fill="#17324D">MARLBRIDGE STUDY RESOURCES</text><image href="data:image/svg+xml;base64," x="1370" y="825" width="180" height="50" preserveAspectRatio="xMaxYMid meet"/></svg>