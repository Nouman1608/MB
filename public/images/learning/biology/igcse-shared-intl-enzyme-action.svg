<svg xmlns="http://www.w3.org/2000/svg" width="900" height="960" viewBox="0 0 1800 1920" role="img" aria-labelledby="title desc"><title id="title">How an enzyme works</title><desc id="desc">Four panels show lipase breaking down fat. (1) The substrate, fat, meets the active site. (2) The substrate fits the active site; the caption names this an enzyme-substrate complex, greyed with a note that the term is not required by Edexcel or OxfordAQA. (3) Glycerol and fatty acids form in the active site. (4) The products leave and the enzyme is unchanged. No tier labels: enzymes as catalysts and the active site are on both Edexcel papers (4BI1 2.10, 2.11) and in OxfordAQA 9201 3.2.4b, which is not tiered.</desc><rect width="1800" height="1920" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="92" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle">How an enzyme works</text>
