<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="871" viewBox="0 0 1528 871" role="img" aria-labelledby="title desc"><title id="title">Limewater comparison: trace each air route</title><desc id="desc">Two labelled limewater vessels have equal reagent levels. Room-to-A-to-mouth and mouth-to-B-to-room routes each have a long submerged inlet, short above-liquid outlet, explicit directional arrows and one-way valves. A separate enlarged vessel makes inlet/outlet depths unambiguous and qualifies the omitted protective components.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#1c2d4b"/></marker><marker id="red" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#b75e53"/></marker><marker id="blue" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#357ea2"/></marker></defs><rect width="100%" height="100%" fill="#f5f8f7"/><g font-family="Arial, sans-serif"><text x="24" y="58" font-size="38" font-weight="700" text-anchor="start" fill="#1c2d4b">Limewater comparison: trace each air route</text><text x="24" y="104" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Edexcel International GCSE Biology 4BI1 • Conceptual apparatus; teacher-approved protection required</text><g transform="translate(24,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Separate the two airflow routes</text><text x="172" y="100" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">A: inspired air</text><text x="548" y="100" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">B: expired air</text><path d="M88,244 V411 Q170,452 252,411 V244 Z" fill="white" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="92" y="337" width="156" height="72" rx="0" fill="#e2efec" stroke="none" stroke-width="0"/><rect x="83" y="230" width="174" height="24" rx="3" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><path d="M462,244 V411 Q544,452 626,411 V244 Z" fill="white" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="466" y="337" width="156" height="72" rx="0" fill="#e2efec" stroke="none" stroke-width="0"/><rect x="457" y="230" width="174" height="24" rx="3" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><path d="M117,391 V164 H44 M214,286 V146 H332 V121 M388,121 V146 H493 V391 M588,287 V164 H671" fill="none" stroke="#357ea2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="288" y="68" width="144" height="48" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2"/><text x="360.0" y="100" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">Mouthpiece</text><path d="M45,164 L106,164" fill="none" stroke="#357ea2" stroke-width="3" marker-end="url(#blue)"/><path d="M117,294 L117,366" fill="none" stroke="#357ea2" stroke-width="3" marker-end="url(#blue)"/><path d="M214,222 L214,164" fill="none" stroke="#357ea2" stroke-width="3" marker-end="url(#blue)"/><path d="M245,146 L312,146" fill="none" stroke="#357ea2" stroke-width="3" marker-end="url(#blue)"/><path d="M402,146 L470,146" fill="none" stroke="#b75e53" stroke-width="3" marker-end="url(#red)"/><path d="M493,294 L493,367" fill="none" stroke="#b75e53" stroke-width="3" marker-end="url(#red)"/><path d="M588,237 L588,173" fill="none" stroke="#b75e53" stroke-width="3" marker-end="url(#red)"/><path d="M604,164 L661,164" fill="none" stroke="#b75e53" stroke-width="3" marker-end="url(#red)"/><path d="M258,136 L273,146 L258,156 Z" fill="white" stroke="#1c2d4b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M276,133 V159" fill="none" stroke="#1c2d4b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M431,136 L446,146 L431,156 Z" fill="white" stroke="#1c2d4b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M449,133 V159" fill="none" stroke="#1c2d4b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M147,440 L147,365" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="35" y="467" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">Equal limewater</text><path d="M493,441 L493,371" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="413" y="467" font-size="20" font-weight="400" text-anchor="start" fill="#1c2d4b">Long inlet dips below liquid</text><text x="35" y="205" font-size="20" font-weight="400" text-anchor="start" fill="#1c2d4b">Room air →</text><text x="574" y="205" font-size="20" font-weight="400" text-anchor="start" fill="#1c2d4b">→ Room</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Arrows show flow during the relevant breath. One-way valves</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">enforce A → mouth and mouth → B. Use a teacher-approved</text><text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">protected setup: this conceptual diagram omits saliva traps and</text><text x="35" y="593" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">splash barriers.</text></g><g transform="translate(784,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Tube depth determines whether air is tested</text><path d="M203,190 V416 Q360,457 517,416 V190 Z" fill="white" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="207" y="326" width="306" height="90" rx="0" fill="#e2efec" stroke="none" stroke-width="0"/><rect x="194" y="174" width="332" height="27" rx="3" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><path d="M272,389 V117 H170 M447,261 V117 H556" fill="none" stroke="#357ea2" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M206,117 L256,117" fill="none" stroke="#357ea2" stroke-width="4" marker-end="url(#blue)"/><path d="M272,257 L272,372" fill="none" stroke="#357ea2" stroke-width="4" marker-end="url(#blue)"/><path d="M447,237 L447,134" fill="none" stroke="#357ea2" stroke-width="4" marker-end="url(#blue)"/><path d="M475,117 L540,117" fill="none" stroke="#357ea2" stroke-width="4" marker-end="url(#blue)"/><circle cx="278" cy="366" r="6" fill="white" stroke="#357ea2" stroke-width="2"/><circle cx="292" cy="345" r="6" fill="white" stroke="#357ea2" stroke-width="2"/><circle cx="309" cy="321" r="6" fill="white" stroke="#357ea2" stroke-width="2"/><path d="M84.0,79.3 L235,117" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="35" y="87" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Inlet</text><path d="M543,79.3 L491,117" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="551" y="87" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Outlet</text><path d="M160.0,270.3 L272,378" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="35" y="278" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Below liquid</text><path d="M472,290.3 L447,261" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="480" y="298" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Above liquid</text><text x="360" y="472" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">Air bubbles through the reagent.</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Use the same limewater volume and concentration. Expired-air</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">B clouds sooner because it contains more CO₂. Room air</text><text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">contains some CO₂; a slower change does not mean none.</text><text x="35" y="593" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Limewater does not test oxygen.</text></g><text x="24" y="849" font-size="19" font-weight="400" text-anchor="start" fill="#1c2d4b">MARLBRIDGE  •  Schematic; structures and particles are not to scale.</text></g></svg>
