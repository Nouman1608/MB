<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1095" viewBox="0 0 1800 2190" role="img" aria-labelledby="title desc"><title id="title">One parent or two?</title><desc id="desc">Asexual reproduction: one parent, for example bacteria, yeast or potato tubers, gives genetically identical offspring. Sexual reproduction: each of two parents makes a gamete with one set of chromosomes (n); at fertilisation the nuclei fuse to give a zygote with two sets (2n), and the offspring are different. In a cat, 19 + 19 = 38. No tier labels: sexual and asexual reproduction are on both Edexcel papers (4BI1 3.1-3.2, 3.30) and in OxfordAQA 9201 3.5.1-3.5.2, which is not tiered.</desc><rect width="1800" height="2190" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="88" font-size="68" font-weight="700" fill="#1E2B47" text-anchor="middle">One parent or two?</text>
<text x="900" y="164" font-size="44" fill="#4B5B72" text-anchor="middle">How offspring are made</text>
<rect x="60" y="240" width="1680" height="588" rx="28" fill="#FFFFFF" stroke="#1E2B47" stroke-width="5"/>
<text x="122" y="330" font-size="52" font-weight="700" fill="#1E2B47">Asexual: one parent</text>
<circle cx="260" cy="538" r="104" fill="#6FAAA3" stroke="#1E2B47" stroke-width="6"/>
<circle cx="260" cy="538" r="14" fill="#1E2B47"/>
<line x1="408" y1="538" x2="674" y2="538" stroke="#1E2B47" stroke-width="6" stroke-linecap="round"/><polygon points="716,538 672,560 672,516" fill="#1E2B47"/>
<circle cx="940" cy="538" r="86" fill="#6FAAA3" stroke="#1E2B47" stroke-width="6"/>
<circle cx="940" cy="538" r="14" fill="#1E2B47"/>
<circle cx="1240" cy="538" r="86" fill="#6FAAA3" stroke="#1E2B47" stroke-width="6"/>
<circle cx="1240" cy="538" r="14" fill="#1E2B47"/>
<circle cx="1540" cy="538" r="86" fill="#6FAAA3" stroke="#1E2B47" stroke-width="6"/>
<circle cx="1540" cy="538" r="14" fill="#1E2B47"/>
<text x="260" y="712" font-size="46" font-weight="700" fill="#1E2B47" text-anchor="middle">1 parent</text>
<text x="1240" y="712" font-size="46" font-weight="700" fill="#1E2B47" text-anchor="middle">Genetically identical</text>
<text x="122" y="788" font-size="42" fill="#4B5B72">e.g. bacteria, yeast, potato tubers</text>
<rect x="60" y="880" width="1680" height="1276" rx="28" fill="#FFFFFF" stroke="#1E2B47" stroke-width="5"/>
<text x="122" y="970" font-size="52" font-weight="700" fill="#1E2B47">Sexual: two parents</text>
<circle cx="460" cy="1132" r="92" fill="#6FAAA3" stroke="#1E2B47" stroke-width="6"/>
<text x="336" y="1148" font-size="46" font-weight="700" fill="#1E2B47" text-anchor="end">Parent 1</text>
<circle cx="1340" cy="1132" r="92" fill="#D6B22F" stroke="#1E2B47" stroke-width="6"/>
<text x="1462" y="1148" font-size="46" font-weight="700" fill="#1E2B47">Parent 2</text>
<line x1="460" y1="1236" x2="460" y2="1286" stroke="#2F6B63" stroke-width="6" stroke-linecap="round"/><polygon points="460,1318 441.3,1284 478.7,1284" fill="#2F6B63"/>
<line x1="1340" y1="1236" x2="1340" y2="1286" stroke="#8A6A0C" stroke-width="6" stroke-linecap="round"/><polygon points="1340,1318 1321.3,1284 1358.7,1284" fill="#8A6A0C"/>
<circle cx="460" cy="1390" r="56" fill="#6FAAA3" stroke="#1E2B47" stroke-width="6"/>
<text x="460" y="1406" font-size="44" font-weight="700" fill="#1E2B47" text-anchor="middle">n</text>
<text x="552" y="1404" font-size="46" font-weight="700" fill="#1E2B47">gamete</text>
<circle cx="1340" cy="1390" r="56" fill="#D6B22F" stroke="#1E2B47" stroke-width="6"/>
<text x="1340" y="1406" font-size="44" font-weight="700" fill="#1E2B47" text-anchor="middle">n</text>
<text x="1250" y="1404" font-size="46" font-weight="700" fill="#1E2B47" text-anchor="end">gamete</text>
<line x1="520" y1="1440" x2="777.8355725535408" y2="1558.46499279487" stroke="#2F6B63" stroke-width="6" stroke-linecap="round"/><polygon points="816,1576 766.8,1577.6 785.2,1537.6" fill="#2F6B63"/>
<line x1="1276" y1="1440" x2="1018.1644274464592" y2="1558.46499279487" stroke="#8A6A0C" stroke-width="6" stroke-linecap="round"/><polygon points="980,1576 1010.8,1537.6 1029.2,1577.6" fill="#8A6A0C"/>
<path d="M900 1562 A84 84 0 0 0 900 1730 Z" fill="#6FAAA3"/>
<path d="M900 1562 A84 84 0 0 1 900 1730 Z" fill="#D6B22F"/>
<circle cx="900" cy="1646" r="84" fill="none" stroke="#1E2B47" stroke-width="6"/>
<text x="900" y="1662" font-size="44" font-weight="700" fill="#1E2B47" text-anchor="middle">2n</text>
<text x="770" y="1694" font-size="46" font-weight="700" fill="#1E2B47" text-anchor="end">Zygote</text>
<text x="1030" y="1626" font-size="46" font-weight="700" fill="#1E2B47">Fertilisation:</text>
<text x="1030" y="1686" font-size="46" fill="#1E2B47">nuclei fuse</text>
<line x1="900" y1="1740" x2="900" y2="1792" stroke="#1E2B47" stroke-width="6" stroke-linecap="round"/><polygon points="900,1830 878,1790 922,1790" fill="#1E2B47"/>
<circle cx="580" cy="1928" r="76" fill="#8DAE8A" stroke="#1E2B47" stroke-width="6"/>
<circle cx="580" cy="1928" r="14" fill="#1E2B47"/>
<circle cx="900" cy="1928" r="76" fill="#A8AF6D" stroke="#1E2B47" stroke-width="6"/>
<circle cx="900" cy="1928" r="20" fill="none" stroke="#1E2B47" stroke-width="8"/>
<circle cx="1220" cy="1928" r="76" fill="#C9B444" stroke="#1E2B47" stroke-width="6"/>
<rect x="1194" y="1918" width="52" height="20" rx="8" fill="#1E2B47"/>
<text x="1360" y="1906" font-size="46" font-weight="700" fill="#1E2B47">Different</text>
<text x="1360" y="1964" font-size="46" font-weight="700" fill="#1E2B47">offspring</text>
<text x="122" y="2082" font-size="44" fill="#1E2B47">n = one set, 2n = two sets</text>
<text x="1124" y="2082" font-size="42" fill="#4B5B72">Cat: 19 + 19 = 38</text></g></svg>
