<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="ti de"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#315F86"/></marker><marker id="redarrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#C44949"/></marker></defs><title id="ti">Making insulin with bacteria: from DNA construct to purified product</title><desc id="de">Five-step recombinant plasmid pathway with explicit coding-sequence, bacterial expression, selection and processing caveats.</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#10233F">Making insulin with bacteria: from DNA construct to purified product</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#5B6D80">Marlbridge • Pearson Edexcel International GCSE Biology 4BI1 • Human insulin from bacteria (5.14)</text><rect x="52" y="128" width="1424" height="676" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/>,<rect x="78" y="164" width="250" height="253" rx="12" fill="#FBFCFD" stroke="#D3DCE2" stroke-width="2"/>,<rect x="351" y="164" width="250" height="253" rx="12" fill="#FBFCFD" stroke="#D3DCE2" stroke-width="2"/>,<rect x="624" y="164" width="250" height="253" rx="12" fill="#FBFCFD" stroke="#D3DCE2" stroke-width="2"/>,<rect x="897" y="164" width="250" height="253" rx="12" fill="#FBFCFD" stroke="#D3DCE2" stroke-width="2"/>,<rect x="1170" y="164" width="280" height="253" rx="12" fill="#FBFCFD" stroke="#D3DCE2" stroke-width="2"/>,<text x="203" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#315F86">1 • BUILD THE INSERT</text>,<text x="476" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#315F86">2 • CUT + JOIN</text>,<text x="749" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#315F86">3 • TRANSFORM</text>,<text x="1022" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#315F86">4 • SELECT + CONFIRM</text>,<text x="1310" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#315F86">5 • CULTURE + PURIFY</text>,<rect x="103" y="225" width="200" height="72" rx="8" fill="#EAF5FB" stroke="#315F86" stroke-width="2"/>,<text x="203" y="249" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="600" fill="#10233F">bacterial promoter +</text>,<text x="203" y="269" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="600" fill="#10233F">translation signals</text>,<rect x="129" y="310" width="148" height="38" rx="5" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/>,<text x="203" y="334" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#10233F">intron-free insulin CDS</text>,<circle cx="476" cy="273" r="55" fill="none" stroke="#315F86" stroke-width="12" stroke-dasharray="275 72" transform="rotate(-38 476 273)"/><path d="M448 219L459 235M503 311L515 327" stroke="#C44949" stroke-width="6"/>,<text x="476" y="340" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="600" fill="#C44949">same enzyme → matching ends</text>,<rect x="431" y="350" width="90" height="31" rx="5" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/>,<text x="476" y="371" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#10233F">DNA ligase</text>,<circle cx="749" cy="273" r="54" fill="none" stroke="#315F86" stroke-width="10"/><path d="M711 234L787 312" stroke="#C9A227" stroke-width="10" stroke-linecap="round"/><path d="M721 222L777 324" stroke="#397D64" stroke-width="8" stroke-linecap="round"/>,<text x="749" y="348" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="600" fill="#10233F">recombinant plasmid</text>,<text x="749" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="500" fill="#5B6D80">ori • marker • promoter • insulin CDS</text>,<circle cx="1022" cy="273" r="55" fill="#F8FAFC" stroke="#397D64" stroke-width="4"/><circle cx="1001" cy="252" r="5" fill="#397D64"/><circle cx="1037" cy="249" r="5" fill="#397D64"/><circle cx="1049" cy="282" r="5" fill="#397D64"/><circle cx="1006" cy="291" r="5" fill="#397D64"/><circle cx="1024" cy="269" r="5" fill="#397D64"/>,<text x="1022" y="347" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="600" fill="#10233F">select marker-positive colonies</text>,<path d="M1248 239 Q1248 224 1265 224 H1355 Q1372 224 1372 239 V317 Q1372 331 1355 331 H1265 Q1248 331 1248 317Z" fill="#EAF5FB" stroke="#315F86" stroke-width="4"/><path d="M1250 285H1370" stroke="#168C8C" stroke-width="12"/><path d="M1310 233V311M1290 269H1330" stroke="#315F86" stroke-width="5"/><circle cx="1272" cy="276" r="5" fill="#FFFFFF"/><circle cx="1347" cy="296" r="5" fill="#FFFFFF"/>,<text x="1310" y="353" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="600" fill="#10233F">express • harvest • purify</text>,<path d="M330 290L344 290" stroke="#315F86" stroke-width="3" fill="none" marker-end="url(#arrow)" stroke-linecap="round"/>,<path d="M603 290L617 290" stroke="#315F86" stroke-width="3" fill="none" marker-end="url(#arrow)" stroke-linecap="round"/>,<path d="M876 290L890 290" stroke="#315F86" stroke-width="3" fill="none" marker-end="url(#arrow)" stroke-linecap="round"/>,<path d="M1149 290L1163 290" stroke="#315F86" stroke-width="3" fill="none" marker-end="url(#arrow)" stroke-linecap="round"/>,<rect x="90" y="447" width="584" height="129" rx="10" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/>,<text x="116" y="480" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">SELECTION IS NOT PROOF OF INSULIN EXPRESSION</text>,<text x="116" y="510" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#20314B">Plasmid marker: growth on selective plate. No-DNA control: no resistant colonies expected.</text>,<text x="116" y="540" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#20314B">Confirm the insert/expression in selected colonies before production scale-up.</text>,<rect x="618" y="447" width="818" height="129" rx="10" fill="#FBEAEA" stroke="#DFA3A3" stroke-width="2"/>,<text x="644" y="480" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#C44949">BACTERIAL EXPRESSION CAVEAT</text>,<text x="644" y="510" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#20314B">Use an intron-free insulin coding sequence (cDNA or a suitable synthetic construct),</text>,<text x="644" y="535" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#20314B">with compatible bacterial promoter/translation signals. Genomic human insulin DNA</text>,<text x="644" y="560" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#20314B">contains introns; transformation alone does not guarantee active insulin.</text>,<rect x="90" y="615" width="1346" height="135" rx="10" fill="#FBFCFD" stroke="#D3DCE2" stroke-width="2"/>,<text x="116" y="650" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#315F86">PROCESS OUTCOME</text>,<text x="116" y="681" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#10233F">Selected, verified bacteria are expanded in a controlled fermenter; insulin product is harvested and purified.</text>,<text x="116" y="714" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">Correct folding and any required processing depend on the expression construct and production method.</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE  •  STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
