<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1130" viewBox="0 0 1800 2260" role="img" aria-labelledby="title desc"><title id="title">How water leaves a leaf (Edexcel International GCSE Biology: Paper 2 only)</title><desc id="desc">The whole figure is marked Paper 2 only: transpiration is statement 2.56B of 4BI1. Leaf cross-section. (1) Water evaporates from the mesophyll cells into the air spaces; (2) the water vapour diffuses out through the stomata; (3) water in the xylem is pulled up to replace it.</desc><rect width="1800" height="2260" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="88" font-size="68" font-weight="700" fill="#1E2B47" text-anchor="middle">How water leaves a leaf</text>
