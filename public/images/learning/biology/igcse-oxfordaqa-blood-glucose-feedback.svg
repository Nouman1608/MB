<text x="230" y="2086" font-size="40" fill="#1E2B47" text-anchor="end">5</text>
<line x1="244" y1="1904" x2="258" y2="1904" stroke="#1E2B47" stroke-width="5"/>
<text x="230" y="1918" font-size="40" fill="#1E2B47" text-anchor="end">6</text>
<line x1="244" y1="1736" x2="258" y2="1736" stroke="#1E2B47" stroke-width="5"/>
<text x="230" y="1750" font-size="40" fill="#1E2B47" text-anchor="end">7</text>
<line x1="244" y1="1568" x2="258" y2="1568" stroke="#1E2B47" stroke-width="5"/>
<text x="230" y="1582" font-size="40" fill="#1E2B47" text-anchor="end">8</text>
<line x1="244" y1="1400" x2="258" y2="1400" stroke="#1E2B47" stroke-width="5"/>
<text x="230" y="1414" font-size="40" fill="#1E2B47" text-anchor="end">9</text>
<line x1="258" y1="2240" x2="258" y2="2256" stroke="#1E2B47" stroke-width="5"/>
<text x="258" y="2302" font-size="40" fill="#1E2B47" text-anchor="middle">0</text>
<line x1="606.99" y1="2240" x2="606.99" y2="2256" stroke="#1E2B47" stroke-width="5"/>
<text x="606.99" y="2302" font-size="40" fill="#1E2B47" text-anchor="middle">30</text>
<line x1="955.9799999999999" y1="2240" x2="955.9799999999999" y2="2256" stroke="#1E2B47" stroke-width="5"/>
<text x="955.9799999999999" y="2302" font-size="40" fill="#1E2B47" text-anchor="middle">60</text>
<line x1="1304.97" y1="2240" x2="1304.97" y2="2256" stroke="#1E2B47" stroke-width="5"/>
<text x="1304.97" y="2302" font-size="40" fill="#1E2B47" text-anchor="middle">90</text>
<line x1="1653.9599999999998" y1="2240" x2="1653.9599999999998" y2="2256" stroke="#1E2B47" stroke-width="5"/>
<text x="1653.9599999999998" y="2302" font-size="40" fill="#1E2B47" text-anchor="middle">120</text>
<line x1="258" y1="1380" x2="258" y2="2240" stroke="#1E2B47" stroke-width="6" stroke-linecap="round"/>
<line x1="258" y1="2240" x2="1680" y2="2240" stroke="#1E2B47" stroke-width="6" stroke-linecap="round"/>
<line x1="258" y1="2072" x2="1654" y2="2072" stroke="#4B5B72" stroke-width="5" stroke-dasharray="18 12"/>
<text x="1654" y="2132" font-size="44" font-weight="700" fill="#4B5B72" text-anchor="end">set point</text>
<text x="300" y="2144" font-size="44" font-weight="700" fill="#1E2B47">5.0</text>
<path d="M258 2072 C330 2060 470 1568 606.99 1568 C1000 1568 1250 2038.4 1653.9599999999998 2038.4" fill="none" stroke="#1E2B47" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="258" cy="2072" r="20" fill="#D6B22F" stroke="#1E2B47" stroke-width="5"/>
<circle cx="606.99" cy="1568" r="20" fill="#D6B22F" stroke="#1E2B47" stroke-width="5"/>
<circle cx="1653.9599999999998" cy="2038.4" r="20" fill="#D6B22F" stroke="#1E2B47" stroke-width="5"/>
<text x="650" y="1524" font-size="44" font-weight="700" fill="#1E2B47">8.0 (+60%)</text>
<text x="1076" y="1548" font-size="46" font-weight="700" fill="#1E2B47">Insulin: liver stores</text>
<text x="1076" y="1608" font-size="46" font-weight="700" fill="#1E2B47">glucose as glycogen</text>
<text x="958" y="2384" font-size="46" font-weight="700" fill="#1E2B47" text-anchor="middle">Time after glucose drink (minutes)</text>
<text x="900" y="2520" font-size="42" fill="#4B5B72" text-anchor="middle">Example from the lesson; smooth curve is a sketch</text></g></svg>
