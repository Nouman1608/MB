<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1290" viewBox="0 0 1800 2580" role="img" aria-labelledby="title desc"><title id="title">Blood glucose: negative feedback (OxfordAQA International GCSE Biology)</title><desc id="desc">Two loops: when glucose rises after a meal, the pancreas releases insulin and the liver turns glucose into glycogen, so glucose falls back down; when glucose falls between meals, the pancreas releases glucagon and the liver turns glycogen into glucose, so glucose rises back up (9201 3.4.5). A sketch graph shows blood glucose rising from 5.0 to 8.0 mmol per dm3 (+60%) 30 minutes after a glucose drink, then falling back towards the 5.0 set point by 120 minutes as insulin makes the liver store glucose as glycogen. No tier labels.</desc><rect width="1800" height="2580" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="88" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle">Blood glucose: negative feedback</text>
<text x="900" y="166" font-size="44" fill="#4B5B72" text-anchor="middle">Each response reverses the change</text>
<rect x="60" y="340" width="500" height="220" rx="24" fill="#F2E6B7" stroke="#1E2B47" stroke-width="5"/>
<text x="310" y="425" font-size="46" font-weight="700" fill="#1E2B47" text-anchor="middle">Glucose rises</text>
<text x="310" y="490" font-size="44" fill="#1E2B47" text-anchor="middle">after a meal</text>
<rect x="650" y="340" width="500" height="220" rx="24" fill="#F2E6B7" stroke="#1E2B47" stroke-width="5"/>
<text x="900" y="425" font-size="46" font-weight="700" fill="#1E2B47" text-anchor="middle">Pancreas</text>
<text x="900" y="490" font-size="44" fill="#1E2B47" text-anchor="middle">releases insulin</text>
<rect x="1240" y="340" width="500" height="220" rx="24" fill="#F2E6B7" stroke="#1E2B47" stroke-width="5"/>
<text x="1490" y="425" font-size="46" font-weight="700" fill="#1E2B47" text-anchor="middle">Liver: glucose</text>
<text x="1490" y="490" font-size="44" fill="#1E2B47" text-anchor="middle">to glycogen</text>
<line x1="560" y1="450" x2="614" y2="450" stroke="#1E2B47" stroke-width="7" stroke-linecap="round"/><polygon points="648,450 612,469.8 612,430.2" fill="#1E2B47"/>
<line x1="1150" y1="450" x2="1204" y2="450" stroke="#1E2B47" stroke-width="7" stroke-linecap="round"/><polygon points="1238,450 1202,469.8 1202,430.2" fill="#1E2B47"/>
<path d="M1490 560 V642 H310 V602" fill="none" stroke="#8A6A0C" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="310,564 290,612 330,612" fill="#8A6A0C"/>
<text x="900" y="608" font-size="44" font-weight="700" fill="#8A6A0C" text-anchor="middle">Glucose falls back down</text>
<rect x="60" y="800" width="500" height="220" rx="24" fill="#DDEBE8" stroke="#1E2B47" stroke-width="5"/>
<text x="310" y="885" font-size="46" font-weight="700" fill="#1E2B47" text-anchor="middle">Glucose falls</text>
<text x="310" y="950" font-size="44" fill="#1E2B47" text-anchor="middle">between meals</text>
<rect x="650" y="800" width="500" height="220" rx="24" fill="#DDEBE8" stroke="#1E2B47" stroke-width="5"/>
<text x="900" y="885" font-size="46" font-weight="700" fill="#1E2B47" text-anchor="middle">Pancreas</text>
<text x="900" y="950" font-size="44" fill="#1E2B47" text-anchor="middle">releases glucagon</text>
<rect x="1240" y="800" width="500" height="220" rx="24" fill="#DDEBE8" stroke="#1E2B47" stroke-width="5"/>
<text x="1490" y="885" font-size="46" font-weight="700" fill="#1E2B47" text-anchor="middle">Liver: glycogen</text>
<text x="1490" y="950" font-size="44" fill="#1E2B47" text-anchor="middle">to glucose</text>
<line x1="560" y1="910" x2="614" y2="910" stroke="#1E2B47" stroke-width="7" stroke-linecap="round"/><polygon points="648,910 612,929.8 612,890.2" fill="#1E2B47"/>
<line x1="1150" y1="910" x2="1204" y2="910" stroke="#1E2B47" stroke-width="7" stroke-linecap="round"/><polygon points="1238,910 1202,929.8 1202,890.2" fill="#1E2B47"/>
<path d="M1490 1020 V1102 H310 V1062" fill="none" stroke="#2F6B63" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="310,1024 290,1072 330,1072" fill="#2F6B63"/>
<text x="900" y="1068" font-size="44" font-weight="700" fill="#2F6B63" text-anchor="middle">Glucose rises back up</text>
<text x="60" y="1316" font-size="46" font-weight="700" fill="#1E2B47" xml:space="preserve"><tspan>Blood glucose (mmol per dm</tspan><tspan dy="-17.5" font-size="31.3">3</tspan><tspan dy="17.5">)</tspan></text>
