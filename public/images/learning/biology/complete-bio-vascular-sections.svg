<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="871" viewBox="0 0 1528 871" role="img" aria-labelledby="title desc"><title id="title">Find xylem and phloem in a root, stem and leaf</title><desc id="desc">Simplified root has central cross-shaped xylem and phloem between the arms. Stem vascular bundles form a ring with xylem inward and phloem outward. Leaf-vein xylem lies above phloem; both epidermises identify the leaf orientation.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#1c2d4b"/></marker><marker id="red" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#b75e53"/></marker><marker id="blue" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#357ea2"/></marker></defs><rect width="100%" height="100%" fill="#f5f8f7"/><g font-family="Arial, sans-serif"><text x="24" y="58" font-size="38" font-weight="700" text-anchor="start" fill="#1c2d4b">Find xylem and phloem in a root, stem and leaf</text><text x="24" y="104" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Cambridge 0610 Biology 8.1.2 • Typical non-woody dicotyledonous sections</text><g transform="translate(24,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Transverse sections: root and stem</text><text x="190" y="102" font-size="25" font-weight="700" text-anchor="middle" fill="#1c2d4b">ROOT</text><text x="530" y="102" font-size="25" font-weight="700" text-anchor="middle" fill="#1c2d4b">STEM</text><circle cx="190" cy="250" r="117" fill="white" stroke="#1c2d4b" stroke-width="3"/><circle cx="530" cy="250" r="117" fill="white" stroke="#1c2d4b" stroke-width="3"/><path d="