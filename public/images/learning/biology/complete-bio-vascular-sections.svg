b" stroke-width="2"/><circle cx="575.9619407771256" cy="204.0380592228744" r="12" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="594.3467170879758" cy="185.65328291202417" r="12" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><text x="35" y="419" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Root: central xylem; phloem between its arms.</text><text x="35" y="455" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Stem: bundles in a ring; xylem faces the centre.</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Teal = xylem. Gold = phloem. In each stem bundle, phloem</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">faces the outer surface. Diagrams are simplified, not to scale.</text></g><g transform="translate(784,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">A leaf vein: upper and lower sides</text><rect x="70" y="140" width="580" height="220" rx="0" fill="white" stroke="#1c2d4b" stroke-width="3"/><path d="M70,168 H650 M70,332 H650" fill="none" stroke="#1c2d4b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="360" cy="250" rx="85" ry="73" fill="white" stroke="#1c2d4b" stroke-width="2"/><ellipse cx="360" cy="215" rx="52" ry="22" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><ellipse cx="360" cy="285" rx="52" ry="22" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><path d="M202.0,87.3 L240,155" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="35" y="95" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Upper epidermis</text><path d="M202.0,425.3 L240,347" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="35" y="433" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Lower epidermis</text><path d="M472,202.3 L390,215" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="480" y="210" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Xylem</text><path d="M472,291.3 L391,285" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="480" y="299" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Phloem</text><text x="35" y="470" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Vein / vascular bundle: xylem above phloem.</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Typical non-woody dicotyledonous root, stem and leaf</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">arrangements. Mesophyll detail is omitted here; use the</text><text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">companion leaf-structure figure for those tissues.</text></g><text x="24" y="849" font-size="19" font-weight="400" text-anchor="start" fill="#1c2d4b">MARLBRIDGE  •  Schematic; structures and particles are not to scale.</text></g></svg>