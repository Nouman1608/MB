<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100" viewBox="0 0 1800 2200" role="img" aria-labelledby="title desc"><title id="title">Where urea comes from (Edexcel International GCSE Biology)</title><desc id="desc">(1) Amino acids are absorbed into the blood; (2) in the liver, some are assimilated, made into protein, and the nitrogen part of others is removed by deamination, forming urea; (3) urea travels in the blood plasma; (4) the kidney filters urea out; (5) urea is excreted in urine. Step 2 is marked not required by Edexcel: 4BI1 does not cover assimilation or deamination. Step 4 is marked Paper 2 only (4BI1 2.72B, 2.75B). Urea in plasma is statement 2.60, on both papers.</desc><rect width="1800" height="2200" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="88" font-size="68" font-weight="700" fill="#1E2B47" text-anchor="middle">Where urea comes from</text>
<text x="900" y="164" font-size="44" fill="#4B5B72" text-anchor="middle">The route from amino acids to urine</text>
