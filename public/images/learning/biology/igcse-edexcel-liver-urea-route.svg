<circle cx="868" cy="548" r="26" fill="#B5D4CF" stroke="#2F6B63" stroke-width="5"/><rect x="882.3" y="531.88" width="32.24" height="32.24" fill="#D6B22F" stroke="#1E2B47" stroke-width="4"/>
