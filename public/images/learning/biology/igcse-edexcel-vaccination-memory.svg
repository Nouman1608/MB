<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1130" viewBox="0 0 1800 2260" role="img" aria-labelledby="title desc"><title id="title">Vaccination and memory cells (Edexcel International GCSE Biology: Paper 2 only)</title><desc id="desc">The whole figure is marked Paper 2 only: vaccination and memory cells are statement 2.63B of 4BI1. (1) Weakened pathogens or antigens are put in the body; (2) lymphocytes make antibodies; (3) memory cells give long-term immunity. A sketch graph of antibody level in the blood against time shows a slow, small response after the first exposure and a fast, large response when the same pathogen enters again.</desc><rect width="1800" height="2260" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="88" font-size="68" font-weight="700" fill="#1E2B47" text-anchor="middle">Vaccination and memory cells</text>
<text x="900" y="164" font-size="44" fill="#4B5B72" text-anchor="middle">Why a second meeting is faster</text>
