<svg xmlns="http://www.w3.org/2000/svg" width="900" height="890" viewBox="0 0 1800 1780" role="img" aria-labelledby="title desc"><title id="title">One bacterium becomes 256 (OxfordAQA International GCSE Biology)</title><desc id="desc">Graph of number of bacteria against time in hours. One bacterium divides every 30 minutes and all offspring survive, so the number doubles each half hour: 1, 2, 4, 8, 16, 32, 64, 128, 256. After 4 hours, 8 divisions give 2 to the power 8 = 256 bacteria. This illustrates 9201 3.4.7b: bacteria may reproduce rapidly inside the body. No tier labels.</desc><rect width="1800" height="1780" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="88" font-size="68" font-weight="700" fill="#1E2B47" text-anchor="middle">One bacterium becomes 256</text>
<text x="900" y="164" font-size="44" fill="#4B5B72" text-anchor="middle">Divides every 30 minutes; all offspring survive</text>
