<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="871" viewBox="0 0 1528 871" role="img" aria-labelledby="title desc"><title id="title">Sample populations without choosing the result</title><desc id="desc">Random-quadrat density calculation and replicated systematic transects are matched to their different purposes.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#1c2d4b"/></marker><marker id="red" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#b75e53"/></marker><marker id="blue" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#357ea2"/></marker></defs><rect width="100%" height="100%" fill="#f5f8f7"/><g font-family="Arial, sans-serif"><text x="24" y="58" font-size="38" font-weight="700" text-anchor="start" fill="#1c2d4b">Sample populations without choosing the result</text><text x="24" y="104" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Random and systematic sampling answer different ecological questions.</text><g transform="translate(24,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Estimate abundance with quadrats</text><rect x="35" y="90" width="650" height="112" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="53" y="119" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">1 Define the sampling area</text><text x="53" y="150" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">Use random coordinates within a clearly bounded habitat.</text><path d="M360,205 L360,217" fill="none" stroke="#357ea2" stroke-width="2" marker-end="url(#blue)"/><rect x="35" y="220" width="650" height="112" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="53" y="249" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">2 Sample enough quadrats</text><text x="53" y="280" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">Use the same counting rule and quadrat area; record</text><text x="53" y="307" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">abundance or percentage cover.</text><path d="M360,335 L360,347" fill="none" stroke="#357ea2" stroke-width="2" marker-end="url(#blue)"/><rect x="35" y="350" width="650" height="112" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="53" y="379" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">3 Scale cautiously</text><text x="53" y="410" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">Mean count ÷ quadrat area gives estimated density; multiply by</text><text x="53" y="437" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">habitat area if justified.</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Example: mean 6 plants per 0.25 m² gives 24 plants m⁻², or</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">about 2 400 in 100 m².</text></g><g transform="translate(784,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Investigate a gradient with a transect</text><rect x="35" y="90" width="650" height="112" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="53" y="119" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">1 Lay a line across an environmental gradient</text><text x="53" y="150" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">For example, from a shaded edge into an open grassland.</text><path d="M360,205 L360,217" fill="none" stroke="#357ea2" stroke-width="2" marker-end="url(#blue)"/><rect x="35" y="220" width="650" height="112" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="53" y="249" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">2 Place quadrats at fixed intervals</text><text x="53" y="280" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">Record organisms and relevant abiotic variables consistently.</text><path d="M360,335 L360,347" fill="none" stroke="#357ea2" stroke-width="2" marker-end="url(#blue)"/><rect x="35" y="350" width="650" height="112" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="53" y="379" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">3 Repeat transects and analyse patterns</text><text x="53" y="410" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">Replication reveals variability; association alone does not prove</text><text x="53" y="437" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">causation.</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Random sampling estimates habitat abundance; a transect is</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">useful for change along a gradient.</text></g><text x="24" y="849" font-size="19" font-weight="400" text-anchor="start" fill="#1c2d4b">MARLBRIDGE  •  Schematic; structures and particles are not to scale.</text></g></svg>
