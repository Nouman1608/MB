<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1260" viewBox="0 0 1800 2520" role="img" aria-labelledby="title desc"><title id="title">Mitosis or meiosis? (OxfordAQA International GCSE Biology)</title><desc id="desc">A parent cell with 4 chromosomes, two pairs of same-length rods. Mitosis gives 2 identical cells, still with 4 chromosomes, for growth, repair, replacement and asexual reproduction. Meiosis gives 4 different cells with only 2 chromosomes each; it makes gametes and halves the chromosome number. Fertilisation restores the number: two gametes join to form a zygote; in humans 23 + 23 = 46. No tier labels. The labels using the words diploid and haploid are greyed with a note that these terms are not required by OxfordAQA: 9201 3.5.2 says chromosomes are in pairs in body cells and gametes have a single set.</desc><rect width="1800" height="2520" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="88" font-size="68" font-weight="700" fill="#1E2B47" text-anchor="middle">Mitosis or meiosis?</text>
<text x="900" y="164" font-size="44" fill="#4B5B72" text-anchor="middle">Example cell with 4 chromosomes</text>
<text x="60" y="248" font-size="32" fill="#6B7785">Grey: the terms diploid and haploid</text>
<text x="60" y="288" font-size="32" fill="#6B7785">are not required by OxfordAQA</text>
<circle cx="900" cy="492" r="202" fill="#FFFFFF" stroke="#1E2B47" stroke-width="6"/>
<rect x="780" y="434" width="32" height="132" rx="16" fill="#6FAAA3" stroke="#1E2B47" stroke-width="4"/><rect x="842" y="434" width="32" height="132" rx="16" fill="#D6B22F" stroke="#1E2B47" stroke-width="4"/><rect x="916" y="460" width="32" height="80" rx="16" fill="#6FAAA3" stroke="#1E2B47" stroke-width="4"/><rect x="986" y="460" width="32" height="80" rx="16" fill="#D6B22F" stroke="#1E2B47" stroke-width="4"/>
<text x="1160" y="456" font-size="42" fill="#4B5B72">Same-length rods</text>
<text x="1160" y="516" font-size="42" fill="#4B5B72">form a pair</text>
<text x="900" y="740" font-size="46" font-weight="700" fill="#6B7785" text-anchor="middle">diploid parent cell</text>
<line x1="780" y1="800" x2="508.2851172257527" y2="880.1210551770216" stroke="#1E2B47" stroke-width="6" stroke-linecap="round"/><polygon points="468,892 503.4,856.3 517,902.8" fill="#1E2B47"/>
<line x1="1020" y1="800" x2="1291.7148827742474" y2="880.1210551770216" stroke="#1E2B47" stroke-width="6" stroke-linecap="round"/><polygon points="1332,892 1283,902.8 1296.6,856.3" fill="#1E2B47"/>
<rect x="210" y="928" width="480" height="108" rx="54" fill="#DDEBE8" stroke="#1E2B47" stroke-width="5"/>
<text x="450" y="1000" font-size="52" font-weight="700" fill="#1E2B47" text-anchor="middle">Mitosis</text>
<rect x="1110" y="928" width="480" height="108" rx="54" fill="#F2E6B7" stroke="#1E2B47" stroke-width="5"/>
<text x="1350" y="1000" font-size="52" font-weight="700" fill="#1E2B47" text-anchor="middle">Meiosis</text>
<line x1="900" y1="1080" x2="900" y2="1760" stroke="#C6D3D0" stroke-width="5" stroke-linecap="round" stroke-dasharray="4 14"/>
<circle cx="240" cy="1272" r="158" fill="#FFFFFF" stroke="#1E2B47" stroke-width="6"/>
<rect x="140.8" y="1219.2" width="32" height="105.60000000000001" rx="16" fill="#6FAAA3" stroke="#1E2B47" stroke-width="4"/><rect x="190.4" y="1219.2" width="32" height="105.60000000000001" rx="16" fill="#D6B22F" stroke="#1E2B47" stroke-width="4"/><rect x="249.60000000000002" y="1240" width="32" height="64" rx="16" fill="#6FAAA3" stroke="#1E2B47" stroke-width="4"/><rect x="305.6" y="1240" width="32" height="64" rx="16" fill="#D6B22F" stroke="#1E2B47" stroke-width="4"/>
<circle cx="660" cy="1272" r="158" fill="#FFFFFF" stroke="#1E2B47" stroke-width="6"/>
<rect x="560.8" y="1219.2" width="32" height="105.60000000000001" rx="16" fill="#6FAAA3" stroke="#1E2B47" stroke-width="4"/><rect x="610.4" y="1219.2" width="32" height="105.60000000000001" rx="16" fill="#D6B22F" stroke="#1E2B47" stroke-width="4"/><rect x="669.6" y="1240" width="32" height="64" rx="16" fill="#6FAAA3" stroke="#1E2B47" stroke-width="4"/><rect x="725.6" y="1240" width="32" height="64" rx="16" fill="#D6B22F" stroke="#1E2B47" stroke-width="4"/>
<text x="450" y="1514" font-size="48" font-weight="700" fill="#1E2B47" text-anchor="middle">2 identical cells</text>
<text x="450" y="1580" font-size="44" fill="#1E2B47" text-anchor="middle">still 4 chromosomes</text>
<circle cx="1140" cy="1208" r="112" fill="#FFFFFF" stroke="#1E2B47" stroke-width="6"/>
<rect x="1100" y="1160" width="32" height="96" rx="16" fill="#6FAAA3" stroke="#1E2B47" stroke-width="4"/>
<rect x="1154" y="1179" width="32" height="58" rx="16" fill="#6FAAA3" stroke="#1E2B47" stroke-width="4"/>
<circle cx="1560" cy="1208" r="112" fill="#FFFFFF" stroke="#1E2B47" stroke-width="6"/>
<rect x="1520" y="1160" width="32" height="96" rx="16" fill="#D6B22F" stroke="#1E2B47" stroke-width="4"/>
<rect x="1574" y="1179" width="32" height="58" rx="16" fill="#D6B22F" stroke="#1E2B47" stroke-width="4"/>
<circle cx="1140" cy="1462" r="112" fill="#FFFFFF" stroke="#1E2B47" stroke-width="6"/>
<rect x="1100" y="1414" width="32" height="96" rx="16" fill="#6FAAA3" stroke="#1E2B47" stroke-width="4"/>
<rect x="1154" y="1433" width="32" height="58" rx="16" fill="#D6B22F" stroke="#1E2B47" stroke-width="4"/>
<circle cx="1560" cy="1462" r="112" fill="#FFFFFF" stroke="#1E2B47" stroke-width="6"/>
<rect x="1520" y="1414" width="32" height="96" rx="16" fill="#D6B22F" stroke="#1E2B47" stroke-width="4"/>
<rect x="1574" y="1433" width="32" height="58" rx="16" fill="#6FAAA3" stroke="#1E2B47" stroke-width="4"/>
<text x="1350" y="1630" font-size="48" font-weight="700" fill="#1E2B47" text-anchor="middle">4 different cells</text>
<text x="1350" y="1696" font-size="44" fill="#1E2B47" text-anchor="middle">only 2 chromosomes each</text>
<text x="450" y="1826" font-size="46" font-weight="700" fill="#2F6B63" text-anchor="middle">Growth, repair,</text>
<text x="450" y="1890" font-size="46" font-weight="700" fill="#2F6B63" text-anchor="middle">replacement,</text>
<text x="450" y="1954" font-size="46" font-weight="700" fill="#2F6B63" text-anchor="middle">asexual reproduction</text>
<text x="1350" y="1826" font-size="46" font-weight="700" fill="#8A6A0C" text-anchor="middle">Makes gametes</text>
<text x="1350" y="1890" font-size="46" font-weight="700" fill="#8A6A0C" text-anchor="middle">Halves the number:</text>
<text x="1350" y="1954" font-size="46" font-weight="700" fill="#6B7785" text-anchor="middle">diploid to haploid</text>
<rect x="60" y="2030" width="1680" height="426" rx="28" fill="#FFFFFF" stroke="#1E2B47" stroke-width="5"/>
<text x="900" y="2108" font-size="48" font-weight="700" fill="#1E2B47" text-anchor="middle">Fertilisation restores the number</text>
<circle cx="284" cy="2264" r="88" fill="#FFFFFF" stroke="#1E2B47" stroke-width="6"/>
<rect x="244" y="2224" width="32" height="80" rx="16" fill="#6FAAA3" stroke="#1E2B47" stroke-width="4"/>
<rect x="290" y="2240" width="32" height="48" rx="16" fill="#D6B22F" stroke="#1E2B47" stroke-width="4"/>
<circle cx="564" cy="2264" r="88" fill="#FFFFFF" stroke="#1E2B47" stroke-width="6"/>
<rect x="524" y="2224" width="32" height="80" rx="16" fill="#D6B22F" stroke="#1E2B47" stroke-width="4"/>
<rect x="570" y="2240" width="32" height="48" rx="16" fill="#6FAAA3" stroke="#1E2B47" stroke-width="4"/>
<text x="424" y="2286" font-size="60" font-weight="700" fill="#1E2B47" text-anchor="middle">+</text>
<text x="424" y="2390" font-size="40" fill="#4B5B72" text-anchor="middle">gametes</text>
<line x1="690" y1="2262" x2="902" y2="2262" stroke="#1E2B47" stroke-width="6" stroke-linecap="round"/><polygon points="944,2262 900,2286.2 900,2237.8" fill="#1E2B47"/>
<circle cx="1074" cy="2264" r="98" fill="#FFFFFF" stroke="#1E2B47" stroke-width="6"/>
<rect x="983.12" y="2216.48" width="32" height="95.03999999999999" rx="16" fill="#6FAAA3" stroke="#1E2B47" stroke-width="4"/><rect x="1027.76" y="2216.48" width="32" height="95.03999999999999" rx="16" fill="#D6B22F" stroke="#1E2B47" stroke-width="4"/><rect x="1081.04" y="2235.2" width="32" height="57.599999999999994" rx="16" fill="#6FAAA3" stroke="#1E2B47" stroke-width="4"/><rect x="1131.44" y="2235.2" width="32" height="57.599999999999994" rx="16" fill="#D6B22F" stroke="#1E2B47" stroke-width="4"/>
<text x="1074" y="2420" font-size="40" fill="#4B5B72" text-anchor="middle">zygote</text>
<text x="1560" y="2228" font-size="56" font-weight="700" fill="#1E2B47" text-anchor="middle">23 + 23</text>
<text x="1560" y="2304" font-size="56" font-weight="700" fill="#1E2B47" text-anchor="middle">= 46</text>
<text x="1560" y="2372" font-size="40" fill="#4B5B72" text-anchor="middle">in humans</text></g></svg>
