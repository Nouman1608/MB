<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="871" viewBox="0 0 1528 871" role="img" aria-labelledby="title desc"><title id="title">Osmosis across a membrane</title><desc id="desc">Water passes in both directions across a partially permeable membrane, with net movement from a dilute solution of higher water potential to a concentrated solution of lower water potential.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#1c2d4b"/></marker><marker id="red" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#b75e53"/></marker><marker id="blue" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#357ea2"/></marker></defs><rect width="100%" height="100%" fill="#f5f8f7"/><g font-family="Arial, sans-serif"><text x="24" y="58" font-size="38" font-weight="700" text-anchor="start" fill="#1c2d4b">Osmosis across a membrane</text><text x="24" y="104" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Edexcel International GCSE Biology 4BI1 • Simple model: solute retained, comparable pressure</text><g transform="translate(24,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Separate water from solute</text><rect x="45" y="115" width="630" height="290" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2"/><rect x="340" y="115" width="40" height="290" rx="0" fill="#e2efec" stroke="#cad7d5" stroke-width="1"/><circle cx="338" cy="125" r="8" fill="#73aaa5" stroke="#1c2d4b" stroke-width="1"/><circle cx="382" cy="125" r="8" fill="#73aaa5" stroke="#1c2d4b" stroke-width="1"/><path d="M346,125 h28" fill="none" stroke="#1c2d4b" stroke-width="2" stroke-