b">membrane lets water pass, but not this solute.</text></g><g transform="translate(784,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Compare the two directions</text><rect x="340" y="115" width="40" height="290" rx="0" fill="#e2efec" stroke="#cad7d5" stroke-width="1"/><circle cx="338" cy="125" r="8" fill="#73aaa5" stroke="#1c2d4b" stroke-width="1"/><circle cx="382" cy="125" r="8" fill="#73aaa5" stroke="#1c2d4b" stroke-width="1"/><path d="M346,125 h28" fill="none" stroke="#1c2d4b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="338" cy="151" r="8" fill="#73aaa5" stroke="#1c2d4b" stroke-width="1"/><circle cx="382" cy="151" r="8" fill="#73aaa5" stroke="#1c2d4b" stroke-width="1"/><path d="M346,151 h28" fill="none" stroke="#1c2d4b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="338" cy="177" r="8" fill="#73aaa5" stroke="#1c2d4b" stroke-width="1"/><circle cx="382" cy="177" r="8" fill="#73aaa5" stroke="#1c2d4b" stroke-width="1"/><path d="M346,177 h28" fill="none" stroke="#1c2d4b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="338" cy="203" r="8" fill="#73aaa5" stroke="#1c2d4b" stroke-width="1"/><circle cx="382" cy="203" r="8" fill="#73aaa5" stroke="#1c2d4b" stroke-width="1"/><path d="M346,203 h28" fill="none" stroke="#1c2d4b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="338" cy="229" r="8" fill="#73aaa5" stroke="#1c2d4b" stroke-width="1"/><circle cx="382" cy="229" r="8" fill="#73aaa5" stroke="#1c2d4b" stroke-width="1"/><path d="M346,229 h28" fill="none" stroke="#1c2d4b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="338" cy="255" r="8" fill="#73aaa5" stroke="#1c2d4b" stroke-width="1"/><circle cx="382" cy="255" r="8" fill="#73aaa5" stroke="#1c2d4b" stroke-width="1"/><path d="M346,