<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 1800 2400" role="img" aria-labelledby="title desc"><title id="title">Acid, then alkaline</title><desc id="desc">The stomach is acid: it contains hydrochloric acid, which kills microbes and gives the acid pH, and pepsin works there. Food passes to the duodenum, where bile neutralises the acid, so it is alkaline and trypsin works there. A sketch graph of activity against pH shows pepsin peaking in acid and trypsin peaking in alkaline conditions. No tier labels: different enzymes working best at different pH and bile neutralising stomach acid are on both Edexcel papers (4BI1 2.13, 2.31) and in OxfordAQA 9201 3.2.4b-c, which is not tiered. A grey note says the names pepsin and trypsin, and the idea that hydrochloric acid kills microbes, are not required by either board.</desc><rect width="1800" height="2400" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="88" font-size="68" font-weight="700" fill="#1E2B47" text-anchor="middle">Acid, then alkaline</text>
<text x="900" y="164" font-size="44" fill="#4B5B72" text-anchor="middle">Each enzyme works best at its own pH</text>
