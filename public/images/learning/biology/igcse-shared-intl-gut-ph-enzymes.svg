<text x="620" y="1610" font-size="46" font-weight="700" fill="#C0392B" text-anchor="middle">pepsin</text>
<text x="1340" y="1610" font-size="46" font-weight="700" fill="#3E7FAA" text-anchor="middle">trypsin</text>
<text x="50" y="1836" font-size="44" font-weight="700" fill="#1E2B47">activity</text>
<text x="280" y="2194" font-size="44" font-weight="700" fill="#1E2B47">acidic</text>
<text x="980" y="2194" font-size="44" font-weight="700" fill="#1E2B47" text-anchor="middle">pH</text>
<text x="1680" y="2194" font-size="44" font-weight="700" fill="#1E2B47" text-anchor="end">alkaline</text>
<text x="900" y="2262" font-size="42" fill="#4B5B72" text-anchor="middle">sketch graph, not to scale</text>
<text x="900" y="2326" font-size="32" fill="#6B7785" text-anchor="middle">Grey: the names pepsin and trypsin, and HCl killing microbes,</text>
<text x="900" y="2368" font-size="32" fill="#6B7785" text-anchor="middle">are not required by Edexcel or OxfordAQA</text></g></svg>
