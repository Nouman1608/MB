<text x="880" y="374" font-size="50" font-weight="700" fill="#1E2B47">Stomach: acid</text>
<circle cx="906" cy="462" r="18" fill="#C0392B" stroke="#1E2B47" stroke-width="3"/>
<text x="958" y="476" font-size="42" fill="#1E2B47">hydrochloric acid (HCl)</text>
<text x="880" y="574" font-size="46" font-weight="700" fill="#6B7785">HCl kills microbes</text>
<text x="880" y="640" font-size="42" fill="#4B5B72">and gives the acid pH</text>
<path d="M936 868 L960.2 899.8 A40 40 0 1 0 911.8 899.8 Z" fill="#6FA36A" stroke="#1E2B47" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1010" y="888" font-size="46" font-weight="700" fill="#6B7785">pepsin works here</text>
<rect x="96" y="1096" width="1608" height="166" rx="83" fill="#D2E5EC" stroke="#1E2B47" stroke-width="6"/>
<ellipse cx="1110" cy="980" rx="44" ry="54" fill="#6FA36A" stroke="#1E2B47" stroke-width="4"/>
<line x1="1116" y1="1036" x2="1116" y2="1088" stroke="#6FA36A" stroke-width="6" stroke-linecap="round"/><polygon points="1116,1116 1098,1086 1134,1086" fill="#6FA36A"/>
<text x="1220" y="996" font-size="46" font-weight="700" fill="#1E2B47">Bile</text>
<text x="1220" y="1056" font-size="42" fill="#4B5B72">neutralises acid</text>
