<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc"><title id="title">The sigmoid population growth curve</title><desc id="desc">A conceptual population curve under limited resources: slow lag, rapid exponential growth, a stationary phase near carrying capacity, then possible decline when deaths exceed births. The axes are labelled and the curve is not numerical data.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#087F8C"/></marker><marker id="arrgold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#C9A227"/></marker></defs><rect width="1600" height="960" fill="#F3F7F6"/><text x="800" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0B1F3A">The sigmoid population growth curve</text><text x="800" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#526578">Marlbridge · schematic teaching diagram · not to scale</text><rect x="48" y="118" width="1504" height="700" rx="16" fill="#FFFFFF" stroke="#CBD8DE" stroke-width="2"/><text x="170" y="156" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0B1F3A">Population size changes as conditions and limiting factors change</text>
<path d="M150 710V215M150 710H1080" fill="none" stroke="#18324B" stroke-width="4"/><path d="M150 215l-9 18h18zM1080 710l-18-9v18z" fill="#18324B"/>
<line x1="150" y1="360" x2="1065" y2="360" stroke="#C9A227" stroke-width="3" stroke-dasharray="10 8"/><text x="164" y="347" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#C9A227">Carrying capacity (K)</text>
<path d="M180 680 C270 666 330 647 380 605 C450 545 480 410 590 358 C680 315 800 329 870 337 C940 345 965 362 1010 423" fill="none" stroke="#087F8C" stroke-width="8" stroke-linecap="round"/>
<text x="112" y="466" transform="rotate(-90 112 466)" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#18324B" text-anchor="middle">Population size (number of individuals)</text><text x="615" y="754" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#18324B" text-anchor="middle">Time</text>
<line x1="450" y1="545" x2="450" y2="710" stroke="#18324B" stroke-width="2" stroke-dasharray="5 7"/><line x1="700" y1="342" x2="700" y2="710" stroke="#18324B" stroke-width="2" stroke-dasharray="5 7"/><line x1="934" y1="349" x2="934" y2="710" stroke="#18324B" stroke-width="2" stroke-dasharray="5 7"/>
<rect x="190" y="235" width="200" height="68" rx="16" fill="#E5F2F2" stroke="#087F8C" stroke-width="2"/><text x="290" y="265" font-family="Arial,sans-serif" font-size="19" fill="#087F8C" font-weight="700" text-anchor="middle">1  LAG</text><text x="290" y="290" font-family="Arial,sans-serif" font-size="16" fill="#18324B" font-weight="400" text-anchor="middle">slow increase</text>
<rect x="413" y="235" width="230" height="68" rx="16" fill="#E5F2F2" stroke="#087F8C" stroke-width="2"/><text x="528" y="265" font-family="Arial,sans-serif" font-size="18" fill="#087F8C" font-weight="700" text-anchor="middle">2  EXPONENTIAL (LOG)</text><text x="528" y="290" font-family="Arial,sans-serif" font-size="16" fill="#18324B" font-weight="400" text-anchor="middle">rapid increase</text>
<rect x="674" y="235" width="210" height="68" rx="16" fill="#E5F2F2" stroke="#087F8C" stroke-width="2"/><text x="779" y="265" font-family="Arial,sans-serif" font-size="18" fill="#087F8C" font-weight="700" text-anchor="middle">3  STATIONARY</text><text x="779" y="290" font-family="Arial,sans-serif" font-size="16" fill="#18324B" font-weight="400" text-anchor="middle">births ≈ deaths</text>
<rect x="900" y="235" width="170" height="68" rx="16" fill="#F8ECEA" stroke="#BE6258" stroke-width="2"/><text x="985" y="265" font-family="Arial,sans-serif" font-size="18" fill="#BE6258" font-weight="700" text-anchor="middle">4  DEATH</text><text x="985" y="290" font-family="Arial,sans-serif" font-size="16" fill="#18324B" font-weight="400" text-anchor="middle">numbers fall</text>
<rect x="1110" y="145" width="400" height="206" rx="16" fill="#F5F8FB" stroke="#CBD8DE" stroke-width="2"/><text x="1140" y="180" font-family="Arial,sans-serif" font-size="20" fill="#0B1F3A" font-weight="700" text-anchor="start">Why each phase changes</text><text x="1140" y="216" font-family="Arial,sans-serif" font-size="16" fill="#18324B" font-weight="400" text-anchor="start">Lag: few reproducing; adjustment or maturation.</text><text x="1140" y="249" font-family="Arial,sans-serif" font-size="16" fill="#18324B" font-weight="400" text-anchor="start">Exponential: ample resources; births exceed deaths.</text><text x="1140" y="282" font-family="Arial,sans-serif" font-size="16" fill="#18324B" font-weight="400" text-anchor="start">Stationary: limiting factors reduce net growth.</text><text x="1140" y="315" font-family="Arial,sans-serif" font-size="16" fill="#18324B" font-weight="400" text-anchor="start">Decline: deaths exceed births; decline may follow.</text>
<rect x="1110" y="375" width="400" height="260" rx="16" fill="#FFFAEB" stroke="#E8D99F" stroke-width="2"/><text x="1140" y="410" font-family="Arial,sans-serif" font-size="20" fill="#0B1F3A" font-weight="700" text-anchor="start">Possible limiting factors</text><text x="1140" y="447" font-family="Arial,sans-serif" font-size="17" fill="#18324B" font-weight="400" text-anchor="start">• food supply</text><text x="1140" y="480" font-family="Arial,sans-serif" font-size="17" fill="#18324B" font-weight="400" text-anchor="start">• competition</text><text x="1140" y="513" font-family="Arial,sans-serif" font-size="17" fill="#18324B" font-weight="400" text-anchor="start">• predation</text><text x="1140" y="546" font-family="Arial,sans-serif" font-size="17" fill="#18324B" font-weight="400" text-anchor="start">• disease</text><text x="1140" y="590" font-family="Arial,sans-serif" font-size="15" fill="#526578" font-weight="400" text-anchor="start">The model is conceptual, not measured data.</text>
<rect x="88" y="790" width="1420" height="92" rx="14" fill="#E8F2F5" stroke="#B8D4DD" stroke-width="2"/><text x="115" y="825" font-family="Arial,sans-serif" font-size="17" fill="#087F8C" font-weight="700" text-anchor="start">Read the slope:</text><text x="250" y="825" font-family="Arial,sans-serif" font-size="17" fill="#18324B" font-weight="400" text-anchor="start">a steep rise means a high growth rate; a flat line means little net change.</text><text x="115" y="855" font-family="Arial,sans-serif" font-size="16" fill="#0B1F3A" font-weight="700" text-anchor="start">A fall is not a fifth sigmoid phase:</text><text x="410" y="855" font-family="Arial,sans-serif" font-size="16" fill="#18324B" font-weight="400" text-anchor="start">it is a possible later outcome when conditions worsen.</text><text x="800" y="944" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0B1F3A" opacity=".065" transform="rotate(-14 800 944)">MARLBRIDGE STUDY RESOURCES</text><image x="1332" y="872" width="220" height="54" href="data:image/svg+xml;base64," xlink:href="data:image/svg+xml;base64," opacity=".94"/></svg>