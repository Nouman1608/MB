<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="871" viewBox="0 0 1528 871" role="img" aria-labelledby="title desc"><title id="title">Ventilation moves air down pressure gradients</title><desc id="desc">Inspiration and quiet expiration are linked step by step to muscle action, volume and pressure.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#1c2d4b"/></marker><marker id="red" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#b75e53"/></marker><marker id="blue" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#357ea2"/></marker></defs><rect width="100%" height="100%" fill="#f5f8f7"/><g font-family="Arial, sans-serif"><text x="24" y="58" font-size="38" font-weight="700" text-anchor="start" fill="#1c2d4b">Ventilation moves air down pressure gradients</text><text x="24" y="104" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Changing thoracic volume changes alveolar pressure relative to the atmosphere.</text><g transform="translate(24,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Inspiration at rest</text><rect x="35" y="90" width="650" height="112" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="53" y="119" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">1 Respiratory muscles contract</text><text x="53" y="150" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">Diaphragm flattens; external intercostals help raise ribs and</text><text x="53" y="177" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">sternum.</text><path d="M360,205 L360,217" fill="none" stroke="#357ea2" stroke-width="2" marker-end="url(#blue)"/><rect x="35" y="220" width="650" height="112" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="53" y="249" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">2 Thoracic and lung volume increase</text><text x="53" y="280" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">Pleural coupling allows the lungs to expand with the chest wall.</text><path d="M360,335 L360,347" fill="none" stroke="#357ea2" stroke-width="2" marker-end="url(#blue)"/><rect x="35" y="350" width="650" height="112" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="53" y="379" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">3 Alveolar pressure falls below atmosphere</text><text x="53" y="410" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">Air flows into the lungs down the pressure gradient.</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Ventilation moves air; gas exchange is diffusion of O₂ and</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">CO₂ across an exchange surface.</text></g><g transform="translate(784,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Quiet expiration</text><rect x="35" y="90" width="650" height="112" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="53" y="119" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">1 Inspiratory muscles relax</text><text x="53" y="150" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">The diaphragm rises; ribs return towards resting positions.</text><path d="M360,205 L360,217" fill="none" stroke="#357ea2" stroke-width="2" marker-end="url(#blue)"/><rect x="35" y="220" width="650" height="112" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="53" y="249" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">2 Elastic recoil reduces lung volume</text><text x="53" y="280" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">At rest this is largely passive; forced expiration recruits</text><text x="53" y="307" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">additional muscles.</text><path d="M360,335 L360,347" fill="none" stroke="#357ea2" stroke-width="2" marker-end="url(#blue)"/><rect x="35" y="350" width="650" height="112" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="53" y="379" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">3 Alveolar pressure exceeds atmosphere</text><text x="53" y="410" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">Air flows out until pressures equalise.</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Do not describe lungs as muscles that contract to force air out.</text></g><text x="24" y="849" font-size="19" font-weight="400" text-anchor="start" fill="#1c2d4b">MARLBRIDGE  •  Schematic; structures and particles are not to scale.</text></g></svg>
