<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="871" viewBox="0 0 1528 871" role="img" aria-labelledby="title desc"><title id="title">Food webs: arrow direction and trophic levels</title><desc id="desc">Grass feeds rabbits and grasshoppers; grasshoppers feed frogs; rabbits and frogs feed a hawk. Arrows point from food to consumer, and the hawk occupies different trophic levels along different chains.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#1c2d4b"/></marker><marker id="red" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#b75e53"/></marker><marker id="blue" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#357ea2"/></marker></defs><rect width="100%" height="100%" fill="#f5f8f7"/><g font-family="Arial, sans-serif"><text x="24" y="58" font-size="38" font-weight="700" text-anchor="start" fill="#1c2d4b">Food webs: arrow direction and trophic levels</text><text x="24" y="104" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">A small constructed example • arrows show energy transfer</text><g transform="translate(24,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">A small illustrative food web</text><rect x="230" y="100" width="260" height="70" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2"/><text x="360.0" y="132" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">Grass</text><rect x="45" y="265" width="235" height="75" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2"/><text x="162.5" y="297" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">Rabbit</text><rect x="435" y="265" width="235" height="75" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2"/><text x="552.5" y="297" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">Grasshopper</text><rect x="435" y="390" width="235" height="65" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2"/><text x="552.5" y="422" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">Frog</text><rect x="45" y="390" width="235" height="65" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2"/><text x="162.5" y="422" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">Hawk</text><path d="M285,180 L175,255" fill="none" stroke="#1c2d4b" stroke-width="4" marker-end="url(#arr)"/><path d="M435,180 L550,255" fill="none" stroke="#1c2d4b" stroke-width="4" marker-end="url(#arr)"/><path d="M550,350 L550,380" fill="none" stroke="#1c2d4b" stroke-width="4" marker-end="url(#arr)"/><path d="M160,350 L160,380" fill="none" stroke="#1c2d4b" stroke-width="4" marker-end="url(#arr)"/><path d="M425,423 L290,423" fill="none" stroke="#1c2d4b" stroke-width="4" marker-end="url(#arr)"/><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Arrows point from the organism eaten to its consumer. They</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">show the direction of energy transfer. In this example, the hawk</text><text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">eats rabbits and frogs.</text></g><g transform="translate(784,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Read each feeding route separately</text><rect x="60" y="100" width="600" height="95" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2"/><text x="360.0" y="132" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">Producer: grass</text><text x="360.0" y="165" font-size="20" font-weight="400" text-anchor="middle" fill="#1c2d4b">Makes organic nutrients using light energy</text><rect x="60" y="245" width="600" height="95" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2"/><text x="360.0" y="277" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">Primary consumers</text><text x="360.0" y="310" font-size="20" font-weight="400" text-anchor="middle" fill="#1c2d4b">Rabbit and grasshopper eat the producer</text><rect x="60" y="390" width="600" height="75" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2"/><text x="360.0" y="422" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">Frog and hawk occupy higher trophic levels</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">The hawk is a secondary consumer on grass → rabbit →</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">hawk, but a tertiary consumer on grass → grasshopper → frog</text><text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">→ hawk. A trophic level depends on the route.</text></g><text x="24" y="849" font-size="19" font-weight="400" text-anchor="start" fill="#1c2d4b">MARLBRIDGE  •  Schematic; structures and particles are not to scale.</text></g></svg>
