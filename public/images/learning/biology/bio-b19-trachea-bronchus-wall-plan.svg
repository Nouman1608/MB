<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Trachea and bronchus: airway wall plan diagrams</title><desc id="desc">Line-only plan diagrams show the trachea and bronchus wall from lumen outward, with ciliated epithelium, submucosal gland layer, cartilage and outer tissue; tracheal cartilage is thicker and bronchial cartilage is separated into plates.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#168C8C"/></marker><marker id="arrN" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#17324D"/></marker></defs><rect width="1600" height="1000" fill="#F4F8F7"/><text x="800" y="62" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#17324D" text-anchor="middle">Trachea and bronchus: airway wall plan diagrams</text><text x="800" y="98" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#526778" text-anchor="middle">Marlbridge • Cambridge International A Level Biology 9700 • Gas exchange • plan drawing</text><rect x="48" y="130" width="1504" height="735" rx="18" fill="#fff" stroke="#CAD7DC" stroke-width="2"/><text x="800" y="175" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#17324D" text-anchor="middle">Plan views: tissue layers from airway lumen outward</text><rect x="85" y="210" width="690" height="520" rx="14" fill="#fff" stroke="#CAD7DC" stroke-width="2"/><text x="430" y="250" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#168C8C" text-anchor="middle">TRACHEA WALL</text><rect x="180" y="280" width="500" height="28" rx="4" fill="none" stroke="#172B3C" stroke-width="3"/><text x="430" y="300.0" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#17324D" text-anchor="middle">Lumen</text><rect x="180" y="315" width="500" height="38" rx="4" fill="none" stroke="#172B3C" stroke-width="3"/><text x="430" y="340.0" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#17324D" text-anchor="middle">Ciliated epithelium</text><rect x="180" y="360" width="500" height="68" rx="4" fill="none" stroke="#172B3C" stroke-width="3"/><text x="430" y="400.0" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#17324D" text-anchor="middle">Submucosa / glands</text><rect x="180" y="435" width="500" height="155" rx="4" fill="none" stroke="#172B3C" stroke-width="3"/><text x="430" y="518.5" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#17324D" text-anchor="middle">Cartilage</text><rect x="180" y="597" width="500" height="45" rx="4" fill="none" stroke="#172B3C" stroke-width="3"/><text x="430" y="625.5" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#17324D" text-anchor="middle">Outer connective tissue</text><text x="430" y="670" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#526778" text-anchor="middle">Thick C-shaped cartilage is the dominant support.</text><rect x="825" y="210" width="690" height="520" rx="14" fill="#fff" stroke="#CAD7DC" stroke-width="2"/><text x="1170" y="250" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#3983B8" text-anchor="middle">BRONCHUS WALL</text><rect x="920" y="280" width="500" height="28" rx="4" fill="none" stroke="#172B3C" stroke-width="3"/><text x="1170" y="300.0" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#17324D" text-anchor="middle">Lumen</text><rect x="920" y="315" width="500" height="38" rx="4" fill="none" stroke="#172B3C" stroke-width="3"/><text x="1170" y="340.0" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#17324D" text-anchor="middle">Ciliated epithelium</text><rect x="920" y="360" width="500" height="68" rx="4" fill="none" stroke="#172B3C" stroke-width="3"/><text x="1170" y="400.0" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#17324D" text-anchor="middle">Submucosa / glands</text><rect x="920" y="435" width="500" height="95" rx="5" fill="none" stroke="#172B3C" stroke-width="3" stroke-dasharray="30 12"/><text x="1170" y="488.5" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#17324D" text-anchor="middle">separate cartilage plates</text><rect x="920" y="537" width="500" height="45" rx="4" fill="none" stroke="#172B3C" stroke-width="3"/><text x="1170" y="565.5" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#17324D" text-anchor="middle">Outer connective tissue</text><text x="1170" y="670" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#526778" text-anchor="middle">Cartilage occurs as plates; smooth muscle is more prominent.</text><rect x="100" y="755" width="1400" height="64" rx="12" fill="#FFF4D6" stroke="#E1AA37" stroke-width="2"/><text x="800" y="794" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17324D" text-anchor="middle">Worked plan exemplar: continuous tissue outlines only — do not draw individual cells or shade.</text><text x="42" y="944" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#526778" text-anchor="start">Schematic plan exemplars • tissue proportions are qualitative</text><path d="M40 918H1560" stroke="#E1AA37" stroke-width="3"/><text x="800" y="900" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#17324D" opacity=".07" text-anchor="middle">MARLBRIDGE STUDY RESOURCES</text><image href="data:image/svg+xml;base64," x="1365" y="923" width="190" height="54" preserveAspectRatio="xMaxYMid meet"/><text x="42" y="980" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#526778" text-anchor="start">MARLBRIDGE  •  STUDY RESOURCE</text></svg>