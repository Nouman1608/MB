<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="t d"><title id="t">Blood: recognise the formed elements</title><desc id="d">Morphology comparison of mature mammalian red blood cells, phagocytes, lymphocytes, platelets and plasma. Red cells are biconcave, lack a nucleus and contain haemoglobin; phagocytes ingest and digest pathogens; lymphocytes release antibodies; platelets are cell fragments.</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#10233F">Blood: recognise the formed elements</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#5B6D80">Marlbridge • Edexcel International GCSE Biology 4BI1 • Blood (2.59–2.62)</text><rect x="52" y="132" width="1424" height="680" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="98" y="168" width="1330" height="490" rx="16" fill="#FBFCFD" stroke="#D3DCE2" stroke-width="2"/><text x="763" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#5B6D80">SCHEMATIC MICROSCOPIC VIEW • not to scale</text><rect x="125" y="232" width="1274" height="390" rx="110" fill="#F4FAFC" stroke="#D9E8EF" stroke-width="2"/><text x="1380" y="263" text-anchor="end" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#315F86">PLASMA • liquid component</text><ellipse cx="310" cy="405" rx="105" ry="68" fill="#E9A5A0" stroke="#A7484A" stroke-width="3"/><ellipse cx="310" cy="405" rx="44" ry="27" fill="#F7D6D3" stroke="#C97C7C" stroke-width="2"/><text x="310" y="410" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">biconcave</text><text x="310" y="432" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#10233F">disc</text><text x="310" y="511" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#C44949">Mature mammalian red blood cell</text><text x="310" y="536" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#20314B">No nucleus • haemoglobin carries O₂</text><rect x="520" y="276" width="260" height="72" rx="14" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/><text x="650" y="307" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">Biconcave shape</text><text x="650" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#20314B">large surface area : volume</text><rect x="520" y="363" width="260" height="72" rx="14" fill="#E8F1F4" stroke="#315F86" stroke-width="2"/><text x="650" y="394" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">No nucleus</text><text x="650" y="417" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#20314B">more room for haemoglobin</text><rect x="520" y="450" width="260" height="72" rx="14" fill="#EAF5F1" stroke="#397D64" stroke-width="2"/><text x="650" y="481" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">Haemoglobin</text><text x="650" y="504" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#20314B">binds oxygen in the lungs</text><ellipse cx="1005" cy="374" rx="82" ry="72" fill="#DCEAF4" stroke="#597A97" stroke-width="3"/><ellipse cx="985" cy="369" rx="31" ry="24" fill="#8B75A8" stroke="#725C8E" stroke-width="2"/><ellipse cx="1028" cy="378" rx="27" ry="20" fill="#8B75A8" stroke="#725C8E" stroke-width="2"/><text x="1005" y="475" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#315F86">Phagocyte</text><text x="1005" y="499" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#20314B">ingests pathogens and digests</text><text x="1005" y="519" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#20314B">them with enzymes</text><ellipse cx="1242" cy="366" rx="58" ry="54" fill="#E3EEF8" stroke="#597A97" stroke-width="3"/><ellipse cx="1242" cy="366" rx="36" ry="33" fill="#8B75A8" stroke="#725C8E" stroke-width="2"/><text x="1242" y="451" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#315F86">Lymphocyte</text><text x="1242" y="475" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#20314B">releases antibodies</text><path d="M1167 557q12-14 26 0q9 12-4 18q-14 5-22-18m65 4q12-13 24 1q8 11-6 17q-13 4-18-18m66-5q11-12 23 2q8 10-5 16q-13 4-18-18" fill="#C9A227" stroke="#927317" stroke-width="2"/><text x="1226" y="610" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">Platelets: cell fragments</text><rect x="120" y="690" width="1288" height="76" rx="8" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/><text x="764" y="721" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">Plasma carries nutrients, hormones and urea; most blood CO₂ is carried as bicarbonate ions.</text><text x="764" y="747" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">The source’s “dissolved CO₂” is a simplification; only a small fraction travels as dissolved CO₂.</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE  •  STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
