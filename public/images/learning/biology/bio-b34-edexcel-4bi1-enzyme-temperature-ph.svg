<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="871" viewBox="0 0 1528 871" role="img" aria-labelledby="title desc"><title id="title">Why temperature and pH affect enzymes</title><desc id="desc">Temperature below the optimum affects kinetic energy and effective collisions; excessive heat changes the active site. Different enzymes have different optimum pH values.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#1c2d4b"/></marker><marker id="red" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#b75e53"/></marker><marker id="blue" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#357ea2"/></marker></defs><rect width="100%" height="100%" fill="#f5f8f7"/><g font-family="Arial, sans-serif"><text x="24" y="58" font-size="38" font-weight="700" text-anchor="start" fill="#1c2d4b">Why temperature and pH affect enzymes</text><text x="24" y="104" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Connect each factor to molecular movement or active-site shape</text><g transform="translate(24,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Temperature changes activity</text><path d="M120,250 C90,330 160,395 220,390 C320,392 355,310 315,250 L260,250 L260,295 L180,295 L180,250 Z" fill="#e2efec" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="182" y="252" width="76" height="41" rx="2" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><text x="220" y="115" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">Below the optimum</text><rect x="470" y="150" width="76" height="43" rx="2" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><path d="M455,275 C425,365 520,420 600,380 C660,350 650,260 600,250 L580,285 L530,260 L510,310 L475,300 Z" fill="#e2efec" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="550" y="115" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">Excessive heat</text><text x="220" y="440" font-size="21" font-weight="400" text-anchor="middle" fill="#1c2d4b">Complementary active site</text><text x="550" y="440" font-size="21" font-weight="400" text-anchor="middle" fill="#1c2d4b">Changed active-site shape</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Warming below the optimum increases effective collisions.</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Excessive heat denatures the enzyme. Low temperature alone</text><text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">does not denature it.</text></g><g transform="translate(784,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">pH changes shape and fit</text><rect x="70" y="130" width="580" height="100" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2"/><text x="360" y="173" font-size="24" font-weight="700" text-anchor="middle" fill="#1c2d4b">Each enzyme has its own optimum pH.</text><text x="360" y="207" font-size="23" font-weight="400" text-anchor="middle" fill="#1c2d4b">Moving away from it reduces activity.</text><rect x="65" y="290" width="265" height="120" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2"/><text x="197.5" y="322" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">Pepsin</text><text x="197.5" y="355" font-size="20" font-weight="400" text-anchor="middle" fill="#1c2d4b">Acidic conditions</text><rect x="390" y="290" width="265" height="120" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2"/><text x="522.5" y="322" font-size="23" font-weight="700" text-anchor="middle" fill="#1c2d4b">Trypsin</text><text x="522.5" y="355" font-size="20" font-weight="400" text-anchor="middle" fill="#1c2d4b">Alkaline conditions</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">An unsuitable pH can alter the active site; extreme pH can</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">denature the enzyme. Do not explain pH effects by increased</text><text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">kinetic energy.</text></g><text x="24" y="849" font-size="19" font-weight="400" text-anchor="start" fill="#1c2d4b">MARLBRIDGE  •  Schematic; structures and particles are not to scale.</text></g></svg>
