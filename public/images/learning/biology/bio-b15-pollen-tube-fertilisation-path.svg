<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc"><title id="title">Pollen tube growth and fertilisation in a flower</title><desc id="desc">A longitudinal schematic shows pollen on stigma, pollen tube growing down the style into ovary and ovule, two male gamete nuclei travelling in the tube, one fusing with the egg nucleus in the simplified pathway, and ovule-to-seed and ovary-to-fruit outcomes. The second fertilisation event is not shown.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#087F8C"/></marker><marker id="arrgold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#C9A227"/></marker></defs><rect width="1600" height="960" fill="#F3F7F6"/><text x="800" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0B1F3A">Pollen tube growth and fertilisation in a flower</text><text x="800" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#526578">Marlbridge · schematic teaching diagram · not to scale</text><rect x="38" y="116" width="1024" height="714" rx="16" fill="#FFFFFF" stroke="#CBD8DE" stroke-width="2"/><text x="65" y="153" font-family="Arial,sans-serif" font-size="20" fill="#0B1F3A" font-weight="700" text-anchor="start">Longitudinal view of carpel and ovule</text>
<path d="M525 258 C500 280 501 350 507 429 C510 475 515 514 520 550" fill="none" stroke="#D8E8E2" stroke-width="98" stroke-linecap="round"/><path d="M525 258 C500 280 501 350 507 429 C510 475 515 514 520 550" fill="none" stroke="#4D8B59" stroke-width="4" stroke-linecap="round"/>
<ellipse cx="525" cy="218" rx="110" ry="32" fill="#E8B8B3" stroke="#BE6258" stroke-width="3"/><text x="525" y="223" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#18324B" text-anchor="middle">STIGMA</text>
<ellipse cx="525" cy="339" rx="29" ry="17" fill="#E5D280" stroke="#C9A227" stroke-width="3"/><circle cx="517" cy="338" r="5" fill="#0B1F3A"/><circle cx="532" cy="338" r="5" fill="#0B1F3A"/><text x="574" y="345" font-family="Arial,sans-serif" font-size="14" fill="#18324B">pollen grain; two male gamete nuclei shown</text>
<path d="M525 354 C522 386 531 411 522 439 S526 490 520 548" fill="none" stroke="#C9A227" stroke-width="7" stroke-linecap="round" marker-end="url(#arrgold)"/><circle cx="523" cy="390" r="7" fill="#0B1F3A"/><circle cx="525" cy="427" r="7" fill="#0B1F3A"/>
<path d="M515 541 C440 563 400 626 415 700 C428 770 487 801 538 786 C599 768 620 696 598 633 C582 589 548 557 515 541Z" fill="#F4E7C7" stroke="#C9A227" stroke-width="4"/><text x="354" y="588" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#18324B">OVARY</text>
<path d="M497 649 C497 605 540 590 565 622 C590 655 573 720 542 745 C516 724 495 693 497 649Z" fill="#E5F0E2" stroke="#4D8B59" stroke-width="4"/><text x="563" y="635" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#18324B">OVULE</text>
<path d="M498 645 C492 627 491 612 492 598" fill="none" stroke="#C9A227" stroke-width="7" marker-end="url(#arrgold)"/><circle cx="522" cy="673" r="11" fill="#E8B8B3" stroke="#BE6258" stroke-width="3"/><text x="455" y="699" font-family="Arial,sans-serif" font-size="14" fill="#18324B">egg nucleus</text><circle cx="508" cy="617" r="6" fill="#0B1F3A"/><circle cx="516" cy="608" r="6" fill="#0B1F3A"/>
<line x1="563" y1="217" x2="696" y2="190" stroke="#BE6258" stroke-width="2" /><text x="710" y="194" font-family="Arial,sans-serif" font-size="16" fill="#18324B" font-weight="600" text-anchor="start">Stigma receives compatible pollen</text><line x1="538" y1="401" x2="689" y2="390" stroke="#C9A227" stroke-width="2" /><text x="702" y="396" font-family="Arial,sans-serif" font-size="16" fill="#18324B" font-weight="600" text-anchor="start">Pollen tube grows through the style</text><line x1="565" y1="609" x2="692" y2="573" stroke="#4D8B59" stroke-width="2" /><text x="704" y="578" font-family="Arial,sans-serif" font-size="16" fill="#18324B" font-weight="600" text-anchor="start">Tube enters ovule; male nuclei travel down it</text><line x1="533" y1="674" x2="691" y2="670" stroke="#BE6258" stroke-width="2" /><text x="704" y="676" font-family="Arial,sans-serif" font-size="15" fill="#18324B" font-weight="600" text-anchor="start">One male nucleus fuses with egg nucleus → zygote</text>
<rect x="1092" y="116" width="468" height="312" rx="16" fill="#FFFFFF" stroke="#CBD8DE" stroke-width="2"/><text x="1120" y="154" font-family="Arial,sans-serif" font-size="20" fill="#0B1F3A" font-weight="700" text-anchor="start">Sequence</text><text x="1120" y="192" font-family="Arial,sans-serif" font-size="16" fill="#18324B" font-weight="400" text-anchor="start">1  Pollen lands on stigma (pollination).</text><text x="1120" y="228" font-family="Arial,sans-serif" font-size="16" fill="#18324B" font-weight="400" text-anchor="start">2  Tube grows down the style into ovary.</text><text x="1120" y="264" font-family="Arial,sans-serif" font-size="16" fill="#18324B" font-weight="400" text-anchor="start">3  Male gamete nuclei move through tube.</text><text x="1120" y="300" font-family="Arial,sans-serif" font-size="16" fill="#18324B" font-weight="400" text-anchor="start">4  One fuses with egg nucleus → zygote.</text><text x="1120" y="336" font-family="Arial,sans-serif" font-size="16" fill="#18324B" font-weight="400" text-anchor="start">5  Zygote develops into embryo.</text><text x="1120" y="372" font-family="Arial,sans-serif" font-size="15" fill="#526578" font-weight="400" text-anchor="start">Pollination is pollen transfer; fertilisation</text><text x="1120" y="398" font-family="Arial,sans-serif" font-size="15" fill="#526578" font-weight="400" text-anchor="start">is fusion of nuclei.</text>
<rect x="1092" y="450" width="468" height="188" rx="16" fill="#E8F2F5" stroke="#B8D4DD" stroke-width="2"/><text x="1120" y="489" font-family="Arial,sans-serif" font-size="20" fill="#0B1F3A" font-weight="700" text-anchor="start">After fertilisation</text><text x="1120" y="531" font-family="Arial,sans-serif" font-size="16" fill="#4D8B59" font-weight="700" text-anchor="start">OVULE → SEED (including embryo + seed coat)</text><text x="1120" y="571" font-family="Arial,sans-serif" font-size="16" fill="#C9A227" font-weight="700" text-anchor="start">OVARY → FRUIT (contains / protects seeds)</text><text x="1120" y="611" font-family="Arial,sans-serif" font-size="14" fill="#526578" font-weight="400" text-anchor="start">Simplified IGCSE focus; second fertilisation</text><text x="1120" y="631" font-family="Arial,sans-serif" font-size="14" fill="#526578" font-weight="400" text-anchor="start">event and endosperm formation are not shown.</text>
<rect x="1092" y="660" width="468" height="136" rx="16" fill="#F8ECEA" stroke="#E3C3BE" stroke-width="2"/><text x="1120" y="698" font-family="Arial,sans-serif" font-size="18" fill="#BE6258" font-weight="700" text-anchor="start">Diagram limit</text><text x="1120" y="733" font-family="Arial,sans-serif" font-size="15" fill="#18324B" font-weight="400" text-anchor="start">This is not to scale. Ovule entry is enlarged;</text><text x="1120" y="759" font-family="Arial,sans-serif" font-size="15" fill="#18324B" font-weight="400" text-anchor="start">the route is schematic, not a real micrograph.</text><text x="1120" y="781" font-family="Arial,sans-serif" font-size="14" fill="#526578" font-weight="400" text-anchor="start">Two male nuclei shown; the second event is omitted.</text><text x="800" y="944" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#0B1F3A" opacity=".065" transform="rotate(-14 800 944)">MARLBRIDGE STUDY RESOURCES</text><image x="1332" y="872" width="220" height="54" href="data:image/svg+xml;base64," xlink:href="data:image/svg+xml;base64," opacity=".94"/></svg>