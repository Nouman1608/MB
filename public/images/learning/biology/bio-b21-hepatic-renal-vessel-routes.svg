<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Hepatic and renal vessels: trace the branches</title><desc id="desc">A simplified body map shows the hepatic portal vein from small intestine to liver, hepatic artery from aorta to liver, hepatic vein to vena cava, and renal arteries/veins connecting aorta, kidneys and vena cava.</desc><defs><marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#D76C61"/></marker><marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#3983B8"/></marker><marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#168C8C"/></marker><marker id="arrow-gold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#E1AA37"/></marker></defs><rect width="1600" height="1000" fill="#F4F8F7"/><text x="800" y="60" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#17324D" text-anchor="middle">Hepatic and renal vessels: trace the branches</text><text x="800" y="96" font-family="Arial,sans-serif" font-size="18" font-weight="500" fill="#526778" text-anchor="middle">Pearson Edexcel International GCSE Biology 4BI1 • Circulation • hepatic portal and renal vessels</text><rect x="55" y="140" width="1490" height="700" rx="14" fill="#fff" stroke="#CAD7DC" stroke-width="2"/><text x="95" y="190" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17324D" text-anchor="start">Organ-specific vessels branch from the main systemic circulation</text><path d="M500 270 Q800 205 1100 270 L1160 690 Q800 760 440 690Z" fill="#F4F8F7" stroke="#CAD7DC" stroke-width="3"/><path d="M790 275 L790 680" fill="none" stroke="#D76C61" stroke-width="12"/><text x="760" y="255" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#D76C61" text-anchor="end">aorta</text><path d="M845 680 L845 275" fill="none" stroke="#3983B8" stroke-width="12"/><text x="875" y="255" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#3983B8" text-anchor="start">vena cava</text><rect x="520" y="395" width="155" height="105" rx="18" fill="#FFF4D6" stroke="#E1AA37" stroke-width="3"/><text x="598" y="450" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17324D" text-anchor="middle">small intestine</text><path d="M900 375 Q1030 345 1060 425 Q1045 485 925 485 Q880 450 900 375Z" fill="#FCE9E1" stroke="#D76C61" stroke-width="4"/><text x="970" y="430" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#17324D" text-anchor="middle">liver</text><path d="M690 560 Q650 550 660 610 Q685 640 710 605 Q720 575 690 560Z" fill="#DDEFF7" stroke="#3983B8" stroke-width="3"/><path d="M950 560 Q990 550 980 610 Q955 640 930 605 Q920 575 950 560Z" fill="#DDEFF7" stroke="#3983B8" stroke-width="3"/><text x="820" y="650" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17324D" text-anchor="middle">kidneys</text><path d="M675 425 L900 415" fill="none" stroke="#168C8C" stroke-width="5" marker-end="url(#arrow-teal)"/><rect x="692" y="366" width="186" height="27" rx="8" fill="#FFFFFF" opacity=".94"/><text x="785" y="385" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#168C8C" text-anchor="middle">hepatic portal vein: gut → liver</text><path d="M790 340 L900 380" fill="none" stroke="#D76C61" stroke-width="4" marker-end="url(#arrow-red)"/><text x="785" y="325" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#D76C61" text-anchor="end">hepatic artery</text><path d="M1045 465 L845 465" fill="none" stroke="#3983B8" stroke-width="4" marker-end="url(#arrow-blue)"/><text x="1010" y="510" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#3983B8" text-anchor="middle">hepatic vein → vena cava</text><path d="M790 540 L700 570" fill="none" stroke="#D76C61" stroke-width="4" marker-end="url(#arrow-red)"/><path d="M790 540 L950 570" fill="none" stroke="#D76C61" stroke-width="4" marker-end="url(#arrow-red)"/><path d="M700 600 L845 610" fill="none" stroke="#3983B8" stroke-width="4" marker-end="url(#arrow-blue)"/><path d="M950 600 L845 610" fill="none" stroke="#3983B8" stroke-width="4" marker-end="url(#arrow-blue)"/><text x="610" y="665" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#D76C61" text-anchor="start">renal artery</text><text x="915" y="665" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#3983B8" text-anchor="start">renal vein</text><rect x="150" y="755" width="1300" height="65" rx="12" fill="#FFF4D6" stroke="#E1AA37" stroke-width="2"/><text x="800" y="785" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#17324D" text-anchor="middle">Hepatic portal blood travels from gut to liver; hepatic artery and renal artery carry blood from the aorta.</text><text x="800" y="810" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#526778" text-anchor="middle">Hepatic and renal veins return blood toward the vena cava.</text><text x="42" y="938" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#526778" text-anchor="start">Simplified route map • vessel sizes and organ positions not to scale</text><path d="M40 918H1560" stroke="#E1AA37" stroke-width="3"/><text x="800" y="898" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#17324D" opacity=".07" text-anchor="middle">MARLBRIDGE STUDY RESOURCES</text><image href="data:image/svg+xml;base64," x="1365" y="923" width="190" height="54" preserveAspectRatio="xMaxYMid meet"/><text x="42" y="980" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#526778" text-anchor="start">MARLBRIDGE • STUDY RESOURCE</text></svg>
