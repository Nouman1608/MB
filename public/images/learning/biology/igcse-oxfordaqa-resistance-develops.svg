<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1290" viewBox="0 0 1800 2580" role="img" aria-labelledby="title desc"><title id="title">How resistance develops (OxfordAQA International GCSE Biology)</title><desc id="desc">Four steps in a dish of bacteria: (1) a random mutation makes one bacterium resistant; (2) the antibiotic kills the non-resistant ones; (3) the survivor divides, passing on the gene; (4) a resistant strain forms and the antibiotic no longer works. This follows 9201 3.4.7h: resistant pathogens survive and reproduce, so the resistant strain rises. No tier labels.</desc><rect width="1800" height="2580" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="88" font-size="68" font-weight="700" fill="#1E2B47" text-anchor="middle">How resistance develops</text>
