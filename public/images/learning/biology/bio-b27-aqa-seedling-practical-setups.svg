<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="ti de"><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#315F86"/></marker></defs><title id="ti">Seedling practical: control light and gravity tests</title><desc id="de">Two controlled seedling investigations. In the gravity setup, newly germinated seedlings begin horizontal on moist cotton in a covered dish so the root and shoot responses can be observed relative to downward gravity. In the light setup, seedlings receive light from one side. Keep seed type, water and temperature consistent, use replicates, record labelled drawings and lengths, then calculate means.</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#10233F">Seedling practical: control light and gravity tests</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#5B6D80">Marlbridge • AQA GCSE Biology 8461 • Required practical 8</text><rect x="52" y="132" width="1424" height="680" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="92" y="168" width="650" height="446" rx="14" fill="#FBFCFD" stroke="#D3DCE2" stroke-width="2"/><rect x="786" y="168" width="650" height="446" rx="14" fill="#FBFCFD" stroke="#D3DCE2" stroke-width="2"/><text x="417" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">A • TEST THE EFFECT OF GRAVITY</text><text x="1111" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">B • TEST THE EFFECT OF DIRECTIONAL LIGHT</text><rect x="132" y="242" width="570" height="270" rx="14" fill="#EAF5FB" stroke="#315F86" stroke-width="2"/><rect x="818" y="242" width="586" height="270" rx="14" fill="#FFF9E8" stroke="#C9A227" stroke-width="2"/><text x="417" y="273" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">Covered dish • seedlings start horizontal</text><text x="1111" y="273" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">Lamp to one side • seedlings start upright</text><rect x="168" y="310" width="498" height="152" rx="10" fill="#E9F4F4" stroke="#8ABCC8" stroke-width="2"/><path d="M202 420H621" stroke="#B9D9D4" stroke-width="12" stroke-linecap="round"/><ellipse cx="296" cy="405" rx="17" ry="12" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/><ellipse cx="476" cy="405" rx="17" ry="12" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/><ellipse cx="202" cy="420" rx="9" ry="9" fill="#397D64" stroke="#397D64" stroke-width="2"/><ellipse cx="382" cy="420" rx="9" ry="9" fill="#397D64" stroke="#397D64" stroke-width="2"/><path d="M615 326L615 389" stroke="#315F86" stroke-width="3" fill="none" marker-end="url(#a)" stroke-linecap="round"/><text x="600" y="320" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#315F86">g</text><text x="417" y="480" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#20314B">Equal moist cotton • same seed type</text><path d="M296 405C335 388 351 366 358 344M296 405C267 387 254 366 250 344M476 405C517 387 531 366 536 344M476 405C447 387 433 366 429 344" fill="none" stroke="#397D64" stroke-width="7" stroke-linecap="round"/><text x="417" y="508" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#10233F">Keep water, temperature and light consistent</text><rect x="839" y="310" width="162" height="152" rx="10" fill="#FBFCFD" stroke="#315F86" stroke-width="2"/><rect x="1078" y="310" width="162" height="152" rx="10" fill="#FBFCFD" stroke="#315F86" stroke-width="2"/><rect x="1268" y="350" width="82" height="86" rx="8" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/><text x="1309" y="397" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#10233F">LAMP</text><path d="M1265 375L1218 375" stroke="#C9A227" stroke-width="4" fill="none" marker-end="url(#a)" stroke-linecap="round"/><ellipse cx="907" cy="379" rx="14" ry="11" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/><ellipse cx="1146" cy="379" rx="14" ry="11" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/><path d="M907 367V332M907 391V421M1146 367V332M1146 391V421" stroke="#397D64" stroke-width="7" stroke-linecap="round"/><text x="920" y="487" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#20314B">same seed batch, water,</text><text x="920" y="506" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#20314B">temperature and time</text><text x="1146" y="487" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#20314B">directional light changes;</text><text x="1146" y="506" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#20314B">keep other factors fixed</text><rect x="120" y="650" width="1288" height="117" rx="9" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/><text x="764" y="682" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">Use replicates • make careful labelled biological drawings • measure root and shoot lengths.</text><text x="764" y="712" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#20314B">Calculate mean lengths; keep seed type, water and temperature the same.</text><text x="764" y="740" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#5B6D80">The setups are schematic; they do not specify a required exposure time or seedling count.</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE  •  STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
