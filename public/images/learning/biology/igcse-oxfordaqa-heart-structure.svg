<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1180" viewBox="0 0 1800 2360" role="img" aria-labelledby="title desc"><title id="title">Inside the heart (OxfordAQA International GCSE Biology)</title><desc id="desc">Schematic section of the heart, drawn as if facing the person, so the left side is on the right of the page. Deoxygenated blood enters the right atrium from the vena cava and leaves the right ventricle in the pulmonary artery; oxygenated blood enters the left atrium from the pulmonary vein and leaves the left ventricle in the aorta. Labels show the atrioventricular and semilunar valves, the septum, the thick muscular wall and the coronary artery. No tier labels. The two valve names are greyed with a note that they are not required by OxfordAQA: 9201 3.2.3h says knowledge of the names of the heart valves is not required.</desc><rect width="1800" height="2360" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="88" font-size="68" font-weight="700" fill="#1E2B47" text-anchor="middle">Inside the heart</text>
<text x="900" y="164" font-size="44" fill="#4B5B72" text-anchor="middle">Schematic section, not to scale</text>
<text x="60" y="284" font-size="32" fill="#6B7785">Grey: valve names are not required by OxfordAQA</text>
