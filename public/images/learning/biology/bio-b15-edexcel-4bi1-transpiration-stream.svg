<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="871" viewBox="0 0 1528 871" role="img" aria-labelledby="title desc"><title id="title">Water movement through a plant</title><desc id="desc">Water enters root hairs by osmosis and travels through the cortex and xylem to mesophyll cells. It evaporates into air spaces and diffuses through stomata as water vapour; transpiration pulls water up xylem.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#1c2d4b"/></marker><marker id="red" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#b75e53"/></marker><marker id="blue" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#357ea2"/></marker></defs><rect width="100%" height="100%" fill="#f5f8f7"/><g font-family="Arial, sans-serif"><text x="24" y="58" font-size="38" font-weight="700" text-anchor="start" fill="#1c2d4b">Water movement through a plant</text><text x="24" y="104" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Root uptake → xylem transport → evaporation → diffusion</text><g transform="translate(24,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">The transpiration stream</text><path d="M340,430 V180" fill="none" stroke="#73aaa5" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/><path d="M340,235 C220,200 180,120 230,95 C310,80 345,155 340,235 Z" fill="#e2efec" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M350,190 C450,180 520,100 475,80 C390,75 350,140 350,190 Z" fill="#e2efec" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M340,430 L230,455 M340,430 L430,455" fill="none" stroke="#73aaa5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M340,395 L340,265" fill="none" stroke="#357ea2" stroke-width="4" marker-end="url(#blue)"/><path d="M340,230 L420,150" fill="none" stroke="#357ea2" stroke-width="4" marker-end="url(#blue)"/><path d="M417,297.3 L350,310" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="425" y="305" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Xylem</text><path d="M231.984375,362.3 L295,430" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="95" y="370" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Water uptake</text><text x="95" y="125" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">Leaves</text><path d="M480,145 L590,105" fill="none" stroke="#357ea2" stroke-width="4" marker-end="url(#blue)"/><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Water enters root hairs by osmosis, crosses the cortex, and</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">travels up the xylem to mesophyll cells. Transpiration creates a</text><text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">pull on the water column.</text></g><g transform="translate(784,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Two steps inside and out of the leaf</text><rect x="60" y="125" width="200" height="240" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2"/><text x="160" y="175" font-size="24" font-weight="700" text-anchor="middle" fill="#1c2d4b">Mesophyll</text><text x="160" y="207" font-size="24" font-weight="700" text-anchor="middle" fill="#1c2d4b">cell</text><path d="M245,270 L405,270" fill="none" stroke="#357ea2" stroke-width="4" marker-end="url(#blue)"/><circle cx="425" cy="220" r="6" fill="#357ea2" stroke="#1c2d4b" stroke-width="2"/><circle cx="455" cy="260" r="6" fill="#357ea2" stroke="#1c2d4b" stroke-width="2"/><circle cx="430" cy="310" r="6" fill="#357ea2" stroke="#1c2d4b" stroke-width="2"/><circle cx="490" cy="230" r="6" fill="#357ea2" stroke="#1c2d4b" stroke-width="2"/><text x="435" y="160" font-size="24" font-weight="700" text-anchor="middle" fill="#1c2d4b">Air space</text><rect x="550" y="110" width="65" height="150" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2"/><rect x="550" y="320" width="65" height="100" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2"/><path d="M470,285 L660,285" fill="none" stroke="#357ea2" stroke-width="4" marker-end="url(#blue)"/><text x="365" y="390" font-size="22" font-weight="700" text-anchor="middle" fill="#1c2d4b">1 Evaporation</text><text x="650" y="470" font-size="22" font-weight="700" text-anchor="middle" fill="#1c2d4b">2 Diffusion</text><text x="650" y="240" font-size="22" font-weight="700" text-anchor="middle" fill="#1c2d4b">Air</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">1 Water evaporates from moist mesophyll surfaces into leaf air</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">spaces. 2 Water vapour diffuses out through stomata, down its</text><text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">concentration gradient.</text></g><text x="24" y="849" font-size="19" font-weight="400" text-anchor="start" fill="#1c2d4b">MARLBRIDGE  •  Schematic; structures and particles are not to scale.</text></g><text x="1504" y="856" text-anchor="end" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#31516e">MARLBRIDGE STUDY RESOURCES</text><image href="data:image/svg+xml;base64," x="1320" y="12" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
