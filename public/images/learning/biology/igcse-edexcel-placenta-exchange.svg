<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 1800 2400" role="img" aria-labelledby="title desc"><title id="title">Inside the uterus (Edexcel International GCSE Biology)</title><desc id="desc">Top: the fetus inside the uterus, in the amniotic sac filled with amniotic fluid that cushions it; the umbilical cord carries blood to and from the placenta, which swaps materials. Bottom: exchange in the placenta, where the mother's and fetus's blood do not mix: oxygen, glucose and amino acids pass to the fetus; carbon dioxide and urea pass to the mother. A greyed note that some viruses and nicotine can also cross is marked not required by Edexcel. No tier labels: the placenta and amniotic fluid are 4BI1 statements 3.11 and 3.12, on both papers.</desc><rect width="1800" height="2400" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="88" font-size="68" font-weight="700" fill="#1E2B47" text-anchor="middle">Inside the uterus</text>
