<line x1="1300" y1="1070" x2="1157.0588235294117" y2="1146.235294117647" stroke="#1E2B47" stroke-width="8" stroke-linecap="round"/><polygon points="1120,1166 1148.5,1125.9 1169.2,1164.7" fill="#1E2B47"/>
<line x1="300" y1="1070" x2="300" y2="1458" stroke="#8A6A0C" stroke-width="8" stroke-linecap="round"/><polygon points="300,1500 278,1456 322,1456" fill="#8A6A0C"/>
<text x="334" y="1278" font-size="42" font-weight="700" fill="#6B7785">Deamination:</text>
<text x="334" y="1334" font-size="42" fill="#6B7785">urea to soil</text>
<text x="92" y="1610" font-size="42" fill="#8A6A0C">nitrogen compounds</text>
<line x1="780" y1="1396" x2="612.703211302352" y2="1626.033084459266" stroke="#2F6B63" stroke-width="8" stroke-linecap="round"/><polygon points="588,1660 596.1,1611.5 631.7,1637.4" fill="#2F6B63"/>
<text x="966" y="1496" font-size="44" font-weight="700" fill="#2F6B63" text-anchor="middle">Decomposition</text>
<rect x="784" y="1532" width="56" height="28" rx="14" fill="#DDEBE8" stroke="#2F6B63" stroke-width="4"/>
<text x="866" y="1560" font-size="42" fill="#2F6B63">decomposers</text>
<rect x="160" y="1680" width="480" height="200" rx="24" fill="#FFFFFF" stroke="#1E2B47" stroke-width="5"/>
<text x="400" y="1756" font-size="44" font-weight="700" fill="#1E2B47" text-anchor="middle">Ammonium ions</text>
<text x="400" y="1820" font-size="42" fill="#1E2B47" text-anchor="middle" xml:space="preserve"><tspan>NH</tspan><tspan dy="11.8" font-size="28.6">4</tspan><tspan dy="-27.7" font-size="28.6">+</tspan></text>
<rect x="1160" y="1680" width="520" height="200" rx="24" fill="#FFFFFF" stroke="#1E2B47" stroke-width="5"/>
<text x="1420" y="1756" font-size="44" font-weight="700" fill="#1E2B47" text-anchor="middle">Nitrate ions</text>
<text x="1420" y="1820" font-size="42" fill="#1E2B47" text-anchor="middle" xml:space="preserve"><tspan>NO</tspan><tspan dy="11.8" font-size="28.6">3</tspan><tspan dy="-27.7" font-size="28.6">−</tspan></text>
<line x1="648" y1="1780" x2="1110" y2="1780" stroke="#2F6B63" stroke-width="8" stroke-linecap="round"/><polygon points="1152,1780 1108,1802 1108,1758" fill="#2F6B63"/>
<text x="900" y="1676" font-size="44" font-weight="700" fill="#2F6B63" text-anchor="middle">Nitrification</text>
<rect x="674" y="1712" width="56" height="28" rx="14" fill="#DDEBE8" stroke="#2F6B63" stroke-width="4"/>
<text x="764" y="1734" font-size="42" fill="#2F6B63">nitrifying bacteria</text>
<line x1="1436" y1="1670" x2="1436" y2="1112" stroke="#1E2B47" stroke-width="8" stroke-linecap="round"/><polygon points="1436,1070 1458,1114 1414,1114" fill="#1E2B47"/>
<text x="1700" y="1396" font-size="42" fill="#1E2B47" text-anchor="end">Absorption</text>
<text x="900" y="2118" font-size="42" fill="#4B5B72" text-anchor="middle">Plants cannot use nitrogen gas directly.</text></g></svg>
