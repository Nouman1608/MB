<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1090" viewBox="0 0 1800 2180" role="img" aria-labelledby="title desc"><title id="title">The nitrogen cycle (Edexcel International GCSE Biology: Paper 2 only)</title><desc id="desc">The whole figure is marked Paper 2 only: the nitrogen cycle is statement 4.11B of 4BI1. Nitrogen gas in the air is fixed by lightning and bacteria into nitrogen compounds in the soil. Plants absorb nitrate ions and make amino acids, then proteins; animals feed on plants, digest the protein and make their own. Dead matter and waste are decomposed by decomposers to ammonium ions, which nitrifying bacteria turn into nitrate ions. Denitrifying bacteria turn nitrate back into nitrogen gas. Plants cannot use nitrogen gas directly. The deamination label, urea to soil, is greyed as not required by Edexcel.</desc><rect width="1800" height="2180" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="88" font-size="68" font-weight="700" fill="#1E2B47" text-anchor="middle">The nitrogen cycle</text>
<text x="900" y="164" font-size="44" fill="#4B5B72" text-anchor="middle">Schematic</text>
<rect x="60" y="230" width="317" height="64" rx="32" fill="#8A6A0C"/><text x="218.5" y="276.4" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="middle">Paper 2 only</text>
<text x="410" y="276" font-size="32" fill="#6B7785">Grey: not required by Edexcel</text>
<rect x="40" y="340" width="1720" height="280" rx="24" fill="#DDEBE8"/>
<text x="76" y="398" font-size="42" font-weight="700" fill="#2F6B63">Air</text>
<rect x="40" y="1520" width="1720" height="540" rx="24" fill="#F0E6D4"/>
<text x="76" y="2024" font-size="42" font-weight="700" fill="#8A6A0C">Soil</text>
<path d="M600 510 H60 V1540" fill="none" stroke="#8A6A0C" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="60,1584 44,1540 76,1540" fill="#8A6A0C"/>
<path d="M1680 1776 H1748 V510 H1250" fill="none" stroke="#B9632F" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="1204,510 1250,492 1250,528" fill="#B9632F"/>
<rect x="600" y="430" width="600" height="160" rx="24" fill="#FFFFFF" stroke="#1E2B47" stroke-width="5"/>
<circle cx="690" cy="512" r="30" fill="#6FAAA3" stroke="#1E2B47" stroke-width="4"/>
<circle cx="746" cy="512" r="30" fill="#6FAAA3" stroke="#1E2B47" stroke-width="4"/>
<text x="960" y="528" font-size="50" font-weight="700" fill="#1E2B47" text-anchor="middle" xml:space="preserve"><tspan>N</tspan><tspan dy="14" font-size="34">2</tspan><tspan dy="-14"> gas</tspan></text>
<polygon points="128,642 104,690 124,690 112,730 146,676 126,676 140,642" fill="#D6B22F" stroke="#1E2B47" stroke-width="3" stroke-linejoin="round"/>
<text x="172" y="662" font-size="44" font-weight="700" fill="#8A6A0C">Nitrogen fixation</text>
<text x="172" y="718" font-size="42" fill="#8A6A0C">lightning, bacteria</text>
<text x="1700" y="686" font-size="44" font-weight="700" fill="#B9632F" text-anchor="end">Denitrification</text>
<text x="1700" y="742" font-size="42" fill="#B9632F" text-anchor="end">denitrifying bacteria</text>
<rect x="120" y="800" width="480" height="260" rx="24" fill="#FFFFFF" stroke="#1E2B47" stroke-width="5"/>
<text x="360" y="876" font-size="44" font-weight="700" fill="#1E2B47" text-anchor="middle">Animals</text>
<text x="360" y="940" font-size="42" fill="#1E2B47" text-anchor="middle">digest protein,</text>
<text x="360" y="996" font-size="42" fill="#1E2B47" text-anchor="middle">make their own</text>
<rect x="1200" y="800" width="480" height="260" rx="24" fill="#FFFFFF" stroke="#1E2B47" stroke-width="5"/>
<text x="1440" y="876" font-size="44" font-weight="700" fill="#1E2B47" text-anchor="middle">Plants</text>
<text x="1440" y="940" font-size="42" fill="#1E2B47" text-anchor="middle">make amino acids,</text>
<text x="1440" y="996" font-size="42" fill="#1E2B47" text-anchor="middle">then proteins</text>
<line x1="1196" y1="928" x2="652" y2="928" stroke="#1E2B47" stroke-width="8" stroke-linecap="round"/><polygon points="610,928 654,906 654,950" fill="#1E2B47"/>
<text x="900" y="892" font-size="44" font-weight="700" fill="#1E2B47" text-anchor="middle">feeding</text>
<rect x="660" y="1180" width="480" height="200" rx="24" fill="#FFFFFF" stroke="#1E2B47" stroke-width="5"/>
<text x="900" y="1262" font-size="44" font-weight="700" fill="#1E2B47" text-anchor="middle">Dead matter</text>
<text x="900" y="1324" font-size="44" font-weight="700" fill="#1E2B47" text-anchor="middle">and waste</text>
