<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1000" viewBox="0 0 1800 2000" role="img" aria-labelledby="title desc"><title id="title">Inside a kidney (Edexcel International GCSE Biology: Paper 2 only)</title><desc id="desc">The whole figure is marked Paper 2 only: the structure of the urinary system is statement 2.73B of 4BI1. A kidney cut lengthways shows the cortex, the darker outer layer; the medulla, inner cone-shaped regions; and the ureter, which leaves the inner side and carries urine away.</desc><rect width="1800" height="2000" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="88" font-size="68" font-weight="700" fill="#1E2B47" text-anchor="middle">Inside a kidney</text>
