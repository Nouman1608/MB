<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1190" viewBox="0 0 1800 2380" role="img" aria-labelledby="title desc"><title id="title">Antibiotic resistance arises (Edexcel International GCSE Biology)</title><desc id="desc">Five steps: (1) a random mutation makes one bacterium resistant; (2) an antibiotic is used and the non-resistant bacteria die; (3) the survivor has less competition; (4) it reproduces and passes on the resistance allele; (5) a resistant strain forms quickly because bacteria divide fast. No tier labels: how antibiotic resistance increases in bacterial populations is 4BI1 statement 3.39, on both papers.</desc><rect width="1800" height="2380" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="88" font-size="68" font-weight="700" fill="#1E2B47" text-anchor="middle">Antibiotic resistance arises</text>
<text x="900" y="164" font-size="44" fill="#4B5B72" text-anchor="middle">Selection, step by step</text>
<rect x="60" y="250" width="840" height="280" rx="30" fill="#FFFFFF" stroke="#1E2B47" stroke-width="5"/>
<circle cx="976" cy="390" r="38" fill="#1E2B47"/>
<text x="976" y="405" font-size="42" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="1050" y="370" font-size="46" font-weight="700" fill="#1E2B47">A random mutation:</text>
<text x="1050" y="436" font-size="46" fill="#1E2B47">one bacterium is resistant</text>
<rect x="60" y="626" width="840" height="280" rx="30" fill="#FFFFFF" stroke="#1E2B47" stroke-width="5"/>
<line x1="480" y1="540" x2="480" y2="588" stroke="#1E2B47" stroke-width="7" stroke-linecap="round"/><polygon points="480,620 459.6,586 500.4,586" fill="#1E2B47"/>
<circle cx="976" cy="766" r="38" fill="#1E2B47"/>
<text x="976" y="781" font-size="42" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="1050" y="746" font-size="46" font-weight="700" fill="#1E2B47">Antibiotic used:</text>
<text x="1050" y="812" font-size="46" fill="#1E2B47">non-resistant bacteria die</text>
<rect x="60" y="1002" width="840" height="280" rx="30" fill="#FFFFFF" stroke="#1E2B47" stroke-width="5"/>
<line x1="480" y1="916" x2="480" y2="964" stroke="#1E2B47" stroke-width="7" stroke-linecap="round"/><polygon points="480,996 459.6,962 500.4,962" fill="#1E2B47"/>
<circle cx="976" cy="1142" r="38" fill="#1E2B47"/>
<text x="976" y="1157" font-size="42" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="1050" y="1122" font-size="46" font-weight="700" fill="#1E2B47">The survivor has</text>
<text x="1050" y="1188" font-size="46" fill="#1E2B47">less competition</text>
<rect x="60" y="1378" width="840" height="280" rx="30" fill="#FFFFFF" stroke="#1E2B47" stroke-width="5"/>
<line x1="480" y1="1292" x2="480" y2="1340" stroke="#1E2B47" stroke-width="7" stroke-linecap="round"/><polygon points="480,1372 459.6,1338 500.4,1338" fill="#1E2B47"/>
<circle cx="976" cy="1518" r="38" fill="#1E2B47"/>
<text x="976" y="1533" font-size="42" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="1050" y="1498" font-size="46" font-weight="700" fill="#1E2B47">It reproduces and passes</text>
<text x="1050" y="1564" font-size="46" fill="#1E2B47">on the resistance allele</text>
<rect x="60" y="1754" width="840" height="280" rx="30" fill="#FFFFFF" stroke="#1E2B47" stroke-width="5"/>
<line x1="480" y1="1668" x2="480" y2="1716" stroke="#1E2B47" stroke-width="7" stroke-linecap="round"/><polygon points="480,1748 459.6,1714 500.4,1714" fill="#1E2B47"/>
<circle cx="976" cy="1894" r="38" fill="#8A6A0C"/>
<text x="976" y="1909" font-size="42" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="1050" y="1874" font-size="46" font-weight="700" fill="#1E2B47">A resistant strain forms,</text>
<text x="1050" y="1940" font-size="46" fill="#1E2B47">quickly: bacteria divide fast</text>
