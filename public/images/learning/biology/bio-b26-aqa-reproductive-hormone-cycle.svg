<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="tit des"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#315F86"/></marker></defs><title id="tit">Reproductive hormones through an illustrative 28-day cycle</title><desc id="des">Qualitative timeline of FSH, LH, oestrogen and progesterone across an illustrative 28-day cycle, alongside changes in uterine lining. Rising oestrogen can inhibit FSH; sustained high oestrogen promotes an LH surge near ovulation; progesterone supports the lining and inhibits FSH/LH. Without pregnancy, progesterone falls and the lining is shed.</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#10233F">Reproductive hormones through an illustrative 28-day cycle</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#5B6D80">Marlbridge • AQA GCSE Biology 8461 • Hormones in reproduction (4.5.3.4)</text><rect x="52" y="132" width="1424" height="680" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="94" y="165" width="1340" height="510" rx="14" fill="#FBFCFD" stroke="#D3DCE2" stroke-width="2"/><text x="764" y="203" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">QUALITATIVE HORMONE LEVELS • not measured concentrations</text><path d="M210 475L1325 475" stroke="#10233F" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M210 475L210 245" stroke="#10233F" stroke-width="3" fill="none" stroke-linecap="round"/><text x="773" y="511" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">Illustrative cycle day</text><text x="145" y="365" transform="rotate(-90 145 365)" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">Relative level</text><text x="210" y="497" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#20314B">1</text><text x="471" y="497" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#20314B">7</text><text x="730" y="497" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#20314B">14</text><text x="990" y="497" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#20314B">21</text><text x="1325" y="497" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#20314B">28</text><path d="M210 469L210 250" stroke="#D3DCE2" stroke-width="1" fill="none" stroke-linecap="round"/><path d="M471 469L471 250" stroke="#D3DCE2" stroke-width="1" fill="none" stroke-linecap="round"/><path d="M730 469L730 250" stroke="#C44949" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M990 469L990 250" stroke="#D3DCE2" stroke-width="1" fill="none" stroke-linecap="round"/><path d="M1325 469L1325 250" stroke="#D3DCE2" stroke-width="1" fill="none" stroke-linecap="round"/><path d="M210 443C315 430 399 399 503 354C590 315 659 298 714 335C760 367 790 386 850 379C922 370 957 337 1025 356C1136 383 1210 421 1325 443" fill="none" stroke="#168C8C" stroke-width="5"/><path d="M210 449C570 447 692 435 718 290C735 207 750 285 766 435C790 458 1000 449 1325 448" fill="none" stroke="#C44949" stroke-width="5"/><path d="M210 446C280 432 320 430 360 438C430 449 520 449 625 447C675 444 700 429 730 423C760 428 780 445 820 448C1000 450 1170 449 1240 443C1280 438 1300 435 1325 432" fill="none" stroke="#725C8E" stroke-width="5"/><path d="M210 452C735 452 770 446 810 421C870 386 913 328 1000 323C1087 317 1187 344 1230 403C1265 433 1295 448 1325 452" fill="none" stroke="#397D64" stroke-width="5"/><rect x="250" y="221" width="135" height="31" rx="5" fill="#EAF5F1" stroke="#397D64" stroke-width="2"/><text x="317" y="243" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#397D64">Oestrogen</text><rect x="399" y="221" width="95" height="31" rx="5" fill="#FCEEEE" stroke="#C44949" stroke-width="2"/><text x="446" y="243" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#C44949">LH</text><rect x="508" y="221" width="95" height="31" rx="5" fill="#F4EFF8" stroke="#725C8E" stroke-width="2"/><text x="555" y="243" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#725C8E">FSH</text><rect x="617" y="221" width="146" height="31" rx="5" fill="#EAF5F1" stroke="#397D64" stroke-width="2"/><text x="690" y="243" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#397D64">Progesterone</text><rect x="781" y="220" width="225" height="54" rx="7" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/><text x="894" y="243" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#10233F">LH surge → ovulation</text><rect x="155" y="534" width="1120" height="82" rx="9" fill="#F4EDE4" stroke="#B48A62" stroke-width="2"/><text x="715" y="562" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#10233F">UTERINE LINING • thins during menstruation, rebuilds, then is maintained by ovarian hormones</text><path d="M220 610L300 607L370 610L445 601L530 598L620 593L730 590L850 588L970 586L1090 586L1190 588L1270 592" fill="none" stroke="#B48A62" stroke-width="6"/><rect x="126" y="650" width="1276" height="95" rx="9" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/><text x="764" y="684" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">Feedback: rising oestrogen first limits FSH; sustained high oestrogen promotes LH surge.</text><text x="764" y="713" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" fill="#20314B">Progesterone supports lining and inhibits FSH/LH; if no pregnancy, progesterone falls.</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE  •  STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
