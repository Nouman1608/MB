<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1290" viewBox="0 0 1800 2580" role="img" aria-labelledby="title desc"><title id="title">Anaerobic respiration in yeast and muscle (Edexcel International GCSE Biology)</title><desc id="desc">Without oxygen, yeast turns glucose into ethanol and carbon dioxide; muscle in vigorous exercise turns glucose into lactic acid only, with no carbon dioxide. Schematic bars show that both release much less energy per glucose than aerobic respiration. A box gives the symbol equation for yeast, C6H12O6 → 2C2H5OH + 2CO2, marked not required by Edexcel: statement 2.38 of 4BI1 asks only for the word equations.</desc><rect width="1800" height="2580" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="105" font-size="68" font-weight="700" fill="#1E2B47" text-anchor="middle">Anaerobic respiration</text>
<text x="900" y="172" font-size="44" fill="#4B5B72" text-anchor="middle">No oxygen used; products depend on the organism</text>
