<svg xmlns="http://www.w3.org/2000/svg" width="900" height="910" viewBox="0 0 1800 1820" role="img" aria-labelledby="title desc"><title id="title">Why heat speeds enzymes up (Edexcel International GCSE Biology)</title><desc id="desc">Below the optimum temperature. Cooler: substrate particles move slowly (short arrows), so there are few effective collisions with the active sites of the enzymes. Warmer: the particles have more kinetic energy and move faster (long arrows), so there are more frequent effective collisions. Arrow length shows speed. No tier labels: how temperature affects enzyme function is 4BI1 statement 2.11, on both papers.</desc><rect width="1800" height="1820" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="92" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle">Why heat speeds enzymes up</text>
