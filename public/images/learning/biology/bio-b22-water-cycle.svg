<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="title desc"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="context-stroke"/></marker><marker id="greenArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#397D64"/></marker><marker id="redArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#C44949"/></marker><marker id="goldArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#C9A227"/></marker></defs><title id="title">The water cycle: reservoirs and transfers</title><desc id="desc">Water moves among the ocean, surface water, atmosphere and living organisms. Evaporation transfers liquid water to vapour; transpiration releases vapour from leaves; condensation forms cloud droplets; precipitation returns water as rain or snow.</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#10233F">The water cycle: reservoirs and transfers</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#5B6D80">Marlbridge • Biology study resource</text><rect x="52" y="132" width="1424" height="680" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><rect x="84" y="166" width="1358" height="345" rx="16" fill="#EAF5FB" stroke="#D2E6EF" stroke-width="2"/><text x="112" y="205" text-anchor="start" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">ATMOSPHERE • water vapour and cloud droplets</text><ellipse cx="830" cy="280" rx="76" ry="42" fill="#FFFFFF" stroke="#A9C4D1" stroke-width="2"/><ellipse cx="774" cy="298" rx="45" ry="30" fill="#FFFFFF" stroke="#A9C4D1" stroke-width="2"/><ellipse cx="879" cy="300" rx="49" ry="28" fill="#FFFFFF" stroke="#A9C4D1" stroke-width="2"/><text x="827" y="289" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">Cloud</text><text x="827" y="312" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#5B6D80">condensation</text><path d="M84 630 Q175 610 266 630 T448 630 T630 630 L630 786 L84 786Z" fill="#B8E0EC" stroke="#315F86" stroke-width="2"/><text x="355" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#10233F">OCEAN</text><text x="355" y="719" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#5B6D80">liquid water</text><path d="M630 558 Q810 535 970 555 T1442 540 L1442 786 L630 786Z" fill="#F2E5C9" stroke="#BBA47A" stroke-width="2"/><text x="1050" y="754" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#10233F">LAND</text><path d="M770 606 Q860 575 957 600 Q1015 616 1082 603 L1082 681 Q967 704 858 680 Q806 669 770 681Z" fill="#B8E0EC" stroke="#315F86" stroke-width="2"/><text x="922" y="650" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">SURFACE WATER</text><path d="M1204 610V480 M1204 512L1165 540 M1204 522L1244 549" stroke="#806143" stroke-width="9" stroke-linecap="round"/><circle cx="1204" cy="470" r="48" fill="#93C47D" stroke="#397D64" stroke-width="2"/><circle cx="1167" cy="506" r="28" fill="#93C47D"/><circle cx="1241" cy="510" r="29" fill="#93C47D"/><text x="1205" y="585" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#10233F">Living organisms</text><path d="M395 594L515 388" fill="none" stroke="#315F86" stroke-width="5"  stroke-linecap="round" marker-end="url(#arrow)"/><rect x="150" y="438" width="176" height="44" rx="8" fill="#FFFFFF" stroke="#A9C4D1" stroke-width="2"/><text x="238" y="466" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#315F86">Evaporation</text><text x="238" y="484" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">liquid → vapour</text><path d="M890 646L867 347" fill="none" stroke="#168C8C" stroke-width="4"  stroke-linecap="round" marker-end="url(#arrow)"/><rect x="910" y="408" width="180" height="43" rx="8" fill="#FFFFFF" stroke="#A9C4D1" stroke-width="2"/><text x="1000" y="436" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#168C8C">Evaporation</text><text x="1000" y="453" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">surface water → vapour</text><path d="M1207 461L1175 315" fill="none" stroke="#397D64" stroke-width="4"  stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1242" y="356" width="190" height="48" rx="8" fill="#FFFFFF" stroke="#A9C4D1" stroke-width="2"/><text x="1337" y="384" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#397D64">Transpiration</text><text x="1337" y="401" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">vapour lost from leaves</text><path d="M833 324L833 558" fill="none" stroke="#315F86" stroke-width="5"  stroke-linecap="round" marker-end="url(#arrow)"/><rect x="680" y="406" width="148" height="45" rx="8" fill="#FFFFFF" stroke="#A9C4D1" stroke-width="2"/><text x="754" y="434" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#315F86">Precipitation</text><text x="754" y="451" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="500" fill="#5B6D80">rain or snow</text><rect x="106" y="800" width="1315" height="40" rx="8" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/><text x="764" y="826" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#10233F">Simplified lesson model: shows the four named processes; runoff and infiltration are outside this figure.</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE  •  STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
