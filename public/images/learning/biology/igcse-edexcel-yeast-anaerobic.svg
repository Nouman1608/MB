<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1110" viewBox="0 0 1800 2220" role="img" aria-labelledby="title desc"><title id="title">Yeast: anaerobic respiration (Edexcel International GCSE Biology)</title><desc id="desc">With no oxygen, yeast turns glucose into ethanol and carbon dioxide. The symbol equation, C6H12O6 → 2C2H5OH + 2CO2, is marked not required by Edexcel: statement 2.38 of 4BI1 asks only for the word equation. Bottom left, marked not required by Edexcel: in a sealed vessel with no air, sugar and yeast make ethanol for fuel. Bottom right (4BI1 5.5): carbon dioxide bubbles make bread dough rise. No tier labels.</desc><rect width="1800" height="2220" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="88" font-size="68" font-weight="700" fill="#1E2B47" text-anchor="middle">Yeast: anaerobic respiration</text>
