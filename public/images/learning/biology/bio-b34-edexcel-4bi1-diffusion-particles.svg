<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="871" viewBox="0 0 1528 871" role="img" aria-labelledby="title desc"><title id="title">Diffusion: random motion and net movement</title><desc id="desc">Particles begin concentrated on one side. Random motion causes net diffusion toward lower concentration. At equilibrium, random motion continues with no net movement.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#1c2d4b"/></marker><marker id="red" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#b75e53"/></marker><marker id="blue" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#357ea2"/></marker></defs><rect width="100%" height="100%" fill="#f5f8f7"/><g font-family="Arial, sans-serif"><text x="24" y="58" font-size="38" font-weight="700" text-anchor="start" fill="#1c2d4b">Diffusion: random motion and net movement</text><text x="24" y="104" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">A particle model • passive movement down a concentration gradient</text><g transform="translate(24,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Random motion; net movement</text><rect x="60" y="110" width="600" height="300" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2"/><path d="M360,110 V410" fill="none" stroke="#cad7d5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7"/><circle cx="95" cy="150" r="10" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="143" cy="150" r="10" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="191" cy="150" r="10" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="239" cy="150" r="10" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="287" cy="150" r="10" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="95" cy="208" r="10" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="143" cy="208" r="10" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="191" cy="208" r="10" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="239" cy="208" r="10" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="287" cy="208" r="10" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="95" cy="266" r="10" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="143" cy="266" r="10" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="191" cy="266" r="10" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="239" cy="266" r="10" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="287" cy="266" r="10" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="95" cy="324" r="10" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="143" cy="324" r="10" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="191" cy="324" r="10" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="239" cy="324" r="10" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="287" cy="324" r="10" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="465" cy="170" r="10" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="580" cy="225" r="10" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="510" cy="340" r="10" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="615" cy="360" r="10" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><path d="M110,150 L145,132" fill="none" stroke="#1c2d4b" stroke-width="2" marker-end="url(#arr)"/><path d="M250,210 L222,237" fill="none" stroke="#1c2d4b" stroke-width="2" marker-end="url(#arr)"/><path d="M195,325 L220,350" fill="none" stroke="#1c2d4b" stroke-width="2" marker-end="url(#arr)"/><path d="M510,340 L480,320" fill="none" stroke="#1c2d4b" stroke-width="2" marker-end="url(#arr)"/><path d="M580,225 L610,200" fill="none" stroke="#1c2d4b" stroke-width="2" marker-end="url(#arr)"/><text x="210" y="100" font-size="22" font-weight="700" text-anchor="middle" fill="#1c2d4b">Higher concentration</text><text x="510" y="100" font-size="22" font-weight="700" text-anchor="middle" fill="#1c2d4b">Lower concentration</text><path d="M290,425 L440,425" fill="none" stroke="#1c2d4b" stroke-width="4" marker-end="url(#arr)"/><text x="365" y="455" font-size="22" font-weight="700" text-anchor="middle" fill="#1c2d4b">Net movement</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">More particles cross from the concentrated side per unit time.</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Particles move in both directions.</text></g><g transform="translate(784,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">At dynamic equilibrium</text><rect x="60" y="110" width="600" height="300" rx="12" fill="#e2efec" stroke="#1c2d4b" stroke-width="2"/><circle cx="100" cy="150" r="10" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="100" cy="220" r="10" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="100" cy="290" r="10" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="100" cy="360" r="10" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="200" cy="150" r="10" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="200" cy="220" r="10" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="200" cy="290" r="10" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="200" cy="360" r="10" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="300" cy="150" r="10" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="300" cy="220" r="10" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="300" cy="290" r="10" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="300" cy="360" r="10" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="400" cy="150" r="10" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="400" cy="220" r="10" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="400" cy="290" r="10" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="400" cy="360" r="10" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="500" cy="150" r="10" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="500" cy="220" r="10" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="500" cy="290" r="10" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="500" cy="360" r="10" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="600" cy="150" r="10" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="600" cy="220" r="10" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="600" cy="290" r="10" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><circle cx="600" cy="360" r="10" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2"/><path d="M290,425 L440,425" fill="none" stroke="#1c2d4b" stroke-width="4" marker-end="url(#arr)"/><path d="M440,455 L290,455" fill="none" stroke="#1c2d4b" stroke-width="4" marker-end="url(#arr)"/><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Concentration is uniform. Random movement continues, but</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">there is no net diffusion.</text></g><text x="24" y="849" font-size="19" font-weight="400" text-anchor="start" fill="#1c2d4b">MARLBRIDGE  •  Schematic; structures and particles are not to scale.</text></g></svg>
