<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1060" viewBox="0 0 1800 2120" role="img" aria-labelledby="title desc"><title id="title">Energy passed up a food chain</title><desc id="desc">Bars drawn to scale, in kJ per square metre per year: grass 21 000, rabbits 1 470, foxes 126. From grass to rabbits 7.0% is passed on (1 470 ÷ 21 000 × 100); from rabbits to foxes 8.6% (126 ÷ 1 470 × 100). Why so little passes on: heat from respiration, parts not eaten, faeces, and urea (excretion). So food chains rarely have five levels. No tier labels: energy transfer along a food chain is on both Edexcel papers (4BI1 4.8-4.9) and in OxfordAQA 9201 3.3.1b, which is not tiered.</desc><rect width="1800" height="2120" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="88" font-size="68" font-weight="700" fill="#1E2B47" text-anchor="middle">Energy passed up a food chain</text>
<text x="900" y="164" font-size="44" fill="#4B5B72" text-anchor="middle" xml:space="preserve"><tspan>kJ m</tspan><tspan dy="-16.7" font-size="29.9">−2</tspan><tspan dy="16.7"> yr</tspan><tspan dy="-16.7" font-size="29.9">−1</tspan><tspan dy="16.7">, bar widths to scale</tspan></text>
