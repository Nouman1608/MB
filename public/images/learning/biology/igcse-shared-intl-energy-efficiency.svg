<text x="60" y="1576" font-size="50" font-weight="700" fill="#1E2B47">Why so little passes on</text>
<rect x="60" y="1622" width="820" height="120" rx="60" fill="#F5E0D5" stroke="#B9632F" stroke-width="5"/><text x="470" y="1698.56" font-size="46" font-weight="700" fill="#1E2B47" text-anchor="middle">Heat from respiration</text>
