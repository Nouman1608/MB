<rect x="920" y="1778" width="820" height="120" rx="60" fill="#F5E0D5" stroke="#B9632F" stroke-width="5"/><text x="1330" y="1854.56" font-size="46" font-weight="700" fill="#1E2B47" text-anchor="middle">Urea (excretion)</text>
<text x="900" y="2014" font-size="46" font-weight="700" fill="#1E2B47" text-anchor="middle">So food chains rarely have five levels.</text></g></svg>
