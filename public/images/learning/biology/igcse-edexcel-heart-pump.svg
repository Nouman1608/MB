<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1300" viewBox="0 0 1800 2600" role="img" aria-labelledby="title desc"><title id="title">How the heart pumps (Edexcel International GCSE Biology)</title><desc id="desc">One heartbeat in three steps. (1) The atria contract and push blood into the ventricles through the open atrioventricular (AV) valves. (2) The ventricles contract: the AV valves close and the semilunar (SL) valves open, so blood leaves in the arteries. (3) The ventricles relax: the SL valves close, so there is no back-flow from the arteries into the ventricles. Closing valves make the heart sounds. No tier labels: how the heart functions is 4BI1 statement 2.65, on both papers. A grey note says heart sounds are not required by Edexcel.</desc><rect width="1800" height="2600" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="88" font-size="68" font-weight="700" fill="#1E2B47" text-anchor="middle">How the heart pumps</text>
<text x="900" y="164" font-size="44" fill="#4B5B72" text-anchor="middle">Simplified: one heartbeat in three steps</text>
