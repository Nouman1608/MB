<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1160" viewBox="0 0 1800 2320" role="img" aria-labelledby="title desc"><title id="title">Plasma, filtrate and urine (OxfordAQA International GCSE Biology)</title><desc id="desc">Bar charts in g per dm3, each panel with its own scale. Protein: plasma 75, filtrate 0, urine 0, because protein is too large to be filtered. Glucose: plasma 1.0, filtrate 1.0, urine 0, because it is filtered and then all reabsorbed. Urea: plasma 0.30, filtrate 0.30, urine 18, so urine has 60 times the plasma concentration. This follows 9201 3.4.3d: the blood is filtered, all the glucose is reabsorbed and urea is released in the urine. No tier labels.</desc><rect width="1800" height="2320" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="88" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle">Plasma, filtrate and urine</text>
<text x="900" y="166" font-size="44" fill="#4B5B72" text-anchor="middle" xml:space="preserve"><tspan>g per dm</tspan><tspan dy="-16.7" font-size="29.9">3</tspan><tspan dy="16.7">; each panel has its own scale</tspan></text>
