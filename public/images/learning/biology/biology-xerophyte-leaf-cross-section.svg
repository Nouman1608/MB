<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690" role="img" aria-labelledby="title desc"><title id="title">A rolled xerophyte leaf slows water loss</title><desc id="desc">Marram-like leaf cross-section: rolled margins enclose humid air; stomata lie in inner grooves with hairs, while a thick cuticle covers the outer surface. These features reduce the water-vapour gradient and diffusion from the leaf.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#315fbd"/></marker><marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#177e79"/></marker><marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c66a1d"/></marker></defs><rect width="100%" height="100%" fill="#f8faff"/><text x="28" y="45" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#18263d" text-anchor="start">A rolled xerophyte leaf slows water loss</text><text x="28" y="76" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#667085" text-anchor="start">Marram-like cross-section; annotations explain the effect on diffusion.</text><rect x="24" y="100" width="952" height="560" rx="14" fill="white" stroke="#d5ddea" stroke-width="2"/><rect x="42" y="133" width="440" height="430" rx="14" fill="white" stroke="#d5ddea" stroke-width="2"/><text x="262" y="166" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#18263d" text-anchor="middle">Rolled leaf: trapped humid air</text><path d="M350 225 C220 150 105 240 112 350 C118 447 235 505 350 430" fill="none" stroke="#277b56" stroke-width="48" stroke-linecap="round"/><path d="M350 225 C220 150 105 240 112 350 C118 447 235 505 350 430" fill="none" stroke="#bce2c9" stroke-width="30" stroke-linecap="round"/><text x="238" y="350" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#177e79" text-anchor="middle">humid air pocket</text><text x="236" y="379" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="middle">lower vapour gradient</text><path d="M120 205 L100 184" fill="none" stroke="#c66a1d" stroke-width="3" stroke-linecap="round"/><text x="55" y="180" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#c66a1d" text-anchor="start">thick cuticle</text><path d="M171 458 L145 493" fill="none" stroke="#315fbd" stroke-width="3" stroke-linecap="round"/><text x="53" y="522" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#315fbd" text-anchor="start">rolled margin</text><path d="M302 220 L353 195" fill="none" stroke="#bd5c52" stroke-width="3" stroke-linecap="round"/><text x="360" y="197" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#bd5c52" text-anchor="start">inner face</text><rect x="507" y="133" width="444" height="430" rx="14" fill="#fff" stroke="#d5ddea" stroke-width="2"/><text x="729" y="166" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#18263d" text-anchor="middle">Stoma sits in a sheltered groove</text><path d="M560 340 L655 340 Q675 340 688 360 Q701 380 719 380 Q737 380 750 360 Q765 340 786 340 L892 340 L892 392 L786 392 Q760 392 744 414 Q731 431 719 431 Q707 431 692 414 Q675 392 652 392 L560 392 Z" fill="#d7eadb" stroke="#28774f" stroke-width="3"/><ellipse cx="719" cy="392" rx="18" ry="38" fill="#f8faff" stroke="#315fbd" stroke-width="3"/><text x="719" y="286" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#177e79" text-anchor="middle">hairs trap still, humid air</text><path d="M719 296 L719 330" fill="none" stroke="#177e79" stroke-width="3" stroke-linecap="round"/><text x="719" y="465" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#315fbd" text-anchor="middle">sunken stoma</text><path d="M719 450 L719 433" fill="none" stroke="#315fbd" stroke-width="3" stroke-linecap="round"/><text x="719" y="503" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#667085" text-anchor="middle">less water vapour diffuses out</text><rect x="80" y="576" width="830" height="58" rx="12" fill="#e5f4f1" stroke="#177e79" stroke-width="1"/><text x="495" y="611" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#18263d" text-anchor="middle">More humidity beside the pore → smaller diffusion gradient → less water loss</text><text x="26" y="672" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#667085" text-anchor="start">MARLBRIDGE • Schematic anatomy; structures are not to scale.</text></svg>