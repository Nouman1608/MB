<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="1515" viewBox="0 0 1528 1515" role="img" aria-labelledby="title desc"><title id="title">How an enzyme catalyses a reaction</title><desc id="desc">A complementary substrate binds the active site, forming an enzyme–substrate complex. Products leave and the unchanged enzyme can act again.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#1c2d4b"/></marker><marker id="red" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#b75e53"/></marker><marker id="blue" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#357ea2"/></marker></defs><rect width="100%" height="100%" fill="#f5f8f7"/><g font-family="Arial, sans-serif"><text x="24" y="58" font-size="38" font-weight="700" text-anchor="start" fill="#1c2d4b">How an enzyme catalyses a reaction</text><text x="24" y="104" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">A simplified breakdown reaction • shape represents fit, not molecular structure</text><g transform="translate(24,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">1  Substrate binds</text><path d="M260,260 C230,340 300,405 360,400 C460,402 495,320 455,260 L400,260 L400,305 L320,305 L320,260 Z" fill="#e2efec" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="322" y="135" width="76" height="43" rx="2" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><path d="M360,190 L360,250" fill="none" stroke="#1c2d4b" stroke-width="4" marker-end="url(#arr)"/><path d="M462,142.3 L398,155" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="470" y="150" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Substrate</text><path d="M188.0,232.3 L320,300" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="240" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Active site</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">The substrate has a shape complementary to the active site.</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">This is a simplified lock-and-key model.</text></g><g transform="translate(784,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">2  Reaction is catalysed</text><path d="M260,260 C230,340 300,405 360,400 C460,402 495,320 455,260 L400,260 L400,305 L320,305 L320,260 Z" fill="#e2efec" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="322" y="262" width="76" height="41" rx="2" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><path d="M360,180 L360,260" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="360" y="170" font-size="22" font-weight="400" text-anchor="middle" fill="#1c2d4b">Enzyme–substrate complex</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">The substrate binds at the active site. The enzyme catalyses a</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">reaction that converts the substrate to products.</text></g><g transform="translate(24,816)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">3  Enzyme can be used again</text><path d="M260,260 C230,340 300,405 360,400 C460,402 495,320 455,260 L400,260 L400,305 L320,305 L320,260 Z" fill="#e2efec" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="280" y="135" width="35" height="43" rx="2" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><rect x="410" y="135" width="35" height="43" rx="2" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2"/><path d="M335,240 L295,190" fill="none" stroke="#1c2d4b" stroke-width="4" marker-end="url(#arr)"/><path d="M385,240 L430,190" fill="none" stroke="#1c2d4b" stroke-width="4" marker-end="url(#arr)"/><text x="360" y="105" font-size="24" font-weight="700" text-anchor="middle" fill="#1c2d4b">Products leave</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">The products leave. The enzyme is unchanged by the reaction</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">and can catalyse the reaction again.</text></g><text x="24" y="1493" font-size="19" font-weight="400" text-anchor="start" fill="#1c2d4b">MARLBRIDGE  •  Schematic; structures and particles are not to scale.</text></g></svg>
