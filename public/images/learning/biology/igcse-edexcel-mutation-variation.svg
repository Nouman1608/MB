<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1255" viewBox="0 0 1800 2510" role="img" aria-labelledby="title desc"><title id="title">Mutation and variation (Edexcel International GCSE Biology)</title><desc id="desc">Top: mutation is a rare, random genetic change that forms new alleles (both papers); the note that ionising radiation and some chemicals raise its rate is marked Paper 2 only (4BI1 3.37B). Middle, marked Paper 2 only (3.35B): a gene mutation changes one base in the DNA sequence (ATGCCATG becomes ATGCTATG), which can change the shape of the protein. Bottom: sources of variation are mutation, meiosis and random fertilisation; random mating is greyed and noted as not required by Edexcel.</desc><rect width="1800" height="2510" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="105" font-size="68" font-weight="700" fill="#1E2B47" text-anchor="middle">Mutation and variation</text>
