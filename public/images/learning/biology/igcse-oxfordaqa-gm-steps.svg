<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1260" viewBox="0 0 1800 2520" role="img" aria-labelledby="title desc"><title id="title">Genetic modification: six steps (OxfordAQA International GCSE Biology)</title><desc id="desc">Six steps: a, restriction enzymes cut the human gene out of DNA, leaving sticky ends; b, the same enzymes cut a plasmid open, leaving matching sticky ends; c, DNA ligase joins the gene into the plasmid, giving a recombinant plasmid; d, plasmids are put into bacteria; e, the bacteria multiply, for example in a fermenter; f, the bacteria make the human protein. No tier labels. Three names are noted in grey as not required by OxfordAQA: 9201 3.5.5b says only that enzymes isolate the gene, which is inserted into a vector such as a bacterial plasmid, so the names restriction enzyme, sticky ends and ligase are not required.</desc><rect width="1800" height="2520" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="88" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle">Genetic modification: six steps</text>
<circle cx="660" cy="178" r="26" fill="#D6B22F" stroke="#1E2B47" stroke-width="5"/>
<text x="705" y="194" font-size="44" fill="#1E2B47">= human gene</text>
<rect x="60" y="236" width="1680" height="458" rx="26" fill="#FFFFFF" stroke="#1E2B47" stroke-width="5"/>
