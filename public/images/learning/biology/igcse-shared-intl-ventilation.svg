<svg xmlns="http://www.w3.org/2000/svg" width="900" height="960" viewBox="0 0 1800 1920" role="img" aria-labelledby="title desc"><title id="title">How air moves in and out</title><desc id="desc">Breathing in: the ribs move up and out and the diaphragm contracts and flattens, so the volume of the thorax increases, the pressure falls and air moves in. Breathing out: the ribs move down and in and the diaphragm relaxes and domes up, so the volume decreases, the pressure rises and air moves out. Lines naming the external and internal intercostal muscles are greyed with a note that they are not required by Edexcel or OxfordAQA, whose specifications (4BI1 2.47, 9201 3.2.5b) refer only to the intercostal muscles. No tier labels.</desc><rect width="1800" height="1920" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="88" font-size="64" font-weight="700" fill="#1E2B47" text-anchor="middle">How air moves in and out</text>
<text x="470" y="266" font-size="56" font-weight="700" fill="#1E2B47" text-anchor="middle">Breathing in</text>
<text x="1330" y="266" font-size="56" font-weight="700" fill="#1E2B47" text-anchor="middle">Breathing out</text>
<rect x="436" y="430" width="64" height="140" fill="#DDEBE8" stroke="#2F6B63" stroke-width="5"/>
<line x1="470" y1="300" x2="470" y2="396" stroke="#2F6B63" stroke-width="7" stroke-linecap="round"/><polygon points="470,438 445.8,394 494.2,394" fill="#2F6B63"/>
<text x="530" y="386" font-size="44" font-weight="700" fill="#2F6B63">Air in</text>
