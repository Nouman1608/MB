<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1010" viewBox="0 0 1800 2020" role="img" aria-labelledby="title desc"><title id="title">Crossing a synapse (Edexcel International GCSE Biology)</title><desc id="desc">An impulse arrives at the end of neurone 1. (1) Vesicles release neurotransmitter into the synaptic gap; (2) the molecules diffuse across the gap; (3) they bind to receptor proteins on neurone 2; (4) this starts an impulse in neurone 2. The synapse works in one direction only, because only neurone 1 releases the neurotransmitter. No tier labels: the role of neurotransmitters at synapses is 4BI1 statement 2.89, on both papers.</desc><rect width="1800" height="2020" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="88" font-size="68" font-weight="700" fill="#1E2B47" text-anchor="middle">Crossing a synapse</text>
