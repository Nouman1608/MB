<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="title desc"><title id="title">Hydrogen-carbonate indicator practical: controlled apparatus</title><desc id="desc">Four sealed identical boiling tubes show equal indicator volume, leaves resting on internal gauze above the liquid, external light treatments with bright uncovered, dim layered gauze or tissue, dark foil, and a no-leaf control. Conditions are kept equal.</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#10233F">Hydrogen-carbonate indicator: set up a fair comparison</text><text x="54" y="94" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#5B6D80">Marlbridge • Pearson Edexcel International GCSE Biology 4BI1 • Gas exchange (2.45B)</text><rect x="52" y="124" width="1424" height="100" rx="16" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="76" y="160" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#315F86">CONTROLLED COMPARISON</text><text x="76" y="190" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#20314B">Use identical tubes, equal red indicator volumes, the same leaf area, lamp distance, temperature and exposure time.</text><rect x="47" y="248" width="330" height="480" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="212" y="281" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#315F86">BRIGHT • uncovered</text><path d="M129 300L129 612Q129 654 212 654Q187 654 187 612L187 300" fill="#FFFFFF" fill-opacity=".35" stroke="#315F86" stroke-width="5"/><rect x="123" y="287" width="70" height="28" rx="7" fill="#C8D2DA" stroke="#5B6D80" stroke-width="3"/><path d="M133 535Q212 544 183 535L181 614Q212 645 135 614Z" fill="#C44949" fill-opacity=".78" stroke="#A93636" stroke-width="2"/><path d="M135 474L181 474" stroke="#725C8E" stroke-width="5" stroke-dasharray="5 3"/><path d="M188 451Q204 426 213 446Q239 434 237 455Q219 468 188 451Z" fill="#66A66E" stroke="#397D64" stroke-width="2"/><path d="M199 453L229 443" stroke="#EAF5FB" stroke-width="2"/><text x="212" y="501" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#397D64">leaf on gauze</text><text x="212" y="687" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80"></text><rect x="415" y="248" width="330" height="480" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="580" y="281" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#315F86">DIM • gauze / tissue</text><path d="M497 300L497 612Q497 654 580 654Q555 654 555 612L555 300" fill="#FFFFFF" fill-opacity=".35" stroke="#315F86" stroke-width="5"/><rect x="491" y="287" width="70" height="28" rx="7" fill="#C8D2DA" stroke="#5B6D80" stroke-width="3"/><path d="M501 535Q580 544 551 535L549 614Q580 645 503 614Z" fill="#C44949" fill-opacity=".78" stroke="#A93636" stroke-width="2"/><path d="M503 474L549 474" stroke="#725C8E" stroke-width="5" stroke-dasharray="5 3"/><path d="M556 451Q572 426 581 446Q607 434 605 455Q587 468 556 451Z" fill="#66A66E" stroke="#397D64" stroke-width="2"/><path d="M567 453L597 443" stroke="#EAF5FB" stroke-width="2"/><text x="580" y="501" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#397D64">leaf on gauze</text><path d="M481 324L481 621Q481 667 580 667Q571 667 571 621L571 324" fill="#E8F3F3" fill-opacity=".24" stroke="#168C8C" stroke-width="6" stroke-dasharray="10 6"/><text x="580" y="687" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">layered outer gauze</text><rect x="783" y="248" width="330" height="480" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="948" y="281" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#20314B">DARK • foil</text><path d="M865 300L865 612Q865 654 948 654Q923 654 923 612L923 300" fill="#FFFFFF" fill-opacity=".35" stroke="#315F86" stroke-width="5"/><rect x="859" y="287" width="70" height="28" rx="7" fill="#C8D2DA" stroke="#5B6D80" stroke-width="3"/><path d="M869 535Q948 544 919 535L917 614Q948 645 871 614Z" fill="#C44949" fill-opacity=".78" stroke="#A93636" stroke-width="2"/><path d="M871 474L917 474" stroke="#725C8E" stroke-width="5" stroke-dasharray="5 3"/><path d="M924 451Q940 426 949 446Q975 434 973 455Q955 468 924 451Z" fill="#66A66E" stroke="#397D64" stroke-width="2"/><path d="M935 453L965 443" stroke="#EAF5FB" stroke-width="2"/><text x="948" y="501" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#397D64">leaf on gauze</text><path d="M849 322L849 622Q849 667 948 667Q939 667 939 622L939 322" fill="none" stroke="#667687" stroke-width="12"/><path d="M848 322H940V352H848Z" fill="#D7DEE3" stroke="#667687" stroke-width="2"/><text x="948" y="687" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80">opaque outer foil</text><rect x="1151" y="248" width="330" height="480" rx="14" fill="#FFFFFF" stroke="#D3DCE2" stroke-width="2"/><text x="1316" y="281" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#315F86">NO-LEAF CONTROL</text><path d="M1233 300L1233 612Q1233 654 1316 654Q1291 654 1291 612L1291 300" fill="#FFFFFF" fill-opacity=".35" stroke="#315F86" stroke-width="5"/><rect x="1227" y="287" width="70" height="28" rx="7" fill="#C8D2DA" stroke="#5B6D80" stroke-width="3"/><path d="M1237 535Q1316 544 1287 535L1285 614Q1316 645 1239 614Z" fill="#C44949" fill-opacity=".78" stroke="#A93636" stroke-width="2"/><text x="1316" y="490" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#5B6D80">no leaf</text><text x="1316" y="687" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="500" fill="#5B6D80"></text><rect x="52" y="754" width="1424" height="66" rx="12" fill="#FFF6DE" stroke="#C9A227" stroke-width="2"/><text x="764" y="782" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#C44949">Important interpretation</text><text x="764" y="806" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#20314B">A red indicator records no detected net CO₂ change over the interval; it does not prove identical instantaneous photosynthesis and respiration rates.</text><text x="764" y="856" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#10233F" opacity=".07">MARLBRIDGE STUDY RESOURCES</text><path d="M52 866H1476" stroke="#C9A227" stroke-width="2"/><text x="54" y="903" text-anchor="start" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10233F">MARLBRIDGE  •  STUDY RESOURCE</text><image href="data:image/svg+xml;base64," x="1320" y="874" width="170" height="42" preserveAspectRatio="xMidYMid meet"/></svg>
