<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="871" viewBox="0 0 1528 871" role="img" aria-labelledby="title desc"><title id="title">Urinary anatomy: follow urine and locate kidney regions</title><desc id="desc">Original simplified urinary-system diagram labels two kidneys, two ureters, bladder and single urethra with urine-flow arrows. A separate longitudinal kidney section distinguishes outer cortex, inner medullary pyramids and central renal pelvis leading to ureter.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#1c2d4b"/></marker><marker id="red" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#b75e53"/></marker><marker id="blue" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#357ea2"/></marker></defs><rect width="100%" height="100%" fill="#f5f8f7"/><g font-family="Arial, sans-serif"><text x="24" y="58" font-size="38" font-weight="700" text-anchor="start" fill="#1c2d4b">Urinary anatomy: follow urine and locate kidney regions</text><text x="24" y="104" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Cambridge 0610 Biology 13.1 • Core system; cortex and medulla are Extended</text><g transform="translate(24,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Two kidneys; two ureters; one outlet</text><g transform="translate(240,175)"><path d="M0,-70 C-72,-94 -102,-32 -90,24 C-78,92 -13,95 17,54 C38,24 -11,17 -14,-9 C-17,-34 32,-41 0,-70 Z" fill="#e2efec" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(480,175) scale(-1,1)"><path d="M0,-70 C-72,-94 -102,-32 -90,24 C-78,92 -13,95 17,54 C38,24 -11,17 -14,-9 C-17,-34 32,-41 0,-70 Z" fill="#e2efec" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M225,190 C240,245 255,275 300,350 M495,190 C480,245 465,275 420,350" fill="none" stroke="#357ea2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M296,326 Q360,294 424,326 L419,370 Q409,417 360,417 Q311,417 301,370 Z" fill="#e2efec" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M360,417 V474" fill="none" stroke="#357ea2" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M258,267 L282,318" fill="none" stroke="#357ea2" stroke-width="3" marker-end="url(#blue)"/><path d="M462,267 L438,318" fill="none" stroke="#357ea2" stroke-width="3" marker-end="url(#blue)"/><path d="M360,433 L360,468" fill="none" stroke="#357ea2" stroke-width="3" marker-end="url(#blue)"/><path d="M124.0,92.3 L200,146" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="38" y="100" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Kidneys</text><path d="M501,110 L501,146" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="479" y="100" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Kidney</text><path d="M117.0,281.3 L256,275" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="38" y="289" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Ureters</text><path d="M481,351.3 L415,354" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="489" y="359" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Bladder</text><path d="M122.0,450.3 L359,451" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="458" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Urethra</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Urine passes from each kidney down a ureter to the bladder,</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">which stores it. A single urethra carries urine out. Blood vessels</text><text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">are omitted.</text></g><g transform="translate(784,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Longitudinal section of one kidney</text><path d="M310,102 C181,77 112,176 129,290 C145,419 270,462 356,408 C397,381 407,331 367,305 Q315,274 368,242 C425,212 397,125 310,102 Z" fill="#e2efec" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M204,151 L263,133 L284,227 Z" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M150,222 L166,175 L272,249 Z" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M155,314 L143,265 L267,275 Z" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M218,397 L170,355 L285,302 Z" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M308,411 L258,420 L307,312 Z" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M358,360 L336,392 L327,303 Z" fill="#73aaa5" stroke="#1c2d4b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M281,226 Q317,243 333,259 L354,276 L333,295 Q313,310 287,320 L303,282 Z" fill="#d5b32d" stroke="#1c2d4b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M354,276 Q396,298 421,355 V457" fill="none" stroke="#357ea2" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M218,98 L218,120" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="38" y="88" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Cortex: outer band</text><path d="M417,166.3 L256,194" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="425" y="174" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Medulla</text><path d="M417,205.3 L252,214" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="425" y="213" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">(pyramids)</text><path d="M430,312.3 L334,274" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="438" y="320" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Renal pelvis</text><path d="M430,443.3 L421,429" fill="none" stroke="#1c2d4b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="438" y="451" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Ureter</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">The cortex lies outside the medullary pyramids. Urine drains</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">towards the renal pelvis, then into the ureter. This is not a</text><text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">nephron-scale drawing.</text></g><text x="24" y="849" font-size="19" font-weight="400" text-anchor="start" fill="#1c2d4b">MARLBRIDGE  •  Schematic; structures and particles are not to scale.</text></g></svg>
