<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="871" viewBox="0 0 1528 871" role="img" aria-labelledby="title desc"><title id="title">Absorb glucose using an ion gradient</title><desc id="desc">Three membrane steps distinguish ATP-driven pumping, sodium–glucose cotransport and basolateral facilitated exit.</desc><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#1c2d4b"/></marker><marker id="red" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#b75e53"/></marker><marker id="blue" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#357ea2"/></marker></defs><rect width="100%" height="100%" fill="#f5f8f7"/><g font-family="Arial, sans-serif"><text x="24" y="58" font-size="38" font-weight="700" text-anchor="start" fill="#1c2d4b">Absorb glucose using an ion gradient</text><text x="24" y="104" font-size="22" font-weight="400" text-anchor="start" fill="#1c2d4b">Secondary active transport links intestinal uptake to ATP use at another membrane.</text><g transform="translate(24,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Lumen → epithelial cell</text><rect x="35" y="90" width="650" height="112" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="53" y="119" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">1 Basolateral Na⁺/K⁺ pump</text><text x="53" y="150" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">ATP hydrolysis drives Na⁺ out of the cell, keeping intracellular</text><text x="53" y="177" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">Na⁺ low.</text><path d="M360,205 L360,217" fill="none" stroke="#357ea2" stroke-width="2" marker-end="url(#blue)"/><rect x="35" y="220" width="650" height="112" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="53" y="249" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">2 Apical Na⁺–glucose cotransporter</text><text x="53" y="280" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">Na⁺ enters down its electrochemical gradient and drives</text><text x="53" y="307" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">glucose uptake.</text><path d="M360,335 L360,347" fill="none" stroke="#357ea2" stroke-width="2" marker-end="url(#blue)"/><rect x="35" y="350" width="650" height="112" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="53" y="379" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">3 Basolateral glucose carrier</text><text x="53" y="410" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">Glucose leaves towards the blood by facilitated diffusion when</text><text x="53" y="437" font-size="21" font-weight="400" text-anchor="start" fill="#1c2d4b">its gradient favours exit.</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">Apical faces the intestinal lumen; basolateral faces tissue fluid</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">and capillaries.</text></g><g transform="translate(784,172)"><rect x="0" y="0" width="720" height="620" rx="12" fill="white" stroke="#cad7d5" stroke-width="2"/><text x="35" y="47" font-size="27" font-weight="700" text-anchor="start" fill="#1c2d4b">Explain the energy connection</text><rect x="35" y="100" width="310" height="175" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="51" y="131" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">Direct ATP use</text><text x="51" y="189" font-size="20" font-weight="400" text-anchor="start" fill="#1c2d4b">The Na⁺/K⁺ pump uses ATP</text><text x="51" y="215" font-size="20" font-weight="400" text-anchor="start" fill="#1c2d4b">directly.</text><rect x="375" y="100" width="310" height="175" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="391" y="131" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">Indirect energy use</text><text x="391" y="189" font-size="20" font-weight="400" text-anchor="start" fill="#1c2d4b">The cotransporter uses energy</text><text x="391" y="215" font-size="20" font-weight="400" text-anchor="start" fill="#1c2d4b">stored in the Na⁺ gradient.</text><rect x="35" y="280" width="310" height="175" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="51" y="311" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">Large exchange surface</text><text x="51" y="369" font-size="20" font-weight="400" text-anchor="start" fill="#1c2d4b">Villi and microvilli increase area</text><text x="51" y="395" font-size="20" font-weight="400" text-anchor="start" fill="#1c2d4b">for absorption.</text><rect x="375" y="280" width="310" height="175" rx="12" fill="#e2efec" stroke="#cad7d5" stroke-width="2"/><text x="391" y="311" font-size="23" font-weight="700" text-anchor="start" fill="#1c2d4b">Short transport route</text><text x="391" y="369" font-size="20" font-weight="400" text-anchor="start" fill="#1c2d4b">A thin epithelium and capillary</text><text x="391" y="395" font-size="20" font-weight="400" text-anchor="start" fill="#1c2d4b">network help maintain</text><text x="391" y="421" font-size="20" font-weight="400" text-anchor="start" fill="#1c2d4b">gradients.</text><text x="35" y="500" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">A cotransporter can move glucose against its own</text><text x="35" y="531" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">concentration gradient; Na⁺ moves down its electrochemical</text><text x="35" y="562" font-size="23" font-weight="400" text-anchor="start" fill="#1c2d4b">gradient.</text></g><text x="24" y="849" font-size="19" font-weight="400" text-anchor="start" fill="#1c2d4b">MARLBRIDGE  •  Schematic; structures and particles are not to scale.</text></g></svg>