<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1130" viewBox="0 0 1800 2260" role="img" aria-labelledby="title desc"><title id="title">Heart rate and exercise</title><desc id="desc">Bar chart of heart rate in beats per minute, with dots for three counts (pulse counted for 30 s and doubled) and bars for the means: 74 at rest (72, 76, 74) and 118 after exercise (116, 120, 118), a rise of 44, or 59%. Why heart rate rises: muscles contract more and cells respire faster; more oxygen and glucose are needed and more carbon dioxide must be removed; the heart rate rises for faster delivery and removal. The rate falls back to resting after activity. No tier labels: heart rate in exercise is on both Edexcel papers (4BI1 2.66) and in OxfordAQA 9201 3.2.6g-h, which is not tiered.</desc><rect width="1800" height="2260" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="88" font-size="68" font-weight="700" fill="#1E2B47" text-anchor="middle">Heart rate and exercise</text>
<text x="900" y="164" font-size="44" fill="#4B5B72" text-anchor="middle">Pulse counted for 30 s, three times, then doubled</text>
<text x="60" y="326" font-size="44" font-weight="700" fill="#1E2B47">Heart rate (beats per minute)</text>
<line x1="282" y1="1260" x2="296" y2="1260" stroke="#1E2B47" stroke-width="4"/>
