<text x="270" y="896.858" font-size="40" fill="#1E2B47" text-anchor="end">60</text>
<line x1="282" y1="757.144" x2="296" y2="757.144" stroke="#1E2B47" stroke-width="4"/>
<text x="270" y="771.144" font-size="40" fill="#1E2B47" text-anchor="end">80</text>
<line x1="282" y1="631.43" x2="296" y2="631.43" stroke="#1E2B47" stroke-width="4"/>
<text x="270" y="645.43" font-size="40" fill="#1E2B47" text-anchor="end">100</text>
