<text x="1170" y="1336" font-size="46" font-weight="700" fill="#1E2B47" text-anchor="middle">After exercise</text>
<text x="60" y="1576" font-size="50" font-weight="700" fill="#1E2B47">Why heart rate rises</text>
<rect x="60" y="1658" width="480" height="382" rx="30" fill="#F2E6B7" stroke="#1E2B47" stroke-width="5"/>
<text x="300" y="1776" font-size="44" font-weight="700" fill="#1E2B47" text-anchor="middle">Muscles contract</text>
<text x="300" y="1848" font-size="44" fill="#1E2B47" text-anchor="middle">more: cells</text>
<text x="300" y="1920" font-size="44" fill="#1E2B47" text-anchor="middle">respire faster</text>
<rect x="660" y="1658" width="480" height="382" rx="30" fill="#F2E6B7" stroke="#1E2B47" stroke-width="5"/>
<text x="900" y="1776" font-size="44" font-weight="700" fill="#1E2B47" text-anchor="middle">More oxygen and</text>
<text x="900" y="1848" font-size="44" fill="#1E2B47" text-anchor="middle">glucose needed;</text>
<text x="900" y="1920" font-size="44" fill="#1E2B47" text-anchor="middle" xml:space="preserve"><tspan>more CO</tspan><tspan dy="12.3" font-size="29.9">2</tspan><tspan dy="-12.3"> to remove</tspan></text>
<rect x="1260" y="1658" width="480" height="382" rx="30" fill="#F2E6B7" stroke="#1E2B47" stroke-width="5"/>
