<line x1="1148" y1="1850" x2="1220" y2="1850" stroke="#1E2B47" stroke-width="7" stroke-linecap="round"/><polygon points="1252,1850 1218,1868.7 1218,1831.3" fill="#1E2B47"/>
<text x="900" y="2146" font-size="44" fill="#4B5B72" text-anchor="middle">Rate falls back to resting after activity</text></g></svg>
