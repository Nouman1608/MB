<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 1800 2400" role="img" aria-labelledby="title desc"><title id="title">Calculating magnification</title><desc id="desc">A tiny real cell, 0.02 mm across and smaller than a full stop, is magnified to an image 60 mm long, measured against a ruler. Magnification = image size ÷ actual size = 60 mm ÷ 0.02 mm = ×3000; both sizes must be in the same units. A box on converting units shows 1 mm = 1000 µm, so 0.02 mm × 1000 = 20 µm. No tier labels.</desc><rect width="1800" height="2400" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="106" font-size="68" font-weight="700" fill="#1E2B47" text-anchor="middle">Calculating magnification</text>
<text x="900" y="168" font-size="44" fill="#4B5B72" text-anchor="middle">Worked example, schematic</text>
<circle cx="241" cy="298" r="7" fill="#1E2B47"/>
<text x="300" y="297" font-size="54" font-weight="700" fill="#1E2B47">Actual size: 0.02 mm</text>
<text x="300" y="360" font-size="44" fill="#4B5B72">smaller than the dot</text>
<line x1="899" y1="408" x2="899" y2="494" stroke="#1E2B47" stroke-width="7" stroke-linecap="round"/><polygon points="899,538 873.7,492 924.3,492" fill="#1E2B47"/>
<text x="960" y="486" font-size="46" fill="#1E2B47">magnified</text>
<line x1="300" y1="769" x2="300" y2="996" stroke="#4B5B72" stroke-width="3" stroke-dasharray="12 9"/>
<line x1="1499" y1="769" x2="1499" y2="996" stroke="#4B5B72" stroke-width="3" stroke-dasharray="12 9"/>
<ellipse cx="899" cy="769" rx="600" ry="199" fill="#DDEBE8" stroke="#1E2B47" stroke-width="6"/>
<circle cx="820" cy="769" r="84" fill="#FFFFFF" stroke="#1E2B47" stroke-width="5"/>
<rect x="300" y="1000" width="1199" height="56" fill="#F2E6B7" stroke="#8A6A0C" stroke-width="5"/>
<text x="300" y="1118" font-size="44" fill="#1E2B47" text-anchor="middle">0</text>
<line x1="499.8" y1="1000" x2="499.8" y2="1032" stroke="#8A6A0C" stroke-width="4"/>
<text x="499.8" y="1118" font-size="44" fill="#1E2B47" text-anchor="middle">10</text>
<line x1="699.7" y1="1000" x2="699.7" y2="1032" stroke="#8A6A0C" stroke-width="4"/>
<text x="699.7" y="1118" font-size="44" fill="#1E2B47" text-anchor="middle">20</text>
<line x1="899.5" y1="1000" x2="899.5" y2="1032" stroke="#8A6A0C" stroke-width="4"/>
<text x="899.5" y="1118" font-size="44" fill="#1E2B47" text-anchor="middle">30</text>
<line x1="1099.3" y1="1000" x2="1099.3" y2="1032" stroke="#8A6A0C" stroke-width="4"/>
<text x="1099.3" y="1118" font-size="44" fill="#1E2B47" text-anchor="middle">40</text>
<line x1="1299.2" y1="1000" x2="1299.2" y2="1032" stroke="#8A6A0C" stroke-width="4"/>
<text x="1299.2" y="1118" font-size="44" fill="#1E2B47" text-anchor="middle">50</text>
<text x="1499" y="1118" font-size="44" fill="#1E2B47" text-anchor="middle">60</text>
<text x="1528" y="1044" font-size="44" fill="#4B5B72">mm</text>
<text x="899" y="1218" font-size="54" font-weight="700" fill="#1E2B47" text-anchor="middle">Image size: 60 mm</text>
<rect x="60" y="1328" width="1680" height="434" rx="36" fill="#FFFFFF" stroke="#1E2B47" stroke-width="6"/>
<text x="120" y="1428" font-size="52" font-weight="700" fill="#1E2B47">magnification = image size ÷ actual size</text>
<text x="120" y="1542" font-size="52" fill="#1E2B47">= 60 mm ÷ 0.02 mm</text>
<text x="120" y="1668" font-size="80" font-weight="700" fill="#2F6B63">= ×3000</text>
<polygon points="120,1892 180,1792 239,1892" fill="#D6B22F" stroke="#1E2B47" stroke-width="5" stroke-linejoin="round"/>
<text x="180" y="1880" font-size="50" font-weight="700" fill="#1E2B47" text-anchor="middle">!</text>
<text x="277" y="1866" font-size="52" font-weight="700" fill="#1E2B47">Use the same units for both sizes</text>
<rect x="60" y="1969" width="1680" height="379" rx="36" fill="#F2E6B7" stroke="#1E2B47" stroke-width="6"/>
<text x="120" y="2050" font-size="44" font-weight="700" fill="#4B5B72">Converting units</text>
<text x="120" y="2152" font-size="56" font-weight="700" fill="#1E2B47">1 mm = 1000 µm</text>
<text x="120" y="2256" font-size="52" fill="#1E2B47">0.02 mm × 1000 = 20 µm</text></g></svg>
