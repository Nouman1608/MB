<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="940" viewBox="0 0 1528 940" role="img" aria-labelledby="title desc"><title id="title">Reading an evolutionary tree</title><desc id="desc">A branching tree with common ancestor nodes. A and B share a more recent common ancestor than either does with C or D.</desc><rect width="1528" height="940" fill="#F3F6F6"/><text x="52" y="62" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#10233F">Reading an evolutionary tree</text><text x="54" y="98" font-family="Arial,sans-serif" font-size="18" fill="#5B6D80">A branching hypothesis of shared ancestry • tip order can rotate without changing relationships</text><rect x="48" y="142" width="1432" height="620" rx="18" fill="#fff" stroke="#D3DCE2" stroke-width="2"/><g fill="none" stroke="#315F86" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M270 630V480M270 480V300M270 480H500M500 480V350M500 350H760M760 350V260M760 350V440M760 260H1040M1040 260V205M1040 260V315M760 440H1040M1040 440V395M1040 440V485M1040 395H1260M1040 485H1260"/></g><g fill="#397D64" stroke="#fff" stroke-width="4"><circle cx="270" cy="480" r="14"/><circle cx="500" cy="350" r="14"/><circle cx="760" cy="350" r="14"/><circle cx="1040" cy="260" r="14"/><circle cx="1040" cy="440" r="14"/></g><g font-family="Arial,sans-serif" fill="#10233F"><g font-size="25" font-weight="700"><text x="1280" y="214">A</text><text x="1280" y="324">B</text><text x="1280" y="404">C</text><text x="1280" y="494">D</text></g><g font-size="17"><text x="212" y="678">older common ancestor</text><text x="420" y="531">common ancestor of A–D</text><text x="698" y="314">shared ancestor of A–C</text><text x="974" y="232">most recent shared node for A and B</text></g></g><g stroke="#C9A227" stroke-width="3" fill="none"><path d="M1040 286V335H1306"/><path d="M1040 461V535H1306"/></g><rect x="48" y="790" width="1432" height="86" rx="14" fill="#E7F5EF" stroke="#9DCBB6"/><text x="76" y="826" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#10233F">How to read it</text><text x="76" y="855" font-family="Arial,sans-serif" font-size="17" fill="#243B53">A and B share a more recent common ancestor than either does with C or D. Living tips are cousins on the tree; one tip is not the ancestor of another.</text><text x="48" y="916" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#315F86">Marlbridge Study Resources</text><image x="1288" y="876" width="190" height="54" href="data:image/svg+xml;base64,"/></svg>
