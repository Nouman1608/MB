<circle cx="864" cy="404" r="38" fill="#1E2B47"/>
<text x="864" y="419" font-size="42" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="936" y="416" font-size="48" font-weight="700" fill="#1E2B47">More nitrate and other ions</text>
<text x="936" y="496" font-size="44" fill="#4B5B72">from fertiliser or sewage</text>
<circle cx="864" cy="750" r="38" fill="#1E2B47"/>
<text x="864" y="765" font-size="42" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="936" y="762" font-size="48" font-weight="700" fill="#1E2B47">Producers (algae) grow fast</text>
<circle cx="864" cy="1094" r="38" fill="#1E2B47"/>
<text x="864" y="1109" font-size="42" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="936" y="1106" font-size="48" font-weight="700" fill="#1E2B47">Producers die:</text>
<text x="936" y="1186" font-size="44" fill="#4B5B72">more decomposition</text>
<circle cx="864" cy="1440" r="38" fill="#B9632F"/>
<text x="864" y="1455" font-size="42" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="936" y="1452" font-size="48" font-weight="700" fill="#1E2B47">Decomposers respire aerobically</text>
<text x="936" y="1532" font-size="44" font-weight="700" fill="#B9632F">Key link: they use up the oxygen</text>
<circle cx="864" cy="1784" r="38" fill="#1E2B47"/>
<text x="864" y="1799" font-size="42" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="936" y="1796" font-size="48" font-weight="700" fill="#1E2B47">Dissolved oxygen falls</text>
<text x="936" y="1876" font-size="44" fill="#4B5B72" xml:space="preserve"><tspan>9.0 to 2.7 mg/dm</tspan><tspan dy="-16.7" font-size="29.9">3</tspan></text>
<text x="936" y="1938" font-size="44" font-weight="700" fill="#B9632F">= 70 % decrease</text>
<circle cx="864" cy="2128" r="38" fill="#1E2B47"/>
<text x="864" y="2143" font-size="42" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="936" y="2140" font-size="48" font-weight="700" fill="#1E2B47">Fish and other animals die</text>
<text x="936" y="2220" font-size="44" fill="#4B5B72">they need dissolved oxygen</text></g></svg>
