<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 1800 2400" role="img" aria-labelledby="title desc"><title id="title">Eutrophication in six steps</title><desc id="desc">(1) More nitrate and other ions enter the water from fertiliser or sewage; (2) producers (algae) grow fast; (3) producers die, so there is more decomposition; (4) decomposers respire aerobically and use up the oxygen; (5) dissolved oxygen falls from 9.0 to 2.7 mg/dm3, a 70% decrease; (6) fish and other animals die because they need dissolved oxygen. No tier labels: eutrophication is on both Edexcel papers (4BI1 4.16-4.17) and in OxfordAQA 9201 3.3.4b, which is not tiered.</desc><rect width="1800" height="2400" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><text x="900" y="88" font-size="68" font-weight="700" fill="#1E2B47" text-anchor="middle">Eutrophication in six steps</text>
<text x="900" y="164" font-size="44" fill="#4B5B72" text-anchor="middle">Schematic</text>
