<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1130" viewBox="0 0 1800 2260" role="img" aria-labelledby="title desc"><title id="title">Smaller pieces, more surface</title><desc id="desc">Top: chewing by the teeth and churning in the stomach break one large cube of food into eight small cubes, so the same amount of food has twice the surface. Bottom: bile emulsifies one large fat droplet into eight small droplets, again doubling the surface so twice as many lipase molecules can reach the fat; the fat molecules themselves are not changed. No tier labels.</desc><rect width="1800" height="2260" fill="#F4F7F6"/><g font-family="Arial, Helvetica, sans-serif"><defs><radialGradient id="fatg" cx="0.4" cy="0.35" r="0.7"><stop offset="0" stop-color="#FBEFB6"/><stop offset="1" stop-color="#D6B22F"/></radialGradient></defs>
