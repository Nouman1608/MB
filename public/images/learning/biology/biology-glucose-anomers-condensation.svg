<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">Glucose ring forms and glycosidic condensation</title><desc id="desc">Glucose ring forms and glycosidic condensation. Haworth projections of alpha- and beta-D-glucose show the six-membered ring, five carbons plus oxygen, CH2OH outside the ring, and the C1 hydroxyl orientation difference. A separate scheme shows alpha-1,4 glycosidic bond formation from C1-OH and HO-C4, release of one water, and hydrolysis as the reverse. Schematic teaching diagram; not a precise stereochemical drawing to scale.</desc><rect width="100%" height="100%" fill="#f5f8f7"/><text x="26" y="46" font-family="Arial,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#1c2d4b">Glucose ring forms and glycosidic condensation</text><text x="26" y="80" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#1c2d4b">Haworth forms of D-glucose; carbon 1 distinguishes α and β.</text><g transform="translate(30,120)"><rect x="0" y="0" width="740" height="410" rx="12" fill="white" stroke="#cbd7d5" stroke-width="2"/><text x="20" y="34" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#1c2d4b">Haworth projections of D-glucose</text><text x="20" y="61" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#71818d">Five carbons and one ring oxygen; carbon 6 lies outside the ring.</text><line x1="205" y1="142" x2="270" y2="180" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round"/><line x1="270" y1="180" x2="270" y2="248" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round"/><line x1="270" y1="248" x2="205" y2="286" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round"/><line x1="205" y1="286" x2="140" y2="248" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round"/><line x1="140" y1="248" x2="140" y2="180" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round"/><line x1="140" y1="180" x2="205" y2="142" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round"/><text x="205" y="142" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#1c2d4b">O</text><circle cx="270" cy="180" r="14" fill="#ffffff" stroke="#cbd7d5" stroke-width="1.4"/><text x="270" y="185" font-family="Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1c2d4b">1</text><circle cx="270" cy="248" r="14" fill="#ffffff" stroke="#cbd7d5" stroke-width="1.4"/><text x="270" y="253" font-family="Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1c2d4b">2</text><circle cx="205" cy="286" r="14" fill="#ffffff" stroke="#cbd7d5" stroke-width="1.4"/><text x="205" y="291" font-family="Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1c2d4b">3</text><circle cx="140" cy="248" r="14" fill="#ffffff" stroke="#cbd7d5" stroke-width="1.4"/><text x="140" y="253" font-family="Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1c2d4b">4</text><circle cx="140" cy="180" r="14" fill="#ffffff" stroke="#cbd7d5" stroke-width="1.4"/><text x="140" y="185" font-family="Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1c2d4b">5</text><line x1="270" y1="180" x2="270" y2="219" stroke="#357ea2" stroke-width="2.2" stroke-linecap="round"/><text x="270" y="238" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#357ea2">OH</text><line x1="275" y1="180" x2="297" y2="141" stroke="#71818d" stroke-width="1.7" stroke-linecap="round"/><text x="307" y="146" font-family="Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#71818d">H</text><line x1="270" y1="248" x2="270" y2="279" stroke="#73aaa4" stroke-width="1.8" stroke-linecap="round"/><text x="270" y="294" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#73aaa4">OH</text><line x1="205" y1="286" x2="205" y2="255" stroke="#73aaa4" stroke-width="1.8" stroke-linecap="round"/><text x="205" y="248" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#73aaa4">OH</text><line x1="140" y1="248" x2="140" y2="279" stroke="#73aaa4" stroke-width="1.8" stroke-linecap="round"/><text x="140" y="294" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#73aaa4">OH</text><line x1="133" y1="175" x2="110" y2="149" stroke="#d6b32d" stroke-width="2" stroke-linecap="round"/><text x="106" y="144" font-family="Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#d6b32d">CH₂OH</text><text x="205" y="338" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#1c2d4b">α-D-glucose</text><line x1="535" y1="142" x2="600" y2="180" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round"/><line x1="600" y1="180" x2="600" y2="248" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round"/><line x1="600" y1="248" x2="535" y2="286" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round"/><line x1="535" y1="286" x2="470" y2="248" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round"/><line x1="470" y1="248" x2="470" y2="180" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round"/><line x1="470" y1="180" x2="535" y2="142" stroke="#1c2d4b" stroke-width="3" stroke-linecap="round"/><text x="535" y="142" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#1c2d4b">O</text><circle cx="600" cy="180" r="14" fill="#ffffff" stroke="#cbd7d5" stroke-width="1.4"/><text x="600" y="185" font-family="Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1c2d4b">1</text><circle cx="600" cy="248" r="14" fill="#ffffff" stroke="#cbd7d5" stroke-width="1.4"/><text x="600" y="253" font-family="Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1c2d4b">2</text><circle cx="535" cy="286" r="14" fill="#ffffff" stroke="#cbd7d5" stroke-width="1.4"/><text x="535" y="291" font-family="Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1c2d4b">3</text><circle cx="470" cy="248" r="14" fill="#ffffff" stroke="#cbd7d5" stroke-width="1.4"/><text x="470" y="253" font-family="Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1c2d4b">4</text><circle cx="470" cy="180" r="14" fill="#ffffff" stroke="#cbd7d5" stroke-width="1.4"/><text x="470" y="185" font-family="Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1c2d4b">5</text><line x1="600" y1="180" x2="600" y2="141" stroke="#357ea2" stroke-width="2.2" stroke-linecap="round"/><text x="600" y="134" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#357ea2">OH</text><line x1="605" y1="180" x2="627" y2="219" stroke="#71818d" stroke-width="1.7" stroke-linecap="round"/><text x="637" y="224" font-family="Arial,sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#71818d">H</text><line x1="600" y1="248" x2="600" y2="279" stroke="#73aaa4" stroke-width="1.8" stroke-linecap="round"/><text x="600" y="294" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#73aaa4">OH</text><line x1="535" y1="286" x2="535" y2="255" stroke="#73aaa4" stroke-width="1.8" stroke-linecap="round"/><text x="535" y="248" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#73aaa4">OH</text><line x1="470" y1="248" x2="470" y2="279" stroke="#73aaa4" stroke-width="1.8" stroke-linecap="round"/><text x="470" y="294" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#73aaa4">OH</text><line x1="463" y1="175" x2="440" y2="149" stroke="#d6b32d" stroke-width="2" stroke-linecap="round"/><text x="436" y="144" font-family="Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#d6b32d">CH₂OH</text><text x="535" y="338" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#1c2d4b">β-D-glucose</text><text x="25" y="382" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#357ea2">At C1: α OH down, β OH up; the H points opposite.</text></g><g transform="translate(820,120)"><rect x="0" y="0" width="740" height="410" rx="12" fill="white" stroke="#cbd7d5" stroke-width="2"/><text x="20" y="34" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#1c2d4b">Condensation makes a glycosidic bond</text><text x="20" y="60" font-family="Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#71818d">Example: two α-glucose molecules form an α-1,4 link</text><text x="36" y="115" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#357ea2">α-glucose</text><text x="36" y="160" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#1c2d4b">C1–OH</text><text x="170" y="160" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#d6b32d">+</text><text x="218" y="160" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#1c2d4b">HO–C4</text><text x="365" y="160" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#73aaa4">→</text><text x="420" y="160" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#1c2d4b">C1–O–C4</text><text x="585" y="160" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#d6b32d">+</text><text x="632" y="160" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#357ea2">H₂O</text><line x1="50" y1="180" x2="122" y2="180" stroke="#b55c52" stroke-width="3" stroke-linecap="round"/><text x="86" y="208" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#b55c52">OH removed</text><line x1="220" y1="180" x2="302" y2="180" stroke="#b55c52" stroke-width="3" stroke-linecap="round"/><text x="261" y="208" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#b55c52">H removed</text><text x="36" y="270" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#1c2d4b">The remaining oxygen links carbon 1 to carbon 4.</text><text x="36" y="303" font-family="Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#1c2d4b">One water molecule is released per new glycosidic bond.</text><rect x="36" y="335" width="665" height="48" rx="8" fill="#e3efec" stroke="#73aaa4" stroke-width="1.5"/><text x="52" y="365" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#1c2d4b">Hydrolysis reverses this: add H₂O and break the C–O–C link.</text></g><text x="26" y="1030" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#1c2d4b">MARLBRIDGE • Schematic; not to scale.</text></svg>