<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="ttl desc">
<title id="ttl">Ansoff matrix: classify growth options and test the target</title><desc id="desc">An Ansoff matrix classifies Orrisdale Cycles’ four proposals and checks whether its 20% market-share target is financially plausible.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#397DA4"/></marker></defs>
<rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial,sans-serif"><text x="62" y="78" font-size="38" fill="#0B1F3A" font-weight="700" text-anchor="start" >Ansoff matrix: classify growth options and test the target</text><text x="64" y="124" font-size="21" fill="#20314B" font-weight="400" text-anchor="start" >OxfordAQA International A-level Business 9725 • strategic options</text><rect x="60" y="165" width="1480" height="755" rx="18" fill="#FFFFFF" stroke="#CCD6D7" stroke-width="2"/><text x="92" y="207" font-size="15" fill="#20314B" font-weight="600" text-anchor="start" >An Ansoff matrix classifies Orrisdale Cycles’ four proposals and checks whether its 20% market-share target is financially plausible.</text><text x="520" y="278" font-size="22" fill="#0B1F3A" font-weight="700" text-anchor="middle" >Orrisdale Cycles • products × markets</text><rect x="115" y="330" width="402.5" height="215.0" rx="0" fill="#EAF4F0" stroke="#FFFFFF" stroke-width="1"/><text x="316.25" y="376" font-size="18" fill="#2D7A78" font-weight="700" text-anchor="middle" >MARKET PENETRATION</text><text x="133" y="422" font-size="17" fill="#0B1F3A" font-weight="600" text-anchor="start" >Loyalty card: every fifth repair free</text><text x="316.25" y="525.0" font-size="14" fill="#607286" font-weight="400" text-anchor="middle" >Existing product • existing city</text><rect x="517.5" y="330" width="402.5" height="215.0" rx="0" fill="#EDF3F7" stroke="#FFFFFF" stroke-width="1"/><text x="718.75" y="376" font-size="18" fill="#397DA4" font-weight="700" text-anchor="middle" >PRODUCT DEVELOPMENT</text><text x="535.5" y="422" font-size="17" fill="#0B1F3A" font-weight="600" text-anchor="start" >Guided tours for hire customers</text><text x="718.75" y="525.0" font-size="14" fill="#607286" font-weight="400" text-anchor="middle" >New product • existing customers</text><rect x="115" y="545.0" width="402.5" height="215.0" rx="0" fill="#FFF8E5" stroke="#FFFFFF" stroke-width="1"/><text x="316.25" y="591.0" font-size="18" fill="#C9A227" font-weight="700" text-anchor="middle" >MARKET DEVELOPMENT</text><text x="133" y="637.0" font-size="17" fill="#0B1F3A" font-weight="600" text-anchor="start" >Open a branch in a second city</text><text x="316.25" y="740.0" font-size="14" fill="#607286" font-weight="400" text-anchor="middle" >Existing service • new market</text><rect x="517.5" y="545.0" width="402.5" height="215.0" rx="0" fill="#FBE8E7" stroke="#FFFFFF" stroke-width="1"/><text x="718.75" y="591.0" font-size="18" fill="#C64545" font-weight="700" text-anchor="middle" >DIVERSIFICATION</text><text x="535.5" y="637.0" font-size="17" fill="#0B1F3A" font-weight="600" text-anchor="start" >Open a co-working café</text><text x="718.75" y="740.0" font-size="14" fill="#607286" font-weight="400" text-anchor="middle" >New product • new market</text><text x="517.5" y="800" font-size="15" fill="#0B1F3A" font-weight="600" text-anchor="middle" >Existing markets  ↑   New markets ↓</text><text x="517.5" y="825" font-size="15" fill="#0B1F3A" font-weight="600" text-anchor="middle" >Existing products ←        → New products</text><rect x="970" y="315" width="500" height="520" rx="16" fill="#FBFCFC" stroke="#CCD6D7" stroke-width="2"/><text x="1000" y="355" font-size="18" fill="#397DA4" font-weight="700" text-anchor="start" >CHECK THE PENETRATION TARGET</text><text x="1000" y="410" font-size="15" fill="#607286" font-weight="600" text-anchor="start" >Current share</text><text x="1000" y="438" font-size="18" fill="#0B1F3A" font-weight="700" text-anchor="start" >£2.1m ÷ £14m = 15%</text><text x="1000" y="479" font-size="15" fill="#607286" font-weight="600" text-anchor="start" >Market next year</text><text x="1000" y="507" font-size="18" fill="#0B1F3A" font-weight="700" text-anchor="start" >£14m × 1.05 = £14.7m</text><text x="1000" y="548" font-size="15" fill="#607286" font-weight="600" text-anchor="start" >Revenue at 20% share</text><text x="1000" y="576" font-size="18" fill="#0B1F3A" font-weight="700" text-anchor="start" >0.20 × £14.7m = £2.94m</text><text x="1000" y="617" font-size="15" fill="#607286" font-weight="600" text-anchor="start" >Required revenue rise</text><text x="1000" y="645" font-size="18" fill="#0B1F3A" font-weight="700" text-anchor="start" >(£2.94m − £2.1m) ÷ £2.1m = 40%</text><line x1="1000" y1="696" x2="1440" y2="696" stroke="#CCD6D7" stroke-width="2"/><text x="1000" y="733" font-size="16" fill="#20314B" font-weight="400" text-anchor="start" >A 40% one-year rise from a loyalty card is</text><text x="1000" y="756" font-size="16" fill="#20314B" font-weight="400" text-anchor="start" >ambitious. The guide suggests testing</text><text x="1000" y="779" font-size="16" fill="#20314B" font-weight="400" text-anchor="start" >penetration alongside product development.</text><text x="115" y="880" font-size="15" fill="#20314B" font-weight="600" text-anchor="start" >Risk generally rises as the firm moves away from products and markets it already knows.</text><line x1="60" y1="955" x2="1540" y2="955" stroke="#CCD6D7" stroke-width="2"/><text x="64" y="995" font-size="14" fill="#607286" font-weight="400" text-anchor="start" >Marlbridge • Business study resource • Strategic options • check context before deciding</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>
