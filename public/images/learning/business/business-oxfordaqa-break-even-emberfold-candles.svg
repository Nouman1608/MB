<title id="title">Break-even analysis: read the chart and test assumptions</title><desc id="desc">A break-even chart uses the source worked example to plot revenue, fixed costs and total costs, marks the 800-candle break-even point, and shows margin of safety and profit at 1,150 candles.</desc>
