ext><text x="1140" y="558" font-size="17" fill="#0B1F3A" font-weight="600" text-anchor="start" >Margin of safety = 350</text><text x="1140" y="598" font-size="16" fill="#397DA4" font-weight="600" text-anchor="start" >Revenue £20,700</text><text x="1140" y="630" font-size="16" fill="#C64545" font-weight="600" text-anchor="start" >Total costs £17,025</text><text x="1140" y="663" font-size="18" fill="#2D7A78" font-weight="700" text-anchor="start" >Profit = £3,675</text><rect x="1110" y="705" width="360" height="165" rx="16" fill="#FBFCFC" stroke="#CCD6D7" stroke-width="2" /><text x="1140" y="743" font-size="16" fill="#397DA4" font-weight="700" text-anchor="start" >CHANGE THE ASSUMPTION</text><text x="1140" y="778" font-size="14" fill="#20314B" font-weight="600" text-anchor="start" >Price £19.50 → break-even 700</text><text x="1140" y="808" font-size="14" fill="#20314B" font-weight="600" text-anchor="start" >Fixed costs £9,240 → break-even 880</text><text x="1140" y="840" font-size="13" fill="#607286" font-weight="400" text-anchor="start" >Linear costs and one selling price are assumptions.</text><text x="110" y="885" font-size="15" fill="#20314B" font-weight="600" text-anchor="start" >The crossing point marks where revenue = total costs; left is loss, right is profit (at the stated assumptions).</text>
