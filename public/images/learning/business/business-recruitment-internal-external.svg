<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">Recruitment choices: internal or external?</title><desc id="desc">A recruitment decision map compares internal and external recruitment on speed, cost, familiarity, candidate range and specialist skills, then applies the trade-offs to a growing business needing a specialist quickly.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial, sans-serif" fill="#20314B"><text x="62" y="78" font-size="40" font-weight="700" fill="#0B1F3A">Recruitment choices: internal or external?</text><text x="64" y="124" font-size="22">Marlbridge teaching diagram • examples are schematic</text><rect x="60" y="165" width="1480" height="755" rx="18" fill="white" stroke="#CCD6D7" stroke-width="2"/><text x="100" y="225" font-size="22">Choose a recruitment route against the role and the business situation, not from a memorised list.</text><rect x="500" y="275" width="600" height="92" rx="16" fill="#E7EFED" stroke="#2D7A78" stroke-width="3"/><text x="800" y="313" text-anchor="middle" font-size="22" font-weight="700" fill="#0B1F3A">Workforce plan identifies a vacancy</text><text x="800" y="346" text-anchor="middle" font-size="18">Define required skills, urgency and fit</text><path d="M800 367 V420 M800 420 H425 V455 M800 420 H1175 V455" fill="none" stroke="#397DA4" stroke-width="4"/><path d="M425 455 l-10 -16 h20 z M1175 455 l-10 -16 h20 z" fill="#397DA4"/><rect x="120" y="470" width="630" height="250" rx="16" fill="#FBFCFC" stroke="#2D7A78" stroke-width="3"/><text x="148" y="515" font-size="23" font-weight="700" fill="#0B1F3A">INTERNAL RECRUITMENT</text><circle cx="156" cy="565" r="5" fill="#2D7A78"/><text x="174" y="572" font-size="18">Usually faster and lower cost</text><circle cx="156" cy="603" r="5" fill="#2D7A78"/><text x="174" y="610" font-size="18">Candidate already knows the business</text><circle cx="156" cy="641" r="5" fill="#2D7A78"/><text x="174" y="648" font-size="18">Smaller pool; may not have specialist skill</text><circle cx="156" cy="679" r="5" fill="#2D7A78"/><text x="174" y="686" font-size="18">Can create a vacancy elsewhere</text><rect x="850" y="470" width="630" height="250" rx="16" fill="#FBFCFC" stroke="#C9A227" stroke-width="3"/><text x="878" y="515" font-size="23" font-weight="700" fill="#0B1F3A">EXTERNAL RECRUITMENT</text><circle cx="886" cy="565" r="5" fill="#C9A227"/><text x="904" y="572" font-size="18">Wider pool of specialist skills</text><circle cx="886" cy="603" r="5" fill="#C9A227"/><text x="904" y="610" font-size="18">Fresh perspectives may be added</text><circle cx="886" cy="641" r="5" fill="#C9A227"/><text x="904" y="648" font-size="18">Usually slower and more expensive</text><circle cx="886" cy="679" r="5" fill="#C9A227"/><text x="904" y="686" font-size="18">New hire needs time to adjust</text><rect x="150" y="770" width="1300" height="98" rx="16" fill="#FFF6D9" stroke="#E3D8B1"/><text x="185" y="809" font-size="20" font-weight="700" fill="#0B1F3A">Scenario test: specialist role needed quickly</text><text x="185" y="844" font-size="19">External recruitment may win if no current employee has the skill; internal may win if a ready candidate fits and speed/cost matter most.</text><line x1="60" y1="972" x2="1540" y2="972" stroke="#CCD6D7" stroke-width="2"/><text x="64" y="1017" font-size="18">Marlbridge • study diagram • check assumptions and context</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>
