<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img"><title>Economic sectors and added value in a coffee chain</title><desc>Primary producers, secondary processors and tertiary sellers form an interdependent chain; added value is distinct from profit.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#397DA4"/></marker></defs><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial,sans-serif" fill="#20314B"><text x="62" y="78" font-size="40" font-weight="700" fill="#0B1F3A" text-anchor="start">Economic sectors and added value in a coffee chain</text><text x="64" y="124" font-size="22" font-weight="400" fill="#20314B" text-anchor="start">Marlbridge teaching diagram • schematic concept illustration</text><rect x="60" y="165" width="1480" height="755" rx="18" fill="white" stroke="#CCD6D7" stroke-width="2"/><text x="100" y="225" font-size="20" font-weight="400" fill="#20314B" text-anchor="start">A product can connect all three sectors as materials move toward the customer.</text><rect x="95" y="300" width="420" height="270" rx="14" fill="#E7EFED" stroke="#2D7A78" stroke-width="2"/><rect x="590" y="300" width="420" height="270" rx="14" fill="#FBFCFC" stroke="#CCD6D7" stroke-width="2"/><rect x="1085" y="300" width="420" height="270" rx="14" fill="#FFF8E5" stroke="#C9A227" stroke-width="2"/><text x="130" y="350" font-size="22" font-weight="700" fill="#2D7A78" text-anchor="start">PRIMARY</text><text x="130" y="395" font-size="20" font-weight="700" fill="#20314B" text-anchor="start">Coffee farming</text><text x="130" y="445" font-size="17" font-weight="400" fill="#20314B" text-anchor="start">Grow and harvest beans</text><text x="130" y="510" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">Extracts natural resources</text><path d="M515 435 L585 435" stroke="#397DA4" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="625" y="350" font-size="22" font-weight="700" fill="#397DA4" text-anchor="start">SECONDARY</text><text x="625" y="395" font-size="20" font-weight="700" fill="#20314B" text-anchor="start">Coffee roasting</text><text x="625" y="445" font-size="17" font-weight="400" fill="#20314B" text-anchor="start">Process beans into a product</text><text x="625" y="510" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">Manufactures or processes</text><path d="M1010 435 L1080 435" stroke="#397DA4" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="1120" y="350" font-size="22" font-weight="700" fill="#A58214" text-anchor="start">TERTIARY</text><text x="1120" y="395" font-size="20" font-weight="700" fill="#20314B" text-anchor="start">Cafe / retailer</text><text x="1120" y="445" font-size="17" font-weight="400" fill="#20314B" text-anchor="start">Sell and serve customers</text><text x="1120" y="510" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">Provides services</text><rect x="180" y="640" width="1240" height="150" rx="12" fill="#EDF3F7" stroke="#397DA4" stroke-width="2"/><text x="800" y="685" font-size="17" font-weight="700" fill="#0B1F3A" text-anchor="middle">ADDED VALUE (teaching formula)</text><text x="800" y="730" font-size="24" font-weight="700" fill="#2D7A78" text-anchor="middle">Selling price − cost of bought-in materials</text><text x="800" y="767" font-size="17" font-weight="400" fill="#20314B" text-anchor="middle">Added value is not profit: wages, rent and other costs still remain.</text><text x="800" y="835" font-size="16" font-weight="700" fill="#0B1F3A" text-anchor="middle">Sector interdependence links suppliers, processors, transport, finance and retail.</text><text x="800" y="870" font-size="15" font-weight="400" fill="#20314B" text-anchor="middle">As economies develop, the secondary sector often declines as tertiary activity grows.</text><path d="M60 972H1540" stroke="#CCD6D7" stroke-width="2"/><text x="64" y="1015" font-size="17" font-weight="400" fill="#20314B" text-anchor="start">Marlbridge • study diagram • check assumptions and context</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>
