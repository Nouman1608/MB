<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">Marketing: research informs the marketing mix</title><desc id="desc">A four-step flow links research, segmentation, positioning and coordinated product price promotion and place decisions.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial,sans-serif" fill="#20314B"><text x="62" y="78" font-size="40" font-weight="700" fill="#0B1F3A">Marketing: research informs the marketing mix</text><text x="64" y="124" font-size="22">Marlbridge teaching diagram • examples are schematic</text><rect x="60" y="165" width="1480" height="755" rx="18" fill="white" stroke="#CCD6D7" stroke-width="2"/><text x="100" y="225" font-size="22" font-weight="400" fill="#20314B" text-anchor="start">Connect evidence about customers to a specific segment, then coordinate the 4Ps.</text><rect x="100" y="315" width="315" height="310" rx="14" fill="#E7EFED" stroke="#2D7A78" stroke-width="2"/><text x="120" y="365" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="start">1  RESEARCH</text><text x="120" y="415" font-size="18" font-weight="700" fill="#2D7A78" text-anchor="start">Primary / secondary</text><text x="120" y="485" font-size="17" font-weight="400" fill="#20314B" text-anchor="start">Collect reliable evidence</text><text x="120" y="535" font-size="17" font-weight="400" fill="#20314B" text-anchor="start">Sample, analyse, interpret</text><path d="M415 470 L445 470" stroke="#397DA4" stroke-width="4" fill="none"/><path d="M445 462 l14 8 -14 8" fill="#397DA4"/><rect x="450" y="315" width="315" height="310" rx="14" fill="#FBFCFC" stroke="#CCD6D7" stroke-width="2"/><text x="470" y="365" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="start">2  SEGMENT</text><text x="470" y="415" font-size="14" font-weight="700" fill="#2D7A78" text-anchor="start">Geographic • demographic • psychographic</text><text x="470" y="485" font-size="17" font-weight="400" fill="#20314B" text-anchor="start">Group customers by meaningful needs</text><text x="470" y="535" font-size="17" font-weight="400" fill="#20314B" text-anchor="start">Choose the target market</text><path d="M765 470 L795 470" stroke="#397DA4" stroke-width="4" fill="none"/><path d="M795 462 l14 8 -14 8" fill="#397DA4"/><rect x="800" y="315" width="315" height="310" rx="14" fill="#FBFCFC" stroke="#CCD6D7" stroke-width="2"/><text x="820" y="365" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="start">3  POSITION</text><text x="820" y="415" font-size="18" font-weight="700" fill="#2D7A78" text-anchor="start">Market orientation</text><text x="820" y="485" font-size="17" font-weight="400" fill="#20314B" text-anchor="start">Clarify the value offered</text><text x="820" y="535" font-size="17" font-weight="400" fill="#20314B" text-anchor="start">Check against competitors</text><path d="M1115 470 L1145 470" stroke="#397DA4" stroke-width="4" fill="none"/><path d="M1145 462 l14 8 -14 8" fill="#397DA4"/><rect x="1150" y="315" width="315" height="310" rx="14" fill="#E7EFED" stroke="#2D7A78" stroke-width="2"/><text x="1170" y="365" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="start">4  COORDINATE THE 4Ps</text><text x="1170" y="415" font-size="15" font-weight="700" fill="#2D7A78" text-anchor="start">Product • Price • Promotion • Place</text><text x="1170" y="485" font-size="17" font-weight="400" fill="#20314B" text-anchor="start">Build one coherent mix</text><text x="1170" y="535" font-size="17" font-weight="400" fill="#20314B" text-anchor="start">Fit the target and objective</text><rect x="120" y="700" width="620" height="130" rx="14" fill="#FBFCFC" stroke="#CCD6D7" stroke-width="2"/><text x="150" y="745" font-size="22" font-weight="700" fill="#0B1F3A" text-anchor="start">Portfolio tools</text><text x="150" y="785" font-size="18" font-weight="400" fill="#20314B" text-anchor="start">Product life cycle and Boston Matrix inform product decisions.</text><rect x="800" y="700" width="620" height="130" rx="14" fill="#FFF4D6" stroke="#E0C76C" stroke-width="2"/><text x="830" y="745" font-size="22" font-weight="700" fill="#0B1F3A" text-anchor="start">Exam check</text><text x="830" y="785" font-size="18" font-weight="400" fill="#20314B" text-anchor="start">Recommend a mix using the scenario; justify fit, cost and likely response.</text><path d="M60 972H1540" stroke="#CCD6D7" stroke-width="2"/><text x="64" y="1015" font-size="17">Marlbridge • study diagram • check assumptions and context</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>
