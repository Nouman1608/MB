<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img"><title>Product life cycle: sales stages guide marketing choices</title><desc>Schematic product life cycle with the four Ps shown as connected decisions that may change by stage.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#397DA4"/></marker></defs><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial,sans-serif" fill="#20314B"><text x="62" y="78" font-size="40" font-weight="700" fill="#0B1F3A" text-anchor="start">Product life cycle: sales stages guide marketing choices</text><text x="64" y="124" font-size="22" font-weight="400" fill="#20314B" text-anchor="start">Marlbridge teaching diagram • schematic concept illustration</text><rect x="60" y="165" width="1480" height="755" rx="18" fill="white" stroke="#CCD6D7" stroke-width="2"/><text x="100" y="225" font-size="20" font-weight="400" fill="#20314B" text-anchor="start">The product life cycle links changing sales patterns to marketing choices.</text><rect x="105" y="275" width="945" height="490" rx="12" fill="#FBFCFC" stroke="#CCD6D7" stroke-width="2"/><text x="135" y="315" font-size="17" font-weight="700" fill="#0B1F3A" text-anchor="start">PRODUCT LIFE CYCLE (schematic; no numeric scale)</text><path d="M195 690 L970 690" stroke="#20314B" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M195 690 L195 360" stroke="#20314B" stroke-width="2" fill="none" marker-end="url(#arr)"/><text x="145" y="375" font-size="15" font-weight="700" fill="#20314B" text-anchor="start">Sales</text><text x="980" y="718" font-size="15" font-weight="700" fill="#20314B" text-anchor="start">Time</text><path d="M210 655 C310 600 385 490 485 425 C590 360 690 395 775 435 C850 470 900 545 960 590" fill="none" stroke="#2D7A78" stroke-width="7"/><text x="255" y="730" font-size="16" font-weight="700" fill="#20314B" text-anchor="start">Introduction</text><text x="445" y="730" font-size="16" font-weight="700" fill="#20314B" text-anchor="start">Growth</text><text x="635" y="730" font-size="16" font-weight="700" fill="#20314B" text-anchor="start">Maturity</text><text x="830" y="730" font-size="16" font-weight="700" fill="#20314B" text-anchor="start">Decline</text><text x="255" y="610" font-size="15" font-weight="400" fill="#20314B" text-anchor="start">Build awareness</text><text x="455" y="400" font-size="15" font-weight="400" fill="#20314B" text-anchor="start">Expand demand</text><text x="655" y="485" font-size="15" font-weight="400" fill="#20314B" text-anchor="start">Defend share</text><text x="835" y="570" font-size="15" font-weight="400" fill="#20314B" text-anchor="start">Consider extension</text><rect x="1080" y="275" width="415" height="490" rx="12" fill="#E7EFED" stroke="#2D7A78" stroke-width="2"/><text x="1110" y="320" font-size="19" font-weight="700" fill="#2D7A78" text-anchor="start">FOUR Ps WORK TOGETHER</text><text x="1110" y="375" font-size="18" font-weight="700" fill="#20314B" text-anchor="start">Product</text><text x="1110" y="405" font-size="15" font-weight="400" fill="#20314B" text-anchor="start">features, brand, packaging</text><text x="1110" y="455" font-size="18" font-weight="700" fill="#20314B" text-anchor="start">Price</text><text x="1110" y="485" font-size="15" font-weight="400" fill="#20314B" text-anchor="start">method and customer response</text><text x="1110" y="535" font-size="18" font-weight="700" fill="#20314B" text-anchor="start">Place</text><text x="1110" y="565" font-size="15" font-weight="400" fill="#20314B" text-anchor="start">direct or intermediary channels</text><text x="1110" y="615" font-size="18" font-weight="700" fill="#20314B" text-anchor="start">Promotion</text><text x="1110" y="645" font-size="15" font-weight="400" fill="#20314B" text-anchor="start">aim, reach and cost</text><rect x="230" y="795" width="1140" height="70" rx="10" fill="#FFF4D6" stroke="#E0C76C" stroke-width="2"/><text x="800" y="837" font-size="18" font-weight="700" fill="#0B1F3A" text-anchor="middle">Stage informs decisions; it does not prescribe one universal marketing mix.</text><path d="M60 972H1540" stroke="#CCD6D7" stroke-width="2"/><text x="64" y="1015" font-size="17" font-weight="400" fill="#20314B" text-anchor="start">Marlbridge • study diagram • check assumptions and context</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>
