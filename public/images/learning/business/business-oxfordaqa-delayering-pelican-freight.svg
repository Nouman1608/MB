<title id="title">Delayering: map Pelican Freight’s structure and trade-off</title><desc id="desc">The source case's hierarchy before and after removing three regional directors shows the staff totals, reporting relationships, salary saving, and CEO span-of-control change from 3 to 15.</desc>
