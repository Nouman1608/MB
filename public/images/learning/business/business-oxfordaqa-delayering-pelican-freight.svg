<g font-family="Arial, sans-serif"><text x="62" y="78" font-size="38" fill="#0B1F3A" font-weight="700" text-anchor="start" >Delayering: map Pelican Freight’s structure and trade-off</text><text x="64" y="124" font-size="21" fill="#20314B" font-weight="400" text-anchor="start" >OxfordAQA International AS Business 9725 • human resources</text>
<rect x="60" y="165" width="1480" height="755" rx="18" fill="#FFFFFF" stroke="#CCD6D7" stroke-width="2" /><text x="95" y="211" font-size="15" fill="#20314B" font-weight="600" text-anchor="start" >The source case's hierarchy before and after removing three regional directors shows the staff totals, reporting relationships, salary saving, and CEO</text><text x="95" y="233" font-size="15" fill="#20314B" font-weight="600" text-anchor="start" >span-of-control change from 3 to 15.</text><text x="800" y="270" font-size="22" fill="#0B1F3A" font-weight="700" text-anchor="middle" >Pelican Freight • 199 employees • four levels before delayering</text><rect x="100" y="310" width="675" height="490" rx="18" fill="#FBFCFC" stroke="#CCD6D7" stroke-width="2" /><text x="437" y="350" font-size="20" fill="#397DA4" font-weight="700" text-anchor="middle" >BEFORE</text><rect x="310" y="380" width="255" height="58" rx="12" fill="#EDF3F7" stroke="#397DA4" stroke-width="2" /><text x="437" y="416" font-size="17" fill="#0B1F3A" font-weight="700" text-anchor="middle" >1 chief executive</text><line x1="437" y1="438" x2="230" y2="475" stroke="#397DA4" stroke-width="2" marker-end="url(#arrow)"/><rect x="180" y="475" width="130" height="56" rx="10" fill="#EAF4F0" stroke="#2D7A78" stroke-width="2" /><text x="245" y="510" font-size="15" fill="#0B1F3A" font-weight="700" text-anchor="middle" >Region 1</text><line x1="437" y1="438" x2="415" y2="475" stroke="#397DA4" stroke-width="2" marker-end="url(#arrow)"/><rect x="365" y="475" width="130" height="56" rx="10" fill="#EAF4F0" stroke="#2D7A78" stroke-width="2" /><text x="430" y="510" font-size="15" fill="#0B1F3A" font-weight="700" text-anchor="middle" >Region 2</text><line x1="437" y1="438" x2="600" y2="475" stroke="#397DA4" stroke-width="2" marker-end="url(#arrow)"/><rect x="550" y="475" width="130" height="56" rx="10" fill="#EAF4F0" stroke="#2D7A78" stroke-width="2" /><text x="615" y="510" font-size="15" fill="#0B1F3A" font-weight="700" text-anchor="middle" >Region 3</text><text x="128" y="510" font-size="14" fill="#607286" font-weight="600" text-anchor="start" >3 directors</text><line x1="245" y1="531" x2="245" y2="565" stroke="#2D7A78" stroke-width="2"/><rect x="184" y="565" width="122" height="68" rx="10" fill="#FFF8E5" stroke="#C9A227" stroke-width="2" /><text x="245" y="592" font-size="14" fill="#0B1F3A" font-weight="700" text-anchor="middle" >5 depot</text><text x="245" y="615" font-size="14" fill="#0B1F3A" font-weight="700" text-anchor="middle" >managers</text><line x1="430" y1="531" x2="430" y2="565" stroke="#2D7A78" stroke-width="2"/><rect x="369" y="565" width="122" height="68" rx="10" fill="#FFF8E5" stroke="#C9A227" stroke-width="2" /><text x="430" y="592" font-size="14" fill="#0B1F3A" font-weight="700" text-anchor="middle" >5 depot</text><text x="430" y="615" font-size="14" fill="#0B1F3A" font-weight="700" text-anchor="middle" >managers</text><line x1="615" y1="531" x2="615" y2="565" stroke="#2D7A78" stroke-width="2"/><rect x="554" y="565" width="122" height="68" rx="10" fill="#FFF8E5" stroke="#C9A227" stroke-width="2" /><text x="615" y="592" font-size="14" fill="#0B1F3A" font-weight="700" text-anchor="middle" >5 depot</text><text x="615" y="615" font-size="14" fill="#0B1F3A" font-weight="700" text-anchor="middle" >managers</text><line x1="420" y1="633" x2="420" y2="676" stroke="#C9A227" stroke-width="2" marker-end="url(#arrow)"/><rect x="250" y="678" width="340" height="78" rx="12" fill="#FBE8E7" stroke="#C64545" stroke-width="2" /><text x="420" y="709" font-size="16" fill="#0B1F3A" font-weight="700" text-anchor="middle" >15 depot managers</text><text x="420" y="736" font-size="14" fill="#20314B" font-weight="400" text-anchor="middle" >180 drivers • 12 per manager</text><text x="437" y="785" font-size="14" fill="#607286" font-weight="600" text-anchor="middle" >CEO span = 3  •  15 managers  •  180 drivers</text><rect x="835" y="310" width="665" height="490" rx="18" fill="#FBFCFC" stroke="#CCD6D7" stroke-width="2" /><text x="1167" y="350" font-size="18" fill="#C64545" font-weight="700" text-anchor="middle" >AFTER REMOVING REGIONAL DIRECTORS</text><rect x="1035" y="410" width="265" height="58" rx="12" fill="#EDF3F7" stroke="#397DA4" stroke-width="2" /><text x="1167" y="446" font-size="17" fill="#0B1F3A" font-weight="700" text-anchor="middle" >1 chief executive</text><line x1="1167" y1="468" x2="1167" y2="523" stroke="#397DA4" stroke-width="3" marker-end="url(#arrow)"/><rect x="955" y="526" width="425" height="76" rx="12" fill="#FFF8E5" stroke="#C9A227" stroke-width="2" /><text x="1167" y="557" font-size="17" fill="#0B1F3A" font-weight="700" text-anchor="middle" >15 depot managers</text><text x="1167" y="584" font-size="15" fill="#C64545" font-weight="700" text-anchor="middle" >CEO span of control rises 3 → 15</text><line x1="1167" y1="602" x2="1167" y2="645" stroke="#C9A227" stroke-width="2" marker-end="url(#arrow)"/><rect x="955" y="650" width="425" height="78" rx="12" fill="#EAF4F0" stroke="#2D7A78" stroke-width="2" /><text x="1167" y="681" font-size="17" fill="#0B1F3A" font-weight="700" text-anchor="middle" >180 drivers</text><text x="1167" y="710" font-size="15" fill="#20314B" font-weight="400" text-anchor="middle" >12 drivers per depot manager</text><text x="1167" y="765" font-size="14" fill="#607286" font-weight="600" text-anchor="middle" >196 employees • 3 fewer management posts</text><rect x="110" y="830" width="1380" height="72" rx="14" fill="#FFF8E5" stroke="#C9A227" stroke-width="2" /><text x="145" y="861" font-size="17" fill="#0B1F3A" font-weight="700" text-anchor="start" >Trade-off</text><text x="275" y="861" font-size="17" fill="#20314B" font-weight="500" text-anchor="start" >£270,000 annual salary saving; wider CEO span may increase workload and slow oversight.</text>
