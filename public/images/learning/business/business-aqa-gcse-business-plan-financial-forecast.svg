<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">Business plan: connect the idea to financial viability</title><desc id="desc">Business plan flow from business idea and target market through objectives to forecasts, with the lesson’s £200 weekly profit example.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial,sans-serif" fill="#20314B"><text x="62" y="78" font-size="40" font-weight="700" fill="#0B1F3A">Business plan: connect the idea to financial viability</text><text x="64" y="124" font-size="22">Marlbridge teaching diagram • examples are schematic</text><rect x="60" y="165" width="1480" height="755" rx="18" fill="white" stroke="#CCD6D7" stroke-width="2"/><text x="100" y="225" font-size="21" font-weight="400" fill="#20314B" text-anchor="start">A plan helps the entrepreneur test practical details and helps lenders assess risk and viability.</text><rect x="90" y="305" width="260" height="140" rx="14" fill="#E7EFED" stroke="#2D7A78" stroke-width="2"/><text x="106" y="350" font-size="16" font-weight="700" fill="#0B1F3A" text-anchor="start">BUSINESS IDEA</text><text x="106" y="397" font-size="15" font-weight="400" fill="#20314B" text-anchor="start">What will be offered?</text><path d="M350 375 L375 375" stroke="#397DA4" stroke-width="3" fill="none"/><rect x="380" y="305" width="260" height="140" rx="14" fill="#FBFCFC" stroke="#CCD6D7" stroke-width="2"/><text x="396" y="350" font-size="16" font-weight="700" fill="#0B1F3A" text-anchor="start">TARGET MARKET</text><text x="396" y="397" font-size="15" font-weight="400" fill="#20314B" text-anchor="start">Who will buy?</text><path d="M640 375 L665 375" stroke="#397DA4" stroke-width="3" fill="none"/><rect x="670" y="305" width="260" height="140" rx="14" fill="#FBFCFC" stroke="#CCD6D7" stroke-width="2"/><text x="686" y="350" font-size="16" font-weight="700" fill="#0B1F3A" text-anchor="start">MARKETING</text><text x="686" y="397" font-size="15" font-weight="400" fill="#20314B" text-anchor="start">How will customers be reached?</text><path d="M930 375 L955 375" stroke="#397DA4" stroke-width="3" fill="none"/><rect x="960" y="305" width="260" height="140" rx="14" fill="#FBFCFC" stroke="#CCD6D7" stroke-width="2"/><text x="976" y="350" font-size="16" font-weight="700" fill="#0B1F3A" text-anchor="start">OBJECTIVES</text><text x="976" y="397" font-size="15" font-weight="400" fill="#20314B" text-anchor="start">What does success mean?</text><path d="M1220 375 L1245 375" stroke="#397DA4" stroke-width="3" fill="none"/><rect x="1250" y="305" width="260" height="140" rx="14" fill="#E7EFED" stroke="#2D7A78" stroke-width="2"/><text x="1266" y="350" font-size="16" font-weight="700" fill="#0B1F3A" text-anchor="start">FINANCIAL FORECASTS</text><text x="1266" y="397" font-size="15" font-weight="400" fill="#20314B" text-anchor="start">Start-up costs • revenue • cash flow</text><rect x="135" y="525" width="1290" height="285" rx="14" fill="#F3F6F6" stroke="#CCD6D7" stroke-width="2"/><text x="170" y="575" font-size="22" font-weight="700" fill="#0B1F3A" text-anchor="start">Weekly forecast example</text><text x="170" y="635" font-size="17" font-weight="700" fill="#2D7A78" text-anchor="start">Revenue</text><text x="315" y="635" font-size="17" font-weight="400" fill="#20314B" text-anchor="start">200 × £5 = £1,000</text><text x="570" y="635" font-size="17" font-weight="700" fill="#2D7A78" text-anchor="start">Variable costs</text><text x="715" y="635" font-size="17" font-weight="400" fill="#20314B" text-anchor="start">200 × £2 = £400</text><text x="970" y="635" font-size="17" font-weight="700" fill="#2D7A78" text-anchor="start">Fixed costs</text><text x="1115" y="635" font-size="17" font-weight="400" fill="#20314B" text-anchor="start">£400</text><text x="170" y="710" font-size="17" font-weight="700" fill="#2D7A78" text-anchor="start">Total costs</text><text x="315" y="710" font-size="17" font-weight="400" fill="#20314B" text-anchor="start">£400 + £400 = £800</text><text x="570" y="710" font-size="17" font-weight="700" fill="#2D7A78" text-anchor="start">Profit</text><text x="715" y="710" font-size="17" font-weight="400" fill="#20314B" text-anchor="start">£1,000 − £800 = £200</text><text x="170" y="785" font-size="16" font-weight="400" fill="#596B7E" text-anchor="start">A forecast is an estimate; compare actual results and cash timing before committing funds.</text><path d="M60 972H1540" stroke="#CCD6D7" stroke-width="2"/><text x="64" y="1015" font-size="17">Marlbridge • study diagram • check assumptions and context</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>
