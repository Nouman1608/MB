<title id="title">Lewin force field: assess Velmoray’s automation change</title><desc id="desc">A force-field analysis scores the source's three driving and three restraining forces for Velmoray, totals them correctly, and shows how retraining could widen the balance from 12–10 to 12–7.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#397DA4"/></marker><marker id="navyArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#0B1F3A"/></marker></defs>
<rect width="1600" height="1050" fill="#F3F6F6"/>
<g font-family="Arial, sans-serif"><text x="62" y="78" font-size="38" fill="#0B1F3A" font-weight="700" text-anchor="start" >Lewin force field: assess Velmoray’s automation change</text><text x="64" y="124" font-size="21" fill="#20314B" font-weight="400" text-anchor="start" >OxfordAQA International A-level Business 9725 • change, risk and uncertainty</text>
<rect x="60" y="165" width="1480" height="755" rx="18" fill="#FFFFFF" stroke="#CCD6D7" stroke-width="2" /><text x="95" y="211" font-size="15" fill="#20314B" font-weight="600" text-anchor="start" >A force-field analysis scores the source's three driving and three restraining forces for Velmoray, totals them correctly, and shows how retraining could</text><text x="95" y="233" font-size="15" fill="#20314B" font-weight="600" text-anchor="start" >widen the balance from 12–10 to 12–7.</text><text x="800" y="270" font-size="22" fill="#0B1F3A" font-weight="700" text-anchor="middle" >Velmoray automation • score each force, then plan how to shift it</text><rect x="120" y="315" width="635" height="64" rx="12" fill="#EAF4F0" stroke="#2D7A78" stroke-width="2" /><text x="438" y="355" font-size="21" fill="#2D7A78" font-weight="700" text-anchor="middle" >DRIVING FORCES  →</text><rect x="845" y="315" width="635" height="64" rx="12" fill="#FBE8E7" stroke="#C64545" stroke-width="2" /><text x="1162" y="355" font-size="21" fill="#C64545" font-weight="700" text-anchor="middle" >←  RESTRAINING FORCES</text><text x="150" y="425" font-size="18" fill="#20314B" font-weight="600" text-anchor="start" >Rising wage costs</text><rect x="150" y="443" width="440" height="24" rx="8" fill="#E5ECEC" stroke="#D0DADB" stroke-width="1" /><rect x="150" y="443" width="352" height="24" rx="8" fill="#2D7A78" stroke="#2D7A78" stroke-width="1" /><text x="620" y="464" font-size="18" fill="#2D7A78" font-weight="700" text-anchor="middle" >4</text><text x="150" y="480" font-size="18" fill="#20314B" font-weight="600" text-anchor="start" >Faster delivery demanded</text><rect x="150" y="498" width="440" height="24" rx="8" fill="#E5ECEC" stroke="#D0DADB" stroke-width="1" /><rect x="150" y="498" width="440" height="24" rx="8" fill="#2D7A78" stroke="#2D7A78" stroke-width="1" /><text x="620" y="519" font-size="18" fill="#2D7A78" font-weight="700" text-anchor="middle" >5</text><text x="150" y="535" font-size="18" fill="#20314B" font-weight="600" text-anchor="start" >Automated looms cheaper</text><rect x="150" y="553" width="440" height="24" rx="8" fill="#E5ECEC" stroke="#D0DADB" stroke-width="1" /><rect x="150" y="553" width="264" height="24" rx="8" fill="#2D7A78" stroke="#2D7A78" stroke-width="1" /><text x="620" y="574" font-size="18" fill="#2D7A78" font-weight="700" text-anchor="middle" >3</text><text x="1000" y="425" font-size="18" fill="#20314B" font-weight="600" text-anchor="start" >Fear of job losses</text><rect x="1000" y="443" width="440" height="24" rx="8" fill="#E5ECEC" stroke="#D0DADB" stroke-width="1" /><rect x="1000" y="443" width="352" height="24" rx="8" fill="#C64545" stroke="#C64545" stroke-width="1" /><text x="1460" y="464" font-size="18" fill="#C64545" font-weight="700" text-anchor="middle" >4</text><text x="1000" y="480" font-size="18" fill="#20314B" font-weight="600" text-anchor="start" >Machine capital cost</text><rect x="1000" y="498" width="440" height="24" rx="8" fill="#E5ECEC" stroke="#D0DADB" stroke-width="1" /><rect x="1000" y="498" width="352" height="24" rx="8" fill="#C64545" stroke="#C64545" stroke-width="1" /><text x="1460" y="519" font-size="18" fill="#C64545" font-weight="700" text-anchor="middle" >4</text><text x="1000" y="535" font-size="18" fill="#20314B" font-weight="600" text-anchor="start" >Operator skills gap</text><rect x="1000" y="553" width="440" height="24" rx="8" fill="#E5ECEC" stroke="#D0DADB" stroke-width="1" /><rect x="1000" y="553" width="176" height="24" rx="8" fill="#C64545" stroke="#C64545" stroke-width="1" /><text x="1460" y="574" font-size="18" fill="#C64545" font-weight="700" text-anchor="middle" >2</text><rect x="665" y="455" width="300" height="78" rx="16" fill="#FFF8E5" stroke="#C9A227" stroke-width="2" /><text x="815" y="484" font-size="17" fill="#0B1F3A" font-weight="700" text-anchor="middle" >Initial balance</text><text x="815" y="511" font-size="15" fill="#20314B" font-weight="600" text-anchor="middle" >12 driving vs 10 restraining</text><line x1="815" y1="537" x2="815" y2="565" stroke="#C9A227" stroke-width="3" marker-end="url(#arrow)"/><rect x="120" y="590" width="1360" height="165" rx="16" fill="#FBFCFC" stroke="#CCD6D7" stroke-width="2" /><text x="160" y="630" font-size="18" fill="#397DA4" font-weight="700" text-anchor="start" >WEAKEN TWO RESTRICTIONS</text><text x="160" y="670" font-size="18" fill="#20314B" font-weight="600" text-anchor="start" >Retraining guarantee: job-loss fear 4 → 2</text><text x="160" y="710" font-size="18" fill="#20314B" font-weight="600" text-anchor="start" >Training course: skills gap 2 → 1</text><text x="910" y="670" font-size="17" fill="#607286" font-weight="600" text-anchor="start" >New restraining total</text><text x="1190" y="670" font-size="21" fill="#C64545" font-weight="700" text-anchor="start" >2 + 4 + 1 = 7</text><text x="910" y="715" font-size="17" fill="#607286" font-weight="600" text-anchor="start" >Driving lead after action</text><text x="1190" y="715" font-size="21" fill="#2D7A78" font-weight="700" text-anchor="start" >12 − 7 = 5</text><rect x="120" y="785" width="1360" height="83" rx="14" fill="#FFF8E5" stroke="#C9A227" stroke-width="2" /><text x="155" y="820" font-size="18" fill="#0B1F3A" font-weight="700" text-anchor="start" >Decision cue</text><text x="300" y="820" font-size="16" fill="#20314B" font-weight="400" text-anchor="start" >The initial lead is only 2. Scores are judgements, so explain the forces and revisit them as conditions change.</text>
<line x1="60" y1="955" x2="1540" y2="955" stroke="#CCD6D7" stroke-width="2"/>
