<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">Decision trees: compare net gain and risk</title><desc id="desc">Project A has expected value 340000 and net gain 190000 after its 150000 cost. Project B guarantees net gain 170000. The tree contrasts expected return and risk.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial,sans-serif" fill="#20314B"><text x="62" y="78" font-size="40" font-weight="700" fill="#0B1F3A">Decision trees: compare net gain and risk</text><text x="64" y="124" font-size="22">Marlbridge teaching diagram • examples are schematic</text><rect x="60" y="165" width="1480" height="755" rx="18" fill="white" stroke="#CCD6D7" stroke-width="2"/><text x="100" y="225" font-size="21" font-weight="400" fill="#20314B" text-anchor="start">Square = business choice • circle = uncertain outcome • probabilities at each chance node sum to 1.</text><rect x="112" y="338" width="26" height="26" fill="#0B1F3A"/><text x="155" y="350" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="start">Choose project</text><text x="155" y="380" font-size="16" font-weight="400" fill="#596B7E" text-anchor="start">Decision node</text><path d="M325 350 L440 350" stroke="#397DA4" stroke-width="3" fill="none"/><path d="M440 350 L440 460" stroke="#397DA4" stroke-width="3" fill="none"/><path d="M440 350 L440 700" stroke="#397DA4" stroke-width="3" fill="none"/><text x="385" y="330" font-size="18" font-weight="700" fill="#0B1F3A" text-anchor="start">A</text><text x="385" y="690" font-size="18" font-weight="700" fill="#0B1F3A" text-anchor="start">B</text><circle cx="610" cy="455" r="36" fill="#FFF4D6" stroke="#C9A227" stroke-width="3"/><text x="610" y="462" font-size="18" font-weight="700" fill="#0B1F3A" text-anchor="middle">A</text><path d="M646 440 L790 380" stroke="#397DA4" stroke-width="3" fill="none"/><path d="M646 470 L790 530" stroke="#397DA4" stroke-width="3" fill="none"/><text x="680" y="415" font-size="18" font-weight="700" fill="#A58214" text-anchor="start">0.6</text><text x="680" y="500" font-size="18" font-weight="700" fill="#A58214" text-anchor="start">0.4</text><path d="M790 380 L850 380" stroke="#397DA4" stroke-width="3" fill="none"/><path d="M790 530 L850 530" stroke="#397DA4" stroke-width="3" fill="none"/><text x="875" y="370" font-size="20" font-weight="700" fill="#20314B" text-anchor="start">$500,000 return</text><text x="875" y="405" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">$350,000 net after $150k cost</text><text x="875" y="520" font-size="20" font-weight="700" fill="#20314B" text-anchor="start">$100,000 return</text><text x="875" y="555" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">−$50,000 net after cost</text><rect x="1130" y="330" width="290" height="255" rx="14" fill="#E7EFED" stroke="#2D7A78" stroke-width="2"/><text x="1160" y="380" font-size="21" font-weight="700" fill="#0B1F3A" text-anchor="start">Project A</text><text x="1160" y="430" font-size="20" font-weight="700" fill="#20314B" text-anchor="start">EV = $340,000</text><text x="1160" y="470" font-size="18" font-weight="700" fill="#20314B" text-anchor="start">Net gain = $190,000</text><text x="1160" y="530" font-size="15" font-weight="400" fill="#20314B" text-anchor="start">0.6×500k + 0.4×100k</text><path d="M450 700 L850 700" stroke="#397DA4" stroke-width="3" fill="none"/><text x="875" y="692" font-size="20" font-weight="700" fill="#20314B" text-anchor="start">Certain return: $220,000</text><text x="875" y="728" font-size="17" font-weight="400" fill="#20314B" text-anchor="start">Less $50,000 cost</text><rect x="1130" y="630" width="290" height="145" rx="14" fill="#FFF4D6" stroke="#C9A227" stroke-width="2"/><text x="1160" y="680" font-size="21" font-weight="700" fill="#0B1F3A" text-anchor="start">Project B</text><text x="1160" y="720" font-size="18" font-weight="700" fill="#20314B" text-anchor="start">Net gain = $170,000</text><rect x="110" y="810" width="1310" height="60" rx="14" fill="#F3F6F6" stroke="#CCD6D7" stroke-width="2"/><text x="135" y="848" font-size="17" font-weight="700" fill="#0B1F3A" text-anchor="start">A has $20,000 higher expected net gain; B guarantees its gain. Choose using risk appetite and the business’s cash position.</text><path d="M60 972H1540" stroke="#CCD6D7" stroke-width="2"/><text x="64" y="1015" font-size="17">Marlbridge • study diagram • check assumptions and context</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>
