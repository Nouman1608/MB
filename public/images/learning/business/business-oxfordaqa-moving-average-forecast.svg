<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img"><title>Three-period moving average: smooth and extend the trend</title><desc>A plot and worked calculation use the lesson sales data, middle-month alignment, average trend change and September/October forecasts.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#397DA4"/></marker><marker id="redarr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C64545"/></marker></defs><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial,sans-serif" fill="#20314B"><text x="62" y="78" font-size="38" font-weight="700" fill="#0B1F3A" text-anchor="start">Three-period moving average: smooth and extend the trend</text><text x="64" y="124" font-size="22" font-weight="400" fill="#20314B" text-anchor="start">Marlbridge teaching diagram • schematic concept illustration</text><rect x="60" y="165" width="1480" height="755" rx="18" fill="white" stroke="#CCD6D7" stroke-width="2"/><text x="100" y="225" font-size="19" font-weight="400" fill="#20314B" text-anchor="start">A three-period average is placed at the middle month; the smoothed series reveals trend.</text><rect x="95" y="270" width="965" height="510" rx="12" fill="#FBFCFC" stroke="#CCD6D7" stroke-width="2"/><text x="130" y="310" font-size="15" font-weight="700" fill="#0B1F3A" text-anchor="start">CORVASSE SCOOTERS • UNITS SOLD / 3-PERIOD MOVING AVERAGE</text><path d="M170 700H1010 M170 700V360" stroke="#20314B" stroke-width="2" fill="none"/><text x="145" y="375" font-size="14" font-weight="700" fill="#20314B" text-anchor="start">Units</text><text x="590" y="760" font-size="14" font-weight="700" fill="#20314B" text-anchor="middle">Placed month</text><path d="M210 645 L310 625 L410 605 L510 585 L610 565 L710 545" fill="none" stroke="#2D7A78" stroke-width="5"/><circle cx="210" cy="645" r="7" fill="#2D7A78"/><text x="210" y="631" font-size="13" font-weight="700" fill="#2D7A78" text-anchor="middle">429</text><text x="210" y="725" font-size="13" font-weight="400" fill="#20314B" text-anchor="middle">Feb</text><circle cx="310" cy="625" r="7" fill="#2D7A78"/><text x="310" y="611" font-size="13" font-weight="700" fill="#2D7A78" text-anchor="middle">449</text><text x="310" y="725" font-size="13" font-weight="400" fill="#20314B" text-anchor="middle">Mar</text><circle cx="410" cy="605" r="7" fill="#2D7A78"/><text x="410" y="591" font-size="13" font-weight="700" fill="#2D7A78" text-anchor="middle">463</text><text x="410" y="725" font-size="13" font-weight="400" fill="#20314B" text-anchor="middle">Apr</text><circle cx="510" cy="585" r="7" fill="#2D7A78"/><text x="510" y="571" font-size="13" font-weight="700" fill="#2D7A78" text-anchor="middle">475</text><text x="510" y="725" font-size="13" font-weight="400" fill="#20314B" text-anchor="middle">May</text><circle cx="610" cy="565" r="7" fill="#2D7A78"/><text x="610" y="551" font-size="13" font-weight="700" fill="#2D7A78" text-anchor="middle">489</text><text x="610" y="725" font-size="13" font-weight="400" fill="#20314B" text-anchor="middle">Jun</text><circle cx="710" cy="545" r="7" fill="#2D7A78"/><text x="710" y="531" font-size="13" font-weight="700" fill="#2D7A78" text-anchor="middle">502</text><text x="710" y="725" font-size="13" font-weight="400" fill="#20314B" text-anchor="middle">Jul</text><path d="M710 545 L910 485 L1010 455" fill="none" stroke="#C9A227" stroke-width="4" stroke-dasharray="10,8"/><rect x="903" y="478" width="14" height="14" fill="#C9A227"/><rect x="1003" y="448" width="14" height="14" fill="#C9A227"/><text x="910" y="465" font-size="14" font-weight="700" fill="#A58214" text-anchor="middle">531</text><text x="1010" y="435" font-size="14" font-weight="700" fill="#A58214" text-anchor="middle">546</text><text x="910" y="725" font-size="13" font-weight="700" fill="#A58214" text-anchor="middle">Sep*</text><text x="1010" y="725" font-size="13" font-weight="700" fill="#A58214" text-anchor="middle">Oct*</text><text x="810" y="390" font-size="13" font-weight="700" fill="#A58214" text-anchor="start">Forecast</text><text x="810" y="415" font-size="12" font-weight="400" fill="#20314B" text-anchor="start">*from Jul trend</text><rect x="1090" y="280" width="405" height="510" rx="12" fill="#E7EFED" stroke="#2D7A78" stroke-width="2"/><text x="1120" y="325" font-size="17" font-weight="700" fill="#2D7A78" text-anchor="start">FIRST WINDOW</text><text x="1120" y="370" font-size="15" font-weight="400" fill="#20314B" text-anchor="start">Jan 410 + Feb 446 + Mar 431</text><text x="1120" y="405" font-size="17" font-weight="700" fill="#0B1F3A" text-anchor="start">= 1,287 ÷ 3 = 429</text><text x="1120" y="440" font-size="15" font-weight="400" fill="#20314B" text-anchor="start">Place against February (middle).</text><path d="M1120 465H1460" stroke="#CCD6D7" stroke-width="2"/><text x="1120" y="510" font-size="15" font-weight="700" fill="#20314B" text-anchor="start">Six averages: Feb 429 → Jul 502</text><text x="1120" y="550" font-size="15" font-weight="400" fill="#20314B" text-anchor="start">Average trend change =</text><text x="1120" y="580" font-size="15" font-weight="700" fill="#2D7A78" text-anchor="start">(502 − 429) ÷ 5 = 14.6 / month</text><text x="1120" y="635" font-size="14" font-weight="700" fill="#20314B" text-anchor="start">Sep = 502 + (2 × 14.6) ≈ 531</text><text x="1120" y="670" font-size="14" font-weight="700" fill="#20314B" text-anchor="start">Oct = 502 + (3 × 14.6) ≈ 546</text><text x="1120" y="735" font-size="14" font-weight="700" fill="#0B1F3A" text-anchor="start">Raw sales dip; averages rise.</text><rect x="210" y="825" width="1170" height="48" rx="8" fill="#FFF4D6" stroke="#E0C76C" stroke-width="2"/><text x="795" y="856" font-size="16" font-weight="700" fill="#0B1F3A" text-anchor="middle">Eight observations give six three-month averages; each is aligned to the middle month.</text><path d="M60 972H1540" stroke="#CCD6D7" stroke-width="2"/><text x="64" y="1015" font-size="17" font-weight="400" fill="#20314B" text-anchor="start">Marlbridge • study diagram • check assumptions and context</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>
