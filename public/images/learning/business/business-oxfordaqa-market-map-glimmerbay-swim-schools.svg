00" text-anchor="end" >£6 ÷ 5.2 = £1.15</text><line x1="975" y1="655" x2="1440" y2="655" stroke="#CCD6D7" stroke-width="2"/><text x="975" y="695" font-size="16" fill="#2D7A78" font-weight="700" text-anchor="start" >READ THE MAP</text><text x="975" y="731" font-size="15" fill="#20314B" font-weight="400" text-anchor="start" >No school scores above 8 for under £12. A new entrant</text><text x="975" y="753" font-size="15" fill="#20314B" font-weight="400" text-anchor="start" >could target the highlighted gap—but only if enough</text><text x="975" y="775" font-size="15" fill="#20314B" font-weight="400" text-anchor="start" >parents want it and it can be served profitably.</text><line x1="60" y1="955" x2="1540" y2="955" stroke="#CCD6D7" stroke-width="2"/><text x="64" y="995" font-size="14" fill="#607286" font-weight="400" text-anchor="start" >Marlbridge • Business study resource • Strategic positioning • check context before deciding</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>
