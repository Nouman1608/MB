<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">Break-even: contribution and margin of safety</title><desc id="desc">Revenue and total cost lines cross at 4000 units for the worked example. Fixed costs are 40000 dollars, contribution is 10 dollars per unit, and margin of safety at 5000 units is 1000 units.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial,sans-serif" fill="#20314B"><text x="62" y="78" font-size="40" font-weight="700" fill="#0B1F3A">Break-even: contribution and margin of safety</text><text x="64" y="124" font-size="22">Marlbridge teaching diagram • examples are schematic</text><rect x="60" y="165" width="1480" height="755" rx="18" fill="white" stroke="#CCD6D7" stroke-width="2"/><text x="100" y="225" font-size="21" font-weight="400" fill="#20314B" text-anchor="start">Example: selling price $25 per unit • variable cost $15 • fixed costs $40,000</text><text x="100" y="270" font-size="21" font-weight="700" fill="#2D7A78" text-anchor="start">Contribution = $10 per unit  →  break-even output = $40,000 ÷ $10 = 4,000 units</text><path d="M190 760 L960 760" stroke="#20314B" stroke-width="4" fill="none"/><path d="M190 760 L190 335" stroke="#20314B" stroke-width="4" fill="none"/><text x="575" y="805" font-size="18" font-weight="400" fill="#20314B" text-anchor="middle">Monthly output (units)</text><text x="105" y="520" font-size="18" font-weight="400" fill="#20314B" text-anchor="middle">Revenue / cost ($)</text><path d="M190 760 L190 768" stroke="#20314B" stroke-width="2" fill="none"/><text x="190" y="790" font-size="15" font-weight="400" fill="#20314B" text-anchor="middle">0</text><path d="M447 760 L447 768" stroke="#20314B" stroke-width="2" fill="none"/><text x="447" y="790" font-size="15" font-weight="400" fill="#20314B" text-anchor="middle">2,000</text><path d="M704 760 L704 768" stroke="#20314B" stroke-width="2" fill="none"/><text x="704" y="790" font-size="15" font-weight="400" fill="#20314B" text-anchor="middle">4,000</text><path d="M832 760 L832 768" stroke="#20314B" stroke-width="2" fill="none"/><text x="832" y="790" font-size="15" font-weight="400" fill="#20314B" text-anchor="middle">5,000</text><path d="M960 760 L960 768" stroke="#20314B" stroke-width="2" fill="none"/><text x="960" y="790" font-size="15" font-weight="400" fill="#20314B" text-anchor="middle">6,000</text><path d="M182 760 L190 760" stroke="#20314B" stroke-width="2" fill="none"/><text x="170" y="765" font-size="15" font-weight="400" fill="#20314B" text-anchor="end">$0</text><path d="M182 623 L190 623" stroke="#20314B" stroke-width="2" fill="none"/><text x="170" y="628" font-size="15" font-weight="400" fill="#20314B" text-anchor="end">$50k</text><path d="M182 487 L190 487" stroke="#20314B" stroke-width="2" fill="none"/><text x="170" y="492" font-size="15" font-weight="400" fill="#20314B" text-anchor="end">$100k</text><path d="M182 350 L190 350" stroke="#20314B" stroke-width="2" fill="none"/><text x="170" y="355" font-size="15" font-weight="400" fill="#20314B" text-anchor="end">$150k</text><path d="M190 760 L960 350" stroke="#397DA4" stroke-width="5" fill="none"/><path d="M190 650 L960 405" stroke="#C9A227" stroke-width="5" fill="none"/><text x="845" y="390" font-size="18" font-weight="700" fill="#397DA4" text-anchor="start">Total revenue</text><text x="835" y="445" font-size="18" font-weight="700" fill="#A58214" text-anchor="start">Total cost</text><path d="M704 487 L704 760" stroke="#C64545" stroke-width="2" fill="none"/><path d="M190 487 L704 487" stroke="#C64545" stroke-width="2" fill="none"/><text x="714" y="480" font-size="16" font-weight="700" fill="#C64545" text-anchor="start">Break-even: $100k</text><path d="M832 420 L832 760" stroke="#2D7A78" stroke-width="2" fill="none"/><text x="842" y="585" font-size="16" font-weight="700" fill="#2D7A78" text-anchor="start">5,000 units</text><rect x="1020" y="330" width="420" height="470" rx="14" fill="#E7EFED" stroke="#2D7A78" stroke-width="2"/><text x="1055" y="385" font-size="24" font-weight="700" fill="#0B1F3A" text-anchor="start">At 5,000 units</text><text x="1055" y="450" font-size="20" font-weight="700" fill="#2D7A78" text-anchor="start">Margin of safety</text><text x="1055" y="490" font-size="19" font-weight="400" fill="#20314B" text-anchor="start">5,000 − 4,000 = 1,000 units</text><text x="1055" y="555" font-size="20" font-weight="700" fill="#2D7A78" text-anchor="start">Contribution per unit</text><text x="1055" y="595" font-size="19" font-weight="400" fill="#20314B" text-anchor="start">$25 − $15 = $10</text><text x="1055" y="660" font-size="17" font-weight="400" fill="#20314B" text-anchor="start">At break-even: total revenue</text><text x="1055" y="695" font-size="17" font-weight="400" fill="#20314B" text-anchor="start">equals total cost; profit is $0.</text><path d="M60 972H1540" stroke="#CCD6D7" stroke-width="2"/><text x="64" y="1015" font-size="17">Marlbridge • study diagram • check assumptions and context</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>
