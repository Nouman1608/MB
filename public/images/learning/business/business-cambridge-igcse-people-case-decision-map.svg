<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
<title id="title">People in business: turn case facts into a justified people decision</title><desc id="desc">An exam approach map links roles and delegation to motivation, recruitment, training, leadership, workforce change and communication; a five-step route turns the case facts into a justified recommendation.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#397DA4"/></marker><marker id="navyArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#0B1F3A"/></marker></defs>
<rect width="1600" height="1050" fill="#F3F6F6"/>
<g font-family="Arial, sans-serif"><text x="62" y="78" font-size="38" fill="#0B1F3A" font-weight="700" text-anchor="start" >People in business: turn case facts into a justified people decision</text><text x="64" y="124" font-size="21" fill="#20314B" font-weight="400" text-anchor="start" >Cambridge IGCSE Business Studies 0450 • Topic 2</text>
<rect x="60" y="165" width="1480" height="755" rx="18" fill="#FFFFFF" stroke="#CCD6D7" stroke-width="2" /><text x="95" y="211" font-size="15" fill="#20314B" font-weight="600" text-anchor="start" >An exam approach map links roles and delegation to motivation, recruitment, training, leadership, workforce change and communication; a five-step route</text><text x="95" y="233" font-size="15" fill="#20314B" font-weight="600" text-anchor="start" >turns the case facts into a justified recommendation.</text><text x="800" y="270" font-size="24" fill="#0B1F3A" font-weight="700" text-anchor="middle" >Build the answer from the people and circumstances in the case</text><rect x="135" y="315" width="390" height="405" rx="18" fill="#FBFCFC" stroke="#CCD6D7" stroke-width="2" /><text x="330" y="355" font-size="19" fill="#2D7A78" font-weight="700" text-anchor="middle" >ORGANISATION &amp; MANAGEMENT</text><rect x="190" y="377" width="280" height="56" rx="12" fill="#EDF3F7" stroke="#397DA4" stroke-width="2" /><text x="330" y="402" font-size="18" fill="#0B1F3A" font-weight="700" text-anchor="middle" >Director</text><text x="330" y="425" font-size="13" fill="#20314B" font-weight="400" text-anchor="middle" >sets direction and objectives</text><rect x="190" y="462" width="280" height="56" rx="12" fill="#EDF3F7" stroke="#397DA4" stroke-width="2" /><text x="330" y="487" font-size="18" fill="#0B1F3A" font-weight="700" text-anchor="middle" >Manager</text><text x="330" y="510" font-size="13" fill="#20314B" font-weight="400" text-anchor="middle" >plans and coordinates</text><rect x="190" y="547" width="280" height="56" rx="12" fill="#EDF3F7" stroke="#397DA4" stroke-width="2" /><text x="330" y="572" font-size="18" fill="#0B1F3A" font-weight="700" text-anchor="middle" >Supervisor</text><text x="330" y="595" font-size="13" fill="#20314B" font-weight="400" text-anchor="middle" >guides day-to-day work</text><rect x="190" y="632" width="280" height="56" rx="12" fill="#EDF3F7" stroke="#397DA4" stroke-width="2" /><text x="330" y="657" font-size="18" fill="#0B1F3A" font-weight="700" text-anchor="middle" >Employees</text><text x="330" y="680" font-size="13" fill="#20314B" font-weight="400" text-anchor="middle" >carry out tasks and share feedback</text><line x1="330" y1="433" x2="330" y2="461" stroke="#397DA4" stroke-width="3" marker-end="url(#arrow)"/><line x1="330" y1="518" x2="330" y2="546" stroke="#397DA4" stroke-width="3" marker-end="url(#arrow)"/><line x1="330" y1="603" x2="330" y2="631" stroke="#397DA4" stroke-width="3" marker-end="url(#arrow)"/><text x="330" y="696" font-size="13" fill="#607286" font-weight="400" text-anchor="middle" >Delegation passes authority down;</text><text x="330" y="713" font-size="13" fill="#607286" font-weight="400" text-anchor="middle" >the manager remains accountable.</text><rect x="575" y="315" width="440" height="405" rx="18" fill="#FBFCFC" stroke="#CCD6D7" stroke-width="2" /><text x="795" y="355" font-size="19" fill="#397DA4" font-weight="700" text-anchor="middle" >MATCH THE PEOPLE DECISION</text><rect x="600" y="385" width="390" height="78" rx="14" fill="#EAF4F0" stroke="#2D7A78" stroke-width="2" /><text x="624" y="414" font-size="19" fill="#2D7A78" font-weight="700" text-anchor="start" >MOTIVATION</text><text x="624" y="446" font-size="16" fill="#20314B" font-weight="400" text-anchor="start" >financial reward  •  non-financial method</text><rect x="600" y="477" width="390" height="78" rx="14" fill="#EDF3F7" stroke="#397DA4" stroke-width="2" /><text x="624" y="506" font-size="19" fill="#397DA4" font-weight="700" text-anchor="start" >RECRUITMENT &amp; TRAINING</text><text x="624" y="538" font-size="15" fill="#20314B" font-weight="400" text-anchor="start" >internal or external  •  job and training fit</text><rect x="600" y="569" width="390" height="78" rx="14" fill="#FFF8E5" stroke="#C9A227" stroke-width="2" /><text x="624" y="598" font-size="19" fill="#C9A227" font-weight="700" text-anchor="start" >LEADERSHIP &amp; ORGANISATION</text><text x="624" y="630" font-size="15" fill="#20314B" font-weight="400" text-anchor="start" >style, span of control, communication method</text><rect x="600" y="655" width="390" height="54" rx="12" fill="#FBE8E7" stroke="#C64545" stroke-width="2" /><text x="795" y="678" font-size="15" fill="#C64545" font-weight="700" text-anchor="middle" >WORKFORCE CHANGE</text><text x="795" y="698" font-size="13" fill="#20314B" font-weight="400" text-anchor="middle" >distinguish dismissal from redundancy</text><rect x="1065" y="315" width="390" height="405" rx="18" fill="#FBFCFC" stroke="#CCD6D7" stroke-width="2" /><text x="1260" y="355" font-size="19" fill="#C9A227" font-weight="700" text-anchor="middle" >RECOMMEND • JUSTIFY</text><circle cx="1110" cy="410" r="18" fill="#FFF8E5" stroke="#C9A227" stroke-width="2"/><text x="1110" y="416" font-size="15" fill="#0B1F3A" font-weight="700" text-anchor="middle" >1</text><text x="1145" y="416" font-size="16" fill="#20314B" font-weight="600" text-anchor="start" >Name the business need</text><line x1="1110" y1="429" x2="1110" y2="445" stroke="#C9A227" stroke-width="2" marker-end="url(#arrow)"/><circle cx="1110" cy="465" r="18" fill="#FFF8E5" stroke="#C9A227" stroke-width="2"/><text x="1110" y="471" font-size="15" fill="#0B1F3A" font-weight="700" text-anchor="middle" >2</text><text x="1145" y="471" font-size="16" fill="#20314B" font-weight="600" text-anchor="start" >Select a suitable option</text><line x1="1110" y1="484" x2="1110" y2="500" stroke="#C9A227" stroke-width="2" marker-end="url(#arrow)"/><circle cx="1110" cy="520" r="18" fill="#FFF8E5" stroke="#C9A227" stroke-width="2"/><text x="1110" y="526" font-size="15" fill="#0B1F3A" font-weight="700" text-anchor="middle" >3</text><text x="1145" y="526" font-size="16" fill="#20314B" font-weight="600" text-anchor="start" >Use case details: size, skills, budget</text><line x1="1110" y1="539" x2="1110" y2="555" stroke="#C9A227" stroke-width="2" marker-end="url(#arrow)"/><circle cx="1110" cy="575" r="18" fill="#FFF8E5" stroke="#C9A227" stroke-width="2"/><text x="1110" y="581" font-size="15" fill="#0B1F3A" font-weight="700" text-anchor="middle" >4</text><text x="1145" y="581" font-size="16" fill="#20314B" font-weight="600" text-anchor="start" >Balance one benefit and one limit</text><line x1="1110" y1="594" x2="1110" y2="610" stroke="#C9A227" stroke-width="2" marker-end="url(#arrow)"/><circle cx="1110" cy="630" r="18" fill="#FFF8E5" stroke="#C9A227" stroke-width="2"/><text x="1110" y="636" font-size="15" fill="#0B1F3A" font-weight="700" text-anchor="middle" >5</text><text x="1145" y="636" font-size="16" fill="#20314B" font-weight="600" text-anchor="start" >State the likely business effect</text><rect x="135" y="755" width="1320" height="115" rx="14" fill="#FFF8E5" stroke="#C9A227" stroke-width="2" /><text x="170" y="795" font-size="19" fill="#0B1F3A" font-weight="700" text-anchor="start" >Quick case check</text><text x="170" y="833" font-size="18" fill="#20314B" font-weight="400" text-anchor="start" >Who is affected? What does this workforce need? Which choice fits this business, and what trade-off follows?</text>
<line x1="60" y1="955" x2="1540" y2="955" stroke="#CCD6D7" stroke-width="2"/>
