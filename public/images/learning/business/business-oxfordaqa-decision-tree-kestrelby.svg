<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
<title id="title">Decision tree: compare Kestrelby’s two growth options</title><desc id="desc">A decision tree shows Kestrelby's subscription and tasting-counter choices, source probabilities and payoffs, expected values, option costs, net gains, and the recommendation's sensitivity to a cost change.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#397DA4"/></marker><marker id="navyArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#0B1F3A"/></marker></defs>
<rect width="1600" height="1050" fill="#F3F6F6"/>
<g font-family="Arial, sans-serif"><text x="62" y="78" font-size="38" fill="#0B1F3A" font-weight="700" text-anchor="start" >Decision tree: compare Kestrelby’s two growth options</text><text x="64" y="124" font-size="21" fill="#20314B" font-weight="400" text-anchor="start" >OxfordAQA International A-level Business 9725 • strategic investment</text>
<rect x="60" y="165" width="1480" height="755" rx="18" fill="#FFFFFF" stroke="#CCD6D7" stroke-width="2" /><text x="95" y="211" font-size="15" fill="#20314B" font-weight="600" text-anchor="start" >A decision tree shows Kestrelby's subscription and tasting-counter choices, source probabilities and payoffs, expected values, option costs, net gains, and</text><text x="95" y="233" font-size="15" fill="#20314B" font-weight="600" text-anchor="start" >the recommendation's sensitivity to a cost change.</text><text x="800" y="270" font-size="22" fill="#0B1F3A" font-weight="700" text-anchor="middle" >Work from the outcomes back to the decision square</text><rect x="105" y="492" width="84" height="84" rx="5" fill="#FFF8E5" stroke="#C9A227" stroke-width="4" /><text x="147" y="527" font-size="14" fill="#0B1F3A" font-weight="700" text-anchor="middle" >CHOICE</text><text x="147" y="550" font-size="13" fill="#607286" font-weight="400" text-anchor="middle" >square</text><path d="M189 515 C250 480 278 380 345 380" stroke="#397DA4" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="240" y="445" font-size="15" fill="#397DA4" font-weight="700" text-anchor="middle" >A • subscription</text><path d="M189 535 C260 535 278 575 345 575" stroke="#397DA4" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="250" y="535" font-size="15" fill="#397DA4" font-weight="700" text-anchor="middle" >B • tasting counter</text><path d="M189 555 C250 615 278 780 345 780" stroke="#397DA4" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="240" y="690" font-size="15" fill="#397DA4" font-weight="700" text-anchor="middle" >Do nothing</text><circle cx="380" cy="380" r="36" fill="#EDF3F7" stroke="#397DA4" stroke-width="4"/><text x="380" y="387" font-size="18" fill="#0B1F3A" font-weight="700" text-anchor="middle" >A</text><circle cx="380" cy="575" r="36" fill="#EDF3F7" stroke="#397DA4" stroke-width="4"/><text x="380" y="582" font-size="18" fill="#0B1F3A" font-weight="700" text-anchor="middle" >B</text><path d="M416 365 C500 330 540 310 630 310" stroke="#2D7A78" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="525" y="320" font-size="15" fill="#2D7A78" font-weight="700" text-anchor="middle" >0.65 success</text><path d="M416 395 C500 435 540 455 630 455" stroke="#C64545" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="525" y="437" font-size="15" fill="#C64545" font-weight="700" text-anchor="middle" >0.35 poor</text><path d="M416 560 C505 525 540 525 630 525" stroke="#2D7A78" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="525" y="518" font-size="15" fill="#2D7A78" font-weight="700" text-anchor="middle" >0.55 strong footfall</text><path d="M416 590 C505 635 540 670 630 670" stroke="#C64545" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="525" y="650" font-size="15" fill="#C64545" font-weight="700" text-anchor="middle" >0.45 weak footfall</text><rect x="635" y="278" width="165" height="62" rx="10" fill="#FFFFFF" stroke="#2D7A78" stroke-width="2" /><text x="717" y="317" font-size="19" fill="#0B1F3A" font-weight="700" text-anchor="middle" >£130,000</text><rect x="635" y="430" width="165" height="62" rx="10" fill="#FFFFFF" stroke="#C64545" stroke-width="2" /><text x="717" y="469" font-size="19" fill="#0B1F3A" font-weight="700" text-anchor="middle" >£20,000</text><rect x="635" y="492" width="165" height="62" rx="10" fill="#FFFFFF" stroke="#2D7A78" stroke-width="2" /><text x="717" y="531" font-size="19" fill="#0B1F3A" font-weight="700" text-anchor="middle" >£180,000</text><rect x="635" y="646" width="165" height="62" rx="10" fill="#FFFFFF" stroke="#C64545" stroke-width="2" /><text x="717" y="685" font-size="19" fill="#0B1F3A" font-weight="700" text-anchor="middle" >£50,000</text><rect x="850" y="300" width="270" height="220" rx="14" fill="#FBFCFC" stroke="#397DA4" stroke-width="2" /><text x="985" y="340" font-size="18" fill="#397DA4" font-weight="700" text-anchor="middle" >OPTION A</text><text x="875" y="383" font-size="19" fill="#0B1F3A" font-weight="700" text-anchor="start" >EV = £91,500</text><text x="875" y="423" font-size="17" fill="#20314B" font-weight="400" text-anchor="start" >Cost = £45,000</text><text x="875" y="468" font-size="19" fill="#2D7A78" font-weight="700" text-anchor="start" >Net gain = £46,500</text><rect x="850" y="550" width="270" height="220" rx="14" fill="#FBFCFC" stroke="#397DA4" stroke-width="2" /><text x="985" y="590" font-size="18" fill="#397DA4" font-weight="700" text-anchor="middle" >OPTION B</text><text x="875" y="633" font-size="19" fill="#0B1F3A" font-weight="700" text-anchor="start" >EV = £121,500</text><text x="875" y="673" font-size="17" fill="#20314B" font-weight="400" text-anchor="start" >Cost = £70,000</text><text x="875" y="718" font-size="19" fill="#2D7A78" font-weight="700" text-anchor="start" >Net gain = £51,500</text><rect x="1190" y="385" width="280" height="230" rx="16" fill="#EAF4F0" stroke="#2D7A78" stroke-width="2" /><text x="1330" y="430" font-size="20" fill="#2D7A78" font-weight="700" text-anchor="middle" >RECOMMEND B</text><text x="1220" y="475" font-size="17" fill="#0B1F3A" font-weight="700" text-anchor="start" >£5,000 higher net gain</text><text x="1220" y="520" font-size="16" fill="#20314B" font-weight="400" text-anchor="start" >but the margin is narrow</text><text x="1220" y="563" font-size="16" fill="#C64545" font-weight="700" text-anchor="start" >Worst case: −£20,000</text><rect x="1190" y="690" width="280" height="90" rx="14" fill="#FFF8E5" stroke="#C9A227" stroke-width="2" /><text x="1330" y="725" font-size="16" fill="#0B1F3A" font-weight="700" text-anchor="middle" >If B costs £80,000</text><text x="1330" y="755" font-size="14" fill="#20314B" font-weight="600" text-anchor="middle" >A becomes better: £46.5k &gt; £41.5k</text><text x="110" y="835" font-size="16" fill="#607286" font-weight="400" text-anchor="start" >Chance-node probabilities add to 1. Expected values are weighted averages; an outcome will not equal the average.</text>
