<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img"><title>IB Business Management: five units and the shared toolkit</title><desc>Syllabus map lists the five units with lesson-stated SL/HL hours and separates the toolkit and pre-released statement preparation.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#397DA4"/></marker></defs><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial,sans-serif" fill="#20314B"><text x="62" y="78" font-size="40" font-weight="700" fill="#0B1F3A" text-anchor="start">IB Business Management: five units and the shared toolkit</text><text x="64" y="124" font-size="22" font-weight="400" fill="#20314B" text-anchor="start">Marlbridge teaching diagram • schematic concept illustration</text><rect x="60" y="165" width="1480" height="755" rx="18" fill="white" stroke="#CCD6D7" stroke-width="2"/><text x="100" y="225" font-size="20" font-weight="400" fill="#20314B" text-anchor="start">Five content units connect to a shared analytical toolkit and Paper 1 research preparation.</text><rect x="100" y="275" width="450" height="165" rx="12" fill="#E7EFED" stroke="#2D7A78" stroke-width="2"/><text x="122" y="313" font-size="17" font-weight="700" fill="#2D7A78" text-anchor="start">UNIT 1</text><text x="122" y="348" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="start">Introduction to business management</text><text x="122" y="384" font-size="18" font-weight="700" fill="#A58214" text-anchor="start">20 SL · 20 HL</text><text x="122" y="417" font-size="15" font-weight="400" fill="#20314B" text-anchor="start">business, entities, objectives, stakeholders</text><rect x="590" y="275" width="450" height="165" rx="12" fill="#FBFCFC" stroke="#CCD6D7" stroke-width="2"/><text x="612" y="313" font-size="17" font-weight="700" fill="#2D7A78" text-anchor="start">UNIT 2</text><text x="612" y="348" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="start">Human resource management</text><text x="612" y="384" font-size="18" font-weight="700" fill="#A58214" text-anchor="start">20 SL · 35 HL</text><text x="612" y="417" font-size="15" font-weight="400" fill="#20314B" text-anchor="start">HR, structure, leadership, motivation</text><rect x="100" y="460" width="450" height="165" rx="12" fill="#E7EFED" stroke="#2D7A78" stroke-width="2"/><text x="122" y="498" font-size="17" font-weight="700" fill="#2D7A78" text-anchor="start">UNIT 3</text><text x="122" y="533" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="start">Finance and accounts</text><text x="122" y="569" font-size="18" font-weight="700" fill="#A58214" text-anchor="start">30 SL · 45 HL</text><text x="122" y="602" font-size="15" font-weight="400" fill="#20314B" text-anchor="start">accounts, ratios, cash flow, appraisal</text><rect x="590" y="460" width="450" height="165" rx="12" fill="#FBFCFC" stroke="#CCD6D7" stroke-width="2"/><text x="612" y="498" font-size="17" font-weight="700" fill="#2D7A78" text-anchor="start">UNIT 4</text><text x="612" y="533" font-size="20" font-weight="700" fill="#0B1F3A" text-anchor="start">Marketing</text><text x="612" y="569" font-size="18" font-weight="700" fill="#A58214" text-anchor="start">30 SL · 35 HL</text><text x="612" y="602" font-size="15" font-weight="400" fill="#20314B" text-anchor="start">research, mix, forecasting (HL), international</text><rect x="100" y="645" width="940" height="120" rx="12" fill="#E7EFED" stroke="#2D7A78" stroke-width="2"/><text x="122" y="680" font-size="16" font-weight="700" fill="#2D7A78" text-anchor="start">UNIT 5</text><text x="240" y="680" font-size="18" font-weight="700" fill="#0B1F3A" text-anchor="start">Operations management</text><text x="122" y="715" font-size="16" font-weight="700" fill="#A58214" text-anchor="start">15 SL · 45 HL</text><text x="330" y="715" font-size="15" font-weight="400" fill="#20314B" text-anchor="start">processes, quality, break-even, planning</text><rect x="1080" y="275" width="410" height="490" rx="12" fill="#FFF8E5" stroke="#C9A227" stroke-width="2"/><text x="1105" y="315" font-size="16" font-weight="700" fill="#A58214" text-anchor="start">TOOLKIT + PRE-RELEASED</text><text x="1105" y="355" font-size="18" font-weight="700" fill="#20314B" text-anchor="start">SL: 15 hours total</text><text x="1105" y="386" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">10 toolkit + 5 research</text><text x="1105" y="445" font-size="18" font-weight="700" fill="#20314B" text-anchor="start">HL: 40 hours total</text><text x="1105" y="476" font-size="16" font-weight="400" fill="#20314B" text-anchor="start">35 toolkit + 5 research</text><text x="1105" y="548" font-size="15" font-weight="400" fill="#20314B" text-anchor="start">Tools (e.g., SWOT, STEEPLE)</text><text x="1105" y="578" font-size="15" font-weight="400" fill="#20314B" text-anchor="start">apply across the units.</text><text x="1105" y="640" font-size="16" font-weight="700" fill="#C64545" text-anchor="start">Not a sixth content unit</text><rect x="150" y="800" width="1300" height="63" rx="10" fill="#EDF3F7" stroke="#397DA4" stroke-width="2"/><text x="800" y="828" font-size="16" font-weight="700" fill="#0B1F3A" text-anchor="middle">SL/HL hours shown per source; toolkit and pre-released-statement preparation run alongside Units 1–5.</text><text x="800" y="851" font-size="15" font-weight="400" fill="#20314B" text-anchor="middle">HL adds deeper or additional content in several units.</text><path d="M60 972H1540" stroke="#CCD6D7" stroke-width="2"/><text x="64" y="1015" font-size="17" font-weight="400" fill="#20314B" text-anchor="start">Marlbridge • study diagram • check assumptions and context</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>
