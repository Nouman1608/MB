<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="ttl desc">
<title id="ttl">Types of strategy: grow, innovate, globalise and sustain</title><desc id="desc">A four-route concept map summarises growth, innovation, globalisation and sustainability strategies, using source examples to show methods and trade-offs.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#397DA4"/></marker></defs>
<rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial,sans-serif"><text x="62" y="78" font-size="38" fill="#0B1F3A" font-weight="700" text-anchor="start" >Types of strategy: grow, innovate, globalise and sustain</text><text x="64" y="124" font-size="21" fill="#20314B" font-weight="400" text-anchor="start" >OxfordAQA International A-level Business 9725 • section 3.4.4</text><rect x="60" y="165" width="1480" height="755" rx="18" fill="#FFFFFF" stroke="#CCD6D7" stroke-width="2"/><text x="92" y="207" font-size="15" fill="#20314B" font-weight="600" text-anchor="start" >A four-route concept map summarises growth, innovation, globalisation and sustainability strategies, using source examples to show methods and trade-</text><text x="92" y="229" font-size="15" fill="#20314B" font-weight="600" text-anchor="start" >offs.</text><text x="800" y="278" font-size="21" fill="#0B1F3A" font-weight="700" text-anchor="middle" >Four strategic routes • match capability to the business objective</text><rect x="95" y="315" width="700" height="255" rx="16" fill="#EDF3F7" stroke="#397DA4" stroke-width="2"/><text x="119" y="355" font-size="20" fill="#397DA4" font-weight="700" text-anchor="start" >1  GROW</text><text x="119" y="397" font-size="16" fill="#20314B" font-weight="400" text-anchor="start" >Organic growth builds with own resources; external growth buys</text><text x="119" y="420" font-size="16" fill="#20314B" font-weight="400" text-anchor="start" >speed, share or skills.</text><line x1="119" y1="460" x2="771" y2="460" stroke="#CCD6D7" stroke-width="2"/><text x="119" y="494" font-size="15" fill="#0B1F3A" font-weight="600" text-anchor="start" >Brisgate unit cost: €0.60 → €0.54 after scale; check utilisation</text><text x="119" y="516" font-size="15" fill="#0B1F3A" font-weight="600" text-anchor="start" >before adding capacity.</text><rect x="805" y="315" width="700" height="255" rx="16" fill="#EAF4F0" stroke="#2D7A78" stroke-width="2"/><text x="829" y="355" font-size="20" fill="#2D7A78" font-weight="700" text-anchor="start" >2  INNOVATE</text><text x="829" y="397" font-size="16" fill="#20314B" font-weight="400" text-anchor="start" >Product innovation creates or improves an offer; process</text><text x="829" y="420" font-size="16" fill="#20314B" font-weight="400" text-anchor="start" >innovation changes how it is made or delivered.</text><line x1="829" y1="460" x2="1481" y2="460" stroke="#CCD6D7" stroke-width="2"/><text x="829" y="494" font-size="15" fill="#0B1F3A" font-weight="600" text-anchor="start" >Methods: Kaizen • R&amp;D • intrapreneurship • benchmarking • cross-</text><text x="829" y="516" font-size="15" fill="#0B1F3A" font-weight="600" text-anchor="start" >functional teams.</text><rect x="95" y="595" width="700" height="255" rx="16" fill="#FFF8E5" stroke="#C9A227" stroke-width="2"/><text x="119" y="635" font-size="20" fill="#C9A227" font-weight="700" text-anchor="start" >3  GLOBALISE</text><text x="119" y="677" font-size="16" fill="#20314B" font-weight="400" text-anchor="start" >Choose markets, adapt products, locate production and select an</text><text x="119" y="700" font-size="16" fill="#20314B" font-weight="400" text-anchor="start" >entry method.</text><line x1="119" y1="740" x2="771" y2="740" stroke="#CCD6D7" stroke-width="2"/><text x="119" y="774" font-size="15" fill="#0B1F3A" font-weight="600" text-anchor="start" >Ombrevale: Country A concentration ratio 82%; Country B 45%.</text><text x="119" y="796" font-size="15" fill="#0B1F3A" font-weight="600" text-anchor="start" >Export, partner or invest.</text><rect x="805" y="595" width="700" height="255" rx="16" fill="#FBE8E7" stroke="#C64545" stroke-width="2"/><text x="829" y="635" font-size="20" fill="#C64545" font-weight="700" text-anchor="start" >4  SUSTAIN</text><text x="829" y="677" font-size="16" fill="#20314B" font-weight="400" text-anchor="start" >People • planet • profit: measure long-term outcomes alongside</text><text x="829" y="700" font-size="16" fill="#20314B" font-weight="400" text-anchor="start" >near-term costs.</text><line x1="829" y1="740" x2="1481" y2="740" stroke="#CCD6D7" stroke-width="2"/><text x="829" y="774" font-size="15" fill="#0B1F3A" font-weight="600" text-anchor="start" >Fallowmere: turnover 15% → 7.5%; operating margin 13% → 12%; ROCE</text><text x="829" y="796" font-size="15" fill="#0B1F3A" font-weight="600" text-anchor="start" >12% → 11.25%.</text><text x="100" y="890" font-size="15" fill="#607286" font-weight="600" text-anchor="start" >Protect inventions with patents, creative work with copyright and brands with trademarks.</text><line x1="60" y1="955" x2="1540" y2="955" stroke="#CCD6D7" stroke-width="2"/><text x="64" y="995" font-size="14" fill="#607286" font-weight="400" text-anchor="start" >Marlbridge • Business study resource • Types of strategies • check context before deciding</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>
