<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="ttl desc">
<title id="ttl">Operations performance: cost, productivity and capacity</title><desc id="desc">A worked operations dashboard compares source figures for Corran Bakehouse, calculates cost, productivity, defects and capacity use, and highlights the cost-flexibility trade-off.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#397DA4"/></marker></defs>
<rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial,sans-serif"><text x="62" y="78" font-size="38" fill="#0B1F3A" font-weight="700" text-anchor="start" >Operations performance: cost, productivity and capacity</text><text x="64" y="124" font-size="21" fill="#20314B" font-weight="400" text-anchor="start" >OxfordAQA International A-level Business 9725 • operations management</text><rect x="60" y="165" width="1480" height="755" rx="18" fill="#FFFFFF" stroke="#CCD6D7" stroke-width="2"/><text x="92" y="207" font-size="15" fill="#20314B" font-weight="600" text-anchor="start" >A worked operations dashboard compares source figures for Corran Bakehouse, calculates cost, productivity, defects and capacity use, and highlights</text><text x="92" y="229" font-size="15" fill="#20314B" font-weight="600" text-anchor="start" >the cost-flexibility trade-off.</text><text x="800" y="278" font-size="23" fill="#0B1F3A" font-weight="700" text-anchor="middle" >Corran Bakehouse • March compared with April</text><rect x="100" y="315" width="675" height="390" rx="16" fill="#EDF3F7" stroke="#397DA4" stroke-width="2"/><text x="128" y="355" font-size="22" fill="#397DA4" font-weight="700" text-anchor="start" >MARCH • 24,000 loaves</text><text x="128" y="395" font-size="16" fill="#607286" font-weight="600" text-anchor="start" >Total cost</text><text x="740" y="395" font-size="19" fill="#0B1F3A" font-weight="700" text-anchor="end" >£28,800</text><text x="128" y="431" font-size="16" fill="#607286" font-weight="600" text-anchor="start" >Unit cost per loaf</text><text x="740" y="431" font-size="19" fill="#0B1F3A" font-weight="700" text-anchor="end" >£1.20</text><text x="128" y="480" font-size="16" fill="#607286" font-weight="600" text-anchor="start" >Capacity utilisation</text><text x="740" y="480" font-size="19" fill="#0B1F3A" font-weight="700" text-anchor="end" >80%</text><rect x="128" y="498" width="610" height="24" rx="10" fill="#E2E9E9" stroke="#D1DADA" stroke-width="1"/><rect x="128" y="498" width="488.0" height="24" rx="10" fill="#397DA4" stroke="#397DA4" stroke-width="1"/><text x="128" y="555" font-size="16" fill="#607286" font-weight="600" text-anchor="start" >Labour productivity</text><text x="740" y="555" font-size="18" fill="#0B1F3A" font-weight="700" text-anchor="end" >2,000 loaves / baker</text><text x="128" y="594" font-size="15" fill="#20314B" font-weight="400" text-anchor="start" >Average bakers: 12</text><text x="128" y="638" font-size="15" fill="#20314B" font-weight="400" text-anchor="start" >March defects: 360 / 24,000 = 1.5%</text><rect x="825" y="315" width="675" height="390" rx="16" fill="#EAF4F0" stroke="#2D7A78" stroke-width="2"/><text x="853" y="355" font-size="22" fill="#2D7A78" font-weight="700" text-anchor="start" >APRIL • 27,000 loaves</text><text x="853" y="395" font-size="16" fill="#607286" font-weight="600" text-anchor="start" >Total cost</text><text x="1465" y="395" font-size="19" fill="#0B1F3A" font-weight="700" text-anchor="end" >£30,150</text><text x="853" y="431" font-size="16" fill="#607286" font-weight="600" text-anchor="start" >Unit cost per loaf</text><text x="1465" y="431" font-size="19" fill="#0B1F3A" font-weight="700" text-anchor="end" >£1.12</text><text x="853" y="480" font-size="16" fill="#607286" font-weight="600" text-anchor="start" >Capacity utilisation</text><text x="1465" y="480" font-size="19" fill="#0B1F3A" font-weight="700" text-anchor="end" >90%</text><rect x="853" y="498" width="610" height="24" rx="10" fill="#E2E9E9" stroke="#D1DADA" stroke-width="1"/><rect x="853" y="498" width="549.0" height="24" rx="10" fill="#2D7A78" stroke="#2D7A78" stroke-width="1"/><text x="853" y="555" font-size="16" fill="#607286" font-weight="600" text-anchor="start" >Labour productivity</text><text x="1465" y="555" font-size="18" fill="#0B1F3A" font-weight="700" text-anchor="end" >2,250 loaves / baker</text><text x="853" y="594" font-size="15" fill="#20314B" font-weight="400" text-anchor="start" >Average bakers: 12</text><text x="853" y="638" font-size="15" fill="#20314B" font-weight="400" text-anchor="start" >Same workforce; overtime supports higher output</text><rect x="100" y="740" width="1400" height="125" rx="14" fill="#FFF8E5" stroke="#C9A227" stroke-width="2"/><text x="130" y="778" font-size="16" fill="#C9A227" font-weight="700" text-anchor="start" >THE FORMULAS</text><text x="130" y="815" font-size="17" fill="#20314B" font-weight="600" text-anchor="start" >Total cost = fixed cost + (variable cost × output)</text><text x="130" y="847" font-size="16" fill="#20314B" font-weight="400" text-anchor="start" >£18,000 + (£0.45 × output)  •  capacity = 30,000 loaves / month</text><text x="845" y="778" font-size="16" fill="#C64545" font-weight="700" text-anchor="start" >TRADE-OFF</text><text x="845" y="815" font-size="17" fill="#20314B" font-weight="600" text-anchor="start" >Unit cost falls as output spreads fixed cost.</text><text x="845" y="847" font-size="16" fill="#20314B" font-weight="400" text-anchor="start" >At 90% utilisation, little spare capacity remains for rush orders.</text><line x1="60" y1="955" x2="1540" y2="955" stroke="#CCD6D7" stroke-width="2"/><text x="64" y="995" font-size="14" fill="#607286" font-weight="400" text-anchor="start" >Marlbridge • Business study resource • Operational performance • check context before deciding</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>
