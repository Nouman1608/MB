<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc"><title id="title">Stakeholder influence-interest matrix</title><desc id="desc">A two-by-two stakeholder mapping matrix with labeled axes, contextual examples and a reassessment reminder.</desc><rect width="1600" height="1050" fill="#F3F6F6"/><g font-family="Arial, sans-serif" fill="#20314B"><text x="62" y="80" font-size="42" font-weight="700" fill="#0B1F3A">Stakeholder influence-interest matrix</text><text x="64" y="126" font-size="23" fill="#20314B">Core topic figure • board-agnostic teaching visual</text><rect x="60" y="165" width="1480" height="755" rx="18" fill="white" stroke="#CCD6D7" stroke-width="2"/><text x="84" y="205" font-size="24" font-weight="700" fill="#0B1F3A">Stakeholder mapping: influence and interest</text><text x="95" y="250" font-size="22">Use the matrix to prioritise communication; positions vary by decision and context.</text><path d="M340 800 V340 H1270 M805 340 V800 M340 570 H1270" fill="none" stroke="#0B1F3A" stroke-width="4"/><text x="755" y="855" font-size="21" text-anchor="middle">Interest in this decision →</text><text x="230" y="600" font-size="20" transform="rotate(-90 230 600)" text-anchor="middle">Influence / power ↑</text><text x="570" y="385" font-size="20" font-weight="700" text-anchor="middle">KEEP SATISFIED</text><text x="1040" y="385" font-size="20" font-weight="700" text-anchor="middle">MANAGE CLOSELY</text><text x="570" y="615" font-size="20" font-weight="700" text-anchor="middle">MONITOR</text><text x="1040" y="615" font-size="20" font-weight="700" text-anchor="middle">KEEP INFORMED</text><circle cx="600" cy="485" r="9" fill="#2D7A78"/><text x="618" y="492" font-size="19">Regulator</text><circle cx="1000" cy="485" r="9" fill="#2D7A78"/><text x="1018" y="492" font-size="19">Key lender</text><circle cx="520" cy="700" r="9" fill="#2D7A78"/><text x="538" y="707" font-size="19">Distant community</text><circle cx="1080" cy="700" r="9" fill="#2D7A78"/><text x="1098" y="707" font-size="19">Employees</text><text x="360" y="825" font-size="17">LOW</text><text x="1230" y="825" font-size="17">HIGH</text><text x="305" y="365" font-size="16" text-anchor="end">HIGH</text><text x="305" y="795" font-size="16" text-anchor="end">LOW</text><rect x="1330" y="380" width="160" height="300" rx="14" fill="#E7EFED"/><text x="1350" y="420" font-size="17" font-weight="700">Decision check</text><text x="1350" y="460" font-size="16">Who can affect</text><text x="1350" y="485" font-size="16">the outcome?</text><text x="1350" y="535" font-size="16">Who is affected</text><text x="1350" y="560" font-size="16">by it?</text><text x="1350" y="610" font-size="16">Reassess as</text><text x="1350" y="635" font-size="16">conditions change.</text><line x1="60" y1="972" x2="1540" y2="972" stroke="#CCD6D7" stroke-width="2"/><text x="64" y="1017" font-size="18" fill="#526273">Marlbridge • study diagram • examples are schematic</text><image href="data:image/svg+xml;base64," x="1330" y="982" width="210" height="52" preserveAspectRatio="xMidYMid meet"/></g></svg>
